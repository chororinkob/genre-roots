<script type="application/ld+json">{"@context": "https://schema.org", "@type": "FAQPage", "mainEntity": [{"@type": "Question", "name": "この曲は何ジャンル？曲名から調べるには？", "acceptedAnswer": {"@type": "Answer", "text": "曲名と歌手名を入れて「ジャンルを調べる」を押すだけです。答えは、595ジャンルのルーツ地図の上に、そのジャンルの特徴・成り立ち・代表曲と一緒に表示されます。曲名が分からないときは「曲を聴かせて調べる」を使ってください。"}}, {"@type": "Question", "name": "ほかのサイトとジャンルの答えが違うのはなぜ？", "acceptedAnswer": {"@type": "Answer", "text": "日本の曲は、世間では「歌手ごと」にジャンルを決めることが多く、演歌歌手が歌えば何でも演歌とされがちです。音楽ジャンルルーツ辞典は「曲ごと」に、その曲そのものの曲調・メロディーで判定しています。たとえば石川さゆり「天城越え」は、曲調として演歌ではないため歌謡曲としています。"}}, {"@type": "Question", "name": "演歌と歌謡曲とムード歌謡の違いは？", "acceptedAnswer": {"@type": "Answer", "text": "演歌は、浪曲や民謡につながる演歌特有の節回し・メロディーで決まります。こぶしは歌い手の癖なので、それだけでは演歌になりません。ムード歌謡は、夜・酒・都会・大人の恋を歌う昭和のしっとりした曲です。それ以外の昭和の流行歌が歌謡曲です。"}}]}</script>
<style>

<body>
<div class="wrap">
<header><a href="/genre_roots.html">音楽ジャンルルーツ辞典</a></header>
<p class="eyebrow">SONG TO GENRE</p>
<h1>この曲なんてジャンル？<br>曲のジャンルを調べる</h1>
<p class="lede">曲名でも歌手名でも、うろ覚えでも、ひらがなでも大丈夫。打つと候補が出るので、曲を選ぶだけ。答えは、595ジャンルのルーツ地図の上に出ます。</p>

<div class="tabs">
  <a class="tab on" href="song_name.html">✏️ 曲名で調べる</a>
  <a class="tab" href="/song.html">🎵 曲を聴かせて調べる</a>
</div>
<form id="f">
  <label for="q">曲名・歌手名</label><input id="q" type="search" autocomplete="off" placeholder="例：Lemon　または　米津玄師">
  <input id="t" type="hidden"><input id="a" type="hidden">
  <button type="submit">探す</button>
  <div class="ex">試す：<a href="#">Lemon</a><a href="#">米津</a><a href="#">こころこおらせて</a><a href="#">北酒場</a><a href="#">Nirvana</a></div>
  <div id="st"></div>
  <div id="out"></div>
  <div id="msg"></div>
</form>
</div>
<script src="/proto/song_core.js"></script>
<script>
// 送信：候補から曲を選んだ（t が入っている）ときだけジャンルを調べる。入っていなければ候補を探す。
// 調べる処理そのものは共通部品（song_core.js の GRSong.judge）。地図のマイクパネルも同じものを使う。
var VIA0 = new URLSearchParams(location.search).get('via') || '';
document.getElementById('f').onsubmit = function(e){
  e.preventDefault();
  if (!document.getElementById('t').value.trim()) { srRun(document.getElementById('q').value); return; }
  var t = document.getElementById('t').value.trim(), a = document.getElementById('a').value.trim();
  var m = document.getElementById('msg'); m.className = ''; m.textContent = '「' + t + '」のジャンルを調べています…';
  GRSong.judge(t, a, function(x){ m.textContent = x; }).then(function(r){
    if (!r.ok) { m.className = 'ng'; m.textContent = r.msg; return; }
    if (VIA0) r.p.via = VIA0;
    location.href = '/proto/answer.html?' + new URLSearchParams(r.p);
  });
};
// 【2026-11-07】マイク（mic.html）で聴き取った曲名・歌手名を受け取ったときは、入力欄に入れて自動で調べ始める。
// via=mic を答えのページまで引き継ぎ、「マイクで聴き取った曲」と分かるようにする。
var P0 = new URLSearchParams(location.search), VIA = P0.get('via') || '';
if (P0.get('t') && P0.get('auto') === '1') {
  document.getElementById('t').value = P0.get('t');
  document.getElementById('a').value = P0.get('a') || '';
  document.getElementById('q').value = P0.get('t') + (P0.get('a') ? ' ' + P0.get('a') : '');
  var tries = 0;
  (function go(){
    GRSong.ready.then(function(){ document.getElementById('f').requestSubmit(); });
  })();
}
</script>
<script>
// ───────── 【2026-11-07】あいまい検索（【2026-11-08】処理は共通部品 song_core.js に移した。地図のマイクパネルと同じもの） ─────────
// 欄は1つ。曲名でも歌手名でも、ひらがなでも、1文字違いでもよい。打ち終わって0.6秒待ってから探す。
var st = document.getElementById('st'), out = document.getElementById('out'), qEl = document.getElementById('q'), timer = null;
function onSong(t, a){
  document.getElementById('t').value = t; document.getElementById('a').value = a;
  out.innerHTML = ''; st.textContent = '';
  document.getElementById('f').requestSubmit();
}
function srRun(q){ GRSong.search(q, out, st, onSong); }
qEl.addEventListener('input', function(){
  document.getElementById('t').value = ''; document.getElementById('a').value = ''; document.getElementById('msg').textContent = '';
  clearTimeout(timer); timer = setTimeout(function(){ srRun(qEl.value); }, 600);
});
document.querySelectorAll('.ex a').forEach(function(x){ x.onclick = function(e){ e.preventDefault(); qEl.value = x.textContent; document.getElementById('t').value = ''; srRun(qEl.value); }; });
// 地図から来たとき（?q=）は、入れた言葉で候補を出す
if (P0.get('q') && !P0.get('t')) { qEl.value = P0.get('q'); srRun(qEl.value); }
</script>
</body>
