name: Auto Version Bump

on:
  push:
    branches: [main]
    paths:
      - 'genre_roots.html'

permissions:
  contents: write

jobs:
  version-bump:
    # github-actions bot 自身がプッシュした場合はスキップ（無限ループ防止）。
    # また、ジャンル追加・修正依頼の反映（genre_adder.py経由、コミット
    # メッセージに[skip-version-bump]の目印が入る）もスキップする。
    # バージョン番号はコード変更の回数を表すものであり、データ変更では
    # 上げない方針のため（2026-07-22合意）。
    if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[skip-version-bump]')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # デフォルトのfetch-depth:1（浅いクローン）だとHEAD~1（1つ前のコミット）
          # を取得できず、bump_version.py側の「既にバージョンが上がっているか」の
          # 比較チェックが常にNone（比較不能）扱いになって二重更新を防げなかった。
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bump version and update date
        run: python bump_version.py

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add genre_roots.html
          if git diff --cached --quiet; then
            echo "バージョン変更なし。スキップ。"
          else
            git commit -m "auto: バージョン更新 $(date +'%Y-%m-%d')"
            git push
            echo "✓ バージョンをpushしました"
          fi
