name: Auto Version Bump

on:
  push:
    branches: [main]
    paths:
      - 'genre_roots.html'

permissions:
  contents: write

jobs:
  version-bump:
    # github-actions bot 自身がプッシュした場合はスキップ（無限ループ防止）
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # デフォルトのfetch-depth:1（浅いクローン）だとHEAD~1（1つ前のコミット）
          # を取得できず、bump_version.py側の「既にバージョンが上がっているか」の
          # 比較チェックが常にNone（比較不能）扱いになって二重更新を防げなかった。
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bump version and update date
        run: python bump_version.py

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add genre_roots.html
          if git diff --cached --quiet; then
            echo "バージョン変更なし。スキップ。"
          else
            git commit -m "auto: バージョン更新 $(date +'%Y-%m-%d')"
            git push
            echo "✓ バージョンをpushしました"
          fi
