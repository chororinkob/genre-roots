name: Monthly YouTube Link Check

# 【2026-11-04 停止】毎月1日の自動実行を止めた。
# この古い点検は「本命も予備も見られない代表曲を曲ごと消す」作りで、10月に9曲・11月に8曲を消していた。
# チョロさんの決定で、パソコン起動時に動く新しい点検（claudeTMP/monthly_video_check/monthly_video_check.py）に移した。
# 新しい点検は、消さずに「同じ曲の別の動画→ふさわしい別の曲」に差し替え、メイン動画と知名度も直す。
# 手動の実行ボタンだけ残しているが、押すと古い規則で動くので押さないこと。
on:
  workflow_dispatch:        # 手動実行ボタン（古い規則のまま。使わない）

permissions:
  contents: write           # HTMLを更新してpushするために必要

jobs:
  check-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install yt-dlp
        run: pip install yt-dlp

      - name: Run YouTube link check
        run: python check_and_update.py

      - name: Commit and push if updated
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add genre_roots.html fallback_report.json
          if git diff --cached --quiet; then
            echo "変更なし。コミットをスキップ。"
          else
            MSG=$(python -c "import json,io;print(json.load(io.open('fallback_report.json',encoding='utf-8'))['コミットの題名'])")
            git commit -m "$MSG"
            git push
            echo "✓ 更新をpushしました"
          fi
