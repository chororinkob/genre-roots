<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>（試作）この曲は何ジャンル？ — 音楽ジャンルルーツ辞典</title>
<style>
html,body{margin:0;padding:0;height:100%;background:#1a1a2e;overflow:hidden}
#app{position:fixed;inset:0;width:100%;height:100vh;height:100dvh;border:0}
</style>
</head>
<body>
<iframe id="app" title="音楽ジャンルルーツ辞典" allow="autoplay; fullscreen; encrypted-media; picture-in-picture" allowfullscreen></iframe>
<script>
// 試作（2026-11-05 3版。2版は2026-11-04）：?t=曲名&a=歌手名&g=辞典のジャンル番号&src=wikidata|ai&wg=Wikidataのジャンル名
// 答えは、地図の「説明パネル」の中、動画のすぐ上に1枚の帯として差し込む（地図の上に別の窓を重ねない）。
// 検索した曲がそのジャンルの代表曲にあれば、その曲を再生する。
// 地図本体（genre_roots.html）は変えず、同じサイトの枠（iframe）の中に外から差し込んでいる。
var P = new URLSearchParams(location.search);
var t = P.get('t') || 'Lemon', a = P.get('a') || '米津玄師', g = P.get('g') || 'jpop';
var src = P.get('src') || 'wikidata', wg = P.get('wg') || 'J-pop';
document.title = '（試作）' + t + '（' + a + '）は何ジャンル？ — 音楽ジャンルルーツ辞典';
var F = document.getElementById('app');
F.src = '/genre_roots.html?genre=' + encodeURIComponent(g);

var CSS = [
  '#gr-ans{margin:0 0 10px;padding:10px 12px 9px;border:1px solid rgba(126,184,247,.35);border-radius:10px;',
  '  background:linear-gradient(180deg,rgba(126,184,247,.13),rgba(126,184,247,.05)),#1d1d36;line-height:1.6;font-size:13px;color:#e8e8f0}',
  '#gr-ans .r1{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}',
  '#gr-ans .eye{font-size:10.5px;letter-spacing:.14em;color:#d8b25e;white-space:nowrap}',
  '#gr-ans .proto{font-size:10px;font-weight:700;color:#1a1206;background:#f0b429;border-radius:4px;padding:0 6px}',
  '#gr-ans .q{font-size:14.5px;font-weight:700;margin-top:2px}',
  '#gr-ans .q b{color:#7eb8f7}',
  '#gr-ans .why{font-size:11.5px;color:#a0a0b8;margin-top:2px}',
  '#gr-ans .now{font-size:12.5px;margin-top:4px}',
  '#gr-ans .more{font-size:12px;margin-top:4px;color:#a0a0b8}',
  '#gr-ans a{color:#7eb8f7}',
  '.yt-music-link.gr-hit{outline:2px solid #7eb8f7;outline-offset:1px;border-radius:4px}'
].join('\n');

// 【2026-11-05】多数決の内訳（v=辞典:enka|MusicBrainz:mood_kayo|Wikidata:none|iTunes:enka|Deezer:nogenre）を文章にする。
// 割れたときは「どこが何と言ったか」と、辞典がどれに決めたかを書く（チョロさんの決定）。
function voteText(){
  var nm = function(id){ return disp(id); };
  var said = [], none = [], cnt = {};
  (P.get('v') || '').split('|').forEach(function(p){
    var k = p.split(':'), s = k[0], v = k[1]; if (!s) return;
    if (v === 'none' || v === 'err' || v === 'nogenre') none.push(s);
    else { said.push({s: s, v: v}); cnt[v] = (cnt[v] || 0) + 1; }
  });
  // 【2026-11-05 チョロさんの指示】本番でも通用する書き方にする：
  //  ・「辞典」だけでは伝わらないので正式な名前で書く ・テスト向けの括弧の補足（同票の決め方・票数）は書かない
  //  ・この辞典は代表曲しか持たないのが当たり前なので、「分からなかった所」に辞典は入れない（外の取り先だけ書く）
  var label = function(s){ return s === '辞典' ? '音楽ジャンルルーツ辞典の代表曲' : s; };
  none = none.filter(function(s){ return s !== '辞典'; });
  var kinds = Object.keys(cnt), out;
  if (kinds.length === 1) {
    out = '根拠：' + said.map(function(x){return esc(label(x.s))}).join('・') + ' の' + said.length + 'か所がそろって「' + esc(nm(said[0].v)) + '」';
  } else {
    out = said.map(function(x){ return esc(label(x.s)) + 'が「' + esc(nm(x.v)) + '」'; }).join('、') + 'と分かれました。' +
          'この音楽ジャンルルーツ辞典は「' + esc(nm(g)) + '」と判定します。';
  }
  if (none.length) out += '<br>ジャンルが分からなかった所：' + none.map(esc).join('・');
  return out;
}
// 日本のジャンルは漢字で出す（チョロさんの指示 2026-11-05：演歌・歌謡曲・ムード歌謡）
var JA = {enka: '演歌', kayokyoku: '歌謡曲', mood_kayo: 'ムード歌謡'};
function disp(id){ if (JA[id]) return JA[id]; var n = (G || []).find(function(x){return x.id === id}); return n ? n.name : id; }
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function norm(s){return String(s||'').toLowerCase().replace(/[\s\-_'’.&・()（）「」]/g,'')}

var G = null;
fetch('genres.json').then(function(r){return r.json()}).then(function(x){G = x});

var tries = 0;
var timer = setInterval(function(){
  if (++tries > 120) { clearInterval(timer); return; }          // 60秒であきらめる
  var d; try { d = F.contentDocument; } catch(e) { return; }
  if (!d || !G) return;
  var nd = F.contentWindow._currentNode;
  var body = d.getElementById('sp-body');
  if (!nd || nd.id !== g || !body || !d.querySelector('.yt-music-link')) return;
  clearInterval(timer);
  put(d, nd, body);
}, 500);

function put(d, nd, body){
  if (!d.getElementById('gr-ans-css')) { var st = d.createElement('style'); st.id = 'gr-ans-css'; st.textContent = CSS; d.head.appendChild(st); }
  var n = G.find(function(x){return x.id === g}) || {name: g};
  // 検索した曲が代表曲にあるか（曲名の頭が合うもの）
  var i = (nd.rep_tracks || []).findIndex(function(x){ return norm(x).indexOf(norm(t)) === 0; });
  var box = d.createElement('div'); box.id = 'gr-ans';
  box.innerHTML =
    '<div class="r1"><span class="eye">曲名で調べた結果</span><span class="proto">試作</span></div>' +
    '<div class="q">「' + esc(t) + '」（' + esc(a) + '）は <b>' + esc(disp(g)) + '</b></div>' +
    '<div class="why">' + (src === 'db' ? '根拠：音楽ジャンルルーツ辞典の判定。日本の曲は、世間では「歌手ごと」にジャンルを決めることが多いのですが、この辞典は<b>曲ごと</b>に、その曲そのものの曲調・メロディーで判定しています。' +
      // 演歌歌手の曲を歌謡曲・ムード歌謡と答えるときの注意書き（チョロさんの指示 2026-11-06）
      (P.get('en') === '1' ? '<br>※一般には演歌と呼ばれることもある曲です。この辞典は、演歌歌手が歌っているから演歌、とはしていません。曲調として演歌ではないため「' + esc(disp(g)) + '」としています。' : '')
      : src === 'vote' ? voteText() : src === 'wikidata' ? '根拠：ウィキデータ（ウィキペディアの姉妹サイト。曲や歌手の情報を集めたデータベース）に「' + esc(wg) + '」と登録' : '根拠：AIが曲名・歌手名から判定（人の確認ではありません）') + '</div>' +
    '<div class="now">' + (i >= 0 ? '▶ 下の代表曲の<b>' + (i + 1) + '曲目</b>にあります。動画をその曲に切り替えました（鳴らないときは ▶ を押してください）。'
                                   : '下の代表曲で、同じ ' + esc(disp(g)) + ' の曲を聴けます。') + '</div>' +
    '<div class="more">この下で ' + esc(disp(g)) + ' の特徴と成り立ち、地図の線で「どの音楽から生まれたか」をたどれます。 ' +
    '<a href="song_name.html" target="_top">ほかの曲も調べる →</a></div>';
  var w = d.getElementById('sp-yt-wrap');
  body.insertBefore(box, w && w.parentNode === body ? w : body.firstChild);
  if (i >= 0) {
    var link = d.querySelector('.yt-music-link[data-track-idx="' + i + '"]');
    if (link) link.classList.add('gr-hit');
    playHit(d, i);
  }
}

// 【3版 2026-11-05】検索した曲の動画に、確実に切り替える。
// 2版は代表曲の行を「押して」いた。地図は、動画の枠がもう用意されていると、枠はそのままで
// 中身だけ差し替える（loadVideoById）。メイン動画（Lemon）の枠が読み込み途中だと、その頼みが
// 届かずに捨てられ、Lemon が流れたままになった（チョロさんの画面で発生。回線を少し遅くすると再現）。
// そこで、押すのではなく、地図の再生の入口（playByVideoId）に「押されていない」として渡し、
// 枠ごと入れ替えてもらう。
// ただし、メイン動画の枠がまだ読み込み中のうちに住所を書き換えると、ブラウザが書き換えを捨てて、
// 読み込み中だった Lemon をそのまま出すことがある（住所の欄は「夜に駆ける」なのに中身は Lemon。
// 回線を少し遅くして再現し、1秒ごとの記録で確かめた）。そこで、枠の読み込みが終わった合図（load）を
// 最初の1回だけ待ち、そこでもう一度入れ替える。読み込みが終わった枠への書き換えは捨てられない。
// 利用者が自分で何かを押したら、それ以上は触らない。
function playHit(d, i) {
  var w = F.contentWindow;
  var row = ((w._currentNode && w._currentNode.yt_tracks) || [])[i];
  if (!row || !row[0] || typeof w.playByVideoId !== 'function') return;
  var want = row[0], stop = false;
  d.addEventListener('click', function(e){ if (e.isTrusted) stop = true; }, true);
  var go = function(){ if (!stop) w.playByVideoId(want, row[1] || '', i, false); };
  var pl = d.getElementById('sp-yt-player');
  if (pl) pl.addEventListener('load', function(){ go(); }, { once: true });
  go();
}
</script>
</body>
</html>
