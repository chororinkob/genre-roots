<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>（試作）この曲は何ジャンル？ — 音楽ジャンルルーツ辞典</title>
<style>
html,body{margin:0;padding:0;height:100%;background:#1a1a2e;overflow:hidden}
#app{position:fixed;inset:0;width:100%;height:100vh;height:100dvh;border:0}
</style>
</head>
<body>
<iframe id="app" title="音楽ジャンルルーツ辞典" allow="autoplay; fullscreen; encrypted-media; picture-in-picture" allowfullscreen></iframe>
<script>
// 試作（2026-11-04 2版）：?t=曲名&a=歌手名&g=辞典のジャンル番号&src=wikidata|ai&wg=Wikidataのジャンル名
// 答えは、地図の「説明パネル」の中、動画のすぐ上に1枚の帯として差し込む（地図の上に別の窓を重ねない）。
// 検索した曲がそのジャンルの代表曲にあれば、その曲を再生する。
// 地図本体（genre_roots.html）は変えず、同じサイトの枠（iframe）の中に外から差し込んでいる。
var P = new URLSearchParams(location.search);
var t = P.get('t') || 'Lemon', a = P.get('a') || '米津玄師', g = P.get('g') || 'jpop';
var src = P.get('src') || 'wikidata', wg = P.get('wg') || 'J-pop';
document.title = '（試作）' + t + '（' + a + '）は何ジャンル？ — 音楽ジャンルルーツ辞典';
var F = document.getElementById('app');
F.src = '/genre_roots.html?genre=' + encodeURIComponent(g);

var CSS = [
  '#gr-ans{margin:0 0 10px;padding:10px 12px 9px;border:1px solid rgba(126,184,247,.35);border-radius:10px;',
  '  background:linear-gradient(180deg,rgba(126,184,247,.13),rgba(126,184,247,.05)),#1d1d36;line-height:1.6;font-size:13px;color:#e8e8f0}',
  '#gr-ans .r1{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}',
  '#gr-ans .eye{font-size:10.5px;letter-spacing:.14em;color:#d8b25e;white-space:nowrap}',
  '#gr-ans .proto{font-size:10px;font-weight:700;color:#1a1206;background:#f0b429;border-radius:4px;padding:0 6px}',
  '#gr-ans .q{font-size:14.5px;font-weight:700;margin-top:2px}',
  '#gr-ans .q b{color:#7eb8f7}',
  '#gr-ans .why{font-size:11.5px;color:#a0a0b8;margin-top:2px}',
  '#gr-ans .now{font-size:12.5px;margin-top:4px}',
  '#gr-ans .more{font-size:12px;margin-top:4px;color:#a0a0b8}',
  '#gr-ans a{color:#7eb8f7}',
  '.yt-music-link.gr-hit{outline:2px solid #7eb8f7;outline-offset:1px;border-radius:4px}'
].join('\n');

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function norm(s){return String(s||'').toLowerCase().replace(/[\s\-_'’.&・()（）「」]/g,'')}

var G = null;
fetch('genres.json').then(function(r){return r.json()}).then(function(x){G = x});

var tries = 0;
var timer = setInterval(function(){
  if (++tries > 120) { clearInterval(timer); return; }          // 60秒であきらめる
  var d; try { d = F.contentDocument; } catch(e) { return; }
  if (!d || !G) return;
  var nd = F.contentWindow._currentNode;
  var body = d.getElementById('sp-body');
  if (!nd || nd.id !== g || !body || !d.querySelector('.yt-music-link')) return;
  clearInterval(timer);
  put(d, nd, body);
}, 500);

function put(d, nd, body){
  if (!d.getElementById('gr-ans-css')) { var st = d.createElement('style'); st.id = 'gr-ans-css'; st.textContent = CSS; d.head.appendChild(st); }
  var n = G.find(function(x){return x.id === g}) || {name: g};
  // 検索した曲が代表曲にあるか（曲名の頭が合うもの）
  var i = (nd.rep_tracks || []).findIndex(function(x){ return norm(x).indexOf(norm(t)) === 0; });
  var box = d.createElement('div'); box.id = 'gr-ans';
  box.innerHTML =
    '<div class="r1"><span class="eye">曲名で調べた結果</span><span class="proto">試作</span></div>' +
    '<div class="q">「' + esc(t) + '」（' + esc(a) + '）は <b>' + esc(n.name) + '</b></div>' +
    '<div class="why">' + (src === 'wikidata' ? '根拠：Wikidata（人が確認した音楽データ）に「' + esc(wg) + '」と登録' : '根拠：AIが曲名・歌手名から判定（人の確認ではありません）') + '</div>' +
    '<div class="now">' + (i >= 0 ? '▶ 下の代表曲の<b>' + (i + 1) + '曲目</b>にあります。動画をその曲に切り替えました（鳴らないときは ▶ を押してください）。'
                                   : '下の代表曲で、同じ ' + esc(n.name) + ' の曲を聴けます。') + '</div>' +
    '<div class="more">この下で ' + esc(n.name) + ' の特徴と成り立ち、地図の線で「どの音楽から生まれたか」をたどれます。 ' +
    '<a href="song_name.html" target="_top">ほかの曲も調べる →</a></div>';
  var w = d.getElementById('sp-yt-wrap');
  body.insertBefore(box, w && w.parentNode === body ? w : body.firstChild);
  if (i >= 0) {
    var link = d.querySelector('.yt-music-link[data-track-idx="' + i + '"]');
    if (link) { link.classList.add('gr-hit'); link.click(); }
  }
}
</script>
</body>
</html>
