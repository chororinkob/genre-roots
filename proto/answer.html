<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>この曲は何ジャンル？ — 音楽ジャンルルーツ辞典</title>
<style>
html,body{margin:0;padding:0;height:100%;background:#1a1a2e;overflow:hidden}
#app{position:fixed;inset:0;width:100%;height:100vh;height:100dvh;border:0}
</style>
</head>
<body>
<iframe id="app" title="音楽ジャンルルーツ辞典" allow="autoplay; fullscreen; encrypted-media; picture-in-picture" allowfullscreen></iframe>
<script src="/proto/answer_band.js"></script>
<script>
// 答えのページ：?t=曲名&a=歌手名&g=ジャンル番号&src=db|rep|vote|artist&v=…&by=…&en=1&via=mic
// 地図（genre_roots.html）をそのまま枠（iframe）で開き、説明パネルの上に答えの帯を差し込む。
// 【2026-11-08】帯の中身・動画の探し方・流し方は共通部品（answer_band.js の GRBand.put）に移した。地図のマイクパネルから調べたときも同じものを使う。
var P = new URLSearchParams(location.search);
var p = {}; ['t', 'a', 'g', 'src', 'v', 'by', 'en', 'via'].forEach(function(k){ if (P.get(k)) p[k] = P.get(k); });
p.t = p.t || 'Lemon'; p.a = p.a || '米津玄師'; p.g = p.g || 'jpop'; p.src = p.src || 'wikidata';
document.title = p.t + '（' + p.a + '）は何ジャンル？ — 音楽ジャンルルーツ辞典';
var F = document.getElementById('app');
F.addEventListener('load', function(){ GRBand.put(F.contentWindow, p); }, { once: true });
F.src = '/genre_roots.html?genre=' + encodeURIComponent(p.g);
</script>
</body>
</html>
