<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>（試作）折りたたみ — 音楽ジャンルルーツ辞典</title>
<style>
html,body{margin:0;padding:0;height:100%;background:#1a1a2e;overflow:hidden}
#app{position:fixed;inset:0;width:100%;height:100vh;height:100dvh;border:0}
</style>
</head>
<body>
<iframe id="app" title="音楽ジャンルルーツ辞典"></iframe>
<script>
// 【試作 2026-11-07】ウィキペディアのような折りたたみ（チョロさんの依頼）。地図本体（genre_roots.html）は変えず、
// 同じサイトの枠の中に外から見た目と動きを差し込んで、全体のイメージを見てもらうためのもの。
// ・左：「カテゴリ」の見出しを押すと、カテゴリーの一覧ごと開く・閉じる。最初は閉じている。
// ・右：ジャンル名・別名・発祥時期・動画はそのまま。その下の
//   代表曲・音楽性・成り立ち・影響を受けた／与えた／影響し合ったジャンル を、最初は閉じておく。
//   見出しに数（17曲・5ジャンルなど）を添えて、閉じていても中身の量が分かるようにする。
var P = new URLSearchParams(location.search);
var F = document.getElementById('app');
F.src = '/genre_roots.html?genre=' + encodeURIComponent(P.get('g') || 'jpop');
var CSS = [
  // 見出しの帯（左のカテゴリ・右の6つで共通）：押せることが分かるよう、少し明るい帯にして右端に「開く ▾／閉じる ▴」
  '.fold-h{cursor:pointer;user-select:none;display:flex !important;align-items:center;gap:6px;margin:0 !important;padding:10px 12px !important;',
  '  background:linear-gradient(180deg,#36365c,#2a2a48) !important;border:0 !important;border-radius:0;font-size:13px !important;letter-spacing:.3px;color:#fff !important;text-transform:none !important}',
  '.fold-h:hover{background:linear-gradient(180deg,#42426e,#323256) !important}',
  '.fold-h:focus-visible{outline:2px solid #7eb8f7;outline-offset:-2px}',
  '.fold-mark{display:inline-block;width:1em;font-size:.8em;color:#7eb8f7;transition:transform .2s}',
  '.fold-open > .fold-h .fold-mark{transform:rotate(90deg)}',
  '.fold-n{font-weight:400;color:#a8a8c4;font-size:.9em}',
  '.fold-act{margin-left:auto;font-size:11px;font-weight:400;color:#9fc3f5;white-space:nowrap}',
  '.fold-act::after{content:"開く ▾"}',
  '.fold-open > .fold-h .fold-act::after{content:"閉じる ▴"}',
  // 箱（共通）
  '#side-panel .sp-section.fold,#legend.fold-box{background:rgba(255,255,255,.035) !important;border:1px solid rgba(255,255,255,.15) !important;border-radius:9px !important;padding:0 !important;margin:0 0 8px !important;overflow:hidden}',
  '#side-panel .sp-section.fold.fold-open{padding-bottom:12px !important}',
  '#side-panel .sp-section.fold.fold-open > :not(h4){margin-left:12px;margin-right:12px}',
  '#side-panel .sp-section.fold.fold-open > h4 + *{margin-top:10px}',
  '#side-panel .sp-section.fold.fold-open > .fold-h{border-bottom:1px solid rgba(255,255,255,.12) !important}',
  '#side-panel .sp-section.fold:not(.fold-open) > :not(h4){display:none !important}',
  // もとの枠（代表曲の囲み・影響の3つをまとめる囲み・区切り線）は外して、6つとも同じ箱にそろえる
  '#side-panel .sp-influence-group{border:0 !important;padding:0 !important;margin:0 !important}',
  '#side-panel .sp-explain-divider{display:none !important}',
  '#side-panel #sp-yt-wrap{margin-bottom:10px !important}',
  // 左のカテゴリ
  '#legend.fold-box{margin:0 !important}',
  '#legend.fold-box.fold-open{padding-bottom:8px !important}',
  '#legend.fold-box.fold-open > :not(h3){margin-left:10px;margin-right:10px}',
  '#legend.fold-box.fold-open > h3{margin-bottom:8px !important}',
  '#legend:not(.fold-open) .legend-item,#legend:not(.fold-open) .legend-sep,#legend:not(.fold-open) .cat-accordion{display:none !important}'
].join('\n');
var SECS = ['sp-tracks-sec', 'sp-desc-sec', 'sp-roots-story-sec', 'sp-in-sec', 'sp-out-sec', 'sp-mutual-sec'];
function setup(d){
  if (d.getElementById('fold-css')) return;
  var st = d.createElement('style'); st.id = 'fold-css'; st.textContent = CSS; d.head.appendChild(st);
  var mark = function(){ var m = d.createElement('span'); m.className = 'fold-mark'; m.textContent = '▶'; return m; };
  var act = function(){ var x = d.createElement('span'); x.className = 'fold-act'; return x; };
  var lg = d.getElementById('legend'), h3 = lg.querySelector('h3');
  lg.classList.add('fold-box'); h3.classList.add('fold-h'); h3.prepend(mark()); h3.tabIndex = 0;
  var n = d.createElement('span'); n.className = 'fold-n'; n.textContent = '（' + lg.querySelectorAll('.legend-item').length + '）'; h3.appendChild(n);
  h3.appendChild(act());
  h3.addEventListener('click', function(){ lg.classList.toggle('fold-open'); });
  h3.addEventListener('keydown', function(e){ if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); h3.click(); } });
  // 【パネルを消さない】右の説明パネルを開いているあいだにカテゴリー名を押したら、パネルは閉じず、
  // 中のジャンル一覧を開く・閉じるだけにする（地図のもとの動きは「選んでいるジャンルを解除してパネルを閉じ、
  // そのカテゴリーを地図で光らせる」。チョロさんの試験で「パネルが消えた」と分かった。2026-11-07）。
  // パネルが閉じているときは、もとの動き（カテゴリーを光らせる）のまま。
  lg.addEventListener('click', function(e){
    var it = e.target.closest('.legend-item[data-cat]'); if (!it) return;
    var sp = d.getElementById('side-panel');
    if (!sp || d.defaultView.getComputedStyle(sp).display === 'none') return;
    e.stopPropagation();
    var acc = lg.querySelector('.cat-accordion[data-cat="' + it.dataset.cat + '"]'); if (acc) acc.classList.toggle('open');
  }, true);
  SECS.forEach(function(id){
    var s = d.getElementById(id); if (!s) return;
    var h = s.querySelector('h4'); s.classList.add('fold'); h.classList.add('fold-h'); h.prepend(mark());
    var c = d.createElement('span'); c.className = 'fold-n'; h.appendChild(c); h.appendChild(act()); h.tabIndex = 0;
    h.addEventListener('click', function(){ s.classList.toggle('fold-open'); });
    h.addEventListener('keydown', function(e){ if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); h.click(); } });
  });
  // 見出しの数は、ジャンルが変わるたびに数え直す
  setInterval(function(){
    var cnt = function(sel){ return d.querySelectorAll(sel).length; };
    var txt = function(el){ return ((el && el.textContent) || '').replace(/\s/g, '').length; };
    var put = function(id, s){ var e = d.querySelector('#' + id + ' .fold-n'); if (e && e.textContent !== s) e.textContent = s; };
    put('sp-tracks-sec', '（' + cnt('#sp-tracks .yt-music-link') + '曲）');
    put('sp-desc-sec', '（' + txt(d.getElementById('sp-desc')) + '字）');
    put('sp-roots-story-sec', '（' + txt(d.getElementById('sp-roots-story')) + '字）');
    ['sp-in', 'sp-out', 'sp-mutual'].forEach(function(id){ var b = d.getElementById(id); put(id + '-sec', '（' + (b ? b.children.length : 0) + '）'); });
  }, 400);
}
var tries = 0, timer = setInterval(function(){
  if (++tries > 120) { clearInterval(timer); return; }
  var d; try { d = F.contentDocument; } catch(e) { return; }
  if (!d || !d.getElementById('legend') || !d.getElementById('sp-tracks-sec')) return;
  clearInterval(timer); setup(d);
}, 300);
</script>
</body>
</html>
