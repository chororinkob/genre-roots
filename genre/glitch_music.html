<h1>Glitch（グリッチ）とは</h1>
<p>デジタル機器が起こす誤動作や欠陥を、隠すべき失敗ではなく音楽の素材そのものとして扱う音楽である。用いられるのは、CDの読み取り不良によって生じる断続的な音の飛び、音声データの一部が破損したときに生まれる短い雑音、標本化の限界を超え</p>
<p>デジタル機器が起こす誤動作や欠陥を、隠すべき失敗ではなく音楽の素材そのものとして扱う音楽である。用いられるのは、CDの読み取り不良によって生じる断続的な音の飛び、音声データの一部が破損したときに生まれる短い雑音、標本化の限界を超えた際に発生する折り返し歪み、そして処理が追いつかないときに現れる緩衝の破綻音である。これらは本来、聴き手に届く前に取り除かれるべきものだが、この分野ではそれこそが主役となる。音の単位は極めて短く、数ミリ秒の断片が高速で連なることで、一種の粒状の質感が生まれる。この、砂を撒くような、あるいは静電気のような手触りがこの音楽の特徴である。リズムは存在する場合もあるが、拍が均等に割られることは少なく、断片の密度によって時間感覚が作られる。低音はほとんど用いられないか、極端に純粋な正弦波が置かれる。和声も旋律も後景に退き、代わりに音の高さと密度と空間配置が構成の要素となる。音量の幅は極端で、ほとんど無音の状態と刺すような高音が隣り合う。聴き手は音楽を鑑賞するというより、機械の内部で起きていることを覗き込む位置に置かれる。</p>
<h2>成り立ち</h2><p>先駆として重要なのは日本の刀根康尚である。彼は1980年代半ばから、CDの表面に穴の開いたテープを貼るなどして意図的に読み取りを妨害し、そこから生じる音を作品として提示していた。これは、複製技術の完璧さという触れ込みで登場したCDに対する、批評的な反撃だった。この発想が音楽の潮流として結晶したのは1990年代半ばのドイツである。Markus Poppは Oval という名義で、CDの表面に絵の具を塗り、傷をつけて再生し、そこで生じる断続的な音を素材として作品を構成した。1995年の作品は、破損した音が美しい和音の層として響きうることを示し、この分野の起点となる。同じドイツでは、Stefan Betkeが偶然壊れた濾波器から出る雑音を発見し、Poleという名義でその音を軸に据えた作品を制作した。機材の故障そのものが作家性となるという事態である。オーストリアのChristian Fenneszは、ギターの音をデジタル処理によって崩壊させながら、その向こうに叙情的な旋律を浮かび上がらせるという方向を追求し、2001年の作品で高い評価を得た。日本の池田亮司は、正弦波と極端な高音、そして耳の限界を試す音量差によって、より厳密で理論的な方向を示している。ドイツのCarsten Nicolaiは、視覚芸術と音を同じ原理で扱う実践を続けた。この潮流を可視化したのはフランクフルトのレーベルMille Plateauxで、2000年に発表した編集盤の題名が、この分野を指す言葉として広まった。名称の由来はフランスの哲学書であり、思想的な後ろ盾を伴っていた点もこの分野の特徴である。現在では、この手法は特定の分野に留まらず、ポップスや映画音楽の質感として完全に一般化している。</p>
<h2>代表曲</h2><ul><li>Systemisch（Oval）</li><li>Endless Summer（Fennesz）</li><li>Untitled（Autechre）</li><li>Transform（Alva Noto）</li><li>Dataplex（Ryoji Ikeda）</li></ul>
