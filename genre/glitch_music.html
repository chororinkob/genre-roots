<h1>Glitch（グリッチ）とは</h1>
<p>デジタル機器が起こす誤動作や欠陥を、隠すべき失敗でなく、音楽の素材自体として扱う音楽だ。 素材は、次のような音だ。CDの読み取り不良で起きる、断続的な音飛び。音声データの一部が壊れた時に生まれる短い雑音。音をデジタルに取り込む細か</p>
<p>デジタル機器が起こす誤動作や欠陥を、隠すべき失敗でなく、音楽の素材自体として扱う音楽だ。

素材は、次のような音だ。CDの読み取り不良で起きる、断続的な音飛び。音声データの一部が壊れた時に生まれる短い雑音。音をデジタルに取り込む細かさの限界を超えた時に起きる、折り返しの歪み。そして、処理が追い付かない時に現れる、音の途切れや破綻だ。本来、これらは聴き手に届く前に取り除かれる。だがこの分野では、それこそが主役になる。

一つ一つの音は、非常に短い。ごく短い断片が高速で次々と連なり、粒状の質感が生まれる。砂を撒くような、或いは静電気のような手触りが、この音楽の特徴だ。

リズムの扱いは、作り手によって大きく異なる。低音を削ぎ落とす作り手もいれば、ダブのような低音を軸にする作り手もいる。極端に純粋な正弦波が置かれる場合もある。

和音もメロディーも後ろに退く。代わりに、音の高さと密度、そして音を置く位置が、曲の材料になる。音量の幅は極端で、ほとんど無音の状態と、刺すような高音が隣り合う。

聴き手は、音楽を鑑賞するというより、機械の内部で起きていることを覗き込む立場に置かれる。</p>
<h2>成り立ち</h2><p>先駆けとして重要なのは、日本の刀根康尚である。彼は1980年代半ばから、CDの表面に穴の開いたテープを貼るなどして、わざと読み取りを妨げた。そこから生まれる音を、作品として示していた。彼が始めたきっかけは、CDプレーヤーの誤り訂正の仕組みを突破できるか、という関心だった。これを後から、複製技術の完璧さを売りに登場したCDへの、批評的な行為と読む論者もいる。

この発想が音楽の流れとして形になったのは、1990年代半ばのドイツだ。1991年に結成された、Markus Poppが中心のプロジェクトOvalは、消せるマーカーなどのフェルトペンでCDの面に書き込み、読み取りを乱して再生した。そこで生まれる途切れ途切れの音を素材にして、作品を組み立てた。Ovalの1994年から1995年の作品群『Systemisch』『94 Diskont』は、壊れた音が美しい和音の層として響きうることを示した。これらは、グリッチ初期の代表作と評される。

ただし、飛ぶCDから音楽を作ったのは、Ovalが最初ではない。刀根康尚が、1984年から『傷ついたCD』を使っていた。

一方、故障した機材のノイズという、別の系統の例もある。同じドイツでは、Stefan Betkeが1996年に、偶然壊れた濾波器から出る雑音を見つけた。彼はPoleという名義で、1998年からその音を軸にした作品を作った。機材の故障そのものが、作り手の個性になったのである。

ほかにも、作り手はそれぞれの方向へ進んだ。オーストリアのChristian Fenneszは、ギターの音をデジタル処理で崩しながら、その向こうに叙情的な旋律を浮かび上がらせる方向を追い求めた。そして2001年の作品で、高い評価を得た。日本の池田亮司は、正弦波とノイズ、可聴域の限界に近い周波数を使い、より厳密な方向を示している。ドイツのCarsten Nicolaiは、視覚芸術と音を同じ原理で扱う活動を続けた。

この流れを目に見える形にした存在の一つが、フランクフルトのレーベルMille Plateauxだ。2000年に始まった編集盤シリーズ『Clicks &amp; Cuts』が、この流れの一部を指す「clicks &amp; cuts」という呼び名を広めた。レーベル名のMille Plateauxは、ドゥルーズとガタリの哲学書『千のプラトー』に由来する。思想的な後ろ盾があった点も、この分野の特徴である。

現在では、この手法は特定の分野にとどまらず、ポップスなどにも影響を及ぼしている。2001年には、Björkの『Vespertine』がOvalの音源を用いた。</p>
