<h1>Funk Metal（ファンクメタル）とは</h1>
<p>ファンクのリズムとメタルの歪んだギターを正面から衝突させた音楽。土台になるのはベースで、親指で弦を叩き人差し指で引き抜くスラップ奏法（弦を叩いたりはじいたりする奏法）により、打楽器のような輪郭のはっきりした音を出し、16分音符の細</p>
<p>ファンクのリズムとメタルの歪んだギターを正面から衝突させた音楽。土台になるのはベースで、親指で弦を叩き人差し指で引き抜くスラップ奏法（弦を叩いたりはじいたりする奏法）により、打楽器のような輪郭のはっきりした音を出し、16分音符の細かい隙間を縫って動く。このベースが曲の主役になる場面が多い点が、他のメタルと決定的に違う。ギターは深く歪ませた音で短いリフを刻むが、ロングトーン（長く伸ばす音）ではなく、休符（音の休み）を挟んで細切れに切る奏法が多用され、ワウペダル（足で踏んで音色を変える装置）を踏み込んで音色を大きく変化させる。ドラムはメタルの重い音圧を保ちながら、拍の裏（拍と拍の間）に細かいゴーストノート（弱く叩く装飾音）を詰め、2拍4拍にはっきりしたバックビート（強調する拍）を置く。テンポは中庸のものが多いが、スラッシュ寄りの速い曲も少なくない。和声（コードの響き）は単純で、ペンタトニック（5音音階）の短音階を基礎にした反復が続く。歌唱はラップに近い早口の語りと、絶叫と、伸びやかな歌が同じ曲の中で入れ替わる。歌詞は社会批判、人種、性、そして意図的に馬鹿げた冗談まで幅広い。ライブでは観客が跳ねることが前提で、初期のRed Hot Chili Peppersのように上半身裸で舞台を走り回る演奏者もいた。</p>
<h2>成り立ち</h2><p>土壌は1980年代半ばのアメリカにあった。一方にはJames BrownやSly and the Family Stone、Parliament-Funkadelicの遺産があり、他方にはハードコア・パンクとスラッシュメタルがあった。この二つを最初期に結びつけた一組がロサンゼルスのRed Hot Chili Peppersで、1982年（1983年とする資料もある）に結成された彼らは、Fleaのスラップベースと上半身裸の演奏で注目を集めた。ただし初期はメタルというより過激なファンクだった。決定的だったのは1980年代後半で、ニューヨークのLiving Colourが1988年に『Vivid』を発表する。ギタリストVernon Reidは、黒人の演奏家がロックから排除されている状況に抗議して1985年にBlack Rock Coalitionという団体を設立しており、このバンドはその実践だった。同じ頃、サンフランシスコのFaith No Moreが1989年に『The Real Thing』を発表し、Mike Pattonの多彩な発声で商業的な成功を収めた。サンフランシスコ近郊のエル・ソブランテで1984年に結成されたPrimusはLes Claypoolの異常なベース技巧で独自の位置を占めた。1991年、Red Hot Chili Peppersの『Blood Sugar Sex Magik』が世界的な大成功を収め、この様式は主流になった。しかし翌1992年5月、ギタリストJohn Fruscianteは重圧に耐えられず脱退し、その後数年をヘロイン依存で失っている。ほかにInfectious Grooves、Fishbone、Extreme、Mordredなどがいる。1990年代半ば以降、この手法はRage Against the Machineを経てラップメタルへ、さらにニューメタルへと引き継がれるが、その過程でファンク本来の軽やかさは失われ、より重く鈍い方向に変質した。2000年代以降は独立したジャンルとしてはほぼ語られなくなっている。</p>
<h2>代表曲</h2><ul><li>Can't Stop (Red Hot Chili Peppers)</li><li>Killing in the Name（Rage Against the Machine）</li><li>Give It Away（Red Hot Chili Peppers）</li><li>Cult of Personality（Living Colour）</li><li>Epic (Faith No More)</li><li>My Name Is Mud (Primus)</li><li>Aeroplane (Red Hot Chili Peppers)</li><li>Jerry Was a Race Car Driver（Primus）</li><li>Tommy the Cat (Primus)</li><li>Midlife Crisis (Faith No More)</li><li>Glamour Boys (Living Colour)</li><li>Sunless Saturday (Fishbone)</li></ul>
