<h1>Funk Metal（ファンクメタル）とは</h1>
<p>ファンクのリズムとメタルの歪んだギターを、正面からぶつけ合わせた音楽だ。 土台になるのはベースである。親指で弦を叩き、人差し指で引き抜くスラップ奏法（弦を叩いたりはじいたりする奏法）で、打楽器のように輪郭のはっきりした音を出す。そ</p>
<p>ファンクのリズムとメタルの歪んだギターを、正面からぶつけ合わせた音楽だ。

土台になるのはベースである。親指で弦を叩き、人差し指で引き抜くスラップ奏法（弦を叩いたりはじいたりする奏法）で、打楽器のように輪郭のはっきりした音を出す。その音が16分音符の細かい隙間を縫って動く。従来のメタルよりベースが重視される傾向がある。

ギターは、深く歪ませた音で短いリフを刻む。ファンク由来のシンコペーションが特徴で、ワウペダル（足で踏んで音色を変える装置）を使う例もある。和声（コードの響き）は単純だ。ペンタトニック（5音音階）の短音階を基礎にした反復が続く。

ドラムは、メタルの重い音圧を保っている。そのうえで、拍の裏（拍と拍の間）に細かいゴーストノート（弱く叩く装飾音）を詰める。2拍4拍には、はっきりしたバックビート（強調する拍）を置く。テンポは中庸のものが多いが、バンドによってはスラッシュ寄りの速い曲もある。

歌唱では、ラップに近い早口の語りと絶叫、伸びやかな歌が、同じ曲の中で入れ替わる傾向がある。歌詞は社会批判、人種、性、そして意図的に馬鹿げた冗談まで幅広い。

ライブでは、観客が跳ねることが多い。初期のRed Hot Chili Peppersのように、靴下だけを身に着けた(ほぼ全裸の)演奏で舞台を走り回る演奏者もいた。</p>
<h2>成り立ち</h2><p>土壌は、1980年代半ばのアメリカにあった。一方には、James BrownやSly and the Family Stone、Parliament-Funkadelicが残したファンクがあった。他方には、ハードコア・パンクとスラッシュメタルがあった。

この二つを結びつけた動きは、1980年代半ばにカリフォルニアを中心に形成された。源流は、Mother's Finestの1981年の『Iron Age』にまで遡る。ロサンゼルスのRed Hot Chili Peppersの1984年のデビュー作を、最初のファンクメタル作品と見る向きもある。彼らは1982年（1983年とする資料もある）に結成され、Fleaのスラップベースと、靴下だけを身に着けた(ほぼ全裸の)演奏で注目を集めた。ただし初期は、メタルというより過激なファンクだった。

決定的だったのは1980年代後半である。ニューヨークのLiving Colourが、1988年に『Vivid』を発表した。ギタリストのVernon Reidは、バンドの結成後、黒人の演奏家がロックから排除されている状況に抗議した。そして1985年に、Greg Tate、DK Dyson、Konda MasonらとBlack Rock Coalitionという団体を共同で設立した。

同じ頃、サンフランシスコのFaith No Moreが、1989年に『The Real Thing』を発表する。Mike Pattonの多彩な発声で、商業的な成功を収めた。サンフランシスコ近郊のエル・ソブランテで、1984年に結成されたPrimusは、Les Claypoolの異常なベース技巧で独自の位置を占めた。

1991年、Red Hot Chili Peppersの『Blood Sugar Sex Magik』が世界的な大成功を収め、1990年代初頭に商業的ピークを迎えた。しかし翌1992年5月、ギタリストのJohn Fruscianteは重圧に耐えられず脱退する。その後の数年を、ヘロイン依存で失っている。ほかにInfectious Grooves、Fishbone、Extreme、Mordredなどがいる。

1990年代前半には、Rage Against the Machineらが登場し、ラップメタルが広がった。ファンクメタルとラップメタルは、1980年代末から並行して影響し合った。1990年代後半には、ニューメタルが人気を集める。こうした流れの中で、より重く攻撃的になったとする見方もある。

1990年代末には流行が終わり、以後は主流ではなくなった。しかし、回顧や再評価、新作は続いている。</p>
<h2>代表曲</h2><ul><li>Can't Stop (Red Hot Chili Peppers)</li><li>Killing in the Name（Rage Against the Machine）</li><li>Give It Away（Red Hot Chili Peppers）</li><li>Cult of Personality（Living Colour）</li><li>Epic (Faith No More)</li><li>My Name Is Mud (Primus)</li><li>Aeroplane (Red Hot Chili Peppers)</li><li>Jerry Was a Race Car Driver（Primus）</li><li>Tommy the Cat (Primus)</li><li>Midlife Crisis (Faith No More)</li><li>Glamour Boys (Living Colour)</li><li>Sunless Saturday (Fishbone)</li></ul>
