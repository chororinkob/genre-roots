<h1>Funk Metal（ファンクメタル）とは</h1>
<p>ファンクのリズムとメタルの歪んだギターを正面から衝突させた音楽。土台になるのはベースで、親指で弦を叩き人差し指で引き抜くスラップ奏法により、打楽器のような輪郭のはっきりした音を出し、16分音符の細かい隙間を縫って動く。このベースが</p>
<p>ファンクのリズムとメタルの歪んだギターを正面から衝突させた音楽。土台になるのはベースで、親指で弦を叩き人差し指で引き抜くスラップ奏法により、打楽器のような輪郭のはっきりした音を出し、16分音符の細かい隙間を縫って動く。このベースが曲の主役になる場面が多い点が、他のメタルと決定的に違う。ギターは深く歪ませた音で短いリフを刻むが、ロングトーンではなく、休符を挟んで細切れに切る奏法が多用され、ワウペダルを踏み込んで音色を大きく変化させる。ドラムはメタルの重い音圧を保ちながら、拍の裏に細かいゴーストノートを詰め、二拍四拍にはっきりしたバックビートを置く。テンポは毎分90から120拍程度が中心で、疾走ではなくグルーヴを重視する。和声は単純で、ペンタトニックの短音階を基礎にした反復が続く。歌唱はラップに近い早口の語りと、絶叫と、伸びやかな歌が同じ曲の中で入れ替わる。歌詞は社会批判、人種、性、そして意図的に馬鹿げた冗談まで幅広い。ライブでは観客が跳ねることが前提で、上半身裸の演奏者が舞台を走り回るという光景が定型になっている。</p>
<h2>成り立ち</h2><p>土壌は1980年代半ばのアメリカにあった。一方にはJames BrownやSly and the Family Stone、Parliament-Funkadelicの遺産があり、他方にはハードコア・パンクとスラッシュメタルがあった。この二つを最初に本格的に結びつけたのがロサンゼルスのRed Hot Chili Peppersで、1983年に結成された彼らは、Fleaのスラップベースと上半身裸の演奏で注目を集めた。ただし初期はメタルというより過激なファンクだった。決定的だったのは1980年代後半で、ニューヨークのLiving Colourが1988年に『Vivid』を発表する。ギタリストVernon Reidは、黒人の演奏家がロックから排除されている状況に抗議して1985年にBlack Rock Coalitionという団体を設立しており、このバンドはその実践だった。同じ頃、サンフランシスコのFaith No Moreが1989年に『The Real Thing』を発表し、Mike Pattonの多彩な発声で商業的な成功を収めた。同じ街のPrimusはLes Claypoolの異常なベース技巧で独自の位置を占めた。1991年、Red Hot Chili Peppersの『Blood Sugar Sex Magik』が世界的な大成功を収め、この様式は主流になった。しかし同年、ギタリストJohn Fruscianteは重圧に耐えられず脱退し、その後数年をヘロイン依存で失っている。ほかにInfectious Grooves、Fishbone、Extreme、Mordred、日本ではオーディエンスやHi-STANDARD周辺にも影響が及んだ。1990年代半ば以降、この語法はRage Against the Machineを経てラップメタルへ、さらにニューメタルへと引き継がれるが、その過程でファンク本来の軽やかさは失われ、より重く鈍い方向に変質した。2000年代以降は独立したジャンルとしてはほぼ語られなくなっている。</p>
<h2>代表曲</h2><ul><li>Cult of Personality（Living Colour）</li><li>Give It Away（Red Hot Chili Peppers）</li><li>Jerry Was a Race Car Driver（Primus）</li><li>Aeroplane (Red Hot Chili Peppers)</li><li>Killing in the Name（Rage Against the Machine）</li></ul>
