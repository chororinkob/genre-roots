<h1>Blues（ブルース）とは</h1>
<p>アフリカ系アメリカ人の労働歌や霊歌から育った、12小節・3コード（I・IV・Vの三つの和音）の循環を基本形とする歌の音楽。長音階の第3音・第5音・第7音を半音下げた「ブルーノート」を、正確な半音ではなく微妙に低く揺らしながら歌い、</p>
<p>アフリカ系アメリカ人の労働歌や霊歌から育った、12小節・3コード（I・IV・Vの三つの和音）の循環を基本形とする歌の音楽。長音階の第3音・第5音・第7音を半音下げた「ブルーノート」を、正確な半音ではなく微妙に低く揺らしながら歌い、そのうねりが哀感の核になる。歌詞は同じ一行を2度繰り返してから答えを返す「AAB形式」が定型で、一行歌うごとに楽器が短く応じるコール・アンド・レスポンス（呼びかけと応答）が会話のように続く。ギターは弦を指で押し上げて音程を歪ませるチョーキング、瓶の首や金属筒を指にはめて滑らせるスライド奏法、親指でベース音を刻みながら旋律を弾くフィンガーピッキング（指で弦をはじく奏法）が要になる。ハーモニカは吸う息で本来より低い音を作るベンドで、泣き声のような音を出す。リズムは4分の4拍子だが、8分音符を長短に崩して跳ねさせるシャッフルのリズムが典型で、テンポは遅い曲から速いブギ（ノリの良い速い曲）まで幅広い。主題は貧困、移動、失恋、酒、労働、そして名指しのできない不運としてのブルースそのもの。ジャズが和声（コードの響き）の複雑化へ、ロックが音量と速度へ向かったのに対し、ブルースは少ない材料を反復しながら、音色と間合いを重視する傾向がある。</p>
<h2>成り立ち</h2><p>諸説あるが19世紀後半〜20世紀初頭に、アメリカ南部の綿花地帯で生まれた（12小節の標準形は1900年代の口承資料に現れ、AABが標準になったのは20世紀最初の数十年とされる）。奴隷制廃止後も小作農（シェアクロッパー）として土地に縛られた黒人たちが畑で叫ぶように歌ったフィールド・ハラー、鉄道や刑務所の作業歌、教会のスピリチュアル（黒人霊歌）などが混ざり合って形になった。20世紀初頭にかけて、通信販売のカタログ（Searsなど）で買えた安価なギターも、ブルースの形成に寄与した要因の一つとされる。最初期の姿は文字資料にほとんど残らず、最初期の証言のひとつに、バンドリーダーのW.C. Handyが1903年にミシシッピ州タトワイラーの駅で、ナイフの刃を弦に滑らせて歌う名も無き男を見たという回想がある（書かれたのは1941年の自伝）。文字の記録では、Charles Peabodyの報告（1903年刊）なども同じ時期に現れる。Handyは1912年に「Memphis Blues」、1914年に「St. Louis Blues」を出版し、ブルースを楽譜の商品として広めた代表的な存在となった。ただし最初ではなく、1912年3月刊のHart Wand「Dallas Blues」は、最初に「ブルース」と題された本格的な出版譜の一つとされる。より早い12小節ブルースの出版譜として、Antonio Maggio「I Got the Blues」（1908年）などがある。1920年、Mamie Smithの「Crazy Blues」が初の商業的大ヒットを記録したブルース系録音として歴史に刻まれ、レコード会社は黒人向け商品「レース・レコード」という市場を発見する。なお「Crazy Blues」自体はAABブルース形式を厳密には満たさず、コルネット・トロンボーン・クラリネット・ヴァイオリン・ピアノという初期ジャズ寄りの編成でもあり、「黒人歌手による最初のブルース録音」かどうかは学術的に諸説ある。1920年代はBessie SmithやMa Raineyら女性歌手が主役の「クラシック・ブルース」の時代だった。並行して、Paramount Recordsは南部にスカウトを置いて歌手を見つけ、Charley Patton、Blind Lemon Jefferson、Son House、Skip Jamesといった弾き語りの歌手を、北部のシカゴ、グラフトン、リッチモンドなどのスタジオで録音した。1936年から1937年にかけて計29曲を残したRobert Johnsonは、十字路で悪魔に魂を売って腕を得たという伝説とともに、1938年に没し、1961年にColumbiaがLP『King of the Delta Blues Singers』を出して広い聴衆に届き、再評価された。1910年ごろに始まり1970年まで続いた「大移動（グレート・マイグレーション）」で、約600万人の黒人が南部からニューヨーク、シカゴ、フィラデルフィア、セントルイス、デトロイトなどへ移住すると、騒がしい都市の酒場で聴かせるためにギターは電気楽器に変わる。Muddy Waters、Howlin' Wolf、Little Walterらは1940年代半ばから1950年代にかけて、Chess Recordsなどを拠点にバンド編成のシカゴ・ブルースを確立した。だが黒人の若い聴衆はソウルやR&amp;Bへ移り、ブルースは1960年代に、米国のブルース・リヴァイヴァル（復興運動）と、英国の白人青年——The Rolling Stones、Eric Clapton、Fleetwood Mac——によるブルース運動の両方によって再評価され、ロックの原型として世界へ広まる。初期の黒人ブルース歌手の多くは現金払いのみで契約書もなく、後の成功による印税も受け取れなかったと指摘されており、この搾取の構造はブルース史の消せない一部である。</p>
<h2>代表曲</h2><ul><li>The Thrill Is Gone (B.B. King)</li><li>Cross Road Blues (Robert Johnson)</li><li>Sweet Home Chicago (Robert Johnson)</li><li>Hoochie Coochie Man (Muddy Waters)</li><li>I'd Rather Go Blind (Etta James)</li><li>Killing Floor (Howlin' Wolf)</li><li>Spoonful (Howlin' Wolf)</li><li>Dust My Broom (Elmore James)</li><li>Born Under a Bad Sign (Albert King)</li><li>Nobody Knows You When You're Down and Out (Bessie Smith)</li><li>Walking Blues (Son House)</li><li>Sittin' on Top of the World (Mississippi Sheiks)</li><li>Crazy Blues (Mamie Smith)</li><li>Mannish Boy (Muddy Waters)</li><li>Baby Please Don't Go (Big Joe Williams)</li><li>Red House (Jimi Hendrix)</li><li>Everyday I Have the Blues (B.B. King)</li><li>Rollin' and Tumblin' (Muddy Waters)</li><li>Evil (Howlin' Wolf)</li><li>Little Red Rooster (Howlin' Wolf)</li><li>You Shook Me (Muddy Waters)</li><li>It Hurts Me Too (Elmore James)</li><li>Catfish Blues (Muddy Waters)</li></ul>
