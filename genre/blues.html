<h1>Blues（ブルース）とは</h1>
<p>アフリカ系アメリカ人の労働歌や霊歌から育った、12小節・3コード（I・IV・V）の循環を基本形とする歌の音楽。長音階の第3音・第5音・第7音を半音下げた「ブルーノート」を、正確な半音ではなく微妙に低く揺らしながら歌い、そのうねりが</p>
<p>アフリカ系アメリカ人の労働歌や霊歌から育った、12小節・3コード（I・IV・V）の循環を基本形とする歌の音楽。長音階の第3音・第5音・第7音を半音下げた「ブルーノート」を、正確な半音ではなく微妙に低く揺らしながら歌い、そのうねりが哀感の核になる。歌詞は同じ一行を二度繰り返してから答えを返す「AAB形式」が定型で、一行歌うごとに楽器が短く応じるコール・アンド・レスポンスが会話のように続く。ギターは弦を指で押し上げて音程を歪ませるチョーキング、瓶の首や金属筒を指にはめて滑らせるスライド奏法、親指でベース音を刻みながら旋律を弾くフィンガーピッキングが要になる。ハーモニカは吸う息で本来より低い音を作るベンドで、泣き声のような音を出す。リズムは4分の4拍子だが、8分音符を長短に崩して跳ねさせるシャッフルが基本で、テンポは60〜120BPM前後。主題は貧困、移動、失恋、酒、労働、そして名指しのできない不運としてのブルースそのもの。ジャズが和声の複雑化へ、ロックが音量と速度へ向かったのに対し、ブルースは少ない材料を反復しながら音色と間合いだけで語る点にとどまり続けている。</p>
<h2>成り立ち</h2><p>19世紀後半、アメリカ南部の綿花地帯で生まれた。奴隷制廃止後も小作農（シェアクロッパー）として土地に縛られた黒人たちが畑で叫ぶように歌ったフィールド・ハラー、鉄道や刑務所の作業歌、教会のスピリチュアルとゴスペル、行商人が持ち歩いた安価なギターが混ざり合って形になった。最初期の姿は文字資料にほとんど残らず、記録に現れるのは1903年、バンドリーダーのW.C. Handyがミシシッピ州タトワイラーの駅で、ナイフの刃を弦に滑らせて歌う名も無き男を見たという逸話である。Handyは1912年に「Memphis Blues」、1914年に「St. Louis Blues」を出版し、ブルースを楽譜として流通する商品に変えた。1920年、Mamie Smithの「Crazy Blues」が黒人歌手による初のブルース録音として大ヒットし、レコード会社は黒人向け商品「レース・レコード」という市場を発見する。1920年代はBessie SmithやMa Raineyら女性歌手が主役の「クラシック・ブルース」の時代だった。並行して南部では、Paramount RecordsやVocalionの録音技師が現地に出向き、Charley Patton、Blind Lemon Jefferson、Son House、Skip Jamesといった弾き語りの歌手を記録した。1936年から1937年にかけて計29曲を残したRobert Johnsonは、十字路で悪魔に魂を売って腕を得たという伝説とともに、死後数十年を経て神格化された。第二次大戦前後の「大移動（グレート・マイグレーション）」で数百万の黒人が南部からシカゴやデトロイトへ移住すると、騒がしい都市の酒場で聴かせるためにギターは電化される。Muddy Waters、Howlin' Wolf、Little Walterらは1950年代にChess Recordsでバンド編成のシカゴ・ブルースを確立した。だが黒人の若い聴衆はソウルやR&amp;Bへ移り、ブルースは1960年代に主としてイギリスの白人青年——The Rolling Stones、Eric Clapton、Fleetwood Mac——によって発掘され、ロックの原型として世界へ広まる。原作者たちの多くは印税をほとんど受け取れないまま貧困のうちに死んでおり、この搾取の構造はブルース史の消せない一部である。</p>
<h2>代表曲</h2><ul><li>Cross Road Blues (Robert Johnson)</li><li>The Thrill Is Gone (B.B. King)</li><li>Hoochie Coochie Man (Muddy Waters)</li></ul>
