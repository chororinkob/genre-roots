<h1>Blues（ブルース）とは</h1>
<p>ブルースは、アフリカ系アメリカ人の労働歌や霊歌から育った、歌の音楽だ。基本は、12小節・3コード（I・IV・Vの三つの和音）の循環である。 中心になる楽器はギターだ。弦を指で押し上げて音程を歪ませるチョーキング、瓶の首や金属筒を指</p>
<p>ブルースは、アフリカ系アメリカ人の労働歌や霊歌から育った、歌の音楽だ。基本は、12小節・3コード（I・IV・Vの三つの和音）の循環である。

中心になる楽器はギターだ。弦を指で押し上げて音程を歪ませるチョーキング、瓶の首や金属筒を指にはめて滑らせるスライド奏法、親指でベース音を刻みながら旋律を弾くフィンガーピッキング（指で弦をはじく奏法）が要になる。ハーモニカは、吸う息で本来より低い音を作るベンドを使い、泣き声のような音を出す。

音づくりの核は、長音階の第3音・第5音・第7音を半音下げた「ブルーノート」だ。正確な半音ではなく、微妙に低く揺らしながら歌う。そのうねりが、哀感の核になる。

リズムは4分の4拍子だ。8分音符を長短に崩して跳ねさせるシャッフルが典型である。テンポは、遅い曲から速いブギ（ノリの良い速い曲）まで幅広い。

歌詞は、同じ一行を2度繰り返してから答えを返す「AAB形式」が定型だ。一行歌うごとに楽器が短く応じるコール・アンド・レスポンス（呼びかけと応答）が、会話のように続く。主題は、貧困、移動、失恋、酒、労働、そして名指しのできない不運としてのブルースそのものだ。

ジャズは、和声（コードの響き）の複雑化へ向かった。ロックは、音量と速度へ向かった。これに対し、ブルースは少ない材料を反復しながら、音色や間合いを重視する傾向がある。</p>
<h2>成り立ち</h2><p>諸説あるが、ブルースは19世紀後半〜20世紀初頭に、アメリカ南部の綿花地帯で生まれた。

奴隷制廃止後も、黒人たちは小作農（シェアクロッパー）として土地に縛られた。畑で叫ぶように歌ったフィールド・ハラー、鉄道や刑務所の作業歌、教会のスピリチュアル（黒人霊歌）。そこに、通信販売のカタログ（Searsなど）で買えた安価なギターが加わった。このギターは、ブルースの形成に寄与した要因の一つで、20世紀初頭にかけて広まった。これらが混ざり合って、ブルースの形になった。

最初期の姿は、文字資料にほとんど残っていない。最初期の証言のひとつが、バンドリーダーのW.C. Handyの回想だ。1903年、ミシシッピ州タトワイラーの駅で、ナイフの刃を弦に滑らせて歌う名も無き男を見たという（書かれたのは1941年の自伝）。文字の記録では、Charles Peabodyの報告（1903年刊）なども同じ時期に現れる。

Handyは、1912年に「Memphis Blues」、1914年に「St. Louis Blues」を出版した。ブルースを楽譜の商品として広めた、代表的な存在となった。ただし、最初の出版者ではない。1912年3月刊のHart Wand「Dallas Blues」は、「最初の本格的な（true）出版ブルース」と呼ばれることがある。一方で、Antonio Maggio「I Got the Blues」（1908年）など、より早い12小節ブルースの出版譜がある。

1920年、Mamie Smithの「Crazy Blues」が、初の商業的大ヒットを記録したブルース系録音として歴史に刻まれた。レコード会社は、黒人向け商品「レース・レコード」という市場を発見する。ただし「Crazy Blues」は、AABブルース形式を厳密には満たさない。編成も、コルネット・トロンボーン・クラリネット・ヴァイオリン・ピアノという、初期ジャズ寄りのものだった。「黒人歌手による最初のブルース録音」かどうかは、学術的に諸説ある。

1920年代は、Bessie SmithやMa Raineyら女性歌手が主役の「クラシック・ブルース」の時代だった。並行して、Paramount Recordsは南部にスカウトを置いて歌手を見つけた。Charley Patton、Blind Lemon Jefferson、Son House、Skip Jamesといった弾き語りの歌手を、北部のシカゴ、グラフトン、リッチモンドなどのスタジオで録音した。1936年から1937年にかけて計29曲を残したRobert Johnsonは、十字路で悪魔に魂を売って腕を得たという伝説とともに語られる。1961年にColumbiaが出したLP『King of the Delta Blues Singers』で、再評価された。

やがて、南部から人が大きく動いた。「大移動（グレート・マイグレーション）」は、1910年ごろに始まり、第一次大戦で加速し、1970年まで続いた。合計約600万人の黒人が、南部からニューヨーク、シカゴ、フィラデルフィア、セントルイス、デトロイトなど多数の都市へ移住した。騒がしい都市の酒場で聴かせるために、ギターは電気楽器に変わる。Muddy Waters、Howlin' Wolf、Little Walterらは、1940年代半ば〜1950年代にかけて、Chess Recordsでバンド編成のシカゴ・ブルースを定着させた。

だが、黒人の若い聴衆は、ソウルやR&amp;Bへ移っていった。それでも、ブルースは1960年代に再評価される。米国のブルース・リヴァイヴァル（復興運動）と、英国の白人青年——The Rolling Stones、Eric Clapton、Fleetwood Mac——によるブルース運動の、両方によるものだ。ブルースは、ロックの原型として世界へ広まる。

一方で、多くの黒人ブルース歌手は、不当な契約や印税の未払いに苦しんだと指摘されている。この不当に搾取する構造は、ブルース史の消せない一部である。</p>
