<h1>Khoomei（ホーミー）とは</h1>
<p>ホーミーは、1人の歌手が低く持続するドローン（持続低音）と、その上を笛のように動く甲高い倍音の旋律とを同時に鳴らす歌唱法だ。喉を締めて仮声帯を内転・振動させ、声帯と仮声帯を二重に鳴らした噪（そう）性の嗄れ声を作り、そこへ舌先を口蓋</p>
<p>ホーミーは、1人の歌手が低く持続するドローン（持続低音）と、その上を笛のように動く甲高い倍音の旋律とを同時に鳴らす歌唱法だ。喉を締めて仮声帯を内転・振動させ、声帯と仮声帯を二重に鳴らした噪（そう）性の嗄れ声を作り、そこへ舌先を口蓋へ近づけて口腔を2つの共鳴室に仕切る。この狭い連結口が鋭い第2フォルマントを生み、舌と唇の形を動かしてその共振周波数をずらすと、倍音列の中の1つが順に強調され、笛のような細い音の旋律として浮かび上がる。旋律の正体は倍音そのものなので、ドローンに対する5度・4度・長3度といった音程が細い音で上下し、下では唸るような低音が動かずに持続する。これがホーミーの最大の聴きどころであり、同時に2音が鳴っているように耳へ届く理由でもある。技法は大きく2系統に分かれ、低いドローンの下のサブハーモニクスを強調するハルハラー（ハリギャーホーミー）と、基音より上の倍音を強調して口笛のような高音を作るイスゲレー（イスゲレント）がある。歌に使う楽器は馬頭琴のモリンホール、ホーミーを歌いながら吹く縦笛ツォール、口琴のトムス、撥弦のトヴシュール、笛のリンベなどで、とくにモリンホールの2本の馬尾毛弦が奏でる低い唸りはホーミーのドローンと自然に溶け合う。拍節は長調（ウルティン・ドゥー）の伸びやかな息遣いに沿い、テンポは一定に刻まず、ドローンの上を旋律がゆっくり渡っていく。アクセントは音符ではなく、声の切り替えと倍音の乗り換えの瞬間に置かれる。音響は屋外の風やゲルの反響を思わせる素朴なままで、電気的な残響や歪みは用いない。歌詞は自然、馬、故郷の山河、祖先と英雄を讃える内容が中心で、儀礼や競馬・弓射・相撲の祝いの場、家畜の番をする草原、赤子を寝かせるゲルの中で歌われる。同じアルタイ山脈周辺の喉歌であるトゥバのカルグラーが地鳴りのような超低音を主役にするのに対し、モンゴルのホーミーはドローンと倍音旋律の二重性そのものを聴かせる点で区別される。</p>
<h2>成り立ち</h2><p>ホーミー（モンゴル語 Хөөмий）は、アルタイ山脈周辺の民族に伝わる喉歌のうち、モンゴル国西部と中国・新疆ウイグル自治区北部に住む西部オイラト諸族に伝わる歌唱法の呼称だ。同じ喉歌でも、ロシア・トゥバ共和国のフーメイ（ホーメイ）やカルグラー、スグットとは地域と呼び名が異なり、系統としては分けて扱われる。発祥地はモンゴル国西部ホブド県のチャンドマン村であると言われ、同地では男女を問わず子どもが幼い頃からホーミーを練習し始めるという。伝承は文字に頼らず、歌い手から学び手へ、師匠から弟子へ口伝で受け渡されてきた。

歌われる場は、国家の式典から家庭の祝い事まで幅広い。ユネスコ無形文化遺産の登録は2件あり、中国が申請した「Mongolian art of singing, Khoomei（喉の和音）」が2009年に、モンゴル国が申請した「Mongolian traditional art of Khöömei」が2010年に、それぞれ人類の無形文化遺産の代表的な一覧表へ記載された。両国が同じモンゴル系の喉歌を別々に申請したこと自体が、起源の帰属をめぐる主張のぶつかり合いを映している。どちらの土地が発祥かは決着しておらず、断定は避けるべき争点だ。

近代の調査としては、大阪芸術大学でのモンゴル人歌手センゲドルジへの聞き取りと音響心理実験、モンゴル研究者の中川裕による1989年の指摘が知られる。ホーミーをシャーマニズムや家畜の授乳促進と結びつける説も唱えられたが、ホブド県の専属ホーミー歌手は「授乳のために歌うことはない、自分たちの楽しみとして歌っている」と語り、通俗的な説明を否定している。発声の仕組みについても、仮声帯が甲高い音源になるとする2音源説と、口腔を2つの共鳴管に分けて第2フォルマントを動かすとする共振説が並立し、現在も議論が続く。

モンゴル国外への広がりは、トゥバのフンフルトゥなどが欧米で注目された1990年代前後に始まり、N.センゲドルジが2002年のスミソニアン民俗生活祭で喉歌を実演して紹介した。2010年代には馬頭琴と喉歌を重ねるクスクトゥンがアジアズ・ゴット・タレントやBBCプロムスへ進出し、2016年結成のロックバンドThe Huが2018年の「Yuve Yuve Yu」と「Wolf Totem」で喉歌を大衆音楽へ持ち込み、世界的な話題となった。YouTubeではバトゾリグ・ヴァンチグの「Chinggis Khaanii Magtaal」が数千万回再生され、ホーミーは草原の口伝芸から国際的な音楽表現へと姿を変えた。一方で本場の遊牧社会では家畜とともに暮らす歌として受け継がれ、ラジオと動画配信の両方が伝承を支えている。</p>
