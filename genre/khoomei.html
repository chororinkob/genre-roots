<h1>Khoomei（ホーミー）とは</h1>
<p>ホーミーは、1人の歌手が低く持続するドローン（持続低音）と、その上を笛のように動く甲高い倍音の旋律とを同時に鳴らす歌唱法だ。 声帯を強く締めてドローンを出し、そこへ舌先を口蓋（口の中の天井）へ近づけて口腔を2つの共鳴室に仕切る。こ</p>
<p>ホーミーは、1人の歌手が低く持続するドローン（持続低音）と、その上を笛のように動く甲高い倍音の旋律とを同時に鳴らす歌唱法だ。

声帯を強く締めてドローンを出し、そこへ舌先を口蓋（口の中の天井）へ近づけて口腔を2つの共鳴室に仕切る。この狭い連結口が、鋭い第2フォルマント（声の質を決める音の成分の1つ）を生む。舌と唇の形を動かしてその共振周波数をずらすと、倍音列（元の音に重なって響く高い音の並び）の中の1つが順に強調される。それが、笛のような細い音の旋律として浮かび上がる。

旋律の正体は倍音そのものだ。そのため、ドローンの倍音列に含まれる音（第6〜13倍音を中心に）が細い音で上下し、下では唸るような低音が動かずに持続する。これがホーミーの最大の聴きどころであり、同時に2音が鳴っているように耳へ届く理由でもある。

技法は、大きく2系統に分かれる。一つは、低いドローンの下のサブハーモニクス（基音より低い成分）を強調するハルヒラーだ。もう一つは、基音（元の音）より上の倍音を強調して口笛のような高音を作るイスゲレー（イスゲレント）である。

歌と合わせて用いられるとされる楽器には、馬頭琴のモリンホール、ホーミーを歌いながら吹く縦笛ツォール、口琴のアマン・ホール、撥弦のトヴシュール、笛のリンベなどがある。とくにモリンホールの2本の馬尾毛弦が奏でる低い唸りは、ホーミーのドローンと自然に溶け合う。

テンポは一定に刻まず、ドローンの上を旋律がゆっくり渡っていくことが多い。アクセントは音符ではなく、声の切り替えと倍音の乗り換えの瞬間に置かれるとされる。音響は屋外の風やゲルの反響を思わせる素朴なままとされ、伝統的な演奏では電気的な残響や歪みを用いないことが多いと見られる。

歌は、基本的に歌詞を伴わない。祖先や英雄を讃える歌はUNESCOの中国申請の記述に基づき、儀礼や競馬・弓射・モンゴル相撲（ブフ）の祝いの場、家畜の番をする草原、赤子を寝かせるゲルの中で歌われる。

同じアルタイ山脈周辺の喉歌であるトゥバのカルグラーは、モンゴルのハルヒラー（深いホーミー）と同種の、地鳴りのような低音の技法である。</p>
<h2>成り立ち</h2><p>ホーミー（モンゴル語 Хөөмий）は、アルタイ山脈周辺の民族に伝わる喉歌のうち、モンゴル国西部のほか、中国の内モンゴルやロシアのトゥバなどで歌われる歌唱法の呼称だ。同じ喉歌でも、ロシア・トゥバ共和国のフーメイ（ホーメイ）があり、カルグラーとスグットは地域名ではなく「技法名」である。呼称は地域・資料で揺れる。

発祥地は、モンゴル国西部ホブド県のチャンドマン村であると言われている（大阪芸大論文）。ただし、地元でそう言われているもので、起源の時期は特定されていない。伝承は文字に頼らず、歌い手から学び手へ、師匠から弟子へ口伝で受け渡されてきた。

歌われる場は、国家の式典から家庭の祝い事まで幅広い。ユネスコ無形文化遺産の登録は2件ある。中国が申請した「Mongolian art of singing, Khoomei（喉の和音）」が2009年に、モンゴル国が申請した「Mongolian traditional art of Khöömei」が2010年に、それぞれ人類の無形文化遺産の代表的な一覧表へ記載された。両国がそれぞれ別に申請して登録された。どちらの土地が発祥かは決着しておらず、断定は避けるべき争点だ。

近代の調査としては、大阪芸術大学の研究者によるホブドでのモンゴル人歌手センゲドルジへの聞き取り（1994年8月16・17日）が知られる。また、大阪芸術大学の学生・教員8名を被験者にして大学側で行われた音響心理実験や、音楽学者の中川真による1989年の指摘も知られる。

ホーミーをシャーマニズムや家畜の授乳促進と結びつける説も唱えられた。しかし、ホブド県の専属ホーミー歌手は「家畜の授乳を促進するためにホーミーを歌うことはない。ホーミーを歌う人々は自分たちの楽しみとして歌っている」と語り、授乳促進という説明を一人の歌手は否定している。発声の仕組みについても、仮声帯（声帯の上にあるひだ）が甲高い音源になるとする2音源説と、口腔を2つの共鳴管に分けて第2フォルマントを動かすとする共振説が並立している。ただ、共振説のほうが有力とされ、2音源説は異説として扱われる。

トゥバの喉歌が欧米で注目された動きは、トゥバのフンフルトゥなどが欧米で注目された1990年代前後に始まった。N.センゲドルジが2002年のスミソニアン民俗生活祭で喉歌を実演して紹介した（先に出るセンゲドルジと同一人物かどうかは確認できなかった）。

2010年代には、馬頭琴と喉歌を重ねるクスクトゥンがアジアズ・ゴット・タレントやBBCプロムスへ進出した。2016年結成のロックバンドThe Huは、2018年の「Yuve Yuve Yu」と「Wolf Totem」で喉歌を世界的に広めた。YouTubeではバトゾリグ・ヴァンチグの「Chinggis Khaanii Magtaal」が数千万回再生され、ホーミーは草原の口伝芸から国際的な音楽表現へと姿を変えた。

一方で本場の遊牧社会では、家畜とともに暮らす歌として受け継がれ、口伝で継承される。</p>
