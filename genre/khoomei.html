<h1>Khoomei（ホーミー）とは</h1>
<p>ホーミーは、1人の歌手が低く持続するドローン（持続低音）と、その上を笛のように動く甲高い倍音の旋律とを同時に鳴らす歌唱法だ。声帯を強く締めてドローンを出し、そこへ舌先を口蓋（口の中の天井）へ近づけて口腔を2つの共鳴室に仕切る。この</p>
<p>ホーミーは、1人の歌手が低く持続するドローン（持続低音）と、その上を笛のように動く甲高い倍音の旋律とを同時に鳴らす歌唱法だ。声帯を強く締めてドローンを出し、そこへ舌先を口蓋（口の中の天井）へ近づけて口腔を2つの共鳴室に仕切る。この狭い連結口が鋭い第2フォルマント（声の質を決める音の成分の1つ）を生み、舌と唇の形を動かしてその共振周波数をずらすと、倍音列（元の音に重なって響く高い音の並び）の中の1つが順に強調され、笛のような細い音の旋律として浮かび上がる。旋律の正体は倍音そのものなので、通常は第6〜13倍音あたりを孤立させて作る旋律音が、ドローンの倍音列の音の高さに限られたまま細い音で上下し、下では唸るような低音が動かずに持続する。これがホーミーの最大の聴きどころであり、同時に2音が鳴っているように耳へ届く理由でもある。技法は大きく2系統に分かれ、低いドローンの下のサブハーモニクス（基音より低い成分）を強調するハルハラー（ハルヒラーとも表記される）と、基音（元の音）より上の倍音を強調して口笛のような高音を作るイスゲレーがある。ホーミーとの結びつきが知られる楽器は馬頭琴のモリンホールと、ホーミーを歌いながら吹く縦笛ツォールで、とくにモリンホールの2本の馬尾毛弦が奏でる低い唸りはホーミーのドローンと自然に溶け合う。ホーミーは基本的に歌詞を伴わない歌唱法とされる。自然や祖先、英雄への敬意と賛美を表すとされ、儀礼や競馬・弓射・モンゴル相撲（ブフ）の祝いの場、家畜の番をする草原、赤子を寝かせるゲルの中で歌われる。同じアルタイ山脈周辺の喉歌であるトゥバのカルグラーは、モンゴルのハルハラー（ハルヒラーとも表記される、深いホーミー）と同種の、地鳴りのような低音の技法である。</p>
<h2>成り立ち</h2><p>ホーミー（モンゴル語 Хөөмий）は、アルタイ山脈周辺の民族に伝わる喉歌のうち、主にモンゴル国西部（ホブド県など）で歌われる歌唱法の呼称だ。内モンゴルやロシアのトゥバでも実践されるとする資料があり、トゥバのものはフーメイ（ホーメイ）と呼ばれ、カルグラーやスグットは技法の名前である。呼称が指す範囲は、地域や資料によって揺れがある。発祥地はモンゴル国西部ホブド県のチャンドマン村であると地元で言われ、起源の時期は特定されていない。伝承は文字に頼らず、歌い手から学び手へ、師匠から弟子へ口伝で受け渡されてきた。

歌われる場は、国家の式典から家庭の祝い事まで幅広い。ユネスコ無形文化遺産の登録は2件あり、中国が申請した「Mongolian art of singing, Khoomei（喉の和音）」が2009年に、モンゴル国が申請した「Mongolian traditional art of Khöömei」が2010年に、それぞれ人類の無形文化遺産の代表的な一覧表へ記載された。両国がそれぞれ別に申請して登録された。どちらの土地が発祥かは決着しておらず、断定は避けるべき争点だ。

近代の調査としては、大阪芸術大学の研究者によるホブドでのモンゴル人歌手センゲドルジへの聞き取り（1994年）と、大学での音響心理実験、音楽学者の中川真による1989年の指摘が知られる。ホーミーをシャーマニズムや家畜の授乳促進と結びつける説も唱えられたが、ホブド県の専属ホーミー歌手の一人は「家畜の授乳を促進するためにホーミーを歌うことはない。ホーミーを歌う人々は自分たちの楽しみとして歌っている」と語り、授乳促進という説明を否定している（中川真は、現代のモンゴル人は授乳を促す音楽として捉えていると書いている）。発声の仕組みについても、仮声帯（声帯の上にあるひだ）が甲高い音源になるとする2音源説と、口腔を2つの共鳴管に分けて第2フォルマントを動かすとする共振説が並立しているが、共振説のほうが有力とされ、2音源説は異説として扱われる。

喉歌が国外で注目されるきっかけには、トゥバのフンフルトゥ（1992年結成）などが欧米で注目された1990年代前後の動きがあり、モンゴルのN.センゲドルジが2002年のスミソニアン民俗生活祭で喉歌を実演して紹介した（先に出るホブドの歌手センゲドルジと同一人物かは確認できていない）。2010年代には馬頭琴と喉歌を重ねるクスクトゥンがアジアズ・ゴット・タレントやBBCプロムスへ進出し、2016年結成のロックバンドThe Huが2018年の「Yuve Yuve Yu」と「Wolf Totem」で喉歌を取り入れたロックを世界に広め、世界的な話題となった。YouTubeではバトゾリグ・ヴァンチグの「Chinggis Khaanii Magtaal」が数千万回再生され、ホーミーは草原の口伝芸から国際的な音楽表現へと姿を変えた。一方で本場の遊牧社会では家畜とともに暮らす歌として、口伝で受け継がれている。</p>
