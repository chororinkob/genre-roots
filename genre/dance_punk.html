<h1>Dance-Punk（ダンスパンク）とは</h1>
<p>ダンスパンクは、パンクとポストパンクの尖った演奏を、踊るための音楽に結びつけたものだ。 決め手になるのはベースである。低音を支えるだけの役割を離れ、旋律的で跳ねる音の並びを延々と繰り返し、曲を前へ進める力を一手に引き受ける。ファン</p>
<p>ダンスパンクは、パンクとポストパンクの尖った演奏を、踊るための音楽に結びつけたものだ。

決め手になるのはベースである。低音を支えるだけの役割を離れ、旋律的で跳ねる音の並びを延々と繰り返し、曲を前へ進める力を一手に引き受ける。ファンクとディスコから借りた、歩き回るようなこのベースが、パンクの硬直したリズムを解きほぐす。

ギターはこれと対照的だ。和音を厚く鳴らさず、角張って、乾いてもろい質感で、旋律ではなく質感として鳴らされる。この引っ掻くようなギターと転がるベースの対比が、この分野の音を決定づけている。

ドラムは、ディスコ由来の四つ打ちやハイハットを多用する例が多い。そこにカウベルやコンガといった打楽器が加えられる。

曲の組み立ては、繰り返しが土台になることが多い。和音の進行はほとんど動かず、同じ数の小節の輪の上で、楽器の出入りだけが変化する。

歌い方は、歌い上げない。叫ぶ、繰り返す、うわ言のように呟く、といった形が選ばれる。歌詞は知的・自意識的なものが多い（Gang of Fourなどは政治・社会批評色が強い）。</p>
<h2>成り立ち</h2><p>起源は、1979年前後のイギリスとアメリカにある。

パンクが一巡したあと、その担い手たちは、黒人音楽へ関心を向けた。とりわけ、ファンク、ディスコ、レゲエである。イギリスのリーズで結成されたGang of Fourは、1979年の作品で、マルクス主義やシチュアシオニスムの影響を受けた政治的な歌詞と、切り刻まれたギター、そして踊れる強靭なベースを結びつけた。同時期に影響力を持った英国の代表格とされる(ダンスパンクの第1波の中心は、ESG、Liquid Liquid、James Chance and the Contortionsなどニューヨークの勢力とされる)。マンチェスターのA Certain RatioやブリストルのThe Pop Groupは、ポストパンクとファンクの接点にいた。

ニューヨークでは、さらに直接的な融合が起きた。ブロンクスの姉妹によるESGは、母親が買い与えた楽器を、姉妹が実践で覚えた。ドラム、ベース、控えめなギター、ボーカル、打楽器による極めて簡素な楽曲を作り、代表曲『UFO』が史上最もサンプリングされた曲の一つとされる。同じく99 Recordsから作品を出したLiquid Liquidの楽曲『Cavern』は、Sugar Hillのハウスバンド（レーベル専属の演奏団）に、無許可・無クレジットで演奏し直された(インターポレーション)。99 Recordsは提訴した。Talking Headsは1980年の作品『Remain in Light』で、西アフリカのリズムの循環をロックに取り入れ、この方向の代表作の一つとなった。

しかし、この流れは1980年代初頭、ニューポップが人気を集めて衰える。

復活したのは、1990年代末から2000年代初頭にかけてで、ニューヨークを中心に英米などへ広がった。James MurphyがTim Goldsworthy、Jonathan Galkinとともに設立したDFA Recordsが拠点となる。The Raptureが2002年にDFAから発表した楽曲『House of Jealous Lovers』は、金切り声とカウベルと転がるベースで注目を集め、英国では2003年に27位に入った。James Murphy自身も、LCD Soundsystemとして、音楽的な教養と自嘲を織り交ぜた作品を発表する。同時期のシーンには、!!!やOut Hudなども加わった。

イギリスでは、グラスゴーのFranz Ferdinandが2004年に成功を収めた。Kapranosは初期に「music for girls to dance to」と語った。ロンドンのBloc Partyは、より緊張感のある形を示した。ポストパンク・リヴァイヴァル全体は、2000年代半ばに頂点を迎え、2008年ごろから勢いが衰えた。それでも、ロックバンドがダンス音楽の機能を真剣に引き受けるという発想は、以後のインディーロックに定着した。</p>
<h2>代表曲</h2><ul><li>Danger! High Voltage (Electric Six)</li><li>Do You Want To (Franz Ferdinand)</li><li>Daft Punk Is Playing at My House (LCD Soundsystem)</li><li>Echoes (The Rapture)</li><li>Losing My Edge (LCD Soundsystem)</li><li>House of Jealous Lovers (The Rapture)</li><li>Romantic Rights (Death from Above 1979)</li><li>Me and Giuliani Down by the School Yard (!!!)</li><li>Give It Up (LCD Soundsystem)</li><li>Gay Bar (Electric Six)</li><li>Dance to the Underground (Radio 4)</li><li>Olio (The Rapture)</li></ul>
