<h1>Dance-Punk（ダンスパンク）とは</h1>
<p>パンクとポストパンクの尖った演奏を、踊るための機能に接続した音楽である。決定的な要素はベースで、低音を支えるだけの役割を離れ、旋律的で跳ねる音型を延々と反復し、曲の推進力を一手に引き受ける。この、ファンクとディスコから借りた歩き回</p>
<p>パンクとポストパンクの尖った演奏を、踊るための機能に接続した音楽である。決定的な要素はベースで、低音を支えるだけの役割を離れ、旋律的で跳ねる音型を延々と反復し、曲の推進力を一手に引き受ける。この、ファンクとディスコから借りた歩き回るベースが、パンクの硬直したリズムを解きほぐす。ギターはこれと対照的で、和音を厚く鳴らさず、極めて高い音域で短く切った音を、拍の裏や隙間に鋭く差し込む。歪みよりも金属的な硬さが求められ、この引っ掻くようなギターと転がるベースの対比が、この分野の音を決定づけている。ドラムは四つ打ちの大太鼓か、ディスコ由来の細かく開閉するハイハット（シンバルを重ねた装置）を用い、そこにカウベルやコンガといった打楽器が加えられる。曲の構造は反復を基調とし、和音進行はほとんど動かず、同じ数小節の輪の上で要素の出入りだけが変化する。歌唱は歌い上げず、叫ぶ、繰り返す、うわ言のように呟くといった形が選ばれる。歌詞は消費社会への批判、労働、身体、皮肉といった主題を扱い、快楽と批評が同居している点が特徴である。</p>
<h2>成り立ち</h2><p>起源は1979年前後のイギリスとアメリカにある。パンクが一巡した後、その担い手たちは黒人音楽、とりわけファンク、ディスコ、レゲエへ関心を向けた。イギリスのリーズで結成されたGang of Fourは、1979年の作品で、マルクス主義的な歌詞と、切り刻まれたギター、そして踊れる強靭なベースを結合させ、この分野の原型を作った一組とされる(ダンスパンクの第1波の中心は、ESG、Liquid Liquid、James Chance and the Contortionsなどニューヨークの勢力とされる)。マンチェスターのA Certain RatioやブリストルのThe Pop Groupも同じ方向を追求している。ニューヨークではさらに直接的な融合が起きた。ブロンクスの姉妹によるESGは、独学で、ドラム、ベース、控えめなギター、ボーカル、打楽器による極めて簡素な楽曲を作り、それが後にヒップホップで最も多くサンプリングされる音源のひとつとなった。同じく99 Recordsから作品を出したLiquid Liquidの楽曲『Cavern』は、Sugar Hillのハウスバンド（レーベル専属の演奏団）に無許可・無クレジットで演奏し直され(インターポレーション)、99 Recordsが提訴した。Talking Headsは1980年の作品で、西アフリカのリズムの循環をロックに導入し、この方向の到達点を示した。この系譜は1980年代初頭にニューポップの台頭で衰える。復活したのは2001年前後のニューヨークである。James MurphyがTim Goldsworthy、Jonathan Galkinとともに設立したDFA Recordsが拠点となり、The Raptureが2002年にDFAから発表した楽曲『House of Jealous Lovers』は、金切り声とカウベルと転がるベースで注目を集め、英国では2003年に27位に入った。James Murphy自身もLCD Soundsystemとして、音楽的な教養と自嘲を織り交ぜた作品を発表する。!!!やOut Hudといったバンドが続き、イギリスではグラスゴーのFranz Ferdinandが2004年に、女の子たちを踊らせる音楽を作りたいという明快な動機を掲げて成功を収め、ロンドンのBloc Partyがより緊張感のある形を提示した。この復興は2000年代半ばに商業的な頂点を迎え、その後急速に飽きられる。しかし、ロックバンドがダンス音楽の機能を真剣に引き受けるという発想は、以後のインディーロックに定着した。</p>
<h2>代表曲</h2><ul><li>Danger! High Voltage (Electric Six)</li><li>Do You Want To (Franz Ferdinand)</li><li>Daft Punk Is Playing at My House (LCD Soundsystem)</li><li>Echoes (The Rapture)</li><li>Losing My Edge (LCD Soundsystem)</li><li>House of Jealous Lovers (The Rapture)</li><li>Romantic Rights (Death from Above 1979)</li><li>Me and Giuliani Down by the School Yard (!!!)</li><li>Give It Up (LCD Soundsystem)</li><li>Gay Bar (Electric Six)</li><li>Dance to the Underground (Radio 4)</li><li>Olio (The Rapture)</li></ul>
