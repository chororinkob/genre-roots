<h1>Chalga（チャルガ）とは</h1>
<p>チャルガは、ブルガリアを中心に、東南ヨーロッパで広く聴かれる大衆音楽のジャンルだ。最大の特徴は、バルカン半島の民俗音楽らしい旋律と、オリエンタルな音階が混ざり合っている点にある。 中心になる楽器はキーボード（シンセサイザー）だ。生</p>
<p>チャルガは、ブルガリアを中心に、東南ヨーロッパで広く聴かれる大衆音楽のジャンルだ。最大の特徴は、バルカン半島の民俗音楽らしい旋律と、オリエンタルな音階が混ざり合っている点にある。

中心になる楽器はキーボード（シンセサイザー）だ。生楽器では、クラリネットがしばしば唯一の存在になる。プログラムされたビートには、ダルブッカ（壺型の太鼓）が加わる。

音階には、アラビア・トルコ系の増2度音程（半音3つ分に当たる独特な跳躍）を含むヒジャーズ調や、フリジア旋法の変形が使われることがある。これが、西洋の長調・短調とは違う、独特の緊張感と哀愁を生む。メロディーには装飾音符（トリル・グリッサンド）が多く使われる。歌手が音符の間を滑らかに行き来するメリスマ唱法も、頻繁に使われる。

リズムには、トルコ系・ロマ系の「キュチェク」と呼ばれるリズムが使われることもある。典型的には9/8拍子（拍の分け方は2-2-2-3または2-2-3-2）だ。

歌い方は、装飾的で感情的な歌唱が特徴だ。歌詞のテーマは、恋愛・裏切り・お金・享楽・セクシュアリティが中心で、露骨な表現がしばしば含まれる。ミュージックビデオでは、派手な衣装と官能的なダンスが定番だ。見た目の過剰さも、このジャンルらしさの一部になっている。

チャルガは、他のバルカン諸国のポップ・フォークと同じく、ダンス/ポップ的な制作を取り入れている。また、セルビアの民謡系ポップの影響を受けた関連ジャンルでもある。セルビアのトゥルボ・フォルクとは、どちらもバルカン民俗音楽とポップ・電子音楽を混ぜ合わせた作りを持つ。

鳴っている場所は、ブルガリアの結婚式・ナイトクラブ・屋外フェスティバル・テレビの音楽番組などだ。日常生活に深く根ざした音楽である。</p>
<h2>成り立ち</h2><p>チャルガという語と、オスマン帝国時代にバルカン半島で演奏されていた都市的な器楽音楽（チャルギヤ）の名は、いずれもトルコ語の「çalgı」（楽器、音楽）に由来する。ただし、チャルギヤは別のジャンルなので、混同しないように注意が必要だ。チャルギヤは、19世紀から20世紀初頭のマケドニアやブルガリアの都市部で、カフェで演奏された器楽アンサンブルの音楽を指していた。北マケドニアでは、1944年に国営ラジオ専属のアンサンブルが作られ、現在も演奏されている。

現代のチャルガは、1989年のブルガリアの共産主義体制崩壊の後、1990年代に形成されたポップ・フォークである。1980年代半ば、ユーゴスラビアではトゥルボ・フォルクが広まり、ブルガリアの人々も海賊版カセットなどで聴いていた。そして1989年以降に、国産のチャルガが成立した。

体制崩壊後のブルガリアは、経済の混乱や失業に加え、組織犯罪が力を増す激動の時代を迎えた。この時期に、放送規制が解除され、民間の流通が広がった。そうした中で、ポスト共産期で最初の主要なチャルガのバンドの一つとされるKristal（Orchestra Kristal、1987年結成）や、そのヴォーカリストのToni Dacheva、Gloriaといった歌手が現れた。彼らは、バルカン民俗音楽の旋律に電子ビートを組み合わせた曲を発表し始めた。

とくに重要なのが、レーベル「ペイナー（Payner）」だ。ペイナーは1990年、ブルガリアのディミトロフグラードを拠点に設立された。最大手として、商業化と普及で大きな役割を果たした。カセットや、後にはCDの大量流通、専用テレビチャンネル「プラネタ TV（Planeta TV）」の運営、専属アーティストの育成も行った。

1990年代後半から2000年代にかけて、チャルガは全盛期を迎えた。その代名詞といえるのがアジス（Azis）だ。ロマ系ブルガリア人のアジスは、1999年のデビュー作『Bolka』から活動している。サリーやベリーダンスの衣装、ハイヒールといった派手な見た目と、強烈なステージで社会のタブーに挑み、2000年代に頭角を現した。「Hop」や「Sen Trope」（2011年）は、後年の曲である。また、デシ・スラヴァ（Desi Slava）といったアーティストも大きな人気を集めた。

しかし、チャルガは初めから激しい論争の的になった。ブルガリアの教養層には、西洋の音楽を好み、チャルガを地方向けの単純なパーティー音楽と見る風潮があった。東方的な響きを見下す空気もあるとされる。とくに、ロマ音楽の要素を多く含むことへの偏見や、歌詞の性的・物質主義的な内容が問題にされた。

一方で、チャルガは、社会の隅に追いやられたロマ系の住民や、農村から都市へ移ってきた人々にとって、自分たちの文化的なアイデンティティを肯定する音楽でもあった。この「高文化 vs 低文化」の対立は、ブルガリア社会の階級・民族・教育水準の溝を、目に見える形にするものでもあった。

チャルガは、セルビアのトゥルボ・フォルク、ルーマニアのマネレ（Manele）、ギリシャのライカ、トルコのアラベスクといった、よく似たバルカン各国のポップ・フォークと並べて語られる。また、西洋のR&amp;Bやヒップホップの要素を取り込んだサブジャンルも生まれ、ジャンルの幅が広がった。リミックスなどを通じて、国外にも広がりつつある。

ペイナーレーベルをめぐっては、2026年3月に売却の報道が出たが、会社登記の解釈をめぐって異論がある。新しい世代のアーティストも活躍しており、ジャンルとしての生命力は衰えていない。</p>
