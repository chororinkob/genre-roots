<h1>Chalga（チャルガ）とは</h1>
<p>チャルガはブルガリアを中心に東南ヨーロッパで広く聴かれる大衆音楽ジャンルだ。その最大の特徴は、バルカン半島の民俗音楽的な旋律とオリエンタルな音階の融合にある。使用される音階はアラビア・ペルシャ系の増2度音程（半音と全音の間の独特な</p>
<p>チャルガはブルガリアを中心に東南ヨーロッパで広く聴かれる大衆音楽ジャンルだ。その最大の特徴は、バルカン半島の民俗音楽的な旋律とオリエンタルな音階の融合にある。使用される音階はアラビア・ペルシャ系の増2度音程（半音と全音の間の独特な跳躍）を含むヒジャーズ調やフリジア旋法の変形が多く、西洋の長調・短調とは異なる独特の緊張感と哀愁を生み出す。メロディーラインは装飾音符（トリル・グリッサンド）を多用し、歌手が音符の間を滑らかに行き来するメリスマ唱法が頻繁に用いられる。

楽器編成はシンセサイザーとドラムマシンが中核を担い、1990年代以降はローランドやヤマハ製のキーボードが生楽器の代替として多用された。アコーディオン、クラリネット、ガドゥルカ（ブルガリアの擦弦楽器）が電子音と混在することも多く、生音と打ち込みが混在する独特の音響テクスチャーを形成する。リズムはほぼ毎分120〜140拍のテンポで刻まれ、4拍子が基本だが、7拍子や9拍子といった非対称拍子（バルカン地方特有の「クリヴォ・ホロ」系リズム）が挿入されることもある。キックドラムは1拍目と3拍目に強く置かれ、ハイハットが16分音符で細かく刻まれるユーロダンス的なパターンが基本だ。

ボーカルスタイルは非常に感情的で、高音域での張り上げや鼻腔共鳴を活かした独特の音色が特徴だ。歌詞の主題は恋愛・裏切り・金銭・享楽・セクシュアリティが中心で、しばしば露骨な表現が含まれる。ミュージックビデオでは派手な衣装と官能的なダンスが定番であり、視覚的な過剰さもジャンルのアイデンティティの一部だ。

トルコのアラベスクやギリシャのライカと比較すると、チャルガはより電子音楽的な処理が強く、ユーロダンスのビートを積極的に取り込んでいる点が異なる。セルビアのトゥルボ・フォルクとは兄弟ジャンルと言える関係にあり、どちらもバルカン民俗音楽とポップ・電子音楽の混合という構造を持つが、チャルガはよりオリエンタルな音階の影響が強い。実際に鳴っている場所としては、ブルガリアの結婚式・ナイトクラブ・屋外フェスティバル・テレビの音楽番組などが挙げられ、日常生活に深く根ざした音楽だ。</p>
<h2>成り立ち</h2><p>チャルガの歴史は、オスマン帝国時代にバルカン半島で演奏されていた都市的な大衆音楽「チャルガ（çalga）」に遡る。この言葉自体はトルコ語で「楽器演奏」を意味し、19世紀のブルガリア・セルビア・マケドニアの都市部で、カフェやタベルナ（居酒屋）で演奏された混合的な音楽文化を指していた。しかし現代的な意味でのチャルガが誕生したのは1990年代初頭、ブルガリアの共産主義体制崩壊（1989年）直後の社会的混乱期である。

体制崩壊後のブルガリアは経済的混乱・失業・組織犯罪の台頭という激動の時代を迎えた。この時期に、国営メディアの統制が弱まり、民間のカセットテープ流通や小規模レーベルが急増した。そのような状況の中で、ペイコ・ペイコフ（Payko Peikov）やアマリア（Amalia）といったアーティストが、バルカン民俗音楽の旋律に電子ビートを組み合わせた楽曲を発表し始めた。特に重要なのはレーベル「ペイナー（Payner）」の存在だ。1990年にブルガリアのディミトロフグラードを拠点として設立されたペイナーは、チャルガの商業化と全国普及において決定的な役割を果たした。同レーベルはカセット・後にCDの大量流通、専用テレビチャンネル「プラネタ TV（Planeta TV）」の運営、そして専属アーティストの育成によってジャンル全体を産業として確立した。

1990年代後半から2000年代にかけてチャルガは全盛期を迎えた。アジス（Azis）はその最も象徴的な存在だ。ロマ系ブルガリア人であるアジスは、ドラァグクイーン的な外見と強烈なステージパフォーマンスで社会的タブーに挑戦し、「Hop」（2011年）などのヒット曲で国民的スターとなった。また、デシ・スラヴァ（Desi Slava）、ヴァレリア（Valeria）といったアーティストも大きな人気を博した。代表曲としてはアジスの「Hop」（2011年）などが挙げられる。

チャルガは当初から激しい社会的論争の対象となった。ブルガリアの知識人・文化人・政治家の多くは、チャルガを「文化的退廃」「オリエンタリズムへの逆行」「共産主義崩壊後の道徳的荒廃の象徴」として批判した。特に、ロマ音楽の要素を多く含むことへの偏見や、歌詞の性的・物質主義的な内容が問題視された。一方で、チャルガは社会的に周縁化されたロマ系住民や農村出身の都市移住者にとって、自らの文化的アイデンティティを肯定する音楽でもあった。この「高文化 vs 低文化」の対立はブルガリア社会における階級・民族・教育水準の断層を可視化するものでもあった。

2000年代後半以降、チャルガはセルビアのトゥルボ・フォルク、ルーマニアのマネレ（Manele）、ギリシャのスカイラディカ（Skyladika）といった隣国の類似ジャンルと相互に影響を与え合いながら、「バルカン・ポップ」という広域的な文化圏を形成した。また、西洋のR&amp;Bやヒップホップの要素を取り込んだサブジャンルも登場し、ジャンルの多様化が進んだ。2010年代以降はYouTubeやSpotifyの普及によって国際的な認知度が高まり、バルカン系ディアスポラを通じて西ヨーロッパにも広がっている。現在もペイナーレーベルを中心に新世代のアーティストが活躍しており、ジャンルとしての生命力は衰えていない。</p>
