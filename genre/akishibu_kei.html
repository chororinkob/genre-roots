<h1>Akishibu-kei（アキシブ）とは</h1>
<p>渋谷系のオシャレで脱力感のあるポップの作り方を、アニメソングやゲーム音楽の土台の上で鳴らした、2000年代の日本のポップのスタイルである。代表曲22曲を動画で聴け、ルーツと影響のつながりを地図でたどれる。</p>
<p>渋谷系のオシャレで脱力感のあるポップの作り方を、アニメソングやゲーム音楽の土台の上で鳴らした、2000年代の日本のポップのスタイルである。ジャンルというより、題材・売り方・音楽が流れる場所でくくられる呼び名で、音そのものの定義は固まっていない。楽器の面では、生のピアノ、アコースティック・ギター、フリューゲルホルン、ストリングス、ヴィブラフォンといった暖かい音色が前面に出て、打ち込みのシンセサイザーとエレクトロニカ風のビートが下支えをする。和音はジャズのセブンスコードやテンションコード、ボサノバ風の進行をふんだんに使い、メロディはそうした細かく動くコードの上を、裏拍で滑るように作られている。リズムは4分の4拍子の軽いシャッフルやボサノバの刻みが多く、激しいアクセントよりも脱力したグルーヴを好む。歌い方の特徴は、ウィスパーボイスで囁くように歌うことと、スキャットを交えることで、声優や女性シンガーが澄んだ声で歌う曲が多い。歌詞はアニメの登場人物や物語に寄り添う恋愛・日常が中心で、萌えや電波ソングの色の強い曲も隣り合って並ぶ。曲の組み立ては、イントロで楽器の絡みを聴かせ、サビでジャジーなコードが開く作りが目立つ。普通のアニソンとの違いは、可愛さの演出よりもバンドやジャズのきめを優先する点にあり、渋谷系との違いは、その手法がアニメ・タイアップという枠の中で使われる点にある。アニメのオープニング・エンディング、声優のソロアルバム、秋葉原系のコンピレーション・アルバムの中で鳴っている。</p>
<h2>成り立ち</h2><p>このスタイルの背景には、二つの文化の交差点がある。

1990年代初頭、東京・渋谷の宇田川町周辺から、ジャズやソウル、ボサノバ、昔の映画音楽の影響を受けたギターポップの流れが全国に広がり、のちに渋谷系と呼ばれた。フリッパーズ・ギターやピチカート・ファイヴ、オリジナル・ラヴの作品群が、のちにこの分野へ人を送り出す作家たちの原体験となった。同じ頃の秋葉原では、アニメやゲームを中心とするオタク文化が育ち、アキバ系という呼び名でくくられる文化が形を作っていく。しかし二つの文化は、長く別々の場所で発展した。

1990年代半ばごろから、菅野よう子のような多彩な作風を持つ作曲家がアニメ音楽を多様化させ、ジャズから民族音楽までを消化したサウンドがアニメに入り込みやすくなった。2002年、渋谷系バンドのラウンド・テーブルがゲストボーカルのNinoを迎え、テレビアニメ『ちょびっツ』のオープニング曲「Let Me Be With You」を提供した。『ちょびっツ』のサウンドトラックは、ピチカート・ファイヴの元メンバー高浪敬太郎が作曲している。以降、この作品の音楽ディレクターを務めたフライングドッグの福田正夫が、渋谷系出身のミュージシャンをアニソンやアニメのサウンドトラックの作家として次々に起用していったとされ、福田はこのスタイルの仕掛け人とみなされている。

一方で2000年代には、『ちょびっツ』『月詠 -MOON PHASE-』『ゼーガペイン』などのアニメで渋谷系的な音楽が使われた。『月詠』では、渋谷系リスナーに人気のあったトルコ生まれのフランス人DJ、ディミトリ・フロム・パリがオープニング曲「Neko Mimi Mode」を提供した。この曲は電波ソングに分類されることもあり、スタイルの境界が曖昧だったことを示している。

2007年9月21日、ビクターエンタテインメントのレーベルからコンピレーション・アルバム『AKSB〜これがアキシブ系だ!〜』が発売された。高浪敬太郎や沖野俊太郎、ラウンド・テーブル、ロッキーチャックといった渋谷系ゆかりの作家たちが手がけたアニメのオープニング・エンディング曲など15曲を収めている。企画した福田は、渋谷系とアキバ系の両方のサブカルチャーが、ポップ文化に深くのめり込んだ「ナード」の集まりである点を共通項として挙げ、その定義文を英文でジャケットに記した。アメリカ出身の評論家W.デヴィッド・マルクスもこの結合を取り上げた。ただし福田自身は取材で「自然発生的に沸いてきた言葉で、明確な定義は誰もしていない」と語っており、呼び方は当初から人によって揺れていた。

その後も、渋谷系出身の作家やその作風を受け継ぐ作家たちが、アニメや声優の音楽を作り続けた。日本語版ウィキペディアは、花澤香菜や牧野由依、MONACA、ヒャダイン、さよならポニーテールなど多くの歌手・作家をこの系譜の中に並べており、ボカロ系の作家たちにもこの呼び名が援用されることがある。ただしそれは音の定義というより、渋谷系の感覚を持った作家たちがオタク文化の場で活動している姿を指す、ゆるい呼び名のままである。</p>
