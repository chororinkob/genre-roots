<h1>Akishibu-kei（アキシブ）とは</h1>
<p>アキシブ系は、渋谷系のおしゃれで力を抜いた作り方を、アニメソングやゲーム音楽の土台の上で鳴らした、2000年代の日本のポップのスタイルだ。代表曲22曲を動画で聴け、ルーツと影響のつながりを地図でたどれる。</p>
<p>アキシブ系は、渋谷系のおしゃれで力を抜いた作り方を、アニメソングやゲーム音楽の土台の上で鳴らした、2000年代の日本のポップのスタイルだ。ジャンルというより、題材や売り方、流れる場所でくくられる呼び名で、音そのものの定義は固まっていない。

楽器は、生のピアノ、アコースティック・ギター、フリューゲルホルン、ストリングス、ヴィブラフォンといった暖かい音色が前面に出て、打ち込みのシンセサイザーとエレクトロニカ風のビートが下支えすることが多い。

和音は、ジャズのセブンスコードやテンションコード、ボサノバ風の進行をふんだんに使う。メロディは、そうした細かく動くコードの上を、裏拍で滑るように作られる。

リズムは、4分の4拍子の軽いシャッフルやボサノバの刻みが多いとされ、激しいアクセントよりも脱力したグルーヴを好む曲が多い。

歌い方の特徴は、ウィスパーボイスで囁くように歌うことと、スキャットを交えることが多いとされる。声優や女性シンガーが、澄んだ声で歌う曲が多い。

歌詞は、アニメの登場人物や物語に寄り添う恋愛・日常が多いとされる。萌えや電波ソングの色が強い曲も、隣り合って並ぶ。

曲の組み立ては、イントロで楽器の絡みを聴かせ、サビでジャジーなコードが開く作りが目立つとされる。

渋谷系的なサウンドと、萌え・声優的な要素が併存する点が特徴だ。渋谷系との違いは、その手法がアニメ・タイアップという枠の中で使われる点にある。アニメのオープニング・エンディング、声優のソロアルバム、秋葉原系のコンピレーション・アルバムの中で鳴っている。</p>
<h2>成り立ち</h2><p>アキシブ系の背景には、二つの文化の交差点がある。

1980年代末頃、東京・渋谷の宇田川町周辺で、ギターポップやネオアコ、ソウル、ジャズ、ラウンジなどを混合した音楽の流れが起こり、1990年代に全国へ広がった。これが、のちに渋谷系と呼ばれた。フリッパーズ・ギターやピチカート・ファイヴ、オリジナル・ラヴの作品群は、福田自身が音楽の仕事に就くきっかけとなった。一方、1990年代の秋葉原では、アニメやゲームを中心とするオタク文化が育った。これは、のちにアキバ系と呼ばれるようになった（呼称が定着したのは1990年代後半から2000年代後半にかけてだ）。

1990年代半ばごろから、菅野よう子のような多彩な作風を持つ作曲家が、アニメ音楽を多様化させた。ジャズから民族音楽までを消化したサウンドが、アニメに入り込みやすくなった。2002年、渋谷系バンドのラウンド・テーブルがゲストボーカルのNinoを迎え、テレビアニメ『ちょびっツ』のオープニング曲「Let Me Be With You」を提供した。『ちょびっツ』のサウンドトラックは、ピチカート・ファイヴの元メンバー高浪敬太郎が作曲している。この作品の音楽ディレクターは、当時ビクターエンタテインメントにいた福田正夫だった（現在はフライングドッグの代表取締役社長）。福田は、『ちょびっツ』より前から、渋谷系出身のミュージシャンをアニソンやアニメのサウンドトラックの作家として起用していたとされる。『ちょびっツ』（2002年）で、その流れが注目されるようになった。福田はこのスタイルの仕掛け人とみなされている。

2000年代には、『ちょびっツ』『月詠 -MOON PHASE-』『ゼーガペイン』などのアニメで、渋谷系的な音楽が使われた。『月詠』では、渋谷系リスナーに人気のあった、トルコ生まれのフランス人DJ、ディミトリ・フロム・パリが、オープニング曲「Neko Mimi Mode」を提供した。この曲は、一部で電波ソングとも見なされる。

2007年9月21日、JVCエンタテインメント（ビクターエンタテインメントの子会社）から、FlyingDogレーベルでコンピレーション・アルバム『AKSB〜これがアキシブ系だ!〜』が発売された。高浪敬太郎や沖野俊太郎、ラウンド・テーブル、ロッキーチャックといった渋谷系ゆかりの作家たちが手がけた、アニメのオープニング・エンディング曲など15曲を収めている。企画した福田は、その定義文を英文でジャケットに記した。アメリカ出身の作家・ライター、W.デヴィッド・マルクスは、渋谷系とアキバ系の両方のサブカルチャーが、ポップ文化に深くのめり込んだ「ナード」の集まりである点を共通項として挙げている。ただし福田自身は取材で「アキシブ系はなんとなく自然発生的に沸いてきた言葉なので、アキシブ系というのはこれだよっていう定義はまだ誰も正確にはしていないと思います」と語っており、呼び方は当初から人によって揺れていた。

その後も、渋谷系出身の作家や、その作風を受け継ぐ作家たちが、アニメや声優の音楽を作り続けた。日本語版ウィキペディアは、花澤香菜や牧野由依、MONACA、ヒャダイン、さよならポニーテールなど、多くの歌手・作家をこの系譜に並べている。ボカロ系の作家たちにも、この呼び名が援用されることがある。ただしそれは音の定義というより、渋谷系の感覚を持った作家たちが、オタク文化の場で活動している姿を指す、ゆるい呼び名のままだ。</p>
