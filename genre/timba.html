<h1>Timba（ティンバ）とは</h1>
<p>1980年代後半のキューバで生まれ、1990年代に爆発的に広まった、極めて複雑で攻撃的なダンス音楽である。伝統的なソンやサルサの枠組みを土台にしながら、そこへアメリカのファンクやジャズ、R&amp;Bの語法を取り入れ、ロックやラップの要素</p>
<p>1980年代後半のキューバで生まれ、1990年代に爆発的に広まった、極めて複雑で攻撃的なダンス音楽である。伝統的なソンやサルサの枠組みを土台にしながら、そこへアメリカのファンクやジャズ、R&amp;Bの語法を取り入れ、ロックやラップの要素も少し混ざる。最大の特徴はベースの扱いで、従来のラテン音楽が守ってきた、拍の頭を鳴らさず前後にずらすという定型を破り、切り分けたファンクのような跳ねる音型や、スラップ奏法による打楽器的な演奏が用いられる。打楽器の層も厚く、コンガ、ティンバレス、ボンゴに加えてドラムセットが導入され、それぞれが独立した複雑な音型を同時に刻む。金管楽器は大人数で、極めて速く難度の高い斉奏を決める。構成に独特の緊張と解放の設計があり、歌の部分の後に訪れる掛け合いの区間で、演奏が段階的に密度を増していき、最後に全員が一斉に爆発する場所が設けられる。この最高潮の部分は、踊り手が最も激しく動く瞬間として機能する。和声はジャズ由来の複雑な積み方をし、転調も多い。歌詞は恋愛のほか、経済危機下の日常、皮肉、俗語による社会風刺を扱い、極めて現地的で外国人には理解しにくい。</p>
<h2>成り立ち</h2><p>背景には、1990年代のキューバが直面した未曾有の経済危機がある。1980年代末からソビエト連邦の援助が縮小しはじめ、1990年にキューバ政府は「平時における特別期間」と称する耐乏政策を宣言し、1991年のソ連崩壊で危機は決定的になった。食料も燃料も電力も不足し、人々の生活は極限まで切り詰められる。この状況下で政府は観光業に活路を求め、外国人観光客を受け入れるホテルやクラブが整備された。音楽家にとって、そこで演奏することは外貨を得る主要な手段の一つであり、激しい競争が生まれた。1980年代末に生まれたティンバは、観光ブームの下で1990年代に主流になっていった。観光客と地元の踊り手の双方を圧倒するために、演奏はより速く、より複雑に、より派手になっていった。中心の一つはJosé Luis Cortésが率いたNG La Bandaで、一般に最初のティンバ・バンドと見なされ、ジャズの訓練を受けた管楽器奏者を集め、超絶的な斉奏を武器にした。先行する楽団にLos Van VanやIrakereがあり、ティンバの爆発的な流行はCharanga Habaneraの1992年のデビュー作から始まったとされる。続いてLos Van Vanが、既に1969年から活動していた古参でありながら大胆に音を更新し、Juan Formellの指揮のもとで国民的な人気を保ち続けた。1990年代半ばにはIssac Delgado、Manolín、Charanga Habaneraといった集団が競い合った。歌詞は次第に大胆になり、外貨を持つ者と持たない者の格差、観光客との関係、闇市場といった、公式には語られない現実を俗語で描き出したため、当局との緊張も生じた。実際、内容を問題視されて放送を禁じられた楽曲や、活動を制限された音楽家も存在する。2000年代以降は、演奏者の国外移住やレゲトンの流行など複数の要因が指摘される中で、往時の勢いは失われた。それでも演奏水準の高さは国際的に高く評価され、キューバ音楽の最も先鋭的な到達点として位置づけられている。</p>
<h2>代表曲</h2><ul><li>Qué Pasa Loco (Issac Delgado)</li><li>El Temba (Charanga Habanera)</li><li>Te Deseo Suerte (Paulito FG)</li><li>Soy Cubano, Soy Popular (Charanga Habanera)</li><li>La Sandunguera (Los Van Van)</li><li>La Bruja (NG La Banda)</li><li>Santa Palabra (NG La Banda)</li><li>La Calentura (Manolín el Médico de la Salsa)</li><li>La Expresiva (NG La Banda)</li><li>Los Tanques (NG La Banda)</li><li>Un Tipo Como Yo (NG La Banda)</li><li>El Tragico (NG La Banda)</li></ul>
