<h1>Timba（ティンバ）とは</h1>
<p>ティンバは、1980年代後半のキューバで生まれ、1990年代に爆発的に広まったダンス音楽だ。とても複雑で、攻撃的なほど激しい。伝統的なソンやサルサの枠組みを土台にしている。そこへアメリカのファンクやジャズ、R&amp;Bの表現を取り入れ、</p>
<p>ティンバは、1980年代後半のキューバで生まれ、1990年代に爆発的に広まったダンス音楽だ。とても複雑で、攻撃的なほど激しい。伝統的なソンやサルサの枠組みを土台にしている。そこへアメリカのファンクやジャズ、R&amp;Bの表現を取り入れ、ロックやラップの要素も少し混ざる。

いちばんの特徴は、ベースの扱いだ。従来のラテン音楽が守ってきた、拍の頭を鳴らさず前後にずらすという定型は、時々使われる。しかし多いのは、曲ごとに作る、クラーベに整合した型のtumbaoだ。tumbaoを止めたり始めたりして、ギアの切り替えを作る。ファンク由来のスラップとプルも取り入れられ、スラップ奏法による打楽器のような演奏が使われる。

打楽器の層も厚い。コンガ、ティンバレス、ボンゴに加えてドラムセットが入り、それぞれが独立した複雑なリズムを同時に刻む。管楽器は、トランペット、トロンボーンにサックスを加えた拡大ホーン・セクションだ。極めて速く、難しい斉奏を決める。

和音はジャズ由来の複雑な重ね方をし、長調と短調の行き来が多い。

歌詞は恋愛のほか、経済危機の中の日常、皮肉、俗語による社会風刺を扱う。

曲の組み立てには、独特の緊張と解放の仕掛けがある。歌の部分の後には、掛け合いの区間、モントゥーノが来る。ここでは、ギアやブレイクを頻繁に切り替える。presiónのように、突然新しい素材へ突入して高揚を作る区間がある。この最高潮の部分は、踊り手が最も激しく動く瞬間になる。</p>
<h2>成り立ち</h2><p>背景にあるのは、1990年代のキューバが直面した、前例のない経済危機だ。

1980年代末から、ソビエト連邦の援助が縮みはじめた。1990年にはカストロが『平時の特別期間』に入ると表明し、1991年のソ連崩壊で危機は決定的になった。食料も燃料も電力も足りず、人々の暮らしは極限まで切り詰められた。

そこで政府は、観光業に活路を求めた。外国人観光客を受け入れるホテルやクラブが整えられた。音楽家にとって、そこで演奏することは外貨を得る主な手段の一つで、激しい競争が生まれた。1980年代末に生まれたティンバは、この観光ブームの下で、1990年代に主流になっていった。観光ブームが市場を広げたのだ。

中心の一つは、José Luis Cortésが率いたNG La Bandaだった。一般に最初のティンバ・バンドと見なされている。ジャズ界出身の奏者を集めた。先行する楽団には、Los Van VanやIrakereがあった。そして、Charanga Habaneraの1992年の『Me sube la fiebre』が、ティンバ爆発のきっかけになった作品とされる。

続いてLos Van Vanが、1969年から活動していた古参でありながら、大胆に音を新しくした。Juan Formellの指揮のもとで、国民的な人気を保ち続けた。1990年代半ばには、Issac Delgado、Manolín、Charanga Habaneraといった顔ぶれが競い合った。

一方で、歌詞は次第に大胆になった。外貨を持つ者と持たない者の格差、観光客との関係、売春や犯罪など、公式には語られない現実を俗語で描き出した。そのため、当局との緊張も生まれた。実際、内容を問題視されて放送を禁じられた曲や、活動を制限された音楽家もいる。

やがて、演奏者の国外移住やレゲトンの流行など、いくつもの要因が重なる中で、ティンバはピークを過ぎた。それでも演奏の水準の高さは国際的に高く評価され、キューバのポピュラー音楽の中でも革新的で攻撃的なジャンルと評される。</p>
