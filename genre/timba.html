<h1>Timba（ティンバ）とは</h1>
<p>1990年代のキューバで生まれた、極めて複雑で攻撃的なダンス音楽である。伝統的なソンやサルサの枠組みを土台にしながら、そこへアメリカのファンクやジャズフュージョン、ヒップホップの語法を大量に持ち込んでいる。最大の特徴はベースの扱い</p>
<p>1990年代のキューバで生まれた、極めて複雑で攻撃的なダンス音楽である。伝統的なソンやサルサの枠組みを土台にしながら、そこへアメリカのファンクやジャズフュージョン、ヒップホップの語法を大量に持ち込んでいる。最大の特徴はベースの扱いで、従来のラテン音楽が守ってきた、拍の頭を鳴らさず前後にずらすという定型を破り、切り分けたファンクのような跳ねる音型や、スラップ奏法による打楽器的な演奏が用いられる。打楽器の層も厚く、コンガ、ティンバレス、ボンゴに加えてドラムセットが導入され、それぞれが独立した複雑な音型を同時に刻む。金管楽器は大人数で、極めて速く難度の高い斉奏を決める。構成に独特の緊張と解放の設計があり、歌の部分の後に訪れる掛け合いの区間で、演奏が段階的に密度を増していき、最後に全員が一斉に爆発する場所が設けられる。この最高潮の部分は現地でスペイン語の呼び名を持ち、踊り手が最も激しく動く瞬間として機能する。和声はジャズ由来の複雑な積み方をし、転調も多い。歌詞は恋愛のほか、経済危機下の日常、皮肉、俗語による社会風刺を扱い、極めて現地的で外国人には理解しにくい。</p>
<h2>成り立ち</h2><p>背景には、1990年代のキューバが直面した未曾有の経済危機がある。1991年のソビエト連邦崩壊により、それまで経済を支えていた援助と貿易が一夜にして消滅し、キューバ政府は平時における特別期間と称する耐乏政策を敷いた。食料も燃料も電力も不足し、人々の生活は極限まで切り詰められる。この状況下で政府は観光業に活路を求め、外国人観光客を受け入れるホテルやクラブが整備された。音楽家にとって、そこで演奏することは外貨を得るほぼ唯一の手段であり、激しい競争が生まれた。ティンバはこの競争の中で鍛えられた音楽である。観光客と地元の踊り手の双方を圧倒するために、演奏はより速く、より複雑に、より派手になっていった。中心となったのはJosé Luis Cortésが率いたNG La Bandaで、ジャズの訓練を受けた管楽器奏者を集め、超絶的な斉奏を武器にこの様式の骨格を作った。続いてLos Van Vanが、既に1969年から活動していた古参でありながら大胆に音を更新し、Juan Formellの指揮のもとで国民的な人気を保ち続けた。1990年代半ばにはIssac Delgado、Manolín、Charanga Habaneraといった集団が競い合い、テレビや録音よりも生の演奏の場で勝負が決まるという独特の文化が形成された。歌詞は次第に大胆になり、外貨を持つ者と持たない者の格差、観光客との関係、闇市場といった、公式には語られない現実を俗語で描き出したため、当局との緊張も生じた。実際、内容を問題視されて放送を禁じられた楽曲や、活動を制限された音楽家も存在する。2000年代以降は、多くの演奏者が国外へ移住し、またレゲトンの流行によって若者の関心が移ったため、往時の勢いは失われた。それでも演奏水準の高さは国際的に高く評価され、キューバ音楽の最も先鋭的な到達点として位置づけられている。</p>
