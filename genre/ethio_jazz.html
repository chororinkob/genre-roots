<h1>Ethio-Jazz（エチオジャズ）とは</h1>
<p>エチオピアの伝統的な音階と、ジャズやファンク、ラテン音楽のリズムを結合させた音楽である。決定的な特徴は旋律の骨格にある。エチオピアの音楽は独自の五音音階の体系を持ち、そのうちのひとつは半音の位置が西洋の音階と大きく異なるため、聴き</p>
<p>エチオピアの伝統的な音階と、ジャズやファンク、ラテン音楽のリズムを結合させた音楽である。決定的な特徴は旋律の骨格にある。エチオピアの音楽は独自の五音音階の体系を持ち、そのうちのひとつは半音の位置が西洋の音階と大きく異なるため、聴き慣れない耳には調子外れにも、あるいは深い哀愁にも聞こえる。この、どこにも属さない浮遊した響きが、この音楽を一瞬で識別させる。編成はジャズの楽団に近く、サックスとトランペットによる管楽器隊、電子オルガン、エレクトリックギター、低音楽器、ドラムから成り、しばしば鉄琴が加えられる。リズムはジャズの跳ねた刻みだけでなく、ファンクの粘る躍動や、ラテン音楽の跳ねた二拍子が用いられ、そこにエチオピア固有の不均等な拍節が混ざる。テンポは緩やかなものが多く、間奏では管楽器や鍵盤が長い独奏を展開する。歌が入る場合、歌唱は喉を細かく震わせる独特の装飾を伴い、アムハラ語で歌われる。歌詞は郷愁、恋愛、そして社会への暗示を扱う。全体として、都会的で洗練されていながら、どこか陰鬱で謎めいた空気が一貫している。</p>
<h2>成り立ち</h2><p>この音楽の中心人物はMulatu Astatkeである。彼は1940年代にエチオピアで生まれ、工学を学ぶために送られたイギリスで音楽へ転じ、ロンドンの音楽学校を経て、アメリカのバークリー音楽院に初のアフリカ出身の学生として学んだ。ニューヨークでラテン・ジャズに深く触れた彼は、帰国後、エチオピアの音階をジャズの和声とラテンのリズムの上に載せるという構想を実行に移す。同じく決定的だったのがAmha Esheteという実業家である。当時のエチオピアには、1948年に皇帝の名で発せられた、録音産業を国家の管理下に置く法令が生きていた。彼はこれを事実上無視して私設のレーベルを立ち上げ、処罰を覚悟のうえで大量の録音を世に出した。この蛮勇がなければ、この時代の音楽はほとんど残らなかったはずである。1960年代末から1970年代前半にかけて、首都アディスアベバの夜の社交場は活況を呈した。Mahmoud AhmedやAlèmayèhu Eshèté、Tilahun Gessesseといった歌手が人気を博し、Getatchew Mekuryaは古い戦いの掛け声を模した激烈なサックスの奏法を編み出している。この黄金期は突然終わった。1974年、皇帝Haile Selassieが軍事評議会によって退位させられ、社会主義体制が敷かれると、夜間外出禁止令によって社交場は閉鎖される。続く数年間、政権による大規模な粛清が行われ、多数の若者が殺害された。音楽家の多くは国外へ逃れるか沈黙を強いられ、この分野は事実上壊滅する。復活は思わぬ形で訪れた。1990年代後半、フランスのFrancis Falcetoが、当時の録音を発掘して国際的な編集盤の連作を開始したのである。これによってエチオピアの音楽は世界中の聴き手に発見された。2005年にはアメリカの映画がMulatu Astatkeの楽曲を全面的に用い、彼は60代にして国際的な名声を得るに至っている。</p>
