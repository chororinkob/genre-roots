<h1>Ethio-Jazz（エチオジャズ）とは</h1>
<p>エチオピアの伝統的な音階に、ジャズやファンク、ラテン音楽のリズムを組み合わせた音楽だ。 編成はジャズの楽団に近い。ビブラフォン、サックス、電気鍵盤（Fender Rhodes）、ギター、ベース、ドラム、ラテン・パーカッションから成</p>
<p>エチオピアの伝統的な音階に、ジャズやファンク、ラテン音楽のリズムを組み合わせた音楽だ。

編成はジャズの楽団に近い。ビブラフォン、サックス、電気鍵盤（Fender Rhodes）、ギター、ベース、ドラム、ラテン・パーカッションから成る。ただし、編成は奏者やバンドで異なる。

決め手となる特徴は、メロディーの骨組みにある。エチオピアの音楽は独自の5音音階の体系を持ち、主要な音階は4つある。その多くは、西洋の音階と半音の位置が異なる。Tizita majorのように、西洋と同じものもある。そのため、聴き慣れない耳には調子外れにも、深い哀愁にも聞こえる。このどこにも属さない浮遊した響きで、この音楽はひと聴きでそれと分かる。

リズムは、ジャズの跳ねた刻みだけではない。ファンクの粘る躍動や、ラテン音楽のリズムも取り入れられている。そこに、アフリカ的なポリリズムの感覚が混ざる。テンポは緩やかな曲も多いが、アップテンポのファンク寄りの曲も多い。間奏では、管楽器や鍵盤が独奏を展開することもある。

歌入りの曲では、アムハラ語が中心だ。歌詞は郷愁や恋愛、そして社会への暗示を扱う。

全体を通して、都会的で洗練されていながら、どこか陰鬱で謎めいた空気が漂っている。</p>
<h2>成り立ち</h2><p>この音楽をまとめ上げ、世界へ広めるうえで中心となった人物はMulatu Astatkeだ。「エチオ・ジャズの父」と呼ばれる。起源を1950年代のアルメニア系の音楽家Nerses Nalbandianらに遡る見方もある。スタイルとしては、1960年頃にMulatu Astatkeが固めた。

彼は1940年代にエチオピアで生まれた。工学を学ぶためにイギリスへ送られたが、そこで音楽へ転じる。ロンドンの音楽学校を経て、アメリカのバークリー音楽院で、初のアフリカ出身の学生として学んだ。ニューヨークでは、ラテン・ジャズに深く触れた。そして、エチオピアの音階をジャズの和声とラテンのリズムの上に載せるという構想を実行に移す。最初のレコードは、1966年にニューヨークで録音された。

同じく重要だったのが、Amha Esheteという実業家だ。当時のエチオピアでは、1948年に皇帝の名で出された勅令が生きていた。音楽の出版と流通の独占を、愛国協会Hager Fikirに与えるものだ。彼はこれを事実上無視して、1969年に私設のレーベルAmha Recordsを立ち上げ、大量の録音を世に出した。Amha Recordsが先駆けとなり、KaifaやPhilips-Ethiopiaがそれに続いた。

1960年代末から1970年代前半にかけて、首都アディスアベバの夜の社交場はにぎわった。Mahmoud AhmedやAlèmayèhu Eshèté、Tilahun Gessesseといった歌手が人気を集めた。Getatchew Mekuryaは、アムハラの戦士の歌shellelaを楽器の曲にした最初期の奏者のひとりで、激しいサックスの吹き方で知られる。

しかし、この黄金期は突然終わる。1974年、皇帝Haile Selassieが軍事評議会によって退位させられ、社会主義体制が敷かれた。夜間外出禁止令によって、社交場は閉鎖される。続く1976〜78年の赤色テロで、多数の若者が殺された。音楽家の多くが国外へ出るか活動を制限され、夜の演奏文化は大きく縮小した。

復活は、思わぬ形で訪れた。1986年のMahmoud Ahmed『Ere Mela Mela』の再発に続き、1997年、フランスのFrancis Falcetoが当時の録音を発掘し、国際的な編集盤の連作『Éthiopiques』を始めたのである。これによって、エチオピアの音楽は本格的に広まった。2005年には、アメリカの映画『Broken Flowers』がMulatu Astatkeの曲を複数使った。彼は60代にして、国際的な名声を得るに至っている。</p>
