<h1>Merseybeat（マージービート）とは</h1>
<p>マージービートは、ロックンロールやR&amp;Bに共通するバックビート（2・4拍を強く打つリズム）を基本に、しばしば4/4拍子の全拍を強調した音楽だ。明るく覚えやすい旋律を持つ、ギター主体のバンド音楽である。 編成は、リードギター、リズム</p>
<p>マージービートは、ロックンロールやR&amp;Bに共通するバックビート（2・4拍を強く打つリズム）を基本に、しばしば4/4拍子の全拍を強調した音楽だ。明るく覚えやすい旋律を持つ、ギター主体のバンド音楽である。

編成は、リードギター、リズムギター、ベース、ドラムスというシンプルな4人組が標準だ。アンプは、ヴォックスAC30が、当時の英国ビート・グループに好まれたアンプの一つだった。とくにザ・サーチャーズが鳴らした、12弦ギター風の金属的なジャングル・サウンドは、このジャンルのトレードマークとなる音色の一つになった。初期は6弦ギター2本の重ねで、のちにリッケンバッカーの12弦ギターを使った。

リズムは、ロックンロールやリズム・アンド・ブルース由来の裏拍アクセントを受け継ぐ。ドラムスはスネアとハイハットを休みなく刻むことが多い。ベースは規則的に着実に進み、ギターのストロークやドラムと相互に絡んでビートを作る。

メロディーは明るく覚えやすい。1950〜60年代のポップスで広く使われた進行も用いられる。

ボーカルは、リードとバックのクローズハーモニー（音の近い声を重ねたハーモニー）を柱にする。バッキングには、ドゥーワップ（コーラスで添える掛け声の歌い方）風の「ウー」「ワッ」といった掛け声が重なる。歌唱は、声を張り上げるというより、弾ませるように明るい。サビには、誰もが口ずさめる単純明快なフック（耳に残る部分）が置かれる。

歌詞は、恋愛や片思い、友情といった若者の日常が中心だ。悲恋を歌っても、暗い色よりも淡い色合いである。

曲は、イントロのギターリフで一気に掴む曲が多い。2〜3分のシングルの中で、Aメロ・Bメロ・サビを駆け抜ける構成が常套とされる。

リズム・アンド・ブルース系バンドのような粘っこい低音の唸りは薄い。ロカビリーの跳ねる軽快さと、ポップな甘さの中間にあるのが表情である。演奏の現場は、ダンスホールやキャバーン・クラブのような小さな会場だった。観客が手拍子を取り、ステージ前面で踊り込むスタイルとともに磨かれたと言われる。</p>
<h2>成り立ち</h2><p>発祥は、1950年代後半から1960年代初頭のイングランド北西部だ。マージー川に面する港町リバプールで、このジャンルは生まれた。

土壌となったのは、スキッフル（手作り楽器で演奏する素朴な音楽）・ブームだった。ロニー・ドネガンの「Rock Island Line」の大ヒットに触発された少年たちが、次々とバンドを結成した。ジョン・レノンが1956年に結成した（資料により1957年とも。初の公開演奏は1957年6月22日）クオリーメンは、のちにザ・ビートルズへ発展した。

スキッフル熱が下火になると、リバプールには、ロックンロールとリズム・アンド・ブルースをコンパクトに仕上げ直したギター・バンドが、群れをなして現れた。キャバーン・クラブの司会を長く務めたDJボブ・ウーラーとビル・ハリーが、バンドのリストを作った。ハリーの回想では、マージーサイド地域だけで350組超が挙がったという。ウーラーの推定では約350組である。

演奏の場は、ジャズの拠点だったキャバーン・クラブやダンスホールだった。ハンブルクのクラブ(Indra、Kaiserkeller、Top Ten、スター・クラブなど)への長期出演もあり、遠征はバンドの技術と持ち曲を鍛えた。リンゴ・スターをドラムに擁したロリー・ストーム&amp;ザ・ハリケーンズは、当時のクラブ・サーキットで高い人気を誇っていた。

シーンを束ねたのは、音楽紙マージー・ビートだ。ジョン・レノンの美術学校の同級生ビル・ハリーが、1961年7月6日に創刊した。名称は、警官の巡回区域（beat）から名付けた。音楽のビートとは無関係だったと、創刊者が述べている。地元バンドの紹介を載せ続けて、発行部数は75,000部に達し、「ティーンエイジャーのバイブル」と呼ばれた。この紙を通じてファッション記事を書いていた女性歌手が、のちのシラ・ブラックである。

レコード店NEMSを営むブライアン・エプスタインが、キャバーンのビートルズに目をつけて、マネジメントを開始した。プロデューサーのジョージ・マーティンの手で、パーロフォンから1962年10月に、デビューシングル「Love Me Do」を発表する。1963年4月には、公式チャートで、ジェリー&amp;ザ・ペースメイカーズが「How Do You Do It?」で、ビートルズに先立つ全英1位を獲得した。同年、マージービートは全英チャートを席巻した。

1964年2月のエド・サリヴァン・ショー出演を機に、ブリティッシュ・インヴェイジョンが起こった。ザ・サーチャーズやビリー・J・クレイマー&amp;ザ・ダコタス、ザ・スウィンギング・ブルー・ジーンズらが、アメリカでも成功した。ザ・マージービーツは1964年に米国ツアーを行った。

だが、全盛期は短かった。1960年代半ばから後半にかけて衰退し、持ち歌をカバー曲に頼るスタイルが飽きられた。自作歌曲への要請と、サイケデリア（幻覚的な感覚を思わせる音楽）やフォークが人気を集めたことに対応できないバンドが、淘汰された。発祥地のリバプールから有力バンドが流出して、シーンは空洞化した。1960年代後半には、ブルース・ロックの前で時代遅れとみなされるまでになった。

一方で、影響は大きかった。ザ・サーチャーズの12弦ギター風の音色は、ザ・バーズ（マッギンは映画『ハード・デイズ・ナイト』のジョージ・ハリスンの12弦ギターに刺激を受けて採用したが、サーチャーズも影響源の一つとされる）を経た。バーズの12弦採用の直接の契機はハリスンだ。サーチャーズも影響の一つとされる。この音色は、ジャングル・ポップとフォークロックの手法となった。メロディックなギター・ポップの系譜は、パワー・ポップや後年のブリットポップ、日本のグループ・サウンズへも受け継がれた（英国ビートに加え、ベンチャーズ由来のエレキ・ブームの影響も大きい）。</p>
