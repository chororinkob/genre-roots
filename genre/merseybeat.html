<h1>Merseybeat（マージービート）とは</h1>
<p>マージービートの音の骨格は、4分の4拍子の4拍すべてを力強く叩き込む推進型のバックビートだ。ロックンロールやリズム・アンド・ブルース由来の裏拍アクセントを受け継ぎつつ、ドラムスがスネアとハイハットを休みなく刻み、ベースはホフナー型</p>
<p>マージービートの音の骨格は、4分の4拍子の4拍すべてを力強く叩き込む推進型のバックビートだ。ロックンロールやリズム・アンド・ブルース由来の裏拍アクセントを受け継ぎつつ、ドラムスがスネアとハイハットを休みなく刻み、ベースはホフナー型の短尺ベースがルート音を土台にメロディアスに動く。編成はリードギター、リズムギター、ベース、ドラムスというギター主体のシンプルな4人組が標準で、アンプはヴォックスAC30が定番、リードギターにはギブソンやリッケンバッカーが好まれた。とくにザ・サーチャーズが鳴らしたリッケンバッカー12弦ギターの金属的なジャングル・サウンドは、このジャンルを象徴する音色の一つになった。ハーモニカやタンバリンが彩りに加わることも多い。メロディーは明るく覚えやすく、I–vi–IV–Vの循環コードや簡素化したブルース進行を基盤に、イントロのギターリフで一気に掴み、2〜3分のシングルの中でAメロ・Bメロ・サビを駆け抜ける構成が常套だ。ボーカルはリードとバックのクローズハーモニーを柱に、バッキングにはドゥーワップ風の「ウー」「ワッ」といった掛け声が重なる。歌唱は声を張り上げるというより弾ませるように明るく、サビには誰もが口ずさめる単純明快なフックが置かれる。歌詞は恋愛や片思い、友情といった若者の日常が中心で、悲恋を歌っても暗色よりも淡い色合いだ。リズム・アンド・ブルース系バンドのような粘っこい低音の唸りは薄く、ロカビリーの跳ねる軽快さとポップな甘さの中間にあるのが表情である。演奏の現場はダンスホールやキャバーン・クラブのような小さな会場で、観客が手拍子を取りステージ前面で踊り込むスタイルとともに磨かれた。</p>
<h2>成り立ち</h2><p>発祥は1950年代後半から1960年代初頭のイングランド北西部、マージー川に面する港町リバプールだ。土壌となったのはスキッフル・ブームで、ロニー・ドネガンの「Rock Island Line」の大ヒットに触発された少年たちが次々とバンドを結成し、ジョン・レノンが1957年に始めたクオリーメンがのちにザ・ビートルズへ発展した。スキッフル熱が下火になると、リバプールにはロックンロールとリズム・アンド・ブルースをコンパクトに仕上げ直したギター・バンドが群れをなして現れ、キャバーン・クラブの司会を長く務めたDJボブ・ウーラーの推計では、マージーサイド地域だけで約350組が活動していたという。演奏の場はジャズの拠点だったキャバーン・クラブやダンスホール、ハンブルクのスター・クラブへの長期契約出演で、遠征はバンドの技術とレパートリーを鍛えた。リンゴ・スターをドラムに擁したルーリー・ストーム&amp;ザ・ハリケーンズは、当時のクラブ・サーキットで高い人気を誇っていた。シーンを束ねたのは、ジョン・レノンの美術学校の同級生ビル・ハリーが1961年7月6日に創刊した音楽紙マージー・ビートだ。名称は音楽のビートではなく警官の巡回区域（beat）から取ったとされ、地元バンドの紹介を載せ続けて発行部数は75,000部に達し、「ティーンエイジャーのバイブル」と呼ばれた。この紙を通じてファッション記事を書いていた女性歌手がのちのシラ・ブラックである。レコード店NEMSを営むブライアン・エプスタインがキャバーンのビートルズに目をつけてマネジメントを開始し、プロデューサーのジョージ・マーティンの手でパーロフォンから1962年10月にデビューシングル「Love Me Do」を発表する。1963年4月にはジェリー&amp;ザ・ペースメイカーズが「How Do You Do It?」でビートルズに先立つ全英1位を獲得し、同年マージービートは全英チャートを席巻した。1964年2月のエド・サリヴァン・ショー出演を機にブリティッシュ・インヴェイジョンが起こり、ザ・サーチャーズやビリー・J・クレイマー&amp;ザ・ダコタス、ザ・スウィンギング・ブルー・ジーンズ、ザ・マージービーツ、ザ・フォーモストらがアメリカへも波及した。だが全盛期は短く、1965年ごろには過酷な公演日程で疲弊し、持ち歌をカバー曲に頼るスタイルが飽きられ、自作歌曲への要請とサイケデリアやフォークの台頭に対応できないバンドが淘汰された。発祥地のリバプールから有力バンドが流出してシーンは空洞化し、1960年代後半にはブルース・ロックの前で時代遅れとみなされるまでになった。一方で影響は大きく、ザ・サーチャーズの12弦ギターの音色はザ・バーズを経てジャングル・ポップとフォークロックの語法となり、メロディックなギター・ポップの系譜はパワー・ポップや後年のブリットポップ、日本のグループ・サウンズへも受け継がれた。</p>
<h2>代表曲</h2><ul><li>Love Me Do (The Beatles)</li><li>How Do You Do It? (Gerry and the Pacemakers)</li><li>Sweets for My Sweet (The Searchers)</li><li>Needles and Pins (The Searchers)</li><li>From Me to You (The Beatles)</li><li>Hippy Hippy Shake (The Swinging Blue Jeans)</li><li>Bad to Me (Billy J. Kramer with The Dakotas)</li><li>Ferry Cross the Mersey (Gerry and the Pacemakers)</li><li>I Think of You (The Merseybeats)</li><li>A Little Loving (The Fourmost)</li></ul>
