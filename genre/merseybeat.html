<h1>Merseybeat（マージービート）とは</h1>
<p>マージービートの音の骨格は、ロックンロールやリズム・アンド・ブルースに共通するバックビート（2・4拍を強く打つリズム）を基本に、しばしば4分の4拍子の全拍を強調する推進型のリズムだ。ロックンロールやリズム・アンド・ブルース由来の裏</p>
<p>マージービートの音の骨格は、ロックンロールやリズム・アンド・ブルースに共通するバックビート（2・4拍を強く打つリズム）を基本に、しばしば4分の4拍子の全拍を強調する推進型のリズムだ。ロックンロールやリズム・アンド・ブルース由来の裏拍アクセントを受け継ぎつつ、ドラムスはスネアで不変の4拍のオフビートを刻み、ベースは規則的に着実に進み、ギターのストロークやドラムと絡んでビートを作る。編成はリードギター、リズムギター、ベース、ドラムスというギター主体のシンプルな4人組が標準で、アンプは当時の英国ビート・グループに好まれたヴォックスAC30などが使われた。とくにザ・サーチャーズが鳴らした12弦ギター風の（初期は6弦ギター2本の重ねで、のちにリッケンバッカーの12弦ギターを使った）金属的なジャングル・サウンドは、このジャンルを象徴する音色の一つになった。メロディーは明るく覚えやすく、1950〜60年代のポップスで広く使われたI–vi–IV–Vの循環コード（4つの和音を繰り返す進行）なども用いられ、2〜3分のシングルの中で展開する。ボーカルはリードとバックのクローズハーモニー（音の近い声を重ねたハーモニー）を柱に、バッキングにはドゥーワップ（コーラスで添える掛け声の歌い方）風の「ウー」「ワッ」といった掛け声が重なる。歌唱は声を張り上げるというより弾ませるように明るく、サビには誰もが口ずさめる単純明快なフック（耳に残る部分）が置かれる。歌詞は恋愛や片思い、友情といった若者の日常が中心で、悲恋を歌っても暗色よりも淡い色合いだ。リズム・アンド・ブルース系バンドのような粘っこい低音の唸りは薄く、ロカビリーの跳ねる軽快さとポップな甘さの中間にあるのが表情である。演奏の現場はダンスホールやキャバーン・クラブのような小さな会場だった。</p>
<h2>成り立ち</h2><p>発祥は1950年代後半から1960年代初頭のイングランド北西部、マージー川に面する港町リバプールだ。土壌となったのはスキッフル（手作り楽器で演奏する素朴な音楽）・ブームで、ロニー・ドネガンの「Rock Island Line」の大ヒットに触発された少年たちが次々とバンドを結成し、ジョン・レノンが1956年に結成した（資料により1957年とも。初の公開演奏は1957年6月22日）クオリーメンがのちにザ・ビートルズへ発展した。スキッフル熱が下火になると、リバプールにはロックンロールとリズム・アンド・ブルースをコンパクトに仕上げ直したギター・バンドが群れをなして現れ、キャバーン・クラブの司会を長く務めたDJボブ・ウーラーとビル・ハリーが作ったリストには、ハリーの回想では350組を超える、ウーラーの推定では約350組のバンドが、マージーサイド地域だけで挙がったという。演奏の場はジャズの拠点だったキャバーン・クラブやダンスホール、ハンブルクのクラブ（Indra、Kaiserkeller、Top Ten、スター・クラブなど）への長期出演で、遠征はバンドの技術と持ち曲を鍛えた。リンゴ・スターをドラムに擁したロリー・ストーム&amp;ザ・ハリケーンズは、当時のクラブ・サーキットで高い人気を誇っていた。シーンを束ねたのは、ジョン・レノンの美術学校の同級生ビル・ハリーが1961年7月6日に創刊した音楽紙マージー・ビートだ。名称は、警官の巡回区域（beat）から名付けたもので、音楽のビートとは無関係だったと創刊者のハリーが述べている。地元バンドの紹介を載せ続けて発行部数は75,000部に達したとされ、「ティーンエイジャーのバイブル」と呼ばれた。この紙を通じてファッション記事を書いていた女性歌手がのちのシラ・ブラックである。レコード店NEMSを営むブライアン・エプスタインがキャバーンのビートルズに目をつけてマネジメントを開始し、プロデューサーのジョージ・マーティンの手でパーロフォンから1962年10月にデビューシングル「Love Me Do」を発表する。1963年4月には、公式チャートでジェリー&amp;ザ・ペースメイカーズが「How Do You Do It?」でビートルズに先立つ全英1位を獲得し、同年マージービートは全英チャートを席巻した。1964年2月のエド・サリヴァン・ショー出演を機にブリティッシュ・インヴェイジョンが起こり、ザ・サーチャーズやビリー・J・クレイマー&amp;ザ・ダコタス、ザ・スウィンギング・ブルー・ジーンズらがアメリカでも成功し、ザ・マージービーツは1964年に米国ツアーを行った。だが全盛期は短く、1960年代半ばから後半にかけて衰退し、サイケデリア（幻覚的な感覚を思わせる音楽）やシンガーソングライターの台頭に対応できないバンドが淘汰された。発祥地のリバプールから有力バンドが流出してシーンは空洞化し、1960年代後半にはブルース・ロックの前で時代遅れとみなされるまでになった。一方で影響は大きく、ザ・サーチャーズの12弦ギター風の音色は、ザ・バーズ（マッギンは映画『ハード・デイズ・ナイト』のジョージ・ハリスンの12弦ギターに刺激を受けて採用したが、サーチャーズも影響源の一つとされる）にも影響し、ジャングル・ポップとフォークロックの手法の一つとなり、メロディックなギター・ポップの系譜はパワー・ポップや後年のブリットポップ、日本のグループ・サウンズへも受け継がれた（ベンチャーズ由来のエレキ・ブームの影響も大きい）。</p>
