<h1>K-R&amp;Bとは</h1>
<p>この分野は、韓国語で歌われるリズム・アンド・ブルースだ。アメリカの同時代の流れを素早く取り入れるため、音のスタイルは時期によって大きく変わる。それでも、いくつか共通する特徴がある。 編曲は簡素だ。電気ピアノ、ギターの単音、そして深</p>
<p>この分野は、韓国語で歌われるリズム・アンド・ブルースだ。アメリカの同時代の流れを素早く取り入れるため、音のスタイルは時期によって大きく変わる。それでも、いくつか共通する特徴がある。

編曲は簡素だ。電気ピアノ、ギターの単音、そして深い残響をかけた効果音が置かれる程度に留められ、すき間がわざと残される傾向がある。このすき間が、歌を引き立てる。

和音は、ジャズ由来の和声を含む（複雑さは中程度）。雰囲気が次々に変わる和音の流れが好まれる。

リズムは、2010年代以降の作品では、トラップ由来のハイハットや低音が目立つ。テンポは比較的ゆったりしたものが多く、60から100 BPM前後とされることもある。

この分野の中心は歌い方だ。裏声を多く使い、一つの音節を複数の音程で飾る技法が用いられるとされる。さらに、韓国の大衆音楽が長く育ててきた、感情を込めて歌い上げるバラードの伝統が根底にある。抑えた編曲の中でも、感情の起伏は大きい。

歌詞は、恋愛の細やかな心の動き、孤独、自分の内面を扱う。比喩を凝らした文学的な表現が大切にされる傾向がある。</p>
<h2>成り立ち</h2><p>この分野の原型は、1990年代前半〜半ばにある。そして2010年代に入って、再び盛り上がった。

1992年、Seo Taiji and Boysが韓国の大衆音楽の仕組みを一変させた。その直後から、アメリカで育った韓国系の若者たちが韓国へ渡り、本場の発声と語法を持ち込み始める。

代表は3人組のSolidだ。1992年末に米国で結成され、1993年に韓国でデビューした。アメリカで身につけた滑らかな歌唱と和声を、韓国語に乗せた。1993年の最初のアルバムは大きなヒットにはならなかったが、1995年の2枚目で大きな成功を収めた。後に大手事務所を率いることになるPark Jin-youngも、1994年に歌手としてデビューしている。

1990年代後半から2000年代にかけて、この分野はアイドル音楽の中に吸収されていく。大手事務所は専属の制作者を抱え、リズム・アンド・ブルースの和声とダンス音楽を組み合わせた曲を量産したとされる。アイドル音楽には、R&amp;Bの語法が広く行き渡った。一方で、2001年にデビューしたBrown Eyesのように、アイドル音楽とは別枠で、商業的にも成功したR&amp;Bのグループも並び立っていた。

転機は2010年代だ。独立系や傘下のレーベルに所属する歌手が、配信市場を足場に人気を集めた。Zion.T、Crush、DEANといった作り手が、アメリカの同時代の実験的なリズム・アンド・ブルースを取り込みながら、韓国語ならではの語感を活かした曲を発表する。女性ではHeizeやBaek Yerinが、独自の地位を築いた。

この動きの土台となったのは、独立系として出発したAOMGやAmoeba Culture、そしてAOMG代表のJay Parkが2017年に設立したH1GHR MUSICといったレーベルだ。ただし2010年代後半には、大手資本との結びつきを強めた。AOMGは2016年にCJ E&amp;Mの出資を受け、戦略的提携を結んだ（買収とする見方もある）。Amoeba Cultureは、2017年にCJ E&amp;Mが買収した。

この分野には、固有の事情もある。男性には、兵役による活動の中断がある。また、市場が配信の順位表に強く左右される傾向があり、短い期間で成果を求められる圧力が大きいとされる。それでも、アイドル音楽の巨大な影の中で、歌唱と作曲そのもので評価される場として、機能し続けている。</p>
