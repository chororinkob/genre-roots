<h1>K-R&amp;Bとは</h1>
<p>韓国語で歌われるリズム・アンド・ブルースである。アメリカの同時代の潮流を素早く吸収するため、音の様式は時期によって大きく変わるが、いくつか共通する特徴がある。和声はジャズやネオソウルに由来する複雑な積み方を用い、四和音や九、11の</p>
<p>韓国語で歌われるリズム・アンド・ブルースである。アメリカの同時代の潮流を素早く吸収するため、音の様式は時期によって大きく変わるが、いくつか共通する特徴がある。和声はジャズやネオソウルに由来する複雑な積み方を用い、四和音や九、11の音を含む響き、そして色彩が次々に変わる進行が好まれる。リズムはトラップの影響を受けた細かい高音の刻みと、隙間の多い低音が中心で、テンポは概ね70から95 BPMと落ち着いている。編曲は簡素で、電気ピアノ、ギターの単音、そして深い残響をかけた効果音が置かれる程度に留められ、余白が意図的に残される。この余白が歌を際立たせる。歌唱がこの分野の核心で、裏声を多用し、一つの音節を複数の音程で装飾する技法が用いられる。ただし韓国語は英語と音節の構造が異なり、母音の連続が少ないため、装飾を乗せる位置の作り方に独自の工夫が発達した。加えて、韓国の大衆音楽が長く培ってきた、感情を込めて歌い上げるバラードの伝統が根底にあり、抑制された編曲の中でも情感の起伏は大きい。歌詞は恋愛の機微、孤独、自己の内面を扱い、比喩を凝らした文学的な表現が重んじられる。</p>
<h2>成り立ち</h2><p>起点は1990年代前半である。1992年にSeo Taiji and Boysが韓国の大衆音楽の構造を一変させた直後、アメリカで育った韓国系の若者たちが帰国し、本場の発声と語法を持ち込み始めた。1993年に結成された三人組Solidはその代表で、アメリカで培った滑らかな歌唱と和声を韓国語に乗せ、1995年の楽曲で大きな成功を収めた。この時期に、韓国語でリズム・アンド・ブルースを歌うことが可能だという認識が定着する。並行して、後に大手事務所を率いることになるPark Jin-youngが、歌手としても制作者としてもこの語法を広めた。1990年代後半から2000年代にかけて、この分野はアイドル音楽の内部に吸収されていく。大手事務所は専属の制作者を抱え、リズム・アンド・ブルースの和声とダンス音楽を組み合わせた楽曲を量産した。この過程で、独立した表現としてのリズム・アンド・ブルースは一時的に影が薄くなる。転機は2010年代である。大手に属さない制作者と歌手が、配信を通じて直接聴き手へ届く回路を得たことで、この分野は再び自律的な領域として立ち上がった。Zion.T、Crush、DEANといった作り手が、アメリカの同時代の実験的なリズム・アンド・ブルースを消化しながら、韓国語独自の語感を活かした楽曲を発表する。女性の側ではHeizeやBaek Yerinが独自の地位を確立した。AOMGやH1GHR MUSIC、Amoeba Cultureといった独立系の共同体が、この動きの基盤となっている。この分野には固有の事情もある。男性には兵役による活動の中断があり、また市場が配信の順位表に強く左右されるため、短期間で成果を求められる圧力が大きい。それでも、アイドル音楽の巨大な影の中で、歌唱と作曲そのもので評価される場として機能し続けている。</p>
