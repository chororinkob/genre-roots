<h1>K-R&amp;Bとは</h1>
<p>韓国語で歌われるリズム・アンド・ブルースである。アメリカの同時代の潮流を素早く吸収するため、音の様式は時期によって大きく変わるが、いくつか共通する特徴がある。和音はジャズやネオソウルに由来する複雑な重ね方をし、四和音や九、11の音</p>
<p>韓国語で歌われるリズム・アンド・ブルースである。アメリカの同時代の潮流を素早く吸収するため、音の様式は時期によって大きく変わるが、いくつか共通する特徴がある。和音はジャズやネオソウルに由来する複雑な重ね方をし、四和音や九、11の音を含む響き、そして雰囲気が次々に変わる和音の流れが好まれる。リズムはトラップの影響を受けた細かい高音の刻みと、隙間の多い低音が中心で、テンポは概ね60から100 BPM程度と落ち着いている。編曲は簡素で、電気ピアノ、ギターの単音、そして深い残響をかけた効果音が置かれる程度に留められ、すき間がわざと残される。このすき間が歌を際立たせる。歌い方がこの分野の中心で、裏声を多用し、一つの音節を複数の音程で装飾する技法が用いられる。加えて、韓国の大衆音楽が長く培ってきた、感情を込めて歌い上げるバラードの伝統が根底にあり、抑制された編曲の中でも情感の起伏は大きい。歌詞は恋愛の機微、孤独、自己の内面を扱い、比喩を凝らした文学的な表現が大切にされる。</p>
<h2>成り立ち</h2><p>原型は1990年代半ばにあり、2010年代に再び盛り上がった。1992年にSeo Taiji and Boysが韓国の大衆音楽の仕組みを一変させた直後、アメリカで育った韓国系の若者たちが韓国へ渡り、本場の発声と語法を持ち込み始めた。1993年に結成された3人組Solidはその代表で、アメリカで培った滑らかな歌唱と和声を韓国語に乗せ、1993年の最初のアルバムは売れなかったが、1995年の2枚目で大きな成功を収めた。後に大手事務所を率いることになるPark Jin-youngも、1994年に歌手としてデビューしている。1990年代後半から2000年代にかけて、この分野はアイドル音楽の内部に吸収されていく。大手事務所は専属の制作者を抱え、リズム・アンド・ブルースの和声とダンス音楽を組み合わせた楽曲を量産した。アイドル音楽にR&amp;Bの語法が広く浸透する一方で、2001年にデビューしたBrown Eyesのように、商業的にも成功した独立したR&amp;Bのグループも並び立っていた。転機は2010年代である。大手に属さない制作者と歌手が、配信を通じて直接聴き手へ届く回路を得たことで、この分野は再び自立した分野として立ち上がった。Zion.T、Crush、DEANといった作り手が、アメリカの同時代の実験的なリズム・アンド・ブルースを消化しながら、韓国語独自の語感を活かした楽曲を発表する。女性の側ではHeizeやBaek Yerinが独自の地位を確立した。独立系として出発したAOMGやH1GHR MUSIC、Amoeba Cultureといったレーベルが、この動きの基盤となったが、2010年代後半には大手資本との結びつきを強めた(AOMGは2016年にCJ E&amp;Mと提携し、Amoeba Cultureは2017年にCJ E&amp;Mが買収した)。この分野には固有の事情もある。男性には兵役による活動の中断があり、また市場が配信の順位表に強く左右されるため、短期間で成果を求められる圧力が大きい。それでも、アイドル音楽の巨大な影の中で、歌唱と作曲そのもので評価される場として機能し続けている。</p>
