<h1>Dōyōとは</h1>
<p>童謡は、子どものために詩人と作曲家が新作として書いた日本の創作歌曲である。代表曲22曲を動画で聴け、ルーツと影響のつながりを地図でたどれる。</p>
<p>童謡は、子どものために詩人と作曲家が新作として書いた日本の創作歌曲である。口伝えに伝わるわらべ歌や、学校の教科書で歌われた唱歌とは区別される。作曲家が楽譜を残すため、歌い方が決まっている点が、わらべ歌との大きな違いである。

伴奏はピアノが基本である。琴や三味線の音色ではなく、洋楽の和音の上にメロディが置かれる。メロディは1オクターブ前後の狭い幅を動くものが多く、子どもの声域に合わせて高すぎない位置にまとめられる。音階は二系統ある。ミ・ファ・ラ・シ・ドと下がる陰旋法を用いる暗くしっとりした系統と、長音階を素直に用いる明るい系統である。同じ詩でも節ごとに明るさを変えられるのが、日本語のメロディの利点である。

リズムは2拍子・4拍子が中心である。テンポは子どもが口ずさみやすい80〜120 BPM程度が多く、付点のリズムや畳みかける音型で遊び心を加える。打楽器はほとんど使わず、伴奏ピアノが拍を支える。

歌い方は、子どもの素直な声で高音を張らずに歌う。発声の技術より、言葉をはっきり伝えることが重視される。

歌詞は季節・動物・身辺の情景が主題である。七五調など日本語の韻律に乗せ、擬音や畳み語を活かす。夕やけや月、雨など、自然の描写が多い。

曲の組み立ては、同じメロディに複数の節を乗せる形が多い。2〜4節で一つの曲になり、最後の節で思いを結ぶ。</p>
<h2>成り立ち</h2><p>童謡の誕生は、明治以来の唱歌への不満から始まる。政府の学校で歌われていた文部省唱歌は、国家に奉仕する内容が多く、子ども自身の心情とは距離があった。

1918年7月1日、作家の鈴木三重吉が児童文芸誌『赤い鳥』を創刊する。彼は政府主導の唱歌を低級なものとみなし、子どもの純真を育む新しい歌と話を創作する一大運動を宣言した。詩人の北原白秋が協力し、同誌の歌と詩の質を支えた。1919年には西條八十作詞・成田為三作曲の「かなりや」が掲載される。『赤い鳥』で曲つきの童謡として最初に発表された作品であり、運動の音楽面の出発点となった。

運動はまもなく他の雑誌にも広がる。児童誌『金の船』（のち『金の星』）では、詩人の野口雨情に本居長世と中山晋平が曲をつけた。野口雨情の詩からは「七つの子」（1921年）、「赤い靴」（1922年）、「シャボン玉」（1923年）が生まれた。中山晋平は「兎のダンス」（1924年）や「証城寺の狸囃子」（1925年）で軽快でユーモラスな路線も開いた。野口雨情・西條八十・北原白秋は三大童謡詩人と呼ばれ、昭和初期にかけて童謡は日本の子どもの歌の中心になった。

しかし時勢は運動を追い込む。戦争への傾斜とともに子どもの歌も国策に組み込まれ、自由な創作の場は狭まった。『赤い鳥』は途中2年間の休刊をはさんで1936年8月まで続き、その後は戦時下の消耗の中で終わった。

戦後、童謡はラジオやテレビを通じて家庭に再び定着する。作曲家の山田耕筰が三木露風の詩に曲をつけた「赤とんぼ」（1927年）などは、世代を超えて歌い継がれた。2006年には文化庁と日本PTA全国協議会が「日本の歌百選」を選び、童謡の多くが選ばれた。現在も歌集・学校の教材・こどもの歌の番組の中で、わらべ歌と並ぶ子どもの歌の柱であり続けている。</p>
