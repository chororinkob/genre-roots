<h1>Dōyōとは</h1>
<p>童謡は、子どものために詩人と作曲家が新しく書いた日本の創作歌曲だ。代表曲22曲を動画で聴け、ルーツと影響のつながりを地図でたどれる。</p>
<p>童謡は、子どものために詩人と作曲家が新しく書いた日本の創作歌曲だ。口伝えに伝わるわらべ歌や、学校の教科書で歌われた唱歌とは区別される。作曲家が楽譜を残すため歌い方が決まっている点が、わらべ歌との大きな違いだ。

伴奏はピアノが基本となることが多い。琴や三味線の音色ではなく、洋楽の和音の上にメロディが置かれることが多い。童謡の音域は作品によって幅があり、例えば「赤とんぼ」は17半音に及ぶ。子どもの声域に合わせて、高すぎない位置にまとめられることが多い。

音階には二つの系統があるとされる。ミ・ファ・ラ・シ・ドの音程関係をもつ陰旋法（都節音階）を使う、暗くしっとりした系統。そして、長音階を素直に使う明るい系統だ。

リズムは2拍子・4拍子の曲が多いが、3拍子（赤とんぼ）も代表的だ。付点のリズムや畳みかける音型で遊び心を加える。打楽器は使わないことが多く、ピアノの伴奏が拍を支える。

歌い方は、子どもの素直な声で高音を張らずに歌うことが多い。発声の技術より、言葉をはっきり伝えることが重んじられる。

歌詞は季節・動物・身辺の情景が主題になることが多い。七五調など日本語の韻律に乗せ、擬音や畳み語を生かす。夕やけや月、雨など、自然の描写が多い。

曲の組み立ては、同じメロディに複数の節を乗せる形が多い。2〜4節で一つの曲になり、最後の節で思いをまとめる。</p>
<h2>成り立ち</h2><p>舞台は、明治から大正にかけての日本だ。童謡が生まれたきっかけは、学校の唱歌への不満だった。政府の学校で歌われていた文部省唱歌は、文語体で風景・風俗・訓話を歌う内容が多く、子どもの言葉からは離れていた。

1918年7月1日、作家の鈴木三重吉が児童文芸誌『赤い鳥』を創刊する。彼は、当時流行していた子どもの読み物とその俗悪な表紙を「下劣極まるもの」と批判した。そして、当時の一流の芸術家の真剣な努力を集めて、子どもの純粋な心を守り育てる大きな運動の先駆けになると述べた。詩人の北原白秋が協力し、同誌の歌と詩の質を支えた。作詞は西條八十、作曲は成田為三。詩「かなりあ」は1918年11月号に掲載され、曲が付いた「かなりや」は1919年5月号に楽譜付きで掲載される。これは『赤い鳥』で曲つきの童謡として最初に発表された作品で、運動の音楽面での出発点となった。

運動はまもなく他の雑誌にも広がる。児童誌『金の船』（のち『金の星』）では、詩人の野口雨情に本居長世と中山晋平が曲をつけた。野口雨情の詩に曲が付いたのは「七つの子」（1921年）、「赤い靴」（1922年）、「シャボン玉」（1923年）である。中山晋平は「兎のダンス」（1924年）や「証城寺の狸囃子」（1925年）で、軽やかで楽しい路線も開いたとされる。野口雨情・西條八十・北原白秋は三大童謡詩人と呼ばれた。大正期には童謡運動が広がり、多数の雑誌が出た。

しかし、時代の流れが運動を追い込んでいく。戦争が近づくにつれ、子どもの歌も国の方針に組み込まれ、自由な創作の場は狭まった。『赤い鳥』は1929年3月号で休刊し、1931年1月に会員制で復刊する。だが1936年6月27日に鈴木三重吉が死去し、同じ年の8月号で終刊した。

戦後、童謡はラジオやテレビを通じて、再び家庭に定着していったとされる。作曲家の山田耕筰が三木露風の詩に曲をつけた「赤とんぼ」は、戦前の作品（詩は1921年、曲は1927年）だが、戦後も世代を超えて歌い継がれた。2006年には、文化庁と日本PTA全国協議会が「日本の歌百選」を選んだ。選定は2006年、公表は2007年1月で、101曲には童謡・唱歌・歌謡曲などが含まれる。今も歌集や学校の教材、子どもの歌の番組の中で、わらべ歌と並ぶ子どもの歌の柱であり続けている。</p>
