<h1>J-POP アイドル（アイドル）とは</h1>
<p>歌唱そのものより、演者の成長と人格を含めた総体を楽しむことを前提に設計された日本のポップスである。音楽的には、明るい長調と分かりやすい旋律が基本で、テンポは概ね130から180 BPMと速く、曲は3分から5分に収められる。構成には</p>
<p>歌唱そのものより、演者の成長と人格を含めた総体を楽しむことを前提に設計された日本のポップスである。音楽的には、明るい長調と分かりやすい旋律が基本で、テンポは概ね130から180 BPMと速く、曲は3分から5分に収められる。構成には強い定型があり、導入部で印象的な音型を提示し、抑えた前半から徐々に高揚させ、最後の繰り返し部分の直前で半音または全音上へ転調して感情の頂点を作る。この転調による押し上げは、この分野で最も愛用される仕掛けである。歌唱は複数人による斉唱を基本とし、あえて声を揃え切らず、個々の声質の違いが聞き取れる状態が好まれる。編曲は密度が高く、弦楽の駆け上がり、金管の刺し込み、電子的な効果音が隙間なく詰め込まれる。近年ではロックやエレクトロ、ヒップホップの語法も自在に取り込まれ、様式としての幅は極めて広い。決定的に重要なのは、聴き手が声を出して参加する余地が曲の中に設計されている点で、間奏や歌の切れ目には掛け声を入れるための空白が用意されている。つまりこの音楽は、録音を鑑賞するためではなく、現場で共に発声するために作られている。</p>
<h2>成り立ち</h2><p>起源は1970年代前半である。1971年に始まったテレビの公開選考番組が、素人の少女を短期間で歌手に仕立てる仕組みを作り、南沙織や山口百恵といった歌手が登場した。1976年に活動を始めたピンク・レディーは、振り付けを含めた総合的な商品としてのあり方を確立し、社会現象と呼ばれる規模の人気を得る。1980年に登場した松田聖子は、髪型が全国の若い女性に模倣されるなど、音楽の外側にまで影響を及ぼした。1985年には秋元康が仕掛けたおニャン子クラブが、大人数の素人集団という形式を持ち込み、完成度より過程を見せるという発想を定着させた。1990年代後半にはつんく♂がモーニング娘。を、公開選考の落選者から結成し、加入と卒業を繰り返す流動的な集団という仕組みを確立する。2005年、秋元康は東京の秋葉原に専用の劇場を構え、会いに行けるという理念を掲げたAKB48を始動させた。この集団は、握手会という直接接触の機会と、購入したCDに付属する投票券によって順位を決める選抜総選挙という仕組みによって、音楽の売り上げを飛躍的に伸ばした。2011年以降は乃木坂46をはじめとする系列集団が続き、より落ち着いた作風を提示している。この産業には深刻な問題も存在する。同一の商品を大量に購入させる販売方法は、統計としての売り上げの意味を歪めたとして繰り返し批判されてきた。演者に恋愛を禁じる慣行は、私生活への過度な干渉として人権上の疑義が持たれ、実際に違反を理由に演者が謝罪を強いられる事件も起きている。若年の演者に対する労働環境や契約の不備も指摘されてきた。そして2023年、長年にわたり男性の演者を多数輩出してきた事務所において、創業者による未成年への性加害が公式に認定され、事務所は補償と改称を余儀なくされた。半世紀にわたり報道されずに放置されてきたこの事実の露見は、この産業全体に構造的な問い直しを迫るものとなっている。</p>
