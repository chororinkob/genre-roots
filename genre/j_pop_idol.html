<h1>J-POP アイドル（アイドル）とは</h1>
<p>歌唱そのものより、演者の成長と人格を含めた総体を楽しむことを前提に設計された日本のポップスである。音楽的には、明るい長調と分かりやすい旋律が基本である。構成には強い定型があり、導入部で印象的な音型を提示し、抑えた前半から徐々に高揚</p>
<p>歌唱そのものより、演者の成長と人格を含めた総体を楽しむことを前提に設計された日本のポップスである。音楽的には、明るい長調と分かりやすい旋律が基本である。構成には強い定型があり、導入部で印象的な音型を提示し、抑えた前半から徐々に高揚させ、最後の繰り返し部分の直前で半音または全音上へ転調して感情の頂点を作る。この転調による押し上げは、よく使われる仕掛けである。歌唱は複数人による斉唱を基本とし、あえて声を揃え切らず、個々の声質の違いが聞き取れる状態が好まれる。編曲は密度が高く、弦楽の駆け上がり、金管の刺し込み、電子的な効果音が隙間なく詰め込まれる。近年ではロックやエレクトロ、ヒップホップの語法も自在に取り込まれ、様式としての幅は極めて広い。聴き手が声を出して参加する余地が曲の中に設計されていることも多く、間奏や歌の切れ目には掛け声を入れるための空白が用意されている。つまりこの音楽は、録音を鑑賞するだけでなく、現場で共に発声することも前提に作られている。</p>
<h2>成り立ち</h2><p>日本のアイドルの起源には複数の見方があるが、テレビ主導のカテゴリーとしては1970年代に確立したとされる。1971年に始まったテレビの公開選考番組『スター誕生!』が、素人の少女を短期間で歌手に仕立てる仕組みを作り、山口百恵や桜田淳子、森昌子といった歌手が登場した。同じ1971年には、南沙織が「17才」でデビューしている。1976年に活動を始めたピンク・レディーは、振り付けを含めた総合的な商品としてのあり方を確立し、社会現象と呼ばれる規模の人気を得る。1980年に登場した松田聖子は、髪型が全国の若い女性に模倣されるなど、音楽の外側にまで影響を及ぼした。1985年には、フジテレビの『夕やけニャンニャン』から生まれ、秋元康らが関わったおニャン子クラブが、大人数の素人集団という形式を持ち込み、完成度より過程を見せるという発想を定着させた。1990年代後半にはつんく♂がモーニング娘。を、公開選考の落選者から結成し、加入と卒業を繰り返す流動的な集団という仕組みを確立する。2005年、秋元康は東京の秋葉原に専用の劇場を構え、会いに行けるという理念を掲げたAKB48を始動させた。この集団は、握手会という直接接触の機会と、購入したCDに付属する投票券によって順位を決める選抜総選挙という仕組みによって、音楽の売り上げを飛躍的に伸ばした。2011年には、AKB48グループの公式ライバルとして乃木坂46が登場し、専用劇場を持たず選抜総選挙も行わない点で差別化された。この産業には深刻な問題も存在する。同一の商品を大量に購入させる販売方法は、統計としての売り上げの意味を歪めたとして繰り返し批判されてきた。演者に恋愛を禁じる慣行は、私生活への過度な干渉だという批判があり、違反を理由に演者が謝罪する事件も起きている(2013年の峯岸みなみの例では、本人は「自分で決めた」と説明している)。一方、司法では、2015年の東京地裁が条項の必要性を「相当高い」と判断し、元アイドルに65万円の賠償を命じた例がある。若年の演者に対する労働環境や契約の不備も指摘されてきた。そして2023年8月、長年にわたり男性の演者を多数輩出してきた事務所が設置した外部専門家の再発防止特別チームが、創業者による性加害を認定する報告書を公表した。9月に事務所の社長が会見で性加害を認め、10月に社名を「SMILE-UP.」に変更して補償業務に専念している。この事実については、1999年に週刊文春が14週にわたるキャンペーン記事を掲載し、2003年の東京高裁が記事の重要部分を真実と認定して2004年に最高裁で確定していたが、主要なマスメディアが司法判断を報じなかったことが「沈黙」として問題にされた。この露見は、この産業全体に構造的な問い直しを迫るものとなっている。</p>
<h2>代表曲</h2><ul><li>恋するフォーチュンクッキー (AKB48)</li><li>サイレントマジョリティー（欅坂46）</li><li>ヘビーローテーション（AKB48）</li><li>フライングゲット (AKB48)</li><li>不協和音 (欅坂46)</li><li>インフルエンサー (乃木坂46)</li><li>Love so sweet (嵐)</li><li>LOVEマシーン（モーニング娘。）</li><li>ハッピーサマーウェディング (モーニング娘。)</li><li>世界に一つだけの花（SMAP）</li><li>君の名は希望 (乃木坂46)</li><li>会いたかった (AKB48)</li></ul>
