<h1>J-POP アイドル（アイドル）とは</h1>
<p>歌唱そのものより、演者の成長や人柄まで含めた全体を楽しむことを前提に作られたとされる、日本のポップスである。 編曲は音がぎっしり詰まったものが多い、という見方がある。弦楽が駆け上がり、金管が鋭く差し込まれ、電子的な効果音が詰め込ま</p>
<p>歌唱そのものより、演者の成長や人柄まで含めた全体を楽しむことを前提に作られたとされる、日本のポップスである。

編曲は音がぎっしり詰まったものが多い、という見方がある。弦楽が駆け上がり、金管が鋭く差し込まれ、電子的な効果音が詰め込まれることもある。近年ではロックやエレクトロ、ヒップホップの手法も取り込まれ、音楽のスタイルとしての幅は広いとされる。

音楽的には、松田聖子らの代表曲には長調が目立つ。

曲の組み立てでよく見られる手法のひとつは、次のようなものだ。導入部で印象的なフレーズを聴かせ、抑えた前半から少しずつ盛り上げていく。そして最後の繰り返し部分の直前で、半音または全音上へ転調し、感情の頂点を作る。この転調で一段持ち上げる手法は、よく使われる仕掛けである。

1970年代から、キャンディーズやピンク・レディーなどのグループも人気だった。1985年のおニャン子クラブが、大人数グループの先駆けとなった。のちにモーニング娘。やAKB48で、グループの形が主流になった。

ファンのコールを前提にした曲もある。間奏や歌の切れ目に、掛け声を入れるための空白が用意されていることがある。つまりこの音楽には、録音を聴いて楽しむだけでなく、現場でいっしょに声を出すことを前提にした曲もある。</p>
<h2>成り立ち</h2><p>日本のアイドルの始まりには、いくつもの見方がある。ただ、テレビが主導するカテゴリーとしては、1970年代に固まったとされる。

1971年、テレビの公開選考番組『スター誕生!』が始まった。この番組は、素人の参加者を公開オーディションで選び、レコード会社などがスカウトして歌手にする仕組みを作った。ここから山口百恵や桜田淳子、森昌子といった歌手が登場した。同じ1971年には、南沙織が「17才」でデビューしている。

1976年に活動を始めたピンク・レディーは、振り付けまで含めた総合的な商品としてのあり方を定着させた、という見方がある。その人気は、社会現象と呼ばれるほどの規模になる。1980年に登場した松田聖子は、髪型が全国の若い女性にまねされるなど、音楽の外にまで影響を広げた。

1985年には、おニャン子クラブが現れる。フジテレビの『夕やけニャンニャン』から生まれ、秋元康らが関わったグループだ。大人数の素人集団という形を持ち込み、完成度より成長の過程を見せるという考え方を定着させた。

1990年代後半には、つんく♂がモーニング娘。を結成した。メンバーは公開選考の落選者から集められ、加入と卒業を繰り返して入れ替わっていく集団という仕組みが固まった。

2005年、秋元康は東京の秋葉原に専用の劇場を構え、AKB48を始動させた。掲げた理念は「会いに行ける」である。このグループは、握手会という直接ふれあえる機会を設けた。さらに、購入したCDに付いた投票券で順位を決める、選抜総選挙という仕組みを作った。これらによって、音楽の売り上げを大きく伸ばした。2011年には、AKB48の公式ライバルとして乃木坂46が登場した(グループには非所属)。専用劇場を持たず、選抜総選挙も行わない点で、違いを打ち出した。

一方で、この産業には深刻な問題もある。同じ商品を大量に買わせる販売方法は、統計としての売り上げの意味を歪めたと指摘されている。

演者に恋愛を禁じる習わしにも、私生活への行き過ぎた干渉だという批判がある。違反を理由に、演者が謝罪する事件も起きている。2013年の峯岸みなみの例では、宿泊を報じられた本人が丸刈りにして、動画で謝罪した。丸刈りはメンバーにも事務所にも相談せずに自分で決めたと説明している。その後、研究生へ降格となった。

裁判所の判断は分かれている。2015年には東京地裁が、恋愛を禁じる条項の必要性を「相当高い」と判断し、元アイドルに65万円の賠償を命じた例がある。ただし2016年1月には、同じ東京地裁が請求を退け、異性との交際は幸福を追求する自由の一つだと述べた例もある。若い演者の労働環境や、契約の不備も指摘されてきた。

そして2023年8月、ある報告書が公表された。長年にわたり男性の演者を数多く送り出してきた事務所が設けた、外部専門家による再発防止特別チームの報告書だ。そこでは、創業者による性加害が認定された。9月7日の会見で、藤島ジュリー景子前社長(5日付で辞任)が性加害を認めた。東山紀之氏が新社長に就任し、10月には社名を「SMILE-UP.」に変えて、補償の業務に専念している。東山氏は、のちの2026年9月に社長を退いた。

この事実は、以前から明らかになっていた。1999年に週刊文春が14週にわたるキャンペーン記事を載せ、2003年には東京高裁が記事の重要な部分を真実と認めた。この判断は2004年に最高裁で確定している。それでも、テレビはほとんど報じず、新聞も扱いが小さいか一部にとどまったと指摘されている。このことが「沈黙」として問題にされた。この事実が明るみに出たことで、産業全体が仕組みそのものの見直しを迫られている。</p>
