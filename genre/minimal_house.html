<h1>Minimal House（ミニマルハウス）とは</h1>
<p>要素を極限まで削り、わずかな音の変化だけで長時間を持たせるハウスである。使われる音の数は驚くほど少なく、キック、短いハイハット、乾いた打楽器がひとつかふたつ、そして数秒に一度だけ現れる断片的な音、それだけで一曲が組み立てられること</p>
<p>要素を極限まで削り、わずかな音の変化だけで長時間を持たせるハウスである。使われる音の数は驚くほど少なく、キック、短いハイハット、乾いた打楽器がひとつかふたつ、そして数秒に一度だけ現れる断片的な音、それだけで一曲が組み立てられることも珍しくない。核心にあるのは変化の速度で、通常の曲が数小節ごとに展開するのに対し、この分野では一つの要素を導入するのに数十小節をかけ、フィルターの開き具合や残響の量を、聴き手が気づかないほどゆっくりと変化させる。この遅さによって、聴き手は音そのものではなく、音が変わっていく過程に注意を向けるようになる。テンポは概ね120から128 BPMで、キックは正確な四つ打ちを保つ。ベースは低い持続音か、極めて短い音を裏拍に置く形が中心である。素材には、電子音だけでなく、咳払い、紙をめくる音、木を叩く音、機械の駆動音といった日常の物音が加工されて用いられ、それが打楽器の役割を担う。人の声も一語だけ切り取られ、意味を剥ぎ取られて配置される。曲は10分を超えることも多く、明確な頂点を持たず、聴き手を催眠的な状態へ誘導することを目的としている。</p>
<h2>成り立ち</h2><p>1990年代半ば、ダンス音楽の各分野が音を厚く派手にしていく方向へ進む中で、逆に引き算を選ぶ一群が現れた。思想的な背景には、1960年代のアメリカで生まれたミニマル・ミュージックがある。Steve ReichやTerry Rileyが実践した、同じ音型をわずかにずらしながら反復させ、その差異から新しい形を浮かび上がらせるという発想が、電子音楽の作り手に共有されていた。実践面での起点はアメリカのデトロイトとカナダのウィンザーである。両都市は川を挟んで向かい合っており、この地域で育ったRichie Hawtinは、Plastikmanなどの名義で、音数を極端に絞ったテクノを作り上げた。1990年代末から2000年代にかけて、この方向はドイツへ移る。ケルンではKompaktというレーベルが、静謐で旋律的なミニマルの系統を確立し、ベルリンではPerlonやBPitch Controlといったレーベルが、より打楽器的で人を食ったような作風を打ち出した。この時期のベルリンは、東西統一後の空き建物が大量に存在し、廃工場や地下室でのパーティーが安価に開催できたという事情があり、朝まで、時には翌日まで続く長時間の催しが常態化した。時間が無制限にあるという条件が、変化の遅い音楽を成立させたのである。チリ出身でドイツに育ったRicardo Villalobosは、この環境の象徴的な存在で、30分を超える楽曲を平然と発表し、曖昧で捉えどころのない音像によって熱狂的な支持を得た。2000年代半ばにはこの様式が国際的な流行となり、世界中のクラブで同じような音が流れるようになる。同時に、あまりに簡素であるがゆえに、退屈で内容がなく、薬物の作用に依存した音楽だという批判も強まった。実際、この流行はドイツ語でミニマルの読み方をもじった蔑称で呼ばれることもあった。2010年前後には、より色彩と歌を戻したテック・ハウスへ主流が移り、流行としては終息したが、少ない要素で長い時間を設計するという技術は、現在のクラブ音楽の基礎教養として定着している。</p>
