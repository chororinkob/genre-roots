<h1>Minimal House（ミニマルハウス）とは</h1>
<p>ミニマル・ハウスは、要素を極限近くまで削り、わずかな音の変化だけで長い時間を持たせるハウスだ。 使われる音の数は驚くほど少ない。キック、短いハイハット、乾いた打楽器がひとつかふたつ、そして数秒に一度だけ現れる断片的な音。それだけで</p>
<p>ミニマル・ハウスは、要素を極限近くまで削り、わずかな音の変化だけで長い時間を持たせるハウスだ。

使われる音の数は驚くほど少ない。キック、短いハイハット、乾いた打楽器がひとつかふたつ、そして数秒に一度だけ現れる断片的な音。それだけで一曲が組み立てられることも珍しくない。

中心にあるのは変化の速さだ。旧来のミニマル・テクノが1・2・4小節単位で繰り返すのに対し、新しい流れは長い旋律線と短いリズムを組み合わせるとされる。フィルターの開き具合や残響の量を、聴き手が気づかないほど緩やかに変えていく。この遅さによって、聴き手は音そのものではなく、音が変わっていく過程に耳を向けるようになる。

テンポは概ね115〜130 BPMで、キックは正確な四つ打ちを保つ。ベースは、低い持続音か、極めて短い音を裏拍に置く形が中心である。

素材には、電子音だけでなく、日常の物音が加工して使われることもあり、これが打楽器の役割を果たすとされる。人の声も一語だけ切り取られ、意味を取り去って置かれる。

10分を超える長い曲もある(Ricardo Villalobosなど)。はっきりした山場を持たず、聴き手を催眠的な状態へ誘うとも言われる。</p>
<h2>成り立ち</h2><p>1990年代後半、ヨーロッパでは、ダンス音楽の各分野が音を厚く派手にしていく方向へ進んでいた。その中で、逆に足し算ではなく引き算を選ぶ一群が現れた。

考え方の背景には、1950年代末から1960年代初頭のアメリカ西海岸で生まれたミニマル・ミュージックがある。Steve Reichは、同じ音型をわずかにずらしながら繰り返し、その差から新しい形を浮かび上がらせた。Terry Rileyは、1964年のIn Cで、53の短い音型を各奏者が自由な回数で繰り返す方式をとった。こうした発想との類似が、電子音楽の作り手について指摘されている(ただし偶然の類似とする見方もある)。

次に挙げる人物たちは、ハウスではなくミニマル・テクノの起源に関わる。ミニマル・テクノの起源には複数の説がある。1990年代初めにデトロイトのRobert HoodやDaniel Bellが始めたとする説と、ドイツのBasic Channelを起源とする説だ。イングランドに生まれ、9歳でデトロイトの対岸、カナダのウィンザー郊外へ移ったRichie Hawtinは、Plastikmanなどの名義で、音数を極端に絞ったテクノを作り上げた。

1990年代末から2000年代にかけて、この方向はドイツで商業的にもスタイルの面でも拡大した。ケルンでは、Kompaktというレーベルが、アンビエントの質感と四つ打ちを結びつけた、ミニマル・テクノにも通じる作風を示した。1997年にフランクフルトで創設され、現在はベルリンを拠点とするPerlonは、より打楽器的で人を食ったような作風を打ち出した。1999年にEllen Allienがベルリンで設立したBPitch Controlは、主にテクノ系のレーベルで、ミニマル系のレーベルの一つにも挙げられる。

ベルリンでは、東西統一後の旧東ベルリンの空いた空間から始まった動きが、1998年にはすでに主流になっていた。2000年代半ばの主役は、Watergate、Bar25、Berghainといった正式なクラブだ。安い家賃とアーティストビザの取りやすさにも支えられ、朝まで、時には翌日まで続く長時間のセットが当たり前になった。長時間営業の環境が、変化の遅い音楽の背景にあったとされる。チリ出身でドイツに育ったRicardo Villalobosは、この環境を代表する存在だ。30分を超える曲を平然と発表し、あいまいで捉えどころのない音で熱狂的な支持を得た。

2001年7月には、Philip Sherburneが音楽誌で「microhouse」という呼び名を作った。2000年代半ばには、このスタイルが国際的な流行となり、世界中のクラブで同じような音が流れるようになる。同時に、あまりに簡素なため、退屈で中身がなく、薬物の作用に頼った音楽だという批判も強まった。Philip Sherburneは2005年、音楽誌のコラムで、サイケデリックなポスト・マイクロハウスを指す仮の呼び名として、ネットで使われていた語「ketamine house」を紹介した。

このスタイルは、2010年代初頭には流行として下火になった。それでも、少ない要素で長い時間を組み立てるという技術について、今のクラブ音楽への影響を指摘する声もある。</p>
