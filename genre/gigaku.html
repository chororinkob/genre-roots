<h1>Gigaku（ギガク）とは</h1>
<p>伎楽は、大きな彩色の仮面をつけた演者が劇を進める間に鳴らされる、仮面舞踏劇の伴奏音楽だ。代表曲8曲を動画で聴け、ルーツと影響のつながりを地図でたどれる。</p>
<p>伎楽は、大きな彩色の仮面をつけた演者が劇を進める間に鳴らされる、仮面舞踏劇の伴奏音楽だ。仮面劇を支える器楽の音楽である。

演奏の中心は3種類の楽器だ。旋律を受けもつのは横笛である。拍子を受けもつのは腰鼓(呉鼓)という鼓で、呉鼓の名でも呼ばれた。音色を添えるのは鉦盤という鉦である。この鉦はのちに銅鈸子というシンバルに置き換わっていった。

編成は、前奏を吹く楽隊、音声と呼ばれる声楽のパート、後奏の楽隊、帽冠という僧が付き従う形だった、とする説がある。和声の観念は確認できず、笛の単旋律に太鼓の拍と鉦の音色が重なる。演奏は屋外(行道を伴う野外芸能)で行われた。

行進の曲は、『教訓抄』では「道行音声(道行拍子)」と記されている。現代の復曲名は「行道乱声」だ。師子の舞で開演する。呉公、呉女、迦楼羅、崑崙、力士、婆羅門の仮面が順に登場し、一つずつ独立した小劇を演じる。崑崙がマラカタを扇でたたいて呉女に言い寄り、力士がマラカタに縄をかけて懲らしめる(この所作を『教訓抄』は『マラフリ舞』と呼ぶ)。終盤は酔胡王と従者たちの舞が締める。

歌詞に当たるものは確認できず、音声の歌唱の実態も記録がほとんど残っていない。同じ雅楽の系統にある舞楽が宮廷で音楽と舞を中心にするのに対し、伎楽は物語のある仮面劇である点が大きく違う。演劇性の強い音楽だった。</p>
<h2>成り立ち</h2><p>伎楽は、中国南部の呉の国に由来する楽舞とされる。呉の楽、つまり呉楽という別名が、それを示している。江南地方の仏教文化圏で育ったと考えられているが、ルーツについてはチベット、西域、インド、ペルシャ、ギリシャに求める説もあり、大陸側に直接の記録がほとんど残らないため、はっきりしたことは分かっていない。

日本への伝来は『日本書紀』が記す。推古天皇20年（612年）、百済人の味摩之が日本に帰化し、「呉に学んで伎楽の舞を得た」と述べた。朝廷は彼を桜井に住まわせ、少年を集めて伎楽の舞を習わせた。これが、日本で伎楽が行われた記録として最古のものとされる。

しかし、伎楽が本格的に盛んになったのは奈良時代だ。寺院の法会という仏教の儀式で上演され、寺院芸能の中心になった。頂点を示すのが、天平勝宝4年（752年）の東大寺大仏開眼供養である。大仏の目を開く国際的な式典で、伎楽は他の諸芸能とともに大規模に上演された。東大寺・正倉院の面には、開眼会で用いられたものが多く含まれる。東大寺に伝わった伎楽面は30面、正倉院には171面が現存する。法隆寺献納宝物として、東京国立博物館に31面が伝わる。

しかし、平安時代に入ると流れが変わる。鉦盤は銅鈸子に置き換わり、宮廷や寺院では舞楽が盛んになった。伎楽の内容には、崑崙が呉女に思いを寄せて卑猥な動作を見せる部分が多かった。登場人物も力士・金剛など仏教的で、習合した神道に触れない、といった点も衰退の理由と推定される。

鎌倉時代になると上演は次第に絶えた。ほぼ唯一の詳細な記録が、狛近真が1233年（天福元年）に著した楽書『教訓抄』だ。同書は伎楽の伝来と演目を伝え、鎌倉時代に次第に上演されなくなったことを記す。首都から遠い地方では14世紀頃まで伝えられたとされるが、やがて消えた。

復活の動きが来たのは昭和になってからだ。1980年、東大寺大仏殿昭和大修理落慶法要を飾る大きな企画として、伎楽の一部が復元された。復曲は元宮内庁楽部楽師の芝祐靖、振り付けは元楽部楽長の東儀和太郎、監修は東京芸術大学教授の小泉文夫、装束制作は吉岡常雄、企画はNHKプロデューサーの堀田謹吾が担い、演技は天理大学雅楽部が担当した。以降も天理大学雅楽部は『教訓抄』の記載に基づく復元試作を続け、行道乱声、獅子・曲子、呉公・呉女、迦楼羅、崑崙、婆羅門、金剛・力士、太孤、酔胡の復曲がそろい、1990年に文献に記載された伎楽曲をすべて演奏できるようになった。1992年からは薬師寺で創作伎楽「三蔵法師 求法の旅」の上演も続けている。現行の主な上演は、芝祐靖らの復曲に基づく。</p>
