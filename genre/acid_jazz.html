<h1>Acid Jazz（アシッドジャズ）とは</h1>
<p>1980年代末のロンドンのクラブから生まれた、1960〜70年代のジャズファンクとレアグルーヴを、ダンスフロアの感覚で再構成した音楽。核にあるのはブレイクビーツで、生ドラムの重いバックビートか、サンプリングされたループが土台を作り</p>
<p>1980年代末のロンドンのクラブから生まれた、1960〜70年代のジャズファンクとレアグルーヴを、ダンスフロアの感覚で再構成した音楽。核にあるのはブレイクビーツで、生ドラムの重いバックビートか、サンプリングされたループが土台を作り、テンポは90〜115BPM前後の粘りのある領域に置かれる。編成には、ハモンドオルガンとレスリースピーカーが生む揺れた音色、フェンダーローズの電気ピアノ、ワウペダルを踏んだカッティングギター、スラップを多用するエレクトリックベース、そしてフルートやサックス、フリューゲルホルンといった管楽器が並ぶ。和声はモーダルジャズ由来の複雑なコードを使いながら、曲は2〜4小節の反復で組まれ、長大なソロよりも一定のグルーヴの持続が優先される。ヴォーカルは、ソウル的な歌唱、ラップ、あるいはスキャットが曲ごとに選ばれる。ジャンル名に反してアシッドハウスとの音楽的な直接の関係はなく、DJが冗談まじりに口にした言葉がそのまま定着したものである。同じ時期のヌージャズが電子音楽の側からジャズへ寄ったのに対し、アシッドジャズは生バンドの演奏でクラブの機能性を満たそうとする点が異なる。</p>
<h2>成り立ち</h2><p>1987年前後のロンドンで、アシッドハウスの熱狂に乗らなかったDJたちが、古いジャズファンクのレコードをクラブでかけ始めたことに始まる。前史として、1970年代末から80年代前半にかけて、ロンドン近郊のクラブで1960〜70年代の忘れられたソウル、ファンク、ジャズの盤を発掘してかけるレアグルーヴの文化と、それに合わせて踊るジャズダンスの集団が存在した。ジャンル名は1987年、DJのGilles PetersonとEddie Pillerが、当時席巻していたアシッドハウスをもじって冗談で口にしたものが、そのままレーベル名になったとされる。二人が設立したレーベルAcid Jazz Recordsは、The Brand New Heavies、Jamiroquai、Corduroyといったバンドを送り出した。Gilles Petersonは後に離脱してTalkin' Loudを設立し、Young Disciples、Galliano、Incognitoらを擁して、より実験的な方向を追求する。1990年代前半、この音は世界的な流行となった。イギリスではThe James Taylor Quartetがハモンドオルガンによる映画音楽的な作風で人気を得て、Jamiroquaiは『Travelling Without Moving』(1996)で世界的な成功を収める。アメリカではUs3が、Blue Note Recordsの音源の使用許諾を得て制作した「Cantaloop (Flip Fantasia)」(1993)をヒットさせ、Guruの『Jazzmatazz』シリーズがヒップホップの側からジャズと接続した。日本ではUnited Future Organizationやmondo grossoが同時代的に活動し、渋谷系の一部とも重なっている。しかし1990年代半ばには、本物のジャズではない、カフェの内装のような音楽だ、といった批判が強まり、名称そのものが急速に手垢のついたものになった。ジャンルとしては短命だったが、その方法論はヌージャズ、ブロークンビーツ、そして2010年代のロンドンのジャズ復興へ確実に受け継がれている。</p>
