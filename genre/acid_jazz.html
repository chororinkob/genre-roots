<h1>Acid Jazz（アシッドジャズ）とは</h1>
<p>1980年代末のロンドンのクラブから生まれた、1960〜70年代のジャズファンクとレアグルーヴを、ダンスフロアの感覚で再構成した音楽。パーカッション主体の生演奏を軸にした、グルーヴ重視のダンス音楽で、ホーン、リズム隊、歌またはラッ</p>
<p>1980年代末のロンドンのクラブから生まれた、1960〜70年代のジャズファンクとレアグルーヴを、ダンスフロアの感覚で再構成した音楽。パーカッション主体の生演奏を軸にした、グルーヴ重視のダンス音楽で、ホーン、リズム隊、歌またはラップ、DJを含む編成が一般的である。編成には、ハモンドオルガンとレスリースピーカー（回転して音を揺らすスピーカー）が生む揺れた音色を使うバンドもある。曲は長く反復的に組まれ、踊れるグルーヴが重視されるが、即興ソロの多いバンドもある。ヴォーカルは、ソウル的な歌唱やラップなどが曲ごとに選ばれる。ジャンル名は、1987年ごろにアシッドハウスのDJの後でChris Bangsがマイクで「アシッドハウスがこれなら、こっちはアシッドジャズだ」と冗談まじりに言ったとする証言があり、アシッドハウスとはエネルギーを共有していた。後続のヌージャズが電子音楽の側からジャズへ寄ったのに対し、アシッドジャズは生演奏中心のバンドが多いが、スタジオ制作のプロジェクトもあった。</p>
<h2>成り立ち</h2><p>1987年前後のロンドンで、アシッドハウスの勢いを意識し、そのエネルギーをジャズやジャズファンクの文脈に持ち込んだDJたちが、古いジャズファンクのレコードをクラブでかけ始めたことに始まる。前史として、1970年代末からロンドンにはジャズファンク系のダンサーの文化があり、1980年代半ばにNorman Jayらによって、1960〜70年代の忘れられたソウル、ファンク、ジャズの盤を発掘してかけるレアグルーヴと呼ばれる動きになった。舞台は、SohoのWagやCamdenのDingwallsなど、ロンドンのクラブだった。ジャンル名の由来は諸説ある。名称はGilles Petersonが作ったとする説が一般的だが、当事者の証言では最初に口にしたのはChris Bangsとされ（場所や状況の証言は一致しない）、レーベルの設立年は1987年説と1988年説があり、設立者はPetersonとPillerの2人とするのが一般的で、Chris Bangsを含む3人とする記述は出典が弱い。Young DisciplesのFemi WilliamsとMarco Nelsonは、クラブの上階を「The Acid Jazz Room」と名付けたことが由来だと1992年のTVインタビューで主張している（ただし1992年のインタビューは、レーベルが1987年設立なら5年後、1988年設立なら4年後にあたり、Young Disciplesの結成（1990年）も、同じく3年後または2年後であり、先行説としては疑問視されている）。レーベルAcid Jazz Recordsは、The Brand New Heavies、Jamiroquai、Corduroyといったバンドを送り出した。Gilles Petersonは後に離脱してTalkin' Loud（1990年設立で、メジャーのPhonogram傘下）を設立し、Young Disciples、Galliano、Incognitoらを擁した。1990年代前半、この音は世界的な流行となった。イギリスではThe James Taylor Quartetがハモンドオルガンによる映画音楽的な作風で人気を得て、Jamiroquaiは『Travelling Without Moving』(1996)で世界的な成功を収める。アメリカではUs3が、Blue Note Recordsの音源の使用許諾を得て制作した「Cantaloop (Flip Fantasia)」(1992年10月にBlue Note Recordsから発売。米国で最高9位に入ったのは1994年3月)をヒットさせ、Guruの『Jazzmatazz』シリーズがヒップホップの側からジャズと接続した。日本ではUnited Future Organizationやmondo grossoが同時代的に活動し、渋谷系の一部とも重なっている。しかし1990年代半ばには、電子系のクラブ音楽の台頭で関心が薄れた。のちの2012年のインタビューでPetersonは、アシッドジャズが最終的にマーケティング担当者に乗っ取られ、ジャズを売る安易で怠惰な方法になったと振り返っている。ジャンルとしては短命だったが、その方法論はヌージャズへ受け継がれ、ブロークンビーツなどにも影響を与えた。</p>
