<h1>Acid Jazz（アシッドジャズ）とは</h1>
<p>1980年代末のロンドンのクラブから生まれた、1960〜70年代のジャズファンクとレアグルーヴを、ダンスフロアの感覚で再構成した音楽。核にあるのはブレイクビーツで、生ドラムの重いバックビートか、サンプリングされたループが土台を作り</p>
<p>1980年代末のロンドンのクラブから生まれた、1960〜70年代のジャズファンクとレアグルーヴを、ダンスフロアの感覚で再構成した音楽。核にあるのはブレイクビーツで、生ドラムの重いバックビートか、サンプリングされたループが土台を作り、テンポはミッドテンポ中心の粘りのある領域に置かれる。編成には、ハモンドオルガンとレスリースピーカーが生む揺れた音色、フェンダーローズの電気ピアノ、ワウペダルを踏んだカッティングギター、スラップを多用するエレクトリックベース、そしてフルートやサックス、フリューゲルホルンといった管楽器が並ぶ。和声はモーダルジャズ由来の、コード進行の変化に頼らず1つの旋法の上で展開する手法を使いながら、曲は2〜4小節の反復で組まれ、長大なソロよりも一定のグルーヴの持続が優先される。ヴォーカルは、ソウル的な歌唱、ラップ、あるいはスキャットが曲ごとに選ばれる。ジャンル名は、1987年ごろにアシッドハウスのDJの後でChris Bangsがマイクで「アシッドハウスがこれなら、こっちはアシッドジャズだ」と冗談まじりに言ったのが最初とされ、アシッドハウスとはエネルギーを共有していた。後続のヌージャズが電子音楽の側からジャズへ寄ったのに対し、アシッドジャズは生バンドの演奏でクラブの機能性を満たそうとする点が異なる。</p>
<h2>成り立ち</h2><p>1987年前後のロンドンで、アシッドハウスの熱狂に乗らなかったDJたちが、古いジャズファンクのレコードをクラブでかけ始めたことに始まる。前史として、1970年代末からロンドンにはジャズファンク系のダンサーの文化があり、1980年代半ばにNorman Jayらによって、1960〜70年代の忘れられたソウル、ファンク、ジャズの盤を発掘してかけるレアグルーヴと呼ばれる動きになった。舞台はロンドン中心部のクラブだった。ジャンル名の由来は諸説ある。名称はGilles Petersonが作ったとする説が一般的だが、当事者の証言では最初に口にしたのはChris Bangsとされ（場所や状況の証言は一致しない）、レーベルはChris Bangs、Eddie Piller、Gillesが設立して年は1988年とされる一方、PetersonとPillerが1987年に設立したとする記述もある。Young DisciplesのFemi WilliamsとMarco Nelsonは、クラブの上階を「The Acid Jazz Room」と名付けたことが由来だと1992年のTVインタビューで主張している（ただしレーベル設立の5年後で、Young Disciplesの活動開始もレーベル設立の3年後であり、先行説としては疑問視されている）。レーベルAcid Jazz Recordsは、The Brand New Heavies、Jamiroquai、Corduroyといったバンドを送り出した。Gilles Petersonは後に離脱してTalkin' Loudを設立し、Young Disciples、Galliano、Incognitoらを擁して、より実験的な方向を追求する。1990年代前半、この音は世界的な流行となった。イギリスではThe James Taylor Quartetがハモンドオルガンによる映画音楽的な作風で人気を得て、Jamiroquaiは『Travelling Without Moving』(1996)で世界的な成功を収める。アメリカではUs3が、Blue Note Recordsの音源の使用許諾を得て制作した「Cantaloop (Flip Fantasia)」(1992年10月にBlue Note Recordsから発売。米国で最高9位に入ったのは1994年3月)をヒットさせ、Guruの『Jazzmatazz』シリーズがヒップホップの側からジャズと接続した。日本ではUnited Future Organizationやmondo grossoが同時代的に活動し、渋谷系の一部とも重なっている。しかし1990年代半ばには、Petersonが「マーケティング担当者に乗っ取られ、ジャズを売る安易で怠惰な方法になった」と述べるほど、名称そのものが急速に手垢のついたものになった。ジャンルとしては短命だったが、その方法論はヌージャズへ受け継がれ、ブロークンビーツや2010年代のロンドンのジャズ復興にも影響を与えたと指摘される。</p>
