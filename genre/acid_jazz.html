<h1>Acid Jazz（アシッドジャズ）とは</h1>
<p>アシッドジャズは、1980年代末のロンドンのクラブから生まれた音楽だ。1960〜70年代のジャズファンクとレアグルーヴを、ダンスフロアの感覚で再構成した。パーカッション主体の生演奏を軸にした、グルーヴ重視のダンス音楽である。 編成</p>
<p>アシッドジャズは、1980年代末のロンドンのクラブから生まれた音楽だ。1960〜70年代のジャズファンクとレアグルーヴを、ダンスフロアの感覚で再構成した。パーカッション主体の生演奏を軸にした、グルーヴ重視のダンス音楽である。

編成は、ホーン、リズム隊、歌またはラップ、DJを含むものが一般的だ。生演奏中心のバンドが多いが、スタジオ制作のプロジェクトもあった。後に出たヌージャズは、それより電子音楽寄りである。

ジャンル名は、1987年ごろ、アシッドハウスのDJの後で、Chris Bangsがマイクで「アシッドハウスがこれなら、こっちはアシッドジャズだ」と冗談まじりに言ったとする証言がある。アシッドハウスとは、エネルギーを共有していた。</p>
<h2>成り立ち</h2><p>1987年前後のロンドンで、アシッドハウスの勢いを意識したDJたちが動き出した。彼らはそのエネルギーをジャズ/ジャズファンクの文脈に持ち込み、古いジャズファンクのレコードをクラブでかけ始めた。これが始まりだ。

前史もある。1970年代末からロンドンにはジャズファンク系のダンサーの文化があった。1980年代半ばには、Norman Jayらによって、1960〜70年代の忘れられたソウル、ファンク、ジャズの盤を発掘してかける動きが生まれたとされる。これがレアグルーヴと呼ばれた。舞台は、SohoのWagやCamdenのDingwallsなど、ロンドンのクラブだった。

ジャンル名の由来は諸説ある。Gilles Petersonが作ったとする説が一般的だ。しかし当事者の証言では、最初に口にしたのはChris Bangsとされる（場所や状況の証言は一致しない）。

レーベルの設立年は、1987年説と1988年説がある。設立者はPetersonとPillerの2人とするのが一般的で、Bangsを含む3人とする記述は出典が弱い。Young DisciplesのFemi WilliamsとMarco Nelsonは、クラブの上階を「The Acid Jazz Room」と名付けたことが由来だと、1992年のTVインタビューで主張している。ただしインタビューは1992年で、1987年設立なら5年後、1988年設立なら4年後にあたる。Young Disciplesの結成は1990年で、同じく3年後または2年後だ。このため、先行説としては疑問視されている。

レーベルAcid Jazz Recordsは、The Brand New Heavies、Jamiroquai、Corduroyといったバンドを送り出した。Gilles Petersonは後に離脱してTalkin' Loudを設立する。Young Disciples、Galliano、Incognitoらを擁して、より実験的な方向を追求したと言われる。

1990年代前半、この音は世界的な流行となった。イギリスではThe James Taylor Quartetが、ハモンドオルガンによる映画音楽的な作風で人気を得た。Jamiroquaiは『Travelling Without Moving』(1996)で世界的な成功を収める。アメリカではUs3が、Blue Note Recordsの音源の使用許諾を得て制作した「Cantaloop (Flip Fantasia)」をヒットさせた。1992年10月にBlue Note Recordsから発売され、米国で最高9位に入ったのは1994年3月だ。Guruの『Jazzmatazz』シリーズは、ヒップホップの側からジャズと接続した。日本ではUnited Future Organizationやmondo grossoが同時代的に活動し、渋谷系の一部とも重なっている。

2012年のインタビューでPetersonは、アシッドジャズが最終的にマーケティング担当者に乗っ取られたと振り返っている。ジャズを売る安易で怠惰な方法になった、という。

ジャンルとしては短命だった。しかし、その方法論はヌージャズへ受け継がれ、ブロークンビーツやヌージャズなどに影響を与えた。</p>
