<h1>Progressive Rock（プログレッシブロック）とは</h1>
<p>ロックの編成に、クラシック音楽やジャズの曲の組み立ての手法を持ち込んだ様式。最大の特徴は拍子と形式の複雑さで、4分の4以外の変拍子（定型から外れた拍子）、たとえば4分の5、8分の7、8分の11といった拍子が使われ、曲中で何度も切り</p>
<p>ロックの編成に、クラシック音楽やジャズの曲の組み立ての手法を持ち込んだ様式。最大の特徴は拍子と形式の複雑さで、4分の4以外の変拍子（定型から外れた拍子）、たとえば4分の5、8分の7、8分の11といった拍子が使われ、曲中で何度も切り替わる。10分を超える長い曲が多く、20分を超える曲もある。アルバム全体を一曲にした例もある。構成は歌ものの反復形式ではなく、複数の楽章からなる組曲形式の作品や、主題が形を変えて再登場する循環主題の手法を使う作品が多い。楽器面では鍵盤が主役級で、ハモンド・オルガンをレスリー・スピーカーという回転式のスピーカーで鳴らした揺れる音、メロトロン（録音テープを鍵盤で鳴らす楽器）による擬似的な弦楽合奏、そしてMoogのシンセサイザーによる単音のソロが定番。ギターの音を歪ませるかどうかは、弾く人によって違い、ベースは、YesのChris Squireのリッケンバッカーの明るく太い、うなるような音のように、対旋律（主旋律に絡む別の旋律）を弾くことがある。ドラムは複雑なフィルイン（曲の区切りに入れる短いドラム演奏）と変拍子への追随を求められる。和声では、ジャズやクラシックで使われる和音の使い方を取り入れる例がある。歌詞は神話、SF、文学作品、哲学的な主題を扱い、曲全体で一つの物語を語るコンセプト・アルバムの形式が好まれる。演奏技術の高さそのものが価値として示される点も特徴である。</p>
<h2>成り立ち</h2><p>1960年代末のイギリスで、サイケデリック・ロックが構造の自由を獲得した後、その自由をより意識的に組織する試みとして始まった。出発点の一つは1969年、King Crimsonのアルバム In the Court of the Crimson Kingで、Robert Frippのギター、Ian McDonaldのメロトロン、Greg Lakeの歌が、ジャズの即興とクラシックの構築性をロックの編成で統合した。同時期、Yesは1972年のClose to the Edgeで、対位法（複数の旋律を組み合わせる技法）的な多層構造を使った、約19分で4つの楽章がある表題曲をレコードの片面に収め、Genesisは Peter Gabrielの演劇的な演出と物語性を武器とした。Emerson, Lake &amp; Palmerは、Keith Emersonがハモンド・オルガンにナイフを突き立てるといった過激な舞台演出（Emersonが前に在籍したバンドThe Niceのころからの演出）とともに、ムソルグスキーの展覧会の絵を編曲するなど、クラシック音楽への直接的な接近を行った。Pink Floydは1973年のThe Dark Side of the Moonで、より抑制された構成と音響効果により、史上最も長期にわたりチャートに留まるアルバムの一つとなった。制度面では、1960年代後半にアルバムが作品を発表する形として重みを増し、レコード会社がアーティストに、長くて実験的な作品を試す余地を与えたこと、そしてBBCのラジオ番組がこうした作品を放送したことが背景にある。また、演奏者には、Rick Wakemanのようにクラシックの訓練を受けた人もおり、ロックを芸術として扱う意識があった。1970年代後半、いくつかの原因が重なって、この音楽の人気は下がった。パンクの人気が出たことは主な原因とよく言われるが、ほかの原因も指摘されている。一方で、Pink FloydやGenesisのように、売れ続けた例もある。しかし1980年代にはMarillionらによる復興、1980年代以降はQueensrÿcheなどによるメタルとの融合（1990年代にDream Theaterが定着させた）、そしてTool、Porcupine Tree、Opethといったバンドによる再解釈が続き、現在では複雑さを恐れない音楽の総称として定着している。</p>
