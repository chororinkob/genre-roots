<h1>Progressive Rock（プログレッシブロック）とは</h1>
<p>ロックの編成に、クラシック音楽やジャズの構造的な語彙を持ち込んだ様式。最大の特徴は拍子と形式の複雑さで、四分の四以外の変拍子、たとえば四分の五、八分の七、四分の11といった拍子が頻繁に使われ、曲中で何度も切り替わる。曲の長さは10</p>
<p>ロックの編成に、クラシック音楽やジャズの構造的な語彙を持ち込んだ様式。最大の特徴は拍子と形式の複雑さで、四分の四以外の変拍子、たとえば四分の五、八分の七、四分の11といった拍子が頻繁に使われ、曲中で何度も切り替わる。曲の長さは10分から20分に及び、時にはアルバムの片面すべてを一曲が占める。構成は歌ものの反復形式ではなく、複数の楽章からなる組曲形式をとり、主題が形を変えて再登場する循環主題の手法が用いられる。楽器面では鍵盤が主役級で、ハモンド・オルガンをレスリー・スピーカーという回転式のスピーカーで鳴らした揺れる音、メロトロンによる擬似的な弦楽合奏、そしてMoogのシンセサイザーによる単音のソロが定番。ギターは歪みより音色の多彩さを重視し、ベースはリッケンバッカーの硬い音で対旋律を弾く。ドラムは複雑なフィルインと変拍子への追随を求められる。和声は借用和音や旋法の混用により、ロックの三和音から大きく外れる。歌詞は神話、SF、文学作品、哲学的な主題を扱い、曲全体で一つの物語を語るコンセプト・アルバムの形式が好まれる。演奏技術の高さそのものが価値として提示される点も特徴である。</p>
<h2>成り立ち</h2><p>1960年代末のイギリスで、サイケデリック・ロックが構造の自由を獲得した後、その自由をより意識的に組織する試みとして始まった。決定的な出発点は1969年、King Crimsonのアルバム In the Court of the Crimson Kingで、Robert Frippのギター、Ian McDonaldのメロトロン、Greg Lakeの歌が、ジャズの即興とクラシックの構築性をロックの編成で統合した。同時期、Yesは1971年のFragileと1972年のClose to the Edgeで、対位法的な多層構造と長大な組曲形式を完成させ、Genesisは Peter Gabrielの演劇的な演出と物語性を武器とした。Emerson, Lake &amp; Palmerは、Keith Emersonがハモンド・オルガンにナイフを突き立てるといった過激な舞台演出とともに、ムソルグスキーの展覧会の絵を編曲するなど、クラシック音楽への直接的な接近を行った。Pink Floydは1973年のThe Dark Side of the Moonで、より抑制された構成と音響効果により、史上最も長期にわたりチャートに留まるアルバムの一つとなった。制度面では、イギリスの音楽産業が1960年代末に一時的にアルバム主体の販売へ移行し、レコード会社が長尺で実験的な作品に投資する余地が生まれたこと、そしてBBCのラジオ番組がこうした作品を放送したことが背景にある。また、多くの演奏者が音楽学校や美術学校の出身であり、ロックを芸術として扱う意識を最初から持っていた。1977年以降、パンクの台頭により、この様式は肥大化した権威の象徴として徹底的に攻撃された。演奏の技巧、長さ、歌詞の難解さの全てが批判の対象となり、商業的にも急速に後退した。しかし1980年代にはMarillionらによる復興、1990年代以降はDream Theaterによるメタルとの融合、そしてTool、Porcupine Tree、Opethといったバンドによる再解釈が続き、現在では複雑さを恐れない音楽の総称として定着している。</p>
<h2>代表曲</h2><ul><li>Roundabout (Yes)</li><li>The Court of the Crimson King (King Crimson)</li><li>Shine On You Crazy Diamond (Pink Floyd)</li></ul>
