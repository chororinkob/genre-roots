<h1>Progressive Rock（プログレッシブロック）とは</h1>
<p>プログレッシブ・ロックは、ロックの編成に、クラシック音楽やジャズの曲の組み立ての手法を持ち込んだスタイルだ。最大の特徴は、拍子と形式の複雑さにある。 中心になるのは鍵盤だ。ハモンド・オルガンをレスリー・スピーカーという回転式のスピ</p>
<p>プログレッシブ・ロックは、ロックの編成に、クラシック音楽やジャズの曲の組み立ての手法を持ち込んだスタイルだ。最大の特徴は、拍子と形式の複雑さにある。

中心になるのは鍵盤だ。ハモンド・オルガンをレスリー・スピーカーという回転式のスピーカーで鳴らした揺れる音、メロトロン（録音テープを鍵盤で鳴らす楽器）による擬似的な弦楽合奏、そしてMoogのシンセサイザーによる単音のソロが定番になっている。ギターは、歪みの有無は奏者により異なる。ベースは、YesのChris Squireのリッケンバッカーの明るく太い、唸るような音のように、対旋律（主旋律に絡む別の旋律）を弾くことがある。

和声は、ジャズやクラシック由来の和声を取り入れる例がある。

拍子は、4分の4以外の変拍子（定型から外れた拍子）が頻繁に使われる。たとえば4分の5、8分の7、8分の11（King Crimson「Larks' Tongues in Aspic Pt.1」）といった拍子で、曲の中で何度も切り替わる。ドラムは、複雑なフィルイン（曲の区切りに入れる短いドラム演奏）と、変拍子への追随を求められる。

歌詞は、神話、SF、文学作品、哲学的な主題を扱う。曲全体で一つの物語を語るコンセプト・アルバムの形式が好まれる。

曲の組み立てでは、10分を超える長尺曲が多く、20分を超える例（アルバム全体を1曲とした例を含む）もある。構成は、組曲形式や循環主題を用いる作品が多い。演奏技術の高さそのものが価値として示される点も、このスタイルの特徴である。</p>
<h2>成り立ち</h2><p>1960年代末のイギリスで、サイケデリック・ロックが構造の自由を獲得した。その自由を、より意識的に組織する試みとして始まったのが、プログレッシブ・ロックだ。

出発点の一つは、1969年のKing Crimsonのアルバム In the Court of the Crimson Kingである。Robert Frippのギター、Ian McDonaldのメロトロン、Greg Lakeの歌が、ジャズの即興とクラシックの構築性を、ロックの編成で統合した。

同じ時期、Yesは『Close to the Edge』（1972）で、約19分・4楽章の表題曲をLP片面に収めた。Genesisは、Peter Gabrielの演劇的な演出と物語性を武器とした。Emerson, Lake &amp; Palmerは、Keith Emersonがハモンド・オルガンにナイフを突き立てるといった過激な舞台演出とともに、ムソルグスキーの展覧会の絵を編曲するなど、クラシック音楽へ直接近づいた。この演出は、Emersonが前に在籍したThe Niceの時代からのものだ。Pink Floydは1973年のThe Dark Side of the Moonで、より抑制された構成と音響効果により、史上最も長期にわたりチャートに留まるアルバムの一つとなった。

こうした動きの背景には、制度面の事情があった。1960年代後半にLPが創作形式として重みを増し、レーベルがアーティストに実験の余地を与えた。さらに、レコード会社が長尺で実験的な作品に投資する余地が生まれた。そしてBBCのラジオ番組が、こうした作品を放送した。また、Rick Wakemanのようにクラシックの訓練を受けた演奏者もおり、ロックを芸術として扱う意識があった。

しかし、1970年代後半、複数の要因で人気が下降した。パンクが人気を集めたことは、通説上の主因とされるが、他の要因も指摘される。一方で、Pink FloydやGenesisなど、商業的成功を続けた例もある。

それでも、1980年代にはMarillionらによる復興があった。1980年代以降は、Queensrÿcheなどがメタルとの融合を進め、1990年代にDream Theaterがそれを定着させた。そしてTool、Porcupine Tree、Opethといったバンドによる再解釈が続き、現在では、複雑さを恐れない音楽の総称として定着している。</p>
