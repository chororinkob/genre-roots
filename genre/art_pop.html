<h1>Art Pop（アートポップ）とは</h1>
<p>大衆音楽の形式を保ちながら、現代美術や実験音楽の発想を持ち込む様式。曲の骨格はヴァースとコーラスというポップスの型を残すが、その内部で通常なら避けられる要素が積極的に用いられる。具体的には、不協和音や無調的な和声、四分の四から外れ</p>
<p>大衆音楽の形式を保ちながら、現代美術や実験音楽の発想を持ち込む様式。曲の骨格はヴァースとコーラスというポップスの型を残すが、その内部で通常なら避けられる要素が積極的に用いられる。具体的には、不協和音や無調的な和声、四分の四から外れた拍子、テープの逆再生や環境音の挿入、電子的な加工による声の変質、そして楽器として想定されていない物体の音である。編曲は密度が極端に高い場合と、逆に不自然なほど空白が多い場合の両極に振れる。旋律は覚えやすさより意外性を優先し、予想される音を裏切る跳躍や、途中で崩れる構造を含む。歌唱も、美声を目指す代わりに、囁き、叫び、無表情な語り、あるいは加工された非人間的な声が選ばれる。歌詞は物語や恋愛にとどまらず、自我の解体、性と身体、消費社会、死といった主題を、直喩を避けた言葉で扱う。もう一つの決定的な特徴は、視覚表現との統合で、ジャケット、衣装、ミュージック・ビデオ、舞台美術が音楽と同じ重みを持つ。作品全体が一つの構想として提示されるため、聴くだけでは完結しないよう設計されている。</p>
<h2>成り立ち</h2><p>起源は1960年代のイギリスの美術学校にある。当時のイギリスでは、進学の選択肢として美術学校が広く開かれており、そこで学んだ若者たちが大量に音楽へ流れ込んだ。John Lennon、Keith Richards、Pete Townshend、Ray Daviesらがその例である。彼らは大衆音楽を単なる娯楽ではなく、表現の媒体として扱う意識を持ち込んだ。1966年から1967年にかけて、The Beatlesがスタジオを作曲の道具として用い、The Beach BoysのBrian WilsonがPet Soundsで多層的な音響構成を提示したことが、直接の出発点となった。ニューヨークでは、Andy Warholの庇護のもとThe Velvet Undergroundが1967年にデビューし、ノイズと単調な反復、そして薬物や性を扱う歌詞により、美術と音楽の境界を消した。1970年代前半、イギリスでRoxy Musicが、Bryan Ferryの様式化された歌唱とBrian Enoの電子的な処理を組み合わせ、この様式を完成させた。Brian Enoは後に、意図的に音楽から前景性を取り除くアンビエントを提唱している。David Bowieは1970年代を通じて、Ziggy Stardustをはじめとする架空の人格を用いた作品を発表し、自己の演出そのものを芸術とした。1970年代末のポスト・パンク期には、Talking Heads、Kate Bush、Japanらが続いた。1980年代以降、この系譜はBjörk、Radiohead、そして2010年代にはFKA twigs、Arca、Kanye Westといった作家に受け継がれている。批判としては、大衆音楽の直接性を失って自意識過剰に陥る危険、そして芸術性の主張が中産階級的な文化資本の誇示にすぎないという指摘が繰り返し向けられてきた。</p>
<h2>代表曲</h2><ul><li>Running Up That Hill (Kate Bush)</li><li>Heroes (David Bowie)</li><li>Venus as a Boy (Björk)</li><li>Cellophane (FKA twigs)</li><li>Genesis (Grimes)</li></ul>
