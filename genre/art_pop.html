<h1>Art Pop（アートポップ）とは</h1>
<p>アート・ポップは、イメージ・スタイル・身振りを重視し、ハイカルチャーとローカルチャーの区別を崩す、緩く定義されたポップのスタイルだ。 ポップの商業芸術性や人工性、自己の問題なども、このスタイルの特徴に挙げられる。 不協和音（ぶつか</p>
<p>アート・ポップは、イメージ・スタイル・身振りを重視し、ハイカルチャーとローカルチャーの区別を崩す、緩く定義されたポップのスタイルだ。

ポップの商業芸術性や人工性、自己の問題なども、このスタイルの特徴に挙げられる。

不協和音（ぶつかり合って濁る響き）や無調的（調の中心がない）な和声、4分の4から外れた拍子、テープの逆再生や環境音の挿入といった要素は、作品や作家によっては用いられる。

歌詞は、物語や恋愛にとどまらない。自我の解体、性と身体、消費社会、死といった主題を、主題として扱うことがある。

もう一つの特徴は、美術など他分野との結びつきだ。ジャケット、衣装、ミュージック・ビデオ、舞台美術が、音楽と同じ重みを持つ。作品全体が、一つの構想として示されることもある。</p>
<h2>成り立ち</h2><p>1960年代半ばに始まった。英国では美術学校での学びに、米国ではAndy Warholとその周辺のThe Velvet Undergroundの影響に由来するとされる。

美術学校は、労働者階級の賢い子供たちの伝統的な逃げ道であり（Simon Frith）、多くのバンドを生んだ土壌だった。John Lennon、Keith Richards、Pete Townshend、Ray Daviesらがその例である。彼らは、大衆音楽を単なる娯楽ではなく、表現の媒体として扱う意識を持ち込んだと言われる。

1966年から1967年にかけて、The Beatlesがスタジオを作曲の道具として用いた。The Beach BoysのBrian Wilsonは、Pet Soundsで多層的な音響構成を示した。出発点は論者で分かれる。Michael Johnsonは、1966年のPet Soundsと1967年のSgt. Pepperを最初の「上昇」とする。Holdenは、1960年代半ばにPhil SpectorやBrian Wilsonが擬似シンフォニックな質感を取り入れたことを起点とする。

ニューヨークでは、Andy Warholの後ろ盾のもと、The Velvet Undergroundが1967年3月にデビュー・アルバム『The Velvet Underground &amp; Nico』を発表した（最初のシングルは1966年7月）。ノイズと単調な反復、そして薬物や性を扱う歌詞により、Warholの美術とポップの統合をなぞった。芸術的表象の従来の序列を無視する、前衛的なアプローチを打ち出したのだ。

1970年代前半、イギリスでRoxy Musicが、Bryan Ferryのスタイルを作り込んだ歌唱と、Brian Enoの電子的な処理を組み合わせた。そして、このスタイルを代表する存在となった。Brian Enoは後に、聴き方の度合いを強制せず、「無視できると同時に興味深い」音楽としてアンビエント（空間に溶け込むような音楽）を提唱している。

David Bowieは、1970年代前半から中盤にかけて、Ziggy Stardust、Aladdin Sane、Thin White Dukeなどの人格を用いた作品を発表した。自己の演出そのものを芸術としたのだ。1970年代末には、Talking Heads、Kate Bush、Japanらが続いた。

1980年代以降では、Björkが1990年代にアート・ポップで商業的に最も成功したとされる。Radioheadもアート・ポップに分類されることがある。2010年代にはFKA twigs、Kanye West（現Ye）といった作家に受け継がれている。

批判とされるのは、大衆音楽の直接性を失って自意識過剰に陥る危険、そして大衆との違いを強調するエリート主義だという点だ。</p>
