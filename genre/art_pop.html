<h1>Art Pop（アートポップ）とは</h1>
<p>大衆音楽の形式を保ちながら、現代美術や実験音楽の発想を持ち込む様式。音楽の語法で定義するのではなく、イメージ・スタイル・身振りを重視し、ハイカルチャー（芸術性が高いとされる文化）と大衆文化の区別を崩す、緩く定義されたポップのスタイ</p>
<p>大衆音楽の形式を保ちながら、現代美術や実験音楽の発想を持ち込む様式。音楽の語法で定義するのではなく、イメージ・スタイル・身振りを重視し、ハイカルチャー（芸術性が高いとされる文化）と大衆文化の区別を崩す、緩く定義されたポップのスタイルである。ポップの商業芸術性や人工性、自己の問題などが関心の中心になる。不協和音や無調的な和声、変拍子、テープの逆再生や環境音の挿入といった要素は、作品や作家によっては用いられる。歌詞は物語や恋愛にとどまらず、自我の解体、性と身体、消費社会、死といった主題を、主題として扱うことがある。もう一つの特徴は、美術など他分野との結びつきで、ジャケット、衣装、ミュージック・ビデオ、舞台美術が音楽と同じ重みを持つ。作品全体が一つの構想として示されることもある。</p>
<h2>成り立ち</h2><p>1960年代半ばに始まり、英国では美術学校での学びに、米国ではAndy Warholとその周辺のThe Velvet Undergroundの影響に由来するとされる。当時のイギリスでは、美術学校は労働者階級の賢い子供たちの伝統的な逃げ道だったとSimon Frithは述べ、多くのバンドを生んだ土壌だった。John LennonやPete Townshendらがその例で、Keith RichardsやRay Daviesも1960年代前半に美術学校に通っていた。1960年代半ばから後半にかけて、The Beatlesがスタジオを作曲の道具として用い、The Beach BoysのBrian WilsonがPet Soundsで多層的な音響構成を示したことが、出発点の一つとされる（Phil Spectorも挙げられるなど、起点は論者によって異なる）。ニューヨークでは、Andy Warholの後ろ盾のもとThe Velvet Undergroundが1967年3月にデビュー・アルバムを発表し（最初のシングルは1966年7月）、ノイズと単調な反復、そして薬物や性を扱う歌詞により、芸術的表象の従来の序列を無視する前衛的なアプローチを打ち出した。1970年代前半、イギリスでRoxy Musicが、Bryan Ferryの様式化された歌唱とBrian Enoの電子的な処理を組み合わせ、この様式を代表する存在となった。Brian Enoは後に、聴き方の度合いを強制せず、「無視できると同時に興味深い」音楽としてアンビエント（空間に溶け込むような音楽）を提唱している。David Bowieは1970年代前半から中盤にかけて、Ziggy StardustやThin White Dukeなどの架空の人格を用いた作品を発表し、自己の演出そのものを芸術とした。1970年代末には、Talking HeadsやKate Bush（「art popの女王」と評された）、Japanらが続いた。1980年代以降、この系譜はBjörk、Radiohead（art popにも分類される）、そして2010年代にはFKA twigsやKanye West（現Ye）といった作家に受け継がれている。批判としては、聴衆を一般大衆から切り離そうとする傾向があると指摘する書き手や、職人の腕前へのこだわりが内向きになり、美しさだけを追う偏った執着に変わると批判する評論家がいる。</p>
<h2>代表曲</h2><ul><li>Running Up That Hill (Kate Bush)</li><li>Genesis (Grimes)</li><li>Nobody (Mitski)</li><li>Heroes (David Bowie)</li><li>Cloudbusting (Kate Bush)</li><li>Cellophane (FKA twigs)</li><li>Army of Me (Björk)</li><li>Oblivion (Grimes)</li><li>New York (St. Vincent)</li><li>Venus as a Boy (Björk)</li><li>Liability (Lorde)</li><li>Digital Witness (St. Vincent)</li><li>All Is Full of Love (Björk)</li><li>Joga (Björk)</li><li>Big Time Sensuality (Björk)</li><li>Masseduction (St. Vincent)</li><li>Hyperballad (Björk)</li></ul>
