<h1>Hardwave（ハードウェーブ）とは</h1>
<p>ハードウェイヴは、ウェイヴ系の電子音楽が持つ感情の表現に、トランスやハードスタイル由来の高揚感と攻撃的な低音を結びつけた、2010年代後半の系統だ。 主役になる音は、トランス/ハードスタイル由来のスーパーソー・リードで、ドロップの</p>
<p>ハードウェイヴは、ウェイヴ系の電子音楽が持つ感情の表現に、トランスやハードスタイル由来の高揚感と攻撃的な低音を結びつけた、2010年代後半の系統だ。

主役になる音は、トランス/ハードスタイル由来のスーパーソー・リードで、ドロップの中心を担う。リース系の太いサブベースが、低い音域を支える。音色は、ディストーションとビットクラッシャーを通した合成音だ。金属的でありながら、哀愁を帯びた響きを持つ。上に重なる音には、リヴァーブを深くかけたシンセのパッド、そしてピッチ加工したヴォーカル断片が置かれる。

和音は自然短音階が中心だ。切迫感と憧れを同時に生む進行が好まれる。

テンポは130〜150BPM前後で、120〜150BPMとされることもある。ドラムは、半分の速さで感じられるよう配置されることが多い。リズムは、トラップ由来のハイハットの速いロールと、重いスネアまたはクラップの組み合わせだ。キックは深く沈み、808と呼ばれる音程を持つ低音と、しばしば一体化する。

ヴォーカルはほとんどなく、あっても加工された断片だ。

曲は短く、2分から3分半ほどで、はっきりしたサビと落ち込みを持つ。

見た目の文化との結びつきも強い。ゲーム画面やアニメ風の映像、退廃的な都市の情景、グリッチのかかった画像といった絵柄が、音と切り離せない形で出回る。ウェイヴやフォンクと隣り合うが、より攻撃的で音圧が高い点で区別される。</p>
<h2>成り立ち</h2><p>ハードウェイヴは、2017年ごろにインターネット上で生まれた。はっきりした地理的な中心を持たないジャンルである。

母体となったのは、ウェイヴ(wave)という系統だ。2013年ごろに英国のKlimeksがSoundCloudで「wave」とタグ付けしたことに始まるとされる。これはトラップ、クラウドラップ、UKダブステップ、グライム、ウィッチハウス、トランス等を混ぜた音楽だった。初期は英国のKlimeksやKareful(ロンドン)が目立ったが、初期から多国籍だった。ポーランド、ロシア、カナダなどにも地域シーンがある。SoundCloudとYouTubeが、主な流通の道だった。

「hardwave」という名称は、2017年ごろ、オーストラリアのパースを拠点とするSkelerとYthoが、トランスやハードスタイルの要素をウェイヴに取り入れて広めたとされる。命名者はSkeler単独とする見方もある。ここから、より攻撃的で音圧の高い方向へ進んだのが、ハードウェイヴである。

大きな役割を果たしたのは、SoundCloudという場そのものだった。この共有サービスでは、無名の制作者がすぐに作品を公開でき、タグと再生数によって見つけてもらえる仕組みがあった。地理的に離れた制作者が互いの作品を聴き合い、影響を与え合う。その速さは、それまでのシーンの作られ方とは根本から違っていた。

ウェイヴの先達としてはKarefulやKlimeks、ハードウェイヴの中心人物としてはSkeler、Ytho、Deadcrow、そして後にはJuche(スペイン出身)が挙がる。レーベルではLiquid Ritual(2017年設立、Kareful、LTHL、Stohouの3人による共同設立)、そしてSoundCloud上の集まりが機能した。ゲーム画面やアニメ風の映像が使われることがある。

もう一つの背景として、2010年代後半の若い世代の心情がある。この音楽は孤独、疎外、終末的な感覚を主題とする。そして、経済的な不安定さとインターネット上の生活が当たり前になった世代の気持ちを映している、と見る向きもある。

この系統は2018〜19年に広がり、RL Grimeなど大手DJの支持を受けた。しかし批判としては、既存の音の寄せ集めで、アルゴリズム向けのマーケティングだということが指摘される。2020年代に入り、この語彙はフォンク/ドリフト・フォンクと近接している。一方で共同体は続いており、動画配信を通じて新しい世代の制作者が絶えず加わっている。</p>
