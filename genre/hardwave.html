<h1>Hardwave（ハードウェーブ）とは</h1>
<p>ウェイヴ系の電子音楽の情感に、トラップやハードコア由来の攻撃的な低音を接続した2010年代後半の系統。テンポは表記上は140〜160BPM前後だが、ドラムは半分の速度で感じられるよう配置されることが多い。中核となるのは、極端に歪ま</p>
<p>ウェイヴ系の電子音楽の情感に、トラップやハードコア由来の攻撃的な低音を接続した2010年代後半の系統。テンポは表記上は140〜160BPM前後だが、ドラムは半分の速度で感じられるよう配置されることが多い。中核となるのは、極端に歪ませたベースの単音で、これがしばしば旋律を担う。音色はディストーションとビットクラッシャー、そしてリング変調を通した合成音で、金属的でありながら哀愁を帯びた響きを持つ。この「美しく壊れた音」がジャンルの識別点になっている。上物には、リヴァーブを深くかけたシンセのパッド、加工したピアノ、そしてアニメや映画から抜き出した台詞の断片が置かれる。和声は自然短音階が中心で、切迫感と憧憬を同時に生む進行が好まれる。リズムはトラップ由来のハイハットの高速なロールと、重いスネアまたはクラップの組み合わせ。キックは深く沈み、しばしば808と呼ばれる音程を持つ低音と一体化する。曲の構成は短く、2分から3分半程度で、明確なサビと落ち込みを持つ。ヴォーカルはほとんどなく、あっても加工された断片。視覚文化との結びつきが強く、アニメの映像、退廃的な都市の情景、グリッチのかかった画像といった図像が音と不可分に流通する。ウェイヴやフォニックと隣接するが、より攻撃的で音圧が高い点で分かれる。</p>
<h2>成り立ち</h2><p>2015年前後にインターネット上で成立した、明確な地理的中心を持たないジャンルである。母体となったのは、2010年代前半にヨーロッパとロシアで発展したウェイヴ(wave)という系統で、これはトラップの骨格に暗く叙情的なシンセを乗せたものだった。ロシアとウクライナ、フランス、オランダの若い制作者が中心で、SoundCloudとYouTubeを主要な流通経路とした。ここから、より攻撃的で音圧の高い方向へ進んだのがハードウェイヴになる。決定的な役割を果たしたのは、SoundCloudという場そのものだった。この共有サービスでは、無名の制作者が即座に作品を公開でき、タグと再生数によって発見される仕組みがあった。地理的に離れた制作者が互いの作品を聴き合い、影響を与え合う速度が、従来のシーン形成とは根本的に異なっていた。中心となった作家としてはKareful、Klimeks、Skeler、Deadcrow、SIDEWALKS AND SKELETONS、そして後にはHIGH KLASSIFIED、juche が挙がる。レーベルではLiquid Ritual(2014年設立)、Deep Dark &amp; Dangerousの周辺、そしてSoundCloud上の集合体が機能した。この文化には日本のアニメが強く関与している。多くの楽曲がアニメの映像を用いた非公式の動画とともに流通し、その視覚的な記号が音楽の情緒を規定した。日本文化への憧憬と、それを消費する欧米の若者という構図には、文化的専有をめぐる議論も存在する。もう一つの背景として、2010年代後半の若年層の心情がある。この音楽は孤独、疎外、終末的な感覚を主題とし、経済的な不安定さとインターネット上の生活が常態化した世代の情緒を反映していると分析されている。2018年前後にこの系統は一定の広がりを見せ、大手の制作者もこの語彙を取り入れ始めた。批判としては、既存の要素の寄せ集めであること、アニメの映像に依存した表面的な情緒であること、そして楽曲が短く消費的であることが指摘される。またSoundCloudという単一の企業の存続に文化全体が依存している脆弱性も繰り返し議論されてきた。2020年代に入り、この語彙はフォニックやドリフト・フォニック、そしてハイパーポップの周辺へ流れ込み、境界が曖昧になっている。一方で共同体は継続しており、動画配信を通じて新しい世代の制作者が絶えず参入している。</p>
