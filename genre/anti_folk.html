<h1>Anti-Folk（アンチフォーク）とは</h1>
<p>フォークの形式を用いながら、硬直したフォークの様式や排他性に反発し、技巧より個性や創造性を重んじる音楽である。編成は固定されておらず、弾き語りが多いが、ピアノ（Regina Spektor）やバンド編成（Jeffrey Lewis</p>
<p>フォークの形式を用いながら、硬直したフォークの様式や排他性に反発し、技巧より個性や創造性を重んじる音楽である。編成は固定されておらず、弾き語りが多いが、ピアノ（Regina Spektor）やバンド編成（Jeffrey Lewis）もある。アマチュア的な響きと、自分たちの手で作るDIY精神を特徴とし、技術より曲作りや個性を重んじる。洗練を拒む姿勢が、この分野の特徴として語られることが多い。テンポや和声に固有の様式はなく、Jeffrey Lewisは、1980年代半ばのロウアー・イースト・サイドの作り手たちを「技術や音楽的達成よりも、創造性とパンクっぽい独自性で互いを評価していた」と説明している。また別の機会には、アンチフォークであるにはSidewalk Cafeとの縁と、パンクとフォークを混ぜる（または両方から強い影響を受ける）ことの両方が必要だと述べた。歌唱も型にはまらず、自由である。特徴的なのは歌詞で、ユーモラスで反抗的、風刺的なものが多く、社会の変革を訴える抗議音楽の性格を併せ持つこともある。 真面目くさった態度を、ときに茶化す姿勢も見られる。</p>
<h2>成り立ち</h2><p>1980年代半ばのニューヨーク、マンハッタンが舞台である。グリニッチ・ヴィレッジには1960年代からフォークの伝統的な会場が残っていた。Lachと名乗る若い音楽家が、Folk CityやThe Speakeasyといったフォークの会場で演奏が受け入れられず、居場所を失ったことに反発し、ロウアー・イースト・サイドのリヴィントン・ストリートにある自宅のロフトを会場として独自の演奏会を始めたことが、この分野の直接の起点とされる。彼はこの場を当初「The Hidden Fortress」（黒澤明の映画に由来）と名付け、のちにこの場は「The Fort」と呼ばれた。Lachの回想では、同じ時期に開かれていたフォークの祭りに当てつけて、自分たちの催しを「Antifolk Festival」と名乗ったという。ここに集まったのは、Lachと、フォーク界の体制に不満を持つ仲間たち（Roger ManningやKirk Kellyら）だった。呼称の由来については、Cindy Lee Berryhillが、Lachがすでに「New York New Folk Festival」のような名前で最初の祭りを開いており、自分がAntiFolkという名を提案したと語っている。Lach自身は「覚えているかわからないが、あり得ることだ」と述べ、彼女の話を否定していない。1980年代後半にはBerryhillやRoger Manningらが作品を発表した。1990年代に活動の場となったのが、イースト・ヴィレッジの小さなバーで、そこで開かれた催しから多くの作り手が育った。のちにこの場で頭角を現したのがThe Moldy Peachesである。Adam Greenと Kimya Dawson が始めた2人組（ニューヨークでは4〜6人編成のバンドとして活動した）は、Kimya Dawsonのバニー衣装など手作り風の仮装で演奏し、下品で子どもじみた歌詞を歌ったが、2007年に彼らの楽曲が人気映画の音楽に採用されたことで、思いがけず広い聴衆に届いた。同じ場から Regina Spektor が現れ、後に商業的な成功を収めている。Jeffrey Lewisは、自作の漫画を演奏中に見せながら歌うという形式で独自の地位を築いた。この分野は、音楽的な様式よりも、共同体と場所によって定義されることが多い。この場について、Lachは、「antifolk」という名がふるいのように働き、すぐれた作り手が多く集まったと語っている。</p>
