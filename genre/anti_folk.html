<h1>Anti-Folk（アンチフォーク）とは</h1>
<p>フォークの形式を用いながら、フォークが背負ってきた誠実さや技巧の規範を意図的に裏切る音楽である。編成は生ギター一本と歌という最小限が基本で、時にウクレレ、玩具の楽器、口琴などが加わる。演奏は上手さを目指さず、音程が外れること、弦の</p>
<p>フォークの形式を用いながら、フォークが背負ってきた誠実さや技巧の規範を意図的に裏切る音楽である。編成は生ギター一本と歌という最小限が基本で、時にウクレレ、玩具の楽器、口琴などが加わる。演奏は上手さを目指さず、音程が外れること、弦の押さえが甘くて濁ること、テンポが揺れることが、そのまま残される。録音も家庭用の機材で行われ、雑音や生活音が混ざったままにされることが多い。この、洗練を拒む姿勢が、この分野の唯一と言ってよい共通項である。テンポや和声に固有の様式はなく、単純な三和音の繰り返しが中心である。歌唱は囁く、叫ぶ、棒読みする、途中で笑い出すなど自由で、複数人が不揃いに歌うこともある。決定的なのは歌詞で、社会正義や普遍的な愛といった大きな主題を避け、代わりに極めて私的で滑稽な出来事、失敗談、自己嫌悪、下品な冗談、意味を成さない言葉遊びが扱われる。ただしその軽薄さの底に、生々しい孤独や不安が覗く瞬間があり、その落差が聴きどころとなっている。真面目さを演じることへの徹底した不信が、この分野を貫く態度である。</p>
<h2>成り立ち</h2><p>1980年代半ばのニューヨーク、マンハッタンのイースト・ヴィレッジが舞台である。この地区には1960年代からフォークの伝統的な会場が残っており、そこでは技術と誠実さを重んじる保守的な価値観が支配していた。Lachと名乗る若い音楽家が、その代表的な会場での出演を拒まれたことに反発し、自らの住居を会場として独自の演奏会を始めたことが、この分野の直接の起点とされる。彼はそれを、既存のフォークの集会を茶化した名で呼び、参加者は誰でも歌ってよいという開かれた形式を採った。ここに集まったのは、演奏技術を持たない者、パンクの現場から流れてきた者、そして真面目なフォークに飽きた者たちだった。1980年代後半にはCindy Lee BerryhillやRoger Manningらが作品を発表し、この呼称が定着する。1990年代に活動の場となったのが、同じ地区の小さな飲食店で、そこで開かれた催しから多くの作り手が育った。この場から現れたのがThe Moldy Peachesである。Adam Greenと Kimya Dawson による二人組は、動物の着ぐるみを着て演奏し、下品で子どもじみた歌詞を歌ったが、2007年に彼らの楽曲が人気映画の音楽に採用されたことで、思いがけず広い聴衆に届いた。同じ場から Regina Spektor が現れ、後に商業的な成功を収めている。Jeffrey Lewisは、自作の漫画を演奏中に見せながら歌うという形式で独自の地位を築いた。この分野の特異な点は、それが音楽的な様式ではなく、共同体と場所によって定義されていたことである。誰でも歌ってよいという原則は、才能の有無にかかわらず参加を認めるという意味であり、その帰結として、極めて質の低い演奏と、稀に現れる強烈な才能が同じ舞台に並んだ。この乱雑さこそが、この分野が守ろうとしたものだった。</p>
