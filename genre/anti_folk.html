<h1>Anti-Folk（アンチフォーク）とは</h1>
<p>アンチフォークは、フォークの形を借りながら、フォークが大切にしてきた誠実さや技巧のお手本を、あえて裏切る音楽だ。 編成は決まっていない。弾き語りが多いが、ピアノ（Lach）やバンド編成（Jeffrey Lewis）もある。演奏は上</p>
<p>アンチフォークは、フォークの形を借りながら、フォークが大切にしてきた誠実さや技巧のお手本を、あえて裏切る音楽だ。

編成は決まっていない。弾き語りが多いが、ピアノ（Lach）やバンド編成（Jeffrey Lewis）もある。演奏は上手さを目指さない。音程が外れても、弦の押さえが甘くて音が濁っても、テンポが揺れても、そのまま残される。録音も家庭用の機材で行われることがあり、雑音や生活音が混ざったままにされることが多い。こうした、洗練を拒む姿勢が、この分野の特徴として語られることが多い。

テンポや和声に、この分野ならではの決まった型はない。Jeffrey Lewisは、アンチフォークの意味を問われ、「技術より創造性」、あるいは「パンクとフォークの影響の混合」という2通りの説明を挙げた。

歌い方は自由だ。ささやく、叫ぶ、棒読みする、途中で笑い出す。複数人が不揃いに歌うこともある。

特徴的なのは歌詞だ。極めて私的で滑稽な出来事、失敗談、自己嫌悪、下品な冗談、意味のない言葉遊びが多く扱われる。その一方で、政治や社会の変革を訴える抗議音楽の面を、あわせ持つことも多い。ただ、その軽薄さの底に、生々しい孤独や不安が覗く瞬間があり、その落差が聴きどころになっている。真面目さを演じることへの徹底した不信が、この分野を貫く態度である。</p>
<h2>成り立ち</h2><p>舞台は、1980年代半ばのニューヨーク、マンハッタンだ。

当時、グリニッチ・ヴィレッジには、1960年代からフォークの伝統的な会場が残っていた。そこでは、技術と誠実さを重んじる保守的な価値観が強かったとされる。

そこに、Lachと名乗る若い音楽家が現れる。彼は、Folk CityとSpeakeasyで受け入れられなかったことに反発し、ロウアー・イースト・サイドのリヴィントン・ストリートにある自宅の約700平方フィートのロフトを会場にして、独自の演奏会を始めた。これが、この分野の直接の起点とされる。彼はこの催しを、既存のフォークの集会を茶化した「Antihoot」という名で呼び、参加者は誰でも歌ってよいという開かれた形式にした。

集まったのは、演奏技術を持たない者、パンクの現場から流れてきた者、そして真面目なフォークに飽きた者たちが多かったとされる。1980年代後半には、Cindy Lee BerryhillやRoger Manningらが作品を発表し、この呼称が定着していく（Berryhillが名称を提案したとされる）。

1993年からは、SideWalk Cafeが拠点となり、そこで開かれた催しから多くの作り手が育った。のちにこの場で頭角を現したのが、The Moldy Peachesだ。Adam GreenとKimya Dawsonの2人組で、Kimya Dawsonのバニー衣装など手作り風の仮装で演奏し、下品で子どもじみた歌詞を歌った。2007年に彼らの楽曲が人気映画の音楽に採用されると、思いがけず広い聴衆に届いた。2000年前後からは、Regina Spektorらも注目を集め、後に商業的な成功を収めている。Jeffrey Lewisは、自作の漫画を演奏中に見せながら歌うという形式で、独自の地位を築いた。

この分野は、音楽のスタイルではなく、共同体と場所によって定義されていた、という見方もある。誰でも歌ってよいという原則は、才能の有無にかかわらず参加を認めるという意味だった。その結果、質の低い演奏と、稀に現れる強烈な才能が、同じ舞台に並んだとも言われる。この乱雑さこそが、この分野が守ろうとしたものだった。</p>
