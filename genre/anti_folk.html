<h1>Anti-Folk（アンチフォーク）とは</h1>
<p>フォークの形式を用いながら、フォークが背負ってきた誠実さや技巧の規範を意図的に裏切る音楽である。編成は固定されておらず、弾き語りが多いが、ピアノ（Lach）やバンド編成（Jeffrey Lewis）もある。演奏は上手さを目指さず、</p>
<p>フォークの形式を用いながら、フォークが背負ってきた誠実さや技巧の規範を意図的に裏切る音楽である。編成は固定されておらず、弾き語りが多いが、ピアノ（Lach）やバンド編成（Jeffrey Lewis）もある。演奏は上手さを目指さず、音程が外れること、弦の押さえが甘くて濁ること、テンポが揺れることが、そのまま残される。この、洗練を拒む姿勢が、この分野の特徴として語られることが多い。テンポや和声に固有の様式はなく、Jeffrey Lewisは、アンチフォークの意味を問われて、「技術より創造性」、あるいは「パンクとフォークの影響の混合」という2通りの説明を挙げている。歌唱は囁く、叫ぶ、棒読みする、途中で笑い出すなど自由で、複数人が不揃いに歌うこともある。特徴的なのは歌詞で、極めて私的で滑稽な出来事、失敗談、自己嫌悪、下品な冗談、意味を成さない言葉遊びが多く扱われる一方、政治や社会の変革を訴える抗議音楽の面を併せ持つこともある。また、滑稽な歌詞の底に、生々しい孤独や不安が覗く瞬間があり、その落差が聴きどころとなっている。真面目さを演じることへの徹底した不信が、この分野を貫く態度である。</p>
<h2>成り立ち</h2><p>1980年代半ばのニューヨーク、マンハッタンが舞台である。グリニッチ・ヴィレッジには1960年代からフォークの伝統的な会場が残っていた。Lachと名乗る若い音楽家が、Folk CityやThe Speakeasyといった会場で受け入れられず、締め出されたことに反発し、ロウアー・イースト・サイドのリヴィントン・ストリートにある自宅のロフト（約700平方フィート＝約65平方メートル）を会場として独自の演奏会を始めたことが、この分野の直接の起点とされる。彼はそのロフトを「The Hidden Fortress」（のちに「The Fort」）と呼び、催しを、既存のフォークの集会（フートナニー）を茶化した「Antihoot」という名で呼び、参加者は誰でも歌ってよいという開かれた形式を採った。ここに集まったのは、アマチュア的で、自分たちの手で作ることを重んじる作り手たちだった。1980年代後半にはCindy Lee BerryhillやRoger Manningらが作品を発表し、この呼称が定着する（Cindy Lee Berryhillは、「Antifolk」という名を提案したのは自分だと語っている）。1993年からはイースト・ヴィレッジのSideWalk Cafeを拠点とし、そこで開かれた催しから多くの作り手が育った。のちに、2000年前後からこの場で頭角を現したのがThe Moldy Peachesである。Adam Greenと Kimya Dawson は1994年ごろにニューヨーク州ウェストチェスター郡のレコード店で親しくなり、のちにニューヨーク市に移ってこの場で活動した。この2人組は、Kimya Dawsonのバニー衣装など手作り風の仮装で演奏し、下品で子どもじみた歌詞を歌ったが、2007年に彼らの楽曲が人気映画の音楽に採用されたことで、思いがけず広い聴衆に届いた。Regina Spektorも2000年代初頭にこの場で頭角を現し、後に商業的な成功を収めている。Jeffrey Lewisは、自作の漫画を演奏中に見せながら歌うという形式で独自の地位を築いた。この分野は、音楽的な様式よりも、共同体と場所によって定義されるという見方もある。誰でも歌ってよいという原則は、才能の有無にかかわらず参加を認めるという意味であり、その帰結として、アマチュア的で、DIYの志向が強い演奏が同じ舞台に並んだ。この乱雑さこそが、この分野が守ろうとしたものだった。</p>
