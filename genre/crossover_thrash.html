<h1>Crossover Thrash（クロスオーバースラッシュ）とは</h1>
<p>クロスオーバー・スラッシュは、ハードコア・パンクの短さとまっすぐな感情の勢いに、スラッシュメタルの速い刻みと歪んだギターを掛け合わせた音楽だ。純粋なスラッシュメタルと比べるとパンク寄りの音だが、ハードコアよりはメタルの要素が多い。</p>
<p>クロスオーバー・スラッシュは、ハードコア・パンクの短さとまっすぐな感情の勢いに、スラッシュメタルの速い刻みと歪んだギターを掛け合わせた音楽だ。純粋なスラッシュメタルと比べるとパンク寄りの音だが、ハードコアよりはメタルの要素が多い。スケート文化と結びついたバンド（Suicidal Tendenciesなど）も多い。

ギターは、多くの曲で、手首を高速で往復させて短い和音を刻む奏法を基本とする。ソロは、ハードコア由来の短く荒いもののほか、メタル由来の整ったリードギター・ソロを入れるバンドも多い。

ドラムは、ハードコアやスラッシュで多用される、キックとスネアを交互に打つ高速の2ビートが中心だ。これはスキャンク・ビート、またはスラッシュ・ビートとも呼ばれる。ブレイクダウンでは、テンポを落とす。

テンポは非常に速いが、常に全力なのではない。テンポを落として重く展開する部分（ブレイクダウン）を挟む曲が多い。曲は純粋なハードコアより長めになる傾向がある。ただしS.O.D.のように、極端に短い曲を含むものもある。導入から終わりまで、一気に走り抜ける。

ヴォーカルは、歌わずに叫ぶ。多くの曲で、要所では複数人が声を揃えて拳を突き上げるための短い掛け声を入れる。

歌詞は、権力への嫌悪、警察、宗教、戦争、日常の苛立ちを扱う。一方で、意図的に馬鹿馬鹿しい題材を選ぶ悪ふざけも多い。深刻さと不真面目さが同居している。</p>
<h2>成り立ち</h2><p>1980年代前半のアメリカでは、ハードコア・パンクとヘヴィメタルの聴き手は、互いを敵のように見ていた。髪型も服装も客層も、明確に分かれていた。この壁を崩した要因の一つが、スケート文化だったとされる。ライブでの共演や客層の共有を通じて、両者の混ざり合いが進んだ。

テキサス州ヒューストンで結成されたD.R.I.は、当初は数十秒の曲を並べる純粋なハードコアだった。しかし次第に、メタルの刻みを取り入れていく。1987年に発表した作品の題名がクロスオーバーで、この呼称はそれに由来するとされる（諸説あり）。

カリフォルニア州ヴェニスのSuicidal Tendenciesは、ギャングとの関係を噂された荒れた気風を持ち込んだ。ノースカロライナ州ローリーのCorrosion of Conformityは、1985年の『Animosity』で、Black Sabbath的な重さを持ち込み、クロスオーバーの方向性を広げた。ニューヨークではCro-Magsが、1986年に発表した『The Age of Quarrel』で、ハードコアにメタルを持ち込んだ。街の暴力とクリシュナ意識への傾倒が奇妙に同居した独自の世界観を打ち立て、ニューヨーク・ハードコアの伝説となる。

1985年には、スラッシュメタルのバンドAnthraxのScott IanとCharlie Benante、元AnthraxのDan Lilkerが、Billy Milanoを歌手に迎えてS.O.D.を結成した。録音とミックスを数日(録音は7月2〜3日)で済ませた作品を発表する。これは『Speak English or Die』で、商業的にも成功し（数十万〜100万枚規模とされる）、この分野を広く知らしめた。一方で、歌詞が同性愛・女性・外国文化を扱って論争を呼んだ。メンバーは「冗談」だと説明しており、一方でこの作品は名盤としても評価されている。

スケートボード専門誌のThrasherは、ハードコアやパンクを中心に紹介しつつ、メタルも取り上げた。

1990年前後には、流行が一段落する。ニューヨーク・ハードコアで発達したブレイクダウンの構造が、クロスオーバーを経て、1990年代初頭のメタルコアに受け継がれた。2000年代以降は、当時の音を意識的に再現する新しい世代が、世界各地に現れた。短く速く馬鹿馬鹿しいという価値観は、今も更新され続けている。</p>
