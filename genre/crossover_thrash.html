<h1>Crossover Thrash（クロスオーバースラッシュ）とは</h1>
<p>ハードコア・パンクの短さと直情性に、スラッシュメタルの速い刻みと歪んだギターを掛け合わせた音楽である。曲の長さは1分から2分程度が標準で、30秒に満たないものも珍しくなく、導入から終わりまで一気に走り抜ける。テンポは180から25</p>
<p>ハードコア・パンクの短さと直情性に、スラッシュメタルの速い刻みと歪んだギターを掛け合わせた音楽である。曲の長さは1分から2分程度が標準で、30秒に満たないものも珍しくなく、導入から終わりまで一気に走り抜ける。テンポは180から250 BPMと非常に速いが、常に全力なのではなく、曲の途中で突然半分の速度に落ち、身体をぶつけ合って踊るための重い部分が挿入される、この落差が最大の聴かせどころである。ギターは手首を高速で往復させて短い和音を刻む奏法を基本とし、ソロは無秩序に音を撒き散らす短いものか、そもそも省略される。ドラムはスネアを裏拍で連打する走る刻みと、ハードコア特有の前のめりな二拍子を使い分ける。ヴォーカルは歌わずに叫び、要所では複数人が声を揃えて拳を突き上げるための短い掛け声を入れる。歌詞は権力への嫌悪、警察、宗教、戦争、日常の苛立ちを扱う一方、意図的に馬鹿馬鹿しい題材を選ぶ悪ふざけも多く、深刻さと不真面目さが同居している。スケートボード文化と密接に結びついており、その速度感と危険さが音の性格をそのまま説明している。純粋なスラッシュメタルと比べると、演奏の精度より勢いを優先する点が決定的に異なる。</p>
<h2>成り立ち</h2><p>1980年代前半のアメリカでは、ハードコア・パンクとヘヴィメタルの聴き手は互いを敵視しており、髪型も服装も客層も明確に分かれていた。この壁を壊したのはスケートボードだった。若者たちが公園や空きプールで滑る際に、どちらの音楽も等しく機能したことから、両者の混在が自然に進んだのである。テキサス州ヒューストンで結成されたD.R.I.は、当初は数十秒の曲を並べる純粋なハードコアだったが、次第にメタルの刻みを取り入れ、1987年に発表した作品の題名をそのままクロスオーバーとしたことで、この呼称が定着した。カリフォルニア州ヴェニスのSuicidal Tendenciesは、地元のギャング文化と結びついた荒れた気風を持ち込み、ノースカロライナ州ローリーのCorrosion of Conformityは1985年の作品でこの融合をより攻撃的な形で示した。ニューヨークではCro-Magsが1986年に発表した作品によって、街の暴力とヒンドゥー教への傾倒が奇妙に同居した独自の世界観を打ち立て、ニューヨーク・ハードコアの伝説となる。1985年には、スラッシュメタルのバンドAnthraxのScott IanとCharlie Benanteが、Billy Milanoを歌手に迎えてS.O.D.を結成し、数日で書き上げたという作品を発表した。これは商業的にも成功し、この分野を広く知らしめた一方、歌詞に含まれる外国人への侮蔑的な表現が人種差別だとして激しく批判された。当事者は風刺であり冗談だと主張し続けたが、この論争は決着せず、現在では擁護しがたいものとして扱われることが多い。スケートボード専門誌のThrasherが両方の音楽を分け隔てなく紹介したことも、混在を後押しした。1990年前後には流行が一段落するが、この時期に生まれた、速い部分と重い部分を交互に配置する構造は、後のメタルコアやビートダウン・ハードコアにそのまま引き継がれた。2000年代以降は、当時の音を意識的に再現する新しい世代が世界各地に現れ、短く速く馬鹿馬鹿しいという価値観は今も更新され続けている。</p>
