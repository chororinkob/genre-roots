<h1>Swing（スウィング）とは</h1>
<p>スウィングは、1930年代から1940年代にかけて、アメリカで最も広く聴かれ、踊られたジャズのスタイルだ。 編成は大楽団だ。トランペット、トロンボーン、サックスが、それぞれ数人ずつの組を作る。そこに、ピアノ、ギター、コントラバス（</p>
<p>スウィングは、1930年代から1940年代にかけて、アメリカで最も広く聴かれ、踊られたジャズのスタイルだ。

編成は大楽団だ。トランペット、トロンボーン、サックスが、それぞれ数人ずつの組を作る。そこに、ピアノ、ギター、コントラバス（大型の弦楽器）、ドラムのリズム隊が加わる。

各組は、一体となって書かれた旋律を吹く。組と組が呼びかけと応答を交わす構造が基本だ。したがって、この音楽の中心には編曲がある。譜面を書く者の技量が、楽団の性格を決めた。

リズムの要は、コントラバスだ。4拍全てに音を置いて、歩くように動く。リズム隊と奏者が、拍の細分を長・短に不均等に分け、しばしば三連符に近い比率で演奏する。比率はテンポや奏者で変わる。「swing」は、もともとリズムの感覚を指す語である。

テンポは、中庸から速いものが中心だ。ただし、バラードから非常に速いものまで幅広く、標準的な数値の範囲は定まっていない。

曲の構造は、多くは32小節（AABA）か12小節ブルースの形式を繰り返す。その中に、独奏の場が設けられる。編曲と即興が同居する点が、このスタイルの核心である。

歌が入る場合は、楽団専属の歌手が担う。改良されたマイクのおかげで声を張る必要がなくなり、親密な歌唱（クルーニング）が可能になった。この技術はスウィング時代より前からあり、後に楽団の歌手も活用した。</p>
<h2>成り立ち</h2><p>舞台は、1920年代前半のアメリカだ。当時のジャズは、少人数による集団即興が主流だった。

Fletcher Henderson楽団で、Don Redmanが、管楽器を組に分けて呼応させる書法を作った。それをHendersonとともに固めた。Hendersonは、ニューヨークで活動するピアニスト・楽団指導者・編曲家である。1934年末ごろ、楽団解散後に、Hendersonは編曲をBenny Goodmanに提供し、その後も新作を書いた。

1935年8月21日、ロサンゼルスのPalomar Ballroomで、Benny Goodmanの楽団は、最初のセットの反応が鈍かった。そのあと、HendersonやSpud Murphyらの編曲を演奏すると、客が沸いた。これがスウィング時代の始まりとしばしば説明される（ただし通俗的な単純化とされる）。

それに先立つ1920年代後半、ニューヨークのハーレム（Cotton Club）では、Duke Ellingtonが独自の作曲法を磨いていた。楽団の各奏者の音色を前提に、楽曲を書く方法だ。Ellingtonは、奏者個々の音色に合わせて書き、楽団を楽器のように扱った。Gunther Schullerらは、彼をジャズ最重要の作曲家とみなす。カンザスシティのCount Basieは、楽譜に頼らないヘッド・アレンジとリフ、軽く均等に刻むリズム隊が特徴だった。後の楽団に影響を与えた。

この時代の重要な側面が、人種の問題である。ジャズは黒人が生み出した音楽でありながら、商業的な果実の多くは白人の楽団が得ていた。Benny Goodmanは1930年代半ば、Teddy WilsonやLionel Hamptonを自らの演奏に加えた。これは人種隔離下では異例だった。Wilsonはトリオ（3人組）で、Hamptonはカルテット（4人組）で加わった。

1938年、彼の楽団がカーネギー・ホールで演奏した。これは、ジャズの「晴れ舞台」として語られることが多い（批評家Bruce Ederは「最も重要なジャズ/ポピュラー音楽の演奏会」と評した）。ジャズ演奏自体は、それ以前にも行われていた。

この時代の終焉は複合的である。1942年から続いた音楽家組合による録音の停止、戦時の徴兵による人員の喪失、娯楽への重い課税、そして大人数を維持する経済的な負担が重なった。1940年代後半には、大楽団の多くが解散した。

ビバップは、1940年代前半〜半ばに、Charlie Parker、Dizzy Gillespie、Thelonious Monkらが、ニューヨークのジャムセッション（Minton's Playhouseなど）で発展させた。大楽団の衰退と並行して広まった。</p>
