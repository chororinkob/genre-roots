<h1>Swing（スウィング）とは</h1>
<p>1930年代から1940年代にかけて、アメリカで最も広く聴かれ踊られたジャズの様式である。編成は大楽団で、トランペット、トロンボーン、サックスがそれぞれ数人ずつの組を作り、そこにピアノ、ギター、コントラバス、ドラムのリズム隊が加わ</p>
<p>1930年代から1940年代にかけて、アメリカで最も広く聴かれ踊られたジャズの様式である。編成は大楽団で、トランペット、トロンボーン、サックスがそれぞれ数人ずつの組を作り、そこにピアノ、ギター、コントラバス、ドラムのリズム隊が加わる。各組は一体となって書かれた旋律を吹き、組と組が呼びかけと応答を交わす構造が基本となる。したがってこの音楽の中心には編曲があり、譜面を書く者の技量が楽団の性格を決めた。リズムの要はコントラバスで、四拍全てに音を置いて歩くように動く。ドラムはシンバルを一定の型で刻み続け、そこに跳ねを与える。この、三連符の一つ目と三つ目を鳴らすような不均等な刻みが、この音楽の名の由来となった揺れを生む。テンポは概ね120から200 BPMと幅広い。曲の構造は32小節、あるいはブルースの12小節の枠を繰り返すもので、その中に独奏の場が設けられる。編曲と即興が同居する点がこの様式の核心である。歌が入る場合は楽団専属の歌手が担い、音量の限界から接近して歌えるようになった電気式のマイクが、親密な歌唱を可能にした。</p>
<h2>成り立ち</h2><p>1920年代のジャズは、少人数による集団即興が主体で、演奏の場も限られていた。これを大人数の楽団で演奏可能な形へ組み替えたのがFletcher Hendersonである。彼はニューヨークで活動する編曲家であり、管楽器を組に分けて呼応させるという書法を確立した。1930年代半ば、経営難から彼は自らの編曲をBenny Goodmanへ売却する。1935年8月、ロサンゼルスの舞踏場で、それまで不評だったBenny Goodmanの楽団がこの編曲を演奏したところ、若い客が熱狂し、これがスウィング時代の幕開けとされる。同時期、ニューヨークのハーレムではDuke Ellingtonが、楽団の各奏者の音色を前提に楽曲を書くという独自の作曲法を確立した。彼にとって楽団は素材そのものであり、その手法はジャズを芸術音楽の水準へ引き上げたと評価される。カンザスシティのCount Basieは、書き込みを最小限にし、短い音型の反復と圧倒的に軽やかなリズム隊によって、対極的な魅力を示した。この時代の重要な側面が人種の問題である。ジャズは黒人が生み出した音楽でありながら、商業的な果実の多くは白人の楽団が得ていた。Benny Goodmanが1930年代半ば、Teddy WilsonやLionel Hamptonを自らの演奏に加えたことは、人種隔離が当然だった当時としては危険を伴う行為であり、南部での公演では実際に妨害を受けている。1938年、彼の楽団がカーネギー・ホールで演奏したことは、ジャズが正統な音楽として認められた象徴的な出来事となった。この時代の終焉は複合的である。1942年から続いた音楽家組合による録音の停止、戦時の徴兵による人員の喪失、娯楽への重い課税、そして大人数を維持する経済的な負担が重なり、1940年代後半には大楽団の多くが解散した。演奏者たちは少人数の編成へ移り、そこからビバップが生まれる。</p>
<h2>代表曲</h2><ul><li>Sing, Sing, Sing (Benny Goodman)</li><li>Take the 'A' Train (Duke Ellington)</li><li>One O'Clock Jump (Count Basie)</li><li>In the Mood (Glenn Miller)</li><li>Chattanooga Choo Choo (Glenn Miller)</li></ul>
