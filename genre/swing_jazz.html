<h1>Swing（スウィング）とは</h1>
<p>1920年代後半から30年代前半に形成され、1935年ごろから全国的に流行して、1930年代から1940年代にかけてアメリカで最も広く聴かれ踊られたジャズの様式である。編成は大楽団で、トランペット、トロンボーン、サックスがそれぞれ</p>
<p>1920年代後半から30年代前半に形成され、1935年ごろから全国的に流行して、1930年代から1940年代にかけてアメリカで最も広く聴かれ踊られたジャズの様式である。編成は大楽団で、トランペット、トロンボーン、サックスがそれぞれ数人ずつの組を作り、そこにピアノ、ギター、コントラバス（大型の弦楽器）、ドラムのリズム隊が加わる。各組は一体となって書かれた旋律を吹き、組と組が呼びかけと応答を交わす構造が基本となる。したがってこの音楽の中心には編曲があり、譜面を書く者の技量が楽団の性格を決めた。リズムの要はコントラバスで、4拍全てに音を置いて歩くように動く。ドラムは一定の型で拍を刻み続ける。リズム隊と奏者は、拍の細分を長・短に不均等に分け、しばしば三連符（1拍を3等分したリズム）に近い比率で演奏し、これが特有の揺れ（跳ね）を生む。比率はテンポや奏者によって変わる。テンポは中庸から速いものが中心だが、バラードから非常に速いものまで幅広く、標準的な数値の範囲は定まっていない。曲の構造は多くが32小節、あるいはブルースの12小節の枠を繰り返すもので、その中に独奏の場が設けられる。編曲と即興が同居する点がこの様式の核心である。歌が入る場合は楽団専属の歌手が担った。マイクの改良で声を張り上げる必要がなくなり、小さな声で近づいて歌う親密な歌唱（クルーニング）が可能になっており、楽団の歌手もこれを活用した。</p>
<h2>成り立ち</h2><p>1920年代前半のジャズは、少人数による集団即興が主流だった（Hendersonのような大編成の先駆も同時期にあった）。これを大人数の楽団で演奏可能な形へ組み替えるうえで大きな役割を果たしたのが、ピアニスト・楽団指導者・編曲家のFletcher Hendersonである。彼の楽団でDon Redmanが、管楽器を組に分けて呼応させる書き方を作り、Hendersonとともに手法を確立した。1934年末ごろ、楽団の解散と経営難から彼は編曲をBenny Goodmanに提供し、その後も新作を書いた。1935年8月21日、ロサンゼルスのPalomar Ballroomで、最初の演奏への反応が鈍かったBenny Goodmanの楽団が、HendersonやSpud Murphyらの編曲を演奏すると客が沸き、これがスウィング時代の始まりとしばしば説明される（ただし通俗的な単純化とされる）。それに先立つ1920年代後半、ニューヨークのハーレム（Cotton Club）では、Duke Ellingtonが、楽団の各奏者の音色を前提に楽曲を書くという独自の作曲法を磨いていた。彼は楽団を一つの楽器のように扱い、Gunther Schullerらは彼をジャズで最も重要な作曲家とみなしている。カンザスシティのCount Basieは、楽譜に頼らないヘッド・アレンジ（その場で口頭で決める編曲）とリフ（短い音型の反復）、軽く均等に刻むリズム隊を特徴とし、後の楽団に影響を与えた。この時代の重要な側面が人種の問題である。ジャズは黒人が生み出した音楽でありながら、商業的な果実の多くは白人の楽団が得ていた。Benny Goodmanが1930年代半ば、Teddy WilsonやLionel Hamptonを自らの演奏に加えたことは、人種隔離下では異例だった。Wilsonはトリオ（3人組）で、Hamptonはカルテット（4人組）で加わった。1938年、彼の楽団がカーネギー・ホールで演奏したことは、ジャズの「晴れ舞台」として象徴的に語られる（批評家のBruce Ederは「最も重要なジャズ/ポピュラー音楽の演奏会」と評した）。ジャズの演奏自体はそれ以前にも同ホールで行われていた。この時代の終焉は複合的である。1942年から続いた音楽家組合による録音の停止、戦時の徴兵による人員の喪失、娯楽への重い課税、そして大人数を維持する経済的な負担が重なり、1940年代後半には大楽団の多くが解散した。ビバップは1940年代前半〜半ばに、Charlie Parker、Dizzy Gillespie、Thelonious Monkらがニューヨークの小編成のジャムセッション（即興で自由に演奏し合う集まり）で発展させ、大楽団の衰退と並行して広まった。</p>
<h2>代表曲</h2><ul><li>Chattanooga Choo Choo (Glenn Miller)</li><li>Sing, Sing, Sing (Benny Goodman)</li><li>Take the 'A' Train (Duke Ellington)</li><li>One O'Clock Jump (Count Basie)</li><li>In the Mood (Glenn Miller)</li><li>A String of Pearls (Glenn Miller)</li><li>Tuxedo Junction (Erskine Hawkins)</li><li>Air Mail Special (Benny Goodman)</li><li>It Don't Mean a Thing (Duke Ellington)</li><li>Minnie the Moocher (Cab Calloway)</li><li>Boogie Woogie Bugle Boy (The Andrews Sisters)</li><li>Little Brown Jug (Glenn Miller)</li><li>Flying Home (Lionel Hampton)</li><li>Don't Be That Way (Benny Goodman)</li><li>Sentimental Journey (Les Brown feat. Doris Day)</li><li>Frenesi (Artie Shaw)</li><li>Moonglow (Artie Shaw)</li><li>At the Woodchopper's Ball (Woody Herman)</li><li>Opus One (Tommy Dorsey)</li><li>Song of India (Tommy Dorsey)</li><li>Marie (Tommy Dorsey)</li><li>Christopher Columbus (Fletcher Henderson)</li></ul>
