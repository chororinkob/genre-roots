<h1>Cloud Rap（クラウドラップ）とは</h1>
<p>輪郭のはっきりしない、霧の中に浮かんでいるようなヒップホップだ。 音の中心は、サンプル（既存の録音の断片）の加工である。アンビエント、ニューエイジ、J-pop、ゲーム音楽、アニメ音楽などの断片を使う。それをリバーブ（残響）とローパ</p>
<p>輪郭のはっきりしない、霧の中に浮かんでいるようなヒップホップだ。

音の中心は、サンプル（既存の録音の断片）の加工である。アンビエント、ニューエイジ、J-pop、ゲーム音楽、アニメ音楽などの断片を使う。それをリバーブ（残響）とローパスフィルター（高い音を削る装置）で曇らせ、音程を下げて引き伸ばし、敷き詰める。

長いリバーブのかかった、浮遊感のあるコード進行が多い。全体としては、リズムよりも和音の持続と残響が支配的である。

ドラムは808系のトラップ風ドラムで、キック、スネアまたはクラップ、ハイハットを使う。曲により控えめにも重厚にもなる。ハイハットは細かく刻まれるが、音量は低い。テンポは遅めからミドルテンポで、制作解説では65〜85 BPM程度とされる。拍そのものが曖昧に感じられる曲も多い。

ラップは張り上げず、ため息のような発声で、拍から少しずつずれながら乗る。しばしばピッチ補正（音程の自動補正）がかかり、歌との境界が消える。

歌詞はドラッグ、疎外感、愛などを扱う。ブランド名や絵文字的な語が、そのまま歌詞になると評されることもある。

MySpace、ブログ、DatPiff、Tumblr、のちにSoundCloudなどで広まった。ジャケットは、低解像度の画像を粗く加工したものが定番になっていると評されることもある。</p>
<h2>成り立ち</h2><p>2010年、ブロガーのWalker Chamblissが「クラウド・ラップ」という語を使った。Main AttrakionzのSquadda Bの音楽を指した言葉である。カリフォルニア州バークレー出身のラッパーLil B、通称The BasedGodと、制作者Clams Casinoは、このサウンドの先駆者とされる。

2008年末のことだ。ニュージャージーで理学療法（助手）の資格取得のために学んでいたMichael Volpeは、Clams Casinoの名で曲を作っていた。Imogen Heapらのポップ／エレクトロポップ曲を大胆に加工した曲を、Lil Bに無料で送りつけていたのである。その一つ『I'm God』(2009)が、最初期の代表曲の一つとなった。

Lil Bは、2010年7月までに1,500曲以上を録音した。異常な多作ぶりである。そして歌詞はシュールで型破りで、既存のラップの規範を無視した。

ほぼ同時期に、ヒューストンのサウンドに影響を受けたASAP Rocky周辺と、ハーレムのASAP Mobが、同種の音を採用した。2011年のシングル『Peso』と、無料公開のミックステープ『Live.Love.A$AP』で、注目を集めた。制作者ではSpaceGhostPurrpやFriendzoneが先駆者として挙げられる。Ryan HemsworthやShlohmoは、周辺の音楽の世界の制作者と評されることもある。

この流れを可能にしたのは、技術的な条件だった。2007年に始まったSoundCloudが、レーベルを通さず誰でも音源を公開できる場を作った。Tumblrは、その雰囲気を見た目の面から補強した。

一方で、ジャンル名は評論家やブロガーが付けたもので、当事者の多くは受け入れなかった。評価の分かれる動きでもあった。

2012〜13年には、Yung Leanら北欧のSad Boysや、BladeeらのDrain Gangが、北欧でクラウド・ラップの流れを発展させた。その後、クラウド・ラップは、エモ・ラップなどのネット系ラップに影響を与えた。

2017年には、SoundCloud社の経営危機で、大量の音源が消える恐れが生じた。『I'm God』は、サンプルの権利処理に時間がかかった。インスト版が2020年4月24日に正式配信されたのは、そのあとのことだ。</p>
