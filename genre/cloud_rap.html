<h1>Cloud Rap（クラウドラップ）とは</h1>
<p>輪郭のはっきりしない、霧の中に浮かんでいるようなヒップホップ。音の要はサンプル（既存の録音の断片）の加工で、アンビエントやシューゲイザー、古い歌謡曲やアニメ音楽の断片を、リバーブ（残響）とローパスフィルター（高い音を削る装置）で曇</p>
<p>輪郭のはっきりしない、霧の中に浮かんでいるようなヒップホップ。音の要はサンプル（既存の録音の断片）の加工で、アンビエントやシューゲイザー、古い歌謡曲やアニメ音楽の断片を、リバーブ（残響）とローパスフィルター（高い音を削る装置）で曇らせ、音程を下げて引き伸ばして敷き詰める。ドラムは808（ドラムマシンの音）の柔らかいキックと短いスネアだけで、輪郭を立てず背景に沈む。ハイハットは細かく刻まれるが音量は低く、全体としてリズムよりも和音の持続と残響が支配的である。テンポは毎分60から80拍程度と遅く、拍そのものが曖昧に感じられる曲も多い。和音は解決せず、同じ二つの和音を延々と往復して浮遊感を保つ。ラップは張り上げず、ため息のような発声で拍から少しずつずれながら乗り、しばしばピッチ補正（音程の自動補正）がかかって歌との境界が消える。歌詞は街の描写よりも内面に向かい、退屈、うつ、薬、金と虚無、インターネット上の記号、恋愛の断片が脈絡なく並ぶ。ブランド名や絵文字的な語がそのまま歌詞になることも多い。制作も流通もインターネット上で完結しており、SoundCloudやBandcampに直接上げられ、ジャケットは低解像度の画像を粗く加工したものが定番になっている。</p>
<h2>成り立ち</h2><p>「クラウド・ラップ」という語は2010年にブロガーのWalker Chamblissが、Main AttrakionzのSquadda Bの音楽を指して使ったもので、カリフォルニア州バークレー出身のラッパーLil B、通称The BasedGodと、制作者Clams Casinoは、そのサウンドの先駆者とされる。2010年頃、ニュージャージーで理学療法（助手）の資格取得のために学んでいたMichael Volpeは、Clams Casinoの名で、Imogen Heapなどのインディーポップを大胆に加工した曲をLil Bに無料で送りつけていた。その一つ『I'm God』(2009)が、このジャンルの原型となった。Lil Bは2010年7月までに1,500曲以上を無料公開した異常な多作ぶりと、意味を成さない即興のような歌詞で、既存のラップの規範を無視した。ほぼ同時期、ヒューストンのDJ Screwに影響を受けたASAP Rocky周辺、ハーレムのASAP Mobが同種の音を採用し、2011年のシングル『Peso』と、無料公開のミックステープ『Live.Love.A$AP』で注目を集めた。制作者ではSpaceGhostPurrpやFriendzoneが先駆者として挙げられ、Ryan HemsworthやShlohmoは周辺の音楽の世界の制作者である。この流れを可能にしたのは技術的な条件で、2007年に始まったSoundCloudが、レーベルを通さず誰でも音源を公開できる場を作り、Tumblrがその雰囲気を見た目の面から補強した。批評家からは中身がなく退廃的だという批判が絶えず、名称自体を当事者が嫌うことも多かった。2010年代半ばには、この曇った音とうつ的な歌詞が、エモ・ラップの影響源の一つとなり、BladeeらのDrain Gangや、Yung Leanら北欧のSad Boysが独自の派生を作った。2017年にはSoundCloud社の経営危機で大量の音源が消える恐れが生じた。『I'm God』は、サンプルの権利処理に時間がかかり、2020年4月にようやく正式に配信された。</p>
