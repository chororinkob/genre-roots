<h1>Cloud Rap（クラウドラップ）とは</h1>
<p>輪郭のはっきりしない、霧の中に浮かんでいるようなヒップホップ。音の要はサンプルの加工で、アンビエントやシューゲイザー、古い歌謡曲やアニメ音楽の断片を、リバーブとローパスフィルターで曇らせ、音程を下げて引き伸ばして敷き詰める。ドラム</p>
<p>輪郭のはっきりしない、霧の中に浮かんでいるようなヒップホップ。音の要はサンプルの加工で、アンビエントやシューゲイザー、古い歌謡曲やアニメ音楽の断片を、リバーブとローパスフィルターで曇らせ、音程を下げて引き伸ばして敷き詰める。ドラムは808の柔らかいキックと短いスネアだけで、輪郭を立てず背景に沈む。ハイハットは細かく刻まれるが音量は低く、全体としてリズムよりも和音の持続と残響が支配的である。テンポは毎分60から80拍程度と遅く、拍そのものが曖昧に感じられる曲も多い。和音は解決せず、同じ二つの和音を延々と往復して浮遊感を保つ。ラップは張り上げず、ため息のような発声で拍から少しずつずれながら乗り、しばしばピッチ補正がかかって歌との境界が消える。歌詞は街の描写よりも内面に向かい、退屈、うつ、薬、金と虚無、インターネット上の記号、恋愛の断片が脈絡なく並ぶ。ブランド名や絵文字的な語がそのまま歌詞になることも多い。制作も流通もインターネット上で完結しており、SoundCloudやBandcampに直接上げられ、ジャケットは低解像度の画像を粗く加工したものが定番になっている。</p>
<h2>成り立ち</h2><p>名づけ親はニューヨークのラッパーLil B、通称The BasedGodと、彼と組んでいた制作者Clams Casinoである。2010年頃、ニュージャージーで理学療法士として働いていたMichael Volpeは、Clams Casinoの名で、Imogen Heapなどのインディーポップを大胆に加工した曲をLil Bに無料で送りつけていた。その一つ『I'm God』(2009)が、このジャンルの原型となった。Lil Bは一日に何十曲もインターネットに投げ続ける異常な多作ぶりと、意味を成さない即興のような歌詞で、既存のラップの規範を無視した。ほぼ同時期、ヒューストンのDJ Screwに影響を受けたASAP Rocky周辺、ハーレムのASAP Mobが同種の音を採用し、2011年の『Peso』とアルバム『LiveLoveASAP』で商業的な成功を収めた。制作者ではSpaceGhostPurrp、Friendzone、Ryan Hemsworth、Shlohmoらが手を貸した。この流れを可能にしたのは技術的な条件で、2007年に始まったSoundCloudが、レーベルを通さず誰でも音源を公開できる場を作り、Tumblrがその美意識を視覚的に補強した。批評家からは中身がなく退廃的だという批判が絶えず、名称自体を当事者が嫌うことも多かった。2010年代半ばには、この曇った音とうつ的な歌詞がエモ・ラップへと直結し、Yung LeanやBladeeら北欧のDrain Gangが独自の派生を作った。2017年以降、SoundCloud社の経営危機で大量の音源が消える恐れが生じ、初期の作品の多くが公式には残っていない。</p>
<h2>代表曲</h2><ul><li>Live.Love.A$AP (A$AP Rocky)</li><li>I'm Gay (Lil B)</li><li>Ginseng Strip 2002 (Yung Lean)</li></ul>
