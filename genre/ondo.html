<h1>Ondoとは</h1>
<p>音頭とは、一人の歌い手が節を歌い上げ、周囲の大勢が声を合わせて返す掛け合いで進む、日本の踊り歌である。代表曲22曲を動画で聴け、ルーツと影響のつながりを地図でたどれる。</p>
<p>音頭とは、一人の歌い手が節を歌い上げ、周囲の大勢が声を合わせて返す掛け合いで進む、日本の踊り歌である。盆踊りや夏祭りのやぐらの上で唄われ、太鼓と笛の伴奏に合わせて輪になった人々が踊る。伴奏の中心は締太鼓や樽太鼓などの太鼓で、太鼓が打つ拍が踊りの足取りの土台になる。これに篠笛などの笛が重なり、高く透る音色で夜の会場を包む。メロディは音頭取りと呼ばれる独唱者が主要部を受け持ち、唱和者たちが「エンヤコラサ」「ヨイト ヨイヤマカ ドッコイサノセ」などのかけ声を斉唱して返す。この呼びかけと応答の往復が曲の骨組みだ。リズムは2/2拍子が基本で、拍をゆるく揺らす「うかれ」と呼ばれるスイング感が持ち味となる。伸びのあるテンポが大勢の手打ちや足踏みと自然に合い、拍を揺らさずまっすぐ打つ「かざみ」の形式をとる曲もある。歌い方は、音頭取りが一段高く張りのある声で歌い、節の途中に短い飾りの小節を差し挟んで伸ばす。歌詞はその土地の名所や見どころ、労働や人情を織り込んだものが多く、同じ節を何番も繰り返して歌い継ぐ。曲は数番の連作で組み立てられ、東京音頭は全十番から成る。演歌と同じく節のしなりを重んじるが、聴かせる曲ではなく大勢が唱和して踊るための参加型の歌という点が違う。近年はアニメやゲームの楽曲にもこの形式が用いられている。</p>
<h2>成り立ち</h2><p>音頭の語は、仏教の声明で最初に独唱を行う者、雅楽で各楽器の主となる演奏者を指す言葉だった。日本の民謡には古来、曲の主要部を独唱者が歌い、唱和者が斉唱する掛け合いの形式があり、この独唱者を音頭と呼んだ。やがて曲そのものも音頭と呼ばれるようになる。しかし音頭を盛んにした土台となったのは盆踊りである。盆踊りの伝統は数百年前にさかのぼり、江戸時代には各地の踊りに土地の節が付いた。江戸時代の伊勢国で唄われた伊勢音頭は、お伊勢参りの人々を通じて全国に広まり、祝唄や酒盛唄の定番になった。江戸時代末期には、武蔵国のデロレン祭文の名人・万宝院桜川雛山の弟子・西沢寅吉（のちの初代桜川大龍）が、歌念仏や念仏踊りを祭文に採り入れた独特の節回しで祭文音頭を考案。明治初年、滋賀県豊郷町の千樹寺で披露されたのが江州音頭の始まりとされる。近江商人兼業の音頭取りたちが街道沿いにこの歌を伝え、この系統はのちに大阪の河内音頭の成立へ大きな影響を及ぼした。一方、昭和に入ると音頭はレコードとラジオの時代を迎える。関東大震災からの復興と不況打破の景気づけとして、1932年、東京・有楽町の商店街の旦那衆がビクターに盆踊り用の新曲を依頼した。西條八十作詞、中山晋平作曲の「丸の内音頭」が作られ、8月15日から5日間、日比谷公園の盆踊り大会で藤本二三吉と三島一声の歌で披露された。ビクターは1933年7月にこれを「東京音頭」と改題して発売。東京の見どころを歌ったこの曲は全国でヒットし、発売当時だけでレコードが120万枚売れた。社員が電気蓄音機を各地の盆踊りに運び、やぐらの上で踊り方を教える宣伝も奏功し、1971年の時点で2000万枚以上とされるロングセラーになった。以後「〜音頭」の題名を持つ新民謡が次々に作られ、流行歌の分野にも影響を与えた。鉱山の側からも歌が生まれた。福岡県の炭鉱で明治時代から唄われた「伊田場打選炭唄」が原曲の炭坑節は、1932年に後藤寺検番の歌二・後藤寺芸妓連が「炭坑唄」として初めてレコード化。1948年には赤坂小梅、日本橋きみ栄、美ち奴、音丸が競作し、当時の石炭増産の風潮もあって全国の盆踊りの定番曲となった。1963年には東京五輪を翌年に控え、宮田隆作詞、古賀政男作曲の「東京五輪音頭」が各レコード会社の競作で発表され、三波春夫盤が130万枚を超えるヒットとなった。1965年にはテレビアニメの人気に乗った「オバQ音頭」（曽我町子）がアニソン音頭の先駆けとなり、1960〜70年代には音頭がアニメ主題歌にしばしば使われた。その後も大瀧詠一がポップスと融合させた「ナイアガラ音頭」を残し、現在もプロ野球・東京ヤクルトスワローズの傘踊りや、アニソンを流す現代の盆踊り大会に、音頭の形式は生き続けている。</p>
<h2>代表曲</h2><ul><li>きよしのズンドコ節 (氷川きよし)</li><li>東京音頭 (小唄勝太郎・三島一声)</li><li>東京五輪音頭 (三波春夫)</li><li>炭坑節 (赤坂小梅)</li><li>オバQ音頭 (曽我町子)</li><li>伊勢音頭 (traditional)</li><li>沖揚げ音頭 (traditional)</li><li>秩父音頭 (traditional)</li><li>江州音頭 (村田英雄)</li><li>河内音頭 (鉄砲光三郎)</li><li>北海盆唄 (三橋美智也)</li><li>さんさ踊り (traditional)</li><li>ドラえもん音頭 (大山のぶ代)</li><li>踊れ・どれ・ドラ ドラえもん音頭 (水田わさび)</li><li>ポケモン音頭 (ガルーラ小林)</li><li>ピカチュウ音頭 (ポケモン Kids TV)</li><li>すみっコぐらし音頭 (日本すみっコぐらし協会コーラス部)</li><li>桃太郎音頭 (三波春夫)</li><li>ゲゲゲの音頭 (松本洋子)</li><li>河内おとこ節 (中村美律子)</li><li>ドンパン節 (traditional)</li><li>大阪音頭 (島倉千代子)</li></ul>
