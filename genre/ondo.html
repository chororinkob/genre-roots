<h1>Ondoとは</h1>
<p>音頭は、一人の歌い手が節を歌い上げ、大勢がそれに声を合わせて返す掛け合いで進む、日本の踊り歌だ。代表曲22曲を動画で聴け、ルーツと影響のつながりを地図でたどれる。</p>
<p>音頭は、一人の歌い手が節を歌い上げ、大勢がそれに声を合わせて返す掛け合いで進む、日本の踊り歌だ。盆踊りや夏祭りのやぐらの上で歌われ、太鼓と笛の伴奏に合わせて、輪になった人々が踊る。

伴奏の中心は締太鼓や樽太鼓などの太鼓とされ、太鼓が打つ拍が踊りの足取りの土台になる。これに篠笛などの笛が重なるとされ、高く澄んだ音色で夜の会場を包む。

メロディは、音頭取りと呼ばれる独唱者が主な部分を受け持つ。唱和者たちは「エンヤコラサ」「ヨイト ヨイヤマカ ドッコイサノセ」などのかけ声を声を揃えて返す。この呼びかけと応答の繰り返しが、曲の骨組みになる。

多くは2/2拍子が基本で、拍をゆるく揺らす「うかれ」というスイング感が持ち味だ。伸びのあるテンポは、大勢の手打ちや足踏みと自然に合う。拍を揺らさずまっすぐ打つ「きざみ」の形式をとる曲もある。

歌い方は、音頭取りが一段高く張りのある声で歌い、節の途中に短い飾りの小節を差し挟んで伸ばす。歌詞は、その土地の名所や見どころ、労働や人情を織り込んだものが多い。同じ節を何番も繰り返して歌い継ぐ。

曲は数番の連作で組み立てられ、東京音頭は全十番から成る。近年は、アニメやゲームの楽曲にもこの形式が用いられている。</p>
<h2>成り立ち</h2><p>音頭という言葉は、もとは仏教の声明で最初に独唱する者、雅楽で各楽器の中心となる演奏者を指した。日本の民謡には古くから、曲の主な部分を独唱者が歌い、唱和者が声を揃えて斉唱する掛け合いの形式があり、この独唱者を音頭と呼んだ。やがて曲そのものも音頭と呼ばれるようになった。

しかし音頭を盛んにした土台となったのは盆踊りだとされる。盆踊りの伝統には諸説あるが、中世にさかのぼり、江戸時代には各地の踊りに土地の節が付いた。

江戸時代の伊勢国で歌われた伊勢音頭は、お伊勢参りの人々を通じて全国に広まり、祝い歌の定番になった。

江戸時代末期には、武蔵国のデロレン祭文の名人・万宝院桜川雛山の弟子・西沢寅吉（のちの初代桜川大龍）が、歌念仏や念仏踊りを祭文に取り入れた独特の節回しで祭文音頭を考案した。明治初年とも弘化3年（1846）ともされる時期に、滋賀県豊郷町の千樹寺で披露されたのが、江州音頭の始まりとされる。近江商人を兼ねた音頭取りたちが街道沿いにこの歌を伝え、この系統はのちに大阪の河内音頭の成立に大きな影響を及ぼした。

一方、昭和に入ると音頭はレコードとラジオの時代を迎える。関東大震災からの復興と不況打破の景気づけとして、1932年、東京・有楽町の商店街の旦那衆がビクターに盆踊り用の新曲を依頼した。西條八十が詞を書き、中山晋平が曲を付けた「丸の内音頭」が作られ、8月15日から5日間、日比谷公園の盆踊り大会で、藤本二三吉と三島一声が吹き込んだ音源が披露された。

ビクターは1933年7月にこれを「東京音頭」と改題して発売した。東京の見どころを歌ったこの曲は全国でヒットし、発売当時だけでレコードが120万枚売れたという。社員が電気蓄音機を各地の盆踊りに運び、やぐらの上で踊り方を教える宣伝も当たり、1971年の時点で2000万枚以上とされるロングセラーになった。以後「〜音頭」の題名を持つ新民謡が次々に作られ、流行歌の分野にも影響を与えた。

鉱山の側からも歌が生まれた。福岡県の炭鉱で明治時代から歌われた「伊田場打選炭唄」が原曲の炭坑節は、1932年に後藤寺検番の歌二・後藤寺芸妓連が「炭坑唄」として初めてレコード化した。1948年には赤坂小梅、日本橋きみ栄、美ち奴、音丸が競作し、当時の石炭増産の風潮もあって、全国の盆踊りの定番曲となった。

1963年には東京五輪を翌年に控え、宮田隆が詞を書き、古賀政男が曲を付けた「東京五輪音頭」が各レコード会社の競作で発表され、三波春夫盤が130万枚を超えるヒットとなった。1966年には、テレビアニメの人気に乗った「オバQ音頭」（石川進・曽我町子）がアニソン音頭の先駆けとなり、1960〜70年代には音頭がアニメ主題歌にしばしば使われた。その後、大瀧詠一が作詞・作曲・プロデュースを手がけ、歌唱を「布谷文夫withナイアガラ社中」名義が担った、ポップスと音頭を融合させた「ナイアガラ音頭」を残した。

現在もプロ野球・東京ヤクルトスワローズの傘踊りや、アニソンを流す現代の盆踊り大会に、音頭の形式は生き続けている。</p>
