<h1>Rock 'n' Roll（ロックンロール）とは</h1>
<p>1950年代に確立した、ロックの最初の形。BPM（1分間の拍数）はおおむね140〜180ほどと速めで（曲によって幅がある）、拍子は4分の4だが、8分音符を三連符（1拍を三つに分けた形）寄りに跳ねさせるシャッフルと、跳ねないストレー</p>
<p>1950年代に確立した、ロックの最初の形。BPM（1分間の拍数）はおおむね140〜180ほどと速めで（曲によって幅がある）、拍子は4分の4だが、8分音符を三連符（1拍を三つに分けた形）寄りに跳ねさせるシャッフルと、跳ねないストレートな8分音符が併存し、1950年代半ば以降はストレートな8分音符が特徴的になった。これが独特の前のめりな勢いを生む。和声（コードの響き）は非常に単純で、ブルースから受け継いだ三つの和音による12小節形式、いわゆるブルース進行が骨格をなす場合が多い。伴奏の要となるのはブギウギ・ベースと呼ばれる音型で、根音、3度、5度、6度を順に上下する定型をピアノの左手やギターが延々と刻み、これが体を揺らす原動力になる。ギターは軽く歪ませた程度の音でリフとソロを弾き、Chuck Berryの代名詞とされる、2音を同時に鳴らすダブルストップ（重音）の奏法が定番。ピアノは打楽器のように激しく叩かれ、サックスがソロを取ることも多い。ドラムはスネアの2拍目と4拍目を強く叩き、シンバルは控えめ。歌唱は叫びに近い高揚感を持ち、しゃがれ声やファルセットの裏返りが表現として用いられる。歌詞は恋愛、車、学校、踊りといった若者の日常を扱い、大人の世界の価値観をからかう視点を含む。三分に満たない短さも特徴で、ラジオとジュークボックス（硬貨で曲を選ぶ装置）での再生に合わせて作られていた。</p>
<h2>成り立ち</h2><p>1940年代の米国で、都市に移住した黒人層の間で流行していたジャンプ・ブルース（跳ねるリズムの速いブルース）を含むリズム・アンド・ブルースが、最も直接の源流である。Louis Jordanが1940年代に率いたTympany Fiveは、小編成でサックスを前面に出した軽快なブルースを演奏し、その音楽は後のロックンロールに大きな影響を与え、有力な先駆とされる。1951年、クリーヴランドのラジオDJであるAlan Freedが、白人の若者にも黒人のリズム・アンド・ブルースを紹介する番組を始め、ロックンロールという語を広めた。ただし語自体は以前から性交を暗示する俗語として黒人音楽の歌詞に登場していた。決定的な商業的成功は、Bill Haley &amp; His CometsのRock Around the Clock（1954年発売）である。この曲は1954年には売れ行きが振るわなかったが、1955年に映画Blackboard Jungleで使われたことにより全米1位（7月9日）となり、この音楽が若者の反抗の象徴として認識された。同じ1954年、メンフィスのSun Recordsで経営者Sam PhillipsがElvis PresleyのThat's All Right を録音、白人の歌手が黒人の歌い回しで歌うという組み合わせは、1954年時点では全国的なヒットにはならず、地元メンフィスのチャートで4位（約2万枚）にとどまった。1955年にはChuck BerryがMaybellene、Little RichardがTutti Fruttiを発表し、それぞれギターとピアノの語彙を確立した。しかし1950年代末、この音楽は急速に失速する。Elvis Presleyは1958年に徴兵され、Little Richardは1957年に宗教的な回心（信仰に目覚めること）により引退、Jerry Lee Lewisは13歳の、いとこの子（first cousin once removed）との結婚が1958年5月の英国ツアー中に発覚し、ツアーが3公演で中止になってロックンロールでのキャリアが失速し、Chuck Berryは1959年12月に、売春などの「不道徳な目的」での州をまたぐ移送を禁じるマン法（Mann Act）違反で逮捕され（14歳の少女の移送が問題とされた）、1960年3月の裁判で有罪となった。1959年にはBuddy Holly、Ritchie Valens、The Big Bopperが飛行機事故で死亡し、後に音楽が死んだ日と呼ばれた。さらに1959年、ラジオ局に金銭を渡して曲をかけさせるペイオラ（賄賂）疑惑でAlan Freedが職を追われた。この一連の出来事により最初のロックンロールの時代は終わったが、1960年代のイギリスの若者たちがそのレコードを掘り起こし、ロックとして再生させることになる。</p>
