<h1>Rock 'n' Roll（ロックンロール）とは</h1>
<p>ロックンロールは、1950年代に定着した、ロックの最初の形だ。 中心になるのは、ピアノとギターだ。ギターは、軽く歪ませた程度の音でリフとソロを弾く。Chuck Berryのトレードマークとされるのは、2音を同時に鳴らすダブルストッ</p>
<p>ロックンロールは、1950年代に定着した、ロックの最初の形だ。

中心になるのは、ピアノとギターだ。ギターは、軽く歪ませた程度の音でリフとソロを弾く。Chuck Berryのトレードマークとされるのは、2音を同時に鳴らすダブルストップ（重音）の奏法で、これが定番になっている（Jordan楽団の奏法を取り入れた）。ピアノは打楽器のように激しく叩かれ、サックスがソロを取ることも多い。

和声（コードの響き）は、非常に単純だ。ブルースから受け継いだ三つの和音による12小節形式、いわゆるブルース進行が、骨格をなす場合が多い。伴奏の要は、ブギウギ・ベースと呼ばれる音型だ。根音・3度・5度・6度（・短7度）を上下する定型を、ピアノの左手やギターが延々と刻む。これが、体を揺らす原動力になる。

テンポは、BPM（1分間の拍数）が速い曲が多いが、90〜130台の曲も少なくない。拍子は4分の4だ。8分音符を三連符（1拍を三つに分けた形）寄りに跳ねさせるシャッフルと、跳ねないストレートな8分音符が、併存していた。1950年代半ば以降は、ストレートな8分音符が特徴的になった。これが、独特の前のめりな勢いを生む。ドラムは、スネアの2拍目と4拍目を強く叩く。

歌唱は、叫びに近い高揚感を持つ。しゃがれ声やファルセットの裏返りも、表現として用いられる。

歌詞は、恋愛、車、学校、踊りといった、若者の日常を扱う。大人の世界の価値観をからかう視点も含む。

曲の長さは、当時のシングル盤の収録時間とラジオ向けの事情で、平均2分台後半だった。</p>
<h2>成り立ち</h2><p>舞台は、1940年代の米国だ。都市に移住した黒人層の間で、ジャンプ・ブルース（跳ねるリズムの速いブルース）を含むリズム・アンド・ブルースが流行していた。これが、ロックンロールの最も直接の源流である。

Louis Jordanは、1940年代にTympany Fiveを率いた。小編成でサックスを前面に出した、軽快なブルースを演奏するバンドだ。その音楽は、後のロックンロールに大きな影響を与え、有力な先駆とされる。

1951年、クリーヴランドのラジオDJであるAlan Freedが、ある番組を始めた。白人の若者にも、黒人のリズム・アンド・ブルースを紹介する番組だ。彼は、ロックンロールという語を広めた。ただし、この語自体は、以前から性交を暗示する俗語として、黒人音楽の歌詞に登場していた。

決定的な商業的成功は、Bill Haley &amp; His CometsのRock Around the Clock（1954年発売）である。この曲は、1954年には商業的には期待外れだった。しかし1955年に、映画Blackboard Jungleで使われたことにより、全米1位（7月9日）となった。こうして、この音楽は若者の反抗の代名詞として認識された。

同じ1954年、メンフィスのSun Recordsで、経営者のSam PhillipsがElvis PresleyのThat's All Right を録音した。白人の歌手が、黒人の歌い回しで歌うという組み合わせだった。ただ、1954年時点では全国的なヒットにはならず、地元メンフィスのチャートで4位（約2万枚）にとどまった。

1955年には、Chuck BerryがMaybellene、Little RichardがTutti Fruttiを発表した。両者は、それぞれギターとピアノの語彙に大きな影響を与えた。

しかし1950年代末、この音楽を担った人々に出来事が相次ぐ。Elvis Presleyは、1958年に徴兵された。Little Richardは、1957年に宗教的な回心（信仰に目覚めること）により引退した。Jerry Lee Lewisは、13歳の、いとこの子（first cousin once removed）との結婚が、1958年5月の英国ツアー中に発覚した。ツアーは3公演で中止になり、彼のロックンロールでのキャリアは失速した。Chuck Berryは、1959年12月に、売春などの「不道徳な目的」での州をまたぐ移送を禁じるマン法（Mann Act）違反で逮捕された（14歳の少女の移送が問題とされた）。そして、1960年3月の裁判で有罪となった。

1959年には、Buddy Holly、Ritchie Valens、The Big Bopperが飛行機事故で死亡した。この日は、後に音楽が死んだ日と呼ばれた。さらに1959年、ラジオ局に金銭を渡して曲をかけさせるペイオラ（賄賂）疑惑の渦中で、Alan Freedは否認声明への署名を拒んだため解雇された。

一部の論者は、これらの出来事で初期の時代が終わったと見る。だが、1960年代のイギリスの若者たちが、そのレコードを掘り起こした。そして、ロックとして再生させることになる。</p>
