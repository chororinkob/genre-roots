<h1>Rock 'n' Roll（ロックンロール）とは</h1>
<p>1950年代に確立した、ロックの最初の形。BPMは140〜180と速く、拍子は四分の四だが、8分音符を三連符寄りに跳ねさせるシャッフルの感触が支配的で、これが独特の前のめりな推進力を生む。和声は極めて単純で、ブルースから受け継いだ</p>
<p>1950年代に確立した、ロックの最初の形。BPMは140〜180と速く、拍子は四分の四だが、8分音符を三連符寄りに跳ねさせるシャッフルの感触が支配的で、これが独特の前のめりな推進力を生む。和声は極めて単純で、ブルースから受け継いだ三つの和音による12小節形式、いわゆるブルース進行が骨格をなす場合が多い。伴奏の要となるのはブギウギ・ベースと呼ばれる音型で、根音、三度、五度、六度を順に上下する定型をピアノの左手やギターが延々と刻み、これが体を揺らす原動力になる。ギターは軽く歪ませた程度の音でリフとソロを弾き、Chuck Berryが確立した二音を同時に鳴らすダブルストップの奏法が定番。ピアノは打楽器のように激しく叩かれ、サックスがソロを取ることも多い。ドラムはスネアの二拍目と四拍目を強く叩き、シンバルは控えめ。歌唱は叫びに近い高揚感を持ち、しゃがれ声やファルセットの裏返りが表現として用いられる。歌詞は恋愛、車、学校、踊りといった若者の日常を扱い、大人の世界の価値観をからかう視点を含む。三分に満たない短さも特徴で、ラジオとジュークボックスでの再生に最適化されていた。</p>
<h2>成り立ち</h2><p>1940年代の米国で、都市に移住した黒人層の間で流行していたジャンプ・ブルースが直接の母体である。Louis Jordanが1940年代に率いたTympany Fiveは、小編成でサックスを前面に出した軽快なブルースを演奏し、その音楽が後のロックンロールの原型となった。1951年、クリーヴランドのラジオDJであるAlan Freedが、白人の若者にも黒人のリズム・アンド・ブルースを紹介する番組を始め、ロックンロールという語を広めた。ただし語自体は以前から性交を暗示する俗語として黒人音楽の歌詞に登場していた。決定的な商業的成功は1954年、Bill Haley &amp; His CometsのRock Around the Clockで、翌1955年に映画Blackboard Jungleで使われたことにより全米一位となり、この音楽が若者の反抗の象徴として認識された。同じ1954年、メンフィスのSun Recordsで経営者Sam PhillipsがElvis PresleyのThat's All Right を録音、白人の歌手が黒人の歌い回しで歌うという組み合わせが爆発的な人気を呼んだ。1955年にはChuck BerryがMaybellene、Little RichardがTutti Fruttiを発表し、それぞれギターとピアノの語彙を確立した。しかし1950年代末、この音楽は急速に失速する。Elvis Presleyは1958年に徴兵され、Little Richardは1957年に宗教的な回心により引退、Jerry Lee Lewisは13歳の従妹との結婚が発覚して事実上追放され、Chuck Berryは1959年に未成年者の州間移送を禁じる法律違反で起訴された。1959年にはBuddy Holly、Ritchie Valens、The Big Bopperが飛行機事故で死亡し、後に音楽が死んだ日と呼ばれた。さらに1960年、ラジオ局に金銭を渡して選曲させるペイオラ疑惑でAlan Freedが失脚した。この一連の出来事により最初のロックンロールの時代は終わったが、1960年代のイギリスの若者たちがそのレコードを掘り起こし、ロックとして再生させることになる。</p>
<h2>代表曲</h2><ul><li>Johnny B. Goode (Chuck Berry)</li><li>Jailhouse Rock (Elvis Presley)</li><li>Tutti Frutti (Little Richard)</li></ul>
