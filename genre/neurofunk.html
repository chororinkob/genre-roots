<h1>Neurofunk（ニューロファンク）とは</h1>
<p>ドラムンベースの中で、音色設計の精密さと機械的な攻撃性を極限まで追求した系統。テンポは172〜176BPM。最大の特徴はベースの作り方で、単純な低音ではなく、FM合成、波形の歪ませ、フェイザーやフランジャーによる連続的な変調、そし</p>
<p>ドラムンベースの中で、音色設計の精密さと機械的な攻撃性を極限まで追求した系統。テンポは172〜176BPM。最大の特徴はベースの作り方で、単純な低音ではなく、FM合成、波形の歪ませ、フェイザーやフランジャーによる連続的な変調、そしてリサンプリング(一度書き出した音をもう一度素材として加工する)を何段も重ねて作られる。この結果、生物の唸り声や機械の駆動音に似た、絶えず形を変える音が生まれる。この音は一つとして同じ波形が続かず、2拍ごとに別の性格を見せる。ドラムは切り刻まれたブレイクを土台としつつ、極めて精密に配置され、スネアは短く鋭く、ゴーストノートが16分音符の隙間を埋める。低域の整理が厳密で、キック、サブベース、変調ベースが互いの帯域を侵さないよう精密に分離される。和声はほぼ存在せず、あっても不穏な持続音のみ。上物はSF映画の効果音、金属音、逆再生した残響といった非旋律的な素材。曲の構成は、ブレイクで全てを抜いてから低音が戻る落差を軸とし、その復帰の瞬間の音の異様さが体験の核心になる。リキッド・ドラムンベースの温かさとは正反対で、同じテンポ帯にありながら、聴き手に快適さを一切提供しない設計になっている。</p>
<h2>成り立ち</h2><p>1997年前後のイギリスで、テックステップと呼ばれる暗く硬い系統から発展した。前史として、1995年前後のドラムンベースは、ジャズやソウルを取り込む方向と、より暗く機械的な方向に分岐しつつあった。後者を主導したのがEd RushとOptical、そしてTraceとNico で、1996年にEd Rush、Trace、Nicoによる「The Droid」といった作品が、それまでにない金属的で乾いた音を提示した。この音はテックステップと呼ばれ、ジャズの温かさを完全に排したことで大きな論争を呼んだ。テックステップをさらに精密化したのがニューロファンクで、名称は1998年前後に定着した。決定的な役割を果たしたのはEd RushとOptical(Matt Quinn)のデュオで、1998年のアルバム「Wormhole」がこの分野の基準作とされる。同作では、ベースが生物的に蠢く音として設計され、以後の制作者が長く参照することになった。彼らが1998年に設立したレーベルVirus Recordingsが中心的な発表の場になった。同時期にBad Companyが1998年の「The Nine」で、極端に圧縮された攻撃的な音を提示し、大きな影響を残した。他にDom &amp; Roland、Konflict、Cause 4 Concernが加わった。制作技術の面では、パソコンでの音声編集環境の進歩が決定的だった。とりわけリサンプリングという手法(一度加工した音を書き出して再度素材にする)を繰り返すことで、元の音源が判別できないほど複雑な音を作れるようになった。この技法の習得には長い時間を要するため、この分野は制作技術の職人性が極めて高い領域として認識されている。2000年代にはNoisia(オランダ、2003年結成)が現れ、この分野の音響設計を新たな水準へ引き上げた。彼らはレーベルVisionを主宰し、2010年代を通じて基準を作り続けた。他にPhace、Mefjus(オーストリア)、Black Sun Empireが加わっている。批判としては、音の複雑さが自己目的化して聴き手を疎外している、旋律や感情が欠如している、そして楽曲が互いに似すぎているという指摘がある。実際に2010年代半ばには様式の固定化が問題視された。しかし技術的な探求という点では、この分野が電子音楽全体の音響設計を押し上げてきたことは広く認められている。近年はドラムンベース全体の復興の中で、より旋律的な要素との融合も進んでいる。</p>
<h2>代表曲</h2><ul><li>Wormhole（Ed Rush &amp; Optical）</li><li>Stigma（Noisia）</li><li>Godzilla（Mefjus）</li><li>Dustup（The Upbeats）</li></ul>
