<h1>Neurofunk（ニューロファンク）とは</h1>
<p>ニューロファンクは、ドラムンベースの中で、音色づくりの精密さと、機械のような攻撃性を限界まで追い求めた系統だ。テンポは170〜180BPM前後である。 いちばんの特徴は、ベースの作り方にある。単純な低音ではなく、ウェーブテーブル、</p>
<p>ニューロファンクは、ドラムンベースの中で、音色づくりの精密さと、機械のような攻撃性を限界まで追い求めた系統だ。テンポは170〜180BPM前後である。

いちばんの特徴は、ベースの作り方にある。単純な低音ではなく、ウェーブテーブル、FM、ディストーション、リサンプリング(一度書き出した音をもう一度素材として加工する)などを何段も重ねて作られる。その結果、生物の唸り声や機械の駆動音に似た、絶えず形を変える音が生まれる。この音は、LFOやエンベロープなどの変調で、音色が絶えず変化する。

和音や旋律は少なく、無機質な電子音や効果音が中心になる。上に重ねる音は、SF映画の効果音、金属音、逆再生した残響といった素材だ。

ドラムは、切り刻まれたブレイクを土台にしながら、とても精密に配置される。スネアは短く鋭い。低音域の整理は厳しく、キック、サブベース、変調ベースが、互いの周波数帯を邪魔しないよう細かく分けられる。

曲の組み立ては、ブレイクで全ての音を抜いてから、低音が戻ってくる落差が軸になる。その戻った瞬間の音の異様さが、聴く体験の中心だ。リキッド・ドラムンベースの温かさとは正反対で、同じテンポ帯にありながら、聴き手に快適さを提供しない作りになっている。</p>
<h2>成り立ち</h2><p>ニューロファンクは、1997年前後のイギリスで、テックステップと呼ばれる暗く硬い系統から発展した。

前史をたどると、1995年前後のドラムンベースは、ジャズやソウルを取り込む方向と、より暗く機械的な方向に分かれつつあった。後者を引っ張ったのは、Trace、Ed Rush、Nicoだ。1995年にTraceがT-Powerの「Mutant Jazz」をリミックスした作品(Nicoがエンジニアリング)は、テックステップの最初期の例とされる。1996年にEd Rush、Trace、Nicoが発表した「The Droid」も、その代表例のひとつである。この音はテックステップと呼ばれ、ジャズの温かさを取り除いた、金属的で乾いた音が特徴だった。

そのテックステップを、さらに精密にしたのがニューロファンクだ。名前は、1997年12月にSimon Reynoldsが付けた。Optical(Matt Quinn)は、1997年以降にEd Rushと組んで、ニューロファンクを発展させた。Ed Rush &amp; OpticalのWormhole（1998）は、最初期の代表作の一つで、初のニューロファンク・アルバムと評される。ただし、起源や発展の道筋には定説がない。彼らが1998年に設立したレーベルVirus Recordingsが、中心的な発表の場になった。

同じころ、Bad Company（のち Bad Company UK）が、1998年の「The Nine」で、極端に圧縮された攻撃的な音を示し、大きな影響を残したとされる。他に、テックステップ側の制作者Dom &amp; Rolandや、Konflict(1998年からの活動)が加わり、1999年にはCause 4 Concernも結成された。

一方、制作技術の面では、サンプラーやシンセによる加工技術の発達が大きかった。とりわけリサンプリングという手法(一度加工した音を書き出して再度素材にする)を繰り返すことで、元の音源が分からないほど複雑な音を作れるようになった。この技法を身につけるには長い時間がかかる。

2000年代には、Noisia(オランダ、2000年前後にフローニンゲンで結成、2003年に初リリース)が現れ、この分野の音作りを新しい水準へ引き上げた。彼らはレーベルVisionを主宰し、2010年代を通じて基準を作り続けた。他にPhace、Mefjus(オーストリア)、Black Sun Empireが加わっている。

この分野には批判もある。音の複雑さが目的そのものになって聴き手を遠ざけている、旋律や感情が欠けている、楽曲が互いに似すぎている、という指摘だ。それでも技術的な探求という点では、この分野はドラムンベースの音響設計に大きな影響を与えたとされる。近年はドラムンベース全体の復興の中で、より旋律的な要素との融合が進んでいるとも言われる。</p>
