<h1>Futurepop（フューチャーポップ）とは</h1>
<p>シンセポップの美しく覚えやすい旋律と、EBMの硬質なビート、そしてトランスの壮大な広がりを組み合わせた、ゴシック/インダストリアル系のダンス音楽。テンポは130〜140BPM前後で、キックは四つ打ち、その裏にオフビートのベースが入</p>
<p>シンセポップの美しく覚えやすい旋律と、EBMの硬質なビート、そしてトランスの壮大な広がりを組み合わせた、ゴシック/インダストリアル系のダンス音楽。テンポは130〜140BPM前後で、キックは四つ打ち、その裏にオフビートのベースが入るトランス由来の推進力を持つ。上物には、リバーブとディレイを深くかけた広がりのあるパッドと、アルペジエーターで刻まれる16分音符のシンセが重なり、曲の後半ですべての層が積み上がって解放される盛り上がりの設計が徹底されている。ヴォーカルは、アグロテックのように歪ませて怒鳴るのではなく、クリーンで低めの男性声を深いリバーブと重ね録りで荘厳に響かせるのが定型である。歌詞は個人的な喪失、信念、記憶、戦争と犠牲、人類の未来といった主題を抽象的で内省的な言葉で扱い、しばしば演説や映画の台詞のサンプルが冒頭に置かれる。和声は短調が中心だが、終盤で長調へ開けて希望を示す進行が好まれる。同じ系譜のEBMが身体的な攻撃性を、アグロテックが不快さを追求するのに対し、フューチャーポップは高揚感と歌ものとしての完成度を最優先する点で異なる。</p>
<h2>成り立ち</h2><p>1990年代末、ゴシックとインダストリアルのクラブシーンで、EBMの硬さとトランスの高揚感を接続する試みが同時多発的に現れたことから生まれた。決定的だったのは1999年で、アイルランド出身のRonan Harrisが率いるVNV Nationがアルバム『Empires』を、ノルウェーのStephan Groth率いるApoptygma Berzerkが『Welcome to Earth』を、それぞれ発表した。この2枚は、それまでのEBMが持っていた無機質さを保ちながら、トランス的なシンセの層とはっきり歌われる旋律を導入し、シーンの音を一変させた。フューチャーポップという呼称自体は、この2人が自分たちの音楽を指して使い始めたものとされ、やがてジャンル名として定着する。アメリカのMetropolis RecordsとドイツのOff Beatが流通を担い、スウェーデンのCovenantは『United States of Mind』(2000)で洗練された都会的な感触を加え、アメリカのTom ShearによるAssemblage 23は個人的な喪失を主題とする作風で支持を集めた。ノルウェーのIcon of Coilは、より軽やかなダンス寄りの解釈で若い聴衆を取り込んでいる。この音楽が広まった背景には、1990年代を通じて欧米各地に定着したゴシック/インダストリアル系のクラブナイトと、ドイツのWave-Gotik-TreffenやM'era Lunaといった大規模フェスティバルの存在があった。同時に、様式の完成度が高すぎたことは弱点にもなる。2000年代半ばには、どのバンドも同じ音がするという批判がシーンの内部から出るようになり、新陳代謝は鈍化した。VNV Nationはより管弦楽的な方向へ、Apoptygma Berzerkはエレクトロロック寄りへ進み、ジャンルとしての結束は緩んでいく。それでも、この時期に確立された「重いビートの上で壮大な旋律を歌い上げる」という型は、2010年代以降のダークエレクトロやEDM寄りのインダストリアルにも受け継がれている。</p>
<h2>代表曲</h2><ul><li>Standing (VNV Nation)</li><li>Kathy's Song (Apoptygma Berzerk)</li><li>Call the Ships to Port (Covenant)</li><li>Let the Wind Erase Me (Assemblage 23)</li><li>Dead Enough for Life (Icon of Coil)</li></ul>
