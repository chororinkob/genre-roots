<h1>Futurepop（フューチャーポップ）とは</h1>
<p>フューチャーポップは、ゴシック/インダストリアル系のダンス音楽だ。シンセポップの美しく覚えやすい旋律に、EBMの硬いビートと、トランスの壮大な広がりを組み合わせている。 上物(メロディや和音を担う音)には、リバーブとディレイ(響き</p>
<p>フューチャーポップは、ゴシック/インダストリアル系のダンス音楽だ。シンセポップの美しく覚えやすい旋律に、EBMの硬いビートと、トランスの壮大な広がりを組み合わせている。

上物(メロディや和音を担う音)には、リバーブとディレイ(響きや残響を足す効果)を深くかけた、広がりのあるパッド(持続する背景の音)が使われる。そこに、アルペジエーター(和音を1音ずつ自動で順に鳴らす機能)で刻まれるシンセが重なる。

和声は短調が中心だ。

キックは四つ打ちだ。トランス的なビートが推進力を生む。

ヴォーカルは、アグロテックのように歪ませて怒鳴ることはしない。加工の少ないクリーンな歌声で歌うことが多い。

歌詞は、個人的な喪失、信念、記憶、戦争と犠牲、人類の未来といった主題を、抽象的で内省的な言葉で扱う。サンプリングの多用が見られることがある。

同じ系譜のEBMは身体的な攻撃性を、アグロテックは攻撃的なビートや暗い歌詞、歪めたヴォーカルを前に出すと言われる。これに対し、フューチャーポップは高揚感と、歌ものとしての完成度を最優先すると言われる。</p>
<h2>成り立ち</h2><p>フューチャーポップは1990年代末、ゴシックとインダストリアルのクラブシーンで、EBMとエレクトロ・インダストリアルの文化から発展した。1990年代後半に、VNV Nation、Apoptygma Berzerk、Covenantらの作品を通じて、その形が作られていった。

代表作とされるのは、次の作品だ。アイルランド出身のRonan Harrisが率いるVNV Nationが、1999年にヨーロッパでアルバム『Empires』を発表した。Stephan Groth率いるノルウェーのApoptygma Berzerkは、2000年初頭に『Welcome to Earth』を発表した。この2枚は、それまでのEBMが持っていた無機質さを保ちながら、トランス的なシンセの層と、はっきり歌われる旋律を取り入れた。

フューチャーポップという呼び名は、Ronan HarrisがStephan Grothとの会話の中で、自分が思いついたと述べているものだ(本人の証言による)。この呼び名は、やがてジャンル名として定着する。

流通を担ったのは、アメリカのMetropolis Recordsと、ドイツのDependent Recordsだ。スウェーデンのCovenantは『United States of Mind』(2000)で、より滑らかなシンセポップ寄りの音を加えた。アメリカのTom ShearによるAssemblage 23は、個人的な喪失を主題とする作風で支持を集めた。ノルウェーのIcon of Coilは、ダンス志向のエレクトロ・インダストリアルやEBMとして、フューチャーポップの文脈でも語られる。

この音楽が広まった背景には、1990年代を通じて欧米各地に定着した、ゴシック/インダストリアル系のクラブナイトがあった。さらに、1992年に始まったドイツのWave-Gotik-Treffenや、2000年以降のM'era Lunaといった大規模フェスティバルの存在もあった。

一方で、外部の評者からは「しばしば安価なテクノと区別しにくい」という評も出た。Assemblage 23のTom Shearは、この呼び名を皮肉まじりに語ったことがある。

やがてVNV Nationはより管弦楽的な方向へ、Apoptygma Berzerkはインディーロック寄りへ進んだ。

なお、1990年代前半に生まれたダークエレクトロは、のちにアグロテックやフューチャーポップに取って代わられたとされる。</p>
<h2>代表曲</h2><ul><li>Call the Ships to Port (Covenant)</li><li>We Stand Alone (Covenant)</li><li>Nova (VNV Nation)</li><li>Standing (VNV Nation)</li><li>Chrome (VNV Nation)</li><li>Dead Enough for Life (Icon of Coil)</li><li>Starsign (Apoptygma Berzerk)</li><li>Shelter (Icon of Coil)</li><li>Monochrome (Covenant)</li><li>Kathy's Song (Apoptygma Berzerk)</li><li>Disappoint (Assemblage 23)</li><li>Let the Wind Erase Me (Assemblage 23)</li></ul>
