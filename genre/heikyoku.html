<h1>Heikyoku（ヘイキョク）とは</h1>
<p>『平家物語』を小型の琵琶1挺だけで語り切る、一人語りの音楽だ。代表曲12曲を動画で聴け、ルーツと影響のつながりを地図でたどれる。</p>
<p>『平家物語』を小型の琵琶1挺だけで語り切る、一人語りの音楽だ。

楽器は平家琵琶と呼ばれる。形は楽琵琶を小型にしたものだが、4弦5柱で、撥や奏法は楽琵琶と異なる。絹の4本の弦を、木の撥（ばち）で打ち鳴らす。語りの前には短い旋律的な手を弾き、次の曲節の音の高さを示す。

旋律は西洋の調性によらず、声明の影響を強く受ける。旋律の型は曲節と呼ばれ、前田流で約50種ある。節を付けずに言い切る素声（しらごえ）、1音節に1音を当てて4度ほど上下する口説（くどき）、ユリをたっぷり利かせて歌い上げる三重（さんじゅう）などを、詞章に合わせて選ぶ。

リズムは拍節的でない（自由リズム的）とされる。太鼓も拍子木も入らず、打楽器は用いない。語り手は意味の切れ目で息を継ぐ。間は語りの息と、琵琶の前奏・間奏・息継ぎの手で作られる。

声は朗々と通る張り声で、語尾を伸ばして揺らすユリがトレードマークだ。悲哀・悲壮な場面や、中国の故事を引く部分などでは折り声（おりごえ）に切り替わり、1音ごとに細かい装飾が付く。

詞章は『平家物語』の本文そのままで、祇園精舎の鐘の声から始まる。合戦、都落ち、入水、怨霊の話まで、軍記の文章を節に乗せる。口説・拾イは1音節1音が基本で、三重などは1音節を伸ばして旋律的に歌う。

一曲は句という単位で組み立てる。合戦の場面は拾イ（ひろい）を速く畳みかけ、山場の韻文には三重を置き、和歌には上歌・下歌を当てる。地の文は口説でつなぐ。起承転結ではなく、場面ごとの曲節の積み重ねで聞かせる。

同じ『平家物語』を扱う薩摩琵琶は、16世紀に改良された盲僧琵琶系の音楽だ。筑前琵琶は明治中期に成立した音楽である。平曲では、琵琶は曲節の前奏・間奏・息継ぎに入り、語りと重ならない。節は名古屋系では口頭伝承が中心だが、譜本『平家正節』も併せて使われる。</p>
<h2>成り立ち</h2><p>平曲の始まりは、伝承では12世紀の末頃とされる。東国生まれの盲目の僧・生仏が語ったと伝わる。

『徒然草』はこう伝える。後鳥羽院の時代、天台座主の慈鎮（慈円）に庇護された、学問（稽古）に誉れのあった信濃前司行長が『平家物語』を作った。そして東国出身の盲人・生仏に教えて語らせた、という。これが有力視される説だ。ただし起源には諸説あり、断定はできない。平曲は、音楽史的には盲僧琵琶の流れに属し、講式の影響を受けて鎌倉時代中期に成立したとされる。

13世紀後半から鎌倉末頃にかけて、京都八坂の城玄が八坂流を、筑紫出身の如一が一方流を立てた。如一の弟子・明石覚一（？〜1371）は詞章を改訂・増補し、『覚一本』と呼ばれる本文を整えたとされる。語りは当道座という盲人の自治組織に支えられ、検校という最高位まで昇る芸になった。

しかし八坂流は早くに衰え、今は「訪月（つきみ）」の一句だけが残る。一方流は江戸時代に、江戸の前田流と京都の波多野流に分かれた。波多野流は当初からふるわなかった。栄えたのは前田流だけで、江戸幕府の保護を受け、職屋敷で伝えられた。

1776年（安永5年）、名古屋で活躍した前田流の荻野検校（荻野知一）が、譜本『平家正節（へいけまぶし）』を完成させた。墨で節を書き込んだこの譜本が前田流の定本になり、今も使われている。

明治維新で盲官の制度が廃止され、当道座は保護を失って解体した。伝承者は激減した。前田流を伝えた津軽藩士の家の出である館山漸之進は、その衰えを嘆いた。1910年に『平家音楽史』を自費出版し、保存と育成に力を注いだ。四男の館山甲午（1894〜1989）は、昭和期に全曲（200曲）を語れた唯一の晴眼者とされる。仙台で平曲を伝え、広めることに力を尽くした。

京都の波多野流は、最後の検校といわれた藤村性禅（1853〜1911）を最後に、全編を語れる人がいなくなった。弟子への伝承も第二次大戦後に絶えた。1955年3月19日、国は平曲を「記録作成等の措置を講ずべき無形文化財」に選択した。それでも1990年の時点で、前田流の奏者は数名だった。2008年には、名古屋の三品正保検校の弟子だった今井氏が残るのみとされる。名古屋系は今井勉検校で、2018年の時点で弟子はいない。仙台・津軽系・東京などにも相伝者がいる。近年は新たな習得者も出ている。

今日まで伝わる語り物のなかで最も古いとされる。節付けの型と墨譜の記録は、前田流平曲の定本となった。声明の強い影響を受け、のちに能・浄瑠璃・地歌などに影響を与えた。</p>
