<h1>Heikyoku（ヘイキョク）とは</h1>
<p>『平家物語』を小型の琵琶1挺だけで語り切る、一人語りの音楽だ。代表曲12曲を動画で聴け、ルーツと影響のつながりを地図でたどれる。</p>
<p>『平家物語』を小型の琵琶1挺だけで語り切る、一人語りの音楽だ。

楽器は平家琵琶と呼ばれる。楽琵琶と同じ作りの胴をひと回り小さくしたもので、絹の4本の弦を木の撥（ばち）で打ち鳴らす。旋律を奏でるというより打楽器に近く、語りの切れ目に「ジャン」と乾いた音が落ちる。

旋律は西洋の調性ではなく、声明の節回しを組み替えて作る。型は曲節と呼ばれ、前田流で約50種。素声（しらごえ）のように節を付けずに言い切る部分、口説（くどき）のように1音節に1音を当てて4度ほど上下する部分、三重（さんじゅう）のようにユリをたっぷり利かせて歌い上げる部分を、詞章に合わせて選ぶ。

リズムは拍節に乗らない。太鼓も拍子木も入らず、テンポを刻むものが一つもない。語り手は意味の切れ目で息を継ぎ、間の取り方は声の張りと息の長さだけで決まる。

声は朗々と通る張り声で、語尾を伸ばして揺らすユリがトレードマークだ。悲しみや悲壮な場面では折り声（おりごえ）に切り替わり、1音ごとに細かい装飾が付く。

詞章は『平家物語』の本文そのままで、祇園精舎の鐘の声から始まる。合戦、都落ち、入水、怨霊の話まで、軍記の文章を一字ずつ節に乗せる。

一曲は句という単位で組み立てる。合戦の場面は拾イ（ひろい）を速く畳みかけ、山場の韻文には三重を置き、和歌には上歌・下歌を当てる。地の文は口説でつなぐ。起承転結ではなく、場面ごとの曲節の積み重ねで聞かせる。

同じ『平家物語』を扱う薩摩琵琶や筑前琵琶は、歌と演奏が分かれた近代の音楽だ。平曲は語りと琵琶が一体で、節はすべて暗記で伝える。</p>
<h2>成り立ち</h2><p>12世紀の終わり、京都に一人の盲人がいた。

『徒然草』はこう伝える。後鳥羽院の時代、天台座主の慈鎮（慈円）の庇護を受けていた雅楽の名人・信濃前司行長が『平家物語』を作り、東国出身の盲人・生仏に教えて語らせた、という。これが有力視される説だ。ただし起源には諸説あり、断定はできない。生仏の芸は、声明のなかの語り部分である講式と、盲僧が使った盲僧琵琶の流れを受けていた。

13世紀の後半、京都八坂の城玄が八坂流を、筑紫出身の如一が一方流を立てた。如一の弟子・明石覚一（？〜1371）は詞章を改訂・増補し、『覚一本』と呼ばれる本文を整えたとされる。語りは当道座という盲人の自治組織に支えられ、検校という最高位まで昇る芸になった。

しかし八坂流は早くに衰え、今は「訪月（つきみ）」の一句だけが残る。一方流は江戸時代に江戸の前田流と京都の波多野流に分かれた。波多野流は当初からふるわず、前田流だけが栄えて江戸幕府の保護を受け、職屋敷で伝承された。

1776年（安永5年）、名古屋で活躍した前田流の荻野検校（荻野知一）が譜本『平家正節（へいけまぶし）』を完成させた。墨で節を書き込んだこの譜本が前田流の定本になり、今も使われている。

明治維新で盲官制度が廃止され、当道座は保護を失って解体した。伝承者は激減した。前田流を伝えた津軽藩士の家の出である館山漸之進はその衰えを嘆き、1910年に『平家音楽史』を自費出版して保存と育成に力を注いだ。四男の館山甲午（1894〜1989）は仙台に残り、全段を語れる最後の一人になったとされる。

京都の波多野流は、最後の検校といわれた藤村性禅（1853〜1911）の代で命脈が尽きた。1955年3月19日、国は平曲を「記録作成等の措置を講ずべき無形文化財」に選択した。それでも1990年の時点で前田流の奏者は数名。2008年には名古屋の三品正保検校の弟子だった今井氏が残るのみとされる。現在は名古屋の今井勉と仙台の系統が細々と伝える。

今日まで伝わる語り物のなかで最も古いとされる。節付けの型と墨譜の記録は、日本の語り物を研究するときの基準になった。声明と雅楽の要素を合わせた点でも、中世の音楽の土台を作った。</p>
