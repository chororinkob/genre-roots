<h1>Pop（ポップ）とは</h1>
<p>特定の様式ではなく、その時代に最も多くの人に届くことを目的として作られた音楽の総称。共通する設計原理はいくつかある。第一に曲の短さで、2分半〜3分半が典型とされるが、時代で変動する（ラジオ向け編集は約3分半、1990年代は平均4分</p>
<p>特定の様式ではなく、その時代に最も多くの人に届くことを目的として作られた音楽の総称。共通する設計原理はいくつかある。第一に曲の短さで、2分半〜3分半が典型とされるが、時代で変動する（ラジオ向け編集は約3分半、1990年代は平均4分超、近年は再び約3分）。第二に構造の明快さで、ヴァース、プリコーラス、コーラスという単位が繰り返され、聴き手は一度で全体を把握できる。第三にフックの存在で、数秒で記憶に残る旋律または語句が提示される。近年は短いイントロと早いフックが重視される傾向。和声は単純な進行が多く、1960〜90年代は1位曲の約4分の1が（主に終盤の半音・全音上げの）転調を用い、2010年代にほぼ消えた。編成は時代の技術に従い、1960年代はバンドと弦楽、1980年代はシンセサイザーとドラムマシン、2010年代以降は打ち込みやDAW（パソコン上の音楽制作ソフト）中心の制作が増えた。歌唱は聴き取りやすさが最優先され、歌詞は恋愛、若さ、祝祭、失恋といった普遍的な主題を平易な語彙で扱う。流通の形態が構造を規定するという性格が強く、ラジオ、テレビ、そして配信という媒体の変化のたびに、曲の長さと構成が作り替えられてきた。</p>
<h2>成り立ち</h2><p>「ポップ・ソング」という語は1926年に初めて使われ、「ポップ・ミュージック」は1950年代半ばの英国で、ロックンロールや若者向けの音楽を指して生まれた。一方、現在の意味での大衆音楽の産業にとって、1885年ごろに始まるニューヨークのティン・パン・アレーは、大衆歌の楽譜出版を産業として確立した一つの画期である。マンハッタンの一角に楽譜出版社が集中し、専門の作詞家と作曲家が歌を量産して楽譜として売った。1920年代以降、ラジオとレコードが楽譜に取って代わり、歌手が作品の顔となった。マイクロフォンの特性を活かした囁くような歌唱、いわゆるクルーニングは、Al BowllyやBing Crosbyらが先駆者とされ、Rudy Valléeが広く普及させた。1940年代にはFrank Sinatraが、この歌唱で若い女性の熱狂的な支持を集め、1942年のパラマウント劇場の公演では「シナトラマニア」と呼ばれる現象を起こした。1950年代のロックンロールにより、大衆音楽の主な購買層が青少年へ移行し、産業の構造が変わった。1960年代、ビートルズは、アルバムを芸術的な単位とみなす認識を広く定着させた（Sinatra や Beach Boys に先行例あり）。並行してDetroitのMotown、そしてBrill Buildingの作家陣が、職業的な作曲による完成度の高い歌を供給した。1980年代にはMTVの開局により、音楽が視覚を伴う商品となり、Michael JacksonとMadonnaがその新しい形式を代表した。1990年代から2000年代にかけては、スウェーデンのMax Martinを筆頭とする専門の制作者が、国境を越えてヒット曲を供給する体制が確立した。彼は米国のチャート首位曲数で歴代でも屈指の記録を持つ。2010年代以降は配信が中心となり、再生数が収益に直結するため、イントロの短縮、曲尺の縮小、そして冒頭で強い印象を与える構成が徹底された。現在はTikTokなど短尺動画での使用が発見の主要な経路となり、短い尺や強い冒頭が有利とされる傾向がある。</p>
