<h1>Pop（ポップ）とは</h1>
<p>ポップは、特定のスタイルではない。その時代に最も多くの人に届くことを目的として作られた音楽の総称だ。共通する設計原理はいくつかある。 第一に、曲の短さだ。2分半〜3分半が典型とされるが、時代で変動する（ラジオ向け編集は約3分半、1</p>
<p>ポップは、特定のスタイルではない。その時代に最も多くの人に届くことを目的として作られた音楽の総称だ。共通する設計原理はいくつかある。

第一に、曲の短さだ。2分半〜3分半が典型とされるが、時代で変動する（ラジオ向け編集は約3分半、1990年代は平均4分超、近年は再び約3分）。

第二に、構造の明快さだ。ヴァース、プリコーラス、コーラスという単位が多くの曲で繰り返される。聴き手は一度で全体を把握できる。

第三に、フックの存在だ。数秒で記憶に残る旋律または語句が提示される。近年は、短いイントロと早いフックが重視される傾向にある。

和声は、単純な和声進行が多い。1960〜90年代は、1位曲の約4分の1が転調を用いた。主に終盤の半音・全音上げの転調とされる。これが2010年代にはほぼ消えたと見られる。

編成は、時代の技術に従う。1960年代はバンドと弦楽、1980年代はシンセサイザーとドラムマシンが使われた。2010年代以降は、打ち込み・DAW中心の制作が増えた。

歌唱は、聴き取りやすさが最優先される。歌詞は、恋愛、若さ、祝祭、失恋といった普遍的な主題を、平易な語彙で扱う。

流通の形態が構造を規定するという性格が強い。ラジオ、テレビ、そして配信という媒体の変化のたびに、曲の長さと構成が作り替えられてきた。</p>
<h2>成り立ち</h2><p>まず言葉の歴史から始まる。「ポップ・ソング」という語は、1926年に文献上初めて使われた。「ポップ・ミュージック」は、『New Grove』の記述では1950年代半ばの英国で、ロックンロールや若者向けの音楽を指して生まれた。

一方、産業の側には別の歴史がある。ニューヨークに楽譜出版社が集中したティン・パン・アレーは、1885年ごろに始まった。大衆歌の楽譜出版を、産業として固めた場所だ。マンハッタンの一角に楽譜出版社が集まり、専門の作詞家と作曲家が歌を量産した。歌は楽譜として売られた。

1920年代以降、ラジオとレコードが楽譜に取って代わる。歌手が作品の顔となった。マイクロフォンの特性を活かした囁くような歌唱は、クルーニングと呼ばれる。諸説あるが、Al BowllyやBing Crosbyらが先駆者とされ、Gene AustinやArt Gillhamの名も挙がる。Rudy Valléeが広く普及させた。

1940年代には、Frank Sinatraがこの歌唱で若い女性の熱狂的な支持を集めた。ニューヨークのパラマウント劇場での開幕は1942年12月30日だった。その後、「シナトラマニア」と呼ばれる現象が起きた。

1950年代、ロックンロールにより、大衆音楽の購買層としての青少年が、さらに前面に出た。産業の構造が変わった。

1960年代、ビートルズは、アルバムを芸術的な単位とみなす認識を広く定着させたと一般に見られている（Sinatra や Beach Boys に先行例あり）。並行して、DetroitのMotown、そしてBrill Buildingの作家陣が、職業的な作曲による完成度の高い歌を供給した。

1980年代、MTVの開局により、音楽は視覚を伴う商品となった。Michael JacksonとMadonnaが、その新しい形式を代表した。

1990年代から2000年代にかけて、スウェーデンのMax Martinを筆頭とする専門の制作者が、国境を越えてヒット曲を供給する体制が固まった。彼は米国のチャート首位曲数で、歴代でも屈指の記録を持つ。

2010年代以降は配信が中心となった。再生数が収益に直結するため、イントロの短縮、曲尺の縮小、そして冒頭で強い印象を与える構成が徹底された。現在は、TikTokなど短尺動画での使用が、若年層で発見の主要な経路となっている。短い尺や強い冒頭が有利とされる傾向がある。</p>
