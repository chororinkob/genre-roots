<h1>Pop（ポップ）とは</h1>
<p>特定の様式ではなく、その時代に最も多くの人に届くことを目的として作られた音楽の総称。共通する設計原理はいくつかある。第一に曲の短さで、三分から三分半に収める慣行が長く続いてきた。第二に構造の明快さで、ヴァース、プリコーラス、コーラ</p>
<p>特定の様式ではなく、その時代に最も多くの人に届くことを目的として作られた音楽の総称。共通する設計原理はいくつかある。第一に曲の短さで、三分から三分半に収める慣行が長く続いてきた。第二に構造の明快さで、ヴァース、プリコーラス、コーラスという単位が繰り返され、聴き手は一度で全体を把握できる。第三にフックの存在で、数秒で記憶に残る旋律または語句が、曲の早い段階、しばしば開始15秒以内に提示される。和声は三和音または四和音の単純な循環で、転調は最後のコーラスでの半音上げを除けばほとんど行われない。旋律は音域を一オクターブ半程度に収め、誰でも口ずさめる範囲に設計される。編成は時代の技術に従い、1960年代はバンドと弦楽、1980年代はシンセサイザーとドラムマシン、2010年代以降は完全な打ち込みが標準となった。歌唱は聴き取りやすさが最優先され、歌詞は恋愛、若さ、祝祭、失恋といった普遍的な主題を平易な語彙で扱う。流通の形態が構造を規定するという性格が強く、ラジオ、テレビ、そして配信という媒体の変化のたびに、曲の長さと構成が作り替えられてきた。</p>
<h2>成り立ち</h2><p>語としては1920年代から用いられたが、現在の意味での大衆音楽の産業は、19世紀末のニューヨークのティン・パン・アレーに起源を持つ。マンハッタンの一角に楽譜出版社が集中し、専門の作詞家と作曲家が歌を量産して楽譜として売った。1920年代以降、ラジオとレコードが楽譜に取って代わり、歌手が作品の顔となった。1940年代にはFrank Sinatraが、マイクロフォンの特性を活かした囁くような歌唱、いわゆるクルーニングを確立し、若い女性の熱狂的な支持を集めるという現象を初めて生んだ。1950年代のロックンロールにより、大衆音楽の主な購買層が青少年へ移行し、産業の構造が変わった。1960年代、The Beatlesが自作自演を標準化し、アルバムを表現の単位とする流れを作った。並行してDetroitのMotown、そしてBrill Buildingの作家陣が、職業的な作曲による完成度の高い歌を供給した。1980年代にはMTVの開局により、音楽が視覚を伴う商品となり、Michael JacksonとMadonnaがその新しい形式を完成させた。1990年代から2000年代にかけては、スウェーデンのMax Martinを筆頭とする専門の制作者が、国境を越えてヒット曲を供給する体制が確立した。彼は米国のチャート首位曲数で歴代でも屈指の記録を持つ。2010年代以降は配信が中心となり、再生数が収益に直結するため、イントロの短縮、曲尺の縮小、そして冒頭で強い印象を与える構成が徹底された。現在はTikTokなど短尺動画での使用が発見の主要な経路となり、15秒で成立する部分を持つことが制作上の要件になっている。</p>
<h2>代表曲</h2><ul><li>Thriller（Michael Jackson）</li><li>Like a Prayer（Madonna）</li><li>Baby One More Time（Britney Spears）</li><li>Shape of You（Ed Sheeran）</li><li>Blinding Lights（The Weeknd）</li></ul>
