<h1>Synthwave（シンセウェーブ）とは</h1>
<p>1980年代の映画音楽とゲーム音楽の記憶を、現代の制作環境で再構成した電子音楽。BPMはおおむね80〜120前後で、アップテンポ曲は128〜140となり、四つ打ちよりも打ち込みドラムマシンの機械的な8分音符の刻みがしばしば基調にな</p>
<p>1980年代の映画音楽とゲーム音楽の記憶を、現代の制作環境で再構成した電子音楽。BPMはおおむね80〜120前後で、アップテンポ曲は128〜140となり、四つ打ちよりも打ち込みドラムマシンの機械的な8分音符の刻みがしばしば基調になる。アナログ・シンセの太い単音ベースやリード、電子ドラム、ゲート・リバーブをかけたスネアといった要素がよく用いられる。ゲート・リバーブとは残響を途中で強制的に断ち切る処理で、1980年代の録音を象徴する乾いた爆発音を生む。旋律は長いアルペジオ（分散和音の反復）が支配的で、和声は短調のI–VI–III–VII型のように、哀愁と高揚が同時に立ち上がる循環進行がしばしば用いられる。曲構成は歌ものではなく器楽曲が中心で、主題の提示、間奏でのシンセ・ソロ、そして同じ主題への回帰という映画音楽的な流れをとる。歌が入る場合も残響を深くかけ、遠くから聴こえるように処理される。夜のハイウェイ、ネオンの街、ブラウン管の映像といった視覚的な連想と分かちがたく結び付いており、実在した1980年代ではなく、記憶と想像で作り直された1980年代を鳴らす音楽である。</p>
<h2>成り立ち</h2><p>2000年代半ばから後半にかけて、フランスを中心に、北米などでも並行して広がった。起源には諸説ある。直接の引き金は1990年代のフレンチ・ハウス（フレンチ・タッチ）と、2000年代のフランスのエレクトロの流れで、フレンチ・ハウスの制作者と、ゲームGrand Theft Auto: Vice Cityに触発された若い作家が形成した。さらに決定的だったのが、ゲームGrand Theft Auto: Vice City（2002年）を通じた1980年代の再評価、そしてJustice、Kavinskyといったフランスのエレクトロ勢の台頭である。Kavinsky（Vincent Belorgey）は2006年のEPテディ・ボーイから、事故死した運転手の亡霊という物語をまとった世界観を作り、2010年のNightcallと2011年のDriveで広く知られた。決定的な普及の契機は2011年、ニコラス・ウィンディング・レフン監督の映画Driveで、Kavinskyのほか、College、Electric Youth、Cliff Martinezの音楽が用いられ、この美学が世界的に知られた。同時期、スウェーデンのMitch Murder、フランスのCollege、カナダのMiami Nights 1984といった作家が、レーベルValerie CollectiveやRosso Corsaを通じて作品を発表し、様式が固まった。流通は当初からインターネット上が中心で、MySpace、Bandcamp、YouTubeが発表の場となった。ただしインディー・レーベルが早くから関与していて、メジャー系の関与もある。名称もシーン内部で複数の呼び名が併存し、シンセウェイヴ、アウトラン、レトロウェイヴなどが混用された。文化的背景としては、1980年代に子供だった世代が制作可能な年齢に達したこと、そしてソフトシンセが当時の高価な機材の音を安価に再現できるようになったことが大きい。2012年にはビデオゲームHotline Miamiのサウンドトラック、2016年のテレビドラマStranger Thingsの音楽が大衆的な注目を集め、シーンは商業的な広がりを得た。批判としては、実在しない過去への郷愁に依存し、音の語彙が狭く固定化しているという指摘が繰り返しなされている。</p>
<h2>代表曲</h2><ul><li>Nightcall (Kavinsky)</li><li>A Real Hero (College &amp; Electric Youth)</li><li>Turbo Killer (Carpenter Brut)</li><li>Hex (Dance With the Dead)</li><li>Fly For Your Life (Gunship)</li><li>Sunset (The Midnight)</li><li>Sledge (Dance With the Dead)</li><li>Future Club (Perturbator)</li><li>Maximum Black (Gunship)</li><li>Vampires (The Midnight)</li><li>Brokendate (Com Truise)</li><li>Deadcruiser (Kavinsky)</li><li>ProtoVision (Kavinsky)</li><li>Tick of the Clock (Chromatics)</li><li>Firebird (Dance With the Dead)</li><li>Phones (Mecha Maiko)</li><li>Here Comes The Night (Michael Oakley)</li><li>Midnight City (M83)</li></ul>
