<h1>Synthwave（シンセウェーブ）とは</h1>
<p>1980年代の映画音楽とゲーム音楽の記憶を、現代の制作環境で再構成した電子音楽。BPMはおおむね80〜120前後で、アップテンポ曲は128〜140となり、キックが毎拍鳴る四つ打ちに、スネアが2拍目と4拍目に来る形が典型で、ベースに</p>
<p>1980年代の映画音楽とゲーム音楽の記憶を、現代の制作環境で再構成した電子音楽。BPMはおおむね80〜120前後で、アップテンポ曲は128〜140となり、キックが毎拍鳴る四つ打ちに、スネアが2拍目と4拍目に来る形が典型で、ベースには16分音符の反復がよく使われる。アナログ・シンセの太い単音ベースやリード（主旋律の音）、電子ドラム、ゲート・リバーブをかけたスネアといった要素がよく用いられる。ゲート・リバーブとは残響を途中で強制的に断ち切る処理で、1980年代の録音を象徴する乾いた爆発音を生む。旋律にはアルペジオ（分散和音の反復）がしばしば用いられ、和声（コードの響き）は短調のi–VI–III–VIIのような、哀愁と高揚が同時に立ち上がる循環進行もよく見られる。曲構成は歌ものではなく器楽曲が中心である。歌が入る場合は、現代的なオートチューンを避け、ヴォコーダー（声を機械的な音色に変える装置）など1980年代風に聴こえる処理が好まれる。夜のハイウェイ、ネオンの街、ブラウン管の映像といった視覚的な連想と切り離せないほど結び付いており、実在した1980年代ではなく、記憶と想像で作り直された1980年代を鳴らす音楽である。</p>
<h2>成り立ち</h2><p>2000年代半ばから後半にかけて、フランスを中心に、北米などでも並行して広がった。起源には諸説ある。フレンチ・ハウス系やブログ・ハウス系（インターネットのブログから広まった2000年代のフランスのハウス）の制作者と、ゲームGrand Theft Auto: Vice City（2002年）を通じて1980年代に触発された若い作家から生まれた。Justice、Kavinskyといったフランスのエレクトロ勢の台頭も重なった。Kavinsky（Vincent Belorgey）は2006年のEPテディ・ボーイから、1986年にフェラーリ・テスタロッサで事故死した青年が、2006年にゾンビとして蘇って電子音楽を作るという物語をまとった世界観を作り、2010年のNightcallと2011年のDriveで広く知られた。決定的な普及の契機は2011年、ニコラス・ウィンディング・レフン監督の映画Driveで、Kavinskyのほか、College、Electric Youth、Cliff Martinezの音楽が用いられ、この美学が世界的に知られた。2007〜2011年にかけて、Driveの公開に先行または並行して、スウェーデンのMitch Murder、フランスのCollege、カナダのMiami Nights 1984といった作家が、レーベルValerie CollectiveやRosso Corsaを通じて作品を発表し、様式が固まった。初期はMySpaceやブログが拠点で、2010年前後からBandcampやYouTubeが加わった。ただしKavinskyの『Teddy Boy』（2006年）は独立系レーベルからの12インチ盤で、インディー・レーベルが早くから関与していた。名称もシーン内部で複数の呼び名が併存し、シンセウェイヴ、アウトラン、レトロウェイヴなどが混用された。文化的背景としては、1980年代に子供だった世代が制作可能な年齢に達したこと、そしてソフトシンセ（パソコン上の楽器ソフト）が当時の高価な機材の音を安価に再現できるようになったことが大きい。2012年にはビデオゲームHotline Miamiのサウンドトラック、2016年のテレビドラマStranger Thingsの音楽が大衆的な注目を集め、シーンは商業的な広がりを得た。批判としては、実在しない過去への郷愁に依存し、音の要素が狭く固定化しているという指摘が繰り返しなされている。</p>
<h2>代表曲</h2><ul><li>Nightcall (Kavinsky)</li><li>A Real Hero (College &amp; Electric Youth)</li><li>Turbo Killer (Carpenter Brut)</li><li>Hex (Dance With the Dead)</li><li>Fly For Your Life (Gunship)</li><li>Sunset (The Midnight)</li><li>Sledge (Dance With the Dead)</li><li>Future Club (Perturbator)</li><li>Maximum Black (Gunship)</li><li>Vampires (The Midnight)</li><li>Brokendate (Com Truise)</li><li>Deadcruiser (Kavinsky)</li><li>ProtoVision (Kavinsky)</li><li>Tick of the Clock (Chromatics)</li><li>Firebird (Dance With the Dead)</li><li>Phones (Mecha Maiko)</li><li>Here Comes The Night (Michael Oakley)</li><li>Midnight City (M83)</li></ul>
