<h1>Synthwave（シンセウェーブ）とは</h1>
<p>1980年代の映画音楽とゲーム音楽の記憶を、現代の制作環境で再構成した電子音楽。BPMは80〜120と幅広く、四つ打ちよりも打ち込みドラムマシンの機械的な8分音符の刻みが基調になる。使われる音は明確に限定されており、アナログ・シン</p>
<p>1980年代の映画音楽とゲーム音楽の記憶を、現代の制作環境で再構成した電子音楽。BPMは80〜120と幅広く、四つ打ちよりも打ち込みドラムマシンの機械的な8分音符の刻みが基調になる。使われる音は明確に限定されており、アナログ・シンセの太い単音ベース、鐘のような減衰の長いFM音源のベル、鋸波を重ねた分厚いパッド、そしてゲート・リバーブをかけたスネアが定番である。ゲート・リバーブとは残響を途中で強制的に断ち切る処理で、1980年代の録音を象徴する乾いた爆発音を生む。旋律は長いアルペジオ（分散和音の反復）が支配的で、和声は短調のI–VI–III–VII型のように、哀愁と高揚が同時に立ち上がる循環進行が好まれる。曲構成は歌ものではなく器楽曲が中心で、主題の提示、間奏でのシンセ・ソロ、そして同じ主題への回帰という映画音楽的な流れをとる。歌が入る場合も残響を深くかけ、遠くから聴こえるように処理される。夜のハイウェイ、ネオンの街、ブラウン管の映像といった視覚的な連想と分かちがたく結び付いており、実在した1980年代ではなく、記憶と想像で作り直された1980年代を鳴らす音楽である。</p>
<h2>成り立ち</h2><p>2000年代半ばから後半にかけて、フランスを中心とするインターネット上の作家群から自然発生した。直接の引き金は2000年代前半のフランスのエレクトロ、いわゆるフレンチ・ハウス以降の流れで、Daft Punkが1997年から2001年にかけて示したヴォコーダーとアナログ・シンセへの愛着が土壌を作った。さらに決定的だったのが2006年の映画Miami ViceやゲームGrand Theft Auto: Vice City（2002年）を通じた1980年代の再評価、そしてJustice、Kavinskyといったフランスのエレクトロ勢の台頭である。Kavinsky（Vincent Belorgey）は2006年のEPテディ・ボーイ、そして2010年のシングルNightcallで、事故死した運転手の亡霊という物語をまとった世界観を確立した。決定的な普及の契機は2011年、ニコラス・ウィンディング・レフン監督の映画Driveで、Kavinskyのほか、College、Electric Youth、Cliff Martinezの音楽が用いられ、この美学が世界的に知られた。同時期、スウェーデンのMitch Murder、フランスのCollege、カナダのMiami Nights 1984といった作家が、レーベルValerie CollectiveやRosso Corsaを通じて作品を発表し、様式が固まった。流通は当初から完全にインターネット上で、MySpace、Bandcamp、YouTubeが発表の場となり、レコード会社の関与はほとんどなかった。名称もシーン内部で複数の呼び名が併存し、シンセウェイヴ、アウトラン、レトロウェイヴなどが混用された。文化的背景としては、1980年代に子供だった世代が制作可能な年齢に達したこと、そしてソフトシンセが当時の高価な機材の音を安価に再現できるようになったことが大きい。2015年前後にはビデオゲームHotline Miamiのサウンドトラック、2016年のテレビドラマStranger Thingsの音楽が大衆的な注目を集め、シーンは商業的な広がりを得た。批判としては、実在しない過去への郷愁に依存し、音の語彙が狭く固定化しているという指摘が繰り返しなされている。</p>
<h2>代表曲</h2><ul><li>A Real Hero (College &amp; Electric Youth)</li><li>Nightcall (Kavinsky)</li><li>Turbo Killer (Carpenter Brut)</li><li>Future Club (Perturbator)</li><li>Brokendate (Com Truise)</li></ul>
