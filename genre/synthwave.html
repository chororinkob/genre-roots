<h1>Synthwave（シンセウェーブ）とは</h1>
<p>シンセウェイヴは、1980年代の映画音楽とゲーム音楽の記憶を、現代の制作環境で再構成した電子音楽だ。 音づくりには、アナログ・シンセの太い単音ベースやリード（主旋律の音）、電子ドラム、ゲート・リバーブをかけたスネアといった要素がよ</p>
<p>シンセウェイヴは、1980年代の映画音楽とゲーム音楽の記憶を、現代の制作環境で再構成した電子音楽だ。

音づくりには、アナログ・シンセの太い単音ベースやリード（主旋律の音）、電子ドラム、ゲート・リバーブをかけたスネアといった要素がよく用いられる。ゲート・リバーブとは残響を途中で強制的に断ち切る処理で、1980年代の録音のトレードマークともいえる、乾いた爆発音を生む。

旋律にはアルペジオ（分散和音の反復）がしばしば用いられる。和声（コードの響き）では、i–VI–III–VIIのような短調の循環進行もよく見られる。

BPMはおおむね80〜118で、アップテンポ曲は128〜140となる。リズムは、四つ打ち（キックが毎拍）にスネア2・4拍が典型である。ベースの定型としては、16分の反復が挙げられる。

歌が入る場合は、1980年代風に聴こえる処理（ヴォコーダー等）が好まれる。曲構成は、主として器楽曲が中心である。

夜のハイウェイ、ネオンの街、ブラウン管の映像といった視覚的な連想と切り離せないほど結び付いている。実在した1980年代ではなく、記憶と想像で作り直された1980年代を鳴らす音楽である。</p>
<h2>成り立ち</h2><p>2000年代半ばから後半にかけて、フランスを中心に、北米などでも並行して広がった。起源には諸説ある。フレンチ・ハウス系やブログ・ハウス系の制作者と、ゲームGrand Theft Auto: Vice City（2002年）などで1980年代に触発された若い作家から生まれたのは、2000年代半ば〜後半のことだ。

Kavinsky（Vincent Belorgey）は、2006年のEPテディ・ボーイから、独自の世界観を作った。それは、1986年にフェラーリ・テスタロッサで事故死した青年が、2006年にゾンビとして蘇り、電子音楽を作るという設定だ。2010年のNightcallと2011年の映画Driveで、広く知られた。

決定的な普及の契機は、2011年のニコラス・ウィンディング・レフン監督の映画Driveだった。Kavinskyのほか、College、Electric Youth、Cliff Martinezの音楽が用いられ、この美学が世界的に知られた。

2007〜2011年にかけて、Drive公開に先行または並行して、スウェーデンのMitch Murder、フランスのCollege、カナダのMiami Nights 1984といった作家が、レーベルValerie CollectiveやRosso Corsaを通じて作品を発表し、スタイルが固まった。

初期はMySpaceやブログが拠点で、2010年前後からBandcampやYouTubeが加わった。Kavinskyなどはレーベルからの盤で出ている。インディー・レーベルは早くから関与し、メジャー系の関与もある。名称もシーン内部で複数の呼び名が併存し、シンセウェイヴ、アウトラン、レトロウェイヴなどが混用された。

文化的背景としては、1980年代に子供だった世代が、制作可能な年齢に達したことがある。ソフトシンセ（パソコン上の楽器ソフト）が、当時の高価な機材の音を安価に再現できるようになったことも、一因である。

2012年にはビデオゲームHotline Miamiのサウンドトラックが、2016年にはテレビドラマStranger Thingsの音楽が、大衆的な注目を集めた。こうして、シーンは商業的な広がりを得た。批判としては、実在しない過去への郷愁に依存し、音の要素が狭く固定化しているという指摘が出ることもある。</p>
