<h1>Carnatic Classical（カーナティック）とは</h1>
<p>南インドで受け継がれてきた古典音楽の体系である。三つの柱によって成り立っている。第一はラーガと呼ばれる旋律の枠組みで、単なる音階ではなく、上行と下行で異なる音の並び、必ず強調される音、避けるべき音、特徴的な音の運びまでを含む一種の</p>
<p>南インドで受け継がれてきた古典音楽の体系である。三つの柱によって成り立っている。第一はラーガと呼ばれる旋律の枠組みで、単なる音階ではなく、上行と下行で異なる音の並び、必ず強調される音、避けるべき音、特徴的な音の運びまでを含む一種の性格を持った規範である。第二はターラと呼ばれる拍節の周期で、演奏者と聴衆は手を打ち、指を折り、手のひらを返すという一定の所作でこれを数える。八拍を基本とする型のほか、七拍や五拍の周期も用いられる。第三は持続音で、演奏の間中、タンブーラーや電子的な装置が主音と第五音を鳴らし続け、全ての旋律はこの不動の基準に対する関係として聴かれる。演奏上最も重要な技法は、音を真っ直ぐ伸ばさず、常に揺らし、隣の音との間を滑らせる装飾であり、これがなければこの音楽は成立しないとまで言われる。編成は歌が中心で、ヴァイオリン、両面太鼓のムリダンガム、素焼きの壺を叩くガタムなどが伴奏する。演奏会は決まった順序で構成され、後半には即興の比重が高まり、打楽器奏者だけの応酬の場面が設けられる。歌詞の多くは神への献身を主題とする宗教的な詩である。</p>
<h2>成り立ち</h2><p>この体系の理論的な源流は古代インドの音楽論にまで遡るが、現在の形の直接の基礎を築いたのは15世紀から16世紀に活動したPurandara Dasaである。彼は初学者のための練習曲を体系化し、現在も全ての学習者が最初に学ぶ課程を定めたため、この音楽の父と呼ばれている。決定的な時期は18世紀後半から19世紀前半で、現在のタミル・ナードゥ州の同じ町の周辺から、Tyagaraja、Muthuswami Dikshitar、Syama Sastriという三人の作曲家がほぼ同時代に現れた。彼らは合わせて三位一体と呼ばれ、その作品は現在の演奏会目録の中核を占め続けている。とりわけTyagarajaは数百曲を残し、彼を記念する祭りは今も毎年開かれている。19世紀にはヨーロッパから伝わったヴァイオリンが取り入れられ、床に座って楽器を足で支える独自の奏法とともに、伴奏楽器として完全に定着した。外来の楽器を消化して自らの体系に組み込んだ好例である。20世紀に入ると、この音楽は大きな社会的変動を経験する。それまで演奏の担い手の重要な一部は、寺院に仕える世襲の芸能者の女性たちだった。しかし彼女たちの制度は、植民地期の道徳観と現地の改革運動の双方から売春と結びつけて非難され、1947年に法的に廃止された。この結果、伝統の継承者であった女性たちは生計と地位を失い、一方でその芸能は上位カーストの担い手によって清められた形で受け継がれるという、複雑で不公正な移行が起きた。演奏会の形式も20世紀前半に整備され、寺院や宮廷から都市の会堂へと場が移る。1927年からマドラス、現在のチェンナイで始まった年末の大規模な音楽祭は、現在も世界最大級の古典音楽の催しとして続いている。20世紀を代表する歌手M.S. Subbulakshmiは、まさにその世襲芸能者の家系に生まれながら国民的な地位に上り詰め、1966年には国際連合で演奏を行った。現在も高度な訓練を要する生きた伝統として、インド国内および世界の移民社会で継承されている。</p>
