<h1>Carnatic Classical（カーナティック）とは</h1>
<p>カルナータカ音楽は、南インドで受け継がれてきた古典音楽の体系だ。三つの柱で成り立っている。 第一の柱は、ラーガと呼ばれる旋律の枠組みだ。ただの音階ではない。上りと下りで音の並びが違う。必ず強調される音と、避けるべき音がある。特徴的</p>
<p>カルナータカ音楽は、南インドで受け継がれてきた古典音楽の体系だ。三つの柱で成り立っている。

第一の柱は、ラーガと呼ばれる旋律の枠組みだ。ただの音階ではない。上りと下りで音の並びが違う。必ず強調される音と、避けるべき音がある。特徴的な音の運びも決まっている。こうしたすべてを含む、性格を持った規範である。

第二の柱は、ターラと呼ばれる拍の周期だ。演奏者と聴衆は、手を打ち、指を折り、手のひらを返すという決まった所作で拍を数える。8拍を基本とする型のほか、数え方によっては7拍や5拍の周期も用いられる。

第三の柱は持続音だ。演奏のあいだ中、タンブーラー（同じ音を鳴らし続ける弦楽器）や電子的な装置が、通常は主音と第五音を鳴らし続ける。すべての旋律は、この動かない基準との関係として聴かれる。

音を真っ直ぐ伸ばさず、常に揺らし、隣の音との間を滑らせる装飾がある。これはラーガの性格を形づくる本質的な要素で、ラーガによっては欠かせない。

編成は歌が中心だ。ヴァイオリン、両面太鼓のムリダンガム、素焼きの壺を叩くガタムなどが伴奏する。演奏会は決まった順序で進む。後半は即興の割合が高まり、打楽器奏者だけが応酬する場面も設けられる。歌詞の多くは、神への献身を主題とする宗教的な詩である。</p>
<h2>成り立ち</h2><p>この音楽の理論的な源流は、古代インドの音楽論にまで遡る。15世紀から16世紀に活動したPurandara Dasaは、教育課程の体系化で決定的な役割を果たした。初学者のための練習曲を体系化したのは伝承では彼とされ、『Pitamaha』と称される。

決定的な時期は、18世紀後半から19世紀前半だった。現在のタミル・ナードゥ州の同じ町の周辺から、Tyagaraja、Muthuswami Dikshitar、Syama Sastriという3人の作曲家が、ほぼ同時代に現れた。彼らは合わせて三位一体（3人の巨匠をまとめた呼び名）と呼ばれる。その作品は、現在の演奏会目録の中核を占め続けている。とりわけTyagarajaは数百曲を残し、彼を記念する祭りは今も毎年開かれている。

18〜19世紀には、ヨーロッパから伝わったヴァイオリンが、Baluswami DikshitarやVadiveluらの先駆者によって取り入れられたとされる。床に座って楽器を足で支える独自の奏法とともに、ヴァイオリンは伴奏楽器として完全に定着した。外来の楽器を消化して、自らの体系に組み込んだ好例である。

20世紀に入ると、この音楽は大きな社会的変動を経験する。それまで演奏の担い手の重要な一部は、寺院に仕える世襲の芸能者の女性たちだった。しかし彼女たちの制度は、植民地期の道徳観と現地の改革運動の双方から、売春と結びつけて非難された。1947年にマドラス管区(州)で奉納が法的に禁止された(その後、カルナータカ州(1982年)、アーンドラ・プラデーシュ州(1988年)などが州法で禁止)。

19世紀末からの反デーヴァダーシー運動、1930年代の舞踊の再構成、1947年の禁止法が重なって、担い手の交代が進んだ。その中で、伝統の継承者であった女性たちは生計と地位を失った。一方で、その芸能(とくに舞踊)は、上位カーストの担い手によって清められた形で受け継がれた。複雑で不公正な移行が起きたのである。

演奏会の形式は20世紀前半に整備された。20世紀前半に都市の団体が登場し、1947年以降に会堂・有料公演が主流となった。1927年の音楽会議を契機に、マドラス(現在のチェンナイ)のMusic Academyが1928年に設立された。1929年から年次会議が開かれ、年末の大規模な音楽祭に発展した。これは、現在も世界最大級の文化行事の1つと評されている。

20世紀を代表する歌手M.S. Subbulakshmiは、まさにその世襲芸能者の家系に生まれながら、国民的な地位に上り詰めた。1966年には国際連合で演奏を行った。現在も高度な訓練を要する生きた伝統として、インド国内および世界の移民社会で継承されている。</p>
