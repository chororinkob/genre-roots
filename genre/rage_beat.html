<h1>Rage / Rage Beat（レイジ）とは</h1>
<p>レイジは、2010年代後半に現れ、2020年から2021年にかけて広く知られるようになった、ヒップホップの伴奏のスタイルだ。歪んだシンセサイザーの咆哮を主役に据えている。 中心になるのは、同じ音の波をいくつか、わずかに音の高さをず</p>
<p>レイジは、2010年代後半に現れ、2020年から2021年にかけて広く知られるようになった、ヒップホップの伴奏のスタイルだ。歪んだシンセサイザーの咆哮を主役に据えている。

中心になるのは、同じ音の波をいくつか、わずかに音の高さをずらして重ね、それを歪ませて厚みを出したシンセの音だ。EDM由来のステレオ幅を広げたリード・シンセが、短く反復するメロディ（しばしば感傷的）を奏でる。この音はEDMの影響を受けたシンセの音色で、トランスや1980年代から1990年代のゲーム音楽を思わせる。

低音は808系の長く伸びる音だ。バウンシーで弾力のある808で、しばしば歪ませる。

リズムでは、細かく分けて刻まれる高音を用いるが、基本的なトラップのリズムが多い。レイジに公式なテンポの定義はなく、テンポでトラップと区別できるとする定説はない。ライブでモッシュを誘う曲が多い。

声も楽器の一部として扱われる。音程補正を極端にかけた歌唱と、短い掛け声が反復される。歌詞では、Yeatのように独特の語彙を使う例がある。</p>
<h2>成り立ち</h2><p>トラップは2010年代に主流となった。レイジは、トラップとSoundCloudラップの流れに、EDM（特にフューチャーベース）やハイパーポップの要素が加わって生まれた。

この音の成立には複数の制作者が関わり、Pi'erre BourneやPlayboi Carti、Trippie Reddらが起源として挙げられる。フィラデルフィアの制作者集団Working on Dyingに属するF1lthyは、Playboi Cartiの作品の制作で重要な役割を果たした。Playboi Cartiは、レイジの生みの親、または主要な普及者とされる。

2020年末に発表された彼の作品ホール・ロッタ・レッドは、発表当初、リスナーの反応は賛否が割れたが、批評家の評価は概ね良好だった。前半はノイジーで攻撃的、後半はより高揚感のある曲調の作品である。しかし後に、この作品はレイジの土台とみなされ、多くのアーティストに影響を与えることになった。

彼が主宰するOpiumという集団からは、Ken CarsonやDestroy Lonelyが現れた。また、独自の路線を歩むYeatが、より奇妙な音色と語感優先の歌詞で人気を固める。ジャンル名として定着したきっかけは、Trippie ReddとPlayboi Cartiの『Miss the Rage』（2021年5月7日）である。語自体はそれ以前から使われていた。

このスタイルの特異な点は、その受容のされ方にある。会場では聴衆が全力で飛び跳ね、互いにぶつかり合う。モッシュピットが生まれ、パンクのライブに例えられることがある。2023年3月4日、Rolling Loud Californiaで、モッシュと柵越えのためPlayboi Cartiが公演を止め、約30分中断した後に再開した例もある。ヒップホップが本来持っていた体で感じる力が、ロックの現場の作法と合流したとも言える。

同時期に流行したハイパーポップとも、一部の曲や作り手で重なる例がある。批判としては「型にはまっている」「行き止まりになりうる」といった評がある。人気の面ではYeatが2022年に20億回超の再生を記録した。</p>
