<h1>Rage / Rage Beat（レイジ）とは</h1>
<p>2020年前後に現れた、歪んだシンセサイザーの咆哮を主役に据えたヒップホップの伴奏の様式である。中核にあるのは、複数の同じ波形をわずかに音程をずらして重ね、それを歪ませて厚みを出したシンセの音で、和音というより一つの巨大な塊として</p>
<p>2020年前後に現れた、歪んだシンセサイザーの咆哮を主役に据えたヒップホップの伴奏の様式である。中核にあるのは、複数の同じ波形をわずかに音程をずらして重ね、それを歪ませて厚みを出したシンセの音で、和音というより一つの巨大な塊として鳴り響く。この音は本来トランスやハードダンスで用いられてきたもので、それをヒップホップの構造へ持ち込んだ点がこの分野の発明である。低音は808系の長く伸びる音だが、意図的に音量の限界を超えて潰され、割れた質感がそのまま提示される。刻みは細かい高音の分割を用いるが、トラップほど複雑ではなく、むしろ簡素さが選ばれる。テンポは体感で140から160 BPM程度と速く、疾走感が重視される。上物はシンセの塊以外にほとんど何も置かれず、隙間は歪みで埋められる。この構成は音楽的に貧しく見えるが、実際には大音量の会場で聴衆が飛び跳ねることに最適化された設計である。声も楽器の一部として扱われ、音程補正を極端にかけた歌唱と、短い掛け声が反復される。歌詞は成功の誇示、薬物、そして意味を成さない語感優先の言葉が中心で、内容よりも音としての質感が優先される。</p>
<h2>成り立ち</h2><p>背景には2010年代後半のヒップホップの飽和がある。トラップが完全に主流化し、誰もが同じ音を作れるようになった結果、差別化の手段として音色の過激さが求められた。決定的な役割を果たしたのはフィラデルフィアの制作者集団Working on Dyingと、そこに属したF1lthyである。彼らは、トランスやハードスタイルで使われる歪んだシンセを、ヒップホップの伴奏の主役に据えるという実験を行った。この音を最も効果的に用いたのがPlayboi Cartiである。2020年末に発表された彼の作品ホール・ロッタ・レッドは、当初は失敗作として酷評された。従来の歌ものらしさを捨て、絶叫と歪みだけで構成されたこの作品は、多くの聴き手を戸惑わせたのである。しかし数か月のうちに評価は反転し、この作品は以後数年のヒップホップの方向を決定づけることになった。彼が主宰するOpiumという集団からKen CarsonやDestroy Lonelyが現れ、また独自の路線を歩むYeatが、より奇妙な音色と語感優先の歌詞で人気を確立する。レイジという呼称は制作者や聴き手が自然に使い始めたもので、公式な定義はない。この様式の特異な点は、その受容のされ方にある。会場では聴衆が全力で飛び跳ね、互いにぶつかり合うという、ハードコア・パンクの現場に近い光景が生まれ、実際に負傷者が出ることも珍しくない。ヒップホップが本来持っていた身体性が、ロックの現場の作法と合流したとも言える。同時期に流行したハイパーポップとも音色の面で重なり、両者の境界は曖昧である。批判としては、音楽的な要素が少なすぎる、耳への負担が大きいといった指摘があるが、若い世代への浸透は圧倒的である。</p>
