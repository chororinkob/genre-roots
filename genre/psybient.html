<h1>Psybient（サイビエント）とは</h1>
<p>サイケデリック・トランスの音の組み立てと、アンビエントの穏やかな時間の流れを組み合わせた音楽である。 素材には、世界各地の民族楽器の録音が使われる。例えば、インドのシタールやタブラ、中東の弦楽器、アフリカの打楽器、南米の笛といった</p>
<p>サイケデリック・トランスの音の組み立てと、アンビエントの穏やかな時間の流れを組み合わせた音楽である。

素材には、世界各地の民族楽器の録音が使われる。例えば、インドのシタールやタブラ、中東の弦楽器、アフリカの打楽器、南米の笛といった音が、加工されて並べられることがある。さらに、鳥や水や風といった自然の録音、そして意味を持たない語りや詠唱が重ねられることもある。

和音は長く伸ばされた音が下に敷かれることが多く、和音の移り変わりはゆっくりしている。低音は深く柔らかい。

テンポはおおよそ60から110 BPMと、遅いことが多い。アンビエント風の部分が多く、ビートマッチングはあまり重視されない。テンポの変化も多い。

代わりに使われるのが、とても手の込んだ音色の変化である。一つの音が数十秒をかけて別の音へ形を変え、左右に動き、逆再生され、また戻ってくる。こうした処理が、聴き手の意識をずっと引っぱり回す。

曲は長く、はっきりした始まりと終わりを持たないこともある。幻覚剤の体験と結びついた文脈で発展したため、意識が変わっていく体験を音で表そうという考え方が、作り方の土台にある。</p>
<h2>成り立ち</h2><p>起点については諸説ある。最初期の展開はアンビエント・ハウスやチルアウトのシーンにあったとされ、後の作品がゴア・トランスやサイケデリック・トランスのシーンの中で作られた。「chill-out music」という語は、1989年にロンドンのクラブHeavenのThe White Roomで流れた音楽に由来するとされる。

一方、インドのゴアには、1960年代後半から1970年代にかけてヒッピー文化の土壌があり、世界中から放浪する若者が集まっていた。そこで1990年代初頭にゴア・トランスが生まれ、同じようなパーティーは1993年から世界へ広がった。

1990年代前半のイギリスでは、すでにThe Orbが、環境音やサンプリングを使ったアンビエント・ハウスを打ち出していた。Steve HillageとMiquette GiraudyのSystem 7も、1989年ごろに活動を始め、1990年にシングル『Sunburst』でデビューした。テクノ寄りの電子ダンス音楽の分野で活動していたグループである。

同時期に、代表的な存在が現れる。イギリスのSimon Posfordと、オーストラリア生まれのRaja Ramによる2人組、Shpongleだ。1996年に結成し、1998年のデビュー作『Are You Shpongled?』(Twisted Records)は、世界各地の楽器の録音と細かな電子的加工を組み合わせた作風で知られる。Twisted Recordsは、1996年にSimon PosfordとSimon Holtomが共同で作ったレーベルで、イギリスのOttもここから作品を出した。スウェーデンのCarbon Based LifeformsやSolar Fieldsは、フランス・リヨンのUltimae Recordsから作品を出した。

聴かれる場の一つとして重要なのが、野外フェスのチルアウトのエリアだ。アルバムとしても、チルアウト／ダウンテンポの市場で聴かれている。森や砂漠で数日間にわたって開かれる野外の祭典には、多くの場合、踊る場とは別に、横になって聴くための空間が設けられる。この場所はチルアウト(chill-out)の部屋やエリアと呼ばれ、参加者が休み、疲れた神経を回復させる役目を担う。つまりこの音楽は、ただ聴かれるだけでなく、仲間の集まりの中ではっきりした役割を持っている。

この音楽は、幻覚剤の体験と強く結びついた文化の中で発展した。</p>
