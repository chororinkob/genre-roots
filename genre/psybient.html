<h1>Psybient（サイビエント）とは</h1>
<p>サイケデリック・トランスの音響設計と、アンビエントの穏やかな時間感覚を組み合わせた音楽である。テンポは概ね60から110 BPMと遅く、そもそも明確な拍を持たない部分も多い。踊らせることを目的としないため、通常のダンス音楽が持つ、</p>
<p>サイケデリック・トランスの音響設計と、アンビエントの穏やかな時間感覚を組み合わせた音楽である。テンポは概ね60から110 BPMと遅く、そもそも明確な拍を持たない部分も多い。踊らせることを目的としないため、通常のダンス音楽が持つ、緊張を溜めて解放するという構造を持たない。代わりに用いられるのは、極めて手の込んだ音色の変化である。一つの音が数十秒をかけて別の音へ変形し、左右の空間を移動し、逆再生され、また戻ってくるといった処理が、聴き手の意識を絶えず引き回す。素材には世界各地の民族楽器の録音が用いられ、インドのシタールやタブラ、中東の弦楽器、アフリカの打楽器、南米の笛といった音が、加工されて配置される。加えて、鳥や水や風といった自然の録音、そして意味を持たない語りや詠唱が重ねられる。和声は長く伸ばされた和音の敷物が中心で、進行はゆっくりとしか動かない。低音は深く柔らかい。曲は8分から15分に及び、明確な始まりと終わりを持たないこともある。幻覚剤の体験と結びついた文脈で発展したため、意識の変容を音で再現するという発想が設計の根底にある。</p>
<h2>成り立ち</h2><p>起点はインドのゴアである。1970年代から1980年代にかけて、この海岸には世界中から放浪する若者が集まり、夜通しの野外パーティーが開かれていた。そこで発達したゴア・トランスは1990年代にヨーロッパへ持ち帰られるが、同時に重要な副産物が生まれる。夜明けとともに、あるいは休息の場として設けられた別室で流される、穏やかな音楽である。この用途に特化した領域が独立していった。1990年代前半のイギリスでは、既にThe Orbが環境音を用いた拍のない音楽を提示しており、Steve Hillageが率いたSystem 7も同様の方向を追求していた。この土壌から、決定的な存在が現れる。イギリスのSimon Posfordと、インド音楽への深い傾倒を持つRaja Ramによる二人組Shpongleである。1998年に発表した作品は、世界各地の楽器の録音と極めて精緻な電子的加工を組み合わせ、この分野の水準を一挙に確立した。Simon Posfordが運営したTwisted Recordsが拠点となり、同じくイギリスのOtt、スウェーデンのCarbon Based LifeformsやSolar Fieldsが続いた。この分野の受容の場は独特である。都市のクラブではなく、森や砂漠で数日間にわたって開かれる野外の祭典であり、そこには必ず、踊る場とは別に、横になって聴くための空間が設けられる。この場所は現地の言葉で穏やかな空間と呼ばれ、参加者が休息し、消耗した神経を回復させる機能を担う。つまりこの音楽は、単に聴かれるだけでなく、共同体の中で明確な役割を持って存在している。批判としては、幻覚剤の使用を前提とする文化への依存、そして音の作り込みに比して音楽的な内容が乏しいという指摘がある。それでも、電子音楽における音響設計の技術水準を押し上げた功績は大きい。</p>
<h2>代表曲</h2><ul><li>World of Sleepers (Carbon Based Lifeforms)</li><li>Are You Shpongled? (Shpongle)</li><li>Splitting an Atom (Ott)</li><li>Spaced (Entheogenic)</li><li>Dance of the Seven Sisters (Kalya Scintilla)</li></ul>
