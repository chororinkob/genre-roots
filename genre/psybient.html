<h1>Psybient（サイビエント）とは</h1>
<p>サイケデリック・トランスの音響設計と、アンビエントの穏やかな時間感覚を組み合わせた音楽である。テンポは概ね60から110 BPMと遅く、そもそも明確な拍を持たない部分も多い。踊らせることを目的としないため、通常のダンス音楽が持つ、</p>
<p>サイケデリック・トランスの音響設計と、アンビエントの穏やかな時間感覚を組み合わせた音楽である。テンポは概ね60から110 BPMと遅く、そもそも明確な拍を持たない部分も多い。踊らせることを目的としないため、通常のダンス音楽が持つ、緊張を溜めて解放するという構造を持たない。代わりに用いられるのは、とても手の込んだ音色の変化である。一つの音が数十秒をかけて別の音へ変形し、左右の空間を移動し、逆再生され、また戻ってくるといった処理が、聴き手の意識をずっと引っぱり回す。素材には世界各地の民族楽器の録音が用いられ、インドのシタールやタブラ、中東の弦楽器、アフリカの打楽器、南米の笛といった音が、加工されて並べられる。加えて、鳥や水や風といった自然の録音、そして意味を持たない語りや詠唱が重ねられる。和音は長く伸ばされた音が下に敷かれるのが中心で、和音の移り変わりはゆっくりしている。低音は深く柔らかい。曲は長く、明確な始まりと終わりを持たないこともある。幻覚剤の体験と結びついた文脈で発展したため、意識が変わっていく体験を音で表そうという考え方が、作り方の土台にある。</p>
<h2>成り立ち</h2><p>起点については諸説ある。最初期の展開はアンビエント・ハウスやチルアウトのシーンにあったとされ、後の作品がゴア・トランスやサイケデリック・トランスのシーンの中で作られた。「チルアウト」という語と場は、1989年のロンドンのクラブHeavenにある「White Room」に由来する。一方、インドのゴアには1960年代後半から1970年代にかけてヒッピー文化の土壌があり、世界中から放浪する若者が集まっていた。そこで1990年代初頭にゴア・トランスが成立し、同様のパーティーは1993年から世界へ広がった。同時に重要な副産物として、夜明けとともに、あるいは休息の場として設けられた別室で流される、穏やかな音楽が生まれた。この使い道に絞った分野が、独立していった。1990年代前半のイギリスでは、既にThe Orbが環境音やサンプリングを用いたアンビエント・ハウスを提示しており、Steve HillageとMiquette Giraudyが1989年に結成したSystem 7も、テクノ寄りの電子ダンス音楽の領域で活動していた。この土壌から、代表的な存在が現れる。イギリスのSimon Posfordと、オーストラリア生まれのRaja Ramによる2人組Shpongleである。1996年に結成し、1998年のデビュー作『Are You Shpongled?』(Twisted Records)は、世界各地の楽器の録音と精緻な電子的加工を組み合わせた作風で知られる。Twisted Recordsは1996年にSimon PosfordとSimon Holtomが共同で創設したレーベルで、イギリスのOttもここから作品を出した。スウェーデンのCarbon Based LifeformsやSolar Fieldsは、フランス・リヨンのUltimae Recordsから作品を出している。この分野の受容の場は独特である。都市のクラブではなく、森や砂漠で数日間にわたって開かれる野外の祭典であり、そこには多くの場合、踊る場とは別に、横になって聴くための空間が設けられる。この場所はチルアウト(chill-out)の部屋やエリアと呼ばれ、参加者が休息し、消耗した神経を回復させる機能を担う。つまりこの音楽は、単に聴かれるだけでなく、仲間の集まりの中ではっきりした役割を持っている。批判としては、幻覚剤の使用を前提とする文化への依存が指摘されている。それでも、電子音楽の音づくりの技術を押し上げた功績は大きい。</p>
