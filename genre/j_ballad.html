<h1>J-Balladとは</h1>
<p>日本のポップスのなかで、聴かせることを何より優先して作られた、ゆっくりした歌ものである。 中心になる楽器は、ピアノかアコースティックギターだ。そこにストリングスとエレキギターの長く伸ばす音、控えめなドラムとベースが加わる構成が多い</p>
<p>日本のポップスのなかで、聴かせることを何より優先して作られた、ゆっくりした歌ものである。

中心になる楽器は、ピアノかアコースティックギターだ。そこにストリングスとエレキギターの長く伸ばす音、控えめなドラムとベースが加わる構成が多い。最後のサビでは、ストリングスとコーラスが一気に厚くなる。

和音の作りには、はっきりした特徴があるとされる。4度から5度を経て一度に戻る進行に加え、いわゆる王道進行と呼ばれる4度、5度、3度、6度の並びがよく使われる。短調と長調の間を行き来して、切なさを生む。

テンポはおおむね60〜90 BPM前後だ。ピアノは、拍を細かく分けた8分音符や16分音符で伴奏を刻むことが多い。

歌い方では、語尾を丁寧に処理する。しゃくり上げや息の混ざったささやきから、サビでの張り上げまで、表現の幅が大きい。

歌詞は最も重視される要素とされる。別れ、片思い、時間の経過、故郷、家族への感謝といったテーマが、具体的な情景の描写を積み重ねる形で書かれる。日本語の言葉のアクセントと旋律を合わせる工夫が凝らされる点も特徴である。

曲の組み立ても型が決まっている。静かなAメロ、緊張を高めるBメロ、解き放つサビという三部構成に、後半で半音か全音上げる転調が加わる。

こうした曲は、卒業式、結婚式、テレビドラマの主題歌といった場と強く結びついていることが多い。</p>
<h2>成り立ち</h2><p>この音楽は、いくつもの流れが合流して生まれた。

ひとつは、戦前からの歌謡曲と、1970年前後に定着した演歌が持っていた、強い思いを歌い上げる伝統である。もうひとつは、1970年代のフォークとニューミュージックだ。井上陽水、荒井由実、小椋佳らが、より個人的で日常に近い言葉づかいを持ち込んだ。そこに、1970年代の欧米のソフトロックやAOR（大人向けロック）の和音とアレンジが加わった。

原型が固まったのは、1970年代末から1980年代にかけてだ。起源には諸説ある。1980年前後の松山千春、さだまさしといったニューミュージック系の歌手の流れが、その前史にあたるとされる。

爆発的に広がったのは1990年代とされる。テレビドラマの主題歌にバラードを使うやり方は、1980年代半ばの『恋におちて』などが先駆けとなった。そして1991年のCHAGE and ASKAの『SAY YES』などで、大きく広がった。1991年の『SAY YES』と、1992年の米米CLUBの『君がいるだけで』は、200万枚を超える売上を記録した。

制作の面では、小室哲哉、織田哲郎、小林武史らが作品を手がけた。小室哲哉は『CAN YOU CELEBRATE?』のように、オーケストラを使ったバラードも手がけた。小林武史は、Mr.Children（1992年メジャーデビュー）やMY LITTLE LOVERの制作に関わった。

1990年代には、CD市場が拡大した。国内の音楽ソフト（レコード・CDなど）の生産額は、1998年がピークだった。この拡大に、カラオケボックスの全国的な普及と、タイアップという仕組みが重なった。その結果、この形式は経済的に最も有利なものになった。

1990年代末から2000年代には、宇多田ヒカルやMISIAがR&amp;Bの歌い方を持ち込んだ。平井堅や福山雅治らも、代表的な男性バラード歌手として知られる。2000年代には、絢香やコブクロ（2001年メジャーデビュー）が続いた。

しかし、CD市場は1999年以降の不況を経て縮小した。前奏を短くする傾向も進んだ。配信の普及もその一因と推測されるが、原因は複数ある。長い前奏を持つこの形式は、主流から外れたとも言われる。

それでも、卒業や結婚といった人生の節目と結びついた曲として、今も強く残り続けている。</p>
<h2>代表曲</h2><ul><li>Pretender (Official髭男dism)</li><li>逢いたくていま (MISIA)</li><li>Everything (MISIA)</li><li>メロディー (玉置浩二)</li><li>SAY YES (CHAGE and ASKA)</li><li>瞳をとじて (平井堅)</li><li>未来予想図II (DREAMS COME TRUE)</li><li>なんでもないや (RADWIMPS)</li><li>ラブ・ストーリーは突然に (小田和正)</li><li>時代 (中島みゆき)</li><li>桜坂 (福山雅治)</li></ul>
