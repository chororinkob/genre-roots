<h1>J-Balladとは</h1>
<p>日本のポップスにおける、聴かせることを最優先に設計された遅い歌もの。テンポは毎分60から80拍程度に置かれ、拍を細かく分けた8分音符や16分音符でピアノが伴奏を刻む。編成はピアノまたはアコースティックギターを核に、ストリングスとエ</p>
<p>日本のポップスにおける、聴かせることを最優先に設計された遅い歌もの。テンポは毎分60から80拍程度に置かれ、拍を細かく分けた8分音符や16分音符でピアノが伴奏を刻む。編成はピアノまたはアコースティックギターを核に、ストリングスとエレキギターのロングトーン、控えめなドラムとベースが加わる構成が定番で、最後のサビでストリングスとコーラスが一気に厚くなる。和声の作りに明確な特徴があり、四度から五度を経て一度に戻る進行に加え、いわゆる王道進行と呼ばれる四度、五度、三度、六度の並びが多用され、短調と長調の間を行き来して切なさを生む。曲の構成も型が決まっており、静かなAメロ、緊張を高めるBメロ、開放するサビという三部構成に、後半で半音か全音上げる転調が加わる。歌唱は語尾を丁寧に処理し、しゃくり上げや息の混ざったささやきから、サビでの張り上げまで振幅が大きい。歌詞は最も重視される要素で、別れ、片思い、時間の経過、故郷、家族への感謝といった主題が、具体的な情景描写を積み重ねる形で書かれる。日本語の言葉のアクセントと旋律を合わせる工夫が凝らされる点も特徴で、卒業式、結婚式、テレビドラマの主題歌といった場と強く結びついている。</p>
<h2>成り立ち</h2><p>系譜は複数の流れが合流して生まれた。ひとつは戦前からの歌謡曲と、1960年代後半から70年代の演歌が持っていた、情念を歌い上げる伝統である。もうひとつは1970年代のフォークとニューミュージックで、井上陽水、荒井由実、小椋佳らが、より個人的で日常に近い言葉遣いを持ち込んだ。そこに1970年代の欧米のソフトロックやAORの和声とアレンジが加わった。原型が固まったのは1970年代末で、1977年の沢田研二や、1980年前後の松山千春、さだまさしといった歌い手が、遅いテンポで言葉を聴かせる型を定着させた。爆発的に広がったのは1990年代である。テレビドラマの主題歌としてバラードを起用する手法が確立し、1991年のCHAGE and ASKAの『SAY YES』、1992年の米米CLUBの『君がいるだけで』が200万枚を超える売上を記録した。制作面では小室哲哉、織田哲郎、そしてとりわけ小林武史が、ストリングスを厚く重ね転調で高揚を作る手法を確立し、Mr.ChildrenやMY LITTLE LOVERの作品で頂点に達した。1990年代半ばのCD市場の異常な拡大、カラオケボックスの全国的な普及、そしてタイアップという仕組みが、この形式を経済的に最も有利なものにした。1990年代末から2000年代には、宇多田ヒカルやMISIAがR&amp;Bの歌唱を持ち込み、平井堅や福山雅治が男性歌手の型を作り、2000年代半ばには絢香やコブクロが続いた。ただし2010年代以降、CDが売れなくなり、配信では冒頭数十秒で判断される環境に変わったことで、長い前奏を持つこの形式は主流から退いた。それでも卒業や結婚といった人生の節目と結びついた曲として、今も強く残り続けている。</p>
