<h1>Shoegaze（シューゲイザー）とは</h1>
<p>エフェクター（音を加工する機器）で加工した大量のギターの音を層状に重ね、歌声さえもその一部として溶かし込む様式。中核となるのはギターの音響設計で、リヴァーブ、ディレイ、コーラス、フランジャー（残響・遅延・揺らぎなどの効果）、そして</p>
<p>エフェクター（音を加工する機器）で加工した大量のギターの音を層状に重ね、歌声さえもその一部として溶かし込む様式。中核となるのはギターの音響設計で、リヴァーブ、ディレイ、コーラス、フランジャー（残響・遅延・揺らぎなどの効果）、そしてトレモロ・アーム（弦の張りを変えて音程を揺らすレバー）を用いたピッチ（音の高さ）の揺らぎが同時にかけられ、1本のギターが何を弾いているのか判別できない状態が意図的に作られる。とりわけ重要なのがKevin Shieldsが確立したグライド・ギターと呼ばれる技法で、コードを鳴らしながらトレモロ・アームを常時揺らし続けることで、音程が微細に上下し、全体が水中で聴くように滲む。音量は極めて大きいが、歪みの成分は攻撃的ではなく、むしろ甘く潰れて溶け合っている。リズムより持続する響きが主体で、My Bloody Valentineの『Loveless』ではドラムの多くがサンプリングされたループになっている。ベースは和音の底を支えるが前には出ない。歌声はしばしば不明瞭で、ミックスで小さめに抑えられるため、歌詞は聴き取りにくいことが多い。この歌詞の不可解さは欠点ではなく、声を楽器として扱う設計の帰結である。名称は、確認できる最古の活字が1991年5月25日号のNMEで、ライターのSteve LamacqがSlowdiveを「shoe-gazers」と書いたものとされる。命名者としてはAndy Rossの名が一般に紹介されるが、別の言い分もある。</p>
<h2>成り立ち</h2><p>1980年代末のイギリス南部、とりわけロンドン近郊のテムズ・ヴァレー地域で形成された。大きな影響源の一つは、1985年にスコットランドのThe Jesus and Mary Chainが発表したPsychocandyで、甘いポップスの旋律を耳を裂くようなフィードバック・ノイズ（音が回り込んで鳴る雑音）で覆うという発想が、以後に大きな影響を与えた。ジャンルの確立は、My Bloody Valentineの1988年のEPやIsn't Anything以降とされる。並行して、Cocteau Twinsが1980年代前半から、Robin Guthrieのエフェクター漬けのギターとElizabeth Fraserの言語を離れた歌声によって、この美学の別の側面を提示していた。決定的な作品はアイルランドの音楽家（生まれはニューヨーク）Kevin Shieldsが率いるMy Bloody Valentineが1991年に発表したLovelessで、制作に2年以上と当時としては膨大な費用がかかり、レーベルCreation Recordsを財政的に危機に陥れたと長く伝えられた。この逸話については、Kevin Shields本人は、費用やCreationを破綻寸前に追い込んだという話は誇張だと主張しており、いずれにせよ完璧主義的な音の追求が制作を長期化させたことは確かである。同時期、テムズ・ヴァレーのオックスフォードからRide、レディングからSlowdiveやChapterhouseが現れ、音楽誌Melody Makerは「The Scene That Celebrates Itself」、NMEは「シューゲイジング」と呼んだ。「シューゲイジング」は当初、動きのない演奏へのからかいだった（「The Scene That Celebrates Itself」は本来は肯定的な含みだったが、のちに揶揄として使われた）。批評家からは中産階級の若者の閉じた趣味だという批判も浴びた。1992年ごろから、イギリスの音楽報道の関心が労働者階級的で外向的なブリットポップ（主な時期は1993〜97年）へ移り始め、米国のグランジの台頭もあって、シューゲイザーは急速に旧式とみなされ、1995〜96年にはSlowdiveの契約打ち切りやRideの解散などが相次いだ。しかし2000年代以降、インターネットを通じて世界各地の若い聴き手に再発見され、日本、米国、ペルー、ロシア、オーストラリア、スウェーデン、香港など各地で独自のシーンが生まれた。2013年にはMy Bloody Valentineが約22年ぶりの新作を発表し、Slowdiveも2014年に再結成、現在ではオルタナティヴ・ロックの主要な要素の一つとして完全に定着している。</p>
