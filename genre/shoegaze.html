<h1>Shoegaze（シューゲイザー）とは</h1>
<p>シューゲイザーは、エフェクター（音を加工する機器）で加工した大量のギターの音を、層のように重ねる音楽だ。歌声さえも、その一部として溶かし込む。 中心になるのは、ギターの音づくりだ。リヴァーブ、ディレイ、コーラス、フランジャー（残響</p>
<p>シューゲイザーは、エフェクター（音を加工する機器）で加工した大量のギターの音を、層のように重ねる音楽だ。歌声さえも、その一部として溶かし込む。

中心になるのは、ギターの音づくりだ。リヴァーブ、ディレイ、コーラス、フランジャー（残響・遅延・揺らぎなどの効果）が、同時にかけられる。さらに、トレモロ・アーム（弦の張りを変えて音程を揺らすレバー）で、ピッチ（音の高さ）も揺らされる。その結果、1本のギターが何を弾いているのか判別できない状態が、意図的に作られる。

とりわけ重要なのが、Kevin Shieldsが固めたグライド・ギターと呼ばれる技法だ。コードを鳴らしながら、トレモロ・アームを常に揺らし続ける。すると、音程が細かく上下し、全体が水中で聴くように滲む。音量は極めて大きい。ただし、歪みの成分は攻撃的ではなく、むしろ甘くつぶれて溶け合っている。

ベースは和音の底を支えるが、前には出ない。My Bloody Valentineの「Loveless」では、ドラムの多くがサンプリングされたループである。

歌声はしばしば不明瞭で、ミックスで低く抑えられる。この歌詞の不可解さは欠点ではない。声を楽器として扱う設計から生まれた結果だ。

名称については、現時点で確認できる最古の活字は、NME 1991年5月25日号である。Steve Lamacqが、Slowdiveの3枚目のEP「Holding Our Breath」の告知で、同バンドを&quot;shoe-gazers&quot;と書いた。命名者については、Andy Ross説が一般に紹介されている。Mooseのギタリストの側にも、別の言い分がある。Rossの回想の時期は、確認できる最古の活字より後である。</p>
<h2>成り立ち</h2><p>1980年代末、イギリス南部で、この音楽は形づくられた。中心は、ロンドン近郊のテムズ・ヴァレー地域だ。

大きな影響源の一つが、1985年にスコットランドのThe Jesus and Mary Chainが発表したPsychocandyである。甘いポップスの旋律を、耳を裂くようなフィードバック・ノイズ（音が回り込んで鳴る雑音）で覆うという発想が、あとに大きな影響を与えた。ジャンルが固まったのは、My Bloody Valentineの1988年のEPやIsn't Anything以降とされる。

並行して、Cocteau Twinsも、1980年代前半から、この美学の別の面を見せていた。Robin Guthrieのエフェクターだらけのギターと、Elizabeth Fraserの言葉を離れた歌声によるものだ。

決定的な作品は、1991年にMy Bloody Valentineが発表したLovelessである。率いたのは、アイルランドの音楽家Kevin Shieldsで、生まれはニューヨークだ。録音期間は約2年7か月。費用は25万ポンドと噂されたが、Shieldsは最大16万ポンドと主張し、レーベルCreation Recordsを財政的に危機に陥れたと長く伝えられた。この逸話について、Kevin Shields本人は、費用やCreationを破綻寸前に追い込んだという話は誇張だと主張している。いずれにせよ、完璧主義的な音の追求が制作を長引かせたことは確かである。

同じ時期に、テムズ・ヴァレーから、次々とバンドが現れた。オックスフォードからRide、レディングからSlowdiveやChapterhouseである。音楽誌Melody Makerは、この動きを「The Scene That Celebrates Itself」と呼んだ。NMEは「シューゲイジング」と呼んだ。「シューゲイジング」は当初、動きのない演奏へのからかいだった。「The Scene That Celebrates Itself」は本来は肯定的な含みだったが、のちに揶揄として使われた。また、批評家からは、中産階級の若者の閉じた趣味だという批判も浴びた。

しかし、流れは変わる。1992年頃から音楽報道の関心が移り始めた。グランジとブリットポップ（主な時期は1993〜97年）の人気に押されて、1995〜96年には、Slowdiveの契約打ち切りやRideの解散などが相次いだ。

それでも2000年代以降、インターネットを通じて、世界各地の若い聴き手に再発見される。日本、米国、ペルー、ロシア、オーストラリア、スウェーデン、香港など、各地で独自のシーンが生まれた。2013年には、My Bloody Valentineが約21年ぶりの新作を発表した。Slowdiveも2014年に再結成した。近年は再評価が進み、オルタナティヴ・ロックの重要な系譜の一つとみなされる。</p>
