<h1>Shoegaze（シューゲイザー）とは</h1>
<p>エフェクターで加工した大量のギターの音を層状に重ね、歌声さえもその一部として溶かし込む様式。中核となるのはギターの音響設計で、リヴァーブ、ディレイ、コーラス、フランジャー、そしてトレモロ・アームを用いたピッチの揺らぎが同時にかけら</p>
<p>エフェクターで加工した大量のギターの音を層状に重ね、歌声さえもその一部として溶かし込む様式。中核となるのはギターの音響設計で、リヴァーブ、ディレイ、コーラス、フランジャー、そしてトレモロ・アームを用いたピッチの揺らぎが同時にかけられ、一本のギターが何を弾いているのか判別できない状態が意図的に作られる。とりわけ重要なのがKevin Shieldsが確立したグライド・ギターと呼ばれる技法で、コードを鳴らしながらトレモロ・アームを常時揺らし続けることで、音程が微細に上下し、全体が水中で聴くように滲む。音量は極めて大きいが、歪みの成分は攻撃的ではなく、むしろ甘く飽和している。ドラムは単純な反復で、リズムより持続する響きが主体。ベースは和音の底を支えるが前には出ない。歌は男女ともに囁くように歌われ、ミックスでは楽器と同じかそれ以下の音量に沈められるため、歌詞はほとんど聴き取れない。この歌詞の不可解さは欠点ではなく、声を楽器として扱う設計の帰結である。名称は、演奏者が足元のエフェクターを見つめたまま動かない姿を、当時のイギリスの音楽記者が揶揄したことに由来する。</p>
<h2>成り立ち</h2><p>1980年代末のイギリス南部、とりわけロンドン近郊のテムズ・ヴァレー地域で形成された。直接の起源は1985年にスコットランドのThe Jesus and Mary Chainが発表したPsychocandyで、甘いポップスの旋律を耳を裂くようなフィードバック・ノイズで覆うという発想が、以後の全ての基礎となった。並行して、Cocteau Twinsが1980年代前半から、Robin Guthrieのエフェクター漬けのギターとElizabeth Fraserの言語を離れた歌声によって、この美学の別の側面を提示していた。決定的な作品はアイルランド出身のKevin Shieldsが率いるMy Bloody Valentineが1991年に発表したLovelessで、制作に二年以上と当時としては膨大な費用がかかり、レーベルCreation Recordsを財政的に危機に陥れたと長く伝えられた。同レーベルの経営者Alan McGeeは後にこの逸話を誇張だと述べているが、いずれにせよ完璧主義的な音の追求が制作を長期化させたことは確かである。同時期、Slowdive、Ride、Chapterhouse、Lushといったバンドが同じ地域から現れ、音楽誌Melody MakerやNMEはこれらをまとめてシューゲイジングと呼んだ。この呼称は当初、動きのない演奏と内向的な態度への揶揄であり、批評家からは中産階級の若者の閉じた趣味だという批判も浴びた。1992年以降、イギリスの音楽報道が労働者階級的で外向的なブリットポップへ一斉に舵を切ると、シューゲイザーは急速に旧式とみなされ、多くのバンドが数年で解散した。しかし2000年代以降、インターネットを通じて世界各地の若い聴き手に再発見され、日本、米国、中国、インドネシアなど各地で独自のシーンが生まれた。2013年にはMy Bloody Valentineが22年ぶりの新作を発表し、Slowdiveも2014年に再結成、現在ではオルタナティヴ・ロックの主要な語彙の一つとして完全に定着している。</p>
<h2>代表曲</h2><ul><li>Only Shallow（My Bloody Valentine）</li><li>When the Sun Hits（Slowdive）</li><li>Vapour Trail（Ride）</li><li>De-Luxe（Lush）</li><li>Dreams Burn Down（Ride）</li></ul>
