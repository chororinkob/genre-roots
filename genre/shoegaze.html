<h1>Shoegaze（シューゲイザー）とは</h1>
<p>エフェクター（音を加工する機器）で加工した大量のギターの音を層状に重ね、歌声さえもその一部として溶かし込む様式。中核となるのはギターの音響設計で、リヴァーブ、ディレイ、コーラス、フランジャー（残響・遅延・揺らぎなどの効果）、そして</p>
<p>エフェクター（音を加工する機器）で加工した大量のギターの音を層状に重ね、歌声さえもその一部として溶かし込む様式。中核となるのはギターの音響設計で、リヴァーブ、ディレイ、コーラス、フランジャー（残響・遅延・揺らぎなどの効果）、そしてトレモロ・アーム（弦の張りを変えて音程を揺らすレバー）を用いたピッチ（音の高さ）の揺らぎが同時にかけられ、1本のギターが何を弾いているのか判別できない状態が意図的に作られる。とりわけ重要なのがKevin Shieldsが確立したグライド・ギターと呼ばれる技法で、コードを鳴らしながらトレモロ・アームを常時揺らし続けることで、音程が微細に上下し、全体が水中で聴くように滲む。音量は極めて大きいが、歪みの成分は攻撃的ではなく、むしろ甘く潰れて溶け合っている。ドラムについては、My Bloody Valentineの「Loveless」では、多くがサンプリング（録音した音を取り込んで使うこと）されたくり返し（ループ）になっている。ベースは和音の底を支えるが前には出ない。歌は、ふわりと漂うような声で歌われることが多く、ミックスでは楽器と同じかそれ以下の音量に抑えられるため、歌詞はしばしば聴き取りにくい。この歌詞の不可解さは欠点ではなく、声を楽器として扱う設計の帰結である。名前をつけた人については、Andy Rossだとする説が広く知られている（Mooseというバンドのギタリストが、もとは自分たちのバンドのことだったと言う話もある）。確かめられる一番古い活字は、NMEの1991年5月25日号で、記者のSteve LamacqがSlowdiveの3枚目のEP「Holding Our Breath」の紹介の中で、このバンドを「shoe-gazers（靴を見つめる人たち）」と書いたものである。Soundsで最初に使われたという話は、当時の号に該当する記事がなく、誤りとされる。</p>
<h2>成り立ち</h2><p>1980年代末のイギリス南部、とりわけロンドン近郊のテムズ・ヴァレー地域で形成された。大きな影響源の一つは、1985年にスコットランドのThe Jesus and Mary Chainが発表したPsychocandyで、甘いポップスの旋律を耳を裂くようなフィードバック・ノイズ（音が回り込んで鳴る雑音）で覆うという発想が、以後に大きな影響を与えた。ジャンルの確立は、My Bloody Valentineの1988年のEPやIsn't Anything以降とされる。並行して、Cocteau Twinsが1980年代前半から、Robin Guthrieのエフェクター漬けのギターとElizabeth Fraserの言語を離れた歌声によって、この美学の別の側面を提示していた。決定的な作品はアイルランドの音楽家（生まれはニューヨーク）Kevin Shieldsが率いるMy Bloody Valentineが1991年に発表したLovelessで、録音に約2年7か月（1989年2月〜1991年9月）かかり、費用は25万ポンドと噂されたが、Shields本人は最大でも16万ポンドだったと言う。レーベルCreation Recordsはスタジオ代を払えないほど財政的に苦しくなったと長く伝えられた。この逸話については、Kevin Shields本人は、費用やCreationを破綻寸前に追い込んだという話は誇張だと主張しており、いずれにせよ完璧主義的な音の追求が制作を長期化させたことは確かである。同時期、テムズ・ヴァレーのオックスフォードからRide、レディングからSlowdiveやChapterhouseが現れ、音楽誌Melody Makerは「The Scene That Celebrates Itself」、NMEは「シューゲイジング」と呼んだ。「シューゲイジング」は当初、動きのない演奏へのからかいだった。「The Scene That Celebrates Itself」は、名づけた本人によれば本来はほめ言葉のつもりだったが、のちに音楽雑誌でからかいにも使われた。批評家からは中産階級の若者の閉じた趣味だという批判も浴びた。1992年ごろからイギリスの音楽雑誌の関心が移りはじめ、アメリカのグランジと、労働者階級的で外向的なブリットポップ（主な時期は1993〜97年）が人気を集めると、シューゲイザーは古いものと見られるようになった。1995〜96年には、Slowdiveがレコード会社との契約を打ち切られ、Rideが解散するなど、バンドの終わりが相次いだ。しかし2000年代以降、インターネットを通じて世界各地の若い聴き手に再発見され、日本、米国、ペルー、ロシア、オーストラリア、スウェーデン、香港など各地で独自のシーンが生まれた。2013年にはMy Bloody Valentineが約21年ぶりの新作を発表し、Slowdiveも2014年に再結成、近年は見直しが進み、オルタナティヴ・ロックの大事な流れの一つとみなされている。</p>
