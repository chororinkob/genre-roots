<h1>Partyschlager（パーティーシュラーガー）とは</h1>
<p>ドイツ語圏の宴会と行楽地のために特化した、徹底して単純明快な歌謡曲。テンポは毎分125から140拍程度、四つ打ちのバスドラムに手拍子のスネアが乗る、迷いようのないリズムで進む。和音は三つか四つの長調の和音だけで、短調はほぼ使われな</p>
<p>ドイツ語圏の宴会と行楽地のために特化した、徹底して単純明快な歌謡曲。テンポは毎分125から140拍程度、四つ打ちのバスドラムに手拍子のスネアが乗る、迷いようのないリズムで進む。和音は三つか四つの長調の和音だけで、短調はほぼ使われない。編成は打ち込みのシンセが中心で、明るいブラス音、アコーディオン風の音色、ユーロダンス由来のノコギリ波が並び、生楽器はほとんど使われない。旋律は子供でも一度で覚えられる音域の狭いもので、サビでは同じ言葉を何度も繰り返す。決定的なのは合唱の設計で、全員が肩を組んで左右に揺れながら歌えるよう、言葉が短く区切られ、掛け合いの空白が用意されている。歌詞は酒、太陽、休暇、恋、そして意図的に馬鹿げた言葉遊びが中心で、深刻な主題は徹底して排除される。歌手は誇張した衣装をまとい、道化的な役柄を演じることが多い。演奏の場が何よりも重要で、スペインのマヨルカ島にあるドイツ人向けの巨大ビアホール、ドイツ各地の謝肉祭、オクトーバーフェスト、アプレスキーと呼ばれるスキー後の酒場、そして学生の祭りが主戦場である。同じシュラーガーでも、往年の情緒的な歌ものとは目的が違い、聴くためではなく集団で騒ぐための道具として作られている。</p>
<h2>成り立ち</h2><p>シュラーガー自体は二十世紀前半からドイツ語圏の大衆歌謡として存在していたが、宴会専用の形が独立したのは1980年代後半から90年代にかけてである。決定的な舞台となったのは、スペイン領マヨルカ島のエル・アレナル地区にあるBallermann 6という海辺の売店とその周辺だった。1980年代からドイツ人の団体旅行客が大量に押し寄せ、安価な酒を飲みながら騒ぐ場となり、そこで流れる音楽が独自の需要を生んだ。ここから生まれた歌手の代表格がJürgen Drewsで、1990年代半ばに『Ein Bett im Kornfeld』などの旧作を宴会向けに歌い直し、マヨルカの王と呼ばれるようになった。1996年にはMickie Kraus、Tim Toupetといった道化的な芸風の歌手が続き、2000年前後にはDJ Ötziがオーストリアから登場する。彼の『Anton aus Tirol』(1999)と、往年のヒットを作り替えた『Hey Baby』(2000)は欧州各国で一位となり、この形式を国際的に知らしめた。制作の面では、既存の英語圏のヒット曲にドイツ語の馬鹿げた歌詞を付けて作り替える手法が定着し、著作権処理をめぐる争いも頻繁に起きた。2000年代以降はテレビ番組や、ケルンの謝肉祭、オクトーバーフェストといった年中行事と結びついて市場が固定化し、Mia Julia、Ikke Hüftgold、Lorenz Buffonらが続いた。批判も根強く、歌詞の下品さ、女性の扱い、酔客の暴力や事故、そしてマヨルカ島の住民から見た観光公害への反発が繰り返し問題になっている。2020年からの感染症の流行で会場が閉鎖され市場は一時壊滅したが、その後は再開されている。</p>
<h2>代表曲</h2><ul><li>Zehn nackte Frisösen (Mickie Krause)</li><li>König von Mallorca (Jürgen Drews)</li><li>Hey Baby (DJ Ötzi)</li><li>Schatzi schenk mir ein Foto (Mickie Krause)</li><li>Ein Stern (der deinen Namen trägt) (DJ Ötzi &amp; Nik P.)</li></ul>
