<h1>Partyschlager（パーティーシュラーガー）とは</h1>
<p>ドイツ語圏の宴会と行楽地のために特化した、徹底して単純明快なシュラーガー（大衆歌謡）。テンポは毎分平均133拍程度（70〜160と幅がある）、四つ打ちのバスドラムに手拍子のスネアが乗る、迷いようのないリズムで進む。和音は単純で、長</p>
<p>ドイツ語圏の宴会と行楽地のために特化した、徹底して単純明快なシュラーガー（大衆歌謡）。テンポは毎分平均133拍程度（70〜160と幅がある）、四つ打ちのバスドラムに手拍子のスネアが乗る、迷いようのないリズムで進む。和音は単純で、長調が多いが、短調の曲も少なくない。編成は打ち込みのシンセが中心で、明るいブラス音、アコーディオン風の音色、ユーロダンス由来のノコギリ波が並び、生楽器はほとんど使われない。旋律は子供でも一度で覚えられる音域の狭いもので、サビでは同じ言葉を何度も繰り返す。決定的なのは合唱の設計で、全員が肩を組んで左右に揺れながら歌えるよう、言葉が短く区切られ、掛け合いの空白が用意されている。歌詞は酒、マヨルカでの休暇、パーティー、恋、そして意図的に馬鹿げた言葉遊びが中心で、女性を性的対象として描く内容も目立ち、深刻な主題は徹底して排除される。歌手は誇張した衣装をまとい、道化的な役柄を演じることが多い。演奏の場が何よりも重要で、スペインのマヨルカ島にあるドイツ人向けの巨大ビアホール、ドイツ各地の謝肉祭、オクトーバーフェスト、アプレスキーと呼ばれるスキー後の酒場、そして学生の祭りが主戦場である。同じシュラーガーでも、往年の情緒的な歌ものとは目的が違い、聴くためではなく集団で騒ぐための道具として作られている。</p>
<h2>成り立ち</h2><p>現在のシュラーガーは1950年代の西ドイツとオーストリアに由来する大衆歌謡で、宴会向けのPartyschlagerが人気を得たのは1990年代からである（1970年代は前史で、Tony Marshallなどが初期の代表者）。Ballermann-Hitsのコンピレーション・シリーズは1995年に始まった。象徴的な舞台となったのは、スペイン領マヨルカ島のエル・アレナル地区にあるBallermann 6という海辺の売店とその周辺だった。原型は1972年建設の小屋で、1970年代からドイツ人向けの店が周辺に集まり、安価な酒を飲みながら騒ぐ場となった。「Ballermann」が象徴として知られるようになったのは1990年代後半で、そこで流れる音楽が独自の需要を生んだ。この分野の代表的な歌手の一人がJürgen Drewsで、1960年代から活動し、1976年に『Ein Bett im Kornfeld』で全国的なヒットを出した。1995年にはStefan Raab und die Bekloppten名義でこの曲の再録が当たり、1999年にThomas Gottschalkから「マヨルカの王」の呼び名を贈られた。Mickie Krause（1999年の「10 nackte Friseusen」でブレイク）、Tim Toupet（美容師で、2000年代半ばにチャート入り）といった道化的な芸風の歌手が続き、2000年前後にはDJ Ötziがオーストリアから登場する。彼の『Anton aus Tirol』(1999、名義はAnton featuring DJ Ötzi)はオーストリアとドイツで1位、往年のヒット（Bruce Channelの1961年の曲）を作り替えた『Hey Baby』(2000)は英国とアイルランドなどで1位となり、この形式を国際的に知らしめた。制作の面では、既存のヒット曲（英語圏の曲に限らず、ドイツ語のシュラーガーや民謡、童謡も）に馬鹿げた歌詞を付けて作り替える手法が定着している。2000年代以降はテレビ番組や、ケルンの謝肉祭、オクトーバーフェストといった年中行事と結びついて市場が固定化し、Mia Julia、Ikke Hüftgold、Lorenz Büffel（オーストリア）らが続いた。批判も根強く、歌詞の下品さ、女性の扱い、酔客や飲酒をめぐる問題、そしてマヨルカ島の住民から見た観光公害への反発が繰り返し問題になっている。2020年からの感染症の流行で会場が閉鎖され市場は一時壊滅したが、その後は再開されている。</p>
<h2>代表曲</h2><ul><li>Layla (DJ Robin &amp; Schürze)</li><li>Ein Stern (der deinen Namen trägt) (DJ Ötzi &amp; Nik P.)</li><li>Anton aus Tirol (DJ Ötzi)</li><li>Hey Baby (DJ Ötzi)</li><li>Schatzi schenk mir ein Foto (Mickie Krause)</li><li>Baila Baila (Mickie Krause)</li><li>Jan Pillemann Otze (Mickie Krause)</li><li>Zehn nackte Frisösen (Mickie Krause)</li><li>Ich bau dir ein Schloss (Jürgen Drews)</li><li>Mexico (Jürgen Drews)</li><li>König von Mallorca (Jürgen Drews)</li><li>Tiamo (Jürgen Drews)</li></ul>
