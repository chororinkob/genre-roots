<h1>Partyschlager（パーティーシュラーガー）とは</h1>
<p>ドイツ語圏の宴会と行楽地のために特化した、徹底して単純で分かりやすいシュラーガー（大衆歌謡）である。同じシュラーガーでも、昔の情緒的な歌ものとは目的が違う。聴くためではなく、集団で騒ぐための道具として作られている。 編成は、電子ド</p>
<p>ドイツ語圏の宴会と行楽地のために特化した、徹底して単純で分かりやすいシュラーガー（大衆歌謡）である。同じシュラーガーでも、昔の情緒的な歌ものとは目的が違う。聴くためではなく、集団で騒ぐための道具として作られている。

編成は、電子ドラムと四つ打ちが土台だ。そこにユーロダンス、EDM、ハンズアップの要素を取り入れる。多くの曲は、伴奏音源に合わせて歌われる。

テンポは、2021年のある調査では、84曲の平均が133.3 BPMで、70〜160の幅があった。四つ打ちのバスドラムに手拍子風のスネアが乗り、迷いようのないリズムで進む。

和音は単純だ。同じ調査では、最も多い調はイ長調（18.3%）で、次がイ短調だった。旋律は、最高音を男性が頑張れば届く高さに置く。サビでは同じ言葉を何度も繰り返す。

決め手は合唱の作り方だ。全員が肩を組み、左右に揺れながら歌えるよう、言葉は短く区切られる。曲によっては歌を休む所を設けて、観客の合唱を誘う。歌詞は、酔っていても一緒に歌えるように作られる。

歌詞の主題は、同じ調査では酒（23.2%）、マヨルカでの休暇（19.5%）、パーティー（17.1%）、性的に描かれる女性（13.4%）、女性（8.5%）、ユーモア（6.1%）などが中心だった。歌手は大げさな衣装をまとい、おどけた役を演じることが多い。

何より大事なのは演奏の場だ。スペインのマヨルカ島にあるドイツ人向けの大型会場、民衆祭、シュラーガー・フェスティバルやHamburger Schlagermoveなどのパレード、アプレスキーと呼ばれるスキー後の酒場、地方のディスコなどが主戦場である。</p>
<h2>成り立ち</h2><p>シュラーガーは、大衆向けの歌だ。言葉そのものは19世紀のウィーンで生まれた。今のシュラーガーが盛んになった元は、1950年代の西ドイツ・東ドイツ・オーストリアにある。そのうち宴会向けのPartyschlagerが人気を得たのは、1990年代からだ（1960〜70年代は前史で、Tony Marshallなどが初期の代表者）。

1995年には、Ballermann-Hitsのコンピレーション・シリーズが始まった。舞台の代名詞となったのは、スペイン領マヨルカ島のエル・アレナル地区にある、Ballermann 6という海辺の売店とその周辺だった。原型は1972年に建てられた小屋だ。1970年代からドイツ人向けの店が周りに集まり、安い酒を飲みながら騒ぐ場所になった。「Ballermann」が代名詞として知られるようになったのは1990年代後半で、そこで流れる音楽が独自の需要を生んだ。

この分野の代表的な歌手の一人が、Jürgen Drewsだ。1960年代から活動し、1976年4月に『Ein Bett im Kornfeld』で全国的なヒットを出し、ドイツで1位になった。この曲は、Bellamy Brothers『Let Your Love Flow』のドイツ語カバーである。1995年には、Stefan Raab &amp; Die Bekloppten feat. Jürgen Drews &amp; Bürger Lars Dietrich名義のカバーが出て、ドイツで最高27位、13週チャートに入った。1999年には、Thomas GottschalkがDrewsとCosta Cordalisを「マヨルカの王」と紹介した。以後、この呼び名はDrewsに定着した。

続いて、Mickie Krause（1999年の「10 nackte Friseusen」でブレイク）、Tim Toupet（美容師で、2000年代半ばにチャート入り）といった、道化のような芸風の歌手が現れた。2000年前後には、オーストリアからDJ Ötziが登場する。彼の『Anton aus Tirol』(1999、名義はAnton featuring DJ Ötzi)は、オーストリアとドイツで1位になり、ドイツでの1位は2000年だった。往年のヒット（Bruce Channelの1961年の曲）を作り替えた『Hey Baby』(2000)は、英国とアイルランドなどで1位となり、この形式を国際的に知らしめた。英国とアイルランドでの1位は2001年である。

制作の面では、既存のヒット曲（英語圏の曲に限らず、ドイツ語のシュラーガーも）をカバーしたり、歌詞を替えたり、パロディにしたりする手法が一般的だ。謝肉祭、オクトーバーフェスト、アプレスキーなど、場面ごとのヒット曲の分け方もある。オクトーバーフェストでは、18時以降にシュラーガーやポップが演奏される。Mia Julia、Ikke Hüftgold、Lorenz Büffel（オーストリア）らが続いた。

一方で、批判も根強い。歌詞の下品さ、女性の扱い、酔客や飲酒をめぐる問題、そしてマヨルカ島の住民から見た観光公害への反発が、繰り返し問題になっている。2020年からの感染症の流行では会場が閉鎖され、ライブ中心の事業は大きな打撃を受けた。2021年に制限付きで再開し、2022年にはヒットが生まれた。</p>
<h2>代表曲</h2><ul><li>Layla (DJ Robin &amp; Schürze)</li><li>Ein Stern (der deinen Namen trägt) (DJ Ötzi &amp; Nik P.)</li><li>Anton aus Tirol (DJ Ötzi)</li><li>Hey Baby (DJ Ötzi)</li><li>Ein Bett im Kornfeld (Jürgen Drews)</li><li>Schatzi schenk mir ein Foto (Mickie Krause)</li><li>Baila Baila (Mickie Krause)</li><li>Jan Pillemann Otze (Mickie Krause)</li><li>Zehn nackte Frisösen (Mickie Krause)</li><li>Ich bau dir ein Schloss (Jürgen Drews)</li><li>Mexico (Jürgen Drews)</li><li>König von Mallorca (Jürgen Drews)</li><li>Tiamo (Jürgen Drews)</li></ul>
