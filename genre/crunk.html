<h1>Crunk（クランク）とは</h1>
<p>クランクは、アメリカ南部、とくにアトランタとメンフィスで生まれたヒップホップだ。身体を跳ねさせて叫ばせるための、単純で強烈な音楽である。ストリップクラブやクラブで発展した。 中心にあるのは、ローランドTR-808や909のドラムマ</p>
<p>クランクは、アメリカ南部、とくにアトランタとメンフィスで生まれたヒップホップだ。身体を跳ねさせて叫ばせるための、単純で強烈な音楽である。ストリップクラブやクラブで発展した。

中心にあるのは、ローランドTR-808や909のドラムマシンだ。疎らで短いクラップと、重いベース・スタブで曲が組み立てられる。その上に、安いシンセの短いリフが数音だけ、執拗に繰り返される。短く単純なシンセの旋律を反復して、催眠的な効果を出す。

ハイハットは細かい連打で刻まれる。倍速（ダブルタイム）のハイハットも、要所に入れられる。

テンポは曲によって、ゆっくり目から中速までだ。Get Crunkは78 BPMほどである。表向きは遅く聞こえるが、裏で細かく刻むため、体感は速い。

声は歌わない。絶叫やチャント（短い掛け声）が特徴的だ。リード役の呼びかけに、大人数が野太い声で応じる。この掛け合いが、曲の骨組みになる。

歌詞は、複雑な物語や比喩を持たない。地名の連呼、酒、クラブでの行動、単純な命令形の号令が並ぶ。同じ語を何度も繰り返すことで、聴き手を考えさせず、反射で動かす設計になっていることが多いと見られる。

同時期の南部の音の中でも、ヒューストンの遅く粘るチョップド・アンド・スクリュードとは性格が異なる、外向きの熱量を持つ。ニューヨークの技巧を重んじる路線とも、価値観そのものが異なるとも言われる。</p>
<h2>成り立ち</h2><p>語源は、アフリカ系アメリカ人の英語にある。「crank」（crank up）の過去分詞形が「crunk」になったものだと説明される。南部で「crunk」と活用されたと推測されている。起源は1990年代初頭のメンフィスとアトランタとされるが、諸説ある。

まず、メンフィスだ。DJ PaulとJuicy JがLord Infamousと組み、1991年にグループを始めた。当初の名は「The Backyard Posse」などで、Three 6 Mafiaの名になったのは1995年ごろである。音の特徴は、「疎らで低BPMのリズム、単純なチャント、麻薬的に反復するスラッシャー映画風の質感」と記述されている。

それ以前の1980年代半ば〜後半には、マイアミに動きがあった。Luther Campbell（通称Uncle Luke）と2 Live Crewが、下品な掛け合いと重低音のベースで市場を作った。これが南部のクラブ音楽に影響を与えた。

そしてアトランタでは、Lil Jonが1991年ごろからDJや制作に携わった。1995年にはLil Jon &amp; the East Side Boyzを結成した。2000年代初頭には、プロデューサー兼あおり役として全国区になる。彼はEast Side Boyzを従え、クランクを普及させた。ただし、このスタイルの創始者かどうかは、メンフィス勢との間で今も争いがある。メンフィス側の寄与も、アトランタと同等かそれ以上に重いとされる。

2001年の『Put Yo Hood Up』に続き、2002年の『Kings of Crunk』が出た。そこに収録され、2003年にシングルとして発売された『Get Low』が、全米で大ヒットした。さらに、Usherの『Yeah!』(2004)でLil Jonが手がけた音が、全米1位を12週連続で記録した。こうして南部の音が、主流に躍り出た。

周辺には、Ying Yang Twins、Trillville、Pastor Troy、David Bannerらが並んだ。レーベルは、BME RecordingsとTVTが中心になった。同じ時期に、Three 6 Mafiaが映画『Hustle &amp; Flow』の主題歌で、2006年のアカデミー歌曲賞を受賞した。ヒップホップ・グループとして初の受賞だった。

しかし、この音楽には強い批判もついてまわった。歌詞の露骨さと女性の扱い、暴力の描写が問題視された。黒人社会内部からも、安易な自己戯画化だという声が上がった。TVTは経営破綻した。Lil Jon本人も、一時期テレビのバラエティ番組の顔として消費されたと見る向きもある。

その後、クランクはトラップのスタイルのルーツの一つとされるようになった。別の流れとして、クランクとスクリーモ（ポスト・ハードコア）の融合であるクランクコアが、2000年代中盤のシーン文化から生まれた。</p>
