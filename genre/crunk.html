<h1>Crunk（クランク）とは</h1>
<p>アメリカ南部、とくにアトランタとメンフィスで生まれた、身体を跳ねさせて叫ばせるための単純で強烈なヒップホップ。中心にあるのはローランドTR-808の低音で、音程を持ったまま長く伸ばされたベースがスピーカーを揺らし、その上に安いシン</p>
<p>アメリカ南部、とくにアトランタとメンフィスで生まれた、身体を跳ねさせて叫ばせるための単純で強烈なヒップホップ。中心にあるのはローランドTR-808の低音で、音程を持ったまま長く伸ばされたベースがスピーカーを揺らし、その上に安いシンセの短いリフが数音だけ執拗に繰り返される。ハイハットは細かい連打で刻まれ、途中で加速して転がる粒になる。テンポは曲によってゆっくり目から中速までで（代表曲Get Crunkは毎分78拍ほど）、表向きは遅く聞こえるが、裏で細かく刻むため体感は速い。旋律らしい旋律はほとんど置かれず、和音も一つか二つで曲が最後まで進む。声は歌わず、絶叫やチャント（短い掛け声）が特徴的で、リード役の呼びかけに大人数が野太い声で応じる掛け合いが曲の骨組みになる。歌詞は複雑な物語や比喩を持たず、地名の連呼、酒、クラブでの行動、単純な命令形の号令が並ぶ。同じ語を何十回も繰り返すことで、聴き手を考えさせず反射で動かす設計になっている。同時期の南部の音でも、ヒューストンの遅く粘るチョップド・アンド・スクリュードとは正反対の外向きの熱量を持ち、ニューヨークの技巧を重んじる路線とは価値観そのものが異なる。ストリップクラブと大学のパーティー、そしてスポーツ会場の場内音楽が主な生息地である。</p>
<h2>成り立ち</h2><p>語源は、アフリカ系アメリカ人の英語で「crank」（crank up）の過去分詞形が「crunk」になったものだと説明され、南部で「crunk」と活用されたと推測されている。起源は1990年代初頭のメンフィスとアトランタとされるが、諸説ある。メンフィスでは、Three 6 Mafiaを結成したDJ PaulとJuicy Jが、カセットテープで自主流通させた低音と絶叫の音源を市内に広めた。それ以前の1980年代半ば〜後半にマイアミでは、Luther Campbell（通称Uncle Luke）と2 Live Crewが下品な掛け合いと重低音のベースで市場を作り、これが南部のクラブ音楽の前提になった。決定的だったのはアトランタで、1990年代半ばから活動するLil Jonが、2000年代初頭にプロデューサー兼あおり役として全国区になる。彼はEast Side Boyzを従え、シンセ1本と808の低音だけの骨組みに、自分の濁った絶叫を重ねる型を確立した。2001年の『Put Yo Hood Up』、2002年の『Kings of Crunk』に収録され2003年にシングルとして発売された『Get Low』が全米で大ヒットし、Usherの『Yeah!』(2004)でLil Jonが手がけた音がついに全米1位を12週連続で記録して、南部の音が主流に躍り出た。周辺にはYing Yang Twins、Trillville、Pastor Troy、David Bannerらが並び、レーベルはBME RecordingsとTVTが中心になった。同時期にThree 6 Mafiaは映画『Hustle &amp; Flow』の主題歌で2006年のアカデミー歌曲賞を受賞し、ヒップホップ・グループとして初の受賞となった。だがこの音楽には強い批判もついてまわった。歌詞の露骨さと女性の扱い、暴力の描写が問題視され、黒人社会内部からも安易な自己戯画化だという声が上がった。TVTは経営破綻し、Lil Jon本人も一時期テレビのバラエティ番組の顔として消費された。2010年代以降、この808の使い方とハイハットの刻みはトラップに引き継がれ、別の流れとして、クランクとスクリーモ（ポスト・ハードコア）の融合であるクランクコアが、2000年代中盤のシーン文化から生まれた。</p>
<h2>代表曲</h2><ul><li>Turn Down for What (Lil Jon)</li><li>Get Low (Lil Jon &amp; the East Side Boyz)</li><li>Freek-a-Leek (Petey Pablo)</li><li>Snap Yo Fingers (Lil Jon)</li><li>Salt Shaker (Ying Yang Twins)</li><li>Damn! (YoungBloodZ feat. Lil Jon)</li><li>Real Nigga Roll Call (Lil Jon and the East Side Boyz feat. Ice Cube)</li><li>Knuck If You Buck (Crime Mob feat. Lil Scrappy)</li><li>Never Scared (Bone Crusher feat. Killer Mike and T.I.)</li><li>Throw It Up (Lil Jon &amp; the East Side Boyz)</li><li>Rock Yo Hips (Crime Mob feat. Lil Scrappy)</li><li>What U Gon' Do (Lil Jon &amp; The East Side Boyz feat. Lil Scrappy)</li><li>Raise Up (Petey Pablo)</li><li>Whisper Song (Ying Yang Twins)</li><li>Lean wit It, Rock wit It (Dem Franchize Boyz)</li><li>Whistle While You Twurk (Ying Yang Twins)</li><li>Lovers and Friends (Lil Jon feat. Usher and Ludacris)</li><li>It's Hard out Here for a Pimp (Three 6 Mafia)</li><li>Tipsy (J-Kwon)</li></ul>
