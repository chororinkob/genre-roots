<h1>Crunk（クランク）とは</h1>
<p>アメリカ南部、とくにアトランタとメンフィスで生まれた、身体を跳ねさせて叫ばせるための単純で強烈なヒップホップ。中心にあるのはローランドTR-808や909のドラムマシンによる、疎らで短いクラップと重いベース・スタブ（短い打ち込み）</p>
<p>アメリカ南部、とくにアトランタとメンフィスで生まれた、身体を跳ねさせて叫ばせるための単純で強烈なヒップホップ。中心にあるのはローランドTR-808や909のドラムマシンによる、疎らで短いクラップと重いベース・スタブ（短い打ち込み）で、それがスピーカーを揺らし、その上に安いシンセの短いリフが数音だけ執拗に繰り返される。ハイハットは倍速（ダブルタイム）で要所に入れられる。テンポは曲によってゆっくり目から中速までで（代表曲Get Crunkは毎分78拍ほど）、表向きは遅く聞こえるが、裏で細かく刻むため体感は速い。短く単純なシンセの旋律を反復して、催眠的な効果を出す。声は歌わず、絶叫やチャント（短い掛け声）が特徴的で、リード役の呼びかけに大人数が野太い声で応じる掛け合いが曲の骨組みになる。歌詞は複雑な物語や比喩を持たず、地名の連呼、酒、クラブでの行動、単純な命令形の号令が並ぶ。単純なチャントが中心になっている。同時期の南部の音でも、ヒューストンの遅く粘るチョップド・アンド・スクリュードとは性格の異なる外向きの熱量を持ち、ニューヨークの技巧を重んじる路線とは価値観そのものが異なる。ストリップクラブやクラブで発展した。</p>
<h2>成り立ち</h2><p>語源は、アフリカ系アメリカ人の英語で「crank」（crank up）の過去分詞形が「crunk」になったものだと説明され、南部で「crunk」と活用されたと推測されている。起源は1990年代初頭のメンフィスとアトランタとされるが、諸説ある。メンフィスでは、DJ PaulとJuicy JがLord Infamousと組み、1991年にグループを始め（のちのThree 6 Mafia。この名になったのは1995年ごろ）、疎らで低BPMのリズム、単純なチャント、麻薬的に反復するスラッシャー映画風の質感の音源（ミックステープ）を市内に広めた。それ以前の1980年代半ば〜後半にマイアミでは、Luther Campbell（通称Uncle Luke）と2 Live Crewが下品な掛け合いと重低音のベースで市場を作り、これが南部のクラブ音楽に影響を与えた。アトランタでは、1991年ごろからDJや制作に携わり、1995年にLil Jon &amp; the East Side Boyzを結成したLil Jonが、2000年代初頭にプロデューサー兼あおり役として全国区になる。彼はEast Side Boyzを従え、重ねたシンセとドラムマシンのクラップ、ベースの骨組みに、自分の濁った絶叫を重ねる型で、クランクを全国に普及させた（様式の創始者かどうかは、メンフィス勢との間で今も争いがある）。2001年の『Put Yo Hood Up』、2002年の『Kings of Crunk』に収録され2003年にシングルとして発売された『Get Low』が全米で大ヒットし、Usherの『Yeah!』(2004)でLil Jonが手がけた音がついに全米1位を12週連続で記録して、南部の音が主流に躍り出た。周辺にはYing Yang Twins、Trillville、Pastor Troy、David Bannerらが並び、レーベルはBME RecordingsとTVTが中心になった。同時期にThree 6 Mafiaは映画『Hustle &amp; Flow』の主題歌で2006年のアカデミー歌曲賞を受賞し、ヒップホップ・グループとして初の受賞となった。だがこの音楽には強い批判もついてまわった。歌詞の露骨さと女性の扱い、暴力の描写が問題視され、黒人社会内部からも安易な自己戯画化だという声が上がった。TVTは経営破綻し、Lil Jon本人も一時期テレビのバラエティ番組に出演した。クランクはトラップの様式的なルーツの一つとなり、別の流れとして、クランクとスクリーモ（ポスト・ハードコア）の融合であるクランクコアが、2000年代中盤のシーン文化から生まれた。</p>
