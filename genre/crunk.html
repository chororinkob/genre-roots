<h1>Crunk（クランク）とは</h1>
<p>アメリカ南部、とくにアトランタとメンフィスで生まれた、身体を跳ねさせて叫ばせるための単純で強烈なヒップホップ。中心にあるのはローランドTR-808の低音で、音程を持ったまま長く伸ばされたベースがスピーカーを揺らし、その上に安いシン</p>
<p>アメリカ南部、とくにアトランタとメンフィスで生まれた、身体を跳ねさせて叫ばせるための単純で強烈なヒップホップ。中心にあるのはローランドTR-808の低音で、音程を持ったまま長く伸ばされたベースがスピーカーを揺らし、その上に安いシンセの短いリフが数音だけ執拗に繰り返される。ハイハットは細かい連打で刻まれ、途中で加速して転がる粒になる。テンポは毎分70から80拍程度と表向きは遅いが、裏で細かく刻むため体感は速い。旋律らしい旋律はほとんど置かれず、和音も一つか二つで曲が最後まで進む。声は歌わず、ほぼ全編が絶叫であり、リード役の呼びかけに大人数が野太い声で応じる掛け合いが曲の骨組みになる。歌詞は複雑な物語や比喩を持たず、地名の連呼、酒、クラブでの行動、単純な命令形の号令が並ぶ。同じ語を何十回も繰り返すことで、聴き手を考えさせず反射で動かす設計になっている。同時期の南部の音でも、ヒューストンの遅く粘るチョップド・アンド・スクリュードとは正反対の外向きの熱量を持ち、ニューヨークの技巧を重んじる路線とは価値観そのものが異なる。ストリップクラブと大学のパーティー、そしてスポーツ会場の場内音楽が主な生息地である。</p>
<h2>成り立ち</h2><p>語源はメンフィスの俗語で、酔って興奮した状態を指すクランクトが縮まったものとされる。土台は1990年代前半のメンフィスにあり、Three 6 Mafiaの前身であるDJ PaulとJuicy Jが、カセットテープで自主流通させた低音と絶叫の音源を市内に広めた。同じ頃マイアミではLuke Campbellと2 Live Crewが下品な掛け合いと重低音のベースで市場を作り、これが南部のクラブ音楽の前提になった。決定的だったのはアトランタで、2000年前後、Lil Jonがプロデューサー兼扇動役として登場する。彼はEast Side Boyzを従え、シンセ一本と八〇八の低音だけの骨組みに、自分の濁った絶叫を重ねる型を確立した。2002年の『Put Yo Hood Up』、2004年の『Kings of Crunk』収録の『Get Low』が全米で大ヒットし、Usherの『Yeah!』(2004)でLil Jonが手がけた音がついに全米一位を独占して、南部の音が主流に躍り出た。周辺にはYing Yang Twins、Trillville、Pastor Troy、David Bannerらが並び、レーベルはBME RecordingsとTVTが中心になった。同時期にThree 6 Mafiaは映画『Hustle and Flow』の主題歌で2006年のアカデミー歌曲賞を受賞し、ヒップホップ勢として初の快挙となった。だがこの音楽には強い批判もついてまわった。歌詞の露骨さと女性の扱い、暴力の描写が問題視され、黒人社会内部からも安易な自己戯画化だという声が上がった。TVTは経営破綻し、Lil Jon本人も一時期テレビのバラエティ番組の顔として消費された。2010年代以降、この八〇八の使い方とハイハットの刻みはトラップに引き継がれ、EDM側ではクランクコアという派生も生まれた。</p>
