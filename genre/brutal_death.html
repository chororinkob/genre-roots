<h1>Brutal Death Metal（ブルータルデスメタル）とは</h1>
<p>デスメタルの中でも、重さと密度と非人間性を極限まで追求した一派である。ギターは極端に低く調弦される。7弦や8弦の楽器を使うバンドもある。リフは旋律を持たず、半音階を細かく往復する動きや、和音の枠を無視した不協和な塊として構成される</p>
<p>デスメタルの中でも、重さと密度と非人間性を極限まで追求した一派である。ギターは極端に低く調弦される。7弦や8弦の楽器を使うバンドもある。リフは旋律を持たず、半音階を細かく往復する動きや、和音の枠を無視した不協和な塊として構成される。特徴的なのは、音を伸ばさず短く切って刻む奏法で、これによってギターは弦楽器というより打楽器として機能する。加えて、テンポを落として最も低い弦を叩きつけるような重い区間(ブレイクダウン)が挿入されることがあり、とくにこの区間を中心に据える一派は、叩きつけを意味する名でスラムと呼ばれる。ドラムは極めて速いブラストビート（スネアを超高速で連打する奏法）と、二つの大太鼓による絶え間ない連打を基本とし、音色は生々しさを消して硬い金属質に整えられる。ヴォーカルはこの分野の象徴で、喉の奥を鳴らして極端に低い唸りを出す技法が用いられ、旋律も言葉も判別できない。時に嘔吐や動物の唸りに近い発声も加えられる。歌詞は暴力、身体の破壊、疫病といった主題を扱うが、明らかに現実離れした誇張であり、様式化された虚構として受け取られている。</p>
<h2>成り立ち</h2><p>1990年前後のアメリカで、デスメタルが確立されると同時に、そこからさらに過激な方向を求める動きが始まった。中心地となったのはニューヨーク州で、ロングアイランドをはじめ州内の多数のバンドが形を作った。公式の情報では1988年に結成されたSuffocationは、極端に低い調弦と、テンポを突然落とす重い区間を組み合わせるという手法を確立し、1991年の作品でこの様式の先駆者として広く認められている。彼らが導入した、密度の高い部分と極端に遅い部分の落差という構造は、後のデスコアやビートダウン・ハードコアにまで受け継がれている。同じニューヨークのInternal Bleedingは、この重い区間をさらに強調した独自の方向を打ち出し、これは現地の言葉で叩きつけと呼ばれる系統として独立していく。フロリダではCannibal Corpseが、内臓や殺人を極端に露骨に描いた歌詞とジャケットによって、音楽的な内容以上に社会的な論争を呼んだ。彼らの作品はドイツやオーストラリアで販売を禁止され、アメリカでは、1995年に上院議員Bob Doleが大統領選の演説で名指しで批判し、1996年には政治家や活動家による大手レーベルへの圧力運動の標的にもなった。1990年代半ば以降、この様式は国際化した。ポーランドのVaderやBehemothはデスメタル系のバンドとして知られ、日本ではDefiled が独自の解釈を示した。とりわけ2000年代に入ると、この分野は極端な細分化を遂げる。咆哮の技法を競う方向、速度を競う方向、そして重い区間だけを抽出した方向がそれぞれ独立し、内輪でのみ通用する呼称が無数に生まれた。Suffocationの1991年の作品がRoadrunner Recordsから発売されたように、流通のしかたは一様ではない。この分野に対しては、音楽的な内容が乏しく、過激さの競争に堕しているという批判が繰り返されてきた。実際、演奏技術の水準は極めて高い一方で、旋律も和声も放棄しているため、外部の聴き手には区別がつきにくい。しかし当事者にとっては、その微細な差異こそが価値であり、世界中に強固で自律的な共同体が維持されている。</p>
