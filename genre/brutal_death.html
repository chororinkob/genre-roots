<h1>Brutal Death Metal（ブルータルデスメタル）とは</h1>
<p>デスメタルの中でも、重さと密度と非人間性を極限まで追求した一派である。ギターは極端に低く調弦され、7弦や8弦を用いて最低音がベースの音域に達することも多い。リフは旋律を持たず、半音階を細かく往復する動きや、和音の枠を無視した不協和</p>
<p>デスメタルの中でも、重さと密度と非人間性を極限まで追求した一派である。ギターは極端に低く調弦され、7弦や8弦を用いて最低音がベースの音域に達することも多い。リフは旋律を持たず、半音階を細かく往復する動きや、和音の枠を無視した不協和な塊として構成される。特徴的なのは、音を伸ばさず短く切って刻む奏法で、これによってギターは弦楽器というより打楽器として機能する。加えて、テンポを突然四分の一に落として最も低い弦を叩きつけるだけの部分が挿入され、この極端に重い区間は現地の言葉で叩きつけを意味する名で呼ばれている。ドラムは毎分250打を超えるブラストビートと、二つの大太鼓による絶え間ない連打を基本とし、音色は生々しさを消して硬い金属質に整えられる。ヴォーカルはこの分野の象徴で、喉の奥を鳴らして極端に低い唸りを出す技法が用いられ、旋律も言葉も判別できない。時に嘔吐や動物の唸りに近い発声も加えられる。歌詞は暴力、身体の破壊、疫病といった主題を扱うが、明らかに現実離れした誇張であり、様式化された虚構として受け取られている。</p>
<h2>成り立ち</h2><p>1990年前後のアメリカで、デスメタルが確立されると同時に、そこからさらに過激な方向を求める動きが始まった。中心地となったのはニューヨーク州ロングアイランドである。1988年に結成されたSuffocationは、極端に低い調弦と、テンポを突然落とす重い区間を組み合わせるという手法を確立し、1991年の作品でこの様式の原型を完成させた。彼らが導入した、密度の高い部分と極端に遅い部分の落差という構造は、後のデスコアやビートダウン・ハードコアにまで受け継がれている。同じニューヨークのInternal Bleedingは、この重い区間をさらに強調した独自の方向を打ち出し、これは現地の言葉で叩きつけと呼ばれる系統として独立していく。フロリダではCannibal Corpseが、内臓や殺人を極端に露骨に描いた歌詞とジャケットによって、音楽的な内容以上に社会的な論争を呼んだ。彼らの作品はドイツやオーストラリアで販売を禁止され、アメリカ議会でも名指しで批判されている。1990年代半ば以降、この様式は国際化した。ポーランドではVaderやBehemothが東欧独自の厳格な演奏を持ち込み、日本ではDefiled が独自の解釈を示した。とりわけ2000年代に入ると、この分野は極端な細分化を遂げる。咆哮の技法を競う方向、速度を競う方向、そして重い区間だけを抽出した方向がそれぞれ独立し、内輪でのみ通用する呼称が無数に生まれた。流通は小規模なレーベルと通信販売、そして音楽祭が中心で、大手の関与はほとんどない。この分野に対しては、音楽的な内容が乏しく、過激さの競争に堕しているという批判が繰り返されてきた。実際、演奏技術の水準は極めて高い一方で、旋律も和声も放棄しているため、外部の聴き手には区別がつきにくい。しかし当事者にとっては、その微細な差異こそが価値であり、世界中に強固で自律的な共同体が維持されている。</p>
