<h1>Brutal Death Metal（ブルータルデスメタル）とは</h1>
<p>ブルータル・デスメタルは、デスメタルの中でも、重さと密度と非人間性を極限まで追求した一派だ。 中心になるのはギターだ。ギターはダウンチューニングされる。メタル全般では、7弦や8弦の楽器を使うバンドもある。リフは、旋律より重さ・速さ</p>
<p>ブルータル・デスメタルは、デスメタルの中でも、重さと密度と非人間性を極限まで追求した一派だ。

中心になるのはギターだ。ギターはダウンチューニングされる。メタル全般では、7弦や8弦の楽器を使うバンドもある。リフは、旋律より重さ・速さ・リズムの複雑さを優先する。半音階を細かく往復する動きや、和音の枠を無視した不協和な塊として組み立てられる。特徴的なのは、音を伸ばさず短く切って刻む奏法だ。これによってギターは、弦楽器というより打楽器として機能する。

ドラムは、系統によっては、極めて速いブラストビートと、二つの大太鼓による絶え間ない連打を基本とする。ただしスラム系では、ブラストビートはアクセント程度にしか使われず、中ぐらいのテンポとブレイクダウンが中心である。ブラストビートとは、16分音符を高速で、バスドラ・スネア・シンバルに振り分ける奏法だ。音色は生々しさを消して、硬い金属質に整えられる。

ヴォーカルはこの分野のトレードマークだ。喉の奥を鳴らして、極端に低い唸りを出す技法が用いられる。旋律も言葉も聞き取りにくい。

歌詞は暴力、身体の破壊といった主題を扱うが、「cartoonish gore（漫画的なゴア描写）」という書き方である。虚構として一様に受け取られてきたわけではない。

曲の途中には、テンポを落として最も低い弦を叩きつけるような重い区間(ブレイクダウン)が入ることがある。とくにこの区間を中心に据える一派は、叩きつけを意味する名でスラムと呼ばれる。</p>
<h2>成り立ち</h2><p>デスメタルは1980年代半ばに成立した。ブルータル・デスメタルが形になるのは、1990年代前半である。「brutal」という形容は、1988年のチェコのKrabathorの『Brutal Death』デモなど、最初期からある。

中心地となったのはニューヨーク州だ。ロングアイランドをはじめ、州内の多数のバンドが形を作った。1988年（公式。1989年とする資料もある）に結成されたSuffocationは、ダウンチューニングと、テンポを突然落とす重い区間を組み合わせるという手法を定着させた。1991年の作品を含め、「ブルータル・デスメタルのスタイルを固めたのはニューヨークのSuffocation」という見方が有力だが、唯一の定説ではない。彼らがデスメタルに持ち込み、広めた、密度の高い部分と極端に遅い部分の落差という構造は、後のデスコアやビートダウン・ハードコアにまで受け継がれている。

同じニューヨークのInternal Bleedingは、この重い区間をさらに強調した独自の方向を打ち出した。これは現地の言葉で叩きつけと呼ばれる系統として、独立していく。

ニューヨーク州バッファロー結成、のちフロリダへ移転したCannibal Corpseは、内臓や殺人を極端に露骨に描いた歌詞とジャケットによって、音楽的な内容以上に社会的な論争を呼んだ。彼らの作品は、オーストラリアでは、1996年10月23日に全音源の販売が禁止され、店頭から撤去された。その後、2006年に解除されている。ドイツでは、大半が「指定（Index）」で、成人にのみ販売でき、通常の小売店からは外される。裁判所による押収で成人にも販売できないのは、一部の作品（『Butchered at Birth』『Torture』『Vile』など）だけである。アメリカでは、1995年に上院議員Bob Doleが、大統領選の演説で名指しで批判した。1996年には、政治家や活動家による大手レーベルへの圧力運動の標的にもなった。

国際化の例を挙げるなら、1988年の時点でチェコ（Krabathor）とスウェーデン（Carnage）に先行例がある。日本には、スラム系の大阪のInfernal Revulsionなどがある。

「重い区間を中心とする方向」（スラム）の独立は1990年代である。Suffocationの1991年の作品がRoadrunner Recordsから発売されたように、流通のしかたは一様ではない。

演奏技術の水準は極めて高い。一方で、旋律より重さ・速さ・リズムの複雑さを優先しているため、外部の聴き手には区別がつきにくい。しかし当事者にとっては、その微細な差異こそが価値である。世界中に強固で自律的な共同体が維持されている。</p>
