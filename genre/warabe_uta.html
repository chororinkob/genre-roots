<h1>Warabe uta（ワラベウタ）とは</h1>
<p>歌そのものが遊びの道具になっている子どもの歌だ。代表曲22曲を動画で聴け、ルーツと影響のつながりを地図でたどれる。</p>
<p>歌そのものが遊びの道具になっている子どもの歌だ。楽器は原則として使わない。声と、手・指・足・体がそのまま楽器になる。手まりをつく手のひら、放り上げるお手玉の指先、二人で組んだ腕のアーチ、鬼の目を隠す両手が、打楽器の代わりにリズムを刻む。

旋律の音域は驚くほど狭い。1オクターブを大きく使う童謡と違い、2音から5音で足りる曲が多い。小泉文夫のテトラコルド理論でいえば、完全4度の両端を核音とし、その間に中間音を1つだけ置く形が基本になる。中でも民謡のテトラコルドが最もよく現れ、都節のテトラコルドも混じる。長2度だけの2音旋律は必ず上の音で終わり、隣り合う3音の旋律は真ん中の音で終わる。この終止のきまりを外すと、歌が歌に聞こえなくなる。

リズムは拍子よりも言葉の区切りが先に来る。テンポはおおよそ80 BPMの子守唄から140 BPM近い鬼決めの歌まで幅があり、速さを決めるのは歌い手の体の動きだ。まりが跳ねる瞬間、足が地面を蹴る瞬間、手拍子が合う瞬間にアクセントが落ちる。歌詞の頭に「こんこん」「ずいずい」のような囃子言葉が付き、その部分だけ音が細かく詰まる。

歌い方は地声で、肩の力を抜いた平板な調子だ。ビブラートをかけず、語尾を伸ばすか、逆に切ってしまう。一人で歌う子守唄では息が細く消え入るように終わり、集団で歌う鬼ごっこの歌では全員が同じ高さで声を張る。うまく歌うことより、間違えずに続けることが大事にされる。屋外では声が家の壁や塀に反響し、風に流れて遠くの child の声と重なる。

歌詞の主題は、目の前の遊びと季節の暮らしだ。籠の中の鳥、通れない関所、水車、お茶壺道中、月と兎。意味が通らない言葉や、地方ごとに食い違う言葉も多い。「ずいずいずっころばし」を江戸の茶壺道中に結びつける説と、意味のない戯れ歌とみる説が並び立つように、歌詞の本当の意味は決められない。

曲の組み立ては短い。多くは4小節ほどの節を、遊びの段階に合わせて繰り返す。鬼を決める歌は最後の1音で当たりが決まり、勝負の歌は人数が減るまで同じ節が回り続ける。節そのものは単純だが、手の動きと声がずれた瞬間に遊びが壊れるため、テンポの揺れに独特の緊張が生まれる。

作曲者のいる童謡や、教育のために作られた唱歌とは、そこがはっきり違う。作者がおらず、楽譜より口伝えが先にあり、歌われるのは学校の教室ではなく、路地や縁側、神社の境内、保育園のホールだ。同じ「かごめかごめ」でも、地域と世代で節が少しずつ違う。</p>
<h2>成り立ち</h2><p>江戸時代の後半、子どもの歌は初めて文字で書き留められるようになった。僧の釈行智が1820年ごろにまとめた『童謡集』は、各地の子守唄や遊び歌を集めたものとして、日本最古の童謡集とみなされる。尾張では、手遊びの作法まで書き添えた『尾張童遊集』が編まれた。歌そのものはその何世代も前から口伝えにあったとみられるが、記録に残ったのはこの時期からだ。

明治に入ると、学校はわらべうたを必要としなくなった。1872年の学制で学校制度が整い、1881年には『小学唱歌集』が出て、西洋の音階と和声に基づく唱歌が教室に入る。唱歌は教育の道具として作られ、わらべうたは「子どもが勝手に歌うもの」として教育の外に置かれた。しかし1909年、童謡研究会が『諸国童謡大全』を刊行し、各地の遊び歌を採集して世に出した。

1918年、鈴木三重吉が子ども向けの雑誌『赤い鳥』を創刊し、北原白秋らが童謡運動を起こす。1919年には西條八十が詞を、成田為三が曲を書いた「かなりや」が生まれ、作詞者と作曲者のいる童謡が主流になった。わらべうたは新しい童謡の素材として引かれ、同時に古いものとして追いやられた。作られる歌と、伝わる歌が分かれたのはこの時期だ。

戦後、わらべうたは研究と教育の対象として戻ってくる。1962年、町田嘉章と浅野建二が岩波文庫で『わらべうた―日本の伝承童謡―』を編み、歌詞と遊び方をまとめて読める形にした。1960年代には音楽学者の小泉文夫が、小学校低学年の音楽教育にわらべうたを取り入れるよう文部省に働きかけ、都内100校の児童に歌ってもらい、10年がかりで採譜した。1969年にはその成果が『わらべうたの研究』として出る。小泉は2音旋律が上の音で、隣り合う3音の旋律が真ん中の音で終わる規則を見つけ、テトラコルド理論で日本の音階を整理した。

同じ時期、ハンガリーでコダーイ・メソッドを学んだ羽仁協子が1967年に帰国し、「わらべうたを子ども達に返そう」と活動を始める。1968年にはコダーイ芸術教育研究所を設立し、1970年からは研修生をハンガリーへ送った。研究所は保育園や幼稚園の現場にわらべうたを広め、遊び歌は教育のプログラムの中に居場所を得た。

それでも、街からは歌う場所が消えていった。高度経済成長期に空き地や路地が減り、舗装された道路では手まりもお手玉もできない。1960年代から70年代にかけて、子どもの耳はテレビのアニメソングやアイドル歌謡に向かい、1970年代には童謡全体が衰退へ向かった。わらべうたは、保育の場と、地域の年配者の記憶の中に残った。

歌詞をめぐる議論は決着していない。「ずいずいずっころばし」は江戸のお茶壺道中を歌ったものとする説と、意味のない戯れ歌とする説が並び立つ。「あんたがたどこさ」の発祥地も熊本説と東京説があり、根拠はどれも推測の域を出ない。歌詞の「本当の意味」を一つに定めること自体ができない、というのが研究者の一致した見方だ。

現在、わらべうたは消えずに形を変えて残っている。保育の現場では手遊び歌として毎日歌われ、作曲家が女声合唱やピアノ曲に編曲している。絵本や録音、地域の記録集で歌詞と遊び方が保存され、学校では国語や音楽の教材として「かごめかごめ」「通りゃんせ」が取り上げられる。地域の祭りや盆踊りの囃子に節が流れ込む例も多い。作者のいない歌が、作者のいる作品として演奏される。その二重性が、このジャンルの現在の姿だ。</p>
