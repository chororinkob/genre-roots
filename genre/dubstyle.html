<h1>Dubstyle（ダブスタイル）とは</h1>
<p>ハードスタイルの骨格に、ダブステップの拍節と低音の表現を組み合わせた様式である。土台となるのはハードスタイル特有のバスドラムで、頭の短い破裂音と、音程を持って下降する長い胴体で構成される。この打撃音を、ハードスタイル本来の四つ打ち</p>
<p>ハードスタイルの骨格に、ダブステップの拍節と低音の表現を組み合わせた様式である。土台となるのはハードスタイル特有のバスドラムで、頭の短い破裂音と、音程を持って下降する長い胴体で構成される。この打撃音を、ハードスタイル本来の四つ打ちではなく、ダブステップの型に配置し直した点が決定的である。すなわち、一小節の一拍目と三拍目にバスドラムを、二拍目と四拍目にスネアを置く、いわゆるハーフタイムの構造を取る。テンポの表記は一分間に140拍前後だが、体感される速度はその半分になる。この二重の時間感覚がダブステップから受け継いだ性質である。低音はハードスタイルの重い打撃と、ダブステップの唸る音の両方が用いられ、音程を急激に上下させる加工が施される。上物は最小限で、金属的に割れた合成音や加工された声が置かれる程度である。曲の構成は緊張と解放の落差を強調し、静かに溜めてから一気に低音が炸裂する形が中心となる。二つの様式のいずれの聴衆にとっても馴染みのある要素を持ちながら、どちらとも異なる音像を作る点が、この様式の存在理由になっている。</p>
<h2>成り立ち</h2><p>2010年前後、二つの流れが同時に勢いを増していた。一方はオランダを中心とするハードスタイルで、大規模な音楽祭の拡大とともに聴衆を増やしていた。もう一方は英国発のダブステップで、この時期にアメリカ市場へ渡って攻撃的な方向へ変質し、爆発的な人気を得ていた。両者は速度も出自も異なるが、極端に圧縮された低音を主役に据えるという点で共通していた。この共通点に着目した制作者たちが、両者を掛け合わせる試みを始める。中心となったのはオランダとベルギーの制作者たちで、既にハードスタイルの制作技術を持っていた者が、当時新鮮だったダブステップの拍節を取り入れる形で進んだ。技術的には、ハードスタイルのバスドラムをそのまま流用しつつ配置だけを変えるという、比較的単純な操作から始まっている。ハードスタイルの側から見れば、四つ打ち以外の配置を試す機会であり、聴衆を飽きさせないための変化球としての役割もあった。実際、この様式の曲は音楽祭の演奏の中で緩急をつけるために挟まれることが多く、単独の様式として長時間演奏されることは少なかった。この位置づけが、後の展開を決めることになる。2012年から2013年頃に活動が最も盛んになり、ハードスタイルの主要な催しでも専用の区画が設けられることがあった。しかしその後は独立した様式としての勢いを失った。理由は複数ある。ダブステップ自体がアメリカでの過熱を経て急速に飽和したこと、ハードスタイルの側が旋律と高揚感を重視する方向へ大きく傾いたこと、そしてこの様式が本来、二つの様式の間をつなぐ役割として生まれたため、両者が離れると存在意義そのものが薄れたことである。ただし、ハードスタイルのバスドラムを四つ打ち以外に配置するという発想自体は残り、その後のハードダンス系の様々な派生の中で繰り返し用いられている。二つの様式を接続する試みが、接続すべき対象を失って消えたという経緯は、細分化された電子音楽の様式が辿る典型的な一生を示している。</p>
