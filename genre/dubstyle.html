<h1>Dubstyle（ダブスタイル）とは</h1>
<p>ダブスタイルは、ハードスタイルの骨組みに、ダブステップの拍の刻み方と低音の表現を組み合わせたスタイルだ。 土台となるのは、ハードスタイル特有のバスドラムだ。頭の短い破裂音と、音程を持って下降する長い胴体でできている。決め手は、この</p>
<p>ダブスタイルは、ハードスタイルの骨組みに、ダブステップの拍の刻み方と低音の表現を組み合わせたスタイルだ。

土台となるのは、ハードスタイル特有のバスドラムだ。頭の短い破裂音と、音程を持って下降する長い胴体でできている。決め手は、この打撃音を、ハードスタイル本来の四つ打ちではなく、ダブステップの型に置き直した点にある。

典型の一つは、1小節の1拍目にバスドラムを、3拍目にスネア（またはクラップ＝手拍子の音）を置く、いわゆるハーフタイムの形だ（2-stepやブレイクステップの型もあり、どの型が主流かは見方によって異なる）。テンポは毎分140〜150拍前後とされるが、数字には幅がある。ハーフタイム型では体感の速さがその約半分になる。この二重の時間の感覚は、ダブステップから受け継いだ性質である。

低音には、ハードスタイルの重い打撃と、ダブステップの唸る音の両方が使われる。そこに、うねり（ワブル）やうなり（グロウル）の加工が施される。

上物は曲によって異なる（ダブステップ寄りでは簡素、ハードスタイル寄りではメロディやブレイクダウンを伴う）。金属的に割れた合成音や加工された声が置かれることもある。

曲の構成では、ダブステップ式の部分がハードスタイルのドロップと併用される例が多い。つまりダブスタイルは、ハードスタイルのキックとダブステップのリズムを組み合わせた融合ジャンルである。</p>
<h2>成り立ち</h2><p>2010年前後、二つの流れが同時に勢いを増していた。

一つはハードスタイルだ。正確な起源は特定できないものの、1990年代後半〜2000年代初頭にオランダ・ベルギー・イタリアで登場し、オランダを中心に広がった。大規模な音楽祭が増えるとともに、聴衆を増やしていた。

もう一つは、英国生まれのダブステップだ。2000年代初頭に南ロンドンで生まれ、2010年代初頭（とくに2011年前後）には、アメリカ市場で「ブロステップ」と呼ばれる攻撃的な形が広まっていた。

両者は速さも生まれも違うが、極端に圧縮された低音を主役に据える点では共通していた。そこから、ハードスタイルのキックのスタイルに、ダブステップのリズムとテンポを合わせた融合ジャンルが生まれた。ベースは、リバース・ベース（キックの合間に鳴る、尾の長い裏拍のベース）と、ダブステップ風のワブル（うねり）を組み合わせたものだ。ダブスタイルは2010年初頭に登場したとされる。代表例の一つは、同年3月に発売された、ともにオランダ出身のHeadhunterz &amp; Brennan Heartのミックスである。

変化をつける試みを評価する声は多かったが、この音は不快だと批判する声も多かった。ただ、この新しいスタイルは単独ジャンルとしての独自性が定着しにくく、アクセントのように使われた。そしてダブスタイルは、ダブステップの流行の下降とほぼ並行して衰えた。</p>
