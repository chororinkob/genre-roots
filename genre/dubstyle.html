<h1>Dubstyle（ダブスタイル）とは</h1>
<p>ハードスタイルの骨格に、ダブステップの拍節と低音の表現を組み合わせた様式である。土台となるのはハードスタイル特有のバスドラムで、頭の短い破裂音と、音程を持って下降する長い胴体で構成される。この打撃音を、ハードスタイル本来の四つ打ち</p>
<p>ハードスタイルの骨格に、ダブステップの拍節と低音の表現を組み合わせた様式である。土台となるのはハードスタイル特有のバスドラムで、頭の短い破裂音と、音程を持って下降する長い胴体で構成される。この打撃音を、ハードスタイル本来の四つ打ちではなく、ダブステップの型に配置し直した点が決定的である。すなわち、1小節の1拍目にバスドラムを、3拍目にスネア（またはクラップ＝手拍子の音）を置く、いわゆるハーフタイムの構造を取るものが典型の一つである（2-stepやブレイクステップの型もある）。テンポの表記は一分間に140〜150拍前後で、ハーフタイム型では体感される速度がその約半分になる。この二重の時間感覚がダブステップから受け継いだ性質である。低音はハードスタイルの重い打撃と、ダブステップの唸る音の両方が用いられ、音程を急激に上下させる加工が施される。上物は最小限で、金属的に割れた合成音や加工された声が置かれる程度である。曲の構成は緊張と解放の落差を強調し、静かに溜めてから一気に低音が炸裂する形が中心となる。二つの様式のいずれの聴衆にとっても馴染みのある要素を持ちながら、どちらとも異なる音像を作る点が、この様式の存在理由になっている。</p>
<h2>成り立ち</h2><p>2010年前後、二つの流れが同時に勢いを増していた。一方は1990年代後半にオランダ・ベルギー・イタリアで登場し、オランダを中心とするハードスタイルで、大規模な音楽祭の拡大とともに聴衆を増やしていた。もう一方は2000年代初頭に南ロンドンで生まれた英国発のダブステップで、2010年から2012年にかけて、アメリカ市場で「ブロステップ」と呼ばれる攻撃的な形が広まっていた。両者は速度も出自も異なるが、極端に圧縮された低音を主役に据えるという点で共通していた。その結果、ハードスタイルのキックの様式に、ダブステップのリズムとテンポ、リバース・ワブル（低音を波のようにうねらせる手法）系のベースを組み合わせた融合ジャンルが生まれた。ハードスタイルの側から見れば、四つ打ち以外の配置を試す機会であり、聴衆を飽きさせないための変化球としての役割もあった。実際、この様式の曲は音楽祭の演奏の中で緩急をつけるために挟まれることが多く、単独の様式として長時間演奏されることは少なかった。この位置づけが、後の展開を決めることになる。ダブスタイルは2010年初頭に登場したとされ、代表例として、同年3月に発売された、ともにオランダ出身のHeadhunterz &amp; Brennan Heartのミックスがある。</p>
