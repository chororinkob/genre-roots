<h1>Blues Rock（ブルースロック）とは</h1>
<p>ブルースの形式と語法を、ロックの音量と編成で演奏する様式。土台となるのは12小節形式のブルース進行、すなわち主和音、下属和音、属和音の三つを定型の順序で配置する構造である。ただしロックの文脈では、この形式を守らない曲も多く、より重</p>
<p>ブルースの形式と語法を、ロックの音量と編成で演奏する様式。土台となるのは12小節形式のブルース進行、すなわち主和音、下属和音、属和音の三つを定型の順序で配置する構造である。ただしロックの文脈では、この形式を守らない曲も多く、より重要なのは音階と奏法の側にある。旋律と即興にはブルース・スケール、すなわち短調のペンタトニックに減五度を加えた音階が用いられ、この減五度がブルーノートと呼ばれる独特の陰りを生む。奏法の核はチョーキングで、弦を指で押し上げて音程を持ち上げ、平均律にない中間的な音程を作る。加えてビブラート、スライド、そしてボトルネックと呼ばれるガラスや金属の筒を指にはめて弦を滑らせる奏法が用いられる。音色は真空管アンプを音量で歪ませたもので、増幅による飽和がそのまま表現となる。BPMは中庸で、8分音符を跳ねさせるシャッフルと、均等に刻むストレートの両方が用いられる。編成はギター、ベース、ドラムに、時にオルガンとハーモニカが加わる。ギター・ソロが曲の中心で、しばしば数分に及ぶ即興が展開される。</p>
<h2>成り立ち</h2><p>1960年代前半のイギリスで始まった。当時の若者たちは、米国から輸入された数少ないブルースのレコード、とりわけシカゴのChess Recordsが発売したMuddy Waters、Howlin' Wolf、Willie Dixonの作品を、教科書のように研究した。決定的な役割を果たしたのがAlexis Kornerで、彼が1962年にCyril Daviesと結成したBlues Incorporatedは、ロンドンにおけるブルース演奏の拠点となり、Mick Jagger、Charlie Watts、Jack Bruce、Ginger Bakerらがここを通過した。もう一つの重要な学校がJohn MayallのBluesbreakersで、Eric Clapton、Peter Green、Mick Taylorという三人の傑出したギタリストが順に在籍した。1966年、Eric Claptonが参加したBluesbreakers with Eric Claptonは、Gibson Les PaulとMarshallのアンプを大音量で歪ませた音を記録し、以後のロック・ギターの基準を作った。彼はその後Creamを結成し、即興を長時間展開する三人編成という形式を確立した。The Rolling Stonesは同じ源から出発しながら歌の形式へ向かい、The Yardbirdsからは Clapton、Jeff Beck、Jimmy Pageという三人が輩出された。米国側では、Paul Butterfield Blues BandとMike Bloomfieldがシカゴでこの動きに呼応し、Johnny WinterとThe Allman Brothers Bandが南部で独自の系統を作った。皮肉なのは、この音楽の源である黒人のブルース演奏家の多くが、当時は正当な報酬も名声も得ていなかったことである。イギリスの若者が彼らの曲を演奏して巨額の富を得る一方、原作者への支払いを巡る訴訟が後年まで続いた。Led ZeppelinがWillie Dixonらの作品の著作権表示を怠り、後に訴訟で和解した件はその代表例である。</p>
<h2>代表曲</h2><ul><li>Crossroads (Cream)</li><li>Statesboro Blues (The Allman Brothers Band)</li><li>Texas Flood (Stevie Ray Vaughan)</li><li>Still Got the Blues (Gary Moore)</li><li>Sloe Gin (Joe Bonamassa)</li></ul>
