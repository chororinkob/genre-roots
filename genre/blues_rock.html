<h1>Blues Rock（ブルースロック）とは</h1>
<p>ブルースロックは、ブルースの形式と手法を、ロックの音量と編成で演奏する音楽だ。 土台になるのは、12小節形式のブルース進行だ。主和音、下属和音、属和音の三つを、決まった順序で並べる構造である。ただしロックの世界では、この形式を守ら</p>
<p>ブルースロックは、ブルースの形式と手法を、ロックの音量と編成で演奏する音楽だ。

土台になるのは、12小節形式のブルース進行だ。主和音、下属和音、属和音の三つを、決まった順序で並べる構造である。ただしロックの世界では、この形式を守らない曲も多い。より重要なのは、音階と奏法の側にある。

旋律と即興には、ブルース・スケールが用いられる。一般的には、短調のペンタトニック（5音音階）に減5度を加えた、6音の音階だ。この減5度（や短3度、短7度）が、ブルーノートと呼ばれる独特の陰りを生む。

奏法で中心になるのは、チョーキングだ。弦を指で押し上げて音程を持ち上げ、平均律（ピアノなどの標準的な音程の区切り）にない中間的な音程を作る。加えて、ビブラートやスライドが使われる。ボトルネックと呼ばれる、ガラスや金属の筒を指にはめて弦を滑らせる奏法もある。

音色は、真空管アンプを音量で歪ませたものだ。増幅による潰れた歪みが、そのまま表現となる。

BPMは中庸だ。8分音符を跳ねさせるシャッフル（跳ねるリズム）と、均等に刻むストレートの両方が用いられる。編成はギター、ベース、ドラムで、時にオルガンとハーモニカが加わる。

ギター・ソロが曲の中心になる。しばしば数分に及ぶ即興が展開される。</p>
<h2>成り立ち</h2><p>1960年代前半から半ばにかけて、米国と英国で、ブルースロックは始まった。

当時の若者たちは、米国から輸入された数少ないブルースのレコードを、教科書のように研究した。とりわけ、シカゴのChess Recordsが発売したMuddy Waters、Howlin' Wolf、Willie Dixonの作品だ。

決定的な役割を果たしたのが、Alexis Kornerだった。彼は1961年にCyril Daviesと、Blues Incorporatedを結成した。1962年には、Ealing Clubで定期的なR&amp;Bナイトを始めた。このバンドはロンドンにおけるブルース演奏の拠点となり、Charlie Watts、Jack Bruce、Ginger Bakerらが在籍した。Mick Jaggerは飛び入りで参加した。

もう一つの重要な学校が、John MayallのBluesbreakersだ。Eric Clapton、Peter Green、Mick Taylorという3人の傑出したギタリストが、順に在籍した。1966年に、Eric Claptonが参加したBlues Breakers with Eric Claptonは、Gibson Les PaulとMarshallのアンプを大音量で歪ませた音を記録した。この作品は、ロック・ギターの発展に影響を与えたと評価されている。

彼はその後、Ginger BakerとJack BruceとCreamを結成した。即興を長時間展開するブルースロックの、典型的なパワートリオ（ギター・ベース・ドラムの3人編成）となった。The Rolling Stonesは、同じ源から出発しながら、歌の形式へ向かった。The Yardbirdsからは、Clapton、Jeff Beck、Jimmy Pageという3人が輩出された。

米国側では、Paul Butterfield Blues BandとMike Bloomfieldがシカゴで、米国で最も早い担い手の一つとなった。Johnny WinterとThe Allman Brothers Bandは、南部で独自の系統を作った。

しかし、皮肉なことがあった。この音楽の源である黒人のブルース演奏家の多くが、当時は正当な報酬も名声も得ていなかったのだ。イギリスの若者が彼らの曲を演奏して巨額の富を得る一方、原作者への支払いを巡る訴訟が後年まで続いた。Led ZeppelinがWillie Dixonらの作品の著作権表示を怠り、後に1987年に法廷外で和解した件は、その代表例である。</p>
<h2>代表曲</h2><ul><li>Bad to the Bone (George Thorogood &amp; The Destroyers)</li><li>Blue on Black (Kenny Wayne Shepherd Band)</li><li>Texas Flood (Stevie Ray Vaughan)</li><li>All Right Now (Free)</li><li>Mississippi Queen (Mountain)</li><li>Crossroads (Cream)</li><li>Still Got the Blues (Gary Moore)</li><li>Sloe Gin (Joe Bonamassa)</li><li>Statesboro Blues (The Allman Brothers Band)</li><li>Blues Deluxe (Joe Bonamassa)</li><li>Oh Well (Fleetwood Mac)</li><li>Highway 61 Revisited (Johnny Winter)</li><li>I Just Want to Make Love to You (Foghat)</li><li>Politician (Cream)</li><li>I'm Going Home (Ten Years After)</li><li>White Room (Cream)</li><li>Sunshine of Your Love (Cream)</li></ul>
