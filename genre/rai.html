<h1>Raï（ライ）とは</h1>
<p>アルジェリア西部の港湾都市オランを中心に発達した、率直な言葉で欲望と苦悩を歌う大衆音楽である。名称の語義は「意見・助言」で、歌の合間に挟まれた掛け声に由来する。旋律は装飾的な節回し（一音を装飾で覆う歌い回し）が特徴で、西洋の音階に</p>
<p>アルジェリア西部の港湾都市オランを中心に発達した、率直な言葉で欲望と苦悩を歌う大衆音楽である。名称の語義は「意見・助言」で、歌の合間に挟まれた掛け声に由来する。旋律は装飾的な節回し（一音を装飾で覆う歌い回し）が特徴で、西洋の音階に慣れた耳には独特の哀感として響く。歌唱は歌手により異なり、Cheb Mamiのように高い声域で知られる歌手もいるが、感情を隠さない。リズムは、初期はゲラルなどの壺型太鼓が伴奏し、1970〜80年代のポップ・ライでドラムマシンやシンセサイザーが加わった。近代化された形態では、シンセサイザー、ドラムマシン、トランペット、アコーディオンなどが導入された。テンポは中庸から速く、踊るために作られている。歌詞こそが本質で、酒、失恋、性愛、貧困、移民として生きる孤独、そして宗教的規範への疑問といった、保守的な社会において語ることが憚られる主題が扱われる。独立後に国営放送から排除されるなど、長く権威と緊張関係にあった。1980年代半ば以降は国家が公認・活用する局面もあった。</p>
<h2>成り立ち</h2><p>源流は、1920年代にオラン周辺で生まれたとされる（20世紀の変わり目とする資料もある）。当時この地域には、遊牧民の伝統的な歌謡詩があり、女性だけの聴衆の前で歌うmeddahatとは別に、男女双方に歌うcheikhaと呼ばれる女性歌手たちがライの母体となった。彼女たちは社会の周縁に置かれた存在であったがゆえに、性愛や飲酒を含む規範を逸脱した主題を歌った。その流れに位置づけられるのがCheikha Rimitti（1940年代に台頭）で、1954年に発表した「Charrak Gattà」は若い女性に処女を捨てるよう促し、イスラム正統派を憤慨させ、ナショナリストや独立後の政府から、植民地主義に歪められた民謡だと批判された。彼女は独立後に国営の放送から締め出されたが、晩年には国際的に高く評価され、2006年に死去している。1962年のアルジェリア独立後、国家は古典アラビア語・アラブ=ムスリム文化を推進し、ライを国営の放送から締め出した。ライは私的な場とカセットの闇市に追いやられた。しかし1970年代末から1980年代にかけて、カセットテープという安価な媒体が普及すると状況が変わる。国営の放送やレコード産業を通さず、市場の露店で無数のカセットが売られるようになり、若い歌手たちが電子楽器を用いた新しい形を作り上げた。彼らは若者を意味する称号を名に冠し、Cheb KhaledやCheb Mamiが代表的存在となる。1986年1月にはボビニーでフランス初のライ祭が開かれ、客席の中心は移民の人々だった。のちに第二世代の若者もライに共感するようになった。しかし1990年代、アルジェリアは苛烈な内戦に陥る。イスラーム主義武装勢力は、この音楽を退廃の象徴として敵視し、実際に暴力が振るわれた。1994年、若者に絶大な人気を誇った歌手Cheb Hasniがオランで、武装勢力による標的殺人と同様の状況（犯人は不明）で殺害され、翌1995年には制作者のRachid Baba Ahmedも殺害された。多くの音楽家が国外へ逃れ、活動の中心はフランスへ移る。Khaled（1992年のアルバムから「Cheb」を外した。旧称Cheb Khaled）は、Don Was（米）とMichael Brook（加）が制作したアルバム『Khaled』（1992年）で国際的な成功を収め、ライの国際的な知名度をさらに押し上げた。フランスではRachid Tahaが、ロックとパンクの感覚を持ち込みながら移民の立場を鮮明にした作品を残し、2018年に死去している。現在も、この音楽は自由な表現と社会の規範との衝突を体現し続けている。</p>
