<h1>Raï（ライ）とは</h1>
<p>アルジェリア西部の港湾都市オランを中心に発達した、率直な言葉で欲望と苦悩を歌う大衆音楽である。名称は現地の言葉で意見や見解を意味し、歌い手が自分の考えを述べるという姿勢がそのまま名になっている。旋律は北アフリカとアラブ世界の旋法体</p>
<p>アルジェリア西部の港湾都市オランを中心に発達した、率直な言葉で欲望と苦悩を歌う大衆音楽である。名称は現地の言葉で意見や見解を意味し、歌い手が自分の考えを述べるという姿勢がそのまま名になっている。旋律は北アフリカとアラブ世界の旋法体系に基づき、半音より細かい音程の揺れや、一音を装飾で覆う歌い回しが用いられるため、西洋の音階に慣れた耳には独特の哀感として響く。歌唱は喉を絞って高い音域を張り上げる形が主流で、感情を隠さない。リズムは打楽器のゲラルと手拍子による跳ねた刻みが原型で、後にドラムマシンで再現されるようになった。近代化された形態では、シンセサイザーが弦楽合奏の代わりに厚い和音を敷き、アコーディオンやトランペットが旋律を重ね、電子的な低音が加わる。テンポは中庸から速く、踊るために作られている。歌詞こそが本質で、酒、失恋、性愛、貧困、移民として生きる孤独、そして宗教的規範への疑問といった、保守的な社会において語ることが憚られる主題が扱われる。この率直さゆえに、この音楽は常に権威との緊張を抱えてきた。</p>
<h2>成り立ち</h2><p>源流は20世紀初頭のオラン周辺にある。当時この地域には、遊牧民の伝統的な歌謡詩と、結婚式などで女性の聴衆に向けて歌う女性歌手たちの一群が存在した。彼女たちは社会の周縁に置かれながら、性愛や飲酒を含む生の感情を歌うことを許されていた。その代表がCheikha Rimittiで、1954年に発表した楽曲は処女性を主題としており、フランス植民地当局と現地の保守層の双方から非難された。彼女は生涯にわたり抑圧を受けながら歌い続け、2006年に死去している。1962年のアルジェリア独立後、国家は社会主義的な文化政策を掲げ、この種の音楽を退廃的なものとして排除した。しかし1970年代末から1980年代にかけて、カセットテープという安価な媒体が普及すると状況が変わる。国営の放送やレコード産業を通さず、市場の露店で無数のカセットが売られるようになり、若い歌手たちが電子楽器を用いた新しい形を作り上げた。彼らは若者を意味する称号を名に冠し、Cheb KhaledやCheb Mamiが代表的存在となる。1986年にはフランスで初めて大規模な祭典が開かれ、旧宗主国に暮らす北アフリカ系の若者たちがこの音楽を自らの文化として受け入れた。しかし1990年代、アルジェリアは苛烈な内戦に陥る。イスラーム主義武装勢力は、この音楽を退廃の象徴として敵視し、実際に暴力が振るわれた。1994年、若者に絶大な人気を誇った歌手Cheb Hasniがオランで射殺され、翌1995年には制作者のRachid Baba Ahmedも殺害された。多くの音楽家が国外へ逃れ、活動の中心はフランスへ移る。Cheb Khaledは1992年にアメリカの制作者を迎えた作品で国際的な大成功を収め、この音楽を世界へ知らしめた。フランスではRachid Tahaが、ロックとパンクの感覚を持ち込みながら移民の立場を鮮明にした作品を残し、2018年に死去している。現在も、この音楽は自由な表現と社会の規範との衝突を体現し続けており、その歴史は歌手たちの血で書かれてきたと言っても過言ではない。</p>
