<h1>Raï（ライ）とは</h1>
<p>ライは、アルジェリア西部の港湾都市オランを中心に発達した、率直な言葉で欲望と苦悩を歌う大衆音楽である。名称の語義は「意見・助言」で、歌の合間に挟まれた掛け声に由来する。 旋律は、北アフリカとアラブ世界の旋法（音階の型）に基づく。一</p>
<p>ライは、アルジェリア西部の港湾都市オランを中心に発達した、率直な言葉で欲望と苦悩を歌う大衆音楽である。名称の語義は「意見・助言」で、歌の合間に挟まれた掛け声に由来する。

旋律は、北アフリカとアラブ世界の旋法（音階の型）に基づく。一音を装飾で覆う歌い回しが用いられる。そのため、西洋の音階に慣れた耳には、独特の哀感として響く。

歌唱は歌手により異なる。Cheb Mamiのように高い声域で知られる歌手もいて、感情を隠さない。

伴奏は、初期はguellalなどの壺型太鼓が担った。1970〜80年代のポップ・ライでドラムマシンやシンセサイザーが加わった。近代化された形態では、シンセサイザー、ドラムマシン、トランペット、アコーディオンなどが導入された。テンポは中庸から速く、踊るために作られている。

歌詞こそが本質だ。酒、失恋、性愛、貧困、移民として生きる孤独、そして宗教的規範への疑問といった、保守的な社会において語ることが憚られる主題が扱われる。

独立後に国営放送から排除されるなど、この音楽は長く権威と緊張関係にあった。1980年代半ば以降は、国家が公認・活用する局面もあった。</p>
<h2>成り立ち</h2><p>ライは、1920年代にオランで生まれたとされる。

当時この地域には、遊牧民の伝統的な歌謡詩があった。女性だけの聴衆の前で歌うmeddahatとは別に、男女双方に歌うcheikhaたちがいて、彼女たちがライの母体となった。彼女たちは周縁に置かれた存在であったがゆえに、規範を逸脱した主題を歌った。

その流れにCheikha Rimitti(1940年代に注目を集めた)が位置づけられる。彼女が1954年に発表した「Charrak Gattà」は、若い女性に処女を捨てるよう促した。イスラム正統派は憤慨し、ナショナリスト、あるいは独立後の政府からは、「植民地主義に歪められた民謡」と批判された。独立後は国営の放送から締め出されたが、晩年には国際的に高く評価され、2006年に死去している。

1962年のアルジェリア独立後、国家は古典アラビア語・アラブ=ムスリム文化を推進し、ライを国営の放送から締め出した。ライは私的な場とカセットの闇市に追いやられた。

しかし、1970年代末から1980年代にかけて、カセットテープという安価な媒体が普及すると状況が変わる。国営の放送やレコード産業を通さず、市場の露店で無数のカセットが売られるようになった。若い歌手たちが、電子楽器を用いた新しい形を作り上げた。彼らは若者を意味する称号を名に冠し、Cheb KhaledやCheb Mamiが代表的存在となる。

1986年には、ボビニーの祭典がフランス初のライ祭として開かれた。客席の中心は移民の人々だった。のちに第二世代の若者もライに共感するようになった。

だが、1990年代、アルジェリアは苛烈な内戦に陥る。イスラーム主義武装勢力は、この音楽を退廃の代名詞として敵視し、実際に暴力が振るわれた。1994年、若者に絶大な人気を誇った歌手Cheb Hasniが、オランで殺害された。武装勢力による標的殺人と同様の状況で、犯人は不明である。翌1995年には、制作者のRachid Baba Ahmedも殺害された。多くの音楽家が国外へ逃れ、活動の中心はフランスへ移る。

Khaled（当時Chebを外す。旧称Cheb Khaled）は、Don Was(米)とMichael Brook(加)が制作したアルバム『Khaled』(1992)で、国際的な大成功を収めた。ライの国際的な知名度をさらに押し上げた。フランスではRachid Tahaが、ロックとパンクの感覚を持ち込みながら、移民の立場を鮮明にした作品を残し、2018年に死去している。

現在も、この音楽は自由な表現と社会の規範との衝突を、そのまま映し続けている。内戦下では歌手や制作者が標的となり、Cheb HasniやRachid Baba Ahmedが殺害された。</p>
