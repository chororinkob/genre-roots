<h1>Detroit Techno（デトロイトテクノ）とは</h1>
<p>デトロイト・テクノは、テクノの原点であり、機械の音でありながら深い感情を宿すことを特徴とする音楽だ。ハウスと骨格を共有する。ヨーロッパのシンセポップと、ファンク／ソウル／ハウスなど黒人音楽の融合であり、未来志向を纏う。基本はドラム</p>
<p>デトロイト・テクノは、テクノの原点であり、機械の音でありながら深い感情を宿すことを特徴とする音楽だ。ハウスと骨格を共有する。ヨーロッパのシンセポップと、ファンク／ソウル／ハウスなど黒人音楽の融合であり、未来志向を纏う。基本はドラムマシンとシーケンサーによる反復を軸にしたダンス音楽である。

シンセの音色では、ストリングス風のパッド、そしてYamaha DX100の金属的なベースがしばしば用いられた。ベースはシンセの単音で、メロディーのように歌う場合と、地面として沈む場合の両方がある。反復的なシーケンスは多いが、アルペジオ中心とは限らない。

和音では、一部の作品や制作者（Carl Craigなど）にジャズの影響があり、和声が洗練されたものもある。その和声が機械的なリズムの上に浮かぶことで、独特の憂鬱とあこがれが生まれる。

リズムは、四つ打ちのバスドラムが土台だ。そこにRoland TR-909の乾いたクラップとハイハットを重ねる。テンポは、初期は120〜130BPM前後で、後に速くなる。

ヴォーカルは少ない。入る場合も、加工した語りや短いフレーズで、機械の声として示される。

歌詞や曲名には、SF、未来都市、宇宙、機械と人間の関係といったテーマが繰り返し現れる。これらは、荒廃した工業都市デトロイトの現実と裏表の関係にある。

曲の構成はDJ用に長く、音の要素を抜いたり足したりして展開を作る。</p>
<h2>成り立ち</h2><p>始まりは、1970年代後半〜1980年ごろのデトロイト郊外、ベルヴィルという町だ。この町の高校で知り合った3人の黒人少年から、この音楽は生まれた。Juan Atkins、Derrick May、Kevin Saundersonで、後にベルヴィル・スリーと呼ばれる。

彼らは学校で友人になり、Mojoの番組から共通の刺激を受けた。DJのCharles Johnson(通称The Electrifying Mojo)は、深夜番組でKraftwerk、Parliament、Prince、The B-52'sを分け隔てなくかけ続けていた。この番組が、ジャンルも人種も無視して音楽を聴くという態度を彼らに植えつけたとも言われる。

Juan Atkinsは、アナーバーのコミュニティ・カレッジ（Washtenaw Community College）の音楽理論の授業でRichard Davisと出会った。1980年にCybotronを結成し、1981年に「Alleys of Your Mind」、1983年に「Clear」を発表した。この時点では、エレクトロに近い音だった。

Atkinsは、Alvin Tofflerの著書「第三の波」の原則を適用したのかという問いに、「着想の源にすぎなかった」と答えた。同じ回答で、cybotronやmetroplexという合成語はTofflerに倣ったとも述べている。Cybotronの当時、すでに電子音楽家の半数ほどが、自分の音楽を「techno」と呼んでいたと思う、とも語っている。ジャンル名の由来には諸説ある。Atkinsの曲「Techno Music」の題が「第三の波」に着想を得たという説明が、広く見られる。

Atkinsは1985年にModel 500名義で「No UFO's」を発表した。これも、現在のテクノの原型の一つとされる。一方で、Cybotronの「Alleys of Your Mind」(1981年)や、A Number of Namesの「Sharevari」(1981年頃)も、最初のデトロイト・テクノ作品の一つに挙げられる。

Derrick Mayは、Rhythim Is Rhythim名義で、1987年（1988年とする説もある）に「Strings of Life」を発表した。ピアノの原型はMichael Jamesの演奏で、Mayとの共作である。ピアノの断片と弦楽器の和音が四つ打ちの上で舞う構成で、テクノにも感情を表現できる可能性があることを示した、決定的な作品になった。May自身は、この音楽を「George ClintonとKraftwerkがエレベーターに閉じ込められた状態」と表現している。

Kevin Saundersonは、1988年にInner Cityとして「Big Fun」「Good Life」をヒットさせ、歌もの寄りの成功例を作った。

その背景には、デトロイトという都市の状況がある。人口は1950年の国勢調査で185万人とピークを迎えた。その後、1950年代から衰退の兆しが現れ、人口が流出した。1967年の暴動以降は白人の郊外流出が加速し、市街地は荒れ果てた。工場の閉鎖で失業が広がる中、機械の音で未来を想像することは、目の前の廃墟から抜け出したいという願いと直結していた。

1988年、イギリスのレーベルVirgin傘下の10 Recordsが、編集盤「Techno! The New Dance Sound of Detroit」を発表した。これが、この語が欧州で広まるきっかけになった。皮肉なことに、ヨーロッパでこそ評価された。Atkinsは1994年に、米国のレコード業界では正当に評価されていないと不満を述べている。

その後、第二世代としてUnderground Resistance(Jeff MillsとMike Banksが1989年に結成)が現れた。彼らは顔を隠し、大手企業との取引を拒否し、音楽を政治的な抵抗として位置づけた。Carl Craig、Robert Hood、Stacey Pullen、Drexciya(架空の海底文明の神話を作り、奴隷船から投げ落とされたアフリカ人妊婦の、生まれなかった子どもたちが海底に築いた国という設定を掲げた)が続いた。

2000年には、Detroit Electronic Music Festival（DEMF）として電子音楽の音楽祭が始まった。2003年にDerrick Mayが制作して「Movement」と改称し、2006年からはデトロイトの民間会社Paxahauが運営している。</p>
