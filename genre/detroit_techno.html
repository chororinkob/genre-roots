<h1>Detroit Techno（デトロイトテクノ）とは</h1>
<p>テクノの原点であり、機械の音でありながら深い感情を宿すことを特徴とする音楽。四つ打ちのバスドラムを土台に、Roland TR-909の乾いたクラップとハイハットを重ね、テンポは120〜135BPM。ハウスと骨格を共有するが、ソウル</p>
<p>テクノの原点であり、機械の音でありながら深い感情を宿すことを特徴とする音楽。四つ打ちのバスドラムを土台に、Roland TR-909の乾いたクラップとハイハットを重ね、テンポは120〜135BPM。ハウスと骨格を共有するが、ソウルの歌の温度ではなく、ヨーロッパの電子音楽から受け継いだ無機質さと未来志向を纏う点で分かれる。いちばんの特徴は和音にあり、単純なくり返しではなくジャズやフュージョンから借りた複雑な和音、とりわけマイナーセブンスや9th、11thを含む響きが用いられ、それが機械的なリズムの上に浮かぶことで独特の憂鬱とあこがれが生じる。シンセの音色はストリングス風のパッド、そしてYamaha DX100の金属的なベースが定番になっている。シーケンスは16分音符のアルペジオが延々と回り、そこにわずかな音程変化が加えられる。ベースはシンセの単音で、メロディーのように歌う場合と、地面として沈む場合の両方がある。構成はDJ用に長く、要素の抜き差しで展開を作る。ヴォーカルはほとんど入らず、入る場合も加工した語りや短いフレーズで、機械の声として提示される。歌詞や曲名にはSF、未来都市、宇宙、機械と人間の関係といった主題が繰り返し現れ、これらは荒廃した工業都市デトロイトの現実と表裏をなしている。</p>
<h2>成り立ち</h2><p>1980年代前半、デトロイト郊外のベルヴィルという町の高校に通っていた3人の黒人少年から始まった。Juan Atkins、Derrick May、Kevin Saundersonで、後にベルヴィル・スリーと呼ばれる。彼らを繋いだのはラジオで、DJのCharles Johnson(通称The Electrifying Mojo)が深夜番組でKraftwerk、Parliament、Prince、The B-52'sを分け隔てなくかけ続けていた。この番組が、ジャンルも人種も無視して音楽を聴くという態度を彼らに植えつけた。Juan Atkinsはアナーバーのコミュニティ・カレッジ（Washtenaw Community College）の音楽理論の授業でRichard Davisと出会い、1980年にCybotronを結成、1981年の「Alleys of Your Mind」、1983年の「Clear」を発表した。この時点ではエレクトロに近い音だったが、Atkinsは、Alvin Tofflerの著書「第三の波」を「着想の源にすぎなかった」と語り、Cybotronの当時すでに電子音楽家の半数ほどが自分の音楽を「techno」と称していたという。ジャンル名の由来には諸説あり、Atkinsの曲「Techno Music」の題が「第三の波」に着想を得たという説明が広く見られる。Atkinsは1985年にModel 500名義で「No UFO's」を発表し、これも現在のテクノの原型の一つとされる。一方で、Cybotronの「Alleys of Your Mind」(1981年)や、A Number of Namesの「Sharevari」(1981年頃)も、最初のデトロイト・テクノ作品の一つに挙げられる。Derrick MayはRhythim Is Rhythim名義で1987年に「Strings of Life」を発表した。ピアノの断片と弦楽器の和音が四つ打ちの上で舞う構成で、テクノに感情表現の可能性があることを示した決定的な作品になった。May自身はこの音楽を「George ClintonとKraftwerkがエレベーターに閉じ込められた状態」と表現している。Kevin Saundersonは1988年にInner Cityとして「Big Fun」「Good Life」をヒットさせ、歌もの寄りの成功例を作った。背景にはデトロイトという都市の状況がある。1950年の国勢調査で185万人とピークを迎えたあと、1950年代から衰退の兆しが現れて人口が流出し、1967年の暴動以降は白人の郊外流出が加速して市街地は荒れ果てた。工場の閉鎖で失業が蔓延する中、機械の音で未来を想像することは、目の前の廃墟からの脱出願望と直結していた。1988年にイギリスのレーベルVirginが編集盤「Techno! The New Dance Sound of Detroit」を発表し、この語が国際的に定着する。皮肉なことに、アメリカ本国では長く無視され、ヨーロッパでこそ評価された。第二世代としてUnderground Resistance(Jeff MillsとMike Banksが1989年に結成)が現れ、彼らは顔を隠し、大手企業との取引を拒否し、音楽を政治的抵抗として位置づけた。Carl Craig、Robert Hood、Stacey Pullen、Drexciya(架空の海底文明の神話を作り、奴隷船から投げ落とされたアフリカ人妊婦の、生まれなかった子どもたちが海底に築いた国という設定を掲げた)が続いた。2000年にDetroit Electronic Music Festival（DEMF）として始まり、2003年にDerrick Mayが制作して「Movement」と改称した電子音楽の音楽祭が開かれ、2006年からはデトロイトの民間会社Paxahauが運営している。</p>
<h2>代表曲</h2><ul><li>Good Life (Inner City)</li><li>No UFOs (Juan Atkins)</li><li>Clear (Cybotron)</li><li>Blackwater (Octave One)</li><li>Nude Photo (Rhythim Is Rhythim)</li><li>Strings of Life (Rhythim Is Rhythim)</li><li>Eniac (Octave One)</li><li>Heavenly (E-Dancer)</li><li>Landcruising (Carl Craig)</li><li>Inspiration (Underground Resistance)</li><li>I Believe (Octave One)</li></ul>
