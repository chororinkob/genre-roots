<h1>Hard Techno（ハードテクノ）とは</h1>
<p>ハードテクノは、テクノの骨組みを保ちながら、速さと音の迫力を限界まで押し上げた系統だ。テンポは140〜160BPMが中心になる。 見分けるいちばんのポイントは、キックの作り込みにある。ただのバスドラムではない。ディストーションとサ</p>
<p>ハードテクノは、テクノの骨組みを保ちながら、速さと音の迫力を限界まで押し上げた系統だ。テンポは140〜160BPMが中心になる。

見分けるいちばんのポイントは、キックの作り込みにある。ただのバスドラムではない。ディストーションとサチュレーションを何段も重ね、中くらいの高さまで倍音を響かせた、殴りつけるような音になる。このキックが曲の主役で、ほかの音はその隙間に押し込まれる。余韻の長いランブルキックが特徴とされるが、短く締めたキックの流れもある。

上に重ねる音は極端に少ない。中心は、警報のようなシンセの持続音、金属的なパーカッション、そして逆再生した残響だ。古典的なシュランツ寄りの作品では、メロディーはほぼない。一方、現在の流れでは、トランス的なリフやリードが戻っている。

リズムはほぼ純粋な四つ打ちだ。そこに、オフビートに置いた歪んだハイハットや、裏拍のリムショットで、前へ押す圧力を加えるとされる。

ヴォーカルは少ない。使われても、加工された叫びや短いフレーズ、サンプルが中心だ。

曲の組み立てでは、ブレイクで全ての打楽器を抜き、ノイズのライザーとリヴァーブだけを残して、緊張を極端に高める。そこからキックを戻す落差が、最大の山場になる。

シュランツやインダストリアル・テクノとは重なる部分が大きい。ハードコアと比べると、まだ拍がはっきりしていて、キックの音色がバスドラムとして聞き取れる範囲に留まる点で、一般に区別されるとされる。</p>
<h2>成り立ち</h2><p>1990年代に、フランクフルトのシュランツやオランダのガバなど、複数の流れが交わる中で素地ができた。現在の形は2018〜2022年頃に固まったとされ、諸説ある。

硬い音のテクノの源流は、フランクフルトにたどられるとも言われる。ベルリンは壁の崩壊後に中心地となった。1991年3月、Tresorが旧デパートの金庫室で開店し、デトロイトの制作者とドイツの制作者を結びつけた。その中でJeff Millsは、3台のデッキとTR-909を使い、1時間に最大70枚のレコードを使う高速なDJスタイルで知られた。

同じころフランクフルトでは、Sven Väthとクラブ Omen、そしてレーベルHarthouseとEye Qが、ハードトランスやトランスを中心とする音を押し進めた。最初のハードコア・テクノとされる曲は、フランクフルトのMarc Trauner（Marc Acardipane）がMescalinum United名義で1990年に出した「We Have Arrived」とされる。ハードコアは、オランダ・ベルギー・ドイツで同時多発的に生まれたと説明される。ロッテルダムのガバは、これと同時期か、やや後に発展した。

1990年代には、ドイツのフランクフルトを中心に、シュランツと呼ばれるテクノが広まる。反復する歪んだパーカッションのループと機械的な音を軸にした、ハードで単調なテクノだ。この語は1994年頃とされ（1997年とする説もある）、フランクフルトのレコード店BOY RecordsでChris Liebingらが広めた。1999年からは、フランクフルトのクラブU60311で毎週金曜にイベントが開かれ、広く知られるようになった。この流れを担ったのはChris Liebingらで、Liebingは1999年にレーベルCLRを新しく立ち上げ、中心となった。Marco Remusは1994年にDJを始め、2000年にレーベルNerven Recordsを設立した。Frank KvittaとSven Wittekindのリリースは2000年代以降である。

同じ時期、イギリスのSpiral Tribeが先駆けて広めたTekno（フリーテクノ）が、フリーパーティーの運動とともにフランスや東欧へ持ち込まれた。イタリアでもSpiral Tribeらがテクニバルを開いた。

しかし2000年代のベルリンでは、ミニマル・テクノが時代の顔となり（1998年から2008年頃）、ハードテクノは目立たなくなったとされる。ただ、時期には解説により幅があり、シュランツのピークを2000年から2008年、後退を2008年から2018年とする解説もある。

2018年頃から土台が作られ、2021年前後のコロナ後に爆発的に広まった。ベルリンのクラブでテンポが再び上がり始め、Amelie Lens(ベルギー)、Charlotte de Witte(ベルギー)、I Hate Models(フランス)といったテクノ／インダストリアル・テクノの人気アーティストが、国際的な人気を得た。Sara Landryも2018年から作品を出していたが、世界的なブレイクは2023年8月のBoiler Room以降だった。

この復活には、SNSと動画配信の影響が大きい。短い動画で切り取られたキックの落差が、拡散に向いていたことが指摘される。2020年代前半には、テンポが上がった。同時に、かつての地下的な性格が失われ、商業化しすぎたという批判も、古参の側から繰り返し上がっている。</p>
