<h1>Hard Techno（ハードテクノ）とは</h1>
<p>テクノの構造を保ちながら、速度と音圧を極限まで押し上げた系統。テンポは140〜160BPMが中心になる。最大の識別点はキックの処理で、単なるバスドラムではなく、ディストーションとサチュレーションを何段も重ねて中域まで倍音を持たせた</p>
<p>テクノの構造を保ちながら、速度と音圧を極限まで押し上げた系統。テンポは140〜160BPMが中心になる。最大の識別点はキックの処理で、単なるバスドラムではなく、ディストーションとサチュレーションを何段も重ねて中域まで倍音を持たせた、殴りつけるような音になる。このキックが曲の主役となり、他の要素はその隙間に押し込まれる。キックの余韻が次のキックまで届くほど長く設定され、連続した低音の壁として機能することも多い。リズムはほぼ純粋な四つ打ちだが、オフビートに置かれた歪んだハイハットや、裏拍のリムショットで前へ押す圧力を加える。上物は極端に少なく、警報のようなシンセの持続音、金属質のパーカッション、そして逆再生した残響が中心。旋律や和声はほとんど存在せず、あっても単音の反復に留まる。ブレイクでは全ての打楽器を抜き、ノイズのライザーとリヴァーブだけを残して緊張を極端に高め、そこからキックを戻す落差が唯一の展開になる。ヴォーカルは加工された叫びや、命令口調の短い言葉に限られる。シュランツやインダストリアル・テクノと重なる領域が大きく、ハードコアと比べるとまだ拍が明瞭で、キックの音色がバスドラムとして認識できる範囲に留まる点で区別される。</p>
<h2>成り立ち</h2><p>1990年代半ばのドイツとオランダで、テクノの高速化と重量化の流れの中から成立した。硬質なテクノの源流はフランクフルトにたどられるとも言われ、ベルリンは壁崩壊後に中心地となった。Tresorが1991年3月に旧デパートの金庫室で開店し、デトロイトの制作者とドイツの制作者を結びつけた。その中でJeff Millsは、3台のデッキとTR-909を使い、1時間に最大70枚のレコードを使う高速なDJスタイルで知られた。同時期にフランクフルトではSven Väthとクラブ Omen、そしてレーベルHarthouseとEye Qが、ハードトランスやトランスを中心とする音を推進した。最初のハードコア・テクノとされる曲は、フランクフルトのMarc Trauner（Marc Acardipane）がMescalinum United名義で1990年に出した「We Have Arrived」とされ、ハードコアはオランダ・ベルギー・ドイツで同時多発的に成立したと説明される。ロッテルダムのガバは、これと同時期か、やや後に発展した。1990年代に、ドイツのフランクフルトを中心に、シュランツと呼ばれる、極端に硬く工業的なキックを軸にした形式が広まる。この語は1994年にフランクフルトのレコード店BOY RecordsでChris Liebingらが広め、1999年からはフランクフルトのクラブU60311で毎週金曜にイベントが開かれて普及した。Chris Liebingらがこの流れを担い、Liebingは1999年に新たにレーベルCLRを設立して中心となった。Marco Remusは1994年にDJを始め、2000年にレーベルNerven Recordsを設立した。Frank KvittaとSven Wittekindは2000年代以降の世代にあたる。同じ時期、イギリスのSpiral Tribeが先駆けて広めたTekno（フリーテクノ）が、フリーパーティーの運動とともにフランスや東欧へ持ち込まれ、イタリアの倉庫パーティーなども独自に高速化を進めていた。この音楽は身体的な負荷が大きい。2000年代にはベルリンでミニマル・テクノが時代を規定し（1998年から2008年頃）、ハードテクノは目立たなくなったとされるが、時期には解説により幅があり、シュランツのピークを2000年から2008年、後退を2008年から2018年とする解説もある。2018年前後から劇的な復活が起きる。ベルリンのクラブでテンポが再び上昇し始め、Amelie Lens(ベルギー)、Charlotte de Witte(ベルギー)、I Hate Models(フランス)といった新世代が国際的な人気を獲得し、Sara Landryも2018年から作品を出していたが、世界的なブレイクは2023年8月のBoiler Room以降だった。この復活はSNSと動画配信の影響が大きく、短い動画で切り取られたキックの落差が拡散に適していたことが指摘される。2020年代前半にはテンポの上昇が加速した。同時に、かつての地下的な性格が失われ商業化しすぎたという批判も、古参の側から繰り返し提起されている。</p>
