<h1>Hard Techno（ハードテクノ）とは</h1>
<p>テクノの構造を保ちながら、速度と音圧を極限まで押し上げた系統。テンポは140〜160BPMが中心で、近年は170BPMを超えるものも珍しくない。最大の識別点はキックの処理で、単なるバスドラムではなく、ディストーションとサチュレーシ</p>
<p>テクノの構造を保ちながら、速度と音圧を極限まで押し上げた系統。テンポは140〜160BPMが中心で、近年は170BPMを超えるものも珍しくない。最大の識別点はキックの処理で、単なるバスドラムではなく、ディストーションとサチュレーションを何段も重ねて中域まで倍音を持たせた、殴りつけるような音になる。このキックがミックスの半分以上の音量を占め、他の要素はその隙間に押し込まれる。キックの余韻が次のキックまで届くほど長く設定され、連続した低音の壁として機能することも多い。リズムはほぼ純粋な四つ打ちだが、オフビートに置かれた歪んだハイハットや、裏拍のリムショットで前へ押す圧力を加える。上物は極端に少なく、警報のようなシンセの持続音、金属質のパーカッション、そして逆再生した残響が中心。旋律や和声はほとんど存在せず、あっても単音の反復に留まる。ブレイクでは全ての打楽器を抜き、ノイズのライザーとリヴァーブだけを残して緊張を極端に高め、そこからキックを戻す落差が唯一の展開になる。曲は5分から8分。ヴォーカルは加工された叫びや、命令口調の短い言葉に限られる。シュランツやインダストリアル・テクノと重なる領域が大きく、ハードコアと比べるとまだ拍が明瞭で、キックの音色がバスドラムとして認識できる範囲に留まる点で区別される。</p>
<h2>成り立ち</h2><p>1990年代半ばのドイツとオランダで、テクノの高速化と重量化の流れの中から成立した。直接の土壌はベルリンの壁崩壊後のベルリンで、旧東ドイツの発電所や防空壕を占拠した違法クラブが、大音量と長時間営業を前提とした音を求めた。Tresorが1991年に開店し、デトロイトの制作者とドイツの制作者を結びつけたが、その中でJeff Millsのような高速で硬質なDJスタイルが規範となった。Millsは3台のターンテーブルを使い、1曲を数十秒で切り替えていく方法で知られ、これがテクノの速度感覚を根本から変えた。同時期にフランクフルトではSven Vathとクラブ Omen、そしてレーベルHarthouseとEye Qが、より攻撃的な方向を推進した。オランダのロッテルダムではガバが先に極端な速度と歪みへ到達しており、その影響がドイツ側へ逆流した。1990年代後半になると、ドイツのデュッセルドルフやベルリンでシュランツと呼ばれる、極端に硬く工業的なキックを軸にした形式が生まれる。Chris Liebing、Marco Remus、Frank Kvitta、Sven Wittekindらがこの流れを代表し、Liebingが1996年に設立したレーベルCLR(当初Fine Audio Recordings)が中心となった。同じ時期、ベルギーのTeknoやフランスのフリーテクノ、イタリアの倉庫パーティーも独自に高速化を進めていた。この音楽は身体的な負荷が大きく、参加者の間で覚醒剤やMDMAの使用が常態化していたことは否定しがたい事実で、その健康被害と依存の問題は繰り返し指摘されている。2000年代半ばには、ミニマル・テクノの流行によりハードテクノは一時的に時代遅れとされ、シーンは大きく縮小した。しかし地下では存続し、とりわけドイツ、ポーランド、チェコ、スペインで根強い支持が続いた。2018年前後から劇的な復活が起きる。ベルリンのクラブでテンポが再び上昇し始め、Amelie Lens(ベルギー)、Charlotte de Witte(ベルギー)、I Hate Models(フランス)、Sara Landryといった新世代が国際的な人気を獲得した。この復活はSNSと動画配信の影響が大きく、短い動画で切り取られたキックの落差が拡散に適していたことが指摘される。2020年代前半にはテンポの上昇が加速し、150BPMを超える設定が標準化した。同時に、かつての地下的な性格が失われ商業化しすぎたという批判も、古参の側から繰り返し提起されている。</p>
