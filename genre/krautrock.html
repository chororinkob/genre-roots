<h1>Krautrock（クラウトロック）とは</h1>
<p>1960年代末から1970年代のドイツで生まれたロックの一群。最大の特徴は「モトーリック」と呼ばれる、8分音符を一定の力で刻み続ける無表情な4分の4拍子のドラムで、バスドラムとスネアが機械のように等間隔に並び、抑揚をつけないことで</p>
<p>1960年代末から1970年代のドイツで生まれたロックの一群。最大の特徴は「モトーリック」と呼ばれる、8分音符を一定の力で刻み続ける無表情な4分の4拍子のドラムで、バスドラムとスネアが機械のように等間隔に並び、抑揚をつけないことで前進する感覚だけが残る。Neu!のドラマーの名から「ハンマービート」とも呼ばれた。和声はほとんど動かず、一つのコードや持続音の上で何分も即興が続き、そこにファズやエコーで加工したギター、シンセサイザーのシーケンス、テープの逆回転、Binson EchorecやRoland Space Echoといった反響装置の残響が重なる。曲は10分から20分に及ぶことが珍しくなく、始まりと終わりより途中の変化の過程が聴かせどころになる。歌は英語でもドイツ語でも、意味を持たない造語でもよく、そもそも歌が入らないことも多い。ブルースの音階と3コード進行という英米ロックの前提を意識的に排除した点が決定的な違いで、代わりに現代音楽の反復技法、フリージャズの即興、電子音楽のスタジオ技術が持ち込まれた。宇宙的な広がりを指してコズミック・ミュージックとも呼ばれる。</p>
<h2>成り立ち</h2><p>1968年前後の西ドイツで、学生運動と世代間の断絶を背景に生まれた。ナチス時代の記憶を持つ親の世代を否定した若者たちは、同時に、ドイツ語圏を占領文化として覆っていた英米のロックンロールも自分たちのものではないと考えた。1968年9月にエッセンで開かれた大規模な野外イベントInternationale Essener Songtageは、その新しい層が可視化された最初の場である。同年ベルリンでは、Conrad SchnitzlerやHans-Joachim Roedeliusが運営した会場Zodiak Free Arts Labが即興と電子音の実験場となり、のちのTangerine DreamやClusterの面々がここで出会った。ケルンではKarlheinz Stockhausenに学んだIrmin SchmidtとHolger Czukayが1968年にCanを結成し、フリージャズの即興と延々続く反復、テープ編集による構成を組み合わせて、1971年の「Tago Mago」に結実させる。ボーカルはアメリカ人のMalcolm Mooney、続いて路上で歌っていた日本人のDamo Suzukiという偶然の人選だった。デュッセルドルフでは、Kraftwerkにいたドラマーの Klaus DingerとギタリストのMichael Rotherが1971年にNeu!を結成し、無表情に等間隔で叩き続けるモトーリック・ビートを完成させた。ハンブルク近郊のFaustはジャーナリストUwe Nettelbeckの企画でレコード会社から破格の資金を引き出し、廃校のスタジオに籠もってコラージュ的な作品を作る。ミュンヘンのAmon Düül IIは共同生活集団から派生し、Popol Vuhはシンセサイザーによる宗教的な響きでWerner Herzogの映画音楽を担当した。技術面で決定的だったのはケルン近郊にスタジオを構えたプロデューサーConny Plankで、彼はNeu!、Cluster、Kraftwerk、La Düsseldorfらの音を作り、のちにUltravoxやEurythmicsも手がけている。「クラウトロック」という呼称は、ドイツ人を指す蔑称krautを使ったイギリスの音楽誌の揶揄が定着したもので、当事者たちは長く嫌っていた。1974年、Kraftwerkの「Autobahn」が国際的に売れたことでシーンは外へ知られ、以後この音はDavid Bowieのベルリン三部作、Joy Divisionをはじめとするポストパンク、そしてデトロイト・テクノにまで受け継がれていった。</p>
<h2>代表曲</h2><ul><li>Autobahn (Kraftwerk)</li><li>Halleluhwah (Can)</li><li>Hallogallo (Neu!)</li></ul>
