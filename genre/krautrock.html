<h1>Krautrock（クラウトロック）とは</h1>
<p>1960年代末から1970年代のドイツで生まれたロックの一群。特徴の一つに、Neu!やCanなど一部のバンドに顕著な「モトーリック」と呼ばれるドラムの型がある。4分の4拍子で、ハイハットが8分音符を刻み、スネアが裏拍（2・4拍）に</p>
<p>1960年代末から1970年代のドイツで生まれたロックの一群。特徴の一つに、Neu!やCanなど一部のバンドに顕著な「モトーリック」と呼ばれるドラムの型がある。4分の4拍子で、ハイハットが8分音符を刻み、スネアが裏拍（2・4拍）に入り、その間をバスドラムが埋める。Dinger本人は、これは機械のようなものではなく人間的なビートだと述べている。Neu!のドラマーKlaus Dingerは、このビートを「lange Gerade（長い直線）」、のちには「Apache beat」とも呼んだ。Neu!など一部のバンドでは和声（コードの響き）がほとんど動かず、一つのコードや持続音の上で何分も即興が続き、そこにファズ（音を強く歪ませる効果）やエコー（やまびこのような反響）で加工したギター、シンセサイザーのシーケンス（決まった音の並びを自動で繰り返す機能）、テープの逆回転、テープ・エコーなどの反響装置の残響が重なる。曲は10分から20分に及ぶことが珍しくなく、始まりと終わりより途中の変化の過程が聴かせどころになる。歌は英語でもドイツ語でも、意味を持たない造語でもよく、そもそも歌が入らないことも多い。英米の音楽への依存から離れようとする姿勢が見られ（Michael Rotherは英米の音楽文化の支配から自由になることを目指したと語っている）、代わりに現代音楽の反復技法、フリージャズの即興、電子音楽のスタジオ技術が持ち込まれた。近い意味で使われる別名にコズミック・ミュージック（kosmische Musik）があり、こちらはクラウトロックより先に使われていた。</p>
<h2>成り立ち</h2><p>1968年前後の西ドイツで、学生運動と世代間の隔たりを背景に生まれた。ナチス時代の記憶を持つ親の世代を否定した若者たちは、同時に、英米の音楽の輸入に頼っていた状況にも反発した。1968年9月25〜29日にエッセンの多数の会場（Grugahalleなど屋内が中心）で開かれた大規模な複合フェスティバルInternationale Essener Songtageは、その新しい層が目に見える形になった初期の重要な場の一つである。同年ベルリンでは、Conrad SchnitzlerやHans-Joachim Roedeliusが運営した会場Zodiak Free Arts Labが即興と電子音の実験場となり、のちのTangerine DreamやKluster（Clusterの前身）などが演奏し、活動を展開した。ケルンではKarlheinz Stockhausenに学んだIrmin SchmidtとHolger Czukayが1968年にCanを結成し、フリージャズの即興と延々続く反復、テープ編集による構成を組み合わせて、1971年の「Tago Mago」として実らせる。ボーカルはアメリカ人のMalcolm Mooney、続いて路上で歌っていた日本人のDamo Suzukiという偶然の人選だった。デュッセルドルフでは、Kraftwerkにいたドラマーの Klaus DingerとギタリストのMichael Rotherが1971年にNeu!を結成し、モトーリック・ビートを（CanのJaki Liebezeitが先駆者とされ、Dingerも初期の先駆者の一人として）追求した。ハンブルク近郊のFaustはジャーナリストUwe Nettelbeckが仲介し、レコード会社Polydorから多額の前払金を得て、廃校のスタジオに籠もってコラージュ的な作品を作る。ミュンヘンのAmon Düül IIは共同生活集団から派生し、Popol Vuhは電子音楽のプロジェクトとして始まったが、すぐにシンセサイザーから離れて有機的な楽器へ移り、Werner Herzogの映画音楽を担当した。技術面で決定的だったのはケルン近郊にスタジオを構えたプロデューサーConny Plankで、彼はNeu!、Cluster、Kraftwerk、La Düsseldorfらの音を作り、のちにUltravoxやEurythmicsも手がけている。「クラウトロック」という呼称は、ドイツ人を指す見下した呼び方であるkrautを使った言葉で、英国のメディアが広めたとされるが、考案者は特定されていない（イギリスのDJジョン・ピールか音楽誌Melody Makerが冗談めかして使い始めたとする説もあるが出典が弱く、ドイツ側でも1969〜71年に「Kraut」を使った例がある）。Michael RotherやKlaus Schulzeなど拒否した音楽家が多い一方、Mani NeumeierやHarald Grosskopf、Faustのように肯定的・皮肉に使った例もある。1974年にアルバムが出て、1975年に米国で最高5位となったKraftwerkの「Autobahn」の米国での成功がKraftwerkの名を広めた大きな契機の一つとなり、英国ではFaustの『The Faust Tapes』（1973年）がバンドを国際的に知らせるきっかけになったとされる。以後この音はDavid Bowieのベルリン3部作、Joy Divisionをはじめとするポストパンク、そしてKraftwerkを通じてデトロイト・テクノにも影響した。</p>
<h2>代表曲</h2><ul><li>Vitamin C (Can)</li><li>Autobahn (Kraftwerk)</li><li>Halleluhwah (Can)</li><li>Hallogallo (Neu!)</li><li>Trans-Europe Express (Kraftwerk)</li><li>Radioactivity (Kraftwerk)</li><li>Mother Sky (Can)</li><li>Future Days (Can)</li><li>Spoon (Can)</li><li>Das Model (Kraftwerk)</li><li>Computer Love (Kraftwerk)</li><li>Pocket Calculator (Kraftwerk)</li><li>Archangels Thunderbird (Amon Düül II)</li><li>Yoo Doo Right (Can)</li><li>Paperhouse (Can)</li><li>Dizzy Dizzy (Can)</li><li>Soul Desert (Can)</li><li>Mushroom (Can)</li><li>I Want More (Can)</li><li>Sowiesoso (Cluster)</li><li>E2-E4 (Manuel Göttsching)</li></ul>
