<h1>Krautrock（クラウトロック）とは</h1>
<p>クラウトロックは、1960年代末から1970年代のドイツで生まれた、ロックの一群だ。 ドラムでは、Neu!やCanなど一部のバンドに、はっきり見られる特徴がある。「モトーリック」と呼ばれる、4分の4拍子のドラムだ。ハイハットが8分</p>
<p>クラウトロックは、1960年代末から1970年代のドイツで生まれた、ロックの一群だ。

ドラムでは、Neu!やCanなど一部のバンドに、はっきり見られる特徴がある。「モトーリック」と呼ばれる、4分の4拍子のドラムだ。ハイハットが8分音符を刻み、スネアが裏拍（2・4拍）に入る。その間を、バスドラムが埋める。Neu!のドラマーKlaus Dingerは、このビートを「lange Gerade（長い直線）」、のちには「Apache beat」とも呼んだ。

和声（コードの響き）も、Neu!やCanなど一部のバンドでは、ほとんど動かない。一つのコードや持続音の上で、何分も即興が続く。そこに、ファズ（音を強く歪ませる効果）やエコー（やまびこのような反響）で加工したギターが重なる。シンセサイザーのシーケンス（決まった音の並びを自動で繰り返す機能）、テープの逆回転、テープ・エコー／ディレイ類の残響も加わる。

曲は、10分から20分に及ぶことが珍しくない。始まりと終わりより、途中の変化の過程が聴かせどころになる。

歌は、英語でもドイツ語でも、意味を持たない造語でもよい。そもそも歌が入らないことも多い。

ブルースの音階と3コード（三つの和音）進行という、英米ロックの前提から離れようとする姿勢が見られる。Michael Rotherは、英米の音楽文化の支配から自由になることを目指したと語っている。代わりに、現代音楽の反復技法、フリージャズの即興、電子音楽のスタジオ技術が持ち込まれた。

近い意味で使われる別名（kosmische Musik）があり、こちらの方が先に使われた。</p>
<h2>成り立ち</h2><p>1968年前後の西ドイツで、学生運動と世代間の隔たりを背景に、この音楽は生まれた。ナチス時代の記憶を持つ親の世代を否定した若者たちは、同時に、英米の音楽に依存した状況に対する反発を抱いた。

1968年9月25〜29日、エッセンの多数の会場（Grugahalleなど屋内が中心）で、大規模な複合フェスティバルInternationale Essener Songtageが開かれた。新しい層が目に見える形になった、初期の重要な場の一つである。

同年のベルリンでは、Conrad SchnitzlerやHans-Joachim Roedeliusが運営した会場、Zodiak Free Arts Labが、即興と電子音の実験場となった。のちのTangerine DreamやClusterの面々が、ここで演奏・共演し、活動が展開した。

ケルンでは、Karlheinz Stockhausenに学んだIrmin SchmidtとHolger Czukayが、1968年にCanを結成した。彼らは、フリージャズの即興と延々続く反復、テープ編集による構成を組み合わせた。それが1971年の「Tago Mago」として実る。ボーカルは、アメリカ人のMalcolm Mooney、続いて路上で歌っていた日本人のDamo Suzukiという、偶然の人選だった。

デュッセルドルフでは、Kraftwerkにいたドラマーの Klaus DingerとギタリストのMichael Rotherが、1971年にNeu!を結成した。2人は、モトーリック・ビートを追求した（CanのJaki Liebezeitが先駆者とされ、Dingerも初期の先駆者の一人）。

ハンブルク近郊のFaustは、ジャーナリストUwe Nettelbeckが仲介し、Polydorから多額の前払金を得た。そして廃校のスタジオに籠もって、コラージュ的な作品を作る。ミュンヘンのAmon Düül IIは、共同生活集団から派生した。Popol Vuhは、電子音楽のプロジェクトとして始まった。しかしすぐにシンセサイザーから離れて有機的な楽器へ移り、Werner Herzogの映画音楽を担当した。

技術面で決定的だったのは、ケルン近郊にスタジオを構えたプロデューサー、Conny Plankだ。彼はNeu!、Cluster、Kraftwerk、La Düsseldorfらの音を作り、のちにUltravoxやEurythmicsも手がけている。

「クラウトロック」という呼称は、ドイツ人を指す見下した呼び方であるkrautを使った言葉だ。英国のメディアが広めたとされるが、考案者は特定されていない（英国の音楽メディアが先というのは確定しておらず、ドイツ側でも1969〜71年に『Kraut』が使われた例がある）。Michael RotherやKlaus Schulzeなど拒否した音楽家が多い一方、Mani NeumeierやHarald Grosskopf、Faustのように肯定的・皮肉に使った例もある。

1974年にアルバムが出て、1975年に米国で最高5位となったKraftwerkの「Autobahn」は、米国でも成功した。これは、Kraftwerkの名を広めた大きな契機の一つだった。以後この音は、David Bowieのベルリン3部作や、Joy Divisionをはじめとするポストパンクに受け継がれた。そしてKraftwerkを通じて、デトロイト・テクノにも影響した。</p>
