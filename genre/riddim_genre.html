<h1>Riddim（リディム）とは</h1>
<p>ダブステップの一派で、極端な簡素さと執拗な反復を武器とする様式である。テンポは140 BPM、スネアを三拍目に置く半分の速さの構えを取る点は共通するが、決定的に異なるのは低音の音型である。この分野では、一つの短い低音の音型を、拍を</p>
<p>ダブステップの一派で、極端な簡素さと執拗な反復を武器とする様式である。テンポは140 BPM、スネアを三拍目に置く半分の速さの構えを取る点は共通するが、決定的に異なるのは低音の音型である。この分野では、一つの短い低音の音型を、拍を三つに分割する三連符の感覚で繰り返し鳴らし、それを曲の全体にわたって延々と反復する。音色の変化はごくわずかで、フィルターの開き具合や歪みの量が少しずつ動くだけである。この、ほとんど何も起こらないという構造が意図的に選ばれている。上物はほぼ存在せず、簡素な打楽器と、時折差し込まれる短い効果音のみで、旋律も和声も置かれない。音域も特徴的で、超低音や中高音を避け、腹に響く低い中音域に集中させる。この設計により、大音量の音響装置で鳴らしたときに身体を圧迫する感覚が最大化される。曲は3分から4分で、構成は導入と、低音が解放される部分の反復のみである。名称はジャマイカの音楽で伴奏を意味する語に由来し、実際、一つの型を共有してその上で差異を競うという構造は、ジャマイカの慣習と共通している。</p>
<h2>成り立ち</h2><p>2010年前後のイギリスに直接の源流がある。ダブステップが国際的に商業化していく中で、ロンドンやその周辺には、より簡素で暗い方向を守ろうとする作り手が残っていた。彼らの一部は、ジャマイカの音楽における伴奏の共有という発想を明示的に参照し、一つの低音の音型を軸に据えた楽曲を作った。ニュージーランドのTruthや、イギリスのKromestar、Coffiといった作り手がこの方向を示している。この時点では、あくまでダブステップの内側の一傾向に過ぎなかった。転換が起きたのは2015年前後のアメリカである。ブロステップの流行が一巡し、その過剰な音色設計に疲れた聴き手と制作者が、正反対の簡素さへ向かった。加えて、この様式は制作が容易だった。凝った音色設計も、複雑な構成も、音楽理論の知識も必要とせず、一つの音型を作ればそれで曲が成立するためである。この参入障壁の低さにより、無数の若い制作者が音楽投稿サイトへ作品を上げ、短期間で巨大な量の楽曲が生まれた。アメリカのSubtronicsやSvdden Death、Infektといった作り手が中心となり、大規模な野外祭典に専用の時間帯が設けられるまでになる。当然ながら、この分野への批判は厳しい。音楽的な内容が乏しく、どの曲も区別できず、単調であるという指摘は、外部だけでなく内部からも繰り返し提起されてきた。実際、量産による飽和は早期に訪れている。一方で、擁護する側は、この単調さは欠陥ではなく、身体を音圧で圧迫するという目的に対して最適化された結果だと主張する。踊るためでも聴くためでもなく、音を浴びるための音楽という位置づけであり、その意味では明確な機能を果たしている。</p>
