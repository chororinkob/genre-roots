<h1>Riddim（リディム）とは</h1>
<p>リディムは、ダブステップの一派だ。極端なまでの簡素さと、しつこい反復を武器にするスタイルである。 テンポは140 BPMで、スネアを3拍目に置く、半分の速さのノリを取る。ここまではダブステップと共通している。この分野では、低音は簡</p>
<p>リディムは、ダブステップの一派だ。極端なまでの簡素さと、しつこい反復を武器にするスタイルである。

テンポは140 BPMで、スネアを3拍目に置く、半分の速さのノリを取る。ここまではダブステップと共通している。この分野では、低音は簡素で反復的なパターンを取り、パーカッションには三連符系の配置が使われる。

簡素で反復的だが、空間系の効果やフィルター処理で変化をつける。

LFO（音を周期的に揺らす装置）のノコギリ波、ワイドなディレイ（広がりのある繰り返し効果）、フランジャーやコーラス（音をうねらせる効果）を多く使うことを、現代のリディムの特徴に挙げる見方もある。

音域の面では、ミニマルで反復的なサブベースと、三連符系のパーカッションの配置が特徴だ。

名前は、ジャマイカの音楽で伴奏を意味する言葉から来ている。</p>
<h2>成り立ち</h2><p>出発点は、2010年代初頭のイギリスだ。ダブステップ発祥の地である南ロンドン（クロイドン周辺）の流れを汲んでいる。

ダブステップは、国際的に商業化していった。その中でも英国には、より簡素で暗い方向を守ろうとする作り手が残っていた。

名前はジャマイカのリディムから来ており、2012年頃にJakesが名づけたとされる（異説あり）。作り手の一部は、一つの低音の音型を軸にした曲を作った。Jakes（最初のリディムの作り手とする見方がある）、今日のリディムの形を固めたと評価されるSubfiltronik、Coffi、Kromestar、Cokiといった作り手が、この方向を示している。ただしこの時点では、まだダブステップの内側の一つの傾向にすぎなかった。

2015年前後になると、リディムは主流のシーンで存在感を増す。アメリカでは、それまで「wonky dubstep」と呼ばれていた音楽に、この言葉が当てられた。

アメリカのSvdden Deathらが代表格とされる。ドイツ出身でカナダのモントリオールを拠点とするInfektも、リディムと関連づけられることが多い。一方、アメリカのSubtronicsはリディムと呼ばれることがあるが、本人は否定的だ。

一部のフェスには、リディム（またはダブステップ/リディム）の専用ステージが設けられている。Bass Paradise 2024やNorth Coast 2026がその例だ。

この分野には、繰り返しの多さをめぐる批判がある。それでも擁護する側は、簡素さと反復はジャンルの特性であり、フローを生むと主張する。リディムは、反復的で簡素だが、フロアで身体を動かすフローを重視する音楽なのだ。</p>
