<h1>Riddim（リディム）とは</h1>
<p>ダブステップの一派で、極端な簡素さと執拗な反復を武器とする様式である。テンポは140 BPM、スネアを3拍目に置く半分の速さの構えを取る点は共通するが、決定的に異なるのは低音の音型である。この分野では、一つの短い低音の音型を、拍を</p>
<p>ダブステップの一派で、極端な簡素さと執拗な反復を武器とする様式である。テンポは140 BPM、スネアを3拍目に置く半分の速さの構えを取る点は共通するが、決定的に異なるのは低音の音型である。この分野では、一つの短い低音の音型を、拍を三つに分割する三連符の感覚で繰り返し鳴らし、それを曲の全体にわたって延々と反復する。簡素で反復的だが、空間系やフィルター処理で変化をつける。この、ほとんど何も起こらないという構造が意図的に選ばれている。現代のリディムの特徴として、LFOのスクエア波、ワイドなディレイ、フランジャーやコーラスの多用が挙げられる。音域の面では、ミニマルで反復的なサブベースと、三連符系のパーカッションの配置が特徴である。この設計により、大音量の音響装置で鳴らしたときに身体を圧迫する感覚が最大化される。曲は3分から4分で、構成は導入と、低音が解放される部分の反復のみである。名称はジャマイカの音楽で伴奏を意味する語に由来する。</p>
<h2>成り立ち</h2><p>2010年代初頭のイギリス（クロイドン）に直接の源流がある。ダブステップが国際的に商業化していく中で、英国には、より簡素で暗い方向を守ろうとする作り手が残っていた。名称はジャマイカのリディムに由来し、彼らの一部は、一つの低音の音型を軸に据えた楽曲を作った。Jakes（最初のリディムの作り手とする見方がある）、今日のリディムを確立したと評価されるSubfiltronik、Coffi、Kromestar、Cokiといった作り手がこの方向を示している。この時点では、あくまでダブステップの内側の一傾向に過ぎなかった。転換が起きたのは2015年前後のアメリカである。アメリカの制作者・ファンが、従来「wonky dubstep」と呼ばれていた音楽にこの語を採用した。アメリカのSubtronicsやSvdden Death、ドイツ出身でカナダのモントリオールを拠点とするInfektといった作り手がリディムと関連づけられることが多く、大規模な野外祭典に専用のステージが設けられるまでになる。当然ながら、この分野への批判は厳しい。音楽的な内容が乏しく、どの曲も区別できず、単調であるという指摘は、外部だけでなく内部からも繰り返し提起されてきた。一方で、擁護する側は、この単調さは欠陥ではなく、身体を音圧で圧迫するという目的に対して最適化された結果だと主張する。踊るためでも聴くためでもなく、音を浴びるための音楽という位置づけであり、その意味では明確な機能を果たしている。</p>
