<h1>Bachata（バチャータ）とは</h1>
<p>ドミニカ共和国で生まれた、失恋と苦悩を歌うギター中心の音楽である。現代バチャータの標準編成は、旋律を担う1本目のギター、和音を刻む2本目のギター、低音のエレクトリックベース、金属製のスクレーパー（金属板を硬いブラシでこする打楽器）</p>
<p>ドミニカ共和国で生まれた、失恋と苦悩を歌うギター中心の音楽である。現代バチャータの標準編成は、旋律を担う1本目のギター、和音を刻む2本目のギター、低音のエレクトリックベース、金属製のスクレーパー（金属板を硬いブラシでこする打楽器）グイラ、そして底の開いた片面太鼓を大小2つ組にしたボンゴという五つの要素で構成される。主役は1本目のギターで、高い音域で和音を一音ずつ細かく弾き、音と音の間を滑らせる装飾を多用する。リード・ギター（requinto）は装飾的な単音のフレーズを奏で、聴き手が最初に耳にする声部である。近代バチャータ（電気ギター化は1980年代後半に始まり、1990年代に現代的な編成が定着した）では、ナイロン弦ではなく金属弦のギターが選ばれる（初期はナイロン弦のスペイン式ギターとマラカスだった）。リズムは4/4拍子で、グイラが一定の細かい刻みを保ち、基本リズム（derecho）ではボンゴが1・3・4拍に強調（アクセント）を置き、特に4拍目の低音が目立つ。この4拍目の強調が踊りの区切りとなり、3歩横に移動し、4拍目でタップ（ヒップの動きを伴う）という基本の型に対応している。テンポは概ね100〜150 BPMの幅で、時代やスタイルによって異なり、1980年代にテンポが速くなった。和声は短調の曲が多いが、長調系の進行も標準的に用いられ、同じ流れを繰り返すコード進行の中で切なさが保たれる。歌詞は、初期は失恋・心痛が中心で、1970年代後半から飲酒や性的な隠喩が増え、1990年代以降はロマンティックな内容が主流になった。感情を隠さず、時に自嘲を交えて歌われる点が特徴である。</p>
<h2>成り立ち</h2><p>1960年代初頭のドミニカ共和国が出発点である。1961年に30年以上続いた独裁者Rafael Trujilloの政権が彼の暗殺によって終わると、Trujillo一族が握っていた音楽産業の独占が崩れ、地方出身のギター音楽家が首都で録音できるようになった。後にバチャータ最初の録音と見なされるようになったのは、1962年のJosé Manuel Calderónの「Borracho de amor」である（当時はボレロとして受け入れられた）。その後、都市の貧困層や農村の出身者たちが、ギターを手に自分たちの生活と失恋を歌う録音を残し始める。初期はmúsica de guitarraやbolero campesino（農民のボレロ）と呼ばれた。1970年代にbachataが（蔑称として）定着し、1980年代半ばにmúsica de amargue（苦味の音楽）という自称が現れた。バチャータという語は元来、裏庭やパティオでの宴会や集まりを指す語で、のちに都市の上層が、この音楽を貧しく下品なものとして見下す呼称として用いた。実際、1980年代になっても、俗悪で粗野、音楽的に田舎くさいとされ、首都のFM局での放送やヒットチャート掲載はなく、テレビ出演もごくまれで、演奏の場は労働者階級のクラブなどが中心だった（AMのRadio Guarachitaは例外的に放送した）。歌詞が性的な隠喩を多用したことも、この評価を固定させた。しかし人々は買い続けた。露天商（非公式な経済）が粗製の45回転盤などを安く売り、バーや雑貨店のジュークボックスでも流され、地方から都市へ流入した労働者がそれを支えたのである。転機は1980年代後半から1990年代である。Blas Duránがエレクトリックギターを導入して音を近代化し、続いてJuan Luis Guerraが1990年に発表した作品で、洗練された編曲を持ち込んだ。彼はBerklee出身でメレンゲを刷新した音楽家として、『Ojalá que llueva café』（1989）で既に評価を得ていた。この作品は主流メディアと中産階級に支持され、国際的な注目を集めた（ただし、バチャータ本体への影響の大きさには異論がある）。1990年代にはAntony Santosらが人気を確立し、2000年代にはニューヨークで育ったドミニカ系の若者たちによるAventuraが、リズム・アンド・ブルースの歌唱と英語を混ぜた新しい形を作り、世界的な成功を収める。中心人物のRomeo Santosは現在も第一線にある。今日ではラテン音楽の主要な様式のひとつとして世界中で踊られているが、その出自が長く蔑まれた貧困層の音楽であったという事実は、この音楽の情感を理解するうえで欠かせない。</p>
