<h1>Bachata（バチャータ）とは</h1>
<p>ドミニカ共和国で生まれた、失恋と苦悩を歌うギター中心の音楽である。編成が明確に定まっており、旋律を担う一本目のギター、和音を刻む二本目のギター、低音のエレクトリックベース、金属製の擦弦楽器グイラ、そして両面太鼓のボンゴという五つの</p>
<p>ドミニカ共和国で生まれた、失恋と苦悩を歌うギター中心の音楽である。編成が明確に定まっており、旋律を担う一本目のギター、和音を刻む二本目のギター、低音のエレクトリックベース、金属製の擦弦楽器グイラ、そして両面太鼓のボンゴという五つの要素で構成される。主役は一本目のギターで、高い音域で細かく分散和音を弾き、音と音の間を滑らせる装飾を多用する。この、泣いているような細く震えるギターの音色が、この音楽を一瞬で識別させる。使われる機材にはナイロン弦ではなく金属弦のギターが選ばれ、さらに残響を深くかけることで、独特の艶やかさが加えられる。リズムは4/4拍子で、グイラが一定の細かい刻みを保ち、ボンゴが四拍目に強い一打を入れる。この四拍目の強調が踊りの区切りとなり、三歩進んで四歩目に腰を跳ね上げるという基本の型に対応している。テンポは概ね120から140 BPM程度である。和声は短調が圧倒的に多く、循環する進行の中で切なさが保たれる。歌詞は失恋、裏切り、酒に溺れる夜、報われない片思いといった主題に集中しており、感情を隠さず、時に自嘲を交えて歌われる点が特徴である。</p>
<h2>成り立ち</h2><p>1960年代初頭のドミニカ共和国が出発点である。1961年に30年以上続いた独裁者Rafael Trujilloの政権が彼の暗殺によって終わると、それまで国家が推奨していたメレンゲ以外の音楽が表に出る余地が生まれた。同年から、都市の貧困層や農村の出身者たちが、ギターを手に自分たちの生活と失恋を歌う録音を残し始める。当初この音楽に固有の名はなく、ギターの音楽、あるいは酒場の音楽と呼ばれていた。バチャータという語自体は元来、騒がしい集まりや馬鹿騒ぎを指す軽蔑的な言葉であり、この音楽を貧しく下品なものとして見下す文脈で用いられていた。実際、1960年代から1970年代を通じて、主要なラジオ局はこれを放送せず、テレビにも出演できず、演奏の場は売春宿や場末の酒場に限られていた。歌詞が性的な隠喩を多用したことも、この評価を固定させた。しかし人々は買い続けた。首都サントドミンゴの露天商が安価なレコードを売り、地方から都市へ流入した労働者がそれを支えたのである。転機は1980年代後半から1990年代である。Blas Duránがエレクトリックギターを導入して音を近代化し、続いてJuan Luis Guerraが1990年に発表した作品で、洗練された編曲と文学的な歌詞を持ち込んだ。彼は既に国際的な評価を得ていた音楽家であり、この作品によってバチャータは中産階級にも受け入れられる音楽へと地位を変えた。1990年代にはAntony Santosらが人気を確立し、2000年代にはニューヨークで育ったドミニカ系の若者たちによるAventuraが、リズム・アンド・ブルースの歌唱と英語を混ぜた新しい形を作り、世界的な成功を収める。中心人物のRomeo Santosは現在も第一線にある。今日ではラテン音楽の主要な様式のひとつとして世界中で踊られているが、その出自が長く蔑まれた貧困層の音楽であったという事実は、この音楽の情感を理解するうえで欠かせない。</p>
