<h1>Bachata（バチャータ）とは</h1>
<p>バチャータは、ドミニカ共和国で生まれた、ギター中心の音楽だ。失恋と苦悩を歌う。 現代バチャータの標準編成は、五つの要素で構成される。旋律を担う1本目のギター、和音を刻む2本目のギター、低音のエレクトリックベース、金属製のスクレーパ</p>
<p>バチャータは、ドミニカ共和国で生まれた、ギター中心の音楽だ。失恋と苦悩を歌う。

現代バチャータの標準編成は、五つの要素で構成される。旋律を担う1本目のギター、和音を刻む2本目のギター、低音のエレクトリックベース、金属製のスクレーパー（金属板を硬いブラシでこする打楽器）グイラ、そして底の開いた片面太鼓を大小2つ組にしたボンゴだ。

主役は1本目のギターだ。高い音域で和音を一音ずつ細かく弾き、音と音の間を滑らせる装飾を多用する。リード・ギター（requinto）は装飾的な単音のフレーズを奏で、聴き手が最初に耳にする声部である。近代バチャータ（電気ギター化は1980年代後半に始まり、1990年代に現代的な編成が定着した）では、ナイロン弦ではなく、金属弦のギターが選ばれる（初期はナイロン弦のスペイン式ギターとマラカスだった）。

リズムは4/4拍子だ。グイラが一定の細かい刻みを保つ。ボンゴは、基本リズム（derecho）では1・3・4拍に強調（アクセント）を置き、特に4拍目の低音が目立つ。この4拍目の強調が踊りの区切りとなる。それが、3歩横に移動し、4拍目でタップ（ヒップの動きを伴う）という基本の型に対応している。

テンポは概ね100〜150 BPMの幅で、時代やスタイルで異なる。1980年代にテンポが速くなった。

和声は、短調の曲が多い。ただし、長調系の進行も標準的に用いられる。同じ流れを繰り返すコード進行の中で、切なさが保たれる。

歌詞は、初期は失恋・心痛が中心だった。1970年代後半から、飲酒や性的な隠喩が増えた。1990年代以降は、ロマンティックな内容が主流になった。感情を隠さず、時に自嘲を交えて歌われる点が特徴である。</p>
<h2>成り立ち</h2><p>出発点は、1960年代初頭のドミニカ共和国だ。

1961年、30年以上続いた独裁者Rafael Trujilloの政権が、彼の暗殺によって終わった。Trujillo一族が握っていた音楽産業の独占が崩れ、地方出身のギター音楽家が、首都で録音できるようになった。後にバチャータ最初の録音と見なされるようになったのは、1962年のJosé Manuel Calderónの「Borracho de amor」である。

その後、都市の貧困層や農村の出身者たちが、ギターを手に、自分たちの生活と失恋を歌う録音を残し始めた。初期はmúsica de guitarra／bolero campesinoと呼ばれた。1970年代にbachataが（蔑称として）定着し、1980年代半ばにmúsica de amargueという自称が現れた。バチャータという語は、元来、裏庭やパティオでの宴会や集まりを指す語だった。のちに都市の上層が、この音楽を貧しく下品なものとして見下す呼称として用いた。

実際、1980年代になっても、この音楽は俗悪で粗野、音楽的に田舎くさいとされた。1988年時点でも、首都のFM局での放送やヒットチャート掲載はなかった。テレビ出演もごくまれで、演奏の場は労働者階級のクラブが中心だった。AMのRadio Guarachitaは例外的に放送した。歌詞が性的な隠喩を多用したことも、この評価を固定させた。

しかし、人々は買い続けた。粗製の45回転盤などを露天商（非公式な経済）が安く売り、バーや雑貨店のジュークボックスでも流された。地方から都市へ流入した労働者が、それを支えたのである。

転機は、1980年代後半から1990年代に訪れた。Blas Duránがエレクトリックギターを導入して、音を近代化した。続いてJuan Luis Guerraが、1990年に発表した作品で、洗練された編曲と文学的な歌詞を持ち込んだ。彼はBerklee出身で、メレンゴ（メレンゲ）を刷新した音楽家として、『Ojalá que llueva café』（1989）で既に評価を得ていた。『Bachata Rosa』は主流メディアと中産階級に支持され、国際的な注目を集めた（ただし、バチャータ本体への影響の大きさには異論がある）。

1990年代には、Antony Santosらが人気を固めた。2000年代には、ニューヨークで育ったドミニカ系の若者たちによるAventuraが、リズム・アンド・ブルースの歌唱と英語を混ぜた新しい形を作り、世界的な成功を収める。中心人物のRomeo Santosは、現在も第一線にある。

今日では、ラテン音楽の主要なスタイルのひとつとして、世界中で踊られている。しかし、その出自が長く蔑まれた貧困層の音楽であったという事実は、この音楽の情感を理解するうえで欠かせない。</p>
