<h1>Heartland Rock（ハートランドロック）とは</h1>
<p>アメリカ中西部から東部の工業地帯にかけての、普通の労働者の生活を歌うロックである。音楽は簡素・直截的なロックが基本だが、シンセサイザーを多用した例(Springsteenの『Born in the U.S.A.』)もある。編成はギ</p>
<p>アメリカ中西部から東部の工業地帯にかけての、普通の労働者の生活を歌うロックである。音楽は簡素・直截的なロックが基本だが、シンセサイザーを多用した例(Springsteenの『Born in the U.S.A.』)もある。編成はギター、ベース、ドラムに、オルガンかピアノ、そしてしばしばサックスが加わる。ギターは複雑な技巧を用いず、開かれた和音を力強く掻き鳴らし、Fender系のギターを使う奏者が多いが、Rickenbackerなど他社製も使われる。オルガンは持続する和音で背景を埋め、サックスは間奏で人間的な叫びのような旋律を吹く。リズムは4/4拍子で真っ直ぐに進み、テンポは跳ねずに一定の歩幅を保つものが多い。和声は単純な進行が中心である。この簡素さは、歌詞を明瞭に届けるための選択と解釈されることが多い。歌唱はしゃがれた声で、技巧よりも切実さが重んじられる。歌詞こそがこの分野の核心で、閉鎖された工場、失われた仕事、故郷の町を出ていく若者、戦争から帰還した兵士、車で夜の道を走る恋人たちといった、具体的な人物と場所を持つ物語が語られる。大会場で数万人が拳を上げて合唱できる繰り返し部分が用意された曲も多い。</p>
<h2>成り立ち</h2><p>背景にあるのは1970年代から1980年代のアメリカの経済構造の変化である。鉄鋼、自動車、機械といった製造業が海外との競争に敗れ、五大湖周辺の工業都市が次々に衰退した。この地帯は後に錆びついた地帯と呼ばれるようになる。豊かさを約束されていたはずの労働者階級の生活が崩れていくという経験が、この音楽の題材そのものとなった。中心人物はニュージャージー州出身のBruce Springsteenである。1975年の作品ボーン・トゥ・ランで、街を出ていく若者の切迫を映画的な言葉と壮大な演奏で描き、一躍全国的な存在となった。彼の重要性は音楽だけでなく、労働者の生活を尊厳あるものとして描く言葉の力にある。1982年には、宅録の粗い音源をそのまま発表したネブラスカで、殺人者や失業者の内面を極限まで簡素な弾き語りで描き、前作ほど売れないと見込まれたが、結果として全米3位・米国で100万枚超を売る作品を出した。1984年のボーン・イン・ザ・ユー・エス・エーは世界的な大成功を収めるが、この曲はベトナム帰還兵の疎外を描いた痛烈な批判であったにもかかわらず、力強い繰り返し部分だけが愛国的な賛歌として受け取られ、Reagan陣営の打診は丁重に断られ、その後Reaganが1984年9月の演説でSpringsteenに言及し、Springsteenが公演で反応するという出来事も起きている。誤読されるほど強い曲を書いてしまったという皮肉は、この分野の性格を象徴している。並行して、デトロイトのBob Segerが労働者の疲労と郷愁を歌い、フロリダ出身のTom Pettyがより簡潔な形式を提示し、インディアナ州のJohn Mellencampが小さな町の生活を描いた。1985年、John Mellencampは経営難に陥った農家を支援するため、Willie NelsonやNeil Youngとともに大規模な慈善公演を立ち上げ、この催しは現在も続いている。1990年代以降、この様式は流行の中心から外れたが、労働者の生活を具体的に歌うという姿勢は、現在のアメリカーナやカントリーに受け継がれている。</p>
<h2>代表曲</h2><ul><li>Free Fallin' (Tom Petty)</li><li>Against the Wind (Bob Seger)</li><li>Born to Run（Bruce Springsteen）</li><li>Night Moves (Bob Seger)</li><li>Jack &amp; Diane（John Mellencamp）</li><li>Pink Houses (John Mellencamp)</li><li>Hungry Heart (Bruce Springsteen)</li><li>Thunder Road (Bruce Springsteen)</li><li>Tenth Avenue Freeze-Out (Bruce Springsteen)</li><li>The Promised Land (Bruce Springsteen)</li><li>Darkness on the Edge of Town (Bruce Springsteen)</li><li>Badlands (Bruce Springsteen)</li></ul>
