<h1>Heartland Rock（ハートランドロック）とは</h1>
<p>ハートランド・ロックは、アメリカ中西部から東部の工業地帯にかけての、普通の労働者の生活を歌うロックだ。音楽は簡素で直截的なロックが基本である。ただ、シンセサイザーを多用した例(Springsteenの『Born in the U.</p>
<p>ハートランド・ロックは、アメリカ中西部から東部の工業地帯にかけての、普通の労働者の生活を歌うロックだ。音楽は簡素で直截的なロックが基本である。ただ、シンセサイザーを多用した例(Springsteenの『Born in the U.S.A.』)もある。

編成は、ドラム、キーボードという基本的なR&amp;B編成に、ときにサックスなどの管楽器が加わる形だ。ギターは複雑な技巧を使わず、開かれた和音を力強く掻き鳴らす。Fender系のギターを使う奏者が多いが、Rickenbackerなど他社製も使われる。オルガンは持続する和音で背景を埋める。サックスは間奏で、人間的な叫びのような旋律を吹く。

リズムは4/4拍子で真っ直ぐに進むものが中心だ。テンポは跳ねずに、一定の歩幅を保つものが多い。和声は単純な進行が中心である。この簡素さは、歌詞を明瞭に届けるための選択という見方もある。

歌はしゃがれた声が多く、技巧よりも切実さが重んじられる。

歌詞こそが、この分野の核心だ。閉鎖された工場、失われた仕事、故郷の町を出ていく若者、戦争から帰還した兵士、車で夜の道を走る恋人たち。こうした、具体的な人物と場所を持つ物語が語られる。大会場で数万人が拳を上げて合唱できる繰り返し部分が用意された曲も多い。</p>
<h2>成り立ち</h2><p>背景にあるのは、1970年代から1980年代のアメリカで起きた、経済構造の変化である。鉄鋼、自動車、機械といった製造業が、海外との競争に敗れた。五大湖周辺の工業都市は、次々に衰退していく。この地帯は、後に錆びついた地帯と呼ばれるようになった。豊かさを約束されていたはずの労働者階級の生活が崩れていく。その経験が、この音楽の題材そのものとなった。

代表的存在の一人が、ニュージャージー州出身のBruce Springsteenである。なお、ハートランド・ロックという用語自体は、1980年代に定着した。1975年の作品ボーン・トゥ・ランで、彼は街を出ていく若者の切迫を、映画的な言葉と壮大な演奏で描いた。これで一躍、全国的な存在となった。彼の重要性は、音楽だけではない。労働者の生活を尊厳あるものとして描く、言葉の力にもある。

1982年には、宅録の粗い音源をそのまま発表した。それがネブラスカである。殺人者や失業者の内面を、極限まで簡素な弾き語りで描いた。前作ほど売れないと見込まれたが、全米3位まで上昇し、1989年までに100万枚に達してRIAAプラチナ認定を受けた。

1984年のボーン・イン・ザ・ユー・エス・エーは、世界的な大成功を収める。この曲は、ベトナム帰還兵の疎外を描いた痛烈な批判だった。にもかかわらず、力強い繰り返し部分だけが、愛国的な賛歌として受け取られた。Reagan陣営の打診は丁重に断られた。その後、Reaganが1984年9月の演説でSpringsteenに言及し、Springsteenが公演で反応するという出来事も起きている。誤読されるほど強い曲を書いてしまったという皮肉は、この分野の性格をそのまま表している。

並行して、デトロイトのBob Segerが、労働者の疲労と郷愁を歌った。フロリダ出身のTom Pettyは、より簡潔な形式を提示した。インディアナ州のJohn Mellencampは、小さな町の生活を描いた。1985年、Willie Nelson、Neil Young、John Mellencampが、経営難に陥った農家を支援するため、大規模な慈善公演Farm Aidを創設した。この催しは現在も続いている。

1990年代以降、このスタイルは流行の中心から外れた。それでも、労働者の生活を具体的に歌うという姿勢は、現在のアメリカーナ（アメリカの伝統音楽を取り入れた音楽）やカントリーに受け継がれている。</p>
<h2>代表曲</h2><ul><li>Free Fallin' (Tom Petty)</li><li>Against the Wind (Bob Seger)</li><li>Born to Run（Bruce Springsteen）</li><li>Night Moves (Bob Seger)</li><li>Jack &amp; Diane（John Mellencamp）</li><li>Pink Houses (John Mellencamp)</li><li>Hungry Heart (Bruce Springsteen)</li><li>Thunder Road (Bruce Springsteen)</li><li>Tenth Avenue Freeze-Out (Bruce Springsteen)</li><li>The Promised Land (Bruce Springsteen)</li><li>Darkness on the Edge of Town (Bruce Springsteen)</li><li>Badlands (Bruce Springsteen)</li></ul>
