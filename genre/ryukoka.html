<h1>Ryukoka（リュウコウカ）とは</h1>
<p>大正3年(1914年)に言葉が使われ始め、昭和30年代〜1960年代初めまで、日本の街と家庭で流れていた商業的な歌謡だ。代表曲22曲を動画で聴け、ルーツと影響のつながりを地図でたどれる。</p>
<p>大正3年(1914年)に言葉が使われ始め、昭和30年代〜1960年代初めまで、日本の街と家庭で流れていた商業的な歌謡だ。演歌のように声を震わせて節を回す音楽ではなく、西洋音楽の和声と日本語の歌詞を組み合わせた都市の歌だ。

中心になる楽器は、学校音楽で広まったピアノとヴァイオリン、それにクラシック・ギターとマンドリンだ。古賀政男が持ち込んだマンドリン・オーケストラは、トレモロで旋律を震わせ、ギターが低音で拍を刻む。行進曲調の曲では金管とクラリネットが加わり、前の拍を押し出す。尺八や三味線、囃子の掛け声が入る曲もあり、洋楽の音と江戸の音が同じ盤に並んだ。

旋律は長音階と短音階が基本で、ヨナ抜き短音階で書かれた曲が大衆の耳に強く残った。和声は機能和声で、下属調への転調や短調から長調への切り替えが、サビの手前で感情を変える。西洋の歌劇のような旋律の型を使った曲もあり、日本語の抑揚とは違う線の動きが持ち味になる。

行進曲は2拍子系で、拍子は4分の4拍子と4分の3拍子が中心で、テンポは80〜120 BPMあたりを行き来することが多い。ワルツの曲では1拍目に低音、2拍目と3拍目に軽い和音が来る。行進曲調では8分音符が続き、強拍は1拍目(4拍子なら1・3拍目)に置かれる。譜割りは規則正しく、音符の長さを崩さない範囲で歌い手が表情を付ける。ルンバやタンゴ、ブギを取り入れた曲では、裏拍にシンコペーションが入る。

歌い方は声楽出身の歌手が目立った。米国のクルーン唱法の影響を受け、日本では藤山一郎らが電気マイクと声楽技術を結びつけ、ささやく低音と張りのある高音を1曲の中で切り替える。ビブラートを長くかけ、フレーズの終わりを軽く持ち上げる。民謡の節回しで歌う歌手や、笠置シヅ子のようにジャズのリズムに乗る歌手も同じ時期に並んだ。

歌詞の主題は、別れ、酒、故郷、旅、恋の未練だ。東京の街並みや銀座の柳、雪の国境を描く風景の歌も多い。一人称で語りかける形が基本で、地名や土地の言葉がそのまま入る。勇ましい行進曲調の歌詞も、明るい解放感を歌う歌詞もある。

曲の構成は、前奏、Aメロ、Bメロ、サビという型が多い。Aメロで風景を出し、Bメロで心情を動かし、サビで曲名の言葉を落とす。間奏ではマンドリンかギターが旋律を繰り返し、最後はサビを繰り返さずに静かに終わる型が好まれたが、曲によってはこの型に収まらないものもある。

演歌との違いは、こぶしや「ヨイショ」の掛け声に頼らず、和声と譜割りの正確さで聞かせる点にある。同じ時期の新民謡も流行歌と同様にレコード産業と結びついていたが、違いは土地や民謡風の題材を前面に出すかどうかにあった。鳴っていた場所は、劇場のレビュー、映画館、喫茶店の蓄音機、そしてラジオの音楽番組だ。</p>
<h2>成り立ち</h2><p>1914年（大正3年）3月、東京・丸の内の帝国劇場で、島村抱月と松井須磨子の劇団・芸術座がトルストイ原作の『復活』を上演した。その劇中歌として相馬御風と島村抱月が詞を書き、中山晋平が曲を付けたのが「カチューシャの唄」だ。松井須磨子が舞台で歌うと、日本語の詞を西洋の旋律で歌うこの形が爆発的に広がり、同年5月にはレコードも発売された。同じ1914年、神長瞭月が「流行歌・松の声」という盤を出し、この盤を契機に「流行歌」という言葉が使われ始めたとされる。

野口雨情が詞を書き、中山晋平が曲を付けた「船頭小唄」は、1921年に作られ、1923年に中山歌子が初めて録音した。鳥取春陽らの録音で、関東大震災の前後に広まった。ヨナ抜き短音階で作られた沈んだ旋律は、焼けた街の空気と重なり、後の演歌的な旋律の土台の一つになった。

流行歌を産業にしたのはレコード会社だ。1925年（大正14年）にラジオ放送が始まり、日本コロムビアは1927年に、日本ビクターは1928年（昭和3年）に、マイクロフォンを使う電気吹込みを導入すると、声の抑揚をそのまま盤に刻めるようになった。この年、声楽家出身の佐藤千夜子が歌った「波浮の港」が売れ、1929年（昭和4年）の「東京行進曲」は25万枚を売った。西條八十が詞を書き、中山晋平が曲を付け、溝口健二の映画と組んだこの曲は、映像と歌が同時に広がる、主題歌として作られた曲としては最初の大きな例になった。佐藤は「日本最初のレコード歌手」と呼ばれた。

しかし、制作の現場は会社の論理で動いていた。レコード会社の「文芸部」が企画を握り、作詞家・作曲家・歌手は専属契約で社員のように扱われ、移籍は「入社」「退社」と呼ばれた。零細なマイナーレーベルが乱立し、大手の盤から型を取った海賊版まで出回った。

1931年（昭和6年）、古賀政男がコロムビアで藤山一郎に書いた「酒は涙か溜息か」が大ヒットし、「影を慕いて」が続いた。古賀はマンドリンとクラシック・ギターの音を前面に出し、藤山は電気マイクの特性を生かしたクルーン唱法で歌った。古賀の移籍（1934年）の後、楠木繁夫・ディック・ミネが専属となり、1936年に藤山一郎が入社すると、テイチクは一気に大手へ躍り出た。同じ1936年の「東京ラプソディ」は35万枚を売り、コロムビア・テイチク・ポリドールが有力だったが、他社(ビクター、キング等)も大手だった。

一方、歌の中身も変わっていった。1917年（大正6年）の「今度生まれたら」は、芸術座『生ける屍』の劇中歌（北原白秋作詞・中山晋平作曲）で、猥褻を理由にレコードが発売禁止となり、発禁第1号とも言われる。1930年代前半の満州事変から1937年の日中戦争へ進む空気が歌詞に流れ込んだ。1940年（昭和15年）の「誰か故郷を想わざる」は、望郷の歌として売れ、戦地の兵士にも歌われた。

1945年（昭和20年）10月、焼け跡で封切られた映画『そよかぜ』の主題歌「リンゴの唄」が、並木路子と霧島昇の声で、通説では戦後のヒット曲第1号になった。1947年に発表・録音され、1948年1月にSP盤が発売された「東京ブギウギ」は、笠置シヅ子が歌い、服部良一がアメリカのブギを取り入れた8分音符の曲で、レビュー劇場のダンスと結びついた。1954年（昭和29年）8月に発売された「お富さん」は、歌舞伎『与話情浮名横櫛』のセリフを取り入れ、ブギウギのリズムとヨナ抜き音階の軽快な曲として、春日八郎の歌で大ヒットした（最終125万枚）。

しかし日本コロムビアのSP新譜は1962年（昭和37年）が最後となり、1963年（昭和38年）には、元コロムビア幹部の伊藤正憲らが退社して日本クラウンを設立し、のちに演歌中心のレーベルとして知られた。ここで流行歌と演歌は分かれた。それでも残ったわけではない。直後にザ・ビートルズとフォークソングが大量に入り、グループ・サウンズが生まれて、日本の大衆音楽はジャンルでくくれないほど広がった。流行歌は1960年代初めに事実上の終わりを迎え、歌手と作家は演歌やテレビの歌番組へ移っていった。</p>
