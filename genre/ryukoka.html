<h1>Ryukoka（リュウコウカ）とは</h1>
<p>明治末から昭和30年代前半まで、日本の街と家庭で流れていた商業的な歌謡だ。代表曲22曲を動画で聴け、ルーツと影響のつながりを地図でたどれる。</p>
<p>明治末から昭和30年代前半まで、日本の街と家庭で流れていた商業的な歌謡だ。演歌のように声を震わせて節を回す音楽ではなく、西洋音楽の和声と日本語の歌詞を組み合わせた都市の歌である。

中心になる楽器は、学校音楽で広まったピアノとヴァイオリン、それにクラシック・ギターとマンドリンだ。古賀政男が持ち込んだマンドリン・オーケストラは、トレモロで旋律を震わせ、ギターが低音で拍を刻む。行進曲調の曲では金管とクラリネットが加わり、前の拍を押し出す。尺八や三味線、囃子の掛け声が入る曲もあり、洋楽の音と江戸の音が同じ盤に並んだ。

旋律は長音階と短音階が基本で、ヨナ抜き短音階で書かれた曲が大衆の耳に強く残った。和声は機能和声で、下属調への転調や短調から長調への切り替えが、サビの手前で感情を変える。西洋の歌劇から旋律の型をそのまま借りた曲も多く、日本語の抑揚とは違う線の動きが持ち味になる。

拍子は4分の4拍子と4分の3拍子が中心で、テンポは80〜120 BPMあたりを行き来する。ワルツの曲では1拍目に低音、2拍目と3拍目に軽い和音が来る。行進曲調では8分音符が続き、アクセントが2拍目と4拍目に移る。譜割りは規則正しく、音符の長さを崩さない範囲で歌い手が表情を付ける。ルンバやタンゴ、ブギを取り入れた曲では、裏拍にシンコペーションが入る。

歌い方は声楽の訓練を受けた歌手が中心になった。マイクロフォンに向かって声量を落とし、共鳴を生かして語尾を伸ばすクルーン唱法が生まれ、ささやく低音と張りのある高音を1曲の中で切り替える。ビブラートを長くかけ、フレーズの終わりを軽く持ち上げる。民謡の節回しで歌う歌手や、笠置シヅ子のようにジャズのリズムに乗る歌手も同じ時期に並んだ。

歌詞の主題は、別れ、酒、故郷、旅、恋の未練だ。東京の街並みや銀座の柳、雪の国境を描く風景の歌も多い。一人称で語りかける形が基本で、地名や土地の言葉がそのまま入る。勇ましい行進曲調の歌詞も、明るい解放感を歌う歌詞もある。

曲の構成は、前奏、Aメロ、Bメロ、サビという型が多い。Aメロで風景を出し、Bメロで心情を動かし、サビで曲名の言葉を落とす。間奏ではマンドリンかギターが旋律を繰り返し、最後はサビを繰り返さずに静かに終わる型が好まれた。

演歌との違いは、こぶしや「ヨイショ」の掛け声に頼らず、和声と譜割りの正確さで聞かせる点にある。同じ時期の新民謡や童謡が土地と子どもの歌なのに対し、流行歌は都市のレコード産業が作る商品だった。鳴っていた場所は、劇場のレビュー、映画館、喫茶店の蓄音機、そしてラジオの音楽番組だ。</p>
<h2>成り立ち</h2><p>1914年（大正3年）3月、東京・有楽町の帝国劇場で、島村抱月と松井須磨子の劇団・芸術座がトルストイ原作の『復活』を上演した。その劇中歌として相馬御風と島村抱月が詞を書き、中山晋平が曲を付けたのが「カチューシャの唄」だ。松井須磨子が舞台で歌うと、日本語の詞を西洋の旋律で歌うこの形が爆発的に広がり、同年5月にはレコードも発売された。同じ1914年、神長瞭月が「流行歌・松の声」という盤を出し、「流行歌」という言葉が使われ始めた。

1923年（大正12年）には、野口雨情が詞を書き、中山晋平が曲を付けた「船頭小唄」が、鳥取春陽の歌で関東大震災の前後に広まった。ヨナ抜き短音階で作られた沈んだ旋律は、焼けた街の空気と重なった。この曲の音階が、後の演歌の土台になる。

流行歌を産業にしたのはレコード会社だ。1925年（大正14年）にラジオ放送が始まり、1928年（昭和3年）に日本ビクターと日本コロムビアがマイクロフォンを使う電気吹込みを導入すると、声の抑揚をそのまま盤に刻めるようになった。この年、声楽家出身の佐藤千夜子が歌った「波浮の港」が売れ、1929年（昭和4年）の「東京行進曲」は25万枚を売った。西條八十が詞を書き、中山晋平が曲を付け、溝口健二の映画と組んだこの曲は、映像と歌が同時に広がる形の最初の大きな例になった。佐藤は「日本最初のレコード歌手」と呼ばれた。

しかし、制作の現場は会社の論理で動いていた。レコード会社の「文芸部」が企画を握り、作詞家・作曲家・歌手は専属契約で社員のように扱われ、移籍は「入社」「退社」と呼ばれた。零細なマイナーレーベルが乱立し、大手の盤から型を取った海賊版まで出回った。

1931年（昭和6年）、古賀政男がコロムビアで藤山一郎に書いた「酒は涙か溜息か」が100万枚を超え、「影を慕いて」が続いた。古賀はマンドリンとクラシック・ギターの音を前面に出し、藤山は電気マイクの特性を生かしたクルーン唱法で歌った。1934年に古賀がテイチクへ移ると、藤山一郎、ディック・ミネ、楠木繁夫が続き、テイチクは一気に大手へ躍り出た。1936年の「東京ラプソディ」は35万枚を売り、コロムビア、テイチク、ポリドールの3社が市場を分け合う形が固まった。

一方、統制の時代に入ると歌の中身も変わった。1917年（大正6年）の「今度生まれたら」はレコード発禁第1号になっており、1930年代後半からは満州事変から日中戦争へ進む空気が歌詞に流れ込んだ。1940年（昭和15年）の「誰か故郷を想わざる」は、望郷の歌として売れ、戦地の兵士にも歌われた。

1945年（昭和20年）10月、焼け跡で封切られた映画『そよかぜ』の主題歌「リンゴの唄」が、並木路子と霧島昇の声で戦後の第1号ヒットになった。1947年に笠置シヅ子が歌った「東京ブギウギ」は、服部良一がアメリカのブギを取り入れた8分音符の曲で、レビュー劇場のダンスと結びついた。1954年（昭和29年）の「お富さん」では、春日八郎が浪曲のような語りで大衆の笑いを取りにいった。

しかし1962年（昭和37年）にSPレコードの生産が打ち切られ、1963年（昭和38年）にはコロムビアの一レーベルだったクラウンが日本クラウンとして独立し、演歌専門の会社になった。ここで流行歌と演歌は分かれた。それでも残ったわけではない。直後にザ・ビートルズとフォークソングが大量に入り、グループ・サウンズが生まれて、日本の大衆音楽はジャンルでくくれないほど広がった。流行歌は1960年代初めに事実上の終わりを迎え、歌手と作家は演歌やテレビの歌番組へ移っていった。</p>
