<h1>Ghazal（ガザル）とは</h1>
<p>南アジアと中東で受け継がれてきた、詩の形式に由来する歌の様式である。まず詩の構造が厳格に定まっている。全体は独立した二行連句の連なりから成り、各連句はそれぞれ完結した内容を持つため、順序を入れ替えても成立する。全ての連句の末尾には</p>
<p>南アジアと中東で受け継がれてきた、詩の形式に由来する歌の様式である。まず詩の構造が厳格に定まっている。全体は独立した二行連句の連なりから成り、各連句はそれぞれ完結した内容を持つため、順序を入れ替えても成立する。全ての連句の末尾には同じ語句が繰り返され、その直前の語が韻を踏む。冒頭の連句でこの二つの規則が提示され、最後の連句には詩人の筆名が織り込まれるという約束事がある。音楽面では、北インド古典音楽の旋法体系に基づきながら、古典声楽ほど厳格ではなく、旋律の美しさと言葉の伝達が優先される。伴奏は蛇腹式の手風琴ハルモニウム、両面の打楽器タブラ、そして弓で弾く弦楽器サーランギーが基本で、後年には弦楽合奏やギターが加えられた。歌手は一つの連句を歌った後、同じ旋律で少しずつ装飾を変えながら繰り返し、聴衆の反応を見ながら即興的に伸ばしていく。歌詞の主題は、報われない恋、別れ、酒、そして神秘主義的な合一の希求であり、愛する対象が人間なのか神なのかを意図的に曖昧にする両義性が、この形式の最大の魅力とされる。</p>
<h2>成り立ち</h2><p>起源は7世紀のアラビア半島の詩にあるが、形式として完成したのはペルシア語圏である。13世紀のRumiや14世紀のHafezがこの形式で膨大な作品を残し、神への愛と人間の愛を重ね合わせる神秘主義的な表現の器として確立した。この形式がインド亜大陸へ伝わったのは、ペルシア語を宮廷語とするイスラーム王朝を通じてである。ムガル帝国の時代を経て、18世紀以降はウルドゥー語による作品が主流となった。頂点をなすのが19世紀デリーのMirza Ghalibである。彼はムガル帝国の最末期を生き、1857年の大反乱とその後の英国による苛烈な報復を目の当たりにした。彼の詩は、個人的な喪失と時代の崩壊が重なった独特の深みを持ち、現在も南アジア全域で暗誦されている。20世紀に入ると、録音とラジオによってこの形式は大衆化する。Begum Akhtarは、宮廷や遊里の芸能者の伝統を受け継ぎながら、この形式を演奏会の芸術へ引き上げた。1947年の印パ分離独立は、この伝統に深い傷を残す。ウルドゥー語とその文学は両国に分断され、多くの音楽家が国境を越えて移住し、家族と聴衆を失った。パキスタンではMehdi Hassanが、古典音楽の深い素養を背景に、この形式の最高峰と称される歌唱を確立し、インドの聴衆からも敬愛された。両国の政治的な対立にもかかわらず、この音楽が国境を越えて聴かれ続けたことは特筆される。1970年代から1980年代には、Jagjit Singhが伴奏を簡素化し、旋律を親しみやすくすることで、古典の素養を持たない都市の中産階級へこの形式を届けた。伝統の側からは俗化だと批判されたが、この大衆化がなければ形式そのものが衰退していた可能性もある。現在も南アジアの詩と歌の最も洗練された形として生き続けている。</p>
