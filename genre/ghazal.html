<h1>Ghazal（ガザル）とは</h1>
<p>ガザルは、南アジアと中東で受け継がれてきた、詩の形式に由来する歌のスタイルである。 伴奏の基本は三つある。一つ目は、ハルモニウム(インド式の手押しふいご式リードオルガン)。二つ目は、片面張りの2つの太鼓(高音のダヤと低音のバヤ)の</p>
<p>ガザルは、南アジアと中東で受け継がれてきた、詩の形式に由来する歌のスタイルである。

伴奏の基本は三つある。一つ目は、ハルモニウム(インド式の手押しふいご式リードオルガン)。二つ目は、片面張りの2つの太鼓(高音のダヤと低音のバヤ)のタブラ。三つ目は、弓で弾く弦楽器サーランギーである。後年には、弦楽合奏やギターが加えられた。

音楽面では、北インド古典音楽の旋法（音の並び方の型）体系に基づく。ただし、古典声楽ほど厳格ではなく、旋律の美しさと言葉の伝達が優先される。

歌手は、一つの連句を歌った後、同じ旋律で少しずつ装飾を変えながら繰り返すことが多い。そして、聴衆の反応を見ながら即興的に伸ばしていくこともある。

歌詞の主題は、報われない恋、別れ、酒、そして神秘主義的な、神と一体になることを求める思いである。愛する対象が人間なのか神なのかを意図的に曖昧にする両義性（二通りの意味にとれること）が、この形式の大きな特徴/魅力の一つとされる。

詩の構造は厳格に定まっている。全体は、独立した二行連句（2行で一組の詩）の連なりから成り、各連句は意味的に自己完結・独立しているのが通例である。韻は必須で、繰り返し語句は任意だが、大半のガザルでは、冒頭の連句の両行と以降の連句の第2行の末尾に同じ語句が置かれ、その直前の語が韻を踏む。冒頭の連句でこの規則が提示され、通例、最後の連句に筆名（詩人としての名）を入れる。</p>
<h2>成り立ち</h2><p>起源は、7世紀のアラビア半島の詩（nasib）にあるとされる（ペルシア側の独自の伝統の影響をめぐる議論もある）。形式として完成したのは、ペルシア語圏である。

13世紀のRumiは、ガザルを数多く残し、神秘主義的な愛の表現に用いた代表的詩人の一人である。14世紀のHafezは、(約500編弱という)限られた数の作品で最高峰とされた。

この形式がインド亜大陸（インドを中心とする地域）へ伝わったのは、ペルシア語を宮廷語とするイスラーム王朝を通じてである。ムガル帝国下で、ウルドゥー語のガザルは17世紀のデカンに始まり、18世紀にデリーで盛んになった（19世紀にもペルシア語の作品は書かれ続けた）。

その頂点に位置づけられる詩人の一人が、19世紀デリーのMirza Ghalibである。彼はムガル帝国の最末期を生き、1857年の大反乱とその後の英国による厳しい報復を目の当たりにした。彼の詩は、個人的な喪失と時代の崩壊が重なった独特の深みを持つ。インドやパキスタンなどで今も広く愛誦されている。

20世紀に入ると、録音とラジオによってこの形式は大衆化していったとされる。Begum Akhtarは、宮廷や遊里（遊興の街）の芸能者の伝統を受け継ぎながら、公開演奏会を行った初期の女性歌手の一人として、ガザルを演奏会の場に広めた。

しかし、1947年の印パ分離独立は、この伝統に深い傷を残す。ウルドゥー語とその文学は両国に分断され、多くの音楽家が国境を越えて移住し、家族と聴衆を失ったとされる。パキスタンではMehdi Hassanが、古典音楽の深い素養を背景に、この形式の最高峰の一人と称される歌唱を築き、インドの聴衆からも敬愛された。両国の政治的な対立にもかかわらず、この音楽が国境を越えて聴かれ続けたことは特筆される。

1970年代から1980年代には、Jagjit Singhが簡素な旋律と平易な詩を選び、西洋楽器(ギター、ヴァイオリン、キーボード類)を取り入れて大衆化したとされる。現在も南アジアで広く歌われ、親しまれている。</p>
