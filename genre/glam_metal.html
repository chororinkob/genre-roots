<h1>Glam Metal（グラムメタル）とは</h1>
<p>グラム・メタルは、1980年代のロサンゼルスを中心に栄えた、享楽と見た目の派手さを全面に押し出したヘヴィメタルだ。 「ヘアメタル（Hair Metal）」とも呼ばれ、両者は同一の音楽現象を指す。Glam Metalは、グラムロック</p>
<p>グラム・メタルは、1980年代のロサンゼルスを中心に栄えた、享楽と見た目の派手さを全面に押し出したヘヴィメタルだ。

「ヘアメタル（Hair Metal）」とも呼ばれ、両者は同一の音楽現象を指す。Glam Metalは、グラムロックの影響を受けて発展したことから、この名で呼ばれる。Hair Metalは長く逆立てた髪型をからかう批判的・口語的な呼び名で、1990年代初頭に広まった蔑称として定着した。

音楽的には、ハードロックを土台に、ポップなフックを強めたヘヴィメタルの一形態とされ、分類は資料により異なる。その骨格は、ブルース由来のペンタトニック（5音だけの音階）によるリフと、単純な三和音（3つの音を重ねた基本の和音）の進行だ。しかしそこへ、当時最新の録音技術が惜しみなく投入された。

ギターは、複数本を左右に振り分けて厚く重ねる。間奏では、両手を指板に置く奏法や、高速の交互撥弦（ピックで上下に素早く弾くこと）による技巧的な独奏が置かれる。

ドラムは、残響を人工的に切り落とす処理（ゲート・リバーブ）によって、独特の質感を与えられた。爆発するように鳴った直後に、不自然に断ち切られる音だ。この処理は、1980年代のポップ／ロック全般で広く使われた。

テンポはアップテンポの曲が中心だが、スローなパワーバラード（力強い盛り上がりのあるゆったりした曲）も重要である。歌唱は、高音域を張り上げる形が主流だ。繰り返し部分では、構成員全員が声を合わせる合唱が加えられ、大会場での唱和が想定されている。

歌詞は、酒、性愛、夜遊び、そして自由の謳歌が中心だ。ただし、労働者の困窮や若者の反抗を歌った曲も大ヒットした。

視覚面では、長く逆立てた髪、化粧、体にぴったりした派手な衣装（スパンデックス＝よく伸びる素材など）が典型とされた。</p>
<h2>成り立ち</h2><p>舞台は、ロサンゼルス（厳密にはウェスト・ハリウッド市内）のサンセット・ストリップだ。

1980年前後、この一帯にはWhisky a Go GoやGazzarri'sといった小さな会場が密集し、成功を夢見る若者が全米から流入していた。彼らは、自ら入場券を買い取って売りさばくことで出演権を得るという仕組みのもとで競い合った。多くのバンドがビラ配りに時間を割いた。

結成は1981年。Mötley Crüeは、Too Fast for Love（1981年11月10日、自主レーベルLeathür）を出した。Quiet Riotの成功が商業的な突破口とされる。その後、Shout at the Devil（1983年）で全国的に成功し、1985年に第一波のグラムメタルに加わったとされる。

大きな追い風になったのは、1981年に開局した音楽専門のテレビ局の存在だった。視覚的に派手なこの一群は、放送に最適だった。

1986年、Poisonが軽妙な作風で成功した。同年にBon Joviが発表した作品は、外部の職業作曲家を招いて楽曲の完成度を高めるという手法によって、世界的な大成功を収めた。

イギリスのDef Leppardは、グラムメタルと関連づけられることが多いが、バンド自身はこの呼称を嫌っている。同バンドは1987年、約3年（1984年2月〜1987年1月の録音）をかけて一枚を完成させた。当初予定のRobert John Langeが辞退し、代役のJim Steinmanが起用されたが、Steinmanは1984年10月に解任された。Robert John Langeは1985年夏に復帰した。この間、ドラマーのRick Allenが1984年の自動車事故で片腕を失っている。しかし彼は、足で操作する特注の装置を用いて演奏を続け、バンドは彼を解雇しなかった。

1985年9月19日、米上院商業・科学・運輸委員会で公聴会が開かれた。PMRCが挙げた「Filthy Fifteen」にMötley Crüe、Def Leppardなどが含まれた。Dee Snider、Frank Zappa、John Denverが規制に反対して証言した。

1980年代半ばから後半にかけて、流行は頂点に達し、市場は同種のバンドであふれた。しかし、グランジ（Nirvanaなど）やオルタナが人気を集め、1990年代初頭に急速に衰退した。R.E.M.は、オルタナ系で成功を収めたバンドの例である。レコード会社は契約を打ち切り、多くのバンドが解散した。

長らく軽薄なものとして嘲笑されてきた。だが、1990年代後半から2000年代にかけて、当時の演奏技術と楽曲の完成度が再評価された。また、当時の享楽的な文化の裏側にあった薬物依存や搾取的な契約についても、当事者の証言によって語られるようになっている。</p>
