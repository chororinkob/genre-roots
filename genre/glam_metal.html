<h1>Glam Metal（グラムメタル）とは</h1>
<p>1980年代のロサンゼルスを中心に栄えた、享楽と見た目の派手さを全面に押し出したヘヴィメタルである。「ヘアメタル（Hair Metal）」とも呼ばれ、両者は同一の音楽現象を指す。Glam Metalという呼称はグラムロックとの視覚</p>
<p>1980年代のロサンゼルスを中心に栄えた、享楽と見た目の派手さを全面に押し出したヘヴィメタルである。「ヘアメタル（Hair Metal）」とも呼ばれ、両者は同一の音楽現象を指す。Glam Metalという呼称はグラムロックとの視覚的な連続性を強調したもので、Hair Metalは長く逆立てた髪型をからかう批判的・口語的な呼び名として定着した。音楽的な骨格はハードロックそのもので、ブルース由来のペンタトニック（5音だけの音階）によるリフと、単純な三和音（3つの音を重ねた基本の和音）の進行を基本とする。しかしそこへ、当時最新の録音技術が惜しみなく投入された。ドラムは残響を人工的に切り落とす処理（ゲート・リバーブ）によって、爆発するように鳴った直後に不自然に断ち切られる独特の質感を与えられ、この処理は1980年代の録音に広く見られ、グラムメタルでも使われた。ギターは複数本を左右に振り分けて厚く重ね、間奏では両手を指板に置く奏法や高速の交互撥弦（ピックで上下に素早く弾くこと）による技巧的な独奏が置かれる。歌唱は高音域を張り上げる形が主流で、繰り返し部分では構成員全員が声を合わせる合唱が加えられ、大会場での唱和が想定されている。テンポはアップテンポの曲が中心だが、スローなパワーバラード（力強い盛り上がりのあるゆったりした曲）も重要である。歌詞は酒、性愛、夜遊び、そして自由の謳歌が中心だが、労働者の困窮や若者の反抗を歌った曲も大ヒットした。視覚面では長く逆立てた髪、化粧、体にぴったりした派手な衣装（スパンデックス＝よく伸びる素材など）が典型とされた。</p>
<h2>成り立ち</h2><p>舞台はロサンゼルスのサンセット大通りである。1980年前後、この一帯にはWhisky a Go GoやGazzarri'sといった小さな会場が密集し、成功を夢見る若者が全米から流入していた。彼らは自ら入場券を買い取って売りさばくことで出演権を得るという仕組みのもとで競い合い、通りは手作りの宣伝紙で埋め尽くされた。1981年に自主制作盤を出したMötley Crüeは初期の代表格で、Quiet Riotの成功が商業的な突破口とされる。Mötley Crüeは1983年の作品で全国的な成功を収める。決定的だったのは1981年に開局した音楽専門のテレビ局の存在で、視覚的に派手なこの一群は放送に最適だった。1986年、Poisonが軽妙な作風で成功し、同年Bon Joviが発表した作品は、外部の職業作曲家を招いて楽曲の完成度を高めるという手法によって世界的な大成功を収める。イギリスのDef Leppardは1987年、約3年（1984年2月〜1987年1月の録音）をかけて一枚を完成させた。最初の制作者Jim Steinmanは1984年10月に解任され、Robert John Langeが1985年夏に復帰した。この間、ドラマーのRick Allenが1984年の自動車事故で片腕を失っているが、彼は足で操作する特注の装置を用いて演奏を続け、バンドは彼を解雇しなかった。1985年にはアメリカ議会で、歌詞の内容を問題視する公聴会が開かれ、音楽全般の歌詞表現と警告ラベルが議題で、グラムメタルのバンドも含まれていた。この時、規制に反対する立場で証言した音楽家の理路整然とした反論は、表現の自由をめぐる論争として記録に残った。1980年代半ばから後半にかけて流行は頂点に達し、市場は同種のバンドであふれる。グランジ/オルタナの台頭(NirvanaやR.E.M.など)で、1990年代初頭に急速に衰退した。レコード会社は契約を打ち切り、多くのバンドが解散した。長らく軽薄なものとして嘲笑されてきたが、2000年代以降は当時の演奏技術と楽曲の完成度が再評価され、また当時の享楽的な文化の裏側にあった薬物依存や搾取的な契約についても、当事者の証言によって語られるようになっている。</p>
