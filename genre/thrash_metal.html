<h1>Thrash Metal（スラッシュメタル）とは</h1>
<p>ヘヴィメタルにハードコア・パンクの速度と攻撃性を注入した様式。BPMはおおよそ140〜250で、300近くに達するのは一部の例外にとどまり、ドラムは、バスドラムとスネアが交互に入る倍速の2拍子（ポルカに似たリズム）、いわゆるスラッ</p>
<p>ヘヴィメタルにハードコア・パンクの速度と攻撃性を注入した様式。BPMはおおよそ140〜250で、300近くに達するのは一部の例外にとどまり、ドラムは、バスドラムとスネアが交互に入る倍速の2拍子（ポルカに似たリズム）、いわゆるスラッシュ・ビートを軸とする。最大の特徴はギターの右手の技術で、低音弦をパーム・ミュートしながら16分音符を刻み続けるダウンピッキング（すべて下向きの一方向だけで弾く奏法）が代表的な奏法で、上下交互に弾くより体力を消耗するが、音の粒が揃った機関銃のような刻みを生む。上下交互に弾く奏法も併用される。和音はパワー・コードに加え、半音や三全音を織り込んだ緊張の高いリフが用いられ、リフそのものが曲の主題として機能する。曲構成は複数の異なるリフを継ぎ足していく形式で、テンポの急激な変化、静かなクリーン・トーンの導入部、そして技巧的なギター・ソロを含む。歌唱は絶叫と怒鳴りの中間で、旋律よりリズムの刻みに合わせて言葉を吐き出す。歌詞は核戦争、社会の腐敗、宗教への懐疑、精神疾患といった現実的で暗い主題を扱い、ファンタジー色は薄い。ライブでは観客が輪になってぶつかり合うモッシュという行為が伴い、演奏と観客の身体が一体となる。</p>
<h2>成り立ち</h2><p>1980年代初頭、米国カリフォルニア州のベイエリアと、ロサンゼルスを中心に成立した。土台となったのは、イギリスのニュー・ウェイヴ・オブ・ブリティッシュ・ヘヴィメタル、とりわけDiamond HeadやVenomのレコードで、これらを輸入盤で聴いた米国の若者が、そこにハードコア・パンクの速度を加えた。決定的な人物はMetallicaのLars UlrichとJames Hetfieldで、1981年にロサンゼルスで結成、1983年のデビュー作Kill 'Em Allが様式を提示した。同作の制作前にギタリストDave Mustaineが飲酒や薬物の乱用、対立を理由に解雇され、彼はMegadethを結成、この対立が長期にわたる因縁として語り継がれることになる。1980年代半ばから後半に商業的に成功したMetallica、Megadeth、Slayer、Anthraxの四組が、のちにビッグ・フォーと総称され、それぞれニューヨーク、カリフォルニアと拠点を分けながら競い合った。とりわけSlayerが1986年に発表したReign in Bloodは、29分という短さに極限の速度を詰め込み、ナチスの人体実験を題材とした冒頭曲の内容から流通面で問題視されたが、ジャンルの到達点として今も評価される。Metallicaは1986年のMaster of Puppetsで構成の複雑さと商業的成功を両立させたが、同年のツアー中にスウェーデンで移動用バスが横転し、ベーシストCliff Burtonが24歳で死亡した。ドイツではKreator、Sodom、Destruction（Tankardを加えて4組と数えることもある）が、より粗く暴力的な変種を発展させ、後のデスメタルとブラックメタルの母体となった。歌詞の主題は戦争、腐敗、不正、孤立、依存、政治への悲観などで、冷戦下の核戦争への恐怖などの社会背景も一因とされる。1990年代前半、Metallicaが1991年のアルバムで大衆化路線に転じたこと、そしてグランジの台頭により、シーンは急速に縮小したが、2000年代以降は当時を志向する若い世代のバンドが世界中に現れている。</p>
