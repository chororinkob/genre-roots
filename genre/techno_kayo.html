<h1>Techno Pop（テクノポップ）とは</h1>
<p>シンセサイザー・シーケンサー・ヴォコーダーといった電子楽器を土台に組み立てられたポップスで、「テクノロジーポップ」を縮めた和製の音楽用語である。1970年代末の日本で使われ始め、同じ電子音楽でも1980年代末以降のダンス音楽である</p>
<p>シンセサイザー・シーケンサー・ヴォコーダーといった電子楽器を土台に組み立てられたポップスで、「テクノロジーポップ」を縮めた和製の音楽用語である。1970年代末の日本で使われ始め、同じ電子音楽でも1980年代末以降のダンス音楽である「テクノ」とは別のものを指す。英語圏でいうシンセポップとほぼ重なる領域を扱うが、日本ではこの呼び名のほうが先に定着した。

音の骨格を決めるのはシーケンサーである。Roland MC-4やMC-8といった機械に演奏を打ち込み、人の手では出せない均一な粒立ちでフレーズを反復させる。このゆらぎのなさを欠点として隠すのではなく、むしろ前面に出して魅力に変えたところがこの音楽の要点になる。リズムはTR-808やCR-78などのリズムマシンが担い、四つ打ちや8ビートを寸分違わず刻む。音色はProphet-5、Roland Jupiter、Yamaha CS-80などの当時のシンセが作る矩形波・鋸波の硬いリード、金属的なベルの音、無機質なシンセベースが中心で、家庭用ゲーム機を思わせる高い電子音が効果的に差し込まれる。

歌唱にも同じ考え方が及ぶ。ヴォコーダーで声を電子的に加工したり、感情を込めない平板な発声を選んだりして、人間らしさをあえて薄める。その一方で旋律はきわめて明快で、3分から4分の短いポップスの形式が保たれる。難解さを目指した音楽ではなく、口ずさめる歌を電子音で作るという姿勢が一貫している。

歌詞や世界観にはロボット、都市、コンピュータ、宇宙、東洋趣味といった主題が繰り返し現れ、しばしば冗談やパロディの調子を伴う。この「軽さ」は単なる作風ではなく、1960年代から1970年代前半の文化が抱えていた重さや暗さから離れるための方法だったという見方がある（美術評論家の椹木野衣が「黄色魔術」で論じている）。

編成の幅は広い。歌のないインストゥルメンタルを中心に据えるものから、演劇の身振りを持ち込んだもの、バンドの生演奏と電子音を同期させるものまであり、「電子楽器で作られた大衆的な音楽」という一点で括られている。</p>
<h2>成り立ち</h2><p>言葉としての始まりは1978年である。大阪で『ロック・マガジン』を発行していた音楽評論家の阿木譲が、クラフトワークのアルバム『人間解体』の批評でこの語を用いたのが初出とされる。この造語を気に入った坂本龍一がさまざまな媒体で使ったことで一般に広まった、といわれている。一方で細野晴臣は1981年のインタビューで「勝手に『テクノ・ポップ』という言葉で僕らを規定されてもねえ」と述べており、呼ばれる側が必ずしもこの名前を受け入れていたわけではない。

言葉の定着には時間がかかった。1980年5月刊行の『NEW MUSIC\'81 ニューミュージック事典』では、ヒカシューやP-MODELについては「テクノポップ」と書かれているのに、YMOは「1980年代のサウンド・リーダー」と紹介されるだけでテクノポップとは捉えられていない。この時点では音楽業界の側もまだ手探りだったことがうかがえる。

音のほうの起点は1978年に細野晴臣・坂本龍一・高橋幸宏が結成したイエロー・マジック・オーケストラで、1979年のアルバム『ソリッド・ステイト・サヴァイヴァー』が国内外で成功したことにより、シンセサイザーとシーケンサーの音が一気に大衆のものになった。このYMOブームに続く存在として、同じ1979年にP-MODEL・ヒカシュー・プラスチックスの三組が「テクノ御三家」として紹介される。ただし三組はYMOから派生したのではなく、源流はまったく別々だった。P-MODELは平沢進が高校時代から続けていたプログレッシブ・ロックのバンド、マンドレイクが電子音とバンドの演奏を同期させる形に転じたもの。ヒカシューは演劇畑の巻上公一を中心に劇団から転じて1978年に生まれた。プラスチックスは1976年に立花ハジメらファッションデザイナーによって結成されている。

ヒカシューの巻上公一は、YMOと御三家の違いをこう説明している。YMOは松武秀樹が機材の設定を担当し、業務用の機材をリースして使っていたのに対し、御三家は自分たちで買える機材を揃えて全部自分たちでやっていた。両者はライバルのような関係で、当時はインタビューで互いに悪口を言い合っていたという。

ブームの周辺には、近田春夫がプロデュースしたジューシィ・フルーツ、小川美潮が在籍したチャクラ、土屋昌巳の一風堂、あがた森魚が率いたヴァージンVSなどがいた。中核となったのはYMOや戸川純が所属したアルファレコードの¥ENレーベルである。

この流れの中から、アイドルや芸能人がテクノポップ調の伴奏で歌う作品群も生まれた。歌謡界で最も早くシンセドラムを使ったのはピンク・レディー「サウスポー」（1978年）とされ、筒美京平が初めて手がけたのは榊原郁恵「ROBOT」（1980年）だった。1981年のイモ欽トリオ「ハイスクールララバイ」はミリオンセラーとなっている。これらは後年になって「テクノ歌謡」と呼ばれ、1980年代前後の歌謡曲やアイドル曲を発掘・再評価する概念として整理された。つまりテクノ歌謡はテクノポップと同じものではなく、その中から生まれた一つの見方である。

呼び名は海外にも渡った。来日したクラフトワークがこの言葉を気に入り、1983年に『TECHNO POP』と題したアルバムを予定したがお蔵入りとなり、1986年に『エレクトリック・カフェ』と改題して発表された。同じ頃、欧米ではゲイリー・ニューマン、ヒューマン・リーグ、ソフト・セル、オーケストラル・マヌーヴァーズ・イン・ザ・ダーク、ユーリズミックスらが「シンセ・ポップ」としてヒットを重ねている。

1985年ごろ、第二次バンドブームの影響で主流の座から降りる。テクノポップでデビューしたPSY・Sは早々にロックバンドの音へ転じ、TM NETWORKやaccessのように「シンセサイザーを駆使しているがテクノポップとは異なる」音楽が現れた。一方でインディーズの側では、ケラが率いた有頂天やナゴムレコードの周辺で電子音の色が濃い作品が作られ続けた。また同時期に家庭用ゲーム機が普及し、1985年にはアルファレコードが初のゲーム音楽専門レーベルとしてG.M.O.レコードを設立するなど、この分野の人材がゲーム音楽へ流れていった。

1990年代は雌伏の時期にあたる。電子音楽の主流はケン・イシイや石野卓球が担ったテクノへ移り、テクノポップは渋谷系の内側で細々と作られるにとどまった。潮目が変わるのは1998年で、コンピレーション『東京NEW WAVE OF NEW WAVE \'98』によって東京の一部で起きていた動きが総括され、MOTOCOMPOらを軸に21世紀型のテクノポップが形になっていく。

決定的だったのは中田ヤスタカがプロデュースしたPerfumeである。インディーズ時代にジューシィ・フルーツ「ジェニーはご機嫌ななめ」をカバーしていた彼女たちは、2007年の「ポリリズム」がコマーシャルに起用されて広く知られ、2008年のアルバム『GAME』で、テクノポップ・ユニットと呼ばれる存在としてはYMO以来四半世紀ぶりにオリコン週間1位を記録した。この第二次ブームからはAira MitsukiやSweet Vacationなど多くの後続が現れ、「キラキラ系」「ピコピコ系」といった呼び分けも生まれた。

その後はパソコンでの音楽制作の普及とVOCALOIDの登場により、ラップトップ1台で制作が完結するようになり、2010年代のインターネット発の音楽シーンへ地続きにつながっていく。2011年にはきゃりーぱみゅぱみゅ「PONPONPON」が動画サイトを通じて国外にも届き、この系譜の音楽が世界的に聴かれる入口になった。</p>
