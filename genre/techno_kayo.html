<h1>Techno Pop（テクノポップ）とは</h1>
<p>テクノポップは、シンセサイザー・シーケンサー・ヴォコーダーといった電子楽器を土台に組み立てたポップスだ。名前は「テクノロジーポップ」を縮めた、日本生まれの音楽用語である。1970年代末の日本で使われ始めた。同じ電子音楽でも、198</p>
<p>テクノポップは、シンセサイザー・シーケンサー・ヴォコーダーといった電子楽器を土台に組み立てたポップスだ。名前は「テクノロジーポップ」を縮めた、日本生まれの音楽用語である。1970年代末の日本で使われ始めた。同じ電子音楽でも、1980年代末以降のダンス音楽である「テクノ」とは別のものを指す。英語圏でシンセポップやエレクトロ・ポップと呼ばれた領域に近い。

音の土台を決めるのはシーケンサーだ。Roland MC-4やMC-8といった機械に演奏を打ち込み、人の手では出せない均一な音の粒で、フレーズをくり返させる。この揺れのなさを欠点として隠さず、前面に出して魅力に変えた。そこが、この音楽のポイントになる。

音色は、Prophet-5、Roland Jupiter、Yamaha CS-80など当時のシンセが作る音が中心だ。矩形波・鋸波の硬いリード、金属的なベルの音、無機質なシンセベースが並ぶ。そこに、家庭用ゲーム機を思わせる高い電子音が効果的に差し込まれる。

リズムはTR-808やCR-78などのリズムマシンが受け持つ。四つ打ちや8ビートを、寸分の狂いもなく刻む。

歌い方にも同じ考え方が及ぶ。ヴォコーダーで声を電子的に加工したり、感情を込めない平板な発声を選んだりして、人間らしさをわざと薄める。その一方で、メロディーはとても分かりやすい。3分から4分の短いポップスの形も保たれる。難しさを目指した音楽ではない。口ずさめる歌を電子音で作るという姿勢が、一貫している。

歌詞や世界観には、ロボット、都市、コンピュータ、宇宙、東洋趣味といったテーマが繰り返し出てくる。冗談やパロディの調子を伴うことも多い。この「軽さ」は単なる作風ではなく、1960年代から1970年代前半の文化が抱えていた重さや暗さから離れるための方法だった、という見方がある（美術評論家の椹木野衣が「黄色魔術」で論じている）。

編成の幅は広い。歌のないインストゥルメンタルを中心にするもの、演劇の身振りを持ち込んだもの、バンドの生演奏と電子音を同期させるものまである。それらが「電子楽器で作られた大衆的な音楽」という一点でまとめられている。</p>
<h2>成り立ち</h2><p>言葉としての始まりは、1978年である。大阪で『ロック・マガジン』を出していた音楽評論家の阿木譲が、クラフトワークのアルバム『人間解体』の批評でこの語を使った。これが初出とされるが、諸説ある。この造語を気に入った坂本龍一が、さまざまな媒体で使ったことで一般に広まった、といわれている。一方で細野晴臣は、1981年のインタビューで「勝手に『テクノ・ポップ』という言葉で僕らを規定されてもねえ」と語っている。呼ばれる側が、必ずしもこの名前を受け入れていたわけではない。

言葉が定着するには時間がかかった。1980年5月に出た『NEW MUSIC\'81 ニューミュージック事典』では、ヒカシューやP-MODELは「テクノポップ」と書かれている。ところがYMOは「1980年代のサウンド・リーダー」と紹介されるだけで、テクノポップとは捉えられていない。この時点では、音楽業界の側もまだ手探りだったことが分かる。

ブームの牽引役は、1978年に細野晴臣・坂本龍一・高橋幸宏が結成したイエロー・マジック・オーケストラだ。1979年のアルバム『ソリッド・ステイト・サヴァイヴァー』が国内外で成功し、シンセサイザーとシーケンサーの音は一気に大衆のものになった。

このYMOブームに続く存在として、同じ1979年に、P-MODEL・ヒカシュー・プラスチックスの三組が「テクノ御三家」として紹介される。ただし三組はYMOから枝分かれしたのではなく、源流はまったく別々だった。P-MODELは、平沢進の、1973年結成のマンドレイク（当初はHR/HM志向、のちプログレッシブ・ロックへ転向）が前身で、電子音とバンドの演奏を同期させる形に変わったもの。ヒカシューは、演劇畑の巻上公一を中心に、劇団から変わって1978年に生まれた。プラスチックスは、1976年にイラストレーター、グラフィックデザイナー、ファッションスタイリストらによって結成されている。

ヒカシューの巻上公一は、YMOと御三家の違いをこう説明している。YMOは松武秀樹が機材の設定を受け持ち、業務用の機材をリースして使っていた。これに対して御三家は、自分たちで買える機材をそろえ、全部自分たちでやっていた。両者はライバルのような関係で、当時はインタビューで互いに悪口を言い合っていたという。

ブームの周りには、近田春夫がプロデュースしたジューシィ・フルーツ、小川美潮がいたチャクラ、土屋昌巳の一風堂、あがた森魚が率いたヴァージンVSなどがいた。中心になったのは、YMOや戸川純が所属したアルファレコードの¥ENレーベルである。

この流れの中から、アイドルや芸能人がテクノポップ調の伴奏で歌う作品も生まれた。ピンク・レディー「サウスポー」（1978年）は、歌謡界でシンセドラムを使った最も初期のものの一つとされる。筒美京平が初めて手がけたテクノ歌謡は、榊原郁恵「ROBOT」（1980年）だった。1981年のイモ欽トリオ「ハイスクールララバイ」は、ミリオンセラーになっている。

これらは後年になって「テクノ歌謡」と呼ばれ、1980年代前後の歌謡曲やアイドル曲を発掘・再評価する概念として整理された。つまりテクノ歌謡は、テクノポップと同じものではない。1980年代前後の歌謡曲のうち、YMO周辺のテクノポップ系アーティストが関わった作品を、後年（1990年代）にDJ・リスナーが発掘・再評価する中で生まれた概念である。

呼び名は海外にも渡った。クラフトワークのアルバムは1982年初めから制作が始まり、仮の題は『Technicolor』、のちに『Techno Pop』だった。事故などで遅れ、1986年10月27日に『Electric Café』として発売された。2009年のリマスター版から、『Techno Pop』に題が改められている。同じ頃、欧米ではゲイリー・ニューマン、ヒューマン・リーグ、ソフト・セル、オーケストラル・マヌーヴァーズ・イン・ザ・ダーク、ユーリズミックスらが「シンセ・ポップ」としてヒットを重ねていた。

しかし1980年代後半〜1990年代前半の第二次バンドブームの影響で、テクノポップは主流の座から降りる。テクノポップでデビューしたPSY・Sは、早々にロックバンドの音へ変わった。TM NETWORKやaccessのように「シンセサイザーを駆使しているがテクノポップとは異なる」音楽も現れた（TM NETWORKは1984年デビュー、accessは1992年結成・デビュー）。

一方、インディーズの側では、ケラが率いた有頂天やナゴムレコードの周りで、電子音の色が濃い作品が作られ続けた。また同じ時期に家庭用ゲーム機が広まった。1986年にはアルファレコードが、日本初のゲームミュージック専門レーベルとしてG.M.O.レコードを設立する。このように、この分野の人材がゲーム音楽へ流れていった。

1990年代は、力をためて機会を待つ時期にあたる。電子音楽の主流は、ケン・イシイや石野卓球が担ったテクノへ移った。テクノポップは、渋谷系の内側で細々と作られるだけになった。流れが変わるのは1998年だ。コンピレーション『東京NEW WAVE OF NEW WAVE \'98』が、東京の一部で起きていた動きをまとめた。MOTOCOMPOらを軸に、21世紀型のテクノポップが形になっていく。

決め手になったのは、中田ヤスタカがプロデュースしたPerfumeである。彼女たちはインディーズ時代に、ジューシィ・フルーツ「ジェニーはご機嫌ななめ」をカバーしていた。2007年の「ポリリズム」がコマーシャルに使われて広く知られる。2008年のアルバム『GAME』では、テクノポップ・ユニットと呼ばれる存在としてはYMO以来、四半世紀ぶりにオリコン週間1位になった。この第二次ブームからは、Aira MitsukiやSweet Vacationなど多くの後に続く人たちが現れた。「キラキラ系」「ピコピコ系」といった呼び分けも生まれた。

その後、パソコンでの音楽制作が広まり、VOCALOIDも登場した。ラップトップ1台で制作が完結するようになり、2010年代のインターネット発の音楽シーンへ地続きにつながっていく。2011年には、きゃりーぱみゅぱみゅ「PONPONPON」が動画サイトを通じて国外にも届き、世界的な注目を集めた。</p>
