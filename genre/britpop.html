<h1>Britpop（ブリットポップ）とは</h1>
<p>1990年代半ばのイギリスで、意識的に自国の音楽的伝統を参照して作られたギター・ロック。編成はギター二本、ベース、ドラムという簡素な構成が基本で、そこにピアノやオルガン、時に管楽器や弦楽が加わる。音色は米国のグランジのような濁った</p>
<p>1990年代半ばのイギリスで、意識的に自国の音楽的伝統を参照して作られたギター・ロック。編成はギター二本、ベース、ドラムという簡素な構成が基本で、そこにピアノやオルガン、時に管楽器や弦楽が加わる。音色は米国のグランジのような濁った歪みを避け、輪郭のはっきりした中音域を持つ。旋律は最重要の要素で、1960年代のThe BeatlesやThe Kinksを思わせる、口ずさめる明快な線が書かれる。和声も同様に、機能和声の枠内で意外性のある借用和音を用いる書法が好まれ、とりわけ長調の中に一瞬の陰りを差し込む手法が定番となった。曲構成はヴァースとコーラスの明快な交替で、コーラスは大合唱を前提に設計され、しばしば言葉を伸ばす部分が用意される。歌唱の特徴は発音にあり、米国風の発音を意図的に避け、ロンドンやマンチェスターの訛りをそのまま用いる。歌詞は英国の日常、階級、郊外の生活、若者の倦怠を、具体的な固有名詞を交えて描く。全体として、米国発の音楽に対して自国の文化を対置するという姿勢が、音の隅々にまで及んでいる。</p>
<h2>成り立ち</h2><p>直接の前史は1980年代末から1990年代初頭のマンチェスターで、The Stone RosesとHappy Mondaysがダンス音楽とギター・ロックを結合させたマッドチェスターの流行がある。しかしこの動きは1990年代前半に失速し、代わって米国のグランジが英国の若者を席巻した。この状況への反発として、自国の伝統に回帰する動きが生まれた。1993年から1994年にかけて、SuedeとBlurが先陣を切り、とりわけBlurが1994年に発表したParklifeは、英国の日常を諷刺的に描く歌詞と1960年代的な旋律により、この動きの基調を定めた。同時期、マンチェスター郊外出身のOasisが1994年のDefinitely Maybeで登場し、Noel Gallagherの単純で力強い曲と、弟Liam Gallagherの挑発的な態度により、労働者階級の代弁者として爆発的な人気を得た。1995年8月、BlurとOasisが同じ日にシングルを発売するという事態が起き、報道機関はこれを英国の階級と地域の対立として煽り立てた。テレビの全国ニュースで扱われるほどの騒動となり、この週はBlurが勝ったが、アルバムの売上では最終的にOasisが圧倒した。同時期にPulpのJarvis Cockerが1995年のCommon Peopleで階級の問題を鋭く歌い、Elastica、Supergrass、The Verveらが続いた。政治的な文脈も重要で、1997年に労働党のTony Blairが政権を取った際、彼はこの音楽の担い手を首相官邸に招き、クール・ブリタニアという国家的な文化戦略と結び付けた。しかしこの政治との接近はシーンの信用を損ない、また薬物と過剰な報道により中心人物たちが消耗した。1997年以降、Radioheadがより内省的な方向へ進んだこともあり、この動きは急速に終息した。</p>
<h2>代表曲</h2><ul><li>Wonderwall (Oasis)</li><li>Parklife (Blur)</li><li>Common People (Pulp)</li><li>Bittersweet Symphony (The Verve)</li><li>Girls &amp; Boys (Blur)</li></ul>
