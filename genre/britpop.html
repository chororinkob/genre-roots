<h1>Britpop（ブリットポップ）とは</h1>
<p>1990年代半ばのイギリスで、意識的に自国の音楽的伝統を参照して作られたギター・ロック。編成はギター2本、ベース、ドラムという簡素な構成が基本で、そこにピアノやオルガン、時に管楽器や弦楽が加わる。音色はバンドごとに差があり、Oas</p>
<p>1990年代半ばのイギリスで、意識的に自国の音楽的伝統を参照して作られたギター・ロック。編成はギター2本、ベース、ドラムという簡素な構成が基本で、そこにピアノやオルガン、時に管楽器や弦楽が加わる。音色はバンドごとに差があり、Oasisのように強く歪ませたギターを何本も重ねる例もある。グランジの暗い歌詞や音の景色との対比で語られることが多い。旋律は最重要の要素で、1960年代のThe BeatlesやThe Kinksを思わせる、口ずさめる明快な線が書かれる。曲構成はヴァースとコーラスの明快な交替で、口ずさめるフックのあるコーラスが中心である。歌唱の特徴は発音にあり、米国風の発音を意図的に避け、ロンドンやマンチェスターなど英国各地の訛りを前面に出す（Blurのダミアン・アルバーンのように、労働者階級のロンドン訛りを模した例もある）。歌詞は英国の日常、階級、郊外の生活、若者の倦怠を、具体的な固有名詞を交えて描く。全体として、歌詞やイメージ戦略を中心に、自国の文化を前面に出した音楽である。</p>
<h2>成り立ち</h2><p>直接の前史は1980年代末から1990年代初頭のマンチェスターで、The Stone RosesとHappy Mondaysがダンス音楽とギター・ロックを結合させたマッドチェスターの流行がある。しかしこの動きは1990年代前半に失速し、代わって米国のグランジが英国の若者を席巻した。この状況への反動と見なされる形で、自国の伝統に回帰する動きが生まれた。起点には1992年春説と1993年説があるが、1993年から1994年にかけて、SuedeとBlurが先陣を切り、とりわけBlurが1994年に発表したParklifeは、英国の日常を諷刺的に描く歌詞と1960年代的な旋律により、この動きを決定づけた作品の一つとされる。前作の1993年のModern Life Is Rubbishから、英国的な美学への転換は始まっていた。同時期、マンチェスター郊外出身のOasisが1994年のDefinitely Maybeで登場し、Noel Gallagherの単純で力強い曲と、弟Liam Gallagherの挑発的な態度により、労働者階級の代弁者として爆発的な人気を得た。1995年8月、BlurとOasisが同じ日にシングルを発売するという事態が起き、報道機関はこれを英国の階級と地域の対立として煽り立てた。テレビの全国ニュースで扱われるほどの騒動となり、この週はBlurが勝ったが、アルバムの売上では最終的にOasisが圧倒した。同時期にPulpのJarvis Cockerが1995年のCommon Peopleで階級の問題を鋭く歌い、Elastica、Supergrassらが続き、Britpop期には見過ごされていたThe Verveが、1997年の『Urban Hymns』で成功し、Britpopの終わりとその後の流れに位置づけられる。政治的な文脈も重要で、1997年に労働党のTony Blairが政権を取ると、同年7月には首相官邸で創造産業の著名人を招く催しが開かれ、Oasisのノエルも出席した。政権は創造産業の振興と並行して、メディアが広めた「クール・ブリタニア」の呼称にも乗った。しかしこの政権との接近は批判も招いた。また、薬物と過剰な報道により中心人物たちが消耗した。1997年以降、Oasisの『Be Here Now』の評価の低下やダイアナ元妃の死、BlurやPulpの内省的な作風への転換など、複数の要因が重なり、この動きは急速に終息した。</p>
