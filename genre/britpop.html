<h1>Britpop（ブリットポップ）とは</h1>
<p>ブリットポップは、1990年代半ばのイギリスで生まれたギター・ロックだ。自国の音楽の伝統を、意識して参照しながら作られた。 編成はギター2本、ベース、ドラムという簡素な形が多い。そこにピアノやオルガンが加わり、時には管楽器や弦楽も</p>
<p>ブリットポップは、1990年代半ばのイギリスで生まれたギター・ロックだ。自国の音楽の伝統を、意識して参照しながら作られた。

編成はギター2本、ベース、ドラムという簡素な形が多い。そこにピアノやオルガンが加わり、時には管楽器や弦楽も入る。音色はバンドごとに差があり、一括りにはできない。Oasisは強い歪みと重ね録りの「音の壁」で知られる。

旋律は最も重要な要素の一つだ。1960年代のThe BeatlesやThe Kinksを思わせる、口ずさめる明快な線が書かれる。和声も同様で、機能和声（和音ごとの役割で進行を決める仕組み）の枠の中で、意外性のある借用和音（別の調から借りてきた和音）を使う手法が使われることもあった。とりわけ、長調の中に一瞬の陰りを差し込む手法が目立つ曲もある。

曲の構成は、ヴァースとコーラスが明快に入れ替わる形だ。大合唱向きのコーラスが多い。

歌唱の特徴は発音にある。米国風の発音を意図的に避け、ロンドンやマンチェスターなど、英国各地の訛りを前面に出す。歌詞は、英国の日常、階級、郊外の生活、若者の倦怠を、具体的な固有名詞を交えて描く。全体として、歌詞やイメージ戦略を中心に、自国文化を前面に出した。</p>
<h2>成り立ち</h2><p>直接の前史は、1980年代末から1990年代初頭のマンチェスターにある。The Stone RosesとHappy Mondaysが、ダンス音楽とギター・ロックを結び付けた。この流れはマッドチェスターと呼ばれて流行した。しかし、この動きは1990年代前半に失速した。代わって米国のグランジが、英国の若者を席巻した。

その中で、自国の伝統に立ち返る動きが生まれ、グランジへの反動と見なされた。起点には1992年春説と1993年説がある。1993年から1994年にかけて、SuedeとBlurが先陣を切った。とりわけBlurが1994年に発表したParklifeは、英国の日常を諷刺的に描く歌詞と1960年代的な旋律により、Britpopを決定づけた作品の一つとされる。

同じ時期に、マンチェスター郊外出身のOasisが、1994年のDefinitely Maybeで登場した。Noel Gallagherの単純で力強い曲と、弟Liam Gallagherの挑発的な態度により、労働者階級の代弁者として爆発的な人気を得た。

1995年8月、BlurとOasisが同じ日にシングルを発売するという事態が起きた。報道機関は、これを英国の階級と地域の対立として煽り立てた。テレビの全国ニュースで扱われるほどの騒動となった。この週はBlurが勝ったが、アルバムの売上では、最終的にOasisが圧倒した。

同じ時期に、PulpのJarvis Cockerが、1995年のCommon Peopleで階級の問題を鋭く歌った。Elastica、Supergrassらが続いた。Britpop期に見過ごされていたThe Verveが、『Urban Hymns』（1997年9月29日）で成功し、Britpop終焉とポスト・ブリットポップの流れに位置づけられる。

政治の流れも重要だった。1997年に労働党のTony Blairが政権を取った。1997年7月30日、官邸で創造産業の著名人を招く催しが開かれ、Noel Gallagherも出席した。政権は、創造産業の振興と並行して、メディアが広めた「クール・ブリタニア」の呼称にも乗った。しかしこの政権との接近が批判を招き、また薬物と過剰な報道により、中心人物たちが消耗したとも言われる。

1997年以降、複数の要因が重なった。Oasisの『Be Here Now』の評価の低下、ダイアナ元妃の死、BlurやPulpの内省的な作風への転換などだ。この動きは急速に終息した。</p>
