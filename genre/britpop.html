<h1>Britpop（ブリットポップ）とは</h1>
<p>1990年代半ばのイギリスで、意識的に自国の音楽的伝統を参照して作られたギター・ロック。編成はギター2本、ベース、ドラムという簡素な構成が基本で、そこにピアノやオルガン、時に管楽器や弦楽が加わる。音色はバンドごとに差がある。Oas</p>
<p>1990年代半ばのイギリスで、意識的に自国の音楽的伝統を参照して作られたギター・ロック。編成はギター2本、ベース、ドラムという簡素な構成が基本で、そこにピアノやオルガン、時に管楽器や弦楽が加わる。音色はバンドごとに差がある。Oasisは、強くゆがませたギターを何本も重ねて「音の壁」（音を厚く重ねて、壁のように聞かせる録音）を作ることで知られ、一方で明るくきらきらした音のバンドもいる。Britpopをグランジへの反動と見る人は、グランジの歌詞や音の雰囲気の暗さとの対比をあげる。旋律は最重要の要素で、1960年代のThe BeatlesやThe Kinksを思わせる、口ずさめる明快な線が書かれる。曲構成はヴァースとコーラスの明快な交替で、コーラスは大合唱に向いたものが多い。歌唱の特徴は発音にあり、米国風の発音を意図的に避け、ロンドンやマンチェスターなど、英国各地の訛りを前面に出す。ただしBlurのDamon Albarnが使うロンドン訛りは、労働者階級の話し方をまねたもの（mockneyと呼ばれる）とされる。歌詞は英国の日常、階級、郊外の生活、若者の倦怠を、具体的な固有名詞を交えて描く。全体として、歌詞やイメージ作りを中心に、自国の文化を前面に出している。</p>
<h2>成り立ち</h2><p>直接の前史は1980年代末から1990年代初頭のマンチェスターで、The Stone RosesとHappy Mondaysがダンス音楽とギター・ロックを結合させたマッドチェスターの流行がある。しかしこの動きは1990年代前半に失速し、代わって米国のグランジが英国の若者を席巻した。この状況への反動として、自分の国の昔ながらの音楽に目を向け直す動きが出たと見られている。起点には諸説がある。John Harrisは、BlurのPopsceneとSuedeのThe Drownersが出た1992年春を起点にあげ、Stuart Maconieが記事でBritpopという言葉を使った1993年4月を起点にする見方もある。いずれにせよ、1993年から1994年にかけて、SuedeとBlurが先陣を切り、とりわけBlurが1994年に発表したParklifeは、英国の日常を諷刺的に描く歌詞と1960年代的な旋律により、Britpopという流行を決定的にした作品の一つとされる。Blurは、その前の1993年のアルバム『Modern Life Is Rubbish』から、すでに英国らしさを前面に出していた。同時期、マンチェスター郊外出身のOasisが1994年のDefinitely Maybeで登場し、Noel Gallagherの単純で力強い曲と、弟Liam Gallagherの挑発的な態度により、労働者階級の代弁者として爆発的な人気を得た。1995年8月、BlurとOasisが同じ日にシングルを発売するという事態が起き、報道機関はこれを英国の階級と地域の対立として煽り立てた。テレビの全国ニュースで扱われるほどの騒動となり、この週はBlurが勝ったが、アルバムの売上では最終的にOasisが圧倒した。同時期にPulpのJarvis Cockerが1995年のCommon Peopleで階級の問題を鋭く歌い、Elastica、Supergrassらが続いた。The Verveは、Britpopの時期には見過ごされていたが、1997年9月29日発売の『Urban Hymns』で成功した。このアルバムは、Britpopの終わりと、そのあとの流れ（ポスト・ブリットポップ）につながった作品とされる。政治的な文脈も重要で、1997年に労働党のTony Blairが政権を取った。同じ年の7月30日、首相官邸で、俳優や美術、ファッションなど幅広い分野の有名人を招く催しが開かれ、BritpopからはNoel Gallagherが出席した。政権は創造産業の振興と並行して、メディアが広めた「クール・ブリタニア」の呼称にも乗った。しかし政権と親しくしたことには批判が集まり、また薬物と過剰な報道により中心人物たちが消耗した。1997年以降、Oasisの『Be Here Now』の評価の低下やダイアナ元妃の死、BlurやPulpの内省的な作風への転換など、複数の要因が重なり、この動きは急速に終息した。</p>
