<h1>Italo Disco（イタロディスコ）とは</h1>
<p>1980年代前半のイタリアで作られた、シンセサイザー中心のディスコ。BPMは115〜130前後で、四つ打ちのキックの上に、アナログ・シンセの太い単音ベースと、きらめくアルペジオ（分散和音を高速で往復させる音型）が重なる。使用機材は</p>
<p>1980年代前半のイタリアで作られた、シンセサイザー中心のディスコ。BPMは115〜130前後で、四つ打ちのキックの上に、アナログ・シンセの太い単音ベースと、きらめくアルペジオ（分散和音を高速で往復させる音型）が重なる。使用機材はRoland のJuno-60やJupiter-8、Korg のPolysix、リズムはTR-808やLinnDrum が定番で、手弾きの生楽器はほぼ入らない。最大の特徴は旋律の性格で、短調を多用しながらも悲壮ではなく、どこか安っぽく人懐こい、玩具のような明るさを持つ。歌唱は英語だが、作り手の多くがイタリア人であるため文法や発音が独特で、意味が通らない歌詞がかえって異国情緒として機能した。ボコーダーやピッチシフトで加工したロボット声の掛け合いも定番。曲構成は12インチ盤向けに引き伸ばされ、長いイントロ、間奏でのシンセ・ソロ、繰り返されるフックという型を守る。アメリカのディスコが生バンドの熱量とオーケストラの厚みで作られていたのに対し、イタロ・ディスコは少人数のスタジオで機材だけを使って安価に作られており、その手作り感と過剰なロマンチシズムが独特の魅力になっている。夏の海辺のディスコ、そしてヨーロッパ各地の地方クラブの音である。</p>
<h2>成り立ち</h2><p>1970年代末から1980年代初頭のイタリア、とりわけミラノとボローニャ周辺で成立した。前史として、ミュンヘンでイタリア人のGiorgio Moroder がDonna Summer と作ったシンセ主体のディスコ（1977年のI Feel Love）が、イタリア国内の制作者に「バンドを雇わずシンセだけでディスコが作れる」という道筋を示した。国内で先陣を切ったのはボローニャのプロデューサーClaudio Simonetti とその周辺で、彼はホラー映画の音楽で知られるバンドGoblin の一員でもあった。決定的な作品としては、1982年のGazebo のI Like Chopin（Pierluigi Giombini 制作）、1983年のRyan Paris のDolce Vita、同年のBaltimora のTarzan Boy、Righeira のVamos a la Playa などが挙げられる。名称そのものは1983年、西ドイツのレーベルZYX Records の創業者Bernhard Mikulski が編集盤The Best of Italo Disco を出した際に商業的な呼称として定着させたもので、イタリア国内では当初単に「ディスコ」と呼ばれていた。ZYX を通じてドイツ、オランダ、北欧、そして東側諸国にまで大量に輸出され、とりわけソ連や東欧では西側の音楽として熱烈に受け入れられ、後のソヴィエトウェイヴやユーロディスコの土壌となった。制作体制は特徴的で、少数のプロデューサーが多数の変名ユニットを立ち上げ、ジャケットのモデルと歌手が別人ということも珍しくなかった。この使い捨て的な量産体制は1980年代半ばに飽和を招き、ジャンルとしては1988年前後に急速に衰退する。しかし1990年代のユーロビート、ユーロダンス、2000年代のエレクトロクラッシュ、2010年代のイタロ・リヴァイヴァルとナイト・ドライヴ系シンセウェイヴへと、繰り返し掘り返されて再評価されており、レコード収集家の間では今も高値で取引される分野である。</p>
<h2>代表曲</h2><ul><li>I Like Chopin (Gazebo)</li><li>Tarzan Boy (Baltimora)</li><li>Self Control (Raf)</li><li>Boys (Summertime Love) (Sabrina)</li><li>Future Brain (Den Harrow)</li></ul>
