<h1>Italo Disco（イタロディスコ）とは</h1>
<p>イタロ・ディスコは、1970年代末に前史があり、1980年代初頭にイタリアで形成された、シンセサイザー中心のディスコだ。 中心になるのは、アナログ・シンセの太い単音ベースだ。使う機材は、RolandのJuno-60、KorgのPo</p>
<p>イタロ・ディスコは、1970年代末に前史があり、1980年代初頭にイタリアで形成された、シンセサイザー中心のディスコだ。

中心になるのは、アナログ・シンセの太い単音ベースだ。使う機材は、RolandのJuno-60、KorgのPolysixがよく使われる。編成は、1983年までにほぼ電子楽器中心になった。

その上に、きらめくアルペジオ（分散和音を高速で往復させる音型）が重なる。大きな特徴は旋律の性格だ。短調を多用しながらも悲壮ではなく、どこか安っぽく人懐こい、玩具のような明るさを持つとも言われる。

BPMは115〜130前後のものが多く、四つ打ちのキックが土台になる。リズムはTR-808やLinnDrumがよく使われる。

ボコーダー（声を機械的な音色に変える装置）やピッチシフト（音の高さを変える処理）で加工した、ロボット声の掛け合いもしばしば用いられた。

歌詞は主に英語で、イタリア語・スペイン語の曲もある。作り手の多くがイタリア人であるため、文法や発音が独特だ。意味が通らない歌詞が、かえって異国情緒として機能したとも言われる。

曲は、12インチ・シングルで流通するものが多く、拡張ミックスも作られた。アメリカのディスコは、生バンドの熱量とオーケストラの厚みで作られていた。これに対してイタロ・ディスコは、初期は生楽器とシンセを併用し、少人数で制作されることが多かった。その手作り感と過剰なロマンチシズムが、独特の魅力になっている。夏の海辺のディスコ、そしてヨーロッパ各地の地方クラブの音である。</p>
<h2>成り立ち</h2><p>舞台は、イタリアだ。1970年代末に前史があり、1980年代初頭に、このジャンルが形成された。ボローニャ、ローマ、ミラノなど、北中部の複数の都市で成立した。

前史にあたるのは、1977年のI Feel Loveだ。ミュンヘンでイタリア人のGiorgio MoroderがDonna Summerと作った、シンセ主体のディスコである。この曲は、イタリア国内の制作者に「バンドを雇わずシンセだけでディスコが作れる」という道筋を示したと見られる。

国内でこのジャンルに関わった人物に、Claudio Simonettiがいる。彼はホラー映画の音楽で知られるバンドGoblinの一員でもあった。関わったプロジェクトには、1978年のEasy Going、1979年のVivien Vee、1983年のCrazy Gangなどがある。

決定的な作品としては、次のような曲が挙げられる。1983年のGazeboのI Like Chopinは、Pierluigi Giombiniの制作だ。1983年のRyan ParisのDolce Vita、1985年のBaltimoraのTarzan Boy、1983年（5月5日）のRigheiraのVamos a la Playaも、その例である。

名称そのものは、西ドイツのレーベルZYX Recordsが、1982年からイタリアの音源を海外にライセンス（使用許可）契約を結んで販売し始める中で、創業者のBernhard Mikulskiが考案したとされる。ただし、信頼できる第三者資料では裏づけられていない。1983年の編集盤の名は「The Best of Italo-Disco」である。イタリア国内では、RAIの音楽番組Discoringで、「rock elettronico（電子ロック）」や「balli da discoteca（ディスコ向けの踊り）」と呼ばれていた。

イタロ・ディスコは、ドイツを中心に欧州で流通し、東欧では非公式経路（カセットの複製など）で広まり、熱狂的に受容された。ユーロディスコは同時代またはそれ以前の並行ジャンルで、ソヴィエトウェイヴとの直接の継承は断定できない。

制作体制は特徴的だった。少数のプロデューサーが、多数の変名（別名）ユニットを立ち上げた。ジャケットのモデルと歌手が別人ということも、珍しくなかった。

1980年代後半は商業化が進み、1990年代初頭に衰退して、ユーロビート、イタロ・ハウス、イタロ・ダンスに分化した。しかし、2000年前後から繰り返し再発見され、エレクトロクラッシュやシンセウェイヴなどの派生形も生んだ。レコード収集家の間では、今も高値で取引される分野である。</p>
