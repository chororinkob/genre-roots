<h1>Shibuya-keiとは</h1>
<p>1990年代の東京、渋谷を中心に生まれた、選び取った引用の趣味の良さそのものを音楽の核心に据えた一群である。単一の音の様式ではなく、参照する対象の選択に共通性がある点でまとまっている。参照されるのは、1960年代フランスの軽やかな</p>
<p>1990年代の東京、渋谷を中心に生まれた、選び取った引用の趣味の良さそのものを音楽の核心に据えた一群である。単一の音の様式ではなく、参照する対象の選択に共通性がある点でまとまっている。参照されるのは、1960年代フランスの軽やかな歌謡、ブラジルのボサノヴァ、Burt Bacharachのような洗練された作編曲、アメリカ西海岸の多層的な合唱、そしてイギリスの慎ましいギターポップである。これらを、サンプラーによる引用と生演奏の両方を用いて再構成する。和声は、傾向としてポップスにしては複雑なものが多く、四和音（4つの音を重ねた和音）や、和音の最低音を入れ替えた響き、次々に転調する進行が多用され、明るい表面の下に不安定さが潜む。リズムは打ち込みによる軽い刻みや、ボサノヴァ由来の跳ねた型が好まれる傾向があり、テンポは中庸で、力任せに躍動させることはしない。歌唱は感情を込めて張り上げず、囁くような、あるいは平坦な発声が選ばれることが多く、時に上手い下手が問われないことすらある。歌詞は日本語、英語、フランス語が混ざり、意味の伝達より語感が優先される。加えて、レコードの意匠、写真、書体といった視覚表現が音と同格に扱われ、作品全体がひとつの美意識の提示として組み立てられている。</p>
<h2>成り立ち</h2><p>この呼称は音楽家が名乗ったものではなく、由来には諸説ある(HMV渋谷のコーナー説、1991年夏の高浪敬太郎の発言説、1993年の取材で生まれたとする説、田中宗一郎が1993年12月号で揶揄を込めて命名したとする説)。1990年前後の渋谷には、大型の外資系レコード店と個人経営の専門店が密集し、世界中の音楽が同じ棚に並ぶという特異な環境があった。ここに通う若者たちは、時代も国籍も無視して自分の好みだけで音楽を選ぶという聴き方を身につけ、その感覚がそのまま制作へ折り返された。中心にいたのは、1987年にLollipop Sonicとして結成され、1989年にFlipper's Guitarと改名してデビューしたバンドである。のちに小山田圭吾と小沢健二の2人組となったこのバンドは、イギリスの当時の音楽を素早く取り込みながら、引用元を明示するかのような作り方で、参照の作法そのものを提示した。1991年の解散後、小山田はCorneliusとして音響的な実験を深め、1997年の作品では緻密な音の設計によって国際的な評価を得る。小沢健二は日本語の歌詞を追求する方向へ進んだ。もう一方の中心はPizzicato Fiveである。小西康陽が率いるこの集団は、1990年に野宮真貴を歌手に迎えて完成形に達し、1960年代の意匠を大胆に引用しながら、アメリカの独立系レーベルと契約して国外でも支持を得た。小山田が1992年に立ち上げたポリスター内のレーベルTrattoriaや、瀧見憲司によるCrue-L Recordsといったレーベルが、この感覚を共有する作り手を集めた。Kahimi Karieのような、囁き声を武器とする歌手もこの文脈から現れている。この動きの特異性は、当時の日本が消費社会の絶頂にあり、輸入盤も情報も潤沢に手に入る一方で、世界の音楽産業の中心からは外れた位置にあったという条件から生まれた点にある。ピークは1994年頃とされ、1990年代後半には中心人物の解散や他の音楽への移行が進み、シーンは拡散していった。加えて2021年、小山田圭吾が1990年代の雑誌上で青少年期の深刻ないじめを面白がって語っていた記事が広く知られるところとなり、東京での国際的な催しの音楽担当を辞任するに至った。この出来事は、当時のこの界隈が持っていた、悪趣味さえも洒落として消費する態度の危うさを、後年になって突きつけるものとなった。</p>
