<h1>Shibuya-keiとは</h1>
<p>1990年代の東京、渋谷を中心に生まれた、選び取った引用の趣味の良さそのものを音楽の核心に据えた一群である。単一の音の様式ではなく、参照する対象の選択に共通性がある点でまとまっている。参照されるのは、1960年代フランスの軽やかな</p>
<p>1990年代の東京、渋谷を中心に生まれた、選び取った引用の趣味の良さそのものを音楽の核心に据えた一群である。単一の音の様式ではなく、参照する対象の選択に共通性がある点でまとまっている。参照されるのは、1960年代フランスの軽やかな歌謡、ブラジルのボサノヴァ、Burt Bacharachのような洗練された作編曲、アメリカ西海岸の多層的な合唱、そしてイギリスの慎ましいギターポップである。これらを、サンプラーによる引用と生演奏の両方を用いて再構成する。和声はポップスとしては極めて複雑で、四和音や、根音を移し替えた響き、次々に転調する進行が多用され、明るい表面の下に不安定さが潜む。リズムは打ち込みによる軽い刻みや、ボサノヴァ由来の跳ねた型が好まれ、テンポは中庸で、力任せに躍動させることはしない。歌唱は感情を込めて張り上げず、囁くような、あるいは平坦な発声が選ばれ、時に技術的な巧拙が問われないことすらある。歌詞は日本語、英語、フランス語が混ざり、意味の伝達より語感が優先される。加えて、レコードの意匠、写真、書体といった視覚表現が音と同格に扱われ、作品全体がひとつの美意識の提示として組み立てられている。</p>
<h2>成り立ち</h2><p>この呼称は音楽家が名乗ったものではなく、渋谷の輸入レコード店の売り場の分類として生まれた。1990年前後の渋谷には、大型の外資系レコード店と個人経営の専門店が密集し、世界中の音楽が同じ棚に並ぶという特異な環境があった。ここに通う若者たちは、時代も国籍も無視して自分の好みだけで音楽を選ぶという聴き方を身につけ、その感覚がそのまま制作へ折り返された。中心にいたのは、1989年に活動を始めたFlipper's Guitarである。小山田圭吾と小沢健二によるこの二人組は、イギリスの当時の音楽を素早く取り込みながら、引用元を明示するかのような作り方で、参照の作法そのものを提示した。1991年の解散後、小山田はCorneliusとして音響的な実験を深め、1997年の作品では緻密な音の設計によって国際的な評価を得る。小沢健二は日本語の歌詞を追求する方向へ進んだ。もう一方の中心はPizzicato Fiveである。小西康陽が率いるこの集団は、1990年に野宮真貴を歌手に迎えて完成形に達し、1960年代の意匠を大胆に引用しながら、アメリカの独立系レーベルと契約して国外でも支持を得た。小山田が1991年に立ち上げたTrattoriaや、瀧見憲司によるCrue-L Recordsといった小規模なレーベルが、この感覚を共有する作り手を集めた。Kahimi Karieのような、囁き声を武器とする歌手もこの文脈から現れている。この動きの特異性は、当時の日本が消費社会の絶頂にあり、輸入盤も情報も潤沢に手に入る一方で、世界の音楽産業からは周縁に位置していたという条件から生まれた点にある。1990年代末には、バブル経済の崩壊が生活実感に及び、こうした軽やかな消費の美学は次第に力を失った。加えて2021年、小山田圭吾が1990年代の雑誌上で過去の同級生への深刻ないじめを面白がって語っていた記事が広く知られるところとなり、東京での国際的な催しの音楽担当を辞任するに至った。この出来事は、当時のこの界隈が持っていた、悪趣味さえも洒落として消費する態度の危うさを、後年になって突きつけるものとなった。</p>
