<h1>Shibuya-keiとは</h1>
<p>渋谷系は、1990年代の東京、渋谷を中心に生まれた、選び取った引用の趣味の良さそのものを音楽の核心に据えた一群だ。単一の音のスタイルではなく、参照する対象の選び方に共通点があることでまとまっている。 参照されるのは、1960年代フ</p>
<p>渋谷系は、1990年代の東京、渋谷を中心に生まれた、選び取った引用の趣味の良さそのものを音楽の核心に据えた一群だ。単一の音のスタイルではなく、参照する対象の選び方に共通点があることでまとまっている。

参照されるのは、1960年代フランスの軽やかな歌謡、ブラジルのボサノヴァ、Burt Bacharachのような洗練された作編曲、アメリカ西海岸の多層的な合唱、そしてイギリスの慎ましいギターポップである。これらを、サンプラーによる引用と生演奏の両方を使って組み立て直す。

和声は、アーティストによっては、ポップスにしては複雑なものもある。四和音（4つの音を重ねた和音）や、和音の最低音を入れ替えた響き、次々に転調する進行が使われることもあり、明るい表面の下に不安定さが潜む。

リズムは、アーティストによっては、打ち込みによる軽い刻みや、ボサノヴァ由来の跳ねた型が見られる。

共通点は「オシャレ」「力まない歌声」「メインストリームとの絶妙な距離感」とされる。歌詞は作品ごとに異なる。

加えて、レコードのデザイン、写真、書体といった視覚表現が、音と同じ重さで扱われる。作品全体がひとつの美意識を示すものとして組み立てられている。</p>
<h2>成り立ち</h2><p>1990年前後の渋谷には、大型の外資系レコード店と個人経営の専門店が密集していた。世界中の音楽が同じ棚に並ぶという、特別な環境があった。

ここに通う若者たちは、時代も国籍も無視して自分の好みだけで音楽を選ぶという聴き方を身につけた。その感覚は、そのまま制作へ折り返された。

中心にいたのは、1987年にLollipop Sonicとして結成され、1989年にFlipper's Guitarと改名してデビューしたバンドである。のちに小山田圭吾と小沢健二の2人組となったこのバンドは、イギリスの当時の音楽を素早く取り込み、アメリカ文学やソフトロックの要素も指摘される中で、引用元を示すかのような作り方で、参照の作法そのものを見せた。1991年の解散後、小山田はCorneliusとして音響的な実験を深め、1997年の作品では緻密な音の設計によって国際的な評価を得る。小沢健二は、日本語の歌詞を追求する方向へ進んだとされる。

もう一方の中心はPizzicato Fiveである。小西康陽が率いるこの集団は、1990年に野宮真貴を歌手に迎えて完成形に達した。1960年代のデザインを大胆に引用しながら、アメリカの独立系レーベルと契約して、国外でも支持を得た。

1992年に牧村憲一の命によりポリスター内に発足し、小山田が総合プロデュースを担ったレーベルTrattoriaや、瀧見憲司によるCrue-L Recordsといったレーベルが、この感覚を共有する作り手を集めた。Kahimi Karieのような、囁き声を武器とする歌手も、この流れから現れている。

この呼称は音楽家が名乗ったものではなく、由来には諸説あり、定説はない(HMV渋谷のコーナー説、1991年夏の高浪敬太郎の発言説、1993年の取材で生まれたとする説、1993年に田中宗一郎が「宇田川町の外資系CDショップを中心とした半径数百メートルで流通する音楽」を揶揄する意図で命名したとされる説)。

好景気を背景に輸入盤が入手しやすかったことが土壌になったと指摘される。佐々木敦はピークを1994年頃としており、1990年代後半にかけて、解散や他の音楽への移行が現れ、シーンは拡散・消滅した。

加えて2021年、『ROCKIN'ON JAPAN』1994年1月号と『Quick Japan』第3号（1995年8月1日発行）での過去の発言が2021年7月に問題視され、東京五輪の開会式の音楽担当を7月19日に辞任した。この出来事は、当時のこの界隈が持っていた、悪趣味さえも洒落として消費する態度の危うさを、後年になって突きつけたと見る向きもある。</p>
