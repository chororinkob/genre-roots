<h1>Deep House（ディープハウス）とは</h1>
<p>ハウスの四つ打ちの骨格に、ジャズとソウルの和声（コードの響き）を持ち込んだ穏やかな系統。最大の識別点は和音の質で、単純な三和音（基本の3音の和音）ではなくメジャーセブンス、マイナーナインス、13thといった付加音（響きに厚みや色合</p>
<p>ハウスの四つ打ちの骨格に、ジャズとソウルの和声（コードの響き）を持ち込んだ穏やかな系統。最大の識別点は和音の質で、単純な三和音（基本の3音の和音）ではなくメジャーセブンス、マイナーナインス、13thといった付加音（響きに厚みや色合いを足す音）を含む和音を使い、その響きが柔らかく濁ることで独特の温かさが生まれる。Fender Rhodesのエレクトリックピアノ、Wurlitzer、ハモンドオルガン、そしてこれらを模したシンセ音色が中心に置かれ、アタック（音の出だし）を弱めて長く伸ばす奏法で鳴らされる。テンポは110〜125BPMとハウスの中では遅めで、キックは前に出すぎないよう低域に沈め、ハイハットやシェイカーの細かい刻みで推進力を作る。ベースは抑えめの音で、ルート音（和音の土台の音）だけでなく経過音（音をつなぐ短い音）を含む歌うようなラインを弾くことがある。パーカッションにはコンガ、ボンゴ、シェイカーといったラテン系の楽器が加わることが多い。ヴォーカルは入る場合ソウルやゴスペル由来の伸びやかな歌唱か、あるいは語りに近い断片で、深いリヴァーブ（残響効果）をかけて背景に沈められる。構成はドラマティックな展開を避け、8小節または16小節の単位で要素を静かに入れ替えながら6分から10分続く。歌詞は愛、自省、都市の夜、居場所を求める気持ちを扱う。テックハウスと比べて機械的な硬さがなく、ガラージやソウルフル・ハウスとは重なる部分が大きい。</p>
<h2>成り立ち</h2><p>1980年代半ば（1985〜86年）にシカゴで成立した。ニューヨークやニュージャージーでは、並行してガラージ系の深い歌ものが発展した。中心人物はシカゴのLarry Heardで、Mr. Fingersの名義で、1986年に発表した「Can You Feel It」と、1985年に発表した「Mystery of Love」が原点とされる。Heardはもともとドラマーで、17歳でジャズ・フュージョンのカバーバンド（他人の曲を演奏するバンド）Infinityのドラマーとなり、家ではジャズやMotownを聴いて育った。Roland Jupiter-6とTR-707を購入し、初日の夜に「Mystery of Love」と「Washing Machine」の2曲を作った。彼の作品は、ハウスを知らないまま作った曲が結果的に洗練された別の方向性を示したもので、豊かな和声と余白を持ち、その静けさが強い印象を残した。しかしHeard自身もTrax Recordsとの契約でほとんど収入を得られず、2020年にTrax Recordsを未払い印税で提訴した。ニューヨーク側では、Paradise GarageのLarry Levanが築いたガラージの美学が土台になった。Levanは1977年（84 King Street Garageとして開業し、1978年1月にParadise Garageと改称）から1987年までParadise Garageで、ソウル、ディスコ、レゲエ、ロックまで含む選曲と、自ら音響設備を調整する執念で伝説となったが、薬物依存が進み1992年に38歳で心不全により死去した。この系譜からKerri Chandler、Blaze、Masters at Work(Little Louie VegaとKenny Dope)が続き、ニュージャージーではTony Humphriesがクラブ Zanzibarを拠点に、より歌もの寄りのガラージ・ハウスを育てた。1990年代にはイギリスでも受容が進み、ロンドンのレーベルNuphonicなどが独自の解釈を加えた。日本でも、制作者が1980年代のハウスの誕生期から取り組み、1990年代初頭にはSoichi TeradaのFar Eastレーベルがあり、のちにMule Musiqなどで国際的な評価を得た。2013〜2014年前後、この名称は大きな混乱に見舞われる。イギリスで、ベース・ミュージックやUKガラージ寄りの、より商業的でポップな楽曲がディープ・ハウスと呼ばれるようになり、Duke Dumont、Disclosure、Route 94といったアーティストが商業的成功を収めた。さらに2010年代半ば以降、様々なベースライン主体のハウスが「ディープ」と呼ばれ、元来の意味と大きくかけ離れた。この事態は、2010年代半ばから後半にかけて「ディープ」の名が不適切に使われている、という批判を生んだ。以後、原型に近い系統を「ソウルフル」などと呼んで区別する動きもある。近年は情報媒体のDeep House Amsterdamのほか、Rush Hour(オランダ)がディープハウスやデトロイト系の作品の再発や紹介を行い、Music From Memoryが埋もれた電子音楽を再発し、Larry Heardは2010年代後半に再評価を受けて世界各地で公演を行っている。</p>
