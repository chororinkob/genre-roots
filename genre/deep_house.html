<h1>Deep House（ディープハウス）とは</h1>
<p>ディープ・ハウスは、ハウスの四つ打ちの骨格に、ジャズとソウルの和声（コードの響き）を持ち込んだ穏やかな系統だ。 最大の識別点は和音の質にある。単純な三和音（基本の3音の和音）ではなく、メジャーセブンス、マイナーナインス、13thと</p>
<p>ディープ・ハウスは、ハウスの四つ打ちの骨格に、ジャズとソウルの和声（コードの響き）を持ち込んだ穏やかな系統だ。

最大の識別点は和音の質にある。単純な三和音（基本の3音の和音）ではなく、メジャーセブンス、マイナーナインス、13thといった付加音（響きに厚みや色合いを足す音）を含む和音を使う。その響きが柔らかく濁ることで、独特の温かさが生まれる。中心に置かれるのは、Fender Rhodesのエレクトリックピアノ、Wurlitzer、ハモンドオルガン、そしてこれらを模したシンセ音色だ。アタック（音の出だし）を弱めて長く伸ばす奏法で鳴らされる。

テンポは110〜125BPMで、ハウスの中では遅めだ。キックは前に出すぎないよう低域に沈め、ハイハットやシェイカーの細かい刻みで推進力を作る。ベースは抑えめの音で、ルート音（和音の土台の音）だけでなく経過音（音をつなぐ短い音）を含む、歌うようなラインを弾く。しばしば拍の頭を外して置かれる。パーカッションには、コンガ、ボンゴ、シェイカーといったラテン系の楽器が加わることが多い。

ヴォーカルは、入る場合、ソウルやゴスペル由来の伸びやかな歌唱か、語りに近い断片になる。深いリヴァーブ（残響効果）をかけて、背景に沈められる。歌詞は、愛、自省、都市の夜、居場所を求める気持ちを扱うことが多い。

曲の構成は、ドラマティックな展開を避ける。8小節または16小節の単位で、要素を静かに入れ替えながら、6分から10分ほど続くことが多い。テックハウスと比べると機械的な硬さがなく、ガラージやソウルフル・ハウスとは重なる部分が大きい。</p>
<h2>成り立ち</h2><p>舞台は1980年代半ば（1985〜86年）のシカゴだ。ここでディープ・ハウスは成立した。ニューヨークやニュージャージーでは、並行してガラージ系の深い歌ものが発展した。

最も広く起点として挙げられるのは、シカゴのLarry Heardだ。Mr. Fingersの名義で、1986年に発表した「Can You Feel It」と、制作は1984年、発売は1985年の「Mystery of Love」が原点とされる。Heardはもともとドラマーで、17歳でジャズ・フュージョンのカバーバンド（他人の曲を演奏するバンド）Infinityのドラマーとなった。家ではジャズやMotownを聴いて育った。Roland Jupiter-6とTR-707を購入し、同じ日に「Mystery of Love」と「Washing Machine」の2曲を作った。ハウスを知らないまま作った曲が、結果的に洗練された別の方向性を示した。

しかしHeard自身も、Trax Recordsとの契約でほとんど収入を得られなかったと主張している。2020年には、Trax Recordsを未払い印税で提訴した（2022年に和解）。

一方、ニューヨーク側では、Paradise GarageのLarry Levanが築いたガラージの美学が土台になった。Levanは1977年（84 King Street Garageとして開業し、1978年1月にParadise Garageと改称）から1987年まで、Paradise Garageで活動した。ソウル、ディスコ、レゲエ、ロックまで含む選曲と、自ら音響設備を調整する執念で伝説となった。だが薬物依存が進み、1992年に38歳で、心内膜炎に起因する心不全により死去した。

この系譜から、Kerri Chandler、Blaze、Masters at Work(Little Louie VegaとKenny Dope)が続いた。ニュージャージーでは、Tony Humphriesがクラブ Zanzibarを拠点に、より歌もの寄りのガラージ・ハウスを育てた。1990年代にはイギリスでも受容が進み、ロンドンのレーベルNuphonicが独自の解釈を加えた。日本では、1980〜90年代から制作が始まり、Mule Musiqなどで国際的な評価を得た。

2013〜2014年前後、この名称は大きな混乱に見舞われる。イギリスで、ベース・ミュージックやUKガラージ寄りの商業的でポップな楽曲が、ディープ・ハウスと呼ばれるようになった。Duke Dumont、Disclosure、Route 94といったアーティストが、商業的成功を収めた。さらに2010年代半ば以降、様々なベースライン主体のハウスが「ディープ」と呼ばれ、元来の意味と大きくかけ離れた。この事態は、2010年代半ばから後半にかけて、「ディープ」の名が不適切に使われている、という批判を生んだ。以後、原型に近い系統を「ソウルフル」などと呼んで区別する動きもある。

近年は、情報媒体のDeep House Amsterdamのほか、再発事業を行うRush Hour(オランダ)はディープハウス/デトロイト系の再発や紹介を、Music From Memoryは埋もれた電子音楽の再発を行っている。Larry Heardは2010年代後半に再評価を受けて、世界各地で公演を行っている。</p>
