<h1>Deep House（ディープハウス）とは</h1>
<p>ハウスの四つ打ちの骨格に、ジャズとソウルの和声を持ち込んだ穏やかな系統。最大の識別点は和音の質で、単純な三和音ではなくメジャーセブンス、マイナーナインス、13thといった付加音を含む和音を使い、その響きが柔らかく濁ることで独特の温</p>
<p>ハウスの四つ打ちの骨格に、ジャズとソウルの和声を持ち込んだ穏やかな系統。最大の識別点は和音の質で、単純な三和音ではなくメジャーセブンス、マイナーナインス、13thといった付加音を含む和音を使い、その響きが柔らかく濁ることで独特の温かさが生まれる。Fender Rhodesのエレクトリックピアノ、Wurlitzer、ハモンドオルガン、そしてこれらを模したシンセ音色が中心に置かれ、アタックを弱めて長く伸ばす奏法で鳴らされる。テンポは110〜125BPMとハウスの中では遅めで、キックは前に出すぎないよう低域に沈め、ハイハットやシェイカーの細かい刻みで推進力を作る。ベースはシンセの丸い正弦波に近い音で、ルート音だけでなく経過音を含む歌うようなラインを弾き、しばしば拍の頭を外して置かれる。パーカッションにはコンガ、ボンゴ、シェイカーといったラテン系の楽器が加わることが多い。ヴォーカルは入る場合ソウルやゴスペル由来の伸びやかな歌唱か、あるいは語りに近い断片で、深いリヴァーブをかけて背景に沈められる。構成はドラマティックな展開を避け、8小節または16小節の単位で要素を静かに入れ替えながら6分から10分続く。歌詞は愛、自省、都市の夜、居場所を求める気持ちを扱う。テックハウスと比べて機械的な硬さがなく、ガラージやソウルフル・ハウスとは重なる部分が大きい。</p>
<h2>成り立ち</h2><p>1980年代後半のシカゴとニューヨークで、初期ハウスの粗さに対する応答として生まれた。中心人物はシカゴのLarry Heardで、Mr. Fingersの名義で1986年に発表した「Can You Feel It」と「Mystery of Love」が原点とされる。Heardはもともとドラマーで、ジャズ・フュージョンとプログレッシブ・ロックを聴いて育った。Roland Juno-6とTR-707を手に入れた初日に作ったのが「Mystery of Love」だったと本人が語っている。彼の作品は当時のシカゴの荒々しいアシッド・ハウスとは対照的に、豊かな和声と余白を持ち、その静けさが逆に強い印象を残した。しかしHeard自身もTrax Recordsとの契約でほとんど収入を得られず、長く音楽業界への不信を口にしている。ニューヨーク側では、Paradise GarageのLarry Levanが築いたガラージの美学が土台になった。Levanは1977年から1987年までParadise Garageで、ソウル、ディスコ、レゲエ、ロックまで含む選曲と、自ら音響設備を調整する執念で伝説となったが、薬物依存が進み1992年に38歳で心不全により死去した。この系譜からKerri Chandler、Blaze、Masters at Work(Little Louie VegaとKenny Dope)が続き、ニュージャージーではTony Humphriesがクラブ Zanzibarを拠点に、より歌もの寄りのガラージ・ハウスを育てた。1990年代にはイギリスでも受容が進み、ロンドンのレーベルNuphonicやパリのRoule、そしてドイツのCompostが独自の解釈を加えた。日本では2000年代にかけてクラブ文化の中で定着した。2010年前後、この名称は大きな混乱に見舞われる。イギリスやオーストラリアで、EDMの派生としてより商業的でテンポの速いポップな楽曲がディープ・ハウスと呼ばれるようになり、Duke Dumont、Disclosure、Route 94といったアーティストが商業的成功を収めた。さらに2014年前後には、いわゆるトロピカル・ハウスやフューチャー・ハウスまでもがこの名で括られ、元来の意味と大きく乖離した。この事態にLarry Heardは公然と不快感を示し、自分たちが作ったものとは無関係だと繰り返し発言している。以後、原型の系統は「クラシック・ディープ・ハウス」「ソウルフル・ハウス」と呼び分けられることが多い。近年はDeep House Amsterdam、Rush Hour(オランダ)、Music From Memoryといったレーベルや再発事業が原点の作品を掘り起こし、Larry Heardは2010年代後半に再評価を受けて世界各地で公演を行っている。</p>
