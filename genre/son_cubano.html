<h1>Son Cubano（ソン・クバーノ）とは</h1>
<p>ソン・クバーノは、キューバ東部の農村で生まれたとされる、歌と踊りのスタイルだ(ハバナでの形成を重視する説もある)。サルサの土台となり、ほかのラテン音楽にも大きな影響を与えた。 編成の基本は、複弦を三組張った小型の弦楽器トレス、ギタ</p>
<p>ソン・クバーノは、キューバ東部の農村で生まれたとされる、歌と踊りのスタイルだ(ハバナでの形成を重視する説もある)。サルサの土台となり、ほかのラテン音楽にも大きな影響を与えた。

編成の基本は、複弦を三組張った小型の弦楽器トレス、ギター、低音を担うマリンブラかコントラバス、そしてボンゴ、マラカス、クラーベという打楽器群である。後に金管楽器が加えられた。

なによりも大切な要素は、クラーベと呼ばれるリズムの型だ。2本の木の棒を打ち合わせて刻まれる。2小節を一組として、片方の小節に三つ、もう片方に二つの打点を置く。左右対称ではない並べ方であり、この型が曲全体の時間の骨組みを決める。演奏者は全員がこの型に従う。小節ごとに、拍に乗るフレーズとシンコペートしたフレーズが交互に現れる構造を作る。

低音の弾き方も独特だ。拍の頭を鳴らさず、拍の直前に先取りして置く(アンティシペーテッド・ベース)。そのため、全体が前へ引っぱられるような勢いが生まれる。

曲は二部構成である。前半では、旋律のはっきりした歌が歌われる。後半では、短い定型句を合唱が繰り返す。その上で、独唱者が即興で歌詞を作って応答する。この掛け合いへ移る後半部分こそが本領だ。演奏は熱を帯び、踊りに合わせて長く続けることもできる。</p>
<h2>成り立ち</h2><p>伝統的には、発祥はキューバ東部のオリエンテ地方で、時期は19世紀後半とされる(ハバナでの形成を重視する説もある)。この地域では、スペイン系入植者が持ち込んだ弦楽器と歌の形式が、日常的に打楽器とリズムの体系と接していた。その体系を保っていたのは、中央・南部アフリカ(バントゥー系)から奴隷として連行された人々である。

ソンは、その混ざり合いから生まれたものだ。ヨーロッパ由来の和声と旋律の上に、アフリカ由来の反復と掛け合いの構造を載せたものと説明されることが多い。ただしPeter Manuelは、2部構成、クラーベ、短い歌の反復部などの特徴が、1850〜60年代のハバナのコントラダンサにすでにあったと論じている。

20世紀初頭、農村から首都ハバナへ人口が流れ込み、この音楽も都市へ移った。しかし当初は、中流・上流層に見下された。政府が不道徳を理由に禁止しようとしたという記述もある。

転機は1920年代である。ラジオ放送と録音産業が発達し、Sexteto Habaneroのような編成が広く聴かれるようになった。1927年にはコルネット(トランペット)を加えた7人編成が登場し、音に華やかさが加わった。同じ1927年には、Ignacio PiñeiroがSexteto Nacionalという楽団を結成し、数々の名曲を残した。この楽団を率いたのは1933〜35年までで、資料により異なる。

『El Manisero』は、Moisés Simons作曲の曲で、最初の録音はRita Montanerである。1930年にニューヨークでRCA Victorに録音されたDon AzpiazúとHavana Casino Orchestraの版は、歌がAntonio Machínで、100万枚を超えた。これが米欧の「ルンバ熱」の発端になり、この音楽は国際的に知られ始める。

1940年代から1950年代のハバナは、アメリカからの観光客と賭博産業で沸き返っていた。そこでArsenio Rodríguezという盲目のトレス奏者が、編成を拡大してコンガを加え、より力強い形へ作り替えた。彼の革新は、後のサルサの直接のもとになる。

しかし1959年の革命により、多くの音楽家が国外へ去った。1960年代初めのアメリカの対キューバ禁輸措置(国交断絶は1961年1月)により、米国市場でのキューバ音楽の流通は大きく制約された。ニューヨークへ渡ったキューバとプエルトリコの音楽家たちは、このスタイルを土台にサルサを作り上げた。

1996年3月に録音され、1997年に発売された作品が、ブエナ・ビスタ・ソシアル・クラブである。World CircuitのNick Gold企画、Juan de Marcos González指揮、アメリカの音楽家Ry Cooderのプロデュースで、一部は長く引退していた高齢の演奏家を加えた。世界的な大成功を収め、この音楽は再び国際的な脚光を浴びた。ただしこの現象には、キューバの現役の音楽家を差し置いて過去のみが理想化されたという批判も存在する。</p>
