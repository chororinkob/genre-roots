<h1>Son Cubano（ソン・クバーノ）とは</h1>
<p>キューバ東部の農村で生まれ、後のラテン音楽のほぼ全ての土台となった歌と踊りの様式である。決定的な要素はクラーベと呼ばれるリズムの型で、二本の木の棒を打ち合わせて刻まれる。二小節を一組として、片方の小節に三つ、もう片方に二つの打点を</p>
<p>キューバ東部の農村で生まれ、後のラテン音楽のほぼ全ての土台となった歌と踊りの様式である。決定的な要素はクラーベと呼ばれるリズムの型で、二本の木の棒を打ち合わせて刻まれる。二小節を一組として、片方の小節に三つ、もう片方に二つの打点を置くという非対称な配置を持ち、この型が曲全体の時間の骨格を決める。演奏者は全員がこの見えない枠に従い、拍の表と裏のどちらに重心を置くかもこれによって定まる。編成は、複弦を三組張った小型の弦楽器トレス、ギター、低音を担うマリンブラかコントラバス、そしてボンゴ、マラカス、クラーベという打楽器群が基本で、後に金管楽器が加えられた。曲は二部構成を取り、前半では旋律のはっきりした歌が歌われ、後半では短い定型句を合唱が繰り返す上で、独唱者が即興で歌詞を作って応答する掛け合いへ移る。この後半部分こそが本領で、演奏は熱を帯び、打楽器の密度が増し、踊り手の反応次第で何十分でも続けられる。低音の弾き方も独特で、拍の頭を鳴らさず、その手前や後ろへずらして置くため、全体が前へ引っ張られるような推進力が生まれる。</p>
<h2>成り立ち</h2><p>発祥はキューバ東部のオリエンテ地方、時期は19世紀後半とされる。この地域は、スペイン系入植者が持ち込んだ弦楽器と歌の形式と、西アフリカから奴隷として連行された人々が保持した打楽器とリズムの体系が、日常的に接触する場だった。ソンはその混淆の産物であり、ヨーロッパ由来の和声と旋律の上に、アフリカ由来の反復と掛け合いの構造を載せたものである。20世紀初頭、農村から首都ハバナへ人口が流入するとともにこの音楽も都市へ移ったが、当初は上流階級から野蛮で下品なものとして忌避され、一時は警察による取り締まりの対象にすらなった。転機は1920年代である。ラジオ放送と録音産業の発達により、Sexteto Habaneroのような編成が広く聴かれるようになり、1927年にはトランペットを加えた七人編成が登場して、音に華やかさが加わった。1930年代にはIgnacio Piñeiroが率いた楽団が、後に世界中で歌われることになる楽曲を残し、この音楽は国際的に知られ始める。1940年代から1950年代のハバナは、アメリカからの観光客と賭博産業で沸き返っており、Arsenio Rodríguezという盲目のトレス奏者が編成を拡大してコンガを加え、より力強い形へ改造した。彼の革新は後のサルサの直接の母体となる。しかし1959年の革命により、多くの音楽家が国外へ去り、アメリカとの国交断絶によってキューバ音楽の国際的な流通は途絶えた。ニューヨークへ渡ったキューバとプエルトリコの音楽家たちは、この様式を土台にサルサを作り上げるが、その源流がキューバにあることは長らく正当に語られなかった。1997年、アメリカの音楽家Ry Cooderが、引退していた高齢の演奏家たちを集めて録音した作品ブエナ・ビスタ・ソシアル・クラブが世界的な大成功を収め、この音楽は再び国際的な脚光を浴びた。ただしこの現象については、キューバの現役の音楽家を差し置いて過去のみが理想化されたという批判も存在する。</p>
