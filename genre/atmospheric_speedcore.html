<h1>Atmospheric Speedcore（アトモスフェリックスピードコア）とは</h1>
<p>アトモスフェリック・スピードコアは、スピードコアのキックドラムを、アンビエントの広大な残響の空間の中に置いた音楽だ。スピードコアの一般的な目安は300 BPM以上で、上は600 BPM前後までだ。このジャンルならではの速さの範囲に</p>
<p>アトモスフェリック・スピードコアは、スピードコアのキックドラムを、アンビエントの広大な残響の空間の中に置いた音楽だ。スピードコアの一般的な目安は300 BPM以上で、上は600 BPM前後までだ。このジャンルならではの速さの範囲には、定説がない。

速さと静けさという相反する要素を同時に成り立たせるため、音の役割分担が独特だ。キックは、低い音域と中くらいの音域の、狭い帯域に収められることが多いとされる。その周りの広い空間を、ほかの音が埋める。長いリバーブ（残響を足す効果）をかけたパッド、持続する弦楽器風の和音、逆再生したシンセ、そして雨や風、都市の環境音を録音した素材だ。

パッドの和音進行はゆっくりで、キックが刻む極端な速さとの間に、時間感覚の落差が生まれることがある。この落差によって、聴き手は、激しく打ち鳴らされているのに走っている感じがしない、宙に浮いたような感覚に置かれる。

ドラムパターンは単調な連打が基本で、飾りはほとんど加えない。その代わりに、フィルター（音の帯域を削る装置）の開け閉めや、ディレイ（音を遅らせて繰り返す効果）の帰還量（繰り返しの量）を、長い時間をかけて変えていく。これで曲の展開を作る。

ミックスでは、中高域を丸めて耳に刺さる成分を削ることがあるとされる。

歌もサンプルの絶叫も、ほとんど使われない。10分を超える長い曲も珍しくない。DJ向きでありながら、反復の構造による瞑想的な性格もあわせ持つスピードコアである。</p>
<h2>成り立ち</h2><p>1990年代半ばのドイツのハードコアシーンには、単に速くするだけではない道を探る一群がいた。これらは、このジャンルの源流というより、同時代の関連シーンである。

その代表的な拠点が、ハンブルクのFischkopf Hamburg(通称Fischkopf)だ。実験的でありながら、ハードコアテクノでもある作品を出していた。1994年には、Alec EmpireらがロンドンでDigital Hardcore Recordingsを設立した(録音は主にベルリン)。ハードコア・パンクと電子音楽を組み合わせた、デジタル・ハードコアのレーベルである。

Christoph de Babalonは、ハンブルクのFischkopfからデビューした。1997年にDigital Hardcore Recordingsから発表したイフ・ユーアー・イントゥ・イット・アイム・アウト・オブ・イットは、ダークアンビエントとリズム主体の電子音楽を結びつけた作品として評価されている。ウェールズの兄弟によるSomatic Responsesは、Cross Fade Enter Tainmentや、Ant-Zen系列のHymen Recordsから作品を発表した。硬いリズムと繊細な音の響きを両立させる方向を、推し進めた。

1990年代後半、オンラインのトラッカー・シーンとドイツのUnited Speedcore Nationの周辺で、アンビエントとスピードコアの結びつきから、アトモスフェリック・スピードコアという語が生まれたという説がある。テンポの極端化が進むのと同じ時期に、アンビエントとの融合が生まれたのだ。

この呼び名は、ネットレーベル（インターネットで作品を配る小さなレーベル）の作品タグとして使われてきた。ただ、初期は12インチやCD-Rなど、物理的な媒体でも出ていた。無料配布が中心のネットレーベルが広がったのは、2000年代以降である。

現在はBandcampやSoundCloudなどで作品が発表されている。ドローンやダークアンビエント、さらにはブラックゲイズの聴き手とも緩やかに重なりながら、小さな規模で続けられているとされる。</p>
