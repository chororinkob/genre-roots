<h1>Atmospheric Speedcore（アトモスフェリックスピードコア）とは</h1>
<p>BPM 250から400を超えるスピードコアのキックドラムを、アンビエントの広大な残響空間の中に置いた音楽である。速度と静けさという相反する要素を同時に成立させるため、音の役割分担が独特で、キックは低域と中域のごく狭い帯域に押し込</p>
<p>BPM 250から400を超えるスピードコアのキックドラムを、アンビエントの広大な残響空間の中に置いた音楽である。速度と静けさという相反する要素を同時に成立させるため、音の役割分担が独特で、キックは低域と中域のごく狭い帯域に押し込められ、その周囲の広い空間を長いリバーブをかけたパッド、持続する弦楽器風の和音、逆再生したシンセ、雨や風、都市の環境音を録音した素材が埋める。パッドの和音進行は数十秒に一度しか動かず、キックが刻む極端な速さとの間に大きな時間感覚の落差が生じる。この落差によって、聴き手は激しく打ち鳴らされているのに走っている感じがしない、宙に浮いたような知覚に置かれる。ドラムパターンは単調な連打を基本とし、装飾はほとんど加えられず、代わりにフィルターの開閉やディレイの帰還量を長い時間をかけて変化させることで展開が作られる。ミックスでは中高域を意図的に丸め、耳に刺さる成分を削るため、同じ速度帯のテラーコアやスピードノイズと比べて音量を上げても疲れにくい。歌もサンプルの絶叫もほとんど使われず、10分を超える長尺の曲も珍しくない。踊るためではなく、ヘッドフォンで没入するために作られたスピードコアである。</p>
<h2>成り立ち</h2><p>1990年代半ば、ドイツのハードコアシーンには単なる高速化以外の道を探る一群がいた。象徴的な拠点はハンブルクのFischkopf Schallplattenで、荒々しいスピードコアと並んで、電子音響や実験音楽の語彙を持ち込んだ作品を出していた。もう一つの震源はベルリンで、Alec Empireが1994年に設立したDigital Hardcore Recordingsが、ハードコアテクノを政治的・美学的な武器として位置づけ直した。この周辺から現れたChristoph de Babalonが1997年に発表したイフ・ユーアー・イントゥ・イット・アイム・アウト・オブ・イットは、極端に速いブレイクビーツと、不吉に沈んだアンビエントの持続音を並置した作品として決定的な影響を残し、速さと静けさを同居させるという発想を後続へ手渡した。ウェールズの兄弟によるSomatic Responsesは、Fischkopfやドイツのアンビエント寄りレーベルHymen Recordsを通じて、硬質なリズムと繊細な音響を両立させる方向を推し進めた。2000年代に入ると、テンポの引き上げ競争に飽きたスピードコアの作り手たちが、あえて情感や空間性を持ち込む実験を始め、それがアトモスフェリック・スピードコアという緩やかな呼称でまとめられるようになる。この呼称もまたレーベル主導ではなく、ネットレーベルの作品タグやフォーラムの分類から自然に広まったものである。流通は当初から無償ダウンロードが中心で、金銭的な成功を初めから想定していない代わりに、10分を超える曲や商品にならない構成を自由に試すことができた。現在はBandcampやSoundCloudを主な発表の場とし、ドローンやダークアンビエント、さらにはブラックゲイズの聴き手とも緩やかに重なりながら、少人数の作家によって続けられている。</p>
