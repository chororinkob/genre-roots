<h1>Celtic Musicとは</h1>
<p>ケルト音楽は、アイルランド、スコットランド、ウェールズ、コーンウォール、マン島、フランスのブルターニュなどの伝統音楽を、アイルランド・スコットランドを中心に、緩くまとめた呼称である（スペインのガリシアなどは、ケルト的と主張されるこ</p>
<p>ケルト音楽は、アイルランド、スコットランド、ウェールズ、コーンウォール、マン島、フランスのブルターニュなどの伝統音楽を、アイルランド・スコットランドを中心に、緩くまとめた呼称である（スペインのガリシアなどは、ケルト的と主張されることもある地域）。

アイルランド・スコットランドでは、中核をなすのは踊りのための器楽曲で、拍子によって明確に分類される。6/8拍子のジグ、2拍子で細かく刻むリール、付点の効いたホーンパイプ、9/8拍子のスリップ・ジグ、スコットランドで発達した鋭く跳ねるストラススペイなどがある。演奏者は、これらを数曲つないで組にし、途切れずに演奏する。

楽器は、フィドル、肘のふいごで空気を送るイリアン・パイプ、ティン・ホイッスル、木製の横笛、山羊革を張った片面太鼓のボーラン、コンサーティーナ、ハープなどが用いられる。旋律楽器が中心で、和音の伴奏は限られていた（イリアン・パイプのレギュレーターは例外）。ギターやブズーキ（ギリシャ由来の撥弦楽器）による本格的な和音の伴奏は、20世紀に定着した。

旋律は、長調・短調に加え、教会旋法の名で呼ばれる音階（ドリア、ミクソリディアなど）も多用され、独特の浮遊感を生む。装飾が極めて重要だ。旋律音の上に一瞬だけ高い音を挟む切り（カット）、切り＋主要音＋下側の装飾音（タップ）を素早くつなぐ転がし（ロール）といった技法が、楽譜には書き切れない細かさで施される。

歌の側には、伴奏を一切付けず、装飾を凝らして自由な拍で歌う古いスタイルがある。これは古いスタイル（sean-nós＝古い流儀）と呼ばれ、起源は不明である。</p>
<h2>成り立ち</h2><p>この音楽は、特定の年に誕生したものではない。口伝えで、何百年も受け継がれてきた。ただし、現在私たちが耳にする形は、2度の大きな危機と復興を経て成立していると整理できる。

第一の危機は19世紀である。アイルランドでは、1845年から始まった大飢饉で約100万人が死亡した。100万人超が、北米やオーストラリアなどの国外へ逃れた。その結果、1841〜1871年に人口が20〜25%減少した。多くの担い手が国外へ移った。皮肉なことに、移住先の共同体が伝統を保存する器となり、後年アイルランド本国へ逆流することになる。スコットランドでは、1746年の敗戦後に、ハイランド衣装の禁止など、氏族制を弱める政策がとられた。

第二の局面は、20世紀半ばの復興である。アイルランドでは、1951年に伝統音楽の保存と普及を目的とする組織が設立され、各地で競演会が開かれるようになった。

作曲家Seán Ó Riadaは、1960年代に、ダンスホール、教区ホール、家庭の台所などで演奏されていた音楽を、コンサートホール向けに編曲し、伝統音楽の評価を大きく高めた。彼のもとにいた奏者たちが1962年頃に結成したThe Chieftainsは、Paddy Moloneyを中心に、半世紀にわたって国際的な活動を続けた。この音楽を世界へ知らしめた存在だ。

1972年に結成されたPlanxtyは、Christy Moore、Dónal Lunny、Andy Irvine、Liam O'Flynnという名手を揃えた。1960年代半ばに、Sweeney's MenのJohnny Moynihanがアイルランド伝統音楽に導入した、ギリシャ由来のブズーキを普及させるなど、大胆な改変を行った。それでも、伝統の核心を損なわない演奏で、若い世代を引き込んだ。

Clannad（1970年結成）、The Bothy Band（1975年（デビュー）／前身 Seachtar は1974年）、Altan（1987年結成）といったバンドも活動した。スコットランドではCapercaillieが活動した。ブルターニュでは、父Georges Cochevelouが復元したハープを受け、Alan Stivellが演奏と普及で復興を牽引した。1972年のパリでの公演によって、その音楽がフランス中に知られるようになった。

1994年、テレビ番組の幕間に上演された舞踊の演目「Riverdance」が、世界的な現象となった。この音楽は大衆的な知名度を獲得した。しかし同時に、商業化・単純化されているという批判も出た。現在も、各地で日常的に演奏される生きた伝統であり続けている。</p>
