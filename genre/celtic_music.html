<h1>Celtic Musicとは</h1>
<p>アイルランド、スコットランド、ウェールズ、フランスのブルターニュ、スペインのガリシアなど、ケルト系の言語文化圏に共通する伝統音楽の総称である。中核をなすのは踊りのための器楽曲で、拍子によって明確に分類される。6/8拍子のジグ、二拍</p>
<p>アイルランド、スコットランド、ウェールズ、フランスのブルターニュ、スペインのガリシアなど、ケルト系の言語文化圏に共通する伝統音楽の総称である。中核をなすのは踊りのための器楽曲で、拍子によって明確に分類される。6/8拍子のジグ、二拍子で細かく刻むリール、付点の効いたホーンパイプ、9/8拍子のスリップ・ジグ、スコットランド特有の鋭く跳ねるストラススペイなどがあり、演奏者はこれらを数曲つないで組にし、途切れずに演奏する。旋律は教会旋法、とりわけドリア旋法とミクソリディア旋法が多用され、長調でも短調でもない独特の浮遊感を生む。装飾が極めて重要で、主音の前後に一瞬だけ別の音を挟む切り、三つの装飾音で音を包む転がしといった技法が、楽譜には書き切れない細かさで施される。楽器はフィドル、肘のふいごで空気を送るイリアン・パイプ、ティン・ホイッスル、木製の横笛、山羊革を張った片面太鼓のボーラン、コンサーティーナ、ハープなどが用いられる。和音を担う楽器は伝統的には存在せず、20世紀にギターやブズーキが加えられた。歌の側には、伴奏を一切付けず、装飾を凝らして自由な拍で歌う古い様式があり、これは器楽以上に古層を伝えるものとされる。</p>
<h2>成り立ち</h2><p>この音楽は特定の年に誕生したものではなく、口伝えで何百年も受け継がれてきたものである。ただし現在私たちが耳にする形は、二度の大きな危機と復興を経て成立している。第一の危機は19世紀である。アイルランドでは1845年から始まった大飢饉によって人口の四分の一が失われ、さらに膨大な人々が北米やオーストラリアへ移住した。言語も音楽も担い手を失い、消滅の危機に瀕したが、皮肉なことに移住先の共同体が伝統を保存する器となり、後年アイルランド本国へ逆流することになる。スコットランドでは、1746年の敗戦後に高地の文化が抑圧された歴史が影を落としている。第二の局面は20世紀半ばの復興である。アイルランドでは1951年に伝統音楽の保存と普及を目的とする組織が設立され、各地で競演会が開かれるようになった。作曲家Seán Ó Riadaは1960年代に、それまで居酒屋で個々に演奏されていた伝統音楽を、室内楽のように編曲して舞台へ載せるという発想を持ち込み、伝統音楽の社会的地位を一変させた。彼のもとにいた奏者たちが1962年に結成したThe Chieftainsは、Paddy Moloneyを中心に半世紀にわたって国際的な活動を続け、この音楽を世界へ知らしめた。1972年に結成されたPlanxtyは、Christy Moore、Dónal Lunny、Andy Irvine、Liam O'Flynnという名手を揃え、ギリシャ由来のブズーキを導入するなど大胆な改変を行いながら、伝統の核心を損なわない演奏で若い世代を引き込んだ。The Bothy BandやClannad、Altanが続き、スコットランドではCapercaillieが、ブルターニュではAlan Stivellがハープの復興を主導して、1972年のパリでの公演によって同地の伝統音楽への関心を一気に高めた。1994年、テレビ番組の幕間に上演された舞踊の演目が世界的な現象となり、この音楽は大衆的な知名度を獲得したが、同時に観光向けに単純化され、感傷的に消費されているという批判も強まった。現在も各地で日常的に演奏される生きた伝統であり続けている。</p>
<h2>代表曲</h2><ul><li>The Foggy Dew (The Chieftains)</li><li>Fairytale of New York (The Pogues)</li><li>Caledonia (Dougie MacLean)</li><li>The Rocky Road to Dublin (The Dubliners)</li><li>Theme from Harry's Game (Clannad)</li></ul>
