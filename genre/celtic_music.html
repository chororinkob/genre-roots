<h1>Celtic Musicとは</h1>
<p>アイルランド、スコットランド、ウェールズ、コーンウォール、マン島、フランスのブルターニュなど、ケルト系の言語文化圏に共通する伝統音楽の総称である（スペインのガリシアなどは、ケルト的と主張されることもある地域）。中核をなすのは踊りの</p>
<p>アイルランド、スコットランド、ウェールズ、コーンウォール、マン島、フランスのブルターニュなど、ケルト系の言語文化圏に共通する伝統音楽の総称である（スペインのガリシアなどは、ケルト的と主張されることもある地域）。中核をなすのは踊りのための器楽曲で、拍子によって明確に分類される。6/8拍子のジグ、2拍子で細かく刻むリール、付点の効いたホーンパイプ、9/8拍子のスリップ・ジグ、スコットランド特有の鋭く跳ねるストラススペイなどがあり、演奏者はこれらを数曲つないで組にし、途切れずに演奏する。旋律は長調・短調に加え、中世の教会音楽に由来する旋法（音階の型）のドリア旋法やミクソリディア旋法も多用され、独特の浮遊感を生む。装飾が極めて重要で、曲の中心となる音（主音）の前後に一瞬だけ別の音を挟む切り、上下の装飾音で主音を挟む転がし（ロール）といった技法が、楽譜には書き切れない細かさで施される。楽器はフィドル、肘のふいごで空気を送るイリアン・パイプ、ティン・ホイッスル、木製の横笛、山羊革を張った片面太鼓のボーラン、コンサーティーナ、ハープなどが用いられる。旋律楽器が中心で、和音の伴奏は限られていた（イリアン・パイプのレギュレーターは例外）。ギターやブズーキ（ギリシャ由来の撥弦楽器）による本格的な和音の伴奏は20世紀に定着した。歌の側には、伴奏を一切付けず、装飾を凝らして自由な拍で歌う古い様式があり、これは器楽以上に古層を伝えるものとされる。</p>
<h2>成り立ち</h2><p>この音楽は特定の年に誕生したものではなく、口伝えで何百年も受け継がれてきたものである。ただし現在私たちが耳にする形は、2度の大きな危機と復興を経て成立している。第一の危機は19世紀である。アイルランドでは1845年から始まった大飢饉で約100万人が死亡し、100万人超が北米やオーストラリアなどの国外へ逃れ、その結果1841〜1871年に人口が20〜25%減少した。多くの担い手が国外へ移ったが、皮肉なことに移住先の共同体が伝統を保存する器となり、後年アイルランド本国へ逆流することになる。スコットランドでは、1746年の敗戦後に高地の文化が抑圧された歴史が影を落としている。第二の局面は20世紀半ばの復興である。アイルランドでは1951年に伝統音楽の保存と普及を目的とする組織が設立され、各地で競演会が開かれるようになった。作曲家Seán Ó Riadaは1960年代に、それまで居酒屋で個々に演奏されていた伝統音楽を、室内楽のように編曲して舞台へ載せるという発想を持ち込み、伝統音楽の社会的地位を一変させた。彼のもとにいた奏者たちが1962年に結成したThe Chieftainsは、Paddy Moloneyを中心に半世紀にわたって国際的な活動を続け、この音楽を世界へ知らしめた。1972年に結成されたPlanxtyは、Christy Moore、Dónal Lunny、Andy Irvine、Liam O'Flynnという名手を揃え、1960年代半ばにSweeney's MenのJohnny Moynihanがアイルランド伝統音楽に導入したギリシャ由来のブズーキを普及させるなど大胆な改変を行いながら、伝統の核心を損なわない演奏で若い世代を引き込んだ。Clannad（1970年結成）、The Bothy Band（1975年結成）、Altan（1987年結成）といったバンドも活動し、スコットランドではCapercaillieが、ブルターニュでは、父Georges Cochevelouが復元したハープを受け、Alan Stivellが演奏と普及で復興を牽引し、1972年のパリでの公演によってその音楽がフランス中に知られるようになった。1994年、テレビ番組の幕間に上演された舞踊の演目が世界的な現象となり、この音楽は大衆的な知名度を獲得したが、同時に商業化・単純化されているという批判も出た。現在も各地で日常的に演奏される生きた伝統であり続けている。</p>
