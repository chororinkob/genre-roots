<h1>Harsh Noise（ハーシュノイズ）とは</h1>
<p>音楽から旋律、和声、拍節をすべて取り除き、飽和した歪みそのものを内容とする音楽。信号としては広帯域のノイズが中心で、ホワイトノイズやピンクノイズに近い連続スペクトルに、突発的なピークが重なる。制作にはフィードバック(マイクやピック</p>
<p>音楽から旋律、和声、拍節をすべて取り除き、飽和した歪みそのものを内容とする音楽。信号としては広帯域のノイズが中心で、ホワイトノイズやピンクノイズに近い連続スペクトルに、突発的なピークが重なる。制作にはフィードバック(マイクやピックアップを増幅器に戻して発振させる)、自作の回路や壊れた電子機器、コンタクトマイクで拾った金属の擦過音、テープの過飽和、多段のディストーションとイコライザによる増幅の連鎖が使われる。ミキサー卓自体を楽器として扱い、入力を意図的に過大にして卓を歪ませる手法も基本技法になる。音量は極端に大きく、聴取における肉体的な圧力や痛みが表現の一部として組み込まれている。構造の面では起承転結を持たず、密度と周波数配置がゆっくり変化するか、あるいは何の前触れもなく途切れる。ハーシュ・ノイズ・ウォールと呼ばれる下位分類では、変化すらほぼ排して数十分間ひたすら同じ壁のような轟音を持続させる。ライヴでは演奏者が機材を叩いたり床を転げ回ったりする身体的な行為が伴うことも多い。作品はカセットテープやCD-Rの極小部数で流通し、手作りの過激な装丁が付されることが多い。歌詞やヴォーカルは通常ないが、あっても叫びが音の層に埋没する。実験音楽全般やインダストリアルと接するが、それらが持つ構成意識やリズムすら放棄している点で最も極端な位置にある。</p>
<h2>成り立ち</h2><p>1980年代初頭に、関西ノーウェイヴからジャパノイズへと連なる流れの中で生まれ、ヨーロッパのパワーエレクトロニクスが重要な影響源になったとされる。前史には20世紀初頭のイタリア未来派があり、Luigi Russoloが1913年の宣言「騒音芸術」で機械の騒音こそ新時代の音楽だと主張し、イントナルモーリという騒音発生装置を自作している。戦後はPierre Schaefferのミュージック・コンクレート、John Cageの偶然性の音楽、Karlheinz Stockhausenの電子音楽が、音楽の素材の定義を拡張した。前段にあたるインダストリアルの流れとして、1970年代半ばのイギリスでThrobbing Gristleが1975年に結成され、パフォーマンス集団COUM Transmissionsから発展して、意図的に不快な音と主題で聴衆を攻撃する方法を確立した。同じ英国のWhitehouseは1980年前後に、低音や高周波、ホワイトノイズに絶叫ヴォーカルを重ねた作品を発表した。パワーエレクトロニクスという下位分類の名は、William Bennettが1982年のアルバム『Psychopathia Sexualis』のスリーブ文で名づけたものである。日本では非常階段が1979年に京都で結成され、ライヴで放尿や器物損壊を含む過激な行為とともに轟音を鳴らし、ほぼ同時期のMerzbowと並ぶ「第1世代」とされる。最も国際的に知られるのは秋田昌美によるMerzbowで、1979年から活動を始め、ドイツのダダの芸術家Kurt Schwittersの作品「Merzbau」を由来とする名で膨大な量の作品を発表した。2000年6月にはExtremeからCD50枚組の「Merzbox」（1979〜97年の作品を収録）が発売された。他に灰野敬二、Incapacitants、C.C.C.C.、Masonnaといった日本の作家群が1990年代に欧米で強い注目を集め、ジャパノイズという呼称が国際的に流通した。アメリカではミシガンのWolf Eyesや、各地に拠点を移しながら活動するPrurientが2000年代に注目され、ハーシュ・ノイズ・ウォールを掲げるThe Rita、Vomir(フランス)といった作家が極北を更新した。元Wolf EyesのAaron Dilloway設立のレーベルHanson Recordsも、アメリカのノイズ文化を支えた。この文化は流通の形態も特異で、カセットテープの数十本単位の自主制作と、手紙や後にはインターネットの掲示板を介した個人間の交換が主要な流通経路だった。批判としては、暴力や病理の図像を用いる一部の作家が女性蔑視や全体主義への接近を疑われ、実際に糾弾された事例もある。表現の自由と倫理の境界を巡る議論は現在も続いている。</p>
