<h1>Harsh Noise（ハーシュノイズ）とは</h1>
<p>ハーシュ・ノイズは、従来の旋律・和声・拍節をほとんど、あるいはまったく持たない音楽だ。飽和した歪みそのものが、音楽の中身になっている。 中心になるのは、幅広い音域にわたるノイズだ。ホワイトノイズやピンクノイズに近い、切れ目のない音</p>
<p>ハーシュ・ノイズは、従来の旋律・和声・拍節をほとんど、あるいはまったく持たない音楽だ。飽和した歪みそのものが、音楽の中身になっている。

中心になるのは、幅広い音域にわたるノイズだ。ホワイトノイズやピンクノイズに近い、切れ目のない音が鳴り続け、そこに突発的な鋭い音が重なる。

音作りには、フィードバック(マイクやピックアップを増幅器に戻して発振させる)が使われる。自作の回路や壊れた電子機器も使われる。多段のディストーションとイコライザで、音を次々に増幅していく連鎖も使われる。ミキサー卓そのものを楽器として扱い、入力をわざと大きくしすぎて卓を歪ませる手法も、手法の一つとして用いられる。

音量は極端に大きい。聴くときに体で受ける圧力や痛みも、表現の一部として組み込まれているとされる。

曲の組み立てに、起承転結はない。音の密度や周波数の配置がゆっくり変わっていくか、何の前触れもなく途切れる。ハーシュ・ノイズ・ウォールと呼ばれる枝分かれした種類では、変化すらほとんどなくす。数十分間、ひたすら同じ壁のような轟音を鳴らし続ける。

歌詞やヴォーカルは通常ない。あっても、叫び声が音の層に埋もれる。

ライヴでは、演奏者が機材を叩いたり、床を転げ回ったりする体を使った行為が伴うこともある。作品はカセットテープやCD-Rで、ごくわずかな部数だけ流通する。手作りの過激な装丁が付けられることが多い。

実験音楽全般やインダストリアルとも接している。ただ、それらが持つ構成の意識やリズムすら捨てている点で、最も極端な位置にあるとされる。</p>
<h2>成り立ち</h2><p>1980年代初頭（1979年の非常階段・Merzbowを起点とする見方もある）、関西ノーウェイヴからジャパノイズへと連なる流れの中で、この音楽は生まれた。ヨーロッパのパワーエレクトロニクスが、重要な影響源になったとされる。

さかのぼると、20世紀初頭のイタリアの未来派に行き着く。Luigi Russoloは1913年の宣言「騒音芸術」で、機械の騒音こそ新時代の音楽だと主張した。そして、イントナルモーリという騒音発生装置を、Ugo Piattiとともに製作している。戦後は、Pierre Schaefferのミュージック・コンクレート、John Cageの偶然性の音楽、Karlheinz Stockhausenの電子音楽が、音楽の素材の定義を広げた。

すぐ前の段階にあたるのが、インダストリアルの流れだ。1970年代半ばのイギリスで、Throbbing Gristleが1975年に結成された。パフォーマンス集団COUM Transmissionsから発展したグループで、わざと不快な音と主題で聴衆を攻撃する方法を固めた。同じイギリスのWhitehouseは1980年前後に、低音や高周波、ホワイトノイズに絶叫するヴォーカルを重ねた作品を発表した。パワーエレクトロニクスという枝分かれした種類の名は、William Bennettが1982年のアルバム『Psychopathia Sexualis』のスリーブの文で名づけたものだ。

日本では、非常階段が1979年に京都で結成された。ライヴでは、放尿や器物損壊を含む過激な行為とともに轟音を鳴らした。ほぼ同時期のMerzbowと並んで、「第1世代」とされる。

最も国際的に知られるとされるのは、秋田昌美によるMerzbowだ。1979年から活動を始め、膨大な量の作品を発表した。名前は、ドイツのダダの芸術家Kurt Schwittersの作品「Merzbau」に由来する。2000年6月には、Extreme RecordsからCD50枚組の「Merzbox」（1979〜97年の作品を収録）が発売された。

ほかにも、灰野敬二、Incapacitants、C.C.C.C.、Masonnaといったジャパノイズ周辺の作家が、1990年代に欧米で強い注目を集めた。こうして、ジャパノイズという呼び名が国際的に広まった。

一方アメリカでは、ミシガンのWolf Eyesや、各地に拠点を移しながら活動するPrurientが、2000年代に注目された。ハーシュ・ノイズ・ウォールを掲げるカナダのThe Rita（1990年代末〜）、フランスのVomirといった作家は、この音楽の極北を更新した。元Wolf EyesのAaron Dillowayが設立したレーベルHanson Recordsも、アメリカのノイズ文化を支えた。

この文化は、流通の形も独特だった。自主制作によるカセットの少部数流通と、ファンジン・郵便を通じた交換が中心だった。

批判もある。暴力や病理の図像を使う一部の作家は、女性蔑視や全体主義への接近を疑われ、物議を醸した。表現の自由と倫理の境界をめぐる議論は、今も続いている。</p>
