<h1>Harsh Noise（ハーシュノイズ）とは</h1>
<p>音楽から旋律、和声、拍節をすべて取り除き、飽和した歪みそのものを内容とする音楽。信号としては広帯域のノイズが中心で、ホワイトノイズやピンクノイズに近い連続スペクトルに、突発的なピークが重なる。制作にはフィードバック(マイクやピック</p>
<p>音楽から旋律、和声、拍節をすべて取り除き、飽和した歪みそのものを内容とする音楽。信号としては広帯域のノイズが中心で、ホワイトノイズやピンクノイズに近い連続スペクトルに、突発的なピークが重なる。制作にはフィードバック(マイクやピックアップを増幅器に戻して発振させる)、自作の回路や壊れた電子機器、コンタクトマイクで拾った金属の擦過音、テープの過飽和、多段のディストーションとイコライザによる増幅の連鎖が使われる。ミキサー卓自体を楽器として扱い、入力を意図的に過大にして卓を歪ませる手法も基本技法になる。音量は極端に大きく、聴取における肉体的な圧力や痛みが表現の一部として組み込まれている。構造の面では起承転結を持たず、密度と周波数配置がゆっくり変化するか、あるいは何の前触れもなく途切れる。ハーシュ・ノイズ・ウォールと呼ばれる下位分類では、変化すらほぼ排して数十分間ひたすら同じ壁のような轟音を持続させる。ライヴでは演奏者が機材を叩いたり床を転げ回ったりする身体的な行為が伴うことも多い。作品はカセットテープやCD-Rの極小部数で流通し、手作りの過激な装丁が付されることが多い。歌詞やヴォーカルは通常ないが、あっても叫びが音の層に埋没する。実験音楽全般やインダストリアルと接するが、それらが持つ構成意識やリズムすら放棄している点で最も極端な位置にある。</p>
<h2>成り立ち</h2><p>1970年代末から1980年代にかけて日本とイギリスで並行して成立した。前史には20世紀初頭のイタリア未来派があり、Luigi Russoloが1913年の宣言「騒音芸術」で機械の騒音こそ新時代の音楽だと主張し、イントナルモーリという騒音発生装置を自作している。戦後はPierre Schaefferのミュージック・コンクレート、John Cageの偶然性の音楽、Karlheinz Stockhausenの電子音楽が、音楽の素材の定義を拡張した。直接の起源としては、1970年代半ばのイギリスでThrobbing Gristleが1976年に結成され、パフォーマンス集団COUM Transmissionsから発展して、意図的に不快な音と主題で聴衆を攻撃する方法を確立した。同じ英国のWhitehouseは1980年前後に、高周波の金切り声のような音と暴力的な言葉だけの作品を発表し、パワーエレクトロニクスと呼ばれる下位分類の名を自らのレーベル名(Come Organisation)周辺から生んだ。日本では非常階段が1979年に大阪で結成され、ライヴで放尿や器物損壊を含む過激な行為とともに轟音を鳴らし、日本のノイズ文化の出発点となった。最も国際的に知られるのは秋田昌美によるMerzbowで、1979年から活動を始め、Marcel Duchampの作品名を由来とする名で膨大な量の作品を発表した。2000年にはCD50枚組の「Merzbox」が発売され、ノイズの過剰さそのものを物量で示す象徴的な事件となった。他に灰野敬二、Hijokaidan、Incapacitants、C.C.C.C.、Masonnaといった日本の作家群が1990年代に欧米で強い注目を集め、ジャパノイズという呼称が国際的に流通した。アメリカではミシガンのWolf EyesやニューヨークのPrurientが2000年代に注目され、Hanson Recordsやハーシュ・ノイズ・ウォールを掲げるThe Rita、Vomir(フランス)といった作家が極北を更新した。この文化は流通の形態も特異で、カセットテープの数十本単位の自主制作と、手紙や後にはインターネットの掲示板を介した個人間の交換が主要な流通経路だった。批判としては、暴力や病理の図像を用いる一部の作家が女性蔑視や全体主義への接近を疑われ、実際に糾弾された事例もある。表現の自由と倫理の境界を巡る議論は現在も続いている。</p>
