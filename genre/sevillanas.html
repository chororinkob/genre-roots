<h1>Sevillanas（セビジャーナス）とは</h1>
<p>スペイン南部アンダルシア地方、とりわけセビリアの祭りで踊られる歌と舞踊。フラメンコの一部として扱われることが多いが、独自の面も強い。フラメンコの多くが12拍の複雑なくり返しを持つのに対し、こちらは4分の3拍子または8分の6拍子の単</p>
<p>スペイン南部アンダルシア地方、とりわけセビリアの祭りで踊られる歌と舞踊。フラメンコの一部として扱われることが多いが、独自の面も強い。フラメンコの多くが12拍の複雑なくり返しを持つのに対し、こちらは4分の3拍子または8分の6拍子の単純な拍で進み、誰でも覚えられる。いちばんの特徴は形式が決まっていることで、通常は4つのセビジャーナスを続けて演じ、各曲は3つのコプラ(部)から成る(4つをコプラと呼ぶ流儀もある)。踊りの型も決まっており、順に第一、第二、第三、第四と進んで、最後は男女が向き合って静止して終わる。各コプラは短い前奏に導かれ、歌が三行または四行の詩句を歌い、間奏で踊り手が入れ替わる。伴奏はスペインギターのかき鳴らしが中心で、調は一定せず、長調・短調・フリジア系があり、アンダルシア終止と呼ばれる四つの和音が下がっていく流れも使われる。そこに手拍子、カスタネット、時にフルートやタンバリンが加わる。歌は明るいものも重いものもあり、楽しい曲も悲しい曲もある。歌詞は恋、セビリアの街、聖母マリアへの信心、巡礼の道中といった主題を扱う。男女が対になって踊るが、身体は密着せず、腕を頭上に大きく回し、手首を返す動きが繰り返される。</p>
<h2>成り立ち</h2><p>カスティーリャ起源のセギディーリャという舞曲に由来するとされる(起源は16世紀前後とされ、地域には諸説がある)。これがアンダルシアに伝わり、セビリア風のセギディーリャという意味でこの名で呼ばれるようになった。18世紀には原型となる要素があり、19世紀に定着したとされ、4部の構成が文献で示されるのは20世紀初頭である。この舞踊が地域を代表する存在になったのは19世紀で、二つの行事が大きな役割を果たした。ひとつは1847年に始まったセビリアの春祭りで、当初は家畜市だったものが次第に飲食と歌と踊りの祭典へ変わり、各家や団体が仮設のテントを張って夜通し踊る場となった。もうひとつがアンダルシア西部のエル・ロシオへの巡礼で、聖母マリアの像を目指して何日もかけて歩く道中と結びついた歌が、のちにセビジャーナス・ロシエラスという独自の型として広まった(広まったのは20世紀後半)。19世紀後半にはロマの人々による深いフラメンコが芸術として確立していく一方、こちらは誰でも参加できる大衆の踊りとして役割を分けた。20世紀に入ると、フランコ体制下でアンダルシアの意匠がスペイン全体の観光的な表象として利用され、この踊りも国家の宣伝に組み込まれた。1970年代から80年代にかけて、Los Romeros de la Puebla(1968〜2011年、ラ・プエブラ・デル・リオ出身)などのセビジャーナスのグループが録音を出し、テレビの普及で全国に広まる。1980年代にはポップ調の編曲を施した録音が大量に作られ、伝統の破壊だという批判も起きた。1992年、映画監督Carlos Sauraが『セビジャーナス』という作品で、この踊りだけを延々と撮影した映画を発表し、国際的にも知られるようになった。現在もセビリアの春祭りは週合計でのべ約500万人、ロシオ巡礼は約100万人を集め、この踊りは学校や地域の教室で子供のうちから習うものとして生き続けている。</p>
<h2>代表曲</h2><ul><li>Cántame (María del Monte)</li><li>Ni te quiero, ni te olvido (Los Marismeños)</li><li>Sevillanas del Adiós（Amigos de Gines）</li><li>Que También Es de Sevilla (Los Marismeños)</li><li>Fue en Sevilla (Salmarina)</li><li>Un Cielo de Farolillos (Raya Real)</li><li>El Adiós（Los Romeros de la Puebla）</li><li>A Bailar, A Bailar (Cantores de Híspalis)</li><li>Pueblos Blancos (Cantores de Híspalis)</li><li>Mi Orgullo Ser Marismeño (Los Marismeños)</li><li>Olé Dolores (Lola Flores)</li><li>Sevillanas de la Reina (Los Marismeños)</li></ul>
