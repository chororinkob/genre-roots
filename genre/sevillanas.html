<h1>Sevillanas（セビジャーナス）とは</h1>
<p>スペイン南部アンダルシア地方、とりわけセビリアの祭りで踊られる歌と舞踊。フラメンコの一部として扱われることが多いが、構造がまったく異なる。フラメンコの多くが12拍の複雑な循環を持つのに対し、こちらは四分の三拍子または八分の六拍子の</p>
<p>スペイン南部アンダルシア地方、とりわけセビリアの祭りで踊られる歌と舞踊。フラメンコの一部として扱われることが多いが、構造がまったく異なる。フラメンコの多くが12拍の複雑な循環を持つのに対し、こちらは四分の三拍子または八分の六拍子の単純な拍で進み、誰でも覚えられる。最大の特徴は形式の固定で、必ず四つの部分から成り、それぞれをコプラと呼ぶ。四つのコプラは踊りの型も決まっており、順に第一、第二、第三、第四と進んで、最後は男女が向き合って静止して終わる。各コプラは短い前奏に導かれ、歌が三行または四行の詩句を歌い、間奏で踊り手が入れ替わる。伴奏はスペインギターの掻き鳴らしが中心で、和音はほぼ長調の三つの和音、加えてアンダルシア終止と呼ばれる四つの和音が下降する進行が使われる。そこに手拍子、カスタネット、時にフルートやタンバリンが加わる。歌は明るく開放的で、フラメンコの深い嘆きとは対照的である。歌詞は恋、セビリアの街、聖母マリアへの信心、巡礼の道中といった主題を扱う。男女が対になって踊るが、身体は密着せず、腕を頭上に大きく回し、手首を返す動きが繰り返される。</p>
<h2>成り立ち</h2><p>起源は十五世紀から十六世紀のカスティーリャ地方で踊られていたセギディーリャという舞曲にある。これがアンダルシアに伝わり、セビリア風のセギディーリャという意味でこの名で呼ばれるようになった。十八世紀にはすでに現在の四部構成の骨格が形成されていたとされる。この舞踊が地域を代表する存在になったのは十九世紀で、二つの行事が決定的な役割を果たした。ひとつは1847年に始まったセビリアの春祭りで、当初は家畜市だったものが次第に飲食と歌と踊りの祭典へ変わり、各家や団体が仮設のテントを張って夜通し踊る場となった。もうひとつがアンダルシア西部のエル・ロシオへの巡礼で、聖母マリアの像を目指して何日もかけて歩く道中、荷馬車の周りで踊られる歌がセビジャーナス・ロシエラスという独自の型を生んだ。十九世紀後半にはロマの人々による深いフラメンコが芸術として確立していく一方、こちらは誰でも参加できる大衆の踊りとして棲み分けた。二十世紀に入ると、フランコ体制下でアンダルシアの意匠がスペイン全体の観光的な表象として利用され、この踊りも国家の宣伝に組み込まれた。1970年代から80年代にかけて、Los RomerosやLos Amayaといった集団が録音を出し、テレビの普及で全国に広まる。1980年代にはポップ調の編曲を施した録音が大量に作られ、伝統の破壊だという批判も起きた。1992年、映画監督Carlos Sauraが『セビジャーナス』という作品で、この踊りだけを延々と撮影した映画を発表し、国際的にも知られるようになった。現在もセビリアの春祭りとロシオ巡礼は毎年数十万人を集め、この踊りは学校や地域の教室で子供のうちから習うものとして生き続けている。</p>
