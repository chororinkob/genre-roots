<h1>Sevillanas（セビジャーナス）とは</h1>
<p>セビジャーナスは、スペイン南部アンダルシア地方、とりわけセビリアの祭りで踊られる歌と踊りだ。フラメンコの一部として扱われることが多いが、独自の面も強い。 伴奏の中心は、スペインギターのかき鳴らしだ。そこに手拍子とカスタネット、時に</p>
<p>セビジャーナスは、スペイン南部アンダルシア地方、とりわけセビリアの祭りで踊られる歌と踊りだ。フラメンコの一部として扱われることが多いが、独自の面も強い。

伴奏の中心は、スペインギターのかき鳴らしだ。そこに手拍子とカスタネット、時にフルートやタンバリンが加わる。

調は一定しない。長調・短調・フリジア系がある。

リズムは単純だ。フラメンコの多くは、12拍の複雑なくり返しを持つ。これに対してセビジャーナスは、4分の3拍子の単純な拍で進み、誰でも覚えられる。

歌は明るいものも重いものもあり、楽しい曲も悲しい曲もある。歌詞は、恋、セビリアの街、聖母マリアへの信心、巡礼の道中といった主題を扱う。

いちばんの特徴は、形式が決まっていることだ。通常は4つのセビジャーナスを続けて演じ、各曲は3つのコプラ(部)から成る(4つをコプラと呼ぶ流儀もある)。各曲は前奏で始まる。歌は、4行の詩句に3行のリフレイン（エストリビーリョ）が続く形をとり（まれに8音節4行のクアルテタ）、間奏で踊り手が入れ替わる。

踊りの型も決まっている。順に第一、第二、第三、第四と進み、最後は男女が向き合って静止して終わる。男女が対になって踊るが、身体は密着しない。腕を頭上に大きく回し、手首を返す動きが繰り返される。</p>
<h2>成り立ち</h2><p>セビジャーナスは、カスティーリャ起源のセギディーリャという舞曲に由来するとされる(起源地・時期とも諸説あり、15〜16世紀、ラ・マンチャ説とアンダルシア説)。これがアンダルシアに伝わり、「セビリア風のセギディーリャ」という意味で、この名で呼ばれるようになった。18世紀には原型となる要素があり、19世紀に定着したとされる。4部の構成が書き記されたのは、20世紀初頭である。

この踊りが地域を代表する存在になったのは19世紀だ。その中心は、1847年に始まった近代的なセビリアの春祭りだった。春祭りは、当初は家畜市だったが、次第に飲食と歌と踊りの祭典へ変わった。各家や団体が仮設のテントを張り、夜通し踊る場となった。

一方、アンダルシア西部のエル・ロシオへの巡礼では、聖母マリアの像を目指して何日もかけて歩く。その道中と結びついた歌が、のちにセビジャーナス・ロシエラスという独自の型として広まった(広まったのは20世紀後半)。

19世紀後半には、ロマの貢献が大きいフラメンコが、芸術として定着していった。これと並行して、セビジャーナスは誰でも参加できる民衆の踊りとして広まった。その一方で、フラメンコの歌手や演奏家にも取り込まれていった。

20世紀に入ると、フランコ体制のもとで、アンダルシアらしいデザインがスペイン全体の観光のイメージとして利用された。この踊りも、Coros y Danzasのレパートリーに含まれた。

1950年代に最初の録音が出て、1960年代には専門のグループが登場した。Los Romeros de la Puebla(1967年結成、1968年に初録音、2011年に引退、ラ・プエブラ・デル・リオ出身)などのセビジャーナスのグループが録音を出した。踊りは、録音の普及や、春祭り・巡礼を通じて広まった。

1980年代にはブームとなった。ブーム期には年間最大200枚が録音され、交響的な編曲や合唱の形式も現れた。「踊る」ための曲から「聴く」ための曲への移行を指摘する論者もいる。

1992年（撮影は1991〜92年初頭）、映画監督Carlos Sauraが『セビジャーナス』を発表した。物語のない約55分の音楽ドキュメンタリー風の映画で、短い演目を連ねる作品だ。

現在も、セビリアの春祭りは約250〜300万人（年により異なる）、ロシオ巡礼は約100万人と推定される人を集める。この踊りは、学校や地域の教室で子供のうちから習うものとして生き続けている。</p>
