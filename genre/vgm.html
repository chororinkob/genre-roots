<h1>Video Game Music（ビデオゲームミュージック）とは</h1>
<p>テレビゲームのために作られる音楽である。他の音楽と大きく異なる点のひとつは、演奏される時間の長さが確定していない点にある。遊び手がどれだけその場面に留まるか分からないため、楽曲は途切れなく循環するよう設計され、末尾から冒頭へ戻る際</p>
<p>テレビゲームのために作られる音楽である。他の音楽と大きく異なる点のひとつは、演奏される時間の長さが確定していない点にある。遊び手がどれだけその場面に留まるか分からないため、楽曲は途切れなく循環するよう設計され、末尾から冒頭へ戻る際に継ぎ目が感じられないよう緻密に作られる。初期には機材の制約が音の性格を決定した。同時に鳴らせる音の数が三つや五つに限られていたため、和音を鳴らす代わりに、和音の構成音を極めて高速に順番に鳴らして和音のように錯覚させる技法が発達した。打楽器も専用の音源（音を出す回路）を持たないため、ノイズ（雑音）の発生器や短い波形で代用された。旋律は1本しか使えないことも多く、そのため極めて印象的で覚えやすい線を書くことが最優先された。この制約が旋律の記憶されやすさを生んでいると指摘されることがある。技術の発展により、周波数変調（FM音源）による金属的な音色、録音した音の再生、そして完全な管弦楽の録音が可能になった。1980年代前後に萌芽があり、近年は一般的になったものとして、遊び手の行動に応じて楽曲の層が増減したり、別の展開へ分岐したりする適応的（状況に合わせて変わる）な仕組みが技法の一つとなっており、音楽が一方的に流れるのではなく、遊びと相互に作用する点が特徴の一つとなっている。</p>
<h2>成り立ち</h2><p>1975年の『ガン・ファイト』には、撃たれると葬送行進曲が鳴るという音楽があったと伝えられてきたが、実機には音楽がなかった可能性が高いと検証されている。1978年の『スペースインベーダー』は、英語圏の資料では最初の連続した背景サウンドとされる(4音の下降ベースがループし、テンポが変化する)が、音楽と呼べるかは評価が分かれる。1980年の『ラリーX』は、連続して流れる旋律BGMを持つ最初期のゲームの一つである。大きな転機のひとつは1980年代半ばの日本の家庭用機である。1985年、近藤浩治が横に進む遊びのために書いた楽曲は、わずかな音数でありながら、遊びの動きそのものと一体化した躍動を持つ。彼は続く冒険的な作品『ゼルダの伝説』(1986年)でも、地上と地下の曲を対比させるなど、場面ごとに性格の異なる楽曲を書き分けている。1986年には、既に歌謡曲の分野で実績のあったすぎやまこういちが、役割を演じる遊びのために古典的・管弦楽的な作風の曲を書き、同年に管弦楽版のアルバムも作られた（ゲーム本編の音源はファミコン内蔵の3音）。翌1987年8月20日には、サントリーホールのファミリークラシックコンサートで、東京弦楽合奏団（Tokyo Strings Ensemble）によるゲーム音楽の演奏会が開かれ、すぎやまは司会を務めた（指揮は十束尚宏とする記録があるが、すぎやまが指揮・編曲したとする資料もあり、記載が割れている）。ゲームの音楽が演奏会場で演奏されるという事態は当時前例がなく、ギネス記録は「最初のゲーム音楽コンサート」としている。植松伸夫は長大な物語のための情感豊かな楽曲を書き、古代祐三は周波数変調による硬質な音色を駆使して、ゲーム機の音源から最大限の表現を引き出した。欧米では、コモドール64など一部のパソコンに搭載された音源の性能が高く、Rob Hubbardをはじめとする作曲家が、その音源固有の音色を追求している。1988年12月、家庭用ゲーム機として初めてCD-ROMを採用したPCエンジンCD-ROM²でCDによる音声の再生が始まり、1995年前後のPlayStationやセガサターンの時代に主流となって、録音された演奏がそのまま用いられるようになった。一方で、初期の限られた音源の音色そのものを愛好する文化も生まれ、それは独立した音楽の分野として現在も続いている。遊び手の状況に応じて音楽が変化する仕組みは、1978年(インベーダー)、1981年(フロッガー)、1982年(ディグダグ)に先例があり、作曲家は固定された曲ではなく、変化しうる音の体系を設計するようになった。現在では大規模な演奏会が世界各地で開かれている。</p>
<h2>代表曲</h2><ul><li>BFG Division (Mick Gordon)</li><li>11. BFG Division (Mick Gordon)</li><li>Megalovania (Toby Fox)</li><li>Dearly Beloved (Yoko Shimomura)</li><li>BFG 10K (DOOM Eternal - Gamerip) [REUPLOAD] (Mick Gordon)</li><li>Dragonborn (Jeremy Soule)</li><li>Green Hill Zone (Masato Nakamura)</li><li>Chrono Trigger Main Theme (Yasunori Mitsuda)</li><li>Still Alive (Jonathan Coulton)</li><li>Dragon Quest Overture (Koichi Sugiyama)</li><li>Snake Eater (Cynthia Harrell)</li><li>The Legend of Zelda Main Theme (Koji Kondo)</li></ul>
