<h1>Video Game Music（ビデオゲームミュージック）とは</h1>
<p>テレビゲームのために作られる音楽である。他の音楽と根本的に異なるのは、演奏される時間の長さが確定していない点にある。遊び手がどれだけその場面に留まるか分からないため、楽曲は途切れなく循環するよう設計され、末尾から冒頭へ戻る際に継ぎ</p>
<p>テレビゲームのために作られる音楽である。他の音楽と根本的に異なるのは、演奏される時間の長さが確定していない点にある。遊び手がどれだけその場面に留まるか分からないため、楽曲は途切れなく循環するよう設計され、末尾から冒頭へ戻る際に継ぎ目が感じられないよう緻密に作られる。初期には機材の制約が音の性格を決定した。同時に鳴らせる音の数が三つや五つに限られていたため、和音を鳴らす代わりに、和音の構成音を極めて高速に順番に鳴らして和音のように錯覚させる技法が発達した。打楽器も専用の音源を持たないため、雑音の発生器や短い波形で代用された。旋律は一本しか使えないことも多く、そのため極めて印象的で覚えやすい線を書くことが最優先された。この制約が、この分野の旋律の記憶されやすさを生んでいる。技術の発展により、周波数変調による金属的な音色、録音した音の再生、そして完全な管弦楽の録音が可能になった。近年では、遊び手の行動に応じて楽曲の層が増減したり、別の展開へ分岐したりする適応的な仕組みが標準となっており、音楽が一方的に流れるのではなく、遊びと相互に作用する点が最大の特徴となっている。</p>
<h2>成り立ち</h2><p>1970年代の遊技機では、音は効果音の域を出なかった。楽曲と呼べるものが現れたのは1980年前後の業務用の遊技機からで、限られた音源で短い旋律を繰り返すものだった。決定的な転機は1980年代半ばの日本の家庭用機である。1985年、近藤浩治が横に進む遊びのために書いた楽曲は、わずかな音数でありながら、遊びの動きそのものと一体化した躍動を持ち、世界中の子どもの記憶に刻まれた。彼は続く冒険的な作品でも、場面ごとに性格の異なる楽曲を書き分け、この分野の作曲の基準を作っている。1986年には、既に歌謡曲の分野で実績のあったすぎやまこういちが、役割を演じる遊びのために管弦楽的な語法を持ち込んだ。彼の重要な功績は、翌1987年に実際の管弦楽団による演奏会を実現したことである。遊技機の音楽が演奏会場で演奏されるという事態は当時前例がなく、この分野の文化的な地位を大きく引き上げた。植松伸夫は長大な物語のための情感豊かな楽曲を書き、古代祐三は周波数変調による硬質な音色を駆使して、遊技機の音源から最大限の表現を引き出した。欧米では、家庭用のパソコンに搭載された音源の性能が高く、Rob Hubbardをはじめとする作曲家が、その音源固有の音色を追求している。1990年代にはCDによる音声の再生が可能となり、録音された演奏がそのまま用いられるようになった。一方で、初期の限られた音源の音色そのものを愛好する文化も生まれ、それは独立した音楽の分野として現在も続いている。2000年代以降は、遊び手の状況に応じて音楽が変化する仕組みを実現する専用の技術が普及し、作曲家は固定された曲ではなく、変化しうる音の体系を設計するようになった。現在では大規模な演奏会が世界各地で開かれ、この分野は正当な音楽として広く認知されている。</p>
<h2>代表曲</h2><ul><li>Super Mario Bros. Theme (Koji Kondo)</li><li>The Legend of Zelda Main Theme (Koji Kondo)</li><li>One-Winged Angel (Nobuo Uematsu)</li><li>Chrono Trigger Main Theme (Yasunori Mitsuda)</li><li>Dragon Quest Overture (Koichi Sugiyama)</li></ul>
