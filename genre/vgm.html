<h1>Video Game Music（ビデオゲームミュージック）とは</h1>
<p>ゲーム音楽は、テレビゲームのために作られる音楽である。 初期には、機材の制約が音の性格を決定した。同時に鳴らせる音の数が、三つや五つに限られていた。そのため、和音を鳴らす代わりに、構成音を極めて高速に順番に鳴らし、和音と錯覚させる</p>
<p>ゲーム音楽は、テレビゲームのために作られる音楽である。

初期には、機材の制約が音の性格を決定した。同時に鳴らせる音の数が、三つや五つに限られていた。そのため、和音を鳴らす代わりに、構成音を極めて高速に順番に鳴らし、和音と錯覚させる技法が発達した。

旋律は、1本しか使えない場合も多かった。そのため、極めて印象的で覚えやすい線を書くことが最優先された。この制約が、この分野の旋律の記憶されやすさを生んでいると指摘されることがある。

打楽器も、専用の音源（音を出す回路）を保持しなかった。そのため、ノイズ（雑音）の発生器や短い波形で代用された。

技術の発展により、周波数変調（FM音源）による金属的な音色、録音した音の再生、そして完全な管弦楽の録音が可能になった。

他の音楽と大きく異なる点のひとつは、演奏される時間の長さが確定していない点にある。遊び手がその場面にどれだけ留まるか不明なため、楽曲は途切れなく循環するよう設計される。末尾から冒頭へ戻る際に継ぎ目が感じられないよう、緻密に作られる。

遊び手の行動に応じて楽曲の層が増減したり、別の展開へ分岐したりする、適応的（状況に合わせて変わる）な仕組みも存在する。この仕組みは、1980年代前後に萌芽があり、近年は一般化して技法の一つとなっている。音楽が一方的に流れるのではなく、遊びと相互に作用する点が、特徴の一つとなっている。</p>
<h2>成り立ち</h2><p>話は、1975年にさかのぼる。この年の『ガン・ファイト』は、誤って音楽があったと伝えられてきたが、後に否定された。

1978年の『スペースインベーダー』は、英語圏の資料では最初の連続サウンドとされるが、音楽と呼べるかは評価が分かれる。4音の下降ベースがループし、テンポが変化する。1980年の『ラリーX』は、連続して流れる旋律BGMを持つ最初期のゲームの一つとされる。

大きな転機は、1980年代半ばの日本の家庭用機だったとされる。1985年、近藤浩治が横に進む遊びのために書いた楽曲は、わずかな音数でありながら、遊びの動きそのものと一体化した躍動を持っていた。彼は次作『ゼルダの伝説』(1986年)で、地上と地下の曲を対比させた。

1986年には、既に歌謡曲の分野で実績のあったすぎやまこういちが、役割を演じる遊びのために古典的・管弦楽的な作風の曲を書いた。同年には、管弦楽版アルバムも制作された。翌1987年8月20日、サントリーホールのファミリークラシックコンサートで、Tokyo Strings Ensemble(弦楽合奏)による演奏会が開かれた。サントリーホールの公演記録では、指揮は十束尚宏で、すぎやまこういちは司会となっている。ただ、ギネス世界記録では、すぎやまが編曲・指揮したとされる。ゲーム機の音楽が演奏会場で演奏されるという事態は、当時前例がなく、この分野の文化的な地位を大きく引き上げたとされる。

植松伸夫は、長大な物語のための情感豊かな楽曲を書いた。古代祐三は、周波数変調による硬質な音色を駆使して、ゲーム機の音源から最大限の表現を引き出した。欧米では、コモドール64など、一部のパソコンは音源の性能が高く、Rob Hubbardをはじめとする作曲家が、その音源固有の音色を追求している。

1988年12月のPCエンジンCD-ROM²から、家庭用ゲーム機として初めてCDによる音声の再生が始まった。それは1990年代に普及し、録音された演奏がそのまま用いられるようになった。一方で、初期の限られた音源の音色そのものを愛好する文化も生まれ、それは独立した音楽の分野として現在も続いている。

遊び手の状況に応じて音楽が変化する仕組みは、1978年(インベーダー)、1981年(フロッガー)、1982年(ディグダグ)に先例があった。作曲家は、固定された曲ではなく、変化しうる音の体系を設計するようになった。現在では大規模な演奏会が世界各地で開かれ、この分野は正当な音楽として広く認知されていると言われる。</p>
