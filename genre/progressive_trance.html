<h1>Progressive Trance（プログレッシブトランス）とは</h1>
<p>トランスの高揚感を、劇的な一撃ではなく何分もかけたじわじわとした変化で味わわせるスタイル。一般的なトランスのように短いブレイクダウンから一気にドロップへ向かうのではなく、レイヤーを1つずつ足したり引いたりしながら音像を少しずつ変質</p>
<p>トランスの高揚感を、劇的な一撃ではなく何分もかけたじわじわとした変化で味わわせるスタイル。一般的なトランスのように短いブレイクダウンから一気にドロップへ向かうのではなく、レイヤーを1つずつ足したり引いたりしながら音像を少しずつ変質させ、気づいたら恍惚の頂点に立っているような構成をとる。テンポはBPM 128〜138とトランスの中ではやや遅め。繊細なアルペジオ、うねるベースライン、広がりのあるパッド（持続音のシンセ）がグラデーション的に変化していき、明確な「サビ」を作らず、代わりにループとフィルターワーク（フィルターを開閉して音色を徐々に変化させる技法）で聴き手を引き込む。聴いていると時間感覚が消え、音の流れそのものに身を委ねる深い没入感がある。1曲単体で聴くより、DJが何十曲も途切れなく繋いでいく長時間セットの流れの中でこそ真価を発揮するジャンルで、派手さより「良い旅（ジャーニー）」としての一貫性が評価される。プログレッシブハウスと非常に近く、実質的に地続きのジャンルとして語られることも多い。</p>
<h2>成り立ち</h2><p>1993年頃、プログレッシブハウスとトランスの境界線上で発展した。イギリスのDJデュオSasha &amp; John Digweedは、複数の曲のパーツを重ね合わせて何時間も途切れさせずに聴かせる長尺DJセットでこの美学を体現し、コンピレーションシリーズ『Renaissance: The Mix Collection』やのちの『Northern Exposure』は、当時のクラブカルチャーにおける「DJミックスCD」というフォーマットの金字塔となった。Sashaの1999年のEP『Xpander』はプログレッシブトランス／ハウスの教科書的存在とされる。ベルギーのAirwave、ドイツのユニットCygnus Xが初期の代表格。2000年代後半〜2010年代には、スウェーデンのEric Prydzが自身の別名義Prydaでリリースした楽曲群が最も影響力を持ち、プログレッシブトランスとプログレッシブハウスの垣根を越えて多くのDJ・プロデューサーに影響を与えた。Markus Schulz、Max Graham、そして先述のJohn Digweedはソロ・ユニットでもスタイルを発展させ続けた。デンマークのレーベルIboga Records、アルゼンチンのDJ Hernan Cattaneoが主宰するSudbeatが重要な発信拠点となり、後年にはAbove &amp; Beyondが運営するAnjunadeepのようなプログレッシブ／ディープハウス寄りのレーベルも同系譜として語られる。サイケデリック・トランスの流れを汲む「プログレッシブサイ」も、テンポ感とビルドの作り方において本ジャンルと美学を共有する関連ジャンルである。</p>
<h2>代表曲</h2><ul><li>Saltwater (Chicane)</li><li>Café Del Mar (Energy 52)</li><li>Seven Cities (Solarstone)</li></ul>
