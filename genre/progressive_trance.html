<h1>Progressive Trance（プログレッシブトランス）とは</h1>
<p>プログレッシブ・トランスは、トランスの高揚感を、劇的な一撃ではなく、何分もかけたじわじわとした変化で味わわせるスタイルだ。特徴は、長めのブレイクダウンと、少しずつ進んでいく展開にある。 レイヤーを1つずつ足したり引いたりしながら、</p>
<p>プログレッシブ・トランスは、トランスの高揚感を、劇的な一撃ではなく、何分もかけたじわじわとした変化で味わわせるスタイルだ。特徴は、長めのブレイクダウンと、少しずつ進んでいく展開にある。

レイヤーを1つずつ足したり引いたりしながら、音の姿を少しずつ変えていく。気づいたら恍惚の頂点に立っている、という構成をとる。

主な音は、繊細なアルペジオ（和音を一音ずつ順に弾く奏法）、うねるベースライン（低音の旋律）、広がりのあるパッド（持続音のシンセ）だ。これらがグラデーションのように変化していく。明確な「サビ」は作らない。代わりに、ループとフィルターワーク（フィルターを開閉して音色を徐々に変化させる技法）で聴き手を引き込む。

テンポは128〜136 BPM程度(トランス全体では120〜150 BPM)で、トランスの中ではやや遅めだ。

聴いていると時間の感覚が消え、音の流れそのものに身を任せる深い没入感がある。1曲だけで聴くより、DJが何十曲も途切れなくつないでいく長時間のセットの流れの中でこそ、本当の力を発揮するジャンルだ。派手さよりも、「良い旅（ジャーニー）」としての一貫性が評価される。

「プログレッシブ・トランス」の定義は分かれている。1990年代の「Sasha &amp; Digweed型」は、長時間のDJミックスを目指すものだった。一方、1990年代末からの商業的な流れは、ブレイクダウンが予測できると批判された。プログレッシブハウスとはとても近く、実質的に地続きのジャンルとして語られることも多い。</p>
<h2>成り立ち</h2><p>このスタイルは、プログレッシブハウスとトランスの境界線上で発展した。起源は1990年代前半〜半ばだが、諸説ある。

イギリスのDJデュオ、Sasha &amp; John Digweedは、複数の曲のパーツを重ね合わせ、何時間も途切れさせずに聴かせる長いDJセットで、この美学を形にしてみせた。『Renaissance: The Mix Collection』(1994年10月14日、Renaissance Records)は、豪華な3枚組で、ミックスCDをさらに一段進めた作品だ。のちの『Northern Exposure』(1996年9月27日、Ministry of Sound)は、英国盤がダブルCDである。

さかのぼると、Mixmag Live Vol.1（1992年）が、世界初の合法的なDJミックス作品だった。ただし、形式はカセットだった。フルレングスのライブDJミックスをCDで出した最初のレーベルは、Journeys by DJ（1993年〜）である。

1999年には、SashaのEP『Xpander』が出た。この作品は、トランスの金字塔と評される。

ほかの担い手も現れた。ドイツのユニットCygnus Xは、1993年の「Superstring」が最初のリリースだ。ベルギーのAirwaveは1990年代末の世代で、Airwave名義の最初のリリースは1998年だった。スウェーデンのEric Prydzは、別名義Prydaで、プログレッシブハウス/テックハウス系の作品を出した。Markus Schulz、Max Graham、そして先に挙げたJohn Digweedは、ソロ・ユニットでもスタイルを発展させ続けた。

レーベルでは、デンマークのIboga Records(1997年設立・コペンハーゲン)が、当初は創設者が『プログレッシブ・トランス』と呼ぶ路線で出発したサイトランス系のレーベルで、のちに多様化した。アルゼンチンのDJ Hernán Cattáneoが主宰するSudbeat(2009年設立)は、プログレッシブハウス系のレーベルだ。Anjunadeep（2005年設立）は、より深く穏やかな曲を扱うAbove &amp; Beyondのレーベルである。

一方、サイケデリック・トランスの流れをくむ「プログレッシブサイ」は、プログレッシブ・トランスの影響を受けた関連ジャンルで、テンポはやや速い。</p>
