<h1>Psychedelic Trance（サイトランス）とは</h1>
<p>ゴアトランスを土台に、音の設計をより精密で機械的に洗練させたトランスの系統。テンポは125〜150BPM（1分間の拍数）が一般的。骨格は四つ打ちのキックと、その直後に置かれるオフビート（拍の間）・ベースの組み合わせで、この二つが極</p>
<p>ゴアトランスを土台に、音の設計をより精密で機械的に洗練させたトランスの系統。テンポは125〜150BPM（1分間の拍数）が一般的。骨格は四つ打ちのキックと、その直後に置かれるオフビート（拍の間）・ベースの組み合わせで、この二つが極めて厳密に噛み合うよう設計されている点が重要な特徴の一つになる。キックは短く鋭い減衰を持ち、ベースはキックが鳴り終わった直後にサイドチェイン（別の音に合わせて音量を自動で下げる処理）で立ち上がり、両者が音の帯域を奪い合わないよう調整される。この結果、低域が途切れなく脈打つ、前へ進む勢いが生まれる。上物（メロディーなど上に重ねる音）は極めて多層で、16分音符のアルペジオ（和音を一音ずつ順に弾く奏法）、金属的なリード、変調された効果音、フィルターで動く持続音が、絶えず入れ替わりながら重なる。音作りにはFM合成（波形で別の波形を揺らして複雑な音を作る方式）、リング変調（二つの音を掛け合わせる処理）、グラニュラー処理（音を細かい粒に刻んで組み直す処理）、そしてオートメーション（変化を自動で記録して再生する機能）による連続的な音の変化が使われることがあり、層が頻繁に入れ替わる密度を持つ。代表的な機材としては、Access VirusやNord Leadといったバーチャル・アナログ・シンセサイザー（アナログ回路をデジタルで再現したシンセ）が1990年代後半から広く使われ、ベースラインにはYamaha TX81ZのFM音源による「Lately Bass」プリセット（あらかじめ用意された音色）が使われた例がある（Astral Projectionでの使用例が指摘されている）。和声（コードの響き）は自然短音階、ハーモニックマイナー、フリジアン（フリジアン・ドミナント）などが多い。曲の構成は12分に及ぶこともあり、明確なサビの代わりに、数分ごとに全体の密度が上下する波が置かれる。ヴォーカルは基本的になく、映画やドキュメンタリーからの語りの断片が挿入される。下位分類が非常に多く、重く高速なダークサイケ、高速のハイテック、明るく旋律的なフルオン、ファンキーで漸進的なプログレッシブ・サイケなどに分かれる。</p>
<h2>成り立ち</h2><p>1990年代半ばから後半に、ゴアトランスがインドを離れてヨーロッパとイスラエルで発展する過程で成立した。呼称の変化の背景には、技術の変化もあったとする見方がある。1990年代前半のゴアトランスはアナログとデジタル両方のシンセとハードウェアのサンプラー（音を録音して取り込み、並べ替える機械）で作られていたが、1990年代後半にソフトウェアシンセや簡易な制作ソフト(PropellerheadのReBirthやFruityLoopsなど)が普及し、音の切り貼りと精密な自動操作が容易になった。この結果、音の密度と正確さが飛躍的に高まり、ゴアトランスの有機的な粗さとは異なる性格を帯びた。イスラエルは大きな役割を果たした。同国では兵役後にインドを旅する若者が多く、持ち帰ったゴアでの体験が発展してサイケデリック・トランスへ変わっていった。Astral Projection、Infected Mushroom(Erez Eisen（Aizenとも表記される）とAmit Duvdevaniが1996年に結成)、Skazi、California Sunshineといった、ゴアトランス期から活動してサイトランスへの移行を担った作家が現れ、テルアビブやハイファなどイスラエル各地が世界的な制作拠点になった。Infected Mushroomはとりわけ影響が大きく、ロックやメタルの要素を持ち込んで境界を押し広げた。並行してイギリスではSimon PosfordがHallucinogen名義で1995年の「Twisted」を発表し、後にRaja RamとShpongleを結成してアンビエント寄りの派生を作った。レーベルではTwisted Records、Dragonfly Records、Blue Room Released、TIP.Worldが中心となり、ドイツではSpirit Zoneが機能した。2000年代に入ると地域ごとの分岐が明確になる。ブラジルではUniverso Paralelloという野外音楽祭が2000年（資料により2001年）に始まり、ブラジルのサイトランス・コミュニティの中心的存在で、最も国際的な祭典となった。日本でも1990年代前半から野外パーティーが行われ、1998年ごろから大規模化し、Solstice Music（イベント主催者）といった存在が活動した。ポルトガルのBoom Festivalは1997年に始まり、環境配慮と芸術性を掲げて1998年以降は隔年開催される国際的な集まりになった。この文化では薬物の問題が指摘されてきた。LSD、MDMA、大麻などの使用が広く報告されており、各国で取り締まりが繰り返されてきた。同時に、共同体としては環境保護や精神性を掲げる側面も強く、Boom Festivalのように排水を再利用し、太陽光や風力などの再生可能エネルギーと廃食油の発電機を併用する実践も行われている。2010年代以降、ヨーロッパの主流市場では中心から外れた位置に留まるとされる一方で、野外音楽祭という形式では世界的に安定した規模を保ち続けているとされる。</p>
