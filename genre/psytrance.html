<h1>Psychedelic Trance（サイトランス）とは</h1>
<p>ゴアトランスを土台に、音の設計をより精密で機械的に洗練させたトランスの系統。テンポは138〜150BPMが中心。骨格は四つ打ちのキックと、その直後に置かれるオフビート・ベースの組み合わせで、この二つが極めて厳密に噛み合うよう設計さ</p>
<p>ゴアトランスを土台に、音の設計をより精密で機械的に洗練させたトランスの系統。テンポは138〜150BPMが中心。骨格は四つ打ちのキックと、その直後に置かれるオフビート・ベースの組み合わせで、この二つが極めて厳密に噛み合うよう設計されている点が最大の技術的特徴になる。キックは短く鋭い減衰を持ち、ベースはキックが鳴り終わった直後にサイドチェインで立ち上がり、両者が周波数帯域を奪い合わないよう調整される。この結果、低域が途切れなく脈打つ推進力が生まれる。上物は極めて多層で、16分音符のアルペジオ、金属的なリード、変調された効果音、フィルターで動く持続音が、絶えず入れ替わりながら重なる。音作りにはFM合成、リング変調、グラニュラー処理、そしてオートメーションによる連続的なパラメータ変化が多用され、同じ音が2小節と続かない密度を持つ。代表的な機材としては、Access VirusやNord Leadといったバーチャル・アナログ・シンセサイザーが1990年代後半から広く使われ、ベースラインにはYamaha TX81ZのFM音源による「Lately Bass」プリセットが頻繁に用いられた。和声は自然短音階かハーモニックマイナーで、単一の調に留まる。曲の構成は12分に及ぶこともあり、明確なサビの代わりに、数分ごとに全体の密度が上下する波が置かれる。ヴォーカルは基本的になく、映画やドキュメンタリーからの語りの断片が挿入される。下位分類が非常に多く、遅く重いダークサイケ、高速のハイテック、明るく旋律的なフルオン、有機的なプログレッシブ・サイケなどに分かれる。</p>
<h2>成り立ち</h2><p>1990年代半ばに、ゴアトランスがインドを離れてヨーロッパとイスラエルで発展する過程で成立した。呼称の変化には技術的な背景がある。1990年代前半のゴアトランスはアナログシンセとハードウェアのサンプラーで作られていたが、1990年代後半にパソコン上の制作環境(とりわけSteinbergのCubaseやPropellerheadのReBirth、後のFruityLoops)が普及し、音の切り貼りと精密な自動操作が容易になった。この結果、音の密度と正確さが飛躍的に高まり、ゴアトランスの有機的な粗さとは異なる性格を帯びた。イスラエルの役割が決定的だった。同国では兵役後にインドを旅することが若者の通過儀礼となっており、ゴアの文化がそのまま持ち帰られた。Astral Projection、Infected Mushroom(Erez AizenとAmit Duvdevaniが1996年に結成)、Skazi、Californiaといった作家が現れ、テルアビブ周辺が世界的な制作拠点になった。Infected Mushroomはとりわけ影響が大きく、ロックやメタルの要素を持ち込んで境界を押し広げた。並行してイギリスではSimon PosfordがHallucinogen名義で1995年の「Twisted」を発表し、後にRaja RamとShpongleを結成してアンビエント寄りの派生を作った。レーベルではTwisted Records、Dragonfly Records、Blue Room Released、TIP.Worldが中心となり、ドイツではSpirit Zoneが機能した。2000年代に入ると地域ごとの分岐が明確になる。南アフリカではプレトリアとヨハネスブルグを中心に、より速く攻撃的な音が発展した。ブラジルではUniverso Paralelloという野外音楽祭が2001年に始まり、南米最大の拠点となった。日本でも1990年代末から野外パーティー文化が定着し、Solstice Musicといったレーベルが活動した。ポルトガルのBoom Festivalは1997年に始まり、環境配慮と芸術性を掲げて2年に一度開催される国際的な集まりになった。この文化には常に薬物の問題が付きまとう。LSDやDMTといった幻覚剤の使用と表裏一体であることは公然の事実で、各国で摘発が繰り返されてきた。同時に、共同体としては環境保護や精神性を掲げる側面も強く、Boom Festivalのように排水を再利用し、電力を太陽光で賄う実践も行われている。2010年代以降、ヨーロッパの主流市場では周縁的な位置に留まる一方で、野外音楽祭という形式では世界的に安定した規模を保ち続けている。</p>
