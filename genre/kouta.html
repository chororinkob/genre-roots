<h1>Koutaとは</h1>
<p>小さな部屋で三味線一本に合わせて歌う、短くて粋な歌である。代表曲22曲を動画で聴け、ルーツと影響のつながりを地図でたどれる。</p>
<p>小さな部屋で三味線一本に合わせて歌う、短くて粋な歌である。演奏時間は3〜4分ほどで、四畳半ほどのお座敷が主な舞台になる。

伴奏は中棹という胴の細身の三味線。糸は端唄より太く、駒は桑や紅木などで作った大きな木駒を据える。弦を弾くのは撥ではなく「爪弾き」で、親指で人差し指の腹を押し、爪先の肉の側で弦をはじく。爪は糸に当てず、肉で弾いてまろやかで小さな音を出すのが正式とされる。

節回しは技巧的で、平坦に歌う端唄と違って、音の頭に粘りを入れたり、小さな装飾音を差し挟んだりして歌う。ただし技巧が鼻にかかってはいけない。呟くように軽妙に、艶を抑えて歌うのが本流とされた。

打楽器はなく、拍は三味線の手が支える。歌の合間に三味線が短い手を弾いて聞かせ、歌と弾きが交互に息を交わして曲を進める。

歌詞は洒落やうがち、艶を込めた短い詞章が中心で、世相を皮肉る句や逢瀬の情事を題材にしたものが多い。手の込んだ曲調に、ひねった言葉を乗せる。

かつては酒席や待合で、席のつなぎの一曲として歌われた。現在も花柳界や邦楽の稽古場で受け継がれている。</p>
<h2>成り立ち</h2><p>小唄の語は古く、1703年（元禄3年）刊行の『松の葉』にすでに見える。ここでは作曲者の分からない流行歌曲を指す言葉であった。江戸中期以降、三味線音楽の流行歌は端唄と呼ばれ、1842年（天保13年）の三味線禁止令をきっかけに、伴奏なしの都々逸や大津絵節が流行し、後に三味線付きに作り直されて端唄の表記が広まった。幕末の1844年から1854年ごろには、端唄に品位を持たせてていねいに歌う「うた沢」という流れも派生した。

小唄の創始者は清元お葉（1840〜1901）である。清元節の2世清元延寿太夫の娘で、4世の妻でもあった。1855年（安政2年）に初演した『散るはうき』が評判を呼び、小唄の礎となった。今日の形に整ったのは明治後期である。明治に入ると、花街で興じる富裕な客の間に短い歌の同好者が増え、洒落と皮肉を盛った歌詞に手の込んだ曲調が好まれるようになった。

しかし小唄が芸として体系的になったのは大正期である。清元お葉に清元節を学んだ横山さき（1863〜1919）は大正初期に東京・芝に稽古所を開いた。1913年（大正2年）には堀小多満が東京の正式認可を得て「堀派会」を設立し、小唄で最初の流派となった。以後、田村派・蓼派・吉村派・春日派が分かれ、大小約70の流派が生まれた。大正後期には湯朝竹山人が「早間小唄」、英十三が「江戸小唄」の名を使い、春日とよは新派戯曲を小唄に作り替えて家庭に浸透させた。吉田草紙庵（清元菊之輔）は芝居小唄を考案し、舞踊と結んだ「小唄振り」を広め、レコード吹き込みにも進出した。

関東大震災の後、江戸回顧の風潮と合わさって「江戸小唄」の呼び名が定着した。昭和初期には藤本二三吉の「祇園小唄」をはじめ流行小唄がレコードで大ヒットし、市丸らの名歌手が端唄・小唄を吹き込んだ。1920年代には行商人が艶っぽい小唄で客を集め、1930年（昭和5年）には警視庁の風紀取締りで「エロ小唄」として禁止される一面もあった。

戦後も盛り返し、1952年（昭和27年）前後にはゴルフ・碁と並べて「三ゴ時代」と呼ばれる繁栄期があった。家元は200に近くまで増えた。現在も大小約70流派が活動するが、高齢化が進み、後継者の育成が課題になっている。</p>
