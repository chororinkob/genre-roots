<h1>Koutaとは</h1>
<p>小唄は、小さな部屋で短く粋に歌う歌だ。代表曲22曲を動画で聴け、ルーツと影響のつながりを地図でたどれる。</p>
<p>小唄は、小さな部屋で短く粋に歌う歌だ。演奏は通常、三味線1人と歌い手1人の組み合わせ（一挺一枚）で行う。演奏時間は3〜4分ほどで、四畳半ほどのお座敷が主な舞台になる。

伴奏の中心は三味線だ。小唄で使うのは中棹という、棹が中くらいの太さの型である。糸は端唄より太く、駒には桑や紅木などで作った大きな木駒を据える。弦を弾くのは原則として「爪弾き」だ。親指で人差し指の腹を押し、爪先の肉の側で弦をはじく。爪を糸に当てず、肉で弾いてまろやかで小さな音を出すのが正式とされる。

節回しは技巧的だ。平坦に歌う端唄と違い、技巧的に歌う。ただし、その技巧が鼻についてはならない。声を張らず、独り言を呟くように、粋で軽妙洒脱に歌う。

打楽器は使わない。拍を支えるのは三味線の手だ。歌の合間に三味線が短い手を弾いて聞かせ、歌と弾きが交互に息を合わせながら曲を進めていく。

歌詞の中心は、洒落やうがち、艶を込めた短い詞章だ。遊里物、慕情物、芝居物、諷刺的なバレ唄などがある。手の込んだ曲調に、ひねった言葉を乗せて歌う。

かつては酒席や待合で、席のつなぎとなる一曲として歌われた。現在も花柳界や邦楽の稽古場で受け継がれている。</p>
<h2>成り立ち</h2><p>文献の上で最初に見えるのは「端歌（端唄）」とされ、元禄16年（1703）刊行の『松の葉』第3巻に載っている。「小唄」の語はもっと古く、室町時代の「小歌」（『閑吟集』など）に遡る。三味線音楽の流行歌は端唄と呼ばれた。天保の改革の統制で三味線が禁じられた時期には、伴奏なしの都々逸・大津絵節が流行したとされる。のちに三味線付きに作り直され、端唄の表記が広まった。幕末（弘化〜安政ごろ）には、端唄に品位を持たせてていねいに歌う「うた沢」という流れも派生した。

清元お葉（1840〜1901）は小唄の創始者とされる。1855年の『散るはうき』を起点とする。清元節の2世清元延寿太夫の娘で、4世の妻でもあった。1855年（安政2年）に初演した『散るはうき』が評判を呼び、小唄の礎となった。今日の形に整ったのは明治後期だ。明治に入ると、花街で興じる富裕な客の間に短い歌の同好者が増え、洒落と皮肉を盛った歌詞に、手の込んだ曲調が好まれるようになった。

小唄が芸として体系的になったのは大正期だ。清元お葉に清元節を学んだ横山さき（1863〜1919）は、大正初期に東京・芝に稽古所を開いた。堀小多満は1913年に堀派を創立し、1917年に家元として認可を得たとされる（創立を1917年とする資料もある）。「堀派会」は、小唄で最初の流派となった。横山さきの門下からは堀派・田村派・蓼派・吉村派・春日派などが生まれ、流派・家元は戦後に200前後まで増えた。現在は約60〜70流派が活動する。大正後期には、湯朝竹山人が「早間小唄」、英十三が「江戸小唄」の名を使った。春日とよは新派戯曲を小唄に作り替え、家庭に浸透させた。吉田草紙庵（清元菊之輔）は芝居小唄を考案し、舞踊と結んだ「小唄振り」を広めて、レコード吹き込みにも進出した。

関東大震災の後、江戸を懐かしむ風潮のなかで「江戸小唄」とも呼ばれた。昭和初期には、藤本二三吉の「祇園小唄」をはじめ流行小唄がレコードで大ヒットし、市丸らの名歌手が端唄・小唄を吹き込んだ。1920年代には行商人が艶っぽい小唄で客を集めた。1930年（昭和5年）には、行商人らが歌うエロ小唄が、児童への悪影響を理由に禁止された。

戦後も小唄は盛り返し、1952年（昭和27年）前後には、ゴルフ・碁と並べて「三ゴ時代」と呼ばれる繁栄期があった。家元は200に近くまで増えた。現在も約60〜70流派が活動しているが、高齢化が進み、後継者の育成が課題になっている。</p>
