<h1>Dark Country（ダークカントリー）とは</h1>
<p>カントリーとフォークの楽器編成を保ちながら、主題と音色を暴力、死、罪、破滅の側へ大きく振り切った様式である。ゴシック・カントリーとも呼ばれる。使われる楽器はアコースティック・ギター、バンジョー、フィドル、マンドリン、コントラバスと</p>
<p>カントリーとフォークの楽器編成を保ちながら、主題と音色を暴力、死、罪、破滅の側へ大きく振り切った様式である。ゴシック・カントリーとも呼ばれる。使われる楽器はアコースティック・ギター、バンジョー、フィドル、マンドリン、コントラバスといった伝統的なもので、そこにトレモロを深くかけたエレキギターや、低く鳴らすバリトン・ギターが加わる。特徴は音を厚く重ねないことで、楽器の数を絞り、音と音の間に大きなすき間を残す。このすき間と、深い残響の使い方が、荒野や廃屋を思わせる空間の感覚を作る。テンポは遅めで、葬送行進を思わせる重い2拍子や、引きずるような3拍子がよく使われる。曲の調は短調が多く、伝統的なカントリーが好む明るい和音の流れはあまり使われない。歌唱は低い男声で語るように歌われることが多く、朗読と歌の中間くらいの音域にとどまる。歌詞は殺人、復讐、天罰、疫病、洪水といった旧約聖書や古いバラッドの語彙で書かれ、一人称の語り手がしばしば加害者や死者として語る。伝統的なカントリーのような悔い改めや救いの結末を用意せず、破滅したまま曲を終えることもあるが、デヴィッド・ユージン・エドワーズの歌詞は、痛みや葛藤、信仰とともに救いも扱うとされる。</p>
<h2>成り立ち</h2><p>源流は20世紀以前のアパラチア地方に伝わるマーダー・バラッドと呼ばれる歌群である。イギリスやアイルランドから移民が持ち込んだ古い物語歌が、新大陸で殺人事件の実話と結びついて歌い継がれたもので、『プリティ・ポリー』のように、恋人を殺して埋める場面を淡々と描く曲が多く残っている。20世紀に入ってこの系譜を録音に残した演奏者の一組がカーター・ファミリー(初録音は1927年)であり、1950年代以降はジョニー・キャッシュが黒衣をまとって刑務所で演奏し、『フォルサム・プリズン・ブルース』のような加害者の一人称で歌う曲を主流市場に持ち込んだ。様式としてまとまった形を取るのは、1990年代後半から2000年代初めのコロラド州デンバーである(デンバー・サウンドとも呼ばれる)。デンバーのミュージシャン、デヴィッド・ユージン・エドワーズが、1992年結成の16 Horsepowerと、2001年開始のウーヴン・ハンドで、祖父が伝道師だった環境から得た旧約聖書の言語感覚と、荒々しいバンジョーとギターを結びつけ、先駆者とされる。同時代の関連作品として、オーストラリア出身でロンドンを拠点とするニック・ケイヴの1996年のアルバム『マーダー・バラッズ』が、殺人歌の伝統を現代へ引き戻した。1993年に結成されたハンドサム・ファミリーは、2003年の曲『ファー・フロム・エニー・ロード』が、2014年のテレビドラマ『トゥルー・ディテクティヴ』の主題歌に使われたことで、この音の質感が広く知られることになった。他に同時代のデンバー勢のSlim Cessna's Auto Club(1992年結成)など、そして映画音楽の分野へ影響が広がり、荒涼としたアメリカ南部を描く映像作品の、定番の音として定着している。伝統への回帰を装いながら、伝統が用意していた救済を取り除くこともあるという点で、20世紀後半以降の、批評的な視点から生まれた様式だといえる。</p>
