<h1>Dark Country（ダークカントリー）とは</h1>
<p>ダーク・カントリーは、カントリーとフォークの楽器編成を保ちながら、主題と音色を暴力、死、罪、破滅の側へ大きく振り切ったスタイルだ。ゴシック・カントリーとも呼ばれる。 楽器は、アコースティック・ギター、バンジョー、フィドル、マンドリ</p>
<p>ダーク・カントリーは、カントリーとフォークの楽器編成を保ちながら、主題と音色を暴力、死、罪、破滅の側へ大きく振り切ったスタイルだ。ゴシック・カントリーとも呼ばれる。

楽器は、アコースティック・ギター、バンジョー、フィドル、マンドリン、コントラバスといった伝統的なものを使う。そこに、奏者によっては、トレモロを深くかけたエレキギターや、低く鳴らすバリトン・ギターが加わる。

特徴は、音を厚く重ねないことだ。楽器の数を絞り、音と音の間に大きなすき間を残す。このすき間と深い残響の使い方が、荒野や廃屋を思わせる空間の感覚を生む。

遅いテンポの曲や、短調の曲が目立つ。

歌い方には幅がある。キャッシュやハンドサム・ファミリーのブレット・スパークスのように、低く語るように歌う人もいれば、エドワーズのように叫ぶように歌う人もいる。

歌詞には、殺人、復讐、天罰、疫病、洪水といった、旧約聖書や古いバラッドの言葉が使われる。一人称の語り手が、しばしば加害者や死者として語る。伝統的なカントリーのような悔い改めや救いの結末を用意せず、破滅したまま曲を終えることもある。ただし、デヴィッド・ユージン・エドワーズの歌詞は、痛みや葛藤、信仰とともに、救いも扱うとされる。</p>
<h2>成り立ち</h2><p>始まりは、20世紀以前のアパラチア地方にさかのぼる。源流の一つは、この地に伝わるマーダー・バラッドと呼ばれる歌の一群だ。イングランド、スコットランド低地、アイルランド北東部など、英語・スコッツ語圏から移民が持ち込んだ古い物語歌が、新大陸で殺人事件の実話と結びつき、歌い継がれた。『プリティ・ポリー』のように、恋人を殺して埋める場面を淡々と描く曲が多く残っている。

20世紀に入ると、この流れを録音に残す演奏者が現れる。その一組がカーター・ファミリーで、初録音は1927年だ。1950年代以降は、ジョニー・キャッシュが黒い衣装をまとって刑務所で演奏した。彼は『フォルサム・プリズン・ブルース』のような、加害者の一人称で歌う曲を、主流の市場に持ち込んだ。

スタイルとしてまとまった形を取るのは、1990年代後半から2000年代初めのコロラド州デンバーだ。デンバー・サウンドという呼び名が、ほぼ同じ意味で使われることがある。先駆者とされるのは、デンバーのミュージシャン、デヴィッド・ユージン・エドワーズである。彼は、1992年にロサンゼルスで結成し、のちデンバーを拠点とした16 Horsepowerと、2001年に始めたウーヴン・ハンドで活動した。そして、祖父が伝道師だった環境から得た旧約聖書の言葉の感覚と、荒々しいバンジョーとギターを結びつけた。

同時代の関連作品には、ニック・ケイヴ・アンド・ザ・バッド・シーズが1996年に出したアルバム『マーダー・バラッズ』がある。この作品は、殺人歌の伝統を現代へ引き戻した。ケイヴはオーストラリア出身で、1990年代にはイギリスのロンドンなどに住んでいた。

一方、ハンドサム・ファミリーは1993年にシカゴで結成され、のちにアルバカーキを拠点とした。2003年の曲『ファー・フロム・エニー・ロード』が、2014年のテレビドラマ『トゥルー・ディテクティヴ』の主題歌に使われた。これをきっかけに、この音の質感が広く知られるようになった。同時代のデンバー勢には、Slim Cessna's Auto Club(1992年結成)などがいる。

伝統に立ち返るように見せながら、伝統が用意していた救いを取り除くこともある。この点から、20世紀後半以降に批評的な視点から生まれたスタイルだと見る向きもある。</p>
