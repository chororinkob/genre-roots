<h1>Dark Country（ダークカントリー）とは</h1>
<p>カントリーとフォークの楽器編成を保ちながら、主題と音色を暴力、死、罪、破滅の側へ振り切った様式である。ゴシック・カントリーとも呼ばれる。使われる楽器はアコースティック・ギター、バンジョー、フィドル、マンドリン、コントラバスといった</p>
<p>カントリーとフォークの楽器編成を保ちながら、主題と音色を暴力、死、罪、破滅の側へ振り切った様式である。ゴシック・カントリーとも呼ばれる。使われる楽器はアコースティック・ギター、バンジョー、フィドル、マンドリン、コントラバスといった伝統的なもので、そこにトレモロを深くかけたエレキギターや、低く鳴らすバリトン・ギターが加わる。特徴は音を厚く重ねないことで、楽器の数を絞り、音と音の間に大きな空白を残す。この空白と、深い残響の使用が、荒野や廃屋を思わせる空間の感覚を作る。テンポは遅く、葬送行進を思わせる重い二拍子や、引きずるような三拍子が好まれる。調は短調が中心で、伝統的なカントリーが好む明るい和音進行はほとんど使われない。歌唱は低い男声で語るように歌われることが多く、朗読と歌の中間の音域に留まる。歌詞は殺人、復讐、天罰、疫病、洪水といった旧約聖書や古いバラッドの語彙で書かれ、一人称の語り手がしばしば加害者や死者として語る。伝統的なカントリーが持つ悔悛や救済の結末を意図的に用意せず、破滅したまま曲を終える点に、この様式の姿勢がはっきり出ている。</p>
<h2>成り立ち</h2><p>源流は二十世紀以前のアパラチア地方に伝わるマーダー・バラッドと呼ばれる歌群である。イギリスやアイルランドから移民が持ち込んだ古い物語歌が、新大陸で殺人事件の実話と結びついて歌い継がれたもので、『プリティ・ポリー』や『ノッティンガム・タウン』のように、恋人を殺して埋める場面を淡々と描く曲が多く残っている。二十世紀に入ってこの系譜を録音の形で残したのがカーター・ファミリーであり、1950年代以降はジョニー・キャッシュが黒衣をまとって刑務所で演奏し、『フォルサム・プリズン・ブルース』のような加害者の一人称で歌う曲を主流市場に持ち込んだ。様式としてまとまった形を取るのは1980年代後半で、オーストラリアからロンドンへ渡ったニック・ケイヴが、1996年のアルバム『マーダー・バラッズ』で殺人歌の伝統を意識的に現代へ引き戻した。同時期にアメリカでは、シアトルのミュージシャンだったデヴィッド・ユージン・エドワーズが1990年代にサーティーン・フロアと後のウーヴン・ハンドで、祖父が伝道師だった環境から得た旧約聖書の言語感覚と、荒々しいバンジョーとギターを結びつけた。この二つの流れが合わさって、暗いカントリーという領域が意識されるようになる。名称の定着に寄与したのが、2000年代に活動したハンドサム・ファミリーで、彼らの2003年の曲『ファー・フロム・エニー・ロード』が、2014年のテレビドラマ『トゥルー・ディテクティヴ』の主題歌に使われたことで、この音の質感が広く知られることになった。他にサーティーン・ゴースツ、マンチェスター・オーケストラ周辺、そして映画音楽の分野へ影響が広がり、荒涼としたアメリカ南部を描く映像作品の定番の音として定着している。伝統への回帰を装いながら、実際には伝統が用意していた救済を取り除くという点で、二十世紀後半以降の批評的な立場から生まれた様式だといえる。</p>
