<h1>Metalcore（メタルコア）とは</h1>
<p>ヘヴィメタルとハードコア・パンクを融合させた広い意味のジャンルで、2000年代のメロディック・メタルコアでは、スウェーデン由来の旋律的なデスメタルのギターが接続される。この系統では曲の構造は多くの場合直線的で、絶叫による激しい部分</p>
<p>ヘヴィメタルとハードコア・パンクを融合させた広い意味のジャンルで、2000年代のメロディック・メタルコアでは、スウェーデン由来の旋律的なデスメタルのギターが接続される。この系統では曲の構造は多くの場合直線的で、絶叫による激しい部分に、澄んだ声で歌い上げる合唱部分が続く。この叫びと歌の対比が、感情の振れ幅を分かりやすく提示する仕掛けとなっている。もう一つの典型的な要素が、遅い刻み、または速い三連系のパターンを、パームミュート（弦を手のひらで押さえて鳴らす奏法）で低音側の弦に集中して弾く、モッシュの合図となる部分（ブレイクダウンと呼ばれる）であり、これは聴き手が身体をぶつけ合って踊るために用意された空間である。ギターはDrop D〜Drop A程度のドロップ・チューニングが一般的で、7弦・8弦も使われ、ハーモナイズされた哀愁のあるギター・リフを多用し、低音域では短く切った刻みも担当する。トレモロ・ピッキングを使ったハーモナイズされたギター・リフが特徴で、旋律ははっきりと歌える形を保つ。ドラムはダブルキック（バスドラムを2つ踏む奏法）を多用し、ブラストビートも時に用いる。直線的な（ストレートな）ビートや重い部分に切り替わることもある。歌詞は裏切り、自己の弱さ、依存からの回復、信仰、社会への異議といった主題を扱い。デスメタルの持つ非人間的な冷たさとは異なり、あくまで人間の感情の告白として組み立てられている点が特徴である。</p>
<h2>成り立ち</h2><p>母体は1980年代のアメリカのハードコア・パンクにあり、メタルコアは1980年代後半〜1990年代初頭にハードコアから生まれ、1990年代のアメリカで形になった。オハイオ州クリーヴランドのIntegrityは1988年から、宗教的で終末論的な世界観とメタルのギターをハードコアに持ち込み、ニューヨーク州シラキュースのEarth Crisisは菜食主義と薬物を拒む生き方を掲げて、思想的な厳格さをこの分野に刻んだ。1990年代にはマサチューセッツのConvergeが、混沌とした構成と生々しい絶叫によって、後にカオティック・ハードコア（混沌として激しいハードコア）と呼ばれる方向を切り開き、2001年の作品ジェーン・ドウは、Terrorizer誌が2001年の年間最優秀作に選ぶなど、高く評価されている。決定的な転換は1990年代後半に始まった。Overcastなどが、スウェーデンのイェーテボリで発達した旋律的デスメタルの、哀愁を帯びたハーモナイズされたギターを、アメリカのハードコアの構造と結びつけ、2000年代初頭にKillswitch Engageらによって広く知られるようになったのである。マサチューセッツのKillswitch Engageは、当時ドラマーだったAdam Dutkiewiczが制作し（ミックスはAndy Sneapが担当）、2002年のアライヴ・オア・ジャスト・ブリージングで、澄んだ声のサビと絶叫のヴァースという構造を決定づけ、この融合を大衆的に広めた。歌手がJesse LeachからHoward Jonesへ交代した後の2004年の作品は全米21位を記録し（ゴールド認定は2007年）、この様式が主流の注目を集める。Shadows FallやUnearthは先行して同様の試みを行っており、As I Lay DyingやAll That Remainsらとともに2000年代に主流化し、かつて毎夏、米国とカナダを巡回した野外興行のWarped Tourと、Roadrunner、Victory、Trustkillといったレーベルが流通と動員を支えた。イギリスからはBullet for My ValentineやBring Me the Horizonが現れ、様式は国際化する。しかし急速な普及は形骸化も招き、2000年代後半には、叫びと歌の交代と重い刻みという型をなぞるだけの作品が氾濫したという批判があった（Metal Hammer誌のStephen Hillなど）。加えて2013年、As I Lay Dyingの中心人物Tim Lambesisが妻の殺害を依頼した容疑で逮捕され有罪となった事件により、バンドは2014年から無期限の活動休止に入った（2018年に再結成）。2010年代にはBring Me the HorizonやArchitectsらが商業的な成功を広げ、2020年代にはSpiritboxなど、ニューメタルやシューゲイズ、電子音などを取り込む動きが続いている。</p>
