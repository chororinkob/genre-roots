<h1>Metalcore（メタルコア）とは</h1>
<p>メタルコアは、ハードコア・パンクの怒りと共同体的な熱狂に、ヘヴィメタルを融合させた広い意味のジャンルだ。2000年代のメロディック・メタルコアでは、スウェーデン由来の旋律的なデスメタルのギターが接続される。 ギターはDrop D〜</p>
<p>メタルコアは、ハードコア・パンクの怒りと共同体的な熱狂に、ヘヴィメタルを融合させた広い意味のジャンルだ。2000年代のメロディック・メタルコアでは、スウェーデン由来の旋律的なデスメタルのギターが接続される。

ギターはDrop D〜Drop A程度のドロップ・チューニングが一般的で、7弦・8弦も使われる。高音域では、2本のギターが3度（ドとミのような離れた音）で重ねた哀愁のある旋律を弾くことが多い。低音域では、短く切った刻みを担当する。この二つの役割を目まぐるしく往復することが多い。

ドラムはダブルキックを多用し、ブラストビート（スネアとバスドラムを極端に速く連打する奏法）も時に用いる。そこから直線的な（ストレートな）ビート、そして半分の速度の重い部分までを、曲の中で何度も切り替える。

この系統では、多くの場合曲の構造に明確な定型がある。絶叫による激しい部分と、澄んだ声で歌い上げる合唱部分が交互に配置される。この叫びと歌の対比が、感情の振れ幅を分かりやすく提示する仕掛けとなっている。もう一つの典型的な要素が、ブレイクダウンと呼ばれる部分だ。遅い刻み、または速い三連系のパターンを、パームミュートで低音側の弦に集中して弾く、モッシュの合図となる部分である。これは聴き手が身体をぶつけ合って踊るために用意された空間である。

歌詞は裏切り、自己の弱さ、依存からの回復、信仰、社会への異議といった主題を扱う。聴き手に直接語りかける「あなた」の形が多い。デスメタルの持つ非人間的な冷たさとは異なり、あくまで人間の感情の告白として組み立てられている点が特徴である。</p>
<h2>成り立ち</h2><p>メタルコアの母体は、1980年代のアメリカのハードコア・パンクにある。

オハイオ州クリーヴランドのIntegrityは1988年から、宗教的で終末論的な世界観とメタルのギターをハードコアに持ち込んだ。ニューヨーク州シラキュースのEarth Crisisは菜食主義と薬物を拒む生き方を掲げて、思想的な厳格さをこの分野に刻んだ。

1990年代にはマサチューセッツのConvergeが、混沌とした構成と生々しい絶叫によって、後にカオティック・ハードコア（混沌として激しいハードコア）と呼ばれる方向を切り開いた。2001年の作品ジェーン・ドウは、Terrorizer誌が2001年の年間最優秀作に選ぶなど、高く評価されている。

1990年代後半にOvercastなどが旋律的デスメタルを取り入れ、2000年代初頭にKillswitch Engageらで広く知られるようになった。スウェーデンのイェーテボリで発達した旋律的デスメタルの、哀愁を帯びた3度重ねのギターが、アメリカのハードコアの構造と結びついたのである。

マサチューセッツのKillswitch Engageは、当時ドラマーだったAdam Dutkiewiczが制作し、ミックスはAndy Sneapが担当した。2002年のアライヴ・オア・ジャスト・ブリージングは、この融合を大衆的に広めた代表作で、澄んだ声のサビと絶叫のヴァースという構造を決定づけた作品である。歌手がJesse LeachからHoward Jonesへ交代した後の2004年の作品は全米21位を記録し（ゴールド認定は2007年）、このスタイルが主流の注目を集める。

Shadows FallやUnearthは先行して同様の試みを行い、As I Lay DyingやAll That Remainsらとともに2000年代に主流化した。かつて毎夏、米国とカナダを巡回した野外興行のWarped Tourと、Roadrunner、Victory、Trustkillといったレーベルが、流通と動員を支えた。イギリスからはBullet for My ValentineやBring Me the Horizonが現れ、スタイルは国際化する。

しかし急速な普及は形骸化も招いた。2000年代後半には、Metal Hammer誌のStephen Hillが、外部の目にはメタルコアは終わった、一面的な一時の流行に見えたと評した。加えて2013年、As I Lay Dyingの中心人物Tim Lambesisが妻の殺害を依頼した容疑で逮捕され有罪となった。この事件により、バンドは2014年から無期限の活動休止に入った（2018年に再結成）。

2010年代にはBring Me the HorizonやArchitectsらが商業的な成功を広げ、2020年代にはSpiritboxなど、ニューメタルやシューゲイズ、電子音などを取り込む動きが続いている。</p>
