<h1>Metalcore（メタルコア）とは</h1>
<p>ハードコア・パンクの怒りと共同体的な熱狂に、スウェーデン由来の旋律的なデスメタルのギターを接続した音楽である。曲の構造には明確な定型があり、絶叫による激しい部分と、澄んだ声で歌い上げる合唱部分が交互に配置される。この叫びと歌の対比</p>
<p>ハードコア・パンクの怒りと共同体的な熱狂に、スウェーデン由来の旋律的なデスメタルのギターを接続した音楽である。曲の構造には明確な定型があり、絶叫による激しい部分と、澄んだ声で歌い上げる合唱部分が交互に配置される。この叫びと歌の対比が、感情の振れ幅を分かりやすく提示する仕掛けとなっている。もう一つの必須要素が、突然テンポが半分に落ちて、低い弦を重く刻むだけの部分であり、これは聴き手が身体をぶつけ合って踊るために用意された空間である。ギターは半音から二音下げた調弦を用い、高音域では三度で重ねた哀愁のある旋律を、低音域では短く切った刻みを担当し、この二つの役割を目まぐるしく往復する。音階は自然短音階と和声的短音階が中心で、旋律ははっきりと歌える形を保つ。ドラムはブラストビートのような高速の連打から、四つ打ちに近い直線的な刻み、そして半分の速度の重い部分までを、曲の中で何度も切り替える。歌詞は裏切り、自己の弱さ、依存からの回復、信仰、社会への異議といった主題を扱い、聴き手に直接語りかける二人称が多い。デスメタルの持つ非人間的な冷たさとは異なり、あくまで人間の感情の告白として組み立てられている点が特徴である。</p>
<h2>成り立ち</h2><p>母体は1980年代のアメリカのハードコア・パンクにある。オハイオ州クリーヴランドのIntegrityは1988年から、宗教的で終末論的な世界観とメタルのギターをハードコアに持ち込み、ニューヨーク州シラキュースのEarth Crisisは菜食主義と薬物を拒む生き方を掲げて、思想的な厳格さをこの分野に刻んだ。1990年代にはマサチューセッツのConvergeが、混沌とした構成と生々しい絶叫によって、後にカオティック・ハードコアと呼ばれる方向を切り開き、2001年の作品ジェーン・ドウはこの領域の最高峰として評価されている。決定的な転換は2000年代初頭に起きた。スウェーデンのイェーテボリで発達した旋律的デスメタルの、哀愁を帯びた三度重ねのギターが、アメリカのハードコアの構造と結びついたのである。マサチューセッツのKillswitch Engageは、ギタリストのAdam Dutkiewiczが自ら録音と制作を手掛け、2002年のアライヴ・オア・ジャスト・ブリージングでこの融合を完成させた。歌手がJesse LeachからHoward Jonesへ交代した後の2004年の作品は商業的にも大きく成功し、この様式が全米の主流へ躍り出る。同時期にShadows Fall、Unearth、As I Lay Dying、All That Remainsが続き、毎夏アメリカ各地を巡回する野外興行のWarped Tourと、Roadrunner、Victory、Trustkillといったレーベルが流通と動員を支えた。イギリスからはBullet for My ValentineやBring Me the Horizonが現れ、様式は国際化する。しかし急速な普及は形骸化も招き、2000年代後半には、叫びと歌の交代と重い刻みという型をなぞるだけの作品が氾濫し、批評的な評価は急落した。加えて2013年、As I Lay Dyingの中心人物Tim Lambesisが妻の殺害を依頼した容疑で逮捕され有罪となった事件は、信仰や誠実さを掲げてきたこの分野に深刻な打撃を与えた。2010年代半ば以降は下火となったが、2020年代に入ると当時10代だった世代が制作者となり、電子音や現代的な音像を取り入れた新しい形で再び広く聴かれるようになっている。</p>
