<h1>Subground（サブグラウンド）とは</h1>
<p>ハードコア・テクノの中でも、暗く実験的な方向を追求する領域を指す呼称である。テンポは一分間に150から180拍程度が中心で、極端な高速化よりも音の質感と空間の作り方に重点が置かれる。バスドラムは歪ませて用いられるが、単純に音圧を上</p>
<p>ハードコア・テクノの中でも、暗く実験的な方向を追求する領域を指す呼称である。テンポは一分間に150から180拍程度が中心で、極端な高速化よりも音の質感と空間の作り方に重点が置かれる。バスドラムは歪ませて用いられるが、単純に音圧を上げるのではなく、余韻の長さや音程の動きが細かく設計される。この様式を特徴づけているのが、音と音の間に残される空白と、そこに敷かれる持続音である。工業的な環境音、金属の反響、低い唸りといった素材が層として重ねられ、閉ざされた地下空間を思わせる音響が作られる。旋律の要素はほとんど用いられず、和音も不協和なものが選ばれる。声の素材は加工された断片として置かれ、意味を伝えるためではなく質感を補強するために使われる。曲の構成は展開の起伏を抑え、同じ音型を反復しながら音の層を少しずつ入れ替えていく形が多い。大規模な会場での高揚を目的とせず、暗い室内で長時間かけて聴かせることを前提に設計されている。ハードコア系の速度と音圧を保ちながら、その目的を踊りから聴取へ移した点に、この領域の性格が現れている。</p>
<h2>成り立ち</h2><p>1990年代後半から2000年代前半にかけて、ハードコア・テクノの領域は速度と音圧の競争が限界に達しつつあった。一分間に200拍を超える速度と、これ以上歪ませようのない音が出揃い、単純な過激さでは差が付かなくなっていたのである。この行き詰まりに対する応答として、複数の方向が同時に模索された。速度を落として重さを求める方向がドゥームコアとなり、リズムを極限まで細分化する方向がスピードコアやスプリッターコアとなった。そしてもう一つ、音の質感と空間の設計へ重点を移す方向があり、それがこの領域である。中心となったのは欧州、とりわけドイツとオランダの小規模なレーベルと、それを支える催しの現場だった。インダストリアル・ハードコアと呼ばれる領域とは実質的にほぼ重なっており、明確な線引きは存在しない。この呼称が使われるようになった背景には、既存の分類が実態に追いつかなくなったという事情がある。細分化が進んだ結果、どの名前で呼ぶかが制作者の自己申告に委ねられる状況が生まれていた。制作者たちは工業的な音響や実験音楽の手法を積極的に取り入れ、ハードコアの枠組みを保ちながら別の目的へ向かった。具体的には、現代音楽の空間処理や、フィールド録音の使い方といった、ダンス音楽の外側の技法である。発表の場は極めて限定的で、自主制作の盤と、参加者が数十人から数百人規模の催しが中心だった。商業的な成功はほとんど想定されておらず、制作者の多くが別の職業を持ちながら活動している。この経済的な独立が、流行に左右されない継続を可能にしてきた。売れる必要がないため、聴きやすさへ譲歩する理由もなかったのである。2010年代以降は、実験的な電子音楽の領域からこの音に接近する作り手が増え、ダンス音楽の分類の外側で評価されることも多くなった。速度で競わないという選択が、結果として長い寿命をもたらした点は、同じ時期に生まれたドゥームコアと共通している。</p>
