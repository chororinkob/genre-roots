<h1>Subground（サブグラウンド）とは</h1>
<p>サブグラウンドは、ハードダンス(ハードスタイルなど、速くて重いダンス音楽の総称)の一つだ。2011年の初めに、イタリアのActivatorが提唱した。 ハードスタイル、テクノ、イタリア系のプログレッシブ・トランスを混ぜ合わせたスタ</p>
<p>サブグラウンドは、ハードダンス(ハードスタイルなど、速くて重いダンス音楽の総称)の一つだ。2011年の初めに、イタリアのActivatorが提唱した。

ハードスタイル、テクノ、イタリア系のプログレッシブ・トランスを混ぜ合わせたスタイルとされる。エレクトロハウスやハードトランスを挙げる見方もある。ハードスタイルは、1990年代後半にオランダ、ベルギー、イタリアなどで広まったスタイルで、起源は一つに特定できない。

テンポは130〜135BPM前後だ。現代のハードスタイルは約150BPM、初期は約140BPMで、そのどちらよりも遅い。

Activator自身は、この音楽を、サブベース（耳より体に響く極低音）をオン・ビートに置く電子音楽の混合スタイルと定義している。</p>
<h2>成り立ち</h2><p>2011年の初め、イタリアのActivatorがサブグラウンドを提唱した。Activatorは、イタリアにおけるハードスタイルの草分けの一人とされる。

ハードスタイルは、1990年代後半にオランダ、ベルギー、イタリアなどで登場した電子ダンス音楽だ。起源は一つに特定できない。

Activatorは、ハードスタイルとテクノ、イタリア系のプログレッシブ・トランスを混ぜ合わせたこの新しいスタイルを、2011年2月にイタリアのハードスタイルのイベントで披露した。その後、Q-danceが開く大規模な野外フェスティバルDefqon.1で、紹介する機会を得た。さらにQ-danceのQULTシリーズ（イベント・ラジオ）で取り上げられ、Defqon.1やTomorrowlandのQ-dance/Qultステージにも出演した。2014年ごろには、ハードダンスの世界で、QULTのラジオ番組やイベントを通じて注目を集めたとされる。

一方、この音楽はハードコア・テクノの系統とは別物だ。たとえばドゥームコアは、1990年代前半にドイツ・フランクフルトのPCP（Marc Acardipane/Trauner）の周辺で広まった。スピードコアは、1990年代前半から半ばにかけて生まれた。どちらも、サブグラウンドとは時期も系統も異なる。</p>
<h2>代表曲</h2><ul><li>Warcry [HWS005] (Audiofreq)</li><li>Resurrection (Audiofreq)</li><li>Revival (Audiofreq)</li><li>Peer Pressure (Sei2ure)</li><li>The Sound Of Qult (ACTI)</li><li>Qulthelden (S1ngular)</li><li>Acid Lights (A*S*Y*S)</li><li>Gimme A Beat (Geck-e)</li><li>Qult Indoctrination Tool (Geck-e)</li><li>Audiofile.002 (Audiofreq)</li><li>I Send You To Hell (Sei2ure)</li><li>Intro (Audiofreq)</li><li>Subground (Audiofreq)</li></ul>
