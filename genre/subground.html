<h1>Subground（サブグラウンド）とは</h1>
<p>サブグラウンドは、2011年の初めにイタリアのActivatorが提唱したハードダンス(ハードスタイルなど、速くて重いダンス音楽の総称)の一つである。ハードスタイル、テクノ、イタリア系のプログレッシブ・トランスを混ぜ合わせた様式と</p>
<p>サブグラウンドは、2011年の初めにイタリアのActivatorが提唱したハードダンス(ハードスタイルなど、速くて重いダンス音楽の総称)の一つである。ハードスタイル、テクノ、イタリア系のプログレッシブ・トランスを混ぜ合わせた様式とされ、ハードスタイルは1990年代後半にオランダ、ベルギー、イタリアなどで広まった様式で、起源は一つに特定できない。サブグラウンドのテンポは130〜135BPM前後で、約150BPMとされるハードスタイルより遅い。特徴は、サブベース（耳より体に響く極低音）を拍の頭に置く「サブベース・オン・ビート」と呼ばれる手法である。ハードコア・テクノの暗く実験的な領域を指す呼称と混同されやすいが、出典で確認できるのはここで述べたハードダンスの様式で、インダストリアル・ハードコアとは別物とされる。</p>
<h2>成り立ち</h2><p>サブグラウンドは、2011年の初めに、イタリアのActivatorによって提唱された。Activatorはイタリアにおけるハードスタイルの草分けの一人とされる。ハードスタイルは1990年代後半にオランダ、ベルギー、イタリアなどで登場した電子ダンス音楽で、起源は一つに特定できない。Activatorは、ハードスタイルとテクノ、イタリア系のプログレッシブ・トランスを混ぜ合わせたこの新しい様式を、2011年2月にイタリアのハードスタイルのイベントで披露し、その後、Q-danceが開く大規模な野外フェスティバルDefqon.1で紹介する機会を得た。Q-danceのQULTと呼ばれるステージに関わる形で広まり、2014年には、QULTのラジオやイベントを通じて、非常に大きな人気を得たとされる。この様式は、ハードコア・テクノの系統とは別で、たとえばドゥームコアは1990年代前半にフランクフルトとロッテルダム周辺で、スピードコアは1990年代前半から半ばにかけて生まれており、サブグラウンドとは時期も系統も異なる。この名前は、ハードコア・テクノの暗く実験的な領域を指すものとして説明されることがあるが、出典で確認できるサブグラウンドは、ここで述べたハードダンスの様式であり、注意が必要である。</p>
