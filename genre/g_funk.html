<h1>G-Funk（ジーファンク）とは</h1>
<p>1990年代前半のアメリカ西海岸で完成した、ゆったりと重心の低いヒップホップの様式である。最大の識別点は、高い音域で細く伸びるシンセサイザーの単音旋律で、音と音の間を滑らかに繋ぐポルタメントによって、口笛のような、あるいは泣いてい</p>
<p>1990年代前半のアメリカ西海岸で完成した、ゆったりと重心の低いヒップホップの様式である。最大の識別点は、高い音域で細く伸びるシンセサイザーの単音旋律で、音と音の間を滑らかに繋ぐポルタメントによって、口笛のような、あるいは泣いているような独特の音程の揺れが生まれる。この音の下に、実際に人が弾き直した太く弾力のあるベースラインが置かれる。既成のレコードを切り貼りするのではなく、演奏者を呼んで生で弾かせるという方法は当時としては贅沢で、そのぶん音の粒が揃い、低音が滑らかに繋がる。テンポは90から95 BPM前後と極めて遅く、ドラムは808系の伸びる低音と、深い残響をかけたスネアで組まれ、拍の間に大きな余白が残される。和声は短調の循環進行が基本で、そこへ女性の裏声による柔らかい合唱と、鼻にかかった甘い歌唱による繰り返し部分が乗る。ラップは急がず、拍にゆったり乗せて発声される。歌詞は街頭の暴力を扱いながらも、同時に大麻、酒、車、そして日常の気だるさを描き、緊張と弛緩が同居する。開けた車の窓から低音が響くことを前提にした音の設計であり、車高を下げた自動車で街を流す文化と不可分に結びついている。</p>
<h2>成り立ち</h2><p>土台となったのは1970年代にGeorge Clintonが率いたParliamentとFunkadelicの一連の作品である。彼らが作り上げた、宇宙的な物語と、Bootsy Collinsによる弾むベース、そして分厚い合唱を持つファンクは、1980年代の若者にとって親の世代の音楽だったが、ロサンゼルス周辺ではその低音の質感が街の空気に合致していた。カリフォルニア州ポモナのAbove the Lawは、自らがこの様式の考案者であると主張しており、実際に1990年前後の彼らの作品には既に特徴の多くが現れている。しかしこれを完成させ世界へ広めたのは、N.W.Aを離れてDeath Row Recordsに合流したDr. Dreである。彼が1992年に発表したザ・クロニックは、サンプリングに頼らず演奏者を集めて原曲の質感を再現するという手法を徹底し、遅く重く滑らかな音の全体像を提示した。無名だったSnoop Doggy Doggがこの作品で全面的に登場し、翌1993年の彼自身の作品は全米初登場1位を記録する。1994年にはWarren Gとその義兄弟にあたるNate Doggによる楽曲が、街路の危機と甘い歌唱を同居させて世界的なヒットとなり、この様式の代名詞となった。Nate Doggの、ラップと歌唱の中間にある独特の低い歌声は、以後のヒップホップにおける歌えるフックの原型となる。DJ Quikはコンプトンから、より打楽器的で細やかな別系統を提示した。しかし成功の裏側で、Death Row Recordsは経営者Suge Knightによる暴力的な運営で悪名を高め、東海岸との対立の煽動を経て、1996年の2Pac殺害、そしてDr. Dreの離脱とSuge Knightの収監によって崩壊した。様式としても、1990年代末には過剰な模倣によって新鮮さを失う。それでも、遅いテンポと甘い旋律と重い低音という組み合わせは、その後の南部のヒップホップ、2010年代の西海岸の復興、さらには日本を含む各国の制作者へ広く受け継がれ、現在も夏の車内で最も聴かれる音のひとつであり続けている。</p>
