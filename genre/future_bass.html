<h1>Future Bass（フューチャーベース）とは</h1>
<p>フューチャー・ベースは、明るく甘い響きを前面に出したベース・ミュージックだ。2010年代前半に形成され、2013〜2016年に主流化した。 特徴的なのは、主旋律の作り方である。鋸波（ぎざぎざの波形）系のシンセに、重厚な和音を弾かせ</p>
<p>フューチャー・ベースは、明るく甘い響きを前面に出したベース・ミュージックだ。2010年代前半に形成され、2013〜2016年に主流化した。

特徴的なのは、主旋律の作り方である。鋸波（ぎざぎざの波形）系のシンセに、重厚な和音を弾かせる。その音量をサイドチェイン（キックに合わせて音量を下げる処理）やLFO（ゆっくり周期的に音を揺らす装置）で細かく上下させる。すると和音全体が、呼吸するように膨らんだり縮んだりする。この揺れによって、旋律というより「歌っているシンセ」のように機能する。

和声（コードの響き）は、メジャー7thや9th、sus4など、柔らかい響きの和音を多用する。R&amp;Bやゴスペルに近い甘さがあるとされる。

BPM（1分間の拍数）は、130〜175と説明されることが多い。ただし、キックとスネアはその半分の速度で置かれることが多い。そのため体感は、ゆったりしたトラップに近い。ハイハット（小さなシンバルを重ねた装置）は、32分音符の連打（ロール）で細かく刻まれることがある。トラップの要素を取り入れた部分もある。

ボーカルは、高くピッチシフト（音の高さを変える処理）して、子供のような声色にしたものが多い。切り刻んで、楽器のように並べたものも多い。

曲の山場のドロップ（山場で一気に爆発する部分）は、低音で殴るのではない。和音の厚みと高音のきらめきで、感情を持ち上げる方向に働く。しばしば、切なさと多幸感が同時に立ち上がる。

ダブステップの攻撃性とEDMの高揚感の中間に、甘い色彩を持ち込んだ点が独自性である。「アニメ的」という評は、主にKawaii Future Bassの特徴だ。</p>
<h2>成り立ち</h2><p>2010年代前半に、英国・米国・オーストラリアなどで、並行して形成された。2013〜2016年に主流化している。インターネット上のプロデューサー同士の交流の中でも広がった。

前史がある。2000年代後半のウォンキー・シーンから出たHudson Mohawke（グラスゴー）やRustieが、2010年ごろには、フューチャー・ベース的な曲も作り始めた。2011年のRustieのアルバム『Glass Swords』（2011年10月10日、Warp Records）は、「マキシマリズム（音を詰め込む作り方）」と評された。先駆者とされる。

決定的だったのは、若手のプロデューサーたちと、オーストラリア・シドニー出身のFlume（Harley Streten）である。Flume は2012年のセルフタイトル作を出した。さらに2013〜2014年には、リミックス（別の人が作り直した版）を次々と発表する。とりわけ、2013年のDisclosure のYou &amp; Me のリミックスと、2014年のLordeのTennis Court のリミックスは大きかった。これらで、和音全体を揺らす手法が、広く知られるようになった。

同じ時期、SoundCloudを舞台にした若手同士のリミックス文化が広がった。カナダのRyan Hemsworthは、Wave Racerらとリミックスを交換していた。流通の中心となったのは、SoundCloud と、Trap Nation、Chill Nation といったYouTubeのキュレーション（選曲して紹介する）・チャンネルである。これらの再生数がそのまま知名度を作るという、新しい仕組みが働いたと見られる。

2015年から2016年にかけては、2013〜2014年ごろから活動していた米国のIllenium、Louis The Childや、オランダのSan Holoらが大きく浮上した。米国のMarshmelloは、2015年に登場している。こうして、フェスの大舞台でも通用する形へ拡張された。

ジャンルの形成後には、派生ジャンルのKawaii Future Bassが日本で生まれた。Snail's House（Ujico*）は、2015年のEP『Kirara』で、その先駆者とされる。Yunomi らもこの流れで活動し、アニメ文化と結び付いて、独立した支流を形成した。

一部で『画一的』との批判もあった。しかし、その和声感覚とボーカル加工の手法は、現在のポップスに広く残っている。</p>
<h2>代表曲</h2><ul><li>Alone (Marshmello)</li><li>Never Be Like You (Flume ft. Kai)</li><li>Shelter (Porter Robinson)</li><li>Fractures (Illenium ft. Nevve)</li><li>Light (San Holo)</li><li>Crawl Outta Love (Illenium)</li><li>Say My Name (ODESZA)</li><li>Worlds Apart (Seven Lions)</li><li>Say It (Flume)</li><li>Holdin On (Flume)</li><li>It's Strange (Louis The Child ft. K.Flay)</li><li>Love Is Alive (Louis The Child)</li></ul>
