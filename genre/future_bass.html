<h1>Future Bass（フューチャーベース）とは</h1>
<p>2010年代半ばに確立した、明るく甘い響きを前面に出したベース・ミュージック。最大の特徴は「サイドチェイン・ワブ」と呼ばれる主旋律の作り方で、鋸波系のシンセに重厚な和音を弾かせ、その音量をLFOで細かく上下させることで、和音全体が</p>
<p>2010年代半ばに確立した、明るく甘い響きを前面に出したベース・ミュージック。最大の特徴は「サイドチェイン・ワブ」と呼ばれる主旋律の作り方で、鋸波系のシンセに重厚な和音を弾かせ、その音量をLFOで細かく上下させることで、和音全体が呼吸するように膨らんだり縮んだりする。この揺れが人の声のように子音を持って聴こえるため、旋律というより「歌っているシンセ」として機能する。和声はメジャー7thや9th、sus4など柔らかい響きの和音を多用し、R&amp;Bやゴスペルに近い甘さがある。BPMは140〜160の表記が一般的だが、キックとスネアはその半分の速度で置かれるため、体感は70〜80のゆったりしたトラップに近い。ハイハットは32分音符の連打（ロール）で細かく刻まれ、この点はトラップから直接受け継いでいる。ボーカルは高くピッチシフトして子供のような声色にしたもの、切り刻んで楽器のように並べたものが多い。ドロップは低音で殴るのではなく、和音の厚みと高音のきらめきで感情を持ち上げる方向に働き、しばしば切なさと多幸感が同時に立ち上がる。ダブステップの攻撃性とEDMの高揚感の中間に、アニメ的とも評される甘い色彩を持ち込んだ点が独自性である。</p>
<h2>成り立ち</h2><p>2013年から2015年頃にかけて、インターネット上のプロデューサー同士の交流から自然発生的に形成された。前史として、2011年前後にHudson Mohawke（グラスゴー）やRustie がWarp Records から発表した、極彩色のシンセと重い低音を組み合わせた「ウォンキー」「マキシマリズム」と呼ばれる作風があり、これが直接の土台となった。決定的だったのは日本のプロデューサーKawaii Future Bass 勢を含む若手と、米国シアトルのFlume（オーストラリアのHarley Streten）である。Flume は2012年のセルフタイトル作、そして2013年前後のリミックス群、とりわけLordeのTennis Court やDisclosure のYou &amp; Me のリミックスで、和音全体を揺らす手法を広く知らしめた。同時期、カナダのRyan Hemsworth、米国のCashmere Cat（ノルウェーのMagnus August Høiberg）、Mr. Carmack らがSoundCloud上で相互にリミックスを投稿し合い、レーベルを介さずに様式が固まっていった。流通の中心となったのはSoundCloud と、Trap Nation、Chill Nation といったYouTubeのキュレーション・チャンネルで、これらの再生数がそのまま知名度を作るという新しい仕組みが働いた。2015年から2016年にかけては米国のMarshmello、San Holo、Illenium、Louis The Child らが登場し、フェスの大舞台でも通用する形へ拡張された。日本では2016年前後に「Kawaii Future Bass」としてSnail's House（Ujico*）、Yunomi らが独自の展開を見せ、アニメやボーカロイド文化と結び付いて独立した支流を形成した。批判としては、プリセット音源の普及により作品が均質化したこと、ドロップの型が数年で固定化したことが指摘され、2018年頃からは主流の座を後退させたが、その和声感覚とボーカル加工の手法は現在のポップスに広く残っている。</p>
