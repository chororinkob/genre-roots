<h1>Future Bass（フューチャーベース）とは</h1>
<p>2010年代半ばに確立した、明るく甘い響きを前面に出したベース・ミュージック。特徴的なのは主旋律の作り方で、鋸波系のシンセに重厚な和音を弾かせ、その音量をサイドチェイン（キックに合わせて音量を下げる処理）やLFOで細かく上下させる</p>
<p>2010年代半ばに確立した、明るく甘い響きを前面に出したベース・ミュージック。特徴的なのは主旋律の作り方で、鋸波系のシンセに重厚な和音を弾かせ、その音量をサイドチェイン（キックに合わせて音量を下げる処理）やLFOで細かく上下させることで、和音全体が呼吸するように膨らんだり縮んだりする。この揺れによって、旋律というより「歌っているシンセ」のように機能する。和声はメジャー7thや9th、sus4など柔らかい響きの和音を多用し、R&amp;Bやゴスペルに近い甘さがある。BPMは130〜175と説明されることが多いが、キックとスネアはその半分の速度で置かれるため、体感はゆったりしたトラップに近い。ハイハットは32分音符の連打（ロール）で細かく刻まれることがあり、トラップの要素を取り入れた部分もある。ボーカルは高くピッチシフトして子供のような声色にしたもの、切り刻んで楽器のように並べたものが多い。ドロップは低音で殴るのではなく、和音の厚みと高音のきらめきで感情を持ち上げる方向に働き、しばしば切なさと多幸感が同時に立ち上がる。ダブステップの攻撃性とEDMの高揚感の中間に、アニメ的とも評される甘い色彩を持ち込んだ点が独自性である。</p>
<h2>成り立ち</h2><p>2010年代前半に英国・米国・オーストラリアなどで並行して形成され、2013〜2016年に主流化した。インターネット上のプロデューサー同士の交流の中でも広がった。前史として、Hudson Mohawke（グラスゴー）やRustieらが2010年ごろから手がけ、2011年のRustieのアルバム『Glass Swords』（Warp Records）などで広まった、極彩色のシンセと重い低音を組み合わせた「ウォンキー」「マキシマリズム」と呼ばれる作風があり、これが直接の土台となった。決定的だったのは、若手のプロデューサーたちと、オーストラリア・シドニー出身のFlume（Harley Streten）である。Flume は2012年のセルフタイトル作、そして2013〜2014年のリミックス群、とりわけ2013年のDisclosure のYou &amp; Me のリミックスや2014年のLordeのTennis Court のリミックスで、和音全体を揺らす手法を広く知らしめた。同時期、カナダのRyan Hemsworth、ノルウェーのCashmere Cat（Magnus August Høiberg）、Mr. Carmack らがSoundCloud上で相互にリミックスを投稿し合い、レーベルを介さずに様式が固まっていった。流通の中心となったのはSoundCloud と、Trap Nation、Chill Nation といったYouTubeのキュレーション・チャンネルで、これらの再生数がそのまま知名度を作るという新しい仕組みが働いた。2015年から2016年にかけては米国のMarshmello、Illenium、Louis The Childや、オランダのSan Holoらが登場し、フェスの大舞台でも通用する形へ拡張された。ジャンルの形成後には、派生ジャンルのKawaii Future Bassが日本で生まれ、Snail's House（Ujico*）は2015年のEP『Kirara』でその先駆者とされる。Yunomi らもこの流れで活動し、アニメ文化と結び付いて独立した支流を形成した。批判としては、プリセット音源の普及により作品が均質化したこと、ドロップの型が数年で固定化したことが指摘され、2018年頃からは主流の座を後退させたが、その和声感覚とボーカル加工の手法は現在のポップスに広く残っている。</p>
<h2>代表曲</h2><ul><li>Alone (Marshmello)</li><li>Never Be Like You (Flume ft. Kai)</li><li>Shelter (Porter Robinson)</li><li>Fractures (Illenium ft. Nevve)</li><li>Light (San Holo)</li><li>Crawl Outta Love (Illenium)</li><li>Say My Name (ODESZA)</li><li>Worlds Apart (Seven Lions)</li><li>Say It (Flume)</li><li>Holdin On (Flume)</li><li>It's Strange (Louis The Child ft. K.Flay)</li><li>Love Is Alive (Louis The Child)</li></ul>
