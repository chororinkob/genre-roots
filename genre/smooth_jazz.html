<h1>Smooth Jazz（スムースジャズ）とは</h1>
<p>スムーズ・ジャズは、ジャズの音色とR&amp;Bのリズムを、聴き手の注意を引きすぎないよう設計して結びつけた音楽だ。器楽を中心とする、商業志向のジャズである。ボーカル曲も含む。旋律の形式を重視し、即興の冒険を避ける。 主役の楽器は、ソプラ</p>
<p>スムーズ・ジャズは、ジャズの音色とR&amp;Bのリズムを、聴き手の注意を引きすぎないよう設計して結びつけた音楽だ。器楽を中心とする、商業志向のジャズである。ボーカル曲も含む。旋律の形式を重視し、即興の冒険を避ける。

主役の楽器は、ソプラノ・サックスかテナー・サックス、電気ギター、そして時にトランペットである。いずれも柔らかく丸い音色が選ばれる。サックスは、ビブラート（音を細かく震わせること）を穏やかにかけ、音の立ち上がりを滑らかにする。ギターは、コーラスとリヴァーブ（残響効果）をかけた、クリーン（歪んでいない）な音を使う。

和声（コードの響き）には、ジャズの7度や9度を含む和音を使う。ただし、緊張の強い変化音は避けられることが多く、長調系の心地よい響きが保たれやすい。旋律は、歌えるほど単純だ。即興も、定型的な音型の範囲にとどまる。

リズムは、打ち込みか、正確に演奏されたバックビート（2・4拍を強く打つリズム）である。揺らぎは最小限に抑えられる。BPMは90〜105が最も多いとされる。

編曲では、鍵盤の柔らかいパッド（持続する背景の音）、控えめなベース、装飾的な打楽器が敷き詰められる。音の隙間は少ない傾向がある。曲の組み立ては、主題の提示と反復が中心で、劇的な展開は避けられる傾向がある。</p>
<h2>成り立ち</h2><p>直接の前身は、1970年代のクロスオーバー（ジャンルをまたぐ音楽）、あるいはスムーズな系統のフュージョンである。

Grover Washington Jr.が1980年に発表したWinelightは、とりわけBill Withersを迎えたJust the Two of Usとともに、1980年代のスムーズ・ジャズ盛り上がりにつながったと、しばしば評価される。同じ時期、ギタリストのGeorge Bensonが、1976年のBreezin'で、器楽と歌の両方で成功した。Bob Jamesは、穏やかな編曲による作品を量産した。

名称と普及は、放送形式と深く結びついていた。1987年、KTWVの番組部長だったFrank Codyが、ゼネラルマネージャー（VP/GM）Howard Bloomの補佐を受けて、ニューエイジと軽いジャズを混ぜた番組編成を考案した。ロサンゼルスのKTWVという局は、1987年2月14日にロック局KMETからフォーマットを変更し、ザ・ウェイヴという名で放送を始めた。当初のフォーマット（放送の編成方針）名はNew Adult Contemporary（NAC）で、「スムーズ・ジャズ」ではなかった。

1987年中にサンフランシスコ、シカゴ、シアトル、サンディエゴなどが追随した。1990年代にはニューエイジ色が薄れ、よりジャズ寄りの「スムーズ・ジャズ」へと変わった。ここで重要なのは、旋律の形式を重視し、即興の冒険を避けることが重視された点である。局は調査に基づいて、ソロの長さや楽器の比率まで細かく管理した。

1986年の『Duotones』で商業的に成功していたKenny G（Kenneth Gorelick）は、この形式のラジオ局で盛んに放送された。さらに売り上げを伸ばし、最も売れた器楽演奏家の一人となった。彼の1992年のBreathlessは、世界で千数百万枚を売り上げたとされる。

しかし、ジャズ界の演奏家や愛好家からの批判が強く、批評家の評価は割れた。ギタリストのPat Methenyが2000年6月に発表したKenny Gへの公然たる批判は有名である。とりわけ、Kenny Gが1999年にLouis Armstrongの録音に自らの演奏を重ねた作品は、故人の作品への冒涜（神聖なものを汚すこと）として激しく非難された。

2000年代後半、携帯型視聴率計（PPM）による低い数字、不況、選曲の反復、新曲不足などにより、この形式の局は大幅に減少した。産業としては縮小したが、インターネット配信やHDサブチャンネル、コンサートで需要が続いている。</p>
