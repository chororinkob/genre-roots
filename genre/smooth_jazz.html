<h1>Smooth Jazz（スムースジャズ）とは</h1>
<p>ジャズの音色とR&amp;Bのリズムを、聴き手の注意を引きすぎないよう設計して結合した器楽音楽。BPMは90〜105が最も多く、リズムは打ち込みまたは正確に演奏されたバックビートで、揺らぎは最小限に抑えられる。主旋律を担うのはソプラノ・サ</p>
<p>ジャズの音色とR&amp;Bのリズムを、聴き手の注意を引きすぎないよう設計して結合した器楽音楽。BPMは90〜105が最も多く、リズムは打ち込みまたは正確に演奏されたバックビートで、揺らぎは最小限に抑えられる。主旋律を担うのはソプラノ・サックスまたはテナー・サックス、電気ギター、そして時にトランペットで、いずれも柔らかく丸い音色が選ばれる。サックスはビブラートを穏やかにかけ、音の立ち上がりを滑らかにし、ギターはコーラスとリヴァーブをかけたクリーンな音を用いる。和声はジャズの七度や九度を含む和音を使うが、緊張の強い変化音は避けられ、長調系の心地よい響きが保たれる。旋律は歌えるほど単純で、即興も定型的な音型の範囲にとどまる。編曲では、鍵盤の柔らかいパッド、控えめなベース、そして装飾的な打楽器が敷き詰められ、音の隙間がほとんどない。曲構成は主題の提示と反復が中心で、劇的な展開は避けられる。商業志向のジャズで、旋律の形式を重視し、即興の冒険を避ける音楽である。</p>
<h2>成り立ち</h2><p>直接の前身は1970年代のクロスオーバー、あるいはスムーズな系統のフュージョンである。Grover Washington Jr.が1980年に発表したWinelight、とりわけBill Withersを迎えたJust the Two of Usは、1980年代のスムーズ・ジャズ隆盛につながった。同時期、ギタリストGeorge Bensonが1976年のBreezin'で器楽と歌の双方で成功し、Bob Jamesが穏やかな編曲による作品を量産した。決定的だったのは音楽ではなく放送形式の側である。1987年、米国のラジオ・コンサルタントFrank Codyが、Howard Bloomの補佐を受けて、ニューエイジと軽いジャズを混ぜた番組編成を考案し、ロサンゼルスのKTWVという局が、1987年2月14日にロック局KMETからフォーマットを変更して、ザ・ウェイヴという名で放送を始めた。当初のフォーマット名はNew Adult Contemporary（NAC）で、「スムーズ・ジャズ」ではなかった。この形式は全米に広がり、1990年代を通じて数十の局が同じ編成を採用した。ここで重要なのは、旋律の形式を重視し、即興の冒険を避けることが重視された点である。局は聴取者調査により、注意を引く要素、すなわち激しい即興や不協和音を排除していった。この商業的な成功により、Kenny G（Kenneth Gorelick）が最も売れた器楽演奏家の一人となった。彼の1992年のBreathlessは世界で千数百万枚を売り上げている。しかし批評的な評価は極めて低く、ギタリストPat Methenyが2000年6月に発表したKenny Gへの公然たる批判は有名である。とりわけ、Kenny Gが1999年にLouis Armstrongの録音に自らの演奏を重ねた作品は、故人の作品への冒涜として激しく非難された。2000年代後半、携帯型視聴率計（PPM）による低い数字、不況、選曲の反復、新曲不足などにより、この形式の局は大幅に減少し、産業としては縮小したが、配信の環境音楽の分野で同種の需要は今も存在している。</p>
