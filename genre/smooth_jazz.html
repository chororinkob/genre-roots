<h1>Smooth Jazz（スムースジャズ）とは</h1>
<p>ジャズの音色とR&amp;Bのリズムを、聴き手の注意を引きすぎないよう設計して混ぜ合わせた、楽器中心の音楽。ボーカル曲も含まれる。BPMは90〜105が最も多く、リズムは打ち込みまたは正確に演奏されたバックビート（2・4拍を強く打つリズム</p>
<p>ジャズの音色とR&amp;Bのリズムを、聴き手の注意を引きすぎないよう設計して混ぜ合わせた、楽器中心の音楽。ボーカル曲も含まれる。BPMは90〜105が最も多く、リズムは打ち込みまたは正確に演奏されたバックビート（2・4拍を強く打つリズム）で、揺らぎは最小限に抑えられる。主旋律を担うのはソプラノ・サックスまたはテナー・サックス、電気ギター、そして時にトランペットで、いずれも柔らかく丸い音色が選ばれる。サックスはビブラート（音を細かく震わせること）を穏やかにかけ、音の立ち上がりを滑らかにし、ギターはコーラスとリヴァーブ（残響効果）をかけたクリーン（歪んでいない）な音を用いる。和声（コードの響き）はジャズの7度や9度を含む和音を使う。旋律は歌えるほど単純で、即興も定型的な音型の範囲にとどまる。編曲では、鍵盤の柔らかいパッド（持続する背景の音）、控えめなベース、そして装飾的な打楽器が敷き詰められる。商業志向のジャズで、旋律の形式を重視し、即興の冒険を避ける音楽である。</p>
<h2>成り立ち</h2><p>直接の前身は1970年代のクロスオーバー（ジャンルをまたぐ音楽）、あるいはスムーズな系統のフュージョンである。Grover Washington Jr.が1980年に発表したWinelight、とりわけBill Withersを迎えたJust the Two of Usは、1980年代にスムーズ・ジャズが流行するきっかけになったと、よく言われる。同時期、ギタリストGeorge Bensonが1976年のBreezin'で器楽と歌の双方で成功し、Bob Jamesが穏やかな編曲による作品を量産した。「スムーズ・ジャズ」という名前も、広まり方も、ラジオの番組の作り方と切り離せなかった。1987年、KTWVの番組部長だったFrank Codyが、ゼネラルマネージャーのHoward Bloomの補佐を受けて、ニューエイジと軽いジャズを混ぜた番組編成を考案し、ロサンゼルスのKTWVという局が、1987年2月14日にロック局KMETからフォーマットを変更して、ザ・ウェイヴという名で放送を始めた。当初のフォーマット（放送の編成方針）名はNew Adult Contemporary（NAC）で、「スムーズ・ジャズ」ではなかった。この形式は同じ1987年のうちに、サンフランシスコ、シカゴ、シアトル、サンディエゴなどの局にも広がった。1990年代にはニューエイジ色が薄れ、よりジャズ寄りの「スムーズ・ジャズ」へと変わった。ここで重要なのは、旋律の形式を重視し、即興の冒険を避けることが重視された点である。局は聴取者調査にもとづいて、ソロの長さや楽器の割合まで細かく決めていった。1986年のアルバムDuotonesですでに売れていたKenny G（Kenneth Gorelick）は、この形式の局でもよく流れ、さらに売り上げを伸ばして、最も売れた器楽演奏家の一人となった。彼の1992年のBreathlessは世界で千数百万枚を売り上げている。しかしジャズの演奏家や愛好家からの批判が強く、批評家の評価も分かれた。ギタリストPat Methenyが2000年6月に発表したKenny Gへの公然たる批判は有名である。とりわけ、Kenny Gが1999年にLouis Armstrongの録音に自らの演奏を重ねた作品は、故人の作品への冒涜（神聖なものを汚すこと）として、Pat Methenyや一部の批評家から激しく非難された。2000年代後半、携帯型視聴率計（PPM）による低い数字、不況、選曲の反復、新曲不足などにより、この形式の局は大幅に減少し、産業としては縮小したが、インターネット配信やHDラジオの副チャンネル、コンサートで、同じような需要は今も続いている。</p>
<h2>代表曲</h2><ul><li>Just the Two of Us (Grover Washington Jr.)</li><li>Songbird (Kenny G)</li><li>Breezin' (George Benson)</li><li>Maputo (David Sanborn)</li><li>Angela (Bob James)</li><li>Feels So Good (Chuck Mangione)</li><li>This Masquerade (George Benson)</li><li>Mister Magic (Grover Washington Jr.)</li><li>On Broadway (George Benson)</li><li>Winelight (Grover Washington Jr.)</li><li>Morning Dance (Spyro Gyra)</li><li>Turn Your Love Around (George Benson)</li><li>We're in This Love Together (Al Jarreau)</li><li>Moonlighting (Al Jarreau)</li><li>Street Life (The Crusaders)</li><li>Rise (Herb Alpert)</li><li>Mornin' (Al Jarreau)</li><li>Rain Dance (Jeff Lorber)</li><li>Imperial Strut (Yellowjackets)</li><li>Always There (Ronnie Laws)</li><li>Mt. Airy Groove (Pieces of a Dream)</li><li>Night Birds (Shakatak)</li></ul>
