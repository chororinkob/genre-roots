<h1>Smooth Jazz（スムースジャズ）とは</h1>
<p>ジャズの音色とR&amp;Bのリズムを、聴き手の注意を引きすぎないよう設計して結合した器楽音楽。BPMは90〜110、リズムは打ち込みまたは正確に演奏されたバックビートで、揺らぎは最小限に抑えられる。主旋律を担うのはソプラノ・サックスまた</p>
<p>ジャズの音色とR&amp;Bのリズムを、聴き手の注意を引きすぎないよう設計して結合した器楽音楽。BPMは90〜110、リズムは打ち込みまたは正確に演奏されたバックビートで、揺らぎは最小限に抑えられる。主旋律を担うのはソプラノ・サックスまたはアルト・サックス、電気ギター、そして時にトランペットで、いずれも柔らかく丸い音色が選ばれる。サックスはビブラートを穏やかにかけ、音の立ち上がりを滑らかにし、ギターはコーラスとリヴァーブをかけたクリーンな音を用いる。和声はジャズの七度や九度を含む和音を使うが、緊張の強い変化音は避けられ、長調系の心地よい響きが保たれる。旋律は歌えるほど単純で、即興も定型的な音型の範囲にとどまる。編曲では、鍵盤の柔らかいパッド、控えめなベース、そして装飾的な打楽器が敷き詰められ、音の隙間がほとんどない。これは、聴き手が意識を向けなくても不快にならないための設計である。曲構成は主題の提示と反復が中心で、劇的な展開は避けられる。職場、店舗、待合室といった空間の背景として機能することを前提に作られた、極めて用途の明確な音楽である。</p>
<h2>成り立ち</h2><p>直接の前身は1970年代のクロスオーバー、あるいはスムーズな系統のフュージョンである。Grover Washington Jr.が1980年に発表したWinelight、とりわけBill Withersを迎えたJust the Two of Usは、この様式の原型を示した。同時期、ギタリストGeorge Bensonが1976年のBreezin'で器楽と歌の双方で成功し、Bob Jamesが穏やかな編曲による作品を量産した。決定的だったのは音楽ではなく放送形式の側である。1987年、米国のラジオ・コンサルタントFrank Cody、Steve Feinstein、Allen Kepler らが、ニューエイジと軽いジャズを混ぜた番組編成を考案し、ロサンゼルスのKTWVという局がザ・ウェイヴという名で開局した。この形式は全米に広がり、1990年代を通じて数十の局が同じ編成を採用した。ここで重要なのは、選曲の基準が音楽的な価値ではなく、聴き手が耳を止めないことに置かれた点である。局は聴取者調査により、注意を引く要素、すなわち激しい即興や不協和音を排除していった。この商業的な成功により、Kenny G（Kenneth Gorelick）が史上最も売れた器楽演奏家となった。彼の1992年のBreathlessは世界で千数百万枚を売り上げている。しかし批評的な評価は極めて低く、ギタリストPat Methenyが1990年代に行ったKenny Gへの公然たる批判は有名である。とりわけ、Kenny GがLouis Armstrongの録音に自らの演奏を重ねた作品は、故人の作品への冒涜として激しく非難された。2000年代後半、ラジオ局の経営難によりこの形式の局は大幅に減少し、産業としては縮小したが、配信の環境音楽の分野で同種の需要は今も存在している。</p>
<h2>代表曲</h2><ul><li>Just the Two of Us (Grover Washington Jr.)</li><li>Songbird (Kenny G)</li><li>Breezin' (George Benson)</li><li>Maputo (David Sanborn)</li><li>Angela (Bob James)</li></ul>
