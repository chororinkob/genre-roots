<h1>Industrial Techno（インダストリアルテクノ）とは</h1>
<p>インダストリアル・テクノは、テクノの四つ打ちに、インダストリアル・ミュージック由来の金属的な質感と暴力性をつないだ音楽だ。 最大の特徴は、音色の汚し方にある。キックにはディストーション（音をつぶして歪ませる効果）とビットクラッシャ</p>
<p>インダストリアル・テクノは、テクノの四つ打ちに、インダストリアル・ミュージック由来の金属的な質感と暴力性をつないだ音楽だ。

最大の特徴は、音色の汚し方にある。キックにはディストーション（音をつぶして歪ませる効果）とビットクラッシャー（音を粗くつぶす効果）、テープ飽和（磁気テープに録音したときの音割れのような効果）が重ねられる。そのため輪郭が潰れ、中域まで倍音（音の成分）が広がる。パーカッションには、金属を叩く音、機械の駆動音、工場で実際に録った音が使われる。それらはリヴァーブとディレイによって、巨大な空間に放り込まれる。

低音は途切れないうねりとして敷かれる。旋律・和声は抑えられ、ミニマルな反復が中心の作品が多い。その代わりに、ノイズの帯域と密度の変化が曲の展開を担う。ホワイトノイズを長い時間をかけて開いていく、あるいは高域を突然カットする。こうした操作が、緊張と解放の役目を果たす。

テンポはおおむね130〜150BPM。リズムは四つ打ちが基本だが、不規則な打点や、拍から外れたノイズが入り込み、安定がたびたび崩される。

ヴォーカルは、加工された叫び、逆再生した声、演説の断片といった形で、ときどき現れる。意味よりも、異物としての効果が狙われる。

空間の作り方も重要だ。残響が数秒に及ぶことも多く、聴き手を巨大な工場や地下施設に置くような感覚が意図される。

ハードテクノとは重なる部分がある。ただ、ハードテクノがキックの推進力に集中するのに対し、こちらは音の質感と不快さそのものを目的とする点で分かれる。</p>
<h2>成り立ち</h2><p>インダストリアル・テクノの系譜は、1970年代のインダストリアル・ミュージックまでさかのぼる。

1975年、イギリスでThrobbing Gristleが結成された。彼らは工場労働と暴力のイメージを使い、不快な音を突きつけた。Throbbing GristleとCabaret Voltaireは、インダストリアルの第1波として並ぶ。その後に続いたのが、SPK（1978年）とEinstürzende Neubauten(1980年に西ベルリンで結成され、建設現場の資材や電動工具を楽器として演奏した)である。

この系統の暴力性と、1980年代のEBMの踊るための機能性が、1990年代のテクノにつながったことが、起源の一つとされる。ただし、起源には諸説ある。坂本龍一の『B-2 Unit』(1980年)は、後のインダストリアル・テクノを先取りした作品と評されている。最初期の例としては、デトロイトでAnthony Srock率いるFinal Cut（初期にJeff Millsが参加）が1989年に出したアルバム『Deep into the Cut』が挙げられる。

1990年代前半には、ニューヨークを拠点とするアメリカ人DJのLenny Deeが、ハードコアテクノ寄りの作品を発表した。ドイツのThe Mover(Marc Acardipane)は、ダークで工業的なテクノを発表した。とくに、ドイツのフランクフルトを拠点とするPlanet Core Productionsというレーベルは、1989年にMarc AcardipaneとThorsten Lambartらが共同で設立した。このレーベルは、ハードコアテクノの成立に大きな役割を果たした。

同じころ、イングランド出身のSurgeon(Anthony Child)と、アイルランド生まれのイギリス人Regis(Karl O'Connor)が、バーミンガムで活動を始めた。RegisとFemale（Peter Sutton）は1993年にDownwardsを設立し、Surgeonらの作品を出した。こうして、Birmingham Technoと呼ばれる流れが生まれた。彼らはミニマルな反復に金属的な残響と歪みを加え、この分野の音の基準を作ったと評される。2002年に始動したBritish Murder Boysという2人の共同名義も知られる。並行して、アメリカのUnderground Resistanceの一部の作品も、工業的な質感を強く帯びていた。

2010年代には、大きな復興が起きる。Ancient Methods、Vatican Shadow(Dominick Fernow、Prurient名義でも活動)、Perc、Blackest Ever Blackといったレーベルとアーティストが注目を集めた。この復興は、暗く暴力的な音が時代の空気に合ったと語られる。その一方で、陰鬱な時代のための陰鬱な音楽としてだけ見るのは誤りだ、という見方もある。Vatican Shadowは作品名に実際の軍事作戦や中東の紛争を使い、政治的なテーマを前面に出した。

しかし、問題も指摘されている。ナチスや全体主義の図像を美的に引用する例が一部にあるとして、批判を招いたとされる。

2020年代には、この系統がハードテクノの高速化と融合し、ヨーロッパの大型フェスティバルでも聴かれる音になっているとされる。</p>
