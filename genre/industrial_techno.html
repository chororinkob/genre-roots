<h1>Industrial Techno（インダストリアルテクノ）とは</h1>
<p>テクノの四つ打ちに、インダストリアル・ミュージック由来の金属的な質感と暴力性を接続した系統。最大の特徴は音色の汚しかたで、キックにはディストーションとビットクラッシャー、テープ飽和が重ねられ、輪郭が潰れて中域まで倍音が撒かれる。パ</p>
<p>テクノの四つ打ちに、インダストリアル・ミュージック由来の金属的な質感と暴力性を接続した系統。最大の特徴は音色の汚しかたで、キックにはディストーションとビットクラッシャー、テープ飽和が重ねられ、輪郭が潰れて中域まで倍音が撒かれる。パーカッションには金属を叩く音、機械の駆動音、工場の実録音が用いられ、それらがリヴァーブとディレイで巨大な空間に放り込まれる。テンポは130〜150BPM。リズムは四つ打ちを基本としながら、しばしば不規則な打点や、拍から外れたノイズの侵入によって安定を崩される。低音は持続的なうねりとして敷かれ、旋律や和声はほとんど存在しない。代わりに、ノイズの帯域と密度の変化が展開を担う。ホワイトノイズを長時間かけて開いていく、あるいは高域を突然カットするといった操作が、緊張と解放の代わりを務める。ヴォーカルは加工された叫び、逆再生した声、演説の断片といった形で断続的に現れ、意味よりも異物としての効果が狙われる。空間の設計が重要で、残響が数秒に及ぶことも多く、聴き手を巨大な工場や地下施設に置くような感覚が意図される。ハードテクノと重なるが、ハードテクノがキックの推進力に集中するのに対し、こちらは音響の質感と不快さそのものを目的とする点で分かれる。</p>
<h2>成り立ち</h2><p>系譜は1970年代のインダストリアル・ミュージックまで遡る。Throbbing Gristleが1975年にイギリスで結成され、工場労働と暴力の図像を用いた不快な音を提示し、その後Cabaret Voltaire、SPK、Einsturzende Neubauten(1980年にベルリンで結成され、建設現場の資材や電動工具を楽器として演奏した)が続いた。この系統の暴力性と、1980年代のEBMのダンス的な機能性が、1990年代のテクノに接続されたのが直接の起源になる。決定的な役割を果たしたのはベルギーとドイツで、1990年代前半にはベルギーのLenny DeeやThe Mover(ドイツのMarc Acardipane)が、ダークで工業的なテクノを発表した。とりわけドイツのフランクフルトを拠点とするPlanet Coreというレーベルは、ハードコアとインダストリアル・テクノの境界を形作った。同時期にスコットランドのSurgeon(Anthony Child)とRegis(Karl O'Connor)がバーミンガムで活動を始め、1994年にレーベルDownwardsとBirmingham Techno と呼ばれる潮流を形成した。彼らはミニマルな反復に金属的な残響と歪みを加え、この分野の音響的な基準を作った。British Murder Boysという二人の共同名義も知られる。並行して、ベルリンのTresorやアメリカのUnderground Resistanceの一部の作品も、工業的な質感を強く帯びていた。2010年前後に大きな復興が起きる。ベルリンのBerghainが、それまでのミニマルから、より重く暗いテクノへ舵を切り、Ancient Methods、Vatican Shadow(Dominick Fernow、Prurient名義でも活動)、Perc、Blackest Ever Blackといったレーベルとアーティストが台頭した。この復興は2008年の金融危機以降の社会不安と結びつけて語られることが多く、暗く暴力的な音が時代の空気に合致したとされる。Vatican Shadowは作品名に実際の軍事作戦や中東の紛争を用い、政治的な主題を全面に出した。同時に問題も指摘される。ナチスや全体主義の図像を美的に引用する例が一部にあり、これが真剣な批判を招いた。また、暗く攻撃的な音が流行の記号として消費され、元来の批評性が失われているという指摘もある。2020年代には、この系統がハードテクノの高速化と融合し、ヨーロッパの大型フェスティバルの主要な音になっている。</p>
