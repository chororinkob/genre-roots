<h1>Sea shanty（シーシャンティ）とは</h1>
<p>シーシャンティは、帆船の甲板で複数の人間が力を合わせてロープを引いたり、巻き上げ機を回したりするために歌われる、無伴奏（楽器なし）の労働歌だ。 最大の特徴はコール・アンド・レスポンスだ。独唱者のシャンティマンが、即興を交えた呼びか</p>
<p>シーシャンティは、帆船の甲板で複数の人間が力を合わせてロープを引いたり、巻き上げ機を回したりするために歌われる、無伴奏（楽器なし）の労働歌だ。

最大の特徴はコール・アンド・レスポンスだ。独唱者のシャンティマンが、即興を交えた呼びかけを歌う。全員が短い掛け声の合唱で応える。この掛け合い構造が基本になる。型によっては、応答の最後の語に引きを合わせる。

楽器は原則として使われない。声そのものが唯一の楽器であり、甲板の風と波の音に混じって鳴る。

旋律は、多くは長調で、旋法的・短調の旋律も含む。伝統的にはユニゾンで歌われたとされる。テンポは作業に合わせて選ばれた。

歌詞は、主題が幅広い。あくまで労働の最中に歌われる実用歌である。フォアビッター（船内の余暇に歌われた海の歌。楽器が伴うこともある）とは、目的も歌い方も明確に区別される。

作業の種類ごとにリズムの型が決まっている。長く引く引き綱作業、短く一気に引く綱作業、巻き上げ機、錨巻き、ポンプ排水などがあり、それぞれの曲が使い分けられた。ただし分類は絶対的ではなく、船員は曲のリズム・テンポ・形を変えて、別の作業に転用した。</p>
<h2>成り立ち</h2><p>シーシャンティは、他の労働歌とはっきり区別される固有のジャンルとして、19世紀半ばに広まった（この意味での用語の初期の印刷例は1867年）。南北戦争（1861年）前後には、特に盛んだった。背景には、船が大型化して乗組員が減り、日程が厳しくなったことがある。シャンティは、労働の同期と最適化を目的としていた。

歌を仕切るのは、シャンティマンと呼ばれる船員だった。彼は即興の歌詞と力強い声で、作業のタイミングを統率した。その技量は、乗組員から高く評価された。シャンティが無伴奏なのは、作業中は両手がふさがり、歌そのものが労働の同期装置だったためである。

しかし、19世紀末に蒸気船と機械式巻き上げ機が普及すると、人間の力でロープを引く場面そのものが減った。実用としてのシーシャンティは、20世紀前半にほぼ消滅した。

1920年代には、復興が始まる。リチャード・ランシマン・テリー（1921年と1926年）やジョアンナ・コルコード（1924年）らが、採集・編曲して刊行した。商業レコードも、これに加わった。20世紀中頃には、英語圏のフォーク・リバイバル（民謡の復興運動）のなかで、A.L.ロイドとユアン・マッコールが活躍した。2人は、『Blow Boys Blow』などの、シャンティと海のバラッドを収めた録音（1955年盤『The Singing Sailor』も）で、シーシャンティを再び世に広めた。労働歌としての文脈を伴って紹介したのも、この2人である。

シー・ミュージック・フェスティバルは、1979〜80年にMystic Seaportで始まり（2019年まで続いた）、1970年代末までに、海の音楽は独自の演奏ジャンルになっていた。20世紀最大の集成は、実際の帆船船員だったスタン・ヒューギルが、1961年に刊行した『Shanties from the Seven Seas』である。自身の経験と先行文献を集成した、最も参照される基本資料となっている。

2020年12月、スコットランドの郵便配達員ネイサン・エヴァンスが『Wellerman』を歌い、TikTokで公開した。この曲は、労働歌のシャンティではなく、正確にはバラッド（物語を歌う形式）の海の歌だ。2021年にかけて爆発的に拡散し、世代を超えた世界的なブームを引き起こした。この再流行は、伝承曲をデジタル合唱の素材に変えた。遠く離れた人々が声を重ねる、現在的なコール・アンド・レスポンスを生んだ点で画期的だったと見る向きもある。</p>
