<h1>Sea shanty（シーシャンティ）とは</h1>
<p>シーシャンティは、帆船の甲板で複数の人間が力を合わせてロープを引いたり巻き上げ機を回したりするために歌われる、無伴奏の労働歌である。最大の特徴はコール・アンド・レスポンス、すなわち独唱者シャンティマンが即興気味の長い呼びかけを歌い</p>
<p>シーシャンティは、帆船の甲板で複数の人間が力を合わせてロープを引いたり巻き上げ機を回したりするために歌われる、無伴奏の労働歌である。最大の特徴はコール・アンド・レスポンス、すなわち独唱者シャンティマンが即興気味の長い呼びかけを歌い、全員が短い掛け声の合唱で応える掛け合い構造だ。合唱の掛け声には「引き」の瞬間が重ねられ、その一音にアクセントが集中する。旋律は長調・短調・旋法的なものが混在し、音域は狭く、通常は和声がなく単旋律で歌われるため、楽譜が読めない船員でも即座に声を合わせられる。拍子は4分の2拍子、4分の3拍子、4分の4拍子、8分の6拍子、途中で変わる拍子など多様で、テンポは作業の種類によって、また人数や疲れ具合によって変わった。楽器は原則として使われず、声そのものが唯一の楽器であり、甲板の風と波の音に混じって鳴る。歌詞は港町や船長や積み荷を揶揄する皮肉な内容、失恋、故郷との別れ、女性の名を織り込んだ物語などが定番で、あくまで労働の最中に歌われる実用歌である。酒場や船内の余暇で娯楽として歌うフォアビッター（船員が私的に楽しむ海の歌）とは、目的も歌い方も明確に区別される。作業の種類ごとにリズムの型が決まっており、長く引く引き綱作業、短く一気に引く綱作業、巻き上げ機、錨巻き、ポンプ排水など、それぞれ専用の曲が使い分けられた。</p>
<h2>成り立ち</h2><p>シーシャンティが他の労働歌とはっきり区別される固有のジャンルとして19世紀中頃に成立し（この意味での用語の初期の印刷例は1867年）、とくに南北戦争より前の数十年間に、商船の船上で盛んになった。大西洋横断の貿易帆船が大型化し、帆の操作や錨の巻き上げに多数の船員が同時に力を合わせる必要が生まれたことが背景にある。歌を仕切るのはシャンティマンと呼ばれる船員で、彼は即興の歌詞と力強い声で作業のタイミングを統率し、その技量は乗組員から高く評価された。伴奏楽器を持ち込めない船上という制約が、無伴奏のコール・アンド・レスポンスという形式を必然にした。19世紀末に蒸気船と機械式巻き上げ機が普及すると、人間の力でロープを引く場面そのものが減り、実用としてのシーシャンティは20世紀前半にほぼ消滅した。1920年代には、リチャード・ランシマン・テリー（1921年と1926年）やジョアンナ・コルコード（1924年）らが採譜集を刊行し、商業レコードとともに一般向けの復興が始まる。20世紀中頃には英語圏のフォーク・リバイバルのなかで、A.L.ロイドとユアン・マッコールが『Blow Boys Blow』などの録音でシーシャンティを再び世に広め、労働歌としての文脈を伴って紹介した。1979年（または1980年）にはアメリカのミスティック・シーポート博物館などでシー・ミュージック・フェスティバルが始まり（開始年は資料により異なる）、船を降りた聴衆のための演奏ジャンルとして確立される。20世紀最大の集成は、実際の帆船船員だったスタン・ヒューギルが1961年に刊行した『Shanties from the Seven Seas』で、彼自身が航海で聴いた歌と文献上の記録を網羅した点で「最終結論」と評され、今日まで最も参照される基本資料となっている。2020年12月にスコットランドの郵便配達員ネイサン・エヴァンスが歌った『Wellerman』（労働歌のシャンティではなく、正確にはバラッド形式の海の歌）がTikTokで公開され、2021年にかけて爆発的に拡散し、世代を超えた世界的なブームを引き起こした。この再流行は伝承曲をデジタル合唱の素材に変え、遠く離れた人々が声を重ねる現在的なコール・アンド・レスポンスを生んだ点で画期的だった。</p>
<h2>代表曲</h2><ul><li>Wellerman (Nathan Evans)</li><li>Leave Her, Johnny (Assassin's Creed IV: Black Flag)</li><li>Drunken Sailor (Traditional / The Irish Rovers)</li><li>Spanish Ladies (Traditional / The Yetties)</li><li>Bully in the Alley (Michael Hearn)</li><li>South Australia (Fisherman's Friends)</li><li>Haul Away Joe (Traditional / The Clancy Brothers)</li><li>Rio Grande (Assassin's Creed IV: Black Flag)</li><li>Paddy Doyle's Boots (Assassin's Creed IV: Black Flag)</li><li>Roll the Old Chariot Along (Traditional / David Coffin)</li><li>Fiddler's Green (The Longest Johns)</li><li>Lowlands Away (Kate McGarrigle)</li><li>Rolling Down to Old Maui (Michael Kelly)</li><li>Santiana (Jesse Ferguson)</li><li>Tom's Gone to Hilo (Bob Davenport)</li><li>Santy Anno (The Kingston Trio)</li><li>Whiskey Johnny (Ewan MacColl)</li><li>Johnny Come Down to Hilo ('t Scheepsfolk)</li><li>Blow the Man Down (Traditional / Ewan MacColl &amp; A.L. Lloyd)</li></ul>
