<h1>Sea shanty（シーシャンティ）とは</h1>
<p>シーシャンティは、帆船の甲板で複数の人間が力を合わせてロープを引いたり巻き上げ機を回したりするために歌われる、無伴奏（楽器なし）の労働歌である。最大の特徴はコール・アンド・レスポンス、すなわち独唱者シャンティマンが即興を交えた呼び</p>
<p>シーシャンティは、帆船の甲板で複数の人間が力を合わせてロープを引いたり巻き上げ機を回したりするために歌われる、無伴奏（楽器なし）の労働歌である。最大の特徴はコール・アンド・レスポンス、すなわち独唱者シャンティマンが即興を交えた呼びかけを歌い、全員が短い掛け声の合唱で応える掛け合い構造だ。型によっては、応答の最後の語に「引き」の瞬間が合わされる。旋律は多くが明るい長調で、旋法（音の並び方の型）的・短調の旋律も含み、伝統的には和声のない単旋律（1本の旋律だけ）、つまりユニゾンで歌われたとされる。テンポは作業の種類に合わせて選ばれた。楽器は原則として使われず、声そのものが唯一の楽器であり、甲板の風と波の音に混じって鳴る。歌詞の主題は幅広く、船長の欠点や食事、女性にまつわる話のほか、流行歌や伝承歌から借りた内容もあり、あくまで労働の最中に歌われる実用歌である。船内の余暇に歌われるフォアビッター（船員が私的に楽しむ海の歌。楽器が伴うこともある）とは、目的が区別される。作業の種類ごとにリズムの型があり、長く引く引き綱作業、短く一気に引く綱作業、巻き上げ機、錨巻き、ポンプ排水などに合わせた曲が使い分けられたが、対応は固定ではなく、船員は曲のリズムや速さを変えて別の作業に転用した。</p>
<h2>成り立ち</h2><p>シーシャンティが他の労働歌とはっきり区別される固有のジャンルとして19世紀半ばに広まり（この意味での用語の初期の印刷例は1867年）、とくに南北戦争（1861年）の前後に、商船の船上で盛んになった。商船が大型化する一方で乗組員が減り、日程も厳しくなったため、少ない人数で作業の息を合わせる必要が生まれたことが背景にある。歌を仕切るのはシャンティマンと呼ばれる船員で、彼は即興の歌詞と力強い声で作業のタイミングを統率し、その技量は乗組員から高く評価された。作業中は両手がふさがるため、歌そのものが作業の息を合わせる役割を担い、無伴奏のコール・アンド・レスポンスという形式になった。19世紀末に蒸気船と機械式巻き上げ機が普及すると、人間の力でロープを引く場面そのものが減り、実用としてのシーシャンティは20世紀前半にほぼ消滅した。1920年代には、リチャード・ランシマン・テリー（1921年と1926年）やジョアンナ・コルコード（1924年）らが採集・編曲した曲集（ピアノ伴奏付きの版もある）を刊行し、商業レコードとともに一般向けの復興が始まる。20世紀中頃には英語圏のフォーク・リバイバル（民謡の復興運動）のなかで、A.L.ロイドとユアン・マッコールが『The Singing Sailor』（1955年）や、シャンティと海のバラッドを収めた『Blow Boys Blow』（1957年）などの録音でシーシャンティを再び世に広め、労働歌としての文脈を伴って紹介した。1979年（または1980年）にはアメリカのミスティック・シーポート博物館などでシー・ミュージック・フェスティバルが始まり（開始年は資料により異なる。2019年まで続いた）、1970年代末までに海の音楽は船を降りた聴衆のための演奏ジャンルとして確立されていた。20世紀最大の集成は、実際の帆船船員だったスタン・ヒューギルが1961年に刊行した『Shanties from the Seven Seas』で、彼自身の経験と先行文献を集成した、「決定版」と評され、今日まで最も参照される基本資料となっている。2020年12月にスコットランドの郵便配達員ネイサン・エヴァンスが歌った『Wellerman』（労働歌のシャンティではなく、正確にはバラッド（物語を歌う形式）の海の歌）がTikTokで公開され、2021年にかけて爆発的に拡散し、世代を超えた世界的なブームを引き起こした。この再流行は伝承曲をデジタル合唱の素材に変え、遠く離れた人々が声を重ねる新しい楽しみ方を広めたと評される。</p>
