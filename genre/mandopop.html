<h1>Mandopop（マンドポップ）とは</h1>
<p>北京語(マンダリン中国語)で歌われる、中華圏全域を市場とするポピュラー音楽。台湾・香港・中国大陸だけでなく、シンガポールやマレーシアの華人コミュニティでも幅広く聴かれている。とりわけバラードの人気が根強く、美しく歌い上げるメロディ</p>
<p>北京語(マンダリン中国語)で歌われる、中華圏全域を市場とするポピュラー音楽。台湾・香港・中国大陸だけでなく、シンガポールやマレーシアの華人コミュニティでも幅広く聴かれている。とりわけバラードの人気が根強く、美しく歌い上げるメロディーと感情に訴えかける歌詞が高く評価される傾向にある。テンポはゆったりから中速が主流だが、近年はK-POP的な洗練されたダンスポップや、欧米の最新トレンドを取り入れた楽曲も増えている。中華圏に暮らす10億人以上を潜在的なリスナーに持つ、世界最大級のポピュラー音楽市場の一つである。広東語で歌われる香港発の「カントポップ」とは言語も産業構造も異なるが、多くのアーティストが両方の言語で楽曲を発表しており、境界は流動的である。バラード中心の作りは、中華圏で広く普及したカラオケボックス「KTV」文化とも密接に結びついており、歌いやすく感情移入しやすい楽曲が市場で重視される傾向を後押ししている。</p>
<h2>成り立ち</h2><p>源流は1920〜30年代の上海にある。作曲家の黎錦暉が西洋のジャズやダンス音楽と中国の民間旋律を組み合わせた「時代曲」を作り出し、周璇や白光といった歌手が映画とともにこれを広めた。1949年の中華人民共和国成立後、大陸ではこの種の流行歌が退廃的な「黄色音楽」として断罪され、制作者と歌手の多くが香港や台湾へ移った。1950〜60年代の香港では姚莉や葛蘭が標準中国語による流行歌を継承し、台湾では日本の歌謡曲の翻案が広く流通した。転機は1970年代の台湾である。国連からの脱退に象徴される国際的な孤立と政治的な閉塞の中で、大学生たちが自分たちの言葉で歌おうと唱えた校園民歌(キャンパスフォーク)運動が起こり、素朴なギター弾き語りの歌が広まった。同じ時期、鄧麗君(テレサ・テン)が柔らかな歌唱で華人圏全域の心をつかみ、その音源は複製テープとして大陸へ流れ込み、当局が禁じても止められない現象となった。1980年代には羅大佑が社会批評的な歌詞を持ち込み、作曲家・プロデューサーの李宗盛が数多くの歌手を育てた。1980年に台北で設立されたレーベル滾石唱片(ロック・レコード)は、この時期の台湾ポップスの中核となる。1990年代には張惠妹や王菲が登場し、大陸市場の開放とともに聴衆は爆発的に拡大した。2000年、台湾の周杰倫(ジェイ・チョウ)がデビューアルバム『Jay』を発表し、R&amp;Bとヒップホップに中国的な旋律と楽器を組み合わせた「中国風」で決定的な世代交代を起こす。以後、王力宏、五月天、林俊傑らが華人圏全域で活動し、2010年代には中国大陸のオーディション番組と配信サービスが市場の重心を大陸へ移した。同時に、政治的な発言をめぐって台湾や香港の歌手が大陸市場から締め出されるなど、音楽と政治の緊張は現在も続いている。</p>
