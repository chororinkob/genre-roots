<h1>Emo Rap（エモラップ）とは</h1>
<p>2010年代後半、ラップの語り口にエモやポップパンクの旋律と情緒を接ぎ木した音楽。基本の骨格はトラップで、808の低音とハイハットの細かい連打が土台にあるが、その上に乗るのは陰鬱なアルペジオを弾くアコースティックギターやクリーント</p>
<p>2010年代後半、ラップの語り口にエモやポップパンクの旋律と情緒を接ぎ木した音楽。基本の骨格はトラップで、808の低音とハイハットの細かい連打が土台にあるが、その上に乗るのは陰鬱なアルペジオを弾くアコースティックギターやクリーントーンのエレキギターのループで、これがサンプリングされて繰り返される。テンポは毎分70から90拍程度、和音はほぼ短調で、循環進行が延々と回る。最大の特徴は歌唱で、ラップと歌の境界を意図的に消し、しゃくり上げるような発声、割れた叫び、ピッチ補正で加工した震え声が同じ一曲の中に同居する。歌詞は一貫して内面の苦痛を扱い、うつ、不安、自傷、薬物依存、失恋、孤独、自殺念慮といった主題を比喩を使わず直截に書く。従来のヒップホップが誇示と強さを価値としてきたのに対し、こちらは弱さと壊れやすさを前面に出す点が決定的に違う。曲は二分前後と極端に短いものが多く、サビが先に来る構成も珍しくない。見た目もタトゥーを顔に入れ、髪を派手に染めるという定型があり、音楽そのものと同じくらい人物像が消費された。制作と発表はほぼ完全にSoundCloudなどのネット上で行われた。</p>
<h2>成り立ち</h2><p>土台は二つある。ひとつは2010年前後のクラウド・ラップの曇った音と内向きの歌詞、もうひとつは2000年代のエモとポップパンクで、この世代はMy Chemical RomanceやParamoreを聴いて育っていた。転換点は2015年で、フロリダ州レイクワースの制作集団GothBoiCliqueと、その周辺にいたLil Peepが現れる。本名Gustav Åhrの彼は、Panic! at the Discoなどのギターを直接サンプリングし、うつと薬物依存を隠さずに歌った。2017年八月のアルバム『Come Over When You're Sober, Pt. 1』で広く知られたが、同年11月15日、ツアーバスの中で処方薬とフェンタニルの過剰摂取により21歳で亡くなった。同じ時期、フロリダのXXXTentacionが『Look at Me!』(2017)で爆発的に注目され、翌年の『17』はうつと自殺念慮を裸で綴った作品だったが、彼は交際相手への深刻な暴行で起訴されており、その擁護をめぐって激しい論争が起きた。2018年六月、フロリダで強盗に撃たれ20歳で死亡した。同じ2018年12月、シカゴのJuice WRLDが『Lucid Dreams』でこの様式を全米一位級のヒットに押し上げたが、彼も2019年12月、空港で薬物の過剰摂取により21歳で亡くなった。三年間で主要人物が三人相次いで死亡したこの事態は、鎮痛剤やベンゾジアゼピンの乱用が若者の間で広がっていたアメリカの現実を映していた。SoundCloudという発表の場と、レーベルを介さない直結の流通、そして精神的な苦痛を隠さないことがむしろ支持を集める時代の空気が、この音楽を短期間で主流に押し上げた。</p>
<h2>代表曲</h2><ul><li>17 (XXXTentacion)</li><li>Come Over When You're Sober (Lil Peep)</li><li>Lucid Dreams (Juice WRLD)</li></ul>
