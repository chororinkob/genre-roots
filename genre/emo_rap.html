<h1>Emo Rap（エモラップ）とは</h1>
<p>エモ・ラップは、ラップの語り口に、エモやポップパンクの旋律と情緒をつなぎ合わせた音楽だ。 基本の骨格はトラップ（ヒップホップの一種）だ。808の低音と、ハイハットの細かい連打が土台にある。その上に乗るのは、陰鬱なアルペジオ（和音を</p>
<p>エモ・ラップは、ラップの語り口に、エモやポップパンクの旋律と情緒をつなぎ合わせた音楽だ。

基本の骨格はトラップ（ヒップホップの一種）だ。808の低音と、ハイハットの細かい連打が土台にある。その上に乗るのは、陰鬱なアルペジオ（和音を一音ずつ弾く奏法）を弾くアコースティックギターや、クリーントーンのエレキギターのループである。しばしば2000年代のエモやポップパンクの曲をサンプリングする。独自演奏のアーティストもいる。

テンポは曲により幅がある。循環進行が延々と回る。3分前後の曲も多く、サビが先に来る構成も珍しくない。

最大の特徴は歌唱だ。ラップと歌の境界を意図的に消している。しゃくり上げるような発声、割れた叫び、ピッチ補正（音程の自動補正）で加工した震え声が、同じ一曲の中に同居する。

歌詞は、うつ、孤独、不安、薬物、自殺、失恋などを扱う傾向がある。主流ヒップホップとは異なり、より感情的で個人的な歌詞に傾く。

一部のアーティストに派手な髪色やタトゥーが見られ、音楽そのものと同じくらい人物像が消費された。初期はSoundCloudでのDIY的な公開が中心だったが、ブレイク後は独立系・メジャーのレーベルを通じて発売された。</p>
<h2>成り立ち</h2><p>土台は二つある。ひとつは、2010年前後のクラウド・ラップの曇った音と内向きの歌詞だ。もうひとつは、2000年代のエモとポップパンクである。この世代の一部は、My Chemical RomanceやParamoreを聴いて育っていた。

2010年代前半にSoundCloudのラップシーンで出現し、2010年代後半にLil Peep、XXXTentacion、Juice WRLDらで主流化した。Bonesらが先駆者の一人とされる。

その流れの中で、ロサンゼルス拠点で2012年（一説に2013年）に結成された集団、GothBoiCliqueに、Lil Peepが2016年に加入して注目を集めた。本名はGustav Åhrである。彼は、Brand NewやUnderoath、Oasisなどの曲を直接サンプリングした。うつと薬物依存を隠さずに歌った。2017年8月のアルバム『Come Over When You're Sober, Pt. 1』で広く知られた。だが同年11月15日、ツアーバスの中で、フェンタニルとアルプラゾラム（ザナックス）の毒性による事故死のため、21歳で亡くなった。

同じ時期、フロリダのXXXTentacionが、2015年に公開した『Look at Me!』で注目された。この曲は2017年の再リリースで広まり、爆発的に注目された。同年8月の『17』は、うつと自殺念慮を裸で綴った作品だった。一方で彼は、暴行等の罪で起訴されていた（係争中に死去）。2018年6月、フロリダで強盗に撃たれ、20歳で死亡した。

同じ2018年、シカゴのJuice WRLDが、『Lucid Dreams』でこの音楽をヒットに押し上げた。この曲は2017年6月にSoundCloudで公開され、2018年5月に正式発売された。10月にはBillboard Hot 100で2位まで上昇した。しかし彼も2019年12月、空港で発作を起こして病院に搬送され、同日、21歳で死亡が確認された。

2017年11月から2019年12月までの約2年で、主要人物が3人相次いで死亡した。うち2人は薬物の過剰摂取、1人は強盗事件による射殺だった。

SoundCloudという発表の場、そして精神的な苦痛を隠さないことがむしろ支持を集める時代の空気が、この音楽を短期間で主流に押し上げた。</p>
