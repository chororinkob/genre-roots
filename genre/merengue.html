<h1>Merengue（メレンゲ）とは</h1>
<p>ドミニカ共和国の国民音楽とされる、圧倒的に陽気で速いダンス音楽。編成の核は三つで、押し引きして音を出すボタン式アコーディオン、両面を革で張って一方を手、もう一方をばちで叩く筒型太鼓のタンボーラ、そしてハンマーと釘で凹凸を付けた金属</p>
<p>ドミニカ共和国の国民音楽とされる、圧倒的に陽気で速いダンス音楽。編成の核は三つで、押し引きして音を出すボタン式アコーディオン、両面を革で張って一方を手、もう一方をばちで叩く筒型太鼓のタンボーラ、そしてハンマーと釘で凹凸を付けた金属板を円筒形にした楽器ギラを硬いブラシでこするパーカッションである。この編成を核とするスタイルはペリコ・リピアオと呼ばれ、現代ではサックスやベースが加わるのが普通である。20世紀には、都市でオルケスタ（ビッグバンド）編成のメレンゲが別に発達した。拍子は2拍子（2/4または2/2で記譜されることが多く、4拍周期を重視して4/4で書く研究者もいる）で、テンポは、もとは130〜140程度で、今は160〜190に速くなる例もある。特徴的なのはタンボーラのパターンで、手のひらで低音を、ばちでリム（縁）などを叩き、第2部では16分音符の連打が特徴となり、ギラが途切れない擦り音でリズムの流れを保つことで、走り続けるような推進力が生まれる。ベースは拍の裏へ食い込むように動くことがあり、アコーディオンは高速の分散和音（和音を1音ずつ順に弾く）を弾くとされる。曲の構成は、歌の部分から、掛け合いと器楽ソロが加速していくハレオと呼ばれる後半へ雪崩れ込む型が定番である。踊りは男女が組み、拍ごとに横へ進む単純なステップが基本で、腰の動きの有無は時代や流派で異なる。踊りが単純なことが、幅広い層の関心を引いたとされる。</p>
<h2>成り立ち</h2><p>19世紀半ばのドミニカ共和国、北部のシバオ地方の農村で形成されたとされる（正確な起源の日付はない。ドミニカで現存する最古の文書は1854年の『El Oasis』に載った批判記事で、1840年代の記録とする資料や、1849年にプエルトリコで禁止令が出た記録もある）。起源についてはハイチのメラング、キューバのウパ・ハバネラ、あるいはアフリカ由来の踊りなど複数の説が語られ、決着はついていない。成立当初から上流階級や知識人はこれを下品で猥褻な踊りとして敵視し、19世紀後半には、知識人が新聞・雑誌や詩で非難を繰り返し、1887年にはサンティアゴ市がアコーディオンへの関税を提案した。楽器編成が決定的に変わったのは1870〜80年代で、ドイツ人タバコ商人を通じてシバオ地方に入ったボタン式アコーディオンが、それまでの弦楽器に取って代わる。この楽器は音量が大きく扱いやすかった一方、初期のアコーディオンは短調を出せず、アコーディオンによるメレンゲは長調中心になるという制約もあった。弦楽器の時代のメレンゲには、長調も短調もあった。地位を一変させたのは政治である。1930年から1961年まで独裁を敷いたRafael Trujilloは、自身が南部の中下層家庭の出身であったこともあり、上流階級が蔑んでいたメレンゲを国家の音楽として格上げした。全国のダンスバンドにメレンゲを演目に入れさせ、自分を讃える歌の作曲を奨励・強要し、サロンや放送で流すことを事実上義務づけた。この政策によってメレンゲは全国民の音楽になったが、同時に独裁の記憶と切り離せない歴史も背負うことになる。1961年のTrujillo暗殺後、メレンゲは統制から解放され、Johnny VenturaのCombo Show(1964年創設)が、派手な振付、縮小した金管、サルサの影響で人気を得た。1970年代にはWilfrido Vargasがテンポを上げ、ディスコやロックを取り入れ、Fernando Villalonaらが続く。1980年代後半にはJuan Luis Guerraが洗練された和声（コードの響き）と詩的で社会性のある歌詞を持ち込み、『Ojalá Que Llueva Café』(1989)から国際的に成功し、『Bachata Rosa』(1990)でバチャータも世界に広めた。1980年代末〜90年代には、ニューヨークのドミニカ系移民の間で、Proyecto Uno（1989年結成）やFulanito（1996年結成）らが、メレンゲとハウスやヒップホップを融合し、メレンハウス（メレンラップ）が生まれた。のちにドミニカ国内で、メレンゲ・ウルバノ（マンボ・デ・カジェ）が現れた。ニューヨーク生まれのプエルトリコ系でプエルトリコ（グアイナボ）で育ったElvis Crespoは、Grupo Maníaを経てソロに転向し、「Suavemente」(1998)がBillboard Hot Latin Tracksで6週連続1位となり、ラテン市場で大ヒットとなる。2000年代以降はバチャータとドミニカ式のデンボウに人気を奪われたが、祭りと選挙運動の現場では今も鳴り続けている。</p>
