<h1>Merengue（メレンゲ）とは</h1>
<p>メレンゲは、ドミニカ共和国の国民音楽とされる、圧倒的に陽気で速いダンス音楽だ。 編成の核は三つある。押し引きして音を出すボタン式アコーディオン、両面を革で張って一方を手、もう一方をばちで叩く筒型太鼓のタンボーラ、そしてハンマーと釘</p>
<p>メレンゲは、ドミニカ共和国の国民音楽とされる、圧倒的に陽気で速いダンス音楽だ。

編成の核は三つある。押し引きして音を出すボタン式アコーディオン、両面を革で張って一方を手、もう一方をばちで叩く筒型太鼓のタンボーラ、そしてハンマーと釘で凹凸を付けた金属板を円筒形にした楽器ギラを硬いブラシでこするパーカッションである。このアコーディオン、タンボーラ、ギラを核とする編成はペリコ・リピアオと呼ばれる。現代では、サックスやベースが加わるのが普通だ。一方、20世紀には、都市でオルケスタ（ビッグバンド）編成のメレンゲが別に発達した。

アコーディオンは、高速の分散和音（和音を1音ずつ順に弾く）を息継ぎなく弾き倒すと言われる。ベースは拍の裏へ食い込むように動くことが多い。

拍子は2拍子で、2/4または2/2で記譜されることが多い。4拍周期を重視して4/4で書く研究者もいる。テンポは速いもので1分あたり160拍を超える例がある。特徴的なのはタンボーラのパターンだ。タンボーラは手のひらで低音、ばちでリムなどを叩き、第2部では16分音符の連打が特徴となる。ギラは途切れない擦り音でリズムの流れを保つ。こうして、走り続けるような推進力が生まれる。

曲の構成は、歌の部分から、掛け合いと器楽ソロが加速していくハレオと呼ばれる後半へ雪崩れ込む型が定番である。

踊りは男女が組み、拍ごとに横へ進む単純なステップが基本で、腰の動きの有無は時代や流派で異なる。サルサに比べて足の動きが単純なため、誰でもすぐ加われる点も普及を支えたと言われる。</p>
<h2>成り立ち</h2><p>舞台は、19世紀半ばのドミニカ共和国、北部のシバオ地方の農村だ。ここで形成されたとされる（正確な起源の日付はなく、ドミニカで現存する最古の文書は1854年の『El Oasis』(批判記事)。1840年代の記録とする資料や、1849年にプエルトリコで禁止令が出た記録もある）。起源についてはハイチのメラング、キューバのウパ・ハバネラ、あるいはアフリカ由来の踊りなど複数の説が語られ、決着はついていない。

成立当初から、上流階級や知識人はこれを下品で猥褻な踊りとして敵視した。知識人が新聞・雑誌や詩で非難を繰り返し、1887年にはサンティアゴ市がアコーディオンへの関税を提案した。

楽器編成が決定的に変わったのは、1870〜80年代である。ドイツ人タバコ商人を通じてシバオ地方に入ったボタン式アコーディオンが、それまでの弦楽器に取って代わった。この楽器は音量が大きく扱いやすかった。一方で、短調を出せず長調中心になったという制約もあり、結果として独特の音使いが生まれた。

地位を一変させたのは政治である。1930年から1961年まで独裁を敷いたRafael Trujilloは、自身が南部の中下層家庭の出身であったこともあり、上流階級が蔑んでいたメレンゲを事実上国民音楽として推進した。楽団に自分を讃える歌を作らせ、サロンや放送で流すことを事実上義務づけた。ダンスバンドに演目への採用を課し、賛歌の作曲を奨励・強要した。この政策によってメレンゲは全国民の音楽になったが、同時に独裁の記憶と切り離せない歴史も背負うことになる。

1961年のTrujillo暗殺後、メレンゲは統制から解放された。Johnny VenturaのCombo Show(1964年創設)が、派手な振付、縮小した金管、サルサの影響で人気を得た。1970年代にはWilfrido Vargasがテンポを上げ、ディスコやロックを取り入れ、世界各地の流行を貪欲に取り込み、Fernando Villalonaらが続く。

1980年代後半（『Ojalá Que Llueva Café』1989年）からは、Juan Luis Guerraが洗練された和声（コードの響き）と詩的で社会性のある歌詞を持ち込み、国際的に成功した。さらに『Bachata Rosa』（1990年）で、バチャータも世界に広めた。

1980年代末〜90年代には、ニューヨークのドミニカ系移民の間で、Proyecto Uno（1989年結成）やFulanito（1996年結成）らが、メレンゲとハウスやヒップホップを融合した。メレンハウス（メレンラップ）が生まれ、のちにドミニカ国内でメレンゲ・ウルバノ（マンボ・デ・カジェ）が現れた。ニューヨーク生まれのプエルトリコ系でプエルトリコ（グアイナボ）で育ったElvis Crespoは、Grupo Maníaを経てソロに転向し、「Suavemente」(1998)が世界的なヒットとなる。

2000年代以降はバチャータとデンボウに人気を奪われたが、祭りと選挙運動の現場では今も鳴り続けている。</p>
