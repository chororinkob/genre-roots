<h1>Merengue（メレンゲ）とは</h1>
<p>ドミニカ共和国の国民音楽とされる、圧倒的に陽気で速いダンス音楽。編成の核は三つで、押し引きして音を出すボタン式アコーディオン、両面を革で張って一方を手、もう一方をばちで叩く筒型太鼓のタンボーラ、そして金属板に穴を開けたおろし金状の</p>
<p>ドミニカ共和国の国民音楽とされる、圧倒的に陽気で速いダンス音楽。編成の核は三つで、押し引きして音を出すボタン式アコーディオン、両面を革で張って一方を手、もう一方をばちで叩く筒型太鼓のタンボーラ、そして金属板に穴を開けたおろし金状の楽器ギラを金属の棒でこするパーカッションである。この三点編成はペリコ・リピアオと呼ばれ、後にサックス、ベース、コンガ、ピアノ、そして金管隊が加わって都市型の大編成へ発展した。拍子は2拍子で、テンポは速いもので1分あたり160拍を超える。特徴的なのはタンボーラのパターンで、手のひらが低い音を出しながら、ばちが細かい裏拍を刻み、ギラが16分音符を絶え間なく擦り続けることで、走り続けるような推進力が生まれる。ベースは拍の裏へ食い込むように動き、アコーディオンは高速の分散和音を息継ぎなく弾き倒す。曲の構成は、歌の部分から、掛け合いと器楽ソロが加速していくハレオと呼ばれる後半へ雪崩れ込む型が定番である。踊りは男女が組んで腰を左右に振りながら小刻みに歩くもので、サルサに比べて足の動きが単純なため、誰でもすぐ加われる点も普及を支えた。</p>
<h2>成り立ち</h2><p>19世紀半ばのドミニカ共和国、北部のシバオ地方の農村で形成されたとされる。起源についてはハイチのメラング、キューバのウパ・ハバネラ、あるいはアフリカ由来の踊りなど複数の説が語られ、決着はついていない。成立当初から上流階級と教会はこれを下品で猥褻な踊りとして敵視し、19世紀後半には新聞紙上で追放を求める論説が繰り返し掲載された。楽器編成が決定的に変わったのは19世紀末で、ドイツから輸入されたボタン式アコーディオンが、それまでの弦楽器に取って代わる。この楽器は音量が大きく扱いやすかった一方、ドミニカの旋律に必要な音を出せないという制約もあり、結果として独特の音使いが生まれた。地位を一変させたのは政治である。1930年から1961年まで独裁を敷いたRafael Trujilloは、自身が農村の出身であったこともあり、上流階級が蔑んでいたメレンゲを国家の音楽として公式に格上げした。楽団に自分を讃える歌を作らせ、サロンや放送で流すことを事実上義務づけ、歌詞や踊りは体制の宣伝装置として管理された。この政策によってメレンゲは全国民の音楽になったが、同時に独裁の記憶と切り離せない歴史も背負うことになる。1961年のTrujillo暗殺後、メレンゲは統制から解放され、Johnny Venturaが編成を近代化し、舞台演出とテンポの加速によって若者の音楽へ変えた。1970〜80年代にはWilfrido Vargasが世界各地の流行を貪欲に取り込み、Fernando Villalonaらが続く。1990年代にはJuan Luis Guerraが洗練された和声と詩的で社会性のある歌詞を持ち込み、『Bachata Rosa』(1990)で国際的な成功を収めた。同時期、ニューヨークのドミニカ系移民の間からメレンゲ・ウルバノが生まれ、Elvis Crespoの「Suavemente」(1998)が世界的なヒットとなる。2000年代以降はバチャータとレゲトンに人気を奪われたが、祭りと選挙運動の現場では今も鳴り続けている。</p>
