<h1>Post-Punk（ポストパンク）とは</h1>
<p>パンクの否定の身振りだけを引き継ぎ、音の材料をすべて組み替えたロック。ギターは歪んだ和音の壁をやめ、コーラスやディレイをかけた冷たく細い単音を弾き、輪郭のはっきりした反復音型を刻む。かわりに前へ出るのがベースで、旋律を持った動きの</p>
<p>パンクの否定の身振りだけを引き継ぎ、音の材料をすべて組み替えたロック。ギターは歪んだ和音の壁をやめ、コーラスやディレイをかけた冷たく細い単音を弾き、輪郭のはっきりした反復音型を刻む。かわりに前へ出るのがベースで、旋律を持った動きの多いラインが曲の骨格を担い、レゲエやダブ、ファンクから借りた深い低音が空間を支える。ドラムは装飾を削ぎ、床タムやシンバルを抑えた乾いた打撃を等間隔に置く型が多い。シンセサイザーやテープ、サックス、ヴァイオリンなど、パンクが排除した音源も抵抗なく持ち込まれる。テンポは110〜160BPMだが、あえて重く引きずる遅い曲も特徴的である。和声は短調と旋法を行き来し、解決しない不協和音をそのまま置く。歌唱は絶叫でも朗々とした歌唱でもなく、平板な語りや神経質な震え、演劇的な発声が選ばれる。歌詞は都市の疎外、消費社会の批判、身体と性、精神の不調、政治といった主題を、断片的で抽象的な言葉で扱う。録音では残響と定位が主要な表現手段になり、スタジオ作業そのものが作曲に組み込まれた。</p>
<h2>成り立ち</h2><p>1978年前後のイギリスで、パンクが定型に固まっていくことへの反発として生まれた。パンクの、誰でもできるという許可だけを受け取り、三コードと速さという形式を捨てた世代である。マンチェスターでは、1976年のSex Pistols公演を見た者たちが動き出した。Tony Wilsonが1978年に設立したレーベルFactory Recordsは、Joy Divisionを擁し、録音技師Martin Hannettが極端に分離した残響とデジタル・ディレイでこのバンドの音を作り上げた。1979年の「Unknown Pleasures」は、演奏そのものより空間の設計で聴かせる作品として決定的だった。ボーカルのIan Curtisは1980年5月18日、アメリカ公演の直前に自殺し、残ったメンバーはNew Orderとしてダンス音楽へ向かう。リーズではGang of Fourが、1979年の「Entertainment!」でファンクの刻みとマルクス主義的な歌詞を組み合わせた。ロンドンではSex Pistols解散後のJohn LydonがPublic Image Ltd.を結成し、1979年の「Metal Box」でダブの低音と工業的な反復を持ち込んで、ロックバンドという枠組み自体を批判した。ブリストルのThe Pop Groupはフリージャズと政治的な激烈さを、ロンドンのThe Slitsは女性だけの編成でレゲエのリズムを取り込む。流通を支えたのは、Geoff Travisが1976年にロンドンで開いた店から発展したRough Tradeで、独立系レコード店と流通網を全国に組織した。グラスゴーのPostcard Recordsは、Orange JuiceやJosef Kによる軽やかで明るい系統を生んでいる。アメリカでもニューヨークのTalking Headsが、Brian Enoの制作のもと1980年の「Remain in Light」でアフリカのポリリズムを取り入れ、同市のESGやLiquid Liquidがダンスとの接点を作った。1982年前後には多くのバンドが解散するか、より商業的なニューウェーヴへ吸収されて動きは収束する。だが2000年代初頭、Interpol、Franz Ferdinand、Bloc Partyらによる再評価が起き、その後もIDLESやDry Cleaningまで、参照され続ける源泉であり続けている。</p>
