<h1>Go-Go（ゴーゴー）とは</h1>
<p>ゴーゴーは、アメリカの首都ワシントンで生まれたファンクの一派だ。生演奏で聴くことを前提にしている。 最大の特徴の一つは、演奏が途切れないことだ。楽団は一曲を演奏し終えても止まらない。打楽器だけの区間を挟んで、次の曲へ滑り込む。この</p>
<p>ゴーゴーは、アメリカの首都ワシントンで生まれたファンクの一派だ。生演奏で聴くことを前提にしている。

最大の特徴の一つは、演奏が途切れないことだ。楽団は一曲を演奏し終えても止まらない。打楽器だけの区間を挟んで、次の曲へ滑り込む。このつなぎを繰り返し、何時間も一続きで演奏する。だから、録音された個別の曲を聴くだけでは、この音楽の本来の姿は伝わりにくい。

リズムの中心は、何層にも重なる打楽器だ。コンガ、カウベル、そして高さの違う小型の太鼓が、それぞれ別のリズムの形を刻む。それらが互いにずれながら、噛み合っていく。ティンバレスは用いられることがある。この独特の跳ねるような勢いは「ポケット」と呼ばれる。ドラムはこの層を支えながら、ハイハットで細かい刻みを保つ。初期のスタイルでは、そこに管楽器のユニゾンとキーボードが乗る。

何よりも大切なのは、聴衆との掛け合いだ。演者は演奏を続けながら、その場にいる人の名前や、出身の地区の名前を次々に呼び上げる。聴衆はそれに応える。掛け合いは客や会場に合わせて変わるため、同じ内容にはなりにくい。歌詞には政治的な内容のものもある。ただ、聴衆の名前や地区を呼び上げることが、重要な要素になっている。</p>
<h2>成り立ち</h2><p>舞台は1970年代のワシントンだ。政治の中心地でありながら、人口の大半を黒人が占め、深刻な貧困を抱えた都市だった。

この街で、最も広く創始者と認められているのがChuck Brownである。ただし、1970〜71年のYoung Senatorsの「Jungle」を原型とする見方など、先行や並行の動きも記録されており、一人の功績とは言い切れない。

彼は刑務所で服役中にギターを覚えた。出所後は楽団を率いて、地元の会場で演奏していた。Brown自身は、地元の客に人気があったディスコのDJと競うために、曲間をなくす発想を得たと語ったとされる。演奏を一切止めないという方法だ。着想については、ラテン系の楽団Los Latinosの打楽器から得たという別の語りもある。この判断が、この音楽のスタイルを形づくった。1970年代初頭にBrownが形を作り、1970年代を通じて定着したとされるが、時期には諸説ある。

1978年に彼が発表した「Bustin' Loose」は、全米R&amp;Bチャートで1位、Billboard Hot 100で34位となり、この街の音を全国に知らしめた。彼は「ゴーゴーのゴッドファーザー(Godfather of Go-Go)」と呼ばれ、2012年に亡くなるまで演奏を続けた。

1970年代からは、Rare Essence(1976年結成)、Trouble Funk(1978年〜)、Experience Unlimited(1970年代半ば〜)といった楽団が現れた。1980年代には録音や全国での露出が増え、街の各地区に、その地区ならではの楽団が根づいた。

1988年、Experience Unlimitedの楽曲が映画に使われ、全国的な人気を得た。しかし、この音楽が本格的に全米へ広まることは、結局なかった。理由は一つではない。映画『Good to Go』(1986年)の不振、当時は地元ラジオがほとんど流さなかったこと、ライブ録音が中心で市場に乗せにくかったことなどが挙げられる。実際、この分野の経済は独自の流通に支えられていた。公演を録音したカセットテープ(多くは無許諾の録音)を、街頭の業者や専門店で売るという形だ。

近年、この音楽は別の形で注目を集めた。2019年、ある店舗が長年にわたって店先で流していたこの音楽に、近隣の新住民から苦情が寄せられ、演奏が止められた。これに対し、地域から大規模な抗議運動が起こった。音を消すなという標語のもとで、都市の再開発によって、もともと住んでいた人たちが追い出されているという問題が、目に見える形になった。運動の結果、演奏は再開された。2020年には、この音楽が市の公式な音楽として法律で定められた。</p>
