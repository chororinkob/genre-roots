<h1>Go-Go（ゴーゴー）とは</h1>
<p>アメリカの首都ワシントンで生まれた、生演奏を前提とするファンクの一派である。最大の特徴の一つは、演奏が途切れないことにある。楽団は一曲を演奏し終えても止まらず、打楽器だけの区間を挟んで次の曲へ滑り込み、この連結を繰り返して何時間に</p>
<p>アメリカの首都ワシントンで生まれた、生演奏を前提とするファンクの一派である。最大の特徴の一つは、演奏が途切れないことにある。楽団は一曲を演奏し終えても止まらず、打楽器だけの区間を挟んで次の曲へ滑り込み、この連結を繰り返して何時間にもわたって一続きで演奏する。したがって録音された個別の楽曲だけでは、この音楽の本来の姿は伝わりにくい。リズムの中核は打楽器の層で、コンガ、ティンバレス、カウベル、そして高さの異なる小型の太鼓が、それぞれ異なる音型を刻み、互いにずれながら噛み合う。この独特の跳ねた躍動は「ポケット」と呼ばれる。ドラムはこの層を支えつつ、ハイハットで細分を保つ。ここへ、初期のスタイルでは管楽器の斉奏、電子オルガンの和音、ファンク由来の刻むギターが乗る。決定的に重要なのは聴衆との掛け合いで、演者は演奏を続けながら、その場にいる者の名や、出身の地区の名を次々に呼び上げ、聴衆はそれに応答する。したがって同じ演奏は二度と再現されない。歌詞には政治的な内容のものもあるが、聴衆の名前や地区を呼び上げることが重要な要素である。</p>
<h2>成り立ち</h2><p>1970年代半ばのワシントンは、政治の中心地でありながら、人口の大半を黒人が占め、深刻な貧困と犯罪を抱える都市だった。この街で、最も広く創始者と認められているのがChuck Brownである(1971年のYoung Senatorsの「Jungle」を原型とする見方など、先行や並行の動きも記録されており、一人の功績とは言い切れない)。彼は刑務所での服役中にギターを覚え、出所後に楽団を率いて地元の会場で演奏していた。Brown自身は、地元の客に人気があったディスコのDJと競うために、曲間をなくす発想を得たと語っている。演奏を一切止めないという方法である。着想については、ラテン系の楽団Los Latinosの打楽器から得たという別の語りもある。この判断が、この音楽の様式を形づくった。1978年に彼が発表した楽曲は全米で成功を収め、この街の音を全国に知らしめた。彼は「ゴーゴーのゴッドファーザー(Godfather of Go-Go)」と呼ばれ、2012年に死去するまで演奏を続けている。1970年代から、Rare Essence(1976年結成)、Trouble Funk(1978年〜)、Experience Unlimited(1975年〜)といった楽団が現れ、1980年代には録音や全国での露出が増え、街の各地区に固有の楽団が根づいた。1988年、Experience Unlimitedの楽曲が映画に用いられて全国的な人気を得たが、この音楽が本格的に全米へ広まることは結局なかった。理由は一つではなく、映画『Good to Go』(1986年)の不振、地元ラジオが流さなかったこと、ライブ録音が中心で市場に乗せにくかったことなどが挙げられる。実際、この分野の経済は、公演を録音したカセットテープ(多くは無許諾の録音)を街頭の業者や専門店で売るという独自の流通に支えられていた。近年、この音楽は別の形で注目を集めた。2019年、ある店舗が長年にわたり店先で流していたこの音楽に対して、近隣の新住民から苦情が寄せられ、演奏が停止された。これに対して地域から大規模な抗議運動が起こり、音を消すなという標語のもとで、都市の再開発による従来の住民の追い出しという問題が可視化された。運動の結果、演奏は再開され、2020年にはこの音楽が市の公式な音楽として法的に定められている。</p>
<h2>代表曲</h2><ul><li>Bustin' Loose (Chuck Brown &amp; the Soul Searchers)</li><li>Da Butt (Experience Unlimited)</li><li>Drop the Bomb (Trouble Funk)</li><li>Overnight Scenario (Rare Essence)</li><li>Pump Me Up (Trouble Funk)</li><li>Chuck Baby (Chuck Brown)</li><li>Welcome to DC (Mambo Sauce)</li><li>Let's Get Small (Trouble Funk)</li><li>Family Affair (Chuck Brown &amp; The Soul Searchers)</li><li>We Need Some Money (Chuck Brown)</li><li>Hey Fellas (Trouble Funk)</li><li>The Word (Junkyard Band)</li></ul>
