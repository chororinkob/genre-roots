<h1>Go-Go（ゴーゴー）とは</h1>
<p>アメリカの首都ワシントンで生まれた、生演奏を前提とするファンクの一派である。他のどの音楽とも異なる最大の特徴は、演奏が途切れないことにある。楽団は一曲を演奏し終えても止まらず、打楽器だけの区間を挟んで次の曲へ滑り込み、この連結を繰</p>
<p>アメリカの首都ワシントンで生まれた、生演奏を前提とするファンクの一派である。他のどの音楽とも異なる最大の特徴は、演奏が途切れないことにある。楽団は一曲を演奏し終えても止まらず、打楽器だけの区間を挟んで次の曲へ滑り込み、この連結を繰り返して二時間以上を一続きで演奏する。したがって録音された個別の楽曲は、この音楽の本来の姿を伝えない。リズムの中核は打楽器の層で、コンガ、ティンバレス、カウベル、そして高さの異なる小型の太鼓が、それぞれ異なる音型を刻み、互いにずれながら噛み合う。この独特の跳ねた躍動には固有の呼び名があり、テンポは概ね90から110 BPMである。ドラムはこの層を支えつつ、ハイハットで細分を保つ。ここへ管楽器の斉奏、電子オルガンの和音、そしてファンク由来の刻むギターが乗る。決定的に重要なのは聴衆との掛け合いで、演者は演奏を続けながら、その場にいる者の名や、出身の地区の名を次々に呼び上げ、聴衆はそれに応答する。したがって同じ演奏は二度と再現されない。歌詞よりも、その場で誰がいるかということ自体が内容となる音楽である。</p>
<h2>成り立ち</h2><p>1970年代半ばのワシントンは、政治の中心地でありながら、人口の大半を黒人が占め、深刻な貧困と犯罪を抱える都市だった。この街で音楽を作り上げたのがChuck Brownである。彼は刑務所での服役中にギターを覚え、出所後に楽団を率いて地元の会場で演奏していた。当時、ディスコの流行によって生演奏の楽団は仕事を失いつつあった。彼はこれに対抗する策として、演奏を一切止めないという方法を編み出す。レコードをかけるDJが曲の切れ目を作らないのなら、生の楽団も止まらなければよいという発想である。この判断が、この音楽の様式そのものを決定した。1978年に彼が発表した楽曲は全米で成功を収め、この街の音を全国に知らしめた。彼はこの分野の父と呼ばれ、2012年に死去するまで演奏を続けている。1980年代にはTrouble FunkやRare Essence、Experience Unlimitedといった楽団が現れ、街の各地区に固有の楽団が根づいた。1988年、Experience Unlimitedの楽曲が映画に用いられて全国的な人気を得たが、この音楽が本格的に全米へ広まることは結局なかった。理由は明白で、この音楽の本質が録音では伝わらないためである。実際、この分野の経済は、公演を録音したカセットテープを路上で売るという独自の流通に支えられていた。近年、この音楽は別の形で注目を集めた。2019年、ある店舗が長年にわたり店先で流していたこの音楽に対して、近隣の新住民から苦情が寄せられ、演奏が停止された。これに対して地域から大規模な抗議運動が起こり、音を消すなという標語のもとで、都市の再開発による従来の住民の追い出しという問題が可視化された。運動の結果、演奏は再開され、2020年にはこの音楽が市の公式な音楽として法的に定められている。</p>
<h2>代表曲</h2><ul><li>Bustin' Loose (Chuck Brown &amp; the Soul Searchers)</li><li>Drop the Bomb (Trouble Funk)</li><li>Da Butt (Experience Unlimited)</li><li>Overnight Scenario (Rare Essence)</li></ul>
