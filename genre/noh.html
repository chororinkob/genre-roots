<h1>Nohとは</h1>
<p>一言でいうと、台詞ではなく「謡」という歌で物語を運び、4種の楽器の囃子が情景と心理を描く舞台音楽だ。代表曲22曲を動画で聴け、ルーツと影響のつながりを地図でたどれる。</p>
<p>一言でいうと、台詞ではなく「謡」という歌で物語を運び、4種の楽器の囃子が情景と心理を描く舞台音楽だ。歌と演奏が途切れずに組み合わされ、音が止まった沈黙の瞬間まで音の一部として扱われる。

音の中心は囃子方の4人だ。能管は竹製の横笛で、息を強く吹き込むと甲高い叫びのような音が出る。小鼓は肩に載せ、左手で調緒を締めながら右手の指先で皮を打つ。締め方を変えると音の高さが動く。大鼓は膝に立てて桴で打ち、胴の芯を叩いた乾いた音が客席の奥まで届く。太鼓は台に据えて2本の桴で打ち、拍の骨格をつくる。

和音やコード進行という考え方はない。謡は「詞」と「節」に分かれ、詞ではほぼ同じ高さのまま言葉を置き、節では狭い音域を細かく上下させる。音域は1オクターブ前後に収まる。同じ音を長く伸ばすところと、言葉を速く置くところの差が、そのまま場面の緊張になる。

リズムの土台は8拍を1単位とする八拍子だ。七五調の12文字を1文として8つの拍に配り、1・3・5字目を2拍分に伸ばすモチの扱いで15文字分の長さになる。囃子とそろって進む拍子合と、拍から離れて自由に謡う拍子不合の2つがあり、平ノリ・中ノリ・大ノリという3段階の速さを使い分ける。速さの切り替えは打楽器の掛け声で合図する。

歌うのは主役だけではない。地謡座に並んだ地謡が、シテの心情や場面の情景を代弁して斉唱する。一人の感情をそのまま叫ぶのではなく、複数の声を重ねて淡々と置くことで、怨みや未練が遠くから響くように聞こえる。

詞章は和歌や『平家物語』『源氏物語』『伊勢物語』などの古典から採る。主題になるのは、死者が生前の記憶を語る執念、旅の僧が見知らぬ土地で出会う偶然、恋人や子を失った者の悔いだ。

1曲は序破急の3段で流れる。前場で旅人が土地の者と出会い、中入りを挟んで後場で正体が明かされる夢幻能の型が基本だ。『道成寺』のように鐘を巡る大がかりな曲、『葵上』のように生霊が現れる曲、『隅田川』のように母の悲しみを積み上げる曲では、聴かせどころの位置がそれぞれ違う。一日の番組は五番立てで組み、神・武将・女・狂乱・鬼の順に並べる。

狂言が現代語の台詞と笑いで進むのに対し、能は謡と囃子だけで情感を運ぶ。雅楽が神前に捧げる器楽中心の音楽であるのに対し、能は歌と劇を軸にしている。実際に音が鳴るのは、鏡板に老松を描いた能楽堂の舞台だ。囃子方は後座に座り、切戸口から後見が入る。笛が鳴り始めてから終曲まで、音楽はほとんど途切れない。</p>
<h2>成り立ち</h2><p>能が大成したのは14世紀の大和国、現在の奈良県だ。そこには大和猿楽四座と呼ばれる一座衆があり、結崎座・外山座・円満井座・坂戸座が競い合っていた。結崎座に山田猿楽から観阿弥が加わり、大夫として座を組織する。観阿弥は息子の世阿弥とともに、田楽の能が持っていた幽玄を猿楽の芸に取り入れ、京都の将軍足利義満の保護を受けて都の舞台に立った。それまでの猿楽は滑稽な物まねが主体だったが、貴族や上級武士が求める気品と余情を加えたことで、芸能としての位置が変わっていく。

世阿弥は1363年ごろに生まれ、1443年に亡くなったとされる。父の教えを書き留めた『風姿花伝』は1400年に3編までがまとまり、年齢ごとの稽古の意味や、観客の目を意識した演技の組み立てが記された。同時に『井筒』『高砂』『敦盛』『忠度』『清経』『砧』などの曲を残した。旅の僧が土地の者と出会い、問いかけるうちに相手の正体が死者や神だと分かる。前場と後場を中入りで区切る夢幻能の型は、この時期に整えられた。

しかし世阿弥の晩年は平穏ではなかった。後継者と目された長男の観世元雅は、『隅田川』『弱法師』などの曲を書いた才能の持ち主だったが、1394年ごろに生まれ、1432年に興行先の伊勢で急死する。40歳に届かない年齢だった。世阿弥はその後、1434年に将軍足利義教の命で佐渡へ流され、道中や配所の様子を『金島書』に書き残した。娘婿の金春禅竹が芸を継ぎ、能の理論は金春流へと渡る。

一方、世阿弥の甥である音阿弥の子、観世信光は15世紀半ばに生まれ、観世座の大鼓役者を務めながら作者として頭角を現した。『船弁慶』では義経一行の船に平知盛の霊が現れて波を荒らし、『紅葉狩』では山中の女が鬼に変わる。『道成寺』の原型とされる『鐘巻』も信光の作とされる。筋の運びよりも見せ場と舞台の変化を重んじる作風で、能は見物としての面白さを増していった。

江戸時代に入ると、能は幕府の式楽として保護され、演じる側の流儀が固まる。観世・宝生・金春・金剛の4流は室町初期の大和猿楽四座を源流とし、喜多流は1618年に喜多七太夫長能が金春流から分かれて立てた。役者は幕府の行事で演じることを義務づけられ、芸は家ごとに継承された。

それでも明治維新で幕府の保護が消えると、能は一気に困窮する。役者の多くは副業で暮らし、舞台と装束を維持できなくなった。1881年、岩倉具視を含む華族らが能楽社を立ち上げ、芝公園に芝能楽堂を建てる。屋根の下に舞台と客席を収めたこの建物が、現在の能楽堂の原型になった。

戦後、能楽は1957年12月4日に国の重要無形文化財に指定され、日本能楽会の会員が保持者として総合的に認定された。2001年にはユネスコの「人類の口承及び無形遺産に関する傑作」として宣言され、2008年に無形文化遺産の代表的な一覧表へ記載される。1983年9月には東京・千駄ヶ谷に国立能楽堂が開場し、自主公演と後継者の養成の場になった。

現在、流儀ごとに演じられる曲は現行曲と呼ばれ、全体で200曲前後、5流を合わせると248曲になる。観世流だけで約210番を数える。曲の大半は室町時代の終わりまでに作られ、新しい曲はほとんど加わっていない。装束と面の修復、囃子方の担い手の確保、地方の能楽堂の維持が今の課題になっている。</p>
