<h1>Nohとは</h1>
<p>能は、「謡」と楽器の演奏で物語を進める舞台音楽だ。代表曲22曲を動画で聴け、ルーツと影響のつながりを地図でたどれる。</p>
<p>能は、「謡」と楽器の演奏で物語を進める舞台音楽だ。謡はコトバ（はっきりした旋律のないせりふ）とフシ（旋律のある部分）から成る。囃子が場面の情景や登場人物の心の動きを描く。歌と演奏が途切れずに組み合わされ、音が止まった沈黙の瞬間まで、音の一部として扱われる。

音の中心は囃子方だ。囃子は笛・小鼓・大鼓に、曲によって太鼓が加わる。能管は竹製の横笛で、息を強く吹き込むと、甲高い叫びのような音が出る。小鼓は肩に載せ、左手で調緒を締めながら、右手の指先で皮を打つ。調緒の握り加減で、音色（音の高さ）が変わる。大鼓は左手で持って左ひざに載せ、指皮を付けた右手の指で革を打つ。革は演奏前に炭火であぶって乾かし、硬い音を出す。その乾いた音が客席の奥まで届く。太鼓は台に据え、2本の桴で打ち、拍の骨格をつくる。

和音やコード進行という考え方はない。謡は「詞」と「節」に分かれる。詞ではほぼ同じ高さのまま言葉を置き、節では狭い音域を細かく上下させる。音域は、強吟は弱吟より音域が狭く、1オクターブ以下の構造だ。同じ音を長く伸ばすところと、言葉を速く置くところの差が、そのまま場面の緊張になる。

リズムの土台は、8拍を1単位とする八拍子だ。七五調の12文字を1句として8つの拍に配る。1・3・5字目を2字分に伸ばすモチの扱いで15字分とし、1字分の休止を足して8拍に収める。囃子とそろって進む拍子合と、拍から離れて自由に謡う拍子不合がある。拍子合には、字と拍の割り当てが異なる平ノリ・中ノリ・大ノリの3型がある。掛け声は、奏者が互いに間合いと進行位置を確かめる合図だ。

歌うのは主役だけではない。地謡座に並んだ地謡が、シテの心情や場面の情景を代弁して斉唱する。一人の感情をそのまま叫ぶのではなく、複数の声を重ねて淡々と置く。そのため、怨みや未練が遠くから響くように聞こえる。

詞章は、和歌や『平家物語』『源氏物語』『伊勢物語』などの古典から採る。主題になるのは、死者が生前の記憶を語る執念、旅の僧が見知らぬ土地で出会う偶然、恋人や子を失った者の悔いだ。

1曲は序破急の3段で流れる。能には夢幻能と現在能がある。夢幻能は世阿弥が大成した代表的な型で、前場で旅人が土地の者と出会い、中入りを挟んで、後場で正体が明かされる。『道成寺』のように鐘を巡る大がかりな曲、『葵上』のように生霊が現れる曲、『隅田川』のように母の悲しみを積み上げる曲では、聴かせどころの位置がそれぞれ違う。一日の番組は五番立てで組み、神・男（修羅）・女・狂・鬼の順に並べる。

狂言は、室町時代ごろの口語を基調にした台詞と笑いで進む。それに対し、能は謡と囃子だけで情感を運ぶ。雅楽は、器楽合奏（管絃）・舞（舞楽）・歌物を含む総合芸能で、宮廷儀式や神事などで演奏される。それに対し、能は歌と劇を軸にしている。実際に音が鳴るのは、鏡板に老松を描いた能楽堂の舞台だ。囃子方は後座に座り、切戸口から後見が入る。楽器の鳴らない「間」も、音楽の一部とされる。</p>
<h2>成り立ち</h2><p>大和猿楽の座から出た観阿弥・世阿弥が、14〜15世紀に京都で能を大成した。その大和国、現在の奈良県には、大和猿楽四座と呼ばれる一座衆があった。結崎座・外山座・円満井座・坂戸座が競い合っていた。

結崎座に、山田猿楽の出とされる観阿弥が加わり、大夫として座を組織する。観阿弥は息子の世阿弥とともに、田楽・曲舞・近江猿楽などからの影響を猿楽の芸に取り入れたといわれる。京都では将軍足利義満の保護を受け、都の舞台に立った。それまでの猿楽は物真似芸が主体だった。貴族や上級武士が求める気品と余情を加えたことで、芸能としての位置が変わっていく。

世阿弥は1363年ごろに生まれ、1443年に亡くなったとされる。父の教えを書き留めた『風姿花伝』は、1400年ごろに第三編までがまとまった。年齢ごとの稽古の意味や、観客の目を意識した演技の組み立てが記されている。同時に世阿弥は、『井筒』『高砂』『敦盛』『忠度』『清経』『砧』などの曲を残した。旅の僧が土地の者と出会い、問いかけるうちに、相手の正体が死者や神だと分かる。前場と後場を中入りで区切る夢幻能の型は、この時期に整えられた。

しかし世阿弥の晩年は平穏ではなかった。後継者と目された長男の観世元雅は、『隅田川』『弱法師』などの曲を書いた才能の持ち主だった。1394年ごろ（1401年ごろとする説もある）に生まれ、1432年に興行先の伊勢で急死する。40歳に届かない年齢だった。世阿弥はその後、1434年に将軍足利義教の命で佐渡へ流された。道中や配所の様子は『金島書』に書き残している。娘婿の金春禅竹は世阿弥を経済的に支え、世阿弥の能楽論は金春家に伝わった。

一方、世阿弥の甥である音阿弥の子、観世信光は、15世紀半ばに生まれた。観世座の大鼓役者を務めながら、作者として頭角を現す。『船弁慶』では、義経一行の船に平知盛の霊が現れて波を荒らす。『紅葉狩』では、山中の女が鬼に変わる。『道成寺』の原型とされる『鐘巻』も、信光作といわれる（作者不詳とする資料もある）。筋の運びよりも、見せ場と舞台の変化を重んじる作風で、能は見物としての面白さを増していった。

江戸時代に入ると、能は幕府の式楽として保護され、演じる側の流儀が固まる。観世・宝生・金春・金剛の4流は、室町初期の大和猿楽四座を源流とする。喜多流は、江戸初期（1610年代後半〜1620年代）に、喜多七太夫長能が金剛座から独立して北七大夫を名乗り、立てた。役者は幕府の行事で演じることを義務づけられ、芸は家ごとに継承された。

それでも明治維新で幕府の保護が消えると、能は一気に困窮する。役者の多くは副業で暮らし、舞台と装束を維持できなくなった。岩倉具視らが後援団体の設立を推進し、芝公園に芝能楽堂を建設する（1881年落成）。落成を受けて、同年4月に能楽社が設立された。屋根の下に舞台と客席を収めたこの建物が、現在の能楽堂の原型になった。

戦後、能楽は1957年12月4日に国の重要無形文化財に指定された。日本能楽会の会員が、保持者として総合的に認定された。2001年にはユネスコの「人類の口承及び無形遺産に関する傑作」として宣言され、2008年に無形文化遺産の代表的な一覧表へ記載される。1983年9月には東京・千駄ヶ谷に国立能楽堂が開場し、自主公演と後継者の養成の場になった。

現在、流儀ごとに演じられる曲は現行曲と呼ばれる。全体でおよそ240曲前後（資料により異同あり）で、観世流だけで約210番を数える。曲の大半は室町時代の終わりまでに作られ、新しい曲はほとんど加わっていない。装束と面の修復、囃子方の担い手の確保、地方の能楽堂の維持が、今の課題になっている。</p>
