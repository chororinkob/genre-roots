<h1>Kwela（クウェラ）とは</h1>
<p>南アフリカで生まれた、安価な金属製の縦笛を主役とする軽快な音楽である。中心楽器はペニー・ホイッスルと呼ばれる六孔の小さな笛で、その名のとおり極めて安価に手に入るものだった。この笛が高い音域で跳ねるような旋律を吹き、しばしば二本以上</p>
<p>南アフリカで生まれた、安価な金属製の縦笛を主役とする軽快な音楽である。中心楽器はペニー・ホイッスルと呼ばれる六孔の小さな笛で、その名のとおり極めて安価に手に入るものだった。この笛が高い音域で跳ねるような旋律を吹き、しばしば二本以上で重ねられる。伴奏は自作の一弦低音楽器と、アコースティック・ギターが担う。一弦低音楽器は洗濯桶に棒を立て、そこに一本の紐を張っただけのもので、棒を傾けて張力を変えることで音程を作る。このように、正規の楽器をほとんど使わずに編成が成り立っている点が、この音楽の出自を物語る。リズムは四拍子で、各拍の裏をギターが短く刻んで推進力を作る。テンポは速めで、踊るための音楽として機能した。和声は三つの和音を循環させる単純な進行が基本で、この枠の中で笛が自由に即興を展開する。この循環する和音進行は、アメリカのジャズやスウィングから受け取ったものである。旋律には南部アフリカの伝統的な歌の型と、教会の讃美歌の影響が混ざる。歌は用いられないか、用いられても短い掛け声程度で、あくまで笛の音楽である点が特徴となっている。</p>
<h2>成り立ち</h2><p>1940年代から50年代の南アフリカ、とりわけヨハネスブルグ周辺の黒人居住区が舞台である。この時期、都市には鉱山や工場で働くために農村から膨大な人口が流入していた。1948年に国民党が政権を取り、人種隔離政策が法として体系化されると、黒人の居住と移動、集会は厳しく制限される。この状況で若者たちが手にしたのが、雑貨店で買える安価な金属の笛だった。ソフィアタウンやアレクサンドラといった地区の街角で、少年たちが笛を吹き、人が集まって踊るという光景が日常になっていく。名称の由来には有力な説がある。クウェラとはズールー語で登れという意味の言葉で、警察が黒人を検挙する際に護送車へ乗るよう命じる際に使った言葉だとされる。街角の見張り役が警察の接近を知らせる合図として使われたとも語られている。すなわち、この明るい音楽の名は、取り締まりと隣り合わせだった演奏環境そのものに由来している。実際、路上での演奏や集会は許可なく行えず、演奏者は常に逃げる準備をしていた。この音楽を世界に知らしめたのがスポークス・マシヤネである。1956年に彼が吹き込んだ曲は南アフリカで記録的な売上を記録し、笛の演奏を職業として成立させた。1958年にはエルキー・シェイヤの曲がイギリスで大ヒットし、国外でも知られるようになる。しかし1960年代に入ると、人種隔離政策の強化によってソフィアタウンが強制的に取り壊され、住民は遠方の居住区へ移された。音楽が育った街そのものが消えたのである。以後クウェラは衰退し、より大きな編成のムバカンガやアフリカン・ジャズへ移行していく。ただし笛の奏法と和音の循環は後続に受け継がれ、南アフリカの都市音楽の基層をなしている。</p>
<h2>代表曲</h2><ul><li>Tom Hark (Elias and His Zig-Zag Jive Flutes)</li><li>Kwela Spokes (Spokes Mashiyane)</li><li>Ace Blues (Spokes Mashiyane)</li></ul>
