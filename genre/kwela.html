<h1>Kwela（クウェラ）とは</h1>
<p>南部アフリカの街頭音楽として生まれ、とりわけ南アフリカで発達した、安価な金属製の縦笛を主役とする軽快な音楽である。 中心楽器はペニー・ホイッスルと呼ばれる六孔の小さな笛で、その名のとおり極めて安価に手に入るものだった。この笛が高い</p>
<p>南部アフリカの街頭音楽として生まれ、とりわけ南アフリカで発達した、安価な金属製の縦笛を主役とする軽快な音楽である。

中心楽器はペニー・ホイッスルと呼ばれる六孔の小さな笛で、その名のとおり極めて安価に手に入るものだった。この笛が高い音域で跳ねるような旋律を吹き、しばしば2本以上で重ねられる。

ペニー・ホイッスル、ギター、自作の箱ベース（茶箱ベース）が基本で、録音ではダブルベース（大型の弦楽器）とドラムが加わった。街頭演奏では自作の箱ベースなど簡素な楽器が使われたが、録音ではギター、ダブルベース、ドラムを含む通常の編成が標準になった。

リズムはスキッフル風（skiffle-like、手作り楽器で弾む素朴な演奏の型）である。テンポは速めで、踊るための音楽として機能した。

和声は、少数の和音を反復する進行が基本で（具体的な進行は、I–IV–I⁶₄–Vとする説、C–F–C–G7とする記述、特定の進行は無いとする説がある）、この枠の中で笛が自由に即興を展開する。クウェラは南アフリカの都市音楽マラビ（marabi）から発展し、マラビ風の反復和音を土台にする。tsaba-tsabaや伝統音楽の影響も挙げられる。</p>
<h2>成り立ち</h2><p>舞台は、1940年代から50年代の南アフリカ、とりわけヨハネスブルグ周辺の黒人居住区である。

この時期、都市には鉱山や工場で働くために農村から膨大な人口が流入していた。1948年に国民党が政権を取り、人種隔離政策が法として体系化されると、黒人の居住と移動、集会は厳しく制限される。

この状況で若者たちが手にしたのが、安価な金属の笛だった。ソフィアタウンやアレクサンドラといった地区の街角で、少年たちが笛を吹き、人が集まって踊るという光景が日常になっていく。

名称の由来には最も一般的な説明がある。クウェラとはズールー語・コサ語で登れという意味の言葉で、警察が黒人を検挙する際に護送車へ乗るよう命じる際に使った言葉だとされる。街角の見張り役が警察の接近を知らせる合図として使われたとも語られている。「kwela」という名前が音楽に定着したのは1958年ごろで、それ以前は「penny whistle jive」「tin whistle jive」と呼ばれた。

名称には諸説がある。ズールー語・コサ語などングニ諸語のkhwela「登る」と警察車両kwela-kwelaに結びつける説（最も一般的な説明）、コサ語の「始める、動き出せ」という合図に由来するという説（DSAE）、息を吸い込んで鋭い音を出す、という意味のコサ語の動詞に由来するという説がある。

スポークス・マシヤネは南アフリカ国内で成功し、彼個人が国外で評価されたのは1960年代で、1965年にニューポート・フォーク・フェスティバルへ招かれた。1954年に彼が吹き込んだ「Ace Blues」などは南アフリカで大ヒットし、笛の音楽を一般に広め、商業的成功に導いた。1958年にはElias and His Zig-Zag Jive Flutesの「Tom Hark」がイギリスで2位の大ヒットとなり、国外でも知られるようになる。

しかし1955年から、人種隔離政策の強化によってソフィアタウンの住民の強制移住が始まり、住民は遠方の居住区へ移されて、街は取り壊された（完了の時期は資料により、1960年、1962年、1963年末と割れている）。音楽が育った街そのものが消えたのである。

1962年ごろには録音がほぼ途絶えた。主な要因は、演奏者が笛をサックスに替え、サックス・ジャイヴからムバカンガへ移ったこととされる。ただし、ムバカンガなど後続の都市音楽は、マラビやクウェラの影響を受けた。</p>
