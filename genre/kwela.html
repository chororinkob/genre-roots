<h1>Kwela（クウェラ）とは</h1>
<p>南部アフリカの街頭音楽として生まれ、とりわけ南アフリカで発達した、安価な金属製の縦笛を主役とする軽快な音楽である。中心楽器はペニー・ホイッスルと呼ばれる六孔の小さな笛で、その名のとおり極めて安価に手に入るものだった。この笛が高い音</p>
<p>南部アフリカの街頭音楽として生まれ、とりわけ南アフリカで発達した、安価な金属製の縦笛を主役とする軽快な音楽である。中心楽器はペニー・ホイッスルと呼ばれる六孔の小さな笛で、その名のとおり極めて安価に手に入るものだった。この笛が高い音域で跳ねるような旋律を吹き、しばしば二本以上で重ねられる。ペニー・ホイッスル、ギター、自作の一弦箱ベース（茶箱ベース）が基本で、録音ではダブルベースとドラムが加わった。このように、正規の楽器をほとんど使わずに編成が成り立っている点が、この音楽の出自を物語る。リズムはスキッフル風（skiffle-like）である。テンポは速めで、踊るための音楽として機能した。和声は、少数の和音を反復する進行が基本で（具体的な進行は、I–IV–I⁶₄–Vとする説、C–F–C–G7とする記述、特定の進行は無いとする説がある）、この枠の中で笛が自由に即興を展開する。この循環する和音進行は、南アフリカの都市音楽マラビ（marabi）に由来する。</p>
<h2>成り立ち</h2><p>1940年代から50年代の南アフリカ、とりわけヨハネスブルグ周辺の黒人居住区が舞台である。この時期、都市には鉱山や工場で働くために農村から膨大な人口が流入していた。1948年に国民党が政権を取り、人種隔離政策が法として体系化されると、黒人の居住と移動、集会は厳しく制限される。この状況で若者たちが手にしたのが、雑貨店で買える安価な金属の笛だった。ソフィアタウンやアレクサンドラといった地区の街角で、少年たちが笛を吹き、人が集まって踊るという光景が日常になっていく。名称の由来には有力な説がある。クウェラとはズールー語で登れという意味の言葉で、警察が黒人を検挙する際に護送車へ乗るよう命じる際に使った言葉だとされる。街角の見張り役が警察の接近を知らせる合図として使われたとも語られている。名称には諸説がある。ズールー語の「登る」と警察車両kwela-kwelaに結びつける説（最有力）、コサ語の「始める、動き出せ」という合図に由来するという説（DSAE）、笛を吹くという意味の動詞に由来するという説がある。スポークス・マシヤネは南アフリカ国内で成功し、国外で評価されたのは1960年代で、1965年にニューポート・フォーク・フェスティバルへ招かれた。1954年に彼が吹き込んだ「Ace Blues」などは南アフリカで大ヒットし、笛の演奏を職業として成立させた。1958年にはElias and His Zig-Zag Jive Flutesの「Tom Hark」がイギリスで2位の大ヒットとなり、国外でも知られるようになる。しかし1955年から、人種隔離政策の強化によってソフィアタウンの住民の強制移住が始まり、住民は遠方の居住区へ移されて、街は取り壊された（完了の時期は資料により、1960年、1962年、1963年末と割れている）。音楽が育った街そのものが消えたのである。以後クウェラは衰退し、録音は1962年頃にほぼ消えた。サックスがペニー・ホイッスルに取って代わり、サックス・ジャイヴを経てムバカンガに移った。ただし笛の奏法と和音の循環は後続に受け継がれ、南アフリカの都市音楽の基層をなしている。</p>
<h2>代表曲</h2><ul><li>Tom Hark (Elias and His Zig-Zag Jive Flutes)</li><li>Kwela Spokes (Spokes Mashiyane)</li><li>Meva (Spokes Mashiyane)</li><li>Ace Blues (Spokes Mashiyane)</li><li>Dolos (Spokes Mashiyane)</li><li>Phatha Phatha No. 2 (Spokes Mashiyane)</li><li>Ry-Ry (Elias and His Zig Zag Jive Flutes)</li><li>Lemmy's Kwela (Lemmy Special Mabaso)</li><li>Kwela Blues (Lemmy Special Mabaso)</li><li>Kwela Du Du (Spokes Mashiyane)</li><li>Hlalanaye (Lemmy Mabaso)</li><li>Malala (Lemmy Mabaso)</li></ul>
