<h1>Tropicália（トロピカリア）とは</h1>
<p>トロピカリアは、1960年代末のブラジルで生まれた運動だ。国内の音楽的な伝統と、外国から流入した、エレクトリックギターを使うロックやサイケデリアの音楽を、意図的にぶつけ合わせた。単一の音のスタイルではなく、方法の宣言に近い。 土台</p>
<p>トロピカリアは、1960年代末のブラジルで生まれた運動だ。国内の音楽的な伝統と、外国から流入した、エレクトリックギターを使うロックやサイケデリアの音楽を、意図的にぶつけ合わせた。単一の音のスタイルではなく、方法の宣言に近い。

土台にあるのは、サンバやボサノヴァ、そして北東部の舞踏音楽といった、ブラジル固有のリズムだ。そこへ、歪ませたエレクトリックギター、幻覚的な音響効果、現代音楽の手法による管弦楽の編曲が、容赦なく重ねられる。編曲を担った人物は前衛音楽の素養を持っていた。前衛的な管弦楽の編曲に加え、コラージュや音響効果（sonoplastia）が用いられた。

曲の構造も一定しない。途中で全く別の曲へ変わる。朗読が挿入される。複数の音楽が同時に鳴る。こうした手法が使われる。

歌い方は一様ではない。ボサノヴァ的な抑えた歌い方から、実験的な発声まで幅がある。

歌詞は、具体詩と呼ばれる前衛的な詩の運動の詩人たちと交流し、協働して書かれた。その手法も取り入れ、商品名、報道の断片、外国語、俗語が、そのまま並べて置かれる。

全体を貫くのは、美しさと醜さ、輸入品と土着、洗練と粗野を、優劣をつけずに同じ皿へ載せるという姿勢だ。</p>
<h2>成り立ち</h2><p>1964年、ブラジルで軍事クーデターが起き、民主政権が倒れた。以後20年以上続く独裁体制の始まりである。

この状況の中で、左派の学生運動を中心とする勢力は、ブラジル固有の音楽を守る立場を取っていた。外国の商業音楽、とりわけエレクトリックギターは、帝国主義のトレードマークとして排斥された。テレビの歌謡祭典で、電気楽器を使った演奏が観客から野次を浴びる出来事も、実際に起きている。

トロピカリアは、この二重の抑圧に異議を唱えた運動である。一つは、軍事政権による政治的な弾圧。もう一つは、左派による、自国の文化だけを守ろうとする民族主義的な純血主義だ。中心にいたのは、北東部バイーア州出身のCaetano VelosoとGilberto Gilだった。

彼らが思想の支えとして掲げたのは、1928年に詩人Oswald de Andradeが発表した文章である。そこには、外国の文化を拒むのでも崇めるのでもなく、食人のように貪り食って自らの血肉に変えるべきだ、という主張があった。これが運動のやり方となった。

1968年、彼らはGal Costa、Tom Zé、若いロックバンドOs Mutantesらとともに、共同名義の作品を発表する。管弦楽の編曲はRogério Duprat、言葉は詩人Torquato Netoが寄せた。この作品はブラジルの大衆音楽の歴史に大きな影響を与えたとされる。

しかし同じ1968年12月、軍事政権は制度的法令第五号を発布した。大統領に議会の休会を命じる権限や、政治犯罪についての人身保護令状を停止する権限などを、与える法令である。その権限は直ちに使われ、議会は事実上1969年10月まで閉鎖された。この法令は、拷問・殺害などを国家が制度として行う道を開いた。

その直後、Caetano VelosoとGilberto Gilは裁判なしで逮捕された。国歌を冒涜したという噂や、若者を反抗に扇動したという嫌疑があった。逮捕の名目は記録に残るが、真の理由は今も明確でない。

2人は約2か月の拘禁を経て、1969年2月19日から自宅軟禁（バイーア州内に限定）となり、同年7月に出国した。イギリスで数年を過ごし、1972年にようやく帰国している。

運動そのものは1968年末の弾圧で事実上終わったが、その影響は絶大だった。後続の音楽家に大きな影響を与え、「ポスト・トロピカリスタ」と呼ばれる世代が現れた。また、1980年代末（1989年）以降は、欧米の音楽家からも繰り返し再発見されている。</p>
