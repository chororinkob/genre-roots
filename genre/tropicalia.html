<h1>Tropicália（トロピカリア）とは</h1>
<p>1960年代末のブラジルで、国内の音楽的な伝統と、外国から流入した電子的な音楽を、意図的に衝突させて生まれた運動である。単一の音の様式ではなく、方法の宣言に近い。土台にはサンバやボサノヴァ、そして北東部の舞踏音楽といったブラジル固</p>
<p>1960年代末のブラジルで、国内の音楽的な伝統と、外国から流入した電子的な音楽を、意図的に衝突させて生まれた運動である。単一の音の様式ではなく、方法の宣言に近い。土台にはサンバやボサノヴァ、そして北東部の舞踏音楽といったブラジル固有のリズムが置かれるが、そこへ歪ませたエレクトリックギター、幻覚的な音響効果、そして現代音楽の手法による管弦楽の編曲が容赦なく重ねられる。編曲を担った人物は前衛音楽の素養を持っており、和音の外れた金管、逆再生した音、雑音の挿入といった処理が随所に施された。曲の構造も一定せず、途中で全く別の曲へ変わる、朗読が挿入される、複数の音楽が同時に鳴るといった手法が用いられる。歌詞は具体詩と呼ばれる前衛的な詩の運動の影響を受け、商標の名、報道の断片、外国語、俗語が並置される。歌唱は洗練を志向せず、意図的に外れた音程や叫びが用いられる。全体として、美しさと醜さ、輸入品と土着、洗練と粗野を、優劣をつけずに同じ皿へ載せるという姿勢が一貫している。</p>
<h2>成り立ち</h2><p>1964年、ブラジルでは軍事クーデターにより民主政権が倒され、以後20年以上続く独裁体制が始まった。この状況下で、左派の学生運動を中心とする勢力は、ブラジル固有の音楽を守り、外国の商業音楽、とりわけエレクトリックギターを帝国主義の象徴として排斥するという立場を取っていた。テレビの歌謡祭典において、電気楽器を用いた演奏が観客から野次を浴びるという事態が実際に起きている。この二重の抑圧、すなわち軍事政権による政治的な弾圧と、左派によるナショナリズム的な純血主義の双方に対して異議を唱えたのが、この運動だった。中心にいたのは北東部バイーア州出身のCaetano VelosoとGilberto Gilである。彼らは思想的な支柱として、1928年に詩人Oswald de Andradeが発表した文章を掲げた。そこでは、外国の文化を拒むのでも崇めるのでもなく、食人のように貪り食って自らの血肉に変えるべきだという主張が展開されており、これがこの運動の方法論となった。1968年、彼らはGal Costa、Tom Zé、そして若いロックバンドOs Mutantesらとともに、共同名義の作品を発表する。管弦楽の編曲はRogério Dupratが担い、詩人Torquato Netoが言葉を寄せた。この作品はブラジルの大衆音楽の歴史を決定的に変えた。しかし同じ1968年12月、軍事政権は制度的法令第五号を発布して議会を閉鎖し、検閲と拷問を制度化する。その直後、Caetano VelosoとGilberto Gilは理由も告げられずに逮捕され、数か月の拘禁を経て国外退去を余儀なくされた。彼らはロンドンで数年を過ごし、1972年にようやく帰国している。運動そのものは実質的に一年余りで終わったが、その影響は絶大だった。ブラジルの音楽は以後、外来のものを取り込むことに躊躇しなくなり、また1990年代以降は欧米の音楽家からも繰り返し再発見されている。</p>
<h2>代表曲</h2><ul><li>Alegria, Alegria (Caetano Veloso)</li><li>Domingo no Parque (Gilberto Gil)</li><li>A Minha Menina (Os Mutantes)</li></ul>
