<h1>Bongo Flava（ボンゴ・フラヴァ）とは</h1>
<p>タンザニアで発達した、ヒップホップとリズム・アンド・ブルースを土台とする大衆音楽だ。名前は、Bongo（脳を意味するubongoの拡大形で、ダルエスサラームの通称）と、Flava（英語flavorのスラング綴り）を組み合わせた造語</p>
<p>タンザニアで発達した、ヒップホップとリズム・アンド・ブルースを土台とする大衆音楽だ。名前は、Bongo（脳を意味するubongoの拡大形で、ダルエスサラームの通称）と、Flava（英語flavorのスラング綴り）を組み合わせた造語である。

音の組み立ては、アメリカのヒップホップを基本にしながら、いくつもの要素が混ざる。ヒップホップとR&amp;Bを軸に、ラガ、レゲエ、ズーク、伝統的な打楽器・笛など、多様な要素を混ぜ合わせる。テンポは中くらいだ。

メロディーには、タアラブやダンシといった地元の音楽の影響を受けた、飾りの多い節回しが入り込む。和音は、リズム・アンド・ブルースの豊かな響きを使う。

リズムには、ジャマイカのダンスホールの跳ねた刻みが加わる。近年は、西アフリカのアフロビーツの歌い手との共演も行われている。

歌とラップの境目はあいまいで、同じ演者が両方を行き来する。

何より大切なのは言葉だ。スワヒリ語が中心で、英語も混ざる。英語は2011年頃から、恋愛の歌を中心に増えた。その背景には、私立校での英語教育やアフロビーツの影響、海外の市場を目指す姿勢がある。

歌詞は当初、貧困、汚職、感染症といった社会問題を扱った。しかし2000年代初頭に軽い主題の流れが現れ、2000年代後半には主流のポップへの変化が進んだ。近年は恋愛や成功を歌う曲が増えている。一方で、社会派の流れも続いている。</p>
<h2>成り立ち</h2><p>背景にあるのは、タンザニアの言語政策だ。独立後の初代大統領Julius Nyerereは、100を超える民族集団をまとめるため、スワヒリ語を国語として徹底して広めた。この政策によって、出身民族を問わず、共通の言葉で語り合えるようになった。だから、この国の若者がヒップホップを受け入れたとき、スワヒリ語でラップするのは自然な流れの一つだった。

ただし、初期のヒップホップは英語で始まった。当時のヒップホップ界では「ラップは英語で」という見方が強かった。しかし1991年頃（1990〜92年とする見方もある）、Saleh JによるIce Ice Babyのスワヒリ語版が成功する。これ以降、スワヒリ語のラップが正当なものと認められ、スワヒリ語化が進んだ。1991年ごろ、Saleh Jはスワヒリ語による最初期のラップを録音した。1990年代前半に結成されたKwanza Unit(1993年とする見方が多い)のような集団も、英語で始めて、のちにスワヒリ語も使った。

ただ、当初は録音の環境も、流通の手段も乏しかった。

転機は1993〜94年だ。それまで放送は国営放送が独占していたが、1993年の放送法で民間の参入が認められた。1994年には、Radio Tumaini(宗教系・国内初の民間局)とRadio One(国内初の民間娯楽局)が開局した。若者向けの局が増えたのは1990年代末で、Clouds FMは1999年に開局した。

若い制作者が、自作を放送で流してもらう道が開けた。この分野は1990年代を通じて広がった。社会に受け入れられ、規模が大きくなったのは2000年代初頭以降である。

1990年代後半から2000年代前半にかけて、Professor JayやMr. IIといった演者が、汚職、感染症の予防といった主題を正面から扱った。この音楽は、社会に向けて発言する場として働いた。実際、Mr. IIは後に国会議員になっている。

一方、2000年代初頭に軽い主題の流れが現れ、2000年代後半には主流のポップへの変化が進んで、この音楽の性格は変わっていった。制作の質が上がり、映像の制作費も増えるにつれて、恋愛や華やかな暮らしを描く曲が増えていく。この変化には「社会批判が失われた」という批判もついて回ったが、社会派の流れも途絶えてはいない。

2000年代後半には、Ali Kibaのデビューアルバム『Cinderella』（2006年または2007年）が、2008年に東アフリカで最も売れたとされる。

2010年代には、Diamond Platnumzが自分のレーベルを立ち上げ、圧倒的な商業的成功を収めた。彼は、2017年にPatoranking、2018年にDavido、Flavour、P-Square、Teni、2022年にAdekunle Goldと共演した。こうした共演を通じて、タンザニアの音楽を西アフリカ中心のアフロビーツの流れと結びつけたと評される。さらに、Harmonize(2015年にDiamondのレーベルWCB Wasafiに加入)やZuchuらが注目を集め、今ではこの分野は東アフリカで大きな影響力を持っている。Harmonizeは2019年末にWCB Wasafiを離れ、Konde Music Worldwideを設立した。</p>
