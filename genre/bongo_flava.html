<h1>Bongo Flava（ボンゴ・フラヴァ）とは</h1>
<p>タンザニアで発達した、ヒップホップとリズム・アンド・ブルースを土台とする大衆音楽である。名称は最大都市ダルエスサラームを指す俗語と、風味を意味する英語を組み合わせた造語である。音の面ではアメリカのヒップホップの構造を基本としながら</p>
<p>タンザニアで発達した、ヒップホップとリズム・アンド・ブルースを土台とする大衆音楽である。名称は最大都市ダルエスサラームを指す俗語と、風味を意味する英語を組み合わせた造語である。音の面ではアメリカのヒップホップの構造を基本としながら、複数の要素が混ざる。旋律には東アフリカ沿岸の伝統的な歌の様式に由来する装飾的な節回しが入り込み、和声はリズム・アンド・ブルースの豊かな響きを用いる。リズムにはジャマイカのダンスホールの跳ねた刻みと、コンゴの音楽の細かい打楽器の層が加えられ、近年では西アフリカのアフロビーツの不均等な拍節も取り込まれている。テンポは概ね95から115 BPMで、低音は太く丸い電子音である。上物はギターの高音域での反復、電子鍵盤の和音、そして加工した声の断片が中心となる。歌とラップの境界は曖昧で、同じ演者が両方を行き来する。決定的に重要なのは言語で、英語ではなくスワヒリ語が用いられる。これはこの国の言語政策と直結した選択である。歌詞は当初、貧困、汚職、感染症といった社会問題を扱ったが、近年は恋愛と成功の誇示が中心となっている。</p>
<h2>成り立ち</h2><p>背景にあるのはタンザニアの言語政策である。独立後の初代大統領Julius Nyerereは、100を超える民族集団を統合するため、スワヒリ語を国語として徹底的に普及させた。この政策により、この国では出身民族を問わず共通の言語で語り合うことが可能となる。したがってこの国の若者がヒップホップを受容したとき、英語ではなくスワヒリ語でラップすることは、極めて自然な選択だった。1990年代前半、Saleh Jらがスワヒリ語による最初期のラップを試み、Kwanza Unitのような集団が続く。ただし当初は録音の環境も流通の手段も乏しかった。転機は1994年前後である。それまで国営放送が独占していた放送に民間の参入が認められ、若者向けのラジオ局が次々に開局した。若い制作者が自作を放送に乗せる回路が生まれたことで、この分野は一気に拡大する。1990年代末から2000年代前半にかけて、Professor JayやMr. IIといった演者が、汚職、失業、感染症の予防といった主題を正面から扱い、この音楽は社会的な発言の場として機能した。実際、Mr. IIは後に国会議員となっている。2000年代半ば以降、性格は変化した。制作の質が向上し、映像の制作費も増えるにつれ、内容は恋愛と華やかな生活の描写へ移っていく。この変化には、社会批判が失われたという批判が伴った。2010年代、Diamond Platnumzが自らのレーベルを構えて圧倒的な商業的成功を収め、国際的な作り手との共演を通じて、タンザニアの音楽を西アフリカ中心のアフロビーツの潮流と接続させた。Ali Kiba、Harmonize、Zuchuらが続き、現在この分野は東アフリカ最大の音楽産業となっている。</p>
<h2>代表曲</h2><ul><li>Salome (Diamond Platnumz)</li><li>Nenda Lote (Mr. II feat. Lady Jaydee)</li><li>Tetema (Diamond Platnumz feat. Rayvanny)</li></ul>
