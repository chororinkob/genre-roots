<h1>Vocal Trance（ヴォーカルトランス）とは</h1>
<p>ボーカル・トランスは、トランスの高揚する構造に、明確な旋律と物語を持つ歌を乗せた形式である。 中心になるのは、分厚いシンセサイザーの音だ。のこぎりの歯のような形の音の波を、いくつかわずかにずらして重ねてある。これが主旋律を担い、耳</p>
<p>ボーカル・トランスは、トランスの高揚する構造に、明確な旋律と物語を持つ歌を乗せた形式である。

中心になるのは、分厚いシンセサイザーの音だ。のこぎりの歯のような形の音の波を、いくつかわずかにずらして重ねてある。これが主旋律を担い、耳を突き抜けるような輝きを持つ。

和声は短調が中心で、長調は少数である。4コードのループがよく使われる。

リズムは、正確な四つ打ちのキックが土台になる。テンポは138前後が多い。その裏で、開いて余韻を残すハイハット（シンバルの一種）が8分音符で鳴り、疾走感を作る。

歌は多くは女性ボーカルで、伸びやかで透明な声質が好まれる。歌詞は恋愛・希望・感情の高まりなどを扱うことが多い。

構成は、ブレイクダウン→ビルドアップ→クライマックスという展開が典型的である。まず導入で打楽器だけが示され、要素が積み上がっていく。次に全てのリズムが消え、和音がじゅうたんのように敷かれた上に、歌だけが残る静かな区間へ移る。この区間で、歌が最も情感を込めて歌われる。そこから小太鼓の連打が徐々に速度を上げ、緊張を極限まで高める。最後に全ての要素が同時に爆発する。この設計は定型的だと批判されることもあるが、聴き手はその瞬間のために数分を待つ。</p>
<h2>成り立ち</h2><p>1980年代末から1990年代初頭、ドイツのフランクフルト周辺に、テクノやEBMと呼ばれる電子音楽の場があった。ここから生まれたとされるトランスは、当初は器楽中心の反復的な音楽だった。

1990年代初頭からボーカル入りの作品はあったが、1990年代末のDelerium『Silence』などで、ポップな歌ものとして広く普及した。1997年、カナダのDeleriumがSarah McLachlanを迎えてアルバムで発表した楽曲は、1999年にシングルとして発売された。複数のトランス制作者による作り替えを通じて、世界的な現象となり、歌とトランスの結合が持つ力を証明したと評される。

同じ時期、旋律を前面に出した作品で、ドイツのATBは1999年に、イギリスのChicaneは2000年に、それぞれ全英チャートの1位を獲得する。1990年代末から2000年代前半が、トランス全体の最盛期とされる。

2001年、オランダのArmin van Buurenが、自らのラジオ番組を始めた。毎週2時間にわたって世界中の新曲を紹介するこの番組は、以後20年以上、この分野の情報の中枢となったと評される。同じオランダのTiëstoは、大規模な単独公演を成功させ、2004年にはオリンピックの開会式で演奏するという前例のない事態に至る。ドイツのPaul van Dykは、アップリフティングおよびプログレッシブ・トランスを軸に、メロディックな作風を示した。イギリスではAbove &amp; Beyondが自らのレーベルを構えた。彼らは、歌詞の内容と感情の設計に強くこだわった作品群を発表し、熱心な聴衆との強い結びつきを築いたと評される。

一方で、構成が定型的だとの批判がある(例:Sven Väth)。2010年代初頭には、EDMの主流がビッグルームやエレクトロ・ハウスに移り、トランスは相対的に存在感を下げた（ただし人気は継続）。しかし熱心な聴き手は途切れず、大規模な祭典において、感情を共有する時間帯を担う音楽として現在も機能している。</p>
