<h1>Vocal Trance（ヴォーカルトランス）とは</h1>
<p>トランスの高揚する構造に、明確な旋律と物語を持つ歌を乗せた形式である。テンポは概ね132から140 BPM、キックは正確な四つ打ちを刻み、その裏で開いたハイハットが8分音符を鳴らして疾走感を作る。中核となるのは複数の鋸歯状の波形を</p>
<p>トランスの高揚する構造に、明確な旋律と物語を持つ歌を乗せた形式である。テンポは概ね132から140 BPM、キックは正確な四つ打ちを刻み、その裏で開いたハイハットが8分音符を鳴らして疾走感を作る。中核となるのは複数の鋸歯状の波形をわずかにずらして重ねた分厚いシンセの音で、これが主旋律を担い、耳を突き抜けるような輝きを持つ。構成には極めて厳格な定型がある。導入で打楽器だけが提示され、要素が積み上がり、次に全てのリズムが消えて和音の敷物と歌だけが残る静かな区間へ移る。この区間で歌が最も情感を込めて歌われ、そこから小太鼓の連打が徐々に速度を上げながら緊張を極限まで高め、最後に全ての要素が同時に爆発する。この、落として上げて解放するという設計こそが全てであり、聴き手はその瞬間のために数分を待つ。和声は明るい長調、あるいは希望を含んだ短調で、四つの和音を循環させる進行が用いられる。歌はほとんどが女性で、伸びやかで透明な声質が好まれる。歌詞は喪失からの再生、遠く離れた相手への想い、夜明け、飛翔といった、抽象的で普遍的な主題を扱う。</p>
<h2>成り立ち</h2><p>1990年代半ば、ドイツのフランクフルト周辺で確立したトランスは、当初は器楽中心の反復的な音楽だった。しかし1990年代後半、この構造に歌を乗せることで、より広い聴衆へ届く可能性が明らかになる。1999年、カナダのDeleriumがSarah McLachlanを迎えて発表した楽曲は、当初はさほど注目されなかったが、複数のトランス制作者による作り替えを通じて世界的な現象となり、歌とトランスの結合が持つ力を証明した。同時期、イギリスのChicaneやドイツのATBが、旋律を前面に出した作品でチャートを制する。2000年代前半がこの分野の黄金期である。オランダのArmin van Buurenは2001年に自らのラジオ番組を開始し、毎週2時間にわたって世界中の新曲を紹介するこの番組は、以後20年以上にわたってこの分野の情報の中枢となった。同じオランダのTiëstoは大規模な単独公演を成功させ、2004年にはオリンピックの開会式で演奏するという前例のない事態に至る。ドイツのPaul van Dykは、より硬質で音楽的に緻密な方向を示した。イギリスではAbove &amp; Beyondが自らのレーベルを構え、歌詞の内容と感情の設計に強くこだわった作品群を発表し、熱心な聴衆との強い結びつきを築いた。この分野に対する批判は一貫している。すなわち、構成が完全に定型化しており、どの曲も同じ順序で同じ感情を引き起こすように作られているという指摘、そして感傷的に過ぎるという指摘である。実際、2008年前後には流行としての勢いを失い、より攻撃的な音や、ゆったりしたハウスへ主流が移った。しかし熱心な聴き手は途切れず、大規模な祭典において、感情を共有する時間帯を担う音楽として現在も機能している。</p>
