<h1>Electro Swing（エレクトロスウィング）とは</h1>
<p>エレクトロスウィングは、1920〜40年代に録音されたスウィング・ジャズやヴィンテージ・ポップスの音源を素材に、ハウスやEDMのビートで組み直したダンス・ミュージックだ。拍子は4分の4拍子が基本で、テンポはおおむね毎分100〜13</p>
<p>エレクトロスウィングは、1920〜40年代に録音されたスウィング・ジャズやヴィンテージ・ポップスの音源を素材に、ハウスやEDMのビートで組み直したダンス・ミュージックだ。拍子は4分の4拍子が基本で、テンポはおおむね毎分100〜130拍。4つ打ちのキックの上に、8分音符を裏へずらしたスウィング（シャッフル）感のあるハイハットやウッドブロック、2拍目と4拍目を打つスネアが重なる。和声はスウィング期の定型をそのまま借り、循環コード、12小節のブルース進行、短調の下降ライン、ドミナント・セブンスを連ねたターンアラウンドが頻出する。コードを担うのはピアノ、ヴィンテージ・オルガン、バンジョー、マンドリン、そしてエレクトロなシンセ・パッドだ。メロディーはトランペット、トロンボーン、クラリネット、サックスのユニゾン・リフ、あるいは古い録音から切り出した鼻歌めいたフレーズが主役になる。ヴォーカルは女性シンガーが多く、1920〜30年代風の朗々とした歌い回しとスキャット、ときにはラップが乗る。音響面ではSP盤のクラックルノイズを残したまま、サイドチェイン・コンプレッションでベースを沈み込ませ、フィルター・スウィープとディレイで管のリフを浮かせ、ブレイクの直前にビルドアップを置いてドロップへ落とすEDM的な構成をとる。歌詞は禁酒法時代の酒場、享楽的な夜、ダンス、粋な恋愛やギャンブルを扱う。スウィング・ジャズのように即興の応酬を聴かせるのではなく、DJと生楽器の混成でフロアを踊らせることが目的だ。ハウスとの違いは、4つ打ちの上にスウィングした8分音符とビッグバンド的なブラスが乗る点、ニュー・ジャズとの違いは、即興性よりもサンプリングと反復のグルーヴを優先する点にある。実際に鳴る場所はクラブのフロア、スピークイージー風のパーティー、ヴィンテージ・バー、野外フェス、そしてリンディホップやチャールストンを踊るダンス・ワークショップである。</p>
<h2>成り立ち</h2><p>エレクトロスウィングの芽は1990年代初頭、ヨーロッパとアメリカのクラブ・シーンに現れた。初期の代表例がオランダのプロデュース・デュオ、フェリー・リデルホフとペーター・ガルネフスキによるDoopである。2人は1994年2月にシングル「Doop」を発表し、1920年代のチャールストンを取り込んだ速いビッグバンドのサンプルの上で「ドゥープ」という語だけをスキャットする構成でイギリス・チャート1位を獲り、アメリカではデヴィッド・モラレスによるリミックスも出た。同じ時期、ニュー・ジャズやビッグ・ビートの周辺で、古いスウィング音源をダンス・ビートに載せる試みが各地で始まる。2000年代に入るとウィーン、パリ、ロンドン、ロサンゼルスに専業の作り手が現れる。オーストリアのマルクス・フューレダーはパロフ・ステラ名義で活動し、2003年に自作レーベルのエタージュ・ノワール・レコーディングスを設立、2008年のEP『Libella Swing』、2009年の「Catgroove」、2012年のアルバム『The Princess』に収めた「Booty Swing」「All Night」で、ビッグバンドの管と強力な4つ打ちを接合する型を確立した。パリでは2008年にキャラバン・パレスが結成され、同年のデビュー作と「Jolie Coquine」、2015年の「Lone Digger」を収めたアルバム『Robot Face』がアメリカのダンス・チャート3位に入る。ロンドンでは、フレッシュリー・スクイーズド・ミュージックを主宰するニック・ハリウッドが2009年に2枚組コンピレーション『White Mink : Black Cotton（Electro Swing vs Speakeasy Jazz）』を編み、自らのインタビューでこの作品を「イギリスでElectro Swingという語を使った最初のアルバム」と述べている。同レーベルは2009年からスピークイージー形式のクラブイベントWhite Mink LIVEを続け、その紹介文ではミックスマグ誌の言葉として「エレクトロスウィング最初の画期的瞬間」と記される。2010年前後には、セルビアのグラモフォンジーがペギー・リーの1942年の録音を切った「Why Don't You」を、オーストラリアのヨランダ・ビー・クールとDCUPがレナート・カロゾーネの1956年のナポリ語曲を切った「We No Speak Americano」を発表し、後者は500万枚以上を売ってビルボードのHot 100で29位に入った。2014年にはスウェーデンのアーロンチュパの「I'm an Albatraoz」がスウェーデンとデンマークで1位を獲る。フランスではワグラム・ミュージックからバート&amp;ベイカーが編むコンピレーション・シリーズが2000年代末から続き、イタリアのスウィングロワーズ、スウェーデンのモビッツ!、ベルギーのブギ・ベルジック、アイルランドのコルマック、フランスのチャイニーズ・マン、ドイツ語圏のデラダップなど、各地のバンドがダンス・ミュージックとしてのスウィングを持ち寄った。綺麗事ばかりではない。イギリスでは1990年代に別系統のハウス・ミュージックを「スウィング・ハウス」と呼んでいた時期があり、語の重複が混乱を招いた。ジャズの純粋主義者からは「名盤を安易に切り刻んでいる」という批判が繰り返され、権利処理の面倒さから公式リリースに至らない曲も多い。英語版ウィキペディアは、デラダップの「Crazy Swing」について、主張されていた最古のリリース年である2011年より前にDJが再生していた様子を収めた携帯電話の動画が見つかったため、ある賞の候補から失格になったと記録している。2010年代半ば以降はフェスの出演や配信プレイリスト、広告や劇伴での使用で生き延びる一方、EDMの主流からは距離を置く形になった。日本ではアニメ、ボカロ、J-POP、レトロ趣味やVR文化の交差点で育ち、2019年6月には一般社団法人日本エレクトロスウィング協会（Electro Swing Japan）が設立されて、東京を拠点にDJショーやイベントを続けている。ドイツのエレクトロ・スウィング・シングはレビュー、インタビュー、24時間のネットラジオを運営し、1500曲以上を配信して現在の受け皿になっている。</p>
