<h1>Electro Swing（エレクトロスウィング）とは</h1>
<p>エレクトロスウィングは、1920〜40年代に録音されたスウィング・ジャズや昔のポップスの音源を素材に、ハウスやEDMのビートで組み直したダンス・ミュージックだ。拍子は4分の4拍子が基本で、テンポはおおむね毎分110〜130拍。4つ</p>
<p>エレクトロスウィングは、1920〜40年代に録音されたスウィング・ジャズや昔のポップスの音源を素材に、ハウスやEDMのビートで組み直したダンス・ミュージックだ。拍子は4分の4拍子が基本で、テンポはおおむね毎分110〜130拍。4つ打ちのキックの上に、8分音符を裏へずらしたスウィング（シャッフル＝跳ねるリズム）感のあるハイハット（シンバルを重ねた装置）やウッドブロック、2拍目と4拍目を打つスネアが重なる。和声はスウィング期の定型をそのまま借り、循環コード（同じ和音の流れをくり返す形）、12小節のブルース進行、短調の下降ライン、ドミナント・セブンス（緊張感のある四和音）を連ねたターンアラウンド（曲の終わりで冒頭へ戻るための和音の流れ）が頻出する。コードを担うのはピアノ、ヴィンテージ・オルガン、バンジョー、マンドリン、そしてエレクトロなシンセ・パッドだ。メロディーはトランペット、トロンボーン、クラリネット、サックスのユニゾン（同じ旋律を一斉に演奏すること）・リフ、あるいは古い録音から切り出した鼻歌めいたフレーズが主役になる。ヴォーカルは女性シンガーが多く、1920〜30年代風の朗々とした歌い回しとスキャット（意味のない声で歌う唱法）、ときにはラップが乗る。音響面ではSP盤（昔のレコード）のクラックルノイズ（パチパチという雑音）を残したまま、サイドチェイン・コンプレッション（別の音に合わせて音量を自動で下げる処理）でベースを沈み込ませ、フィルター・スウィープ（音の帯域をなめらかに動かす効果）とディレイで管のリフを浮かせ、ブレイクの直前にビルドアップ（徐々に盛り上げる部分）を置いてドロップ（山場で一気に爆発する部分）へ落とすEDM的な構成をとる。歌詞は禁酒法時代の酒場、享楽的な夜、ダンス、粋な恋愛やギャンブルを扱う。スウィング・ジャズのように即興の応酬を聴かせるのではなく、DJと生楽器の混成でフロアを踊らせることが目的だ。ハウスとの違いは、4つ打ちの上にスウィングした8分音符とビッグバンド的なブラスが乗る点、ニュー・ジャズとの違いは、即興性よりもサンプリングと反復のノリを優先する点にある。実際に鳴る場所はクラブのフロア、スピークイージー（禁酒法時代の隠れ酒場）風のパーティー、ヴィンテージ・バー、野外フェス、そしてリンディホップやチャールストンを踊るダンス・ワークショップである。</p>
<h2>成り立ち</h2><p>エレクトロスウィングの芽は1990年代初頭、ヨーロッパとアメリカのクラブの世界に現れた。しばしば初期例に挙げられるのがオランダのプロデュース・デュオ、フェリー・リデルホフとペーター・ガルネフスキによるDoopである。2人は1994年2月にシングル「Doop」を発表し、1920年代のチャールストンを取り込んだ速いビッグバンドのサンプルの上で「ドゥープ」という語だけをスキャットする構成でイギリス・チャート1位を獲り、アメリカではデヴィッド・モラレスによるリミックス（別の人が作り直した版）も出た。Doopのような初期の試みは、同時代にはニュー・ジャズの一部とみなされ、こうした原型は1990年代末にいったん途絶えた。2000年代に入るとウィーン周辺、パリ、ロンドンなどに専業の作り手が現れる。オーストリアのマルクス・フューレダーはパロフ・ステラ名義で活動し、2003年に自作レーベルのエタージュ・ノワール・レコーディングスを設立、2008年のEP『Libella Swing』、2009年の「Catgroove」、2012年のアルバム『The Princess』に収めた「Booty Swing」「All Night」で、ビッグバンドの管と強力な4つ打ちを接合する型を確立した。パリでは、2005年に結成され2008年にデビューしたとされるキャラバン・パレスが、2008年のデビュー作と「Jolie Coquine」、2015年の「Lone Digger」を収めたアルバム『Robot Face』がアメリカのダンス・チャート3位に入る。ロンドンでは、フレッシュリー・スクイーズド・ミュージックを主宰するニック・ハリウッドが2009年に2枚組コンピレーション（複数の歌手の曲を集めたアルバム）『White Mink : Black Cotton（Electro Swing vs Speakeasy Jazz）』を編み、自らのインタビューでこの作品を「イギリスでElectro Swingという語を使った最初のアルバム」と述べている。同レーベルは2009年からスピークイージー（禁酒法時代の隠れ酒場）形式のクラブイベントWhite Mink LIVEを続け、このシリーズの紹介文ではミックスマグ誌の言葉として「エレクトロスウィング最初の画期的瞬間」と記される。2010年前後には、セルビアのグラモフォンジーがペギー・リーの1942年の録音を切った「Why Don't You」を、オーストラリアのヨランダ・ビー・クールとDCUPがレナート・カロゾーネの1956年のナポリ語曲を切った「We No Speak Americano」を発表し、後者は500万枚以上を売ってビルボードのHot 100で29位に入った。2014年にはスウェーデンのアーロンチュパの「I'm an Albatraoz」がスウェーデンとデンマークで1位を獲る。フランスではワグラム・ミュージックからバート&amp;ベイカーが編むコンピレーション・シリーズが2000年代末から続き、イタリアのスウィングロワーズ、スウェーデンのモビッツ!、ベルギーのブギ・ベルジック、アイルランドのコルマック、フランスのチャイニーズ・マン、ドイツ語圏のデラダップなど、各地のバンドがダンス・ミュージックとしてのスウィングを持ち寄った。綺麗事ばかりではない。「Electro Swing」という名称は、たいてい1920年代のチャールストン時代の音楽をサンプリングしていて実際にはスウィングしていない、という語義への批判もある。デラダップの「Crazy Swing」は、主張されていた最古のリリース年である2011年より前にDJが再生していた様子を収めた携帯電話の動画が見つかったため、2012年のユーロビジョンのオーストリア国内予選で選ばれながら失格になったと記録されている。2010年代半ば以降はフェスの出演や配信プレイリスト、広告や劇伴（映像作品の背景音楽）での使用で生き延びる一方、EDMの主流からは距離を置く形になった。日本では、2015年に設立された日本エレクトロスウィング協会（Electro Swing Japan）が2019年6月に一般社団法人として法人化され、東京を拠点にDJショーやイベントを続けている。ドイツのエレクトロ・スウィング・シングはレビュー、インタビュー、24時間のネットラジオを運営し、1500曲以上を配信して現在の受け皿になっている。</p>
