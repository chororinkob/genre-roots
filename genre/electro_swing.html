<h1>Electro Swing（エレクトロスウィング）とは</h1>
<p>エレクトロスウィングは、ヴィンテージまたは現代のスウィングやジャズに、ハウスやヒップホップ等のビートを組み合わせたダンス・ミュージックだ。 コードを担うのは、ピアノ、ヴィンテージ・オルガン、バンジョー、マンドリン、そしてエレクトロ</p>
<p>エレクトロスウィングは、ヴィンテージまたは現代のスウィングやジャズに、ハウスやヒップホップ等のビートを組み合わせたダンス・ミュージックだ。

コードを担うのは、ピアノ、ヴィンテージ・オルガン、バンジョー、マンドリン、そしてエレクトロなシンセ・パッドだ。メロディーの主役は、トランペット、トロンボーン、クラリネット、サックスのユニゾン（同じ旋律を一斉に演奏すること）・リフである。古い録音から切り出した、鼻歌めいたフレーズが主役になることもある。

和声は、スウィング期の定型をそのまま借りている。循環コード（同じ和音の流れをくり返す形）、12小節のブルース進行、短調の下降ラインがよく出てくる。ドミナント・セブンス（緊張感のある四和音）を連ねたターンアラウンド（曲の終わりで冒頭へ戻るための和音の流れ）も頻出する。

拍子は4分の4拍子が基本で、テンポはおおむね90〜130 BPM前後。4つ打ちのキックの上に、ハイハット（シンバルを重ねた装置）やウッドブロックが重なる。その刻みは、8分音符を裏へずらしたスウィング（シャッフル＝跳ねるリズム）感のあるものだ。さらに、2拍目と4拍目をスネアが打つ。

ヴォーカルは女性シンガーが多い傾向がある。1920〜30年代風の朗々とした歌い回しやスキャット（意味のない声で歌う唱法）に加え、ときにはラップも乗る。歌詞は、禁酒法時代の酒場、享楽的な夜、ダンス、粋な恋愛やギャンブルを扱うことが多い。

音作りでは、SP盤（昔のレコード）のクラックルノイズ（パチパチという雑音）を残したままにする。サイドチェイン・コンプレッション（別の音に合わせて音量を自動で下げる処理）でベースを沈み込ませ、フィルター・スウィープ（音の帯域をなめらかに動かす効果）とディレイで管のリフを浮かせる。曲の組み立てはEDM的で、ブレイクの後にビルドアップ（徐々に盛り上げる部分）を積み、ドロップ（山場で一気に爆発する部分）へ落とす。

目的は、スウィング・ジャズのように即興の応酬を聴かせることではない。DJと生楽器の混成で、フロアを踊らせることだ。ハウスとの違いは、4つ打ちの上にスウィングした8分音符とビッグバンド的なブラスが乗る点にある。ニュー・ジャズとの違いは、即興性よりもサンプリングと反復のノリを優先する点だ。

実際に鳴る場所は、クラブのフロア、スピークイージー（禁酒法時代の隠れ酒場）風のパーティー、ヴィンテージ・バー、野外フェスである。リンディホップやチャールストンを踊るダンス・ワークショップでも鳴っている。</p>
<h2>成り立ち</h2><p>1990年代初頭、ヨーロッパとアメリカのクラブの世界に、エレクトロスウィングの芽が現れた。初期の例としてよく挙げられるのが、オランダのプロデュース・デュオ、フェリー・リデルホフとペーター・ガルネフスキによるDoopである。

2人は1994年2月にシングル「Doop」を発表した。チャールストン風のビッグバンド演奏(新規録音とする説が有力)をハウスのトラックに載せ、その上でDoop(Doopi)という音節だけを歌う構成だった。この曲はイギリス・チャート1位を獲り、アメリカではデヴィッド・モラレスによるリミックス（別の人が作り直した版）も出た。

ただし、初期の作品はスウィング・ハウスやニュー・ジャズとして扱われ、エレクトロスウィングとは呼ばれていなかった。1990年代末に人気を得たスウィング・ハウスも、2000年代初頭には下火になった。

2000年代に入ると、ウィーン周辺、パリ、ロンドンなどに専業の作り手が現れる。オーストリアのマルクス・フューレダーは、パロフ・ステラ名義で活動した。2003年(2004年とも)には、自作レーベルのエタージュ・ノワール・レコーディングスを設立している。作品には、2008年のEP『Libella Swing』や、2009年の「Catgroove」がある。「Booty Swing」は2010年のEP『The Paris Swing Box』が初出で、2012年の『The Princess』にも収録された。これらの曲と、同じく『The Princess』に収めた「All Night」で、彼はビッグバンドの管と強力な4つ打ちをつなぐ型を固めたとされる。

パリでは、2005年に結成され2008年にデビューしたとされるキャラバン・パレスが、2008年10月20日にデビュー作『Caravan Palace』を出した。先行シングルは「Jolie Coquine」である。2015年には第3作『Robot Face』が出た。「Lone Digger」はその収録曲で、このアルバムはBillboardのTop Dance/Electronic Albums（アルバム・チャート）で3位になった。

ロンドンでは、フレッシュリー・スクイーズド・ミュージックを主宰するニック・ハリウッドが、2009年に2枚組コンピレーション（複数の歌手の曲を集めたアルバム）『White Mink : Black Cotton（Electro Swing vs Speakeasy Jazz）』を編んだ。彼は自らのインタビューで、この作品を「イギリスでElectro Swingという語を使った最初のアルバム」と述べている。同レーベルは2009年にクラブ企画を始め、スピークイージー（禁酒法時代の隠れ酒場）形式のクラブイベントWhite Mink LIVEを続けた。White Mink名義の初イベントは2010年である。『White Mink : Black Cotton』シリーズの紹介文には、ミックスマグ誌の言葉として「エレクトロスウィング最初の画期的瞬間」と記されている。

2010年前後には、セルビアのグラモフォンジーが「Why Don't You」を発表した。ベニー・グッドマン楽団とペギー・リーの1942年録音を切った曲だ。同じころ、オーストラリアのヨランダ・ビー・クールとDCUPは、レナート・カロゾーネの1956年のナポリ語曲を切った「We No Speak Americano」を発表した。この曲は米国で100万枚以上のデジタル販売（RIAAプラチナ）を記録し、ビルボードのHot 100で最高29位に入った。2014年には、スウェーデンのアーロンチュパの「I'm an Albatraoz」が、スウェーデンとデンマークで1位を獲った。

フランスでは、ワグラム・ミュージックからバート&amp;ベイカーが編むコンピレーション・シリーズが、2000年代末から続いた。イタリアのスウィングロワーズ、スウェーデンのモビッツ!、ベルギーのブギ・ベルジック、アイルランドのコルマック、ドイツ語圏のデラダップなど、各地のバンドがダンス・ミュージックとしてのスウィングを持ち寄った。フランスのチャイニーズ・マンは、ジャンル周辺のアーティストに位置づけられる。

綺麗事ばかりではない。一部のダンサーからは、ビートがLindy HopよりCharlestonに合うという声もある。デラダップの「Crazy Swing」は、2012年のユーロビジョンのオーストリア国内予選で選ばれた。しかし、2011年9月1日の基準日より前（同年8月19日）に、オデッサのクラブで同曲の試作版を公開演奏していたことが私的な動画で発覚し、2012年1月末に失格になった。

2010年代半ば以降は、フェスの出演や配信プレイリスト、広告や劇伴（映像作品の背景音楽）での使用で生き延びたとされる。その一方で、EDMの主流からは距離を置く形になったとも言われる。

日本では、2015年に日本エレクトロスウィング協会（Electro Swing Japan）が設立され、2019年6月に一般社団法人として法人化された。東京を拠点に、DJショーやイベントを続けている。ドイツのエレクトロ・スウィング・シングは、レビュー、インタビュー、24時間のネットラジオを運営している。1500曲以上を配信し、現在の受け皿になっている。</p>
