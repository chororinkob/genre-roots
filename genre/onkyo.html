<h1>Onkyo（オンキョー）とは</h1>
<p>音をメロディの材料ではなく、空気の振動そのものとして聴かせる即興音楽だ。代表曲22曲を動画で聴け、ルーツと影響のつながりを地図でたどれる。</p>
<p>音をメロディの材料ではなく、空気の振動そのものとして聴かせる即興音楽だ。音量は極端に小さく、無音と紙一重のところで演奏が進む。50人も入れば満杯になる小部屋で、かすかな音が立ち上がる瞬間を皆で待つ音楽である。

中心になるのは、普通の楽器ではない。中村としまるはノー・インプット・ミキシング・ボードを使う。入力に何もつながないミキサー自身の帰還音を、音源にも増幅にも使う。サチコ・Mはサンプラーを空のまま動かし、正弦波だけを出す。秋山徹次はリゾネーター・ギターの弦を日本刀の刀身でこすり、うなりを引き出す。杉本拓はアコースティック・ギターの1音を、何十秒も間を置いて置いていく。

和音も音階も旋律も、ほとんど出てこない。サチコ・Mの正弦波と中村の帰還音が重なると、2つの周波数の差で「うなり」が生まれ、それが和音の代わりになる。音程は意図的に合わせない。合わない2音がぶつかる場所にだけ、聴くべきものが現れる。

リズムはない。拍子は決まらず、ドラムもパルスも刻まれない。テンポという言葉が意味を失うほど遅く、1つの音と次の音の間が何十秒も空くことがある。アクセントを奏者が置くのではなく、部屋の空調や遠くの車の音が置いていく。

歌も、この音楽では楽器に近い。アミ・ヨシダは言葉にならない息や裏声、かすれた声を、微細な音の粒として出す。歌詞は存在しない。言葉の意味を伝えるのではなく、声帯が震えるかすかなノイズを聴かせる。

曲の組み立ては、展開しない。盛り上がりも、サビも、終止もない。1曲が30分を超えることも珍しくない。聴きどころは、音が立ち上がる瞬間と、消えていく余韻、そして演奏が止まったあとに残る部屋の音そのものだ。

同じ即興でも、フリー・ジャズとは違う。フリー・ジャズがフレーズで会話するのに対し、こちらは音を1つ置いて待つ。ジャパニーズ・ノイズとも逆で、音量を上げずに同じ強度を出そうとする。ロウアーケースと呼ばれる静かな電子音の流れとも重なる。

実際に鳴っているのは、オフサイトのような小さな会場、ギャラリー、レコード店の片隅だ。客は息を殺して座り、椅子のきしみや咳すら音の一部になる。家でヘッドホンを付け、音量を限界まで下げて聴くのも、この音楽の正しい聴き方の1つである。</p>
<h2>成り立ち</h2><p>1990年代末の東京で、爆音の裏側からこの音楽は始まった。大友良英はノイズ・ロック・バンドのGROUND ZEROを率い、ターンテーブルとギターで音を切り刻んでいた。バンドが1998年に解散すると、彼はサチコ・MとFilamentを結成し、機材の出すかすかな電流音だけを使う即興へ向かう。同じ年、杉本拓はソロ作『Opposite』を発表し、国外の即興ファンに名前を知られた。爆音の世代が、急に音量を下げ始めたのだ。

場も動いた。1998年10月、秋山徹次、杉本拓、中村としまるの3人が、渋谷のバー青山で即興の集会を始める。この集会はやがてオフサイトへ移り、「Meeting at Off Site」として毎月開かれるようになった。オフサイトは2000年から2005年まで、代々木駅の近くにあった。伊藤篤宏と妻のユカリが古い家を借り、1階を50人収容のギャラリー、2階をカフェと書籍・レコード店に改造した空間である。

オフサイトは静かだった。近隣からの苦情や行政の目もあり、大きな音は出しにくい。ただし静けさへの傾きは、規制がなくてもすでに始まっていた。演奏者は音量を下げ、ハウリングすれすれの音、ミキサーの帰還音、弦をこするかすかな音だけを鳴らす。客は50人まで。誰かが動けば音が消える、そんな密度の部屋になった。

録音が世界へ運んだ。アメリカのレーベル、エルストワイルは2001年に中村とサチコ・Mの『do』、キース・ロウとの『Weather Sky』を出し、2002年にコスモス『Tears』、2004年に3人の『Good Morning Good Night』を続けた。日本側ではサチコ・Mが主宰するアモエビックから『Sine Wave Solo』（1999年）、中村の『No-Input Mixing Board』（2000年）、Filament『29092000』（2001年）、杉本の『tori』（2001年）、中村『Vehicle』（2002年）、秋山『Résophonie』（2002年）が並ぶ。日本盤と海外盤がほぼ同時に動いた点が、この scene の特徴だ。

記録と発信を支えたのも個人だった。鈴木佳之が運営する「Improvised Music from Japan」は、音源と情報を英語で国外へ流した。2001年の10枚組コンピレーション『Improvised Music From Japan』は、この世代の音をまとめて世界に提示している。同じ時期、トシヤ・ツノダは『Extract From Field Recording Archive』（1997年から2001年）で、屋外の定在波や空洞の共鳴を録る仕事を進めた。音楽か環境音かを問わない姿勢が、この流れのもう一方の端にある。

名前は外から付いた。西東京のレコード店「パリ・ペキン」で、分類できないミニマルな電子録音を指して「音響派」と呼んだのが始まりとされる。海外の批評家はこの言葉を「Onkyo」として使ったが、演奏者たちは自分たちの音楽をそう呼ぶことを好まなかった。音楽学者のデヴィッド・ノヴァクは2010年の論文「Playing Off Site: The Untranslation of Onkyo」で、この名前が翻訳されるうちに意味がずれていく過程を分析している。海外が「日本の新しい音楽」として消費したがったことに対し、当人たちは自覚的に日本的なものを指向していなかった、というねじれも指摘された。

オフサイトは2005年に閉じた。部屋がなくなっても、音は残った。エレクトロアコースティック・インプロヴィゼーション（EAI）と呼ばれる国際的な流れの中に、この静けさは組み込まれている。杉本拓は番号を振った即興のアルバムを続け、2024年には佐伯美波との『two to you too』を出した。大友良英は2024年に『Hummingbird and Four Flowers』を発表している。音響派という言葉自体も生き延びた。2022年には飛騨高山で飛騨音響派が結成され、山の中で即興を続けている。</p>
