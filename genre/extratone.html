<h1>Extratone（エクストラトーン）とは</h1>
<p>1分あたり1000拍を超える速度を持つ、ハードコアテクノの行き着く果て。人間の耳は、クリックの連続が毎秒約40回を超えると個々の打撃として聞き分けにくくなり、連続した音として知覚する(明瞭な音の高さが現れるのは毎秒43〜86回の間</p>
<p>1分あたり1000拍を超える速度を持つ、ハードコアテクノの行き着く果て。人間の耳は、クリックの連続が毎秒約40回を超えると個々の打撃として聞き分けにくくなり、連続した音として知覚する(明瞭な音の高さが現れるのは毎秒43〜86回の間)。1000BPMは毎秒約16.7拍だが、16分音符でキックを並べると毎秒約67回になる。エクストラトーンはまさにこの境界の向こう側にあり、バスドラムの連打がリズムであることをやめ、うなるような持続音そのものへ変質する点にジャンルの定義がある。BPMは1000前後から、ときに10,000に達するまで幅があり、キックの音の高さを変えることでメロディーを演奏する手法がとられることも多い。音作りは、ディストーションとクリッピングで潰しきったキックを、制作ソフト上でサンプル単位に詰め込んで生成するのが基本で、結果として出てくるのは、工場の機械の動く音、電動工具、あるいはノイズミュージックに近い連続的な轟音である。曲の長さは数十秒から数分と短いものが多く、途中に無音の切れ目や急な速さの変化を挟んで、曲の形を作る。上物にはアニメやゲームの音声、絶叫、アシッド由来の303、断片的な旋律が置かれる。600〜1000BPM程度のスプリッターコアがまだ打撃を数えられる段階にあるのに対し、エクストラトーンはそれを越えて音色へ転化した領域を指す。速度の限界を試す実験や、その極端さを共有する遊びとして作られるものもある一方、本質的にはダンスミュージックだと見る論者もいる。</p>
<h2>成り立ち</h2><p>1990年代のガバとハードコアテクノが加速を続けた先に生まれた。オランダ発祥のガバは通常140〜190BPM、ハードコアテクノ全体では160〜200BPM以上に達した。そこからさらに押し上げたスピードコア(起源は1992〜93年ごろ)が現れ、300〜600BPMの領域が開拓される。ドイツのMartin Damm(The Speed Freak)やNoize Creator、日本のm1dy(1998年から活動)といった作り手が、この速度帯を代表する存在となった。1998年には、ベルギーのEinrich 3600 BPMがオシロスコープでキックを発生させる手法を使い始め、愛好者たちは彼をこのジャンルの創始者とみなしている。1993年に発売されたMobyの「Thousand」(1992年録音)も約1,015BPMでギネスに載った。市販の制作ソフトの設定にも上限があり、Abletonは20〜999BPMまで、FL Studioは現行版で522BPMまでである。この条件のもとで、600〜1000BPMを扱うスプリッターコアと、それを越えたエクストラトーンという区分が、シーンの内部から自然に生まれた。フランスではLa Peste(本名Laurent Mialon)が1998年に作ったレーベルHangars Liquidesが、拍をばらばらにして、粒のような音へ向かうフラッシュコアを展開し、極端な速度と実験音楽を接続する道筋を示した。2012年に設立されたドイツのSpeedcore Worldwideのようなネットレーベルは、無料配布を前提に大量の音源を放流し、シーンの中心を実店舗や大型イベントではなくインターネットへ移した。2010年代以降はSoundCloudやBandcamp、そして動画サイトが主戦場となり、世界最速の曲を競う遊びが、音楽的な達成とネタの境界をまたぐ形で続いている。実際にフロアで踊られる機会は限られており、日本の速度志向のハードコア、東欧のノイズ寄りの作り手、そしてブレイクコアの周辺と人材が重なりながら、少数の熱心な仲間うちで受け継がれている。</p>
