<h1>Extratone（エクストラトーン）とは</h1>
<p>1分あたり1000拍を超える速度を持つ、ハードコアテクノの極北。人間の耳は毎秒20回程度を超える繰り返しを個々の打撃として聞き分けられず、連続した音高として知覚する。エクストラトーンはまさにこの境界の向こう側にあり、バスドラムの連</p>
<p>1分あたり1000拍を超える速度を持つ、ハードコアテクノの極北。人間の耳は毎秒20回程度を超える繰り返しを個々の打撃として聞き分けられず、連続した音高として知覚する。エクストラトーンはまさにこの境界の向こう側にあり、バスドラムの連打がリズムであることをやめ、うなるような持続音そのものへ変質する点にジャンルの定義がある。BPMは1000から数万まで幅があり、キックの音程を変えることで旋律を演奏する手法がとられることも多い。音作りは、ディストーションとクリッピングで潰しきったキックを、制作ソフト上でサンプル単位に詰め込んで生成するのが基本で、結果として出てくるのは工業機械の駆動音、電動工具、あるいはノイズミュージックに近い連続的な轟音である。曲の長さは数十秒から数分と短いものが多く、途中に無音の断絶や急激な速度変化を挟んで構造を作る。上物にはアニメやゲームの音声、絶叫、アシッド由来の303、断片的な旋律が置かれる。600〜1000BPM程度のスプリッターコアがまだ打撃を数えられる段階にあるのに対し、エクストラトーンはそれを越えて音色へ転化した領域を指す。踊るための音楽というより、速度の限界を試す実験と、その極端さを共有する遊びとして成立している。</p>
<h2>成り立ち</h2><p>1990年代のガバとハードコアテクノが加速を続けた先に生まれた。オランダやドイツのガバが200BPM前後へ達した1990年代半ば、それをさらに押し上げたスピードコアが現れ、300〜600BPMの領域が開拓される。ドイツのManuel Schleis(The Speed Freak)やNoize Creator、日本のm1dyといった作り手が、この速度帯を代表する存在となった。1990年代末から2000年代前半にかけて、パソコンでの音楽制作環境が一般化し、テンポの上限が機材の物理的な制約ではなくソフトウェアの設定値だけの問題になったことが決定的だった。制作ソフトの数値欄に999や9999と打ち込めば、実際にその速度でキックが並ぶ。この技術的条件のもとで、600〜1000BPMを扱うスプリッターコアと、それを越えたエクストラトーンという区分が、シーンの内部から自然に生まれた。フランスではLaurent Hoが主宰したレーベルHangars Liquidesが、拍を解体して粒子のような音響へ向かうフラッシュコアを展開し、極端な速度と実験音楽を接続する道筋を示した。ドイツのSpeedcore Worldwideのようなネットレーベルは無料配布を前提に大量の音源を放流し、シーンの中心を実店舗や大型イベントではなくインターネットへ移した。2010年代以降はSoundCloudやBandcamp、そして動画サイトが主戦場となり、世界最速の曲を競う遊びが、音楽的な達成とネタの境界をまたぐ形で続いている。実際にフロアで踊られる機会は限られており、日本の速度志向のハードコア、東欧のノイズ寄りの作り手、そしてブレイクコアの周辺と人材が重なりながら、少数の熱心な共同体の中で受け継がれている。</p>
