<h1>Extratone（エクストラトーン）とは</h1>
<p>エクストラトーンは、1000 BPMを超える速さを持つ音楽だ。ハードコアテクノの行き着く果てといえる。 人間の耳は、クリックの連続が毎秒約40回を超えると、個々の打撃として聞き分けにくくなる。そして、連続した音として聞こえるように</p>
<p>エクストラトーンは、1000 BPMを超える速さを持つ音楽だ。ハードコアテクノの行き着く果てといえる。

人間の耳は、クリックの連続が毎秒約40回を超えると、個々の打撃として聞き分けにくくなる。そして、連続した音として聞こえるようになる(明瞭な音の高さが現れるのは、毎秒43〜86回の間が目安)。1000BPMは毎秒約16.7拍だが、16分音符でキックを並べると毎秒約67回になる。

エクストラトーンは、スピードコアのうちテンポ1,000以上のものと定義される。そのテンポで16分音符などを使った場合、バスドラムの連打はリズムであることをやめる。そして、うなるような持続音そのものへ変わる。BPMは1000前後から、ときに10,000に達するまで幅がある。より旋律的な要素を持つ例もある。

音作りでは、ディストーションとクリッピングで潰しきったキックを、制作ソフト上で極端に短いサンプルとして並べる手法も使われる。結果として出てくるのは、ノイズミュージックに近い連続的な轟音である。上物には、シンセサイザーやサンプリングが使われる。

曲は、途中に無音の切れ目や急な速さの変化を挟んで、形を作る。

600〜1000BPM程度のスプリッターコアは、まだ打撃を数えられる段階にある。これに対し、エクストラトーンはそれを越えて音色へ変わった領域を指す。速度の限界を試す実験や、その極端さを共有する遊びとして作られるものもある。その一方で、本質的にはダンスミュージックだと見る論者もいる。</p>
<h2>成り立ち</h2><p>1990年代、ガバとハードコアテクノは加速を続けていた。エクストラトーンは、その先に生まれた音楽だ。

オランダ発祥のガバは、通常140〜190BPMだった。ハードコアテクノ全体では、160〜200BPM以上に達した。そこからさらに速さを押し上げたスピードコアが、1990年代初頭に登場し(名称は1995年前後から使われた)、300〜600BPMの領域が切り開かれる。ドイツのMartin Damm(The Speed Freak)やNoize Creator、日本のm1dy(1998年から活動)は、この速度帯での活動で知られる作り手である。Martin Dammは、ガバ／ハードコア寄りの作り手だ。

1998年には、ベルギーのEinrich 3600 BPMが、オシロスコープでキックを発生させる手法を使い始めた。コミュニティでは、彼がこのジャンルの創始者とされる。1993年に発売されたMobyの「Thousand」(1992年録音)も、約1,015BPMでギネスに載ったとされる。

市販の制作ソフトの設定にも上限がある。Ableton Liveは20〜999BPMまで、FL Studioは現行版で522BPMまでである。600〜1000BPMを扱うスプリッターコアと、それを越えたエクストラトーンは、テンポで区分される。

一方フランスでは、La Peste(本名Laurent Mialon)が1998年に作ったレーベルHangars Liquidesが、のちにフラッシュコアと呼ばれる方向へ進んだ。そして、極端な速度と実験音楽をつなぐ道筋を示した。

2000年代初頭からはネットレーベルが広まり、2012年に設立されたドイツのSpeedcore Worldwideも、その流れに連なる。2010年代以降は、SoundCloudやBandcamp、そして動画サイトが主な舞台となった。世界最速の曲を競う遊びが、音楽的な達成とネタの境界をまたぐ形で続いている。

このジャンルは、少数の熱心な仲間うちで受け継がれている。</p>
