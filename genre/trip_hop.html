<h1>Trip Hop（トリップホップ）とは</h1>
<p>トリップホップは、ヒップホップのゆったりしたビートを土台にしたスタイルだ。ダブ（ジャマイカ発祥の、音を加工して再構成する音楽）が持つ空間的なエコー処理、アンビエントの浮遊感、ソウルの官能的なボーカルを、何層にも重ねる。ダウンテンポ</p>
<p>トリップホップは、ヒップホップのゆったりしたビートを土台にしたスタイルだ。ダブ（ジャマイカ発祥の、音を加工して再構成する音楽）が持つ空間的なエコー処理、アンビエントの浮遊感、ソウルの官能的なボーカルを、何層にも重ねる。ダウンテンポ(ゆったりしたテンポの電子音楽全般)を代表するスタイルである。

テンポは遅く（資料によってBPM 70〜100前後とされる）、紫煙が立ち込める薄暗い部屋のような、気だるく濃密なグルーヴを持つ。

音の素材は、映画音楽的なストリングス（生録音のものも、サンプリングしたものもある）、こもった音のドラム、深く体に響くベース、そして囁くようなボーカルだ。これらが折り重なり、都会の深夜特有の孤独と美しさを、同時に描き出す。

制作では、ヒップホップと同じくサンプリング（既存の音を録音して素材にする手法）を中心に据える。ラップを乗せる曲もあるが、歌やささやくようなボーカルを乗せる、あるいは器楽曲として成立させるものが多い。その点で、アメリカのヒップホップとは異なる進化を遂げた。Portisheadの『Dummy』のように、録音をレコードに刻んで傷めてからサンプリングし、ざらついた古い質感を出した例がある。

全体の印象は、霧雨に煙るイギリス・ブリストルの街角がそのまま音になったような、憂鬱で耽美的な音楽である。</p>
<h2>成り立ち</h2><p>舞台は、イギリス南西部の都市ブリストルだ。1980年代後半から育っていたシーンから、1991年頃に代表作が生まれて登場した。それが「ブリストル・サウンド」の代表的な流れとして独自のシーンを形成し、ブリストル以外にも広がった。

Massive Attackが発表したアルバム『Blue Lines』(1991)は、このジャンルの誕生を告げる金字塔的作品とされる。Portisheadの『Dummy』(1994)は、スパイ映画のサウンドトラックを思わせる、陰鬱で映画的な作風で批評家たちを熱狂させた。Trickyの『Maxinquaye』(1995)について、Roland Articlesなどは、Trickyがトリップホップの最も暗い領域に踏み込んだと評している。これらMassive Attack、Portishead、Trickyの3組は、英語圏の俗称「big three」にならって、「ブリストルの三大アーティスト」のように呼ばれることがある。

アメリカのDJ Shadowが発表した『Endtroducing.....』(1996)は、ほぼ全編が既存のレコードのサンプルで構成された傑作として知られる。Guinness World Recordsは「サンプルのみで作られた最初のアルバム」と記載している。Morcheeba、Sneaker Pimps、Hooverphonicは、1990年代半ば以降にこのスタイルを取り入れ、人気が広がる中で聴衆を増やしたバンドである。

「トリップホップ」という呼び名自体は、イギリスの音楽誌Mixmagの1994年6月号で、Andy PembertonがDJ Shadowの『In/Flux』を形容して使ったのが広まったとされる。しかし、当のアーティストたち(特にTrickyやMassive Attack)はこの名称を好まなかった。レッテル貼りとして拒否することも多かった。

ブリストルという都市の背景には、かつて奴隷貿易で栄えた港町としての歴史がある。さらに1950〜60年代にジャマイカなど西インド諸島から渡ってきた移民のコミュニティが根付いていた。彼らが持ち込んで培われたサウンドシステム文化(移動式の大型音響設備で街頭やパーティーで音楽を鳴らす文化)が、この重低音志向の音楽性を育んだ土壌となっている。</p>
