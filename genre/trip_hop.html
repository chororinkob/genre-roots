<h1>Trip Hop（トリップホップ）とは</h1>
<p>ヒップホップのゆったりしたビートを土台に、ダブが持つ空間的なエコー処理、アンビエントの浮遊感、ソウルの官能的なボーカルを何層にも重ねた、ダウンテンポ(ゆったりしたテンポの電子音楽全般)を代表するスタイル。テンポはBPM 60〜90</p>
<p>ヒップホップのゆったりしたビートを土台に、ダブが持つ空間的なエコー処理、アンビエントの浮遊感、ソウルの官能的なボーカルを何層にも重ねた、ダウンテンポ(ゆったりしたテンポの電子音楽全般)を代表するスタイル。テンポはBPM 60〜90ときわめて遅く、紫煙が立ち込める薄暗い部屋のような、気だるく濃密なグルーヴを持つ。ヴァイオリンなどのサンプリングされたストリングス、こもった音のドラム、深く体に響くベース、そして囁くようなボーカルが折り重なり、都会の深夜特有の孤独と美しさを同時に描き出す。霧雨に煙るイギリス・ブリストルの街角がそのまま音になったような、憂鬱で耽美的な音楽である。ヒップホップと同じくサンプリングを制作の中心に据えながらも、ラップではなく歌を乗せる、あるいは器楽曲として成立させるという点で、アメリカのヒップホップとは異なる進化を遂げた。曲全体に薄くかかったレコードの針音(ヴァイナル・ノイズ)も、この音楽特有の質感を作る重要な要素である。</p>
<h2>成り立ち</h2><p>1991年頃、イギリス南西部の都市ブリストルから登場し、「ブリストル・サウンド」とも呼ばれる独自のシーンを形成した。Massive Attackが発表したアルバム『Blue Lines』(1991)は、このジャンルの誕生を告げる金字塔的作品とされる。Portisheadの『Dummy』(1994)は、フィルムノワール映画を思わせる陰鬱な美学で批評家たちを熱狂させた。Trickyの『Maxinquaye』(1995)は、この3組の中でも特にダークで実験的な方向性を示した作品である。これらMassive Attack、Portishead、Trickyの3組は、しばしば「ブリストル三大トリップホップ」と称される。アメリカのDJ Shadowが発表した『Endtroducing.....』(1996)は、既存のレコードのサンプリングのみで全編が構成された傑作として知られる。Morcheeba、Sneaker Pimps、Hooverphonicといったバンドも、このジャンルの発展に重要な役割を果たした。「トリップホップ」という呼び名自体は、イギリスの音楽誌Mixmagが1994年頃に用いたのが広まったとされるが、当のアーティストたち(特にTrickyやMassive Attack)はこの名称を好まず、レッテル貼りとして拒否することも多かった。ブリストルという都市の背景には、かつての奴隷貿易港としての歴史と、それに由来する西インド諸島からの移民コミュニティが根付いており、そこで培われたサウンドシステム文化(移動式の大型音響設備で街頭やパーティーで音楽を鳴らす文化)が、この重低音志向の音楽性を育んだ土壌となっている。</p>
<h2>代表曲</h2><ul><li>Unfinished Sympathy (Massive Attack)</li><li>Sour Times (Portishead)</li><li>Hell Is Round the Corner (Tricky)</li><li>Building Steam with a Grain of Salt (DJ Shadow)</li><li>Trigger Hippie (Morcheeba)</li></ul>
