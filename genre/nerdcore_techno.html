<h1>Nerdcore Techno（ナードコア）とは</h1>
<p>アニメやテレビ番組、ゲームの音を無許可で取り込み、テクノやブレイクビーツ、ジャングルの型に組み替えた、日本生まれのダンス音楽だ。代表曲22曲を動画で聴け、ルーツと影響のつながりを地図でたどれる。</p>
<p>アニメやテレビ番組、ゲームの音を無許可で取り込み、テクノやブレイクビーツ、ジャングルの型に組み替えた、日本生まれのダンス音楽だ。土台になるのはマシンドラムとシンセサイザーだ。

リズムの中心は、キックとスネアで拍を刻むブレイクビーツだ。テンポはおおむね130〜160 BPM、作品によっては180 BPM近くまで上がる。作品によっては、ジャングル由来のアメンブレイクを挟み、ガバ風の重いキックで走る場面もある。

メロディは、サンプリングした元の曲の声やフレーズを、シンセのリフのように鳴らして作る。アニメのセリフや主題歌の一節を高速で切り貼りし、ピッチを上げて笑いを誘う使い方をする例が多い。歌い手を前に出さない作品が多く、サンプルを一つの楽器のように扱うことが多い。

曲の組み立ては、元の曲の引用で笑わせる導入から高速のビートに入り、途中で別の音源を次々に差し込んでいく。作品によっては、エフェクトにピッチベンドやスタッター、大げさなディレイを多く使う。

ハードコア・テクノとの違いは、クラブ向けの直線的な攻撃より、ネタ曲らしいユーモアとノスタルジーを重視する点にある。J-Coreがハードコア寄りにまとまったのに対し、こちらはテクノとジャングル寄りの幅広い作風を保つ。鳴る場所は渋谷や大阪の地下クラブ、同人即売会、そしてネット上のネットレーベルだ。</p>
<h2>成り立ち</h2><p>舞台は1990年代（前半から後半にかけて）の日本だ。クラブでテクノやジャングルが広がる中、サブカルチャーの素材を音に取り込む作家も現れ始めたとみられる。電気グルーヴが1990年に出したアルバム『662 BPM BY DG』のような、無許可で大量にサンプリングする手法を先駆けた作品が、下地の一つになった。1992年の猛毒の曲「サイバー長介」は、Discogsの解説でナードコアに近い最古級の例とされる。

名前が生まれたのは90年代後期だ。同人音楽サークル「殺人ヨットスクール」を主宰するDJ C-TYPEが、「Nerdが作ったHardcore Techno」をまとめる言葉として冗談で口にしたことが発端とされるが、名づけの経緯には諸説がある。1999年2月、太田出版が1994年9月に創刊した有料の隔月刊誌『クイック・ジャパン』のvol.23に、特集「ナードコア・テクノの夜明け」が載った。これが、この言葉を一般に広げた。

シーンを支えたのは、レーベル「全日本レコード」「TOY LABEL」、大阪の集団サイケアウツ、そしてレーベルXROGERだ。XROGERの主宰SK1が退いた後を受けたのが、1999年に発足した八卦商会（Hakke Shoukai）だ。高野政所が率いるレオパルドンは、1999年に『田舎 EP』などを残した。DJ急行も同じ時代に名を並べた。

高速音楽隊シャープネルは1998年の改称で生まれた。2000年12月に解散して再始動したあと、DJ SHARPNELの名義になり、2001年のアルバム『S.E.X. -Sound Of EXtreme-』で爆速の作風を示した。SPEEDKINGの初回は1997年9月19日、大阪のCAFE BLUEだった。イベントは、SPEEDKINGやOTAKUSPEEDVIBE、レーベルHYPER RICHのハイパーリッチパルスが場を提供した。

しかし、アニメ音源を無許可でサンプリングする以上、著作権との緊張は常にあり、主な流通は同人とネットに置かれた。2000年代、海外がこの流れをハードコア・テクノの一形態として読み替え、J-Coreという別の枠で逆輸入した。以降、新しい書き手の多くはJ-Core名義で活動するようになり、ナードコアという言葉は使われる機会が減ったとみられる。

それでも現在もTOY LABELが作品を出し続けている。海外ではNiTEFLAREやAllkoreのようなレーベルも生まれた。Anything Recordsは海外のレーベルではなく、ネットレーベルを通じて.internet上で生き続けている。</p>
