<h1>Nerdcore Techno（ナードコア）とは</h1>
<p>アニメ、テレビ番組、ゲームなどの音源を無許可で録り込み、テクノやブレイクビーツ、ジャングルの型に組み替えた日本産のダンス音楽である。代表曲22曲を動画で聴け、ルーツと影響のつながりを地図でたどれる。</p>
<p>アニメ、テレビ番組、ゲームなどの音源を無許可で録り込み、テクノやブレイクビーツ、ジャングルの型に組み替えた日本産のダンス音楽である。土台になるのはマシンドラムとシンセサイザーだ。キックとスネアで拍を刻むブレイクビーツのリズムが中心で、テンポはおおむね130〜160 BPM、作風によっては180 BPM近くまで上がる。ジャングル由来のアメンブレイクを途中に挟み、ガバ風の重いキックで突っ走る場面も多い。メロディは、サンプリングした原曲の声やフレーズを、シンセのリフのように鳴らして作る。アニメのセリフや主題歌の一節を高速で切り貼りし、ピッチを上げて笑いを誘う使い方がトレードマークである。歌い手を前面に出さず、サンプルを一つの楽器として扱う点が特徴だ。曲の組み立ては、原曲の引用で笑わせる導入から高速のビートへ突入し、途中で別の音源を次々に差し込んでいく。エフェクトはピッチベンドやスタッター、大げさなディレイを多用する。ハードコア・テクノとの違いは、クラブ向けの直線的な攻撃よりも、ネタ曲らしいユーモアとノスタルジーを重視する点にある。J-Coreがハードコア寄りにまとまったのに対し、こちらはテクノとジャングル寄りの幅広い作風を保つ。鳴る場所は渋谷や大阪の地下クラブ、同人即売会、そしてネット上のネットレーベルである。</p>
<h2>成り立ち</h2><p>この流れの始まりは1990年代前半の日本である。クラブでテクノやジャングルが広がる一方、サブカルチャーの素材を音に拾う作家が現れ始めた。電気グルーヴの1991年のアルバム『662 BPM BY DG』のような日本のテクノが下地の一つになった。1992年の猛毒「サイバー長介」は、ナードコアに近い最古級の例としてDiscogsに挙げられている。名前の誕生は90年代後期である。同人音楽サークル「殺人ヨットスクール」を主宰するDJ C-TYPEが、「Nerdが制作したHardcore Techno」をまとめる言葉として冗談で口にしたことが発端とされる。1999年2月、太田出版のフリーマガジン『クイック・ジャパン』vol.23の特集「ナードコア・テクノの夜明け」が、この言葉を一般に広げた。シーンを支えたのは、レーベル「全日本レコード」「TOY LABEL」、大阪の集団サイケアウツ、そしてレーベルXROGERである。XROGERの主宰SK1が退いた後を受けたのが、1999年に発足した八卦商会（Hakke Shoukai）だ。高野政所率いるレオパルドンは1999年の『田舎 EP』などを残し、DJ急行も同時代に並んだ。DJ SHARPNEL（jea）は1998年の「高速音楽隊シャープネル」から活動を始め、2001年のアルバム『S.E.X. -Sound Of EXtreme-』で爆速の作風を示した。イベントでは渋谷屋根裏のSPEEDKINGやOTAKUSPEEDVIBE、レーベルHYPER RICHのハイパーリッチパルスが場を供給した。しかし、アニメ音源の無許可サンプリングは著作権との緊張を常に孕み、主要な流通は同人とネットに置かれた。2000年代半ば、海外がこの流れをハードコア・テクノの一形態として再解釈し、J-Coreという別枠で逆輸入した。以降の新しい書き手の多くはJ-Core名義で活動するようになり、ナードコアの言葉はしばらく影に潜った。それでも現在もTOY LABELが作品を出し続け、海外ではNiTEFLAREやAllkoreのようなレーベルが生まれ、Anything Recordsのようなネットレーベルを通じて.internet上で命脈を保っている。</p>
