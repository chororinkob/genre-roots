<h1>Afrobeats（アフロビーツ）とは</h1>
<p>2000年代以降のナイジェリアとガーナを中心に発達し、現在では世界的な流行となっているポップスの総称である。名称が似ているために混同されがちだが、1970年代のFela Kutiによる政治的で長大なアフロビートとは別の音楽である。</p>
<p>2000年代以降のナイジェリアとガーナを中心に発達し、現在では世界的な流行となっているポップスの総称である。名称が似ているために混同されがちだが、1970年代のFela Kutiによる政治的で長大なアフロビートとは別の音楽である。テンポは概ね100から115 BPMと穏やかで、リズムの土台には打ち込みで作られた低音の太鼓と、細かく刻むシェイカーやリムショットが用いられる。四つ打ちを避け、拍を三つと三つと二つに分ける不均等な配置が骨格をなす点は、カリブ海の音楽と共通する。ギターはハイライフ由来の、高い音域で分散和音を繰り返す軽やかな奏法が使われ、これがこの音楽特有の陽気さを担っている。低音は太く丸い電子音で、旋律的に動く。和声は明るい長調が中心で、四つの和音を循環させる単純な進行が好まれる。歌唱は旋律を重視し、ラップよりも歌が主体で、複数の声を重ねた合唱が随所に入る。歌詞は英語、簡略化されたピジン英語、ヨルバ語やイボ語といった現地語が自在に混ぜられ、恋愛、成功、祝祭、そして日常の苦労を扱う。全体として、悲しみを歌う場合でも踊れる明るさを失わない点が、この音楽の一貫した性格である。</p>
<h2>成り立ち</h2><p>土台にあるのは、1950年代から西アフリカ沿岸で発達したハイライフと、1970年代のFela Kutiによるアフロビート、そして1980年代以降に流入したジャマイカのダンスホールとアメリカのヒップホップである。1990年代のナイジェリアは軍政下で経済が疲弊し、音楽産業も海賊版に食い荒らされて機能していなかった。1999年の民政移管後、状況が変わり始める。2000年代前半には、Don Jazzyが設立した制作組織を中心に、現地の若い作り手が国際的な水準の音を作れるようになり、D'banjやP-Squareが国内で圧倒的な人気を得た。決定的だったのは2012年、D'banjの楽曲がイギリスのチャートに入ったことである。この背景には、ロンドンに根を下ろしたナイジェリア系とガーナ系の共同体の存在があり、彼らが本国の音楽を消費し、宣伝し、ロンドンのラジオを通じて広める回路を作っていた。アフロビーツという複数形の呼称も、2011年頃にロンドンのラジオ司会者DJ Abranteeが、西アフリカ由来の新しいポップスをまとめて指すために使い始めたものとされ、つまりこの名は本国ではなく移民の街で付けられた。2010年代半ばには、Wizkidが2014年に発表した楽曲で貧困地区の名を歌い、2016年にはDrakeの世界的な大ヒットに参加して、この音楽を英語圏の主流へ押し上げる。Davidoが商業的な規模を拡大し、Burna Boyはより政治的で自己主張の強い作風によって、2021年にアメリカの主要な音楽賞を受賞した。女性の側ではTiwa SavageやTemsが道を切り開き、2020年代にはRemaやAyra Starrといった若い世代が短編動画を通じて世界的な成功を収めている。同時に、南アフリカ発のアマピアノとの融合も進んだ。課題も残る。アフロビーツという一語が、西アフリカの多様な音楽を平板にまとめてしまうという批判は当事者からも繰り返し提起されており、本国の音楽家が受け取る報酬や権利の管理の不備も、依然として大きな問題である。</p>
