<h1>Afrobeats（アフロビーツ）とは</h1>
<p>アフロビーツは、2000年代以降のナイジェリアとガーナを中心に発達し、現在では世界的な流行となっているポップスの総称だ。名称が似ているために混同されがちだが、1970年代のFela Kutiによる政治的で長大なアフロビートとは別の</p>
<p>アフロビーツは、2000年代以降のナイジェリアとガーナを中心に発達し、現在では世界的な流行となっているポップスの総称だ。名称が似ているために混同されがちだが、1970年代のFela Kutiによる政治的で長大なアフロビートとは別の音楽である。

リズムの土台には、打ち込みで作られた低音の太鼓がある。そこに、細かく刻むシェイカーやリムショットが加わる。テンポは100〜115前後が目安で、資料により85〜130とされる。穏やかな速さだ。拍子は4/4拍子を基本にする。3-2または2-3のクラーベ（ラテン音楽などに多い、決まったリズムの型）系の配置が特徴である。通常は四つ打ちではなく、シンコペートしたキックが基本だ。四つ打ちとの折衷型もある。デンボウと共通する3+3+2的なリズムも指摘される。

ギターは、ハイライフ（ガーナ発祥の大衆音楽）の影響を受けたものが、旋律の土台になることが多い。低音は太く丸い電子音で、旋律的に動く。和声は、長調(ハイライフ系)と短調の両系統がある。Wizkidの楽曲分析では約4分の3が短調とされるなど、短調のヒット曲も多い。進行は、3和音や2和音など、ごく少数の和音を繰り返す単純なものが多い。

歌唱は旋律を重視する。ラップよりも歌が主体で、複数の声を重ねた合唱が随所に入る。歌詞は、英語、簡略化されたピジン英語、ヨルバ語やイボ語といった現地語が自在に混ぜられる。扱う題材は、恋愛、成功、祝祭、そして日常の苦労である。全体として、悲しみを歌う場合でも踊れる明るさを失わない点が、この音楽の特徴とされる。</p>
<h2>成り立ち</h2><p>土台は三つある。一つ目は、19世紀、現在のガーナにあたる沿岸都市で生まれ、1950年代に黄金期を迎えたハイライフだ。二つ目は、1960年代後半から1970年代にFela Kutiらが形づくったアフロビートである。三つ目は、1980年代以降に流入したジャマイカのダンスホールとアメリカのヒップホップだ。

1990年代のナイジェリアは、軍政下で経済が疲弊していた。レコード会社や流通網の多くが廃業し、海賊版も横行して、産業は大きく衰えた。それでも、1999年の民政移管（軍の政権から選挙で選ばれた政権への交代）後、状況が変わり始める。

2000年代半ばから後半にかけて、Don JazzyとD'banjが2004年に共同で設立したとされる（異説：2006年）レーベルMo'Hits Recordsが中心になった。D'banjやP-Squareは、国内で圧倒的な人気を得た。国際市場への最初の大きな足がかりの一つは2012年だ。2011年にナイジェリアで発表されたD'banjの楽曲が、イギリスのチャートで9位に入った。

この背景には、ロンドンに根を下ろしたナイジェリア系とガーナ系の共同体があった。彼らは本国の音楽を消費し、宣伝し、ロンドンのラジオを通じて広める回路を作っていた。アフロビーツという複数形の呼称も、2011年頃にロンドンのラジオ司会者DJ Abranteeが使い始めたものとされる。西アフリカ由来の新しいポップスを、まとめて指すための言葉だった。The Guardianは彼を命名者として報じたが、本人は「アフロビーツを発明したのはFela」と述べたとされる。命名者は通説的な見方で、確定した記録はない。この名は、ロンドンのラジオやイベントを通じて広まったが、本国のアーティスト自身も使うようになった。

2010年代半ばには、Wizkidが2014年に発表した楽曲で、故郷ラゴスのOjuelegba地区を題材に、下積み時代の苦労を歌う。2016年には、Drakeの世界的な大ヒットに参加して、この音楽を英語圏の主流へ押し上げた。Davidoが商業的な規模を拡大し、Burna Boyは、より政治的で自己主張の強い作風によって、2021年にアメリカの主要な音楽賞を受賞した。女性の側では、Tiwa SavageやTemsが道を切り開いた。2020年代には、RemaやAyra Starrといった若い世代が、世界的な成功を収めている。同時に、南アフリカ発のアマピアノとの融合も進んだ。

課題も残る。アフロビーツという一語が、西アフリカの多様な音楽を平板にまとめてしまうという批判は、当事者からも繰り返し提起されている。本国の音楽家が受け取る報酬や権利の管理の不備も、依然として大きな問題である。</p>
