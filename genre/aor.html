<h1>AOR（アダルト・オリエンテッド・ロック）とは</h1>
<p>日本で「AOR（アダルト・オリエンテッド・ロック）」と呼ばれてきた、1970年代後半から80年代前半のアメリカ西海岸を中心とする、大人の聴き手に向けた洗練されたロックとポップスである。海外で同じ略称が指すアリーナ・ロックやラジオの</p>
<p>日本で「AOR（アダルト・オリエンテッド・ロック）」と呼ばれてきた、1970年代後半から80年代前半のアメリカ西海岸を中心とする、大人の聴き手に向けた洗練されたロックとポップスである。海外で同じ略称が指すアリーナ・ロックやラジオの放送形式とは別のもので、その違いは成り立ちの欄に書く。最大の特徴は和声にあり、長七・短七・九・十一といった音を足した和音が当たり前に使われ、分数コードや経過和音で色合いを細かく変えながら進む。この響きはジャズやフュージョンから来ており、演奏を担うのもジャズに通じた一流のスタジオミュージシャンである。テンポはおおむね80〜110 BPMの中くらいの速さが中心で、ドラムはハイハットを細かく刻みながらも音数を抑えた引き締まったグルーヴを作り、ベースは指弾きで和音の動きをなめらかにつなぐ。鍵盤はフェンダー・ローズの電気ピアノとアコースティック・ピアノが要で、シンセサイザーの柔らかな持続音が厚みを足す。ギターは歪ませず、澄んだ音色の細かいカッティングと、コンプレッサーやコーラスをかけた艶のあるソロが定番で、間奏をサックスのソロが飾ることも多い。歌は声を張り上げず、ソウルの影響を受けた柔らかく甘い声で歌われ、裏声や多重録音のコーラスが重なる。曲は、静かな歌い出しから転調を伴うサビへと盛り上がるように設計され、サビの直前の意外なコード進行が聴かせどころになる。歌詞は都会の夜、大人の恋愛、別れの余韻を扱うものが多い。アメリカ側の呼び名でこの時代の音をまとめたヨット・ロックとは、聴いている曲の大部分が重なる。一方、大会場向けの分厚いコーラスと歪んだギターで押し切るアリーナ・ロックとは、音量も和声の複雑さもはっきり違う。日本では、この音を手本にした日本語の歌が「和製AOR」と呼ばれ、寺尾聰、稲垣潤一、角松敏生、池田聡らがその担い手として挙げられる。夜のドライブやFMラジオ、都会のバーで流れる音楽として親しまれてきた。</p>
<h2>成り立ち</h2><p>「AOR」という略語は、場所と時代によって3つの違うものを指してきた。この項目で扱うのは、そのうち日本で定着した3つ目の意味である。1つ目は、アメリカのラジオ業界の用語「Album-Oriented Rock（アルバム重視のロック）」である。1960年代末から70年代にかけて、アメリカのFMラジオ局は、シングルのヒット曲だけを流すAMラジオに対抗して、アルバムの収録曲を長くかける編成を始めた。これが名前の由来で、もともとは音楽の様式ではなく、放送の形式の名前だった。2つ目は、その放送枠で盛んにかけられたロックの呼び名である。Journey、Foreigner、REO Speedwagon、Styx、Bostonのように、大会場で数万人が合唱できる分厚いコーラスと歪んだギターを持つロックが、イギリスやヨーロッパでは「AOR」や「メロディック・ロック」と呼ばれるようになった。英語圏では今日、この音楽はアリーナ・ロックと呼ばれることが多く、この地図でもアリーナ・ロックの項目で扱う。日本ではこの系統を、音楽評論家の渋谷陽一が商業主義を皮肉って「産業ロック」と呼んだことでも知られる。3つ目が、日本で「Adult-Oriented Rock（大人向けのロック）」と読み替えられたAORである。1976年にBoz Scaggsが発表したアルバム『Silk Degrees』は、ソウルとジャズの和声をロックの編成で洗練させた作品で、その演奏を支えたDavid PaichやJeff Porcaroらは、翌年TOTOを結成する。1977年のSteely Dan『Aja』、1978年のBobby Caldwellのデビュー作、1979年のChristopher Crossのデビュー作（翌々年のグラミー賞で主要4部門を独占した）、1980年にDavid FosterとJay Graydonが組んだAirplayの唯一のアルバムなどが、この音の基準を作った。日本のレコード会社や音楽雑誌は、こうした作品を「AOR」の名でまとめて紹介し、レコード店にもその名の棚ができた。大人が落ち着いて聴けるロックとして受け止められ、アメリカ本国よりもはるかに長く、熱心に聴かれ続けた。やがてその音を手本にして、日本語で歌う作品も生まれる。1981年に寺尾聰のアルバム『Reflections』が大ヒットし、稲垣潤一、角松敏生、杉山清貴、池田聡、崎谷健次郎らが続いた。これらは「和製AOR」と呼ばれ、同じ時代のシティポップと深く重なっている。1980年代後半になると、打ち込みの音や硬いロックに押されて、本国アメリカではこの種の音楽は古いものとみなされた。しかし日本では、1999年に音楽評論家の金澤寿和が著した『AOR Light Mellow』などをきっかけに、再評価と再発売が続いた。アメリカでは2005年、J.D. Ryznarらが制作したネットの連続コメディ動画『Yacht Rock』が、同じ音楽を「ヨット・ロック」という呼び名で笑いの種にし、これがかえって若い世代の再評価につながった。つまり、日本でいうAORとアメリカでいうヨット・ロックは、ほぼ同じ音楽を、別の国が別の時期に名付けたものである。2010年代以降、日本のシティポップが世界で聴かれるようになると、その手本となったAORにも改めて注目が集まっている。</p>
<h2>代表曲</h2><ul><li>Hard to Say I'm Sorry (Chicago)</li><li>We're All Alone (Boz Scaggs)</li><li>What You Won't Do for Love (Bobby Caldwell)</li><li>Arthur's Theme (Christopher Cross)</li><li>Ride Like the Wind (Christopher Cross)</li><li>I Keep Forgettin' (Michael McDonald)</li><li>Nothin' You Can Do About It (Airplay)</li><li>Georgy Porgy (Toto)</li><li>Reminiscing (Little River Band)</li><li>I.G.Y. (Donald Fagen)</li><li>Steal Away (Robbie Dupree)</li><li>This Is It (Kenny Loggins)</li><li>Baby Come Back (Player)</li><li>Biggest Part of Me (Ambrosia)</li><li>ルビーの指環 (寺尾聰)</li><li>ドラマティック・レイン (稲垣潤一)</li><li>Take You to the Sky High (角松敏生)</li><li>モノクローム・ヴィーナス (池田聡)</li><li>もう一度夜を止めて (崎谷健次郎)</li><li>さよならのオーシャン (杉山清貴)</li></ul>
