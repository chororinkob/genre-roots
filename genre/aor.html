<h1>AOR（アダルト・オリエンテッド・ロック）とは</h1>
<p>日本で「AOR（アダルト・オリエンテッド・ロック）」と呼ばれてきた音楽だ。1970年代後半から80年代前半のアメリカ西海岸を中心とする、大人の聴き手に向けた洗練されたロックとポップスである。海外で同じ略称が指すアリーナ・ロックやラ</p>
<p>日本で「AOR（アダルト・オリエンテッド・ロック）」と呼ばれてきた音楽だ。1970年代後半から80年代前半のアメリカ西海岸を中心とする、大人の聴き手に向けた洗練されたロックとポップスである。海外で同じ略称が指すアリーナ・ロックやラジオの放送形式とは別のもので、その違いは成り立ちの欄に書く。

いちばんの特徴は和音にある。長七・短七・九・十一といった音を足した和音が当たり前に使われ、分数コードや、つなぎの和音で色合いを細かく変えながら進む。この響きはジャズやフュージョンから来ている。演奏を担うのも、ジャズに通じた一流のスタジオミュージシャンである。

鍵盤は、フェンダー・ローズの電気ピアノとアコースティック・ピアノが要だ。シンセサイザーの柔らかく伸びる音が、厚みを足す。ギターは歪ませない。澄んだ音色の細かいカッティングと、コンプレッサーやコーラスをかけた艶のあるソロが定番だ。間奏をサックスのソロが飾ることも多い。

テンポは中くらいの速さの曲が多い。ドラムはハイハットを細かく刻みながらも、音数を抑えた引き締まったノリを作る。ベースは指弾きで、和音の動きをなめらかにつなぐ。

歌は声を張り上げない。ソウルの影響を受けた柔らかく甘い声で歌われ、裏声や多重録音のコーラスが重なる。歌詞は、都会の夜、大人の恋愛、別れの余韻を扱うものが多い。転調や意外なコード進行を使う曲もある。

アメリカ側の呼び名でこの時代の音をまとめたヨット・ロックとは、聴いている曲の大部分が重なる。一方、大会場向けの分厚いコーラスと歪んだギターで押し切るアリーナ・ロックとは、音量も和声の複雑さもはっきり違う。

日本では、この音を手本にした日本語の歌が「和製AOR」と呼ばれる。寺尾聰や角松敏生らが、その担い手として挙げられる(稲垣潤一、池田聡らも挙げられることがある)。夜のドライブやFMラジオ、都会のバーで流れる音楽として親しまれてきた。</p>
<h2>成り立ち</h2><p>「AOR」という略語は、場所と時代によって、3つの違うものを指してきた。この項目で扱うのは、そのうち日本で定着した3つ目の意味である。

1つ目は、アメリカのラジオ業界の用語だ。当初は「album-oriented radio（アルバム重視のラジオ）」と呼ばれ、1980年代初めから「Album-Oriented Rock（アルバム重視のロック）」の意味に解釈されるようになった。1960年代末から70年代にかけて、アメリカのFMラジオ局は、シングルのヒット曲だけを流すAMラジオに対抗して、アルバムの収録曲を長くかける編成を始めた。これが名前の由来だ。もともとは音楽のスタイルではなく、放送の形式の名前だった。

2つ目は、その放送枠で盛んにかけられたロックの呼び名である。Journey、Foreigner、REO Speedwagon、Styx、Bostonのように、大会場で合唱できる分厚いコーラスと歪んだギターを持つロックが、「AOR」や「メロディック・ロック」とも呼ばれるようになった。英語圏では、この音楽はアリーナ・ロックに分類されることが多く、この地図でもアリーナ・ロックの項目で扱う。日本ではこの系統を、音楽評論家の渋谷陽一が商業主義を皮肉って「産業ロック」と呼んだことでも知られる。

3つ目が、日本で「Adult-Oriented Rock（大人向けのロック）」の意味で定着したAORである(同種の用法は英語圏にもあり、ソフトロックの同義語として使われることもあるため、完全な日本独自の命名とは言えない)。

1976年、Boz Scaggsがアルバム『Silk Degrees』を発表した。ソウルとジャズの和声を、ロックの編成で洗練させた作品と評される。その演奏を支えたDavid PaichやJeff Porcaroらは、翌年TOTOを結成する。続いて1977年のSteely Dan『Aja』、1978年のBobby Caldwellのデビュー作、1979年のChristopher Crossのデビュー作（翌々年のグラミー賞で主要4部門を独占した）が出た。1980年発表の、David FosterとJay GraydonによるAirplayの唯一のアルバムも加わる。これらが、この音の基準を作った。

日本のレコード会社や音楽雑誌は、こうした作品を「AOR」の名でまとめて紹介し、レコード店にもその名の棚ができた。大人が落ち着いて聴けるロックとして受け止められ、再発や再評価が続いた。

やがて、その音を手本にして、日本語で歌う作品も生まれる。1981年に寺尾聰のアルバム『Reflections』が大ヒットし、稲垣潤一、角松敏生、杉山清貴、池田聡、崎谷健次郎らが続いた。これらは「和製AOR」と呼ばれ、同じ時代のシティポップと深く重なっている。

この音楽が作られたのは、1975年から84年ごろだ。のちに本国アメリカでは長く嘲笑の対象にもなった。しかし日本では、1999年に音楽ライターの金澤寿和がディスクガイド『AOR Light Mellow』を刊行し、再評価を後押しした。

アメリカでは2005年、J.D. Ryznarらが制作したネットの連続コメディ動画『Yacht Rock』が、同じ音楽を「ヨット・ロック」という呼び名で笑いの種にした。この動画が呼び名を広め、2015年ごろからは偏見が薄れて、肯定的に見直す動きが出てきた。つまり、日本でいうAORとアメリカでいうヨット・ロックは、大部分が重なる音楽を、別の国が別の時期に名付けたものである。

2010年代以降、日本のシティポップが世界で聴かれるようになると、その手本となったAORにも改めて注目が集まっている。</p>
