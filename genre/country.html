<h1>Country（カントリー）とは</h1>
<p>カントリーは、英国諸島系の民謡・舞踏音楽を土台に、アフリカ系アメリカ人の音楽（ブルース、バンジョー）などが混ざって形成された、米国南部および西部の大衆音楽だ。 主役はフィドルとギターで、リズムの土台はギターまたはバンジョーが担う。</p>
<p>カントリーは、英国諸島系の民謡・舞踏音楽を土台に、アフリカ系アメリカ人の音楽（ブルース、バンジョー）などが混ざって形成された、米国南部および西部の大衆音楽だ。

主役はフィドルとギターで、リズムの土台はギターまたはバンジョーが担う。バンジョーの位置づけは、スタイルによって違う。1950年代以降は、ペダル・スティール・ギターも加わった。ペダル・スティールは、膝と足でペダルを操作して弦の音程を変える楽器だ。和音の中の特定の音だけが滑らかに動くという独特の効果を生み、1950年代以降のカントリーの音色を特徴づける要素の一つとなっている。

拍子は2/4・4/4・3/4（ワルツ）が中心だ。4拍子の曲では、2拍目と4拍目を強く弾くバックビートが多い。ベースは、根音（和音の基本の音）と5度を交互に弾く、いわゆるブンチャ型の刻みが基本になる。和声（コードの響き）は単純で、主和音（中心の和音）、属和音、下属和音の三つで成り立つ曲が多い。旋律はメジャー・ペンタトニック（明るい5音音階）を使うことが多く、比較的素朴な旋律が多い。

歌では、言葉が明瞭に伝わることを最優先する。南部の訛りを隠さず、時に鼻にかかった発声や、裏声へ跳ね上がるヨーデル的な技法も使う。

歌詞は、歌詞中心のスタイルが主流だ。失恋、家族、酒、労働、故郷、信仰、そして人生の後悔が、具体的な情景描写を通じて語られる。一方で、ブルーグラスやウエスタン・スウィングなど、楽器の技巧を重視するスタイルもある。</p>
<h2>成り立ち</h2><p>英国諸島系の民謡・舞踏音楽を土台に、アフリカ系アメリカ人の音楽（ブルース、バンジョー）などが混ざって、カントリーは形成された。そこにアフリカ由来のバンジョーが加わり、独自の混合が生じた。

商業的なカントリー録音は、1922〜23年に始まっていた。1922年にEck RobertsonとHenry GillilandがVictorに、1923年にFiddlin' John CarsonがOkehに録音している。

現代のカントリーの転換点とされるのは、1927年のいわゆるブリストル・セッションズだ。場所は、テネシー州とバージニア州の境の町ブリストル。レコード会社Victorのプロデューサー兼タレントスカウト（新人発掘者）のRalph Peerが行った。ここでThe Carter Familyと Jimmie Rodgersが初めてレコード契約・録音を行った。前者は家族的で敬虔な歌の伝統を、後者はブルースとヨーデルを混ぜた放浪者の歌を代表する。両者は、カントリーの二つの系譜の始祖となった。

ラジオも、この音楽を広げた。テネシー州ナッシュビルのラジオ番組Grand Ole Opryは、1925年に「WSM Barn Dance」として始まり、1927年に今の名になった。この番組は、カントリーを全国に届ける主要な媒体の一つとなり、ナッシュビルを産業の中心地に育てた。1940年代にはHank Williamsが、簡潔な言葉で孤独と苦悩を歌った。1953年に29歳で死去するまでの短い期間に、この音楽の文学的な水準を決定づけたと言われる。

1950年代半ばから、Chet Atkins、Owen Bradley、Bob Ferguson、Steve Sholesらが、弦楽と合唱を加えた洗練された編曲を定着させた。いわゆるナッシュビル・サウンドで、1960年代初頭に頂点を迎え、都市の聴き手を取り込んだ。

これと対比されるのが、Bakersfield soundと呼ばれるカリフォルニア発の硬い音だ。ドラスト・ボウル期の移住者のホンキートンクとウエスタン・スウィングを背景に、1950年代に形成された。Wynn Stewartは先駆者の一人である。そしてBuck OwensとMerle Haggardが、1960年代、とくに前半（Owens）から後半（Haggard）にかけて、そのサウンドを全国的な人気へと押し上げた。

1970年代、とくに1973年以降は、Willie NelsonとWaylon Jenningsによるアウトロー・カントリーが、レコード会社の統制に反発した。

人種的には長く白人の音楽として扱われてきた。だが近年は、バンジョーの起源がアフリカにあることや、DeFord Baileyのような黒人演奏者が初期のGrand Ole Opryで活躍していた事実が、改めて注目されている。カントリーは現在も、米国で最も商業的に成功した音楽の一つであり続けている。</p>
