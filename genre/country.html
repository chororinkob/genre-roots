<h1>Country（カントリー）とは</h1>
<p>米国南部および西部で、英国諸島系の民衆音楽を土台に発展した大衆音楽。編成は、フィドル（バイオリンの民衆音楽的な呼び方）とギターが主役で、リズムの土台はギターまたはバンジョー、そして1950年代以降はペダル・スティール・ギターが加わ</p>
<p>米国南部および西部で、英国諸島系の民衆音楽を土台に発展した大衆音楽。編成は、フィドル（バイオリンの民衆音楽的な呼び方）とギターが主役で、リズムの土台はギターまたはバンジョー、そして1950年代以降はペダル・スティール・ギターが加わる。バンジョーの位置づけは様式によって異なる。ペダル・スティールは膝と足でペダルを操作して弦の音程を変える楽器で、和音の中の特定の音だけが滑らかに動くという独特の効果を生み、これは1950年代以降のカントリーの音色を特徴づける要素の一つとなっている。拍子は2拍子・4拍子・3拍子（ワルツ）が中心で、4拍子の曲では2拍目と4拍目にアクセントを置く例が多い。ベースは根音（和音の基本の音）と5度を交互に弾く、いわゆるブンチャ型の刻みが基本。和声（コードの響き）は単純で、主和音（中心の和音）、属和音、下属和音の三つで成り立つ曲が多い。旋律はメジャー・ペンタトニック（明るい5音音階）を用いることが多い。歌唱は言葉が明瞭に伝わることを最優先し、南部の訛りを隠さず、時に鼻にかかった発声や、裏声へ跳ね上がるヨーデル的な技法を用いる。歌詞を中心とする様式が主流で、失恋、家族、酒、労働、故郷、信仰、そして人生の後悔が、具体的な情景描写を通じて語られる。物語を語ることが重んじられる。ただしブルーグラスやウエスタン・スウィングのように、器楽の技巧を重視する様式もある。</p>
<h2>成り立ち</h2><p>起源は、イングランド、スコットランド、アイルランド系の入植者が持ち込んだバラッド（物語を語る歌）や舞踏音楽を土台に、アフリカ系アメリカ人の音楽（ブルースやバンジョー）、ミンストレルやヴォードヴィルなどが混ざって形成されたことにある。商業的なカントリー録音は1922〜23年に始まっていた（1922年にEck RobertsonとHenry GillilandがVictorに、1923年にFiddlin' John CarsonがOkehに録音）。現代のカントリーの転換点とされるのは1927年、テネシー州とバージニア州の境の町ブリストルで、レコード会社Victorのプロデューサー兼タレントスカウト（新人発掘者）Ralph Peerが行った、いわゆるブリストル・セッションズである。ここでThe Carter Familyと Jimmie Rodgersが発見され、前者は家族的で敬虔な歌の伝統を、後者はブルースとヨーデルを混ぜた放浪者の歌を代表し、カントリーの二つの系譜の始祖となった。1925年に「WSM Barn Dance」として始まり、1927年に今の名になったテネシー州ナッシュビルのラジオ番組Grand Ole Opryは、この音楽を全国に届ける主要な媒体の一つとなり、同市を産業の中心地に育てた。1940年代にはHank Williamsが、簡潔な言葉で孤独と苦悩を歌い、1953年に29歳で死去するまでの短い期間に、この音楽の文学的な水準を決定づけた。1950年代半ばから、Chet Atkins、Owen Bradley、Bob Ferguson、Steve Sholesらが、弦楽と合唱を加えた洗練された編曲、いわゆるナッシュビル・サウンドを確立し（1960年代初頭に頂点を迎え）、都市の聴き手を取り込んだ。これに対抗する流れとして、1950年代中後半にはBakersfield soundと呼ばれるカリフォルニア発の硬い音が形成され、Wynn Stewartはその先駆者の一人となり、Buck Owens（1960年代前半）とMerle Haggard（1960年代後半）が、そのサウンドを全国的な人気へと押し上げた。1970年代（とくに1973年以降）、Willie NelsonとWaylon Jenningsによるアウトロー・カントリーが、制作の自由を求めてレコード会社の統制に反発した。人種的には長く白人の音楽として扱われてきたが、バンジョーの起源がアフリカにあること、そしてDeFord Baileyのような黒人演奏者が初期のGrand Ole Opryで活躍していた事実は、近年になって改めて注目されている。現在も米国で最も商業的に成功した音楽の一つであり続けている。</p>
