<h1>Country（カントリー）とは</h1>
<p>米国の南部や西部で、イギリス諸島から来た人々の民謡や踊りの音楽を土台に、アフリカ系アメリカ人の音楽などが混ざって育った大衆音楽。編成では、フィドル（バイオリンの民衆音楽的な呼び方）とギターが主役で、リズムの土台はギターかバンジョー</p>
<p>米国の南部や西部で、イギリス諸島から来た人々の民謡や踊りの音楽を土台に、アフリカ系アメリカ人の音楽などが混ざって育った大衆音楽。編成では、フィドル（バイオリンの民衆音楽的な呼び方）とギターが主役で、リズムの土台はギターかバンジョーが受け持つ。バンジョーの役わりは、カントリーの種類によって違う。1950年代以降はペダル・スティール・ギターも加わった。ペダル・スティールは膝と足でペダルを操作して弦の音程を変える楽器で、和音の中の特定の音だけが滑らかに動くという独特の効果を生み、これは1950年代以降のカントリーの音色を特徴づける要素の一つとなっている。拍子は4分の2、4分の4、4分の3（ワルツ）が中心で、4拍子の曲では2拍目と4拍目を強く打つことが多い。ベースは根音（和音の基本の音）と5度を交互に弾く、いわゆるブンチャ型の刻みが基本。和声（コードの響き）は単純で、主和音（中心の和音）、属和音、下属和音の三つで成り立つ曲が多い。旋律はメジャー・ペンタトニック（明るい5音音階）を用いることが多く、比較的素朴な旋律が多い。歌唱は言葉が明瞭に伝わることを最優先し、南部の訛りを隠さず、時に鼻にかかった発声や、裏声へ跳ね上がるヨーデル的な技法を用いる。歌詞を中心にした曲が主流で、失恋、家族、酒、労働、故郷、信仰、そして人生の後悔が、具体的な情景描写を通じて語られる。物語を語ることが大きな目的で、技巧はそのための手段という曲が多い。ただし、ブルーグラスやウエスタン・スウィングのように、フィドルなど楽器の腕前を聴かせることを大事にする種類もある。</p>
<h2>成り立ち</h2><p>土台の一つは、18世紀以降にアパラチア山脈地帯などの南部の内陸へ移り住んだイングランド、スコットランド、アイルランド系の人々が持ち込んだバラッド（物語を語る歌）と舞踏音楽である。そこにアフリカ由来のバンジョーが加わり、独自の混合が生じた。このほか、ブルース、ゴスペル、ミンストレルやヴォードヴィル（大衆向けの舞台芸）、Tin Pan Alley（ニューヨークの流行歌づくりの世界）、テキサスやオクラホマの音楽なども源流で、起源をひとつに決めることはできない。商業的なカントリー録音は1922〜23年に始まっていた（1922年にEck RobertsonとHenry GillilandがVictorに、1923年にFiddlin' John CarsonがOkehに録音）。現代のカントリーの転換点とされるのは1927年、テネシー州とバージニア州の境の町ブリストルで、レコード会社Victorのプロデューサー兼タレントスカウト（新人発掘者）Ralph Peerが行った、いわゆるブリストル・セッションズである。ここでThe Carter Familyと Jimmie Rodgersが初めてレコード契約を結んで録音し、前者は家族的で敬虔な歌の伝統を、後者はブルースとヨーデルを混ぜた放浪者の歌を代表した。この二組を、カントリーの二つの系譜の始まりと見る整理もある。1925年に「WSM Barn Dance」として始まり、1927年に今の名になったテネシー州ナッシュビルのラジオ番組Grand Ole Opryは、この音楽を全国に届ける主な手段の一つとなり、同市を産業の中心地に育てた。1940年代にはHank Williamsが、簡潔な言葉で孤独と苦悩を歌い、1953年に29歳で死去するまでの短い期間に、この音楽の文学的な水準を決定づけた。1950年代半ばから、Chet Atkins、Owen Bradley、Bob Ferguson、Steve Sholesらが、弦楽と合唱を加えた洗練された編曲、いわゆるナッシュビル・サウンドを確立し（1960年代初頭に頂点を迎え）、都市の聴き手を取り込んだ。一方、ダスト・ボウル（1930年代の砂嵐と不況）の時期にカリフォルニアへ移り住んだ人々のホンキートンクとウエスタン・スウィングを背景に、1950年代にはBakersfield soundと呼ばれるカリフォルニア発の硬い音が形づくられ、ナッシュビル・サウンドと対比される。Wynn Stewartはその先駆者の一人である。Buck Owensが1960年代前半に、Merle Haggardが1960年代後半に、そのサウンドを全国的な人気へと押し上げた。1970年代、とくに1973年以降、Willie NelsonとWaylon Jenningsによるアウトロー・カントリーが、曲づくりの自由を求めて、レコード会社の統制に反発した。人種的には長く白人の音楽として扱われてきたが、バンジョーの起源がアフリカにあること、そしてDeFord Baileyのような黒人演奏者が初期のGrand Ole Opryで活躍していた事実は、近年になって改めて注目されている。現在も米国で最も商業的に成功した音楽の一つであり続けている。</p>
<h2>代表曲</h2><ul><li>The Gambler (Kenny Rogers)</li><li>Chattahoochee (Alan Jackson)</li><li>Before He Cheats (Carrie Underwood)</li><li>Chicken Fried (Zac Brown Band)</li><li>9 to 5 (Dolly Parton)</li><li>Always on My Mind (Willie Nelson)</li><li>The House That Built Me (Miranda Lambert)</li><li>Strawberry Wine (Deana Carter)</li><li>Take Me Home, Country Roads (John Denver)</li><li>Should've Been a Cowboy (Toby Keith)</li><li>Fancy (Reba McEntire)</li><li>Ring of Fire (Johnny Cash)</li><li>Jolene (Dolly Parton)</li><li>Amarillo by Morning (George Strait)</li><li>Coal Miner's Daughter (Loretta Lynn)</li><li>Stand by Your Man (Tammy Wynette)</li><li>Whiskey Lullaby (Brad Paisley feat. Alison Krauss)</li><li>Friends in Low Places (Garth Brooks)</li><li>Crazy (Patsy Cline)</li><li>The Dance (Garth Brooks)</li><li>I Walk the Line (Johnny Cash)</li></ul>
