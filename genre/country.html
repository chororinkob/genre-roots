<h1>Country（カントリー）とは</h1>
<p>米国南部の白人層の民衆音楽から発展した大衆音楽。編成の中心はアコースティック・ギター、フィドル（バイオリンの民衆音楽的な呼び方）、バンジョー、そしてペダル・スティール・ギターである。ペダル・スティールは膝と足でペダルを操作して弦の</p>
<p>米国南部の白人層の民衆音楽から発展した大衆音楽。編成の中心はアコースティック・ギター、フィドル（バイオリンの民衆音楽的な呼び方）、バンジョー、そしてペダル・スティール・ギターである。ペダル・スティールは膝と足でペダルを操作して弦の音程を変える楽器で、和音の中の特定の音だけが滑らかに動くという独特の効果を生み、これがカントリーの音色を決定づける最大の要素となっている。BPMは80〜140、拍子は四分の四または四分の三で、二拍目と四拍目にアクセントを置く。ベースは根音と五度を交互に弾く、いわゆるブンチャ型の刻みが基本。和声は極めて単純で、主和音、属和音、下属和音の三つでほとんどの曲が成立する。旋律はメジャー・ペンタトニックが中心で、装飾は少ない。歌唱は言葉が明瞭に伝わることを最優先し、南部の訛りを隠さず、時に鼻にかかった発声や、裏声へ跳ね上がるヨーデル的な技法を用いる。歌詞こそが本体であり、失恋、家族、酒、労働、故郷、信仰、そして人生の後悔が、具体的な情景描写を通じて語られる。物語を語ることが最大の目的であり、技巧はそのための手段に過ぎない。</p>
<h2>成り立ち</h2><p>起源は、17世紀から18世紀にかけてアパラチア山脈地帯に入植したイングランド、スコットランド、アイルランド系の人々が持ち込んだバラッドと舞踏音楽にある。そこにアフリカ由来のバンジョーが加わり、独自の混合が生じた。録音産業としての出発点は1927年、テネシー州とバージニア州の境の町ブリストルで、レコード会社Victorの録音技師Ralph Peerが行った、いわゆるブリストル・セッションズである。ここでThe Carter Familyと Jimmie Rodgersが発見され、前者は家族的で敬虔な歌の伝統を、後者はブルースとヨーデルを混ぜた放浪者の歌を代表し、カントリーの二つの系譜の始祖となった。1925年に始まったテネシー州ナッシュビルのラジオ番組Grand Ole Opryは、この音楽を全国に届ける最大の装置となり、同市を産業の中心地に育てた。1940年代にはHank Williamsが、簡潔な言葉で孤独と苦悩を歌い、1953年に29歳で死去するまでの短い期間に、この音楽の文学的な水準を決定づけた。1950年代後半、Chet Atkinsらが弦楽と合唱を加えた洗練された編曲、いわゆるナッシュビル・サウンドを確立し、都市の聴き手を取り込んだ。これに対する反発として、1960年代にはBakersfield soundと呼ばれるカリフォルニア発の硬い音がBuck OwensとMerle Haggardによって作られ、1970年代にはWillie NelsonとWaylon Jenningsによるアウトロー・カントリーが、レコード会社の統制に反旗を翻した。人種的には長く白人の音楽として扱われてきたが、バンジョーの起源がアフリカにあること、そしてDeFord Baileyのような黒人演奏者が初期のGrand Ole Opryで活躍していた事実は、近年になって改めて注目されている。現在も米国で最も商業的に成功した音楽の一つであり続けている。</p>
<h2>代表曲</h2><ul><li>Jolene (Dolly Parton)</li><li>Friends in Low Places (Garth Brooks)</li><li>Take Me Home, Country Roads (John Denver)</li><li>Ring of Fire (Johnny Cash)</li><li>The Gambler (Kenny Rogers)</li></ul>
