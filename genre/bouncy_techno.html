<h1>Bouncy Techno（バウンシーテクノ）とは</h1>
<p>跳ねるような低音を最大の特徴とする、高速で明るい電子舞曲である。テンポは一分間に160から180拍程度で、四つ打ちのバスドラムが土台になる。決定的な要素は各拍の裏に置かれるベースの音で、これが上向きに跳ね上がるように配置される。こ</p>
<p>跳ねるような低音を最大の特徴とする、高速で明るい電子舞曲である。テンポは一分間に160から180拍程度で、四つ打ちのバスドラムが土台になる。決定的な要素は各拍の裏に置かれるベースの音で、これが上向きに跳ね上がるように配置される。この裏拍の跳ね上がりが、踊り手の体を上下に弾ませる推進力を生む。低音の音色は歪ませた電子音で、短く切られて余韻を残さない。上物には極めて分かりやすい旋律が乗り、インストゥルメンタルか、短い反復サンプルが使われ、クレズマー(東欧系ユダヤ人の音楽)や縁日の音楽を思わせる単純な旋律に例えられる。音色は明るく甲高い合成音が中心で、暗さや複雑さは意図的に避けられる。曲の構成は分かりやすさを最優先しており、盛り上げ、休止、爆発という順序が繰り返される。休止の区間ではバスドラムが完全に止まり、旋律だけが残ってから一気に全体が戻る。歌はまれである。この様式は音楽的な革新よりも、その場にいる全員が即座に理解して跳ねられることを目的に設計されており、地域の若者文化と強く結びついた実用的な音楽として機能してきた。</p>
<h2>成り立ち</h2><p>1990年代前半、英国とオランダを中心にレイヴ文化が大きく広がったが、その過程で音楽は複数の方向へ分岐していった。実験的で暗い方向へ進んだ流れがある一方で、より単純で明るく、誰でもすぐ踊れる方向へ進んだ流れがあり、その一つがバウンシー・テクノである。中心地となったのはスコットランドとイングランド北部だった。スコットランドでは、エディンバラのRezerectionなど、数千人から1万人を超える規模の大規模なレイヴが中心だった。音楽はその場で機能することを最優先に作られ、複雑さや洗練は求められなかった。オランダではこの音楽が「ハッピー・ハードコア」や「ハッピー・ガバ」「ファンコア」と呼ばれた。のちにイングランド北西部のボルトンやウィガンなどで、1990年代後半から2000年代初頭にドンク(当初はスカウス・ハウスやバウンスと呼ばれた)が生まれ、バウンシー・テクノはその源流の一つとなった。制作は盛んで、中心人物のScott Brownは1994年だけで10のレーベルから12インチ盤27枚を出し、自身のEvolution Recordsのもとで5つのレーベルを立ち上げた。オランダにも専門のレーベルがあった。地域の若者にとっては、自分たちの生活と直結した音楽として機能し続けた。土曜の夜に地元の会場へ行き、同じ町の顔見知りと跳ねるという体験そのものが、この音楽の内容だったといえる。2000年代にはRezerectionが2004年にグラスゴーのBarrowlandsで復活の催しを開き、2011年にはKutskiがBBC Radio 1でセットを披露するなど、再び注目される動きがあった。</p>
