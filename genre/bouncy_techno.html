<h1>Bouncy Techno（バウンシーテクノ）とは</h1>
<p>バウンシー・テクノは、跳ねるような低音をいちばんの特徴とする、速くて明るい電子のダンス音楽だ。 テンポは毎分160から180拍ほどで、四つ打ちのバスドラムが土台になる。キックは少し歪んでいる。いちばん大事な要素は裏拍の単音で、この</p>
<p>バウンシー・テクノは、跳ねるような低音をいちばんの特徴とする、速くて明るい電子のダンス音楽だ。

テンポは毎分160から180拍ほどで、四つ打ちのバスドラムが土台になる。キックは少し歪んでいる。いちばん大事な要素は裏拍の単音で、この裏拍の単音が「bouncy」という呼び名に関わっている。

上に重ねる音には、とても分かりやすいメロディーが乗る。インストゥルメンタルか、短い反復サンプルが使われる。Simon Reynoldsは、そのリズムの組み合わせと編成を、クレズマー(東欧系ユダヤ人の音楽)や縁日風の旋律、ウンパッパの裏拍を思わせると評した。旋律には、ブレイクビーツ・ハードコアから取り入れたシンセサイザーのスタブが使われる。

歌はまれである。

曲の組み立ては、分かりやすさを最優先している。Scott Brownの曲では、8小節ずつの部品を決まった長さで並べる構成が見られる。

このスタイルは、ガバに似た、取っつきやすい形の音楽とされる。</p>
<h2>成り立ち</h2><p>1990年代前半、英国とオランダを中心に、レイヴ文化が大きく広がった。その中で、音楽はいくつもの方向へ枝分かれしていった。その流れの一つが、ガバに似た、取っつきやすい形のバウンシー・テクノである。

中心地となったのは、スコットランドとイングランド北部だった。スコットランドでは、エディンバラのRezerectionなど、数千人から1万人を超える大規模なレイヴが中心だった。

一方、オランダではこの音楽が「ハッピー・ハードコア」や「ハッピー・ガバ」「ファンコア」と呼ばれた。

制作は盛んだった。バウンシー・テクノと最も結びつけられるScott Brownは、1994年だけで10のレーベルから12インチ盤を27枚出し、自身のEvolution Recordsのもとで5つのレーベルを立ち上げた。オランダにも専門のレーベルがあった。

のちに、ウィガン、リヴァプール、ボルトンなどイングランド北西部の町で、1990年代後半から2000年代初頭にドンクが生まれた。ドンクは当初、スカウス・ハウスやバウンスと呼ばれた。バウンシー・テクノは、その源流の一つとなった。ただし、ドンクの起源には議論がある。

2000年代に入ると、再び注目される動きが出てきた。2004年には、RezerectionがグラスゴーのBarrowlandsで復活の催しを開いた。2011年には、KutskiがBBC Radio 1でセットを披露した。</p>
