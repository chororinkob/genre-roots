<h1>Bouncy Techno（バウンシーテクノ）とは</h1>
<p>跳ねるような低音を最大の特徴とする、高速で明るい電子舞曲である。テンポは一分間に150から170拍程度で、四つ打ちのバスドラムが土台になる。決定的な要素は各拍の裏に置かれるベースの音で、これが上向きに跳ね上がるように配置される。こ</p>
<p>跳ねるような低音を最大の特徴とする、高速で明るい電子舞曲である。テンポは一分間に150から170拍程度で、四つ打ちのバスドラムが土台になる。決定的な要素は各拍の裏に置かれるベースの音で、これが上向きに跳ね上がるように配置される。この裏拍の跳ね上がりが、踊り手の体を上下に弾ませる推進力を生む。低音の音色は歪ませた電子音で、短く切られて余韻を残さない。上物には極めて分かりやすい旋律が乗り、多くの場合は既存の流行歌から借りた節や、それを思わせる単純な音型が使われる。音色は明るく甲高い合成音が中心で、暗さや複雑さは意図的に避けられる。曲の構成は分かりやすさを最優先しており、盛り上げ、休止、爆発という順序が繰り返される。休止の区間ではバスドラムが完全に止まり、旋律だけが残ってから一気に全体が戻る。歌が入る場合は女性の高い声や、加工されたかけ声が用いられる。この様式は音楽的な革新よりも、その場にいる全員が即座に理解して跳ねられることを目的に設計されており、地域の若者文化と強く結びついた実用的な音楽として機能してきた。</p>
<h2>成り立ち</h2><p>1990年代前半、英国とオランダを中心にレイヴ文化が大きく広がったが、その過程で音楽は複数の方向へ分岐していった。実験的で暗い方向へ進んだ流れがある一方で、より単純で明るく、誰でもすぐ踊れる方向へ進んだ流れがあり、その一つがバウンシー・テクノである。中心地となったのはスコットランド、とりわけグラスゴーとその周辺の労働者階級の地域だった。この地域では大規模な催しよりも、地元の会館や小さなクラブでの集まりが中心で、参加者の年齢層も比較的低かった。音楽はその場で機能することを最優先に作られ、複雑さや洗練は求められなかった。スコットランドではこの音楽をめぐって独自の呼び名が生まれ、ハッピー・ハードコアやドンクといった隣接する様式と重なり合いながら発展した。とりわけドンクは、跳ねる低音の音色を極端に強調したもので、イングランド北部のボルトンやウィガンといった地域でも大きな支持を得た。制作の現場では、既存の流行歌の旋律を借りて高速の伴奏に乗せる手法が一般的だった。これは権利処理を経ずに行われることも多く、正規の流通に乗らない自主制作の盤や、複製された録音として広まった。この非公式性が、この音楽を主流の批評の対象から遠ざける一因にもなっている。実際、英国の音楽誌はこの領域を長らく無視するか、揶揄の対象として扱ってきた。背景には音楽的な評価だけでなく、階級的な偏見があったことが後年になって指摘されている。しかし地域の若者にとっては、自分たちの生活と直結した音楽として機能し続けた。土曜の夜に地元の会館へ行き、同じ町の顔見知りと跳ねるという体験そのものが、この音楽の内容だったといえる。2010年代以降、この種の音楽を階級的な偏見から擁護する批評的な再評価が進み、実験的な電子音楽の作り手が意識的に参照する例も増えている。スコットランドの若い世代が、親の世代の音楽として改めて取り上げる動きも生まれている。</p>
