<h1>Dubstep（ダブステップ）とは</h1>
<p>BPM138〜142前後、拍子は4分の4ながら、キックとスネアが1小節に2回だけ大きく着地する「ハーフタイム」の骨格を持つのが最大の特徴。実際のテンポは速いのに、体感は70前後のゆっくりした揺れになる。この隙間だらけの土台に、30</p>
<p>BPM138〜142前後、拍子は4分の4ながら、キックとスネアが1小節に2回だけ大きく着地する「ハーフタイム」の骨格を持つのが最大の特徴。実際のテンポは速いのに、体感は70前後のゆっくりした揺れになる。この隙間だらけの土台に、30〜60Hz付近のサブベース（耳で聴くより体で感じる超低音）が長く伸び、部屋の空気そのものを震わせる。ベース音はLFO（低周波発振器）でフィルターを揺らして「ワブ」と呼ばれるうねりを作ったり、リング変調で金属的にざらつかせたりと、旋律よりも質感で語る。上物は少なく、テープディレイやリバーブを深くかけた断片的なシンセ、逆再生音、レゲエのMCの声のサンプルなどが余白に散る。和声はマイナー、あるいはハーモニック・マイナー由来の異国的な響きが好まれる。構成は16小節の助走から一気に低音が落ちる「ドロップ」を軸にするが、初期のスタイルほど盛り上げより間の緊張を重んじる。ジャングルの高速さとも、ハウスの均等な4つ打ちとも違い、無音の使い方でグルーヴを作る点が独特で、大型のサウンドシステムで鳴らして初めて全貌が分かる音楽として設計されている。</p>
<h2>成り立ち</h2><p>1990年代末から2000年代初頭のロンドン南部、クロイドン周辺で、UKガラージの派生として生まれた。直接の温床はクロイドンのレコード店Big Apple Recordsで、店員や常連だったHatcha（Terry Leonard）、Skream（Oliver Jones）、Benga（Adegbenga Adejumo）、Artwork らが、当時主流だった陽気なガラージから歌とキラキラした上物を削ぎ落とし、低音と余白だけを残した実験的な盤を作り始めた。もう一つの拠点は西ロンドンのBig Apple系とは別系統のTempa、Ammunition Promotions、そしてクラブイベントFWD&gt;&gt;（Forward）で、ここでHorsepower Productions、El-B、Zed Bias らのダーク・ガラージが土台を敷いた。2003年にRinse FMやKiss FMでの放送を通じて名称が定着し、2005年にはロンドンのDMZ（Mala、Coki、Loefah、Sgt Pokes が主催）が始まり、「Come Meditate on Bass Weight（低音の重さを瞑想せよ）」という標語のもと、巨大なサウンドシステムで超低音を体感させる場が確立した。批評面ではジャーナリストのMartin Clark（Blackdown）やSimon Reynolds が早くから取り上げ、Rephlex Records が2004年に編集盤『Grime』を出したことで海外にも伝わった。転機は2006年、SkreamのMidnight Requestが広く知られ、翌年Bengaとの共作Night がクラブの定番となったこと、そしてBurial（William Bevan）が2006年のアルバムBurial、2007年のUntrue でダブステップを室内で聴く憂鬱な音楽として提示し、批評的な評価を決定づけたことである。2010年前後には米国でSkrillex らがより攻撃的な中音域の歪みを主軸に据えた「ブロステップ」として大衆化し、原型の静けさとは正反対の姿で世界的な商業的成功を収めた。この分裂は現在も続き、瞑想的な系統と激烈な系統が同じ名前を共有している。</p>
<h2>代表曲</h2><ul><li>Midnight Request Line (Skream)</li><li>Night (Benga &amp; Coki)</li><li>Scary Monsters and Nice Sprites (Skrillex)</li><li>Anti War Dub (Digital Mystikz)</li></ul>
