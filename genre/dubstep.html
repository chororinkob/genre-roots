<h1>Dubstep（ダブステップ）とは</h1>
<p>ダブステップは、低音と余白で聴かせる音楽だ。 中心になるのは低音である。この隙間だらけの土台に、目安として30〜60Hz付近のサブベース（耳で聴くより体で感じる超低音）が長く伸びる。部屋の空気そのものを震わせるほどだ。ベース音は、</p>
<p>ダブステップは、低音と余白で聴かせる音楽だ。

中心になるのは低音である。この隙間だらけの土台に、目安として30〜60Hz付近のサブベース（耳で聴くより体で感じる超低音）が長く伸びる。部屋の空気そのものを震わせるほどだ。ベース音は、一部の系統の特徴で、LFO（低周波発振器）でフィルターを揺らして「ワブ」と呼ばれるうねりを作る。リング変調（二つの音を掛け合わせて金属的な響きにする加工）でざらつかせることもある。旋律よりも質感で語る音楽だ。

和声はマイナー・キーまたはフリジアン・モードが多い。トライトーンなどの不協和音を含むこともある。

BPMは主に約140（132〜142）だ。拍子は4分の4だが、キックとスネアが1小節に2回だけ大きく着地する「ハーフタイム」の骨格を持つ。これが最大の特徴である。実際のテンポは速いのに、体感は70前後のゆっくりした揺れになる。

MCのスタイルはジャマイカのdeejay／toastingに由来し、ライブで重要な役割を担う。

構成は、16小節目または32小節目で一気に低音が落ちる「ドロップ」（山場）が来ることが多い。ただ、初期のスタイルほど、盛り上げより間の緊張を重んじる。

ジャングルの高速さとも、ハウスの均等な4つ打ちとも違う。無音の使い方でグルーヴ（ノリ）を作る点が独特だ。大型のサウンドシステムで鳴らして初めて全貌が分かる音楽として設計されている。</p>
<h2>成り立ち</h2><p>舞台は、1990年代末から2000年代初頭のロンドン南部、クロイドン周辺だ。ここでUKガラージの派生として、ダブステップが生まれた。

直接の温床は、クロイドンのレコード店Big Apple Recordsだった。店員や常連だったHatcha（Terry Leonard）、Skream（Oliver Jones）、Benga（Adegbenga Adejumo）、Artworkらが、実験的な盤を作り始めた。当時主流だった陽気なガラージから、歌とキラキラした上物を削ぎ落とし、低音と余白だけを残したものだ。

一方、Big Apple Recordsと密接に連携したTempa、Ammunition Promotions、そしてクラブイベントFWD&gt;&gt;（Forward）が、もう一つの拠点となった。Horsepower ProductionsやEl-Bらが1999〜2000年ごろに作ったダーク・ガラージが土台になった。

2002年ごろ、Big AppleやTempaなどが「ダブステップ」の語を使い始めた（Neil Jolliffeが2002年に命名したとされる。2001年初頭から表記は存在）。Rinse FMやKiss FMでの放送を通じて、名称が定着した。批評面では、ジャーナリストのMartin Clark（Blackdown）やSimon Reynoldsが早くから取り上げたと見られる。Rephlex Recordsが2004年に編集盤『Grime』を出したことで、海外にも伝わった。

2005年には、ロンドンでDMZが始まった。Mala、Coki、Loefah、Sgt Pokesが主催した。「Come Meditate on Bass Weight（低音の重さを瞑想せよ）」という標語のもと、巨大なサウンドシステムで超低音を体感させる場が定着した。

転機は、いくつか重なった。2005年、SkreamのMidnight Request Lineが発売されて広く知られた。2007年にはBengaとCokiの共作Nightがプロモ盤でクラブの定番となり、2008年2月にTempaから正式発売された。そしてBurial（William Bevan）が、2006年のアルバムBurialと2007年のUntrueで、ダブステップを室内で聴く憂鬱な音楽として提示した。これが批評的評価を高めた。

2010年前後には、英国発の硬質な系統が、米国でSkrillexらによって2010〜2011年ごろに大衆化した。より攻撃的な中音域の歪みを中心にした「ブロステップ」としてである。原型の静けさとは正反対の姿で、世界的な商業的成功を収めた。

この分裂は現在も続く。瞑想的な系統と激烈な系統が、同じ名前を共有している。</p>
