<h1>Mariachi（マリアッチ）とは</h1>
<p>メキシコを代表する楽団の様式である。編成が厳密に定まっており、複数のヴァイオリン、二本のトランペット、そして三種類の弦楽器から成る。弦楽器のうち、ビウエラは背面が丸く膨らんだ五弦の小型楽器で、和音を強く掻き鳴らしてリズムを刻む。グ</p>
<p>メキシコを代表する楽団の様式である。編成が厳密に定まっており、複数のヴァイオリン、二本のトランペット、そして三種類の弦楽器から成る。弦楽器のうち、ビウエラは背面が丸く膨らんだ五弦の小型楽器で、和音を強く掻き鳴らしてリズムを刻む。グイタロンは極めて大きな六弦の低音楽器で、コントラバスの役割を担いながら指ではじいて演奏される。この二つの組み合わせが、打楽器を持たないこの楽団の躍動を全て支えている。トランペットは20世紀に加えられたもので、力強い斉奏と、ヴァイオリンとの掛け合いを担う。リズムの特徴は、6/8拍子と3/4拍子を交互に、あるいは同時に感じさせる複合的な拍節にあり、この揺れがメキシコの舞踏音楽に共通する足取りを生む。演奏される曲種は多様で、速い舞曲、感傷的な歌、緩やかな恋愛歌などを含む。歌唱は複数の声を重ねた和音が基本で、感情の頂点では言葉ではない鋭い叫びが発せられる。この叫びは様式の一部として不可欠である。衣装も演奏と一体で、銀の飾りを施した騎馬民の正装と幅広の帽子が用いられる。</p>
<h2>成り立ち</h2><p>起源は19世紀のメキシコ西部、ハリスコ州の農村にある。当初は弦楽器だけの小規模な集団で、村の祭りや結婚式で演奏していた。この時期の編成にはハープが含まれ、トランペットは存在しなかった。この地方的な音楽が国家の象徴となった過程には、明確な政治的背景がある。1910年から始まったメキシコ革命の後、新しい政権は国民統合のための文化的な象徴を必要としていた。多様な民族と地域から成るこの国において、何を国民の文化とするかは政治的な選択だったのである。この文脈で、ハリスコ州の楽団が国民的な様式として選ばれ、大統領の公式の場で演奏されるようになった。1930年代、ラジオ放送の普及がさらに大きな変化をもたらす。放送局の要請により、遠くまで届く音を求めてトランペットが編成に加えられ、これが現在の標準となった。同じ時期、メキシコ映画の黄金期が到来する。Jorge NegreteやPedro Infanteといった俳優が、騎馬民の装いでこの音楽を歌う映画は、メキシコ国内のみならずラテンアメリカ全域とスペインで大人気となり、この様式を国際的なメキシコの記号として定着させた。楽団としては1898年に創設されたMariachi Vargas de Tecalitlánが最も重要で、編曲家Rubén Fuentesのもとで演奏の水準を飛躍的に高め、世界最良の楽団と称された。メキシコシティのガリバルディ広場は、楽団が客の依頼を待つ場所として今も機能している。2011年には国際連合の機関によって無形文化遺産に登録された。近年の重要な変化として、女性のみによる楽団が各地に生まれていることが挙げられる。男性の騎馬民の文化と結びついてきたこの様式において、女性が同じ装いで同じ楽器を演奏することは、伝統の内側からの静かな更新となっている。</p>
