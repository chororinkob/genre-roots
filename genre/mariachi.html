<h1>Mariachi（マリアッチ）とは</h1>
<p>マリアッチは、メキシコを代表する楽団のスタイルだ。編成は楽団の規模で変わり、ハープが入ることもある。 通常は、複数のヴァイオリン、2本のトランペット、そして3種類の弦楽器から成る。弦楽器は、ギター(ギターラ)、ビウエラ、ギタロンで</p>
<p>マリアッチは、メキシコを代表する楽団のスタイルだ。編成は楽団の規模で変わり、ハープが入ることもある。

通常は、複数のヴァイオリン、2本のトランペット、そして3種類の弦楽器から成る。弦楽器は、ギター(ギターラ)、ビウエラ、ギタロンである。ビウエラは、背面が丸く膨らんだ5弦の小型楽器だ。和音を強く掻き鳴らして、リズムを刻む。ギタロンは、極めて大きな6弦の低音楽器で、コントラバス（大型の弦楽器）の役割を担う。こちらは指ではじいて演奏される。この二つの組み合わせが、打楽器を持たないこの楽団のリズムとベースの中核を担っている。

トランペットは、20世紀に加えられたものだ。2本のトランペットが3度・6度などでハーモニーを付け、ヴァイオリンの旋律を補強し、掛け合う。

リズムの特徴として、son jaliscienseは3/4と6/8が交替する。演奏される曲種は多様で、速い舞曲、感傷的な歌、緩やかな恋愛歌などを含む。

歌唱は、全員が歌い、リードを交代で取る形が多い。感情の頂点では、言葉ではない鋭い叫びが発せられる。この叫び（grito）は、伝統の重要な要素の一つである。

衣装も演奏と一体だ。銀の飾りを施したチャロ（charro。馬に乗るメキシコの牧童・騎手）の正装と、幅広の帽子が用いられる。</p>
<h2>成り立ち</h2><p>語としては、1830年代の地名記録に見える。楽団への確実な言及は、1852年の司祭Cosme Santa Annaの書簡である。18世紀の起源は推定だ。発祥地はメキシコ西部（ハリスコ、ナヤリット、コリマ、ミチョアカンなど）で、特定できていない。

当初は、弦楽器だけの小規模な集団だった。村の祭りや結婚式で演奏していた。この時期の編成にはハープが含まれることもあり、トランペットは存在しなかった。

この地方的な音楽が国家のトレードマークとなった過程には、明確な政治的背景がある。1910年から始まったメキシコ革命の後、新しい政権は、国民統合のための文化的なトレードマークを必要としていた。多様な民族と地域から成るこの国で、何を国民の文化とするかは、政治的な選択でもあったと見られる。この文脈で、ハリスコ州の楽団が、国民的なスタイルとして選ばれていったとされる。革命前の1905年と1907年にも、Porfirio Díazの公的行事で演奏されていた。しかし革命後に、ナショナリズム（国民意識を高める考え方）のトレードマークとして広く採用される。Cárdenas政権（1934〜40年）が初めて公式に資金援助したとされる。

1930年代、ラジオ放送の普及がさらに大きな変化をもたらす。トランペットは、1913年にVargasで短期間導入された。1925年にはCirilo Marmolejoの楽団（Mariachi Coculense）でも試された。1930年代に定着し始め、1940年代に定着した。Vargasが常に使うようになったのは、1941年（1942年末とする資料もある）である。

同じ時期、メキシコ映画の黄金期が到来する。Jorge NegreteやPedro Infanteといった俳優が、チャロの装いでこの音楽を歌った。その映画はメキシコ国内で人気となり、このスタイルを国際的なメキシコの代名詞として定着させた。

楽団としては、Mariachi Vargas de Tecalitlánが最も重要だ。1890年代後半（1896〜1898年と出典により異なる）に創設された。編曲家Rubén Fuentesのもとで、演奏の水準を飛躍的に高め、世界最良の楽団と称された。メキシコシティのガリバルディ広場は、楽団が客の依頼を待つ場所として、今も機能している。2011年には、国際連合の機関によって無形文化遺産に登録された。

女性のみによる楽団は、1940年代（Carlota Noriega主宰のLas Coronelas）とする説がある。1950年前後には、Adelita y Su Mariachi de Muchachasなども活動し、いずれが最初かは資料により異なる。男性のチャロの文化と結びついてきたこのスタイルで、女性が同じ装いで同じ楽器を演奏することは、伝統の内側からの静かな更新となっている。</p>
