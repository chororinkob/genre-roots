<h1>Mariachi（マリアッチ）とは</h1>
<p>メキシコを代表する楽団の様式である。編成は楽団の規模で変わり、ハープが入ることもある。通常は、複数のヴァイオリン、2本のトランペット、そして3種類の弦楽器(ギター(ギターラ)、ビウエラ、ギタロン)から成る。弦楽器のうち、ビウエラは</p>
<p>メキシコを代表する楽団の様式である。編成は楽団の規模で変わり、ハープが入ることもある。通常は、複数のヴァイオリン、2本のトランペット、そして3種類の弦楽器(ギター(ギターラ)、ビウエラ、ギタロン)から成る。弦楽器のうち、ビウエラは背面が丸く膨らんだ5弦の小型楽器で、和音を強く掻き鳴らしてリズムを刻む。ギタロンは極めて大きな6弦の低音楽器で、コントラバス（大型の弦楽器）の役割を担いながら指ではじいて演奏される。この二つの組み合わせが、打楽器を持たないこの楽団のリズムとベースの中核を担っている。トランペットは20世紀に加えられたもので、2本が3度や6度の音程でハーモニーを付けてヴァイオリンの旋律を補強し、掛け合いを担う。リズムの特徴として、土台となるソン・ハリシエンセ（son jalisciense。ハリスコ地方の伝統的な舞曲）では、6/8拍子と3/4拍子が交替する複合的な拍節（拍の数え方が重なること）が現れる。演奏される曲種は多様で、速い舞曲、感傷的な歌、緩やかな恋愛歌などを含む。歌唱は、全員が歌ってよく、リードを交代で取ることが多く、感情の頂点では言葉ではない鋭い叫びが発せられる。この叫び（グリート。grito）は伝統の重要な要素の一つである。衣装も演奏と一体で、銀の飾りを施したチャロ（charro。馬に乗るメキシコの牧童・騎手）の正装と幅広の帽子が用いられる。</p>
<h2>成り立ち</h2><p>「マリアッチ」という語は1830年代の牧場の地名の記録（洗礼・埋葬・婚姻の記録）に見え、楽団への確実な言及は1852年の司祭の書簡からで、18世紀の起源は推定である。発祥地はメキシコ西部（ハリスコ、ナヤリット、コリマ、ミチョアカンなど）で、特定できていない。当初は弦楽器だけの小規模な集団で、村の祭りや結婚式で演奏していた。この時期の編成は地方によって異なり、ハリスコ南部やミチョアカンではハープが使われ、トランペットは存在しなかった。この地方的な音楽が国家の象徴となった過程には、明確な政治的背景がある。1910年から始まったメキシコ革命の後、新しい政権は国民統合のための文化的な象徴を必要としていた。多様な民族と地域から成るこの国において、何を国民の文化とするかは政治的な選択だったのである。この文脈で、ハリスコ州の楽団がラジオ・映画・レコードを通じて国民的な様式として広まったと解釈されている。革命前の1905年と1907年にもPorfirio Díazの公的行事で演奏されていたが、革命後にナショナリズム（国民意識を高める考え方）の象徴として広く採用され、Cárdenas政権（1934〜40年）が初めて公式に資金援助したとされる。1930年代、ラジオ放送の普及がさらに大きな変化をもたらす。トランペットは1913年にVargasで短期間導入され（コルネットだったと読める資料もある）、1925年にCirilo Marmolejoの楽団（Mariachi Coculense）でも試され（甥のJosé Marmolejoの楽団を最初とする資料もある）、1930年代にはまだ少数派で議論の的にもなったが、1940年代にかけて定着した。Vargasが常に使うようになったのは1941年（1942年末とする資料もある）である。同じ時期、メキシコ映画の黄金期が到来する。Jorge NegreteやPedro Infanteといった俳優が、チャロの装いでこの音楽を歌う映画は、メキシコ国内で人気となり、この様式を国際的なメキシコの象徴として定着させた。楽団としては1890年代後半（1896〜1898年と出典により異なる）に創設されたMariachi Vargas de Tecalitlánが最も重要で、編曲家Rubén Fuentesのもとで演奏の水準を飛躍的に高め、「世界最良のマリアッチ」という称号は、レコード会社RCAの芸術監督だったFuentes自身が付けたもので、楽団自身も名乗っている。メキシコシティのガリバルディ広場は、楽団が客の依頼を待つ場所として今も機能している。2011年には国際連合の機関によって無形文化遺産に登録された。女性のみによる楽団は、1940年代（Carlota Noriega主宰のLas Coronelas）とする説がある。1948年ごろからAdelita y Su Mariachi de Muchachas（Las Adelitas）なども活動し、いずれが最初かは資料により異なる（博士論文はLas Coronelasを1955〜1972年としている）。男性のチャロの文化と結びついてきたこの様式において、女性が女性版の装い（ズボンの代わりにスカート）で同じ楽器を演奏することは、伝統の内側からの静かな更新となっている。</p>
