<h1>Mood Kayōとは</h1>
<p>1950年代後半から1960年代の日本で流行した、都会の夜と大人の恋愛を主題とする歌謡曲の一系統。演歌が農村的・情念的なこぶしを核とするのに対し、ムード歌謡は舶来のダンス音楽、とりわけラテン、ジャズ、ハワイアン、タンゴの語法を土台</p>
<p>1950年代後半から1960年代の日本で流行した、都会の夜と大人の恋愛を主題とする歌謡曲の一系統。演歌が農村的・情念的なこぶしを核とするのに対し、ムード歌謡は舶来のダンス音楽、とりわけラテン、ジャズ、ハワイアン、タンゴの語法を土台に据える。編成にはスチールギター、ヴィブラフォン、ハモンドオルガン、マラカスやボンゴといったラテン打楽器、サックスの合いの手が並び、ギターはトレモロを深くかけた甘い音色で伴奏する。リズムはルンバ、ボレロ、マンボ、チャチャチャ、スローロックが多く、テンポは遅めで、拍の裏を強調するクラーベ系のパターンが下敷きになる。和声は歌謡曲としては複雑で、セブンスやディミニッシュを織り込んだ進行が使われる。歌唱は男声コーラスグループによる甘い和音の重なりが特徴で、主旋律の背後で伸ばされるハーモニーが全体を包む。歌詞は銀座、有楽町、長崎、横浜といった実在の盛り場の地名を織り込み、酒場での別れ、人妻との情事、港での見送りといった成人男性の感傷を描く。演歌ほど泣かず、フォークほど日常的でない、都市の夜の情緒を職業作家が整えた音楽である。</p>
<h2>成り立ち</h2><p>戦後日本の都市文化と、進駐軍がもたらした西洋音楽の受容の中から生まれた。1945年以降、米軍のキャンプで演奏していた日本人ミュージシャンたちがジャズ、ラテン、ハワイアンを実地で身につけ、彼らが1950年代に日本のレコード産業へ流れ込んだことが土台となった。1955年頃からナイトクラブやキャバレーの生バンドが伴奏する歌謡曲が増え、1957年にフランク永井が歌った「有楽町で逢いましょう」(作詞・佐伯孝夫、作曲・吉田正)が大ヒットする。吉田正はこの路線の中心的な作曲家で、都会的で洗練された旋律を大量に書き、その一群はやがてムード歌謡と呼ばれるようになった。1960年代に入ると専属の男声コーラスグループが主役の座に就く。1959年に和田弘とマヒナスターズが松尾和子とのデュエット「誰よりも君を愛す」を発表して翌年の日本レコード大賞を受賞し、1966年には黒沢明とロス・プリモスの「ラブユー東京」、1969年には内山田洋とクール・ファイブの「長崎は今日も雨だった」が、いずれも桁違いの売り上げを記録した。クール・ファイブの前川清が持つ鼻に抜ける独特の高音は、この分野の声の代名詞となった。石原裕次郎、青江三奈らも重要な担い手で、青江三奈の「伊勢佐木町ブルース」(1968)は冒頭の吐息で知られる。背景には高度経済成長があり、地方から都市へ出てきた勤め人が接待や慰労で通うキャバレー・クラブが全国に急増したことが、この音楽の需要を支えた。1970年代にフォークとニューミュージックが台頭し、1980年代にキャバレー文化が衰退すると新曲の生産は止まり、ムード歌謡はスナックのカラオケと懐メロ番組の中に生き残る形となった。近年は昭和歌謡の再評価やシティポップ人気の周辺で、その洗練された編曲が改めて注目されている。</p>
<h2>代表曲</h2><ul><li>有楽町で逢いましょう (フランク永井)</li><li>別れても好きな人 (ロス・インディオス&amp;シルヴィア)</li><li>夜霧よ今夜も有難う (石原裕次郎)</li></ul>
