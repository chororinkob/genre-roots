<h1>Mood Kayōとは</h1>
<p>ムード歌謡は、都会の夜と大人の恋愛を主題とする、歌謡曲の一系統だ。昭和30〜40年代（1955〜74年頃）を中心に、日本で流行した。演歌と混同されることも多いが、吉田正らの路線は「都会派」と呼ばれる。 ムード歌謡は、従来の日本の大</p>
<p>ムード歌謡は、都会の夜と大人の恋愛を主題とする、歌謡曲の一系統だ。昭和30〜40年代（1955〜74年頃）を中心に、日本で流行した。演歌と混同されることも多いが、吉田正らの路線は「都会派」と呼ばれる。

ムード歌謡は、従来の日本の大衆音楽に、ラテンやハワイアン、ジャズなど、海外から入ってきたダンス音楽の要素を取り入れたものである。編成にはスチールギターなどが使われる。

歌い方では、男声ムード・コーラス(和田弘とマヒナスターズなどのハワイアン系、ロス・インディオスなどのラテン系)が代表的な形の一つだ。低音で声を張り上げない歌い方が特徴とされる。ソロ歌手も中心にいて、フランク永井や青江三奈などが挙げられる。

歌詞には、銀座、有楽町、長崎、横浜といった実在の盛り場の地名が織り込まれる。ナイトクラブや酒場などのネオン街を舞台に、大人の男女の恋愛を描く。女性視点の女言葉で歌われる曲も多い。

演歌ほど泣かず、フォークほど日常的でもない。そんな都会の夜の雰囲気を、プロの作家が仕立てた音楽だという見方もある。</p>
<h2>成り立ち</h2><p>戦後、進駐軍相手のバンドが、銀座・赤坂のナイトクラブで演奏を始めた。これがムード歌謡の始まりとされる。ただし、戦前の先駆とする見方もあり、定義は一定しない。

1945年以降、米軍のキャンプで演奏していた日本人ミュージシャンたちは、ジャズ、ラテン、ハワイアンを現場で身につけた。彼らが1950年代に日本のレコード産業へ流れ込んだことが、土台となった。

1950年代からは、ナイトクラブやキャバレーの生バンドが伴奏する歌謡曲が増えた。そして1957年、フランク永井が歌った「有楽町で逢いましょう」(作詞・佐伯孝夫、作曲・吉田正)が大ヒットする。吉田正はこの路線の中心になった作曲家だ。都会的で洗練されたメロディーをたくさん書き、その一群はやがてムード歌謡と呼ばれるようになった。

1960年代に入ると、専属の男声コーラスグループが主役になる。1959年に和田弘とマヒナスターズが、松尾和子とのデュエット「誰よりも君を愛す」を発表し、翌年の日本レコード大賞を受賞した。1966年には黒沢明とロス・プリモスの「ラブユー東京」、1969年には内山田洋とクール・ファイブの「長崎は今日も雨だった」が出た。「ラブユー東京」は累計で通算250万枚に達するとされ、「長崎は今日も雨だった」は累計約150万枚とされる。内山田洋とクール・ファイブは、ハワイアン系にもラテン系にも属さないソウル／R&amp;B系の、異色の存在とされる。青江三奈らも重要な担い手で、青江三奈の「伊勢佐木町ブルース」(1968)は曲中の吐息で知られる。

高度経済成長期の昭和30〜40年代には、キャバレーが最も数を増やし、企業の接待に使われた。

しかし1970年代になると、フォークとニューミュージックが人気を集める。キャバレーやナイトクラブの衰退とカラオケの普及で、ジャンルは衰退に向かった。それでも、1975年発売の「別れても好きな人」を男女デュエットに編曲し直したロス・インディオス&amp;シルヴィア盤（1979年）が、1980年の年間8位となった。ムード歌謡は、小規模なスナックで客自身が歌うカラオケの中に生き残る形となった。</p>
<h2>代表曲</h2><ul><li>星降る街角 (敏いとうとハッピー&amp;ブルー)</li><li>有楽町で逢いましょう (フランク永井)</li><li>別れても好きな人 (ロス・インディオス&amp;シルヴィア)</li><li>宗右衛門町ブルース (平和勝次とダークホース)</li><li>長崎は今日も雨だった (内山田洋とクール・ファイブ)</li><li>コモエスタ赤坂 (ロス・インディオス)</li><li>女のみち (宮史郎とぴんからトリオ)</li><li>夜霧よ今夜も有難う (石原裕次郎)</li><li>そして、神戸 (内山田洋とクール・ファイブ)</li><li>ラブユー東京 (黒沢明とロス・プリモス)</li><li>小樽のひとよ (鶴岡雅義と東京ロマンチカ)</li><li>東京ナイト・クラブ (フランク永井・松尾和子)</li></ul>
