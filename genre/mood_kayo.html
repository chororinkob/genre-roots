<h1>Mood Kayōとは</h1>
<p>1950年代後半から1960年代の日本で流行した、都会の夜と大人の恋愛を主題とする歌謡曲の一系統。演歌よりも都会的な歌として位置づけられるムード歌謡は、従来の日本の大衆音楽に、ラテンやハワイアン、ジャズなどの海外から入ってきたダン</p>
<p>1950年代後半から1960年代の日本で流行した、都会の夜と大人の恋愛を主題とする歌謡曲の一系統。演歌よりも都会的な歌として位置づけられるムード歌謡は、従来の日本の大衆音楽に、ラテンやハワイアン、ジャズなどの海外から入ってきたダンス音楽の要素を取り入れたものである。編成にはスチールギターなどが用いられる。リズムはルンバ、ボレロ、マンボ、チャチャチャ、スローロックなどが使われる。和音は歌謡曲としては複雑で、セブンスやディミニッシュといった和音を織り込んだ流れが使われる。歌い方は、男声ムード・コーラス(和田弘とマヒナスターズなどのハワイアン系、ロス・インディオスなどのラテン系)が代表的な一形態で、主なメロディーの後ろで伸ばされる、甘い和音の重なりが特徴となる。ソロ歌手も中心にいて、フランク永井や青江三奈などが挙げられる。歌詞は銀座、有楽町、長崎、横浜といった実在の盛り場の地名を織り込み、酒場での別れ、人妻との情事、港での見送りといった成人男性の感傷を描く。演歌ほど泣かず、フォークほど日常的でない、都会の夜の雰囲気を、プロの作家が仕立てた音楽である。</p>
<h2>成り立ち</h2><p>戦後日本の都市文化と、進駐軍がもたらした西洋音楽を受け入れる中から生まれた。1945年以降、米軍のキャンプで演奏していた日本人ミュージシャンたちがジャズ、ラテン、ハワイアンを実地で身につけ、彼らが1950年代に日本のレコード産業へ流れ込んだことが土台となった。1955年頃からナイトクラブやキャバレーの生バンドが伴奏する歌謡曲が増え、1957年にフランク永井が歌った「有楽町で逢いましょう」(作詞・佐伯孝夫、作曲・吉田正)が大ヒットする。吉田正はこの路線の中心的な作曲家で、都会的で洗練されたメロディーをたくさん書き、その一群はやがてムード歌謡と呼ばれるようになった。1960年代に入ると専属の男声コーラスグループが主役の座に就く。1959年に和田弘とマヒナスターズが松尾和子とのデュエット「誰よりも君を愛す」を発表して翌年の日本レコード大賞を受賞し、1966年には黒沢明とロス・プリモスの「ラブユー東京」、1969年には内山田洋とクール・ファイブの「長崎は今日も雨だった」が、いずれも桁外れの売り上げを記録した。内山田洋とクール・ファイブは、ハワイアン系にもラテン系にも属さないソウル系の、異色の存在とされる。青江三奈らも重要な担い手で、青江三奈の「伊勢佐木町ブルース」(1968)は曲中の吐息で知られる。背景には高度経済成長があり、地方から都市へ出てきた勤め人が接待や慰労で通うキャバレー・クラブが全国に急増したことが、この音楽の需要を支えた。1970年代にフォークとニューミュージックが台頭し、キャバレーやナイトクラブの衰退とカラオケの普及でジャンルは衰退に向かったが、新曲は出続けた(ロス・インディオスの「別れても好きな人」(1979年)は1980年度のオリコン年間8位)。ムード歌謡はスナックのカラオケと懐メロ番組の中に生き残る形となった。近年は昭和歌謡の再評価やシティポップ人気の周辺で、その洗練された編曲があらためて注目されている。</p>
<h2>代表曲</h2><ul><li>星降る街角 (敏いとうとハッピー&amp;ブルー)</li><li>有楽町で逢いましょう (フランク永井)</li><li>別れても好きな人 (ロス・インディオス&amp;シルヴィア)</li><li>宗右衛門町ブルース (平和勝次とダークホース)</li><li>長崎は今日も雨だった (内山田洋とクール・ファイブ)</li><li>コモエスタ赤坂 (ロス・インディオス)</li><li>女のみち (宮史郎とぴんからトリオ)</li><li>夜霧よ今夜も有難う (石原裕次郎)</li><li>そして、神戸 (内山田洋とクール・ファイブ)</li><li>ラブユー東京 (黒沢明とロス・プリモス)</li><li>小樽のひとよ (鶴岡雅義と東京ロマンチカ)</li><li>東京ナイト・クラブ (フランク永井・松尾和子)</li></ul>
