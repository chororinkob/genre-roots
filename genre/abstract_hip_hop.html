<h1>Abstract Hip Hop（アブストラクトヒップホップ）とは</h1>
<p>ヒップホップの形式は保ちつつ、その中で当然とされてきた要素を、意図的に外していく。実験的な作品の一群である。 音の面では、ソウルやジャズ、ファンクの素材を使い、歪めたり断片化したりする作り手が多い。居心地の悪い素材や雑音を用いる例</p>
<p>ヒップホップの形式は保ちつつ、その中で当然とされてきた要素を、意図的に外していく。実験的な作品の一群である。

音の面では、ソウルやジャズ、ファンクの素材を使い、歪めたり断片化したりする作り手が多い。居心地の悪い素材や雑音を用いる例もある。

同じ音型の繰り返しも、心地よい位置には置かない。あえて不安定な拍に置く場合が多い。低音は輪郭を曖昧にする。ドラムは音量を抑え、全体の霞の中に沈める場合もある。

発声も、聴衆を煽る抑揚を捨てる。呟く、早口で捲し立てる、拍を大きく無視して字余りのまま押し込む。そんな扱いにくい形が選ばれる。

歌詞は、物語や自己紹介から離れる。断片的な連想や造語、脈絡の無い比喩を連ねて書かれ、意味を追おうとしても最後まで像を結ばない傾向がある。

曲はフックや合唱部分を省く傾向がある。曲の構成も、積み上げ型でも起承転結でもなく、断片を単に並べた形に近い。踊るためでも、共感するためでもない。聴きながら考えさせるために作られる傾向がある。</p>
<h2>成り立ち</h2><p>Abstract Hip Hopという呼び名は、一般に実験的なヒップホップと重なる言葉として使われる。その実験的なヒップホップは、1980年代から1990年代初頭にかけて現れた。この流れは、1990年代を通じて形作られていった。

当時のヒップホップは、1990年代半ばに最も売れる音楽ジャンルのひとつになっていた。1998年には、米国でラップの売上がカントリーを初めて上回った（約8,100万枚対約7,200万枚）。大手レコード会社が主導する、売れる型が固まりつつあった。

1990年代半ば以降、同じ道具立てで全く違うことをする作り手の受け皿になったのが、Rawkus Records、Anticon、Definitive Juxなどの独立系レーベルだ。

1996年、カリフォルニアのDJ ShadowがEndtroducing.....を発表した。ほぼ全編をレコードからのサンプルで組み立てた作品で、ギネス世界記録は、サンプルのみで作られた最初のアルバムと認定している。音楽誌から大きな注目を集め、ラップのない器楽のヒップホップという可能性を示した。

翌1997年には、ニューヨークのCompany Flowが、Rawkus Recordsから独立性を強く打ち出す作品を出した。中心人物のEl-Pは、1999年にAmaechi UzoigweとDefinitive Juxを共同で設立し、この方向の受け入れ先を作った。レーベルは当初Def Juxと呼ばれていた。しかし2001年にDef Jamから名称が似ていると訴えられ、示談のうえでDefinitive Juxに改めた。

西海岸のオークランドでは、1998年にAnticonという共同体が立ち上がった。Doseoneをはじめとする作り手たちが、詩の朗読やインディーロックの感性をヒップホップに持ち込んだ。Anticonの創設メンバーの一人であるDoseoneと、Why?、Odd Nosdamの3人によるグループがcLOUDDEADだ。起点はシンシナティである。彼らが2001年に出した作品は、10インチのシングル6枚をまとめたものだ。ラップと呼ぶには浮遊しすぎた質感を持ち、2014年には音楽誌から「北米ヒップホップ・アンダーグラウンドの重要な試金石」と評された。

カリフォルニア州オックスナード出身のOtis Jacksonは、マッドリブの名義で、別人格のQuasimotoを名乗った。ゆっくり録音して速度を上げた甲高い声のLord Quasが、本人のふだんの声と掛け合いながら進む作品を作った。なお彼は、ロサンゼルス郡アルタデナにあった自宅を、2025年の山火事で失っている。

イギリス生まれでニューヨーク育ちのDaniel Dumileは、1990年代前半にある集団で活動していた。しかしその集団は、弟の死とレコード会社との断絶によって崩れてしまう。彼は数年間姿を消した。そして1997〜98年ごろ、タイツで顔を隠したフリースタイルから、別人格のMF DOOMを生み出した。のちに仮面をつけて再び現れる。複雑に韻を重ねる書き方と、漫画やテレビの音声を多用する制作は、その後の世代に広く影響を与えたとされる。

ただし、この分野には固有の緊張もあった。Anticonは白人の移住者が中心で、地元で急速に存在感を高めたため、反発が人種的な色を帯びた。

それでも2010年代以降、実験的なラップは電子音楽やノイズとつながりながら、世界各地で作られ続けている。</p>
