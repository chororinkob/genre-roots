<h1>Abstract Hip Hop（アブストラクトヒップホップ）とは</h1>
<p>ヒップホップの形式を保ちながら、その中で当然とされてきた要素を意図的に外していく実験的な一群である。まず歌詞が物語や自己紹介から離れ、断片的な連想、造語、脈絡を欠いた比喩の連鎖として書かれ、意味を追おうとしても最後まで像を結ばない</p>
<p>ヒップホップの形式を保ちながら、その中で当然とされてきた要素を意図的に外していく実験的な一群である。まず歌詞が物語や自己紹介から離れ、断片的な連想、造語、脈絡を欠いた比喩の連鎖として書かれ、意味を追おうとしても最後まで像を結ばない。発声も、聴衆を煽る抑揚を捨て、呟く、早口で捲し立てる、拍を大きく無視して字余りのまま押し込むといった扱いにくい形が選ばれる。音の側では、ソウルやジャズ、ファンクの素材を使いつつ、歪めたり断片化したりする作り手が多く、居心地の悪い素材や雑音が用いられることもある。同じ音型の反復も、快感を与える位置ではなく、あえて不安定な拍に置かれることが多い。低音は輪郭を曖昧にし、ドラムは音量を抑えて全体の霞の中に沈められる場合もある。曲はフックや合唱部分を省くものも多く、構成は積み上げでも起承転結でもなく、断章の並置に近い。踊るためでも共感するためでもなく、聴きながら考えさせるために作られるものが多い。</p>
<h2>成り立ち</h2><p>実験的なヒップホップは1980年代から1990年代初頭に現れ、1990年代にかけて形成された傾向である。ヒップホップは1990年代半ばに最も売れる音楽ジャンルのひとつとなり、1999年には最も売れるジャンルになり、大手レコード会社が主導する売れる型が固まりつつあった。その反動として、同じ道具立てで全く違うことをする作り手が各地に現れる。1996年、カリフォルニアのDJ Shadowが発表したエンドトロデューシングは、ほぼ全編をレコードからのサンプルで構成した作品(ギネス世界記録が、全編サンプルで作られた最初のアルバムと認定)として、音楽誌から大きな注目を集め、ラップのない器楽ヒップホップという可能性を提示した。翌1997年にはニューヨークのCompany Flowが、Rawkus Recordsから独立性を強く主張する作品を発表し、中心人物のEl-Pは1999年にAmaechi UzoigweとDefinitive Jux(当初はDef Juxと呼ばれ、のちに改称したとされる)を共同設立して、この方向の受け皿を作った。西海岸のオークランドでは1998年にAnticonという共同体が立ち上がり、Doseoneをはじめとする作り手が、詩の朗読やインディーロックの感性をヒップホップへ持ち込む。Anticonの中心メンバーであるDoseone、Why?、Odd Nosdamの3人によるグループcLOUDDEAD(起点はシンシナティ)が2001年に発表した、10インチのシングル6枚をまとめた作品は、ラップと呼ぶには浮遊しすぎた質感で、この分野の到達点のひとつとされる。カリフォルニア州オックスナード出身(現在の拠点はロサンゼルスとされる)のOtis Jacksonは、マッドリブの名義で別人格のQuasimotoを名乗り、ゆっくり録音して速度を上げた甲高い声のLord Quasが、本人の通常の声と掛け合う形で進む作品を作った。最も神話的な存在となったのはMF DOOMである。イギリス生まれニューヨーク育ちのDaniel Dumileは、1990年代前半に活動していた集団が弟の死とレコード会社との断絶によって崩壊した後、数年間姿を消し、1997〜98年ごろにタイツで顔を隠したフリースタイルから別人格のMF DOOMを作り、のちに仮面を採用して再登場した。彼の複雑に韻を重ねる文体と、漫画やテレビの音声を多用する制作は、その後の世代に絶大な影響を残した。ただしこの分野には固有の緊張もある。Anticonは白人の移住者が中心だったことから、地元で人種的な色合いのある反発が起きた。それでも2010年代以降、実験的なラップは電子音楽やノイズと接続しながら世界各地で作られ続けている。</p>
