<h1>Abstract Hip Hop（アブストラクトヒップホップ）とは</h1>
<p>ヒップホップの形式を保ちながら、その中で当然とされてきた要素を意図的に外していく実験的な一群である。まず歌詞が物語や自己紹介から離れ、断片的な連想、造語、脈絡を欠いた比喩の連鎖として書かれ、意味を追おうとしても最後まで像を結ばない</p>
<p>ヒップホップの形式を保ちながら、その中で当然とされてきた要素を意図的に外していく実験的な一群である。まず歌詞が物語や自己紹介から離れ、断片的な連想、造語、脈絡を欠いた比喩の連鎖として書かれ、意味を追おうとしても最後まで像を結ばない。発声も、聴衆を煽る抑揚を捨て、呟く、早口で捲し立てる、拍を大きく無視して字余りのまま押し込むといった扱いにくい形が選ばれる。音の側では、ソウルやファンクの心地よい断片ではなく、現代音楽の不協和音、古い教育映画の音声、機械の駆動音、劣化したレコードの雑音といった居心地の悪い素材が用いられる。同じ音型の反復も、快感を与える位置ではなく、あえて不安定な拍に置かれることが多い。低音は輪郭を曖昧にし、ドラムは音量を抑えて全体の霞の中に沈められる場合もある。曲は繰り返しの合唱部分を持たないことが普通で、構成は積み上げでも起承転結でもなく、断章の並置に近い。踊るためでも共感するためでもなく、聴きながら考えさせるために作られている点が、この分野の一貫した性格である。</p>
<h2>成り立ち</h2><p>1990年代半ば、アメリカのヒップホップは商業的な頂点に達し、大手レコード会社が主導する売れる型が固まりつつあった。その反動として、同じ道具立てで全く違うことをする作り手が各地に現れる。1996年、カリフォルニアのDJ Shadowが発表したエントロデューシングは、全ての音を中古レコード店で掘り出した既成の音源だけで構成した作品として、音楽誌から大きな注目を集め、ラップのない器楽ヒップホップという可能性を提示した。翌1997年にはニューヨークのCompany Flowが、Rawkus Recordsから独立性を強く主張する作品を発表し、中心人物のEl-Pは1999年に自らDefinitive Jux(通称Def Jux)を設立して、この方向の受け皿を作った。西海岸のオークランドでは1998年にAnticonという共同体が立ち上がり、Doseoneをはじめとする作り手が、詩の朗読やインディーロックの感性をヒップホップへ持ち込む。彼らが2001年に発表したcLOUDDEAD名義の作品は、ラップと呼ぶには浮遊しすぎた質感で、この分野の到達点のひとつとされる。ロサンゼルスではOtis Jacksonがマッドリブの名義で、別人格のQuasimotoを名乗り、テープの回転数を上げた甲高い声で全編を通すという奇策を実行した。最も神話的な存在となったのはMF DOOMである。イギリス生まれニューヨーク育ちのDaniel Dumileは、1990年代前半に活動していた集団が弟の死とレコード会社との断絶によって崩壊した後、数年間姿を消し、金属の仮面をかぶって別人格として再登場した。彼の複雑に韻を重ねる文体と、漫画やテレビの音声を多用する制作は、その後の世代に絶大な影響を残した。ただしこの分野には固有の緊張もある。難解さや白人の聴衆に偏った受容が、黒人の音楽を白人の批評家が理想化しているという批判を招き、独立系ヒップホップという枠組みそのものが人種と階級の線引きと結びついているという指摘は今も続いている。それでも2010年代以降、実験的なラップは電子音楽やノイズと接続しながら世界各地で作られ続けている。</p>
