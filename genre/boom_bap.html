<h1>Boom Bap（ブームバップ）とは</h1>
<p>ブーン・バップは、1980年代後半から1990年代にかけて栄えた、ニューヨーク型のヒップホップだ。キックのブーンという胴鳴りと、スネアのバップという乾いた炸裂が交互に鳴る。その擬音（音をまねた言葉）が、そのまま名前になった。 テン</p>
<p>ブーン・バップは、1980年代後半から1990年代にかけて栄えた、ニューヨーク型のヒップホップだ。キックのブーンという胴鳴りと、スネアのバップという乾いた炸裂が交互に鳴る。その擬音（音をまねた言葉）が、そのまま名前になった。

テンポは、制作者向け解説ではおおむね85〜95BPMとされる。ゆっくり歩く速度で、どっしり進む。

ドラムは、古いソウルやジャズのレコードから一打ずつ抜き出したサンプルで組まれる。E-mu SP-1200やAkai MPC60といった、12ビット（古い録音機器の音の細かさ）のサンプラー（音を録音して取り込む機械）を通すと、SP-1200では高音が落ちる。そこから、独特のざらついた粒立ちが生まれる。ループは一般に2小節から4小節と短い。切れ目には、継ぎ目の段差をあえて残す。

上物（メロディーなど上に重ねる音）は、ジャズやソウルのホーン、ピアノ、ベースラインなどの断片を、数秒だけ切り取って回す。曲間や合間には、スクラッチによる声のフレーズが刺さる。DJの存在が、音として残されている。

ラップは、拍の裏に食い込む複雑な譜割り（言葉をリズムに乗せる割り振り方）が特徴だ。行の中で何度も韻を重ねる多重押韻も発達した。内容は、街の描写、技量の誇示、社会批評、私生活の告白まで幅広い。

同じ時期の西海岸のGファンクは、伸びやかなシンセと生ベースで空を開く。それに対し、こちらは音の中域を詰める。暗く狭い部屋に閉じ込めたような密度で鳴らす。</p>
<h2>成り立ち</h2><p>記録に残る最古級の用例は、1984年のT La Rock『It's Yours』のアドリブ（即興の一言）だ。KRS-OneとDiamond Dも、それが初めて聞いた例だったと述べている。ただし、それ以前から俗語として使われていたとの証言もある。

ジャンル名が広まるきっかけの一つとされるのは、KRS-Oneが1993年のソロ作『Return of the Boom Bap』の題名にしたことである。ただし、音そのものはそれ以前から成立していた。

1980年代前半から半ばにかけて、Marley Marlが(本人の回想では)スタジオでの偶然から、スネアのサンプリング（既存の録音の取り込み）を発見した。彼はドラムを一打ずつサンプリングする手法を広め、クイーンズブリッジを拠点に制作した。さらにEric B. and Rakimの『Paid in Full』(1987)で、Rakimが拍から自由に離れる譜割りを持ち込んだ。これらが土台になった。

決定的だったのは、1992年から94年である。Gang Starrの相方DJ Premierは、上物（メロディーなど上に重ねる音）を細かく切り刻んで、別の順序で並べ直す手法を得意とした。レコードから抜いた声を刺すスクラッチ（レコードを手で動かして鳴らす技）のスタイルも、同じく得意とした。Pete RockはCL Smoothとの『T.R.O.Y.』(1992)で、亡くなった友人へ捧げるサックスの断片を敷いた。こうして、感傷とサンプリングを結びつけた。

Wu-Tang Clanの『Enter the Wu-Tang』(1993)では、RZAがソウルのサンプルとカンフー映画の音声を、安価な機材で処理した。それで荒れた質感を作った。Nasの『Illmatic』(1994)は、DJ Premier、Pete Rock、Q-Tip、Large Professor、L.E.S.といった当代の職人を集めた10曲である。このスタイルの代表作とされる。

The Notorious B.I.G.の『Ready to Die』(1994)は、DJ Premierが『Unbelievable』を制作した。Pete Rockは『Juicy』の原曲ビートを自分が作ったと主張している(クレジットはなし、リミックスを担当)。また、Sean &quot;Puffy&quot; Combs(のち Puff Daddy)周辺の商業的な曲も多く、商業的な大成功を収めた。

背景には、クラック・コカインの流行と警察の取り締まりに揺れたニューヨークの街があった。ラジオ局WBLSの「Rap Attack」、WKCRの深夜番組(ストレッチ・アンド・ボビート)といった発信の場もあった。

1991年のGrand Upright v. Warner Bros.判決で、無許諾サンプリングが侵害と明示された。許諾と費用負担が重くなった。短い断片でも許諾が必要という規則は、2005年のBridgeport判決で示された。

ブーン・バップは主流の座を降りたが（著作権の厳格化でサンプリングが難しくなったことなどが背景とされる）、2010年代以降はJoey Bada$$やGriseldaら若い世代が意図的に選び直すスタイルとして復活している。</p>
