<h1>Boom Bap（ブームバップ）とは</h1>
<p>キックのブーンという胴鳴りと、スネアのバップという乾いた炸裂が交互に鳴る、その擬音がそのまま名前になった1990年代のニューヨーク型ヒップホップ。テンポは毎分85から95拍あたりに集中し、ゆっくり歩く速度でどっしり進む。ドラムは古</p>
<p>キックのブーンという胴鳴りと、スネアのバップという乾いた炸裂が交互に鳴る、その擬音がそのまま名前になった1990年代のニューヨーク型ヒップホップ。テンポは毎分85から95拍あたりに集中し、ゆっくり歩く速度でどっしり進む。ドラムは古いソウルやジャズのレコードから一打ずつ抜き出したサンプルで組まれ、E-mu SP-1200やAkai MPC60といった12ビットのサンプラーを通すことで高音が削られ、独特のざらついた粒立ちが生まれる。ループは二小節から四小節と短く、切れ目に継ぎ目の段差をあえて残す。ベースは太いウッドベースの断片か、シンセの短い低音で下支えし、上物はジャズのホーンやローズピアノ、映画音楽の弦を数秒だけ切り取って回す。曲間や合間にはスクラッチによる声のフレーズが刺さり、DJの存在が音として残されている。ラップは拍の裏に食い込む複雑な譜割りと、行内で何度も韻を重ねる多重押韻が発達し、内容は街の描写、技量の誇示、社会批評、私生活の告白まで幅広い。同時期の西海岸のGファンクが伸びやかなシンセと生ベースで明るく空を開くのに対し、こちらは音の中域を詰め、暗く狭い部屋に閉じ込めたような密度で鳴らす。</p>
<h2>成り立ち</h2><p>名称の直接の出所はKRS-Oneで、Boogie Down Productionsの1993年の曲『Outta Here』で自分たちの音をブーン・バップと呼び、翌年のソロ作の題名にもした。ただし音そのものはそれ以前から成立していた。1986年、Marley Marlがニューヨークのクイーンズブリッジ団地を拠点にドラムのサンプリングを本格化させ、Eric B. and Rakimの『Paid in Full』(1987)でRakimが拍から自由に離れる譜割りを持ち込んだことが土台になった。決定的だったのは1992年から94年で、Gang Starrの相方DJ Premierが、上物を細かく切り刻んで別の順序で並べ直す手法と、レコードから抜いた声を刺すスクラッチの様式を確立した。Pete RockはCL Smoothとの『T.R.O.Y.』(1992)で、亡くなった友人へ捧げるサックスの断片を敷き、感傷とサンプリングを結びつけた。Wu-Tang Clanの『Enter the Wu-Tang』(1993)はRZAが香港映画の音声と割れた鍵盤を使って荒れた質感を作り、Nasの『Illmatic』(1994)はDJ Premier、Pete Rock、Q-Tip、Large Professorという当代の職人を集めた10曲で、この様式の完成形とされた。The Notorious B.I.G.の『Ready to Die』(1994)は同じ方法で商業的な大成功を収めた。背景には、クラック・コカインの流行と警察の取り締まりに揺れたニューヨークの街と、ラジオ局WBLSやWKCRの深夜番組、ストレッチ・アンド・ボビートの番組といった発信の場があった。1990年代末、サンプリングの著作権処理費用が高騰して短い断片の使用が困難になり、さらに南部やシンセ主体の音が台頭したことで主流の座を降りたが、2010年代以降はJoey Bada$$やGriseldaら若い世代が意図的に選び直す様式として復活している。</p>
<h2>代表曲</h2><ul><li>N.Y. State of Mind (Nas)</li><li>C.R.E.A.M. (Wu-Tang Clan)</li><li>They Reminisce Over You (Pete Rock &amp; CL Smooth)</li><li>Mass Appeal (Gang Starr)</li><li>Check the Rhime (A Tribe Called Quest)</li></ul>
