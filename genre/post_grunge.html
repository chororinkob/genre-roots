<h1>Post-Grunge（ポスト・グランジ）とは</h1>
<p>グランジの重く歪んだギターサウンドを受け継ぎつつ、ラジオで流しやすい形に整えたロックである。中心になる楽器は厚くディストーションの効いたエレキギターで、ミドルテンポのリフを軸に曲が進む。エレキギターとアコースティックギターを同時に</p>
<p>グランジの重く歪んだギターサウンドを受け継ぎつつ、ラジオで流しやすい形に整えたロックである。中心になる楽器は厚くディストーションの効いたエレキギターで、ミドルテンポのリフを軸に曲が進む。エレキギターとアコースティックギターを同時に鳴らす編成も珍しくない。和音はパワーコードを土台にしながら、ポップス風の分かりやすいコード進行とメロディを取り込む。ベースとドラムはシンプルな8ビートが基本で、Aメロでは音を抑え、サビで手数を広げて盛り上げる構造が多い。歌唱は、ささやくような低音から頂点で叫ぶようなハスキーな高音へ一気に切り替えるのが特徴である。歌詞は比喩を避けて直截で、一人称の「I」で語られる恋愛や人間関係、薬物依存からの立ち直りが主題になりやすい。曲はヴァース・コーラス形式で組み立てられ、静かな導入から大きなサビへ向かうダイナミクスの落差が聴かせどころとなる。グランジとの違いは、粗削りで攻撃的な音を滑らかな録音と整ったプロダクションに置き換えた点にある。オルタナティブメタルやニューメタルの重さを取り込んだ第二世代では、ラフな喉声と重いリフがさらに強調された。</p>
<h2>成り立ち</h2><p>1991年、ニルヴァーナのアルバム『Nevermind』が世界中で爆発的に売れ、アメリカ北西部のシアトル発のグランジがロックの中心に立った。大手レコード会社は次々とグランジ系のバンドと契約し、シアトルの外でも似たサウンドを鳴らすグループを探し始めた。こうして生まれた流れがポストグランジである。1993年にはシアトルのキャンドルボックスがデビューアルバムを発表した。1994年にはイギリスのブッシュが『Sixteen Stone』、ペンシルベニア州ヨークのライヴが『Throwing Copper』を放ち、ジョージア州アトランタのコレクティヴ・ソウルも本国で人気を固めた。1995年にはオーストラリアのシルヴァーチェアが『Frogstomp』で成功を収め、ニルヴァーナの元ドラマー、デイヴ・グロールが率いるフー・ファイターズもデビューアルバムを出した。グランジの主力がシアトルに集中していたのに対し、こちらは全米や英語圏各地に拠点を広げた点が特徴である。

ただし「ポストグランジ」という言葉は当初、本物のグランジを模倣しただけの安易なバンドに投げかけられる蔑称だった。しかし1990年代後半、フロリダのクリードが『My Own Prison』(1997年)と『Human Clay』(1999年)で大ヒットを連発すると、言葉は単なるジャンル名として定着していく。2001年、カナダのニッケルバックがアルバム『Silver Side Up』に収めた「How You Remind Me」を全米シングルチャート1位に導くと、セインド、パドル・オブ・マッド、スリーデイズグレイス、シンダウン、南アフリカ出身のシーザーらが次々とラジオでヒットを記録した。第二世代はニューメタルの重さを取り込み、ラフな喉声と重いリフを武器にした。

商業的には成功を重ねた一方で、批評家の評価は終始低かった。似通った作り方とステレオタイプな歌詞を嘲笑う「バットロック」という蔑称は2010年代に広まり、ジャンルの汚名として定着した。クリードの解散と再結成をはじめ、スキャンダルや内部崩壊も絶えなかった。2010年代以降は新しいスターが生まれにくくなったが、ニッケルバックやスリーデイズグレイスは現在も活動を続けている。2000年代のロックを再評価する動きが進むなかで、このジャンルも見直されつつある。</p>
