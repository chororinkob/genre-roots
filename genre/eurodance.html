<h1>Eurodance（ユーロダンス）とは</h1>
<p>1990年代前半のヨーロッパで大衆化した、明快な構造を持つダンス・ポップ。BPMは130〜145、徹底した四つ打ちのキックに、裏拍のオープンハイハット、そして16分音符で刻まれるシンセベースが乗る。最大の識別点は歌の分担で、女性シ</p>
<p>1990年代前半のヨーロッパで大衆化した、明快な構造を持つダンス・ポップ。BPMは130〜145、徹底した四つ打ちのキックに、裏拍のオープンハイハット、そして16分音符で刻まれるシンセベースが乗る。最大の識別点は歌の分担で、女性シンガーが伸びやかな高音でサビ（フック）を歌い、男性ラッパーがヴァースを担当するという「歌とラップの掛け合い」が定型化している。和声は短調のシンプルな循環コード（Am–F–C–G型など）が中心で、切なさと高揚感が同居する響きを作る。シンセの音色はスタブと呼ばれる短く刺す和音、鋸波の派手なリード、ピアノのハウス的な連打が定番。歌詞は英語で、恋愛、夜遊び、自由といった普遍的な題材を平易な語彙で歌い、非英語圏の聴き手でも一度で覚えられる作りになっている。構成は導入・ヴァース・プリコーラス・サビ・ブレイクダウン・大サビと極めて整理され、ラジオ向けの3分半版とクラブ向けの延長版が併せて作られた。ハウスの四つ打ち、ハイエナジーの推進力、ヒップハウスの掛け合いを一つの型に固めた工業製品的な完成度が特徴で、クラブというよりディスコやテレビの歌番組、そして自動車のラジオで鳴っていた音楽である。</p>
<h2>成り立ち</h2><p>1980年代末から1990年代初頭のドイツ、ベルギー、イタリア、オランダを中心に成立した。直接の前身はベルギーのニュービート、そしてイタリアの「イタロ・ハウス」で、そこにハウスの四つ打ちとヒップホップのラップが接合された。決定的な最初の成功はドイツで、フランクフルトのプロデューサーMichael Münzing とLuca Anzilotti が手がけたSnap! のThe Power（1990年）が、ラップとソウルフルな歌の組み合わせ、そして機械的な四つ打ちという型を確立した。前年にはベルギーのTechnotronic がPump Up the Jam（1989年）で同様の掛け合いを先取りしており、この二曲が出発点にあたる。1993年から1996年がジャンルの最盛期で、イタリアのCorona（The Rhythm of the Night）、スウェーデンのAce of Base（レゲエ的な裏打ちを混ぜた変種）、ドイツのCulture Beat（Mr. Vain）とHaddaway（What Is Love）、2 Unlimited（オランダ）などが次々と国際的なヒットを出した。最も象徴的なのはドイツのプロデューサーFrank Farian が手がけたLa Bouche、そしてイタリアのGianfranco Bortolotti が運営したレーベルMedia Records で、後者はCappella、Anticappella など多数の名義を抱える量産体制を築いた。この時代のヨーロッパでは、東西ドイツ統一と冷戦終結による人の往来の活発化、ラジオ規制の緩和による民間局の急増、そしてCDシングルの普及が重なり、汎ヨーロッパ市場向けの英語のダンス曲が最も効率よく売れる商品となっていた。一方で「歌っているモデルと実際の歌手が違う」という口パク問題が繰り返し発覚し、とりわけMilli Vanilli の1990年のスキャンダル（グラミー賞の剥奪）はジャンル全体の信用を傷つけた。1997年以降はトランスとR&amp;Bの台頭で急速に後退したが、東欧・ロシア・アジアでは2000年代まで根強く残り、近年は1990年代懐古の文脈で再評価が進んでいる。</p>
<h2>代表曲</h2><ul><li>No Limit (2 Unlimited)</li><li>Rhythm Is a Dancer (Snap!)</li><li>What Is Love (Haddaway)</li><li>Be My Lover (La Bouche)</li><li>The Rhythm of the Night (Corona)</li></ul>
