<h1>Eurodance（ユーロダンス）とは</h1>
<p>ユーロダンスは、1990年代前半のヨーロッパで大衆化した、明快な構造を持つダンス・ポップだ。 土台になるのは、シンセサイザーの音。シンセの音色は、スタブと呼ばれる短く刺す和音、鋸波（のこぎりの歯のような波形）の派手なリード（主旋律</p>
<p>ユーロダンスは、1990年代前半のヨーロッパで大衆化した、明快な構造を持つダンス・ポップだ。

土台になるのは、シンセサイザーの音。シンセの音色は、スタブと呼ばれる短く刺す和音、鋸波（のこぎりの歯のような波形）の派手なリード（主旋律の音）、そしてピアノのハウス的な連打がよく使われる。

和声は、短調のシンプルな循環コードが中心だ。切なさと高揚感が同居する響きを作る。

リズムは、BPMが典型的には約140（120〜150）。徹底した四つ打ちのキックに、裏拍（拍と拍の間）のオープンハイハット（開いたハイハット）が重なることが多い。そこに、シンプルでシンコペーションするシンセベース（裏拍や8分のルート音が多い）が乗る。

目立つ特徴のひとつは歌の分担だ。ボーカルは単独歌手の場合も、男女混成のラッパー＋歌手のデュオの場合もある。歌詞はほぼ英語で、恋愛、夜遊び、自由といった普遍的な題材を、平易な言葉で歌う。非英語圏の聴き手でも、一度で覚えられる作りになっている。

構成は、導入・ヴァース・プリコーラス・サビ・ブレイクダウン（静かな見せ場）・大サビと、極めて整理されている。ラジオ向けの短縮版と、クラブ向けの延長版が、併せて作られた。

ハウスの四つ打ち、ハイエナジーの推進力、ヒップハウスの掛け合いを、一つの型に固めた。そこに、工業製品的な完成度がある。クラブ向けに作られつつ、ラジオやテレビでも広く流れた音楽だ。</p>
<h2>成り立ち</h2><p>舞台は、1980年代末から1990年代初頭の、ドイツ、ベルギー、イタリア、オランダだ。この地域を中心に、ユーロダンスは成立した。

背景には、ラップ、テクノ、ユーロディスコの要素があった。ベルギーのニュービートや、イタリアの「イタロ・ハウス」の流れもあったとされる。そこに、ハウスの四つ打ちと、ヒップホップのラップが接合された。ユーロダンスは1980年代末の中欧、特にドイツで形成された（ベルギー、オランダ、イタリアなども早期から関わったとする資料もある）。

ドイツでは、フランクフルトのプロデューサーMichael Münzing とLuca Anzilotti が、Snap! を手がけた。そのThe Power（1990年）が、ラップとコーラスを往復する型を示した。

その前年の1989年には、ベルギーのTechnotronicのPump Up the Jamが出ていた。この曲は、初期のヒップハウスの一例で、米国でヒットした最初のユーロダンス曲とされる。英国では1989年10月1日、米Billboard Hot 100では1990年1月に、2位に達していた。

黄金期は、1992年から1995年ごろとされる（衰退は1995年以降）。イタリアのCorona（The Rhythm of the Night）が出た。スウェーデンのポップグループAce of Base（レゲエ的な裏打ちを混ぜた変種）も続いた。ドイツのCulture Beat（Mr. Vain）とHaddaway（What Is Love）、2 Unlimited（ベルギー＝オランダ）などが、次々と国際的なヒットを出した。

代表的な存在の一つは、ドイツのプロデューサーFrank Farian が手がけたLa Boucheだ。もう一つは、イタリアのGianfranco Bortolotti が運営したレーベルMedia Records で、Cappella、Anticappella など多数の名義を抱える量産体制を築いた。

一方で、Milli Vanilliは1990年11月にグラミー賞を剥奪された。通常はポップやR&amp;B系とされるグループだ。製作者のFrank Farianは、この騒動のあと、La Boucheなどのユーロダンス・グループを手がけた。黄金期には、韓国などの東アジアへも広がった。

1997年ごろからは、ハウスとトランスが人気を集めた。2000年代初頭には、R&amp;Bなど他のスタイルへ移っていった。近年は、1990年代懐古の文脈で再注目が進んでいる。</p>
