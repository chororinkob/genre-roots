<h1>Skullstep（スカルステップ）とは</h1>
<p>ドラムンベースのダークステップやテックステップをさらに過激にした、極端に攻撃的なベースミュージックである。基本テンポは170から175 BPMで、特徴として挙げられるのは、機関銃のような連打のスネアと、シンコペーションした反復であ</p>
<p>ドラムンベースのダークステップやテックステップをさらに過激にした、極端に攻撃的なベースミュージックである。基本テンポは170から175 BPMで、特徴として挙げられるのは、機関銃のような連打のスネアと、シンコペーションした反復である。中核はベース音の設計にあり、FM合成やリングモジュレーション、コムフィルターを通した音を、LFOで細かく揺すりながら数十ミリ秒単位で切り替えることで、金属が軋むような、あるいは機械が壊れかけているような音色が作られる。中域は意図的に飽和させ、マスタリング段階でもリミッターを深く踏むため、音圧は常に限界近くに張り付いている。ドラムはサンプリングした生ドラムの質感を残さず、鋭く短いスネアと硬いキックで組まれ、シンバル類はほとんど使われない。旋律や和声はほぼ存在せず、代わりにホラー映画やSF映画からの台詞、警報音、絶叫が空間を埋める。同じ暗さでもテックステップが冷たい静けさを含むのに対し、スカルステップは終始やかましく、ライブで身体をぶつけ合うための音楽である点が異なる。</p>
<h2>成り立ち</h2><p>1995〜96年ごろに生まれたテックステップと、1997〜98年ごろにロンドンで生まれたニューロファンクは、暗く工業的なドラムンベースの語彙を用意し、この音は2000年代半ばに、オランダやイギリスのハードなドラムンベースの中で固まっていった。国外の作家も大きな役割を果たした。ベルリンのTim EliotはCurrent Value名義で、2004年に音響エンジニアリング学校(SAE)で資格を取得し、人間離れした音色設計を持ち込み、同じくドイツのMathis MootzはThe Panacea名義でハードコアテクノとドラムンベースを往復し、Position Chromeを主要な発表の場とした。南アフリカのケープタウン出身で、のちにプラハやロンドンにも拠点を持つCounterstrikeは、メタルやテクノ、初期のテックステップに影響を受けた暴力的な作風で、この領域の代表格となった。主要な存在の一つが、2002年にロッテルダムで創設されたPRSPCTで、ガバの本場であるこの街のレーベルとパーティーが、ドラムンベースとハードコアを同じフロアに集め、分かれていた世界が繋がり始めた。創設者は自分たちをクロスブリードのレーベルではないと述べている。スカルステップという呼称は、2000年代半ばには使われており、2007年ごろの掲示板にも言及がある。語源や命名者には諸説あり、もとはダークステップへの揶揄的な呼称だったとされ(ドクロのロゴが多かったことへの冗談という説や、Limewaxが名づけたという説もある)、正式に定義されたものではない。ウクライナ出身でオランダを拠点としたLimewax、フランスのKatharsys、ロシアのGancher &amp; Ruinなど東欧圏の作家が層を厚くした。現在はドラムンベース側のニューロファンクとハードコア側のクロスブリードの中間帯として、レイヴのハードな時間帯を担い続けている。</p>
