<h1>Skullstep（スカルステップ）とは</h1>
<p>スカルステップは、ドラムンベースの中のダークステップの一派、または別名とされる。定義ははっきり固まっておらず、ダークステップやテックステップをさらに過激にした、極端に攻撃的なベースミュージックとされる。 基本のテンポは、おおむね毎</p>
<p>スカルステップは、ドラムンベースの中のダークステップの一派、または別名とされる。定義ははっきり固まっておらず、ダークステップやテックステップをさらに過激にした、極端に攻撃的なベースミュージックとされる。

基本のテンポは、おおむね毎分170拍前後だ。特徴としてよく挙げられるのは、機関銃のように連打されるスネアと、シンコペーションを使った繰り返しである。

中心にあるのは、ベース音の作り方だ。ニューロファンク系の低音で一般的なFM合成（波形で別の波形を揺らして複雑な音を作る方式）、歪み、リサンプリング、LFO（ゆっくり周期的に音を揺らす装置）などを使い、音を揺らして変化させる。こうして、金属が軋むような、あるいは機械が壊れかけているような音色が作られる。

中域はわざと飽和させる。仕上げのマスタリングの段階でもリミッターを深くかけるため、音圧を高く詰める傾向がある。

ドラムは、ブレイクビーツの素材と硬いスネアを軸にし、硬いキックで組まれる。ハイハットや金属音も使われる。

メロディーや和音は、ほとんど無い。その代わりに、ホラー映画やSF映画から取った台詞、警報音、絶叫などが使われることがある。

同じ暗さでも、テックステップが冷たい静けさを含むのに対し、スカルステップは最初から最後までやかましい点が違う。</p>
<h2>成り立ち</h2><p>1995〜96年ごろにテックステップが生まれ、1997〜98年ごろにはイングランドでニューロファンクが生まれた。この両者が、暗く工業的なドラムンベースの音の材料をそろえた。この音は2000年代半ばに、オランダやイギリスのハードなドラムンベースの中で固まっていった。

国外の作家も大きな役割を果たした。ベルリンのTim Eliotは、Current Value名義で活動した。2004年に音響エンジニアリング学校で資格を取り、音色設計を持ち込んだ。同じドイツのMathis Mootzは、The Panacea名義でハードコアテクノとドラムンベースを行き来し、Position Chromeを主な発表の場とした。

Counterstrikeは南アフリカのケープタウン出身で、のちにプラハやロンドンにも拠点を持った。メタルやテクノ、初期のテックステップに影響を受けた暴力的な作風で、ハードなドラムンベース／クロスブリード寄りの作家として、スカルステップ周辺でも活動した。

主要な存在の一つが、2002年にロッテルダムで生まれたPRSPCTだ。ガバの本場であるこの街のレーベルとパーティーが、ドラムンベースとハードコアを同じフロアに集めた。ただし創設者は、自分たちはクロスブリードのレーベルでも、ハードコアのレーベルでもドラムンベースのレーベルでもないと述べている。

スカルステップという呼び名は、2007年ごろの掲示板ですでに使われていたという話もあるが、裏付けはない。2012年には、The PanaceaとLimewaxが同じ名前のサンプルパックを出した。

語源や名付け親には諸説ある。もとはダークステップをからかう呼び名だったとされる(ドクロのロゴが多かったことへの冗談という説、Limewaxが名づけたという説、PanaceaとLimewaxがサンプルパックの名前として付けたという説もある)。正式に定義されたものではない。

ウクライナ出身でオランダを拠点としたLimewax、フランスのKatharsys、ロシアのGancher &amp; Ruinなど、ロシアやウクライナの出身者に加え、フランスなど西欧の作家も、この周辺で活動した。</p>
