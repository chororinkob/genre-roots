<h1>Skullstep（スカルステップ）とは</h1>
<p>ドラムンベースのニューロファンクを、ダブステップの半分の速さで揺れる重心と、ハードコアテクノ由来の耐久性のない歪みで塗り替えた、極端に攻撃的なベースミュージックである。基本テンポは170から175 BPMだが、スネアを2拍目と4拍</p>
<p>ドラムンベースのニューロファンクを、ダブステップの半分の速さで揺れる重心と、ハードコアテクノ由来の耐久性のない歪みで塗り替えた、極端に攻撃的なベースミュージックである。基本テンポは170から175 BPMだが、スネアを2拍目と4拍目ではなく3拍目に置くハーフタイムの構えを頻繁に取り、体感的な速度はドラムンベースより遅く、一発ごとの重量感が増す。中核はベース音の設計にあり、FM合成やリングモジュレーション、コムフィルターを通した音を、LFOで細かく揺すりながら数十ミリ秒単位で切り替えることで、金属が軋むような、あるいは機械が壊れかけているような音色が作られる。中域は意図的に飽和させ、マスタリング段階でもリミッターを深く踏むため、音圧は常に限界近くに張り付いている。ドラムはサンプリングした生ドラムの質感を残さず、鋭く短いスネアと硬いキックで組まれ、シンバル類はほとんど使われない。旋律や和声はほぼ存在せず、代わりにホラー映画やSF映画からの台詞、警報音、絶叫が空間を埋める。同じ暗さでもテックステップが冷たい静けさを含むのに対し、スカルステップは終始やかましく、ライブで身体をぶつけ合うための音楽である点が異なる。</p>
<h2>成り立ち</h2><p>2000年前後にイギリスで確立したテックステップとニューロファンクは、暗く工業的なドラムンベースの語彙を用意したが、その最も過激な部分を引き受けたのはイギリス国外の作家たちだった。ベルリンのTim EliotはCurrent Value名義で、電子音響の訓練を背景に人間離れした音色設計を持ち込み、同じくドイツのMathis MootzはThe Panacea名義でハードコアテクノとドラムンベースを往復し、Position Chromeを主要な発表の場とした。南アフリカのヨハネスブルグを拠点とするCounterstrikeは、治安の悪い都市の緊張感をそのまま音にしたような暴力的な作風で、この領域の代表格となった。決定的だったのはオランダ・ロッテルダムのPRSPCTで、ガバの本場であるこの街のレーベルとパーティーが、ドラムンベースとハードコアの客を同じフロアに集めたことで、両者の混血が制度として定着した。2010年前後、ダブステップが世界的に流行してハーフタイムの重心とうねるベースが共通語になると、それをドラムンベースの速度で処理する作品が急増し、頭蓋骨を砕くようなという意味合いでスカルステップという俗称が使われ始める。この呼称はレーベルや評論家が定義したものではなく、フォーラムやミックス動画のタイトルから広まった非公式なものであり、当事者の中には安易なラベル付けを嫌って使用を拒む者もいる。ウクライナ出身でオランダを拠点としたLimewax、フランスのKatharsys、ロシアのGancher &amp; Ruinなど東欧圏の作家が層を厚くし、シーンは英語圏より大陸ヨーロッパで濃密に育った。現在はドラムンベース側のニューロファンクとハードコア側のクロスブリードの中間帯として、レイヴのハードな時間帯を担い続けている。</p>
