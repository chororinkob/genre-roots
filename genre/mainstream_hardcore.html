<h1>Mainstream Hardcore（メインストリームハードコア）とは</h1>
<p>ハードコアの中で、最も広い聴衆に向けて整えられた、標準的な形式。テンポは165〜180BPM(160〜180BPMとする説明もある)。いちばん大事な要素は合成されたキックで、正弦波に近い音を過度に歪ませてクリップさせ、矩形波に近づ</p>
<p>ハードコアの中で、最も広い聴衆に向けて整えられた、標準的な形式。テンポは165〜180BPM(160〜180BPMとする説明もある)。いちばん大事な要素は合成されたキックで、正弦波に近い音を過度に歪ませてクリップさせ、矩形波に近づけて音程を持たせる。このキックは音程を持つよう調整され、和音の根っこの音の役割も果たすため、別途ベースを置く必要がない。その分だけ中高域が空き、そこに壮大なメロディーと和音が置かれる。旋律はトランス由来の長い弧を描くもので、しばしばピアノや弦楽器風の音色で提示される。ヴォーカルは女性の伸びやかな歌唱か、あるいは男性の攻撃的な叫び、そしてMCによる煽りの3種類が使い分けられる。曲の組み立ては、導入、第一のドロップ、ブレイクダウン、第二のドロップ、終結という順序が典型的である。ブレイクダウンでは打楽器が完全に止まり、旋律と歌だけになる時間がある。この静けさが、復帰時のキックの衝撃を最大にする仕掛けになっている。上物にはスーパーソウのリード、逆再生したシンバル、白色雑音のライザーが用いられる。速度と歪みを極限まで追求するアップテンポやテラーコアと比べて、聴きやすさと感情表現に重心があり、大型フェスティバルの本舞台で機能することを前提に設計されている。</p>
<h2>成り立ち</h2><p>2000年代初頭のオランダで、それまでのハードコアの多様な潮流が、大型イベント産業の要請によって一つの標準の形へ集まったことで生まれた。2000年代半ばには、人気がフレンチコア、アップテンポ、テラーコアなどのより速い系統へ移った。1990年代後半、ガバはハードスタイルに人気を奪われて縮小していたが、2002年頃にオランダで一定の人気を取り戻した。このころの新しい音は「ニュースタイル」や「メインストリーム」と呼ばれた。歪ませたキックはハードコアの定義的な特徴で1990年代初頭から存在し、合成したキックを過度に歪ませて音程を持たせる作り方が、この系統の特徴になっている。産業面での中心はオランダのイベント運営会社であるID&amp;TとArt of Danceで、前者はThunderdome(1992年開始)を運営し、後者(2001年設立)は現在、大型イベントMasters of Hardcoreを運営している。Masters of Hardcoreは1995年にDJ OutblastとKing Matthewがレーベルとして創設した。これらは数万人規模の屋内イベントとして定着し、そこで演奏される音楽が標準を規定した。会場の規模が大きくなるほど、繊細な音の変化は伝わらず、明快な起伏と大音量が求められる。この物理的条件が形式の定型化を促した。2000年代の中心となった作家はEvil Activities、Neophyte、Tha Playahなどで、2010年代にはAngerfist(オランダのDanny Masseling)、Miss K8(ウクライナ、2012年デビュー)らが台頭した。Radical Redemption(2011年から活動)はRawstyle側の作家とされる。イタリアのArt of FightersとTraxtormレーベル、イタリア出身でオランダ在住のDJ Mad Dogも重要な役割を果たした。Angerfistは仮面をつけた姿で活動し、この分野で最も広く知られる名前になった。2000年代前半には「ニュースタイル」「メインストリーム」と呼ばれており、mainstream hardcoreという呼称は、より地下的なアップテンポやインダストリアル・ハードコアと区別するために使われる。この区別自体が、シーン内部の緊張を示している。古参からは、旋律とヴォーカルを重視する主流形式が商業的に妥協したものだという批判が向けられ、より速く暴力的な派生が反動として支持を集めた。もう一つの深刻な問題が薬物である。この分野のイベントでは強力な合成薬物の使用が常態化しており、オランダでは薬物の成分検査を公的に提供するという独特の政策が採られてきた。それでも死亡事故は起きており、社会的な議論が続いている。近年は、ハードコアの語彙が他ジャンルへ広く輸出される一方で、この形式自体は安定期に入っており、オランダ、イタリア、ドイツ、日本、オーストラリアに継続的な現場が存在する。2020年代にはSNSの短い動画を通じて若い聴衆が流入し、新たな拡大局面を迎えている。</p>
