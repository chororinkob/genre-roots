<h1>Mainstream Hardcore（メインストリームハードコア）とは</h1>
<p>ハードコアの中で、最も広い聴衆に向けて整理された標準的な形式。テンポは150〜175BPM。最大の要素は合成されたキックで、低域の正弦波、中域の歪んだ倍音、高域のアタック音を別々に作って重ね合わせる。このキックは音程を持つよう調整</p>
<p>ハードコアの中で、最も広い聴衆に向けて整理された標準的な形式。テンポは150〜175BPM。最大の要素は合成されたキックで、低域の正弦波、中域の歪んだ倍音、高域のアタック音を別々に作って重ね合わせる。このキックは音程を持つよう調整され、和声の根音として機能するため、別途ベースを置く必要がない。その分だけ中高域が空き、そこに壮大な旋律と和音が配置される。旋律はトランス由来の長い弧を描くもので、しばしばピアノや弦楽器風の音色で提示される。ヴォーカルは女性の伸びやかな歌唱か、あるいは男性の攻撃的な叫び、そしてMCによる煽りの3種類が使い分けられる。曲の構成は完全に定型化しており、導入、第一のドロップ、ブレイクダウン、第二のドロップ、終結という順序をほぼ全曲が守る。ブレイクダウンでは打楽器が完全に止まり、旋律と歌だけになる時間が1分近く続くこともある。この静けさが、復帰時のキックの衝撃を最大化する装置になっている。上物にはスーパーソウのリード、逆再生したシンバル、白色雑音のライザーが用いられる。速度と歪みを極限まで追求するアップテンポやテラーコアと比べて、聴きやすさと感情表現に重心があり、大型フェスティバルの本舞台で機能することを前提に設計されている。</p>
<h2>成り立ち</h2><p>2000年代半ばのオランダで、それまでのハードコアの多様な潮流が、大型イベント産業の要請によって一つの標準形へ収斂したことで成立した。1990年代のガバは、否定的な社会的評判と内部の細分化によって縮小していたが、2000年前後の制作技術の刷新によって復活の条件が整った。とりわけキックを合成で作る手法の確立が決定的で、これによりハードコアは騒音ではなく、和声を持つ音楽として設計できるようになった。産業面での中心はオランダのイベント運営会社であるID&amp;TとArt of Danceで、前者はThunderdome(1992年開始)、後者はMasters of Hardcore(1995年開始)を運営した。これらは数万人規模の屋内イベントとして定着し、そこで演奏される音楽が標準を規定した。会場の規模が大きくなるほど、繊細な音の変化は伝わらず、明快な起伏と大音量が求められる。この物理的条件が形式の定型化を促した。中心となった作家はAngerfist(オランダのDanny Masseling)、Evil Activities、Neophyte、Tha Playah、Miss K8(ウクライナ)、Radical Redemption。イタリアのArt of FightersとTraxtormレーベル、ドイツのDJ Mad Dogも重要な役割を果たした。Angerfistは仮面をつけた匿名の姿で活動し、この分野で最も広く知られる名前になった。2010年前後にmainstream hardcoreという呼称が、より地下的なアップテンポやインダストリアル・ハードコアと区別するために使われるようになる。この区別自体が、シーン内部の緊張を示している。古参からは、旋律とヴォーカルを重視する主流形式が商業的に妥協したものだという批判が向けられ、より速く暴力的な派生が反動として支持を集めた。もう一つの深刻な問題が薬物である。この分野のイベントでは強力な合成薬物の使用が常態化しており、オランダでは薬物の成分検査を公的に提供するという独特の政策が採られてきた。それでも死亡事故は起きており、社会的な議論が続いている。近年は、ハードコアの語彙が他ジャンルへ広く輸出される一方で、この形式自体は安定期に入っており、オランダ、イタリア、ドイツ、日本、オーストラリアに継続的な現場が存在する。2020年代にはSNSの短い動画を通じて若い聴衆が流入し、新たな拡大局面を迎えている。</p>
