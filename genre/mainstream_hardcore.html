<h1>Mainstream Hardcore（メインストリームハードコア）とは</h1>
<p>メインストリーム・ハードコアは、ハードコアの中で、最も広い聴衆に向けて整えられた標準の形だ。テンポは165〜180BPM(160〜180BPMとする説明もある)。 いちばん大事な要素は、合成して作るキックの音だ。正弦波に近い音を強</p>
<p>メインストリーム・ハードコアは、ハードコアの中で、最も広い聴衆に向けて整えられた標準の形だ。テンポは165〜180BPM(160〜180BPMとする説明もある)。

いちばん大事な要素は、合成して作るキックの音だ。正弦波に近い音を強く歪ませてクリップさせ、矩形波に近づけて音程を持たせる。このキックは音程を持つように調整され、ベースラインに沿ってピッチを変える。キックとベースは一体で扱うことが多い。

中高域には、壮大なメロディーと和音が置かれる。旋律は、ピアノや弦楽器のような音色で奏でられることが多い。リードに使うスーパーソウは、トランスに似た音である。

歌の部分では、サンプル、叫びや加工したヴォーカル、MCがよく使われる。

曲の組み立ては、導入、最初のドロップ、ブレイクダウン、次のドロップ、終わりという順番をとることが多い。ブレイクダウンでは打楽器が止まり、旋律と歌だけになる時間がある。この静けさが、キックが戻った時の衝撃を最大にする仕掛けになっている。上物には、スーパーソウのリード、逆再生したシンバル、白色雑音のライザーが使われる。

速さと歪みを極限まで追い求めるアップテンポやテラーコアと比べると、聴きやすさと感情の表現に重心がある。大型フェスティバルのメインステージで力を発揮することを前提に作られている。</p>
<h2>成り立ち</h2><p>メインストリーム・ハードコアは、初期ハードコアから枝分かれした音楽だ。2000年代初頭に、より成熟してテンポの遅い形が定着した。特に成功したのは、オランダとイタリアである。

さかのぼると、1990年代後半、ガバはハードスタイルなどに押されて縮小していた。しかし2002年頃、オランダで一定の人気を取り戻す。このころの新しい音は、「ニュースタイル」や「メインストリーム」と呼ばれた。

歪ませたキックはハードコアを形づくる特徴で、1990年代初頭からあった。そのうえで、合成したキックを強く歪ませて音程を持たせる作り方が、この系統の特徴になっている。

産業の面で中心にいたのは、オランダのイベント運営会社であるID&amp;TとArt of Danceだ。前者はThunderdome(1992年開始)を運営し、後者(2001年設立)は今、大型イベントMasters of Hardcoreを運営している。Masters of Hardcoreは、1995年にBass-DとKing Matthewが立ち上げた。

これらは屋内イベントとして定着し、そこで演奏される音楽が標準を決めたとされる。会場が大きくなるほど、細かな音の変化は伝わらず、はっきりした起伏と大音量が求められる。この物理的な条件が、形の定型化を後押しした。

2000年代の中心的な作家には、Evil Activities、Neophyte、Tha Playahのほか、Endymion、Kasparov、The Stunned Guysなども含まれる。Angerfist(オランダのDanny Masseling)は2000年代半ばから主力で、2010年代も第一線にいる。2010年代には、Miss K8(ウクライナ、2012年デビュー)らが注目を集めた。Radical Redemption(2011年から活動)は、Rawstyle側の作家とされる。

イタリアのArt of FightersとTraxtormレーベル、イタリア出身でオランダに住むDJ Mad Dogも、重要な役割を果たした。Angerfistは仮面をつけた姿で活動し、この分野で最も知られたDJの一人になった。

呼び名にもふれておく。2000年代前半には「ニュースタイル」「メインストリーム」と呼ばれており、別名はmainstyle、nu style gabberである。

その後、2010年代半ば(2015年頃)に、人気はメインストリーム・ハードコアから、フレンチコア、アップテンポ、テラーコアなどへ移り、テンポの帯も160〜180から200BPM超へ動いた。より速く強烈なスタイルへの需要が生まれた。

もう一つの深刻な問題が薬物である。この分野のイベントでは、強力な合成薬物が使われることがあると言われる。オランダでは、世界でも早い時期から公的な薬物検査を整えてきた。

近年は、ハードコアの語彙が他のジャンルへ広く持ち出される一方で、この形そのものは安定期に入っている。オランダ、ドイツ、ベルギー、イタリアなどには、続いている現場がある。</p>
