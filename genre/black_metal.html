<h1>Black Metal（ブラックメタル）とは</h1>
<p>ブラックメタルは、音の粗さと非人間的な冷たさを美学として選び取った、メタルの一派だ。 主役はギター。歪ませつつ、高音域が強調され、低いチューニングは少ない音色を用いる。奏法の中心はトレモロ・ピッキング、すなわち単音を極めて速く反復</p>
<p>ブラックメタルは、音の粗さと非人間的な冷たさを美学として選び取った、メタルの一派だ。

主役はギター。歪ませつつ、高音域が強調され、低いチューニングは少ない音色を用いる。奏法の中心はトレモロ・ピッキング、すなわち単音を極めて速く反復して弾く技法だ。これにより個々の音符が溶け合い、持続する音の帯が生まれる。

和声は、不協和と特定の音階・音程・コード進行で恐怖感を作る。トライトーンがよく使われる。一部の派生スタイルでは、民族音楽的・オーケストラ的な旋律が使われる。

ドラムは、高速の連打（ダブルバス＝バスドラムの連打）とブラストビート（スネアなどを超高速で連打する奏法）が中心となる。

歌唱は、喉を絞って高く裂けるような叫び、いわゆるシュリークだ。苦痛と憎悪を直接的に表現する。

歌詞と世界観は、反キリスト教、サタニズム、異教（北欧神話を含む）、自然（冬・荒野）、人間嫌悪などを扱う。多くの演奏者は、死化粧と呼ばれる白黒の顔面塗装を施す（特に第二波以降の標準的な外見）。

録音は粗く、テープのノイズや歪みをそのまま残す。初期は設備上の制約から生まれた音だった。のちに美学としてローファイ（わざと粗い録音）が採用され、商業的な洗練を拒む姿勢の表明にもなった。</p>
<h2>成り立ち</h2><p>1980年代前半から1990年ごろにかけて、ヨーロッパで第一波が起こった。イギリスのVenomが1982年に発表したアルバムBlack Metalが、名称の由来となった。

同時期、スイスのHellhammer とCeltic Frost、スウェーデンのBathory、デンマークのMercyful Fate が、悪魔的な題材を提示した。「粗い音」はHellhammer・Bathory（・Venom）に限り、Mercyful Fateは伝統的メタルに近い音と区別される。とりわけBathoryのQuorthon（Thomas Börje Forsberg）は、1980年代半ばには資金や設備の制約から、粗い録音になった。それが後の世代に美学として受け継がれた。のちに彼は、北欧神話を主題としたヴァイキング・メタルの起源の一つとされる作品（Blood Fire Death 1988、Hammerheart 1990）も作った。

決定的な第二波は、1990年代初頭のノルウェー（オスロのHelveteを中心に、ベルゲンなど各地）で起きた。中心にいたのはMayhemのØystein Aarseth（Euronymous）だ。彼はレコード店Helvete（地獄）を開いた。Helveteに集まった人々は「Black Circle」または「Inner Circle」と呼ばれた（呼称はEuronymousが作ったとされる）。この集団は音楽的な革新をもたらす一方、深刻な犯罪に関与した。

1991年、Mayhemの歌手Per Yngve Ohlin（通称デッド）が自ら命を絶った。Euronymousがその遺体を撮影したことが、後に問題化した。1992年から1990年代半ばにかけて、ノルウェー各地で歴史的な木造教会を含む放火事件が相次いだ（1996年までに少なくとも50件とされる）。Burzumの Varg Vikernes らが関与したとされる。

そして1993年8月、VikernesがEuronymousをオスロの自宅で刺殺した。殺人、教会への放火、爆発物所持により、当時のノルウェーの最高刑である21年の刑を受けた。これらの事件は国際的に報道され、音楽そのものよりも犯罪の物語として認知される事態を招いた。

それでも、音楽面での成果は大きかった。Darkthroneの1992年のA Blaze in the Northern Sky、Burzumの初期作品、Emperorの1994年のIn the Nightside Eclipseは、いずれも後の世界中のシーンのお手本となった。

シンフォニック・ブラック（オーケストラ的な要素を持つ型）は、1990年代に成立した（Emperorの1994年の作品などが先駆）。アトモスフェリック・ブラックなども、1990年代の流れを汲む。細分化・多様化が進んでおり、NSBMへの反動として左派的なRABMが現れた。</p>
