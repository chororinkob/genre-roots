<h1>Black Metal（ブラックメタル）とは</h1>
<p>音の粗さと非人間的な冷たさを美学として選び取ったメタルの一派。ギターは歪ませつつも低音を削り、高音域の耳障りな成分を強調した薄く鋭い音色を用いる。奏法の中心はトレモロ・ピッキング、すなわち単音を極めて速く反復して弾く技法で、これに</p>
<p>音の粗さと非人間的な冷たさを美学として選び取ったメタルの一派。ギターは歪ませつつも低音を削り、高音域の耳障りな成分を強調した薄く鋭い音色を用いる。奏法の中心はトレモロ・ピッキング、すなわち単音を極めて速く反復して弾く技法で、これにより個々の音符が溶け合い、持続する音の帯が生まれる。和声は短調に加え、増四度や短二度を含む不協和な音程を積極的に用い、長三度による解決をほぼ避ける。旋律は民族音楽やクラシック音楽を思わせる長い線を描くことが多く、悲哀と荘厳さが同居する。ドラムはブラストビートを多用するが、デスメタルよりも音量が抑えられ、混沌の中に埋もれる形で配置される。歌唱は喉を絞って高く裂けるような叫び、いわゆるシュリークで、苦痛と憎悪を直接的に表現する。録音は意図的に低品質で、テープのノイズや歪みをそのまま残す。この、あえて聴きにくくするという選択が最大の思想的特徴であり、商業的な洗練を拒む姿勢の表明でもある。歌詞と世界観は反キリスト教、北欧神話、自然、冬、孤独、虚無を扱い、演奏者は死化粧と呼ばれる白黒の顔面塗装をまとう。</p>
<h2>成り立ち</h2><p>第一波は1980年代前半のヨーロッパで、イギリスのVenomが1982年に発表したアルバムBlack Metalが名称の由来となった。同時期、スイスのHellhammer とCeltic Frost、スウェーデンのBathory、デンマークのMercyful Fate が、悪魔的な題材と粗い音を提示した。とりわけBathoryのQuorthon（Tomas Forsberg）は、1980年代半ばに極端に劣悪な録音を意図的に選び、後に北欧神話を主題としたヴァイキング・メタルの原型も作った。決定的な第二波は1990年代初頭のノルウェー、オスロで起きた。中心にいたのはMayhemのØystein Aarseth（Euronymous）で、彼はレコード店Helvete（地獄）を開き、そこに集まった若者たちがイナー・サークルと呼ばれる集団を形成した。この集団は音楽的な革新をもたらす一方、深刻な犯罪に関与した。1991年、Mayhemの歌手Per Yngve Ohlin（通称デッド）が自ら命を絶ち、Euronymousがその遺体を撮影したことが後に問題化した。1992年から1993年にかけて、ノルウェー各地で歴史的な木造教会を含む数十件の放火事件が起き、Burzumの Varg Vikernes らが関与したとされる。そして1993年8月、VikernesがEuronymousをオスロの自宅で刺殺し、殺人と放火で21年の刑を受けた。これらの事件は国際的に報道され、音楽そのものよりも犯罪の物語として認知される事態を招いた。音楽面での成果は大きく、Darkthroneの1992年のA Blaze in the Northern Sky、Burzumの初期作品、Emperorの1994年のIn the Nightside Eclipseは、いずれも後の世界中のシーンの規範となった。2000年代以降は、シンフォニック・ブラック、アトモスフェリック・ブラック、そして政治的に正反対の立場をとる反ファシズム系統など、多様な方向へ分岐している。</p>
