<h1>Field Recording（サウンドスケープ）とは</h1>
<p>フィールドレコーディングは、スタジオで楽器を演奏する代わりに、その場で実際に鳴っている音をそのまま記録する実践である。マイクと携帯型録音機を持って、街角や森、海岸、工場、駅へ出向いていく。 使う機材は、遠くの音を鋭く拾うショットガ</p>
<p>フィールドレコーディングは、スタジオで楽器を演奏する代わりに、その場で実際に鳴っている音をそのまま記録する実践である。マイクと携帯型録音機を持って、街角や森、海岸、工場、駅へ出向いていく。

使う機材は、遠くの音を鋭く拾うショットガンマイクロホン、人間の頭部(耳介を含む)を模したダミーヘッドマイクロホン、左右の耳に別々の音を収めるバイノーラル録音機、風切り音を防ぐ毛皮のウィンドジャマーなどだ。その音は定位（音がどの方向にあるか）がはっきりしていて、奥行きと距離感をともなって聞こえる。

中心になるメロディーやコード進行はない。鳥のさわずり、波の寄せる音、電車の通過音、虫の羽音、風が木々を揺らす音、遠くの人の話し声。こうした現実の音が、そのまま音楽の素材になる。録音された時間そのものが、作品の構造を決めることも多い。

現場の音を重んじる傾向はあるものの、編集は広く行われる。録音現場の自然な残響も、そのまま音の表情になる。洞窟の反響、広いホールの尾を引く響き、戸外の開けた空間の乾いた質感などだ。

リズムは人間が刻むものではない。波の周期、虫の合唱の脈動、雨粒の密度といった自然のリズムが全体を動かし、テンポは一定しない。

歌が主役ではない。歌が偶然入ることがあり、人の声は会話や叫び、作業の掛け声として偶然入り込む。

曲の組み立ては、録音した時間をほぼそのまま聞かせるノンエディット型（編集しない型）と、別の場所で録った音を重ねて新しい空間を作るコラージュ型に、大きく分かれる。聴きどころは、突然現れる音、遠くから近づいてくる音の動き、静けさの中に浮かび上がるかすかな音である。

隣のアンビエントとの違いはこうだ。アンビエントは、人工的な音を整えて心地よい空間を作る。一方フィールドレコーディングは、現実の場所の音を素材にする。編集を加えた作品も多いが、現場の音の質感を大切にする。

ヘッドフォンで聞くと、録音した場所に立っているかのような没入感がある。都市のざわめき、熱帯雨林の密度、極地の静けさ。その場にいる者だけが知る音の世界を、リスナーに届ける。</p>
<h2>成り立ち</h2><p>フィールドレコーディングの歴史は、録音技術そのものの歴史と重なる。

1890年、アメリカの人類学者ジェシー・ウォルター・フュークスが、エジソンの蝋管蓄音機を持ってメイン州カレーを訪れた。そこでパサマクォディ族の歌と語りを録音した。これは現存が知られる最古の民族誌的フィールド録音である。以後、録音機は音楽を残し、研究するための道具として、世界各地へ運ばれた。

1933年から1930年代半ばにかけては、ローマックス父子(ジョン・A・ローマックスとアラン・ローマックス)が、アメリカ議会図書館のために南部の刑務所や田舎を巡った。1933年には、アンゴラ刑務所でレッドベリーを録音している。以後はアランが中心となり、フォークリバイバルの土台を提供した。ウディ・ガスリーの歌は、1940年にアランがワシントンのスタジオで録音している。

一方、芸術としてのフィールドレコーディングにつながる流れの1つが、ピエール・シェフェールが1948年に始めたミュジーク・コンクレート（録音した現実の音を素材にする音楽）だ。

ルク・フェラーリは、1967年7月(フェラーリ自身が『1968年夏』と述べた例もある)、当時ユーゴスラビアだったクロアチアのコルチュラ島ヴェラ・ルカで、夜明けの音を録音した。録音は複数の夜(午前4〜6時)にわたった。1970年、彼はその音をスタジオで継ぎ合わせて編集し、約21分の作品『Presque Rien No.1』にまとめて、同年に発表した。現実の音を、ほとんど気づかれない手の加え方で組み立て、音楽として示す。この作品は、その点で画期的な転換点になった。

同じころカナダでは、作曲家R・マリー・シェーファーが、1969年にサイモンフレーザー大学でワールド・サウンドスケープ・プロジェクトを設立した。シェーファーが率いたこのプロジェクトは、1973年か1974年に『バンクーバー・サウンドスケープ』を発表した。そして、音響生態学（人と音環境の関係を研究する分野）という学問を打ち立てた。シェーファーの著書『The Tuning of the World』(1977年)は、騒音公害と音環境のデザインを論じ、世界中の研究者に影響を与えた。

1980年代には、クリス・ワトソンが、テレビのロケ録音技師として世界各地の音を集めた。彼はシェフィールドのインダストリアルバンド、キャバレー・ヴォルテールの創設メンバーだった。1996年には、タッチ・レーベルから『Stepping Into the Dark』を発表している。スペイン出身のフランシスコ・ロペスは、1998年に『La Selva』を出した。コスタリカの熱帯雨林の音を1時間以上にわたって収め、自然の音の密度そのものを作品にした。

バーニー・クラウスは、モータウンで時折セッションの代役を務めた。その後、1979年ごろから野生の音の録音に専念し、1981年に「Creative Sound Arts」の博士号(海洋バイオアコースティクスのインターン付き)を取得した。

レーベルもシーンを支えた。ドイツのグルーネンレコーダー(2003年設立)と、アラン・ビショップ、リチャード・ビショップ、ヒシャム・マエットがシアトルで始めたサブライム・フリークエンシーズ(2003年)だ。どちらもフィールド録音を扱うレーベルである(フォークやポップのコンピレーション、ラジオ音源のコラージュ、DVDも出している)。

しかし、批判もある。録音が先住民の文化を無断で奪い取るという、植民地主義的な面への批判だ。近年は、録音の返還運動が進んでいる。

今では、デジタル録音機とスマートフォンが広まり、誰でも高品質なフィールド録音ができるようになった。この実践は、アンビエント、ダークアンビエント、ドローン、ノイズ、映画音響、サウンドアートなど、さまざまな分野へ広がり続けている。</p>
