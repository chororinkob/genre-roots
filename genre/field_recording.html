<h1>Field Recording（サウンドスケープ）とは</h1>
<p>フィールドレコーディングは、スタジオで楽器を演奏する代わりに、マイクと携帯型録音機を携えて街角や森、海岸、工場、駅へ出向き、その場に実際に鳴っている音をそのまま記録する実践である。中心となるメロディーやコード進行は存在せず、鳥のさ</p>
<p>フィールドレコーディングは、スタジオで楽器を演奏する代わりに、マイクと携帯型録音機を携えて街角や森、海岸、工場、駅へ出向き、その場に実際に鳴っている音をそのまま記録する実践である。中心となるメロディーやコード進行は存在せず、鳥のさわずり、波の寄せる音、電車の通過音、虫の羽音、風が木々を揺らす音、遠くの人の話し声といった現実の音響がそのまま音楽の素材となり、録音された時間そのものが作品の構造を決める。使用される機材は、遠くの音を鋭く拾うショットガンマイクロホン、人間の耳の形を模したダミーヘッドマイクロホン、左右の耳に別々の音を収めるバイノーラル録音機、風切り音を防ぐ毛皮のウィンドジャマーなどであり、その音は定位が明瞭で、奥行きと距離感を伴って聞こえる。音響エフェクトは基本的に後から加えられず、録音現場の自然な残響、すなわち洞窟の反響、広いホールの尾を引く響き、戸外の開けた空間の乾いた質感がそのまま音の表情となる。リズムは人間が刻むものではなく、波の周期、虫の合唱の脈動、雨粒の密度といった自然のリズムが支配し、テンポは一定しない。曲の構成は、録音した時間をほぼそのまま提示するノンエディット型と、別の場所で録った音を重ね合わせて新しい空間を合成するコラージュ型とに大別される。聴かせどころは、突然の音の出現、遠くから近づいてくる音の移動、静寂の中に浮かび上がる微細な音である。歌や歌詞は存在せず、人の声は会話や叫び、作業の掛け声として偶発的に入り込む。隣接するアンビエントとの違いは、アンビエントが人工的な音響を整えて心地よい空間を作るのに対し、フィールドレコーディングは現実の場所の音をできるだけ加工せずに伝える点にある。その音は、ヘッドフォンで聞くと録音した場所に立っているかのような没入感をもたらし、都市の喧騒、熱帯雨林の密度、極地の静寂といった、実際にその場にいる者だけが知る音の世界をリスナーに届ける。</p>
<h2>成り立ち</h2><p>フィールドレコーディングの歴史は、録音技術そのものの歴史と重なる。1890年、アメリカの人類学者ジェシー・ウォルター・フュークスがエジソンの蝋管蓄音機を持ってメイン州カレーを訪れ、パサマクォディ族の歌と語りを録音した。これは現存する最古の民族誌的フィールド録音であり、以後、録音機は音楽を保存・研究するための道具として世界各地へ運ばれた。1930年代から40年代にかけて、アメリカ議会図書館のアラン・ローマックスは南部の刑務所や田舎を巡り、レッドベリーやウディ・ガスリーらの歌を録音し、フォークリバイバルの土台を作った。一方、芸術としてのフィールドレコーディングは、ピエール・シェフェールが1948年に始めたミュジーク・コンクレートの流れの中で育った。ルク・フェラーリは1970年、フランス南部の海岸で夜明けの音を録音し、それをほぼ無編集で作品化した『Presque Rien No.1』を発表する。この作品は、現実の音をそのまま音楽として提示するという画期的な転換点となった。同時期のカナダでは、作曲家R・マリー・シェーファーがサイモンフレーザー大学にワールド・サウンドスケープ・プロジェクトを設立し、1973年に『バンクーバー・サウンドスケープ』を発表、音響生態学という学問を創始した。シェーファーの著書『The Tuning of the World』(1977年)は、騒音公害と音環境のデザインを論じ、世界中の研究者に影響を与えた。1980年代には、シェフィールドのインダストリアルバンド、キャバレー・ヴォルテールの創設メンバーだったクリス・ワトソンが、テレビのロケ録音技師として世界各地の音を収集し、1996年にタッチ・レーベルから『Stepping Into the Dark』を発表した。スペイン出身のフランシスコ・ロペスは1998年、コスタリカの熱帯雨林の音響を1時間超にわたって収めた『La Selva』で、自然音の密度そのものを作品化した。バーニー・クラウスは、モータウンでスタジオ・エンジニアを務めた後、バイオアコースティクス(生物音響学)の博士号を取得し、50年以上にわたって野生の音を記録し続けた。ドイツのグルーネンレコーダー(2003年設立)や、アラン・ビショップとヒシャム・マエットがシアトルで始めたサブライム・フリークエンシーズ(2003年)は、フィールドレコーディングを専門に扱うレーベルとしてシーンを支えた。一方で、録音が先住民の文化を無断で収奪するという植民地主義的側面への批判も存在し、近年は録音の返還運動が進んでいる。デジタル録音機とスマートフォンの普及により、現在では誰でも高品質なフィールド録音を行えるようになり、この実践はアンビエント、ダークアンビエント、ドローン、ノイズ、映画音響、サウンドアートなど多様な領域へと広がり続けている。</p>
<h2>代表曲</h2><ul><li>La Selva (Francisco López)</li><li>Presque Rien No.1 (Luc Ferrari)</li></ul>
