<h1>Eleki（エレキ）とは</h1>
<p>エレキは、歌のないエレキギターが主役の器楽曲だ。代表曲22曲を動画で聴け、ルーツと影響のつながりを地図でたどれる。</p>
<p>エレキは、歌のないエレキギターが主役の器楽曲だ。ギターが旋律を受け持ち、エレキベースとドラムが土台を組む。サックスやピアノ、オルガンが加わる編成もあるが、前に出るのは電気楽器の音だ。曲の長さは2〜3分台が中心で、詞を聴かせるのではなく、フレーズの連なりで聞かせる。

主役のギターはモズライトかフェンダーで、深いリバーブをかけた硬く乾いた音がする。国産ではテスコ、グヤトーン、ヤマハのギターもよく使われた。弦は細めのライトゲージを張り、アンプは歪ませずにクリーンなまま音量を稼ぐ。低音はベースが受け持ち、ギターは中高音域を動き回る。

奏法の代名詞はテケテケだ。低音弦をスライドさせ、トレモロ・ピッキングを行うトレモロ・グリスダウン奏法である。同じ音を細かく反復するトレモロ・ピッキング、指で弦を押し上げるチョーキング、左手を滑らせるグリッサンドも常用する。寺内タケシは三味線調弦に調弦を変え、和風の節を弾いた。

リズムは4分の4拍子が基本で、8分音符を刻むドラムと、4分音符で歩くベースが前へ進む。2拍目と4拍目にスネアが入り、ギターの刻みと重なって軽く跳ねる。テンポは曲ごとに幅があり、しっとりした曲から、指が回らないほど速い曲まである。

歌はない。ボーカルが不在な分、ギターのフレーズが語りの代わりになる。曲名には「テケテケ」のような擬音や、土地や民謡の名を冠したものがあり、詞の代わりに題名が景色を伝える。

曲の組み立ては、ギターのユニゾンによる主題で始まり、Aメロで節を繰り返し、中間部でベースやドラムのソロを挟み、最後に主題へ戻る型もある。聴かせ所は中間部のギター・ソロで、ここでチョーキングとトレモロ・ピッキングを重ね、山を作る。

器楽型のサーフ・ロックと同じなのは、歌を入れずギターを主役にする点と、リバーブの深い音作りだ。違うのは、民謡の節や歌謡曲の旋律をギターで弾く点に重きが置かれること、そして曲の途中で和風の音階へ切り替わることだ。鳴っている場所は、学校の体育館や、テレビのオーディション番組である。</p>
<h2>成り立ち</h2><p>1959年、アメリカのワシントン州でドン・ウィルソンとボブ・ボーグルがザ・ベンチャーズを結成した。1960年には「ウォーク・ドント・ラン」が全米2位となり、1962年5月にはドンとボブの2人だけが初来日する。このときはウッドベースとドラムを日本人が務め、ボブは後に「別に悪いミュージシャンではなかったが、ビートの感覚が違っていた」と振り返っている。

しかし1965年1月3日から（資料により10日／14日まで）にかけて、ドン、ボブ、ノーキー・エドワーズ、メル・テイラーの4人編成で来日する。アストロノウツとの3部構成の公演で、第1部が日本のグループ、第2部がアストロノウツ、第3部がベンチャーズだった。前座を務めたのが寺内タケシとブルージーンズである。この公演を境に、日本中でエレキギターを抱える若者が急に増えた。日本では「ダイアモンド・ヘッド」が185万枚以上を売ったとされ、ベンチャーズの国内総売上は4000万枚を超える。

テレビが火をつけた。1965年6月23日、フジテレビが「勝ち抜きエレキ合戦」の放送を始める。毎回5組が出場し、審査員5人が50点満点で採点して最高点のバンドが勝ち、4週連続で勝つとグランドチャンピオンに認定される番組で、1966年9月28日まで続いた。同じ年の12月19日には加山雄三主演の映画「エレキの若大将」が公開され、寺内タケシが「隆」役で出演した。12月5日発売の「君といつまでも」のB面「夜空の星」は、寺内タケシとブルージーンズが演奏を担当している。1965年7月からのベンチャーズのツアーは58公演で約17万人を動員した。

ここで反発が起きる。「エレキは不良の温床」という声が親と学校に広がり、多くの高校がエレキギターとバンド活動を禁止した。寺内は高校生からの手紙をきっかけに各地の学校を回り、理解を求めたが、校長が話を聞いたのは3校だけだった。母校の土浦三高が受け入れ、そこで演奏したのが、74年から約1500校のハイスクールコンサートの1校目になる。

一方、エレキブームは歌の方向へ流れていく。1965年5月、ザ・スパイダースの「フリフリ」が最初のグループ・サウンズのレコードとされる。1966年3月にはジャッキー吉川とブルー・コメッツの「青い瞳」が50万枚を超えるヒットとなり、1966年6月30日からのビートルズ来日公演を境に、ギターを自分で弾きながら歌うバンドが次々とデビューした。GSは1967年から1969年にかけて大流行し、最盛期には300を超えるグループがあったといわれる。1969年春に人気グループから主要メンバーが相次いで脱退し、1970年頃にブームは終わる。1971年にはほとんどのグループが解散した。

器楽の側は別の道を進んだ。寺内は民謡と古典に踏み込み、津軽じょんがら節、ノーエ節、ソーラン節をエレキで演奏するエレキ民謡を作った。1967年の「レッツゴー運命」はベートーヴェンの交響曲第5番を編曲したもので、第9回日本レコード大賞編曲賞を受けた。ベンチャーズは1966年ごろから日本を題材にした曲を作り、1968年以降は本格化し、1970年の「京都の恋」（渚ゆう子）が第12回日本レコード大賞企画賞を受賞して、ベンチャーズ歌謡と呼ばれる流れを生んだ。1991年の紅白歌合戦にはベンチャーズが出場し、3曲をメドレーで演奏している。

ブームが去ったあとも、エレキの奏法は残った。テケテケの刻みはGSの間奏に、三味線調弦のソロは和風ロックの語法に引き継がれている。寺内タケシは2021年6月18日に82歳で死去し、「エレキの神様」の名で呼ばれ続けている。</p>
