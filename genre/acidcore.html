<h1>Acidcore（アシッドコア）とは</h1>
<p>ハードコア・テクノの速度と音圧に、アシッド特有の唸る電子音を組み合わせた様式である。中核にあるのはローランド社の小型シーケンサーTB-303が生む音で、この機材は本来ベース伴奏を自動生成するために作られたものだった。フィルターの周</p>
<p>ハードコア・テクノの速度と音圧に、アシッド特有の唸る電子音を組み合わせた様式である。中核にあるのはローランド社の小型シーケンサーTB-303が生む音で、この機材は本来ベース伴奏を自動生成するために作られたものだった。フィルターの周波数と共振の値を演奏中につまみで操作すると、音色が液体のようにうねりながら変化する。この、機材の設計意図から完全に外れた使い方によって生まれる音が、様式の核心をなす。テンポは一分間に160から200拍程度と速く、四つ打ちのバスドラムは歪ませて音の壁として鳴らされる。ハードコア系の常として、バスドラムは録音の限界を超えて圧縮され、輪郭が崩れた状態が意図的に保たれる。曲の構成は旋律の展開ではなく、うねる電子音の変化そのものが時間の流れを作る。同じ音型を延々と反復しながら、つまみの操作だけで音色を数分かけて変形させていく手法が中心で、明確なサビや山場を持たない曲も多い。歌はほとんど用いられず、代わりに加工された叫び声や、演説や映画の台詞の断片が挿入される。演奏の場は屋内の小規模な催しや、無許可で開催される野外の集まりであり、その環境と切り離せない性格を持つ。</p>
<h2>成り立ち</h2><p>土台は二つの流れの合流である。一方は1980年代半ばのシカゴで生まれたアシッド・ハウスで、ディージェイ・ピエールらがTB-303という中古で投げ売りされていた機材のつまみを回して偶然生まれた音を、そのまま作品にしたことに始まる。この機材は1982年に発売され、生のベース奏者の代用品として設計されたが、その用途では全く似ておらず商業的に失敗し、二年ほどで製造中止となっていた。中古市場に安価で大量に流れた結果、資金のない若い制作者の手に渡り、想定外の使われ方をした。もう一方の流れは、1990年代初頭にオランダとドイツで激化したハードコア・テクノである。速度と歪みの競争が進み、一分間に200拍を超える領域まで到達していた。この両者が結びついたのが1990年代半ばの欧州で、特にフランスとオランダの無許可の野外パーティーの現場が舞台となった。フランスでは装置一式を持ち込んで数日間演奏を続けるサウンドシステムの文化が根づき、スパイラル・トライブのような集団が英国から大陸へ移動して各地で催しを開いた。彼らは商業的な流通を意図的に避け、自主制作の盤を手渡しで配る形を取った。この文化圏ではフリーテクノという呼び名も使われ、音楽と、法の外側で場所を占拠するという実践が不可分のものとして扱われた。英国では1994年に刑事司法・公共秩序法が成立し、反復するビートを伴う集会を警察が解散させられる条項が盛り込まれた。音楽の形式そのものが法律に名指しされたという点で異例の事態であり、これが担い手たちを大陸へ押し出す一因となった。以後この様式は、商業的な成功をほとんど求めないまま、欧州各地の地下の現場で今日まで演奏され続けている。</p>
