<h1>Acidcore（アシッドコア）とは</h1>
<p>ハードコア・テクノの速度と音圧に、アシッド特有の唸る電子音を組み合わせた様式である。中核にあるのはローランド社の小型ベース・シンセサイザー(シーケンサー内蔵)TB-303が生む音で、この機材は本来ベース伴奏を自動生成するために作ら</p>
<p>ハードコア・テクノの速度と音圧に、アシッド特有の唸る電子音を組み合わせた様式である。中核にあるのはローランド社の小型ベース・シンセサイザー(シーケンサー内蔵)TB-303が生む音で、この機材は本来ベース伴奏を自動生成するために作られたものだった。フィルターの周波数と共振の値を演奏中につまみで操作すると、音色が液体のようにうねりながら変化する。この、機材の設計意図から完全に外れた使い方によって生まれる音が、様式の核心をなす。テンポは一分間に150から180拍程度と速く、四つ打ちのバスドラムは歪ませて音の壁として鳴らされる。ハードコア系の常として、バスドラムは強く圧縮され、輪郭が崩れた状態が意図的に保たれる。曲の構成は旋律の展開ではなく、うねる電子音の変化そのものが時間の流れを作る。同じ音型を延々と反復しながら、つまみの操作だけで音色を数分かけて変形させていく手法が中心で、明確なサビや山場を持たない曲も多い。歌はほとんど用いられず、代わりに加工された叫び声や、演説や映画の台詞の断片が挿入される。演奏の場は屋内の小規模な催しや、無許可で開催される野外の集まりであり、その環境と切り離せない性格を持つ。</p>
<h2>成り立ち</h2><p>土台は二つの流れの合流である。一方は1980年代半ばのシカゴで生まれたアシッド・ハウスで、ディージェイ・ピエールらがTB-303という中古で投げ売りされていた機材のつまみを回して偶然生まれた音を、そのまま作品にしたことに始まる。この機材は1981年に発売され(販売店の資料には1982年とするものもある)、生のベース奏者の代用品として設計されたが、その用途では全く似ておらず商業的に失敗し、1984年ごろに製造中止となっていた。中古市場に安価で大量に流れた結果、資金のない若い制作者の手に渡り、想定外の使われ方をした。もう一方の流れは、1990年代初頭にオランダとドイツで激化したハードコア・テクノである。速度と歪みの競争が進み、一分間に200拍を超える領域まで到達していた。この両者が結びついたのは1990年代前半で、英国、フランス、オランダなどの無許可の野外パーティー(フリーパーティー)の現場が舞台となった。装置一式を持ち込んで数日間演奏を続けるサウンドシステムの文化の中で、英国のスパイラル・トライブのような集団が先駆者とされ、のちに大陸(オランダ、ドイツ、オーストリアなど)へ移動して各地で催しを開いた。彼らは自主レーベルのNetwork 23から盤を出した一方、1992年にはメジャーのBig Life Recordsと契約した者もいた。この文化圏ではフリーテクノという呼び名も使われ、音楽と、法の外側で場所を占拠するという実践が不可分のものとして扱われた。英国では1994年11月に刑事司法・公共秩序法が成立し、屋外で夜間に増幅された音楽を流し、周辺の住民に深刻な苦痛を与えるおそれのある集会(イングランドとウェールズでは20人以上)について、警視以上が退去を指示できる条項が盛り込まれた。この条項は反復するビートの音楽を名指ししており、音楽の形式そのものが法律に名指しされたという点で異例である。担い手たちの大陸への移動は、これより前の1993年3月、Castlemortonの野外パーティーをめぐる裁判で無罪となった直後に始まっており、その後の取り締まり強化の流れが背景にあった。以後この様式は、商業的な成功をほとんど求めないまま、欧州各地の地下の現場で今日まで演奏され続けている。</p>
