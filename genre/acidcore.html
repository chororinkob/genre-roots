<h1>Acidcore（アシッドコア）とは</h1>
<p>アシッドコアは、ハードコア・テクノの速さと音圧に、アシッドならではの唸る電子音を組み合わせたスタイルだ。 中心にあるのは、ローランド社の小型ベース・シンセサイザー(シーケンサー内蔵)、TB-303が生む音である。この機材は、もとも</p>
<p>アシッドコアは、ハードコア・テクノの速さと音圧に、アシッドならではの唸る電子音を組み合わせたスタイルだ。

中心にあるのは、ローランド社の小型ベース・シンセサイザー(シーケンサー内蔵)、TB-303が生む音である。この機材は、もともとベースの伴奏を自動で作るために作られたものだった。フィルターの周波数と共振の値を、演奏中につまみで動かすと、音色が液体のようにうねりながら変わっていく。この酸っぱい音色は、もともと機能として備わっていた。ただ、ジャンルとして使われることは想定されていなかった。この音が、このスタイルの中心にある。

テンポは速く、150から180 BPM程度とされる。四つ打ちのバスドラムは歪ませて、音の壁として鳴らされる。ハードコア系ではいつものことだが、バスドラムは強く圧縮され、輪郭が崩れた状態がわざと保たれる。

歌はほとんど使われず、代わりに、加工した叫び声や、演説や映画の台詞の切れ端が差し込まれるとされる。

曲の組み立ては、メロディーの展開ではなく、うねる電子音の変化そのものが時間の流れを作る。同じ音の型をえんえんと繰り返しながら、つまみの操作だけで音色を数分かけて変えていく手法が中心だ。はっきりしたサビや山場を持たない曲も多いとされる。

演奏の場は、屋内の小さな催しや、許可を取らずに開く野外の集まりである。この音楽は、そうした場と切り離せない性格を持つ。</p>
<h2>成り立ち</h2><p>土台になったのは、二つの流れの合流だ。

一つめは、1980年代半ばのシカゴで生まれたアシッド・ハウスである。ディージェイ・ピエールらが、中古で投げ売りされていたTB-303のつまみを回し、偶然生まれた音をそのまま作品にしたことが始まりとされる。この機材は1981年に発売された(1982年とする説もある)。生のベース奏者の代わりとして設計されたが、その用途では全く似ておらず、商業的に失敗した。1984年ごろには製造中止になっている。生産数は約1万台とされる。それが中古市場に安く流れた結果、お金のない若い作り手の手に渡り、想定外の使われ方をした。

もう一つの流れは、1990年代初めにオランダ・ベルギー・ドイツで激しさを増したハードコア・テクノである。速さと歪みの競争が進み、後年には200 BPMを超えるスタイルも現れた。

二つが結びついたのは1990年代前半だ。舞台は、英国、フランス、オランダなどの、許可を取らない野外パーティー(フリーパーティー)の現場だった。装置一式を持ち込み、数日間演奏を続けるサウンドシステムの文化の中で、英国のスパイラル・トライブのような集団がフリーテクノ（hard tec）の担い手となった。彼らはのちに大陸(フランス、オランダ、ドイツ、オーストリアなど)へ移り、各地で催しを開いた。

彼らの中には、1992年にBig Life Recordsと契約した者もいた。自主レーベルのNetwork 23ができたのは1994年で、Big Lifeとの契約より後である。彼らはそこから盤を出した。この文化圏ではフリーテクノという呼び名も使われた。音楽と、法の外で場所を占拠するという行動は、切り離せないものとして扱われた。

一方、英国では1994年11月に刑事司法・公共秩序法が成立した。屋外で夜間に増幅された音楽を流し、周りの住民に深刻な苦痛を与えるおそれのある集会(100人以上)について、警視以上が退去を指示できる条項が入った。この条項は、反復ビートの音を「音楽」の定義に含めると明記し、議論を呼んだ。

担い手たちの大陸への移動は、これより前のことだ。1993年夏には、すでにフランスのボーヴェで最初のTeknivalを開いている。Castlemortonの野外パーティーをめぐっては、ウルヴァーハンプトン刑事法院で10週間の裁判が開かれた。全被告が無罪になったのは1994年3月である。

その後、この音楽は、商業的な成功を主な目的としない文化が中心となり、欧州各地の地下の現場で演奏された。</p>
