<h1>Ska Punk（スカパンク）とは</h1>
<p>スカパンクは、ジャマイカ由来のスカの裏打ちリズムと管楽器を、より速くて重いパンクの演奏に載せた音楽である。曲の中で、スカらしい部分とパンクらしい部分を切り替える曲もある。 管楽器が大きな役割を持つ。編成にはトランペット、トロンボー</p>
<p>スカパンクは、ジャマイカ由来のスカの裏打ちリズムと管楽器を、より速くて重いパンクの演奏に載せた音楽である。曲の中で、スカらしい部分とパンクらしい部分を切り替える曲もある。

管楽器が大きな役割を持つ。編成にはトランペット、トロンボーン、サックスなどを伴うことが多い。彼らはそろって覚えやすい短い旋律を吹き、時に短い独奏も回す。

テンポは伝統的なスカより速い。曲の組み立てには、一例として次のような型がよく見られる。歌の部分では、ギターが裏拍だけを短く刻み、管楽器が軽やかな旋律を吹いて、跳ねる感触を作る。そして繰り返し部分に入ると、歪んだギターが全ての拍を掻き鳴らす。この、跳ねる部分と押し潰す部分の落差が聴かせどころである。

ベースは、ウォーキング的な動きから8分音符主体まで幅がある。ドラムは速い4/4で、パターンは曲により異なる。

歌唱スタイルはバンドごとに多様である。歌詞は、失恋、友情、退屈な郊外の生活、自虐的な冗談を扱うものもある。その一方で、軽快な曲調で社会的・政治的な主題を扱うバンドも多い。全体として、悲しい内容でも明るく鳴るという性格を一貫して持つ。</p>
<h2>成り立ち</h2><p>スカパンクの系譜は、ジャマイカからイギリスを経てアメリカへ至る、三段階を持つ。

1950年代後半にジャマイカで生まれたスカは、1960年代に第一の波を迎えた。1970年代末のイギリスでは、人種混成のバンドが政治的な意識とともにスカを蘇らせた。2 Toneの運動である。これが第二の波だ。

2 Tone期に、スカとパンクの要素の接触はあった。ただし、スタイルとしてのスカパンクは、1980年代の米国で形成されたとされ、起源には諸説ある。アメリカでは1980年代初頭にスカ・バンドが現れ、1980年代後半に「第三の波」と呼ばれる流れになった。舞台は、アメリカ各地(ニューヨーク、カリフォルニア、ボストン、フロリダなど)に広がった。

1987年、カリフォルニア州バークレーでOperation Ivyが結成された。ハードコア・パンクの速度とスカの裏拍を、強引につなぎ合わせたバンドだ。活動はわずか2年で終わったが、後続に大きな影響を与えた重要なバンドの一つとなった。彼らを世に出したのは、Lookout! Recordsという小さなレーベルである。メンバーのTim ArmstrongとMatt Freemanは、後にRancidを結成する。

1990年代前半、このスタイルは南カリフォルニアの郊外の若者文化と結びついて広まった。ロングビーチのSublimeは、スカにレゲエとヒップホップを混ぜた、独自の作風を固めた。しかし中心人物のBradley Nowellは1996年、彼らを全国的な成功へ導くことになる作品の発表を目前にして、麻薬の過剰摂取により28歳で死亡している。同じ地域から出たNo Doubtは、1995年の作品で世界的な成功を収め、歌手のGwen Stefaniは時代のトレードマークのような存在となった。

The Mighty Mighty Bosstonesが1990年代前半に先行し、1995年前後にRancidとNo Doubtが続き、Reel Big Fishなどが1996〜97年に続いた。1990年代半ばから後半が、この流行の最盛期だった。ラジオとテレビが同種のバンドを次々に取り上げ、レコード会社は競って契約したとされる。だが、それゆえに供給が増えすぎるのも早かった。管楽器を加えて明るく演奏すれば売れるという安易な模倣が氾濫し、1990年代末に主流の関心が薄れ、2000年前後〜2000年代初頭に衰退した。

この分野は、軽快な曲調ゆえに軽んじられることもある。だが、Operation Ivyのように社会正義を強く求める歌詞を持つバンドも多い。しかし2010年代後半には、The Interruptersなどが再びチャート入りした。Streetlight Manifestoのように高度な編曲を持つバンドや、各国の新しい世代によって、このスタイルは現在も更新され続けているとされる。</p>
<h2>代表曲</h2><ul><li>The Impression That I Get（The Mighty Mighty Bosstones）</li><li>Sell Out（Reel Big Fish）</li><li>Superman (Goldfinger)</li><li>Same in the End (Sublime)</li><li>Would You Be Impressed? (Streetlight Manifesto)</li><li>Time Bomb (Rancid)</li><li>Beer (Reel Big Fish)</li><li>500 Channels (Choking Victim)</li><li>Sound System（Operation Ivy）</li><li>Johnny Quest Thinks We're Sellouts (Less Than Jake)</li><li>All My Best Friends Are Metalheads (Less Than Jake)</li><li>Everything Went Numb (Streetlight Manifesto)</li></ul>
