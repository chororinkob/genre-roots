<h1>Ska Punk（スカパンク）とは</h1>
<p>ジャマイカ由来のスカの裏拍の刻みと、アメリカのパンクの速度と歪みを、一曲の中で交互に配置する音楽である。構造には、一例として次のような型がよく見られ、歌の部分ではギターが裏拍だけを短く刻み、管楽器が軽やかな旋律を吹いて跳ねる感触を</p>
<p>ジャマイカ由来のスカの裏拍の刻みと、アメリカのパンクの速度と歪みを、一曲の中で交互に配置する音楽である。構造には、一例として次のような型がよく見られ、歌の部分ではギターが裏拍だけを短く刻み、管楽器が軽やかな旋律を吹いて跳ねる感触を作る。そして繰り返し部分に入ると、歪んだギターが全ての拍を掻き鳴らし、テンポは変わらないまま音の密度だけが倍増して爆発する。この、跳ねる部分と押し潰す部分の落差が、聴かせどころであると同時に、客席での踊り方の切り替え点にもなっている。テンポは伝統的なスカより速い。編成にはトランペット、トロンボーン、サックスなどの管楽器を伴うことが多く、彼らはそろって覚えやすい短い旋律を吹き、時に短い独奏も回す。ベースは8分音符で走り回り、ドラムは2拍目と4拍目を強く踏む。和声は明るい長調の単純な進行が多い。歌唱は絶叫せず、早口で言葉を詰め込む語り口が好まれる。歌詞は失恋、友情、退屈な郊外の生活、自虐的な冗談を扱うものが多い一方、軽快な曲調で社会的・政治的な主題を扱うバンドも多い。全体として、悲しい内容でも明るく鳴るという性格を一貫して持つ。</p>
<h2>成り立ち</h2><p>系譜はジャマイカからイギリスを経てアメリカへ至る三段階を持つ。1950年代後半にジャマイカで生まれたスカが1960年代に第一の波を迎え、1970年代末のイギリスで人種混成のバンドが政治的な意識とともに蘇らせた2 Toneの運動が第二の波であり、スカとパンクの融合はこの2 Toneの時期にすでに起きており、アメリカでの展開と第三の波は1980年代後半以降である。舞台はアメリカ各地(ニューヨーク、カリフォルニア、ボストン、フロリダなど)に広がった。1987年、カリフォルニア州バークレーで結成されたOperation Ivyは、ハードコア・パンクの速度とスカの裏拍を強引につなぎ合わせ、わずか2年の活動で解散したにもかかわらず、後続に大きな影響を与えた重要なバンドの一つとなった。彼らを世に出したのはLookout! Recordsという小さなレーベルで、構成員のTim ArmstrongとMatt Freemanは後にRancidを結成する。1990年代前半、この様式は南カリフォルニアの郊外の若者文化と結びついて拡大した。ロングビーチのSublimeはスカにレゲエとヒップホップを混ぜた独自の作風を確立したが、中心人物のBradley Nowellは1996年、彼らを全国的な成功へ導くことになる作品の発表を目前にして、麻薬の過剰摂取により28歳で死亡している。同じ地域から出たNo Doubtは1995年の作品で世界的な成功を収め、歌手Gwen Stefaniは時代を象徴する存在となった。フロリダのLess Than Jake、カリフォルニアのReel Big Fish、ボストンのThe Mighty Mighty Bosstonesが続き、1990年代半ばから後半がこの流行の最盛期だった。ラジオとテレビが同種のバンドを次々に取り上げ、レコード会社は競って契約したが、それゆえに供給が増えすぎるのも早かった。管楽器を加えて明るく演奏すれば売れるという安易な模倣が氾濫し、1999年頃には市場が急速に冷え込む。この分野は、軽快な曲調ゆえに軽んじられがちだが、Operation Ivyのように社会正義を強く求める歌詞を持つバンドも多い。しかし2010年代後半にはThe Interruptersなどが再びチャート入りし、Streetlight Manifestoのように高度な編曲を持つバンドや、各国の新しい世代によって、この様式は現在も更新され続けている。</p>
<h2>代表曲</h2><ul><li>The Impression That I Get（The Mighty Mighty Bosstones）</li><li>Sell Out（Reel Big Fish）</li><li>Superman (Goldfinger)</li><li>Same in the End (Sublime)</li><li>Would You Be Impressed? (Streetlight Manifesto)</li><li>Time Bomb (Rancid)</li><li>Beer (Reel Big Fish)</li><li>500 Channels (Choking Victim)</li><li>Sound System（Operation Ivy）</li><li>Johnny Quest Thinks We're Sellouts (Less Than Jake)</li><li>All My Best Friends Are Metalheads (Less Than Jake)</li><li>Everything Went Numb (Streetlight Manifesto)</li></ul>
