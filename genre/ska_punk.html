<h1>Ska Punk（スカパンク）とは</h1>
<p>ジャマイカ由来のスカの裏拍の刻みと、アメリカのパンクの速度と歪みを、一曲の中で交互に配置する音楽である。構造には明確な定型があり、歌の部分ではギターが裏拍だけを短く刻み、管楽器が軽やかな旋律を吹いて跳ねる感触を作る。そして繰り返し</p>
<p>ジャマイカ由来のスカの裏拍の刻みと、アメリカのパンクの速度と歪みを、一曲の中で交互に配置する音楽である。構造には明確な定型があり、歌の部分ではギターが裏拍だけを短く刻み、管楽器が軽やかな旋律を吹いて跳ねる感触を作る。そして繰り返し部分に入ると、歪んだギターが全ての拍を掻き鳴らし、テンポは変わらないまま音の密度だけが倍増して爆発する。この、跳ねる部分と押し潰す部分の落差が、聴かせどころであると同時に、客席での踊り方の切り替え点にもなっている。テンポは概ね160から200 BPMと速い。編成にはトランペット、トロンボーン、サックスによる管楽器隊が正式に加えられ、彼らは斉奏で覚えやすい音型を吹き、時に短い独奏も回す。ベースは8分音符で走り回り、ドラムは二拍四拍を強く踏む。和声は明るい長調の単純な進行が中心で、和音は三つか四つに限られる。歌唱は絶叫せず、早口で言葉を詰め込む語り口が好まれる。歌詞は失恋、友情、退屈な郊外の生活、そして自虐的な冗談を扱い、深刻さより軽妙さが優先される。全体として、悲しい内容でも明るく鳴るという性格を一貫して持つ。</p>
<h2>成り立ち</h2><p>系譜はジャマイカからイギリスを経てアメリカへ至る三段階を持つ。1960年代のジャマイカで生まれたスカが第一の波、1970年代末のイギリスで人種混成のバンドが政治的な意識とともに蘇らせた2 Toneの運動が第二の波であり、この分野は第三の波にあたる。舞台はアメリカ、とりわけカリフォルニアである。1987年、カリフォルニア州バークリーで結成されたOperation Ivyは、ハードコア・パンクの速度とスカの裏拍を強引に接合し、わずか2年の活動で解散したにもかかわらず、後続の全てが参照する原型を残した。彼らを世に出したのはLookout! Recordsという小さなレーベルで、構成員のTim ArmstrongとMatt Freemanは後にRancidを結成する。1990年代前半、この様式は南カリフォルニアの郊外の若者文化と結びついて拡大した。ロングビーチのSublimeはスカにレゲエとヒップホップを混ぜた独自の作風を確立したが、中心人物のBradley Nowellは1996年、彼らを全国的な成功へ導くことになる作品の発表を目前にして、麻薬の過剰摂取により28歳で死亡している。同じ地域から出たNo Doubtは1995年の作品で世界的な成功を収め、歌手Gwen Stefaniは時代を象徴する存在となった。フロリダのLess Than Jake、カリフォルニアのReel Big Fish、ボストンのThe Mighty Mighty Bosstonesが続き、1997年前後がこの流行の頂点だった。ラジオとテレビが同種のバンドを次々に取り上げ、レコード会社は競って契約したが、それゆえに飽和も早かった。管楽器を加えて明るく演奏すれば売れるという安易な模倣が氾濫し、1999年頃には市場が急速に冷え込む。この分野は長く、真面目でない、政治性を欠いた軽薄なものとして批評的に軽んじられてきた。しかし2010年代以降、当時10代だった世代が懐かしさとともに再評価を始め、Streetlight Manifestoのように高度な編曲を持つバンドや、各国の新しい世代によって、この様式は現在も更新され続けている。</p>
<h2>代表曲</h2><ul><li>Sound System（Operation Ivy）</li><li>Sell Out（Reel Big Fish）</li><li>The Impression That I Get（The Mighty Mighty Bosstones）</li></ul>
