<h1>French House（フレンチハウス）とは</h1>
<p>フレンチ・ハウスは、1990年代半ばのフランスで定着した、古い録音を加工することで独特の質感を得るハウスだ。 決定的な技法は、フィルターの操作にある。1970年代後半〜1980年代初頭のディスコやファンク、ソウルのレコードから、数</p>
<p>フレンチ・ハウスは、1990年代半ばのフランスで定着した、古い録音を加工することで独特の質感を得るハウスだ。

決定的な技法は、フィルターの操作にある。1970年代後半〜1980年代初頭のディスコやファンク、ソウルのレコードから、数小節のループを取り出す。それにフィルター（ローパスなど、特定の高さの音だけを通したり削ったりする装置）やフェイザー（音をうねらせる効果）をかけて、通す音の高さの範囲を時間とともにゆっくり上下させる。この操作によって、遠くで鳴っていた音が徐々に近づき、また遠ざかっていくような呼吸が生まれる。単純な反復に、劇的な起伏が与えられる。

加えて、音量の差を強く縮める圧縮処理と、キック（低音の太鼓）が鳴るたびに他の音の音量を一瞬押し下げる処理が、深くかけられる。全体が脈打つように揺れる。フェイザーによる金属的な渦巻きも常套手段である。

テンポは110〜130 BPM程度だ。キックは1拍ごとに正確に鳴る四つ打ちで、その上に元のレコードの電気ベース、ギター、エレピが層をなす。

旋律はサンプルのループが中心だが、サンプルに触発されたオリジナルのフックや、サンプル風に作った独自ループも使われる。声がサンプルやエフェクトで加工される例も多い。

全体として、記憶の中のディスコを再生しているような、懐かしさと未来的な質感が同居する。この点がスタイルの魅力である。</p>
<h2>成り立ち</h2><p>1990年代前半、フランスのダンス音楽は、国際的な存在感に乏しかった。1990年代半ばになって、英国などから注目され始めた。イギリスやドイツ、アメリカが主導権を握る中、フレンチ・ハウスは、アメリカのダンス音楽、ユーロ・ディスコ、スペース・ディスコなどの影響のもとで生まれた。1970年代後半〜1980年代初頭のフランスでは、スペース・ディスコやユーロ・ディスコが盛んだった。

Étienne de Crécyが発表したスーパー・ディスカウント（1996年に先行盤が出て、アルバム／CD盤は1997年とする資料もある）は、この方向の重要な初期作となる。Motorbassの『Pansoul』（1996年）が最も早い例の一つとされ、Bangalterの1995年のRoulé作品も最初期の例に挙げられる。

決定的だったのは、1997年にDaft Punkが発表したホームワークである。パリのThomas BangalterとGuy-Manuel de Homem-Christoによるデュオだ。前身のバンドDarlin'が、Melody MakerのDave Jenningsに酷評された。彼らは、その批評文の「a daft, punky thrash」という言葉を逆手に取って、バンド名としたという逸話を持つ。ハロウィン風の仮面や袋で顔を隠して素性を隠すという演出（ロボットのペルソナは1999年から）とともに、この音を世界へ届けた。

1998年にはThomas Bangalterが別名義で参加したStardustのミュージック・サウンズ・ベター・ウィズ・ユーが、Chaka Khanの楽曲の一節を執拗に反復させることで世界的な大ヒットとなった。この手法の到達点を示した。

周辺にはCassiusのPhilippe ZdarとBoom Bass、Alex Gopher、Modjo、Airといった作り手が並んだ。Thomas Bangalterが自ら設立したRouléや、相方がEric Chedeville（Rico the Wizard）と1997年に共同で設立したCrydamoureといった小規模なレーベルが、作品を送り出した。

フレンチ・タッチという呼び名は、1987年（6月とも7月とも）、パリのLe Palaceで写真家Jean-Claude Lagrèzeが「French Touch」パーティーを開いたのが先例だ。のちに英国のMelody MakerのMartin Jamesが広めた。サンプリングの権利処理は、このジャンルにとって課題の一つだった。

2000年代半ばには、Ed Banger Recordsを拠点とするJusticeらが、より歪んだ攻撃的な音でこの系譜を更新した。2013〜2014年にはDaft Punkがアメリカの主流の音楽と結びついて頂点を極める。2019年にPhilippe Zdarが事故により死亡し、2021年にはDaft Punkが解散を発表して、この時代は一区切りを迎えた。ただ、フィルターで加工されたディスコという発想は、現在のダンス音楽に深く根を下ろしている。</p>
