<h1>French House（フレンチハウス）とは</h1>
<p>1990年代半ばのフランスで確立した、古い録音を加工することで独特の質感を得るハウスである。決定的な技法はフィルターの操作にある。1970年代後半〜1980年代初頭のディスコやファンク、ソウルのレコードから数小節のループ（繰り返し</p>
<p>1990年代半ばのフランスで確立した、古い録音を加工することで独特の質感を得るハウスである。決定的な技法はフィルターの操作にある。1970年代後半〜1980年代初頭のディスコやファンク、ソウルのレコードから数小節のループ（繰り返しの断片）を取り出し、それにフィルター（ローパスなど、特定の高さの音だけを通したり削ったりする装置）やフェイザー（音をうねらせる効果）をかけて、通す音の高さの範囲を時間とともにゆっくり上下させる。この操作によって、遠くで鳴っていた音が徐々に近づき、また遠ざかっていくような呼吸が生まれ、単純な反復に劇的な起伏が与えられる。加えて、音量の差を強く縮める圧縮処理と、キック（低音の太鼓）が鳴るたびに他の音の音量を一瞬押し下げる処理が深くかけられ、全体が脈打つように揺れる。フェイザーによる金属的な渦巻きも常套手段である。テンポは110〜130 BPM程度、キックは1拍ごとに正確に鳴る四つ打ちで、その上に元のレコードの電気ベース、ギター、エレピなどの素材が層をなす。旋律はサンプルのループが中心だが、サンプルに触発された独自のフックや、サンプル風に作った独自のループも使われる。声がサンプルやエフェクトで加工される例も多い。全体として、記憶の中のディスコを再生しているような、懐かしさと未来的な質感が同居する点がこの様式の魅力である。</p>
<h2>成り立ち</h2><p>1990年代前半はフランスのダンス音楽が国際的な存在感に乏しく、1990年代半ばに英国などから注目され始めた。イギリスやドイツ、アメリカが主導権を握る中、パリの若い制作者たちは、アメリカのダンス音楽、ユーロ・ディスコ、スペース・ディスコなどの影響のもとで、ディスコの遺産に目をつける。1970年代後半〜1980年代初頭のフランスでは、スペース・ディスコやユーロ・ディスコが盛んだった。1996年に先行盤が出たÉtienne de Crécyのスーパー・ディスカウント（アルバム盤は1997年とする資料もあり、友人の曲を集めたコンピレーション的な作品）は、この方向の重要な初期作となる（Motorbassの『Pansoul』（1996年）が最も早い例の一つとされ、Bangalterの1995年のRoulé作品も最初期の例に挙げられる）。決定的だったのは1997年、パリのThomas BangalterとGuy-Manuel de Homem-Christoによるデュオ、Daft Punkが発表したホームワークである。前身のバンドDarlin'が、Melody MakerのDave Jenningsに「a daft, punky thrash」と酷評された言葉を逆手に取ってバンド名としたという逸話を持つ彼らは、ハロウィン風の仮面や袋で顔を隠して素性を隠すという演出（ロボットのペルソナは1999年から。ヘルメットを雑誌撮影で初披露したのは2001年）とともに、この音を世界へ届けた。1998年にはThomas Bangalterが別名義で参加したStardustのミュージック・サウンズ・ベター・ウィズ・ユーが、Chaka Khanの楽曲の一節を執拗に反復させることで世界的な大ヒットとなり、この手法の到達点を示した。周辺にはCassiusのPhilippe ZdarとBoom Bass、Alex Gopher、Modjo、Airといった作り手が並び、Thomas Bangalterが自ら設立したRouléや、相方がEric Chedevilleと1997年に共同で設立したCrydamoureといった小規模なレーベルが作品を送り出した。フレンチ・タッチという呼び名は、1987年（6月とも7月とも）にパリで写真家Jean-Claude Lagrèzeが「French Touch」パーティーを開いたのが先例で、のちに英国のMelody MakerのMartin Jamesが広めた。サンプリングの権利処理は、このジャンルにとって課題の一つだった。2000年代半ばには、Ed Banger Recordsを拠点とするJusticeらが、より歪んだ攻撃的な音でこの系譜を更新し、2013〜2014年にはDaft Punkがアメリカの主流の音楽と結びついて頂点を極める。2019年にPhilippe Zdarが事故により死亡し、2021年にはDaft Punkが解散を発表して、この時代は一区切りを迎えたが、フィルターで加工されたディスコという発想は、現在のダンス音楽に深く根を下ろしている。</p>
