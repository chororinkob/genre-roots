<h1>French House（フレンチハウス）とは</h1>
<p>1990年代半ばのフランスで確立した、古い録音を加工することで独特の質感を得るハウスである。決定的な技法はフィルターの操作にある。1970年代のディスコやファンク、ソウルのレコードから数小節の輪を取り出し、それに共振の鋭い帯域通過</p>
<p>1990年代半ばのフランスで確立した、古い録音を加工することで独特の質感を得るハウスである。決定的な技法はフィルターの操作にある。1970年代のディスコやファンク、ソウルのレコードから数小節の輪を取り出し、それに共振の鋭い帯域通過フィルターをかけて、通す周波数を時間とともにゆっくり上下させる。この操作によって、遠くで鳴っていた音が徐々に近づき、また遠ざかっていくような呼吸が生まれ、単純な反復に劇的な起伏が与えられる。加えて、音量を強く圧縮する処理と、キックが鳴るたびに他の音の音量を一瞬押し下げる処理が深くかけられ、全体が脈打つように揺れる。フェイザーによる金属的な渦巻きも常套手段である。テンポは118から128 BPM程度、キックは正確な四つ打ちで、その上に元のレコードの弦楽器やギターの掻き鳴らし、歓声が層をなす。旋律は自分で書かず、引用元の中にもともと存在するものを浮かび上がらせる形が多い。人の声も同様に加工され、言葉としてではなく音色として扱われる。全体として、記憶の中のディスコを再生しているような、懐かしさと未来的な質感が同居する点がこの様式の魅力である。</p>
<h2>成り立ち</h2><p>1990年代前半のフランスは、ダンス音楽の分野で国際的にはほとんど無名だった。イギリスやドイツ、アメリカが主導権を握る中、パリの若い制作者たちは、自国に固有の武器としてディスコの遺産に目をつける。1970年代、パリのスタジオでは大量のディスコやユーロ・ディスコが制作されており、中古レコード店にはその安価な在庫が眠っていた。1996年、Étienne de Crécyが発表したスーパー・ディスカウントは、フィルターを用いた加工の手法を体系的に提示し、この方向の出発点となる。決定的だったのは1997年、パリのThomas BangalterとGuy-Manuel de Homem-Christoによるデュオ、Daft Punkが発表したホームワークである。ロックバンドとして酷評された批評文の中の言葉を逆手に取ってバンド名としたという逸話を持つ彼らは、ロボットの仮面をかぶって素性を隠すという演出とともに、この音を世界へ届けた。1998年にはThomas Bangalterが別名義で参加したStardustのミュージック・サウンズ・ベター・ウィズ・ユーが、Chaka Khanの楽曲の一節を執拗に反復させることで世界的な大ヒットとなり、この手法の到達点を示した。周辺にはCassiusのPhilippe ZdarとBoom Bass、Alex Gopher、Modjo、Airといった作り手が並び、Thomas Bangalterが自ら設立したRouléや、相方によるCrydamoureといった小規模なレーベルが作品を送り出した。フレンチ・タッチという呼び名は、こうした一群を指す言葉として国外の音楽誌が使い始めたものである。彼らの成功には、既存のレコードを無断で使うことに伴う権利処理の問題が常につきまとい、多くの作品が後になって権利者との交渉を余儀なくされた。2000年代半ばには、Ed Banger Recordsを拠点とするJusticeらが、より歪んだ攻撃的な音でこの系譜を更新し、2010年前後にはDaft Punkがアメリカの主流の音楽と結びついて頂点を極める。2019年にPhilippe Zdarが事故により死亡し、2021年にはDaft Punkが解散を発表して、この時代は一区切りを迎えたが、フィルターで加工されたディスコという発想は、現在のダンス音楽に深く根を下ろしている。</p>
