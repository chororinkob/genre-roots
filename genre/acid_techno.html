<h1>Acid Techno（アシッドテクノ）とは</h1>
<p>テクノの硬質なリズムに、Roland TB-303の唸る音色をまるごと組み込んだ系統。アシッドハウスと同じ機材を使いながら、テンポを上げ、キックを硬く歪ませ、音の全体を攻撃的に仕上げる点で分かれる。テンポは135〜150BPM。T</p>
<p>テクノの硬質なリズムに、Roland TB-303の唸る音色をまるごと組み込んだ系統。アシッドハウスと同じ機材を使いながら、テンポを上げ、キックを硬く歪ませ、音の全体を攻撃的に仕上げる点で分かれる。テンポは135〜150BPM。TB-303は1台ではなく複数台を同時に走らせることが多く、それぞれ異なるフィルター設定とディストーション量で重ねることで、複数のうねりが重なり合い、ごちゃごちゃに混ざった音の層が生まれる。この多重303が見分けるいちばんのポイントになる。キックはコンプレッションとディストーションで潰され、アタックが鋭く短い。ハイハットは16分音符で細かく刻まれ、クラップは深いリヴァーブで空間を作る。上に重ねる音はほとんどなく、あってもサンプリングした声の断片、サイレン、機械音といった、メロディーのない素材。和音は事実上なく、303のシーケンスが単一の調の中を這い回るだけで曲が成立する。構成は起承転結を持たず、10分近く同じ骨格を保ちながら、つまみの操作だけで密度を上下させる。全体としてその場で作る度合いが高く、実際にライヴでは機材を並べて実時間で音を作る形態が好まれる。この点で、あらかじめ完成した音源を再生するEDM的な形式とは制作思想が根本的に異なる。</p>
<h2>成り立ち</h2><p>1980年代末から1990年代初頭にかけてヨーロッパで発展した。ドイツ(Hardfloorなど)も重要な地域シーンで、ロンドン・アシッドはその一つである。初期の推進者にはRichie Hawtin、Aphex Twin、Dave Clarke、Hardfloorらが挙がる。イギリスでの背景にあるのは、1988年のセカンド・サマー・オブ・ラヴ以降のレイヴが政府によって次々と規制され、とりわけ1994年のCriminal Justice and Public Order Actが、夜間に増幅音楽を流す野外集会に対して警察へ退去指示の権限を与え、従わなければ罰せられるようにしたという事情である。この法の条文は、音楽を「反復するビートの連続を主な特徴とする音」を含むものと定義している。この法律より前から、空き家や倉庫を占拠して開かれる無料パーティー(フリーパーティー)の文化は広がっており、法はそれに対する政府の対応だった。同じ時期、スクワット共同体を足場に、Spiral TribeやBedlamといったサウンドシステム集団が移動式の音響装置を持ち込み、警察との追いかけっこを繰り返しながらパーティーを開いた。ただしSpiral Tribeはフリー・テクノ(tekno)の元祖とされ、ガバなどより速くハードな方向の音で、ロンドンのアシッドテクノとは別の系統である。Bedlamは1992年にロンドン東部のDalstonで始まったとされる。Spiral Tribeは1992年5月のCastlemorton Common Festivalという2万〜4万人規模の無許可の集まりに関与し、13人が起訴されて長い裁判になったが、全員が無罪になった。1994年の法の契機とされるのは、この祭りそのものと、その取り締まりをめぐる世論である。ロンドン・アシッドを担ったのはStay Up Foreverというレーベルとその周辺のLiberator DJsで、Chris Liberator、Aaron Liberator、Julian Liberatorらが1993年前後に設立した。彼らは複数のTB-303を同時に鳴らし、キックを歪ませて速度を上げるという定型を作り、レコードを大量に自主プレスして地下流通させた。同時期にThe Liberators、D.A.V.E. The Drummer(Henry Cullen)、Guy McAffer らが活動し、いわゆるロンドン・アシッドまたはアシッド・テクノと呼ばれる音を固めた。ヨーロッパ大陸ではフランスとイタリアのテクニヴァル(無許可の大規模野外テクノ祭。主役は150〜185BPMのフリー・テクノ)も開かれ、チェコでは2005年のCzechTekが警察の大規模な暴力的排除を受けて政治問題になった。この文化は音楽であると同時に、土地の私有と国家の規制に対する明確な政治的な抵抗として位置づけられており、参加者は自らをトラベラーやサウンドシステム共同体と称した。1990年代末には、より遅く重い方向へ進んだハードテクノや、逆に速いハードコアへの分岐が起き、アシッドテクノは相対的に周縁へ移った。ただしCzechTek自体は2006年に終了を宣言している。2010年代後半以降は、303の音を用いた作品がベルリンのクラブでも再評価され、若い世代の制作者による復興が続いている。</p>
<h2>代表曲</h2><ul><li>Flash (Green Velvet)</li><li>Mentasm (Second Phase)</li><li>Acperience 1（Hardfloor）</li><li>One Night in Hackney（D.A.V.E. The Drummer &amp; Chris Liberator）</li><li>Digeridoo (Aphex Twin)</li><li>Croydon Girl (Chris Liberator &amp; Sterling Moss)</li><li>London Acid City（DDR &amp; The Geezer）</li><li>Before I Was So Rudely Interrupted (Dave Clarke)</li><li>Wisdom to the Wise (Dave Clarke)</li><li>Acidextrous (The Geezer)</li><li>Acid Resistance (Ant &amp; DDR)</li><li>Red 2 (Dave Clarke)</li><li>Acperience 2 (Hardfloor)</li><li>Still Lost in the Silver Box (Hardfloor)</li><li>The Prophet (C.J. Bolland)</li><li>Red 3 (Dave Clarke)</li><li>Beavis at Bat (Hardfloor)</li></ul>
