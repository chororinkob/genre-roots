<h1>Acid Techno（アシッドテクノ）とは</h1>
<p>アシッドテクノは、テクノの硬いリズムに、Roland TB-303の唸る音色をまるごと組み込んだ系統だ。使う機材はアシッドハウスと同じである。違いは、テンポを上げ、キックを硬く歪ませ、音の全体を攻撃的に仕上げる点にある。 中心にな</p>
<p>アシッドテクノは、テクノの硬いリズムに、Roland TB-303の唸る音色をまるごと組み込んだ系統だ。使う機材はアシッドハウスと同じである。違いは、テンポを上げ、キックを硬く歪ませ、音の全体を攻撃的に仕上げる点にある。

中心になるのはTB-303だ。1台ではなく、複数台を同時に走らせることが多い。それぞれ違うフィルター設定とディストーション量で重ねるので、いくつものうねりが重なり合い、ごちゃごちゃに混ざった音の層が生まれる。重ねた303の音は、特徴の一つである。

上に重ねる音はほとんどない。あっても、サンプリングした声の断片やサイレン、機械音といった、メロディーのない素材だ。303のラインが中心で、メロディアスな要素を持つ曲もある。

テンポは135〜150BPM。キックはコンプレッションとディストーションで潰され、アタックが鋭く短い。ハイハットは16分音符で細かく刻まれ、クラップは深いリヴァーブで空間を作る傾向がある。

曲は起承転結を持たず、10分近く同じ骨格を保ちながら、つまみの操作だけで音の密度を上げ下げする傾向がある。演奏の場ではDJプレイ（ヴァイナル中心）が主流で、ライヴ演奏を行うアーティストもいる。</p>
<h2>成り立ち</h2><p>アシッドテクノは、1980年代末から1990年代初頭にかけて、ヨーロッパで発展した。ドイツ(Hardfloorなど)や英国などが地域シーンで、ロンドン・アシッドは英国のシーンである。初期の推進者には、Richie Hawtin、Aphex Twin、Dave Clarke、Hardfloorらが挙がる。

ロンドンのアシッドテクノは、スクワット・パーティー文化の中で育った。イギリスでは、1988年のセカンド・サマー・オブ・ラヴ以降、レイヴが政府によって次々と規制された。とりわけ1994年のCriminal Justice and Public Order Actは、夜間に増幅音楽を流し、近隣住民に深刻な苦痛を与えるおそれがある野外集会に対し、警察へ退去指示の権限を与えた。従わなければ罰せられる。この法の条文は、音楽を「もっぱら、または主として反復するビートの連続を特徴とする音」を含むものと定義している。1994年の法は野外レイヴに打撃を与えたが、屋内のスクワット・シーンへの影響は限定的だった。

この法律より前から、空き家や倉庫を占拠して開く無料パーティー(フリーパーティー)の文化は広がっていた。法は、それに対する政府の対応だったが、トラベラーやスクワッターなどもまとめて対象にした広い法律だった。同じ時期、スクワット共同体を足場に、Spiral TribeやBedlamといったサウンドシステム集団が、移動式の音響装置を持ち込んだ。彼らは警察との追いかけっこを繰り返しながら、パーティーを開いた。

ただし、Spiral Tribeはフリー・テクノ(tekno)の元祖とされる。その音は、ガバと同程度の高速域（150〜185BPM前後）の、キックを重視した反復的なフリー・テクノで、ロンドンのアシッドテクノとは別の系統である。Bedlamは1992年に、ロンドン東部のDalstonで、フリー・テクノ系のサウンドシステムとして創設された。それ以前（1990年〜）は、ハウス・パーティーを開いていた。

1992年5月、Spiral TribeはCastlemorton Common Festivalに関わった。2万〜4万人規模の無許可の集まりである。13人が起訴されて長い裁判になったが、全員が無罪になった。1994年の法のきっかけとされるのは、この祭りそのものと、その取り締まりをめぐる世論である。

一方、ロンドン・アシッドを担ったのは、Stay Up Foreverというレーベルと、その周辺のLiberator DJsだ。レーベルは、Chris Liberator、Aaron Liberator、Julian Liberatorらが1993年前後に設立した。彼らは重ねた303を使うロンドン流のアシッドテクノを広めた。作品はヴァイナルを中心にリリースされ、スクワット・パーティー網やディストリビューターを通じて広まった。やや遅れて1995年ごろから、D.A.V.E. The Drummer(Henry Cullen)が加わった。The Liberators、Guy McAffer（The Geezer）らもこの時期に活動し、いわゆるロンドン・アシッド、またはアシッド・テクノと呼ばれる音を固めた。

ヨーロッパ大陸では、フランスとイタリアでテクニヴァル(無許可の大規模野外テクノ祭。主役は150〜185BPMのフリー・テクノ)も開かれた。チェコでは2005年、CzechTekが警察による大規模で暴力的な排除を受け、政治問題になった。参加者の中には、反体制的な色合いを持つ者もいた。ただし、トラベラーとレイヴァーは別の集団で、全体が政治的抵抗として一枚岩だったとは言えない。

CzechTek自体は2006年に終了を宣言している。近年も303を使う制作者が各地におり、アシッドは周期的に復活している。</p>
