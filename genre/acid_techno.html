<h1>Acid Techno（アシッドテクノ）とは</h1>
<p>テクノの硬質なリズムに、Roland TB-303の唸る音色を全面的に組み込んだ系統。アシッドハウスと同じ機材を使いながら、テンポを上げ、キックを硬く歪ませ、音の全体を攻撃的に仕上げる点で分かれる。テンポは135〜150BPM。T</p>
<p>テクノの硬質なリズムに、Roland TB-303の唸る音色を全面的に組み込んだ系統。アシッドハウスと同じ機材を使いながら、テンポを上げ、キックを硬く歪ませ、音の全体を攻撃的に仕上げる点で分かれる。テンポは135〜150BPM。TB-303は一台ではなく複数台を同時に走らせることが多く、それぞれ異なるフィルター設定とディストーション量で重ねることで、複数のうねりが干渉し合う混沌とした音の層が生まれる。この多重303が最大の識別点になる。キックはコンプレッションとディストーションで潰され、アタックが鋭く短い。ハイハットは16分音符で細かく刻まれ、クラップは深いリヴァーブで空間を作る。上物はほとんど存在せず、あってもサンプリングした声の断片、サイレン、機械音といった非旋律的な素材。和声は事実上なく、303のシーケンスが単一の調の中を這い回るだけで曲が成立する。構成は起承転結を持たず、10分近く同じ骨格を保ちながら、つまみの操作だけで密度を上下させる。全体として即興性が高く、実際にライヴでは機材を並べて実時間で音を作る形態が好まれる。この点で、あらかじめ完成した音源を再生するEDM的な形式とは制作思想が根本的に異なる。</p>
<h2>成り立ち</h2><p>1990年代前半のイギリス、とりわけロンドンのスクワット(不法占拠)文化から生まれた。背景にあるのは、1988年のセカンド・サマー・オブ・ラヴ以降のレイヴが政府によって次々と規制され、とりわけ1994年のCriminal Justice and Public Order Actが「反復するビートを特徴とする音楽」という文言で野外パーティーを違法化したという事情である。この法律に対抗する形で、空き家や倉庫を占拠して開かれる無料パーティー(フリーパーティー)の文化が拡大した。中心となったのはロンドン西部のスクワット共同体で、Spiral TribeやBedlamといった集団が移動式の音響装置を持ち込み、警察との追いかけっこを繰り返しながらパーティーを開いた。Spiral Tribeは1992年のCastlemorton Common Festivalという2万人規模の無許可の集まりに関与し、主要メンバーが起訴されて長期の裁判となった(結果的に全員無罪)。この裁判自体が上記の法改正の直接の引き金になった。音としてのアシッドテクノを確立したのはロンドンのStay Up Foreverというレーベルで、Chris Liberator、Aaron Liberator、Julian Liberatorらが1993年前後に設立した。彼らは複数のTB-303を同時に鳴らし、キックを歪ませて速度を上げるという定型を作り、レコードを大量に自主プレスして地下流通させた。同時期にThe Liberators、D.A.V.E. The Drummer(Henry Cullen)、Guy McAffer らが活動し、いわゆるロンドン・アシッドまたはアシッド・テクノと呼ばれる音を固めた。ヨーロッパ大陸ではフランスとイタリアのテクニヴァル(無許可の大規模野外テクノ祭)がこの音楽の主要な現場となり、チェコでは2005年のCzechTekが警察の大規模な暴力的排除を受けて政治問題になった。この文化は音楽であると同時に、土地の私有と国家の規制に対する明確な政治的抵抗として位置づけられており、参加者は自らをトラベラーやサウンドシステム共同体と称した。1990年代末には、より遅く重い方向へ進んだハードテクノや、逆に速いハードコアへの分岐が起き、アシッドテクノは相対的に周縁へ移った。ただし共同体としては現在も存続しており、イギリス、フランス、チェコ、スペインで年に数度、数千人規模の無料パーティーが今も開かれている。2010年代後半以降は、303の音を用いた作品がベルリンのクラブでも再評価され、若い世代の制作者による復興が続いている。</p>
<h2>代表曲</h2><ul><li>Acperience 1（Hardfloor）</li><li>London Acid City（DDR &amp; The Geezer）</li><li>One Night in Hackney（D.A.V.E. The Drummer &amp; Chris Liberator）</li></ul>
