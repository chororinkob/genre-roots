<h1>Japanese Folk（フォークソング）とは</h1>
<p>日本のフォークは、歌い手が自分で書いた日本語の歌を、自分で弾いて歌う音楽だ。代表曲26曲を動画で聴け、ルーツと影響のつながりを地図でたどれる。</p>
<p>日本のフォークは、歌い手が自分で書いた日本語の歌を、自分で弾いて歌う音楽だ。

編成は小さい。スチール弦のアコースティックギター1本か、そこにハーモニカやベースが加わる程度である。

和声はG・C・D・Emのような、ギターの開放弦を使って押さえやすい3〜4個のコードを中心に回ることが多い。メロディーは話し言葉の抑揚に近く、音域の狭い素朴な節回しが多い。

ギターの弾き方は二つに分かれる。一つは、親指で低音弦を交互に弾きながら、人差し指と中指で高音弦をつまむスリーフィンガー奏法。もう一つは、ピックで全部の弦をかき鳴らすストローク奏法だ。

首にかけたハーモニカホルダーにハーモニカを固定し、ギターを弾きながら間奏を吹く姿も定番になっている。これはボブ・ディランに倣ったスタイルといわれる。

リズムは4分の4拍子か3拍子のワルツが中心だ。テンポはおおむねBPM70〜120ほどとされる。

ドラムが入らないことも多い。ギターの低音が1拍目と3拍目で交互に鳴るオルタネート・ベースが拍を刻み、2拍目と4拍目にストロークの軽いアクセントが来る。

音響処理はごく控えめだ。リバーブを薄くかけた程度の、乾いた生音の質感が基本といわれる。

歌い方は、声を張り上げる技巧よりも、語りかけるような地声で言葉をはっきり届けることが重んじられる。グループでは、高音と低音を重ねる2〜3声のハーモニーがよく使われる。

歌詞の主題は大きく二つある。一つは、戦争や差別、社会への怒りを直接ぶつけるプロテストソングだ。もう一つは、恋人との貧しい暮らしや故郷、青春の別れを描く「生活派」「四畳半フォーク」と呼ばれる私的な歌である。

曲の構成は、同じメロディーに何番もの歌詞を乗せていく有節形式が中心だ。物語を語るように進み、最後の一節で心情が明かされる作りの曲も多い。

隣接するジャンルとの違いもある。歌謡曲では作詞家・作曲家が歌手のために曲を書くが、フォークでは歌い手自身が作って歌う自作自演が主流だ（ただし、作詞に外部の書き手を迎えた曲も多い）。

同じ自作自演でも、ニューミュージックのようにバンドやストリングスで飾った洗練されたサウンドではない。生ギター中心の素朴な音と、言葉の生活感や思想性が前に出る。

エレキギターとドラムのバンドで洋楽風のロックを歌ったグループ・サウンズとは、楽器の編成が対照的だ。アメリカのフォーク・ロックのように電気楽器で大きく鳴らすことも、初期には少なかった。

また、世界各地の伝承民謡としてのフォークや、日本の民謡とは、名前が似ているだけで別の音楽である。

この音楽が鳴っていたのは、大学のキャンパスや学園祭、歌い手と聴き手が一緒に歌う手作りの集会、野外のフォークジャンボリー、駅前の地下広場、そして若者が夜中に耳を傾けた深夜ラジオだ。</p>
<h2>成り立ち</h2><p>日本で「フォーク」と呼ばれる音楽の起点をどこに置くかは難しいとされる。それでも、二つの流れが合わさったものを「日本版フォークソングの誕生」とする見方が多い。一つは、1940年代後半に始まり1950〜60年代に最盛期を迎えたうたごえ運動だ。もう一つは、1959年以降、海外のヒット曲として入ってきたキングストン・トリオ、ブラザース・フォア、ピーター・ポール&amp;マリー（PPM）らアメリカのモダンフォークである。

1960年代前半には、東京の成城学園・青山学院・明治学院などの学校法人に属する私立大学の学生が、アイビールックに身を包んだ。彼らがアメリカの曲を英語の歌詞のままコピーして歌うカレッジ・フォーク（キャンパス・フォーク）が広がった。

立教大学の大沢保がつくったセント・ポール・フォーク・シンガーズらは、1963年12月に銀座ガスホールで「フーテナニー'63」を開いた。これが、それまでばらばらだった動きに横のつながりを生むきっかけになったとされる。

1966年には、「国産フォークギター第1号」とされるヤマハFG180が発売された。マイク眞木の「バラが咲いた」も大ヒットしたが、これは職業作家の浜口庫之助による作品で、のちに「フォークソング風歌謡曲」と評されている。

1960年代後半になると、学生運動やベトナム反戦の空気の中で、関西フォークが生まれた。メッセージ性の強いアンダーグラウンドな音楽として登場し、軟弱とも見られた東京のカレッジ・フォーク中心の流れを変えたとされる。

京都の学生グループ、ザ・フォーク・クルセダーズは、LP『ハレンチ』を自主製作した。その収録曲がシングル化された「帰って来たヨッパライ」は、ラジオの深夜放送で火がついた。1967年12月25日に東芝音楽工業から発売され、公称280万枚（当時のディレクター高嶋弘之は実売を約200万枚と証言している）を売り上げる社会現象となった。フォークの自作自演曲として初めての大ヒットといえるものとされる。

1967年9月、秦政明が高石友也のマネジメントのために高石音楽事務所を設立した。ここには高田渡、岡林信康、五つの赤い風船、中川五郎、遠藤賢司らが所属した。1969年に設立された会員制・通信販売のレコード会社URC（アングラ・レコード・クラブ）が、普及を支えた。

岡林信康の「友よ」「山谷ブルース」、高田渡の「自衛隊に入ろう」などが歌われた。1969年には、新宿駅西口地下広場に現れたフォークゲリラが機動隊に排除された。

その一方で、発売や放送をめぐる規制も相次いだ。ザ・フォーク・クルセダーズ「イムジン河」は、発売予定の前日（1968年2月20日）にレコード会社の判断で発売中止となった。岡林信康のシングル「ほんじゃまあおじゃまします」も発売中止になった（その代わりに「山谷ブルース」がデビュー曲として出た）。赤い鳥の「竹田の子守唄」は、放送局の自主規制で事実上流れにくくなった。

1969年から1971年にかけて、岐阜県恵那郡坂下町（現・中津川市）の椛の湖畔で全日本フォークジャンボリーが3回開かれた。この時期の盛り上がりを代表するイベントである。

流れを変えたのは、広島フォーク村出身の吉田拓郎だった。諸説あるものの、1971年の第3回全日本フォークジャンボリーでのステージによって、関西フォーク中心の流れに向き合う存在として認知された。1972年の「結婚しようよ」「旅の宿」のヒットは、政治と結びついた連帯の歌から、個人の生活や内面を歌うフォークへの転換を印象づけた。

音楽評論家の富澤一誠は、70年安保が自動延長となり、若者の歌が「僕たち」から「僕の」へと内側に向かったことを、この「生活派フォーク」の背景として論じている。

1973年には南こうせつとかぐや姫の「神田川」、井上陽水の「夢の中へ」がヒットした。陽水のアルバム『氷の世界』は1975年に、日本のレコード史上初めてアルバム売上100万枚を超えた。さらに1974年にはグレープの「精霊流し」、1975年には風の「22才の別れ」が続いた。

1975年には、小室等・吉田拓郎・井上陽水・泉谷しげるが、アーティスト自身のレコード会社フォーライフ・レコードを設立した。静岡県掛川市で開かれた「吉田拓郎・かぐや姫 コンサート インつま恋」には、主催者発表で5万人が集まった（報道では6万5千〜7万5千人など諸説あり、正確な人数は不明）。

ただし、きれいごとばかりではない。拓郎の「結婚しようよ」は、メッセージ性を重んじるそれまでのフォークの支持者からは批判の的になった。フォーク歌手のなぎら健壱は、当時の反戦の歌を「アメリカの真似をして反戦と言っているポーズみたいなところがあった」と振り返っている。拓郎自身も「僕はフォークじゃない」と語っている。この時代の歌い手には、ロックに憧れていたが、エレキギターやアンプが高く生ギターを選んだと語る人もいる。

富澤一誠は「1975年にユーミンが出現したころから、フォークという言葉が消え、ニューミュージックに受け継がれていきました」と論じている。1975年前後が、フォークからニューミュージックへの移り変わりの目安とされるが、はっきりした境目があるわけではない。

フォークは1980年代半ばには早くも懐メロ扱いされるようになった。それでも海援隊の武田鉄矢のように、その後も自らを「フォーク」の側の人間として語り続けた歌い手もいる。2015年には、4月9日が日本記念日協会によって「フォークソングの日」に認定された。</p>
