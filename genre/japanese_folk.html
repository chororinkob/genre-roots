<h1>Japanese Folk（フォークソング）とは</h1>
<p>日本のフォークは、スチール弦のアコースティックギター1本、あるいはそこにハーモニカやベースが加わる程度の小さな編成で、歌い手が自分で書いた日本語の歌を弾き語る音楽である。代表曲27曲を動画で聴け、ルーツと影響のつながりを地図でたどれる。</p>
<p>日本のフォークは、スチール弦のアコースティックギター1本、あるいはそこにハーモニカやベースが加わる程度の小さな編成で、歌い手が自分で書いた日本語の歌を弾き語る音楽である。和声はG・C・D・Emのような、ギターの開放弦を使って押さえやすい3〜4個のコードを中心に回り、メロディーは話し言葉の抑揚に近い、音域の狭い素朴な節回しが多い。ギターは、親指で低音弦を交互に弾きながら人差し指と中指で高音弦をつまむスリーフィンガー奏法か、ピックで全部の弦をかき鳴らすストローク奏法で鳴らされる。首にかけたハーモニカホルダーにハーモニカを固定し、ギターを弾きながら間奏を吹く姿は、ボブ・ディランに倣った定番のスタイルである。リズムは4分の4拍子か3拍子のワルツが中心で、テンポはおおむねBPM70〜120ほどの、歩く速さから少し速い程度。ドラムが入らないことも多く、ギターの低音が1拍目と3拍目で交互に鳴るオルタネート・ベースが拍を刻み、2拍目と4拍目にストロークの軽いアクセントが来る。音響処理はごく控えめで、リバーブを薄くかけた程度の、乾いた生音の質感が基本になる。曲の構成は、同じメロディーに何番もの歌詞を乗せていく有節形式が中心で、物語を語るように進み、最後の一節で心情が明かされる作りが聴かせどころになる。歌い方は、声を張り上げる技巧よりも、語りかけるような地声で言葉をはっきり届けることが重んじられ、グループでは高音と低音を重ねる2〜3声のハーモニーがよく使われる。歌詞の主題は大きく二つあり、一つは戦争や差別、社会への怒りを直接ぶつけるプロテストソング、もう一つは恋人との貧しい暮らしや故郷、青春の別れを描く「生活派」「四畳半フォーク」と呼ばれる私的な歌である。隣接するジャンルとの違いでは、作詞家・作曲家が歌手のために曲を書く歌謡曲と違って、歌い手自身が作って歌う自作自演が主流である（ただし、作詞に外部の書き手を迎えた曲も多い）。同じ自作自演でも、ニューミュージックのようにバンドやストリングスで飾った洗練されたサウンドではなく、生ギター中心の素朴な音と、言葉の生活感や思想性が前に出る。エレキギターとドラムのバンドで洋楽風のロックを歌ったグループ・サウンズとは楽器の編成が対照的で、アメリカのフォーク・ロックのように電気楽器で大きく鳴らすことも初期には少なかった。また、世界各地の伝承民謡としてのフォークや、日本の民謡とは、名前が似ているだけで別の音楽である。この音楽が鳴っていたのは、大学のキャンパスや学園祭、歌い手と聴き手が一緒に歌う手作りの集会、野外のフォークジャンボリー、駅前の地下広場、そして若者が夜中に耳を傾けた深夜ラジオである。</p>
<h2>成り立ち</h2><p>日本で「フォーク」と呼ばれる音楽の起点をどこに置くかは難しいとされるが、1950年代のうたごえ運動と、1959年ごろから海外のヒット曲として入ってきたキングストン・トリオ、ブラザース・フォア、ピーター・ポール&amp;マリー（PPM）らアメリカのモダンフォークが合わさったものを「日本版フォークソングの誕生」とする見方が多い。1960年代前半には、東京の成城学園・青山学院・明治学院など私立大学の学生が、アイビールックに身を包み、アメリカの曲を英語の歌詞のままコピーして歌うカレッジ・フォーク（キャンパス・フォーク）が広がった。立教大学の大沢保がつくったセント・ポール・フォーク・シンガーズらが1963年12月に銀座ガスホールで開いた「フーテナニー'63」は、それまでばらばらだった動きに横のつながりを生むきっかけになったとされる。1966年には国産初の本格的なフォークギターとされるヤマハFG180が発売され、マイク眞木の「バラが咲いた」が大ヒットしたが、これは職業作家の浜口庫之助による作品で、のちに「フォークソング風歌謡曲」と評されている。1960年代後半になると、学生運動やベトナム反戦の空気の中で、関西フォークが生まれた。きれいごとに見えた東京のカレッジ・フォークへのカウンターカルチャーとして語られることが多い。京都の学生グループ、ザ・フォーク・クルセダーズが自主製作した「帰って来たヨッパライ」は、ラジオの深夜放送で火がつき、1967年12月25日に東芝音楽工業から発売されて公称280万枚（当時のディレクター高嶋弘之は実売を約200万枚と証言している）を売り上げる社会現象となり、フォークの自作自演曲として初めての大ヒットといえるものとされる。1967年に高石友也と秦政明が設立した高石音楽事務所には、高田渡、岡林信康、五つの赤い風船、中川五郎、遠藤賢司らが所属し、1969年に設立された会員制・通信販売のレコード会社URC（アングラ・レコード・クラブ）が普及を支えた。岡林信康の「友よ」「山谷ブルース」、高田渡の「自衛隊に入ろう」などが歌われ、1969年には新宿駅西口地下広場に現れたフォークゲリラが機動隊に排除された。その一方で、ザ・フォーク・クルセダーズ「イムジン河」が発売予定の前日（1968年2月20日）にレコード会社の判断で発売中止となり、岡林信康のシングル「ほんじゃまあおじゃまします」も発売中止になった（その代わりに「山谷ブルース」がデビュー曲として出た）。赤い鳥の「竹田の子守唄」が放送局の自主規制で事実上流れにくくなるなど、発売や放送をめぐる規制も相次いだ。1969年から1971年にかけて岐阜県中津川市で3回開かれた全日本フォークジャンボリーは、この時期の盛り上がりを象徴するイベントである。流れを変えたのは、広島フォーク村出身の吉田拓郎だった。諸説あるものの、1971年の第3回全日本フォークジャンボリーでのステージによって、関西フォーク中心の流れに対峙する存在として認知され、1972年の「結婚しようよ」「旅の宿」のヒットで、政治と結びついた連帯の歌から、個人の生活や内面を歌うフォークへの転換を印象づけた。音楽評論家の富澤一誠は、70年安保が自動延長となり、若者の歌が「僕たち」から「僕の」へと内側に向かったことを、この「生活派フォーク」の背景として論じている。1973年には南こうせつとかぐや姫の「神田川」、井上陽水の「夢の中へ」がヒットし、陽水のアルバム『氷の世界』は1975年に日本のレコード史上初めてアルバム売上100万枚を超えた。さらに1974年にはグレープの「精霊流し」、1975年には風の「22才の別れ」が続いた。1975年には小室等・吉田拓郎・井上陽水・泉谷しげるがアーティスト自身のレコード会社フォーライフ・レコードを設立し、静岡県掛川市で開かれた「吉田拓郎・かぐや姫 コンサート インつま恋」には、主催者発表で5万人（報道では6万〜7万人とも）が集まった。ただし、きれいごとばかりではない。拓郎の「結婚しようよ」は、メッセージ性を重んじるそれまでのフォークの支持者からは批判の的になった。フォーク歌手のなぎら健壱は当時の反戦の歌を「アメリカの真似をして反戦と言っているポーズみたいなところがあった」と振り返り、拓郎自身も「僕はフォークじゃない」と語っている。この時代の歌い手の多くはもともとロックやR&amp;Bに憧れており、エレキギターやアンプが高かったから生ギターを選んだと証言する人もいる。富澤一誠は「1975年にユーミンが出現したころから、フォークという言葉が消え、ニューミュージックに受け継がれていきました」と論じており、1975年前後がフォークからニューミュージックへの移り変わりの目安とされるが、はっきりした境目があるわけではない。フォークは1980年代半ばには早くも懐メロ扱いされるようになったが、海援隊の武田鉄矢のように、その後も自らを「フォーク」の側の人間として語り続けた歌い手もいる。2015年には、4月9日が日本記念日協会によって「フォークソングの日」に認定された。</p>
