<h1>Hard-Psy（ハードサイ）とは</h1>
<p>ハードサイは、サイケデリック・トランスの跳ねるベースラインと、ハードスタイルやハードコアテクノの重く歪んだキックドラムを組み合わせたダンス音楽である。 キックは、サイケトランス本来の丸く短いものではない。ハードスタイル流に長いテイ</p>
<p>ハードサイは、サイケデリック・トランスの跳ねるベースラインと、ハードスタイルやハードコアテクノの重く歪んだキックドラムを組み合わせたダンス音楽である。

キックは、サイケトランス本来の丸く短いものではない。ハードスタイル流に長いテイルを持ち、音程を合わせたこのキックで、ベース音を作る。

上に重ねる音には、アシッド的なリードが使われる。

テンポは約140〜160 BPMだ。四つ打ちのキックに対し、ベースは作品によって異なる。ハードスタイル由来のリバース・ベースもあれば、サイケトランス由来の転がるベースや3連のベースもある。この並べ方によって、拍の隙間が絶えず埋められ、走り続けるような勢いが生まれる。

曲は、ミッドイントロから、ハードスタイル型のビルドアップとドロップへ移る。屋外の大型フェスティバルの深夜帯や、明け方のテントで鳴らすことを前提にした音作りである。</p>
<h2>成り立ち</h2><p>背景には、二つの流れがある。

ひとつは、ゴア・トランスの系譜だ。ゴア・トランスは1990年代初頭にインドのゴアで成立し、のちにヨーロッパなどで発展した。2000年代には、ダークサイケやフォレストとして、速さと暗さを増していった。

もうひとつは、ハードスタイルの系譜である。オランダ、ベルギー、イタリアにルーツを持ち、同じ時期に巨大な産業へ成長した。

両者は長いあいだ、別々のフェスティバルと別々の客層を持っていた。2000年代前半から中盤には、屋外フェスがすでに複数のステージを並べる形を取っていた。ハードコア系のフェスであるDominatorも、2005年の初回からThunderdomeなど複数のステージを持っていた。

やがて現れたのが、オランダのNigel CoppenとThomas VeldermanによるSub Zero Projectだ。ハードスタイルのキックに、サイケトランスの転がるベースを組み合わせた作風を打ち出した。2013年12月にDirty Workzと契約し、初期のリリースは2014年である。2019年のライブ・アクト『The Contagion』や、2020年初演の『Rave Into Space』で知られる。この混ぜ合わせはサイスタイル(psystyle)とも呼ばれる。ただし、サイスタイルとハードサイ(hardpsy)は、別のものとして扱われることが多い。ハードサイはサイスタイルより速く、ベースが荒く、構成もハードダンス寄りだとする見方がある。ハードサイの起源にも複数の説があり、2010年代半ばに米国の制作者STARXが生んだとする説もある。

Sub Zero Projectは、Cooneが2006年にベルギーで設立したDirty Workzから作品を出している。また、Sub Zero Projectは、Defqon.1のREDやBLUEなどのステージに出演している。

一方、サイケトランスとハードコアを結びつける試みは、1990年代前半にすでに原型があった。1996年には、オランダのCenobite Records(Leviathan)が、トランスやゴアの影響を取り入れたスタイルを推し進めた。この試みはサイコアやハイテク系の周辺で、マケドニア、フランス、ロシア、英国などにも広がった。</p>
