<h1>Hard-Psy（ハードサイ）とは</h1>
<p>サイケデリック・トランスの跳ねるベースラインと、ハードスタイルやハードコアテクノの重く歪んだキックドラムを結合させたダンス音楽である。テンポは概ね145から160 BPMで、四つ打ちのキックの直後、裏拍にあたる位置へ短く切られたベ</p>
<p>サイケデリック・トランスの跳ねるベースラインと、ハードスタイルやハードコアテクノの重く歪んだキックドラムを結合させたダンス音楽である。テンポは概ね145から160 BPMで、四つ打ちのキックの直後、裏拍にあたる位置へ短く切られたベース音を置く、いわゆるオフビート・ベースがリズムの土台となる。この配置によって、拍の隙間が絶えず埋められ、走り続けるような推進力が生まれる。キックはサイケトランス本来の丸く短いものではなく、ハードスタイル流に長い減衰部を持ち、その尾の部分の音程を下げていくことで独特の沈み込む感覚を作る。上物にはフェイザーやフランジャーを深くかけたアシッド的なシンセ、逆再生した金属音、映画や説教から抜き出した語りのサンプルが用いられ、モードは基本的に短調で、不安を煽る半音進行が多用される。曲は8小節ごとに要素を足し引きしながら、中盤で一度リズムを消し、シンセだけの浮遊した空間を作ってから最も重い部分へ雪崩れ込む構成を取る。屋外の大型フェスティバルの深夜帯や、明け方のテントで鳴らすことを前提にした音の設計であり、旧来のサイケトランス勢からは、瞑想的な浮遊感を捨てて肉体的な暴力性に走ったものと見なされることも多い。</p>
<h2>成り立ち</h2><p>背景には二つの流れがある。ひとつは1990年代にインドのゴアからヨーロッパへ持ち帰られたゴア・トランスが、2000年代にダークサイケやフォレストとして高速化と暗黒化を進めた系譜であり、もうひとつは同じ時期にオランダとベルギーで巨大産業に成長したハードスタイルの系譜である。両者は長らく別のフェスティバル、別の客層を持っていたが、2000年代末から屋外フェスが複数のステージを並べる形式を取るようになり、同じ週末に両方を体験する客が増えたことで距離が縮まった。決定的だったのは2010年代半ば以降、オランダのNigel CoppenとThomas VeldermanによるSub Zero Projectが、ハードスタイルのキックにサイケトランスの転がるベースを組み合わせた作風を打ち出し、2019年のレイヴ・イントゥ・スペースなどで大規模フェスの主要時間帯を任されるまでになったことである。この折衷はサイスタイルとも呼ばれ、Coone が2007年にベルギーで設立したDirty Workzをはじめとするハードダンス系レーベルが積極的に売り出した。フランスやイスラエル、南アフリカでは、これとは別にダークサイケの側からテンポを上げてハードコアへ接近する動きがあり、両側からの歩み寄りが同じ呼称でまとめられている。この節操のなさは批判も呼び、純粋なサイケトランス愛好家からは、ドラッグ体験と結びついた儀式性を娯楽消費へ引き下げたと非難され、逆にハードスタイル側からは軟弱だと言われるという、両側から挟まれる立場に置かれてきた。それでも大規模フェスにおける動員力は高く、現在ではDefqonやDominatorといったオランダの巨大イベントに専用のステージが設けられるまでに定着している。</p>
