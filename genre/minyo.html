<h1>Min'yōとは</h1>
<p>民謡は、日本各地の風土や気候、暮らしの中から自然に生まれてきた、生活に根ざした伝統的な歌の総称だ。 もともとは伴奏のない労作歌が多かった。三味線などの伴奏は、近世、三味線の登場から付け加えられた（和楽器を加えるかどうかは任意）。 </p>
<p>民謡は、日本各地の風土や気候、暮らしの中から自然に生まれてきた、生活に根ざした伝統的な歌の総称だ。

もともとは伴奏のない労作歌が多かった。三味線などの伴奏は、近世、三味線の登場から付け加えられた（和楽器を加えるかどうかは任意）。

メロディーは、本州・九州・四国の古来の民謡の大半が使う「民謡音階」（二六抜き短音階。短音階の2番目と6番目の音を抜いた5音音階で、ペンタトニックの一種）でできている。この音階が、日本人が「和風」と感じる哀愁と素朴さを生み出している。

これとは別に、「ヨナ抜き音階」という5音音階もある。西洋の7音階から4番目(ファ)と7番目(シ)を抜いたもので、明治以降に唱歌や歌謡曲を通じて定着した。ヨナ抜き長音階の主音をラにすると、民謡音階と同じになる。ヨナ抜き短音階は、都節音階の第3音を主音にしたものと同じである。

歌い方の特徴は、声を細かく震わせたり、飾るように揺らしたりする「こぶし」（演歌にも通じる独特の節回し）を効かせることだ。この独特の歌い方が、民謡の大きな特徴になっている。

歌われる場面は、田植えや漁の時の労働歌、祭りの歌、酒の席を盛り上げる歌などさまざまだ。どれもその土地の暮らしと分かちがたく結びつき、地域ごとに世代を超えて受け継がれてきた。

労働や祭り・儀式の実用的な必要から生まれた歌が多いことも特徴だ。木材を運び動かす作業や地固めの現場で、掛け声として力を合わせるために歌われた「木遣り」。夏祭りの輪踊りで歌われる「盆踊り唄」。こうした歌は単なる娯楽ではなく、共同体の営みそのものと結びついてきた。</p>
<h2>成り立ち</h2><p>民謡には、特定の作者がいない。労働や祭りの現場で、世代から世代へ口伝えされてきた歌の総称であり、個々の唄の成立時期は不明なものが多い。ただし、「民謡」という語と考え方そのものは近代のものである。ヘルダーが1773年の論考で用いたドイツ語のVolksliedの訳語として、明治中期に作られた。

作業の歌では、作業の動きそのものがリズムを決めていた。田植えの田植唄、木を挽く木挽唄、船を漕ぐ舟唄、機を織る機織唄などがそうだ。

中世から近世にかけては、盲目の女性芸能者である瞽女や、家々を回って唄う門付芸人が、各地を門付けして歩いた。江戸時代には、北前船の往来に沿って歌が伝わったともいわれる。九州の「ハイヤ節」（発祥には諸説あり、平戸田助説と天草・牛深説がある）は、日本海側を北上し、佐渡の「佐渡おけさ」や津軽の唄へ姿を変えていったと伝えられる。

近代に入ると、民謡は消えゆくものとして記録の対象になった。柳田國男が民謡論の組み立てや分類、指導を担った。その指導を受けた邦楽研究家の町田佳聲（本名・町田嘉章）らは、全国を回って旋律を五線譜に書き取り、NHKの民謡調査『日本民謡大観』に中心的に携わった。

1910年代には、レコード会社が各地の唄を扱い始めた。1920年代後半の大正末〜昭和初期にかけては、民謡・新民謡が大量に作られて出回り、地域の唄が全国の家庭で聴かれるようになる。三味線などの伴奏は、近世、三味線の登場から付け加えられ、その後も加わり続けた。

第二次世界大戦後、昭和30年代を中心に民謡ブームが起きた。三橋美智也は民謡歌手として出発し、歌謡曲の大スターとなった。津軽三味線では高橋竹山が、一地方の芸だった津軽三味線を全国に広めた第一人者となった。

東京の上野・浅草界隈には、昭和30年代に100軒以上の民謡酒場があったと言われる。日本民謡協会などの団体が競技大会を運営したことで、唄はうまさを競うものという側面を持つようになった、という見方もある。

しかし、高度経済成長による農村の解体で、唄が本来鳴っていた労働の現場は大きく失われた。現在の民謡は、保存会や教室、コンクール、観光の場で受け継がれる形が主流だ。その一方で、吉田兄弟のように津軽三味線を現代的な文脈へ持ち出す動きも続いている。</p>
