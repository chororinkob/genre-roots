<h1>Min'yōとは</h1>
<p>日本各地それぞれの風土・気候・暮らしの中から自然発生的に生まれてきた、生活に根ざした伝統的な歌の総称。三味線、尺八、太鼓といった和楽器の伴奏に乗せて、声を細かく震わせたり装飾的に揺らしたりする「こぶし」を効かせて歌う、独特の歌唱法</p>
<p>日本各地それぞれの風土・気候・暮らしの中から自然発生的に生まれてきた、生活に根ざした伝統的な歌の総称。三味線、尺八、太鼓といった和楽器の伴奏に乗せて、声を細かく震わせたり装飾的に揺らしたりする「こぶし」を効かせて歌う、独特の歌唱法が特徴である。「ヨナ抜き音階」と呼ばれる、西洋の7音階から4番目(ファ)と7番目(シ)の音を抜いた5音音階(ペンタトニック)によるメロディーが、日本人が「和風」と感じる哀愁と素朴さを生み出している。田植えや漁の際に歌われた労働歌、祭りで歌われる歌、酒の席を盛り上げる歌など、それぞれの土地の暮らしと分かちがたく結びついた歌が、地域ごとに世代を超えて受け継がれてきた、日本音楽の最も深い根っこにあたる存在である。木材の伐採現場で拍子を合わせるために歌われた「木遣り」、夏祭りの輪踊りで歌われる「盆踊り唄」など、労働や祭祀の実用的な必要性から生まれた歌が多いことも特徴で、単なる娯楽ではなく共同体の営みそのものと結びついてきた。</p>
<h2>成り立ち</h2><p>民謡は特定の作者を持たず、労働や祭りの現場で世代から世代へ口伝えされてきた歌の総称であり、その起源は文字記録以前にさかのぼる。田植えの田植唄、木を伐り出す木挽唄、船を漕ぐ舟唄、糸を紡ぐ機織唄のように、作業の動作そのものがリズムを決めていた。中世から近世にかけては、盲目の女性芸能者である瞽女や、家々を回って唄う門付芸人が、地域を越えて歌を運ぶ役割を果たした。江戸時代には北前船の航路に沿って歌が伝わり、九州の「ハイヤ節」が日本海側を北上して佐渡の「佐渡おけさ」や津軽の唄へ姿を変えていったことが知られている。近代に入ると、民謡は消えゆくものとして記録の対象になる。柳田國男が民俗学の立場から採集を進め、音楽学者の町田佳聲は全国を回って旋律を五線譜に採り、後にNHKと共同で大規模な民謡調査を行った。1920年代からはレコード会社が民謡を商品として録音するようになり、地域の唄が全国の家庭で聴かれるようになる。この過程で三味線・尺八・太鼓を伴う整った伴奏が標準となり、本来は無伴奏だった唄にも型が与えられた。第二次世界大戦後、1950年代から60年代にかけて民謡ブームが起き、三橋美智也が民謡歌手として出発して歌謡曲の大スターとなり、津軽三味線では高橋竹山が門付けの芸を独奏芸術へと高めた。全国各地に民謡酒場が生まれ、日本民謡協会などの団体が競技大会を運営したことで、唄はうまさを競うものという側面を持つようになる。一方で高度経済成長による農村の解体は、唄が本来鳴っていた労働と祭りの現場そのものを消し去った。現在の民謡は保存会と教室、コンクール、観光の場で受け継がれる形が主流だが、吉田兄弟のように津軽三味線を現代的な文脈へ持ち出す動きも続いている。</p>
