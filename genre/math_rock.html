<h1>Math Rock（マスロック）とは</h1>
<p>拍子と音型の複雑さそのものを聴きどころに据えたロックである。4/4拍子を離れ、7/8、5/4、11/8、13/8といった変拍子を曲中で次々に切り替え、さらに小節の長さを不規則に伸縮させることで、聴き手が拍を数えようとしても足元が定</p>
<p>拍子と音型の複雑さそのものを聴きどころに据えたロックである。4/4拍子を離れ、7/8、5/4、11/8、13/8といった変拍子を曲中で次々に切り替え、さらに小節の長さを不規則に伸縮させることで、聴き手が拍を数えようとしても足元が定まらない感覚を作る。ポリリズム（異なる周期を重ねるリズム）も常套手段で、ギターが7拍、ドラムが4拍で別々に循環し、数小節ごとに周期が一致して初めて着地する、といった設計が組まれる。ギターの音色はバンドにより幅があり、両手を指板に置くタッピング（指で弦を叩いて弾く奏法）や、弦をハンマリング（指で叩きつけて音を出す）だけで鳴らす奏法、そして変則的なチューニングによる開放弦（指で押さえずに鳴らす弦）の響きを混ぜる、いわゆるきらめく音型が多用される。ドラムは複雑で推進力のあるリズムを担い、スネアとハイハットの位置を絶えずずらして拍の重心を隠す。歌は入らないことも多く、入る場合もボーカルは目立たない位置に置かれることが多い。曲は同じ部分をあまり繰り返さず、次々に別の音型へ進むため、サビという概念が希薄である。頭で数えて楽しむと同時に、複雑さが一巡した先に訪れる爽快感を狙う音楽である。</p>
<h2>成り立ち</h2><p>源流は複数指摘されており、King Crimson（『Red』『Discipline』）、Yes、Rush、Nomeansno、Black Flagなどが挙げられる。King Crimsonの『Red』（1974年）と『Discipline』（1981年）は、マスロックの形成に影響を与えた作品として一般に挙げられる。1980年代後半のアメリカではハードコア・パンクの現場から、単純な速さでは満足しない演奏者が現れ（マスロックは1980年代後半に萌芽し、1990年代に隆盛した）、シカゴのSteve Albiniのように録音技術と演奏の両面で乾いた即物性（飾りのない生々しさ）を追求する人物が出た。彼が1992年に結成したShellacは、ノイズロックの代表格で、ポストハードコアやマスロックに分類されたが、本人たちは「ミニマルなロック・トリオ」と称した。ピッツバーグのDon Caballeroは、ドラマーのDamon Cheが叩き出す圧倒的に複雑なパターンを軸に据え、歌のない器楽ロックとして変拍子を突き詰めた。ケンタッキー州のSlintが1991年に残したスパイダーランドは、静けさと変拍子を結びつけた点で、ポストロックとマスロックの双方の基盤とされる。マスロックという呼称の由来ははっきりしないが、一説では、Chavezの Matt Sweeney が、自分が組んでいたWiderというバンドを友人が皮肉って呼んだのが由来と語っている。日本では1980年代半ば〜後半からRuinsやZeni Gevaが独自に極端な変拍子を実践しており、toeは2000年に結成されて叙情的な作風で知られ、2012年にEUツアーを行った。LITEは精密さと迫力を両立した作風で、2006年に英国とアイルランドをツアーし、2009年に米国デビューした。アメリカ西海岸のHellaは中核はZach HillとSpencer Seimの2人で、2005年のツアーから編成を拡大して2006年に5人編成になり、2009年に2人へ戻った。この間は異様な密度の演奏を行った。2002年にニューヨークで結成されたBattlesは、2006年にWarp Recordsから作品を出し、2007年にミラードを発表した。ループ機材とタッピングを使う代表例として挙げられる。一方、イリノイ州アーバナのAmerican Footballの1999年のデビュー作（当時は唯一のアルバム）は、変則チューニングと繊細な変拍子をエモの情感と結びつけ、発売後に口コミでカルト的な人気となり、ネット掲示板などで語り継がれたのち、2014年の再結成後に同名のアルバムが3枚追加された。</p>
