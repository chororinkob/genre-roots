<h1>Math Rock（マスロック）とは</h1>
<p>拍子と音型の複雑さそのものを聴きどころに据えたロックである。4/4拍子を離れ、7/8、5/4、11/8、13/8といった変拍子を曲中で次々に切り替え、さらに小節の長さを不規則に伸縮させることで、聴き手が拍を数えようとしても足元が定</p>
<p>拍子と音型の複雑さそのものを聴きどころに据えたロックである。4/4拍子を離れ、7/8、5/4、11/8、13/8といった変拍子を曲中で次々に切り替え、さらに小節の長さを不規則に伸縮させることで、聴き手が拍を数えようとしても足元が定まらない感覚を作る。ポリリズムも常套手段で、ギターが7拍、ドラムが4拍で別々に循環し、数小節ごとに周期が一致して初めて着地する、といった設計が組まれる。音色は歪ませたロックの轟音ではなく、クリーンに近いギターが好まれ、両手を指板に置くタッピングや、弦をハンマリングだけで鳴らす奏法、そして変則的なチューニングによる開放弦の響きを混ぜる、いわゆるきらめく音型が多用される。ベースは低音の支えではなくもう一本の旋律楽器として動き、ドラムはジャズの素養を持つ奏者が担うことが多く、スネアとハイハットの位置を絶えずずらして拍の重心を隠す。歌は入らないことも多く、入る場合も感情を訴えるより淡々と乗せられる。曲は同じ部分をあまり繰り返さず、次々に別の音型へ進むため、サビという概念が希薄である。頭で数えて楽しむと同時に、複雑さが一巡した先に訪れる爽快感を狙う音楽である。</p>
<h2>成り立ち</h2><p>源流は複数指摘されており、King Crimson（『Red』『Discipline』）、Yes、Rush、Nomeansno、Black Flagなどが挙げられる。King Crimsonが1974年に発表したレッドの、金属的で無機質な変拍子のリフはその参照点の一つとされ、Captain Beefheartが1969年のトラウト・マスク・レプリカで示した発想を源流とする見方もある。1980年代のアメリカではハードコア・パンクの現場から、単純な速さでは満足しない演奏者が現れ、シカゴのSteve Albiniのように録音技術と演奏の両面で乾いた即物性を追求する人物が出た。彼が1992年に結成したShellacは、ノイズロックの代表格で、マスロックにも分類される。ピッツバーグのDon Caballeroは、ドラマーのDamon Cheが叩き出す圧倒的に複雑なパターンを軸に据え、歌のない器楽ロックとして変拍子を突き詰めた。ケンタッキー州のSlintが1991年に残したスパイダーランドは、静けさと変拍子を結びつけた点で、ポストロックとマスロックの双方へ枝分かれする分岐点となった。マスロックという呼称自体は、1990年代に、揶揄的なジョークとして使われ始めた言葉で、計算高くて頭でっかちだという含みがあった。日本では1980年代半ば〜後半からRuinsやZeni Gevaが独自に極端な変拍子を実践しており、2000年代に入るとtoeは叙情的、LITEは精密さと迫力を両立した作風で国際的に評価された。アメリカ西海岸のHellaは中核はZach HillとSpencer Seimの二人で、2005〜2009年は編成を拡大し、異様な密度の演奏を行い、2006年までにWarp Recordsと契約し、2007年にミラードを発表したBattlesが、ループ機材と生演奏を融合させてこの領域をクラブの聴衆にも届けた。一方、イリノイ州アーバナのAmerican Footballの1999年のデビュー作（当時は唯一のアルバム）は、変則チューニングと繊細な変拍子をエモの情感と結びつけ、2010年代のインターネット上での再発見を経て、2014年の再結成後に同名のアルバムが3枚追加された。</p>
