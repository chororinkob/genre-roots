<h1>Math Rock（マスロック）とは</h1>
<p>マスロックは、拍子と音型の複雑さそのものを、聴きどころに据えたロックだ。頭で数えて楽しむと同時に、複雑さが一巡した先に訪れる爽快感を狙う音楽である。 リズムの柱は、変拍子だ。4/4拍子を離れ、7/8、5/4、11/8、13/8とい</p>
<p>マスロックは、拍子と音型の複雑さそのものを、聴きどころに据えたロックだ。頭で数えて楽しむと同時に、複雑さが一巡した先に訪れる爽快感を狙う音楽である。

リズムの柱は、変拍子だ。4/4拍子を離れ、7/8、5/4、11/8、13/8といった変拍子を、曲中で次々に切り替える。さらに小節の長さを不規則に伸縮させる。聴き手が拍を数えようとしても、足元が定まらない感覚になる。ポリリズム（異なる周期を重ねるリズム）も常套手段である。たとえばギターが7拍、ドラムが4拍で、別々に循環する。数小節ごとに周期が一致して、初めて着地する。そんな設計が組まれる。

ギターの音色は、バンドにより幅がある。多用されるのは、いわゆるきらめく音型だ。両手を指板に置くタッピング（指で弦を叩いて弾く奏法）や、弦をハンマリング（指で叩きつけて音を出す）だけで鳴らす奏法を使う。そこに、変則的なチューニングによる開放弦（指で押さえずに鳴らす弦）の響きを混ぜる。

ベースは、低音の支えではなく、もう1本の旋律楽器のように動くこともある。ドラムは、複雑で推進力のあるリズムを担う。スネアとハイハットの位置を絶えずずらして、拍の重心を隠す。

歌は入らないことも多い。ボーカルは目立たない位置に置かれることが多い。

曲は、同じ部分をあまり繰り返さない。次々に別の音型へ進むため、サビという概念が希薄である。</p>
<h2>成り立ち</h2><p>源流は複数指摘されている。King Crimson（『Red』『Discipline』）、Yes、Rush、Nomeansno、Black Flagなどが挙げられる。King Crimsonの『Red』（1974年）と『Discipline』は、マスロックの形成に影響を与えた作品として一般に挙げられる。

1980年代のアメリカでは、ハードコア・パンクの現場から、単純な速さでは満足しない演奏者が現れた。シカゴのSteve Albiniのように、録音技術と演奏の両面で、乾いた即物性（飾りのない生々しさ）を追求する人物も出た。

マスロックは1980年代後半に萌芽し、1990年代に盛んになった。ただし、Shellac（1992年）は1980年代の話ではない。彼が1992年に結成したShellacは、ノイズロックの代表格で、マスロックにも分類されることがある。

ピッツバーグのDon Caballeroは、ドラマーのDamon Cheが叩き出す圧倒的に複雑なパターンを軸に据えた。歌のない器楽ロックとして、変拍子を突き詰めた。ケンタッキー州のSlintが1991年に残したスパイダーランドは、静けさと変拍子を結びつけた。この作品は、ポストロックとマスロックの双方の土台とされる。

マスロックという呼称の由来は、はっきりしない。一説では、Chavezの Matt Sweeney が、自分が組んでいたWiderというバンドを友人が皮肉って呼んだのが由来と語っている。

日本では、1980年代半ば〜後半からRuinsやZeni Gevaが、独自に極端な変拍子を実践していた。2000年代に入ると、toeは叙情的、LITEは精密さと迫力を両立した作風で、国際的にも評価されたと言われる。

アメリカ西海岸のHellaは、中核がZach HillとSpencer Seimの2人だ。2005年のツアーから拡大し、2006年に5人編成になり、2009年に2人へ戻った。その間、異様な密度の演奏を行った。

また、Battlesは2002年にニューヨークで結成された。2006年2月にWarp Recordsから『EP C / B EP』を出し、2007年5月14日（英国、米国は5月22日）に『Mirrored』を発表した。ループペダルとタッピングを使う代表例として挙げられている。

一方、イリノイ州アーバナのAmerican Footballは、1999年のデビュー作（当時は唯一のアルバム）で、変則チューニングと繊細な変拍子を、エモの情感と結びつけた。この作品は、発売後に口コミでカルト化し、ネット掲示板などで語り継がれた。2014年に再結成し、同名のアルバムが3枚追加された。</p>
