<h1>Space Rock（スペースロック）とは</h1>
<p>宇宙空間の広がりや無重力の感覚を音で表現しようとするロック。編成はロックの基本形にシンセサイザー、テルミン、そして各種の効果音発生装置が加わる。最大の特徴は反復と持続にあり、ベースとドラムが単一のリフまたは一定の刻みを10分以上に</p>
<p>宇宙空間の広がりや無重力の感覚を音で表現しようとするロック。編成はロックの基本形にシンセサイザー、テルミン、そして各種の効果音発生装置が加わる。最大の特徴は反復と持続にあり、ベースとドラムが単一のリフまたは一定の刻みを10分以上にわたって変化させずに続け、その上でギターとシンセが層を重ねていく。この不動の土台をモータリック的な推進と呼ぶこともあり、ドイツのクラウトロックと共通する発想である。ギターにはフェイザー、フランジャー、ロング・ディレイ、そして深いリヴァーブがかけられ、音が空間を移動する感覚を作る。和声はほとんど動かず、一つの和音または旋法の上で長くとどまるため、聴き手の時間感覚が失われる。テンポは中庸から遅めで、拍子は四分の四が基本だが、拍の存在自体が曖昧になる区間も多い。歌はしばしば効果を通して非人間的に加工され、歌詞は宇宙旅行、異星、機械と人間、時間の歪みといったSF的な主題を扱う。演奏は液体を用いた投影や照明と一体で提示され、視覚を含む没入的な体験として設計されている。</p>
<h2>成り立ち</h2><p>1960年代末のイギリスで、サイケデリック・ロックが宇宙的な主題へ傾いたところから生まれた。Pink Floydが1968年に発表したSet the Controls for the Heart of the Sunや、1969年の映画音楽的な作品が、この方向の出発点とされる。決定的なのは1969年にロンドンで結成されたHawkwindで、彼らは無料の野外演奏を各地で行い、大音響と照明による長時間の没入的な体験を提供した。1972年のSilver Machineが商業的な成功を収め、この収益で大規模な舞台装置を伴うツアーが実現した。1971年から1975年まで在籍したベーシストIan Kilmisterは、後にMotörheadを結成することになる。彼は薬物所持でカナダ国境で拘束され、それを機に解雇された。もう一つの重要な源流がドイツのクラウトロックで、Ash Ra Tempel、Tangerine Dream、そして初期のKraftwerkが、電子的な音響と反復による長時間の構成を追求した。1970年代半ばのフランスではGongが、独自の神話的な世界観と即興を組み合わせた。1980年代にはSpacemen 3が、極端に単純な構造の反復と大音量の持続音により、この系譜を更新した。同バンドはSonic BoomとJason Pierceの対立により1991年に解散し、それぞれSpectrumとSpiritualizedを結成している。1990年代には、この美学がシューゲイザーやポスト・ロックと合流し、Flying Saucer AttackやMogwaiといった作家に受け継がれた。現在も、長時間の反復と音の壁による没入という発想は、ドローンやポスト・ロックの中心的な語彙として生き続けている。</p>
<h2>代表曲</h2><ul><li>Echoes (Pink Floyd)</li><li>Silver Machine (Hawkwind)</li><li>Ladies and Gentlemen We Are Floating in Space (Spiritualized)</li><li>Like Herod (Mogwai)</li><li>Storm (Godspeed You! Black Emperor)</li></ul>
