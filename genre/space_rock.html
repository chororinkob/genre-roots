<h1>Space Rock（スペースロック）とは</h1>
<p>宇宙空間の広がりや無重力の感覚を音で表現しようとするロック。編成はロックの基本形にシンセサイザーや電子発振器（電子音を作る装置）など、各種の電子機器が加わる。曲の作りはゆるく長く、楽器の音色を中心にした、聴いているうちにぼんやりし</p>
<p>宇宙空間の広がりや無重力の感覚を音で表現しようとするロック。編成はロックの基本形にシンセサイザーや電子発振器（電子音を作る装置）など、各種の電子機器が加わる。曲の作りはゆるく長く、楽器の音色を中心にした、聴いているうちにぼんやりしてくるような響きになる。反復や、同じ音が長く鳴り続ける感じを強く打ち出す作品もあり、その場合はベースとドラムが単一のリフまたは一定の刻みを長く続け、その上でギターとシンセが層を重ねていく。この反復の土台は、ドイツのクラウトロックのモータリック・ビート（機械のように一定の速さで進む4分の4拍子のドラムの型）に通じる推進力がある。ギターは歪み（音をざらつかせる効果）と深いリヴァーブ（音を響かせる効果）を伴うことが多い。フェイザーやフランジャー（音を揺らす効果）、ロング・ディレイ（音を遅らせて重ねる効果）を使う例もあり、音が空間を移動する感覚を作る。テンポは中くらいから遅めの曲が多い。拍がはっきり刻まれる曲もあれば、拍そのものがぼやける区間が多い曲もある。歌は控えめで気だるく、楽器の音の脇役になることが多く、歌詞は宇宙旅行、異星、機械と人間、時間の歪みといったSF的な主題を扱う。Hawkwindなどは、液体を使った投影（リキッド・ライト）や照明と一体になった演奏を行い、目でも楽しめて、その世界に引き込まれるようなライブにした。</p>
<h2>成り立ち</h2><p>1960年代末のイギリスで、サイケデリック・ロックが宇宙的な主題へ傾いたところから生まれた。最初期の例の一つは、Pink Floydの1967年のデビュー作The Piper at the Gates of Dawnの楽曲（Astronomy Domine、Pow R. Toc H.、Interstellar Overdrive）で、1968年のSet the Controls for the Heart of the Sunも、この方向の例とされる。決定的なのは1969年にロンドンで結成されたHawkwindで、彼らは無料公演やフェスティバルへの出演を各地で重ね、大音響と照明による長時間の没入的な体験を提供した。1972年のSilver Machineが商業的な成功を収め、この収益で大規模な舞台装置を伴うツアーが実現した。1971年から1975年まで在籍したベーシストIan Kilmisterは、後にMotörheadを結成することになる。彼は薬物所持でカナダ国境で拘束され、それを機に解雇された。英国の動きと並行して、西ドイツでもクラウトロックのAsh Ra Tempel、Tangerine Dreamが、電子音を使い、同じ音を繰り返す長い曲づくりを追求した。のちの世代のスペース・ロックには、クラウトロックの影響を受けたものもある。1967年にパリで結成され、1969年に電気楽器の編成で組み直されたGongが、1970年代前半に、独自の神話的な世界観と即興を組み合わせた。1980年代にはSpacemen 3が、極端に単純な構造の反復と大音量の持続音により、この系譜を更新した。同バンドはSonic BoomとJason Pierceの対立により、1990年に事実上解散し（最後のアルバムRecurringは1991年2月に発売）、その前後にそれぞれSpectrumとSpiritualizedのプロジェクトを展開している。1990年代には、この美学がシューゲイザーやポスト・ロックと合流し、Flying Saucer Attackのような作家に受け継がれた。現在も、長く繰り返す音の壁に包まれるという考え方の影響は、ドローン系やポスト・ロックの一部に見られる。</p>
<h2>代表曲</h2><ul><li>Space Oddity (David Bowie)</li><li>Silver Machine (Hawkwind)</li><li>Ladies and Gentlemen We Are Floating in Space (Spiritualized)</li><li>Echoes (Pink Floyd)</li><li>Set the Controls for the Heart of the Sun (Pink Floyd)</li><li>Storm (Godspeed You! Black Emperor)</li><li>Like Herod (Mogwai)</li><li>Sonic Attack (Hawkwind)</li><li>Walkin' with Jesus (Spacemen 3)</li><li>Orgone Accumulator (Hawkwind)</li><li>Master of the Universe (Hawkwind)</li><li>Revolution (Spacemen 3)</li></ul>
