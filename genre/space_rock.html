<h1>Space Rock（スペースロック）とは</h1>
<p>スペース・ロックは、宇宙空間の広がりや無重力の感覚を音で表現しようとするロックだ。 編成は、ロックの基本形にシンセサイザーや電子発振器（電子音を作る装置）など、各種の電子機器が加わる。ベースとドラムが単一のリフまたは一定の刻みを長</p>
<p>スペース・ロックは、宇宙空間の広がりや無重力の感覚を音で表現しようとするロックだ。

編成は、ロックの基本形にシンセサイザーや電子発振器（電子音を作る装置）など、各種の電子機器が加わる。ベースとドラムが単一のリフまたは一定の刻みを長く続け、その上でギターとシンセが層を重ねていく。この不動の土台は、クラウトロックのモータリック（機械のように一定の速さで進む）・ビートに通じる反復的な推進力だ。ドイツのクラウトロックと共通する発想である。

ギターは歪みと深いリヴァーブを伴うことが多い。モジュレーション系や長いディレイを使う例もあり、音が空間を移動する感覚を作る。



テンポは遅めの曲が多い。拍子は4分の4が基本だが、拍の存在自体が曖昧になる区間も多い。

歌は控えめで気だるく、器楽のテクスチャーの脇役になることが多い。歌詞は、宇宙旅行、異星、機械と人間、時間の歪みといったSF的な主題を扱う。

曲は、ゆるく長い構造と、器楽的な音色を中心にした催眠的な響きが特徴だ。反復やドローン的な持続を強く打ち出す作品もある。演奏は、Hawkwindなどでは液体を用いた投影（リキッド・ライト）や照明と一体で提示される。視覚を含む没入的な体験として設計されている。</p>
<h2>成り立ち</h2><p>1960年代末のイギリスで、サイケデリック・ロックが宇宙的な主題へ傾いたところから、スペース・ロックは生まれた。

最初期の例の一つは、Pink Floydの1967年のデビュー作The Piper at the Gates of Dawnの楽曲（Astronomy Domine、Pow R. Toc H.、Interstellar Overdrive）だ。1968年のSet the Controls for the Heart of the Sunも、この方向の例とされる。

決定的なのは、1969年にロンドンで結成されたHawkwindだ。彼らは無料公演やフェスティバル出演を各地で重ね、大音響と照明による長時間の没入的な体験を提供した。1972年のSilver Machineが商業的な成功を収めると、この収益で大規模な舞台装置を伴うツアーが実現した。1971年から1975年まで在籍したベーシストIan Kilmisterは、後にMotörheadを結成することになる。彼は薬物所持でカナダ国境で拘束され、それを機に解雇された。

英国の動きと並行して、西ドイツでも同様の音が追求された。クラウトロックのAsh Ra Tempel、Tangerine Dreamが、電子的な音響と反復による長時間の構成を追求した。1967年にパリで結成（のち1969年に電気編成で再編）されたGongは、1970年代前半に、独自の神話的な世界観と即興を組み合わせた。

1980年代には、Spacemen 3が、極端に単純な構造の反復と大音量の持続音により、この流れを更新した。同バンドは、Sonic BoomとJason Pierceの対立により、1990年に事実上の解散となった（最終作Recurringは1991年2月に発売）。その前後に、それぞれSpectrumとSpiritualizedのプロジェクトを展開している。

1990年代には、この美学がシューゲイザーやポスト・ロックと合流した。Flying Saucer Attackといった作家に受け継がれ、ポスト・ロック（Flying Saucer Attackなど）にも間接的に通じる。現在も、長時間の反復と音の壁による没入という発想の影響は、ドローン系やポスト・ロックの一部に見られる。</p>
<h2>代表曲</h2><ul><li>Space Oddity (David Bowie)</li><li>Silver Machine (Hawkwind)</li><li>Ladies and Gentlemen We Are Floating in Space (Spiritualized)</li><li>Echoes (Pink Floyd)</li><li>Set the Controls for the Heart of the Sun (Pink Floyd)</li><li>Storm (Godspeed You! Black Emperor)</li><li>Like Herod (Mogwai)</li><li>Sonic Attack (Hawkwind)</li><li>Walkin' with Jesus (Spacemen 3)</li><li>Orgone Accumulator (Hawkwind)</li><li>Master of the Universe (Hawkwind)</li><li>Revolution (Spacemen 3)</li></ul>
