<h1>Chicago Blues（シカゴブルース）とは</h1>
<p>南部の農村で一人と一本のギターで演奏されていたブルースを、都市の騒がしい酒場で聞かせるために電化し、バンド編成に組み替えたものである。標準的な編成はエレキギター一本か二本、増幅したハーモニカ、ピアノ、ベース、ドラムで、これはジャズ</p>
<p>南部の農村で一人と一本のギターで演奏されていたブルースを、都市の騒がしい酒場で聞かせるために電化し、バンド編成に組み替えたものである。標準的な編成はエレキギター一本か二本、増幅したハーモニカ、ピアノ、ベース、ドラムで、これはジャズのリズム隊の構成をブルースに移植した形にあたる。最大の発明はハーモニカの鳴らし方で、演奏者は手のひらで小型マイクごと楽器を包み込み、その信号を小さな真空管アンプに過大入力する。結果として生じる歪みと圧縮によって、本来は素朴な音の楽器がサックスのように太く咆哮する。手の開閉でワウのような効果をかけ、息を吸って音程を下げるベンドを多用する点も含め、電気を前提にした奏法体系ができあがっている。ギターは弦高を上げてスライドを使う奏法と、指で弦を引っ張り上げて叩きつけるチョーキング主体の奏法が共存する。曲の骨格は12小節を一巡とする定型で、和音はほぼ一度、四度、五度の三つに限られ、その単純な枠の中で歌と楽器が交互に応答する。リズムは三連符を土台に跳ねるシャッフルが基本で、歌唱は大音量に負けないよう喉を締めて張り上げる。演奏の場は南部から移り住んだ労働者が集まる小さな酒場であり、音量そのものが表現の一部だった。</p>
<h2>成り立ち</h2><p>第一次世界大戦から1970年頃までに約600万人の黒人が南部の農村から北部・西部の都市へ移り住んだ大移動が背景にある。ミシシッピ州デルタ地帯からはイリノイ・セントラル鉄道が一本でシカゴへ通じており、綿花農園の小作から工場労働への転身を求めて人々が流入した。マッキンリー・モーガンフィールドは1943年にシカゴへ着き、マディ・ウォーターズの名で1948年に『アイ・キャント・ビー・サティスファイド』を吹き込む。生ギターでは酒場の喧騒に埋もれるという実際的な理由からエレキギターに持ち替えたことが、様式そのものを変えた。中心となったのはポーランド系ユダヤ移民の兄弟レナードとフィル・チェスが1950年に設立したチェス・レコードで、南ミシガン通り二一二〇番地のスタジオから大量の名盤が生まれた。作曲とベースを兼ねたウィリー・ディクソンが事実上の音楽監督として機能し、『フーチー・クーチー・マン』をはじめ多くの定番曲を書いた。1952年にはリトル・ウォルターのハーモニカ独奏曲『ジューク』が全米リズム・アンド・ブルース・チャートの一位を八週にわたって占め、伴奏楽器と見られていたハーモニカを主役に押し上げた。チェスター・バーネットはハウリン・ウルフの名で、マディとは対照的な咆哮する声で人気を二分した。屋外ではマクスウェル・ストリートの露天市で無数の無名の演奏者が電線を店から引いて演奏し、才能の供給源となっていた。1960年代に入ると、これらのレコードは本国の黒人聴衆よりも英国の若者に強く届き、ローリング・ストーンズはマディの曲名からバンド名を取り、ヤードバーズやクリームがレパートリーを丸ごと借り受けた。その逆輸入によってシカゴの演奏者たちは白人の大規模会場で再発見されることになるが、同時に地元の黒人聴衆はソウルやファンクへ移っており、担い手と聴き手がずれていく現象がここから始まった。</p>
