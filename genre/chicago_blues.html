<h1>Chicago Blues（シカゴブルース）とは</h1>
<p>シカゴ・ブルースは、戦前シカゴの小編成ブルースを土台に、戦後、マディらが電化と大音量化を進めたものである。都市の騒がしい酒場で聞かせるために生まれた音楽だ。 編成は、エレキギター1本か2本、増幅したハーモニカ、ベース、ドラムが標準</p>
<p>シカゴ・ブルースは、戦前シカゴの小編成ブルースを土台に、戦後、マディらが電化と大音量化を進めたものである。都市の騒がしい酒場で聞かせるために生まれた音楽だ。

編成は、エレキギター1本か2本、増幅したハーモニカ、ベース、ドラムが標準である。ピアノが加わることもある。ギターは、弦高（弦と指板の距離）を上げてスライド（金属などを弦に当てて滑らせる奏法）を使う奏法と、指で弦を引っ張り上げて叩きつけるチョーキング主体の奏法が共存するとされる。

大きな特徴はハーモニカの鳴らし方だ。演奏者は手のひらで小型マイクごと楽器を包み込み、その信号を小さな真空管アンプに過大入力（許容を超える強さで音を入れること）する。この増幅の手法は以前からあった。だがLittle Walterは、アンプを限界を超えて駆動し、新しい音色を開拓した。歪みと圧縮（音量の差を縮めること）が生まれ、本来は素朴な音の楽器が、サックスのように太く咆哮する。手の開閉でワウ（音色を波打たせる効果）のような効果をかけ、息を吸って音程を下げるベンド（音程を滑らかに変える奏法）を多用する。電気を前提にした奏法体系が、こうしてできあがっている。

曲の骨格は、12小節を一巡とする定型だ。和音はほぼ一度、4度、5度の三つに限られる。その単純な枠の中で、歌と楽器が交互に応答する。

リズムは、三連符（1拍を3等分したリズム）を土台に跳ねるシャッフルが基本である。

歌唱は、大音量に負けないよう張り上げる。

演奏の場は、南部から移り住んだ労働者が集まる小さな酒場だった。音量そのものが表現の一部だった。</p>
<h2>成り立ち</h2><p>背景にあるのは大移動だ。1910年代から1970年頃までに、推計で約600万人の黒人が南部の農村から北部・西部の都市へ移り住んだ。ミシシッピ州デルタ地帯からは、イリノイ・セントラル鉄道が1本でシカゴへ通じていた。綿花農園の小作（地主から土地を借りて耕す仕事）から工場労働への転身を求めて、人々が流れ込んだ。

マッキンリー・モーガンフィールドは1943年にシカゴへ着いた。マディ・ウォーターズの名で、1948年に『アイ・キャント・ビー・サティスファイド』を吹き込む。4月の録音とされる。生ギターでは酒場の喧騒に埋もれるという実際的な理由から、エレキギターに持ち替えた。これが、スタイルそのものを変えた。

中心となったのは、チェス・レコードである。ポーランド系ユダヤ移民の兄弟、レナードとフィル・チェスが、1947年創業のAristocrat Recordsを買い取り、1950年に改称したものだ。1957年に南ミシガン通り2120番地へ移転し、以降のChessの主要録音の拠点となった。作曲とベースを兼ねたウィリー・ディクソンは、プロデューサー、タレント・スカウト、セッション・ベーシスト、専属ソングライターとして機能した。『フーチー・クーチー・マン』をはじめ、多くの定番曲を書いている。

1952年には、リトル・ウォルターのバンド伴奏付きのハーモニカ・インストゥルメンタル曲『ジューク』が、全米リズム・アンド・ブルース・チャートで通算8週（非連続）で1位を占めた。伴奏楽器と見られていたハーモニカが、主役に押し上げられた。チェスター・バーネットは、ハウリン・ウルフの名で、マディとは対照的な咆哮する声を聞かせ、Chessの二大看板として競い合った。屋外では、マクスウェル・ストリートの露天市で、ブルース奏者が電線を店から引いて演奏した。収入を得て、他の奏者とジャムする初期の拠点だった。

1960年代に入ると、これらのレコードは英国の若者にも強く届いた。ローリング・ストーンズはマディの曲名からバンド名を取った。ヤードバーズやクリームも、シカゴ・ブルースの曲を数多くカバー（他の人の曲を演奏すること）した。1950年代末〜60年代前半の英国ツアーとフォーク・リバイバル、続く英国バンドの影響で、シカゴの演奏者たちはロック聴衆（主に白人）に広がっていく。しかし同時に、1950年代末〜60年代にソウルなど新しい黒人音楽が人気を集め、ブルースは商業的に不利になった。</p>
