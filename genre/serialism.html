<h1>Serialism（セリアリズム）とは</h1>
<p>セリアリズムは、あらかじめ決めた「音列（シリーズ）」に従って曲を組み立てる作曲技法（およびそれに基づくスタイル）である。最初は音の高さを、のちにはリズム・強弱・音色・アーティキュレーション（音の切り方やつなぎ方）などの要素も、音列</p>
<p>セリアリズムは、あらかじめ決めた「音列（シリーズ）」に従って曲を組み立てる作曲技法（およびそれに基づくスタイル）である。最初は音の高さを、のちにはリズム・強弱・音色・アーティキュレーション（音の切り方やつなぎ方）などの要素も、音列に従って組み立てるようになった。

最も基本的な形は「十二音技法（トーン・ロウ）」だ。西洋音楽の半音階を作る12の音を、すべて一度ずつ使う。特定の音がほかの音より上に立たないように並べた音列が、曲の土台になる。この音列は、原形・逆行形・反行形・逆行反行形の4つの形で使える。さらに12の移調段階を掛け合わせると、最大48通りの並びが生まれる。

響きの面では、調性感が薄い（ベルクのように調性的な要素を取り込んだ作品もある）。聴き手は、「ホーム」となる音に帰ってくる感覚を得られない。旋律は跳躍音程が多い。シェーンベルク、ウェーベルンの音列には、調性的な響きを避けるため、3度・5度を避ける傾向が見られ、短2度・長7度・短9度などの不協和音程が目立つ。ただし、音程そのものは技法上の規則ではない。和声は機能和声の文脈を持たない。音の積み重なりは、「コード」というより「音群」として聴こえることが多い。

楽器は、伝統的な管弦楽の編成が多い。ただ、ピアノ独奏曲・弦楽四重奏・室内楽の編成でも多く書かれた。アントン・ウェーベルンの「弦楽四重奏のための五つの楽章 Op.5」などでは、弦楽器のフラジオレット奏法（弦に軽く触れて倍音を出す技法）やコル・レーニョ奏法（弓の木部で弦を叩く）が用いられる。これが、点を打つように散らばった音の手ざわりを生む。ピアノでは、極端な音量の変化が特徴だ。

リズムは、作品によって拍節感が薄いものもある。一方で、舞曲の形式を用いた作品では、拍節がはっきりしている場合もある。テンポは作品によって異なる。音符の長さまで音列で決める「トータル・セリアリズム」では、リズムの型が予測できないほど複雑になる。作品によっては、強弱の幅が極端に広い。例えば『ストリュクテュール』は12段階だ。

曲の組み立てでは、音列の展開そのものが骨組みになる。ただし、12音の作品でも古典的な形式が使われることがある（シェーンベルクの管楽五重奏曲の第1楽章はソナタ形式）。聴き手には、「展開」や「クライマックス」の感覚が薄い。音の連なりが、抽象的な彫刻のように積み重なっていく印象を与える。

歌が入る場合は、シュプレヒシュティンメ（語り歌い）が使われることもある。音の高さを正確に歌うのではなく、指定された音の高さの方向を保ちながら、語るように声を出す独特のスタイルだ。シェーンベルクが、自由無調期の1912年の『月に憑かれたピエロ』でこの歌い方を固め、のちの作品にも用いた。

隣り合うジャンルである無調音楽は、「調性を避ける」という消極的な姿勢をとる。これに対しセリアリズムは、音列という積極的な組み立ての原理を持つ。ここが両者の違いだ。また現代音楽全般と比べると、作曲者の好みや気まぐれを取り除こうとする傾向は、とくに戦後のトータル・セリアリズムで強い。演奏の場は、コンサートホールや現代音楽専門の小ホールが中心だ。ダルムシュタット夏期講習会のような専門の場で、演奏され、議論される音楽である。</p>
<h2>成り立ち</h2><p>十二音技法は、ハウアー（1919年）とシェーンベルク（1921年ごろ着手）が、ほぼ同じ時期に別々に方式としてまとめた。最もよく知られる形はシェーンベルクの方式とされ、ゴリシェフが先だったと主張する説もある。

ヨーゼフ・マティアス・ハウアーは、1919年に「12音の法則」を発表した。アルノルト・シェーンベルクは1921年ごろから独自にこの技法を育て、1923年に弟子へ説明した。1921〜23年に作曲した「ピアノ組曲 Op.25」（1924年初演）は、全楽章に音列を使った最初の作品の一つとされる。

シェーンベルクがこの技法を開発した背景には、次のような歴史があった。19世紀後半のロマン主義音楽は、和音の複雑さの限界まで行き着き、調性そのものが崩れかけていた。リヒャルト・ワーグナーの「トリスタンとイゾルデ」（作曲は1857〜59年、初演は1865年）は、半音階的な和音を押し広げた代表例だ。この広がりは、グスタフ・マーラーやリヒャルト・シュトラウスを経て、もはや調性の枠に収まらないところまで来ていた。シェーンベルク自身も、約1908年から1920年代初頭まで、音列という組み立ての原理を持たない「自由無調」の時期を過ごした。その混乱を乗り越える答えとして、十二音技法を発展させたのである。

シェーンベルクの弟子たちは、この技法を受け継いで発展させ、「新ウィーン楽派」を作った。アルバン・ベルクは、自由無調のオペラ「ヴォツェック」（1925年初演）を書いた。未完のオペラ「ルル」（1937年初演）では十二音技法も使い、劇的な表現力と技法を一つにしようとした。一方、アントン・ウェーベルンは、技法をより純粋に突き詰め、極度に凝縮された点描的な音楽の語り口を固めた。ウェーベルンの「交響曲 Op.21」（1927〜28年作曲、1929年初演）は、12音の作品である。「弦楽四重奏のための五つの楽章 Op.5」（1909年）は自由無調期の作品で、のちの点描的な語り口の先駆けとなった。

1930年代、ナチス・ドイツは、ユダヤ系の作曲家やジャズ、シェーンベルクらを「退廃音楽」として弾圧した。そのため、シェーンベルク（1933年10月31日に渡米）らがアメリカへ亡命し、技法は大西洋を渡った。

戦後のヨーロッパでは、ダルムシュタット夏期講習会（1946年創設、ドイツ）が現代音楽の中心地になった。そこにカールハインツ・シュトックハウゼン、ピエール・ブーレーズ、ルイジ・ノーノらが集まった。彼らはウェーベルンの技法を出発点にした。そして音の高さだけでなく、リズム・強弱・音色・アーティキュレーションのすべてを音列で決める「トータル・セリアリズム（インテグラル・セリアリズム）」へと発展させた。メシアンの「音価と強度のモード」（1949年）は、前セリー的な作品とされる。それを音列として組み直したブーレーズの「ストリュクテュール第1集」などが、トータル・セリアリズムの実践例とされる。

しかし、トータル・セリアリズムは深い矛盾を抱えていた。すべてのパラメータを厳密に決めた結果、音楽はかえって「偶然性」と区別がつかないほど無秩序に聴こえる。こうした批判が、1955年のクセナキスらから出た。ほぼ同じ時期に、ジョン・ケージは偶然性音楽（チャンス・オペレーション）を提唱した。これは、セリアリズムの「すべてを事前に決める」という考え方と真っ向からぶつかった。1959年のダルムシュタットでは、ノーノの偶然性音楽を批判する講演と、シュトックハウゼンの「統計的構造」という発言をめぐって、両者が激しく対立した。

一方、アメリカではミルトン・バビットが、セリアリズムを数学的・理論的に細かく練り上げ、「コンビナトリアリティ」という考え方を持ち込んだ。バビットはプリンストン大学とジュリアード音楽院で教えた。コロンビア・プリンストン電子音楽センターの前身のスタジオ創設に関わり、大学の世界にセリアリズムを根づかせた。また、エリオット・カーターは、のちに「メトリック・モジュレーション」と名付けられたリズム技法を使い、セリアリズムとは別の方向から複雑さを追い求めた。

1970年代以降、セリアリズムは「難解すぎる」「聴衆を無視している」と批判された。ミニマリズムやポスト・モダニズムが注目を集め、セリアリズムは主流の座を失った。アルヴォ・ペルトは1976年から、ジョン・アダムズは1980年代から、それぞれ調性的な書き方をとった。それでもセリアリズムは消えたわけではない。現代でも多くの作曲家が、技法の一部を選んで使っている。スペクトル楽派はセリアリズムへの反動として生まれた。その一方で、厳密な技法の発想や、パラメータを操作する考え方は、後の流れにも影響を残したとされる。</p>
