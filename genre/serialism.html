<h1>Serialism（セリアリズム）とは</h1>
<p>セリアリズムとは、音高・リズム・強弱・音色・アーティキュレーションなどの音楽的パラメータを、あらかじめ決定された「音列（シリーズ）」に従って厳密に組織化する作曲技法であり、その技法によって生み出される音楽ジャンルである。最も基本的</p>
<p>セリアリズムとは、音高・リズム・強弱・音色・アーティキュレーションなどの音楽的パラメータを、あらかじめ決定された「音列（シリーズ）」に従って厳密に組織化する作曲技法であり、その技法によって生み出される音楽ジャンルである。最も基本的な形態である「十二音技法（トーン・ロウ）」では、西洋音楽の半音階を構成する12の音すべてを一度ずつ使い、特定の音が他の音より優位に立たないよう設計された音列を基礎単位とする。この音列は原形・逆行形・反行形・逆行反行形の4形態で使用でき、さらに12の移調段階を掛け合わせると最大48のバリエーションが生まれる。

音響的な特徴として、調性感が完全に排除されているため、聴き手は「ホーム」となる音に帰着する感覚を得られない。旋律は跳躍音程が多く、長2度・短2度の隣接音よりも増4度（トライトーン）・長7度・短9度といった不協和音程が頻出する。和声は機能和声の文脈を持たず、音の積み重なりは「コード」というより「音群（クラスター）」として知覚されることが多い。

使用楽器は伝統的な管弦楽編成が多いが、ピアノ独奏曲・弦楽四重奏・室内楽編成でも多く書かれた。アントン・ウェーベルンの作品では弦楽器のフラジオレット奏法（弦に軽く触れて倍音を出す技法）やコル・レーニョ奏法（弓の木部で弦を叩く）が多用され、点描的な音響テクスチャを生み出す。ピアノではクラスター和音や極端なダイナミクスの変化が特徴的だ。

リズムは拍子感が曖昧で、拍節的なグルーヴは存在しない。テンポは作品によって異なるが、音符の長さ自体も音列によって制御される「トータル・セリアリズム」では、リズムパターンが予測不能な複雑さを持つ。強弱記号もppppからffffまで極端な幅で使われ、音量の変化が劇的だ。

曲の構成は伝統的なソナタ形式やロンド形式を取らず、音列の展開そのものが構造原理となる。聴き手にとっては「展開」や「クライマックス」の感覚が希薄で、音の連続が抽象的な彫刻のように積み重なる印象を与える。ボーカルが使われる場合はシュプレヒシュティンメ（語り歌い）が多用され、音高を正確に歌うのではなく、指定された音高の方向性を保ちながら語るように発声する独特のスタイルが採られる。

隣接ジャンルである無調音楽との違いは、無調音楽が「調性を避ける」という消極的な姿勢であるのに対し、セリアリズムは音列という積極的な組織原理を持つ点にある。また現代音楽全般と比べると、セリアリズムは作曲家の恣意性を最小化するという思想的立場が明確だ。演奏会場はコンサートホールや現代音楽専門の小ホールが主であり、ダルムシュタット夏期講習会のような専門的な場で演奏・議論される音楽だ。</p>
<h2>成り立ち</h2><p>セリアリズムの直接の起源は1920年代のウィーンにある。アルノルト・シェーンベルクが1921年から1923年にかけて十二音技法を体系化し、1923年発表の「ピアノ組曲 Op.25」でその技法を初めて完全な形で実践した。シェーンベルクがこの技法を開発した背景には、19世紀後半のロマン主義音楽が和声的な複雑さの極限まで到達し、調性そのものが崩壊しつつあったという歴史的必然があった。リヒャルト・ワーグナーの「トリスタンとイゾルデ」（1865年）に始まる半音階的和声の拡張は、グスタフ・マーラーやリヒャルト・シュトラウスを経て、もはや調性の枠内では収まらない段階に達していた。シェーンベルク自身も1908年から1922年の間、音列という組織原理を持たない「自由無調」の時期を経験しており、その混乱を乗り越えるための解決策として十二音技法を発明したのである。

シェーンベルクの弟子たちがこの技法を継承・発展させ、「新ウィーン楽派」を形成した。アルバン・ベルクは十二音技法に調性的な要素を巧みに組み込み、オペラ「ヴォツェック」（1925年初演）と「ルル」（未完、1937年初演）で劇的表現力と技法の融合を実現した。一方、アントン・ウェーベルンは技法をより純粋に推し進め、極度に凝縮された点描的な音楽語法を確立した。ウェーベルンの「交響曲 Op.21」（1929年）や「弦楽四重奏のための五つの楽章 Op.5」は、後世の作曲家に計り知れない影響を与えた。

第二次世界大戦後、セリアリズムは新たな段階に入る。ナチス・ドイツが「退廃音楽」として十二音音楽を弾圧したため、多くの作曲家がアメリカに亡命し、技法が大西洋を渡った。戦後のヨーロッパでは、ダルムシュタット夏期講習会（1946年創設、ドイツ）が現代音楽の中心地となり、オリヴィエ・メシアン、カールハインツ・シュトックハウゼン、ピエール・ブーレーズ、ルイジ・ノーノらが集結した。彼らはウェーベルンの技法を出発点に、音高だけでなくリズム・強弱・音色・アーティキュレーションのすべてを音列で制御する「トータル・セリアリズム（インテグラル・セリアリズム）」へと発展させた。ブーレーズの「ピアノのための第2ソナタ」（1948年）やメシアンの「音価と強度のモード」（1949年）がその先駆けとなった。

しかしトータル・セリアリズムは深刻な矛盾を抱えていた。すべてのパラメータを厳密に制御した結果、音楽は逆説的に「偶然性」と区別がつかないほど無秩序に聴こえるという批判が生まれた。この反動として、ジョン・ケージは偶然性音楽（チャンス・オペレーション）を提唱し、セリアリズムの決定論的思想と真っ向から対立した。1950年代から60年代にかけて、ダルムシュタットの内部でもシュトックハウゼンとノーノの間で路線対立が生じ、セリアリズムの「正統性」をめぐる論争が続いた。

アメリカではミルトン・バビットがセリアリズムを数学的・理論的に精緻化し、「コンビナトリアリティ」という概念を導入した。バビットはコロンビア大学とプリンストン大学で教鞭を取り、アカデミズムの中にセリアリズムを定着させた。一方でエリオット・カーターは独自のリズム技法「メトリック・モジュレーション」を開発し、セリアリズムとは異なる方向から複雑性を追求した。

1970年代以降、セリアリズムは「難解すぎる」「聴衆を無視している」という批判を受け、ミニマリズムやポスト・モダニズムの台頭によって主流の座を失った。アルヴォ・ペルトやジョン・アダムズらは調性への回帰を選んだ。しかしセリアリズムは消滅したわけではなく、現代においても多くの作曲家が技法の一部を選択的に用いており、音楽大学の作曲教育における基礎的な分析対象として生き続けている。その厳密な論理性と音響的な先鋭さは、スペクトル楽派や複雑性音楽など後続の前衛的潮流に確実に受け継がれた。</p>
