<h1>Mashcore（マッシュコア）とは</h1>
<p>ブレイクコアの高速な断片編集に、誰もが知っているポップスやアニメ、ゲーム、テレビ番組の音源を大量に貼り合わせるマッシュアップの手法を掛け合わせた音楽である。土台はアーメン・ブレイクを刻んだ160から200 BPM前後のジャングル的</p>
<p>ブレイクコアの高速な断片編集に、誰もが知っているポップスやアニメ、ゲーム、テレビ番組の音源を大量に貼り合わせるマッシュアップの手法を掛け合わせた音楽である。土台はアーメン・ブレイクを刻んだ160から200 BPM前後のジャングル的なリズム、あるいはガバのキックであり、その上に脈絡のない引用が数秒ごとに入れ替わりながら積み上げられる。引用元は原曲の知名度が高いほど良いとされ、聴き手が一瞬で元ネタを判別してしまうこと自体が笑いと快感の仕掛けになっている。編集はサンプラーやトラッカー、DAWのタイムストレッチを駆使し、ピッチを合わせずにわざとぶつける、拍の途中で強引に切り替える、同じ小節を吃音のように繰り返すといった、粗さを隠さない処理が好まれる。構成に起伏という概念は薄く、詰め込みの密度が高いまま終わりまで走り抜ける曲が多い。ジャケットや曲名も悪ふざけと下品さを前面に出し、真面目さを徹底して回避する。同じ素材主義でもプランダーフォニックスが批評性を掲げるのに対し、マッシュコアはあくまでフロアでの馬鹿騒ぎを目的とする点が異なる。</p>
<h2>成り立ち</h2><p>母体は1990年代後半にヨーロッパと北米で同時多発的に生まれたブレイクコアで、ジャングルの細断編集とハードコアテクノの歪みを結びつけた作風がすでにあった。そこへ元ネタ当てクイズのような遊戯性を持ち込んだ一群が、2000年代前半にマッシュコアとして括られるようになる。象徴的な作品はイギリスのHenry CollinsがShitmat名義で2004年にPlanet Muから発表したKillababylonkuttで、ラガのMCとイギリスのフォークソング、往年のポップスを容赦なくつなぎ合わせ、この方向性を広く知らしめた。オランダのJason KöhnenによるBong-Ra、アメリカ中西部ミルウォーキーのDoormouseと彼が運営したAddict Records、フランスのRotatorが主宰したPeace Off、ベルリンのAd Noiseamといったレーベル群が流通を支え、12インチのプレスと海外通販でシーンがつながっていた。オーストラリアのPassenger of Shitは自作の下品な音源と過激なライブで悪名を得て、この分野の反教養的な気風を体現した。同時期、日本のゲーム音源やアニメの台詞が海外の制作者に好んで使われ、日本出身でイギリスを拠点としたDJ Scotch Eggが実機のゲームボーイを鳴らして演奏するなど、玩具的な機材の使用も定着した。マッシュコアは著作権処理を一切行わないことを前提に成立しており、そのためメジャーな流通には決して乗れず、レーベルの多くは数年で活動を停止した。2010年代以降はYouTubeやSoundCloudでのマッシュアップ文化、さらにハイパーポップやナイトコアの断片主義へ影響を残し、細断されたポップスという発想そのものは現在の音楽により広く浸透している。</p>
<h2>代表曲</h2><ul><li>DJ Technorch - The Detonator</li><li>goreshit - My Love Feels All Wrong</li><li>m1dy - Speedcore Dandy</li></ul>
