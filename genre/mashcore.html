<h1>Mashcore（マッシュコア）とは</h1>
<p>ブレイクコアの高速な切り貼りの編集に、誰もが知っているポップスやアニメ、ゲーム、テレビ番組の音源を大量に貼り合わせるマッシュアップの手法を掛け合わせた音楽である。土台はアーメン・ブレイクを刻んだ160から200 BPM前後のジャン</p>
<p>ブレイクコアの高速な切り貼りの編集に、誰もが知っているポップスやアニメ、ゲーム、テレビ番組の音源を大量に貼り合わせるマッシュアップの手法を掛け合わせた音楽である。土台はアーメン・ブレイクを刻んだ160から200 BPM前後のジャングル的なリズム、あるいはガバのキックであり、その上につながりのない引用が数秒ごとに入れ替わりながら積み上げられる。引用元は原曲の知名度が高いほど良いとされ、聴き手が一瞬で元ネタに気づいてしまうこと自体が、笑いと気持ちよさの仕掛けになっている。編集はサンプラーやトラッカー、DAWのタイムストレッチを駆使し、ピッチを合わせずにわざとぶつける、拍の途中で強引に切り替える、同じ小節を吃音のように繰り返すといった、粗さを隠さない処理が好まれる。曲の流れに起伏という考え方は薄く、詰め込みの密度が高いまま終わりまで走り抜ける曲が多い。ジャケットや曲名も悪ふざけと下品さを前面に出し、真面目さをとことん避ける。</p>
<h2>成り立ち</h2><p>土台は1990年代中盤から後半に、ヨーロッパ、オーストラリア、英国などで生まれたブレイクコアで、ジャングルの細断編集とハードコアテクノの歪みを結びつけた作風がすでにあった。そこへ元ネタ当てクイズのような遊び心を持ち込んだ一群を、Shitmatが自分の音楽を指して「マッシュコア」と名づけた。イギリスのHenry CollinsはShitmat名義で、2004年にPlanet MuからKillababylonkutzを発表した。『Babylon Bwoy』のアカペラ(無伴奏の歌)を、Amen Brother、Think (About It)、Benny Hillのテーマ、Eye Of The Tigerなどのリズムに載せた全10曲の作品である。「マッシュコア」という語は、同じ年のアルバム『Full English Breakfest』に収められた曲「There's No Business Like Propa' Rungleclotted Mashup Bizznizz」と結び付けられている。アメリカ中西部ミルウォーキーのDoormouseが運営するAddict Records、フランスのRotatorが主宰したPeace Off、ベルリンのAd Noiseamといったレーベルが流通を支え、オランダのJason KöhnenのBong-Raなどの作り手が活動した。12インチのプレスと海外通販でシーンがつながっていた。オーストラリアのPassenger of Shit(本名Swift Treweeke)は、ブレイクコアやスピードコアのアーティストとして知られる。日本出身のDJ Scotch Eggは、実機のゲームボーイを鳴らして演奏するなど、玩具的な機材の使用でも知られる。マッシュコアは、権利の手続きを軽く見る態度が特徴とされ、主な流通はインディーズだった。長く続いたレーベルが多く、Planet Muは1995年設立で2025年に30周年を迎え、Ad Noiseamは2001年設立で2016年7月に活動を休止した。2010年代以降も、YouTubeやSoundCloudでマッシュアップ文化が広がり、細断されたポップスという発想は現在の音楽により広く浸透している。</p>
<h2>代表曲</h2><ul><li>Black Is the New Black (goreshit)</li><li>Toromi Hearts 2 (goreshit)</li><li>Satori De Pon! (goreshit)</li><li>Beautiful loli thing (goreshit)</li><li>Cauliflower (goreshit)</li><li>The Detonator (DJ Technorch)</li><li>My Love Feels All Wrong (goreshit)</li><li>Japanese Hardcore (DJ Technorch)</li><li>無明ヶ丘危険地帯 ～Ataraxia～ (DJ Technorch)</li><li>Tengu (m1dy)</li><li>Far East Speedcore (m1dy)</li><li>逃走讃美歌 ～RUNNING MACHINE～ (DJ Technorch)</li></ul>
