<h1>Mashcore（マッシュコア）とは</h1>
<p>マッシュコアは、ブレイクコアの高速な切り貼りの編集に、マッシュアップの手法を掛け合わせた音楽だ。誰もが知っているポップスやアニメ、ゲーム、テレビ番組の音源を、大量に貼り合わせていく。 土台は、アーメン・ブレイクを刻んだジャングル的</p>
<p>マッシュコアは、ブレイクコアの高速な切り貼りの編集に、マッシュアップの手法を掛け合わせた音楽だ。誰もが知っているポップスやアニメ、ゲーム、テレビ番組の音源を、大量に貼り合わせていく。

土台は、アーメン・ブレイクを刻んだジャングル的なリズムか、ガバのキックである。その上に、つながりのない引用が数秒ごとに入れ替わりながら積み上げられる。

マッシュコアは、主にマッシュアップに由来するとされる。サンプルの使い方はユーモラスで、あえて決まり文句を使う。

たとえばShitmatの音は、細切れのジャングル、レイヴ、オールドスクール、ガバ、プランダーフォニックス的なマッシュアップを組み合わせたものだ。ジャケットや曲名も悪ふざけと下品さを前面に出し、真面目さをとことん避ける。</p>
<h2>成り立ち</h2><p>土台になったのは、1990年代中盤から後半に、ヨーロッパ、オーストラリア、英国などで生まれたブレイクコアだ。そこには、ジャングルの細断編集とハードコアテクノの歪みを結びつけた作風が、すでにあった。

そこへShitmatが、自分の音楽を指して「マッシュコア」と名づけた。Shitmatは、イギリスのHenry Collinsの名義である。彼はこの名義で、2004年にPlanet MuからKillababylonkutzを発表した。『Babylon Bwoy』のアカペラ(無伴奏の歌)を、Amen Brother、Think (About It)、Benny Hillのテーマ、Eye Of The Tigerなどのリズムに載せた、全10曲の作品である。「マッシュコア」という語は、同じ年のアルバム『Full English Breakfest』に収められた曲「There's No Business Like Propa' Rungleclotted Mashup Bizznizz」と結び付けられている。

レーベルには、アメリカ中西部ミルウォーキーのDoormouseが運営するAddict Records、フランスのRotatorが主宰したPeace Off、ベルリンのAd Noiseamがあった。こうしたブレイクコア系レーベルの一部が、マッシュコア系の作品も扱った。ブレイクコアやラガコアの作り手としては、オランダのJason KöhnenのBong-Raが活動した。ブレイクコアの広がりの主役は、インターネットだった。

ブレイクコア周辺の作家としては、オーストラリアのPassenger of Shit(本名Swift Treweeke)が挙げられる。彼は、ブレイクコアやスピードコアのアーティストとして知られる。同じくブレイクコア周辺の作家として、日本出身のDJ Scotch Eggがいる。ゲームボーイを使って活動したことでも知られる。

マッシュコアは、無料や海賊版の音楽は無価値だ、という考えに敬意を払わない態度を示すとされる。主な流通はインディーズだった。Planet Muは1995年設立で、2025年に30周年を迎えた。一方、2001年設立のAd Noiseamは、2016年7月21日付で、活動を凍結する「deep-freeze に入る」と、終わりではない「not dead」を表明した。</p>
