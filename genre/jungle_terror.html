<h1>Jungle Terror（ジャングルテラー）とは</h1>
<p>部族的な打楽器と叫び声を、電子舞曲の土台に組み込んだ様式である。テンポは一分間に128拍前後の曲が多いが、拍の型は曲ごとに異なり、四つ打ちの曲もある。ダッチ・ハウスやビッグルーム系を土台に、初期にはトラップやムーンバートンの要素も</p>
<p>部族的な打楽器と叫び声を、電子舞曲の土台に組み込んだ様式である。テンポは一分間に128拍前後の曲が多いが、拍の型は曲ごとに異なり、四つ打ちの曲もある。ダッチ・ハウスやビッグルーム系を土台に、初期にはトラップやムーンバートンの要素も加え、そこに部族風の打楽器、動物の鳴き声、ボーカルの切り貼りを重ねる。ほぼサンプルだけで作られる。使われる音色はコンガ、ボンゴ、タムタム、木を叩く音、金属を打つ音などである。低音は短く歪ませた音の動きが中心で、メロディーの要素はほとんど置かれない。この様式を印象づけているのが声の使い方で、加工された叫び、動物の鳴き声、笛の音、そして意味を持たない掛け声が頻繁に挿入される。これらは民族音楽の引用というより、密林や儀式といったぼんやりとした印象を呼び起こすための記号として置かれている。曲の組み立ては、溜めと爆発の対比がはっきりしていて、静かに打楽器だけが残る区間から、全要素が一気に戻る形が繰り返される。本人は、名前の由来を「ジャングルの雰囲気」だと述べ、ジャンルというより雰囲気(vibe)だと語っている。</p>
<h2>成り立ち</h2><p>出発点は、オランダのDJ・制作者Wiwek(Wiwek Mahabali)が、2011〜12年ごろ、SoundCloudに曲を公開するときにジャンル欄の入力が必須だったため、自分の音楽に「jungle terror」と書いたことである。友人に説明するための言葉がそのまま残っただけで、本人は計画したものではなく、ジャンルというより雰囲気だと述べている。最初の『Jungle Terror EP』は2014年10月に発表され、流行したのは2013〜2016年とされる。土台となったのは、それ以前から進んでいたカリブ海やラテンアメリカの拍節の導入である。ムーンバートンが2009年に四つ打ち以外の選択肢を示し、EDMにトラップの影響が及んだ2012〜13年ごろには遅い拍節が持ち込まれていた。これらによって、欧州の制作者が非欧米的なリズムを扱うことへのためらいが減っていた。Wiwekはこの流れの上で、打楽器と声をさらに前面に出したのである。最初のEPはYellow Clawが2014年に作ったレーベルBarong Familyから出ており、オランダのスピナップ(Spinnin' Records)の表記もある。2015年前後には急に広がった。同時期にはメジャー・レイザー周辺の活動とも重なっており、世界各地の音楽を素材として使う流れの一部と考えられる。本人は、「食人」のような恐ろしい意味づけは違うと述べ、「女性にも優しく、クラブ向けであるべきだ」と語っている。ブームのピークは2013〜16年とされる。その後もWiwekは『Jungle Terror』のシリーズを続け、Vol.3は2017年12月、Vol.4は2020年9月、Vol.5は2024年5月に出ている。</p>
<h2>代表曲</h2><ul><li>Killa (Wiwek, Skrillex)</li><li>Killa ft. Elliphant (Wiwek)</li><li>On Your Mark (Wiwek)</li><li>Pop It (Wiwek &amp; Yellow Claw feat. Lil Debbie)</li><li>Double Dribble (Wiwek)</li><li>Riot (Wiwek)</li><li>Masta (Wiwek &amp; Moksi)</li><li>Get Out of the Way (Chocolate Puma &amp; Wiwek)</li><li>Move (Wiwek &amp; Mightyfools)</li><li>So Hot (Wiwek, Gregor Salto &amp; Kuenta I Tambu)</li><li>Stop Me (Wiwek)</li><li>Ragga (Wiwek)</li></ul>
