<h1>Jungle Terror（ジャングルテラー）とは</h1>
<p>部族的な打楽器と叫び声を、電子舞曲の骨格に組み込んだ様式である。テンポは一分間に128拍前後で、四つ打ちではなく、跳ねた不均等な配置を取る点が最大の特徴になる。具体的にはムーンバートン由来の三・三・二の区切りや、レゲトンの型を土台</p>
<p>部族的な打楽器と叫び声を、電子舞曲の骨格に組み込んだ様式である。テンポは一分間に128拍前後で、四つ打ちではなく、跳ねた不均等な配置を取る点が最大の特徴になる。具体的にはムーンバートン由来の三・三・二の区切りや、レゲトンの型を土台にしつつ、そこに大量の生楽器風の打楽器音を重ねる。使われる音色はコンガ、ボンゴ、タムタム、木を叩く音、金属を打つ音などで、これらは実際の民族音楽の録音から採られることもあれば、それらしく作られた合成音のこともある。低音は短く歪ませた音型が中心で、旋律の要素はほとんど置かれない。この様式を印象づけているのが声の使い方で、加工された叫び、動物の鳴き声、笛の音、そして意味を持たない掛け声が頻繁に挿入される。これらは民族音楽の引用というより、密林や儀式といった漠然とした印象を喚起するための記号として配置されている。曲の構成は溜めと爆発の対比が明確で、静かに打楽器だけが残る区間から、全要素が一気に戻る形が繰り返される。実在の文化を正確に反映したものではなく、想像上の未開の地を音で描く様式である点は、制作者自身も自覚している。</p>
<h2>成り立ち</h2><p>2014年、オランダの制作者ワイルドストライローズが自身の音楽に名前を与えたことが直接の出発点である。彼はムーンバートンやトラップの拍節を用いながら、そこに大量の打楽器と叫び声を重ねる作風を確立し、これをジャングル・テラーと呼んだ。この命名は音楽的な分類というより、自分の作るものを他と区別するための宣言に近かった。背景には、2010年代前半に電子舞曲の様式が極度に細分化し、新しい名前を付けること自体が制作者の戦略になっていたという事情がある。土壌となったのは、それ以前から進んでいたカリブ海やラテンアメリカの拍節の導入である。ムーンバートンが2010年に四つ打ち以外の選択肢を示し、トラップが2012年に遅い拍節を持ち込んでいた。これらによって、欧州の制作者が非欧米的なリズムを扱うことへの抵抗が下がっていた。ワイルドストライローズはこの流れの上で、打楽器と声をさらに前面に出したのである。オランダの大手レーベルであるスピナップやバレルハウスがこの方向の作品を発表し、2015年前後には一定の広がりを見せた。同時期にはメジャー・レイザー周辺の活動とも重なっており、世界各地の音楽を素材として使う潮流の一部として位置づけられる。この様式には成立当初から批判が向けられてきた。密林や部族といった記号を、実際の文化的背景から切り離して雰囲気づくりに使うことへの疑問である。名称そのものが、非西洋を未開で危険なものとして表象する古い枠組みを再生産しているという指摘もあった。流行としては短命で、2016年以降は独立した様式としての活動は縮小した。ただし打楽器を大量に重ねる音作りは、その後のアフロ・ハウスやラテン系の電子音楽に受け継がれ、そちらではより当事者性のある形で展開されている。</p>
