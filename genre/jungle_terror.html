<h1>Jungle Terror（ジャングルテラー）とは</h1>
<p>この音楽は、部族的な打楽器と叫び声を、電子舞曲の土台に組み込んだスタイルである。 ダッチ・ハウスやビッグルーム系を土台にしていて、初期にはトラップやムーンバートンの要素も加えたとされる。そこに部族風の打楽器、動物の鳴き声、ボーカル</p>
<p>この音楽は、部族的な打楽器と叫び声を、電子舞曲の土台に組み込んだスタイルである。

ダッチ・ハウスやビッグルーム系を土台にしていて、初期にはトラップやムーンバートンの要素も加えたとされる。そこに部族風の打楽器、動物の鳴き声、ボーカルの切り貼りを重ねる。Wiwekは、自作ではほぼサンプルのみを使うと述べている。使われる音色は、ボンゴ、スティールドラム、ティンバレスなどだ。

低音は、短く歪ませた音の動きが中心になる。メロディーの要素は最小限だ。

テンポは一分間に128拍前後の曲が多い。ただし拍の型は曲ごとに異なり、四つ打ちの曲もある。

このスタイルを印象づけているのが、声の使い方だ。加工された叫び、動物の鳴き声、そして意味を持たない掛け声が、頻繁に差し込まれる。これらは民族音楽の引用というより、密林や儀式といったぼんやりとした印象を呼び起こすための記号だ、という見方もある。

曲の組み立ては、溜めと爆発の対比がはっきりしている。打楽器と動物の鳴き声だけが残る区間から、全部の音が一気に戻る形が繰り返される。

本人は、名前の由来について、「terror」は当時としては激しめの音から、「jungle」は密林の雰囲気から取ったと述べている。そして、ジャンルというより雰囲気(vibe)だと語っている。</p>
<h2>成り立ち</h2><p>オランダのDJ・制作者Wiwek(Wiwek Mahabali)は、本人の記憶では2011〜12年ごろ、SoundCloudに曲を公開しようとしていた。そのサイトではジャンル欄の入力が必須だったため、彼は自分の音楽に「jungle terror」と書いた。これが出発点である。もとは友人に説明するための言葉で、それがそのまま残っただけだった。本人は、計画したものではなく、ジャンルというより雰囲気だと述べている。

最初の『Jungle Terror EP』は、2014年9月22日に発表された。Wiwek本人は、影響を受けたものとして、2010年以前のダッチ・ハウスと、育った家庭のインド伝統音楽を挙げている。

一方で、ムーンバートンが2009年に四つ打ち以外の選択肢を示した、という見方もある。EDMにトラップの影響が及んだ2012〜13年ごろには、遅い拍の取り方も持ち込まれていたとされる。Wiwekはこの流れの上で、打楽器と声をさらに前面に出したのである。

最初のEPは、Yellow Clawが2014年に作ったレーベルBarong Familyから出た。レーベルの配信は、2015年初めまでオランダのスピニン・レコード(Spinnin' Records)が担当した。2014年の最初のEP以降、2015年前後に注目が急増した。

本人は、「食人」のような恐ろしい意味づけは違うと述べている。「女性にも優しく、クラブ向けであるべきだ」とも語っている。その後もWiwekは『Jungle Terror』のシリーズを続けた。Vol.3は2017年12月、Vol.4は2020年9月、Vol.5は2024年5月に出ている。</p>
<h2>代表曲</h2><ul><li>Killa (Wiwek, Skrillex)</li><li>Killa ft. Elliphant (Wiwek)</li><li>On Your Mark (Wiwek)</li><li>Pop It (Wiwek &amp; Yellow Claw feat. Lil Debbie)</li><li>Double Dribble (Wiwek)</li><li>Riot (Wiwek)</li><li>Masta (Wiwek &amp; Moksi)</li><li>Get Out of the Way (Chocolate Puma &amp; Wiwek)</li><li>Move (Wiwek &amp; Mightyfools)</li><li>So Hot (Wiwek, Gregor Salto &amp; Kuenta I Tambu)</li><li>Stop Me (Wiwek)</li><li>Ragga (Wiwek)</li></ul>
