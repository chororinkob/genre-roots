<h1>Pop EDMとは</h1>
<p>このジャンルは、EDMの作り方を、ラジオやストリーミングで受けるポップスの枠組みに合わせて作り直したスタイルだ。 音色は、鋸波の分厚いリードに加えて、木管や口笛をまねた明るい音が使われる曲が多い。指を鳴らす音や手拍子といった軽い打</p>
<p>このジャンルは、EDMの作り方を、ラジオやストリーミングで受けるポップスの枠組みに合わせて作り直したスタイルだ。

音色は、鋸波の分厚いリードに加えて、木管や口笛をまねた明るい音が使われる曲が多い。指を鳴らす音や手拍子といった軽い打楽器も好まれ、全体に湿り気が少なく、風通しのよい音になる。

和音は、四つの音を重ねた和音の単純なくり返しだ。転調がほとんど行われない曲が多い。

BPMは95〜128前後と幅がある。四つ打ちを保つ曲もあれば、ドロップだけを電子的に処理し、ほかの部分はポップスの拍の取り方にする曲もある。

いちばんの特徴は、歌の扱いだ。インストゥルメンタル中心のEDMに比べて、歌の比重が大きい。ヴァース・プリコーラス・サビという歌ものの組み立てが、まず土台にある。

歌詞は、恋愛、夜遊び、自己肯定といった、誰にでも通じるテーマを、分かりやすい言葉で歌う。サビの一行が、そのまま題名になる曲が多い。

曲の組み立てでは、ドロップがサビの後に置かれるか、サビそのものの代わりに置かれる。歌のフレーズを切り刻んで楽器のように使う「ボーカル・チョップ」が用いられることが多い。曲の長さは4分前後で、比較的短い曲が多い。ストリーミングで再生直後に聴き手をつかむ必要があるという商売上の求めが、2010年代半ば以降の傾向に影響した可能性がある。</p>
<h2>成り立ち</h2><p>2000年代末から2010年代にかけて、ダンス音楽と北米のポップス産業が結びついた。その結果として生まれたのが、このジャンルだ。

フランスのDavid Guettaは、2001年のデビューシングル「Just a Little More Love」から、Chris Willisを迎えて歌ものとの組み合わせを始めていた。2007年には、アルバム『Pop Life』に入ったシングル「Love Is Gone」を出した。こちらにもChris Willisが参加している。2009年のアルバムOne Loveでは、Akon、The Black Eyed Peasのwill.i.am、Kelly Rowlandといった米国のポップ／ヒップホップの歌手を招いた。こうして主流の市場にたどり着き、この流れを引っぱった一人になった。

とくに、Kelly RowlandとのWhen Love Takes Over(2009年4月、英国1位、全米76位。Billboardが後年、米国でEDMの流れが現れつつあることの目印と評した)は大きかった。The Black Eyed PeasのI Gotta Feeling(2009年6月、GuettaとFrédéric Riestererが制作。全米で14週連続1位)もそうだ。どちらも、ダンス音楽が米国のポップスに入り込んだことを示す例となった。

続く2010年代前半には、ポップスの歌手とEDMの作り手の組み合わせが広がった。Rihannaの2011年のシングルWe Found Love（Calvin Harris参加）は、全米で10週(非連続)1位を獲得した。Ariana Grandeの2014年のシングルBreak Free（Zedd参加）は、全米4位になった。2016年7月には、The ChainsmokersがCloser(95BPM、約4分)を出した。歌を主役にしつつ、ドロップも強く作られている。

一方、業界の仕組みの面では、ラジオのリズミック系フォーマット「リズミック・コンテンポラリー」が、EDM、リズミック・ポップ、ヒップホップ、リズム・アンド・ブルースを混ぜて流す形式で、EDM系ポップの放送にも使われた。また、Spotifyの米国での開始(2011年)や、2015年のApple Musicの開始以降、プレイリストが曲と出会う主な道筋になったと言われる。イントロが短くなる傾向があるとされる。

しかし、2016年ごろから米国のEDM市場は失速し、2010年代末にかけて、ほかのスタイルに主流の座を譲った。それでも、一部の手法はポップスの曲作りに取り入れられた。</p>
<h2>代表曲</h2><ul><li>Faded (Alan Walker)</li><li>This Is What You Came For (Calvin Harris feat. Rihanna)</li><li>Something Just Like This (The Chainsmokers &amp; Coldplay)</li><li>Titanium (David Guetta ft. Sia)</li><li>Hey Mama (David Guetta feat. Nicki Minaj, Bebe Rexha &amp; Afrojack)</li><li>Break Free (Ariana Grande feat. Zedd)</li><li>Rather Be (Clean Bandit feat. Jess Glynne)</li><li>Stay (Zedd &amp; Alessia Cara)</li><li>Paris (The Chainsmokers)</li><li>Clarity (Zedd ft. Foxes)</li><li>Heroes (We Could Be) (Alesso feat. Tove Lo)</li><li>Roses (The Chainsmokers feat. ROZES)</li></ul>
