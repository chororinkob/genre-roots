<h1>Pop EDMとは</h1>
<p>EDMの制作手法を、ラジオとストリーミングで機能するポップスの枠組みに落とし込んだ様式。BPMは100〜128と幅があり、四つ打ちを保つ曲もあれば、ドロップだけを電子的に処理して他はポップスの拍取りにする曲もある。最大の特徴は歌の</p>
<p>EDMの制作手法を、ラジオとストリーミングで機能するポップスの枠組みに落とし込んだ様式。BPMは100〜128と幅があり、四つ打ちを保つ曲もあれば、ドロップだけを電子的に処理して他はポップスの拍取りにする曲もある。最大の特徴は歌の扱いで、EDMが歌を装飾として使うのに対し、こちらは歌が主役であり、ヴァース・プリコーラス・サビという歌ものの構造が骨格として先にある。ドロップはサビの後、あるいはサビそのものの代わりに置かれ、歌のフレーズを切り刻んで楽器化した「ボーカル・チョップ」が用いられることが多い。音色は鋸波の分厚いリードに加え、木管や口笛を模した明るい音、指を鳴らす音、手拍子といった軽い打楽器が好まれ、全体に湿度が低く風通しがよい。和声は四和音の単純な循環で、転調はほとんど行われない。歌詞は恋愛、夜遊び、自己肯定といった普遍的な主題を平易な語彙で扱い、サビの一行が題名になる作りが定型。曲尺は三分前後に短縮され、イントロは10秒以内で歌に入る。ストリーミングの再生開始直後に聴き手を掴む必要があるという商業的要請が、構造そのものを規定している点が最も特徴的である。</p>
<h2>成り立ち</h2><p>2009年から2015年頃にかけて、ダンス音楽と北米のポップス産業が接合した結果として成立した。決定的な起点はフランスのDavid Guetta で、2009年のアルバムOne Love においてAkon、The Black Eyed Peas のwill.i.am、Kelly Rowland といった米国のポップ／ヒップホップの歌手を招き、ダンス・トラックにヒット曲の歌を乗せるという方式を確立した。とりわけKelly Rowland とのWhen Love Takes Over、そしてThe Black Eyed Peas のI Gotta Feeling（Guetta が制作）は、米国のラジオでダンス音楽が主流になる転換点となった。続いて2010年代前半には、Calvin Harris がRihanna とのWe Found Love（2011年）で世界的な首位を獲得し、Zedd がAriana Grande とのBreak Free（2014年）でポップスの歌手をEDMの文脈に迎え入れた。The Chainsmokers は2016年のCloser で、ドロップを歌の延長として控えめに扱う手法を示し、ジャンルの重心を完全に歌側へ移した。産業構造としては、ラジオのフォーマットが「リズミック・コンテンポラリー」としてダンス寄りの曲を受け入れたこと、そして2014年以降Spotify やApple Music のプレイリストが楽曲発見の主要経路になったことが大きい。プレイリスト上では冒頭30秒で離脱されない構成が有利になるため、イントロの短縮と早いサビ到達が制作の常識になった。批判としては、既存のポップ制作陣が量産する結果として楽曲が均質化したこと、ダンス音楽側のクラブ的な機能性が失われたこと、そしてDJ名義の作品でありながら実際の制作を外部の作曲チームが担う不透明さが指摘された。2017年以降はラテン・ポップやヒップホップの台頭で主流の座を譲ったが、その制作手法はポップス全般の標準的な語彙として完全に吸収されている。</p>
