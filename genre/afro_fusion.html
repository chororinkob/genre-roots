<h1>Afro-Fusion（アフロフュージョン）とは</h1>
<p>西アフリカの音楽的な骨格を保ちながら、欧米のR&amp;B、ヒップホップ、ポップスの音づくりを重ねた現代のアフリカン・ポップス。土台にあるのはパーカッションの多層構造で、コンガ、ジェンベ、シェケレといった打楽器の音を打ち込みで再現し、拍を</p>
<p>西アフリカの音楽的な骨格を保ちながら、欧米のR&amp;B、ヒップホップ、ポップスの音づくりを重ねた現代のアフリカン・ポップス。土台にあるのはパーカッションの多層構造で、コンガ、ジェンベ、シェケレといった打楽器の音を打ち込みで再現し、拍を細かく分割した反復パターンが幾重にも噛み合う。ドラムはキックの位置が四つ打ちではなく、三拍のまとまりを二拍の枠に押し込むポリリズムの感覚で置かれ、常に軽く前のめりに転がる。テンポは毎分100から115拍程度が中心で、身体を左右に揺らす速度に置かれている。ベースは太いシンセの低音で、和音は明るい長調か、短調でも陰にならない循環進行が好まれる。上物にはエレキギターのハイライフ由来の細かいアルペジオ、シンセのフルート音、木琴のような減衰の速い音色が使われる。歌唱は最大の特徴で、英語、ピジン英語、ヨルバ語、イボ語、スワヒリ語が一曲の中で自在に混ざり、旋律は装飾音でよく揺れる。歌詞は恋愛と祝祭が中心だが、政治や貧困への言及も混ざる。同じアフリカ発でも、フェラ・クティのアフロビートが10分を超える長尺と激しい政治批判を特徴としたのに対し、こちらは三分前後の明快なポップスとして作られる点が違う。</p>
<h2>成り立ち</h2><p>現在の形が固まったのは2010年前後のナイジェリア、とりわけラゴスである。土台には長い蓄積があった。1950年代のハイライフ、1970年代にFela Kutiが確立したアフロビート、そしてジュジュ音楽の伝統がある。1990年代から2000年代にかけて、ナイジェリアの若い制作者たちはヒップホップとダンスホールを取り込みながら、自国の言葉で歌う音楽を模索していた。2003年、Innocent Idibia(芸名トゥーベイバ)の『African Queen』が大陸全体でヒットし、続く2000年代後半にはP-Squareやレーベルモ・ハイツが市場を作った。決定的だったのは2011年前後で、Wizkidが『Holla at Your Boy』で登場し、翌年にはDavidoが『Dami Duro』で続いた。制作者ではSarz、Shizzi、Legendury Beatz、そしてとりわけP.Priméらが、打楽器の反復と現代的な低音を組み合わせた音を確立した。国際的な突破口は2016年、DrakeがWizkidを迎えた『One Dance』が世界各国で一位を取ったことで、これによりアフリカのポップスが欧米の主流市場に届く道筋ができた。2019年、Burna Boyがアルバム『African Giant』でグラミー賞にノミネートされ、翌々年の『Twice as Tall』で受賞した。彼はアフロビーツという一括りの呼称を嫌い、自分の音楽をアフロフュージョンと呼ぶことを繰り返し主張している。この呼び名の問題はシーン全体の論争でもあり、多様な国と様式をまとめてしまう欧米側の分類に対する反発が根強い。背景には、ナイジェリアの人口の半分以上が25歳未満という若年人口の膨張と、携帯電話とストリーミングの普及がある。Tems、Rema、Asake、ガーナのStonebwoyら次世代が続き、2023年にはグラミー賞に専門部門が新設された。</p>
