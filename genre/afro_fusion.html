<h1>Afro-Fusion（アフロフュージョン）とは</h1>
<p>アフロフュージョンは、アフロビーツの別称・自称として使われる呼称だ。アフロビーツはアフロポップとも呼ばれる。西アフリカの音楽を土台に残しながら、欧米のR&amp;B、ヒップホップ、ポップスの音づくりを重ねた、現代のアフリカン・ポップスであ</p>
<p>アフロフュージョンは、アフロビーツの別称・自称として使われる呼称だ。アフロビーツはアフロポップとも呼ばれる。西アフリカの音楽を土台に残しながら、欧米のR&amp;B、ヒップホップ、ポップスの音づくりを重ねた、現代のアフリカン・ポップスである。

土台にあるのは、打楽器が何層にも重なる作りだ。キューバ発祥のコンガ、ジェンベ、シェケレといった打楽器の音を打ち込みで再現する。拍を細かく分けた繰り返しのパターンが、いくつも重なって噛み合う。

ドラムは、4/4拍子のうえに、3+3+2型のクラーベ的なシンコペーションを置く。そのため、いつも軽く前のめりに転がるように進む。テンポはおおむね100から115 BPMで、体を左右に揺らす速さに合わせてある。この数字は、DJ向けの目安である。

ベースは太いシンセの低音だ。和音は明るい長調か、短調でも暗くならない循環進行が好まれる。上に乗る音には、ハイライフから来たエレキギターの細かいアルペジオ、シンセのフルートの音、木琴のようにすぐ消える音色が使われる。

いちばんの特徴は歌い方だ。英語、ピジン英語、ヨルバ語、イボ語、トゥイ語などが、一曲の中で自由に混ざる。メロディーは細かい飾りの音で、よく揺れる。

歌詞は恋愛とお祝いが中心だが、政治や貧困に触れることもある。同じアフリカ生まれでも、フェラ・クティのアフロビートは、10分を超える長い曲と激しい政治批判が特徴だった。これに対して、こちらは比較的短い、分かりやすいポップスとして作られる。そこが違いだ。</p>
<h2>成り立ち</h2><p>今の形は、2000年代から2010年代にかけて、ナイジェリア、ガーナ、英国で育ち、固まった（単一の起点や場所を定説とする根拠はない）。

その下には、長い積み重ねがあった。19世紀ガーナ沿岸に起源を持ち、戦後にナイジェリアへ広がったハイライフ。1960年代後半にFela Kutiが創始し、1970年代に全盛を迎えたアフロビート。ジュジュ音楽の伝統も、その1つとされる。1990年代から2000年代にかけて、ナイジェリアの若い制作者たちは、ヒップホップとダンスホールを取り入れながら、自分の国の言葉で歌う音楽を探っていたとされる。

2004年、当時2Faceの名で活動していたInnocent Idibia（のちに2Baba）が『African Queen』を出した（アルバム『Face 2 Face』は2004年5月発売）。この曲は西アフリカ・南部アフリカ・欧州で支持を集めた。2000年代前半から半ばにかけては、P-Squareやレーベルのモ・ヒッツが人気を集め、2000年代後半に広がっていった。

大きな転機は、2010年前後から2011年にかけて訪れた。2010年1月にWizkidが『Holla at Your Boy』で登場し（アルバム『Superstar』は2011年）、2011年10月にはDavidoが『Dami Duro』で続いた。制作者では、Shizziが2011年の『Dami Duro』で知られる。SarzとLegendury Beatzは、2010年代半ばのWizkid作品などで知られる。

2016年、DrakeがWizkidを迎えた『One Dance』が世界各国で一位を取り、大きな国際的転機のひとつとなった。それ以前の2012年には、D'banjの『Oliver Twist』が英国チャートに入っていた。

2019年、Burna Boyがアルバム『African Giant』で、第62回グラミー賞のBest World Music Albumにノミネートされた。そして翌々年の『Twice as Tall』で受賞した。彼は2023年ごろまでアフロフュージョンを名乗り、アフロビーツと呼ばれることを拒んでいた。しかし2025年に謝罪し、今はアフロビーツというラベルを受け入れている。

この呼び名の問題は、シーン全体の論争でもある。「アフロ」という言葉がアフリカをひとまとまりのように見せる点や、フェラ・クティのアフロビートと混同される点には、反発がある。背景には、ナイジェリアの人口の半分以上が25歳未満という若い人口の急な増え方と、携帯電話とストリーミングの広まりがあるとされる。

その後、Tems、Rema、Asakeら次の世代が続き、ガーナのStonebwoyも活躍した。2023年にはグラミー賞に「Best African Music Performance」部門の新設が発表され、2024年に初めて授与された。</p>
