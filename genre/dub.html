<h1>Dub（ダブ）とは</h1>
<p>ダブは、レゲエの録音から歌や楽器を抜き差しし、残った音にエコーとリヴァーブ（残響）を深くかけて作り直す音楽だ。ミキシング卓（複数の音を混ぜる機械）を、楽器として使う。 土台は、ドラムとベースだけのリディム（伴奏の土台となる演奏）だ</p>
<p>ダブは、レゲエの録音から歌や楽器を抜き差しし、残った音にエコーとリヴァーブ（残響）を深くかけて作り直す音楽だ。ミキシング卓（複数の音を混ぜる機械）を、楽器として使う。

土台は、ドラムとベースだけのリディム（伴奏の土台となる演奏）だ。重く長い音符を弾くベースが主役になる。ドラムは、1拍目を空けて、3拍目にバスドラムとスネアを置く。この「ワンドロップ」が代表的なパターンの一つである。

歌は、一瞬だけ現れては、エコーの尾を引きながら消える。ギターやホーンの断片も同じように、霧の中を出入りする。

使う機材は、スプリング・リヴァーブ（金属のばねで残響を作る装置）、テープ・ディレイ（録音テープで音を遅らせて繰り返す装置）、高音域と低音域を削るフィルターなどだ。テープ・ディレイでは、Roland Space Echoが1970年代半ば以降の定番になった。そして、各パートを消したり戻したりするフェーダー（音量を上げ下げするつまみ）そのものも、楽器になる。

エンジニアが本番一発でフェーダーとつまみを操作し、その手つきが演奏になる。そのため、同じ原曲から無数の別バージョンが生まれる。

テンポは、60〜90BPM（1分間の拍数）前後と遅めのものが多い。音数が少ないぶん、空間の広さと、残響が消えていく過程そのものが聴かせどころになる。

歌モノのレゲエと材料は同じだ。しかし、主役を歌からミックスの操作へ移した点が、本質的な違いである。のちのリミックスやエレクトロニック、ヒップホップに影響を与えたとされる。</p>
<h2>成り立ち</h2><p>舞台は、1960年代末のジャマイカである。サウンドシステムという移動式の巨大音響装置を使った野外パーティーの文化から、この音楽は生まれた。各サウンドシステムは、他所では鳴らせない自分専用の一枚盤（ダブプレート）を求めていた。その競争が、実験の動機になった。

起源としてよく語られるのは、1967年または1968年(資料により異なる)の出来事である。キングストンのサウンド運営者Ruddy Redwoodが、Duke Reidのスタジオ（Treasure Isle）で、ダブプレートを切ってもらった。そのとき、技師Byron Smithが、歌の入っていないバージョンを誤って作ってしまった。彼がそれを試しに現場でかけると、客が自分たちで歌い出して大受けした。この出来事が、シングルのB面に歌を抜いた「バージョン」を入れる習慣が定着したきっかけの一つとして語られる。

技法として体系化したのは、キングストンのウォーターハウス地区で修理工場を営んでいたOsbourne Ruddock、つまりKing Tubbyであるとされる。彼はByron LeeのDynamic Soundsから、1972年ごろに、12入力のMCI製ミキシング卓と4トラックのテープ機を購入した。卓付属のハイパスフィルターとスプリング・リヴァーブを駆使し、演奏の途中で楽器を消し、残響だけを残して戻す操作を即興で行った。

もう一人の巨人が、Lee Scratch Perryだ。1973年に自宅の庭にBlack Arkスタジオを建て、4トラックの機材に何度も重ね録りした。牛の鳴き声のような音(人の声で作ったもの)や割れたガラスの音などを混ぜ、濃密で歪んだ音を作り出した。

Augustus Pabloのメロディカ（息を吹き込んで鳴らす鍵盤楽器）を主役にした1976年の「King Tubbys Meets Rockers Uptown」は、ダブの代表作として今も参照される。King Tubbyの工房からは、Prince Jammy、Scientist、Prince Philip Smartといった技師が育った。1980年代には、彼らが主役になる。

背景には、ラスタファーライの思想と、1970年代ジャマイカの政治的暴力がある。Michael Vealは、音の空洞と深い残響はその緊張の反映として聴かれたと論じる。

だが、終わりは唐突だった。Black Arkは、1979年にPerry自身が放火したとされる（家族は、1983年の再建途中の電気事故による火災だったと証言している）。King Tubbyは、1989年2月6日、自宅前で射殺された。強盗とみられるが、犯人は不明だ。

それでも、技法は生き延びた。ロンドンでは、Adrian SherwoodのOn-U Soundが、ポストパンクとダブを結び付けた。ダブの技法は、のちにジャングル、ダブステップ、ダブテクノ(ベルリンの Basic Channel ら)などに影響を与えた。</p>
<h2>代表曲</h2><ul><li>Dub Be Good to Me (Beats International)</li><li>King Tubby Meets Rockers Uptown (Augustus Pablo)</li><li>Super Ape (Lee &quot;Scratch&quot; Perry)</li><li>Young Generation Dub (Augustus Pablo)</li><li>Each One Dub (Augustus Pablo)</li><li>Skanking Dub (Augustus Pablo)</li><li>Scientist Rids the World of the Evil Curse of the Vampires (Scientist)</li><li>Mango Drive (Rhythm and Sound)</li><li>Your Teeth in My Neck (Scientist)</li><li>King in My Empire (Rhythm and Sound feat. Cornell Campbell)</li></ul>
