<h1>Dub（ダブ）とは</h1>
<p>レゲエの録音から歌や楽器を抜き差しし、残った音にエコーとリヴァーブを深くかけて作り直す、ミキシング卓を楽器として使う音楽。土台はドラムとベースだけのリディムで、重く長い音符を弾くベースが主役になり、ドラムは1拍目を空けて3拍目にバ</p>
<p>レゲエの録音から歌や楽器を抜き差しし、残った音にエコーとリヴァーブを深くかけて作り直す、ミキシング卓を楽器として使う音楽。土台はドラムとベースだけのリディムで、重く長い音符を弾くベースが主役になり、ドラムは1拍目を空けて3拍目にバスドラムとスネアを置くワンドロップが基本型。歌は一瞬だけ現れてはエコーの尾を引きながら消え、ギターやホーンの断片も同様に霧の中を出入りする。使う機材はスプリング・リヴァーブ、テープ・ディレイ（Roland Space Echoが定番）、高音域と低音域を削るフィルター、そして各パートを消したり戻したりするフェーダーそのもの。エンジニアが本番一発でフェーダーとつまみを操作し、その手つきが演奏になるため、同じ原曲から無数の別バージョンが生まれる。テンポは60〜90BPMと遅く、音数が少ないぶん空間の広さと残響が消えていく過程そのものが聴かせどころになる。歌モノのレゲエと材料は同一だが、主役を歌からミックスの操作へ移した点が本質的な違いであり、のちのリミックス文化はここに起源を持つ。</p>
<h2>成り立ち</h2><p>1960年代末のジャマイカで、サウンドシステムという移動式の巨大音響装置を使った野外パーティーの文化から生まれた。各サウンドシステムは他所では鳴らせない自分専用の一枚盤（ダブプレート）を求めており、その競争が実験の動機になった。起源としてよく語られるのは1967年、キングストンのサウンド運営者Ruddy Redwoodが、カッティング技師Byron Leeのスタジオで歌の入っていないバージョンを誤って作らせ、それを試しに現場でかけたところ客が自分たちで歌い出して大受けした、という出来事である。この偶然から、シングルのB面に歌を抜いた「バージョン」を入れる習慣が定着した。技法として体系化したのはキングストンのウォーターハウス地区で修理工場を営んでいたOsbourne Ruddock——King Tubbyである。彼は放送局の払い下げのミキシング卓を自分で改造し、任意の帯域を切り落とすフィルターとスプリング・リヴァーブを組み込み、演奏の途中で楽器を消し、残響だけを残して戻す操作を即興で行った。もう一人の巨人Lee Scratch Perryは1973年に自宅の庭にBlack Arkスタジオを建て、4トラックの機材に何度も重ね録りし、牛の鳴き声や割れたガラスの音まで混ぜた濃密で歪んだ音を作り出した。Augustus Pabloのメロディカを主役にした1976年の「King Tubby Meets Rockers Uptown」は、ダブの代表作として今も参照される。King Tubbyの工房からはPrince Jammy、Scientist、Prince Philip Smartといった技師が育ち、1970年代末には彼らが主役になる。背景には、ラスタファーライの思想と1970年代ジャマイカの政治的暴力があり、音の空洞と深い残響はその緊張の反映として聴かれた。だが終わりは唐突だった。Black Arkは1983年に焼失し、Perry自身の放火とも言われる。King Tubbyは1989年2月6日、自宅前で強盗に射殺された。それでも技法は生き延び、ロンドンではAdrian SherwoodのOn-U Soundがポストパンクとダブを結び付け、その後ジャングル、ダブテクノ、ダブステップへと連なっていった。</p>
<h2>代表曲</h2><ul><li>King Tubby Meets Rockers Uptown (Augustus Pablo)</li><li>Super Ape (Lee &quot;Scratch&quot; Perry)</li><li>Scientist Rids the World of the Evil Curse of the Vampires (Scientist)</li></ul>
