<h1>Gnawa（グナワ）とは</h1>
<p>モロッコに暮らす、サハラ以南のアフリカから連れて来られた人々の子孫によって受け継がれてきた、儀礼のための音楽である。編成は三つの要素から成る。中心は師と呼ばれる指導者が弾くゲンブリという三弦の低音撥弦楽器で、細長い木の胴に駱駝の皮</p>
<p>モロッコに暮らす、サハラ以南のアフリカから連れて来られた人々の子孫によって受け継がれてきた、儀礼のための音楽である。編成は三つの要素から成る。中心は師と呼ばれる指導者が弾くゲンブリという三弦の低音撥弦楽器で、細長い木の胴に駱駝の皮を張り、弦を弾くと同時に胴を叩くため、低音と打楽器の両方を一人で担う。次にカルカベと呼ばれる大型の鉄製の打楽器があり、両手に二枚ずつ持って打ち合わせることで、金属的で鋭い連打を絶え間なく鳴らす。この音は鎖の音を模したものとされ、奴隷であった祖先の記憶と結びつけられている。三つ目は歌で、師の独唱に対して他の演奏者が短い応答を返す掛け合いが、延々と反復される。音階は五音音階を基本とし、旋律は単純だが、反復の中でテンポが徐々に上がり、リズムの分割が細かくなっていくことで、聴き手と踊り手を変性した意識状態へ導く。演奏は一晩を通して行われ、七つの組に分かれた曲目が順に演奏される。それぞれの組は特定の色と霊的な存在に対応しており、香や衣装の色もこれに合わせて変えられる。踊る者はある段階で意識を失ったように倒れ込み、それが治癒の徴とされる。</p>
<h2>成り立ち</h2><p>この音楽の起源は、サハラ砂漠を越えた奴隷貿易にある。数世紀にわたり、現在のマリ、ガーナ、ニジェール、スーダンにあたる地域から、多数の人々が捕らえられ、隊商路を通ってモロッコへ連れて来られた。彼らは故郷の言語も家族も奪われたが、宗教的な儀礼と音楽を保持し、それをイスラームの聖者信仰と融合させることで、新しい共同体の紐帯を作り上げた。現在の歌詞には、消えかけた西アフリカの言語の断片が残っており、意味が分からないまま音として受け継がれている語句も多い。この音楽の本来の目的は娯楽ではなく治療である。病や不運は特定の霊に取り憑かれた結果と考えられ、その霊を鎮めるために、対応する曲を演奏して当人を憑依状態へ導くという儀礼が行われてきた。モロッコ社会において、この共同体は長く周縁的な地位に置かれ、その儀礼は正統な信仰から逸脱したものと見なされることもあった。状況が変わったのは20世紀後半である。1960年代から1970年代にかけて、アメリカのジャズ演奏者Randy WestonやPharoah Sandersがこの音楽に深く傾倒し、共演を行ったことで、国際的な注目が集まった。1990年代以降はさらに多くの西洋の音楽家が現地を訪れている。1998年、大西洋岸の町エッサウィラで大規模な音楽祭が始まり、それまで家の中で夜通し行われていた儀礼が、数万人の観客の前の舞台で演奏されるようになった。2019年には国際連合の機関によって無形文化遺産に登録されている。しかしこの国際化は緊張も生んだ。神聖な儀礼が観光の見世物として切り取られ、本来の時間の長さも目的も失われるという批判が、共同体の内部から繰り返し提起されている。師の資格をどう認定するかという問題も含め、伝統の継承と商業化の均衡は現在も課題であり続けている。</p>
