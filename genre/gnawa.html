<h1>Gnawa（グナワ）とは</h1>
<p>グナワは、儀礼（宗教的な儀式）のための音楽である。担い手は、サハラ以南のアフリカから連れて来られた人々の子孫で、モロッコに暮らしている。その人々によって受け継がれてきた。 編成は、中心となる三つの要素から成る。地方では大太鼓とカル</p>
<p>グナワは、儀礼（宗教的な儀式）のための音楽である。担い手は、サハラ以南のアフリカから連れて来られた人々の子孫で、モロッコに暮らしている。その人々によって受け継がれてきた。

編成は、中心となる三つの要素から成る。地方では大太鼓とカルカベの編成もある。大太鼓は公開演奏や儀礼の導入部でも使われる。

中心は、師と呼ばれる指導者が弾くゲンブリだ。3弦の低音撥弦楽器（弦をはじく楽器）で、細長い木の胴に駱駝(または山羊)の皮を張ってある。弦を弾くと同時に胴を叩くため、低音と打楽器の両方を一人で受け持つ。

次が、カルカベと呼ばれる大型の鉄製の打楽器だ。両手に2枚ずつ持って打ち合わせ、金属的で鋭い連打を絶え間なく鳴らす。この音は鎖の音をまねたものとされ、奴隷であった祖先の記憶と結びつけられている。

音階は5音音階（五つの音だけでできた音階）が基本で、旋律は単純だ。各セクションの踊りの部分でテンポが上がり、カルカベの音量も増す。そうして、聴き手と踊り手をふだんとは違う意識状態（トランス状態）へ導く。

三つ目の要素は歌だ。師が一人で歌い、ほかの演奏者が短い応答を返す。この掛け合いが、延々と繰り返される。

演奏は一晩を通して行われる。導入部のあと、七つの霊の組に分かれた曲目が順に演奏される。それぞれの組は特定の色と霊的な存在に対応している。香や衣装の色も、これに合わせて変えられる。儀礼は病や不運の治癒を目的とし、参加者がトランスに入る。</p>
<h2>成り立ち</h2><p>担い手は、奴隷にされた西アフリカ出身者の子孫だ。その始まりは、16世紀ごろまでさかのぼる。西アフリカの慣習に、アラブ・イスラームやベルベルの要素が融合して生まれた。

数世紀にわたり、セネガルからチャド、マリからナイジェリアにかけての西アフリカで、ハウサ、フルベ、バンバラなど多くの人々が捕らえられたと考えられている。彼らは隊商路（ラクダの隊列で荷を運ぶ道）を通って、モロッコへ連れて来られた。故郷の言葉も家族も奪われたが、宗教的な儀礼と音楽は手放さなかった。それをイスラームの聖者信仰（聖人を敬う信仰）と結びつけ、新しい共同体のきずなを作り上げた。今の歌詞にも、消えかけた西アフリカの言葉の断片が残っている。意味が分からないまま、音として受け継がれている語句も多いと考えられている。

この音楽の本来の目的は、娯楽ではなく治療だとされる。病や不運は、特定の霊に取り憑かれた結果だと考えられた。その霊を鎮めるため、対応する曲を演奏し、当人を憑依（霊が乗り移った）状態へ導く。そうした儀礼が行われてきた。一方で、この共同体はモロッコ社会の中で、長く端に置かれた立場にあった。その儀礼が、正統とされる信仰から外れたものと見なされることもあった。

状況が変わったのは20世紀後半だ。アメリカのジャズ演奏者Randy Westonは、1960年代後半からタンジェに住んだ。1968年ごろにグナワと出会い、強く心を寄せた。1969年には、初めてリラに参加している。Westonがグナワ奏者と録音した代表作は、1992年（『The Splendid Master Gnawa Musicians of Morocco』）である。Pharoah Sandersは、1994年にMahmoud Guiniaと『The Trance of Seven Colors』を録音した。

それより前の1959年には、Paul Bowlesがグナワを含むモロッコ音楽を録音した。1972年に、LPの一部が発売された。Jimi Hendrixも1969年7月にモロッコを訪れ、エッサウィラも訪ねた。ただし、グナワとの交流の実態は確認されておらず、逸話が後に膨らんだ。

1998年、大西洋岸の町エッサウィラで音楽祭が始まった。グナワがほかのジャンルの音楽家と共演する舞台公演が、行われるようになった。これは夜通しの儀礼そのものとは区別される。2019年には、国際連合の機関によって無形文化遺産に登録されている。

しかし、この国際化は緊張も生んだ。商業化や脱文脈化をめぐって、伝統主義者などから懸念が示されている。その一方で、正当化する見方もある。師の職業化や儀礼の舞台化が議論されている。伝統の継承と商業化のバランスは、今も課題であり続けている。</p>
