<h1>Frenchcore（フレンチコア）とは</h1>
<p>ハードコア・テクノの他の様式より速い部類で、低音の圧に特化した様式。テンポは毎分180から220拍程度。最大の特徴は歪ませたキックドラムで、原音を極端に増幅して歪ませ、その減衰部分（音が消えていく部分）に音程を持たせることで、キッ</p>
<p>ハードコア・テクノの他の様式より速い部類で、低音の圧に特化した様式。テンポは毎分180から220拍程度。最大の特徴は歪ませたキックドラムで、原音を極端に増幅して歪ませ、その減衰部分（音が消えていく部分）に音程を持たせることで、キック自体が旋律とベースを兼ねる(キックの音程化は2010年代半ば以降に顕著になった)。このキックが休みなく四つ打ち（全部の拍にバスドラムを打つリズム）で連打され、下降するピッチ（音の高さ）の動きが独特のうねりを生む。上物（メロディーなど上に重ねる音）は最小限で、金属的なシンセの短い刺し、加工した声のサンプル（録音から切り出した素材）、そして映画や演説からの断片が置かれる。古典期は和音がほとんど使われず単音の反復が中心だが、旋律を伴う曲も典型の一つである。曲の構成は明確で、キックだけで走る部分、すべてが抜けて上物と声だけになる導入部、そして再びキックが戻る瞬間の落差が最大の聴かせどころになる。同じ高速のハードコアでも、ガバが荒々しく硬いキックで押すのに対し、こちらはより丸く低く、うねるキックを持ち、のちの旋律的なスタイルでは上物にトランス的な旋律や陽気な要素を混ぜることも多い。演奏の場はフリーパーティーやテクニバル（野外の大規模なフリーパーティー）、野外の大規模な催しで、数千から数万の観客が一斉に飛び跳ねる状況を前提に設計されている。</p>
<h2>成り立ち</h2><p>起点は1990年代半ばのフランスである。当時のヨーロッパでは、オランダのロッテルダム発のガバが席巻していたが、フランスでは独自の状況があった。フランスのテクニバル（大規模なフリーパーティー）のシーンは、1993年にイギリスのサウンドシステム（巨大なスピーカーを積んだ移動式の音響設備）Spiral Tribeが渡仏したことをきっかけに拡大した。Spiral Tribeは1992年のCastlemorton事件の後に機材を押収されるなどして1993年にイギリスを離れており、Criminal Justice and Public Order Act（刑事司法・公共秩序法）の成立はその翌1994年である。1990年代の最初の10年間、フリーパーティーに法的な規制はなかった。フランスのレイヴ（夜通し踊るダンスパーティー）とフリーテクノの場から、1990年代半ばに生まれたのがフレンチコアで、Micropoint、Radium、Laurent Hôといった作り手と、レーベルEpiteth、Audiogenicが中心となった。とりわけMicropointは、Al CoreとRadiumの2人組で、1992〜93年(資料により異なる)に結成され、1995年に初のレコードを出し、1999年のアルバム『Neurophonie』がフレンチコアの基礎とされる。この音楽は当初、フリーパーティーやテクニバルが主な場だったが、クラブや大型のレイヴにも早くから出ていた。フランス政府は2001年の日常安全法（ヴァイヤン法）で、フリーパーティーを初めて法的に規定して規制し、警察による摘発と機材の押収が繰り返された。しかし規制はかえって結束を強め、この音楽は反体制の象徴として位置づけられた。2000年代後半にThe Speed FreakやHunterwolf、Romsらが旋律的でサイケデリックな方向を試し、2010年代にはオランダのDr. Peacock（2010年に制作を開始）、続いてSefa（2018年にデビューアルバム）らがより旋律的で聴きやすい方向へ広げたことで、この様式は大規模な商業的な催しの主要な演目になった。2010年代にはオランダのDominatorの大規模な催しや、Thunderdome（2012年にフレンチコア専用エリア）、Defqon.1（2014年にステージ新設）などで大きく扱われるまでに成長した。</p>
