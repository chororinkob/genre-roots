<h1>Frenchcore（フレンチコア）とは</h1>
<p>ハードコア・テクノの中でも特に速く、低音の圧に特化した様式。テンポは毎分180から220拍程度で、拍が個別に聞き取れなくなる領域に入る。最大の特徴は歪ませたキックドラムで、原音を極端に増幅して歪ませ、その減衰部分に音程を持たせるこ</p>
<p>ハードコア・テクノの中でも特に速く、低音の圧に特化した様式。テンポは毎分180から220拍程度で、拍が個別に聞き取れなくなる領域に入る。最大の特徴は歪ませたキックドラムで、原音を極端に増幅して歪ませ、その減衰部分に音程を持たせることで、キック自体が旋律とベースを兼ねる。このキックが休みなく四つ打ちで連打され、下降するピッチの動きが独特のうねりを生む。上物は最小限で、金属的なシンセの短い刺し、加工した声のサンプル、そして映画や演説からの断片が置かれる。和音はほとんど使われず、単音の反復が中心である。曲の構成は明確で、キックだけで走る部分、すべてが抜けて上物と声だけになる導入部、そして再びキックが戻る瞬間の落差が最大の聴かせどころになる。同じ高速のハードコアでも、ガバが荒々しく硬いキックで押すのに対し、こちらはより丸く低く、うねるキックを持ち、また上物にトランス的な旋律や陽気な要素を混ぜることも多い。演奏の場は屋内の大型倉庫や野外の大規模な催しで、数千から数万の観客が一斉に飛び跳ねる状況を前提に設計されている。</p>
<h2>成り立ち</h2><p>起点は1990年代半ばのフランスである。当時のヨーロッパでは、オランダのロッテルダム発のガバが席巻していたが、フランスでは独自の状況があった。1990年代初頭からパリ周辺で、無政府主義的な集団が廃工場や野外で無許可の催しを開くフリーパーティーの文化が根づいており、Spiral TribeというイギリスのサウンドシステムがCriminal Justice Actによる規制を逃れてフランスに渡ってきたことが決定的だった。彼らが持ち込んだ音と態度が、フランスの若者に受け継がれる。ここから生まれたのがフレンチコアで、Micropoint、Radium、Laurent Hôといった作り手と、レーベルEpiteph、Audiogenic、Peace Offが中心となった。とりわけMicropointは、Al CoreとRadiumの二人組で、1997年頃から高速で歪んだキックの様式を確立した。この音楽は当初、正規のクラブではほとんどかけられず、森や採石場での違法な催しで鳴らされていた。フランス政府は1990年代末から2000年代初頭にかけて、大規模な野外の催しを規制する法律を導入し、警察による摘発と機材の押収が繰り返された。しかし規制はかえって結束を強め、この音楽は反体制の象徴として位置づけられた。2000年代後半以降、オランダのDr. PeacockやSefaが登場し、より旋律的で聴きやすい方向へ広げたことで、この様式は大規模な商業的な催しの主要な演目になった。2010年代にはオランダのDominatorやフランスのHellfest周辺の催しで数万人規模の聴衆を集めるまでに成長したが、初期からの当事者の一部は、この商業化を裏切りだと批判している。</p>
<h2>代表曲</h2><ul><li>Trip to Ireland (Dr. Peacock)</li><li>One Tribe (Sefa)</li><li>The Frenchcore Family (Dr. Peacock &amp; Sefa)</li></ul>
