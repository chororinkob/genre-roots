<h1>Frenchcore（フレンチコア）とは</h1>
<p>フレンチコアは、ハードコア・テクノの中でも速い部類に入る、低音の圧に特化したスタイルだ。 最大の特徴は、高速のテンポと、裏拍に置かれた歪んだベースラインである。テンポはおおむね180〜220 BPM以上で、資料によっては240まで</p>
<p>フレンチコアは、ハードコア・テクノの中でも速い部類に入る、低音の圧に特化したスタイルだ。

最大の特徴は、高速のテンポと、裏拍に置かれた歪んだベースラインである。テンポはおおむね180〜220 BPM以上で、資料によっては240までとされる。2010年代半ば以降は、ピッチ（音の高さ）を持つキックとベースにより和声的になった。古典期は和音がほとんど使われず、単音の反復が中心だ。ただし、旋律を伴う曲も典型の一つである。

キックは休みなく四つ打ち（全部の拍にバスドラムを打つリズム）で連打される。下降するピッチの動きが、独特のうねりを生む。同じ高速のハードコアでも、ガバが荒々しく硬いキックで押すのに対し、フレンチコアはうねる裏拍ベースを持つ。

上物（メロディーなど上に重ねる音）は最小限だ。初期は、インダストリアルなループ、パーカッション、ボーカルチョップ、リズムエフェクトが中心となる。のちの旋律的なスタイルでは、上物にトランス的な旋律や陽気な要素を混ぜることも多い。

曲の構成は明確だ。キックだけで走る部分があり、すべてが抜けて上物と声だけになる導入部がある。そして再びキックが戻る。この瞬間の落差が、聴かせどころになることが多い。

演奏の場は、フリーパーティー、テクニバル（野外の大規模なフリーパーティー）、クラブ、のちには大型フェスである。</p>
<h2>成り立ち</h2><p>舞台はフランスだ。1990年代半ばに前身が現れ、1990年代末にスタイルが定着した（資料により異なる）。

当時のヨーロッパでは、ロッテルダムを中心にオランダで発展したガバが人気を集めていた。しかしフランスには、独自の状況があった。フランスのテクニバル（大規模なフリーパーティー）のシーンは、1993年にイギリスのサウンドシステム（巨大なスピーカーを積んだ移動式の音響設備）Spiral Tribeが渡仏したことをきっかけに拡大した。Spiral Tribeは1993年ごろまでに欧州大陸へ渡り、同年夏にBeauvais近郊で最初のテクニバルを開いている。Criminal Justice and Public Order Act（刑事司法・公共秩序法）の成立は、その翌1994年である。フランスのフリーパーティーは、1993年のテクニバル開始から約10年間、特別法による規制がなかった（1995年の内務省通達などはあった）。

そうした場から生まれたのがフレンチコアだ。フランスのレイヴ（夜通し踊るダンスパーティー）とフリーテクノの場から生まれ、Micropoint、Radium、Laurent Hôといった作り手と、レーベルのEpiteth、Audiogenicが中心となった。とりわけMicropointは、Al CoreとRadiumの2人組で、1992〜93年(資料により異なる)に結成された。1994〜95年ごろに最初の12インチを出し（資料により異なる）、1998年末〜1999年に発表したアルバム『Neurophonie』は、Micropointを広く知らしめ、フレンチコアの普及に寄与した。

この音楽は当初、フリーパーティーやテクニバルが主な場だった。ただ、クラブや大型のレイヴにも早くから出ていた。2001年11月の日常安全法（Mariani修正を含む）は、初めて「音楽的な祝祭集会」を法で規定した。施行細則は2002年の政令で定められ、警察による摘発と機材の押収があったとされる。規制の対象となったフリーパーティー運動は反体制的な姿勢を持ち、フレンチコアはその場で演奏された。

2000年代後半、The Speed FreakやHunterwolf、Romsらが、旋律的でサイケデリックな方向を試した。2010年代には、オランダのDr. Peacock（2010年に制作を開始）、続いてSefa（2018年にデビューアルバム）らが、より旋律的で聴きやすい方向へ広げた。こうして、このスタイルは大規模な商業的な催しの主要な演目になった。2010年代には、オランダのDominatorの大規模な催しや、Thunderdome（2012年にフレンチコア専用エリアがあったとされる）、Defqon.1（2014年にステージが加わったとされる）などで大きく扱われるまでに成長した。</p>
