<h1>Fujiとは</h1>
<p>ナイジェリアのヨルバ人ムスリムの間で発達した、打楽器と歌が中心の音楽だ。 初期は弦楽器をほとんど入れなかった。ジュジュ（ナイジェリアの別の大衆音楽）がギターを軸にするのに対し、こちらは太鼓と振り楽器を中心に音の全体を作る。ただし、</p>
<p>ナイジェリアのヨルバ人ムスリムの間で発達した、打楽器と歌が中心の音楽だ。

初期は弦楽器をほとんど入れなかった。ジュジュ（ナイジェリアの別の大衆音楽）がギターを軸にするのに対し、こちらは太鼓と振り楽器を中心に音の全体を作る。ただし、ギター、キーボード、ベースギターなども使われる。

中心になる楽器は、砂時計形の胴を持ち、音の高さを自在に変えられるトーキングドラム、浅い枠に皮を張った太鼓、瓢箪に網を掛けた振り楽器、そして金属の打楽器だ。これらが幾重にも重なり、複数の周期が同時に進む、密度の高い音の織物を作る。後年には電子鍵盤や吹奏楽器が加わることもあるが、骨組みはあくまで打楽器である。

テンポは速めのものが多い。

歌がもう一つの柱だ。独唱者が長い旋律を朗々と歌い、合唱が短い応答を返す。旋律には、イスラームの詠唱から来た装飾的な節回しが色濃い。

歌詞では、依頼主や有力者への讃辞、社会の出来事への論評、道徳的な教訓が歌われる。

曲はとても長い。録音で1曲15分前後、ライブでは30分を超えることもある。</p>
<h2>成り立ち</h2><p>始まりは、宗教の習わしにあった。イスラームの断食月には、信徒は夜明け前に食事を取らなければならない。その時刻に、人々を起こして回る役目の若者たちがいた。彼らは太鼓を叩き、歌いながら街を巡った。

この目覚ましの音楽が、断食月以外にも演奏されるようになり、やがて独立した娯楽の音楽へ育っていった。この転換を導いた創始者として広く認められているのが、Sikiru Ayinde Barristerである(起源をめぐってはKollingtonとの論争もあった)。Barrister自身の説明では、この音楽の名は、空港で見た日本の富士山の広告から取ったものだ。本人は別の機会に、愛と平和を表す山だから選んだとも述べている。名の由来には諸説ある。

彼は1970年代半ば以降、音楽の仕事に専念して大編成を整え、この音楽のスタイルが固まった。楽器を増やしていったのは、1980年代後半以降のことだ。

同じころ、Kollington Ayinlaが最大のライバルとして現れた。2人は互いの名を出さずに相手を攻撃するアルバムを出し合い、その応酬そのものが聴き手の楽しみになった。1982年には公然と対立したが、1983年には関係が和らぎ、2人が並んで葬儀に参列している。その後、80年代後半以降にも応酬があったとする見方もある。

1980年代から1990年代には、Wasiu Ayinde Marshalが「Talazo Fuji」と呼ばれる形で若い層に広めた(鍵盤などの導入者とする説もあるが、Barristerも後年に鍵盤を取り入れており、導入者が誰かは見方により異なる)。Adewale Ayubaは、より軽快で踊りやすい「Bonsue Fuji」を打ち出した。

この音楽は、社会の中で独特の役目を持つ。演奏の場は、結婚式や命名式、葬儀といった人生の節目の儀式だ。そこで歌手は、参加者の名を呼び上げて讃える。讃えられた人が歌手に紙幣を浴びせる／与える『spraying』の慣習がある。つまりこの音楽は、共同体の中での地位と富を目に見える形にする仕組みでもある。

2010年にSikiru Ayinde Barristerが亡くなった後も、Pasumaら現代の代表的な演者が受け継いでいる。</p>
