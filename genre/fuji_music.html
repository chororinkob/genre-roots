<h1>Fujiとは</h1>
<p>ナイジェリアのヨルバ人ムスリムの間で発達した、打楽器と声だけで構成される音楽である。最大の特徴は、弦楽器を一切用いない点にある。ジュジュがギターを軸とするのに対し、こちらは徹底して太鼓と振り楽器のみで音の全体を作る。中心となるのは</p>
<p>ナイジェリアのヨルバ人ムスリムの間で発達した、打楽器と声だけで構成される音楽である。最大の特徴は、弦楽器を一切用いない点にある。ジュジュがギターを軸とするのに対し、こちらは徹底して太鼓と振り楽器のみで音の全体を作る。中心となるのは、砂時計形の胴を持ち音の高さを自在に変えられるトーキングドラム、浅い枠に皮を張った太鼓、瓢箪に網を掛けた振り楽器、そして金属の打楽器である。これらが幾重にも重なり、複数の周期が同時に進行する密度の高い織物を作る。後年には電子鍵盤や吹奏楽器が加えられることもあるが、骨格はあくまで打楽器である。テンポは中庸から速く、絶えず変化する。歌唱がもう一つの核で、独唱者が長い旋律を朗々と歌い、合唱が短い応答を返す構造を取る。旋律にはイスラームの詠唱に由来する装飾的な節回しが色濃く、アラビア語の語句が挟まれることも多い。歌詞は依頼主や有力者への讃辞、社会の出来事への論評、道徳的な教訓、そして自らの偉大さの誇示が中心である。曲は極めて長く、一つの演奏が30分以上続くこともある。</p>
<h2>成り立ち</h2><p>この音楽の起源は宗教的な実践にある。イスラームの断食月において、信徒は夜明け前に食事を取る必要があり、その時刻に人々を起こして回る役割を担う若者たちがいた。彼らは太鼓を叩き、歌いながら街を巡ったのである。この目覚ましのための音楽が、断食月以外にも演奏されるようになり、次第に独立した娯楽の音楽へ発展した。この転換を主導したのがSikiru Ayinde Barristerである。彼はこの音楽に固有の名を与える必要を感じていたが、その命名の逸話が広く知られている。空港で日本の富士山を描いた観光の広告を目にし、その響きを気に入って音楽の名としたというのである。つまりこの西アフリカの音楽の名は、日本の山に由来する。彼は1970年代を通じて編成を拡大し、この音楽の様式を確立した。同時期、Kollington Ayinlaが最大の競争相手として現れ、両者の対立は数十年にわたって続く。二人は互いを名指しで批判する楽曲を発表し合い、その応酬自体が聴衆の楽しみとなった。1980年代から1990年代には、Wasiu Ayinde Marshalが電子的な音を導入して若い層を取り込み、Adewale Ayubaがより洗練された形を示した。この音楽の社会的な機能は独特である。演奏は結婚式や命名式、葬儀といった通過儀礼の場で行われ、その場で歌手は参加者の名を呼び上げて讃える。讃えられた者は舞台へ進み出て紙幣を歌手の額に貼り付けるという慣習があり、これが演者の主要な収入となる。つまりこの音楽は、共同体における地位と富の可視化の装置でもある。2010年にSikiru Ayinde Barristerが死去した後も、Pasumaら若い世代が受け継ぎ、現在ではナイジェリアで最も動員力のある音楽のひとつであり続けている。</p>
