<h1>Chindonとは</h1>
<p>街を歩きながら店や商品の宣伝をするための日本の路上音楽だ。代表曲10曲を動画で聴け、ルーツと影響のつながりを地図でたどれる。</p>
<p>街を歩きながら店や商品の宣伝をするための日本の路上音楽だ。楽隊そのものが広告であり、音を出して人を立ち止まらせることが目的になる。

中心になるのは、親方が腹の前に下げるチンドン太鼓だ。摺鉦と締太鼓と大胴を1つの枠に組み合わせた楽器で、右手の撥で太鼓を叩き、左手で鉦を鳴らす。低音を支えるのがゴロスと呼ばれる大太鼓で、フランス語の grosse caisse がなまった名だ。旋律は楽士が受け持つ。クラリネットとサックスが中心で、アコーディオン、トランペット、コルネットが加わる。以前は三味線も使われたが、音量の大きいゴロスが広まると、かき消される三味線は管楽器に取って代わられた。

和音を積み上げる音楽ではない。クラリネットとサックスが同じ旋律をユニゾンでなぞり、ときにオクターブで重ねる。楽士はメロディを崩して吹くのが常で、ポルタメントや細かいトリル、装飾的なフィンガリングを挟み込む。譜面どおりに音を並べるより、節をうねらせて耳を引くことが優先される。

拍子は2拍子の行進リズムだ。歩きながら演奏するため、テンポは人の歩幅に合わせた100〜120 BPM あたりで、右足と左足に合わせて太鼓が「ドン、ドン」と落ちる。チンドン太鼓は「チンチン・ドンドン・チンドンドン」という3つの音型を繰り返し、この語呂がそのまま楽器と商売の名前になった。アクセントは各拍の頭に置かれ、裏拍は軽く流す。

歌はほとんど歌わない。代わりに親方が口上を述べる。甲高い節回しで店名や商品名を読み上げ、値段や日付を畳みかける。マイクは使わず、地声を張って通りの端まで届かせる。

詞といえるものは、この口上と、歌詞のある歌謡曲を吹くときの既存の詞だけだ。主題は開店、催し、安売り、新商品など、その日の依頼内容そのものになる。

曲は1〜2分の短い単位が切れ目なく続くメドレーだ。下座音楽の「竹に雀」「四丁目」「千鳥」、行進曲の「美しき天然」「軍艦マーチ」を軸に、その時々の流行歌を混ぜる。太鼓の合図で曲が切り替わり、角に差しかかると口上に移り、また囃子へ戻る。遠くから聞いても構成がつかめる、立ち上がりの強いフレーズの集まりでできている。

同じ「竹に雀」を寄席の黒御簾で奏でれば下座音楽、街に出て歩きながら鳴らせばチンドンになる。違いは編成と目的だ。下座が舞台の空気を整えるのに対し、チンドンは通行人をその場に引き留める。鳴っている場所は商店街、パチンコ店の開店前、町おこしのイベント、結婚式、介護施設の慰問など。スピーカーを積んだ宣伝車とも違い、生の音が移動しながら届く点が持ち味になる。</p>
<h2>成り立ち</h2><p>江戸の町では、薬や菓子を売る行商人が声を張って人を集めていた。その声そのものを商売の道具にしたのが、大坂・千日前の法善寺を拠点にした飴売りの飴勝だとされる。弘化期に活動した飴勝は、短い法被に大きな笠脚袢、わらじという出で立ちで、竹製の鳴物と拍子木を打ちながら「今日は松屋町の何々亭」と呼び込んだ。口上の見事さが評判を呼び、寄席の宣伝を請け負うようになった。

飴勝の仕事を引き継いだのが勇亀（いさみかめ）だ。勇亀は明治10年代に、芝居の口上である「東西、東西」をそのまま寄席の宣伝に流用した。この掛け声が定着し、1880〜81年頃には東西屋という呼び名が生まれる。やがて東西屋は、特定の店の名ではなく街頭宣伝業そのものを指す一般名詞に変わっていった。

同じ頃、丹波屋九里丸が1887年頃から豆や栗を売り始める。売り声が評判を呼び、九里丸は東西屋に転じた。開業前から囃子方を連れており、自分が拍子木、相棒が太鼓を叩いて街を歩く形をつくった。声だけだった宣伝に、楽器の音が組み込まれたわけだ。

東京では1888年、大阪出身の秋田柳吉が八重洲で広目屋という会社を興した。屋号は仮名垣魯文が名付けたという。広目屋は依頼に応じて楽隊を派遣し、その名は楽隊広告の代名詞になっていく。楽隊広告という仕事が広がるにつれ、街で鳴らす編成には、軍楽隊が広めていたクラリネットやコルネットといった管楽器も入っていった。

戦前、チンドン屋の数は1933年から38年頃にピークを迎える。1936年には、鳩山一郎とテキ屋出身の市議会議員倉持忠助が、選挙の票取りまとめに使おうと帝都音楽囃子広告業組合をつくった。会員数は3000人に及んだという。人を集める技能が政治の動員に組み込まれた形で、この世界の規模と危うさが同時に見える数字だ。

戦後、焼け跡からの復興のなかでチンドン屋は勢いを取り戻す。大きな広告を出せない時代に、少人数で小回りが利く営業形態が合っていた。陽気な音と派手な衣装が求められ、特に関東ではパチンコ店の開店宣伝が大きな仕事になった。1950年にはチンドン屋人口が2500人に及んだとされる。

1955年4月14日、富山で第1回の全国チンドンコンクールが開かれた。富山大空襲で壊滅した市街地が復興をほぼ終えた頃で、街に明るさと平和感を与えようと、富山商工会議所と富山市が仕掛けた催しだった。第1回の「ちんどん屋日本一」は東京の喜楽家喜楽。大会名は途中で全日本チンドン選手権大会に変わり、1981年の第27回から全日本チンドンコンクールに落ち着いた。

転機は1960年代半ばに来る。テレビの普及で、街頭の実演は「古くさい」ものと見られるようになった。昭和30年代からはスピーカーを使った宣伝が音響の面で肩を並べ、自動車の交通量が増えて商店街や横丁にも車が入るようになると、歩きながら演奏できる空間そのものが削られた。昭和40年頃から減り始め、1973年の石油ショック以後に急減して数百人規模まで落ち込む。仕事そのものは減っていなかったという証言も多く、減ったのは担い手のほうだった。

それでも、この音楽を別の場所へ運ぼうとする動きが出る。大阪では1984年、立命館大学出身の林幸治郎が個人商店としてちんどん通信社を旗揚げし、マスコミに「学士ちんどん屋」と取り上げられた。1995年には有限会社東西屋として法人化し、屋号はちんどん通信社のまま活動を続けている。東京では、じゃがたらなどで活動していた篠田昌已や、A-musikやルナパーク・アンサンブルで鳴らしていた大熊ワタルが、高田宣伝社で楽士としてチンドンを始めた。その演奏は『東京チンドンVol.1』として録音され、クラリネットの即興を聴かせる音楽としても届いた。

2001年の時点で、全国のチンドン屋は150人ほどとされる。商店の宣伝だけでなく、企業のキャンペーン、町おこしのイベント、結婚式、介護施設の慰問へと仕事の中身が広がった。若手は演奏そのものを売り物にする。富山のコンクールは2019年まで続き、2011年は東日本大震災で、2020年から2022年は新型コロナウイルスで中止となった。</p>
