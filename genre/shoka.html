<h1>Shōka（モンブショウショウカ）とは</h1>
<p>教室で全員が同じ旋律を声をそろえて歌うために作られた、日本語の学校唱歌だ。代表曲22曲を動画で聴け、ルーツと影響のつながりを地図でたどれる。</p>
<p>教室で全員が同じ旋律を声をそろえて歌うために作られた、日本語の学校唱歌だ。独唱のための歌ではなく、大勢で斉唱する前提で書かれている。この前提が、後発の童謡や歌謡曲とのいちばん大きな違いになる。

音の中心にあるのはピアノかリードオルガン1台だ。右手が旋律、左手が低音と和音を刻む素朴な伴奏で、前奏は4小節か8小節、歌が終われば同じ素材の後奏が付く。リードの音が教室の板張りに広がるオルガンの響きが、このジャンルの土台にある。

旋律は長調が基本で、ヨナ抜き音階の5音を中心に組み立てる。2小節単位のまとまりで進み、4度や6度の跳躍を要所に置き、同じ動機を繰り返して覚えやすくする。臨時記号は少なく、半音で陰る箇所はごく短い。

リズムは4分の4拍子が最も多く、8分の6拍子の揺れる曲も混ざる。テンポは60〜100 BPMが中心で、行進曲のように120 BPM近くまで速くなる曲もある。1拍目に重心が来て、小節の頭でそろって息を継ぐ。

歌い方は斉唱で、ビブラートを掛けずにまっすぐ伸ばす。語尾を2拍から4拍のばして次の小節へ渡すのが典型で、地声を張り上げる発声になりやすい。

歌詞は文語体で、七五調の語調を基本にする。春夏秋冬の景物、山や川や海、故郷の暮らし、家族や師への感謝が主題だ。最後に教訓や道徳を添える曲も多い。

曲の形は2部形式か有節形式で、同じ旋律に詞を何番も載せる。1番で風景、2番で心情、3番で教訓という並べ方が定番になる。

童謡が子供の言葉で書かれた自由な詩に曲を付けるのに対し、唱歌は学校で教える教材として詞も旋律も整えられている。大人の感情を洋楽のリズムで歌う歌謡曲とも違い、唱歌は行進曲か舞曲の範囲にとどまる。

鳴っている場所は教室と式典だ。朝礼、音楽の時間、卒業式、運動会の行進、地域の合唱祭。伴奏はピアノ1台、ときには無伴奏の斉唱で、マイクを通さない声がそのまま届く。</p>
<h2>成り立ち</h2><p>明治政府が学校制度を作ったとき、唱歌は最初から教科の一つとして名前だけは置かれていた。1872年の学制で小学校の科目に加えられたが、教える教員も教材もなく、「当分之を欠く」と註が付いたまま長く空欄だった。歌そのものより先に、歌を教える仕組みのほうが必要になった。

動き出したのは1870年代の終わりだ。1875年に文部省の命でアメリカへ渡った伊沢修二は、マサチューセッツ州のブリッジウォーター師範学校で学び、そこで音楽教育を教えていたルーサー・メーソンに師事した。1879年、伊沢の主唱で文部省に音楽取調掛が置かれると、メーソンは日本へ招かれ、唱歌の作り方と歌い方を直接教えた。

1881年11月24日、その成果が『小学唱歌集』初編として出る。第二編は1883年3月28日、第三編は1884年3月29日。全91曲を収めた日本初の五線譜による音楽教科書だった。ただし旋律の59曲はドイツとアメリカの学校教材集から採ったもので、日本人が新しく作った歌は少ない。スコットランド民謡に稲垣千頴が詞を付けた「蛍の光」、ドイツ民謡から来た「蝶々」、原作の分からない「仰げば尊し」がここに入っている。翻訳に近い状態から、このジャンルは始まった。

しかし、ここからが本当の出発点だ。外国曲の借用に限界を感じた人々は、日本語の詞に日本語の旋律を付ける道を探る。1888年に音楽取調掛が東京音楽学校へ育つと、卒業生が作曲と作詞の担い手になっていった。

1900年、大阪の出版社・昇文館を主宰していた市田元蔵が、大和田建樹に詞を、多梅稚と上真行に曲を頼んで『鉄道唱歌』第1集東海道篇を出した。印刷は3,000部、宣伝費もなく売れず、昇文館は倒産する。版権を買い取った楽器店主の三木佐助が、楽団を乗せた列車を走らせる広告を打つと大流行し、同年末までに第5集、全334番まで続いた。七五調の詞とヨナ抜き音階の節回しが、駅名と沿線の風景を覚える装置になった。

同じ1900年、小山作之助の『新撰国民唱歌 第二集』に佐佐木信綱作詞の「夏は来ぬ」が載る。1901年には瀧廉太郎が「荒城の月」と「箱根八里」を発表した。「荒城の月」の詞は、1898年に東京音楽学校が懸賞応募用のテキストとして土井晩翠に依頼したものだ。この時期、唱歌は学校の教材であると同時に、大人が歌う歌曲にもなっていく。

国が本格的に動いたのは1907年、小学校令の改正で唱歌がようやく必須科目になってからだ。1901年の小学校令施行規則は、その目的を「平易ナル歌曲ヲ唱フコトヲ得シメ兼テ美感ヲ養ヒ徳性ノ涵養ニ資スル」と定めている。歌で美意識を養い、徳を積ませる。教育の道具としての性格が、ここで制度的に固まった。

1910年の『尋常小学読本唱歌』全27曲を経て、1911年5月8日から1914年6月18日にかけて『尋常小学唱歌』全6冊・全120曲が出る。各学年20曲。作曲委員は島崎赤太郎を代表に、岡野貞一、上眞行、楠美恩三郎、南能衛、小山作之助の6人。国の作った歌であることを示すため、文部省は高い報酬を払って名前を出さない契約を結び、作者自身も口外しなかった。合議で作られたため個人の著作物として扱いにくく、自筆原稿もほとんど残っていない。1914年に第六学年用へ「故郷」と「朧月夜」が入る。

一方、1918年7月に鈴木三重吉が児童雑誌『赤い鳥』を創刊し、唱歌への反発が始まる。難解な詞と押し付けがましい教訓を退け、子供の言葉で書かれた歌を作ろうという童謡運動だ。北原白秋と山田耕筰、西條八十と成田為三、野口雨情と本居長世が詞と曲を組み、1919年には「かなりや」が楽譜付きで載った。唱歌が上から与える歌なら、童謡は子供の側から生まれる歌だった。この対立が、以後の日本語の歌の地図を二分する。

1941年、国民学校令で唱歌は芸能科音楽へと発展的に解消する。戦時下で詞は国策色を強め、戦後は教科そのものが消えた。それでも曲は生き残った。1967年、それまで不詳だった約70曲の原著作者が明らかになり、1973年には日本音楽著作権協会が「春の小川」を高野辰之作詞・岡野貞一作曲と認定する。教科書には出典として「文部省唱歌」と記されるようになり、学習指導要領の歌唱共通教材として歌い継がれている。</p>
