<h1>Rave（レイブ）とは</h1>
<p>夜通し踊り続けるために設計された、1980年代末から1990年代の電子ダンス音楽の総称。中心にあるのは四つ打ちのバスドラム（イギリスではヒップホップ由来のブレイクビーツと併用された）と、Roland TR-909の抜けの良いハイハ</p>
<p>夜通し踊り続けるために設計された、1980年代末から1990年代の電子ダンス音楽の総称。中心にあるのは四つ打ちのバスドラム（イギリスではヒップホップ由来のブレイクビーツと併用された）と、Roland TR-909の抜けの良いハイハット、そしてサンプリングした声や鍵盤の断片を短く切り取って高い音程で繰り返すフレーズである。テンポは初期は125BPM前後で、後年になるほど速くなり、150〜160BPMを超えた（ハードコア・テクノは160〜200BPM、ドラムンベースは160〜180BPM）。曲の構成は徹底して機能的で、低音を全部抜いて上物だけを積み上げていくブレイクダウン、緊張を高めるスネアの連打（ロール）、そして全部が一斉に戻るドロップという型が繰り返される。ピアノの明るいコード連打、女性の歌声の断片、サイレンや汽笛の音、TB-303を歪ませた「アシッド」の唸りが定番の素材になる。和声は単純で、1993年ごろからは多幸感を前面に出す路線（のちのハッピーハードコア）と、暗い路線（ダークコア）に分かれた。歌詞らしい歌詞はほとんどなく、あっても数語の掛け声にとどまる。倉庫や野原に組まれた巨大な音響装置、ストロボとレーザー、そしてMDMAの流通と不可分に結び付いた音楽であり、曲の設計は薬物の効き方の曲線に沿って作られている面がある。</p>
<h2>成り立ち</h2><p>1987年から1988年にかけてのイギリスで爆発的に広がった。前段としてスペインのイビサ島がある。1987年夏、ロンドンのDJであるPaul Oakenfold、Danny Rampling、Nicky Holloway、Johnny Walkerらがイビサ島のクラブAmnesiaを訪れ、DJのAlfredoがジャンルを問わず繋ぐ長時間のプレイと、MDMAが行き渡ったフロアの一体感を体験した。帰国後、Ramplingは1987年秋ごろ（月は資料により9月・11月・12月とばらつく）にロンドンでShoomを、Oakenfoldは1988年にSpectrumを始め（その前にHeavenの奥の部屋でFutureという夜を開いていた）、シカゴ・ハウスとアシッド・ハウスを軸にした夜が広まる。1988年の夏はイギリスで「セカンド・サマー・オブ・ラヴ」と呼ばれ、スマイリーマークとだぶだぶの服が若者文化の記号になった。同時に、酒類販売免許と閉店時間の規制を逃れるため、催しは市街のクラブから郊外の倉庫や畑へ移り、M25環状道路沿いの空き地で数千人から数万人が集まる無許可の集会が繰り返された。Sunrise、Energy、Biologyといった違法の主催団体が、電話の伝言ダイヤルで直前まで場所を伏せて客を集めた。この手法はM25周辺の無許可パーティー全般に共通するものだった。FantaziaやRaindanceは1989〜91年から免許付きの合法の大型レイブを主催した団体である。大衆紙は薬物と騒音を連日報じ、警察はヘリコプターを出して封鎖にあたった。1990年の娯楽法改正で罰金が引き上げられ、1994年には無許可の野外集会そのものを取り締まる刑事司法・公共秩序法が成立する。同法は、取り締まる集会の定義の中に「連続する反復的なビートを特徴とする音楽」を含めた。規制の対象は音楽の形式そのものではなく、夜間に野外で増幅音楽を流す集会で、警察に解散を命じる権限が与えられた。実際には、1994年の法より前の1990〜92年ごろに免許付きの商業的な大型レイブの網ができており、それと、より地下的なフリーパーティー（サウンドシステムを積んだ車で移動する集団）とは並行して存在していた。1994年の法は、後者への締め付けと前者への移行をいっそう強めた。音楽的にもこの時期に急速な分化が起き、イギリスでは、ブレイクビーツを速くしたハードコアが1992年末ごろからジャングルやハッピーハードコア、ダークコアなどに枝分かれし、のちにドラムンベースが生まれた。洗練されたプログレッシブ・ハウスもイギリスで生まれた。一方、ガバ（オランダ）とトランス（ドイツ）は別の系統として発展した。2010年代以降、アメリカでEDMの大型野外催しとして商業的に再構成され、当初の非合法性を失ったまま世界規模の産業となった。</p>
