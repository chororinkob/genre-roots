<h1>Rave（レイブ）とは</h1>
<p>夜通し踊り続けるために設計された、1980年代末から1990年代の電子ダンス音楽の総称。中心にあるのは四つ打ちのバスドラムと、Roland TR-909の抜けの良いハイハット、そしてサンプリングした声や鍵盤の断片を短く切り取って高</p>
<p>夜通し踊り続けるために設計された、1980年代末から1990年代の電子ダンス音楽の総称。中心にあるのは四つ打ちのバスドラムと、Roland TR-909の抜けの良いハイハット、そしてサンプリングした声や鍵盤の断片を短く切り取って高い音程で繰り返すフレーズである。テンポは120〜150BPM前後で、後年になるほど速くなった。曲の構成は徹底して機能的で、低音を全部抜いて上物だけを積み上げていくブレイクダウン、緊張を高めるスネアの連打（ロール）、そして全部が一斉に戻るドロップという型が繰り返される。ピアノの明るいコード連打、女性の歌声の断片、サイレンや汽笛の音、TB-303を歪ませた「アシッド」の唸りが定番の素材になる。和声は単純で長調が多く、多幸感を前面に出す。歌詞らしい歌詞はほとんどなく、あっても数語の掛け声にとどまる。倉庫や野原に組まれた巨大な音響装置、ストロボとレーザー、そしてMDMAの流通と不可分に結び付いた音楽であり、曲の設計は薬物の効き方の曲線に沿って作られている面がある。</p>
<h2>成り立ち</h2><p>1987年から1988年にかけてのイギリスで爆発的に広がった。前段としてスペインのイビサ島がある。1987年夏、ロンドンのDJであるPaul Oakenfold、Danny Rampling、Nicky Holloway、Johnny Walkerの4人がイビサ島のクラブAmnesiaを訪れ、DJのAlfredoがジャンルを問わず繋ぐ長時間のプレイと、MDMAが行き渡ったフロアの一体感を体験した。帰国後、Ramplingは1987年12月にロンドンでShoomを、OakenfoldはSpectrumを始め、シカゴ・ハウスとアシッド・ハウスを軸にした夜が広まる。1988年の夏はイギリスで「セカンド・サマー・オブ・ラヴ」と呼ばれ、スマイリーマークとだぶだぶの服が若者文化の記号になった。同時に、酒類販売免許と閉店時間の規制を逃れるため、催しは市街のクラブから郊外の倉庫や畑へ移り、M25環状道路沿いの空き地で数千人から数万人が集まる無許可の集会が繰り返された。Sunrise、Energy、Biology、Fantazia、Raindanceといった主催団体が電話の伝言ダイヤルで直前まで場所を伏せて客を集める方式を編み出す。大衆紙は薬物と騒音を連日報じ、警察はヘリコプターを出して封鎖にあたった。1990年の娯楽法改正で罰金が引き上げられ、1994年には無許可の野外集会そのものを取り締まる刑事司法・公共秩序法が成立する。同法が「連続する反復的なビートを特徴とする音楽」と定義した条文は、音楽の形式を名指しで規制した稀な例として語り継がれている。この圧力を受けて、シーンは免許を持つ大型クラブと、より地下的なフリーパーティー（サウンドシステムを積んだ車で移動する集団）とに分裂した。音楽的にもこの時期に急速な分化が起き、ブレイクビーツを速くしたハードコア、そこから派生したジャングルとドラムンベース、より速く硬いガバ、旋律を強調したトランス、洗練されたプログレッシブ・ハウスへと枝分かれしていく。2010年代以降、アメリカでEDMの大型野外催しとして商業的に再構成され、当初の非合法性を失ったまま世界規模の産業となった。</p>
