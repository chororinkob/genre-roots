<h1>Rave（レイブ）とは</h1>
<p>レイブは、夜通し踊り続けるために設計された、1980年代末から1990年代の電子ダンス音楽の総称である。 中心にあるのは、四つ打ちのバスドラムだ（イギリスではヒップホップ由来のブレイクビーツ＝切り刻んだドラムの音と併用された）。そ</p>
<p>レイブは、夜通し踊り続けるために設計された、1980年代末から1990年代の電子ダンス音楽の総称である。

中心にあるのは、四つ打ちのバスドラムだ（イギリスではヒップホップ由来のブレイクビーツ＝切り刻んだドラムの音と併用された）。そこに、Roland TR-909（ドラムマシン）の抜けの良いハイハットが重なる（ハウス／テクノ系ではTR-909の音が標準的）。さらに、サンプリングした声や鍵盤の断片を短く切り取り、高い音程で繰り返すフレーズが加わる。

ピアノの明るいコード連打、女性の歌声の断片、サイレンや汽笛の音、TB-303を歪ませた「アシッド」の唸りが、定番の素材になる。

和声（コードの響き）は単純だ。1992年末ごろからは、多幸感を前面に出す路線（のちのハッピーハードコア）と、暗い路線（ダークコア）に分かれた。

テンポはジャンルにより異なる。初期は125BPM（1分間の拍数）前後で、後年になるほど速くなり、150〜160BPMを超えた（ハードコア・テクノは160〜200BPM、ドラムンベースは160〜180BPM）。

歌や声ネタを使う曲が多い。特にハッピーハードコアでは、ボーカルが主役級である。

曲の構成は、一部のスタイルで機能的だ。低音を全部抜いて上物（メロディーなど上に重ねる音）だけを積み上げていくブレイクダウン（山場の前に静かになる部分）、緊張を高めるスネアの連打（ロール）、そして全部が一斉に戻るドロップ（山場で一気に爆発する部分）という型が繰り返される。

倉庫や野原に組まれた巨大な音響装置、ストロボとレーザー、そしてMDMAの流通と切り離せないほど結び付いた音楽である。Simon Reynoldsらは、曲の設計は薬物の効き方の曲線に沿って作られている面があると論じる。</p>
<h2>成り立ち</h2><p>イギリスで1987年末に始まり、1988〜89年(セカンド・サマー・オブ・ラヴ)に、レイブは爆発的に広がった。前段として、スペインのイビサ島がある。

1987年夏、ロンドンのDJであるPaul Oakenfold、Danny Rampling、Nicky Holloway、Johnny Walkerらが、イビサ島のクラブAmnesiaを訪れた。彼らは、DJのAlfredoがジャンルを問わず繋ぐ長時間のプレイを体験した。そして、MDMAが行き渡ったフロアの一体感も体験した。

帰国後、Ramplingは1987年秋ごろ（月は資料により9月・11月・12月とばらつく）に、ロンドンでShoomを始めた。Oakenfoldは1988年にSpectrumを始めた（その前にHeavenの奥の部屋でFutureという夜を開いていた）。こうして、シカゴ・ハウスとアシッド・ハウスを軸にした夜が広まる。

1988年の夏は、イギリスで「セカンド・サマー・オブ・ラヴ」と呼ばれた。スマイリーマークとだぶだぶの服が、若者文化のトレードマークになった。同時に、複数の要因(クラブの閉店時間、規模の拡大、暖かい季節、取り締まりの強化)が重なり、催しは市街のクラブから郊外の倉庫や畑へ移った。M25周辺を中心に、ロンドンから離れた場所にも広がり、空き地で数千人から数万人が集まる無許可の集会が繰り返された。

Sunrise、Energy、Biologyといった、無許可(unlicensed)のパーティーを主催した団体(法的な位置づけは争われた)は、電話の伝言ダイヤルで直前まで場所を伏せて客を集めた。主要な主催団体の多くが、電話回線で直前に場所を伝えた。FantaziaやRaindanceは、1989〜91年から、免許付きの合法の大型レイブを主催した団体である。

大衆紙は薬物と騒音を大きく報じた。警察はヘリコプターを出して、封鎖にあたった。1990年の娯楽法改正で、罰金が引き上げられた。1994年には、夜間に野外で増幅音楽を流し、地域住民に深刻な苦痛を与えるおそれのある集会(制定時は100人以上)を取り締まる、刑事司法・公共秩序法が成立する。同法は、取り締まる集会の定義の中に、「連続する反復的なビートを特徴とする音楽」を含めた。規制の対象は音楽の形式そのものではなく、夜間に野外で増幅音楽を流す集会だった。警視以上の警察官が、退去を指示できる権限が与えられた。

実際には、1994年の法より前の1990〜92年ごろに、免許付きの商業的な大型レイブの網ができていた。それと、より地下的なフリーパーティー（サウンドシステムを積んだ車で移動する集団）とは、並行して存在していた。1994年の法は、後者への締め付けを強め、前者への移行を促した可能性がある。

音楽的にも、この時期に急速な分化が起きた。イギリスでは、ブレイクビーツ（切り刻んだドラムの音）を速くしたハードコアが、1992年末ごろから、ジャングルやハッピーハードコア、ダークコアなどに枝分かれした。のちにドラムンベースが生まれた。洗練されたプログレッシブ・ハウスもイギリスで生まれた。一方、ガバ（オランダ）とトランス（ドイツ）は、英国のブレイクビーツ・ハードコア→ジャングル系とは別の地域的な発展をした。ただし、広い意味のレイブ／ハードコアの系譜とは重なる。

2010年代前後に米国の音楽産業がレイブ文化をEDMとして再ブランド化し、2012年以降に企業統合が進んだ。</p>
