<h1>Ragtime（ラグタイム）とは</h1>
<p>ラグタイムは、19世紀末から20世紀初頭にかけてアメリカで大流行したポピュラー音楽だ。ジャズが商業録音で広まる以前に、初期ジャズと並存しながら栄えた。 中心になる楽器はピアノだ。左手は行進曲のように、規則正しく淡々とベース音を刻み</p>
<p>ラグタイムは、19世紀末から20世紀初頭にかけてアメリカで大流行したポピュラー音楽だ。ジャズが商業録音で広まる以前に、初期ジャズと並存しながら栄えた。

中心になる楽器はピアノだ。左手は行進曲のように、規則正しく淡々とベース音を刻み続ける。その安定した土台の上で、右手だけがシンコペーションの効いた装飾的なメロディーを、自由に跳ねさせる。この左右の役割分担が特徴である。

リズムの面では、シンコペーションの技法が重要になる。本来なら拍の頭に来るはずのアクセントを、あえてその手前や合間の予想外の位置にずらして置く技法だ。これが生み出すリズムの「揺れ(ラグ)」が特徴である。ジャンル名は「ragged time」に由来するとする説が有力だが、ダンス行事「rags」起源説もあり、確定はしていない。テンポは中速で、優雅でありながら、どこか浮き立つような軽やかさを持つ。

当時の楽譜出版産業(ティン・パン・アレー)の盛り上がりとも、深く結びついている。楽譜・ピアノが主流だったが、録音もすでに始まっていた。音楽は「楽譜を買って自宅のピアノで弾く」ことで消費されており、家庭にピアノを置くことが中産階級の憧れであった。この時代背景が、楽譜中心の音楽文化を支えていた。</p>
<h2>成り立ち</h2><p>19世紀末のアメリカ中西部、ミシシッピ川流域で、黒人音楽家たちの手によってラグタイムは形作られた。

土台となったのは、奴隷制下のプランテーションで踊られたケークウォークという行進風の踊りだ。バンジョー奏法が持つ跳ねたリズムと、ヨーロッパ由来の行進曲やポルカの形式も、そこに加わった。南北戦争後、黒人の音楽家は、酒場や売春宿、旅回りの一座でピアノを弾く職を得るようになる。そこで、左手が規則正しく行進曲の伴奏を刻み、右手がその上をずらして歌うというやり方が育った。

1893年のシカゴ万国博覧会は、ラグタイムが全国へ伝わる契機になったとする説もあるが、実証されていない。1897年ごろに成熟したラグタイムが成立した（1895年に出版されたErnest Hogan「La Pas Ma La」は、しばしば最初のラグタイム作品と誤って言われるが、ラグタイムに分類するのは疑わしい）。William Krellの「Mississippi Rag」などの楽譜も出版された。

中心人物は、テキサス出身のScott Joplinである。ミズーリ州セダリアの社交クラブで演奏していた彼は、1899年に楽譜出版者John Starkを通じて「Maple Leaf Rag」を発表した。その楽譜は、初版400部が売り切れるのに1年かかったが、その後は安定して売れた。

Joplinは、ラグタイムを一過性の流行ではなく正統な芸術音楽として認めさせようとした。わずかな印税収入（年収は生活費を賄う程度。「推定」であり、契約条件(1部1セントの印税)）をもとに、オペラ『Treemonisha』(1910年に完成、1911年に自費出版)の完成に人生を賭けた。しかし、Rick Benjaminによる、1913年にニュージャージー州ベイヨンで有料公演を行ったとの主張（確認されていない）や、1915年のハーレムでのピアノ伴奏のみの通し演奏（失敗）にとどまった。本格的な上演を得られないまま、1917年に死去している（本格上演は1970年代）。

他にはJames Scott、そして白人作曲家のJoseph Lambが、三大作曲家として並び称された。James P. Johnsonらは、ハーレムでストライドへ発展させた。

一方、当時のラグタイムは、中産階級の白人層から、若者を堕落させる下品な音楽として攻撃されることがあった。また、出版産業の中で黒人作曲家が正当な取り分を得られない構造も、珍しくなかったとされる。

1917年ごろにラグタイムの人気は衰え、「ジャズ」の呼称が広まった。ただしジャズに置き換わったわけではなく、ノベルティ・ピアノなどに取って代わられ、1920年ごろにはJoplinらのラグはほぼ忘れられた。

しかし、1970年のJoshua Rifkinの録音が再評価の火付け役となった。1973年の映画『スティング』(Hamlisch編曲、『The Entertainer』を主題的に使用)が、世界的なブームへ拡大した。Scott Joplinには1976年、死後にピューリッツァー賞特別賞が贈られている。</p>
