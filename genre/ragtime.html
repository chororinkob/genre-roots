<h1>Ragtime（ラグタイム）とは</h1>
<p>本来なら拍の頭に来るはずのアクセントを、あえてその手前や合間の予想外の位置にずらして置く「シンコペーション」の技法が生み出す、リズムの「揺れ(ラグ)」がそのままジャンル名の由来になっている。演奏はピアノを中心とし、左手は行進曲のよ</p>
<p>本来なら拍の頭に来るはずのアクセントを、あえてその手前や合間の予想外の位置にずらして置く「シンコペーション」の技法が生み出す、リズムの「揺れ(ラグ)」がそのままジャンル名の由来になっている。演奏はピアノを中心とし、左手は行進曲のように規則正しく淡々とベース音を刻み続け、その安定した土台の上で、右手だけがシンコペーションの効いた装飾的なメロディーを自由に跳ねさせる、という左右の役割分担が特徴である。テンポは中速で、優雅でありながらどこか浮き立つような軽やかさを持つ。ジャズが登場する以前、19世紀末から20世紀初頭にかけてアメリカで大流行したポピュラー音楽で、当時の楽譜出版産業(ティン・パン・アレー)の隆盛とも深く結びついている。まだ録音技術が一般に普及していなかった時代、音楽は「楽譜を買って自宅のピアノで弾く」ことで消費されており、家庭にピアノを置くことが中産階級の憧れであった時代背景が、この楽譜中心の音楽文化を支えていた。</p>
<h2>成り立ち</h2><p>19世紀末のアメリカ中西部、ミシシッピ川流域の黒人音楽家たちの手で形成された。土台となったのは、奴隷制下のプランテーションで踊られたケークウォークという行進風の踊り、バンジョー奏法が持つ跳ねたリズム、そしてヨーロッパ由来の行進曲やポルカの形式である。南北戦争後、黒人の音楽家が酒場や売春宿、旅回りの一座でピアノを弾く職を得るようになり、そこで左手が規則正しく行進曲の伴奏を刻み、右手がその上をずらして歌うという様式が育った。1893年のシカゴ万国博覧会は各地のピアニストが集まって腕を競う場となり、この演奏法が全国へ伝わる契機になったと言われる。1897年にはWilliam Krellの「Mississippi Rag」など最初期の楽譜が出版された。中心人物はテキサス出身のScott Joplinである。ミズーリ州セダリアの社交クラブで演奏していた彼は、1899年に楽譜出版者John Starkを通じて「Maple Leaf Rag」を発表し、その楽譜は最終的に100万部以上を売り上げた。Joplinはラグタイムを一過性の流行ではなく正統な芸術音楽として認めさせようとし、印税収入をもとにオペラ『Treemonisha』(1911)の完成に人生を賭けたが、まともな上演の機会を得られないまま1917年に死去している。他にはJames Scott、そして白人作曲家のJoseph Lambが三大作曲家として並び称され、Eubie BlakeやJames P. Johnsonといった東海岸の奏者は、より即興的で技巧的なストライド・ピアノへとこの語法を発展させた。当時、ラグタイムは中産階級の白人層から若者を堕落させる下品な音楽として攻撃され、また出版産業の中で黒人作曲家が正当な取り分を得られない構造も一般的だった。1917年のOriginal Dixieland Jass Bandの録音を境に流行はジャズへ移り、ラグタイムは急速に古い音楽となる。しかし1970年代、映画『スティング』(1973)が「The Entertainer」を主題曲に使ったことで大規模な再ブームが起き、Joshua Rifkinによる録音とともに再評価が決定づけられた。Scott Joplinには1976年、死後にピューリッツァー賞特別賞が贈られている。</p>
<h2>代表曲</h2><ul><li>Maple Leaf Rag (Scott Joplin)</li><li>The Entertainer (Scott Joplin)</li><li>Pineapple Rag (Scott Joplin)</li><li>Charleston Rag (Eubie Blake)</li><li>Carolina Shout (James P. Johnson)</li></ul>
