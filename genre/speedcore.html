<h1>Speedcore（スピードコア）とは</h1>
<p>スピードコアは、テンポを極端に速くすること、それ自体を目的にした音楽だ。 速さは、おおむね300BPM以上(240BPM以上を含める用法もある)。1000BPM以上のもの(エクストラトーンと呼ばれる)もあり、さらには、テンポという</p>
<p>スピードコアは、テンポを極端に速くすること、それ自体を目的にした音楽だ。

速さは、おおむね300BPM以上(240BPM以上を含める用法もある)。1000BPM以上のもの(エクストラトーンと呼ばれる)もあり、さらには、テンポという考え方が実質的に崩れてしまう領域まである。この速さになると、キックの一打一打が、別々の打撃として聞こえなくなる。代わりに、音程を持った一続きの唸りとして聞こえ始める。この、聞こえ方が切り替わる境目そのものが、表現の中心になっている。

キックは極端に歪ませた音だ。ディストーションとクリッピングで波形が四角に近づく。低音というより中域の攻撃音として鳴る、という見方がある。ハードコアのキックが持つ音程感を残したまま高速で連射すると、旋律のようなものが生まれることもある。

上に重ねる音はほとんどない。あっても、ホラー映画や暴力的な場面から抜き出した叫び声、ノイズの塊、警報音といった素材だ。欧州系のスピードコアはメロディーが乏しいが、日本の流れにはメロディアスな作品が多い。

曲の組み立ても単純だ。展開と言えるのは、密度の変化と、時折はさまれる極端な減速や無音だけである。長さは2分から5分と短いことが多く、それはこの密度の音を長時間聴き続けることが体の面で難しいためでもある、という見方がある。

ライヴでは極めて大きな音量で演奏され、体に受ける打撃そのものが体験になる。極端さの追求がそれ自体の目的になっており、そこには冗談と真剣さが同居している。ガバやハードコアの延長線上にあるが、踊りやすさより速度と攻撃性を優先する傾向がある点で異なる。</p>
<h2>成り立ち</h2><p>スピードコアは、1990年代前半(1992〜93年頃)のベネルクスとドイツを中心に、ガバの高速化競争の中から生まれたとされる。ただしアメリカの要素も大きく、起源には諸説ある。スピードコアという呼び名が定着したのは2000年代で、それまでは多くがガバ(gabba)と呼ばれていた。

前提となる流れがある。1990年代前半、ロッテルダムとアムステルダムでガバが生まれた。初期のテンポは概ね140〜190BPM(136BPMとする文献もある)で、それが急速に上がっていった。この加速には、アムステルダムの洗練されたハウス文化に対する、ロッテルダムの労働者階級の若者による意図的な反抗という側面があり、速く、汚く、下品であることが誇りとされた、と語られることが多い。

1990年代前半のハードコアは160〜200BPM以上だった。速さを探った初期の例としては、アメリカのMobyが1992年に録音した「Thousand」(ピーク時に約1015BPM)が挙げられる。Disciples of Annihilationの曲名「N.Y.C. Speedcore」が、スピードコアという呼び名を広めたとされる。ただし、語そのものは1995年頃から使われていた。

一方、ドイツでは、ドレスデンのNoize Creator(Stefan Senf)が活動した。ブレイクコア/ハードコア系の制作者で、最初の録音は1994年末までに発表された。また、ハンブルクのレコード店Container Records傘下に、Fischkopf Hamburgというレーベルが1994年4月に設立された。このレーベルは、Taciturneらの実験的なハードコアを幅広く発表した。

アメリカでは、Delta 9とIndustrial Strength Records(Lenny Deeが1991年に設立)が、より工業的で暴力的な方向を推し進めた。速さの追求は、競技のような様子を帯びていった。DJ Skinheadの1994年「Extreme Terror」は、インダストリアル寄りのハードコアで、後にスピードコアの先駆けの一つとされる。それより早く、「Thousand」(1992年録音・1993年発売)が突出した先行例となっていた。

1998年頃には、Einrichが「エクストラトーン」という枝分かれした種類を定着させたとされる。1000BPM以上の作品や、テンポ表記が意味をなさない領域を扱うものだ。日本では、m1dyのような作家が1998〜2000年頃から活動し、独自のシーンを作った。

この音楽の市場規模は小さく、多くは小規模な流通である。作品は少部数のレコードやCD-R、後にはインターネット上の無料配布で出回った。制作者の大半は、ほかに本業を持っている、という見方がある。批評の場で真剣に論じられることはまれで、悪ふざけや騒音として扱われることが多かった、という見方がある。

一方で、極端さを追い求める点では、実験音楽やノイズと根っこが通じている。Power Electronicsやハーシュ・ノイズの作家と交流を持つ例もある、という見方がある。

ライヴ文化としては、ドイツ、日本、東欧などに、小規模ながら途切れない現場がある。Thunderdome(オランダの大型ハードコアイベント)の周辺や、より地下的な催しで演奏されている、という見方がある。2010年代以降は、インターネットを通じて国をまたいだ交流が容易になり、若い制作者が絶えず加わっている。近年はブレイクコアやデジタル・ハードコアとの境界があいまいになった。極端な速さは一つの表現手段として、ほかのジャンルにも取り込まれている。</p>
