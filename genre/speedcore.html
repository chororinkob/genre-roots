<h1>Speedcore（スピードコア）とは</h1>
<p>テンポを極端に速くすること自体を目的とした音楽。おおむね300BPM以上(240BPM超を含める用法もある)で、1000BPMを超えるもの(エクストラトーンと呼ばれる)、さらには実質的にテンポの概念が崩壊する領域まで存在する。この</p>
<p>テンポを極端に速くすること自体を目的とした音楽。おおむね300BPM以上(240BPM超を含める用法もある)で、1000BPMを超えるもの(エクストラトーンと呼ばれる)、さらには実質的にテンポの概念が崩壊する領域まで存在する。この速度では、個々のキックが独立した打撃として認識されなくなり、連続した音程を持つ唸りとして知覚され始める。この、聞こえ方が切り替わる境目そのものが、表現の中心になっている。キックは極端に歪ませたもので、ディストーションとクリッピングによって波形が矩形に近づき、低音というより中域の攻撃音として鳴る。ハードコアのキックが持つ音程感を保ったまま、それを高速で連射することで、疑似的な旋律が生まれることもある。上に重ねる音はほとんどなく、あってもホラー映画や暴力的な場面から抜き出した叫び声、ノイズの塊、警報音といった素材。欧州系のスピードコアはメロディーが乏しいが、日本の流れにはメロディアスな作品が多い。曲の組み立ても単純で、密度の変化と、時折挿入される極端な減速や無音が唯一の展開になる。長さは2分から5分と短いことが多い。これは物理的にこの密度の音を長時間聴き続けることが困難なためでもある。ライヴでは極めて大きな音量で演奏され、身体への打撃そのものが体験になる。極端さの追求が自己目的化しており、そこには冗談と真剣さが同居している。ガバやハードコアの延長線上にあるが、踊るための機能をほぼ完全に放棄している点で異なる。</p>
<h2>成り立ち</h2><p>1990年代前半(1992〜93年頃)のベネルクスとドイツを中心に、ガバの高速化競争の中から生まれたとされるが、アメリカの要素も大きく、起源には諸説ある。スピードコアという呼称が定着したのは2000年代で、それまでは多くがガバ(gabba)と呼ばれていた。前提として、1990年前後のロッテルダムで生まれたガバが、当初は150〜160BPM前後(出典により幅がある)だったものを急速に上げていったという流れがある。この加速には、アムステルダムの洗練されたハウス文化に対する、ロッテルダムの労働者階級の若者による意図的な反抗という側面があった。速く、汚く、下品であることが誇りとされた。1993年前後には200BPMを超える作品が現れ、そこから速度そのものを競う遊びが始まる。速度の高さを探った初期の例としては、アメリカのMobyが1992年に録音した「Thousand」(約1015BPM)が挙げられる。スピードコアという呼称は、Disciples of Annihilationの「N.Y.C. Speedcore」に由来するとされる。ドイツ・ドレスデンのNoize Creator(Stefan Senf)も作品を発表しているが、最初のレコードは1994年末頃までのことである。また、ハンブルクのレコード店Container Records傘下のFischkopf Hamburgというレーベルが1994年4月に設立され、Taciturneらのより実験的で速い作品を発表した。アメリカではDelta 9とIndustrial Strength Records(Lenny Deeが1991年に設立)が、より工業的で暴力的な方向を推進した。速度の追求は競技的な様相を帯びた。DJ Skinheadの1994年「Extreme Terror」といった作品も極端な速さを提示したが、速度の競争は1992〜93年の時点で既に1000BPM級の例があった。1000BPMを超える作品や、テンポ表記が無意味になる領域を扱う「エクストラトーン」という下位分類も生まれた。日本ではm1dyのような作家が1998〜2000年頃から活動し、独自のシーンを形成した。この音楽の受容は極めて限定的で、商業的にはほぼ成立していない。作品は少部数のレコードやCD-R、後にはインターネット上の無料配布で流通し、制作者の大半は他に本業を持っている。批評的にも真剣に論じられることは稀で、悪ふざけや騒音として扱われることが多かった。一方で、極端さの追求という点では実験音楽やノイズと通底しており、実際にPower Electronicsやハーシュ・ノイズの作家と交流を持つ例もある。ライヴ文化としては、オランダ、ドイツ、日本、フランス、アメリカに小規模ながら継続的な現場があり、Thunderdome(オランダの大型ハードコアイベント)の周辺や、より地下的な催しで演奏されている。2010年代以降はインターネットを通じた国際的な交流が容易になり、若い制作者が絶えず参入している。近年はブレイクコアやデジタル・ハードコアとの境界が曖昧になり、極端な速度が一つの表現手段として他ジャンルにも取り込まれている。</p>
<h2>代表曲</h2><ul><li>Headbanger Boogie (Radium &amp; Lenny Dee)</li><li>Tokyo Style Speedcore (M1dy)</li><li>Terrordrang (Noisekick)</li><li>New York City Speedcore (Disciples of Annihilation)</li><li>Hotel Hellfornia (m1dy)</li><li>Extreme Gangsta (Disciples of Annihilation)</li><li>Speedcore Brutality (Nekrosystem &amp; Komprex)</li><li>Ya Mutha (Disciples of Annihilation)</li><li>Extreme Speedcore Terror (Noisekick)</li><li>Total Annihilation (Disciples of Annihilation)</li><li>Chemical Warfare (Disciples of Annihilation)</li><li>Army of Speedcore (Noisekick)</li></ul>
