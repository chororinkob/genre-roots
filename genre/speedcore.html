<h1>Speedcore（スピードコア）とは</h1>
<p>テンポの極端な高速化そのものを目的とした音楽。300BPMから始まり、1000BPMを超えるもの、さらには実質的にテンポの概念が崩壊する領域まで存在する。この速度では、個々のキックが独立した打撃として認識されなくなり、連続した音程</p>
<p>テンポの極端な高速化そのものを目的とした音楽。300BPMから始まり、1000BPMを超えるもの、さらには実質的にテンポの概念が崩壊する領域まで存在する。この速度では、個々のキックが独立した打撃として認識されなくなり、連続した音程を持つ唸りとして知覚され始める。この知覚の転換点そのものが表現の核心になっている。キックは極端に歪ませたもので、ディストーションとクリッピングによって波形が矩形に近づき、低音というより中域の攻撃音として鳴る。ハードコアのキックが持つ音程感を保ったまま、それを高速で連射することで、疑似的な旋律が生まれることもある。上物はほとんどなく、あってもホラー映画や暴力的な場面から抜き出した叫び声、ノイズの塊、警報音といった素材。旋律や和声は原則として存在しない。曲の構成も単純で、密度の変化と、時折挿入される極端な減速や無音が唯一の展開になる。長さは2分から5分と短いことが多い。これは物理的にこの密度の音を長時間聴き続けることが困難なためでもある。ライヴでは極めて大きな音量で演奏され、身体への打撃そのものが体験になる。極端さの追求が自己目的化しており、そこには冗談と真剣さが同居している。ガバやハードコアの延長線上にあるが、踊るための機能をほぼ完全に放棄している点で異なる。</p>
<h2>成り立ち</h2><p>1990年代前半のオランダとドイツで、ガバの高速化競争の中から生まれた。前提として、1990年前後のロッテルダムで生まれたガバが、当初150BPM程度だったものを急速に上げていったという流れがある。この加速には、アムステルダムの洗練されたハウス文化に対する、ロッテルダムの労働者階級の若者による意図的な反抗という側面があった。速く、汚く、下品であることが誇りとされた。1993年前後には200BPMを超える作品が現れ、そこから速度そのものを競う遊戯が始まる。初期の重要な作家としてはオランダのDJ Weirdo、Rotterdam Terror Corps、そしてドイツのMoby Dick、Noize Creatorが挙がる。とりわけドイツのFrankfurtとBerlinを拠点とするFischkopf Hamburgというレーベルが1993年に設立され、Taciturneらのより実験的で速い作品を発表した。アメリカではDelta 9とIndustrial Strength Records(Lenny Deeが1991年に設立)が、より工業的で暴力的な方向を推進した。1990年代半ばには、速度の追求が競技的な様相を帯びる。DJ Skinheadの1994年「Extreme Terror」といった作品が当時としては極端な速さを提示し、以後は数字そのものが話題になった。1000BPMを超える作品や、テンポ表記が無意味になる領域を扱う「エクストラトーン」という下位分類も生まれた。日本ではm1dyやDJ Techno Rangerといった作家が2000年前後から活動し、独自のシーンを形成した。この音楽の受容は極めて限定的で、商業的にはほぼ成立していない。作品は少部数のレコードやCD-R、後にはインターネット上の無料配布で流通し、制作者の大半は他に本業を持っている。批評的にも真剣に論じられることは稀で、悪ふざけや騒音として扱われることが多かった。一方で、極端さの追求という点では実験音楽やノイズと通底しており、実際にPower Electronicsやハーシュ・ノイズの作家と交流を持つ例もある。ライヴ文化としては、オランダ、ドイツ、日本、フランス、アメリカに小規模ながら継続的な現場があり、Thunderdome(オランダの大型ハードコアイベント)の周辺や、より地下的な催しで演奏されている。2010年代以降はインターネットを通じた国際的な交流が容易になり、若い制作者が絶えず参入している。近年はブレイクコアやデジタル・ハードコアとの境界が曖昧になり、極端な速度が一つの表現手段として他ジャンルにも取り込まれている。</p>
<h2>代表曲</h2><ul><li>M1dy - Tokyo Style Speedcore</li><li>Disciples of Annihilation - New York City Speedcore</li><li>Noisekick - Terrordrang</li></ul>
