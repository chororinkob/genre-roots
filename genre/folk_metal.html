<h1>Folk Metal（フォークメタル）とは</h1>
<p>ヘヴィメタルの編成に、各地の伝統音楽の楽器と旋律をそのまま持ち込んだ音楽である。加えられる楽器はフィドル、ティン・ホイッスル、バグパイプ、アコーディオン、ハーディ・ガーディ、ブズーキ、フィンランドの撥弦楽器カンテレなど地域によって</p>
<p>ヘヴィメタルの編成に、各地の伝統音楽の楽器と旋律をそのまま持ち込んだ音楽である。加えられる楽器はフィドル、ティン・ホイッスル、バグパイプ、アコーディオン、ハーディ・ガーディ、ブズーキ、フィンランドの撥弦楽器カンテレなど地域によって異なり、この楽器の選択がそのままバンドの出身地を示す看板になっている。旋律は伝統舞曲から借りられることが多く、6/8拍子のジグや2/4拍子の速い舞曲の型が、歪んだギターの刻みの上でそのまま演奏される。音階は自然短音階のほか、第二音を半音下げたフリギア旋法や、東欧や中東に由来する増二度を含む音階が用いられ、この非西洋的な音程の跳躍が独特の異国感を生む。ギターは伝統楽器の旋律を三度や五度で重ねて厚みを出す役割を担い、ドラムは行進や祝祭の踊りを思わせる分かりやすい刻みを保つ。ヴォーカルは咆哮や絶叫を用いる場合と、合唱団のように大勢で歌い上げる場合があり、後者は酒場での斉唱を意識したものである。歌詞は自国の神話、歴史上の戦い、自然崇拝、酒と祝祭を扱い、しばしば母語で歌われる。演奏の場も特徴的で、屋外の大規模なフェスティバルにおいて、聴衆が肩を組んで踊るための音楽として機能している。</p>
<h2>成り立ち</h2><p>1990年、イングランドのニューカッスルでSkycladが結成されたことが直接の起点とされる。スラッシュメタルのバンドSabbatを離れたMartin Walkyierが、正規の構成員としてフィドル奏者を加え、1991年に発表した作品は、伝統音楽の旋律をメタルの構造に組み込んだ最初のアルバムとして広く認められている。歌詞は環境破壊や社会批判を扱っており、当初から単なる懐古趣味ではなかった。1990年代半ばにはアイルランドのCruachanがケルトの神話と楽器を持ち込み、この発想が各国へ波及する。最も大きな実りをもたらしたのは北欧、とりわけフィンランドだった。同国には結婚式や祭りで演奏される速い二拍子の舞曲があり、Finntrollはこれをブラックメタルと直結させ、トロールの神話を題材にした異形の音楽を作り上げた。Korpiklaaniは酒と森を主題に、Ensiferumは戦記的な壮大さを、Moonsorrowは長大な構成を持ち込み、それぞれ別の方向へ広げた。スイスのEluveitieは、古代のガリア人の言語で歌詞を書き、ハーディ・ガーディやバグパイプを含む大人数の編成を組んで、考古学的な考証を伴う作風を確立した。ロシアのArkonaは女性歌手Mashaを中心にスラヴの民間信仰を扱い、イスラエルのOrphaned Landは中東の楽器と音階を用いて、ユダヤ教、キリスト教、イスラーム教の共存を訴えるという政治的に困難な立場を選んだ。この分野には深刻な問題も伴う。自国の神話と土着信仰を称揚する姿勢は、容易に民族主義や排外主義と接続しうるためであり、実際に近接する領域では極右思想を公然と掲げる集団が存在し、フェスティバルからの出演取り消しや論争が繰り返されてきた。多くのバンドはこうした政治性を明確に否定しているが、聴き手の側にそうした含みを読み込む層が一定数存在することは、今も解決していない緊張として残っている。現在では大規模な野外フェスティバルの定番として定着し、民族衣装をまとった数万人が同時に踊るという独特の光景を生み出している。</p>
