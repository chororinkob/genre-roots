<h1>Folk Metal（フォークメタル）とは</h1>
<p>フォークメタルは、ヘヴィメタルの編成に、各地の伝統音楽の要素を取り入れた音楽だ。民謡の旋律や楽器を使うバンドは多いが、その方法はバンドごとに違う。 加わる楽器は、フィドル、ティン・ホイッスル、バグパイプ、アコーディオン、ハーディ・</p>
<p>フォークメタルは、ヘヴィメタルの編成に、各地の伝統音楽の要素を取り入れた音楽だ。民謡の旋律や楽器を使うバンドは多いが、その方法はバンドごとに違う。

加わる楽器は、フィドル、ティン・ホイッスル、バグパイプ、アコーディオン、ハーディ・ガーディ、ブズーキ、フィンランドの撥弦楽器カンテレなど、地域によって異なる。「出身地の楽器」が看板になるバンドもあれば、代用楽器や創作旋律で成り立つバンドもある。

メロディーは、伝統舞曲から借りられることが多い。6/8拍子のジグや、2/4拍子の速い舞曲の型が、歪んだギターの刻みの上でそのまま演奏される。ギターは、伝統楽器の旋律を3度や5度で重ねて厚みを出すバンドもある。

音階は、自然短音階のほか、第二音を半音下げたフリギア旋法が使われる。ハーモニック・マイナーなどに含まれる増2度も用いられる。増2度は、西洋音楽にも存在する音程である。民俗音楽的・エキゾチックに聞こえる効果がある。

ドラムの刻みは、バンドごとに異なる。

ヴォーカルは、咆哮や絶叫を用いる場合と、合唱団のように大勢で歌い上げる場合がある。

歌詞は、自国の神話、歴史上の戦い、自然崇拝、酒と祝祭を扱う。しばしば母語で歌われる。

祝祭的なバンドは野外フェスの常連で、盛り上がる曲がある。</p>
<h2>成り立ち</h2><p>1990年、イングランドのニューカッスルでSkycladが結成された。これが出発点の一つとされる。最初期のバンドは、SkycladとアイルランドのCruachanとされるが、どちらを最初とするかは見解が分かれる。

スラッシュメタルのバンドSabbatを離れたMartin Walkyierが率いた。1991年のデビュー作は、フォークメタル最初期の作品の一つとされる。常任のヴァイオリン奏者を迎えたのは、1992年の次作である。歌詞は環境破壊や社会批判を扱っている。

アイルランドのCruachanは、ケルトの神話と楽器を持ち込んだ。結成は1992年で、1995年にデビュー作Tuatha na Gaelを出した。1994〜95年頃から、各地で同種のバンドが現れた。

そして、最も大きな実りをもたらしたのは北欧、とりわけフィンランドだった。同国には、ジャズやフォックストロットに近い2拍子の社交ダンス音楽humppaがある。Finntrollはこれをブラックメタルと直結させ、トロールの神話を題材にした異形の音楽を作り上げた。Korpiklaaniは酒と森を主題にした。Ensiferumは戦記的な壮大さを、Moonsorrowは長大な構成を持ち込み、それぞれ別の方向へ広げた。

スイスのEluveitieは、英語を主体に再構成された古代ガリア語の曲も含む歌詞を書いた。ハーディ・ガーディやバグパイプを含む大人数の編成を組み、ガリア語の再構成では研究者の助言を受けている。ロシアのArkonaは、女性歌手Masha Scream（本名Maria Arkhipova）を中心に、スラヴの民間信仰を扱った。イスラエルのOrphaned Landは、中東の楽器と音階を用いた。ユダヤ教、キリスト教、イスラーム教の共通性と平和を、歌詞で訴えている。

一方、この分野には深刻な問題も伴う。自国の神話と土着信仰を称揚する姿勢は、簡単に民族主義や排外主義と結びつきうるためである。実際に近接する領域では、極右思想を公然と掲げる集団が存在し、フェスティバルからの出演取り消しや論争が繰り返されてきた。こうした政治性を明確に否定しているバンドもある。しかし、聴き手の側にそうした含みを読み込む層が一定数存在することは、今も解決していない緊張として残っている。

現在では、祝祭的なバンドは野外フェスの常連で、盛り上がる曲がある。</p>
