<h1>Jazz Rap（ジャズラップ）とは</h1>
<p>ジャズの音源や演奏を、ヒップホップの土台にしたスタイルだ。 素材になるのは、1950年代から1970年代のクール・ジャズ、ソウル・ジャズ、ハードバップなどの録音である。典型的な例として、ウッドベースが4分音符を4つずつ刻む歩く低音</p>
<p>ジャズの音源や演奏を、ヒップホップの土台にしたスタイルだ。

素材になるのは、1950年代から1970年代のクール・ジャズ、ソウル・ジャズ、ハードバップなどの録音である。典型的な例として、ウッドベースが4分音符を4つずつ刻む歩く低音、Fender Rhodesの丸く濁った和音、消音器を付けたトランペットの息の混じった音色が、しばしば使われる。

和音はジャズ由来で、四つの音を重ねた和音や九の和音、置き換えられた属和音を含むことが多い。そのため、通常のヒップホップより響きが複雑で、色彩に富む。

テンポは落ち着いていて、拍の隙間が広く取られる。これらの断片を数小節の輪にして反復させ、その上に硬いドラムを重ねるのが、基本の組み立てである。

ジャズ由来なのは主にサンプル素材と音色で、リズムはヒップホップ由来だ。発声については、落ち着いた語り口の例が多い。

歌詞は、暴力や誇示より、日常の観察、哲学的な問い、言葉遊び、黒人音楽の歴史への言及を扱う。同時代のギャングスタ・ラップが緊張と威圧を追求したのに対し、こちらは寛いだ空気と、知的な佇まいを目指している。

既成の録音を使わず、生の演奏者を招いて演奏させる形もある。その場合は、即興の独奏部分が挿入される。</p>
<h2>成り立ち</h2><p>前提として、初期のブロンクスのDJが使った素材は、主にファンク、ソウル、ディスコだった。ジャズ系の素材がどの程度含まれたかは、断定できない。しかし、独立したスタイルとして、ジャズラップは1980年代後半に形成された。

その流れの中で、ニューヨークのStetsasonicが1988年に発表したトーキング・オール・ザット・ジャズは、重要な楽曲である。サンプリングは怠惰で芸術ではないという批判（特にJames Mtume）への反論として書かれ、自分たちは黒人音楽の遺産を継承しているのだと主張した。

1988年から90年代初頭にかけて、Jungle Brothers、De La Soul、A Tribe Called Questらのネイティヴ・タンズと呼ばれる連合が、穏やかで色彩のある音を打ち出す。1991年にA Tribe Called Questが発表したザ・ロウ・エンド・セオリーは、ジャズラップの知名度を高めた重要作のひとつだ。収録曲『Verses from the Abstract』にRon Carterが参加し、二つの世代と二つのジャンルが、同じ録音の場に立った。

1990年には、ニューヨークのGang Starrが、1989年の『Jazz Music』を元に、Branford Marsalisを迎えて、映画監督Spike Leeのジャズ映画『Mo' Better Blues』用に楽曲『Jazz Thing』を制作した。この曲を通じて、ジャズとの接続はより明示的になった。同グループのGuruは1993年、ジャズマタズと題した企画で、Donald Byrd、Roy Ayers、Branford Marsalisといった現役の演奏家を招いて共演した。

同年、Digable Planetsが涼しげな作品で高い評価を得た。イギリスのUs3は、名門レーベルBlue Noteの音源を正式に使用する許可を得るという異例の契約で成功する。フィラデルフィアのThe Rootsは、ジャズの要素を取り入れた生演奏のヒップホップ・バンドとして活動した。

1990年代半ば以降は、ジャズの要素は目立たなくなったが、ヒップホップの素材の一つとして定着した。2010年代に入ると、ジャズの側から新しい世代が近づく。ピアニストのRobert Glasperやカナダの集団BADBADNOTGOODが、ヒップホップの表現を前提に演奏を組み立てた。2015年にKendrick Lamarがジャズ演奏者を大量に起用した作品を発表したことで、この二つの音楽の関係は、2010年代に再び注目された。</p>
<h2>代表曲</h2><ul><li>Electric Relaxation (A Tribe Called Quest)</li><li>What They Do (The Roots)</li><li>Aruarian Dance (Nujabes)</li><li>Rebirth of Slick (Cool Like Dat) (Digable Planets)</li><li>Cantaloup (Flip Fantasia) (Us3)</li><li>Can I Kick It? (A Tribe Called Quest)</li><li>Tennessee (Arrested Development)</li><li>DWYCK (Gang Starr feat. Nice &amp; Smooth)</li><li>Lifesaver (Guru)</li><li>Mr. Wendal (Arrested Development)</li><li>Tukka Yoot's Riddim (Us3)</li><li>Talkin' All That Jazz (Stetsasonic)</li></ul>
