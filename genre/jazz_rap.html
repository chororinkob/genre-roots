<h1>Jazz Rap（ジャズラップ）とは</h1>
<p>ジャズの音源や演奏をヒップホップの土台に据えた形式である。素材として好まれるのは1950年代から1970年代のハードバップ、モード・ジャズ、ソウルジャズ、フュージョンの録音で、とりわけウッドベースが弾く二拍四拍の歩く低音、Fend</p>
<p>ジャズの音源や演奏をヒップホップの土台に据えた形式である。素材として好まれるのは1950年代から1970年代のハードバップ、モード・ジャズ、ソウルジャズ、フュージョンの録音で、とりわけウッドベースが弾く二拍四拍の歩く低音、Fender Rhodesの丸く濁った和音、消音器を付けたトランペットの息の混じった音色が繰り返し用いられる。これらの断片を数小節の輪にして反復させ、その上に硬いドラムを重ねるのが基本的な構造である。和声はジャズ由来の四和音や九の和音、置き換えられた属和音を含むため、通常のヒップホップより響きが複雑で色彩に富む。テンポは概ね85から95 BPMと落ち着いており、拍の隙間が広く取られる。ラップの発声も、怒鳴らず、拍にぴったり合わせず、わずかに遅らせて言葉を置く語り口が好まれ、これはジャズの歌手が拍の後ろに寄りかかる感覚と対応している。歌詞は暴力や誇示より、日常の観察、哲学的な問い、言葉遊び、黒人音楽の歴史への言及を扱う。既成の録音を使わず、生の演奏者を招いて演奏させる形態もあり、その場合は即興の独奏部分が挿入される。同時代のギャングスタ・ラップが緊張と威圧を追求したのに対し、こちらは寛いだ空気と知的な佇まいを志向する。</p>
<h2>成り立ち</h2><p>前提として、ヒップホップは誕生の時点からジャズを素材にしていた。1970年代のブロンクスでDJがつないでいたレコードには、ジャズファンクやソウルジャズが最初から含まれていたのである。しかし独立した様式として自覚されたのは1988年前後だった。ニューヨークのStetsasonicが同年に発表したトーキング・オール・ザット・ジャズは、サンプリングを盗用だと批判する声への反論として書かれ、自分たちは黒人音楽の遺産を継承しているのだと主張した重要な楽曲である。1989年から1991年にかけて、De La SoulやA Tribe Called Questを含むネイティヴ・タンズと呼ばれる連合が、穏やかで色彩のある音を打ち出す。決定的だったのは1991年にA Tribe Called Questが発表したザ・ロウ・エンド・セオリーで、この作品ではジャズ界の巨匠であるベーシストRon Carterが実際に演奏に参加し、二つの世代と二つのジャンルが同じ録音の場に立った。翌1992年にはニューヨークのGang Starrが、映画監督Spike Leeのジャズ映画のために書いた楽曲を通じてこの接続をより明示的に行い、同グループのGuruは1993年、ジャズマタズと題した企画でDonald Byrd、Roy Ayers、Branford Marsalisといった現役の演奏家を招いて共演した。同年、Digable Planetsが涼しげな作品で高い評価を得て、イギリスのUs3は名門レーベルBlue Noteの音源を正式に使用する許可を得るという異例の契約で成功する。フィラデルフィアのThe Rootsは、サンプラーを使わず生バンドで全てを演奏するという方法を採り、この分野に演奏者としての正統性をもたらした。1990年代半ば以降、流行としては下火になり、洒落た背景音楽として消費されるという批判も受けたが、2010年代に入ってジャズの側から新しい世代が接近する。ピアニストのRobert Glasperやカナダの集団BADBADNOTGOODがヒップホップの語法を前提に演奏を組み立て、2015年にKendrick Lamarがジャズ演奏者を大量に起用した作品を発表したことで、この二つの音楽の関係は一過性の流行ではなく恒久的なものとして定着した。</p>
<h2>代表曲</h2><ul><li>Can I Kick It? (A Tribe Called Quest)</li><li>DWYCK (Gang Starr feat. Nice &amp; Smooth)</li><li>Rebirth of Slick (Cool Like Dat) (Digable Planets)</li><li>Cantaloup (Flip Fantasia) (Us3)</li><li>What They Do (The Roots)</li></ul>
