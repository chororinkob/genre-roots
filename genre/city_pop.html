<h1>City Pop（シティポップ）とは</h1>
<p>安定成長期からバブル期にかけて豊かになった、1970〜80年代の日本の都市生活。その煌めきと、同時にどこか漂う虚無感までを音に写し取った、極めて洗練されたポップスだ。 AOR(大人向けの落ち着いたロック)、ソウル、ファンク、フュー</p>
<p>安定成長期からバブル期にかけて豊かになった、1970〜80年代の日本の都市生活。その煌めきと、同時にどこか漂う虚無感までを音に写し取った、極めて洗練されたポップスだ。

AOR(大人向けの落ち着いたロック)、ソウル、ファンク、フュージョンといった、当時最先端のアメリカ音楽を貪欲に吸収した。それを日本語詞と日本人の美意識で再構成している。

質の高い録音・制作と、一流のスタジオミュージシャンによる演奏がもたらす音質の良さも、大きな特徴とされる。

コード進行は、9thや13thといったテンション(和音に緊張感を加える音)を多用した、都会的なものだ。そこに、透明感のあるボーカルと、贅沢なコーラスワーク（重ねるコーラスの工夫）が組み合わされる。テンポはミディアムからアップテンポまで幅がある。

歌詞には、夜のドライブ、海辺のリゾート、都会の恋愛といったモチーフが多い。

2010年代後半以降、YouTubeの推薦アルゴリズムを通じて、海外の若いリスナーに「発見」された。世界的なリバイバルが起きたのだ。</p>
<h2>成り立ち</h2><p>起源には諸説ある（はっぴいえんど説や、シュガー・ベイブ『SONGS』（1975年）を始まりとする説など）。いずれにせよ、1970年代半ばの日本で、経済的な豊かさを背景に登場し、1980年代に最盛期を迎えた。

前史は、1969年に前身のヴァレンタイン・ブルーが結成され、1970年にはっぴいえんど(細野晴臣、大瀧詠一、松本隆、鈴木茂)と改称したバンドにある。日本語でロックを歌えるかという論争のただ中で、彼らは日本語ロックの草創期に重要な役割を果たした。1972年12月31日に正式解散した後、多くのメンバーが以後、演奏・作曲・作詞・制作で数多くのポップスに関わった。

大瀧詠一は、自主レーベルのナイアガラ・レーベルを立ち上げた。1981年の『A LONG VACATION』では、アメリカのポップスの録音技術を徹底的に研究した音を提示し、大ヒットさせた。山下達郎は1976年にシュガー・ベイブを解散してソロへ移り、1980年の「RIDE ON TIME」がテレビCMに使われて広く知られる。作詞家の松本隆は、松田聖子の一連の作品を通じて、都会的な感覚を歌謡曲の中心へ持ち込んだとされる。

この音楽が成立した条件は複数ある。第一に、スタジオミュージシャンの技術水準が飛躍的に上がったこと。ドラムの林立夫、ベースの細野晴臣、ギターの松原正樹や鈴木茂といった演奏家が、アメリカのセッション奏者に匹敵すると高く評価される演奏を供給できるようになった。第二に、シンセサイザーやドラムマシンなどの電子楽器の普及である。第三に、カーステレオとウォークマンの普及である。この音楽は、ウォークマン（1979年7月1日発売）や、カセットデッキ・FMステレオ付きの車といった技術と結びついていた。

竹内まりや、大貫妙子、角松敏生、吉田美奈子、EPO、菊池桃子らが、多様な解釈を示した。松原みきの「真夜中のドア〜Stay With Me」(1979)のような作品も生まれる。

しかし国内では1980年代後半以降に主流の座を失い、1990年代以降は「J-POP」に埋没した。海外では2010年代まで広く知られていなかった。

転機は2010年代である。インターネット上でヴェイパーウェイヴの作り手が、日本の80年代の音源をサンプリング（既存の録音を素材に使うこと）した。その原曲を探す動きが世界的に広がった。2017年頃からは、動画サイトの推薦機能が竹内まりやの「Plastic Love」を大量に配信した。日本語を解さない若い聴き手が大挙してこの音楽を発見するという、当事者にとって予想外の現象が起きる。

現在ではアナログ盤が高値で取引されている。インドネシアでは、1970年代後半に生まれたpop kreatifが、シティポップ・ブームを機に再評価され「インドネシアのシティポップ」とも呼ばれている。アメリカのGinger Rootなど、影響を受けた作り手も各国に現れている。</p>
