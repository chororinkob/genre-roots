<h1>City Pop（シティポップ）とは</h1>
<p>高度経済成長を経て豊かになった1970〜80年代の日本の都市生活、その煌めきと同時にどこか漂う虚無感までを音に写し取った、極めて洗練されたポップス。AOR(大人向けの落ち着いたロック)、ソウル、ファンク、フュージョンといった当時最</p>
<p>高度経済成長を経て豊かになった1970〜80年代の日本の都市生活、その煌めきと同時にどこか漂う虚無感までを音に写し取った、極めて洗練されたポップス。AOR(大人向けの落ち着いたロック)、ソウル、ファンク、フュージョンといった当時最先端のアメリカ音楽を貪欲に吸収し、それを日本語詞と日本人の美意識で再構成している。当時世界最高水準にあった日本のスタジオ設備と、一流のスタジオミュージシャンによる演奏がもたらす音質の良さも大きな特徴で、7thや9thといったテンション(和音に緊張感を加える音)を多用した都会的なコード進行、透明感のあるボーカル、贅沢なコーラスワークが組み合わされる。テンポは中速が中心。歌詞に描かれるのは、夜のドライブ、海辺のリゾート、都会の恋愛といったモチーフで、生活の実感というより、当時の日本人が憧れた「洗練された都市生活」というイメージそのものを歌っている。2010年代後半以降、YouTubeの推薦アルゴリズムを通じて海外の若いリスナーに「発見」され、世界的なリバイバルが起きた。</p>
<h2>成り立ち</h2><p>1970年代後半から80年代の日本で、経済的な豊かさを背景に生まれた。前史は、1969年に細野晴臣、大瀧詠一、松本隆、鈴木茂が結成したはっぴいえんどにある。日本語でロックを歌えるかという論争のただ中で、彼らは日本語の響きを損なわずにロックへ乗せる方法を確立した。1972年の解散後、メンバーはそれぞれ制作者・作家として散り、日本のポピュラー音楽の骨格を作っていく。大瀧詠一は自主レーベルのナイアガラ・レーベルを立ち上げ、1981年の『A LONG VACATION』でアメリカのポップスの録音技術を徹底的に研究した音を提示して大ヒットさせた。山下達郎は1976年にシュガー・ベイブを解散してソロへ移り、1980年の「RIDE ON TIME」がテレビCMに使われて広く知られる。作詞家の松本隆は、松田聖子の一連の作品を通じて都会的な感覚を歌謡曲の中心へ持ち込んだ。この音楽が成立した条件は複数ある。第一に、スタジオミュージシャンの技術水準が飛躍的に上がったこと。ドラムの林立夫、ベースの細野晴臣、ギターの松原正樹や鈴木茂といった演奏家が、アメリカのセッション奏者に匹敵する演奏を供給できるようになった。第二に、多重録音とデジタル機材の普及である。第三に、カーステレオとウォークマンの普及であり、音楽は室内で正座して聴くものから、車と街の中で流れるものへ変わった。竹内まりや、大貫妙子、角松敏生、吉田美奈子、EPO、菊池桃子らが多様な解釈を示し、松原みきの「真夜中のドア」(1979)のような作品が生まれる。しかしバブル経済の崩壊とともにこの音は時代遅れとなり、1990年代以降は長く忘れられた。転機は2010年代である。インターネット上でヴェイパーウェイヴの作り手が日本の80年代の音源をサンプリングし、その原曲を探す動きが世界的に広がった。2017年頃からは動画サイトの推薦機能が竹内まりやの「Plastic Love」を大量に配信し、日本語を解さない若い聴き手が大挙してこの音楽を発見するという、当事者にとって予想外の現象が起きる。現在ではアナログ盤が高値で取引され、韓国、インドネシア、アメリカなどでシティポップを模倣する新しい作り手が次々に現れている。</p>
<h2>代表曲</h2><ul><li>Plastic Love (竹内まりや)</li><li>真夜中のドア/Stay With Me (松原みき)</li><li>Ride on Time (山下達郎)</li><li>悲しみがとまらない (杏里)</li><li>A LONG VACATION (大瀧詠一)</li><li>水色の雨 (八神純子)</li></ul>
