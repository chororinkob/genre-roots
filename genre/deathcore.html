<h1>Deathcore（デスコア）とは</h1>
<p>デスコアは、デスメタルの極端な速さと低い咆哮に、メタルコアの重く刻む部分を接ぎ木した音楽だ。 ギターは7弦や8弦、あるいは通常より大幅に下げた調弦を用いることが多い。最低音がベース音域に達することも珍しくない。旋律よりも、半音階的</p>
<p>デスコアは、デスメタルの極端な速さと低い咆哮に、メタルコアの重く刻む部分を接ぎ木した音楽だ。

ギターは7弦や8弦、あるいは通常より大幅に下げた調弦を用いることが多い。最低音がベース音域に達することも珍しくない。旋律よりも、半音階的な移動や不協和な響きが選ばれる。和音は意図的に濁らせる。

ドラムは、ツーバス（2つのバスドラムを使う奏法）の高速連打を基本とする。要所では、全ての楽器が同時に止まる無音を挟み、衝撃を作る。

ヴォーカルは、喉の奥を鳴らす低い咆哮と、高音のスクリーム（金切り声）を交互に使う。さらに、息を吸いながら発声する特殊な技法も用いられる。

歌詞は、暴力、死体、宗教への憎悪、精神の崩壊といった主題を扱い、内容の過激さが競われることが多い。

曲は、二つの極端な状態を往復する構造を持つ。一方は、速い曲では200bpm台のブラストビートと、同じ音を高速で細かく弾き続けるトレモロ奏法による、密度の高い高速の部分だ。もう一方は、テンポが大きく落ち（ブレイクダウン。ハーフタイム的になることが多い）、最も低い弦を一発ずつ叩きつける、極端に重い部分である。この落差の激しさそのものが快感の設計であり、聴き手の身体を突き落とすように作られている。伝統的なデスメタルと比べると、違いの一つは、メタルコア由来のブレイクダウンを軸にしている点である。</p>
<h2>成り立ち</h2><p>2000年代、アメリカではメタルコアが主流の人気を得ていた。同時に、より過激なものを求める10代の聴き手が、当時急成長していた交流サイトMySpaceを通じて、直接バンドとつながる環境が整っていた。デスコアは1990年代に前兆があり、2000年代初頭に登場し、2000年代半ばに普及した。この二つの条件は、その普及の背景にあった。

アリゾナ州のJob for a Cowboyの短いEP『Doom』は、最初は自主プレスで出たともされ、2005年12月にKing of the Monstersから発売された。MySpaceでのアクセスは、発売と同時期の2005年後半に急増した。2006年にはMetal Bladeと契約し、同社が『Doom』を再発した。これは、インターネットが従来の業界の選別を飛び越えた例のひとつとされる。

続いて、各地のバンドが現れた。カリフォルニア州リヴァーサイドのSuicide Silenceは、2007年の作品ザ・クレンジングで、このスタイルの代表的な作品を発表した。テネシー州ノックスヴィルのWhitechapelは、3本のギターによる分厚い低音で続いた。カナダのモントリオールのDespised Iconや、カリフォルニア州サンディエゴ近郊のCarnifex、ユタ州ソルトレイクシティのChelsea Grin、オーストラリアのThy Art Is Murderが、国際的な広がりを作った。Century Media、Metal Blade、Victory Records、Nuclear Blastなどのレーベルから、作品が発売された。

しかし、この分野は当初から強い反発にさらされた。伝統的なデスメタルの愛好家からは、若者向けに単純化された偽物であり、重い刻みで踊るために音楽を切り刻んでいるだけだと、繰り返し批判された。この対立は、インターネット上で執拗に続いた。

2012年11月、Suicide Silenceの歌手Mitch Luckerがオートバイ事故で死亡し、シーンの顔だった人物を失う。2010年代半ばには、流行が過ぎたとみなされる時期もあった。それでも、演奏技術と録音の水準は静かに上がり続けていたと言われる。

転機は2021年だった。ニュージャージーのLorna Shoreが、歌手Will Ramosを迎えて楽曲を発表した。その常軌を逸した声の技術によって、楽曲は短編動画の投稿を通じて世界的に拡散し、この分野は再び大きな注目を集めた。現在では、交響的な編曲や電子音を取り込んだ多様な形へ広がり、極端さを競う実験の場として機能している。</p>
