<h1>Deathcore（デスコア）とは</h1>
<p>デスメタルの極端な速さと低い咆哮に、メタルコアの重く刻む部分を接ぎ木した音楽である。曲は二つの極端な状態を往復する構造を持つ。一方は毎分250打を超えるブラストビートと、全ての弦を細かく往復して弾くトレモロによる、密度の高い高速の</p>
<p>デスメタルの極端な速さと低い咆哮に、メタルコアの重く刻む部分を接ぎ木した音楽である。曲は二つの極端な状態を往復する構造を持つ。一方は毎分250打を超えるブラストビートと、全ての弦を細かく往復して弾くトレモロによる、密度の高い高速の部分であり、もう一方は突然テンポが四分の一ほどに落ち、最も低い弦を一発ずつ叩きつける極端に重い部分である。この落差の激しさそのものが快感の設計であり、聴き手の身体を突き落とすように作られている。ギターは7弦や8弦、あるいは通常より大幅に下げた調弦を用い、最低音がベース音域に達することも珍しくない。旋律よりも半音階的な移動や不協和な響きが選ばれ、和音は意図的に濁らせる。ヴォーカルは喉の奥を鳴らす低い咆哮と、極端な裏声の金切り声を交互に使い、さらに息を吸いながら発声する特殊な技法も用いられる。歌詞は暴力、死体、宗教への憎悪、精神の崩壊といった主題を扱い、内容の過激さが競われる。ドラムはツーバスの高速連打を基本とし、要所で全ての楽器が同時に止まる無音を挟んで衝撃を作る。伝統的なデスメタルと比べると、曲の展開が分かりやすく、身体を動かす部分が明確に用意されている点が最大の違いである。</p>
<h2>成り立ち</h2><p>2000年代半ば、アメリカではメタルコアが完全に主流化し、その型が使い尽くされつつあった。同時に、より過激なものを求める10代の聴き手が、当時急成長していた交流サイトMySpaceを通じて直接バンドとつながる環境が整っていた。この二つの条件が重なって生まれたのがデスコアである。アリゾナ州のJob for a Cowboyは、2005年に自主制作した短い作品をMySpaceに置いたところ、口伝えで爆発的に広まり、レコード会社との契約に至った。これはインターネットが従来の業界の選別を飛び越えた最初期の顕著な例のひとつである。カリフォルニア州リヴァーサイドのSuicide Silenceは2007年の作品ザ・クレンジングで、この様式を確立し、テネシー州ノックスヴィルのWhitechapelは三本のギターによる分厚い低音で続いた。カナダのモントリオールのDespised Iconや、カリフォルニアのCarnifexとChelsea Grin、オーストラリアのThy Art Is Murderが国際的な広がりを作り、Sumerian RecordsやCentury Mediaといったレーベルが流通を担った。この分野は当初から強い反発にさらされた。伝統的なデスメタルの愛好家からは、若者向けに単純化された偽物であり、重い刻みで踊るために音楽を切り刻んでいるだけだと繰り返し批判され、この対立はインターネット上で執拗に続いた。2012年11月、Suicide Silenceの歌手Mitch Luckerがオートバイ事故で死亡し、シーンは象徴的な人物を失う。2010年代半ばには流行が過ぎたとみなされる時期もあったが、演奏技術と録音の水準は静かに上がり続けていた。転機は2021年で、ニュージャージーのLorna Shoreが歌手Will Ramosを迎えて発表した楽曲が、その常軌を逸した声の技術によって短編動画の投稿を通じて世界的に拡散し、この分野は当初を超える規模の聴衆を得るに至った。現在では交響的な編曲や電子音を取り込んだ多様な形へ広がり、極端さを競う実験の場として機能している。</p>
<h2>代表曲</h2><ul><li>Knee Deep (Job for a Cowboy)</li><li>Possession (Whitechapel)</li><li>No Pity for a Coward (Suicide Silence)</li><li>Immortal (Lorna Shore)</li><li>The Purest Strain of Hate (Thy Art Is Murder)</li></ul>
