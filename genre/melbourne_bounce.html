<h1>Melbourne Bounce（メルボルンバウンス）とは</h1>
<p>オーストラリアのメルボルンで生まれた、跳ねる低音を中心にした電子のダンス音楽である。 この音楽は、ダッチ・ハウスのホーン、テック・トランスのシンセ、エレクトロ・ハウスのスタブ、イングランド北西部のスカウス・ハウス的なベースラインな</p>
<p>オーストラリアのメルボルンで生まれた、跳ねる低音を中心にした電子のダンス音楽である。

この音楽は、ダッチ・ハウスのホーン、テック・トランスのシンセ、エレクトロ・ハウスのスタブ、イングランド北西部のスカウス・ハウス的なベースラインなどの混成とされる。ジャンプスタイルやサイケデリック・トランスの影響を挙げる見方もある。

上に重ねる音は少ない。荒々しいホーン、甲高いソー系のリード、加工された声の断片が置かれる。

テンポは128 BPM前後が標準で、場合によっては150 BPMまで上がる。この速さで四つ打ちのバスドラムを鳴らし、各拍の裏に短く切った低音を置く。裏拍に置かれる短いプラック型のベースが、このジャンルのトレードマークだ。この音は、エンベロープをフィルターや音量に割り当てて作る。その結果、拍と拍の間で音が跳ね上がっては落ちる動きが生まれ、踊る人の体を上下させる。

曲の組み立てははっきりしている。ビルドアップからドロップへ移る構成で、ドロップ前に8小節のスネアのフィルやロールが入る曲が多い。音数が少ないのは欠点ではない。跳ねる低音を最も目立たせるための選択である。

演奏の場は、屋内のクラブから大規模な野外の催しまで幅広い。2013年半ば以降は、米国や欧州にも広まった。</p>
<h2>成り立ち</h2><p>2012年ごろ、メルボルンのクラブ文化の中で、ある混成の音楽が人気を集め始めた。ダッチ・ハウスのホーン、テック・トランスのシンセ、エレクトロ・ハウスのスタブ、スカウス・ハウス的なベースラインなどを混ぜ合わせた音楽である。

中心にいたのは、メルボルン出身のウィル・スパークスとジョエル・フレッチャーだ。ウィル・スパークスは、先駆者と見なされることも多い。米国ロサンゼルスのDeorroも、初期に似た音を作っていた。ウィル・スパークスの『Ah Yeah』は、2012年11月に発売された。

2013年半ばには、この音楽は米国と欧州でも広まり始めた。主要な作品は、既存のレーベルから出ていた。『Ah Yeah』はHussleから出ており、ティミー・トランペットはOneLove、Central Station、Hussle Recordingsと契約していた。ウィル・スパークス自身のレーベルBourne Recordingsも、Lucky EntおよびMinistry of Sound Australiaとの共同事業だった。

2014年前後には、この音楽は国内外で流行した。シドニー生まれのティミー・トランペットが活躍したのも、2014年前後である。同年の秋を中心に、ウィル・スパークス、ティミー・トランペット、ジョエル・フレッチャーが、Bounce Bus Tourで北米を回った。

一方で、この語は、Deorro、ジョエル・フレッチャー、ウィル・スパークス、Vinai、TJRらの2012〜2016年ごろの作品に対して使われた。本国では、ウィル・スパークスやティミー・トランペットらが、その後も活動を続けている。</p>
