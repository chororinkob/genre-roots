<h1>Melbourne Bounce（メルボルンバウンス）とは</h1>

<p>オーストラリアのメルボルンで生まれた、跳ねる低音を軸とする電子舞曲である。テンポは一分間に128拍前後と、同系統の他の様式に比べて遅い。この速度で四つ打ちのバスドラムを置き、その各拍の裏に短く切った低音を配置する。この低音の音色が決定的で、フィルターを強くかけて中域を削り、上下に大きく揺れるように設定される。結果として、拍と拍の間で音が跳ね上がっては落ちるという動きが生まれ、踊り手の体を上下させる。この低音の型は、オランダのダッチ・ハウスから受け継いだものを、より単純で誇張された形に作り直したものである。上物の要素は極端に少なく、短い電子音の反復と、加工された声の断片が置かれる程度である。旋律らしい旋律を持たない曲も多い。曲の構成は明快で、溜めの区間で音を削ぎ落とし、そこから一気に低音が戻るという落差が最大の聞かせどころになる。この落差の設計に技術のほとんどが注がれており、音数の少なさは欠点ではなく、跳ねる低音を最も目立たせるための選択である。演奏の場は屋内のクラブから大規模な野外の催しまで広く、極めて分かりやすい構造ゆえに国境を越えて受容された。</p>
<h2>成り立ち</h2><p>2010年前後、メルボルンのクラブ文化の中で、オランダから輸入されたダッチ・ハウスを地元流に作り替える動きが生まれた。オランダのアフロジャックらが確立していた、フィルターで加工した揺れる低音を、より単純で誇張された形に作り直したのである。中心となったのはウィル・スパークス、ジョエル・フレッチャー、そしてティミー・トランペットといった地元の制作者たちで、彼らはメルボルン市内のクラブで実験を重ねながら型を固めていった。特徴的だったのは制作環境で、多くが自室で市販の制作ソフトを使い、無料で配布されている音源を組み合わせて作っていた。専門的な設備も音楽教育も必要としない作り方が、10代を含む若い制作者の大量参入を可能にした。2012年から2013年にかけて、この音楽は動画共有サイトと音楽配信サービスを通じて急速に国外へ広まる。特に注目すべきは、この拡散が既存のレコード会社をほとんど経由しなかった点である。制作者が自分で公開した音源が直接聴かれ、再生数がそのまま評価になるという経路が主流だった。従来の業界の仕組みを飛び越えて世界的な流行が生まれた初期の例として、しばしば言及される。2014年前後には流行の頂点に達し、大規模な音楽祭でも盛んに演奏された。しかし普及の速さは飽和の速さでもあった。誰でも同じ手順で作れるという性質から、短期間に膨大な類似作が生まれ、聴き手が区別できなくなる。2015年頃には主流のダンス音楽の場から急速に姿を消していった。一方で、この様式は思わぬ形で生き延びる。跳ねる低音の型がインドやブラジル、東南アジアをはじめとする各地の大衆音楽に取り込まれ、それぞれの地域の旋律や歌唱と融合したのである。オーストラリア発の音が、本国で忘れられた後に別の地域で定着するという逆転が起きた。オーストラリア国内でも、後年になって当時の楽曲を懐古的に取り上げる動きが生まれている。</p>
