<h1>Coldwave（コールドウェーブ）とは</h1>
<p>ポストパンクの骨組みを保ちながら、感情の温度を意図的に下げた音を追求する音楽。名前の通り冷たさが美学の中心にあり、リヴァーブとコーラスをかけた金属的なギター、フェイザーで揺らした薄いシンセパッド、そして硬質で乾いたドラムマシンの組</p>
<p>ポストパンクの骨組みを保ちながら、感情の温度を意図的に下げた音を追求する音楽。名前の通り冷たさが美学の中心にあり、リヴァーブとコーラスをかけた金属的なギター、フェイザーで揺らした薄いシンセパッド、そして硬質で乾いたドラムマシンの組み合わせが基本編成になる。ギターは歪ませず、細い高音域でアルペジオや単音のフレーズを弾き、和音を厚く鳴らすことを避ける。ベースは前面に出て曲を牽引し、ルート音を8分音符で刻む反復的なラインが多い。ドラムはRoland CR-78やTR-606、Korg KR-55といった簡素なリズムマシンが担い、生ドラムの場合もフロアタムを排して硬い音に絞る。テンポは100〜140BPM、拍子は4分の4が基本で、リズムは踊れる程度の推進力を保つ。和声は自然短音階やフリギア旋法など暗い響きを選び、長調へ解決しないまま曲を終えることも多い。ヴォーカルは抑揚を抑えた平板な発声で、感情を込めず語るように歌う。フランス語で歌われる例が多いのもこの潮流の特徴である。歌詞は疎外、寒さ、都市の無機質さ、政治的な閉塞を扱う。ダークウェイヴやゴシックロックと近縁だが、ゴシックが劇的で装飾的なのに対し、コールドウェイヴは装飾を削ぎ落とした簡素さと乾いた質感を保つ点が異なる。</p>
<h2>成り立ち</h2><p>1970年代末から1980年代前半のフランスとベルギーで、イギリスのポストパンクを受容した若者たちが独自の解釈を加えたことで生まれた。直接の原型はイギリスのJoy Divisionで、1979年の「Unknown Pleasures」がプロデューサーMartin Hannettによって残響の深い冷たい音像に仕上げられ、大陸の音楽家に強い衝撃を与えた。フランスではパリのKas ProductやMarquis de Sade、Trisomie 21、Martin Dupont、Charles de Goalらが、安価なシンセとリズムマシンを使って自主制作のレコードを次々と発表した。当時のフランスにはイギリスのような大手インディーレーベル網がなく、多くは数百枚単位のプレスで地方の小さな店だけに流通したため、後年まで存在すら知られない作品が大量に埋もれることになった。名称としてのcold waveは、1979年にイギリスの音楽誌Sounds が新しい暗い音を形容するために使った語が、フランスに輸入されて定着したものとされる。フランスでは音楽誌Best や自主制作のファンジンが情報を媒介し、パリのRose Bonbonといったクラブが場を提供した。ベルギーではLes Disques du Crepusculeというレーベルが重要で、Michel Duvalが1980年にブリュッセルで設立し、マンチェスターのFactory Recordsと提携関係を結んで大陸と英国を橋渡しした。同レーベルはTuxedomoonやThe Durutti Columnといった作品を出し、洗練された装丁で知られた。政治的背景として、フランスでは1970年代の経済停滞と失業、都市郊外の団地に閉じ込められた若年層の閉塞感があり、コールドウェイヴの無感情な音はその心情の直接的な反映と受け取られた。1980年代半ばには多くのバンドが解散し、シーンは商業的にほぼ何も残さずに消えた。しかし1990年代末から2000年代にかけて、コレクターやDJによる発掘が進み、フランスのInfrastitionやアメリカのMinimal Wave Recordsといった再発レーベルがオリジナル盤を復刻したことで国際的に再評価された。2010年代以降はダークウェイヴやポストパンク・リバイバルの参照源となり、Molchat Doma(ベラルーシ)やLebanon Hanoverのようなバンドが同じ美学を継承し、SNSを通じて世界的な聴衆を獲得している。</p>
<h2>代表曲</h2><ul><li>Lost and Late (Martin Dupont)</li><li>The Last Song (Trisomie 21)</li><li>So Young But So Cold (KaS Product)</li><li>Submarine Dance (Signal Aout 42)</li><li>Cold Souls (Lebanon Hanover)</li></ul>
