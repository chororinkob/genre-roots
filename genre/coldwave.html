<h1>Coldwave（コールドウェーブ）とは</h1>
<p>ポストパンクの骨組みを保ちながら、感情の温度を意図的に下げた音を追求する音楽。名前の通り冷たさが考え方の中心にあり、リヴァーブ（残響）とコーラス（音に厚みを出す効果）をかけた金属的なギター、フェイザー（音をうねらせる効果）で揺らし</p>
<p>ポストパンクの骨組みを保ちながら、感情の温度を意図的に下げた音を追求する音楽。名前の通り冷たさが考え方の中心にあり、リヴァーブ（残響）とコーラス（音に厚みを出す効果）をかけた金属的なギター、フェイザー（音をうねらせる効果）で揺らした薄いシンセパッド（持続する背景の音）、そして硬質で乾いたドラムマシンの組み合わせが基本編成になる。ギターは歪ませず、細い高音域でアルペジオ（和音を一音ずつ弾く奏法）や単音のフレーズを弾き、和音を厚く鳴らすことを避ける。ベースは前面に出て曲を牽引し、ルート音（和音の基本の音）を8分音符で刻む反復的なラインが多い。ドラムはRoland CR-78やTR-606、Korg KR-55といった簡素なリズムマシンが担い、生ドラムの場合もフロアタムを排して硬い音に絞る。テンポは中程度から速めで、拍子は4分の4が基本で、リズムは踊れる程度の前へ進む勢いを保つ。和声（コードの響き）は自然短音階やフリギア旋法（暗い響きの音階の型）など暗い響きを選び、長調へ解決しないまま曲を終えることも多い。ヴォーカルは抑揚を抑えた平板な発声で、感情を込めず語るように歌う。母語のフランス語で歌うバンドもあった。歌詞は孤立感、寒さ、都市の無機質さ、政治的な閉塞を扱う。ダークウェイヴやゴシックロックと近縁だが、ゴシックが劇的で装飾的なのに対し、コールドウェイヴは装飾を削ぎ落とした簡素さと乾いた質感を保つ点が異なる。</p>
<h2>成り立ち</h2><p>1970年代末から1980年代前半のフランスとベルギー（ポーランドにも広がった）で、イギリスのポストパンクを受容した若者たちが独自の解釈を加えたことで生まれた。影響源の一つはイギリスのJoy Division（ほかにSiouxsie and the Bansheesなど）で、1979年の「Unknown Pleasures」がプロデューサーMartin Hannettによって残響の深い冷たい音像に仕上げられ、大陸の音楽家に強い衝撃を与えた。フランスではナンシーのKaS Product、レンヌのMarquis de Sade、北部ドゥナンのTrisomie 21、マルセイユのMartin Dupont、Charles de Goalらが、安価なシンセとリズムマシンを使って自主制作のレコードを次々と発表した。当時のフランスにはイギリスのような大手インディーレーベル網がなく、多くは数百枚単位のプレスで地方の小さな店だけに流通したため、後年まで存在すら知られない作品が大量に埋もれることになった。名称としてのcold waveは、1977年11月26日号のイギリスの音楽誌Soundsの表紙キャプション「New musick: The cold wave」（Kraftwerkの写真）が初出で、フランス語の「la vague froide」は、フランスの音楽誌がMarquis de Sadeの音を形容するために作った語とされる。フランスでは音楽誌Best や自主制作のファンジンが情報を媒介し、パリのRose Bonbonといったクラブが場を提供した。ベルギーではLes Disques du Crepusculeというレーベルが重要で、Michel DuvalとAnnik Honoréが1980年にブリュッセルで設立し、マンチェスターのFactory Recordsと提携関係を結んで大陸と英国を橋渡しした。同レーベルはTuxedomoonやThe Durutti Columnといった作品を出し、洗練された装丁で知られた。政治的背景として、フランスでは1970年代の経済停滞と失業、都市郊外の団地に閉じ込められた若年層の行き詰まった感覚があり、コールドウェイヴの無感情な音はその心情の反映と受け取る見方がある。1980年代半ばには多くのバンドが活動を終えたが、Trisomie 21のように現在まで活動を続けるバンドもある。しかし2000年代半ば以降、コレクターやDJによる発掘が進み、フランスのInfrastitionやアメリカのMinimal Wave Recordsといった再発レーベルがオリジナル盤を復刻したことで国際的に再評価された。2010年代以降はダークウェイヴやポストパンク・リバイバルの参照源となり、Molchat Doma(ベラルーシ)やLebanon Hanoverのようなバンドが同じ考え方を受け継ぎ、SNSを通じて世界的な聴衆を獲得している。</p>
<h2>代表曲</h2><ul><li>The Last Song (Trisomie 21)</li><li>LA (Boy Harsher)</li><li>Never Come Back (Kas Product)</li><li>Circles (The Soft Moon)</li><li>Breathe the Fire (The Soft Moon)</li><li>La fête triste (Trisomie 21)</li><li>Just Because (Martin Dupont)</li><li>Submarine Dance (Signal Aout 42)</li><li>So Young But So Cold (KaS Product)</li><li>Breaking Down (Trisomie 21)</li><li>Julia (Asylum Party)</li><li>Lost and Late (Martin Dupont)</li></ul>
