<h1>Coldwave（コールドウェーブ）とは</h1>
<p>コールドウェイヴは、ポストパンクの骨組みを保ちながら、感情の温度を意図的に下げた音を追求する音楽だ。名前の通り、冷たさが考え方の中心にある。 基本編成は、多くの場合、三つの音の組み合わせだ。リヴァーブ（残響）とコーラス（音に厚みを</p>
<p>コールドウェイヴは、ポストパンクの骨組みを保ちながら、感情の温度を意図的に下げた音を追求する音楽だ。名前の通り、冷たさが考え方の中心にある。

基本編成は、多くの場合、三つの音の組み合わせだ。リヴァーブ（残響）とコーラス（音に厚みを出す効果）をかけた金属的なギター。フェイザー（音をうねらせる効果）で揺らした、薄いシンセパッド（持続する背景の音）。そして、硬質で乾いたドラムマシンである。

ギターは歪ませないことが多い。細い高音域で、アルペジオ（和音を一音ずつ弾く奏法）や単音のフレーズを弾く。和音を厚く鳴らすことは少ない。ベースは前面に出て曲を牽引する。ルート音（和音の基本の音）を8分音符で刻む、反復的なラインが多い。

和声（コードの響き）は、自然短音階やフリギア旋法（暗い響きの音階の型）など、暗い響きを選ぶことが多い。長調へ解決しないまま、曲を終えることも多い。

ドラムは、Roland CR-78やTR-606、Korg KR-55といった簡素なリズムマシンが担うことが多い。生ドラムの場合も、フロアタムを排して硬い音に絞ることが多い。テンポは、遅く重いものから、KaS Productのように速いものまで幅がある。拍子は4分の4が基本だ。リズムは、踊れる程度の前へ進む勢いを保つ。

ヴォーカルは、抑揚を抑えた平板な発声で、感情を込めず語るように歌う。母語のフランス語で歌うバンドもあった。歌詞は、孤立感、寒さ、都市の無機質さ、政治的な閉塞を扱うものもある。

ダークウェイヴやゴシックロックと近縁である。ただし、ゴシックが劇的で装飾的なのに対し、コールドウェイヴは、装飾を削ぎ落とした簡素さと乾いた質感を保つ。この点が異なる。</p>
<h2>成り立ち</h2><p>1970年代末から1980年代前半、フランスとベルギーで、若者たちはイギリスのポストパンクを受け入れ、そこに独自の解釈を加えた。こうして生まれたのが、コールドウェイヴだ。並行して、ポーランドでも独自のzimna falaが生まれている。

影響源の一つは、イギリスのJoy Divisionである（ほかにSiouxsie and the Bansheesなど）。英国ポストパンクの影響を受けつつ、フランスではMarquis de Sadeなど、先行するバンドも現れた。起源は諸説ある。

フランスでは、ナンシーのKaS Product、レンヌのMarquis de Sade、北部ドゥナンのTrisomie 21、マルセイユのMartin Dupont、後年cold waveと分類されたCharles de Goalらが活動した。彼らは、安価なシンセとリズムマシンを使って、自主制作のレコードを次々と発表した。一部は自主制作や少部数のシングル、カセットで流通した。ただし、大手・中堅レーベルから出した例も多い。

名称の由来にも触れておく。cold waveという語は、1977年11月26日号のイギリスの音楽誌Soundsの表紙キャプション「New musick: The cold wave」（Kraftwerkの写真）で使われた（Wikipedia英語版）。フランス語の「la vague froide」は、フランスの音楽誌がMarquis de Sadeの音を形容するために作った語とされる。

フランスでは、カセットやファンジンなど地下ネットワークが情報を媒介した。パリのRose Bonbonは、パンクやニューウェイヴの若手に常設ステージを提供したクラブで、Marquis de Sadeなども出演した。

ベルギーでは、Les Disques du Crepusculeというレーベルが重要だった。Michel DuvalとAnnik Honoréが1980年にブリュッセルで設立し、マンチェスターのFactory Recordsと提携関係を結んで、大陸と英国を橋渡しした。同レーベルは、TuxedomoonやThe Durutti Columnといった作品を出し、洗練された装丁で知られた。

政治的背景として、フランスには、1970年代の経済停滞と失業があった。都市郊外の団地に閉じ込められた若年層には、行き詰まった感覚があった。コールドウェイヴの無感情な音は、その心情の反映と受け取る見方もある。

1980年代半ばには、多くのバンドが活動を終えた。ただし、Trisomie 21のように、現在まで活動を続けるバンドもある。

しかし2000年代半ば以降、コレクターやDJによる発掘が進んだ。フランスのInfrastitionやアメリカのMinimal Wave Recordsといった再発レーベルが、オリジナル盤を復刻する。これによって、国際的に再評価された。

2010年代以降は、ダークウェイヴやポストパンク・リバイバルの参照源となった。Lebanon Hanoverは、現代の復興で影響力があるとされる。Molchat Doma(ベラルーシ)は、SNSを通じて世界的な聴衆を獲得した。その位置づけは評者によって分かれる。</p>
