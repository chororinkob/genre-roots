<h1>Electro-Funk（エレクトロファンク）とは</h1>
<p>1980年代前半に生まれた、機械の音だけでファンクを組み立てようとした音楽である。中核にあるのはRoland TR-808というリズムマシンで、その低音の太鼓は実際の楽器に似ておらず、音程を持ったまま数秒にわたって減衰していく。こ</p>
<p>1980年代前半に生まれた、機械の音だけでファンクを組み立てようとした音楽である。中核にあるのはRoland TR-808というリズムマシンで、その低音の太鼓は実際の楽器に似ておらず、音程を持ったまま数秒にわたって減衰していく。この長く尾を引く低音が、音楽の土台であると同時に旋律的な役割も担う。手拍子を模した音や、金属的な高音の刻みも同じ機械から供給される。リズムは四つ打ちではなく、拍を細かく分割して裏へずらす配置が用いられ、機械的でありながら跳ねる感触を持つ。テンポは概ね110から130 BPMである。上物には初期のシンセサイザーによる、金属的で冷たい音色の反復する音型が置かれ、和音はほとんど鳴らされず、単音の線が絡み合う。人の声は歌われるより、音程を機械で補正する装置や、口にくわえた管を通す装置によって加工され、人間とも機械ともつかない響きに変えられる。歌詞は宇宙、ロボット、未来都市、そして踊ることそのものを扱い、感情の吐露はほとんどない。この、意図的に人間味を排除した冷たさが、当時のファンクやディスコの温かさとの決定的な違いであり、後の多くの電子音楽の出発点となった。</p>
<h2>成り立ち</h2><p>決定的な作品は1982年に発表されたAfrika Bambaataaのプラネット・ロックである。ニューヨークのブロンクスで、かつて暴力的な集団に属していたAfrika Bambaataaは、音楽によって暴力を置き換えることを掲げてZulu Nationという組織を作り、DJとして活動していた。彼は選曲において人種や国籍を問わず、あらゆるレコードを使うことで知られていた。この楽曲では、ドイツのKraftwerkの二つの楽曲、すなわち旋律を一方から、リズムをもう一方から借り、それをTR-808で再構成するという方法が採られた。制作を担ったArthur Bakerと、鍵盤を弾いたJohn Robieがこれを実現している。ヨーロッパの白人による冷たい電子音楽を、ニューヨークの黒人が自分たちの踊りの音楽として作り替えたというこの経緯は、大西洋を往復する影響関係の象徴として繰り返し語られる。同年、同じくニューヨークではジャマイカ出身のGrandmaster Flashの一派が社会批判の楽曲を発表しており、ヒップホップはこの時期に急速に語彙を広げていた。電子ファンクの流れはすぐに各地へ広がる。ロサンゼルスではEgyptian Loverらが、より性的で享楽的な方向を打ち出し、この地域独特の系統を作った。デトロイトでは、この音楽を聴いて育った若者たちが、後にテクノを生み出すことになる。ラジオ司会者Charles Johnsonの番組が、Kraftwerkからイタリアの電子ディスコまでを分け隔てなく流したことが、その土壌を用意した。ニューヨークではMantronixが続き、イギリスではこの音は電子的なブレイクダンスの音楽として受容された。1980年代半ばには流行としては急速に古びる。より生々しいサンプリングを用いる新しいヒップホップが台頭したためである。しかしその遺産は膨大だった。TR-808の低音は現在のトラップやポップスに至るまで用いられ続け、声を機械で加工するという発想はその後のあらゆる分野に浸透し、そして機械で作られたダンス音楽という考え方そのものが、テクノ、ハウス、マイアミ・ベースの直接の出発点となっている。</p>
<h2>代表曲</h2><ul><li>More Bounce to the Ounce (Zapp)</li><li>Jam On It (Newcleus)</li><li>Rockit (Herbie Hancock)</li></ul>
