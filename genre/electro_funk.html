<h1>Electro-Funk（エレクトロファンク）とは</h1>
<p>エレクトロ・ファンクは、1980年代前半に生まれた音楽だ。ドラムマシンとシンセサイザーを主体に、ファンクを組み立てている。 中心にあるのは、Roland TR-808というリズムマシンだ。その低音の太鼓は、実際の楽器に似ていない。</p>
<p>エレクトロ・ファンクは、1980年代前半に生まれた音楽だ。ドラムマシンとシンセサイザーを主体に、ファンクを組み立てている。

中心にあるのは、Roland TR-808というリズムマシンだ。その低音の太鼓は、実際の楽器に似ていない。減衰を調節して、長く伸ばすこともできる。この長く尾を引く低音が、音楽の土台になる。同時に、メロディーのような役割も担う。手拍子を模した音や、金属的な高音の刻みも、同じ機械から出される。

上に重ねるのは、初期のシンセサイザーによる金属的で冷たい音色だ。同じ形をくり返しながら置かれ、単音のシーケンスやアルペジオが主体となる。ただし、ストリングスやパッド、オーケストラ・ヒットといった和音の音も普通に使われる。

リズムは四つ打ちではない。キックでシンコペーションを作り、スネアやクラップを2拍目と4拍目に置く並べ方が使われる。機械的でありながら、跳ねる感触がある。

人の声はラップが多い。声を合成音に変えるボコーダーや、口にくわえた管を通すトークボックスで加工されることもあり、人間とも機械ともつかない響きに変わる。

歌詞は宇宙やロボット、未来都市、そして踊ることそのものを扱い、SF的・未来的な題材が多い。一方で、ロサンゼルスのように性的な歌詞の系統もある。

Afrika Bambaataa自身は、Kraftwerkの未来的な音に、James Brown、Sly Stone、George Clintonのファンクを合わせたと語っている。この音は、後のテクノやマイアミ・ベースなどにも影響を与えた。</p>
<h2>成り立ち</h2><p>決め手となった作品の一つは、1982年に発表された、Afrika Bambaataa &amp; the Soulsonic Forceのプラネット・ロックだ。

Afrika Bambaataaは、ニューヨークのブロンクスで、かつて暴力的な集団に属していた。彼は、音楽で暴力を置き換えることを掲げてZulu Nationという組織を作り、DJとして活動していた。選曲では人種や国籍を問わず、あらゆるレコードを使うことで知られていた。

この曲では、ドイツのKraftwerkの二つの曲が使われた。「Trans-Europe Express」の旋律を弾き直し、「Numbers」のビートをTR-808で組み直したのだ。レコードのサンプリングは行っておらず、使われたのはFairlightの内蔵音だけだった。これを実現したのは、制作を担ったArthur Bakerと、鍵盤を弾いたJohn Robieである。

Afrika Bambaataaと、ボストン出身のプロデューサーArthur Baker、鍵盤のJohn Robieらは、ニューヨークで手を組み、Kraftwerkなどのヨーロッパ、そして日本の電子音楽を取り込んだ。この経緯は、大西洋を行き来する影響関係を表す例として、繰り返し語られる。なお、Afrika Bambaataaには2016年以降、児童への性的虐待の告発がある。本人の側は否認したが、2025年には民事訴訟で、出廷しないまま敗訴した。2026年4月に68歳で死去している。

1982年には、同じニューヨークで、社会批判の曲「The Message」が、名義上はGrandmaster Flash and the Furious Fiveの曲として発表されていた。ヒップホップは、この時期に急速に語彙を広げていた。

電子ファンクの流れは、すぐに各地へ広がる。ロサンゼルスでは、Egyptian Loverらが、性的で享楽的な方向を打ち出し、この地域ならではの系統を作った。

デトロイトでは同時期に独自に、Juan Atkinsらが1980年にCybotronを結成し、1981年に初作を出していた。Atkinsらは、ラジオのElectrifying Mojo(本名Charles Johnson)の番組で、KraftwerkやP-Funk、Princeを聴いた。これが背景となり、後にテクノが生まれることになる。この番組は、Kraftwerkなどの電子音楽から、Prince、Parliament-Funkadelicまでを流していた。

ニューヨークでは、Mantronixが続いた。イギリスでは、この音はブレイクダンス文化と結びつきながら広まった。1983年に始まったコンピレーション「Street Sounds Electro」は、イギリスでのシーンの広がりを示す代表的なシリーズである。

しかし1980年代半ばには、流行としては急速に古びる。ビートが硬く簡素になり、ロックの要素も入った新しいヒップホップが人気を集め、のちにサンプリング主体の作品へ移っていった。

それでも、その後に残したものは非常に大きかった。TR-808の低音は、現在のトラップやポップスに至るまで使われ続けている。声を機械で加工するという発想は、ヒップホップやR&amp;B、ポップスなどでも使われ続けた。そして、機械で作られたダンス音楽という考え方そのものが、テクノやマイアミ・ベースなどに影響を与えた。</p>
