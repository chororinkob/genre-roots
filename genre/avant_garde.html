<h1>Avant-Garde（アヴァンギャルド）とは</h1>
<p>調性、拍節、旋律、楽器の正しい奏法、演奏者と聴衆の役割分担といった、音楽を成り立たせてきた前提そのものを疑い、解体してみせる音楽。ピアノの弦にボルトやゴムや紙を挟んで打楽器のような響きに変えるプリペアド・ピアノ、弦を弓で擦らず駒の</p>
<p>調性、拍節、旋律、楽器の正しい奏法、演奏者と聴衆の役割分担といった、音楽を成り立たせてきた前提そのものを疑い、解体してみせる音楽。ピアノの弦にボルトやゴムや紙を挟んで打楽器のような響きに変えるプリペアド・ピアノ、弦を弓で擦らず駒の裏側や糸巻きを鳴らす特殊奏法、サックスのキーを叩く金属音やリードを通る息の音だけを取り出す拡張奏法など、楽器から本来の音以外を引き出す技法が中心に据えられる。楽譜も五線譜とは限らず、図形や色面で描かれた図形楽譜、言葉だけで書かれた指示書が用いられ、演奏のたびに結果が変わる不確定性が積極的に取り込まれる。拍子記号もテンポ表示も持たない曲がある一方で、人間の身体では正確に演奏できないほど細分化されたリズムを書き込む曲もあり、両極端が同じ棚に並ぶ。テープの逆回転や切り貼り、アンプのフィードバック、街頭や工場の環境音の録音といった電子的手法も1950年代から使われてきた。聴いて心地よいかどうかは評価の軸ではなく、これは音楽なのかと聴き手に考えさせること自体が作品の目的になる点が、単に実験的な響きを持つだけのロックやジャズと決定的に違う。演奏の場もコンサートホールに限らず、画廊、倉庫、路上、美術館の展示室へと広がり、観客が途中で怒って退席することすら作品の一部として想定されている。</p>
<h2>成り立ち</h2><p>起点のひとつは1913年、イタリアの未来派画家Luigi Russoloが発表した宣言『騒音芸術』である。彼は都市の機械音や騒音こそ新しい音楽の素材だと主張し、イントナルモーリと呼ぶ手回し式の騒音発生装置を自作して演奏会を開き、聴衆と乱闘になった。フランス出身でアメリカに渡ったEdgard Varèseは、打楽器とサイレンだけで書かれた『イオニザシオン』(1931)で、旋律ではなく音響の塊そのものを作曲の対象に据えた。決定的な役割を果たしたのはJohn Cageで、1940年、狭い舞台に打楽器群を置けない事情からピアノの弦に異物を挟むプリペアド・ピアノを考案し、やがて中国の易経のくじで音高を決める偶然性の音楽へ進んだ。1952年八月、ニューヨーク州ウッドストックで初演された『4分33秒』は、演奏者David Tudorがピアノの蓋を開け閉めするだけで一音も出さない作品で、会場に満ちる雨音や咳払いこそが音楽だと宣言した。聴衆は激怒し、この曲は今も論争の的であり続けている。1960年代にはGeorge Maciunasが主導した国際的な芸術運動Fluxusが、音楽と美術と行為の境界を消す作品を量産し、Yoko Onoは観客に自分の服をハサミで切らせる『Cut Piece』(1964)を発表した。ドイツのダルムシュタット夏季現代音楽講習会はKarlheinz StockhausenやPierre Boulezを輩出し、電子音響と厳格な数理的作曲法の拠点となった。ロックの側からはFrank Zappaが『Freak Out!』(1966)でテープ編集とコラージュを持ち込み、Captain Beefheartの『Trout Mask Replica』(1969)は拍もキーもばらばらに聞こえる問題作となったが、その録音のためにバンドを一軒家に半ば軟禁し極限状態で練習させたという証言が後年明らかになっている。日本では1960年に小杉武久らがグループ音楽を結成して集団即興を行い、その流れから灰野敬二、大友良英といった演奏家が国際的に知られるようになった。ニューヨークではJohn Zornが即興演奏の拠点The Kitchenやニッティング・ファクトリーを舞台に活動し、現在も各地の小さな会場や美術館の企画展を主な受け皿として、この音楽は続いている。</p>
