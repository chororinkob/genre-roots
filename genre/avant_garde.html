<h1>Avant-Garde（アヴァンギャルド）とは</h1>
<p>アヴァンギャルドは、音楽を成り立たせてきた前提そのものを疑い、解体してみせる音楽だ。疑う対象は、調性（曲の中心になる音）、拍節（拍の区切り）、旋律、楽器の正しい奏法、演奏者と聴衆の役割分担といったものである。 中心になるのは、楽器</p>
<p>アヴァンギャルドは、音楽を成り立たせてきた前提そのものを疑い、解体してみせる音楽だ。疑う対象は、調性（曲の中心になる音）、拍節（拍の区切り）、旋律、楽器の正しい奏法、演奏者と聴衆の役割分担といったものである。

中心になるのは、楽器から本来の音以外を引き出す技法だ。ピアノの弦にボルト、ネジ、ゴム、厚紙などを挟んで、打楽器のような響きに変えるのが、プリペアド・ピアノである。弦を弓で擦らず、駒の裏側や糸巻きを鳴らす特殊奏法もある。サックスのキーを叩く金属音や、リードを通る息の音だけを取り出す拡張奏法（楽器の普通でない鳴らし方）もある。

リズムと楽譜も、ふつうの音楽とは違う。拍子記号もテンポ表示も持たない曲がある一方で、人間の身体では正確に演奏できないほど細分化されたリズムを書き込む曲もあるとされる。両極端が同じ棚に並ぶのだ。楽譜も五線譜とは限らない。図形や色面で描かれた図形楽譜や、言葉だけで書かれた指示書が用いられる。演奏のたびに結果が変わる不確定性（結果を決めきらないこと）も、積極的に取り込まれる。

電子的な手法もある。テープの逆回転や切り貼り、アンプのフィードバック（音が回り込んで鳴る唸り）、街頭や工場の環境音の録音といったものだ。1939年のケージ作品で電気機器を楽器として使い、1948年にシェフェールがレコード盤で、1949〜50年頃からテープで音を加工した。アンプのフィードバックを意図的に使う例は、1960年代前後から。

これは音楽なのかと問うこと自体が主眼になる作品も多い（例：ケージ『4分33秒』）。『4分33秒』では、聴衆の話し声や退席の物音も、ケージによれば作品中に聞こえる音の一部だった。

演奏の場も、コンサートホールに限らない。画廊、倉庫、路上、美術館の展示室へと広がった。</p>
<h2>成り立ち</h2><p>起点のひとつは、1913年だ。イタリアの未来派画家Luigi Russoloが、宣言『騒音芸術』を発表した。彼は、都市の機械音や騒音こそ新しい音楽の素材だと主張した。助手のウーゴ・ピアッティと共に、イントナルモーリと呼ぶ騒音発生装置を製作して、演奏会を開いた。この装置は、クランクとレバーで操作する。

1914年4月21日、ミラノでイントナルモーリ楽団全体による最初の公開演奏会が開かれ、暴動になった。1917年の演奏会でも、聴衆の暴力があった。

フランス出身でアメリカに渡ったEdgard Varèseは、『イオニザシオン』(1929〜31年作曲、1933年初演)を書いた。13人の奏者による打楽器アンサンブルで、終盤にはピアノ、チャイム、グロッケンシュピールなどの音程楽器も入る。この曲で彼は、旋律ではなく音響の塊そのものを、作曲の対象に据えた。

決定的な役割を果たしたのは、John Cageだ。1938〜40年頃、狭い舞台に打楽器群を置けない事情から、ピアノの弦に異物を挟むプリペアド・ピアノを考案したとされる。やがて彼は、中国の易経のコイン投げで、音高だけでなく、音の長さ、強弱、テンポなども決める、偶然性の音楽へ進んだ。

1952年八月、ニューヨーク州ウッドストックで『4分33秒』が初演された。演奏者David Tudorは、ピアノの蓋を開け閉めするだけで、一音も出さない。会場に満ちる風や雨の音、聴衆のざわめきや退席の音こそが音楽だと、この作品は宣言した。聴衆は困惑して反発し、この曲は今も論争の的であり続けているとも言われる。

1960年代には、George Maciunasが主導した国際的な芸術運動Fluxusが、音楽と美術と行為の境界を消す作品を量産した。Yoko Onoは、観客に自分の服をハサミで切らせる『Cut Piece』(1964)を発表した。

ドイツのダルムシュタット夏季現代音楽講習会では、Karlheinz StockhausenやPierre Boulezが中心的な作曲家として頭角を現した。ここは、厳格な数理的作曲法の拠点となった。セリー音楽とは、音の並びを数理的に決める作曲法のことだ。電子音楽の中心は、ケルンの、1951年に北西ドイツ放送（現WDR）内に設立された電子音楽スタジオだった。

ロックの側からは、Frank Zappaが『Freak Out!』(1966)で、テープ編集とコラージュ（異なる素材の貼り合わせ）を持ち込んだ。Captain Beefheartの『Trout Mask Replica』(1969)は、拍もキーもばらばらに聞こえる問題作となった。その録音のために、バンドを一軒家に、家から出ることを制限し極限状態で練習させたという元メンバーの証言が、後年明らかになっている。

日本では、1960年に小杉武久ら6名が、日本初とされる即興音楽集団であるグループ・音楽（Group Ongaku）を結成（5月説と8月頃説がある）して、集団即興を行った。

ニューヨークでは、実験芸術全般の拠点としてThe Kitchenがあった。John Zornは、ニッティング・ファクトリーなどの会場を舞台に活動した。現在も、専用の演奏空間やレーベル（The Stone、Tzadikなど）にも支えられて、この音楽は続いている。</p>
