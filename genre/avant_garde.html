<h1>Avant-Garde（アヴァンギャルド）とは</h1>
<p>調性（曲の中心になる音）、拍節（拍の区切り）、旋律、楽器の正しい奏法、演奏者と聴衆の役割分担といった、音楽を成り立たせてきた前提そのものを疑い、解体してみせる音楽。ピアノの弦にボルト、ネジ、ゴム、厚紙などを挟んで打楽器のような響き</p>
<p>調性（曲の中心になる音）、拍節（拍の区切り）、旋律、楽器の正しい奏法、演奏者と聴衆の役割分担といった、音楽を成り立たせてきた前提そのものを疑い、解体してみせる音楽。ピアノの弦にボルト、ネジ、ゴム、厚紙などを挟んで打楽器のような響きに変えるプリペアド・ピアノ、弦を弓で擦らず駒の裏側や糸巻きを鳴らす特殊奏法、サックスのキーを叩く金属音やリードを通る息の音だけを取り出す拡張奏法（楽器の普通でない鳴らし方）など、楽器から本来の音以外を引き出す技法が中心に据えられる。楽譜も五線譜とは限らず、図形や色面で描かれた図形楽譜、言葉だけで書かれた指示書が用いられ、演奏のたびに結果が変わる不確定性（結果を決めきらないこと）が積極的に取り込まれる。拍子記号もテンポ表示も持たない曲がある一方で、人間の身体では正確に演奏できないほど細分化されたリズムを書き込む曲もあり、両極端が同じ棚に並ぶ。テープの逆回転や切り貼り、街頭や工場の環境音の録音といった電子的手法は、1939年のケージ作品で電気機器が楽器として使われ、1948年にシェフェールがレコード盤で、1949〜50年頃からテープで音を加工したことに始まる。アンプのフィードバック（音が回り込んで鳴る唸り）を意図的に使う例は、1960年代前後からである。これは音楽なのかと問うこと自体が主眼になる作品も多い（例：ケージ『4分33秒』）。演奏の場もコンサートホールに限らず、画廊、倉庫、路上、美術館の展示室へと広がり、『4分33秒』では、聴衆の話し声や退席の物音も、ケージによれば作品中に聞こえる音の一部だった。</p>
<h2>成り立ち</h2><p>起点のひとつは1913年、イタリアの未来派画家Luigi Russoloが発表した宣言『騒音芸術』である。彼は都市の機械音や騒音こそ新しい音楽の素材だと主張し、助手のウーゴ・ピアッティと共に、イントナルモーリと呼ぶ、クランクとレバーで操作する騒音発生装置を製作して演奏会を開いた。1914年4月21日、ミラノでイントナルモーリ楽団全体による最初の公開演奏会が開かれて暴動になり、1917年の演奏会でも聴衆の暴力があった。フランス出身でアメリカに渡ったEdgard Varèseは、13人の奏者による打楽器アンサンブル（終盤にはピアノ、チャイム、グロッケンシュピールなどの音程楽器も入る）で書かれた『イオニザシオン』(1929〜31年作曲、1933年初演)で、旋律ではなく音響の塊そのものを作曲の対象に据えた。決定的な役割を果たしたのはJohn Cageで、1938〜40年頃、狭い舞台に打楽器群を置けない事情からピアノの弦に異物を挟むプリペアド・ピアノを考案したとされ、やがて中国の易経のコイン投げで、音高だけでなく音の長さ、強弱、テンポなども決める偶然性の音楽へ進んだ。1952年八月、ニューヨーク州ウッドストックで初演された『4分33秒』は、演奏者David Tudorがピアノの蓋を開け閉めするだけで一音も出さない作品で、会場に満ちる風や雨の音、聴衆のざわめきや退席の音こそが音楽だと宣言した。聴衆は困惑して反発し、この曲は今も論争の的であり続けている。1960年代にはGeorge Maciunasが主導した国際的な芸術運動Fluxusが、音楽と美術と行為の境界を消す作品を量産し、Yoko Onoは観客に自分の服をハサミで切らせる『Cut Piece』(1964)を発表した。ドイツのダルムシュタット夏季現代音楽講習会は、Karlheinz StockhausenやPierre Boulezが中心的な作曲家として頭角を現した場であり、厳格な数理的作曲法（セリー音楽＝音の並びを数理的に決める作曲法）の拠点となった。電子音楽の中心は、1951年に北西ドイツ放送（現WDR）内に設立された、ケルンの電子音楽スタジオだった。ロックの側からはFrank Zappaが『Freak Out!』(1966)でテープ編集とコラージュ（異なる素材の貼り合わせ）を持ち込み、Captain Beefheartの『Trout Mask Replica』(1969)は拍もキーもばらばらに聞こえる問題作となったが、その録音のために、元メンバーの証言によれば、バンドは一軒家で家から出ることを制限され、極限状態で練習させられたという。日本では1960年に小杉武久ら6名が、日本初とされる即興音楽集団であるグループ・音楽（Group Ongaku）を結成し（5月説と8月頃説がある）、集団即興を行った。ニューヨークでは実験芸術全般の拠点としてThe Kitchenがあり、John Zornはニッティング・ファクトリーなどの会場を舞台に活動し、現在も専用の演奏空間やレーベル（The Stone、Tzadikなど）にも支えられて、この音楽は続いている。</p>
<h2>代表曲</h2><ul><li>Heroin (The Velvet Underground)</li><li>4'33&quot; (John Cage)</li><li>O Superman (Laurie Anderson)</li><li>Sunday Morning (The Velvet Underground)</li><li>Revolution 9 (The Beatles)</li><li>Nightclubbing (Iggy Pop)</li><li>Trout Mask Replica (Captain Beefheart)</li><li>Baby's On Fire (Brian Eno)</li><li>Sister Ray (The Velvet Underground)</li><li>Hello Skinny (The Residents)</li><li>Frankie Teardrop (Suicide)</li><li>The Litanies of Satan (Diamanda Galás)</li><li>Death Disco (Public Image Ltd)</li><li>Ella Guru (Captain Beefheart)</li><li>Frank's Wild Years (Tom Waits)</li><li>Fly (Yoko Ono)</li><li>Expressway to Yr Skull (Sonic Youth)</li><li>The Electrician (Scott Walker)</li><li>Non-Alignment Pact (Pere Ubu)</li><li>Warszawa (David Bowie &amp; Brian Eno)</li></ul>
