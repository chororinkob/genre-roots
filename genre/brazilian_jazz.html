<h1>Brazilian Jazz（ブラジリアンジャズ）とは</h1>
<p>ボサノヴァやサンバのリズムと和声を、ジャズの即興演奏と結びつけた音楽。土台となるのはサンバの2拍子で、パンデイロ(小型のタンバリン)、スルド(低音の大太鼓)、アゴゴ(2連の鉄鐘)、カバサ、タンボリンといった打楽器群が刻む16分音符</p>
<p>ボサノヴァやサンバのリズムと和声を、ジャズの即興演奏と結びつけた音楽。土台となるのはサンバの2拍子で、パンデイロ(小型のタンバリン)、スルド(低音の大太鼓)、アゴゴ(2連の鉄鐘)、カバサ、タンボリンといった打楽器群が刻む16分音符の細かい網目の上に、ドラムセットが軽いブラシワークで加わる。ギターはナイロン弦のガットギターで、親指が低音の拍を押さえ、残りの指が裏拍にコードを置く「バチーダ」と呼ばれる奏法をとり、この右手だけでリズムと和声を同時に成立させる。和声はメジャーセブンス、ナインス、シャープイレブンといったテンションを常用し、内声が半音でずり下がる動きや、同じ旋律を支える和音を次々に付け替える再和声化が多用される。ジャズ側からはトランペット、テナーサックス、フルート、ヴィブラフォンが加わり、アドリブはビバップ的な速いフレーズよりも旋律を歌わせる方向へ傾く。歌は囁くように音量を抑え、ヴィブラートをかけずに平坦に歌うのが定型で、力強く張り上げる北米のジャズヴォーカルとは対照的である。テンポは中庸で、熱帯の午後のような弛緩した質感が終始優先される。</p>
<h2>成り立ち</h2><p>1962年、ブラジルの作曲家Antonio Carlos Jobim、ギタリストJoão Gilbertoらが確立したボサノバは、すでにアメリカのジャズミュージシャンたちの間で強い関心を集めていた。1964年、アメリカのサックス奏者Stan GetzとJoão Gilbertoが共演したアルバム『Getz/Gilberto』は、Jobim作曲・Gilbertoの妻Astrud Gilbertoが英語詞で歌う「The Girl from Ipanema(イパネマの娘)」を大ヒットさせ、ボサノバとジャズを本格的に結びつけた記念碑的作品となった。以後、Jobimの数々の楽曲は、原曲のブラジルでの人気を超えて、アメリカのジャズミュージシャンにとっての定番曲(スタンダード)としても演奏され続けることになった。ブラジルの作曲家・マルチ楽器奏者Hermeto Pascoalは、その桁外れの音楽的発想力から「音の魔術師」と称され、Miles Davisにも作品を提供した。パーカッショニストのAirto Moreiraとボーカリストの妻Flora Purimは、1970年代のアメリカのジャズ・フュージョンシーンに深く入り込み、チック・コリアのバンド「Return to Forever」などで活躍した。作曲家Sérgio Mendesは、代表曲「Mas Que Nada」(1966年録音のヒットバージョン)などで、ブラジル音楽をアメリカのポップスの聴衆にまで届けた立役者である。アメリカのギタリストPat Methenyも、こうしたブラジル音楽の語法を自身のジャズに深く取り込んだミュージシャンの一人である。</p>
<h2>代表曲</h2><ul><li>Mas Que Nada (Sérgio Mendes)</li><li>Samba de Uma Nota Só (João Gilberto)</li><li>Wave (Antonio Carlos Jobim)</li></ul>
