<h1>Brazilian Jazz（ブラジリアンジャズ）とは</h1>
<p>ボサノヴァやサンバのリズムと和声を、ジャズの即興演奏と結びつけた音楽。土台となるのはサンバの2拍子で、ピアノ・ベース・ドラムのコンボが基本で、ドラムはサンバのパターンをシンバルなどで刻む。ボサノヴァ寄りの曲では打楽器を絞る。ギター</p>
<p>ボサノヴァやサンバのリズムと和声を、ジャズの即興演奏と結びつけた音楽。土台となるのはサンバの2拍子で、ピアノ・ベース・ドラムのコンボが基本で、ドラムはサンバのパターンをシンバルなどで刻む。ボサノヴァ寄りの曲では打楽器を絞る。ギターはナイロン弦のガットギターで、親指が低音の拍を押さえ、残りの指が裏拍にコードを置く「バチーダ」と呼ばれる奏法をとり、右手のパターンでリズムを、左手の押さえと合わせて和声を成立させる。和声はメジャーセブンス、ナインス、シャープイレブンといったテンションを常用し、内声が半音でずり下がる動きや、同じ旋律を支える和音を次々に付け替える再和声化が多用される。ジャズ側からはトランペット、テナーサックス、フルート、ヴィブラフォンが加わり、ボサノヴァ系は抑制した歌唱が特徴だが、サンバ・ジャズは即興色が強く、テンポ・質感も幅がある。</p>
<h2>成り立ち</h2><p>サンバ・ジャズは1950年代末〜60年代初頭にリオで形成された。1950年代末（João Gilbertoの『Chega de Saudade』は1959年3月発売（8〜12日頃）。表題曲のシングルは1958年8月）に、ブラジルの作曲家Antonio Carlos Jobim、ギタリストJoão Gilbertoらが確立したボサノバは、1962年にはアメリカでブームとなり、ジャズミュージシャンたちの間で強い関心を集めていた。アメリカでのボサノバ熱の起点は、Stan GetzとCharlie Byrdの『Jazz Samba』（1962年）である。1963年3月に録音され、1964年3月に発売された、GetzとJoão Gilbertoのアルバム『Getz/Gilberto』は、Jobim作曲・João Gilbertoの妻Astrud Gilbertoが英語詞で歌う「The Girl from Ipanema(イパネマの娘)」を大ヒットさせた記念碑的作品となった。以後、Jobimの数々の楽曲は、原曲のブラジルでの人気を超えて、アメリカのジャズミュージシャンにとっての定番曲(スタンダード)としても演奏され続けることになった。ブラジルの作曲家・マルチ楽器奏者Hermeto Pascoalは、その桁外れの音楽的発想力から「音の魔術師」と称され、Miles Davisにも作品を提供した。パーカッショニストのAirto Moreiraとボーカリストの妻Flora Purimは、1970年代のアメリカのジャズ・フュージョンシーンに深く入り込み、チック・コリアのバンド「Return to Forever」などで活躍した。ピアニスト・バンドリーダー・編曲家のSérgio Mendesは、Jorge Ben作曲の「Mas Que Nada」（1962年に初録音され、1963年に本人が『Samba Esquema Novo』で録音）を、自身のBrasil '66で1966年にカバーし、米ポップチャート47位、イージーリスニング4位のヒットとなって世界的に知られる曲にするなどして、ブラジル音楽をアメリカのポップスの聴衆にまで届けた立役者である。アメリカのギタリストPat Methenyも、こうしたブラジル音楽の語法を自身のジャズに深く取り込んだミュージシャンの一人である。</p>
<h2>代表曲</h2><ul><li>Mas Que Nada (Sérgio Mendes)</li><li>Wave (Antonio Carlos Jobim)</li><li>Consolação (Baden Powell)</li><li>Karina (Domingo no Grajaú) (Arthur Verocai)</li><li>Prelude to the Afternoon of a Faun (Eumir Deodato)</li><li>Coisa Feita (Toots Thielemans)</li><li>Dona Olimpia (Azymuth)</li><li>Samba de Uma Nota Só (João Gilberto)</li><li>It's Only Love (Tania Maria)</li><li>Loro (Egberto Gismonti)</li><li>Tudo Que Você Podia Ser (Azymuth)</li></ul>
