<h1>Brazilian Jazz（ブラジリアンジャズ）とは</h1>
<p>ボサノヴァやサンバのリズムと和声を、ジャズの即興演奏と結びつけた音楽だ。 基本の編成は、ピアノ・ベース・ドラムの小編成（コンボ）である。ジャズ側からは、トランペット、サックス、トロンボーン、フルート、オルガン、エレクトリックピアノ</p>
<p>ボサノヴァやサンバのリズムと和声を、ジャズの即興演奏と結びつけた音楽だ。

基本の編成は、ピアノ・ベース・ドラムの小編成（コンボ）である。ジャズ側からは、トランペット、サックス、トロンボーン、フルート、オルガン、エレクトリックピアノが加わる。

ギターは、ナイロン弦のガットギターを使う。奏法は「バチーダ」と呼ばれる。親指が各拍の低音を刻み、他の指がシンコペーション（拍の頭と裏の両方）でコードを弾く。右手のパターンでリズムを作り、左手の押さえと合わせて和声を成り立たせる。

和声では、メジャーセブンスの和音や、ナインス、シャープイレブンなどの、基本の和音に加える響きの飾り（テンション）を日常的に使う。内声が半音でずり下がる動きもよく使われる。同じ旋律を支える和音を次々に付け替える技法（再和声化）も多い。

リズムの土台は、サンバの2拍子だ。ドラムは、サンバのパターンをシンバルなどで刻む。ボサノヴァ寄りの曲では、打楽器を絞る。

歌は、ボサノヴァ系では抑えた歌い方が特徴だ。一方、サンバ・ジャズは即興の色が強く、テンポや質感にも幅がある。</p>
<h2>成り立ち</h2><p>1950年代末から60年代初めにかけて、リオでサンバ・ジャズが形づくられた。ブラジル側にも、Beco das Garrafasなどを舞台に、Edison MachadoやTamba Trioらのシーンがあった。

同じ1950年代末には、ブラジルの作曲家Antonio Carlos Jobimや、ギタリストJoão Gilbertoらが、ボサノバのスタイルを固めた。João Gilbertoの『Chega de Saudade』は1959年3月発売で、表題曲のシングルは1958年8月に出ている。

ボサノバは、1962年にはアメリカでブームとなり、ジャズミュージシャンたちの強い関心を集めていた。アメリカでボサノバ熱が広がるきっかけとなったのが、Stan GetzとCharlie Byrdの『Jazz Samba』（1962年）である。

続いて、GetzとJoão Gilbertoのアルバム『Getz/Gilberto』が、1963年3月に録音され、1964年3月に発売された。この作品は記念碑的なアルバムとなった。Jobim作曲の「The Girl from Ipanema(イパネマの娘)」を、当時João Gilbertoの妻だったAstrud Gilbertoが英語詞で歌い、大ヒットさせたのである。以後、Jobimの数々の楽曲は、ブラジル国内にとどまらず、アメリカのジャズ・スタンダードにもなった。

ブラジルの作曲家でマルチ楽器奏者のHermeto Pascoalは、「音の魔術師」の異名で知られ、Miles Davisにも作品を提供した。

1970年代には、パーカッショニストのAirto Moreiraと、ボーカリストで妻のFlora Purimが、アメリカのジャズ・フュージョンシーンに深く入り込んだ。彼らは、チック・コリアのバンド「Return to Forever」などで活躍した。

ピアニスト・バンドリーダー・編曲家のSérgio Mendesは、ブラジル音楽をアメリカのポップスの聴衆にまで届けた立役者である。その例が、Jorge Ben作曲の「Mas Que Nada」だ。この曲は1962年に初めて録音され、1963年には作者本人が『Samba Esquema Novo』で録音した。彼は1966年、自身のBrasil '66でこの曲をカバーした。それが米ポップチャート47位、イージーリスニング4位のヒットとなり、曲を米国で広く知られるものにした。

アメリカのギタリストPat Methenyも、こうしたブラジル音楽の語法を、自分のジャズに深く取り込んだミュージシャンの一人である。</p>
<h2>代表曲</h2><ul><li>Mas Que Nada (Sérgio Mendes)</li><li>Wave (Antonio Carlos Jobim)</li><li>Consolação (Baden Powell)</li><li>Karina (Domingo no Grajaú) (Arthur Verocai)</li><li>Prelude to the Afternoon of a Faun (Eumir Deodato)</li><li>Coisa Feita (Toots Thielemans)</li><li>Dona Olimpia (Azymuth)</li><li>Samba de Uma Nota Só (João Gilberto)</li><li>It's Only Love (Tania Maria)</li><li>Loro (Egberto Gismonti)</li><li>Tudo Que Você Podia Ser (Azymuth)</li></ul>
