<h1>Synth Pop（シンセポップ）とは</h1>
<p>シンセポップは、シンセサイザーとドラムマシンを中心に伴奏を組み立て、覚えやすい旋律を歌に乗せるポップスのスタイルだ。 中心の楽器はシンセサイザーである。ドラムマシンやシーケンサーを多用する点が特徴になる。使われる機材は、Rolan</p>
<p>シンセポップは、シンセサイザーとドラムマシンを中心に伴奏を組み立て、覚えやすい旋律を歌に乗せるポップスのスタイルだ。

中心の楽器はシンセサイザーである。ドラムマシンやシーケンサーを多用する点が特徴になる。使われる機材は、Roland Juno-60、Korg MS-20、Sequential Circuits Prophet-5、Yamaha DX7といったシンセサイザーだ。リズムマシンでは、Roland TR-808やLinnDrumなどが使われる。さらに、音の並びを自動で繰り返すシーケンサーも欠かせない。

ベースは、シンセの低音を8分音符で機械的に刻むことが多い。上物（メロディーなど上に重ねる音）には、減衰（音が消えていくこと）の早い硬い音色を使う。逆に、長く伸びるパッド（持続する背景の音）を重ねることもある。

和声は、単純な反復リフを中心とし、和声進行が乏しいことも多い。そのかわりに、音色の変化と間の取り方で表情をつける。テンポはおおむね120〜145BPM前後だ。

歌唱は、初期は「抑揚の乏しい無機質な歌唱」と評される。1980年代になると、「感情的で、ときにオペラ的な歌手」として Marc Almond、Alison Moyet、Annie Lennox が挙げられる。多重録音した合唱風のコーラスが、対比として置かれる。

歌詞は、都市の孤独、監視社会、機械化された労働、恋愛の空虚さなど、冷たさを含む主題を扱うことが多いとされる。

テクノポップとほぼ同義に使われる。ただし、ダンス音楽としてのテクノは、踊らせる機能に特化したとされる。それに対し、シンセポップはあくまで歌の形式を保つ点で異なるとされる。</p>
<h2>成り立ち</h2><p>1970年代後半、パンクの後を受けて、日本と英国でほぼ同時期に生まれたとされる。

Kraftwerkをはじめ、Eno、Moroder、Bowieなどの影響下にあった。1974年の「Autobahn」は、主にシンセサイザーとドラムマシンで録音し、フルートとギターを随所に使用したアルバムだ。1978年の「The Man-Machine」は、シンセサイザー、ヴォコーダー、シーケンサー、電子ドラム（BartosとFlür）によるアルバムである。

もう一つの前提は、技術と経済である。1970年代末に安価なアナログ・シンセサイザーが出回った。演奏技術のない若者でも、一人で伴奏を作れるようになった。

1977年に結成されたシェフィールドのThe Human Leagueは、1978年に初シングル「Being Boiled」を出す。ロンドンではThe Normalが活動を始める。バジルドンでは、1980年にDepeche Modeの母体にあたるComposition of Soundが結成された。The Normalの正体は、後にMuteを率いるDaniel Millerだった。彼が自作の一枚を出すために設立したレーベルMuteは、その後Depeche Modeを擁し、この分野の中心になった。

1979年、Gary Numanが率いたTubeway Armyの「Are 'Friends' Electric?」が全英1位となる。続くソロ名義の「Cars」も成功した。シンセサイザーが主役でも、大衆的に売れることが証明されたのだ。

1981年は決定的な年だった。The Human Leagueは、中心人物の脱退後、街のディスコで見つけた素人の少女2人を加入させる。アルバム「Dare」と「Don't You Want Me」で、世界的な成功を収めた。同年、Soft Cellの「Tainted Love」、Depeche Modeの「Just Can't Get Enough」、Orchestral Manoeuvres in the Darkの「Souvenir」が並んだ。シンセポップは、英国チャートの主流になった。1980年にシェフィールドで結成されたHeaven 17（1981年に初のアルバム）や、1981年後半に結成されたYazoo（1982年に初のシングル）が続く。

日本では、1978年に細野晴臣・坂本龍一・高橋幸宏がYellow Magic Orchestraを結成した。同じ流れと響き合い、東洋的な旋律と自動演奏を組み合わせて、国際的に評価された。

しかし、1983年にYamaha DX7が発売されると、音色は金属的で硬いものへ変わった。シンセポップの音は、1980年代の商業音楽全体に吸収され、固有性を失っていく。1980年代半ば以降は、Depeche Modeがより暗く硬質な方向へ進んだ。一方、Pet Shop Boysが皮肉と洗練を持ち込み、このスタイルは生き延びた。

エレクトロクラッシュ（電子音ポップとダンスを混ぜた流れ）は、1990年代後半に生まれた。2000年代前半からは、シンセポップの復興期に入る。エレクトロクラッシュの代表は、I-F、DJ Hell、Miss Kittin &amp; The Hacker、Fischerspoonerである。Ladytronは、2000年代前半のシンセポップ再評価の流れに挙げられた。ただし、エレクトロクラッシュとの括りは、本人たちが否定している。2000年代後半にはLa Roux、2010年代にはChvrchesらによる再評価が起こった。現在もシンセポップは、ポップスの基本要素の一つであり続けている。</p>
