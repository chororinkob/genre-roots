<h1>Synth Pop（シンセポップ）とは</h1>
<p>シンセサイザーとドラムマシンを中心に伴奏を組み立て、覚えやすい旋律を歌に乗せるポップスの様式。シンセサイザーを中心楽器とし、ドラムマシンやシーケンサーを多用する点が特徴になる。使われる機材はRoland Juno-60やKorg </p>
<p>シンセサイザーとドラムマシンを中心に伴奏を組み立て、覚えやすい旋律を歌に乗せるポップスの様式。シンセサイザーを中心楽器とし、ドラムマシンやシーケンサーを多用する点が特徴になる。使われる機材はRoland Juno-60やKorg MS-20、Sequential Circuits Prophet-5、Yamaha DX7といったシンセサイザーと、Roland TR-808やLinnDrumなどのリズムマシン、そして音の並びを自動で繰り返すシーケンサー。ベースはシンセの低音を8分音符で機械的に刻み、上物（メロディーなど上に重ねる音）は減衰（音が消えていくこと）の早い硬い音色や、逆に長く伸びるパッド（持続する背景の音）を重ねる。和声は、単純な繰り返しのリフ（短く決まった旋律）が中心で、コードの進み方が乏しいことも多いかわりに、音色の変化と間の取り方で表情をつける。テンポは曲によって幅があり、おおむね120〜145BPM前後である。歌唱は、初期には抑揚の乏しい、機械のような声が目立ったが、1980年代にはMarc Almond、Alison Moyet、Annie Lennoxのような、感情が豊かでときにオペラのように歌い上げる歌手が特徴となり、多重録音した合唱風のコーラスが対比として置かれる。歌詞は、人とのつながりから切り離された孤立、都会で人間関係が薄れていくこと、気持ちの冷たさや空虚さといった主題を扱うことが多い。テクノポップとほぼ同じ意味で使われるが、テクノポップという言い方は、とくに日本の音楽の動きを指して使われることが多い。この言葉は、1978年にYuzuru Agiが、KraftwerkのThe Man-Machineを論評したときに使ったのが始まりとされる。</p>
<h2>成り立ち</h2><p>1970年代後半、パンクの後を受けて、日本と英国でほぼ同時期に生まれたと説明されることが多い。Kraftwerkをはじめ、Eno、Moroder、Bowieなどの影響下にあり、1974年の「Autobahn」は、シンセサイザーとドラムマシンを主体に録音され、ヴァイオリン、ギター、フルートなどの生楽器も一部に使われたアルバムである。1978年の「The Man-Machine」は、シンセサイザー、ヴォコーダー（声を機械で加工する装置）、シーケンサー（音の並びを自動で繰り返す機械）と、電子ドラム（叩いて鳴らす電子の太鼓）で作られたアルバムで、生楽器は使われていない。もう一つの前提は技術と経済である。1970年代末に安価なアナログ・シンセサイザーが出回り、演奏技術のない若者でも一人で伴奏を作れるようになった。1977年に結成されたシェフィールドのThe Human Leagueは1978年に初シングル「Being Boiled」を出し、ロンドンではThe Normalが活動を始める。バジルドンでは、1980年にDepeche Modeの母体にあたるComposition of Soundが結成される。The Normalの正体は、当時は映画編集者で、のちにレーベルMuteを率いるDaniel Millerである。彼が自作の一枚を出すために設立したそのレーベルは、その後Depeche Modeを擁してこの分野の中心になった。1979年、Gary Numanが率いたTubeway Armyの「Are 'Friends' Electric?」が全英1位となり、続くソロ名義の「Cars」も成功して、シンセサイザーが主役でも大衆的に売れることが証明される。1981年は決定的な年だった。The Human Leagueは、1980年にMarshとWareが脱退したあと、街のディスコで見つけた、当時17歳で歌った経験のない少女2人を加入させ、アルバム「Dare」と「Don't You Want Me」で世界的な成功を収める。同年、Soft Cellの「Tainted Love」、Depeche Modeの「Just Can't Get Enough」、Orchestral Manoeuvres in the Darkの「Souvenir」が並び、シンセポップは英国チャートの主流になった。1980年にシェフィールドで結成されたHeaven 17（1981年に初のアルバム）や、1981年後半に結成されたYazoo（1982年に初のシングル）が続く。日本では1978年に細野晴臣・坂本龍一・高橋幸宏が結成したYellow Magic Orchestraが同じ潮流と共振し、東洋的な旋律と自動演奏を組み合わせて国際的に評価された。1983年にYamaha DX7が発売されると音色は金属的で硬いものへ変わり、シンセポップの音は1980年代の商業音楽全体に吸収されて固有性を失っていく。1980年代半ば以降、Depeche Modeがより暗く硬質な方向へ進む一方、Pet Shop Boysが皮肉と洗練を持ち込み、様式は生き延びた。2000年代前半にシンセポップが見直されたときにはLadytronなどが挙げられ（本人たちは、1990年代後半に始まったエレクトロクラッシュという、電子音ポップとダンスを混ぜた流れと一緒にされることを断っている）、2000年代後半にはLa Roux、2010年代にはChvrchesらによる再評価が起こり、現在もポップスの基本要素の一つであり続けている。</p>
