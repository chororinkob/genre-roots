<h1>Synth Pop（シンセポップ）とは</h1>
<p>シンセサイザーとドラムマシンだけで伴奏を組み立て、覚えやすい旋律を歌に乗せるポップスの様式。ギターとドラムセットを排し、音色の全部を電子的に作る点が最大の特徴になる。使われる機材はRoland Juno-60やKorg MS-20</p>
<p>シンセサイザーとドラムマシンだけで伴奏を組み立て、覚えやすい旋律を歌に乗せるポップスの様式。ギターとドラムセットを排し、音色の全部を電子的に作る点が最大の特徴になる。使われる機材はRoland Juno-60やKorg MS-20、Sequential Circuits Prophet-5、Yamaha DX7といったシンセサイザーと、Roland TR-808やLinnDrumなどのリズムマシン、そして音の並びを自動で繰り返すシーケンサー。ベースはシンセの低音を8分音符で機械的に刻み、上物は減衰の早い硬い音色や、逆に長く伸びるパッドを重ねる。和声は短調が多く、単純な四つのコードの循環にとどまるかわりに、音色の変化と間の取り方で表情をつける。テンポは110〜135BPM。歌唱は感情を抑えた平坦な発声が好まれ、多重録音した合唱風のコーラスが対比として置かれる。歌詞は都市の孤独、監視社会、機械化された労働、恋愛の空虚さといった、冷たさを含む主題を扱うことが多い。テクノポップとほぼ同義に使われるが、ダンス音楽としてのテクノが踊らせる機能に特化したのに対し、シンセポップはあくまで歌の形式を保つ点で異なる。</p>
<h2>成り立ち</h2><p>1970年代後半のイギリスで、パンクの後を受けて生まれた。直接の手本はドイツのKraftwerkで、1974年の「Autobahn」と1978年の「The Man-Machine」が、電子音だけでポップスが成立することを示していた。もう一つの前提は技術と経済である。1970年代末に安価なアナログ・シンセサイザーが出回り、演奏技術のない若者でも一人で伴奏を作れるようになった。1978年、シェフィールドでThe Human Leagueが、バジルドンでDepeche Modeの母体が、ロンドンでThe Normalが活動を始める。The Normalの正体はレコード会社の経営者Daniel Millerで、彼が自作の一枚を出すために設立したレーベルMuteは、その後Depeche Modeを擁してこの分野の中心になった。1979年、Gary Numanが率いたTubeway Armyの「Are Friends Electric?」が全英1位となり、続くソロ名義の「Cars」も成功して、シンセサイザーが主役でも大衆的に売れることが証明される。1981年は決定的な年だった。The Human Leagueは中心人物の脱退後、街のディスコで見つけた素人の少女二人を加入させ、アルバム「Dare」と「Don't You Want Me」で世界的な成功を収める。同年、Soft Cellの「Tainted Love」、Depeche Modeの「Just Can't Get Enough」、Orchestral Manoeuvres in the Darkの「Souvenir」が並び、シンセポップは英国チャートの主流になった。翌1982年にはYazooやThe Human Leagueを離れたメンバーによるHeaven 17が続く。日本では1978年に細野晴臣・坂本龍一・高橋幸宏が結成したYellow Magic Orchestraが同じ潮流と共振し、東洋的な旋律と自動演奏を組み合わせて国際的に評価された。1983年にYamaha DX7が発売されると音色は金属的で硬いものへ変わり、シンセポップの音は1980年代の商業音楽全体に吸収されて固有性を失っていく。1980年代半ば以降、Depeche Modeがより暗く硬質な方向へ進む一方、Pet Shop Boysが皮肉と洗練を持ち込み、様式は生き延びた。2000年代にはLa Roux、Ladytron、Chvrchesらによる再評価が起こり、現在もポップスの基本語彙の一つであり続けている。</p>
<h2>代表曲</h2><ul><li>Cars (Gary Numan)</li><li>Enjoy the Silence (Depeche Mode)</li><li>West End Girls (Pet Shop Boys)</li><li>Take On Me (A-ha)</li></ul>
