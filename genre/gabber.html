<h1>Gabber（ガバ）とは</h1>
<p>極端に歪ませたバスドラムを毎秒3回前後の速さで打ち続ける、最も激しい部類のハードコア・テクノ。核になる音はRoland TR-909のバスドラムを何段もの歪みで潰したもので、あまりに歪ませたため元の低音が失われ、代わりに中高域まで</p>
<p>極端に歪ませたバスドラムを毎秒3回前後の速さで打ち続ける、最も激しい部類のハードコア・テクノ。核になる音はRoland TR-909のバスドラムを何段もの歪みで潰したもので、あまりに歪ませたため元の低音が失われ、代わりに中高域まで伸びる金属質の悲鳴のような音になる。この一撃が旋律も兼ねており、音程を上下させて簡単な旋律を作ることさえある。テンポは160BPMから始まり、1990年代後半には180〜200BPM、派生形では250BPMを超えた。上物は歪んだ鋸歯状波の短い旋律、映画やアニメから採った短い台詞のサンプル、暴力的な掛け声、サイレンなど。曲の構成は単純で、静かな導入から一気にバスドラムが戻る瞬間の落差だけで組み立てられる。歌詞は挑発と罵倒、あるいは薬物と暴力を戯画化した文句が多い。踊り方も特徴的で、上体を前に倒し足を高速で細かく動かすハッケンという独自の踊りが伴う。テクノやハウスが低音の心地よさを守るのに対し、ガバは低音そのものを破壊してしまう点で、快楽の設計が根本的に違う。</p>
<h2>成り立ち</h2><p>1990年代初頭、オランダのロッテルダムで生まれた。gabberという語はイディッシュ語に由来するオランダ語の俗語で仲間を意味し、もとは首都アムステルダムの洗練されたハウスの客が、港湾都市ロッテルダムの労働者階級の若者を見下して使った蔑称だった。ロッテルダム側はこれを自称として引き受け、都市間の対抗意識がそのまま音の激しさに変換されていく。1992年、Paul Elstakがレーベル Rotterdam Recordsを設立し、Euromastersの「Amsterdam, waar lech dat dan?」（アムステルダムって、どこにあるんだ）という露骨な挑発の曲を出した。同年、イベント制作会社ID&amp;Tが屋内型の大規模催しThunderdomeを開始し、これがシーンの中心装置になる。Thunderdomeのコンピレーション盤は骸骨の意匠で統一され、オランダで100万枚単位で売れた。DJ Paul Elstak、Neophyte、DJ Rob、Buzz Fuzz、The Prophetらが主要な作り手で、剃り上げた頭にジャージという服装、Australianブランドの上下、ハッケンの踊りが一体の若者文化を作った。1995年前後にはハッピーハードコアと呼ばれる明るく甘い派生が主流化し、Paul Elstak自身が児童合唱を乗せた曲で商業的な大成功を収めるが、これが硬派な支持層の離反を招く。1997年頃にはメディアの過剰な報道と、薬物使用や暴力事件との結び付きへの反発から急速に下火となり、シーンは一度崩壊した。復活は2000年代前半で、より低速で重いハードスタイルへ枝分かれする一方、Thunderdomeは2010年代に再開され、Angerfist、Sefaといった作り手が新しい世代を集めている。派生も多く、より速いスピードコア、テラーコア、ミリセカンド単位の速さに達するスプリッターコアやエクストラトーンなど、速度の極限を試す実験が今も続いている。</p>
<h2>代表曲</h2><ul><li>Poing (Rotterdam Termination Source)</li><li>I Wanna Be a Hippy (Technohead)</li><li>Paul Elstak - Rainbow In The Sky</li></ul>
