<h1>Gabber（ガバ）とは</h1>
<p>ガバは、極端に歪ませたバスドラムを、毎秒3回前後の速さで打ち続ける音楽だ。ハードコア・テクノの中でも、最も激しい部類に入るとされる。 核になるのは、そのバスドラムだ。Roland TR-909などのキックを過度に歪ませ（クリップさ</p>
<p>ガバは、極端に歪ませたバスドラムを、毎秒3回前後の速さで打ち続ける音楽だ。ハードコア・テクノの中でも、最も激しい部類に入るとされる。

核になるのは、そのバスドラムだ。Roland TR-909などのキックを過度に歪ませ（クリップさせ）、倍音を増やして、音程感のある音にする。この一撃が旋律も兼ねている。音程を上下させて、簡単な旋律を作ることさえある。

テンポは、概ね140〜190BPM（1分間の拍数）。ハードコア・テクノ全体では、160〜200BPM以上とも書かれる。派生形では250BPMを超えた。

上物は、短い旋律だ。映画などから採ったサンプルや、叫ぶような声も加わる。

曲の構成は、比較的単純だ。キックの再投入が山場になることが多い。歌詞は、暗い主題（暴力・薬物・罵倒語）が多い。

踊り方も特徴的だ。ハッケンという独自の踊りが伴う。バスドラムのリズムに合わせて、足（特にかかと）で素早くステップを踏む。

テクノやハウスは、低音の心地よさを守ることが多い。それに対してガバは、低音そのものを破壊するとも言われる。この点で、快楽の設計が根本的に違うとされる。</p>
<h2>成り立ち</h2><p>舞台は、1990年代初頭のオランダだ。ロッテルダムとアムステルダムで、並行して発展した。

gabberという語は、イディッシュ語に由来するオランダ語の俗語で、仲間を意味する。もとは、アムステルダムのハウスクラブ（RoXy）の客や警備員が、ハードコアの客を指して使った、見下した呼び名だった。当事者がこれを自称に転じたとされる（諸説ある）。

1992年、Paul Elstakがレーベル Rotterdam Recordsを設立した。Euromastersの「Amsterdam, waar lech dat dan?」（アムステルダムって、どこにあるんだ）という、露骨な挑発の曲を出した。同年、イベント制作会社ID&amp;Tが、屋内型の大規模催しThunderdomeを開始した。これがこの音楽の世界の中心的な仕掛けになる。

Thunderdomeのコンピレーション盤は、世界累計で1995年までに150万枚を超えた。のちに、関係者の証言では300万枚を超えたとされる。トレードマークは、主催者のロゴであるウィザードの絵だった。

DJ Paul Elstak、Neophyte、DJ Rob、Buzz Fuzz、The Prophetらが、主要な作り手だった。剃り上げた頭にジャージという服装、Australianブランドの上下、ハッケンの踊りが一体となって、若者文化を作った。

1995年前後には、ハッピーハードコアと呼ばれる、明るく甘い派生が主流になった。Paul Elstak自身が、ヴォーカル入りのハッピーハードコア（1995年の「Rainbow in the Sky」など）で、商業的な大成功を収める。しかし、Elstakのハッピーハードコア路線に、古参ファンが反発した。

Billboard誌が1997年に「the country's first homegrown youth culture」と評したほど、盛んだった。ところが2000年前後には、否定的な報道の長期化、商業化、パロディ（もじったもの）、過剰な露出が重なった。ガバの人気は衰え、以後は「ハードコア」の名で続いた（DJ Mag による説明）。復活は、2000年代前半とされる。

ハードスタイルは、1990年代後半にハードトランスを主な源として登場したジャンルで、ハードコアの影響も受けている。Thunderdomeは2017年に再開され、Angerfist、Sefaといった作り手が新しい世代を集めている。

派生も多い。より速いスピードコア、テラーコア、600〜1,000 BPM（スプリッターコア）、1,000 BPM以上（エクストラトーン）など、速度の極限を試す実験が、今も続いている。</p>
<h2>代表曲</h2><ul><li>I Wanna Be a Hippy (Technohead)</li><li>Rainbow In The Sky (Paul Elstak)</li><li>Take U Back (Angerfist)</li><li>Army of Hardcore (Neophyte)</li><li>Forgotten Moments (Lenny Dee)</li><li>Poing (Rotterdam Termination Source)</li><li>Name of the DJ (Chosen Few)</li><li>Gabbers Unite (3 Steps Ahead)</li><li>Code Red (DJ Paul Elstak)</li><li>In the Name of Love (3 Steps Ahead)</li><li>Criminally Insane (Angerfist)</li><li>Mind of a Lunatic (Predator)</li></ul>
