<h1>Balearic Beat（バレアリックビート）とは</h1>
<p>特定の音の様式ではなく、選曲の態度そのものを指す呼び名である。名称はスペインのバレアレス諸島に由来する。原則はただひとつ、ジャンルや出自を一切問わず、その場の空気に合う曲であれば何でもつなぐという姿勢である。したがって一晩の流れの</p>
<p>特定の音の様式ではなく、選曲の態度そのものを指す呼び名である。名称はスペインのバレアレス諸島に由来する。原則はただひとつ、ジャンルや出自を一切問わず、その場の空気に合う曲であれば何でもつなぐという姿勢である。したがって一晩の流れの中に、イタリアの電子ディスコ、イギリスのギターバンド、ブラジルの歌もの、レゲエ、アメリカの主流のポップス、映画音楽、そして無名の自主制作盤までが並ぶ。共通するのは音の質感で、テンポは概ね100から120 BPMと穏やか、残響が深く、和声は明るいがどこか物憂い。生ギターの分散和音、指板に仕切りのないベース、パンフルートや口笛を模した音色、そして波や風の環境音が好まれる。四つ打ちの推進力よりも、揺れるような跳ねたリズムが選ばれることが多い。全体として、日没から夜明けにかけての時間、屋外の風、そして高揚の後の弛緩と結びついた音が求められる。踊らせることより、その場にいる者の意識を同じ方向へ向けることが目的であり、DJの選択そのものが作品と見なされる点に本質がある。</p>
<h2>成り立ち</h2><p>舞台はスペインの地中海に浮かぶイビサ島である。1970年代からこの島は、ヨーロッパ各地の放浪者や芸術家、そして性的少数者が集まる自由な避難所として知られていた。1980年代半ば、島のクラブAmnesiaで選曲を担っていたアルゼンチン出身のAlfredo Fioritoは、屋根のない野外の空間で夜明けまで音を流すという条件のもと、ジャンルを完全に無視した選曲を実践した。彼にとって重要なのは曲の分類ではなく、その瞬間に集まった多国籍の客の気分に合うかどうかだけだった。決定的な出来事は1987年に起きる。この年、ロンドンのDJであるPaul Oakenfold、Danny Rampling、Johnny Walker、Nicky Hollowayの四人が、誕生日の祝いを兼ねてこの島を訪れ、Alfredo Fioritoの選曲と、そこに漂う開放的な空気を体験した。彼らはこの体験をロンドンへ持ち帰り、Shoomをはじめとする小規模な催しを次々に立ち上げる。イギリスの閉鎖的な階級意識と、金曜の夜の暴力に慣れた若者たちにとって、誰もが分け隔てなく踊るというこの様式は衝撃だった。これが1988年のセカンド・サマー・オブ・ラヴと呼ばれる現象、そしてアシッド・ハウスの爆発的な流行へ直結する。つまりイギリスのレイヴ文化は、島での数日間の体験を起点としている。ただしこの物語には影もある。当時の高揚がエクスタシーの流行と不可分だったこと、そしてイビサ島がその後、巨大な資本による観光産業に飲み込まれ、当初の自由さを失っていったことである。現在この島のクラブは高額な入場料と厳格な運営で知られ、Alfredo Fioritoが実践したような無償で自由な空気とは対極にある。それでも、ジャンルを問わず気分だけで曲を選ぶという態度は、その後のDJ文化における最も重要な理念のひとつとして受け継がれている。</p>
