<h1>Balearic Beat（バレアリックビート）とは</h1>
<p>イビサ島の現地では、特定の音の様式ではなく選曲の態度そのものを指す呼び名と見られているが、島の外では一般に音楽の様式として扱われる。名称はスペインのバレアレス諸島に由来する。原則はただひとつ、ジャンルや出自を一切問わず、その場の空</p>
<p>イビサ島の現地では、特定の音の様式ではなく選曲の態度そのものを指す呼び名と見られているが、島の外では一般に音楽の様式として扱われる。名称はスペインのバレアレス諸島に由来する。原則はただひとつ、ジャンルや出自を一切問わず、その場の空気に合う曲であれば何でもつなぐという姿勢である。したがって一晩の流れの中に、イタリアの電子ディスコ、イギリスのギターバンド、ブラジルの歌もの、レゲエ、アメリカの主流のポップス、映画音楽、そして無名の自主制作盤までが並ぶ。共通するのは音の手ざわりで、テンポは概ね100から120 BPMと穏やか、残響が深く、和音は明るいがどこか物憂い。生ギターの分散和音、指板に仕切りのないベース、パンフルートや口笛を模した音色、そして波や風の環境音が好まれる。四つ打ちの前へ押し進める力よりも、揺れるような跳ねたリズムが選ばれることが多い。全体として、日没から夜明けにかけての時間、屋外の風、そして盛り上がった後のゆるんだ気分と結びついた音が求められる。踊らせることより、その場にいる者の意識を同じ方向へ向けることが目的であり、DJの選曲そのものが作品と見なされる点が、いちばんの本質である。</p>
<h2>成り立ち</h2><p>舞台はスペインの地中海に浮かぶイビサ島である。1970年代からこの島は、ヨーロッパ各地の放浪者や芸術家といった自由な心を持つ人たちが集まる、のびのびできる逃げ場所として知られていた。1980年代半ば、島のクラブAmnesiaで選曲を担っていたアルゼンチン出身のAlfredo Fiorito(1983年に初出演し、翌1984年にレジデントになった)は、屋根のない野外の空間で夜明けまで音を流すという条件のもと、ジャンルをまったく気にしない選曲を実際に行った。彼にとって重要なのは曲の分類ではなく、その瞬間に集まった多国籍の客の気分に合うかどうかだけだった。英国に持ち帰られる転機は1987年に起きる。この年、ロンドンのDJであるPaul Oakenfoldが、24歳の誕生日を祝うため、Danny Rampling、Johnny Walker、Nicky Hollowayを招いて島を訪れ(島にはすでにTrevor FungとIan St Paulが仕事で滞在していた)、Alfredo Fioritoの選曲と、そこに漂う開放的な空気を体験した。彼らはこの体験をロンドンへ持ち帰り、Shoomをはじめとする小規模な催しを次々に立ち上げる。当時のイギリスではクラブが一種類の音楽しかかけず、ロンドンは気取りに満ちていた、とOakenfold自身は語っている。そのなかで、誰もが分け隔てなく踊るというこの様式は衝撃だった。これが1988年のセカンド・サマー・オブ・ラヴと呼ばれる現象を促した重要な要因のひとつとなった。アシッド・ハウス自体は1980年代半ばにシカゴで生まれ、まずマンチェスター、のちにロンドンへ広まったとされ、この現象の主な音楽的な土台も、シカゴ、デトロイト、ニューヨークから輸入されたハウスだった。つまりイギリスのレイヴ文化は、島での約1週間の体験だけを起点としたものではない。ただしこの物語には影もある。当時の盛り上がりがエクスタシーの流行と切り離せなかったこと、そしてイビサ島がその後、大きな資本による観光産業に飲み込まれ、当初の自由さを失っていったことである。それでも、ジャンルを問わず気分だけで曲を選ぶという態度は、その後のDJ文化における最も重要な理念のひとつとして受け継がれている。</p>
<h2>代表曲</h2><ul><li>Cafe Del Mar (Energy 52)</li><li>Going Back to My Roots (Richie Havens)</li><li>Sueño Latino (Sueño Latino)</li><li>State of Independence (Donna Summer)</li><li>Albatross (Fleetwood Mac)</li><li>Café Del Mar (Three 'N One 2002 Update Radio Edit) (Energy 52)</li><li>Why (Carly Simon)</li><li>Music for a Found Harmonium (Penguin Cafe Orchestra)</li><li>Nipple to the Bottle (Grace Jones)</li><li>Josephine (La Version Française) (Chris Rea)</li><li>Walking in the Rain (Flash and the Pan)</li><li>Stop Bajon (Tullio De Piscopo)</li><li>Hoomba Hoomba (Jasper Van't Hof's Pili Pili)</li><li>No G.D.M. (Gina X Performance)</li><li>Moments in Love (Art of Noise)</li><li>Camino Del Sol (Antena)</li><li>TV Scene (Linda Di Franco)</li><li>Jibaro (Electra)</li><li>Chief Inspector (Wally Badarou)</li></ul>
