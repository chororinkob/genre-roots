<h1>Balearic Beat（バレアリックビート）とは</h1>
<p>バレアリック・ビートは、ジャンルを問わない選曲の態度から生まれた音楽だ。名前は、スペインのバレアレス諸島に由来する。 イビサ島の現地では、決まった音のスタイルではなく、選曲の態度そのものを指す呼び名と見られている。一方、島の外では</p>
<p>バレアリック・ビートは、ジャンルを問わない選曲の態度から生まれた音楽だ。名前は、スペインのバレアレス諸島に由来する。

イビサ島の現地では、決まった音のスタイルではなく、選曲の態度そのものを指す呼び名と見られている。一方、島の外では、一般に音楽の種類として扱われる。原則はただひとつ。ジャンルや出自を一切問わず、その場の空気に合う曲であれば何でもつなぐという姿勢である。

そのため一晩の流れの中に、イタリアの電子ディスコ、イギリスのギターバンド、ブラジルの歌もの、レゲエ、アメリカの主流のポップス、映画音楽までが並ぶ。

共通するのは音の手ざわりだ。生ギターや、さまざまな国の打楽器、野外で録った音や鳥の声などが使われる。残響は深く、和音は明るいが、どこか物憂い。

テンポは、おおむね120 BPM未満の中くらいの速さが多いが、決まった数値はない。リズムは、四つ打ちの前へ押し進める力よりも、揺れるような跳ねたリズムが選ばれることが多い。ただし、四つ打ちのハウスも混ざる。

全体として、明け方から正午ごろまでの時間、屋外の風、そして盛り上がった後のゆるんだ気分と結びついた音が求められる。踊らせるために、曲の種類を問わず、その場の空気を読んで選ぶ。DJの選曲そのものが作品と見なされる点が、いちばんの本質だと評されることが多い。</p>
<h2>成り立ち</h2><p>地中海に浮かぶスペインのイビサ島が、この話の舞台である。1960年代以降、この島は、ヨーロッパ各地の放浪者や芸術家など、自由な心を持つ人たちが集まる、のびのびできる逃げ場所として知られていた。

1980年代半ば、島のクラブAmnesiaで選曲を担っていたのが、アルゼンチン出身のAlfredo Fioritoだ。彼は1983年に初めて出演し、翌1984年に専属になった。会場は屋根のない野外で、音は明け方から正午ごろまで流れた。その条件のもとで、彼はジャンルをまったく気にしない選曲を実際に行った。彼にとって大事なのは曲の分類ではなく、その瞬間に集まった多国籍の客の気分に合うかどうかだった。

この感覚が英国に持ち帰られる転機は、1987年に訪れる。この年、ロンドンのDJであるPaul Oakenfoldが、24歳の誕生日を祝うため、Danny Rampling、Johnny Walker、Nicky Hollowayを招いて島を訪れた。島にはすでに、Trevor FungとIan St Paulが仕事で滞在していた。彼らはAlfredo Fioritoの選曲と、そこに漂う開放的な空気を体験した。

彼らはこの体験をロンドンへ持ち帰った。その動きはShoomなどの小さな催しから始まり、のちにAstoriaやHeavenなどの大きな会場へ広がった。当時のイギリスではクラブが一種類の音楽しかかけず、ロンドンは気取った、とげとげしい態度に満ちていた、とOakenfold自身は語っている。そのなかで、誰もが分け隔てなく踊るというこのスタイルは衝撃だった。これが、1988年のセカンド・サマー・オブ・ラヴと呼ばれる現象を後押しした、重要な要因のひとつになった。

一方、アシッド・ハウス自体は1980年代半ばにシカゴで生まれ、1986〜88年にかけて、マンチェスター、ロンドン、ノッティンガムなど英国各地のクラブに広がった。どこが最初かは諸説ある。この現象の主な音楽の土台も、シカゴ、デトロイト、ニューヨークから輸入されたハウスだった。つまり、イギリスのレイヴ文化は、島での約1週間の体験だけから始まったものではない。

ただし、この話には影もある。当時の盛り上がりは、エクスタシーの流行と切り離せなかった。そしてイビサ島はその後、大きな資本による観光産業に飲み込まれ、当初の自由さを失っていった、とAlfredo Fiorito自身は述べている。

それでも、ジャンルを問わず気分だけで曲を選ぶという態度は、その後のDJ文化で最も重要な理念のひとつとして受け継がれている、と評されることが多い。</p>
