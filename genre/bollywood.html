<h1>Bollywood（ボリウッド）とは</h1>
<p>インドのヒンディー語映画のために作られる歌、およびその様式。最大の特徴は制作体制にあり、俳優は歌わず、プレイバック・シンガーと呼ばれる専門の歌手が事前に録音し、俳優はそれに合わせて口を動かす。このため歌手の声と俳優の顔が分離してお</p>
<p>インドのヒンディー語映画のために作られる歌、およびその様式。最大の特徴は制作体制にあり、俳優は歌わず、プレイバック・シンガーと呼ばれる専門の歌手が事前に録音し、俳優はそれに合わせて口を動かす。このため歌手の声と俳優の顔が分離しており、同じ歌手の声が何十人もの俳優から出るという状況が長く続いた。音楽的には徹底した折衷で、インド古典のラーガと装飾的な歌唱、民謡のリズム、そして西洋のポップス、ディスコ、ロック、近年はヒップホップやEDMまでが一曲の中に同居する。編成も弦楽合奏、タブラ、ドーラク、シタール、ハルモニウムに、シンセサイザーと打ち込みが加わる。リズムは四分の四が基本だが、パンジャーブ地方のバングラー由来の八分の跳ねる型が頻繁に用いられる。旋律は音域が広く、装飾音とグリッサンドを多用し、高音域での伸びやかな歌唱が好まれる。構成は映画の場面に従属し、間奏に長い舞踊の部分が挿入される。歌詞はウルドゥー語の詩的な語彙を含むヒンディー語で、恋、別離、祝祭、信仰を扱う。映画の興行成績を左右する重要な要素として扱われてきた。</p>
<h2>成り立ち</h2><p>1931年、インド初のトーキー映画Alam Araが公開され、そこに七曲の歌が含まれていたことが出発点である。以後、歌のない商業映画はほとんど作られなくなった。初期は俳優自身が歌っていたが、1930年代半ばに録音を先に行う方式が確立し、専門の歌手が生まれた。1940年代から1980年代にかけて、Lata MangeshkarとAsha Bhosleの姉妹が女性歌手の分野をほぼ独占し、二人合わせて数万曲を録音したとされる。Lata Mangeshkarの高く澄んだ声は、数十年にわたりヒロインの標準的な声とされ、その支配的な地位は他の歌手の機会を奪ったという批判もある。男性側ではMohammed Rafi、Kishore Kumar、Mukeshが三大歌手とされた。作曲家では、1950年代のNaushad、S.D. Burman、Shankar–Jaikishan、1970年代のR.D. Burman（S.D. Burmanの息子で、ラテン音楽や電子楽器を大胆に導入した）、1990年代以降のA.R. Rahmanが時代を画した。A.R. RahmanはチェンナイでMani Ratnam監督の1992年の作品Rojaにより登場し、コンピュータを用いた制作と南インド的な音色を持ち込み、2008年の映画Slumdog Millionaireでアカデミー賞を二部門受賞した。産業構造としては、映画の音楽出版権が独立した収益源であり、公開前に音楽を発表して宣伝とする慣行が確立している。1990年代までは音楽出版社が映画製作費を先払いすることも多かった。問題も多く、他国の楽曲を無断で流用することが長く常態化しており、1990年代には特に顕著だった。また、歌手や作詞家への報酬と権利の帰属を巡る争いが繰り返され、2012年の著作権法改正でようやく作詞作曲者の印税受領権が明文化された。近年は映画から独立した単独曲の配信が増え、産業の構造そのものが変わりつつある。</p>
<h2>代表曲</h2><ul><li>Tum Hi Ho (Arijit Singh)</li><li>Chaiyya Chaiyya (Sukhwinder Singh, Sapna Awasthi)</li><li>Jai Ho (A.R. Rahman)</li><li>Kabhi Khushi Kabhie Gham (Lata Mangeshkar, Udit Narayan)</li><li>Kal Ho Naa Ho (Sonu Nigam)</li></ul>
