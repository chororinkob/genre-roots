<h1>Bollywood（ボリウッド）とは</h1>
<p>ボリウッド音楽は、インドのヒンディー語映画のために作られる歌、およびそのスタイルだ。映画の興行成績を左右する重要な要素として扱われてきた。 最大の特徴は、制作体制にある。原則として俳優は歌わず（歌う俳優の例外もある）、プレイバック</p>
<p>ボリウッド音楽は、インドのヒンディー語映画のために作られる歌、およびそのスタイルだ。映画の興行成績を左右する重要な要素として扱われてきた。

最大の特徴は、制作体制にある。原則として俳優は歌わず（歌う俳優の例外もある）、プレイバック・シンガーと呼ばれる専門の歌手が事前に録音する。俳優はそれに合わせて口を動かす。このため歌手の声と俳優の顔が分離しており、同じ歌手の声が何十人もの俳優から出るという状況が長く続いた。

音楽的には、徹底した取り混ぜだ。インド古典のラーガと装飾的な歌唱、民謡のリズム、そして西洋のポップス、ディスコ、ロック、近年はヒップホップやEDMまでが一曲の中に同居する。編成も、弦楽合奏（弦楽器の合奏）、タブラ、ドーラク、シタール、ハルモニウムに、シンセサイザーと打ち込みが加わる。

旋律は音域が広く、装飾音とグリッサンド（音を滑らかにつなぐ歌い方）を多用する。高音域での伸びやかな歌唱が好まれる。

リズムは4拍子系が多い。ただ、パンジャーブ地方のバングラー由来のリズム（ドールのチャール（長短のスウィング感を持つリズム）など）が頻繁に用いられる。

歌詞は、ウルドゥー語の詩的な語彙を含むヒンディー語で、恋、別離、祝祭、信仰を扱う。構成は映画の場面に従い、間奏に長い舞踊の部分が挿入される。</p>
<h2>成り立ち</h2><p>1931年、インド初のトーキー映画Alam Araが公開された。そこに7曲の歌が含まれていたことが、出発点である。以後、歌のない商業映画はほとんど作られなくなった。

初期は、俳優自身が歌っていた。しかし、1935年に録音を先に行う方式が初導入され、1950年代にかけて主流になり、専門の歌手が生まれた。

1940年代から1980年代にかけて、Lata MangeshkarとAsha Bhosleの姉妹が、女性歌手の分野で圧倒的な存在となった。2人合わせて数万曲を録音したとされるが、特にLataの曲数には異論がある。独占だという批判もあるが、Asha本人は否定している。Lata Mangeshkarの高く澄んだ声は、数十年にわたりヒロインの標準的な声とされ、その支配的な地位は他の歌手の機会を奪ったという批判もある。男性側では、Mohammed Rafi、Kishore Kumar、Mukeshがしばしば三本柱として挙げられる。

作曲家では、1950年代のNaushad、S.D. Burman、Shankar–Jaikishan、1970年代のR.D. Burman（S.D. Burmanの息子で、ラテン音楽や電子楽器を大胆に導入した）、1990年代以降のA.R. Rahmanが時代を代表した。A.R. Rahmanは、チェンナイでMani Ratnam監督の1992年のタミル語映画Rojaにより映画音楽にデビューした（ヒンディー語映画の本格デビューは1995年のRangeela）。コンピュータを用いた制作と南インド的な音色を持ち込み、2008年の映画Slumdog Millionaireでアカデミー賞を二部門受賞した。

産業の仕組みとしては、映画の音楽権（音源の権利）が独立した収益源であり、公開前に音楽を発表して宣伝とする習わしが定着している。成功した映画のプロデューサーは、音楽権の売却だけで投資額のかなりの部分を回収できる。

一方で、問題も多い。他国の楽曲の盗用が多数指摘され、1990年代には特にはっきりしていた。また、歌手や作詞家への報酬と権利の帰属を巡る争いが繰り返され、2012年の著作権法改正で映画館上映以外の利用について、印税の対等な分配を受ける権利の譲渡・放棄を禁じる規定が条文に入った。

近年は、映画から独立した単独曲の配信が増え、産業の構造そのものが変わりつつある。</p>
