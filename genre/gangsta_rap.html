<h1>Gangsta Rap（ギャングスタラップ）とは</h1>
<p>ギャングスタ・ラップは、アメリカ都市部の貧困地区における暴力、麻薬取引、警察との対立、そして生き延びるための行動原理を、当事者自身の視点（「俺は」）で語るヒップホップだ。 音の面では、TR-808や909などのドラムマシンが使われ</p>
<p>ギャングスタ・ラップは、アメリカ都市部の貧困地区における暴力、麻薬取引、警察との対立、そして生き延びるための行動原理を、当事者自身の視点（「俺は」）で語るヒップホップだ。

音の面では、TR-808や909などのドラムマシンが使われ、作品により音色はさまざまである。808については『Straight Outta Compton』のキックで確認できる。テンポは遅めのものが多く、言葉を明瞭に聞かせるための余白が確保されている。

ラップの発声は人により大きく異なり、攻撃的・威圧的な語り口が特徴である。

歌詞は、物語性が中心にある。韻文でありながら、短編小説のように場面と時系列を持つ。語り口は、誇張と実話が意図的に混ぜられている。聴き手は、どこまでが事実か判別できないまま引き込まれる。

曲は長めのものが多い。曲の合間には、街頭の会話、パトカーの無線、銃声、テレビ報道といった現場音のサンプルが挿入されることもある。聴き手を場面へ引き込む映画的な演出が施される。

同じヒップホップでも、パーティーでの盛り上げを目的とした初期の形式とは、目的が根本的に異なる。証言であると同時に商品でもあるという二面性を、最初から抱えている。</p>
<h2>成り立ち</h2><p>1985年、フィラデルフィアのSchoolly Dが、ある楽曲を発表した。暴力を淡々と当事者の視点で描く手法を、初めて明確に示したものと一般に見なされている（Ice-T本人も、最初のそうしたレコードはSchoolly Dの「P.S.K.」だったと述べている）。翌1986年、ロサンゼルスのIce-Tがこの手法を西海岸へ持ち込み、街路の現実を報告する形式を固めた。

決定的だったのは、カリフォルニア州コンプトンのN.W.Aが発表したストレイト・アウタ・コンプトン（RIAA（全米レコード協会）の公式発売日は1989年1月25日で、1988年8月8日とする情報もある）である。Eazy-Eが麻薬の売買で得たとされる資金（疑惑の域を出ない話で、マネージャーのJerry Hellerは自分が最初の25万ドルを出資したと主張している）で、Jerry HellerとともにRuthless Recordsを共同設立した。Dr. Dre、DJ Yella、Arabian Princeが制作し、歌詞は主にThe D.O.C.、Ice Cube、MC Renが書いた。こうして成立したこの作品は、ロサンゼルス圏外ではラジオでの放送が限られたまま、1989年7月にプラチナ、1992年3月にダブルプラチナの認定を受けた。既存の音楽産業の常識を覆したと評された。

収録された警察を名指しで告発する楽曲に対しては、1989年にアメリカ連邦捜査局が異例の書簡をレコード会社へ送った。政府機関が一楽曲に反応するという事態にまで発展したのだ。

この対立の背景には、ロサンゼルス市警で相当数の警官が過剰な力を繰り返し使い、組織がそれを放置していたと、1991年のChristopher Commissionが認定した事実がある。1991年にRodney Kingが警官に殴打される映像が公開された。翌1992年に警官が無罪となった直後に、ロサンゼルス暴動が発生した。これで、彼らの証言が誇張ではなかったことが白日の下に晒されたと見られている。

同年、Ice-Tが別バンド名義で発表した楽曲は、警官殺害を扱った内容から全米的な政治問題となった。大統領までが言及する騒ぎとなり、最終的にIce-Tの申し出により収録が取り下げられた（自発性には異論もある）。ヒューストンのGeto Boysは1991年の『Mind Playing Tricks on Me』で、不安や偏執、トラウマといった脆さを描き、NPRは「最初の“vulnerable”なギャングスタ・ラップ曲」と評した。

1990年代半ば、Suge Knightが率いるDeath Row Recordsと、ニューヨークのBad Boyを率いるSean Combsとの間で、対立が煽られた。報道が東西の抗争として煽情的に扱った。その最中の1996年9月に2Pacがラスヴェガスで、1997年3月にThe Notorious B.I.G.がロサンゼルスで、いずれも銃撃により殺害された。2Pacの事件では、Duane &quot;Keffe D&quot; Davisが2026年8月31日に第一級殺人で有罪となり、10月13日に40年〜終身刑を言い渡された（弁護側は控訴の意向）。The Notorious B.I.G.の事件は未解決のままである。

この分野は、黒人社会の実態を可視化した功績と、暴力と女性蔑視を商品として白人の若者へ売ったという批判の両方を負い続けている。C. Delores Tuckerらによる批判運動を含め、その評価は今も定まっていない。</p>
