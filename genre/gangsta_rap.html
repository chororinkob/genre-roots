<h1>Gangsta Rap（ギャングスタラップ）とは</h1>
<p>アメリカ都市部の貧困地区における暴力、麻薬取引、警察との対立、そして生き延びるための行動原理を、当事者の一人称で語るヒップホップである。物語性が中心にあり、韻文でありながら短編小説のように場面と時系列を持つ歌詞が書かれる。語り口は</p>
<p>アメリカ都市部の貧困地区における暴力、麻薬取引、警察との対立、そして生き延びるための行動原理を、当事者の一人称で語るヒップホップである。物語性が中心にあり、韻文でありながら短編小説のように場面と時系列を持つ歌詞が書かれる。語り口は誇張と実話が意図的に混ぜられ、聴き手はどこまでが事実か判別できないまま引き込まれる。音の面では、1970年代のファンクやソウルのレコードから抜き出した断片が土台となり、そこへRoland TR-808由来の長く伸びる低音と、乾いて硬いスネアが重ねられる。テンポは概ね90から100 BPMと遅めで、言葉を明瞭に聞かせるための余白が確保されている。ラップの発声は、初期のヒップホップにあった軽やかな跳ねを抑え、低く落ち着いた、脅すような話し方が主流となる。曲の合間には、街頭の会話、パトカーの無線、銃声、テレビ報道といった現場音のサンプルが挿入され、聴き手を場面へ引き込む映画的な演出が施される。曲は4分から5分と長めで、三つの長い節を語り切る構成が典型である。同じヒップホップでも、パーティーでの盛り上げを目的とした初期の形式とは目的が根本的に異なり、証言であると同時に商品でもあるという二面性を最初から抱えている。</p>
<h2>成り立ち</h2><p>1985年、フィラデルフィアのSchoolly Dが発表した楽曲は、暴力を淡々と一人称で描く手法を初めて明確に示したものとして知られる。翌1986年、ロサンゼルスのIce-Tがこの手法を西海岸へ持ち込み、街路の現実を報告する形式を確立した。決定的だったのは1988年、カリフォルニア州コンプトンのN.W.Aが発表したストレイト・アウタ・コンプトンである。Eazy-Eが麻薬の売買で得た資金でRuthless Recordsを設立し、Dr. Dreが音を作り、Ice Cubeが歌詞を書くという分業によって成立したこの作品は、放送されないままダブルプラチナに達し、既存の音楽産業の常識を覆した。収録された警察を名指しで告発する楽曲に対しては、1989年にアメリカ連邦捜査局が異例の書簡をレコード会社へ送り、政府機関が一楽曲に反応するという事態にまで発展する。この対立の背景には、ロサンゼルス市警による黒人住民への日常的な暴力があり、1991年にRodney Kingが警官に殴打される映像が公開され、翌1992年に警官が無罪となった直後にロサンゼルス暴動が発生したことで、彼らの証言が誇張ではなかったことが白日の下に晒された。同年、Ice-Tが別バンド名義で発表した楽曲は、警官殺害を扱った内容から全米的な政治問題となり、大統領までが言及する騒ぎとなって、最終的に自主的な収録取り下げに至った。ヒューストンのGeto Boysは1991年に、精神の錯乱を主題とする楽曲でこの分野に内面の描写を持ち込んだ。1990年代半ば、Suge Knightが率いるDeath Row Recordsと、ニューヨークのBad Boyを率いるSean Combsとの間で対立が煽られ、報道が東西の抗争として煽情的に扱った結果、1996年9月に2Pacがラスヴェガスで、1997年3月にThe Notorious B.I.G.がロサンゼルスで、いずれも銃撃により殺害された。どちらの事件も未解決のまま四半世紀以上が過ぎている。この分野は、黒人社会の実態を可視化した功績と、暴力と女性蔑視を商品として白人の若者へ売ったという批判の両方を負い続けており、C. Delores Tuckerらによる批判運動を含め、その評価は今も定まっていない。</p>
