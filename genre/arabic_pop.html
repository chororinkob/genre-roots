<h1>Arabic Pop（アラビックポップ）とは</h1>
<p>アラブ世界の伝統的な旋法と歌唱法を、現代的な編曲と制作技術に接続した大衆音楽。音階の中核はマカームと呼ばれる旋法体系で、西洋の十二平均律には存在しない四分音、すなわち半音のさらに半分の音程を含む。とりわけラースト、バヤーティ、ヒジ</p>
<p>アラブ世界の伝統的な旋法と歌唱法を、現代的な編曲と制作技術に接続した大衆音楽。音階の中核はマカームと呼ばれる旋法体系で、西洋の十二平均律には存在しない四分音、すなわち半音のさらに半分の音程を含む。とりわけラースト、バヤーティ、ヒジャーズといった旋法が頻繁に用いられ、ヒジャーズの増二度を含む音階は、この音楽の異国的な響きの源となっている。編成は伝統楽器と現代楽器の混成で、ウード（撥弦楽器で、ネックにフレットがないため微細な音程を出せる）、カーヌーン（70本以上の弦を持つ箱型の琴で、小さなレバーで音程を四分音単位で変えられる）、ナイ（葦の縦笛）、そしてダルブッカとリクという打楽器に、シンセサイザー、電気ベース、ドラムマシン、弦楽合奏が加わる。リズムはイーカーアートと呼ばれる型の体系に従い、代表的なマクスームやサイーディーが用いられる。歌唱は最重要の要素で、装飾音を細かく揺らすタルアブと、旋律を引き伸ばして情感を込める歌い回しが評価の基準となる。歌詞は恋の情熱と苦悩、故郷、信仰を、古典的な詩の語彙を交えて歌う。</p>
<h2>成り立ち</h2><p>20世紀前半のエジプト、カイロが出発点である。1920年代から1930年代にかけて、ラジオ放送とレコード、そして映画産業がカイロに集中し、この都市がアラブ世界全体の文化的な首都となった。中心にいたのはUmm Kulthum（1898年頃から1975年）で、農村の宗教歌手の家に生まれた彼女は、コーランの朗唱で鍛えた発声を武器に、エジプト最大の国民的存在となった。彼女の月一回の生放送は、アラブ世界全域で街の活動が止まるほどの聴取率を記録し、一曲の演奏が一時間を超えることも珍しくなかった。並行してMohammed Abdel Wahabが、西洋の管弦楽と和声をアラブ音楽に導入する改革を進め、当初は伝統の破壊として激しく批判された。彼は後にUmm Kulthumのために作曲も手がけている。1950年代、Gamal Abdel Nasserの汎アラブ主義の政策下で、音楽は国家的な統合の道具として位置づけられ、ラジオ局サウト・アル=アラブが全域に電波を送った。レバノンではFairuzが、Rahbani兄弟の作曲により、より簡潔で近代的な歌の形式を確立し、内戦下のベイルートにおいても国民の象徴であり続けた。1970年代後半から1980年代、エジプトでアル=ジールと呼ばれる若者向けの短い歌が生まれ、Amr Diabらが1990年代にこれを地中海的な明るい音と結合させた。彼の1996年のNour El Ainは、アラブ世界を超えて国際的な成功を収めた最初期の例となった。2000年代以降は衛星放送のミュージック・ビデオ専門局と、レバノンやエジプトの歌唱オーディション番組が主要な発見の場となり、近年は配信とサウジアラビアの文化政策の転換により、湾岸諸国が新たな市場と資金の中心になりつつある。</p>
