<h1>Arabic Pop（アラビックポップ）とは</h1>
<p>アラビック・ポップは、アラブ世界の伝統的な旋法と歌唱法を、現代的な編曲と制作技術に結びつけた大衆音楽だ。 音階の中核は、マカームと呼ばれる旋法体系である。西洋の十二平均律（1オクターブを等しく十二に分けた音程）には存在しない、微分</p>
<p>アラビック・ポップは、アラブ世界の伝統的な旋法と歌唱法を、現代的な編曲と制作技術に結びつけた大衆音楽だ。

音階の中核は、マカームと呼ばれる旋法体系である。西洋の十二平均律（1オクターブを等しく十二に分けた音程）には存在しない、微分音（記譜上は四分音）を含む。実際の音程は固定ではない。とりわけラースト、バヤーティ、ヒジャーズといった旋法が、基本的なマカーム族として知られる。ヒジャーズの増2度を含む音階は、この音楽の異国的な響きの源となっている。

編成は伝統楽器と現代楽器の混成だ。ウード（撥弦楽器で、ネックにフレットがないため微細な音程を出せる）、カーヌーン（70本以上の弦を持つ箱型の琴で、小さなレバーで音程を四分音単位で変えられる）、ナイ（葦の縦笛）、そしてダルブッカとリクという打楽器に、シンセサイザー、電気ベース、ドラムマシン、弦楽合奏（弦楽器の合奏）が加わる。

リズムはイーカーアート（決まったリズムの型）と呼ばれる体系に従い、代表的なマクスームやサイーディーが用いられる。

歌唱は最重要の要素だ。古典（タラブ）の伝統の歌唱美学を受け継ぐ作品もあるが、ポップでは西洋的な編曲とキャッチーな旋律が前面に出る。

歌詞は恋愛が中心主題だ。古典歌謡では古典詩を用いるが、ポップでは平易な言葉の歌詞が多い。</p>
<h2>成り立ち</h2><p>起源は諸説ある。カイロが中心地で、1920年代のレコード・映画産業とUmm Kulthumらの古典歌謡が、その土壌になった。ポップとしての形成は、主に1970年代以降とされる。

1920年代にレコード・映画産業が発展し、1930年代の国営ラジオ・トーキー映画で土台が固まった。1950〜60年代には、地域の中心として定着した。

中心にいたのはUmm Kulthum（1904年頃から1975年。1898年説もある）だ。農村の宗教歌手の家に生まれた彼女は、コーランの朗唱（節をつけて読み上げること）で鍛えた発声を武器に、エジプト最大の国民的存在となった。彼女の月一回の生放送は、放送の夜には街が静まったとされ、一曲が40〜45分以上に及び、一回の公演は数時間に及んだ。

並行してMohammed Abdel Wahabが、西洋の楽器・旋律・リズムをアラブ音楽に取り入れる改革を進め、その西洋音楽志向を批判された。彼は後にUmm Kulthumのために作曲も手がけている。

1950年代、Gamal Abdel Nasserの汎アラブ主義（アラブ諸国の団結をめざす考え）の政策下で、ラジオ放送サウト・アル=アラブ（1953年にカイロ放送の30分番組として始まった）は、アラブの団結を訴える政治放送だった。全域に電波を送り、Umm Kulthumらの歌も流して聴取者を引き付けた。

レバノンではFairuzが、Rahbani兄弟の作曲により、より簡潔で近代的な歌の形式を固めた。内戦下のベイルートにおいても、国民のシンボルであり続けた。

エジプトでは、アル=ジールと呼ばれる若者向けの音楽が1970年代に起こり、1980年代後半〜90年代にHamid Al Shaeriらが定着させた。Amr Diabらは1990年代に、これを研究者が『地中海音楽』と呼ぶスタイルと結合させた。彼の1996年のNour El Ainは、エジプトのポップ歌手として国際市場に出た代表例となった。

2000年代以降は衛星放送のミュージック・ビデオ専門局と、レバノン制作のSuperstarやStar Academyなどの歌唱オーディション番組が、主要な発見の場となった。近年は配信とサウジアラビアの文化政策の転換により、湾岸諸国が新たな市場として重要性を増している。</p>
