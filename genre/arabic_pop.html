<h1>Arabic Pop（アラビックポップ）とは</h1>
<p>アラブ世界の伝統的な旋法と歌唱法を、現代的な編曲と制作技術に結びつけた大衆音楽。音階の中核はマカームと呼ばれる旋法体系で、西洋の十二平均律（1オクターブを等しく十二に分けた音程）には存在しない微分音（記譜上は四分音、つまり半音のさ</p>
<p>アラブ世界の伝統的な旋法と歌唱法を、現代的な編曲と制作技術に結びつけた大衆音楽。音階の中核はマカームと呼ばれる旋法体系で、西洋の十二平均律（1オクターブを等しく十二に分けた音程）には存在しない微分音（記譜上は四分音、つまり半音のさらに半分の音程）を含み、実際の音程は旋法や奏者によって固定ではない。ラースト、バヤーティ、ヒジャーズといった基本的なマカーム族の旋法が用いられ、ヒジャーズの増2度を含む音階は、この音楽の特徴的な響きを作る。編成は伝統楽器と現代楽器の混成で、ウード（撥弦楽器で、ネックにフレットがないため微細な音程を出せる）、カーヌーン（70本以上の弦を持つ箱型の琴で、小さなレバーで音程を四分音単位で変えられる）、ナイ（葦の縦笛）、そしてダルブッカとリクという打楽器に、シンセサイザー、電気ベース、ドラムマシン、弦楽合奏（弦楽器の合奏）が加わる。リズムはイーカーアート（決まったリズムの型）と呼ばれる体系に従い、代表的なマクスームやサイーディーが用いられる。古典（タラブ）の伝統には、聴き手をうっとりするような情感の状態へ誘うこと（タルアブ）と、旋律を引き伸ばして情感を込める歌い回しを重んじる歌唱美学があり、それを受け継ぐ作品もあるが、ポップでは西洋的な編曲とキャッチーな旋律が前面に出る。歌詞は恋愛が中心主題で、古典歌謡では古典詩の言葉づかいを用いるが、ポップでは平易な言葉の歌詞が多い。</p>
<h2>成り立ち</h2><p>Arabic popの起源には諸説ある。カイロが中心地で、20世紀前半のエジプトのレコード・映画産業と古典歌謡がその土壌になり、ポップとしての形成は主に1970年代以降とされる。1920年代にレコード・映画産業が発展し、1930年代の国営ラジオ（1934年開始）とトーキー映画で基盤が固まり、1950〜60年代に地域の中心として確立した。古典歌謡の中心にいたのはUmm Kulthum（1904年頃から1975年。1898年説もある）で、農村の宗教歌手の家に生まれた彼女は、コーランの朗唱（節をつけて読み上げること）で鍛えた発声を武器に、エジプト最大の国民的存在となった。彼女の月一回の生放送は、放送の夜には街が静まり、人々がラジオの前に集まって聴いたとされ、一曲が40〜45分以上に及び、一回の公演は数時間に及んだ。並行してMohammed Abdel Wahabが、西洋の楽器・旋律・リズムをアラブ音楽に取り入れる改革を進め、その西洋音楽志向を批判された。彼は後にUmm Kulthumのために作曲も手がけている。1950年代、Gamal Abdel Nasserの汎アラブ主義（アラブ諸国の団結をめざす考え）の政策下で、音楽はアラブ世界の団結を訴えるための道具として位置づけられ、ラジオ放送サウト・アル=アラブ（1953年にカイロ放送の30分番組として始まった政治放送）が、Umm Kulthumらの歌も流して聴取者を引き付けながら全域に電波を送った。レバノンではFairuzが、Rahbani兄弟の作曲により、より簡潔で近代的な歌の形式を確立し、内戦下のベイルートにおいても国民の象徴であり続けた。1970年代にエジプトで起こったアル=ジールと呼ばれる若者向けの音楽を、1980年代後半〜90年代にHamid Al Shaeriらが確立し、Amr Diabは研究者が「地中海音楽」と呼ぶ、西洋と中東のリズムを融合したスタイルを作った。彼の1996年のNour El Ainは、エジプトのポップ歌手として国際市場に出た代表例となった。2000年代以降は衛星放送のミュージック・ビデオ専門局と、レバノン制作のSuperstarやStar Academyなどの歌唱オーディション番組が主要な発見の場となり、近年は配信とサウジアラビアの文化政策の転換により、湾岸諸国の重要性が増している。</p>
