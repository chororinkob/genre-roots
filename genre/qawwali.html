<h1>Qawwali（カッワーリー）とは</h1>
<p>南アジアのイスラーム神秘主義、すなわちスーフィズムの儀礼で歌われる献身の歌。編成は独特で、主唱者1〜2名、副唱者1〜2名、手拍子と繰り返しの句を受け持つコーラス数名、ハルモニウム（蛇腹式のリード・オルガン）1〜2台、そしてタブラま</p>
<p>南アジアのイスラーム神秘主義、すなわちスーフィズムの儀礼で歌われる献身の歌。編成は独特で、主唱者1〜2名、副唱者1〜2名、手拍子と繰り返しの句を受け持つコーラス数名、ハルモニウム（蛇腹式のリード・オルガン）1〜2台、そしてタブラまたはドーラクという打楽器、加えて、主にコーラスが打つ手拍子で構成される。全員が床に座り、聴衆と向かい合う。演奏は穏やかに始まり、しだいに高まっていくのが通例である。まず器楽の導入があり、続いてアーラープと呼ばれる拍のない自由な旋法（音の並び方の型）の提示が行われ、そのあと、拍のない導入の詩がハルモニウムの伴奏だけで歌われ、本編が始まると同時にタブラ、ドーラク、手拍子が入って、テンポと音量が段階的に上がっていく。即興は、旋律や繰り返しの句の変奏、タラーナと呼ばれる速い部分などで行われる（本編の歌詞そのものは即興されない）。サルギャム（ドレミにあたるインドの音名で歌うこと）を挟む歌い方は、Nusrat Fateh Ali Khanが広めた。主唱者が一つの語や一行を繰り返し変奏しながら音域を上げていき、その反復と上昇が聴衆を陶酔、いわゆるハールへ導く。旋法はラーガ（インド古典音楽の旋律の型）の体系に基づき、リズムはターラ（リズムの周期）に従うが、古典音楽ほど厳格ではないともいわれる。歌は大きく力強い声で歌われ、1つの音節にいくつもの音を当てるメリスマ的な装飾を多用する。歌詞はペルシャ語、ウルドゥー語、パンジャーブ語、ヒンディー語で、多くは神への愛を恋人への愛にたとえて歌うが、神や預言者、聖者をそのままたたえる曲も多い。演奏は数十分から一時間以上に及ぶ。</p>
<h2>成り立ち</h2><p>起源には諸説あるが、通説では13世紀のデリーで、スーフィーの聖者Nizamuddin Auliyaの弟子であった詩人かつ音楽家Amir Khusrau（1253年から1325年）が創始したと伝えられる。彼はペルシャの音楽の伝統とインドの旋法体系を統合し、タブラやシタールの発明者としても伝説的に語られる（学界ではどちらの説も否定的に見られている）。カッワーリーはスーフィーの聖廟、すなわちダルガーで行われる儀礼サマーの中核として発展し、各地の聖廟に代々受け継ぐ演奏一族が形成された（形成の時期は特定しにくく、伝承ではデリー・スルタン朝期にさかのぼる）。伝統的には、演奏は娯楽のためではなく、聴く人を神と一つになったような気持ちへ導くためのもので、その宗教上の役目が曲の組み立てに強く影響してきた。ただし今は、宗教と関係のない場で演奏されることも多い。1947年のインド・パキスタン分離独立により、多くの演奏家がパキスタン側に移り、同国から国際的なスターが出た。一方、インド側のデリーやアジメールにも伝統は続いている。20世紀後半の決定的な人物がNusrat Fateh Ali Khan（1948年から1997年）である。彼は約600年続く演奏一族に生まれ、1971年に一族の座を継いだ。圧倒的な声量と即興の能力により、パキスタン国内で広く知られた後、1985年にPeter GabrielのWOMAD音楽祭に出演したことで国際的な注目を集めた。以後Real Worldレーベルから作品を発表し、Peter Gabrielの映画音楽への参加、Eddie Vedderとの共作、そしてMassive Attackらによるリミックスを通じて、西洋の聴き手にも広く知られた。しかしその過程で、伝統的な儀礼の文脈から切り離され、ワールド・ミュージックの商品として消費されることへの批判も生じた。彼は1997年、ロンドンで48歳で死去した。その後、甥のRahat Fateh Ali Khanが継承し、インドの映画音楽でも活躍している。近年はパキスタンで、イスラーム原理主義勢力などによる聖廟への攻撃（2010年のData Darbar、2017年のSehwanなど。実行した組織は事件ごとに違う）や、2016年の歌手Amjad Sabriの暗殺など、この音楽の担い手が暴力の標的となる事態も起きている。</p>
