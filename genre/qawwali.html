<h1>Qawwali（カッワーリー）とは</h1>
<p>南アジアのイスラーム神秘主義、すなわちスーフィズムの儀礼で歌われる献身の歌。編成は独特で、主唱者一名と副唱者数名、ハルモニウム（蛇腹式のリード・オルガン）二台、そしてタブラまたはドーラクという打楽器、加えて全員が打つ手拍子で構成さ</p>
<p>南アジアのイスラーム神秘主義、すなわちスーフィズムの儀礼で歌われる献身の歌。編成は独特で、主唱者一名と副唱者数名、ハルモニウム（蛇腹式のリード・オルガン）二台、そしてタブラまたはドーラクという打楽器、加えて全員が打つ手拍子で構成される。全員が床に座り、聴衆と向かい合う。演奏は必ず段階的に高まる構造をとる。まず器楽の導入があり、続いてアーラープと呼ばれる拍のない自由な旋法の提示が行われ、そこから拍が入り、詩が歌われ、テンポと音量が段階的に上がっていく。中核となるのはタラーナやサルギャムを用いた即興的な展開で、主唱者が一つの語や一行を繰り返し変奏しながら音域を上げていき、その反復と上昇が聴衆を陶酔、いわゆるハールへ導く。旋法はラーガの体系に基づき、リズムはターラの周期に従うが、古典音楽ほど厳格ではない。歌唱は喉を開いた大音量の発声で、装飾音とグリッサンドを多用する。歌詞はペルシャ語、ウルドゥー語、パンジャーブ語、ヒンディー語で、神への愛を恋人への愛の比喩で歌う。演奏は数十分から一時間以上に及ぶ。</p>
<h2>成り立ち</h2><p>起源は13世紀のデリーにあり、スーフィーの聖者Nizamuddin Auliyaの弟子であった詩人かつ音楽家Amir Khusrau（1253年から1325年）が創始したと伝えられる。彼はペルシャの音楽の伝統とインドの旋法体系を統合し、タブラやシタールの発明者としても伝説的に語られる。カッワーリーはスーフィーの聖廟、すなわちダルガーで行われる儀礼サマーの中核として発展し、ムガル帝国期を通じて各地の聖廟に世襲の演奏一族が形成された。演奏の目的は娯楽ではなく、聴衆を神との合一の意識へ導くことにあり、この宗教的な機能が音楽の構造そのものを規定している。1947年のインド・パキスタン分離独立により、多くの演奏一族がパキスタン側に移り、同国が中心地となった。20世紀後半の決定的な人物がNusrat Fateh Ali Khan（1948年から1997年）である。彼は600年続く演奏一族に生まれ、1971年に一族の座を継いだ。圧倒的な声量と即興の能力により、パキスタン国内で最高の地位を得た後、1985年にPeter GabrielのWOMAD音楽祭に出演したことで国際的な注目を集めた。以後Real Worldレーベルから作品を発表し、Peter Gabrielの映画音楽への参加、Eddie Vedderとの共作、そしてMassive Attackらによるリミックスを通じて、西洋の聴き手にも広く知られた。しかしその過程で、伝統的な儀礼の文脈から切り離され、ワールド・ミュージックの商品として消費されることへの批判も生じた。彼は1997年、ロンドンで48歳で死去した。その後、甥のRahat Fateh Ali Khanが継承し、インドの映画音楽でも活躍している。近年はパキスタンでのイスラーム原理主義勢力による聖廟への攻撃、2016年の歌手Amjad Sabriの暗殺など、この音楽の担い手が暴力の標的となる事態も起きている。</p>
