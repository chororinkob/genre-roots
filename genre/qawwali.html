<h1>Qawwali（カッワーリー）とは</h1>
<p>カッワーリーは、南アジアのイスラーム神秘主義、すなわちスーフィズムの儀礼で歌われる、献身の歌だ。 編成は独特だ。主唱者が1〜2名、副唱者が1〜2名、手拍子と反復句を担うコーラスが数名つく。楽器は、ハルモニウム（蛇腹式のリード・オル</p>
<p>カッワーリーは、南アジアのイスラーム神秘主義、すなわちスーフィズムの儀礼で歌われる、献身の歌だ。

編成は独特だ。主唱者が1〜2名、副唱者が1〜2名、手拍子と反復句を担うコーラスが数名つく。楽器は、ハルモニウム（蛇腹式のリード・オルガン）が1〜2台。そこにタブラまたはドーラクという打楽器が加わる。コーラス(副唱者)は、手拍子で拍を補強する。全員が床に座り、聴衆と向かい合う。

演奏は、穏やかに始まり、しだいに高まっていくのが通例だ。まず器楽の導入があり、続いてアーラープが出る。アーラープとは、拍のない自由な旋法（音の並び方の型）の提示のことだ。次に、拍のない序詩(ハルモニウム伴奏のみ)が歌われる。本編が始まると同時に、タブラ・ドーラク・手拍子が入る。そこから次第に、テンポと熱量が上がっていく。

即興は、旋律や反復句の変奏、タラーナなどの速い部分で行われる。サルギャムの挿入は、Nusratが広めた。主唱者は、一つの語や一行を繰り返し変奏しながら、音域を上げていく。その反復と上昇が、聴衆を陶酔、いわゆるハールへ導く。

旋法は、ラーガ（インド古典音楽の旋律の型）の体系に基づく。リズムはターラ（リズムの周期）に従うが、古典音楽ほど厳格ではないことが多い。

歌唱は、大音量で力強い発声で、メリスマ的な装飾を多用する。歌詞は、ペルシャ語、ウルドゥー語、パンジャーブ語、ヒンディー語で、神への愛を恋人への愛の比喩で歌うものが大半だ。演奏は、数十分から一時間以上に及ぶ。</p>
<h2>成り立ち</h2><p>舞台は、13世紀のデリーだ。起源には諸説あるが、通説では、スーフィーの聖者Nizamuddin Auliyaの弟子であった詩人かつ音楽家、Amir Khusrau（1253年から1325年）が創始したと伝えられる。

彼は、ペルシャの音楽の伝統とインドの旋法体系を統合した。また、タブラやシタールの発明者としても、伝説的に語られる（学界ではどちらの説も否定的に見られている）。

カッワーリーは、スーフィーの聖廟、すなわちダルガーで行われる儀礼サマーの中核として発展した。各地の聖廟には、代々受け継ぐ演奏一族が形成された（形成の時期は特定しにくく、伝承ではデリー・スルタン朝期にさかのぼる）。伝統的には、宗教的機能が演奏構成を方向づけてきた。ただし現在は、非宗教の場での演奏も多い。

1947年のインド・パキスタン分離独立により、多くの演奏家がパキスタン側に移ったとされる。同国からは、国際的なスターが出た。一方、インド側のデリーやアジメールにも、伝統は続いている。

20世紀後半の決定的な人物が、Nusrat Fateh Ali Khan（1948年から1997年）だ。彼は、約600年続く演奏一族に生まれ、1971年に一族の座を継いだ。圧倒的な声量と即興の能力により、パキスタン国内で名声を得た。その後、1985年にPeter GabrielのWOMAD音楽祭に出演し、国際的な注目を集めた。

以後は、Real Worldレーベルから作品を発表した。Peter Gabrielの映画音楽への参加、Eddie Vedderとの共作、そしてMassive Attackらによるリミックスを通じて、西洋の聴き手にも広く知られた。しかしその過程で、伝統的な儀礼の文脈から切り離され、ワールド・ミュージックの商品として消費されることへの批判も生じた。

彼は1997年、ロンドンで48歳で死去した。その後は、甥のRahat Fateh Ali Khanが継承し、インドの映画音楽でも活躍している。

近年は、パキスタンで聖廟への攻撃が起きている。2010年にはラホールのData Darbarで自爆攻撃があり、2017年にはSehwanの聖廟が襲われた。2016年には歌手Amjad Sabriが暗殺された。この音楽の担い手が、暴力の標的となる事態も起きている。</p>
