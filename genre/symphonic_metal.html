<h1>Symphonic Metal（シンフォニックメタル）とは</h1>
<p>ヘヴィメタルの編成に、管弦楽と合唱の書法を全面的に導入した様式。編成はギター、ベース、ドラムに加え、実際の管弦楽団あるいは高品質な音源による弦楽、金管、木管、そして混声合唱が重ねられる。書法の面では、単なる装飾としてではなく、管弦</p>
<p>ヘヴィメタルの編成に、管弦楽と合唱の書法を全面的に導入した様式。編成はギター、ベース、ドラムに加え、実際の管弦楽団あるいは高品質な音源による弦楽、金管、木管、そして混声合唱が重ねられる。書法の面では、単なる装飾としてではなく、管弦楽がギターと対等に主題を担い、対位法的に絡む点が重要である。ギターは低い調弦でパワー・コードを刻むが、その上に弦楽が旋律を重ねるため、和声の情報量が通常のメタルよりはるかに多い。和声は短調が基本で、ハーモニック・マイナーの増二度、ナポリの六度、減七の和音といったクラシック音楽由来の語彙が用いられ、劇的な転調も頻繁に行われる。BPMは中庸から速めで、拍子は四分の四が基本だが、三拍子の楽曲や変拍子も見られる。歌唱の中心は女性のソプラノで、オペラの発声法を用いる場合が多く、これに男性のグロウルが対比的に加わる、いわゆる美女と野獣の構成が定番となった。歌詞は神話、幻想文学、歴史、宗教、そして愛と死を主題とし、しばしばアルバム全体で一つの物語を語る。</p>
<h2>成り立ち</h2><p>1990年代半ばのヨーロッパで、ゴシック・メタルとパワーメタルの双方から発展した。直接の前史として、1980年代のCeltic Frostが管弦楽を試み、Therionが1996年のTheliに合唱と管弦楽を全面的に導入したことが挙げられる。スウェーデンのTherionを率いたChristofer Johnssonは、デスメタルからこの方向へ転じた人物である。決定的だったのは、オランダのWithin Temptationが1997年に発表したEnter、そしてフィンランドのNightwishが同年に発表したAngels Fall Firstである。とりわけNightwishは、Tuomas Holopainenの作曲と、クラシックの声楽を学んだTarja Turunenの歌唱により、この様式の代表的な形を作った。2000年前後には、オランダのAfter ForeverとEpicaが続き、いずれも女性の歌手と男性のグロウルの対比を用いた。この地域的な集中には理由がある。オランダとフィンランドはいずれもクラシック音楽の教育制度が充実しており、正規の声楽訓練を受けた歌手がメタルに参加する土壌があった。2000年代半ばには、実際の管弦楽団を招いた録音と公演が一般化し、Nightwishは2004年のOnceでロンドン・フィルハーモニー管弦楽団を起用した。しかし成功は内部の緊張も生み、2005年、Nightwishは公演の直後に手紙でTarja Turunenの解雇を通告し、その手紙を公開するという異例の形で決別した。この出来事は長く論争を呼んだ。以後、同バンドはAnette Olzon、次いでFloor Jansenを迎えて活動を続けている。商業的にはヨーロッパ大陸と南米、そして日本で強い支持を保ち、英語圏の主流市場ではあまり浸透していないという地理的な偏りがある。</p>
