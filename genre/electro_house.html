<h1>Electro House（エレクトロハウス）とは</h1>
<p>エレクトロハウスは、ハウスの四つ打ちに、極端に歪ませたシンセのベース音を乗せた攻撃的な系統だ。 中核は、ディストーション（音の歪み）をかけた矩形波（角張った波形）やノコギリ波（ぎざぎざの波形）のベースであることが多い。単に低音を鳴</p>
<p>エレクトロハウスは、ハウスの四つ打ちに、極端に歪ませたシンセのベース音を乗せた攻撃的な系統だ。

中核は、ディストーション（音の歪み）をかけた矩形波（角張った波形）やノコギリ波（ぎざぎざの波形）のベースであることが多い。単に低音を鳴らすのではなく、中域まで倍音（高い音の成分）を撒き散らして耳を刺す音になる。この音はしばしば1オクターブ跳躍したり、ピッチベンド（音の高さをなめらかに変える操作）で滑ったりして、旋律とリズムの両方を兼ねる。

和声（コードの響き）はマイナー調の単純な循環で、複雑さは意図的に避けられる。目立つメロディックなリフを持つことが多い。上物には、単純な単音のリードや、白色雑音を用いた上昇音(ライザー)がしばしば使われる。

テンポは125〜135BPM。キックは短く硬い音だ。サイドチェイン・コンプレッション（別の音に合わせて音量を自動で下げる処理）によって上物（メロディーなど上に重ねる音）を強く押し下げ、ポンプのような脈動を作ることが多い。この脈動はジャンルの視覚的なまでの特徴になっている。

ヴォーカルは断片的なフレーズか、あるいは加工した叫び声であることが多い。

ライザーは緊張を高める装置としてしばしば用いられ、8小節あるいは16小節かけて音程と音量を上げ続ける。その後に全ての音が一瞬止まる無音を挟んでから、最も激しい部分へ落ちる。この落差の設計がジャンルの快感の中心にあるとも言われる。構成は明快で、イントロ、積み上げ、無音、ドロップという型を繰り返す。ディープハウスやテックハウスと比べて微妙な質感の追求が少ない傾向があり、大音量の会場で肉体的な衝撃を与えることに多くが最適化されている。</p>
<h2>成り立ち</h2><p>エレクトロハウスは、1990年代後半に前身的な曲が現れた。Basement Jaxxの1997年「Raw Sh*t」などが、初期の例とされる。2002年のBenny Benassi『Satisfaction』が、定型を決定づけたとされる。起源には諸説ある。2006年ごろに、商業的なブレイクを迎えた。エレクトロクラッシュとフレンチハウスの歪んだ音を、ハウスの構造に接続する形をとる。

前史として、2001年前後のフランスでは、Daft Punkが2001年の「Discovery」で、フレンチハウスで固まったフィルター処理の流れを受け継いでいた。また、Vitalicの2001年「La Rock 01」がクラブでヒットしていた。

決定的だったのはパリのレーベルEd Bangerで、Pedro Winterが2003年に設立した。所属したJustice、SebastiAn、Mr Oizoは、音を意図的に潰して歪ませるという手法を極端まで押し進めた。とりわけJusticeの2007年のアルバム「Cross」は、歪んだ質感で知られる。

同時期にオランダではFedde Le Grandの2006年「Put Your Hands Up for Detroit」、フランスではDavid Guettaが商業的な成功を収める。もう一つの流れがオーストラリアで、シドニーを拠点とするThe Presetsとレーベル Modular、メルボルンのCut Copyなどが、それぞれの音を展開した。同時期のスウェーデンではSteve Angello、Sebastian Ingrosso、Axwellが個別に活動し、2008年にSwedish House Mafiaを結成する。

この系統の音は2009年前後にアメリカへ渡り、そこでEDMという名の巨大産業の中核になった。Las Vegasのカジノが大型クラブへ巨額を投資し、DJの出演料が一晩数十万ドルに達する市場が生まれた。2010年代前半を中心に、頂点となる。

しかし過剰な単純化への批判も強まった。同じ構造の曲が量産され、ドロップの形式が定型化しすぎたことで、2013年ごろから「EDMバブル」という言葉が使われ始める。またこの時期、大規模フェスティバルでの薬物による死亡事故が相次ぎ、Electric Zoo(ニューヨーク)が2013年に最終日を中止するなど、社会的な問題も表面化した。制作面では、過度な圧縮による音量競争である「音圧戦争」への批判が、音響技術者から向けられた。

2010年代半ば以降、フューチャー・ハウスやトロピカル・ハウスが人気を集め、相対的な存在感は下がった。しかし2020年代に入り、ブログハウスからエレクトロハウス期のサウンドを再評価する動きが一部で見られる。Skrillexが2010年代の自身の音を取り上げた例もある。</p>
