<h1>Electro House（エレクトロハウス）とは</h1>
<p>ハウスの四つ打ちに、極端に歪ませたシンセのベース音を乗せた攻撃的な系統。中核はディストーション（音の歪み）をかけた矩形波（角張った波形）やノコギリ波（ぎざぎざの波形）のベースで、単に低音を鳴らすのではなく、中域まで倍音（高い音の成</p>
<p>ハウスの四つ打ちに、極端に歪ませたシンセのベース音を乗せた攻撃的な系統。中核はディストーション（音の歪み）をかけた矩形波（角張った波形）やノコギリ波（ぎざぎざの波形）のベースで、単に低音を鳴らすのではなく、中域まで倍音（高い音の成分）を撒き散らして耳を刺す音になる。この音はしばしば1オクターブ跳躍したり、ピッチベンド（音の高さをなめらかに変える操作）で滑ったりして、旋律とリズムの両方を兼ねる。テンポは125〜135BPM。キックは短く硬い音で、サイドチェイン・コンプレッション（別の音に合わせて音量を自動で下げる処理）によって上物（メロディーなど上に重ねる音）を強く押し下げ、ポンプのような脈動を作る。この脈動はジャンルの視覚的なまでの特徴になっている。上物は少なく、単純な単音のリードと、白色雑音を用いた上昇音(ライザー)が中心。ライザーは緊張を高める装置として構造上不可欠で、8小節あるいは16小節かけて音程と音量を上げ続け、その後に全ての音が一瞬止まる無音を挟んでから、最も激しい部分へ落ちる。この落差の設計がジャンルの快感の中心にある。和声（コードの響き）はマイナー調の単純な循環で、複雑さは意図的に避けられる。ヴォーカルは断片的なフレーズか、あるいは加工した叫び声。構成は明快で、イントロ、積み上げ、無音、ドロップという型を繰り返す。ディープハウスやテックハウスと比べて微妙な質感の追求がなく、大音量の会場で肉体的な衝撃を与えることに全てが最適化されている。</p>
<h2>成り立ち</h2><p>1990年代半ばから後半に生まれ（Basement Jaxxの1997年「Raw S*it」などが初期の例とされる）、2006年ごろに商業的なブレイクを迎えた。エレクトロクラッシュとフレンチハウスの歪んだ音を、ハウスの構造に接続する形をとる。前史として、2003年前後のフランスでは、Daft Punkが2001年の「Discovery」で示したフィルター処理の手法と、Vitalicの2001年「La Rock 01」がクラブでヒットしていた。決定的だったのはパリのレーベルEd Bangerで、Pedro Winterが2003年に設立した。所属したJustice、SebastiAn、Mr Oizoは、音を意図的に潰して歪ませるという手法を極端まで押し進め、とりわけJusticeの2007年のアルバム「Cross」は、音圧（音の大きさや迫力）を限界まで上げて歪ませた制作でこの時代を象徴した。同時期にオランダではFedde Le Grandの2006年「Put Your Hands Up for Detroit」、フランスではDavid Guettaが商業的な成功を収める。もう一つの流れがオーストラリアで、シドニーを拠点とするThe Presetsとレーベル Modular、メルボルンのCut Copyなどが、それぞれの音を展開した。同時期のスウェーデンではSteve Angello、Sebastian Ingrosso、Axwellが個別に活動し、2008年にSwedish House Mafiaを結成する。この系統の音は2009年前後にアメリカへ渡り、そこでEDMという名の巨大産業の中核になった。Las Vegasのカジノが大型クラブへ巨額を投資し、DJの出演料が一晩数十万ドルに達する市場が生まれ、2010年から2014年頃が頂点となる。しかし過剰な単純化への批判も強まった。同じ構造の曲が量産され、ドロップの形式が定型化しすぎたことで、2013年ごろから「EDMバブル」という言葉が使われ始める。またこの時期、大規模フェスティバルでの薬物による死亡事故が相次ぎ、Electric Zoo(ニューヨーク)が2013年に最終日を中止するなど、社会的な問題も表面化した。制作面では、歪みを強調しすぎて音のダイナミクス（音量の幅）が失われる「音圧戦争」への批判が音響技術者から向けられた。2014年以降、市場はより歌もの寄りのフューチャー・ハウスやトロピカル・ハウスへ移行し、エレクトロハウスの過激な歪みは主流から退いた。しかし2020年前後からは、当時の音を懐かしむ再評価の動きが若い世代に広がり、Skrillexらが当時の表現を再び取り上げる動きも見られる。</p>
