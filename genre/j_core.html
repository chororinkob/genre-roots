<h1>J-Core（ジェイコア）とは</h1>
<p>日本で独自に発展した、ハードコア・テクノの総称である。 基本的な土台は、UK/USレイヴ、ロッテルダム・ガバ、欧州ハードテクノ、ハッピーハードコア、UKハードコア等に、日本のアニメ、ゲーム、ポップス、ボーカロイドの要素を重ねたもの</p>
<p>日本で独自に発展した、ハードコア・テクノの総称である。

基本的な土台は、UK/USレイヴ、ロッテルダム・ガバ、欧州ハードテクノ、ハッピーハードコア、UKハードコア等に、日本のアニメ、ゲーム、ポップス、ボーカロイドの要素を重ねたものだ。音の芯は、歪ませた四つ打ちのキックと明るい旋律の組み合わせである。

ただし、その上に重ねる音の作り方に、日本ならではの特徴がある。アニメやゲームの音楽から受け継いだ、複雑で情報量の多いメロディーが使われる。1小節の中で16分音符が細かく動き回ることがある。和音も、単純な4コードのくり返しにとどまらない。歌謡曲やアニメ主題歌に由来するとも言われる転調や、テンションを含む進行が使われることがある。こうした点が、欧州のハードコアとの違いの一つとされることがある。

テンポは、ハードコア・テクノ全般では160〜200BPM以上だ。J-Coreの中心的なテンポもその帯にある。ただし総称なので、hardstyle系など、それより遅い作品も含む。

歌には、日本語のアニメ調の歌唱やボーカロイド、あるいはアニメの台詞をサンプリングしたものが使われる。声は甲高い音程に加工されることがある。

制作の場は、同人音楽の文化と切り離せない。コミックマーケットで頒布されるCDが、主な発表の形だった。この文化では、既存のアニメやゲーム曲のリミックスが大量に作られてきた。原曲の旋律を高速のキックに乗せ替えるやり方が定着している。

曲の構成は、ブレイクダウンと復帰の型をとることがある。ただしその中に、展開が細かく詰め込まれている。4分の曲に複数の主題が現れることもある。欧州のハードコアと比べて情報の密度が高く、感傷とふざけが同居する独特の手触りを持つ。</p>
<h2>成り立ち</h2><p>この音楽の原型は、1990年代後半の日本で、複数の流れが合流して生まれた。2000年代中盤には海外で「J-core」と名付けられ、国内でも受け入れられた。

その前の時代、1990年代の日本にはレイヴ文化が入ってきていた。関西を中心に、東京、福岡などでも、ハードコアやガバのイベントが小規模に開かれていた。

そこへ、欧州のハードコアを日本の文脈に置き換える作家たちが現れる。その一人がDJ Sharpnelで、前身のPROJECT GABBANGELIONは1996年に奈良で結成された。もう一人が、2001年に国内初のハードコアレーベルDYNASTY RECORDSを設立したDJ Shimamuraだ。

決め手になったのは、同人音楽の文化とのつながりである。日本には、コミックマーケットをはじめとする同人誌即売会で、自主制作のCDを頒布するという独自の流通の形があった。1998年8月には、Sharpnelsoundから「Sharpnel vs Project Gabbangelion」がCD-Rで出た。こうして自主制作のハードコア作品が出回るようになり、アニメやゲームの楽曲をリミックスした作品が大量に作られた。この実践は無許可サンプリングを含み、権利の面では問題がありうる。二次創作一般は、権利者の黙認の上に成り立つとされる。

もう一つの重要な流れが、音楽ゲームである。1997年にKonamiが「beatmania」を発表してから、ゲームセンターの音楽ゲームが独自の楽曲の需要を生んだ。そこでは高速で情報量の多い楽曲が求められ、DJ TECHNORCH、kors k、Ryu☆といった作家が、ゲームの中でハードコアの楽曲を提供した。Ryu☆とkors kは2000年の『beatmania IIDX 4th style』でデビューし、DJ TECHNORCHのbeatmania IIDX参加は2007年である。その結果、音楽ゲームがハードコアに触れる入り口の一つになった。

レーベルでは、2003年設立のHARDCORE TANO*Cが中心的な役割を果たした。t+pazolite、DJ Noriken、Massive New Krewといった作家を抱え、2010年代を通じてJ-coreを代表するレーベルに成長した。イベントでは、HARDCORE TANO*Cのツアーや、大阪と東京のクラブでの定期公演が場を提供した。

一方、海外では、2000年代前半〜中盤からフォーラム等で知られるようになり、2010年代に広がった。動画共有サイトを通じて欧米やアジアの若い聴衆がこの音楽を見つけ、日本のアニメ文化への関心と結びついて、独自の受け止められ方が生まれた。海外発のJ-core風の制作も生まれた。</p>
