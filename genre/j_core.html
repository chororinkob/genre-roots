<h1>J-Core（ジェイコア）とは</h1>
<p>日本で独自に発展したハードコア・テクノの総称。テンポは170〜200BPM前後が中心。基本的な骨格は欧州のハッピーハードコアやUKハードコアを受け継ぎ、歪ませた四つ打ちのキックと明るい旋律を組み合わせる。しかし上物の作り方に日本固</p>
<p>日本で独自に発展したハードコア・テクノの総称。テンポは170〜200BPM前後が中心。基本的な骨格は欧州のハッピーハードコアやUKハードコアを受け継ぎ、歪ませた四つ打ちのキックと明るい旋律を組み合わせる。しかし上物の作り方に日本固有の特徴がある。アニメやゲームの音楽から受け継いだ、複雑で情報量の多い旋律が用いられ、しばしば一小節の中で16分音符が細かく動き回る。和声も単純な4コード循環に留まらず、歌謡曲やアニメ主題歌に由来する転調やテンションを含む進行が使われる。この和声の複雑さが、欧州のハードコアとの最大の相違点になっている。ヴォーカルは日本語のアニメ調の歌唱、ボーカロイド、あるいはアニメの台詞をサンプリングしたものが用いられ、甲高い音程に加工されることが多い。制作の場は同人音楽の文化と不可分で、コミックマーケットで頒布されるCDが主要な発表形態だった。この文化では、既存のアニメやゲーム曲のリミックスが大量に作られ、原曲の旋律を高速のキックに乗せ替えるという実践が定着している。曲の構成はブレイクダウンと復帰の型を守るが、その中に楽曲の展開が細かく詰め込まれ、4分の曲に複数の主題が現れることも多い。欧州のハードコアと比べて情報密度が高く、感傷とふざけが同居する独特の質感を持つ。</p>
<h2>成り立ち</h2><p>1990年代末から2000年代前半の日本で、複数の流れが合流して成立した。前史として、1990年代の日本ではレイヴ文化が輸入され、東京や大阪でハードコアやガバのイベントが小規模に開かれていた。DJ ShimamuraやDJ Sharpnelといった作家が1990年代末から活動を始め、欧州のハードコアを日本の文脈へ翻訳した。決定的だったのは同人音楽の文化との接続である。日本には、コミックマーケットをはじめとする同人誌即売会で自主制作のCDを頒布するという独自の流通形態が存在した。1998年前後からこの場でハードコアのCDが売られるようになり、アニメやゲームの楽曲をリミックスした作品が大量に作られた。この実践は著作権上は灰色の領域にあったが、権利者が黙認する慣行が長く続いた。もう一つの重要な流れが音楽ゲームである。1997年にKonamiが「beatmania」を発表して以降、ゲームセンターの音楽ゲームが独自の楽曲需要を生んだ。ここで高速で情報量の多い楽曲が求められ、DJ TECHNORCH、kors k、L.E.D.、Ryu☆といった作家がゲーム内でハードコアの楽曲を提供した。この結果、ハードコアが日本では地下文化ではなく、ゲームセンターという公共空間で日常的に鳴る音楽になるという、他国にない状況が生まれた。レーベルとしてはHARDCORE TANO*C(2004年設立)が中心的な役割を果たし、t+pazolite、DJ Noriken、Massive New Krewといった作家を擁して、この分野の標準を作った。同レーベルは同人即売会での頒布と、商業流通の両方を使い分ける独特の運営を行った。イベントとしてはHARDCORE TANO*Cのツアーや、大阪と東京のクラブでの定期公演が場を提供した。2010年代以降、この音楽は日本国外へ広がる。動画共有サイトを通じて欧米やアジアの若い聴衆が発見し、日本のアニメ文化への関心と結びついて独自の受容が起きた。海外の制作者が日本語のサンプルを用いた楽曲を作る例も現れ、逆輸入的な循環が生まれている。批判としては、既存曲のリミックスへの依存、そして構成の定型化が指摘される。一方で、音楽ゲームという産業と結びついたことで、他国のハードコアが直面した市場の縮小を免れ、安定した制作環境が維持されているという特異な状況にある。</p>
