<h1>Cyberpunk（サイバーパンク）とは</h1>
<p>サイバーパンクは、サイバーパンク的な美学を持つ作品群に対して使われる、定義の定まらない呼称だ。 中心になるのは、アナログシンセサイザーの分厚い持続音だ。フィルターをゆっくり開閉させて、雲のような音の壁を作る。その上を、金属的で冷た</p>
<p>サイバーパンクは、サイバーパンク的な美学を持つ作品群に対して使われる、定義の定まらない呼称だ。

中心になるのは、アナログシンセサイザーの分厚い持続音だ。フィルターをゆっくり開閉させて、雲のような音の壁を作る。その上を、金属的で冷たいアルペジオが、機械のように正確に走る。低音は、歪ませたシンセベースが担う。キックと重なって、空気を押すような低音になる。

和声は短調やフリギア旋法を基調にする。解決しない持続音を長く引き伸ばして、不安を保つ。

ドラムは打ち込みだ。リンドラムやTR-808系の乾いた音に、強い残響をかけたものを使う。そこに、工場の騒音を録音して加工した、インダストリアルな打撃音も併用される。テンポは、近縁のシンセウェイヴでは一般に80〜118BPMとされる。アップテンポの曲では128〜140BPMとされる。

人の声は、加工されることが多い。ボコーダーや機械的な音声合成を使う。ラジオの雑音のように処理された台詞が、挿入されることもある。

歌詞や題名は、巨大企業の支配、監視、身体の機械化、都市の廃墟、人工知能といった主題を扱う。

曲の構成は、歌よりも情景の提示に重心がある。旋律は現れては消え、同じ音型が延々と変奏される。演奏の場は、映画とゲームの劇伴だ。そして、暗い照明とネオン管を用いたクラブの催しでも演奏される。</p>
<h2>成り立ち</h2><p>サイバーパンクの音の原型は、1980年代の文学運動（サイバーパンク）より先にあった。文学側の先駆は、Delany『Nova』（1968）、Dick『Do Androids Dream of Electric Sheep?』（1968）、Brunner『The Shockwave Rider』（1975）などだ。「cyberpunk」という語は、Bruce Bethkeの短編に由来する。この短編は1980年に書かれ、1983年にAmazing Storiesに載った。

音楽では、1970年代のドイツが出発点になった。Tangerine DreamやKlaus Schulzeが、シーケンサーで自動的に走る音型による長大な作品を作った。Kraftwerkは、『Die Mensch-Maschine』(1978)で人間と機械の融合を主題にした。

そして、決定的だったのは映画だ。1982年、Ridley Scott監督の『Blade Runner』の音楽を、ギリシャのVangelisが担当した。Yamaha CS-80という当時のシンセの、揺れながら重なる音色は、雨に濡れた未来都市の映像と不可分に結びついた。サイバーパンク映像作品の音は多様だが、『ブレードランナー』のシンセ音は、その代表的な一例である。

同じ1982年には、William Gibsonが短編『Burning Chrome』を発表した。1984年には小説『Neuromancer』で、サイバースペースという語を定着させた。日本からも、印象的な作品が出た。1988年のアニメ映画『AKIRA』では、芸能山城組がガムランと合唱を用いた、異質な音楽を付けた。1995年の『GHOST IN THE SHELL 攻殻機動隊』では、川井憲次が日本の古謡をブルガリア風の合唱で歌わせ、電子音と組み合わせた。

1980年代後半から1990年代にかけては、インダストリアル／エレクトロ・インダストリアルの一部が、サイバーパンク的な題材と結びついた。

2000年代以降、この音は一度、懐かしいものとして扱われるようになる。2000年代半ばに、主にフランスのハウス系プロデューサーらによって、シンセウェイヴが形成された。これが、2011年の映画『Drive』（Kavinskyの『Nightcall』ほか）で広く知られるようになった。これが契機となり、その音楽と、Perturbator、Carpenter Brut、Gunshipといった作り手が、意図的に1980年代の質感を再現した。

2020年には、ゲーム『Cyberpunk 2077』が発売された。スコアは、Marcin Przybyłowicz（音楽監督）、P.T. Adamczyk、Paul Leonard-Morganが担当した。架空のラジオ局の楽曲は、Run the Jewels、Grimes、Refusedなどが、架空バンド名義（Yankee and the Brave、Lizzy Wizzyなど）で提供した。作曲陣は、インダストリアル、テクノ、レイヴ、IDMなど1990年代のジャンルを土台のひとつにした。

ただし、サイバーパンクという世界観そのものが、資本主義と技術への批判として生まれながら、いつしか消費される美意識に変わった、という批判も繰り返し提起されている。</p>
