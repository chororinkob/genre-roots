<h1>Cyberpunk（サイバーパンク）とは</h1>
<p>サイバーパンクという文学と映像の世界観に合う作品に対して使われる呼び名で、何を指すかのはっきりした決まりはない。中心になるのは、アナログシンセサイザーの分厚い持続音であることが多く、フィルターをゆっくり開閉させて雲のような音の壁を</p>
<p>サイバーパンクという文学と映像の世界観に合う作品に対して使われる呼び名で、何を指すかのはっきりした決まりはない。中心になるのは、アナログシンセサイザーの分厚い持続音であることが多く、フィルターをゆっくり開閉させて雲のような音の壁を作り、その上に金属的で冷たいアルペジオが機械のように正確に走る。低音は歪ませたシンセベースが担い、キックと重なって空気を押す。ドラムは打ち込みで、リンドラムやTR-808系の乾いた音に強い残響をかけたものと、工場の騒音を録音して加工したインダストリアルな打撃音が併用される。テンポは、近縁のシンセウェイヴでは一般に80〜118BPM、アップテンポの曲で128〜140BPMとされる。和声は、短調やフリギア旋法を土台に、解決しない持続音を長く引き伸ばして不安を保つことがよくある。曲の構成は、歌よりも情景を見せることに重きを置くものが多く、旋律が現れては消え、同じ音型がえんえんと形を変えて繰り返されることがある。人の声は加工されることが多く、ボコーダーや機械的な音声合成、ラジオの雑音のように処理された台詞が挿入される。歌詞や題名は、巨大企業の支配、監視、身体の機械化、都市の廃墟、人工知能といった主題を扱う。聴かれる場は、映画やゲームの場面に流れる音楽のほか、暗い照明とネオン管を使ったクラブのイベントなどがある。</p>
<h2>成り立ち</h2><p>音の原型は、1980年代の文学運動（サイバーパンク）より先にあった（文学側の先駆は、Delany『Nova』（1968）、Dick『Do Androids Dream of Electric Sheep?』（1968）、Brunner『The Shockwave Rider』（1975）など）。「cyberpunk」という語はBruce Bethkeの短編で、1980年に書かれ、1983年にAmazing Storiesに載った。1970年代、ドイツのTangerine DreamやKlaus Schulzeが、シーケンサーで自動的に走る音型による長大な作品を作り、Kraftwerkは『Die Mensch-Maschine』(1978)で人間と機械の融合を主題にした。決定的だったのは映画で、1982年、Ridley Scott監督の『Blade Runner』の音楽をギリシャのVangelisが担当した。Yamaha CS-80という当時のシンセの、揺れながら重なる音色は、雨に濡れた未来都市の映像と不可分に結びつき、サイバーパンク映像作品の音は多様で、『ブレードランナー』のシンセ音はその代表的な一例である。同じ1982年にはWilliam Gibsonが短編『Burning Chrome』を発表し、1984年の小説『Neuromancer』でサイバースペースという語を定着させた。1988年の日本のアニメ映画『AKIRA』では芸能山城組がガムランと合唱を用いた異質な音楽を付け、1995年の『GHOST IN THE SHELL 攻殻機動隊』では川井憲次が日本の古謡をブルガリア風の合唱で歌わせ、電子音と組み合わせた。1980年代後半から1990年代にかけて、インダストリアル音楽やエレクトロ・インダストリアル（電子音を中心にしたインダストリアル音楽）の一部が、サイバーパンクふうの題材と結びついた。その例として、Nine Inch Nails（1988年結成）やFront Line Assembly（1986年結成）、Skinny Puppy（1982年結成）が挙げられる。2000年代以降、この音は一度懐かしいものとして扱われるようになる。2000年代半ばに、主にフランスのハウス系プロデューサーらによって形成されたシンセウェイヴが、2011年の映画『Drive』（Kavinskyの『Nightcall』ほか）で広く知られるようになったことが契機で、その音楽と、Perturbator、Carpenter Brut、Gunshipといった作り手が、意図的に1980年代の質感を再現した。Dangerは『Drive』より前の2007年から活動していたフランスの電子音楽家で、1980年代ふうの音が聴こえるのは作品の一部である。2020年に発売されたゲーム『Cyberpunk 2077』は、スコアはMarcin Przybyłowicz（音楽監督）、P.T. Adamczyk、Paul Leonard-Morganが担当し、架空のラジオ局の楽曲はRun the Jewels、Grimes、Refusedなどが架空バンド名義（Yankee and the Brave、Lizzy Wizzyなど）で提供した。作曲陣は、インダストリアル、テクノ、レイヴ（大勢で踊る夜通しのパーティーと、その音楽）、IDMなど1990年代のジャンルを土台のひとつにした。ただしサイバーパンクという世界観そのものが、資本主義と技術への批判として生まれながら、いつしか消費される美意識に変わったという批判も繰り返し提起されている。</p>
