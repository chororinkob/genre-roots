<h1>Cyberpunk（サイバーパンク）とは</h1>
<p>サイバーパンクという文学と映像の世界観に対応する音楽の総称。中核にあるのはアナログシンセサイザーの分厚い持続音で、フィルターをゆっくり開閉させて雲のような音の壁を作り、その上に金属的で冷たいアルペジオが機械のように正確に走る。低音</p>
<p>サイバーパンクという文学と映像の世界観に対応する音楽の総称。中核にあるのはアナログシンセサイザーの分厚い持続音で、フィルターをゆっくり開閉させて雲のような音の壁を作り、その上に金属的で冷たいアルペジオが機械のように正確に走る。低音は歪ませたシンセベースが担い、キックと重なって空気を押す。ドラムは打ち込みで、リンドラムやTR-808系の乾いた音に強い残響をかけたものと、工場の騒音を録音して加工したインダストリアルな打撃音が併用される。テンポは毎分100から130拍程度が多い。和声は短調やフリギア旋法を基調に、解決しない持続音を長く引き伸ばして不安を保つ。曲の構成は歌よりも情景の提示に重心があり、旋律が現れては消え、同じ音型が延々と変奏される。人の声は加工されることが多く、ボコーダーや機械的な音声合成、ラジオの雑音のように処理された台詞が挿入される。歌詞や題名は、巨大企業の支配、監視、身体の機械化、都市の廃墟、人工知能といった主題を扱う。演奏の場は映画とゲームの劇伴、そして暗い照明とネオン管を用いたクラブの催しである。</p>
<h2>成り立ち</h2><p>音の原型は文学より先にあった。1970年代、ドイツのTangerine DreamやKlaus Schulzeが、シーケンサーで自動的に走る音型による長大な作品を作り、Kraftwerkは『Die Mensch-Maschine』(1978)で人間と機械の融合を主題にした。決定的だったのは映画で、1982年、Ridley Scott監督の『Blade Runner』の音楽をギリシャのVangelisが担当した。Yamaha CS-80という当時のシンセの、揺れながら重なる音色は、雨に濡れた未来都市の映像と不可分に結びつき、以後この音がサイバーパンクの標準的な音響になった。同じ1982年にはWilliam Gibsonが短編を発表し、1984年の小説『Neuromancer』でサイバースペースという語を定着させた。1988年の日本のアニメ映画『AKIRA』では芸能山城組がガムランと合唱を用いた異質な音楽を付け、1995年の『GHOST IN THE SHELL 攻殻機動隊』では川井憲次が日本の古謡をブルガリア風の合唱で歌わせ、電子音と組み合わせた。1990年代にはインダストリアル音楽が接近し、Nine Inch NailsやFront Line Assembly、Skinny Puppyが、機械の暴力性を音にした。2000年代以降、この音は一度懐かしいものとして扱われるようになる。2011年頃から始まったシンセウェイヴの流行がその契機で、2011年の映画『Drive』の音楽と、Perturbator、Carpenter Brut、Danger、Gunshipといった作り手が、意図的に1980年代の質感を再現した。2020年に発売されたゲーム『Cyberpunk 2077』は、架空のラジオ局ごとに異なる作曲家を起用する大規模な企画となり、この分野の音楽を改めて一つのまとまりとして示した。ただしサイバーパンクという世界観そのものが、資本主義と技術への批判として生まれながら、いつしか消費される美意識に変わったという批判も繰り返し提起されている。</p>
