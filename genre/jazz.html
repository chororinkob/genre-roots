<h1>Jazz（ジャズ）とは</h1>
<p>ジャズは、スウィング感のあるリズムに乗せた即興演奏（アドリブ）が最大の魅力の音楽だ。演奏者がその場の空気で旋律を自由に変え、予測できない展開が生まれる。これがジャズ独特の面白さである。 中心になるのは、サックスやトランペットの艶や</p>
<p>ジャズは、スウィング感のあるリズムに乗せた即興演奏（アドリブ）が最大の魅力の音楽だ。演奏者がその場の空気で旋律を自由に変え、予測できない展開が生まれる。これがジャズ独特の面白さである。

中心になるのは、サックスやトランペットの艶やかな音色だ。

和音には、メジャー・マイナーだけでなく、拡張和声（9th・11th・13thなどのテンション）も使われる。モダン・ジャズ以降の即興理論では、この拡張和声とそのヴォイシング（コード・ヴォイシング）に、対応するスケール（コード・スケール）を組み合わせて、即興を組み立てる手法が広く用いられる。

リズムの土台は「スウィング」だ。これは長短に不均等に分割するリズムを指す言葉で、3連符寄りになることが多いが、比率は可変である。ここに2・4拍のアクセント（バックビート）も加わって、跳ねる推進力が生まれる。

ドラムとベースも、この推進力を支える。モダン・ジャズ（ビバップ以降）の典型的なリズム隊は、ライドシンバルのレガート（曲によってはブラシ奏法）と、ウォーキングベース（1拍ごとに音を刻み続けるベースライン）が土台になる。

テンポは、スローバラードからアップテンポまで幅広い。どのスタイルにも共通するのは、「今この瞬間の創造性」を尊ぶ精神だ。夜のバーが似合う大人びた雰囲気で、時にメランコリック、時に高揚感にあふれる。

スタイルは、時代とともに次々に現れた。ディキシーランド（集団即興）、スウィング（ビッグバンドのダンス音楽）、ビバップ（超高速・複雑なコード進行での個人技即興）、クールジャズ（抑制された響き）、モード・ジャズ（コードよりも旋法中心の即興、代表曲『So What』）、フリージャズ（調性からの解放）、フュージョン（ロック/ファンクとの電化融合）の順だ。これらの主なスタイルは、並行・重複しながら登場した。ジャズは、極めて自己革新的なジャンルである。</p>
<h2>成り立ち</h2><p>19世紀末〜20世紀初頭、ニューオーリンズの黒人コミュニティで、ジャズは誕生した。ブルースのブルーノート、ラグタイムのシンコペーション、スピリチュアルズ（黒人霊歌）や賛美歌の高揚感、そしてマーチングバンドの楽器編成が融合したのだ。マーチングバンドについては、南北戦争後に軍用の太鼓類が入手でき、マーチングバンド文化が根づいた。ただし、金管楽器が軍の放出品から広まったという通説は、実証が不十分とされる。

関係者の証言などから「ジャズの父」と呼ばれるのが、Buddy Boldenだ。伝説的な存在である。やがて、King Oliverの師事を受けたLouis Armstrongが、1922年にシカゴで彼の楽団に加わった。彼は、それまでの集団即興中心のスタイルから、ソロ中心のスタイルへの転換を決定づけた。

1920年代は禁酒法の時代だった。ジャズは、シカゴやニューヨークのスピークイージー（非合法酒場）で演奏の場を広げ、「ジャズ・エイジ」と呼ばれる社会現象になった。

続く1930年代半ば〜1940年代半ばは、Duke EllingtonやCount Basieらのビッグバンドによる「スウィング時代」だ。ジャズは、ダンスミュージックとして大衆的な人気の頂点を迎えた。

しかし1940年代、流れが変わる。Charlie ParkerとDizzy Gillespieに加え、Thelonious MonkやKenny Clarkeらが、ニューヨーク・ハーレムのミントンズ・プレイハウスなどのクラブでジャムセッションを重ね、「ビバップ」を形づくった。ジャズは、ダンス音楽から「聴くための音楽・芸術音楽」へと性格を変えたのである。

その後も、Miles Davisは自らのスタイルを繰り返し刷新し続けた。まず、クールジャズ。これはMiles Davis名義の9人編成の録音で、のちに『Birth of the Cool』としてまとめられ、クール・ジャズの出発点とされる。次に、モード・ジャズ。Davisにとって最初のモード作品は、1958年の『Milestones』のタイトル曲で、1959年の『Kind of Blue』で全面的に展開された。そして、ロックやファンクの要素を取り込んだフュージョンだ。『Bitches Brew』は、『In a Silent Way』（1969）に続き、フュージョンを定義・普及させたとされる。

John Coltraneは、モード奏法を極限まで掘り下げ、後にフリージャズへと接近した。

こうして生まれた即興精神とハーモニーの豊かさは、後のロック、ソウル、ヒップホップのサンプリング文化など、多くのポピュラー音楽に大きな影響を与えた。</p>
