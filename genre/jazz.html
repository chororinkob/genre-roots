<h1>Jazz（ジャズ）とは</h1>
<p>スウィング感のあるリズムに乗せた即興演奏（アドリブ）が最大の魅力。演奏者がその場の空気で旋律を自由に変え、予測できない展開が生まれるのがジャズ独特の面白さ。理論的な核となるのは、メジャー・マイナーだけでなく7th・9th・13th</p>
<p>スウィング感のあるリズムに乗せた即興演奏（アドリブ）が最大の魅力。演奏者がその場の空気で旋律を自由に変え、予測できない展開が生まれるのがジャズ独特の面白さ。理論的な核となるのは、メジャー・マイナーだけでなく7th・9th・13thといったテンションを含む拡張和声（コード・ヴォイシング）と、それに対応するスケール（コード・スケール）の組み合わせで即興を組み立てる手法。「スウィング」はリズムの3連符寄りの跳ね方（シャッフル的な裏拍の強調）を指す言葉で、これが「揺れるグルーヴ」の正体。サックスやトランペットの艶やかな音色、ブラッシュワークを多用するドラムのシンバルレガート、ウォーキングベース（1拍ごとに音を刻み続けるベースライン）が土台を作る。時代とともにディキシーランド（集団即興）→スウィング（ビッグバンドのダンス音楽）→ビバップ（超高速・複雑なコード進行での個人技即興）→クールジャズ（抑制された響き）→モード・ジャズ（コードよりも旋法中心の即興、代表曲『So What』）→フリージャズ（調性からの解放）→フュージョン（ロック/ファンクとの電化融合）と、およそ10年ごとに様式が刷新され続けてきた、極めて自己革新的なジャンル。テンポはスローバラードからアップテンポまで幅広いが、どのスタイルにも共通する「今この瞬間の創造性」を尊ぶ精神がある。夜のバーが似合う大人びた雰囲気で、時にメランコリック、時に高揚感にあふれる。</p>
<h2>成り立ち</h2><p>19世紀末〜20世紀初頭、ニューオーリンズの黒人コミュニティで、ブルースのブルーノート、ラグタイムのシンコペーション、ゴスペルの高揚感、マーチングバンド（南北戦争後に放出された軍楽隊の楽器がアフリカ系住民の手に渡ったことが一因とされる）の楽器編成が融合して誕生した。Buddy Boldenが伝説的な初期のスタイルを確立したとされ、King Oliverのもとで頭角を現したLouis Armstrongが、それまでの集団即興中心のスタイルから「ソリスト（独奏者）が主役になる」という決定的な転換をもたらした。1920年代の禁酒法時代、シカゴやニューヨークのスピークイージー（非合法酒場）で演奏の場を広げ、「ジャズ・エイジ」と呼ばれる社会現象になった。1930年代はDuke EllingtonやCount Basieらのビッグバンドによる「スウィング時代」で、ダンスミュージックとして大衆的な人気の頂点を迎える。1940年代、Charlie ParkerとDizzy Gillespieが、ニューヨークのミントンズ・プレイハウスでのジャムセッションから「ビバップ」を生み出し、ダンス音楽から「聴くための音楽・芸術音楽」へと性格を変えた。Miles Davisはその後もクールジャズ（『Birth of the Cool』）、モード・ジャズ（『Kind of Blue』）、そしてロックやファンクの要素を取り込んだフュージョン（『Bitches Brew』）へと、自らのスタイルを繰り返し刷新し続けた。John Coltraneはモード奏法を極限まで掘り下げ、後にフリージャズへと接近した。その即興精神とハーモニーの豊かさは、後のあらゆるポピュラー音楽（ロック、ソウル、ヒップホップのサンプリング文化に至るまで）の基盤となった。</p>
<h2>代表曲</h2><ul><li>So What (Miles Davis)</li><li>Take Five (Dave Brubeck)</li><li>A Love Supreme (John Coltrane)</li></ul>
