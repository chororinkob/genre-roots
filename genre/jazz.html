<h1>Jazz（ジャズ）とは</h1>
<p>スウィング感のあるリズムに乗せた即興演奏（アドリブ）が最大の魅力。演奏者がその場の空気で旋律を自由に変え、予測できない展開が生まれるのがジャズ独特の面白さ。モダン・ジャズ以降の即興理論としては、メジャー・マイナーだけでなく拡張和声</p>
<p>スウィング感のあるリズムに乗せた即興演奏（アドリブ）が最大の魅力。演奏者がその場の空気で旋律を自由に変え、予測できない展開が生まれるのがジャズ独特の面白さ。モダン・ジャズ以降の即興理論としては、メジャー・マイナーだけでなく拡張和声（9th・11th・13thなどのテンション）とそのヴォイシング（コード・ヴォイシング）と、それに対応するスケール（コード・スケール）の組み合わせで即興を組み立てる手法が広く用いられる。「スウィング」は長短に不均等に分割するリズムを指す言葉で、3連符寄りになることが多いが比率は可変であり、2・4拍のアクセント（強めに打つ拍）も加わって、跳ねる推進力が生まれる。サックスやトランペットの艶やかな音色、モダン・ジャズ（ビバップ以降）の典型的なリズム隊は、ライドシンバル（一定の刻みを鳴らす大きなシンバル）をなめらかに刻み続けるレガート（曲によってはブラシという刷毛状の道具での奏法）を土台にするドラムと、ウォーキングベース（1拍ごとに音を刻み続けるベースライン）が土台を作る。時代とともに、主な様式が並行・重複しながら次々に登場してきた。ディキシーランド（集団即興）→スウィング（ビッグバンドのダンス音楽）→ビバップ（超高速・複雑なコード進行での個人技即興）→クールジャズ（抑制された響き）→モード・ジャズ（コードよりも旋法中心の即興、代表曲『So What』）→フリージャズ（調性からの解放）→フュージョン（ロック/ファンクとの電化融合）などが現れ、ハード・バップ（クールジャズなどへの反応として生まれたとも見られる様式）のように同時期に並行して発展した様式もある、極めて自己革新的なジャンル。テンポはスローバラードからアップテンポまで幅広いが、どのスタイルにも共通する「今この瞬間の創造性」を尊ぶ精神がある。夜のバーが似合う大人びた雰囲気で、時にメランコリック、時に高揚感にあふれる。</p>
<h2>成り立ち</h2><p>19世紀末〜20世紀初頭、ニューオーリンズの黒人コミュニティで、ブルースのブルーノート（半音ほど低くずらした哀愁の音）、ラグタイムのシンコペーション（拍をずらす乗り）、スピリチュアルズ（黒人霊歌）や賛美歌の高揚感、マーチングバンド（南北戦争後に軍用の太鼓類が手に入るようになったことで根づいた）の楽器編成が融合して誕生した。Buddy Boldenが伝説的な初期のスタイルを確立したとされ、King Oliverのもとで頭角を現したLouis Armstrongが、それまでの集団即興中心のスタイルから、ソロ中心の様式への転換を決定づけた。1920年代の禁酒法時代、シカゴやニューヨークのスピークイージー（非合法酒場）で演奏の場を広げ、「ジャズ・エイジ」と呼ばれる社会現象になった。1930年代はDuke EllingtonやCount Basieらのビッグバンドによる「スウィング時代」で、ダンスミュージックとして大衆的な人気の頂点を迎える。1940年代、Charlie ParkerとDizzy Gillespieに加え、Thelonious MonkやKenny Clarkeらが、ニューヨーク・ハーレムのミントンズ・プレイハウスなどのクラブでの即興の合同演奏（ジャムセッション）から「ビバップ」を形づくり、ダンス音楽から「聴くための音楽・芸術音楽」へと性格を変えた。Miles Davisはその後もクールジャズ（『Birth of the Cool』）、モード・ジャズ（1958年の『Milestones』で最初に試み、1959年の『Kind of Blue』で全面的に展開）、そしてロックやファンクの要素を取り込んだフュージョン（『Bitches Brew』は、フュージョンを定義づけた代表作）へと、自らのスタイルを繰り返し刷新し続けた。John Coltraneはモード奏法を極限まで掘り下げ、後にフリージャズへと接近した。その即興精神とハーモニーの豊かさは、後のロック、ソウル、ヒップホップのサンプリング文化など、多くのポピュラー音楽に大きな影響を与えた。</p>
