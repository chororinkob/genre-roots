<h1>Soulful House（ソウルフルハウス）とは</h1>
<p>ハウスの中でも、歌と和音の豊かさ、そして黒人教会の音楽の伝統を受け継いだ一派とされる。 演奏には、ピアノや電気ピアノ、ギター、ベース、ウッドベース、サックス、トランペットなどの生演奏が加えられることが多い。機械で打ち込んだ音だけで</p>
<p>ハウスの中でも、歌と和音の豊かさ、そして黒人教会の音楽の伝統を受け継いだ一派とされる。

演奏には、ピアノや電気ピアノ、ギター、ベース、ウッドベース、サックス、トランペットなどの生演奏が加えられることが多い。機械で打ち込んだ音だけでは終わらない。低音には、生のベースが使われることが多い。

歌を支えるのは和音だ。単純な三つの音の和音ではなく、次々に雰囲気が変わる和音の流れが使われ、ジャズに近い響きを持つ。

テンポは概ね122から127 BPMだ。キックは四つ打ちを保つが、くつろいだ雰囲気が保たれる。打楽器にはコンガが重ねられ、ラテン音楽の影響がはっきり聞こえる。

いちばん大事な要素は歌である。ゴスペルの訓練を受けた歌手の、力強く伸びやかな歌声が主役になる。旋律は単純ではなく、飾りを凝らした細かい音の動きを含む。

歌詞は、愛、自己肯定、困難の克服、そして踊り場を居場所として肯定する内容が中心だ。聴き手を励ます姿勢が一貫している。

曲の組み立ては、歌ものとしての形を保つ。そのうえで、DJが扱えるように、冒頭と末尾に打楽器だけの区間が設けられる。</p>
<h2>成り立ち</h2><p>ハウスは1980年代前半のシカゴで生まれた。その主な源流の一つはディスコである。

ゴスペルの影響がはっきり見られるとされるのは、ガレージ・ハウスやジャージー・サウンドだ。そこでは、ゴスペル由来のピアノの反復句や女性の歌声が強く出ている。1980年代前半から半ばにかけて、ニューヨークとニュージャージーでも、ディスコを土台に歌ものの流れが育った。どちらが先かには諸説ある。ニューヨークのParadise Garageで選曲を担ったLarry Levanや、ニュージャージーのクラブZanzibarのTony Humphriesの影響のもと、この地域の音は歌ものの伝統を色濃く受け継いだ。

1990年代に入ると、このスタイルが実を結ぶ。Louie VegaとKenny Dopeによる2人組Masters at Workは、Nuyorican Soulなどでラテン音楽、ディスコ、ジャズを取り入れた。ニュージャージーのKerri Chandlerは、DJだった父の影響で13歳からDJを始めた。その音は、深い低音と温かい和音が特徴とされる。ニューヨークのJoe Claussell、そしてBarbara TuckerやUltra Natéといった歌手が、この分野を豊かにした。

流通を支えたのは、Strictly RhythmやKing Street Soundsといったニューヨークの独立系レーベルだ。1999年にイギリスで設立されたDefectedは、ハウス全般を扱う英国のレーベルである。初期にはボーカル系の作品も出し、ソウルフル・ハウスの国際的な普及にも関わった。

この分野で特に注目したいのは、社会の中での役割である。ニューヨークには、Paradise Garageのように、黒人の同性愛の男性をはじめとする少数者が集った場があった。そこは、人種や階級、性的指向で会員を差別しなかった。そこで鳴る音楽は、外の世界で否定される存在を肯定する言葉を歌っていた。エイズ危機で多くの担い手と客が失われたという事実も、この音楽の切実さと切り離せない。

2000年代以降は、より簡素で機能的なハウスが主流になったとされる。その中で、歌と和声を重んじるこのスタイルは、古風と見なされることもあったと言われる。それでも今も世界中に熱心な聴き手を持ち、ハウスのゴスペル的な側面を代表するスタイルとして参照される。</p>
<h2>代表曲</h2><ul><li>Somebody Else's Guy (Jocelyn Brown)</li><li>Finally (Kings of Tomorrow)</li><li>Rain (Kerri Chandler)</li><li>It's You, It's Me (Kaskade)</li><li>Promised Land (Joe Smooth)</li><li>Beautiful People (Barbara Tucker)</li><li>Lovelee Dae (Blaze)</li><li>Atmospheric Beats (Original Extented Version) (Kerri Chandler)</li><li>Foundation (Ten City)</li><li>That's All I Needed (Kerri Chandler)</li><li>Someday (Ce Ce Rogers)</li><li>I Found U (Kerri Chandler)</li></ul>
