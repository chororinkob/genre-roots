<h1>Soulful House（ソウルフルハウス）とは</h1>
<p>ハウスの中でも、歌と和声の豊かさ、そして黒人教会の音楽的な伝統を正面から引き受けた一派である。テンポは概ね120から125 BPM、キックは四つ打ちを保つが、音圧を競うことはせず、全体の音量は抑えられて余裕が保たれる。決定的な要素</p>
<p>ハウスの中でも、歌と和声の豊かさ、そして黒人教会の音楽的な伝統を正面から引き受けた一派である。テンポは概ね120から125 BPM、キックは四つ打ちを保つが、音圧を競うことはせず、全体の音量は抑えられて余裕が保たれる。決定的な要素は歌である。ゴスペルの訓練を受けた歌手による、力強く伸びやかな歌唱が主役に据えられ、旋律は単純ではなく、装飾を凝らした細かい音の動きを含む。この歌を支えるのが和声で、単純な三和音ではなく、七の和音や九の和音、そして次々に色を変える進行が用いられ、ジャズに近い響きを持つ。演奏には生のピアノや電気ピアノ、弦楽合奏、金管楽器が加えられることが多く、打ち込みだけで完結しない。低音は指弾きのベースを模した滑らかな動きを見せる。打楽器にはコンガやボンゴが重ねられ、ラテン音楽の影響が明瞭である。曲の構成は歌ものとしての形式を保ちながら、DJが扱えるよう冒頭と末尾に打楽器だけの区間が設けられる。歌詞は愛、自己肯定、困難の克服、そして踊り場を居場所として肯定する内容が中心で、聴き手を鼓舞する姿勢が一貫している。</p>
<h2>成り立ち</h2><p>ハウスは1980年代前半のシカゴで生まれたが、その起源にはディスコがあり、さらにその根には黒人教会のゴスペルがあった。1980年代半ば、ニューヨークとニュージャージーでは、シカゴの機械的な音とは異なり、歌と和声を重んじる方向が発達する。ニューヨークのParadise Garageでの選曲を担ったLarry Levanの影響のもと、この地域の音は歌ものの伝統を色濃く受け継いだ。1990年代に入るとこの様式が結実する。Louie VegaとKenny Dopeによる二人組Masters at Workは、ラテン音楽とジャズ、そしてゴスペルの歌唱を統合し、この分野の水準を決定づけた。ニュージャージーのKerri Chandlerは、教会で音響を担当していた父の影響を公言しており、深い低音と温かい和音による独自の音を確立している。ニューヨークのJoe ClaussellやシカゴのRon Trent、そしてBarbara TuckerやUltra Natéといった歌手が、この分野を豊かにした。流通を支えたのはStrictly RhythmやKing Streetといったニューヨークの独立系レーベルであり、1999年にイギリスで設立されたDefectedは、この音を国際的な市場へ届ける役割を果たした。この分野の特筆すべき点は、その社会的な機能である。1980年代から1990年代のニューヨークにおいて、踊り場は黒人とラテン系、そして性的少数者にとって数少ない安全な場所であり、そこで鳴る音楽は、外の世界で否定される存在を肯定する言葉を歌っていた。エイズ危機によって多くの担い手と客が失われたという事実も、この音楽の切実さと切り離せない。2000年代以降、より簡素で機能的なハウスが主流となる中で、歌と和声を重んじるこの様式は古風と見なされることもあった。しかし現在も世界中に熱心な聴き手を持ち、ハウスの倫理的な原点として参照され続けている。</p>
