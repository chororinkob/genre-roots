<h1>Trap Metal（トラップメタル）とは</h1>
<p>トラップの低音の設計と、ヘヴィメタルおよびハードコアの攻撃性を直接接合した音楽である。土台はトラップそのもので、Roland TR-808由来の長く伸びる低音、細かく分割される高音の刻み、そして隙間の多い簡素な構成が用いられる。テ</p>
<p>トラップの低音の設計と、ヘヴィメタルおよびハードコアの攻撃性を直接接合した音楽である。土台はトラップそのもので、Roland TR-808由来の長く伸びる低音、細かく分割される高音の刻み、そして隙間の多い簡素な構成が用いられる。テンポは表記上70から85 BPM程度だが、刻みの細分化によって体感の密度は高い。ここへ、歪ませたギターのリフや、金属的に潰した効果音が重ねられる。決定的な要素はヴォーカルで、ラップの発声を保ちながら、喉を裂くような絶叫やハードコア由来の怒号が用いられ、さらにその声を意図的に音量の限界を超えて歪ませる処理が施される。この、声そのものが破壊されている状態が、この分野の記号となっている。上物には短調の不吉な旋律、逆再生した音、悲鳴のサンプルが置かれ、和声はほとんど動かない。曲は2分前後と短く、繰り返しの部分から始まっていきなり終わることも多い。歌詞は怒り、自傷、社会への憎悪、精神の破綻を、比喩を用いずに叩きつける。ヘヴィメタルの様式ではなく、その情動だけを抽出してヒップホップの器に注ぎ込んだ音楽といえる。</p>
<h2>成り立ち</h2><p>前史として決定的なのは1990年代末のニューメタルである。KornやLimp Bizkitが、ヘヴィメタルのギターとヒップホップの発声を結合させ、若者の怒りと疎外を扱ったこの様式は、2000年代半ばには批評的に最も軽んじられる音楽となっていた。しかし2010年代半ば、その世代の音楽を子どもの頃に聴いて育った10代が制作者となったとき、事情が変わる。彼らにとってニューメタルは恥ずかしい過去ではなく、単なる素材のひとつだった。もうひとつの前史は、1990年代のホラーコアであり、暗く不吉な音と暴力的な虚構という語彙はここから引き継がれている。舞台となったのは音楽投稿サイトである。レコード会社の選別もラジオの編成も介さず、寝室で作った音源を直接公開できる環境が、この乱暴な折衷を可能にした。ニュージャージーの二人組Ho99o9は、パンクとハードコアの現場に立ちながらトラップの構造を用いるという実践で先駆けとなり、ニューヨークのCity Morgueは、ヘヴィな図像と絶叫を全面に押し出した。フロリダのGhostemaneは、ブラックメタルやドゥームの素養を公言しながらトラップを作り、この折衷が偶然ではないことを示した。イギリスのScarlxrdは、絶叫を主体とする作風で国際的な支持を得ている。この分野は当初から双方向の批判にさらされた。メタルの側からは本物ではないと言われ、ヒップホップの側からは無節操だと言われたのである。加えて、この周辺で活動した若い制作者に、薬物の過剰摂取や暴力による死者が相次いだことは、サウンドクラウド・ラップと共通する深刻な問題として指摘されてきた。それでも、歪みと絶叫をヒップホップの語彙に加えたという影響は大きく、現在では主流のポップスにもこの質感が浸透している。</p>
