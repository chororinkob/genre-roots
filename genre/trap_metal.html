<h1>Trap Metal（トラップメタル）とは</h1>
<p>トラップメタルは、トラップの低音の設計に、ヘヴィメタルやハードコアの攻撃性を直接つないだ音楽だ。ヒップホップの器にメタルやハードコアの攻撃性を注ぎ込んだ音楽といえる。 土台はトラップそのものである。Roland TR-808由来の</p>
<p>トラップメタルは、トラップの低音の設計に、ヘヴィメタルやハードコアの攻撃性を直接つないだ音楽だ。ヒップホップの器にメタルやハードコアの攻撃性を注ぎ込んだ音楽といえる。

土台はトラップそのものである。Roland TR-808由来の長く伸びる低音、細かく分けて刻まれる高音のリズム、隙間の多い簡素な構成が使われる。そこへ、金属的に潰した効果音が重ねられる。メタルのギターリフを、サンプルや打ち込み、生演奏で取り入れることもある。

曲によっては、ホラー映画的なサンプルや不穏な導入が置かれる。

テンポは、トラップ一般では70前後（ハーフタイム表記）だ。ただ、刻みを細かく分けるため、体感の密度は高い。

特徴は、歪んだビート、ヒップホップのフロー、荒々しい（絶叫・唸り）ヴォーカルである。

曲は1〜3分程度の短いものが多い。

歌詞には、暴力的で暗い主題や、ゴシックやオカルトの主題が多い。ホラー的なモチーフも用いられる。</p>
<h2>成り立ち</h2><p>前史として特に重要なのは、1990年代半ばに成立したニューメタルである。KornやLimp Bizkitが、ヘヴィメタルのギターとヒップホップの発声を結びつけた。若者の怒りと疎外を扱ったこの流れは、世紀転換期の人気の最中から、ヘヴィメタルのファンに批判された。

トラップメタルにはニューメタルの要素が含まれる。ZillaKamiのように、ニューメタル系のバンドを影響源に挙げる制作者もいる。

もうひとつの前史は、ホラーコアである。1980年代に始まり、1994年頃に広く注目された。ホラーコア的な意匠や主題との共通点が指摘される。

舞台となったのは、音楽投稿サイトだ。レコード会社の選別もラジオの編成も通さず、寝室で作った音源を直接公開できる環境が、この荒っぽい混ぜ合わせを可能にした。

2012年にニュージャージー州ニューアークで結成され、のちにロサンゼルスへ移った2人組Ho99o9は、パンクとハードコアの現場に立ちながら、トラップの構造を用いた。その実践で、この分野と関連づけられている。ニューヨークのCity Morgueは、ヘヴィな図像と絶叫を前面に押し出した。フロリダのGhostemaneは、ブラックメタルやドゥームの素養を公言しながらトラップを作り、この折衷が偶然ではないことを示したとされる。イギリスのScarlxrdは、この分野の先駆者の一人とされる。絶叫を主体とする作風で、国際的な支持を得ている。

この分野は、定義しにくく、評価が分かれる音楽とされてきた。加えて、この周辺では、サウンドクラウド・ラップ全体の問題として、若い制作者の死が相次いだことが指摘されてきた。2017年にLil Peepが薬物の過剰摂取で、2018年にXXXTentacionが殺害されて亡くなっている。それでも、歪みと絶叫をヒップホップの語彙に加えたという影響を指摘する見方もある。</p>
