<h1>Trap Metal（トラップメタル）とは</h1>
<p>トラップの低音の設計と、ヘヴィメタルおよびハードコアの攻撃性を直接接合した音楽である。土台はトラップそのもので、Roland TR-808由来の長く伸びる低音、細かく分割される高音の刻み、そして隙間の多い簡素な構成が用いられる。テ</p>
<p>トラップの低音の設計と、ヘヴィメタルおよびハードコアの攻撃性を直接接合した音楽である。土台はトラップそのもので、Roland TR-808由来の長く伸びる低音、細かく分割される高音の刻み、そして隙間の多い簡素な構成が用いられる。テンポは表記上70から85 BPM程度だが、刻みの細分化によって体感の密度は高い。ここへ、歪ませたギターのリフや、金属的に潰した効果音が重ねられる。決定的な要素はヴォーカルで、ラップの発声を保ちながら、喉を裂くような絶叫やハードコア由来の怒号が用いられ、さらにその声を意図的に音量の限界を超えて歪ませる処理が施される。この、声そのものが破壊されている状態が、この分野の記号となっている。上物には短調の不吉な旋律、逆再生した音、悲鳴のサンプルが置かれ、和声はほとんど動かない。曲は2分前後と短く、繰り返しの部分から始まっていきなり終わることも多い。歌詞は怒り、自傷、社会への憎悪、精神の破綻を、比喩を用いずに叩きつける。メタルのギターリフをサンプルや打ち込み、生演奏で取り入れることもあり、ヒップホップの器にメタルやハードコアの攻撃性を注ぎ込んだ音楽といえる。</p>
<h2>成り立ち</h2><p>前史として決定的なのは、1990年代半ばに成立したニューメタルである。KornやLimp Bizkitが、ヘヴィメタルのギターとヒップホップの発声を結合させ、若者の怒りと疎外を扱ったこの様式は、1990年代末から2000年代初頭に商業的な絶頂を迎えた後、メタル側から強い批判を受けた。しかし2010年代半ば、その世代の音楽を子どもの頃に聴いて育った10代から20代の若い世代が制作者となったとき、事情が変わる。彼らにとってニューメタルは恥ずかしい過去ではなく、単なる素材のひとつだった。もうひとつの前史は、1980年代に始まり1994年頃に広く注目されたホラーコアであり、暗く不吉な音と暴力的な虚構という語彙はここから引き継がれている。舞台となったのは音楽投稿サイトである。レコード会社の選別もラジオの編成も介さず、寝室で作った音源を直接公開できる環境が、この乱暴な折衷を可能にした。2012年にニュージャージー州ニューアークで結成され、のちにロサンゼルスへ移った2人組Ho99o9は、パンクとハードコアの現場に立ちながらトラップの構造を用いる実践でこの分野と関連づけられ、ニューヨークのCity Morgueは、ヘヴィな図像と絶叫を全面に押し出した。フロリダのGhostemaneは、ブラックメタルやドゥームの素養を公言しながらトラップを作り、この折衷が偶然ではないことを示した。イギリスのScarlxrdは、この分野の先駆者の一人とされ、絶叫を主体とする作風で国際的な支持を得ている。この分野は定義しにくく、評価が分かれる音楽とされてきた。加えて、この周辺では、サウンドクラウド・ラップ全体の問題として、2017年にLil Peepが薬物の過剰摂取で、2018年にXXXTentacionが殺害されて亡くなるなど、若い制作者の死が相次いだことが指摘されてきた。それでも、歪みと絶叫をヒップホップの語彙に加えたという影響は大きい。</p>
