<h1>Gamelan（ガムラン）とは</h1>
<p>インドネシアのジャワ島とバリ島を中心に伝わる、青銅打楽器を主体とした合奏の様式である。編成は数十人に及び、音程を持った鍵盤状の打楽器、伏せた鍋のような形の楽器、大小の吊り下げ銅鑼、太鼓、竹笛、擦弦楽器などで構成される。決定的な特徴</p>
<p>インドネシアのジャワ島とバリ島を中心に伝わる、青銅打楽器を主体とした合奏の様式である。編成は数十人に及び、音程を持った鍵盤状の打楽器、伏せた鍋のような形の楽器、大小の吊り下げ銅鑼、太鼓、竹笛、擦弦楽器などで構成される。決定的な特徴は音階にあり、五音からなるスレンドロと、七音からなるペロッグという二種類が用いられる。いずれも西洋の平均律とは異なる音程配置を持ち、しかも楽団ごとに調律が微妙に異なる。そのため楽器を他の楽団と交換することができず、一組の楽団が一つの独立した音の世界を持つことになる。バリ島の様式ではさらに、対になる楽器をわずかにずらして調律し、二つを同時に鳴らすことで音が細かく震える効果を意図的に作る。合奏の構造は階層的で、大きな銅鑼が長い周期を区切り、その内側を中程度の楽器が分割し、最も細かい動きを高音の楽器が担う。時間が入れ子状に分割されていく構造であり、西洋音楽の小節の概念とは異なる。演奏は影絵芝居や舞踊、宗教儀式と不可分に結びついており、独立した鑑賞用の音楽として演奏されることは伝統的には少ない。</p>
<h2>成り立ち</h2><p>起源は古く、八世紀から九世紀のジャワ島の寺院遺跡の浮き彫りに、既に同種の楽器が描かれている。中部ジャワのボロブドゥールに残る図像には、太鼓や鐘、弦楽器を演奏する姿が刻まれており、この時期には合奏の形が成立していたと考えられている。名称はジャワ語で叩くことを意味する語に由来する。歴史を通じて、この音楽は宮廷と密接に結びついてきた。ジャワ島中部のジョグジャカルタとスラカルタの王宮では、楽器一式が王家の宝物として扱われ、それぞれに固有の名前が与えられた。楽器は単なる道具ではなく霊的な存在と見なされ、演奏の前には供物が捧げられ、またぐことは禁じられた。この扱いは現在も残っている。バリ島では事情が異なり、宮廷よりも村落の共同体が担い手となった。二十世紀初頭にオランダによる植民地支配が宮廷を弱体化させると、楽器が村へ流出し、そこで新しい様式が生まれる。1910年代から20年代にかけて成立したゴン・クビャルは、突然の爆発的な合奏と急激な速度変化を特徴とし、それまでの荘重な様式とは大きく異なっていた。西洋との出会いも重要である。1889年のパリ万国博覧会でジャワの楽団が演奏し、これを聴いたクロード・ドビュッシーが強い衝撃を受けたことはよく知られている。彼が後年に用いた五音音階や、和声の機能に頼らない響きの扱いには、この体験の影響が指摘されている。二十世紀後半にはアメリカのルー・ハリソンやスティーヴ・ライヒらが直接この音楽を学び、反復を基礎とする現代音楽の成立に寄与した。またイギリスのベンジャミン・ブリテンもバリ島を訪れ、その響きを自作に取り入れている。政治との関わりも無視できない。1965年以降のスハルト体制下では、この音楽は国民統合の象徴として推奨される一方、地域ごとの多様性が国家の管理下で整理される面もあった。現在ではインドネシア国外の大学にも多数の楽団が置かれ、演奏と研究が続けられている。2021年には国際連合教育科学文化機関の無形文化遺産に登録された。</p>
