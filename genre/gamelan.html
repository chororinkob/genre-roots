<h1>Gamelan（ガムラン）とは</h1>
<p>インドネシアのジャワ島とバリ島を中心に伝わる、青銅打楽器を主体とした合奏の様式である。編成は1曲あたり20人前後が目安で(編成により差がある)、音程を持った鍵盤状の打楽器、伏せた鍋のような形の楽器、大小の吊り下げ銅鑼、太鼓、竹笛、</p>
<p>インドネシアのジャワ島とバリ島を中心に伝わる、青銅打楽器を主体とした合奏の様式である。編成は1曲あたり20人前後が目安で(編成により差がある)、音程を持った鍵盤状の打楽器、伏せた鍋のような形の楽器、大小の吊り下げ銅鑼、太鼓、竹笛、擦弦楽器（弓で弦をこすって鳴らす楽器）などで構成される。決定的な特徴は音階にあり、5音からなるスレンドロと、7音からなるペロッグという2種類が用いられる。いずれも西洋の平均律（1オクターブを等間隔に分けた音程）とは異なる音程配置を持ち、しかも楽団ごとに調律が微妙に異なる。そのため楽器を他の楽団と交換することができず、一組の楽団が一つの独立した音の世界を持つことになる。バリ島の様式ではさらに、対になる楽器をわずかにずらして調律し、二つを同時に鳴らすことで音が細かく震える効果を意図的に作る。合奏の構造は階層的（大きな区切りの中に小さな区切りがある形）で、大きな銅鑼が長い周期を区切り、その内側を中程度の楽器が分割し、最も細かい動きを高音の楽器が担う。時間が入れ子（箱の中に箱が入るような形）状に分割されていく構造であり、西洋音楽の小節の概念とは異なる。演奏は影絵芝居や舞踊、宗教儀式と深く結びついている一方、ジャワには「クレネンガン」と呼ばれる演奏会の形で聴かれる伝統もある。</p>
<h2>成り立ち</h2><p>起源は古く、8世紀から9世紀のジャワ島の寺院遺跡の浮き彫りに、既に同種の楽器が描かれている。中部ジャワのボロブドゥールに残る図像には、鍵盤状の打楽器や太鼓、鐘、弦楽器、笛などを演奏する姿が刻まれており、ガムランの原型とも考えられている。ただしゴングは描かれておらず、ジャワでのゴングの出現は13〜14世紀とされ、現在の合奏の形が成立した時期は別に検討が必要である。名称はジャワ語で叩くことを意味する語に由来する。歴史を通じて、この音楽は宮廷と密接に結びついてきた。ジャワ島中部のジョグジャカルタとスラカルタの王宮では、楽器一式が王家の宝物として扱われ、それぞれに固有の名前が与えられた。楽器は単なる道具ではなく霊的な存在と見なされ、演奏の前には供え物が捧げられ、またぐことは禁じられた。この扱いは現在も残っている。バリ島では事情が異なり、宮廷よりも村落の共同体が担い手となった。オランダの侵攻(北バリは1849年から統治下に入り、全島の制圧は1906〜08年)に伴う社会の変動の中で、北バリの村落の楽団から新しい様式が生まれる。1910年代半ば(1913〜15年説)に成立し、1920年代にかけて広まったゴン・クビャルは、突然の爆発的な合奏と急激な速度変化を特徴とし、それまでの重々しい様式とは大きく異なっていた。西洋との出会いも重要である。1889年のパリ万国博覧会でジャワの楽団が演奏し、これを聴いたクロード・ドビュッシーが強い衝撃を受けたことはよく知られている。彼が後年に用いた5音音階や、和声（コードの響き）の決まりに頼らない響きの扱いには、この体験の影響が指摘されている。20世紀後半にはアメリカのルー・ハリソンやスティーヴ・ライヒらが直接この音楽を学び、その後の作風に取り入れた。またイギリスのベンジャミン・ブリテンもバリ島を訪れ、その響きを自作に取り入れている。政治との関わりも無視できない。1966〜67年に始まるスハルト体制(新体制)のもとでは、地方の芸能は発展が図られつつ、国の文化にまとめられていくことが管理された。現在ではインドネシア国外の大学にも多数の楽団が置かれ、演奏と研究が続けられている。2021年には国際連合教育科学文化機関の無形文化遺産に登録された。</p>
