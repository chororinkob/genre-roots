<h1>Gamelan（ガムラン）とは</h1>
<p>ガムランは、インドネシアのジャワ島とバリ島を中心に伝わる、青銅の打楽器を主役にした合奏のスタイルである。 編成は1曲あたり20人前後が目安だ(編成により差がある)。音程を持った鍵盤状の打楽器、伏せた鍋のような形の楽器、大小の吊り下</p>
<p>ガムランは、インドネシアのジャワ島とバリ島を中心に伝わる、青銅の打楽器を主役にした合奏のスタイルである。

編成は1曲あたり20人前後が目安だ(編成により差がある)。音程を持った鍵盤状の打楽器、伏せた鍋のような形の楽器、大小の吊り下げ銅鑼、太鼓、竹笛、擦弦楽器（弓で弦をこすって鳴らす楽器）などで組まれる。

いちばんの特徴は音階にある。使われるのは、5音からなるスレンドロと、7音からなるペロッグの2種類だ。どちらも西洋の平均律（1オクターブを等間隔に分けた音程）とは違う音の並びを持つ。しかも楽団ごとに調律が異なる(中部ジャワでは差が比較的小さいが、バリでは同じ村でも大きく異なることがある)。そのため楽器をほかの楽団と取り替えることができない。一組の楽団が、一つの独立した音の世界を持つことになる。

バリ島のスタイルでは、さらに、対になる楽器をわずかにずらして調律する。二つを同時に鳴らし、音が細かく震える効果をわざと作るのである。

合奏の組み立ては階層的（大きな区切りの中に小さな区切りがある形）だ。大きな銅鑼が長い周期を区切り、その内側を中くらいの楽器が分ける。いちばん細かい動きは、高音の楽器が受け持つ。時間が入れ子（箱の中に箱が入るような形）状に分けられていく仕組みで、西洋音楽の小節の考え方とは違う。

演奏は、影絵芝居や舞踊、宗教儀式と深く結びついている。その一方で、ジャワには「クレネンガン」と呼ばれる、演奏会の形で聴く伝統もある。</p>
<h2>成り立ち</h2><p>ガムランの起源は古い。8世紀から9世紀のジャワ島の寺院遺跡の浮き彫りに、すでに同じ種類の楽器が描かれている。中部ジャワのボロブドゥールに残る図像には、鍵盤状の打楽器や太鼓、鐘、弦楽器、笛などを演奏する姿が刻まれている。これがガムランの原型とも考えられている。

ただしゴングは描かれていない。ジャワでのゴングの出現は13〜14世紀とされ、今の合奏の形ができた時期は、別に検討が必要である。名前は、ジャワ語で叩くことを意味する語から来ている。

歴史を通じて、この音楽は宮廷と強く結びついてきた。ジャワ島中部のジョグジャカルタとスラカルタの王宮では、楽器一式が王家の宝物として扱われ、それぞれに固有の名前が付けられた。楽器はただの道具ではなく、霊的な存在と見なされた。宮廷や儀礼の場では、供え物が捧げられ、楽器をまたぐことが禁じられる。この慣行は宮廷では現在も続くが、宮廷の外では守られないこともある。

バリ島でも宮廷・寺院・村落共同体が担い手だった。オランダの侵攻(北バリは1849年から統治下に入り、全島の制圧は1906〜08年)に伴って、社会が大きく変わった。その中で、北バリの村落の楽団から新しいスタイルが生まれた、と解釈されることが多い。1910年代半ば(1913〜15年説)にできあがり、1920年代にかけて広まったゴン・クビャルである。突然の爆発的な合奏と急激な速さの変化がトレードマークで、それまでの重々しいスタイルとは大きく違っていた。

西洋との出会いも大切なできごとだ。1889年のパリ万国博覧会でジャワの楽団が演奏し、これを聴いたクロード・ドビュッシーが強い衝撃を受けたことはよく知られている。彼が後年に使った5音音階や、和声（コードの響き）の決まりに頼らない響きの扱いには、この体験の影響が指摘されている。

20世紀後半には、アメリカのルー・ハリソンやスティーヴ・ライヒらが、アメリカ国内で直接この音楽を学び、その後の作風に取り入れた。イギリスのベンジャミン・ブリテンもバリ島を訪れ、その響きを自作に取り入れている。

一方で、政治との関わりも見逃せない。1966〜67年に始まるスハルト体制(新体制)のもとでは、地方の芸能は発展が図られながら、国の文化にまとめられていくよう管理された。

現在では、インドネシア国外の大学にも多くの楽団が置かれ、演奏と研究が続いている。2021年には、国際連合教育科学文化機関の無形文化遺産に登録された。</p>
