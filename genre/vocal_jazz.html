<h1>Vocal Jazz（ヴォーカルジャズ）とは</h1>
<p>ジャズの表現を、歌に取り入れたスタイルだ。器楽のジャズといちばん違うのは、言葉という縛りを抱えたまま、即興を成り立たせなければならない点にある。この課題に応えるために、いくつかの技法が発達した。 編成は、小編成の伴奏から大楽団、弦</p>
<p>ジャズの表現を、歌に取り入れたスタイルだ。器楽のジャズといちばん違うのは、言葉という縛りを抱えたまま、即興を成り立たせなければならない点にある。この課題に応えるために、いくつかの技法が発達した。

編成は、小編成の伴奏から大楽団、弦楽合奏まで幅がある。テンポも自由に扱われる。

まず、拍の扱いだ。歌手は伴奏の拍にぴったり合わせず、わざと遅らせて言葉を置く。この寄りかかるような歌い方が、緊張と余裕を同時に生む。

次に、スキャットだ。意味を持たない音節を使い、楽器の独奏と同じように即興のメロディーを歌う。

さらに、ヴォーカリーズがある。過去の名演で奏でられた器楽の独奏、主に管楽器の独奏に、後から歌詞を付けて歌う。極めて高度な技法である。

メロディーの作り替えも大切だ。歌手は原曲の音を大きく変え、飾りを加え、時には全く別の形に作り替える。そのため、同じ曲でも歌手ごとに全く違う作品になる。

技術面では、1920年代半ばの電気録音・マイクの導入が、囁くような親密な歌い方を可能にした。声を張り上げる必要がなくなったことで、ポピュラー歌唱全般が変わった。

歌詞は、主にアメリカの大衆歌謡の古典から取られる。</p>
<h2>成り立ち</h2><p>ジャズの歌唱は、20世紀初頭に始まった。その人気を押し上げた大きな貢献者の一人が、Louis Armstrongである。

1926年の録音で、彼は意味のない音節を使って即興的に歌った。この演奏は、最も有名なスキャットの例として広く語られている。最初のスキャット録音ではないが、彼はそれを世の中に広めた。歌詞を書いた紙を落としてしまい、とっさに口から出た音で歌い切ったという逸話が伝わる。紙を落とした点は、本人らが証言している。ただし、それでスキャットが生まれたという話は、おそらく事実ではない。いずれにせよ彼は、声を管楽器と同格に扱うという考えを広める中心人物の一人となった。

1930年代から1940年代にかけての大楽団の時代には、楽団に専属の歌手が置かれた。歌は、より広い聴衆へ届くようになる。

この時代の最も重要な一人が、Billie Holidayである。彼女は声量にも音域にも恵まれなかった。しかし、フレージングとテンポを操る新しいやり方と、言葉の一つ一つに込める陰影によって、比べるもののない表現にたどり着いた。

1939年、彼女はアメリカ南部での黒人への私刑を主題とする曲を歌う。所属会社のColumbiaは、題材が敏感すぎるとして録音を見送った。そこでMilt Gablerが、自分のCommodoreレーベルで1939年4月20日に録音した。この曲は、政治的な歌としてのジャズの可能性を示した。彼女が麻薬取締当局に追われたこと自体は事実だ。ただし、その動機がこの曲だったという説には、否定する見方もある。彼女は肝硬変などによる肺水腫・心不全で、1959年に44歳で亡くなった。

一方、Ella Fitzgeraldは、正確な音程と圧倒的な即興の力で、スキャットの技術を高めることに大きく貢献した。1950年代からは、主要な作曲家ごとに作品をまとめる大規模な連作を録音し、アメリカの大衆歌謡を古典として定着させることに大きく貢献した。Sarah Vaughanは、オペラ歌手になぞらえられる声質と技巧をジャズへ持ち込んだ。Frank Sinatraは、ジャズ歌唱に影響を与えたポピュラー歌手だった。

ヴォーカリーズ(過去の名演に歌詞を付ける技法)には、1930年代からの先例がある。Eddie Jeffersonは、その先駆者の一人だ。本人の証言では1939〜40年ごろから実践し、1952年に録音している。

このスタイルは今も生き続けている。古典を歌い継ぐことと、それを毎回作り変えることの両立が、歌手に求められ続けている。</p>
