<h1>Vocal Jazz（ヴォーカルジャズ）とは</h1>
<p>ジャズの語法を歌に適用した様式である。器楽のジャズと最も異なるのは、言葉という制約を負いながら即興性を実現しなければならない点にある。この課題に対して、いくつかの技法が発達した。第一が拍の扱いで、歌手は伴奏の拍にぴったり合わせず、</p>
<p>ジャズの語法を歌に適用した様式である。器楽のジャズと最も異なるのは、言葉という制約を負いながら即興性を実現しなければならない点にある。この課題に対して、いくつかの技法が発達した。第一が拍の扱いで、歌手は伴奏の拍にぴったり合わせず、意図的に遅らせて言葉を置く。この寄りかかるような処理が、緊張と余裕を同時に生む。第二がスキャットで、意味を持たない音節を用いて、楽器の独奏と同じように即興の旋律を歌う。第三がヴォーカリーズで、これは過去の名演における管楽器の独奏に、後から歌詞を付けて歌うという極めて高度な技法である。旋律の改変も重要で、歌手は原曲の音を大きく変え、装飾を加え、時には全く別の輪郭に作り替える。したがって同じ曲でも歌手ごとに全く異なる作品となる。編成は小編成の伴奏から大楽団、弦楽合奏まで幅があり、テンポも自由に扱われる。技術面では電気式のマイクの発明が決定的だった。声を張り上げる必要がなくなったことで、囁くような親密な歌唱が可能になり、これが20世紀の歌唱そのものを変えた。歌詞は主にアメリカの大衆歌謡の古典から取られる。</p>
<h2>成り立ち</h2><p>この様式の出発点はLouis Armstrongである。1926年の録音において、彼が意味のない音節で即興的に歌った演奏は、スキャットの起源として広く語られている。歌詞を書いた紙を落としてしまい、とっさに口から出た音で歌い切ったという逸話が伝わるが、真偽は定かではない。いずれにせよ彼は、声を管楽器と同格に扱うという発想を確立した。1930年代から1940年代にかけて、大楽団の時代には専属の歌手が置かれ、歌はより広い聴衆へ届くようになる。この時代の最も重要な存在がBillie Holidayである。彼女は声量にも音域にも恵まれなかったが、拍の後ろに寄りかかる独特の間合いと、言葉の一つ一つに込める陰影によって、比類のない表現を達成した。1939年、彼女はアメリカ南部における黒人への私刑を主題とする楽曲を歌う。所属会社が録音を拒んだため小さなレーベルから発表されたこの曲は、政治的な歌としてのジャズの可能性を示すと同時に、彼女自身を当局の監視下に置くことにもなった。彼女は薬物と病により1959年に44歳で死去している。Ella Fitzgeraldは、正確な音程と圧倒的な即興能力によってスキャットの技術を頂点へ引き上げ、1950年代からは主要な作曲家ごとに作品をまとめる大規模な連作を録音して、アメリカの大衆歌謡を古典として確立した。Sarah Vaughanは声楽的な技巧をジャズへ持ち込み、Frank Sinatraは言葉の意味を最優先する語り口によって、男性歌手の規範を作った。1950年代にはEddie Jeffersonらが、過去の名演に歌詞を付けるという技法を発明している。この様式は現在も生き続けており、古典を歌い継ぐことと、それを毎回作り変えることの両立が、歌手に課せられ続けている。</p>
<h2>代表曲</h2><ul><li>A-Tisket, A-Tasket (Ella Fitzgerald)</li><li>Strange Fruit (Billie Holiday)</li><li>Lullaby of Birdland (Sarah Vaughan)</li><li>Summertime (Ella Fitzgerald &amp; Louis Armstrong)</li><li>Don't Know Why (Norah Jones)</li></ul>
