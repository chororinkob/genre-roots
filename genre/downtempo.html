<h1>Downtempo（ダウンテンポ）とは</h1>
<p>ダウンテンポは、ダンス音楽の表現を使いながら、ダンス音楽として典型的なものより遅いビートで作る電子音楽だ。 テンポはおおむね90 BPM前後で、資料により60〜110程度とされる。聴き手の身体を高揚させず、むしろ落ち着かせる方向へ</p>
<p>ダウンテンポは、ダンス音楽の表現を使いながら、ダンス音楽として典型的なものより遅いビートで作る電子音楽だ。

テンポはおおむね90 BPM前後で、資料により60〜110程度とされる。聴き手の身体を高揚させず、むしろ落ち着かせる方向へ働くとされる。

リズムの土台には、ヒップホップやファンクから借りた生ドラムの断片が使われる。速度を落として使うため、打点の輪郭が緩み、独特のもたついた感触が生まれる。

低音はダブの影響を強く受けている。深く沈んだベースが長く伸び、そこに反響音が幾重にもかけられる。

上物には、伸び続ける和音の下地、旅先の民族音楽の録音、古い映画音楽、ジャズの管楽器の断片、鳥や波の環境音が重ねられる。音の層は厚いが、どの要素も前へ出過ぎないよう、音量が抑えられている。

曲は、ビート志向で、ゆったりした雰囲気のものが中心である。アンビエント寄りのものも一部にある。</p>
<h2>成り立ち</h2><p>1980年代末のブリストル・サウンド発祥とする説明が一般的だが、レイヴ会場の休息のための部屋(チルアウト室)やイビサ島も、並行する源流とされる。

舞台は、1980年代末から1990年代前半のイギリスだ。一晩中踊り続けるパーティーの会場に、休息のための別の部屋が設けられるようになった。そこでは激しい四つ打ちではなく、遅く穏やかな音楽が流された。疲れた身体と、薬物の作用が引いていく神経を鎮める役割を担っていたのである。この空間のために作られた音楽が、独立した分野として意識されていく。

1989年、The Orbが長尺の作品A Huge Ever Growing Pulsating Brain That Rules from the Centre of the Ultraworld(1989年10月21日、19分7秒)を発表した。1990年にはThe KLFがチルアウトを発表した。どちらも、ビートを大幅に抑えた音楽を、ダンス文化の内側から示した作品だ。羊の鳴き声や列車の音は、KLFのチルアウト(1990年2月5日)の特徴である。The Orbは、初期のアンビエント・ハウスでパーカッションを外し、重いリズムを避けた。ただし、ドラムの使い方は、その後の作品や別ミックスで変わる。

もうひとつの震源は、スペインのイビサ島である。この島の西岸にあるカフェでは、日没の時刻に合わせてDJが穏やかな音楽を流す習慣があった。José Padillaが選んだ楽曲を集めた編集盤は、1994年に第1集が出て、シリーズを重ねて評価が広がった。

イギリスのブリストルでは、レゲエのサウンドシステム文化とヒップホップが交わった。1991年にMassive Attackが発表したブルー・ラインズは、遅く重いリズムと深い低音で、都市的な陰りを示す。ウィーンでは、1990年代半ばにKruder &amp; Dorfmeisterが、ダブとヒップホップの手法で他者の楽曲を大胆に作り替えた。1998年の作品集で高い評価を得ている。ワシントンのThievery Corporationはブラジル音楽やインドの楽器を取り込み、フランスのAirは1970年代のシンセサイザーの質感で、洒脱な世界を作った。

しかし2000年代に入ると、この音楽は洒落たカフェや高級ホテルの背景音として大量に使われるようになった。聴き流されることを前提とした無害な商品だという批判もあったとされる。それでもBoards of CanadaやBonoboのように、緩やかな速度の中に深い情感と精緻な音響を込める作り手は途切れなかった。この音楽は、現在のローファイ・ヒップホップの源流の一つとされる。</p>
