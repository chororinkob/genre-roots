<h1>Downtempo（ダウンテンポ）とは</h1>
<p>ダンス音楽の語法を用いながら、踊らせることを目的としない遅い電子音楽である。テンポは概ね70から100 BPMで、これは人間の平常時の心拍に近い速度であり、聴き手の身体を高揚させず、むしろ落ち着かせる方向へ働く。リズムの土台にはヒ</p>
<p>ダンス音楽の語法を用いながら、踊らせることを目的としない遅い電子音楽である。テンポは概ね70から100 BPMで、これは人間の平常時の心拍に近い速度であり、聴き手の身体を高揚させず、むしろ落ち着かせる方向へ働く。リズムの土台にはヒップホップやファンクから借りた生ドラムの断片が用いられるが、速度を落として使うため、打点の輪郭が緩み、独特のもたついた感触が生まれる。低音はダブの影響を強く受けており、深く沈んだベースが長く伸び、そこに反響音が幾重にもかけられる。上物には持続する和音の敷物、旅先の民族音楽の録音、古い映画音楽、ジャズの管楽器の断片、鳥や波の環境音が重ねられ、音の層は厚いが、どの要素も前へ出過ぎないよう音量が抑えられている。展開の設計が独特で、通常のダンス音楽が持つ、緊張を溜めて解放するという構造を意図的に持たず、始まりから終わりまで同じ濃度が保たれる。曲は5分から10分と長く、聴き手の注意を引かないことが目的に含まれている。歌が入る場合も、言葉は霞んだ質感で処理され、意味より音色として扱われる。</p>
<h2>成り立ち</h2><p>直接の起源はレイヴの現場にある。1980年代末から1990年代前半のイギリスでは、一晩中踊り続けるパーティーの会場に、休息のための別室が設けられるようになった。そこでは激しい四つ打ちではなく、遅く穏やかな音楽が流され、疲弊した身体と、薬物の作用が引いていく神経を鎮める役割を担っていた。この空間のために作られた音楽が、独立した領域として自覚されていく。1989年にThe Orbが発表した長尺の作品や、1990年にThe KLFが発表したチルアウトは、羊の鳴き声や列車の音といった環境音を大胆に用い、拍のない音楽をダンス文化の内側から提示した。もうひとつの震源はスペインのイビサ島である。この島の西岸にあるカフェでは、日没の時刻に合わせてDJが穏やかな音楽を流す習慣があり、José Padillaが選んだ楽曲を集めた編集盤が1990年代半ばに国際的に売れたことで、日没に聴く音楽という商品分類が確立した。イギリスのブリストルでは、レゲエのサウンドシステム文化とヒップホップが交わり、1991年にMassive Attackが発表したブルー・ラインズが、遅く重いリズムと深い低音による都市的な陰りを提示する。ウィーンでは1990年代半ばにKruder &amp; Dorfmeisterが、ダブとヒップホップの手法で他者の楽曲を大胆に作り替え、1998年の作品集で高い評価を得た。ワシントンのThievery Corporationはブラジル音楽やインドの楽器を取り込み、フランスのAirは1970年代のシンセサイザーの質感で洒脱な世界を作った。しかし2000年代に入ると、この音楽は洒落たカフェや高級ホテルの背景音として大量に消費されるようになり、聴き流されることを前提とした無害な商品だという批判が定着する。実際、この分野の編集盤は世界中の飲食店で流され続けた。それでもBoards of CanadaやBonoboのように、緩やかな速度の中に深い情感と精緻な音響を込める作り手は途切れず、その手法は現在のローファイ・ヒップホップや環境音楽的な作品に直接受け継がれている。</p>
