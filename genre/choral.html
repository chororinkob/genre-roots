<h1>Choral（コーラル）とは</h1>
<p>複数の歌い手が声部を分けて歌う音楽の総称。標準的な編成は高い順にソプラノ、アルト、テノール、バスの四声で、各声部を数人から数十人が受け持つ。人数が多いことで個人の声の癖が平均化され、一つの楽器のような均質な響きが生まれるのが合唱の</p>
<p>複数の歌い手が声部を分けて歌う音楽の総称。標準的な編成は高い順にソプラノ、アルト、テノール、バスの四声で、各声部を数人から数十人が受け持つ。人数が多いことで個人の声の癖が平均化され、一つの楽器のような均質な響きが生まれるのが合唱の本質である。書法には大きく二種があり、全声部が同じリズムで和音を重ねるホモフォニーと、各声部が独立した旋律を模倣しながら絡み合うポリフォニーで、多くの作品はこの二つを場面ごとに使い分ける。和声は縦の響きの純度が重視され、平均律の鍵盤と違って、歌い手は倍音が濁らないよう純正な音程に微調整して歌う。この調整によって、和音が正しく合った瞬間に、実際には歌われていない差音が聞こえることがある。伴奏はオルガンや管弦楽が付く場合と、無伴奏の場合がある。歌詞はラテン語の典礼文、聖書、詩、民謡の言葉など多岐にわたり、母音の統一と子音の同時発音が訓練の中心になる。指揮者が呼吸の位置から母音の形まで指示し、集団が一つの意思で動くことが求められる。演奏の場は教会、演奏会場、学校、地域の集会所で、聴くためだけでなく参加するための音楽である点が大きな特徴である。</p>
<h2>成り立ち</h2><p>西洋合唱の直接の起源は、中世の教会における単旋律の聖歌である。九世紀頃から、この旋律に別の声部を平行に添えるオルガヌムが現れ、十二世紀のパリのノートルダム大聖堂ではLéoninとPérotinが複数の声部を独立して動かす書法を発展させた。ルネサンス期には多声合唱が頂点に達し、Josquin des PrezやGiovanni Pierluigi da Palestrina、Thomas Tallisが無伴奏合唱の傑作を残した。宗教改革はこの分野を大きく変える。Martin Lutherは会衆が母語で歌えるコラールを重視し、専門家だけでなく信徒全員が歌う伝統を作った。この流れの延長にJohann Sebastian Bachのカンタータと受難曲がある。バロックから古典派にかけては、George Frideric Handelの『メサイア』(1741)が転機となった。この作品は、貴族の私的な催しではなく、市民が入場料を払って聴く公開演奏会の演目として広まり、合唱を職業音楽家だけのものから解き放った。十九世紀のイギリスと北欧、ドイツでは、労働者や市民が自発的に合唱団を作る運動が広がり、これが現在の地域合唱団の原型となった。同時期、ロシアではPyotr Tchaikovskyやセルゲイ・ラフマニノフが正教会の無伴奏合唱に傑作を残している。二十世紀に入ると、Benjamin BrittenやFrancis Poulenc、後にArvo PärtやEric Whitacreが新しい響きを開いた。日本では明治期に学校教育を通じて西洋の合唱が導入され、以後、学校の合唱コンクールという独自の制度が全国に根づいた。現在も合唱は、世界で最も多くの人が実際に参加している音楽形態のひとつである。</p>
