<h1>Vallenato（バジェナート）とは</h1>
<p>コロンビアのカリブ海側の内陸で発達した、手風琴を主役とする歌と踊りの音楽である。編成は三つの楽器で完結し、それぞれが異なる文化的な出自を持つ点が象徴的に語られる。第一はボタン式の全音階手風琴で、19世紀にドイツから輸入されたヨーロ</p>
<p>コロンビアのカリブ海側の内陸で発達した、手風琴を主役とする歌と踊りの音楽である。編成は三つの楽器で完結し、それぞれが異なる文化的な出自を持つ点が象徴的に語られる。第一はボタン式の全音階手風琴で、19世紀にドイツから輸入されたヨーロッパ由来の楽器である。第二はカハと呼ばれる小型の片面太鼓で、膝に挟んで手で叩く、アフリカ由来の楽器である。第三はグアチャラカという、竹に刻みを入れて棒で擦る楽器で、先住民に由来する。つまりこの三つの組み合わせが、この地域の三つの血脈をそのまま表している。近年ではこれに低音楽器やギターが加えられることも多い。リズムには四つの型があり、緩やかで叙情的なもの、速く跳ねるもの、極めて速く技巧を要するもの、そして中庸のものに分かれ、演奏者はこれらを弾き分ける。テンポは型によって大きく異なる。和声は単純な三和音が中心で、旋律は手風琴が歌と交互に提示する。歌唱は張りのある高い声で、鼻にかかった独特の発声が好まれる。歌詞は物語性が強く、恋愛、故郷の風景、実在の人物への献辞、そして村の出来事が語られる。</p>
<h2>成り立ち</h2><p>起源は19世紀のマグダレナ川流域にある。当時この地域には道路も通信手段もなく、村と村の間を旅する語り部たちが、手風琴を背負って歩きながら、各地の出来事を歌にして伝えていた。つまりこの音楽は、もともと新聞の役割を担っていたのである。この放浪する歌い手を指す言葉が現在も用いられており、その最も伝説的な存在が、悪魔と手風琴の腕比べをして打ち負かしたと語り継がれる人物である。この伝説は、後にコロンビアの作家Gabriel García Márquezによって繰り返し引用された。彼は自らの代表作について、400ページのバジェナートを書いたのだと述べており、この音楽の物語性と魔術的な世界観が、彼の文学と地続きであることを示している。20世紀に入り録音産業が到来すると、この音楽は商品として記録され始めるが、当初は上流階級から農民の下品な音楽として蔑まれていた。転機は1968年である。バジェドゥパルの町で、伝説を冠した音楽祭が創設され、手風琴の技を競う大会が開かれるようになった。この最初の優勝者となったAlejo Duránは、黒人の農民出身であり、彼の戴冠はこの音楽の社会的な地位を大きく変えた。作曲家のRafael Escalonaは、実在の出来事を洗練された詩に仕立てて、この音楽を文学の水準へ引き上げている。1980年代から1990年代にかけて、Diomedes Díazが圧倒的な人気を得て国民的な存在となったが、彼は一人の女性の死をめぐって有罪判決を受けており、その生涯は栄光と暗部が同居している。1993年、Carlos Vivesが古典的な楽曲をロックの編成で作り替えた作品を発表し、この音楽は都市の若者と国際市場へ届いた。2015年には国際連合の機関によって無形文化遺産に登録されている。</p>
