<h1>Vallenato（バジェナート）とは</h1>
<p>バジェナートは、コロンビアのカリブ海側の内陸で発達した、手風琴（アコーディオン）を主役とする歌と踊りの音楽だ。 編成は、三つの楽器で完結する。それぞれが異なる文化的な出自を持つ点が、シンボルとして語られる。第一は、3列のボタン式デ</p>
<p>バジェナートは、コロンビアのカリブ海側の内陸で発達した、手風琴（アコーディオン）を主役とする歌と踊りの音楽だ。

編成は、三つの楽器で完結する。それぞれが異なる文化的な出自を持つ点が、シンボルとして語られる。第一は、3列のボタン式ディアトニック・アコーディオンで、19世紀にドイツから持ち込まれたヨーロッパ由来の楽器である。第二は、カハと呼ばれる小型の片面太鼓だ。膝に挟んで手で叩く、アフリカ由来の楽器である。第三は、グアチャラカという楽器で、先住民に由来する。ヤシ科 uvita de lata の茎、または caña(カーニャ)などで作る刻み目のある棒を、針金の櫛で擦って鳴らす。つまり、この三つの組み合わせが、この地域の三つのルーツをそのまま表している。近年ではこれに、低音楽器やギターが加えられることも多い。

和声は単純な三和音（3つの音を重ねた基本の和音）が中心とされる。旋律は、一般に手風琴が歌と交互に提示するとされる。

リズムには、一般に四つの型がある（son、paseo、merengue、puya。tamboraを加えて五つとする資料もある）。緩やかで情感のこもったもの、速く跳ねるもの、極めて速く技巧を要するもの、そして中庸のものに分かれ、演奏者はこれらを弾き分ける。テンポは型によって大きく異なる。

歌唱は、張りのある高い声が好まれる傾向があるとされる。歌詞は物語性が強い。恋愛、故郷の風景、実在の人物に捧げる言葉、そして村の出来事が語られる。</p>
<h2>成り立ち</h2><p>舞台は、マグダレナ・セサル・ランチェリア各河川、カリブ海、シエラネバダ・デ・サンタ・マルタ、ペリハ山地に囲まれた大マグダレナ地方(現マグダレナ県・セサル県・ラ・グアヒラ県)だ。起源はここにある。形成されたのは、19世紀(前半説〜20世紀初頭説あり。時期は定説がない)とされる。録音産業化・全国化は20世紀である。

当時、この地域には迅速な通信手段が乏しかった。村と村の間を旅する語り部たちは、手風琴を背負って歩きながら、各地の出来事を歌にして伝えていた。つまりこの音楽は、もともと新聞の役割を担っていたのである。この放浪する歌い手を指す言葉は、現在も用いられている。その最も伝説的な存在が、悪魔と手風琴の腕比べをして打ち負かしたと語り継がれる人物だ。この伝説は、後にコロンビアの作家Gabriel García Márquezが、『Cien años de soledad』で伝説上の人物（Francisco el Hombre）を作中に登場させた。彼は自らの代表作『Cien años de soledad』を「350ページのバジェナート」と評したと伝えられ(1994年5月6日にハバナで行われた本人へのインタビューでは450ページ)、この音楽の物語性と魔術的な世界観が、彼の文学と地続きであることを示している。

20世紀に入り録音産業が到来すると、この音楽は商品として記録され始める。しかし当初は、上流階級から農民の下品な音楽として見下されていたとされる。

転機は1968年である。バジェドゥパルの町で、伝説を冠した音楽祭が創設され、手風琴の技を競う大会が開かれるようになった。この最初の優勝者となったAlejo Duránは、黒人の農民出身だった。彼の優勝は、この音楽の社会的な地位を大きく変えたと評される。作曲家のRafael Escalonaは、実在の出来事を洗練された詩に仕立てて、この音楽を文学の水準へ引き上げていると評される。

1980年代から1990年代にかけては、Diomedes Díazが圧倒的な人気を得て、国民的な存在と評された。しかし彼は、一人の女性の死をめぐって有罪判決を受けており、その生涯は栄光と暗部が同居している。1993年、Carlos Vivesが古典的な楽曲を、ロックやポップなどと融合させて再解釈した作品を発表した。この音楽は、都市の若者と国際市場へ届いた。

2015年、「大マグダレナ地方の伝統的バジェナート音楽」が、国際連合の機関(UNESCO)の無形文化遺産の緊急保護リストに登録された。</p>
