<h1>Vallenato（バジェナート）とは</h1>
<p>コロンビアのカリブ海側の内陸で発達した、手風琴（アコーディオン）を主役とする歌と踊りの音楽である。編成は三つの楽器で完結し、それぞれが異なる文化的な出自を持つ点が象徴的に語られる。第一は3列のボタン式の全音階手風琴（列ごとに調が違</p>
<p>コロンビアのカリブ海側の内陸で発達した、手風琴（アコーディオン）を主役とする歌と踊りの音楽である。編成は三つの楽器で完結し、それぞれが異なる文化的な出自を持つ点が象徴的に語られる。第一は3列のボタン式の全音階手風琴（列ごとに調が違う）で、19世紀にドイツから持ち込まれたヨーロッパ由来の楽器である。到来の時期と経路には諸説ある。第二はカハと呼ばれる小型の片面太鼓で、膝に挟んで手で叩く、アフリカ由来の楽器である。第三はグアチャラカという、ヤシ科の植物の茎や葦などで作った刻み目のある棒を、針金のフォーク(櫛)で擦る楽器で、先住民に由来する。つまりこの三つの組み合わせが、この地域の三つのルーツをそのまま表している。近年ではこれに低音楽器やギターが加えられることも多い。リズムには一般に四つの型（son、paseo、merengue、puya。tamboraを加えて五つとする資料もある）があり、緩やかで情感のこもったもの、速く跳ねるもの、極めて速く技巧を要するもの、そして中庸のものに分かれ、演奏者はこれらを弾き分ける。テンポは型によって大きく異なる。和声は一般に単純な三和音（3つの音を重ねた基本の和音）が中心で、旋律は手風琴が歌と交互に提示することが多い。歌詞は物語性が強く、恋愛、故郷の風景、実在の人物に捧げる言葉、そして村の出来事が語られる。</p>
<h2>成り立ち</h2><p>起源は19世紀前半説から20世紀初頭説まであり、時期は定説がない。場所は、マグダレナ川、セサル川、ランチェリア川、カリブ海、シエラネバダ・デ・サンタ・マルタ山地、ペリハ山地に囲まれた大マグダレナ地方（現在のマグダレナ県・セサル県・ラ・グアヒラ県）で、厳密な発祥地にも定説がない。録音産業化・全国化は20世紀である。当時この地域には迅速な通信手段が乏しく、村と村の間を旅する語り部たちが、手風琴を背負って歩きながら、各地の出来事を歌にして伝えていた。つまりこの音楽は、もともと新聞の役割を担っていたのである。この放浪する歌い手を指す言葉が現在も用いられており、その最も伝説的な存在が、悪魔と手風琴の腕比べをして打ち負かしたと語り継がれる人物である。この伝説上の人物（Francisco el Hombre）を、後にコロンビアの作家Gabriel García Márquezが『Cien años de soledad』に登場させた。彼は自らの代表作『Cien años de soledad』を「350ページのバジェナート」とも「450ページのバジェナート」とも評したと伝えられ、この音楽の物語性と魔術的な世界観が、彼の文学と地続きであることを示している。20世紀に入り録音産業が到来すると、この音楽は商品として記録され始めるが、当初は農民の出自ゆえに差別され、上流階級の社交の場から排除されることもあった。転機は1968年である。バジェドゥパルの町で、伝説を冠した音楽祭が創設され、手風琴の技を競う大会が開かれるようになった。この最初の優勝者となったAlejo Duránは、黒人の農民出身であり、彼の優勝はこの音楽の社会的な地位を大きく変えたと評される。作曲家のRafael Escalonaは、実在の出来事を洗練された詩に仕立てて、この音楽を文学の水準へ引き上げたと評される。1980年代から1990年代にかけて、Diomedes Díazが圧倒的な人気を得て国民的な存在と評されたが、彼は一人の女性の死をめぐって有罪判決を受けており、その生涯は栄光と暗部が同居している。1993年、Carlos Vivesが古典的な楽曲を、ロックやポップなどと融合させて再解釈した作品を発表し、この音楽は都市の若者と国際市場へ届いた。2015年、「大マグダレナ地方の伝統的バジェナート音楽」が、国際連合の機関(UNESCO)の無形文化遺産の「緊急保護リスト」に登録された。</p>
