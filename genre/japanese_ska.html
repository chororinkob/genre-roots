<h1>Japanese Ska（ジャパニーズ・スカ）とは</h1>
<p>日本のスカは、ジャマイカ生まれのスカを日本のバンドが演奏する音楽だ。代表曲22曲を動画で聴け、ルーツと影響のつながりを地図でたどれる。</p>
<p>日本のスカは、ジャマイカ生まれのスカを日本のバンドが演奏する音楽だ。

主役はトランペット、トロンボーン、サックスからなるホーンセクションだ。ギターやキーボードよりも前に出て、メロディを担う。

和音は、ジャマイカのスカと同じ仕組みだ。1小節を4拍に数え、拍の裏でコードを短くはじくオフビートが土台になる。メロディはホーンがユニゾンやハーモニーで歌い上げ、リード管同士が掛け合うように演奏する。

リズムは、ベースが4拍を歩くように刻む。ドラムは、サイドスティックで鳴らすスネアが、バスドラムとともに3拍目にアクセントを置く。テンポはおおよそ110〜140 BPMで、パンクと混ざったタイプでは160 BPMを超えることもある。

歌い方は、高音を張らず、胸声で明るく歌うことが多い。大所帯のバンドでは、コーラス隊が付くこともある。

歌詞は、日常の小さな喜びや故郷、仲間を歌う題材が多い。

曲の組み立ては、イントロから全員でスカのリフを一斉に叩く形も見られる。間奏ではトランペットやサックスがソロを取り、最後はテーマに戻って終わる。

日本のスカには、パンクの速さを取り込んだスカ・パンク、ジャマイカの1960年代サウンドをそのまま再現するオーセンティック・スカ、そして80年代の2TONE SKAの影響を受けたネオスカ系という、複数の流れがある。スカ・パンクは歪んだギター、オーセンティック・スカは生のホーンとオルガンが特徴だ。

聴かれる場所はライブハウスやジャズ祭、夏の屋外イベントが多い。観客はスカンキングと呼ばれるステップで踊る。</p>
<h2>成り立ち</h2><p>舞台は1980年代の東京だ。当時の日本には、まだクラブシーンがなかった。ただし、70年代末の2トーン・スカ・ブームで、80年代の初頭まではスカの人気があった。

1984年、前身バンドのブルーフレイムスが結成され、翌1985年に初ライブを行った。このグループが、のちにTHE SKA FLAMES（スカフレイムス）と名乗る。日本で最初の本格的スカ・バンドとされる。

同じ1985年、ASA-CHANGを中心に東京スカパラダイスオーケストラが結成された。1989年、イギリスの音楽家ギャズ・メイオールのレーベルから、スカフレイムスがイギリス・デビューを果たす。同年、スカパラもアルバム『東京スカパラダイスオーケストラ』（通称・黄色いアナログ）でインディーズ・デビューした。1990年にはアルバム『スカパラ登場』を発表し、ツアー「日本一のスカパラ道中」で全国5大都市を回った。

しかし、この時点ではまだ一部の音楽だった。サード・ウェイヴ・スカは「1980年代後半のパンクシーンで始まり、1990年代に商業的に成功した」。スカ・パンクはその「サブジャンル」である。ムーンスカ・レコードは、1983年にトースターズのボーカリストのバケットが設立したレーベルで、1990年代前半に影響力を持つ米国のスカの拠点になった。トースターズは最初期の第三波バンドの一つとされる。

その波を受け、1995年に日本ではKEMURIやPOTSHOTが結成され、歪んだギターでスカのリズムを演奏するスカ・パンクが若者に支持された。KEMURIは1997年にアルバム『Little Playmate』を出し、1998年の『77days』で「PMA (Positive Mental Attitude)」を発表した。大阪では1990年にDETERMINATIONSが結成され、スカフレイムスの長井政一のプロデュースによる一発録りのアルバム『SKA CHAMPION』を1996年に残した。

1997年には、アメリカでのブームの波が日本にも届き、スカ・パンクが一気に注目を集めた。

それでも、ブームが去ったあともシーンは続いた。1996年結成で10名超の大所帯であるOi-SKALL MATESが、スカ・パンクを基調にさまざまなジャマイカ音楽を取り込む活動でライブハウスを盛んにした。ジャマイカに近いサウンドを追うオーセンティック・スカのバンドたちも、各地に生まれた。北海道のbeat sunset、秋田のThe KING LIONなどがそれである。一方、80年代の2TONE SKAに影響を受けたネオスカ系のバンドも現れた。関西のRUDE STOMPERSは2007年ごろから（2005年からとする資料もある）、東京のAUTOCRATICSは2007年の結成から活動している。

THE SILVER SONICSは1994年結成のベテランで、スカフレイムスの鍵盤奏者でもある村田亮が率いる。

スカパラはメンバーチェンジを重ねながらインストゥルメンタル中心の活動を続け、2001年からはゲストボーカルを迎える「歌モノ」にも取り組んだ。The KING LIONが2026年にフジロックへ初出演するなど、日本のスカは全国のライブハウスで鳴り続けている。</p>
