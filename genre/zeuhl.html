<h1>Zeuhl（ゼール）とは</h1>
<p>フランスのバンドMagmaが創始した、きわめて独特な音楽のスタイルだ。名前は、バンドが作った架空の言語であるコバイア語の言葉で、「天上」を意味する。ジャズ・フュージョン、シンフォニック・ロック、ネオクラシカルを混ぜ合わせたものとも</p>
<p>フランスのバンドMagmaが創始した、きわめて独特な音楽のスタイルだ。名前は、バンドが作った架空の言語であるコバイア語の言葉で、「天上」を意味する。ジャズ・フュージョン、シンフォニック・ロック、ネオクラシカルを混ぜ合わせたものともいわれる。

ドラム、ベース、複数の鍵盤、管楽器、そして複数の歌手による大規模な編成は、Magma（特に1970年代前半）の典型だ。一方で、Ruinsのように、ベースとドラムだけの編成もある。

音楽の中心は、ベースとドラムのしつこい繰り返しだ。反復的なベースのリフが続き、その上に声と管楽器が層を重ねていく。ベースは唸るような太い音で前に出て、メロディーの主題を受け持つ。

和音は短調の暗い響きが基本だ。不協和が続き、曲の終わりで和音を落ち着かせる形を避ける曲もある。

合唱のように重なる多声のヴォーカルも、大きな特徴だ。複数の声のパートが絡み合い、時に叫び、時に呪文のように繰り返す。

歌詞は主に架空の言語（コバイア語）で歌われる。多くは翻訳されないが、物語の手がかりは別に示されており、意味を持つ言語として作られた。

全体の印象は、儀式的で威圧的、そして黙示録的だ。ジャズの即興（Coltraneなど）や、オルフ流の合唱と反復などが、独特の配合で結び付いている。</p>
<h2>成り立ち</h2><p>始まりは1969年のパリだ。ドラマーのChristian Vanderが、この年にMagmaを結成した。彼はジャズ・ピアニストMaurice Vanderの養子で（継父とする説もある）、とりわけJohn Coltraneに深くのめり込んだ。1967年のColtraneの死は、彼にとって大きな喪失だった。その死後、音楽は一からやり直す必要があると感じ、その探求を引き継ごうとしたと彼は語っている。

Magmaの音楽は、最初から壮大な物語と結び付いていた。彼は、地球の破滅から逃れた人々が移り住んだ惑星コバイアという架空の世界を設定し、その住民の言語としてコバイア語を作った。第一作は1970年のMagma（のちにKobaïaの名で再発）である。1973年の三作目Mëkanïk Dëstruktïẁ Kömmandöhは、第一作の後の地球を描いた。Ẁurdah Ïtahを含めて数えると五作目になる、1974年のKöhntarköszは、古代エジプトを舞台にした。とりわけ1973年の作品は、このスタイルを固めた作品とされる。合唱と反復するベース、そして執拗な上昇によって、圧倒的な緊張を作り上げた。

一方で、彼らの音楽と架空の言語は、ドイツ語のように響く言葉や黒革の衣装などから、ファシズムやナチズムを連想させると批判されたことがある。これに対しVanderは、黒を沈黙と平和のしるしとして選んだと反論している。

Magmaの周りからは、複数のバンドが生まれた。1971年に元MagmaのYochk'o SefferとFrançois Cahenが結成したZao、1976年に元Magmaのメンバーを中心に結成されたWeidorjeなどが、それぞれ違う方向へ広がった。ベルギーのUnivers Zeroは、Magmaの影響を受けつつ、主にRock in Oppositionや室内楽ロックに分類される。この音楽の名前は、当初はMagmaだけを指す呼び名だった。のちにフランスのバンドに、さらに日本のバンドにも使われるようになった。

日本でも熱心に受け入れられた。1980年代以降、Ruins（1985年結成）、Koenjihyakkei（1991年結成）、そしてボンデージ・フルーツ（1990年結成）といったバンドが、独自の解釈を示した。とりわけKoenjihyakkeiやRuinsは、自分たちで作った言語で歌うなど、その方法ごと受け継いでいる。

フランスでは1970年代に、ライブを中心に人気が高かった。国際的な商業規模は限られたが、その徹底した独自性によって、40年以上にわたり熱狂的な支持者を保ち続けている。</p>
