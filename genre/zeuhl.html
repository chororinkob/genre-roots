<h1>Zeuhl（ゼール）とは</h1>
<p>フランスのバンドMagmaが創始した、極めて特異な音楽様式。名称はバンドが創作した架空の言語コバイア語で、天上を意味する。編成はドラム、ベース、複数の鍵盤、管楽器、そして複数の歌手からなる大規模なもので、ジャズ・フュージョン、シン</p>
<p>フランスのバンドMagmaが創始した、極めて特異な音楽様式。名称はバンドが創作した架空の言語コバイア語で、天上を意味する。編成はドラム、ベース、複数の鍵盤、管楽器、そして複数の歌手からなる大規模なもので、ジャズ・フュージョン、シンフォニック・ロック、ネオクラシカルの混合ともいわれる。音楽的な核はベースとドラムによる執拗な反復で、しばしば変拍子が数分にわたり変化せずに続き、その上に声と管楽器が層を積み上げていく。ベースは唸るような太い音で前面に出て、旋律的な主題を担う。和声は短調の暗い響きが基調で、増4度や短2度を含む不協和が持続し、機能和声的な解決はほとんど行われない。歌唱が最大の特徴で、複数の声部が対位法的に絡み、時に叫び、時に呪文のように反復する。歌詞は大半が架空言語（コバイア語）で書かれるため、意味は聴き手に開かれておらず、声は純粋に音として機能する。全体の印象は、儀式的で威圧的、そして黙示録的である。ジャズの即興（Coltraneなど）やオルフの管弦楽などが、独特の配合で結合している。</p>
<h2>成り立ち</h2><p>1969年、パリでドラマーのChristian Vanderが結成したMagmaに始まる。彼はジャズ・ピアニストMaurice Vanderの養子で（継父とする資料もある）、とりわけJohn Coltraneに深く傾倒した。1967年のColtraneの死は彼にとって決定的な喪失であり、その空白を埋めるために独自の音楽を作ったと語っている。Magmaの音楽は最初から壮大な物語と結び付いていた。彼は地球の破滅から逃れた人々が移住した惑星コバイアという架空の世界を設定し、その住民の言語としてコバイア語を創作した。第一作の1970年のMagma（のちにKobaïaの名で再発）に対し、1973年の三作目Mëkanïk Dëstruktïẁ Kömmandöhや1974年の五作目Köhntarköszなど後続作は、より古い時代を舞台にした別の物語を描いた。とりわけ1973年の作品は、この様式を確立した作品とされ、合唱と反復するベース、そして執拗な上昇によって圧倒的な緊張を作り上げた。彼らの音楽と架空言語は、ドイツ語のように響く言語や黒革の衣装などから、ファシズムやナチズムとの連想で批判されたことがある。Magmaの周辺から複数のバンドが生まれた。1971年に元MagmaのYochk'o SefferとFrançois Cahenが結成したZao、1976年に元Magmaのメンバーを中心に結成されたWeidorjeなどが、それぞれ異なる方向へ展開した。ベルギーのUnivers Zeroは別系統で、Rock in Oppositionや室内楽ロックとして扱われることが多い。この一群はフランス語圏で一つの様式として認識されるようになった。日本にも熱心な受容があり、1980年代以降、Ruins（1985年結成）、Koenjihyakkei（1991年結成）、そしてボンデージ・フルーツ（1990年結成）といったバンドが独自の解釈を示した。とりわけKoenjihyakkeiやRuinsは自らの創作言語で歌うなど、その方法論ごと継承している。商業的には限定的だったが、その徹底した独自性により、40年以上にわたり熱狂的な支持者を保ち続けている。</p>
