<h1>Zeuhl（ゼール）とは</h1>
<p>フランスのバンドMagmaが創始した、極めて特異な音楽様式。名称はバンドが創作した架空の言語コバイア語で、天上を意味する。編成はドラム、ベース、複数の鍵盤、管楽器、そして複数の歌手からなる大規模なもので、ロックというよりは合唱を伴</p>
<p>フランスのバンドMagmaが創始した、極めて特異な音楽様式。名称はバンドが創作した架空の言語コバイア語で、天上を意味する。編成はドラム、ベース、複数の鍵盤、管楽器、そして複数の歌手からなる大規模なもので、ロックというよりは合唱を伴う室内管弦楽に近い。音楽的な核はベースとドラムによる執拗な反復で、しばしば変拍子、たとえば四分の五や八分の七の周期が数分にわたり変化せずに続き、その上に声と管楽器が層を積み上げていく。ベースは歪ませて前面に出て、旋律的な主題を担う。和声は短調の暗い響きが基調で、増四度や短二度を含む不協和が持続し、機能和声的な解決はほとんど行われない。歌唱が最大の特徴で、複数の声部が対位法的に絡み、時に叫び、時に呪文のように反復する。歌詞は全て架空言語で書かれるため、意味は聴き手に開かれておらず、声は純粋に音として機能する。全体の印象は、儀式的で威圧的、そして黙示録的である。ジャズの即興、ストラヴィンスキーやオルフの管弦楽、そしてアフリカ的な反復が、独特の配合で結合している。</p>
<h2>成り立ち</h2><p>1969年、パリでドラマーのChristian Vanderが結成したMagmaに始まる。彼は少年期に義理の父を通じてジャズの音楽家と接し、とりわけJohn Coltraneに深く傾倒した。1967年のColtraneの死は彼にとって決定的な喪失であり、その空白を埋めるために独自の音楽を作ったと語っている。Magmaの音楽は最初から壮大な物語と結び付いていた。彼は地球の破滅から逃れた人々が移住した惑星コバイアという架空の世界を設定し、その住民の言語としてコバイア語を創作した。第一作の1970年のMagmaから、1973年のMekanïk Destruktïw Kommandöh、1974年のKöhntarkösz へと物語は展開する。とりわけ1973年の作品は、この様式の完成形とされ、合唱と反復するベース、そして執拗な上昇によって圧倒的な緊張を作り上げた。彼らの音楽と架空言語は、当初フランス国内で強い反発と困惑を招いた。ドイツ的な響きを持つ言語と、統制された合唱、そして制服のような衣装が、全体主義を連想させると批判されたのである。Christian Vanderはこれを繰り返し否定している。1970年代半ば、Magmaの周辺から複数のバンドが生まれ、独自の潮流を形成した。Zao、Weidorje、Univers Zeroといった集団が、それぞれ異なる方向へ展開し、この一群はフランス語圏で一つの様式として認識されるようになった。日本にも熱心な受容があり、1980年代以降、Ruins、Koenjihyakkei、そしてボンデージ・フルーツといったバンドが独自の解釈を示した。とりわけKoenjihyakkeiは自らの架空言語を作るなど、その方法論ごと継承している。商業的には常に極めて限定的だが、その徹底した独自性により、40年以上にわたり熱狂的な支持者を保ち続けている。</p>
