<h1>Reggaeton（レゲトン）とは</h1>
<p>カリブ海のスペイン語圏で確立した、単一のリズム型を核とするダンス音楽。骨格をなすのはデンボウと呼ばれる打楽器の型で、四分の四拍子の中でキックが一拍目と三拍目の直前に置かれ、スネアあるいはリムショットが三連的にずれた位置で連続して鳴</p>
<p>カリブ海のスペイン語圏で確立した、単一のリズム型を核とするダンス音楽。骨格をなすのはデンボウと呼ばれる打楽器の型で、四分の四拍子の中でキックが一拍目と三拍目の直前に置かれ、スネアあるいはリムショットが三連的にずれた位置で連続して鳴る。楽譜で書けば付点八分と16分の組み合わせが延々と反復する形で、この揺れが腰を回す踊りペレオを誘発する。BPMは88〜100前後と、ヒップホップとほぼ同じ帯域にある。低音は深いサブベースが担い、上物は最小限で、短いシンセの刺し、笛の音型、加工した声のサンプルが繰り返される。和声は短調の単純な循環が中心で、しばしば四小節で完結する。歌唱はラップと歌の中間で、韻を踏みながらも旋律を持ち、掛け合いと合唱が多用される。歌詞はスペイン語で、性的な誘惑、街の生活、成功の誇示、そして恋愛を扱い、俗語や地域固有の言い回しが多い。近年はより滑らかな歌唱と柔らかい音色を採る系統が主流化し、世界的なポップスの語彙となったが、デンボウの型そのものは30年以上ほとんど変わっていない。</p>
<h2>成り立ち</h2><p>起源は1980年代のパナマにある。同国にはパナマ運河の建設のためジャマイカから移住した人々の子孫が多く、彼らがレゲエとダンスホールをスペイン語で歌い始めた。El GeneralことEdgardo Franco が1980年代末から1990年代初頭に発表した作品が、この初期形態を広く知らしめた。決定的なリズムの源は、ジャマイカのプロデューサーBobby Digitalが制作し、Shabba Ranksが1990年に発表したDem Bowで、この曲の伴奏が抜き出されて無数の楽曲の土台となり、リズムの名称そのものになった。1990年代、プエルトリコのサンフアンで独自の発展が起きた。首都の公営住宅地区、いわゆるカセリオの若者たちが、地下で流通するカセットを通じてこの音楽を広め、当初はアンダーグラウンドと呼ばれた。DJ Playeroらの編集したテープが手から手へ渡り、Daddy Yankee、Ivy Queenらが頭角を現した。しかし1990年代半ば、プエルトリコ政府はこの音楽を犯罪と猥褻に結び付け、警察がレコード店を捜索してカセットを押収する取り締まりを行い、公的な場での演奏も規制された。この弾圧は結果的に音楽の反抗的な性格を強めた。2004年、Daddy YankeeのGasolinaが世界的な大ヒットとなり、規制の時代は完全に終わった。同時期にTego Calderón、Don Omar、Wisin &amp; Yandelが国際的な成功を収めた。2017年、Luis FonsiとDaddy YankeeのDespacitoが、Justin Bieberを迎えた版とともに世界中で記録的な再生数を達成し、スペイン語の楽曲が英語圏の市場を制するという事態が起きた。近年はコロンビアのJ Balvin、Karol G、プエルトリコのBad Bunnyがそれぞれ異なる方向へ拡張し、世界で最も再生される音楽の一つとなっている。女性蔑視的な歌詞への批判は当初から根強く、Ivy Queenをはじめとする女性の作家がその内部から異議を唱え続けてきた。</p>
<h2>代表曲</h2><ul><li>Gasolina（Daddy Yankee）</li><li>Despacito（Luis Fonsi ft. Daddy Yankee）</li><li>Dákiti（Bad Bunny &amp; Jhay Cortez）</li><li>Tusa（Karol G &amp; Nicki Minaj）</li><li>Con Calma（Daddy Yankee &amp; Snow）</li><li>Safaera（Bad Bunny, Jowell &amp; Randy, Ñengo Flow）</li></ul>
