<h1>Reggaeton（レゲトン）とは</h1>
<p>レゲトンは、カリブ海のスペイン語圏で定着した、ひとつのリズム型を核とするダンス音楽だ。 骨格をなすのは、デンボウと呼ばれる打楽器の型である。4分の4拍子のバスドラムの上に、3+3+2(トレシージョ)と呼ばれる交差するリズムが重なる</p>
<p>レゲトンは、カリブ海のスペイン語圏で定着した、ひとつのリズム型を核とするダンス音楽だ。

骨格をなすのは、デンボウと呼ばれる打楽器の型である。4分の4拍子のバスドラムの上に、3+3+2(トレシージョ)と呼ばれる交差するリズムが重なる。スネアあるいはリムショット（太鼓の縁を叩く音）が、その位置で鳴る。楽譜で書けば、付点八分＋付点八分＋8分音符の組み合わせが延々と反復する形だ。この揺れが、腰を回す踊りペレオを誘発する。

BPMは標準で85〜100（90〜100とする資料もある）。

低音は、深いサブベース（耳より体に響く極低音）が担う。上物（メロディーなど上に重ねる音）は最小限であることが多い。短いシンセの刺し、笛の音型、加工した声のサンプル（録音から切り出した素材）が繰り返される例が多い。和声は短調の単純な循環が中心の例が多く、4小節で完結することもある。

歌唱は、ラップと歌の中間にある。韻を踏みながらも旋律を持ち、掛け合いと合唱が多用される。歌詞はスペイン語で、性的な誘惑、街の生活、成功の誇示、そして恋愛を扱う。俗語や地域固有の言い回しが多い。

近年は、より滑らかな歌唱と柔らかい音色を採る系統が主流になった。世界的なポップスの要素ともなっている。ただ、デンボウの型の核は30年以上変わっておらず、スタイルの違う変種が生まれている。</p>
<h2>成り立ち</h2><p>カリブ海を舞台に、レゲトンの起源をめぐる経緯が語られる。1980年代中盤までにパナマでスペイン語のレゲエ／ダンスホールが始まり、1980年代後半に広がった。そして1990年代初めに、プエルトリコで現在のレゲトンとして固まったという(パナマ説とプエルトリコ説がある)。

パナマには、パナマ運河の建設のため西インド諸島（英領カリブ）から移住した人々の子孫が多い。彼らがレゲエとダンスホールをスペイン語で歌い始めた。El GeneralことEdgardo Franco は、1980年代末〜1990年代初頭にスペイン語のダンスホールで頭角を現した一人だ。その作品が、この初期形態を広く知らしめた。

決定的なリズムの源は、Shabba Ranksが1990年に発表したDem Bowである。ジャマイカのプロデューサーBobby Digitalが制作した曲で、この曲の名がリズムの名称そのものになった。伴奏のリディム（レゲエ系の伴奏トラック）は、Steely &amp; Clevieが1989年に作ったものだ。プエルトリコ勢が1990年代に多用したのは、Dennis the Menaceが1990年に作った「Pounder (Dub Mix II)」の版である。

1990年代、プエルトリコのサンフアンで独自の発展が起きた。首都の公営住宅地区、いわゆるカセリオの若者たちが、地下で流通するカセットを通じてこの音楽を広めた。当初はアンダーグラウンドと呼ばれた。DJ Playeroらの編集したテープが手から手へ渡り、Daddy Yankee、Ivy Queenらが頭角を現した。

しかし1990年代半ば、プエルトリコ政府はこの音楽を犯罪と猥褻に結び付けた。警察がレコード店を捜索してカセットを押収する取り締まりを行ったのだ（1995年2月にはサンフアンの6店が捜索され、数百本が押収された）。学校でも、こうした音楽が押収の対象になった。この弾圧は結果的に、音楽の反抗的な性格を強めたとも言われる。

2004年に発売されたDaddy YankeeのGasolinaが、2005年に世界的ヒットとなり、世界展開の扉を開いた。国内では2003年ごろから受容が進んでいた。同時期にTego Calderón、Don Omar、Wisin &amp; Yandelが国際的な成功を収めた。

2017年、Luis FonsiとDaddy YankeeのDespacitoが、Justin Bieberを迎えた版とともに、世界中で記録的な再生数を達成した。スペイン語を中心とした曲（Bieber版は英語とスペイン語の二言語版）が、英語圏の市場を制するという事態が起きた。近年は、コロンビアのJ Balvin、Karol G、プエルトリコのBad Bunnyが、それぞれ異なる方向へ拡張している。世界で最も再生される音楽の一つとなっている。

一方、女性蔑視的な歌詞への批判は、当初から根強い。Ivy Queenをはじめとする女性の作家が、その内部から異議を唱え続けてきた。</p>
