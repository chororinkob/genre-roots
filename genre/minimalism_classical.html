<h1>Minimalism（ミニマリズム）とは</h1>
<p>20世紀後半に生まれた、極端に単純な素材の反復と、その微細な変化によって構成される芸術音楽。基本原理は明快で、短い音型、しばしば数音からなる断片を延々と繰り返し、そこにごくわずかずつ変化を加えていく。変化の方法には型があり、音を一</p>
<p>20世紀後半に生まれた、極端に単純な素材の反復と、その微細な変化によって構成される芸術音楽。基本原理は明快で、短い音型、しばしば数音からなる断片を延々と繰り返し、そこにごくわずかずつ変化を加えていく。変化の方法には型があり、音を一つずつ足していく加算的過程、二つの同じ音型をわずかに異なる速度で演奏することで少しずつずれていく位相ずれ、そして一定の周期で音型を回転させる手法などが用いられる。和声は極めて静的で、一つの調や旋法の上に長くとどまり、機能和声的な緊張と解決をほとんど用いない。この結果、聴き手の注意は和声の進行ではなく、音の質感とリズムの重なりそのものへ向かう。リズムは規則的な拍が保たれるが、複数の周期が同時に進行するため、どこが小節の頭なのかが曖昧になる瞬間が生じる。編成は多様で、電気オルガンとマリンバなどの打楽器を中心とする小編成から、管弦楽と合唱までを含む。演奏には極めて高い集中力と正確さが要求され、わずかなずれが構造全体を壊す。長時間の反復による意識の変容が、聴取体験の核心をなす。</p>
<h2>成り立ち</h2><p>1960年代の米国、とりわけニューヨークとカリフォルニアで形成された。背景には、当時のヨーロッパの前衛音楽、すなわち音の全ての要素を数理的に管理するトータル・セリエリズムが、聴き手にとって難解を極めていたことへの反発がある。直接の先駆はLa Monte Youngで、彼は1958年前後から極端に長い持続音による作品を作り、後に純正律の研究へ進んだ。1964年、Terry Rileyが発表したIn Cは、53の短い音型を、任意の人数の演奏者が各自の判断で繰り返しながら進むという作品で、この分野の出発点として広く認められている。Steve Reichは、1965年のIt's Gonna Rainで、同じテープループを二台の再生機で流すと機器の速度差により少しずつずれていくことを発見し、これを位相ずれとして作曲原理に転換した。彼は1970年にガーナでアフリカの太鼓を学び、1973年にはバリ島のガムランを研究しており、これらの多層的なリズム構造が彼の音楽の土台となっている。1976年のMusic for 18 Musiciansが代表作とされる。Philip GlassはパリでNadia Boulangerに学んだ後、インドのRavi Shankarの映画音楽の記譜を手伝った経験から、加算的なリズム構造を得た。彼は1976年、演出家Robert Wilsonとの共作Einstein on the Beachで、五時間近い前衛的なオペラを上演した。当時彼はニューヨークでタクシー運転手として生計を立てており、初演の後も借金が残ったと語っている。当初この音楽は批評家から単調で幼稚だと激しく攻撃されたが、1980年代以降は映画音楽、広告、そして後の電子音楽やポスト・ロックに広く浸透し、20世紀後半で最も影響力のある動向の一つとなった。</p>
<h2>代表曲</h2><ul><li>It's Gonna Rain (Steve Reich)</li><li>In C (Terry Riley)</li><li>Music in 12 Parts (Philip Glass)</li><li>Drift Study (La Monte Young)</li><li>Short Ride in a Fast Machine (John Adams)</li></ul>
