<h1>Minimalism（ミニマリズム）とは</h1>
<p>ミニマル音楽は、20世紀後半に生まれた、極端に単純な素材の反復と、その微細な変化によって構成される芸術音楽だ。 基本原理は明快だ。短い音型、しばしば数音からなる断片を延々と繰り返し、そこにごくわずかずつ変化を加えていく。変化の方法</p>
<p>ミニマル音楽は、20世紀後半に生まれた、極端に単純な素材の反復と、その微細な変化によって構成される芸術音楽だ。

基本原理は明快だ。短い音型、しばしば数音からなる断片を延々と繰り返し、そこにごくわずかずつ変化を加えていく。変化の方法には型がある。音を一つずつ足していく加算的過程、二つの同じ音型をわずかに異なる速度で演奏することで少しずつずれていく位相ずれ、そして一定の周期で音型を回転させる手法などが用いられる。

編成は多様で、電気オルガンとマリンバなどの打楽器を中心とする小編成から、管弦楽（オーケストラ）と合唱までを含む。

和声は、初期の作品では静的だ。一つの調や旋法の上に長くとどまり、機能和声（和音ごとに役割が決まった和声の仕組み）的な緊張と解決をほとんど用いない。この結果、聴き手の注意は和声の進行ではなく、音の質感とリズムの重なりそのものへ向かう。ただし作品によって異なり、Music for 18 Musiciansは11和音の循環を軸とし、作曲者自身が「それまでのどの作品よりも和声の動きが大きい」と述べている。

リズムは規則的な拍が保たれる。ただ、複数の周期が同時に進行するため、どこが小節の頭なのかが曖昧になる瞬間が生じる。

演奏には、集中力や正確さが要る作品があり、作品によっては厳密な同期が求められる。長時間の反復による意識の変化が、聴取体験の核心をなす。</p>
<h2>成り立ち</h2><p>1950年代末から1960年代にかけて、米西海岸に始まりニューヨークでも展開した。背景には、当時のヨーロッパの前衛音楽、すなわち音の全ての要素を数理的に管理するトータル・セリエリズムがあった。これが聴き手にとって難解を極めていたことへの反発と説明される。

直接の先駆はLa Monte Youngだ。彼は1958年前後から極端に長い持続音による作品を作り、後に純正律（きれいに響き合う音程の取り方）の研究へ進んだ。

1964年、Terry Rileyが発表したIn Cは、53の短い音型を、任意の人数の演奏者が各自の判断で繰り返しながら進むという作品だ。この分野の出発点とされることが多い（ただし1958〜59年に、La Monte YoungやDennis Johnsonの先行作がある。Riley自身はYoungのTrio for Stringsを最初の重要作と見なしている）。

Steve Reichは、1965年のIt's Gonna Rainで、同じテープループを2台の再生機で流すと機器の速度差により少しずつずれていくことを発見した。これを位相ずれとして作曲原理に転換した。彼は1970年にガーナでアフリカの太鼓を学び、1973年と1974年には米国のシアトルとバークレーでバリ島のガムランを学んでいる。これらの学びは、1970年代以降の作品に影響を与えた。1976年のMusic for 18 Musiciansが代表作とされる。

Philip Glassは1964年秋から1966年夏までパリでNadia Boulangerに学んだ。その2年目に並行して、インドのRavi Shankarと、その伴奏者Alla Rakhaとの仕事、すなわち映画音楽の記譜を手伝った経験から、加算的なリズム構造を得た。

彼は1976年、演出家Robert Wilsonとの共作Einstein on the Beachで、五時間近い前衛的（新しさを追い求める）なオペラを上演した。当時彼はニューヨークでタクシー運転手などの仕事で生計を立てており、公演の後に借金が残ったとされる。原因について、Glassは「失った9万ドルはヨーロッパで失った（1晩約3,000ドルの損失）」と述べ、共作者のWilsonは「Metの借り上げに9万ドルかかった。それでも借金を負った」と語り、証言が割れている。

当初この音楽は批評家からしばしば敵対的な反応を受けた。しかし1980年代以降は映画音楽、広告、そして後の電子音楽やポスト・ロックに広く浸透し、20世紀後半に大きな影響を与えたとされる。</p>
