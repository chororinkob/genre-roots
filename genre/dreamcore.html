<h1>Dreamcore（ドリームコア）とは</h1>
<p>ドリームコアは、夢や幼い頃の記憶を呼び起こす、ノスタルジックでどこか不気味なサウンドが特徴だ。音楽ジャンルとしての定まった定義はない。インターネット発のビジュアル美学に付随するBGM群を指す使い方が中心である。なお、同じ名前で、メ</p>
<p>ドリームコアは、夢や幼い頃の記憶を呼び起こす、ノスタルジックでどこか不気味なサウンドが特徴だ。音楽ジャンルとしての定まった定義はない。インターネット発のビジュアル美学に付随するBGM群を指す使い方が中心である。なお、同じ名前で、メロディック・ハードコアの一派（2010年代、YouTubeチャンネルDreambound由来）を指す別のジャンルもある。ここで扱うのは前者だ。

よく使われる加工の1つが「スロウド・アンド・リバーブ」である。既存のポップスやゲーム音楽の断片のテンポを大きく落とし、多重のリバーブとテープノイズ、わずかなピッチ変化をかけて繰り返す。音はVHS映像のように霞み、記憶の輪郭が溶けたような手触りになる。

よく聴かれるのは、テンポを落としたミュージックボックス系の旋律や、80〜90年代風のシンセサイザーの音、ローファイな音質だ。

メロディーは単純で美しいものが多く、同じ旋律を繰り返すことが多い。

リズムは基本的に静かで、拍を強調しない。一方、日本のリスナー・投稿者の間では、ブレイクコア由来の高速ビートを含む解釈もある。

歌ものとインストゥルメンタルの両方がある。ボーカルがある場合は遠くで歌われ、ピッチシフト（音の高さを変える処理）をかけられて、言葉が聞き取りにくいことも多い。歌詞がある場合は、夢、子供時代の思い出、知らない場所への郷愁、解離的な感覚などを扱う例が多い。

エコーとリバーブは全編に張り巡らされ、音は空間のどこからともなくにじみ出す。

ドリームポップやアンビエントに近いが、歌が主役の組み立てを避け、空間と郷愁そのものを聴かせる。YouTubeやTikTokのプレイリスト、バックルーム系ゲーム配信のBGMとして、誰かの寝る前の記憶を分け合うように流れている。</p>
<h2>成り立ち</h2><p>ドリームコアは、最初は音楽ではなく、視覚の美学として生まれた。名前が広まったのは2020年代前半だが、その原型となる画像は、2018年ごろのTumblrまでさかのぼるとされる。少なくとも2020年には、音楽作品の題名にも使われていた。

TumblrユーザーのGabrielle Traversatは、シュールな風景の画像を投稿した、初期の代表的な作り手の1人だ。2018年の作品がある。ただし、最古かどうかは分からない（正確な起源は不明）。その後、夢と現実の境目をテーマにしたビジュアルが、少しずつ積み重なっていった。1998年にPlayStation向けに発売された『LSD: Dream Emulator』や、2004年のフリーゲーム『ゆめにっき』など、夢の中をさまようゲームは、この流れの影響源として挙げられることがある。

2019年、4chan・Reddit・Tumblrでリミナルスペース画像が共有され、4chan発の創作「バックルーム」（2019年5月）が誕生した。リミナルスペース画像は2020年のパンデミック期に人気が広がり、バックルームは2022年にYouTube動画で主流になった。2020年代前半には、TikTokなどでドリームコアという呼び名が広まっていった。

2020年ごろから、音楽がこの美学と結びつけられた。YouTubeやSpotifyには「dreamcore playlist」が数えきれないほど作られた。それまでインディーポップ、エレクトロニカ、ゲーム音楽などとして聴かれていた曲が、「夢のように霞んだ音楽」として新しい文脈で聴き直され、スロウド・アンド・リバーブ処理をかけて流された。ケロ・ケロ・ボニートのミックステープ『Intro Bonito』（2013年）収録の「I'd Rather Sleep」、MolinaとLate Verlaneの「Hey Kids」、Mild High Clubの「Homage」、ボーズ・オブ・カナダの旧作などである。

ちょうど新型コロナウイルスの流行で外出が制限され、多くの若者が部屋の中でネットとゲームに没頭した時期と重なった。この閉じた抒情性が時代の気分を代弁するものとして急速に広がったのは、パンデミックが背景にあったからだとする見方がある。

2020年11月には、レーベルDream Cult Pressが『DREAMCORE: FALL 2020』と題したコンピレーション（カセット）を発表した。2021年にはHumanfobia名義で『The Dreamcore Soundscape Collection』が出ている。ストックミュージック大手のEpidemic Soundも、「Dreamcore」をテーマ別のプレイリストとして載せた。

日本にもこの流れは広がった。2024年ごろから、Xやnoteで「音楽としてのドリームコア」をめぐる議論が交わされ、ブレイクコア由来の高速ビートとチルい浮遊感をあわせ持つ解釈も生まれた。2025年には、日本のデュオChouchouがEP『ASTERISK』の収録曲「Asterisk (dreamcore)」を発表し、アーティスト自身がジャンル名を掲げる例も現れた。

また、OMORI（2020年）や『ENA: Dream BBQ』（2025年）、Steam用のリミナルホラーゲーム『Dreamcore』（2025年）といった、関連する雰囲気を持つゲームも話題になっている。今ではweirdcoreやtraumacoreなどの姉妹美学とゆるやかに重なり、AI画像生成の題材にもなっている。音楽とビジュアルの境界を越えた文化現象として、広がり続けている。</p>
