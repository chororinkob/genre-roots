<h1>Dreamcore（ドリームコア）とは</h1>
<p>ドリームコアは、夢や幼い頃の記憶を想起させる、ノスタルジックでどこか不気味なサウンドを特徴とするインターネット発の音楽様式だ。中心的な手法は「スロウド・アンド・リバーブ」で、既存のポップスやゲーム音楽の断片を毎分60〜80拍までテ</p>
<p>ドリームコアは、夢や幼い頃の記憶を想起させる、ノスタルジックでどこか不気味なサウンドを特徴とするインターネット発の音楽様式だ。中心的な手法は「スロウド・アンド・リバーブ」で、既存のポップスやゲーム音楽の断片を毎分60〜80拍までテンポを落とし、多重のリバーブとテープノイズ、わずかなピッチ変化をかけて反復させる。音はVHS映像のように霞み、記憶の輪郭が溶けたような質感を持つ。メロディーは単純で美しいものが多く、長7度和音やsus4和音が浮遊感を生み、時にリディアン的な半音の遊びが夢の中の奇妙さを添える。使用される音色は、柔らかなシンセパッド、ミュージックボックスの音色、残響の長いピアノ、霞んだギターが中心で、ドラムマシンの音は遠くこもって聞こえる。リズムは原則として静かで拍を強調せず、素朴な4分音符のビートが置かれるだけの曲も多い。一方、ブレイクコア寄りの変種では毎分160〜200拍の高速ブレイクビーツが炸裂し、チルい浮遊感と激しいドラムの落差が独特の魅力となる。エコーとリバーブは全編に張り巡らされ、音が空間のどこからともなく滲み出し、曲は記憶の断片のようにふわりと始まり、フェードアウトで消えていく。ボーカルは遠くで歌われ、ピッチシフトやリバース処理を施されて言葉が聞き取りにくいことも多く、歌詞の主題は夢、子供時代の思い出、知らない場所への郷愁、解離的な感覚だ。ドリームポップやアンビエントに近いが、歌主体の構造を排して純粋に空間と郷愁を聴かせ、アンビエントより明確なメロディの断片を残す点で異なる。YouTubeやTikTokのプレイリスト、バックルーム系ゲーム配信のBGMとして、誰かの寝る前の記憶を共有するように流れている。</p>
<h2>成り立ち</h2><p>ドリームコアは、まず音楽ではなく視覚の美学として生まれた。名称自体は2020年代初頭まで使われていなかったが、その原型的な画像は2018年ごろのTumblrまで遡る。TumblrユーザーのGabriel Traversatがシュールな風景と3D要素を組み合わせた画像を投稿したのが最古の例とされ、以降、夢と現実の境界をテーマにしたビジュアルがゆっくりと蓄積された。この潮流は、1998年にPlayStation向けに発売された『LSD: Dream Emulator』や2004年のフリーゲーム『ゆめにっき』など、夢の中を彷徨うゲーム群の系譜に連なるものだ。2019年ごろにはYouTubeの「リミナルスペース」映像や、4chan発の創作「バックルーム」ブームと合流し、ドリームコアという呼称がネット上で定着していった。音楽がこの美学に接続されたのは2020年前後のことである。YouTubeやSpotifyに「dreamcore playlist」が無数に作られ、それまでインディーポップやゲーム音楽として聴かれていた楽曲――ケロ・ケロ・ボニートの「I'd Rather Sleep」（2018年）、Molinaの「Hey Kids」、Mild High Clubの「Homage」、ボーズ・オブ・カナダの旧作など――が「夢のように霞んだ音楽」として再文脈化され、スロウド・アンド・リバーブ処理をかけられて流れた。ちょうど新型コロナウイルスの流行で外出が制限され、多くの若者が部屋の中でネットとゲームに没頭した時期と重なり、この閉じた抒情性は時代の気分を代弁するものとして急速に広がった。2021年にはレーベルDream Cult Pressがコンピレーション『Dreamcore Music』を発表し、Humanfobiaらネットレーベル系アーティストの楽曲が「ドリームコア」の名を冠して正式にリリースされた。2022年には続編『Dreamcore Music Vol.2』、その後Vol.3も発表され、ストックミュージック大手のEpidemic Soundも「Dreamcore」を制作音楽のカテゴリとして採用した。日本でもこの潮流は広がり、2024年ごろからXやnoteで「音楽としてのドリームコア」をめぐる議論が交わされ、ブレイクコア由来の高速ビートとチルい浮遊感を併せ持つ解釈も生まれた。2025年には日本のデュオChouchouが「Asterisk (dreamcore)」を発表し、アーティスト自身がジャンル名を掲げる例も現れた。一方でこのジャンルへの評価は割れている。「既存曲のキュレーションと加工にすぎず、固有の音楽的実体を持たない」という批判もあるが、OMORI（2020年）や『Ena: Dream BBQ』（2025年）、Steam用のリミナルホラーゲーム『Dreamcore』（2025年）といった作品の人気により、このサウンドは若年層の「眠る前の気分」を象徴するものとして定着しつつある。現在ではweirdcoreやtraumacoreなど姉妹美学と緩やかに重なり、AI画像生成の題材にもなるなど、音楽とビジュアルの境界を超えた文化現象として拡散を続けている。</p>
