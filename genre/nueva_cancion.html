<h1>Nueva Cancion（ヌエバ・カンシオン）とは</h1>
<p>1960年代のラテンアメリカで、民衆の伝統音楽を土台として、社会的な主張を歌うために生まれた運動である。音楽的な様式より、目的と姿勢によって定義される。伴奏の中心は生ギターだが、それ以上に重要なのがアンデス地方の伝統楽器である。ア</p>
<p>1960年代のラテンアメリカで、民衆の伝統音楽を土台として、社会的な主張を歌うために生まれた運動である。音楽的な様式より、目的と姿勢によって定義される。伴奏の中心は生ギターだが、それ以上に重要なのがアンデス地方の伝統楽器である。アルマジロの甲羅などで作られた小型の10弦楽器チャランゴ、縦に吹く葦の笛ケーナ、複数の管を束ねた笛サンポーニャ、そして大型の低音太鼓ボンボが用いられ、これらの音色そのものが、先住民と農民の側に立つという政治的な表明として機能した。旋律は各地の伝統的な舞踏音楽の型に基づき、五音音階が多用される。拍子はアンデス由来の6/8拍子と3/4拍子が交錯する型や、緩やかな三拍子が中心である。編成は数人による合奏で、複数の声を重ねた合唱が歌の要となる。歌唱は技巧を誇示せず、言葉を明瞭に伝えることが最優先される。歌詞こそが核心で、詩としての完成度を保ちながら、貧困、土地の収奪、鉱山労働、帝国主義、そして革命への希望が直截に語られる。聴き手を楽しませることではなく、共に考え共に立つことを求める音楽である。</p>
<h2>成り立ち</h2><p>背景にあるのは1959年のキューバ革命以後のラテンアメリカである。アメリカ合衆国の影響下にある政権と、社会主義や民衆運動との緊張が各国で高まり、音楽家もその渦中に置かれた。中心地となったのはチリである。Violeta Parraは1950年代を通じてチリ全土を歩き回り、失われつつあった農村の歌を数千曲にわたって採集し記録した。この地道な作業が、この運動の土台となる知識を提供した。彼女は自らも作曲し、1966年に人生への感謝を歌う楽曲を残したが、翌1967年に自ら命を絶っている。彼女が首都に開いた場は、若い音楽家が集う拠点となった。この場から現れたのがVíctor Jaraである。彼は演劇の演出家でもあり、卓越した表現力で農民と労働者の歌を作った。QuilapayúnやInti-Illimaniといった集団が続き、1970年に社会主義政権が成立すると、この運動は政権を支える文化的な力となった。しかし1973年9月11日、軍事クーデターが起こる。数日後、Víctor Jaraは首都の競技場に多数の市民とともに収容され、拷問を受けて両手を砕かれ、40発以上の銃弾を撃ち込まれて殺害された。享年40である。この競技場は現在、彼の名を冠している。国外巡業中だったInti-Illimaniは帰国できず、15年にわたる亡命を余儀なくされた。軍事政権はアンデスの楽器の演奏そのものを禁じ、この音楽は地下へ潜る。同時期、アルゼンチンではMercedes Sosaが、その圧倒的な声によって大陸全体の良心と称されたが、彼女もまた1979年に国外へ逃れている。キューバではSilvio RodríguezとPablo Milanésが、革命の内側から新しい歌の運動を担った。この運動が示したのは、歌が実際に政治的な力を持ち、そのために人が殺されうるという事実である。</p>
<h2>代表曲</h2><ul><li>Gracias a la Vida (Violeta Parra)</li><li>Te Recuerdo Amanda (Victor Jara)</li><li>La Maza (Silvio Rodriguez)</li></ul>
