<h1>Nueva Cancion（ヌエバ・カンシオン）とは</h1>
<p>1960年代のラテンアメリカで、民衆の伝統音楽を土台として、社会的な主張を歌うために生まれた運動である。音楽的な様式より、目的と姿勢によって定義される。伴奏の中心は生ギターで、曲によってアンデス地方の伝統楽器が加わる。アルマジロの</p>
<p>1960年代のラテンアメリカで、民衆の伝統音楽を土台として、社会的な主張を歌うために生まれた運動である。音楽的な様式より、目的と姿勢によって定義される。伴奏の中心は生ギターで、曲によってアンデス地方の伝統楽器が加わる。アルマジロの甲羅などで作られた小型の10弦楽器チャランゴ、縦に吹く葦の笛ケーナ、複数の管を束ねた笛サンポーニャ、そして大型の低音太鼓ボンボなどで、とくにチリのアンデス系グループの特色であり、これらの音色そのものが、先住民と農民の側に立つという政治的な表明として機能した。旋律は各地の伝統的な舞踏音楽の型に基づき、5音音階が使われることも多い。拍子は、イベリア起源でラテンアメリカ各地に広がった、6/8拍子と3/4拍子が交錯する型などが見られる。編成はグループによって異なり、複数の声を重ねた合唱を要とするアンデス系のグループもある。歌唱は技巧を誇示せず、言葉を明瞭に伝えることが最優先される。歌詞こそが核心で、詩としての完成度を保ちながら、貧困、土地の収奪、鉱山労働、帝国主義、そして革命への希望が直截に語られる。聴き手を楽しませることではなく、共に考え共に立つことを求める音楽である。</p>
<h2>成り立ち</h2><p>背景にあるのは1959年のキューバ革命以後のラテンアメリカである。アメリカ合衆国の影響下にある政権と、社会主義や民衆運動との緊張が各国で高まり、音楽家もその渦中に置かれた。チリは、この運動の最も国際的に知られた中心の一つである。運動はアルゼンチン、チリ、ウルグアイ、スペインでほぼ同時に生まれた。Violeta Parraは1952年からチリ全土を歩き回り、失われつつあった農村の歌や物語、諺などを、資料により約2,000〜3,000件以上にわたって採集し記録した。この地道な作業が、この運動の土台となる知識を提供した。彼女は自らも作曲し、1964〜65年に人生への感謝を歌う楽曲を作り、1966年に発表したが、翌1967年に自ら命を絶っている。1965年にVioletaの子のÁngelとIsabelが首都に開いた集いの場(ペーニャ)は、若い音楽家が集う拠点となった。Víctor Jaraもここで歌った一人で、1957年にVioletaと出会い、楽団Cuncuménで活動して経歴を積んでいた。彼は演劇の演出家でもあり、卓越した表現力で農民と労働者の歌を作った。QuilapayúnやInti-Illimaniといった集団が続き、1970年に社会主義政権が成立すると、この運動は政権を支える文化的な力となった。しかし1973年9月11日、軍事クーデターが起こる。翌12日、Víctor Jaraは首都の競技場に多数の市民とともに収容され、拷問を受けて両手を砕かれ、16日に40発以上の銃弾を撃ち込まれて殺害された。享年40である。この競技場は現在、彼の名を冠している。国外巡業中だったInti-Illimaniは帰国できず、15年にわたる亡命を余儀なくされた。軍事政権はアンデスの楽器を社会主義運動との結び付きから弾圧し、演奏や所持が危険視される中で、この音楽は地下へ潜る(禁止されたとする資料もある)。同時期、アルゼンチンではMercedes Sosaが、その圧倒的な声によって大陸全体の良心と称されたが、彼女もまた1979年に国外へ逃れている。キューバではSilvio RodríguezとPablo Milanésが、革命の内側から新しい歌の運動を担った。この運動が示したのは、歌が実際に政治的な力を持ち、そのために人が殺されうるという事実である。</p>
<h2>代表曲</h2><ul><li>Gracias a la Vida (Violeta Parra)</li><li>El derecho de vivir en paz (Víctor Jara)</li><li>La Maza (Silvio Rodriguez)</li><li>Unicornio (Silvio Rodríguez)</li><li>Te Recuerdo Amanda (Victor Jara)</li><li>Plegaria a un labrador (Víctor Jara)</li><li>El pueblo unido jamás será vencido (Quilapayún)</li><li>Canción con todos (Mercedes Sosa)</li><li>Run Run se fue pa'l norte (Inti-Illimani)</li><li>Volver a los 17 (Violeta Parra)</li></ul>
