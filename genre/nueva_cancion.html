<h1>Nueva Cancion（ヌエバ・カンシオン）とは</h1>

<p>ヌエバ・カンシオンは、民衆の伝統音楽を土台に、社会的な主張を歌う運動だ。1950年代後半〜60年代に、チリやスペインなどで始まった。音楽のスタイルよりも、目的と姿勢によって定義される。

伴奏の中心は生ギターだ。曲によっては、アンデス地方の伝統楽器が加わる。アルマジロの甲羅などで作られた小型の10弦楽器チャランゴ、竹や葦(cane)、木などで作られた縦笛ケーナ、複数の管を束ねた笛サンポーニャ、そして大型の低音太鼓ボンボなどだ。これらは、とくにチリのアンデス系グループの特色である。こうした楽器の音色そのものが、社会の隅に追いやられた人々のしるしとして、意識的に用いられた。

旋律は、各地の伝統的な踊りの音楽の型に基づく。5音音階（五つの音だけでできた音階）が使われることも多い。

拍子には、6/8拍子と3/4拍子が入り混じる型などが見られる。この型はスペインやラテンアメリカの音楽に広く見られ、16世紀にはスペインで定着していた。

編成はグループによって違う。複数の声を重ねた合唱を要にするアンデス系のグループもある。

核心は歌詞だ。詩としての完成度を保ちながら、農村の暮らしに根ざした比喩やイメージ、十行詩(デシマ)などの伝統的な詩の形に富む。露骨に政治的な例外もある。しかし多くは、社会的な意識や責任を促す書き方をとる。</p>
<h2>成り立ち</h2><p>1959年、キューバで革命が起きた。この革命は運動の起点ではないが、その後の政治的な緊張や広がりの背景になった。アメリカ合衆国の影響下にある政権と、社会主義や民衆運動との緊張が各国で高まり、音楽家もその真っただ中に置かれた。

運動は、1950年代後半〜60年代にチリやスペインなどで始まった。そして1960年代に、アルゼンチン、チリ、ウルグアイ、スペインで、ほぼ同時に表に現れた。チリは、この運動の中心として、国際的に最もよく知られた場所の一つである。

チリでは、Violeta Parraが1952年から全土を歩き回った。失われつつあった農村の歌や物語、諺などを、約3,000(3,000超とされる)にわたって集め、記録した。この地道な作業が、運動の土台となる知識をもたらした。彼女は自分でも曲を作った。1966年には(諸説あり、ラパス滞在中に)人生への感謝を歌う曲を作り、同じ年のアルバムに収めた。しかし翌1967年、自ら命を絶っている。

1965年、Violetaの子のÁngelとIsabelが、首都に集いの場(ペーニャ)を開いた。ここは若い音楽家が集まる拠点になった。Víctor Jaraも、ここで歌った一人だ。彼は1957年にVioletaと出会い、楽団Cuncuménで活動して経験を積んでいた。演劇の演出家でもあり、優れた表現力で農民と労働者の歌を作った。

その後、QuilapayúnやInti-Illimaniといった集団が続いた。1970年に社会主義政権が生まれると、この運動は政権を支える文化の力になった。

しかし1973年9月11日、軍事クーデター（軍による政権の奪取）が起こる。翌12日、Víctor Jaraは首都の競技場に、多くの市民とともに閉じ込められた。拷問を受け、銃床などで両手を骨折させられ、殺害された。16日に遺体が見つかり、死亡は15〜16日頃とされる(44発の銃創)。40歳だった。この競技場には今、彼の名前がつけられている。

国外を巡業していたInti-Illimaniは、帰国できなかった。15年にわたる亡命（国を追われて外国で暮らすこと）を強いられた。軍事政権は、アンデスの楽器を社会主義運動と結び付けて弾圧した。演奏や所持が危険とされる中で、この音楽は地下へ潜る(禁止されたとする資料もある)。

同じ頃、アルゼンチンではMercedes Sosaが、その圧倒的な声で大陸全体の良心と呼ばれた。その彼女もまた、1979年に国外へ逃れている。一方キューバでは、Silvio RodríguezとPablo Milanésが、革命の内側から新しい歌の運動を担った。

この運動が示したのは、歌が本当に政治的な力を持ち、そのために人が殺されることさえあるという事実である。</p>
<h2>代表曲</h2><ul><li>Gracias a la Vida (Violeta Parra)</li><li>El derecho de vivir en paz (Víctor Jara)</li><li>La Maza (Silvio Rodriguez)</li><li>Unicornio (Silvio Rodríguez)</li><li>Te Recuerdo Amanda (Victor Jara)</li><li>Plegaria a un labrador (Víctor Jara)</li><li>El pueblo unido jamás será vencido (Quilapayún)</li><li>Canción con todos (Mercedes Sosa)</li><li>Run Run se fue pa'l norte (Inti-Illimani)</li><li>Volver a los 17 (Violeta Parra)</li></ul>
