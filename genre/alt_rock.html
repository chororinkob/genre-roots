<h1>Alternative Rock（オルタナティブロック）とは</h1>
<p>1970年代末から1980年代初頭にかけて、商業的な主流のロックへの対抗として形成された、幅広い音楽の総称。単一の音の特徴で定義されるジャンルではなく、態度と流通経路によってひとくくりにされる枠組みである点が最大の特徴。ジャンル全</p>
<p>1970年代末から1980年代初頭にかけて、商業的な主流のロックへの対抗として形成された、幅広い音楽の総称。単一の音の特徴で定義されるジャンルではなく、態度と流通経路によってひとくくりにされる枠組みである点が最大の特徴。ジャンル全体に定まった音楽スタイルはないが、ギターが力強いパワーコードやファズ（荒い歪み）、フィードバック（音の唸り）を鳴らす例が多く、一部のバンドは、コーラス（音に厚みを出す）、ディレイ（音を遅らせて繰り返す）、リヴァーブ（残響）といった空間系のエフェクター（音を加工する機器）を多用する。歪みは轟音から歪みのないクリーンまで曲中で大きく振れ、静かな部分と激しい部分を対比させる構成、いわゆる静と動の落差が定番の手法となった。歌唱は美声を目指さず、しゃがれた声、平坦な語り、あるいは叫びが表現として選ばれる。歌詞は孤立感（疎外感）、皮肉、自意識、消費社会への違和感といった個人的な主題とともに、薬物、うつ、自殺、環境問題といった社会的関心事も他のロックより多く扱う傾向がある。演奏の場は大会場ではなく小規模なクラブ、流通は独立系レーベルと大学ラジオが担い、この草の根（現場から自然に広がる）の構造そのものがジャンルの定義に含まれていた。</p>
<h2>成り立ち</h2><p>1970年代末から1980年代初頭にかけて、米国とイギリスで、パンクの後の世代が、独立系レーベルと大学ラジオを軸にした独自の経路を築いたところから始まる。「オルタナティヴ」という呼び名が広まったのは、1980年代半ばとされる。ただしI.R.S.のように、大手の資本や流通と結びついた例も多い。米国側の中心となったのは大学ラジオ局のネットワークで、商業ラジオが流さない音楽を学生が選曲することにより、全国的な地下の情報網が形成された。象徴的なバンドがジョージア州アセンズのR.E.M.で、1982年のEP（短めの作品集）『Chronic Town』を皮切りに、1983年のMurmurから1987年のDocument まで、A&amp;M傘下で設立されたレーベルI.R.S. Recordsから作品を発表し、大学ラジオの強い支持を核に全国的な人気を獲得した（主流のロック系のラジオでもヒットを出した）。同時期、Hüsker Dü、The Replacements、Sonic Youth、Pixiesらが、それぞれ異なる方向でパンクの単純さを超える音を作った。とりわけボストンのPixiesが1988年のSurfer Rosaで示した、静かな部分と爆発的な部分を交互に置く構成は、後の世代に決定的な影響を与えた。イギリス側では、The Smithsが1980年代半ばにJohnny MarrのギターとMorrisseyの文学的な歌詞で独自の位置を築き、The Jesus and Mary Chain（1983年結成）が続いた。New Order（1980年結成）はそれより前から活動していた。転機は1991年で、ワシントン州アバディーン出身のNirvanaがアルバムNevermindを発表し、Michael JacksonのDangerousを、翌1992年1月に全米チャートの首位から引きずり下ろすという事件が起きた。この商業的成功の後、大手レコード会社が高額の契約金で同種のバンドの獲得に殺到し、主流化が加速した。この成功によって、「反主流」という意味と「市場の区分」という意味の矛盾が露わになったと論じられる。1994年のKurt Cobainの自死は、この矛盾の象徴として語られることがある。この語は音の様式ではなく市場の区分として使われるようになった。ラジオの放送形式（フォーマット）としては、1988年にBillboardが「Alternative Songs」(当時の名はModern Rock Tracks)のチャートを作った時点で固まっており、1991年以降のグランジの成功で、多くの米国ラジオ局がこの放送形式に切り替えた。</p>
