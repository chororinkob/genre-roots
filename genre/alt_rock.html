<h1>Alternative Rock（オルタナティブロック）とは</h1>
<p>オルタナティヴ・ロックは、幅広い音楽の総称である。1970年代末〜1980年代初頭にインディー・アンダーグラウンドから形成され、呼称が定着したのは1980年代半ばである。単一の音の特徴で定義されるジャンルではなく、態度と流通経路に</p>
<p>オルタナティヴ・ロックは、幅広い音楽の総称である。1970年代末〜1980年代初頭にインディー・アンダーグラウンドから形成され、呼称が定着したのは1980年代半ばである。単一の音の特徴で定義されるジャンルではなく、態度と流通経路によってひとくくりにされる枠組みである点が最大の特徴。

それでも共通する傾向はある。一部のバンド（例：ジャングル・ポップ系）には、空間系エフェクトを多用する例がある。歪みは轟音から歪みのないクリーンまで、曲中で大きく振れる。静かな部分と激しい部分を対比させる構成、いわゆる静と動の落差が、定番の手法となった。

和声（コードの響き）は、主流のロックが避ける不協和や、長調と短調が判然としない曖昧な和音を好む。歌の旋律も、明快なフック（耳に残る一節）を意図的に外すことがある。

ドラムは重く直線的で、装飾を排する。

歌唱は美声を目指さない。しゃがれた声、平坦な語り、あるいは叫びが、表現として選ばれる。

歌詞は、疎外感や皮肉などの個人的主題とともに、薬物、うつ、自殺、環境問題といった社会的関心事も扱う傾向がある。

演奏の場は大会場ではなく、小規模なクラブである。流通は独立系レーベルと大学ラジオが担った。この草の根（現場から自然に広がる）の構造そのものが、ジャンルの定義に含まれていた。</p>
<h2>成り立ち</h2><p>1980年代初頭の米国とイギリスでは、独立系レーベルと大学ラジオを軸にした経路が中心だった。ただしI.R.S.のように、大手資本・流通と結びついた例も多い。

米国側の中心となったのは、大学ラジオ局のネットワークだ。商業ラジオが流さない音楽を学生が選曲することにより、全国的な地下の情報網が形成された。この流れを代表するバンドが、ジョージア州アセンズのR.E.M.である。1982年のEP『Chronic Town』以来、A&amp;M傘下で設立されたレーベルI.R.S. Recordsから作品を発表した。大学ラジオの強い支持を核に、全国的な人気を獲得した（主流のロック系のラジオでもヒットを出した）。

同時期には、Hüsker Dü、The Replacements、Sonic Youth、Pixiesらが、それぞれ異なる方向で、パンクの単純さを超える音を作った。とりわけ、ボストンのPixiesが1988年のSurfer Rosaで示した構成は、後の世代に大きな影響を与えたとされる。静かな部分と爆発的な部分を交互に置く構成である。

イギリス側では、The Smithsが1980年代半ばに、Johnny Marrのギターと、Morrisseyの文学的な歌詞で、独自の位置を築いた。The Jesus and Mary Chain（1983年結成）が続いた。New Order（1980年結成）は、それより前から活動していた。

転機は1991年である。ワシントン州アバディーン出身のNirvanaが、アルバムNevermindを発表した。そして翌1992年1月、Michael JacksonのDangerousを、全米チャートの首位から引きずり下ろすという事件が起きた。Nevermindの成功後、メジャーがオルタナティヴ系バンドの獲得に殺到し、主流化が加速した。

成功によって、反主流という意味と市場区分という意味の矛盾が露わになったと論じられる。1994年のKurt Cobainの自死は、この矛盾の代名詞として語られる。この語は、音のスタイルではなく、市場の区分として使われるようになった。

ラジオの放送形式（フォーマット）としては、1988年にBillboardが「Alternative Songs」(当時の名はModern Rock Tracks)のチャートを作った時点で固まっていた。1991年以降のグランジの成功で、多くの米国ラジオ局が、この放送形式に切り替えた。</p>
