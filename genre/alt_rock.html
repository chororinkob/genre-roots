<h1>Alternative Rock（オルタナティブロック）とは</h1>
<p>1980年代に商業的な主流のロックへの対抗として形成された、幅広い音楽の総称。単一の音の特徴で定義されるジャンルではなく、態度と流通経路によって括られる枠組みである点が最大の特徴。それでも共通する傾向はあり、ギターは技巧的なソロよ</p>
<p>1980年代に商業的な主流のロックへの対抗として形成された、幅広い音楽の総称。単一の音の特徴で定義されるジャンルではなく、態度と流通経路によって括られる枠組みである点が最大の特徴。それでも共通する傾向はあり、ギターは技巧的なソロより音色と質感を重視し、コーラス、ディレイ、リヴァーブといった空間系のエフェクターを多用する。歪みは轟音から歪みのないクリーンまで曲中で大きく振れ、静かな部分と激しい部分を対比させる構成、いわゆる静と動の落差が定番の手法となった。和声は主流のロックが避ける不協和や、長調と短調が判然としない曖昧な和音を好み、歌の旋律も明快なフックを意図的に外すことがある。ドラムは重く直線的で、装飾を排する。歌唱は美声を目指さず、しゃがれた声、平坦な語り、あるいは叫びが表現として選ばれる。歌詞は疎外感、皮肉、自意識、消費社会への違和感といった主題を扱い、直接的な社会批判よりも個人の内面の屈折を描く。演奏の場は大会場ではなく小規模なクラブ、流通は独立系レーベルと大学ラジオが担い、この草の根の構造そのものがジャンルの定義に含まれていた。</p>
<h2>成り立ち</h2><p>1980年代初頭の米国とイギリスで、パンクの後の世代が、大手レコード会社の流通に頼らない独自の経路を築いたところから始まる。米国側の中心となったのは大学ラジオ局のネットワークで、商業ラジオが流さない音楽を学生が選曲することにより、全国的な地下の情報網が形成された。象徴的なバンドがジョージア州アセンズのR.E.M.で、1983年のMurmurから1987年のDocument まで、独立系レーベルI.R.S. Recordsから作品を発表し、大学ラジオの支持だけで全国的な人気を獲得した。同時期、Hüsker Dü、The Replacements、Sonic Youth、Pixiesらが、それぞれ異なる方向でパンクの単純さを超える音を作った。とりわけボストンのPixiesが1988年のSurfer Rosaで示した、静かな部分と爆発的な部分を交互に置く構成は、後の世代に決定的な影響を与えた。イギリス側では、The Smithsが1980年代半ばにJohnny MarrのギターとMorrisseyの文学的な歌詞で独自の位置を築き、The Jesus and Mary Chain、New Orderらが続いた。転機は1991年で、シアトルのNirvanaがアルバムNevermindを発表し、Michael JacksonのDangerousを全米チャートの首位から引きずり下ろすという事件が起きた。この商業的成功により、それまで地下にあった音楽が一夜にして主流となり、大手レコード会社が同種のバンドを大量に契約する事態を招いた。皮肉なことに、この成功はオルタナティヴという概念そのものを無意味にした。何に対する代替なのかが分からなくなったからである。1994年のKurt Cobainの自死は、この矛盾の象徴として語られる。以後、この語は音の様式ではなく市場の区分として使われるようになり、現在ではラジオのフォーマット名として制度化されている。</p>
<h2>代表曲</h2><ul><li>Smells Like Teen Spirit（Nirvana）</li><li>Losing My Religion（R.E.M.）</li><li>Creep（Radiohead）</li><li>Just Like Heaven（The Cure）</li><li>Where Is My Mind?（Pixies）</li></ul>
