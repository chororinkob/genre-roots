<h1>Hyperpop（ハイパーポップ）とは</h1>
<p>ハイパーポップは、ポップスの記号を極端に誇張して壊しながら、それでもポップスとして成り立たせる音楽だ。2010年代初頭に現れ、2019年8月にSpotifyが公式プレイリストを開始し、2020年にかけて名称が定着した。音の作りには</p>
<p>ハイパーポップは、ポップスの記号を極端に誇張して壊しながら、それでもポップスとして成り立たせる音楽だ。2010年代初頭に現れ、2019年8月にSpotifyが公式プレイリストを開始し、2020年にかけて名称が定着した。音の作りには、いくつもの過剰がある。

まず声だ。ピッチ補正（音程を機械的に直す処理）を極限まで強くかける。さらにピッチを引き上げ、フォルマント（声の質を決める音の成分）も操作して、声の質感を変える。加工した声が、同時に複数重なる。

シンセは、輪郭の硬い金属質な音色や、玩具のようなベル音が選ばれる。主旋律を担う音（リード）は、極端に飽和（音を潰して歪ませること）させる。音圧（音の大きさや迫力）は限界まで上げられ、意図的に歪む。

低音は、808（ドラムマシンTR-808）のベースが極端に強調される。キックが割れることも、効果として許容される。テンポは、制作ガイドによっては140〜200BPMとされる。ただし、80〜100や130〜180とする資料もあり、定義は定まっていない。短い曲が目立ち、100 gecsがその例だ。

構成は定型のポップスに従う。そのうえで、途中で突然テンポや調が変わり、まったく別の曲に変貌する展開を持つ曲もある。和音には不協和な音が混ぜられ、甘さと不快さが同居する。

歌詞は、PC Music系ではポスト・アイロニーで消費や恋愛を扱う。後続世代では、感情の率直さが強くなる。皮肉と誠実さの区別は、意図的に曖昧にされる。性別の枠を超えた自己表現が、主題として深く関わっている。主要な担い手には性的少数者が多く、LGBTQの文化・美学と強く結びつけて語られる。</p>
<h2>成り立ち</h2><p>2013年、ロンドンでPC Musicが設立された。ハイパーポップの起源は、この活動にさかのぼるとされることが多い。ただし、この語はSoundCloudのナイトコア・シーンで生まれたという見方もある。制作者A. G. Cookが設立したレーベルPC Musicは、ポップスの表面的な記号を極端に誇張した作品を、次々に発表した。

Hannah Diamond、GFOTY、Danny L Harleといった作り手は、実在するのか架空なのか曖昧な人物像を演じた。批評家からは、資本主義とポップスへの皮肉なのか、それとも本気なのか、判別できないと評された。

並行して、イギリス出身のSOPHIEが登場する。2013年の『Bipp』などで、ゴム質のベースとピッチを上げたボーカル、濡れて滑るような音を用いた、独自の音を提示した。彼女は2017年にトランスジェンダーであることを公表した。その音づくりは、身体と性の可塑性（形が自由に変わりうること）そのものの表現として受け止められた。

2016年、Charli XCXがSOPHIEと組み、実験的なポップを提示した『Vroom Vroom』を発表する。当時は評価が割れたが、後にハイパーポップの先駆作と見なされた。2019年8月にはSpotifyが公式プレイリストを開始し、2020年にかけて名称が定着した。

この頃、アメリカでは100 gecsが注目を集める。Dylan BradyとLaura Lesの2人組は、ネット上でファイルをやりとりして曲を作った。2019年の『1000 gecs』では、うるさく混沌とした音とスカと電子音を無節操に混ぜた作品を発表する。Laura Lesもトランスジェンダーであることを公表しており、この音楽と性的少数者の結びつきを、さらに明確にした。

2021年一月、SOPHIEはアテネで、満月を見ようとして高所から誤って転落し、34歳で亡くなった。この訃報は、シーン全体に深い衝撃を与えた。

一方で、名称自体は当事者の多くに嫌われており、括り方が乱暴だという批判が繰り返されている。</p>
