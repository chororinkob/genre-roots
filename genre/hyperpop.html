<h1>Hyperpop（ハイパーポップ）とは</h1>
<p>2010年代後半に現れた、ポップスの記号を極端に誇張して壊しながら成立させる音楽。音の作りにいくつもの過剰がある。声はピッチ補正を極限まで強くかけ、フォルマントを操作して人間離れした高さに引き上げられ、複数の加工した声が同時に重な</p>
<p>2010年代後半に現れた、ポップスの記号を極端に誇張して壊しながら成立させる音楽。音の作りにいくつもの過剰がある。声はピッチ補正を極限まで強くかけ、フォルマントを操作して人間離れした高さに引き上げられ、複数の加工した声が同時に重なる。シンセは輪郭の硬い金属質な音色や、玩具のようなベル音、極端に飽和させたリードが選ばれ、音圧は限界まで上げられて意図的に歪む。低音は八〇八のベースが極端に強調され、キックが割れることも効果として許容される。テンポは毎分130から160拍程度が多く、曲は二分前後と極端に短い。構成は定型のポップスに従いながら、途中で突然テンポや調が変わり、まったく別の曲に変貌する展開が多用される。和音は明るい長調が基本だが、そこに不協和な音が混ぜられ、甘さと不快さが同居する。歌詞は恋愛や消費社会の記号を過剰に反復し、皮肉と誠実さの区別が意図的に曖昧にされる。インターネット上の匿名性と、性別の枠を超えた自己表現が主題として深く関わっており、制作者と聴き手の多くが性的少数者である点も、この音楽の成り立ちに不可分である。</p>
<h2>成り立ち</h2><p>直接の起源は2013年前後のロンドンにある。制作者A. G. Cookが設立したレーベルPC Musicが、ポップスの表面的な記号を極端に誇張した作品を次々に発表した。Hannah Diamond、GFOTY、Danny L Harleといった作り手が、実在するのか架空なのか曖昧な人物像を演じ、批評家からは資本主義とポップスへの皮肉なのか、それとも本気なのか判別できないと評された。並行して、ロンドンのSOPHIEが、2013年の『Bipp』などで、金属や液体を思わせる合成音を用いた独自の音を提示する。彼女はトランスジェンダーであることを2017年に公表し、その音づくりが身体と性の可塑性そのものの表現として受け止められた。2016年、Charli XCXがPC Musicの面々と組んだ『Vroom Vroom』を発表し、主流のポップスの側からこの音を採用したことで、実験と商業の境界が消えた。名称としてのハイパーポップが広まったのは2019年で、Spotifyが同名の公式プレイリストを作ったことが決定的だった。この頃、アメリカでは100 gecsが登場する。Dylan BradyとLaura Lesの二人組は、ネット上でファイルをやりとりして曲を作り、2019年の『1000 gecs』で、ノイズとスカと電子音を無節操に混ぜた作品を発表した。Laura Lesもトランスジェンダーであることを公表しており、この音楽と性的少数者の結びつきをさらに明確にした。2021年一月、SOPHIEはアテネで、満月を見ようとしてバルコニーから転落し34歳で亡くなった。この訃報はシーン全体に深い衝撃を与えた。名称自体は当事者の多くに嫌われており、括り方が乱暴だという批判が繰り返されている。</p>
<h2>代表曲</h2><ul><li>Money Machine (100 gecs)</li><li>Vroom Vroom (Charli XCX)</li><li>Immaterial (SOPHIE)</li></ul>
