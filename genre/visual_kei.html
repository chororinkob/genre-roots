<h1>Visual Keiとは</h1>
<p>音楽と視覚的な自己演出を不可分に結び付けた日本のロックの様式。名称が示す通り、化粧、髪型、衣装、そして性別の境界を意図的に曖昧にする外見が、音楽と同等の表現要素として扱われる。音楽的には単一の様式に収まらず、ハードロック、ヘヴィメ</p>
<p>音楽と視覚的な自己演出を不可分に結び付けた日本のロックの様式。名称が示す通り、化粧、髪型、衣装、そして性別の境界を意図的に曖昧にする外見が、音楽と同等の表現要素として扱われる。音楽的には単一の様式に収まらず、ハードロック、ヘヴィメタル、パンク、ゴシック、そして歌謡曲までが混在する。共通する傾向としては、まず短調の劇的な旋律があり、ハーモニック・マイナー由来の増二度や、クラシック音楽風の分散和音が多用される。ギターは二本編成が基本で、三度や六度で重ねた二重奏の旋律、そして速弾きのソロが聴かせどころとなる。曲構成は複雑で、テンポと拍子の変化、静かな導入部と激しい展開の対比、そして曲中の転調が頻繁に用いられる。歌唱は劇的で、伸びやかな高音、囁き、絶叫を一曲の中で使い分ける。歌詞は死、狂気、耽美、退廃、そして社会からの疎外を扱い、しばしば漢字の当て字や造語が用いられる。ライブは演劇的な演出を伴い、聴衆も同様の装いをして参加するため、演者と観客の境界が曖昧になる点も特徴である。</p>
<h2>成り立ち</h2><p>1980年代半ばの日本で形成された。直接の起点は1980年代前半に活動を始めたXで、リーダーのYOSHIKIとボーカルのTOSHIを中心に、極端に速いメタルと劇的なバラードを組み合わせ、逆立てた髪と派手な化粧という外見を打ち出した。1989年のアルバムBLUE BLOODが商業的な成功を収め、彼らが掲げたサイケデリック・バイオレンス・クライム・オブ・ビジュアル・ショックという標語から、ビジュアル系という名称が生まれたとされる。背景には、1970年代のグラム・ロック、とりわけDavid BowieやT. Rexの視覚的な自己演出、そしてKISSやAlice Cooperの舞台演出、さらに日本の歌舞伎や少女漫画の美意識がある。1990年代前半、LUNA SEA、GLAY、L'Arc〜en〜Cielが続き、いずれも当初は化粧を伴う外見で登場した。この時期、インディーズ・レーベルと小規模なライブハウスが中心的な流通の場となり、東京の目黒鹿鳴館や渋谷のライブハウスが拠点となった。1990年代半ばには、SHAZNA、MALICE MIZERらによる第二の波が起き、より耽美的で演劇的な方向が強まった。転機は1998年で、hideが死去し、多くのファンが動揺した。翌年にはXが解散している。2000年代には、Dir en grey、the GazettE、ナイトメアが登場し、より攻撃的な音楽性へ移行した。この時期から海外での人気が高まり、ヨーロッパと南米で公演が行われるようになった。現在も独自の流通経路と熱心な共同体を保ちながら継続しており、日本のロックの中でも国外に最も強く輸出された系統の一つである。</p>
