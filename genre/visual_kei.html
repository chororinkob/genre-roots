<h1>Visual Keiとは</h1>
<p>音楽と視覚的な自己演出を不可分に結び付けた日本のロックの様式。名称が示す通り、化粧、髪型、衣装、そして性別の境界を意図的に曖昧にする外見が、音楽と同等の表現要素として扱われる。音楽的には単一の様式に収まらず、ハードロック、ヘヴィメ</p>
<p>音楽と視覚的な自己演出を不可分に結び付けた日本のロックの様式。名称が示す通り、化粧、髪型、衣装、そして性別の境界を意図的に曖昧にする外見が、音楽と同等の表現要素として扱われる。音楽的には単一の様式に収まらず、ハードロック、ヘヴィメタル、パンク、ゴシック、そして歌謡曲までが混在する。一部のバンドに見られる傾向としては、まず短調の劇的な旋律があり、ハーモニック・マイナー（和声的短音階）由来の増2度（独特の哀愁を帯びた音の跳躍）や、クラシック音楽風の分散和音（和音を一音ずつ順に弾く奏法）が多用される。ギターは2本編成のバンドも多く、3度や6度（離れた音）で重ねた二重奏の旋律、そして速弾きのソロが聴かせどころとなる。曲構成が複雑なバンドも多く、テンポと拍子の変化、静かな導入部と激しい展開の対比、そして曲中の転調（調を変えること）が頻繁に用いられる。歌唱が劇的で、伸びやかな高音、囁き、絶叫を一曲の中で使い分ける例も多い。歌詞が死、狂気、耽美、退廃、そして社会からの疎外を扱う例も多く、しばしば漢字の当て字や造語が用いられる。ライブは演劇的な演出を伴い、聴衆も同様の装いをして参加するため、演者と観客の境界が曖昧になる点も特徴である。</p>
<h2>成り立ち</h2><p>1980年代半ばの日本で形成された。先駆者として、1980年代前半から半ばにかけて活動を始めたXのほか、Dead End、Buck-Tick、D'erlanger、Colorなどが並べられる。Xは、リーダーのYOSHIKIとボーカルのToshl（当時の表記はTOSHI）を中心に、極端に速いメタルと劇的なバラードを組み合わせ、逆立てた髪と派手な化粧という外見を打ち出した。1989年のアルバムBLUE BLOODが商業的な成功を収め、彼らが掲げたサイケデリック・バイオレンス・クライム・オブ・ビジュアル・ショックという標語から、ビジュアル系という名称が生まれたとされる（由来はスローガン「Psychedelic Violence Crime of Visual Shock」とされ、SHOXX創刊編集長の星子誠一氏が命名者とされるが、本人は、hideが言い出した「ヴィジュアルショック」を借りてSHOXXのサブタイトルにしたと説明している。ただし説明は媒体によって異なり、BLUE BLOODのキャッチコピーから取ったとも語っている）。グラム・ロックなど欧米のロックの影響が指摘される。歌舞伎や少女漫画との類似も論じられるが、直接の影響かは諸説ある。1992年にLUNA SEAがメジャーデビューし、1994年にはGLAYとL'Arc〜en〜Cielが続いた。GLAYはデビュー時、いわゆるビジュアル系のイメージで、L'Arc〜en〜Cielはビジュアル系として出発したが、メジャーデビュー後はそれとの関わりを否定している。この時期、インディーズ・レーベルと小規模なライブハウスが中心的な流通の場となり、東京の目黒鹿鳴館が拠点の一つとなった。1990年代半ばから後半にかけて、SHAZNA、MALICE MIZERらによる、いわば第二の波が起き（1997年前後にブーム。世代の数え方は資料により異なる）、より耽美的で演劇的な方向が強まった。転機は1997年から1998年にかけてで、1997年末にX（X JAPAN）が解散し、翌1998年5月にhideが死去して、多くのファンが動揺した。2000年代には、the GazettE（2002年結成）、ナイトメア（2000年結成）が登場し、この世代の音楽性はメタルからポップまで幅広く、一部のバンドは攻撃的な方向へ進んだ。Dir en greyは1997年2月結成で、1998年にはシングル「-I'll-」がオリコン7位に入った。この時期から海外での人気が高まり、ヨーロッパと南米で公演が行われるようになった。現在も独自の流通経路と熱心な共同体を保ちながら継続しており、日本の音楽市場での経済的な比重は大きくないが、国際的に成功した最初の日本のオルタナティブ音楽とされ、現在もアジア圏では人気が保たれている一方、ヨーロッパ圏では下落したとされる。</p>
