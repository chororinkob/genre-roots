<h1>Gypsy Jazz（ジプシージャズ）とは</h1>
<p>アコースティックギターの目にも止まらぬ速弾きと、ロマ(かつて「ジプシー」と呼ばれた移動民族)の音楽が持つ哀愁のあるメロディーが融合した、戦前のパリのカフェが似合うスタイル。編成は、ソロを弾くリードギター、コードを刻むリズムギター2</p>
<p>アコースティックギターの目にも止まらぬ速弾きと、ロマ(かつて「ジプシー」と呼ばれた移動民族)の音楽が持つ哀愁のあるメロディーが融合した、戦前のパリのカフェが似合うスタイル。編成は、ソロを弾くリードギター、コードを刻むリズムギター2本、コントラバス、そしてヴァイオリンという構成が基本で、ドラムも電気楽器も一切使わない。リズムの要となるのが「ラ・ポンプ(la pompe、フランス語で「ポンプ」の意)」と呼ばれる独特のカッティング奏法で、リズムギターが1拍ごとに弦を短く鋭く刻み続けることで、ドラムがなくても強烈な推進力が生まれる。テンポは速く(BPM 160〜250)、その上をリードギターが半音階を織り交ぜた装飾的なフレーズで駆け抜けていく。長調の曲でも短調の響きが顔を出す独特の音使いが、華やかさの中に一抹の寂しさを漂わせる。使用される楽器も特徴的で、フランスのSelmer社が製造したマカフェリギターという、大きな音量が出るよう設計された独特の形状のアコースティックギターが、このジャンルの音そのものを規定している。</p>
<h2>成り立ち</h2><p>1930年代のフランス・パリで、ベルギー生まれのロマのギタリストDjango Reinhardtによって作られた。Django Reinhardtは1910年にベルギーのリベルシで生まれ、パリ郊外のロマの野営地で育ち、バンジョーとギターでミュゼットの伴奏を弾いて生計を立てていた。1928年11月、彼が暮らしていた幌馬車が火災に遭い、左手の薬指と小指に重度の火傷を負う。医師は切断を勧めたが彼は拒み、自由に動く2本の指だけで運指を組み立て直すという、通常なら不可能な再学習をやり遂げた。この身体的な制約こそが、独特の和音の押さえ方と、2本指による猛烈な速度の単音フレーズを生むことになる。転機は、彼がLouis ArmstrongやDuke Ellingtonの録音に触れたことだった。1934年、ヴァイオリニストのStéphane Grappelliとともに、パリのフランス・ホット・クラブの後援でQuintette du Hot Club de Franceを結成する。ドラムも管楽器も置かず、ソロギター、リズムギター2本、ヴァイオリン、コントラバスという編成は当時のジャズとして異例だった。「Minor Swing」「Nuages」「Djangology」といった録音は、アメリカのジャズを模倣するのではなく、ロマの音楽とフランスのミュゼット、そしてスウィングを一体化させた最初の非アメリカ的ジャズとして評価されている。第二次世界大戦中、ナチス・ドイツはロマを迫害の対象とし、ヨーロッパ全体で数十万人が殺害されたが、Django Reinhardtは名声とドイツ人将校の個人的な庇護によって生き延びた。彼は占領下のパリで演奏を続け、「Nuages」(1940)は当時の人々にとって静かな抵抗の象徴となる。戦後はアメリカへ渡ってDuke Ellington楽団と共演し、電気ギターとビバップにも接近したが、1953年に脳出血のため43歳で急死した。彼の死後、この様式は一度忘れられかけたものの、フランスとオランダのロマの家系の中で師弟関係として受け継がれ、Boulou Ferré、Biréli Lagrène、Stochelo Rosenbergといった奏者が現れる。1990年代以降は世界的な再評価が起き、フランスのサモワで開かれるDjango Reinhardt Festivalをはじめ、各地でフェスティバルと講習会が開かれている。</p>
<h2>代表曲</h2><ul><li>Minor Swing (Django Reinhardt)</li><li>Nuages (Django Reinhardt)</li><li>Djangology (Django Reinhardt)</li><li>Swing 42 (Django Reinhardt)</li><li>Douce Ambiance (Django Reinhardt)</li></ul>
