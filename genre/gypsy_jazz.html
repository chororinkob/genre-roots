<h1>Gypsy Jazz（ジプシージャズ）とは</h1>
<p>ジプシー・ジャズは、アコースティックギターの目にも止まらぬ速弾きと、ロマ(かつて「ジプシー」と呼ばれた、伝統的に移動生活のイメージで語られてきたが、現在は多くが定住している民族集団)の音楽が持つ哀愁のあるメロディーが融合した、戦前</p>
<p>ジプシー・ジャズは、アコースティックギターの目にも止まらぬ速弾きと、ロマ(かつて「ジプシー」と呼ばれた、伝統的に移動生活のイメージで語られてきたが、現在は多くが定住している民族集団)の音楽が持つ哀愁のあるメロディーが融合した、戦前のパリのカフェが似合うスタイルだ。

編成は、ソロを弾くリードギター、コードを刻むリズムギター2本、コントラバス（大型の弦楽器）、そしてヴァイオリンという構成が基本である。初期(1930年代)の編成はアコースティックで、ドラムを使わない。使われる楽器も特徴的で、フランスのSelmer社製ギター（マカフェリ設計のD字穴と、後継の楕円穴モデル）が、このジャンルの標準的な楽器として定着した。

リードギターは、半音階（半音ずつ上下する音の並び）を織り交ぜた装飾的なフレーズで駆け抜けていく。長調の曲でも短調の響きが顔を出す独特の音使いが、華やかさの中に一抹の寂しさを漂わせる。

リズムの要となるのが「ラ・ポンプ(la pompe、フランス語で「ポンプ」の意)」と呼ばれる独特のカッティング奏法だ。リズムギターが4分音符で刻み、2・4拍で音を切る（クリップする）ことで、ドラムがなくても強烈な推進力が生まれる。速いスウィング曲が代表的だが、テンポは曲や演奏者によって幅が大きい。</p>
<h2>成り立ち</h2><p>1930年代のフランス・パリで、ベルギー生まれのロマのギタリストDjango ReinhardtがGrappelliとともに率いたQuintette du Hot Club de Franceに触発されて成立したスタイルである。

Django Reinhardtは1910年にベルギーのリベルシで生まれ、パリ郊外のロマの野営地で育った。バンジョーとギターでミュゼット（フランスのアコーディオン音楽）の伴奏を弾き、生計を立てていた。1928年11月、彼が暮らしていた幌馬車が火災に遭い、左手の薬指と小指に重度の火傷を負う。医師は脚の切断を勧めたが、彼は拒んだ。そして左手は主に人差し指と中指で弾き、負傷した2本は和音に使うという運指（指の使い方）を組み立て直した。この身体的な制約が、独特の和音の押さえ方と、2本指による猛烈な速度の単音フレーズにつながったと言われる。

転機は、彼がLouis ArmstrongやDuke Ellingtonの録音に触れたことだった。1934年、ヴァイオリニストのStéphane Grappelliとともに、パリのフランス・ホット・クラブの後援でQuintette du Hot Club de Franceを結成する。ドラムも管楽器も置かず、ソロギター、リズムギター2本、ヴァイオリン、コントラバスという編成は、当時のジャズとして異例だった。「Minor Swing」「Nuages」「Djangology」といった録音は、アメリカのジャズを模倣したものではない。ロマの音楽とフランスのミュゼット、そしてスウィングを一体化させた、欧州で最初期に現れた重要な独自ジャズの一つとされる。

第二次世界大戦中、ナチス・ドイツはロマを迫害の対象とし、ヨーロッパ全体で数十万人が殺害された。しかしDjango Reinhardtは、脱出に失敗した際、ドイツ空軍将校Schulz-Köhnに帰還を許されたとされる。彼は占領下のパリで演奏を続け、「Nuages」(1940)は当時の人々にとって静かな抵抗のしるしになったとされる。

戦後はアメリカへ渡ってDuke Ellington楽団と共演し、電気ギターとビバップにも接近した。しかし1953年に脳出血のため43歳で急死する。

彼の死後、このスタイルは一度忘れられかけた。それでも、フランス・オランダ・ドイツなどのロマ／シンティの家系の中で受け継がれ、Boulou Ferré、Biréli Lagrène、Stochelo Rosenbergといった奏者が現れる。1960年代半ばから徐々に再評価が進み、フランスのサモワで始まり、2017年以降はフォンテーヌブロー城敷地で開かれるDjango Reinhardt Festivalをはじめ、各地でフェスティバルと講習会が開かれている。</p>
<h2>代表曲</h2><ul><li>Minor Swing (Django Reinhardt)</li><li>Nuages (Django Reinhardt)</li><li>Djangology (Django Reinhardt)</li><li>Tears (Django Reinhardt)</li><li>Manoir de mes rêves (Django Reinhardt)</li><li>Swing 42 (Django Reinhardt)</li><li>Les Yeux Noirs (Django Reinhardt)</li><li>Douce Ambiance (Django Reinhardt)</li><li>Limehouse Blues (Django Reinhardt)</li><li>Belleville (Django Reinhardt)</li><li>Hungaria (Jimmy Rosenberg)</li><li>Troublant Bolero (Stochelo Rosenberg)</li></ul>
