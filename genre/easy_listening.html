<h1>Easy Listening（イージーリスニング）とは</h1>
<p>1960年代に商業的な最盛期を迎えた、背景的な聴かれ方を想定する作品が多い(鑑賞用との位置づけもある)器楽中心の音楽。中核となるのは、既存のヒット曲や映画音楽、スタンダードナンバー（長く愛されてきた定番曲）を、大編成の弦楽器を主役</p>
<p>1960年代に商業的な最盛期を迎えた、背景的な聴かれ方を想定する作品が多い(鑑賞用との位置づけもある)器楽中心の音楽。中核となるのは、既存のヒット曲や映画音楽、スタンダードナンバー（長く愛されてきた定番曲）を、大編成の弦楽器を主役に据えて編曲し直したものである。ヴァイオリンを十数本から数十本重ねた分厚い斉奏（全員が同じ旋律を一斉に弾くこと）が主旋律を歌い、そこにハープのグリッサンド（音をなめらかにすべらせる奏法）、フルートの装飾、ミュート（音をこもらせる器具）をかけた金管、ヴィブラフォン（金属の鍵盤を叩く楽器）の余韻が加えられる。打楽器は控えめで、リズムは明確だが決して前に出ず、音量の起伏も意図的に狭く抑えられている。ヴォーカルが入る場合は、Ray Conniffのようにコーラスを楽器の一部のように扱う例もあるが、Frank SinatraやBing Crosbyら有名歌手の歌も含まれる。テンポは中庸で、曲の展開は原曲の構成に忠実であり、驚きを与える仕掛けは徹底的に排除される。同じ軽い音楽でも、ラウンジやエキゾチカ（異国情緒を売りにした音楽）が奇抜な音色と派手なステレオ効果で耳を引こうとするのに対し、イージーリスニングは滑らかさと均質さを最優先する点で異なる。</p>
<h2>成り立ち</h2><p>発想の源の一つとして、フランスの作曲家Erik Satieが1917年頃に提唱した「家具の音楽」が挙げられる(直接の系譜は確立していない)。彼は、絵画や椅子と同じように、意識して鑑賞するのではなく空間の一部として存在する音楽を構想した。これを産業として実現したのはアメリカである。1922年、陸軍少将のGeorge Owen Squierが電力線を使った音楽配信の技術を開発し、1934年に社名をMuzakとした(前身は1922年に設立されたWired Radio)。Muzakは工場や事務所へ音楽を配信し、1950年代(1940年代とする資料もある)には、時間帯によって曲の刺激の度合いを変えることで作業効率を上げると称する「刺激の漸進」（刺激を少しずつ変えていくこと）という手法を売り物にした。音楽は文化ではなく労働管理の道具としても扱われた。家庭向けの市場では、1950年代のステレオLPの普及とともに弦楽オーケストラによる編曲物が大量に生産される。イギリスのMantovaniは、編曲者Ronald Bingeが1951年に考案した、弦のパートを時間差で重ねて残響のように響かせるカスケーディング・ストリングスという手法で成功し、アメリカのPercy FaithやRay Conniff、フランスのPaul MauriatやFranck Pourcel、ドイツのJames Lastといった楽団が世界的に売れた。日本でもポール・モーリアやレーモン・ルフェーヴルは根強い人気を得ている。1960年代が全盛期で、Percy Faithの「Theme from A Summer Place」(1960年)やPaul Mauriatの「Love Is Blue」(1968年)は全米1位を獲得した。しかし1960年代からこの音楽はエレベーター・ミュージックという見下した呼び名で呼ばれ始め、1970年代に広まり、退屈さと個性のなさの代名詞となる。Muzakは1984年から原曲のアーティストを採用し始め、1997年以降は原曲が基本の方式へ転換し、伝統的な編曲物は姿を消していった。Brian Enoが1978年に提唱したアンビエントは従来のBGMへの対抗として位置づけられ、1990年代のラウンジ再評価はこの音楽を祝いつつパロディ化（おどけて真似ること）する性格が強い。現在では、機能音楽（場の目的のために流す音楽）としての役割は配信サービスのプレイリストが引き継いでいるとも言われる。</p>
<h2>代表曲</h2><ul><li>Love is Blue (Paul Mauriat)</li><li>Theme from A Summer Place (Percy Faith)</li><li>Stranger on the Shore (Acker Bilk)</li><li>Spanish Flea (Herb Alpert &amp; The Tijuana Brass)</li><li>Moon River (Henry Mancini)</li><li>A Man and a Woman (Francis Lai)</li><li>Baby Elephant Walk (Henry Mancini)</li><li>The Pink Panther Theme (Henry Mancini)</li><li>The Syncopated Clock (Leroy Anderson)</li><li>Wonderland by Night (Bert Kaempfert)</li><li>Charmaine (Mantovani)</li><li>Ebb Tide (Frank Chacksfield)</li></ul>
