<h1>Easy Listening（イージーリスニング）とは</h1>
<p>イージーリスニングは、1960年代に商業的な最盛期を迎えた、器楽中心の音楽だ。聴き手が背景として流すことを想定した作品が多い(鑑賞用との位置づけもある)。 中心になるのは、既存のヒット曲や映画音楽、スタンダードナンバー（長く愛され</p>
<p>イージーリスニングは、1960年代に商業的な最盛期を迎えた、器楽中心の音楽だ。聴き手が背景として流すことを想定した作品が多い(鑑賞用との位置づけもある)。

中心になるのは、既存のヒット曲や映画音楽、スタンダードナンバー（長く愛されてきた定番曲）を編曲し直したものだ。大編成の弦楽器が主役を務める。

ヴァイオリンを十数本から数十本重ねた、分厚い斉奏（全員が同じ旋律を一斉に弾くこと）が主旋律を歌う。そこにハープのグリッサンド（音をなめらかにすべらせる奏法）、フルートの装飾、ミュート（音をこもらせる器具）をかけた金管、ヴィブラフォン（金属の鍵盤を叩く楽器）の余韻が加わる。

打楽器は控えめだ。リズムは明確だが、決して前に出ない。音量の起伏も、狭く抑えられていることが多い。テンポは中庸である。

ヴォーカルが入る場合は、Ray Conniffのように、コーラスを楽器の一部のように扱う例がある。一方で、Frank SinatraやBing Crosbyら、有名歌手の歌も含まれる。

曲の展開は、典型的には原曲の旋律を保つ。ただし、カスケーディング・ストリングスやメドレー構成のように、特徴的な編曲上の工夫も多い。

同じ軽い音楽でも、エキゾチカ（異国情緒を売りにした音楽）やラウンジの一部（Esquivelなど）は、音色やステレオ効果を前面に出した。これに対し、典型的なイージーリスニングは滑らかさを重視した。</p>
<h2>成り立ち</h2><p>発想の源の一つは、フランスの作曲家Erik Satieが1917年に命名した「家具の音楽」だ(直接の系譜は固まっていない)。公開上演は1920年だった。彼は、絵画や椅子と同じように、意識して鑑賞するのではなく、空間の一部として存在する音楽を構想した。

これを産業として実現したのはアメリカである。陸軍少将のGeorge Owen Squierが、電力線を使った音楽配信の着想を得たのは1910年だった。特許は1920年代に取った。1922年にNorth American Companyが特許権を取得し、Wired Radio, Inc.を設立した。1934年には、社名がMuzakに改称された。

Muzakは、工場や事務所へ音楽を配信した。1950年代(1940年代とする資料もある)には、「刺激の漸進」（刺激を少しずつ変えていくこと）という手法を売り物にした。時間帯によって曲の刺激の度合いを変え、作業効率を上げると称するものだ。音楽は、文化ではなく労働管理の道具としても扱われた。

家庭向けの市場も育った。1948年に登場したLP（長時間盤）が1950年代に広まり、1958年以降はステレオLPも出て、1960年代に標準化した。そのなかで、弦楽オーケストラによる編曲物が大量に生産される。

イギリスのMantovaniは、カスケーディング・ストリングスという手法で成功した。編曲者Ronald Bingeが1951年に考案した、弦のパートを時間差で重ね、残響のように響かせる手法だ。そのほか、カナダ出身でアメリカで活躍したPercy Faith、アメリカのRay Conniff、フランスのPaul MauriatやFranck Pourcel、ドイツのJames Lastといった楽団が、世界的に売れた。日本でも、ポール・モーリアやレーモン・ルフェーヴルは根強い人気を得てきた。

1950〜70年代に人気を集め、特に1960年代が全盛期だった。Percy Faithの「Theme from A Summer Place」(1960年)や、Paul Mauriatの「Love Is Blue」(1968年)は、全米1位を獲得した。

しかし1960年代から、この音楽はエレベーター・ミュージックという見下した呼び名で呼ばれ始める。この呼び名は1970年代に広まり、退屈さと個性のなさの代名詞となる。

Muzakは、1984年のYesco提携を皮切りに、原曲アーティスト音源（フォアグラウンド音楽）に進出した。1990年代にかけて、主力は原曲型に移った（転換点を1997年とする見方もある）。編曲型のチャンネルも並存した。

Brian Enoは、1970年代半ば（『Discreet Music』, 1975）から着想し、『Ambient 1: Music for Airports』（1978〜79年）でアンビエントを明確に打ち出した。アンビエントは、従来のBGMへの対抗として位置づけられる。1990年代のラウンジ再評価には、懐古的に楽しむ動きと、笑いを狙う演者（Richard Cheeseなど）の両方があった。

現在では、機能音楽（場の目的のために流す音楽）としての役割は、配信サービスのプレイリストが引き継いでいるとも言われる。</p>
<h2>代表曲</h2><ul><li>Love is Blue (Paul Mauriat)</li><li>Theme from A Summer Place (Percy Faith)</li><li>Stranger on the Shore (Acker Bilk)</li><li>Spanish Flea (Herb Alpert &amp; The Tijuana Brass)</li><li>Moon River (Henry Mancini)</li><li>A Man and a Woman (Francis Lai)</li><li>Baby Elephant Walk (Henry Mancini)</li><li>The Pink Panther Theme (Henry Mancini)</li><li>The Syncopated Clock (Leroy Anderson)</li><li>Wonderland by Night (Bert Kaempfert)</li><li>Charmaine (Mantovani)</li><li>Ebb Tide (Frank Chacksfield)</li></ul>
