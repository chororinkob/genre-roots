<h1>Easy Listening（イージーリスニング）とは</h1>
<p>1950年代から70年代にかけて商業的な最盛期を迎えた、聴き手の注意を奪わないことを目的として設計された器楽中心の音楽。中核となるのは、既存のヒット曲や映画音楽、スタンダードナンバーを、大編成の弦楽器を主役に据えて編曲し直したもの</p>
<p>1950年代から70年代にかけて商業的な最盛期を迎えた、聴き手の注意を奪わないことを目的として設計された器楽中心の音楽。中核となるのは、既存のヒット曲や映画音楽、スタンダードナンバーを、大編成の弦楽器を主役に据えて編曲し直したものである。ヴァイオリンを十数本から数十本重ねた分厚い斉奏が主旋律を歌い、そこにハープのグリッサンド、フルートの装飾、ミュートをかけた金管、ヴィブラフォンの余韻が加えられる。打楽器は控えめで、リズムは明確だが決して前に出ず、音量の起伏も意図的に狭く抑えられている。周波数の面でも、耳を刺す高音と腹に響く低音の両端が削られ、中音域に音が集まるよう調整されるため、小さな音量でも旋律が判別できる。ヴォーカルが入る場合も、歌詞を主張せず、コーラスとして楽器の一部のように扱われることが多い。テンポは中庸で、曲の展開は原曲の構成に忠実であり、驚きを与える仕掛けは徹底的に排除される。同じ軽い音楽でも、ラウンジやエキゾチカが奇抜な音色と派手なステレオ効果で耳を引こうとするのに対し、イージーリスニングは滑らかさと均質さを最優先する点で異なる。</p>
<h2>成り立ち</h2><p>起源の一つは、フランスの作曲家Erik Satieが1917年頃に提唱した「家具の音楽」という発想にある。彼は、絵画や椅子と同じように、意識して鑑賞するのではなく空間の一部として存在する音楽を構想した。これを産業として実現したのはアメリカである。1922年、陸軍准将のGeorge Owen Squierが電力線を使った音楽配信の技術を開発し、1934年にMuzakという会社が設立された。Muzakは工場や事務所へ音楽を配信し、時間帯によって曲の刺激の度合いを変えることで作業効率を上げると称する「刺激の漸進」という手法を売り物にする。この背景には1930年代から40年代の産業心理学の研究があり、音楽は文化ではなく労働管理の道具として扱われた。家庭向けの市場では、1950年代のステレオLPの普及とともに弦楽オーケストラによる編曲物が大量に生産される。イギリスのMantovaniは、弦のパートを時間差で重ねて残響のように響かせるカスケーディング・ストリングスという手法で成功し、アメリカのPercy FaithやRay Conniff、フランスのPaul MauriatやFranck Pourcel、ドイツのJames Lastといった楽団が世界的に売れた。日本でもポール・モーリアやレーモン・ルフェーヴルは根強い人気を得ている。1960年代末から70年代前半が商業的な頂点で、Percy Faithの「Theme from A Summer Place」やPaul Mauriatの「Love Is Blue」は全米1位を獲得した。しかし1970年代後半以降、この音楽はエレベーター・ミュージックという蔑称で呼ばれ、退屈さと没個性の代名詞となる。Muzakは1980年代以降、実際の流行曲をそのまま流す方式へ転換し、伝統的な編曲物は姿を消していった。1990年代のラウンジ再評価や、Brian Enoが提唱したアンビエントは、この系譜への批判的な応答として理解できる。現在では、機能音楽としての役割は配信サービスのプレイリストが引き継いでいる。</p>
<h2>代表曲</h2><ul><li>Moon River (Henry Mancini)</li><li>Love is Blue (Paul Mauriat)</li><li>Theme from A Summer Place (Percy Faith)</li><li>Stranger on the Shore (Acker Bilk)</li><li>Spanish Flea (Herb Alpert &amp; The Tijuana Brass)</li></ul>
