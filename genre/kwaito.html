<h1>Kwaito（クワイト）とは</h1>
<p>1980年代末から1990年代にかけて、南アフリカのヨハネスブルグ(ソウェト)の黒人居住区(タウンシップ)で生まれた音楽。輸入されたハウスの四つ打ちを、原盤より遅い、おおむね100〜110BPM前後(資料により幅がある)まで落とし</p>
<p>1980年代末から1990年代にかけて、南アフリカのヨハネスブルグ(ソウェト)の黒人居住区(タウンシップ)で生まれた音楽。輸入されたハウスの四つ打ちを、原盤より遅い、おおむね100〜110BPM前後(資料により幅がある)まで落とし、重く粘るテンポにしたところに核心がある。この減速によってキックとキックの間に大きな隙間が生まれ、そこへベースラインと打楽器が重く沈み込む。ベースは太く長く伸び、シンセはハウスやディスコの安価なプリセット音を臆面もなく使う。歌よりも語りに近い発声が中心で、ズールー語、ソト語、英語に、ツォツィタール(もとはアフリカーンス語を土台にした都市部の俗語)やイシカムト(ズールー語・ソト語の文法を土台にした混成語)といったスラングを混ぜて、短いフレーズを繰り返し唱える。複数人が交互に、あるいは同時に声を重ね、聴衆が応答することを前提とした呼びかけの構造を持つ。歌詞の主題はパーティー、金、恋、街での生活、そして解放後の南アフリカで若者が置かれた状況であり、社会的な抵抗と祝祭の両面を持つ。ヒップホップと似た発声を持ちながら、韻を細かく踏む技巧よりも、少ない言葉を反復して身体に食い込ませることを重視する点が異なる。鳴っている場所はタウンシップのシビーン(無認可の酒場)、乗合タクシーの車内、そして街頭である。</p>
<h2>成り立ち</h2><p>1980年代末から1990年代にかけて、ヨハネスブルクのタウンシップで、国際的なハウスミュージックのテンポを落とし、そこに地元のヒップホップやレゲエの要素を混ぜ込んだスタイルとして誕生した。Arthur Mafokate、Mandozaが発表した「Nkalakatha」(2000)、そしてグループTKZeeが、このジャンルを代表する存在として知られている。1991年にアパルトヘイト関連法が廃止され、1994年に初の全人種参加選挙が行われるという時代背景の中、クワイトは1990年代初めから、抑圧からの解放を祝う若者たちの音楽として爆発的に広まった。2010年代には、このクワイトのグルーヴ感が、よりジャジーなピアノを主体とするアマピアノへと進化的に受け継がれていくことになった。歌手Brenda Fassieは、クワイトが確立される以前から活動していたポップスターだが、その大胆でエネルギッシュな歌唱スタイルはクワイト世代のアーティストたちに強い影響を与え、後年「タウンシップのマドンナ」と称された。男女4人組のBoom Shakaも、初期クワイトを代表するグループとして知られ、1997年の音楽賞で彼らが南アフリカ国歌をクワイト風にアレンジして披露した版は、露出の多い衣装や挑発的な振り付けも含めて評価が大きく割れ、激しい論争を呼んだ。「クワイト」という名称の語源については諸説あり、ヨハネスブルクのギャング集団を指す言葉に由来するという説や、アフリカーンス語で「怒り」を意味する言葉から来ているという説などが語られている。プロデューサーのOskido、そしてレーベルKalawa Jazmee Recordsは、このジャンルの制作・流通両面を支えた中心的存在であった。クワイトは1990年代後半から2000年代前半にかけて南アフリカの音楽市場を席巻したが、その後は、アメリカのラップとの均質化が担い手たちに脅威と見られる中で一度勢いを失い、2010年代のアマピアノ台頭とともに、その遺産が再評価されることになった。</p>
