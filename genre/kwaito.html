<h1>Kwaito（クワイト）とは</h1>
<p>クワイトは、南アフリカのヨハネスブルグ(ソウェト)の黒人居住区(タウンシップ)で生まれた音楽だ。生まれた時期は1980年代末〜1990年代半ばにかけてで、説によって異なる。 核心は、輸入されたハウスの四つ打ちを、原盤より遅くしたと</p>
<p>クワイトは、南アフリカのヨハネスブルグ(ソウェト)の黒人居住区(タウンシップ)で生まれた音楽だ。生まれた時期は1980年代末〜1990年代半ばにかけてで、説によって異なる。

核心は、輸入されたハウスの四つ打ちを、原盤より遅くしたところにある。テンポはおおむね毎分100〜110拍前後まで落とされ、重く粘る。毎分95〜112拍とする見方もある。この減速で、キックとキックの間に大きな隙間が生まれる。そこへベースラインと打楽器が重く沈み込む。

ベースは太く、長く伸びる。シンセベースやドラムマシン、ディスコやヒップホップなどのサンプルを多く使う。

発声は、語りやチャント的なものが多い。ズールー語、ソト語、英語に、ツォツィタール(もとはアフリカーンス語を土台にした都市部の俗語)やイシカムト(ズールー語・ソト語の文法を土台にした混成語)といったスラングを混ぜる。そして短いフレーズを繰り返し唱える。複数人が交互に、あるいは同時に声を重ねる。聴衆が声で応える、呼びかけと応答の形をとることが多い。

歌詞のテーマは、パーティー、お金、恋、街での暮らし、そして解放後の南アフリカで若者が置かれた状況である。社会的な抵抗と祝祭の、両方の顔を持つ。

アメリカのヒップホップの影響を受けたが、単なる南アフリカ版ヒップホップではないとされる。

鳴っている場所は、タウンシップのシビーン(無認可の酒場)、乗合タクシーの車内、そして街頭である。</p>
<h2>成り立ち</h2><p>1980年代末〜1990年代半ばにかけて、ヨハネスブルクのタウンシップで、新しいスタイルが生まれた。その時期は説によって異なる。国際的なハウスミュージックのテンポを落とし、そこにアメリカのヒップホップや、英国・ジャマイカの音楽の影響と、ムバカンガやバブルガムなど地元の音楽が重なった。これがクワイトである。

代表的な存在として知られるのは、Arthur Mafokate、「Nkalakatha」(2000)を発表したMandoza、そしてグループのTKZeeだ。

時代も大きく動いていた。1991年には、人口登録法など主要な法が廃止された。1994年には、すべての人種が参加できる初の選挙が行われた。こうした流れの中、クワイトは1990年代半ば〜後半に、抑圧からの解放を祝う若者たちの音楽として本格的に広まった。

歌手のBrenda Fassieは、クワイトが固まる以前から活動していたポップスターだ。歌詞や題材の面で、クワイト世代のアーティストたちに影響を与えた。後年には「タウンシップのマドンナ」と呼ばれた。

男女4人組のBoom Shakaも、初期クワイトを代表するグループとして知られる。1998年4月の音楽賞「FNB South African Music Awards」で、彼らは南アフリカ国歌をクワイト風にアレンジして披露した。露出の多い衣装や挑発的な振り付けも含めて、一部から批判を受け、賛否が分かれた。

「クワイト」という名前の語源には諸説ある。ヨハネスブルクのギャング集団を指す言葉に由来するという説や、アフリカーンス語で「怒り」を意味する言葉から来たという説などが語られている。

作り手の側では、プロデューサーのOskido、そしてレーベルKalawa、後のKalawa Jazmee Recordsが、制作と発掘の面でクワイトの発展に貢献した。

クワイトは1990年代後半に人気が高まった。しかし、その後は一度勢いを失う。担い手の間では、アメリカのラップとの同質化への警戒があった。ただ、衰退の原因には諸説ありとされる。

一方で2010年代には、よりジャジーなピアノを中心とするアマピアノが、クワイトのグルーヴ感を要素の一つとして取り込んだ。そして2010年代のアマピアノの盛り上がりとともに、クワイトの遺産は見直されることになった。</p>
