<h1>Folk Rock（フォークロック）とは</h1>
<p>フォークロックは、フォークの歌詞の重さと歌の作法を、ロックバンドの電気楽器で演奏する音楽だ。 トレードマークの楽器は、Rickenbackerの12弦エレクトリックギターだ。6本の弦それぞれに1本を追加し、低い4組はオクターブ上を</p>
<p>フォークロックは、フォークの歌詞の重さと歌の作法を、ロックバンドの電気楽器で演奏する音楽だ。

トレードマークの楽器は、Rickenbackerの12弦エレクトリックギターだ。6本の弦それぞれに1本を追加し、低い4組はオクターブ上を、高い2組は同じ音を重ねて張る（Rickenbackerは一般的な12弦と並び順が逆）。この構造によって、和音を弾くと音が細かく揺れながら鐘のように広がる。この煌めきが、この分野の音の特徴となった。

演奏は、ドラムとベースを備えたロックの編成だ。ただし、歌が常に前面に置かれる。

歌では、米国系ではByrdsやMamas &amp; the Papasのように重ねた和声が特徴だ。英国系では、女性ソロ歌手の歌唱も重視された。この合唱の透明感が、ロックの荒々しさを和らげている。

リズムは4/4拍子が多い。ただし、英国の伝承歌系では、舞曲由来の複合拍子（1拍が3つに分かれる拍子）の曲も多い。テンポは中庸なものが多いとされ、和声は三和音（3つの音を重ねた基本の和音）を主体とした、平明なものが中心になりやすい。

しかし、歌詞は平明ではない。詩としての完成度が重んじられ、比喩とシンボルに満ちた表現、社会への異議申し立て、内面の告白が扱われた。長い曲もあった。

ロックの持つ身体的な高揚と、フォークの持つ言葉の重みを、どちらも犠牲にせず両立させようとした。その点が、この分野の歴史的な意義である。</p>
<h2>成り立ち</h2><p>1965年、フォークロックという語と流れが定着した（1964年に先行例がある）。

同年4月、ロサンゼルスのThe Byrdsが、Bob Dylanの楽曲ミスター・タンブリン・マンを録音して発表し、全米1位を獲得した。McGuinnの12弦ギターに、Wrecking Crew（スタジオ演奏家の集団）の伴奏を重ね、McGuinn・Crosby・Clarkが歌った録音だ。Roger McGuinnの12弦ギターの音色と、緻密な合唱が組み合わされたこの録音は、フォークの言葉がロックの器で成立することを証明した。

同年7月25日、Bob Dylan自身がニューポートのフォーク音楽祭に、電気楽器を伴うバンドを従えて登場した。すると、観客の一部から激しい野次を浴びるという事件が起きる。この反発の理由については、音響不良、持ち時間の短さ、電気化への反発など諸説ある。いずれにせよ、この出来事は、フォークが商業的なロックへ踏み出すトレードマークとして語り継がれた。

同じ1965年、Simon &amp; Garfunkelの静かな弾き語りの楽曲に、制作者Tom Wilsonが電気楽器を重ねた。本人たちの了解を得ないまま重ねたものだった。そのシングルは1965年に発売され、1966年初頭に全米1位となった。

ニューヨークで結成され、1965年にロサンゼルスへ移ったThe Mamas &amp; the Papasが、華やかな合唱を武器にした。翌1966年に結成されたBuffalo Springfieldは、より緊張感のある作風を提示した。

イギリスでは、やや遅れて独自の展開が起こる。1967年に結成されたFairport Conventionは、当初は米国のフォークロックに影響を受け、DylanやJoni Mitchellの曲を中心に演奏していた。だが、1968〜69年の前2作から、伝承歌路線へ舵を切り始める。その到達点となったリージ・アンド・リーフは、伝承歌と、それに倣った自作曲をロックの編成で演奏し、英国フォークロックの雛形となった作品とされる（最初かどうかには異論がある）。

歌手Sandy Dennyとフィドル奏者を擁するFairportは、伝承歌路線の代表格だ。同時期にPentangleらも、主にアコースティックの編成で、ジャズ・フォーク的なスタイルを築いた。

ただし、この転換の直前に悲劇があった。1969年5月、彼らは高速道路で事故に遭い、19歳のドラマーMartin Lambleと、同乗していた女性が死亡した。

Pentangleは Fairportと並行して登場した。Steeleye Spanが1969年に結成され、伝承歌の再生という運動が広がった。

1960年代末から、このスタイルはカントリーロックやシンガーソングライターの流れへ分岐し、1970年代に盛んになった。シンガーソングライター系の流れ（John Denver、Neil Youngらのカントリー・フォーク）に連なった。</p>
