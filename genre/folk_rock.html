<h1>Folk Rock（フォークロック）とは</h1>
<p>フォークの歌詞の重さと歌の作法を、ロックバンドの電気楽器で演奏する音楽である。象徴的な楽器はRickenbackerの12弦エレクトリックギターで、六本の弦それぞれに一本を追加し、うち高音側は同じ音を、低音側はオクターブ上を重ねて</p>
<p>フォークの歌詞の重さと歌の作法を、ロックバンドの電気楽器で演奏する音楽である。象徴的な楽器はRickenbackerの12弦エレクトリックギターで、六本の弦それぞれに一本を追加し、うち高音側は同じ音を、低音側はオクターブ上を重ねて張る。この構造によって、和音を弾くと音が細かく揺れながら鐘のように広がり、この煌めきがこの分野の音の刻印となった。演奏はドラムとベースを備えたロックの編成だが、音量は抑えられ、歌が常に前面に置かれる。歌唱の要は複数の声による和声で、主旋律に対して三度や五度、時にはより複雑な音程を寄り添わせ、精密に重ねる。この合唱の透明感が、ロックの荒々しさを和らげている。リズムは4/4拍子で素直に進み、テンポは中庸、和声も三和音を主体とした平明なものである。しかし歌詞は平明ではない。詩としての完成度が重んじられ、比喩と象徴に満ちた表現、社会への異議申し立て、内面の告白が扱われ、一曲が5分を超えることも珍しくない。ロックの持つ身体的な高揚と、フォークの持つ言葉の重みを、どちらも犠牲にせず両立させようとした点が、この分野の歴史的な意義である。</p>
<h2>成り立ち</h2><p>1965年という一年に、決定的な出来事が集中している。同年4月、ロサンゼルスのThe Byrdsが、Bob Dylanの楽曲ミスター・タンブリン・マンを電気楽器で演奏して発表し、全米1位を獲得した。Roger McGuinnの12弦ギターの音色と、緻密な合唱が組み合わされたこの録音は、フォークの言葉がロックの器で成立することを証明した。同年7月25日、Bob Dylan自身がニューポートのフォーク音楽祭に電気楽器を伴うバンドを従えて登場し、観客の一部から激しい野次を浴びるという事件が起きる。この反発の理由については、音響が劣悪だったからだという証言と、フォークの純粋さを裏切ったからだという解釈が併存しており、現在も議論が続いている。いずれにせよ、この出来事はフォークが商業的なロックへ踏み出す象徴として語り継がれた。同じ1965年、Simon &amp; Garfunkelの静かな弾き語りの楽曲に、本人たちの了解を得ないまま制作者Tom Wilsonが電気楽器を重ね、それが大ヒットしたことで彼らは復活を遂げている。ロサンゼルスではThe Mamas &amp; the Papasが華やかな合唱を武器に、Buffalo Springfieldがより緊張感のある作風を提示した。イギリスではやや遅れて、独自の展開が起こる。1967年に結成されたFairport Conventionは、当初アメリカの模倣から出発したが、1969年の作品リージ・アンド・リーフで、イギリス諸島に伝わる古い伝承歌をロックの編成で演奏するという方向へ転じた。歌手Sandy Dennyとフィドル奏者を擁するこの試みは、イギリスのフォークロックを確立する。ただしこの転換の直前、1969年5月に彼らは高速道路で事故に遭い、19歳のドラマーMartin Lambleと同乗していた女性が死亡するという悲劇に見舞われている。Pentangle、Steeleye Spanが続き、伝承歌の再生という運動が広がった。1970年代以降、この様式はカントリーロックやシンガーソングライターの流れへ分岐していくが、歌詞を音楽の中心に据えるという原則は、以後のロック全体の前提となった。</p>
<h2>代表曲</h2><ul><li>Mr. Tambourine Man（The Byrds）</li><li>Turn! Turn! Turn! (The Byrds)</li><li>Who Knows Where the Time Goes?（Fairport Convention）</li></ul>
