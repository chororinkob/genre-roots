<h1>Folk Rock（フォークロック）とは</h1>
<p>フォークの歌詞の重さと歌の作法を、ロックバンドの電気楽器で演奏する音楽である。象徴的な楽器はRickenbackerの12弦エレクトリックギターで、6本の弦それぞれに1本を追加し、低い4組はオクターブ上を、高い2組は同じ音を重ねて</p>
<p>フォークの歌詞の重さと歌の作法を、ロックバンドの電気楽器で演奏する音楽である。象徴的な楽器はRickenbackerの12弦エレクトリックギターで、6本の弦それぞれに1本を追加し、低い4組はオクターブ上を、高い2組は同じ音を重ねて張る（Rickenbackerは一般的な12弦と並び順が逆）。この構造によって、和音を弾くと音が細かく揺れながら鐘のように広がり、この煌めきがこの分野の音の特徴となった。演奏はドラムとベースを備えたロックの編成だが、歌が常に前面に置かれる。歌唱の要は複数の声による和声（ハーモニー）で、主旋律に対して3度や5度、時にはより複雑な音程を寄り添わせ、精密に重ねる。この合唱の透明感が、ロックの荒々しさを和らげている。リズムは4/4拍子が多いが、英国の伝承歌系では舞曲由来の複合拍子（1拍が3つに分かれる拍子）の曲も多い。テンポは中庸なものが多く、和声は三和音（3つの音を重ねた基本の和音）を主体とした平明なものが中心である。しかし歌詞は平明ではない。詩としての完成度が重んじられ、比喩と象徴に満ちた表現、社会への異議申し立て、内面の告白が扱われ、長い曲もあった。ロックの持つ身体的な高揚と、フォークの持つ言葉の重みを、どちらも犠牲にせず両立させようとした点が、この分野の歴史的な意義である。</p>
<h2>成り立ち</h2><p>1965年という一年に、決定的な出来事が集中している。同年4月、ロサンゼルスのThe Byrdsが、Bob Dylanの楽曲ミスター・タンブリン・マンを、McGuinnの12弦ギターにWrecking Crew（スタジオ演奏家の集団）の伴奏を重ね、McGuinn・Crosby・Clarkが歌った録音として発表し、全米1位を獲得した。Roger McGuinnの12弦ギターの音色と、緻密な合唱が組み合わされたこの録音は、フォークの言葉がロックの器で成立することを証明した。同年7月25日、Bob Dylan自身がニューポートのフォーク音楽祭に電気楽器を伴うバンドを従えて登場し、観客の一部から激しい野次を浴びるという事件が起きる。この反発の理由については、音響が劣悪だったからだという証言と、フォークの純粋さを裏切ったからだという解釈が併存しており、現在も議論が続いている。いずれにせよ、この出来事はフォークが商業的なロックへ踏み出す象徴として語り継がれた。同じ1965年、Simon &amp; Garfunkelの静かな弾き語りの楽曲に、本人たちの了解を得ないまま制作者Tom Wilsonが電気楽器を重ね、そのシングルは1965年に発売され、1966年初頭に全米1位となった。ロサンゼルスではThe Mamas &amp; the Papasが華やかな合唱を武器に、翌1966年に結成されたBuffalo Springfieldがより緊張感のある作風を提示した。イギリスではやや遅れて、独自の展開が起こる。1967年に結成されたFairport Conventionは、当初は米国のフォークロックに影響を受け、DylanやJoni Mitchellの曲を中心に演奏していたが、1969年の前2作から伝承歌路線へ舵を切り始め、その到達点となったリージ・アンド・リーフで、イギリス諸島に伝わる古い伝承歌をロックの編成で演奏するという方向を確立した。歌手Sandy Dennyとフィドル奏者を擁するFairportは伝承歌路線の代表格で、同時期にPentangleらも独自の様式を築いた。ただしこの転換の直前、1969年5月に彼らは高速道路で事故に遭い、19歳のドラマーMartin Lambleと同乗していた女性が死亡するという悲劇に見舞われている。Pentangleは Fairportと並行して登場し、Steeleye Spanが1969年に結成され、伝承歌の再生という運動が広がった。1960年代末から、この様式はカントリーロックやシンガーソングライターの流れへ分岐し、1970年代に隆盛したが、後のロックの歌詞表現に影響を与えた。</p>
