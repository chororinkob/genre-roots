<h1>Future Garage（フューチャーガレージ）とは</h1>
<p>2000年代末のイギリスで現れた、跳ねたリズムと深い憂鬱を組み合わせたベースミュージックである。リズムの土台はUKガラージの二歩踏みと呼ばれる型で、四つ打ちを避け、スネアを二拍目と四拍目に置きながら、キックを不規則な位置に散らすこ</p>
<p>2000年代末のイギリスで現れた、跳ねたリズムと深い憂鬱を組み合わせたベースミュージックである。リズムの土台はUKガラージの二歩踏みと呼ばれる型で、四つ打ちを避け、スネアを二拍目と四拍目に置きながら、キックを不規則な位置に散らすことで独特のよろめきを作る。加えて、拍を均等に割らず前後に振り分けるスウィングが深くかけられ、機械で作られていながら人が手で叩いたようなずれが生じる。テンポは130 BPM前後だが、体感は半分の速さで受け取られることが多い。低音は正弦波に近い純粋なサブベースが担い、旋律を持たず、部屋の空気を揺らす役割に徹する。上物で決定的なのは人の声の扱いで、ソウルやR&amp;Bの歌を細かく切り刻み、音程を上下にずらし、意味を成さない断片として並べ直す。誰かが歌っているのに何を言っているか分からないという状態が、この音楽の情緒の中核をなす。さらにレコードの針音、雨、電車、遠くの話し声といった環境の録音が薄く敷かれ、深夜の都市を歩いている感覚を作る。和音は短調の持続音が中心で、明確な展開や盛り上がりを避け、同じ情景が延々と続く。踊るためというより、独りで移動しながら聴くために作られた音楽である。</p>
<h2>成り立ち</h2><p>背景には、2000年代前半のイギリスのダンス音楽の分裂がある。1990年代末に華やかな流行を極めたUKガラージは、暴力事件や規制によってクラブから締め出され、その残骸から、暗く低音を強調したダブステップと、より歌ものに近い方向が分かれて生まれた。この状況で決定的な作品を残したのがBurialである。ロンドン南部で育ったWilliam Bevanは、素性を一切明かさないまま2006年と2007年に作品を発表した。とりわけ2007年のアントゥルーは、音楽制作ソフトの波形を目で見ながら手作業で配置するという、拍の升目に頼らない独特の方法で作られており、そのために生じる微妙なずれが、生々しい人間味を生んだ。彼は自分の作品を、夜中に一人で帰る道のための音楽だと語っており、雨音や街の雑音を用いる手法もそこから来ている。この作品が音楽誌で年間最高の評価を受けたことにより、匿名性そのものが話題となり、2008年に彼は自ら正体を明かして騒動を収めた。フューチャー・ガラージという呼称は、この方向を指して2009年前後にインターネットの掲示板から自然に広まったもので、明確な提唱者はいない。土台を支えたのはKode9が2004年に設立したHyperdubと、Paul RoseによるHotflushといったレーベル群である。同時期にMount Kimbieは、生楽器の断片と電子音を混ぜたより繊細な方向を示し、後にJames Blakeが歌を前面に出すことで、この音響を主流のポップスへ接続した。Zombyは匿名を保ちながら、より断片的で不穏な作品を残している。ただしこの分野は流行としては短命で、2012年前後には呼称そのものが使われなくなった。多くの模倣作が雨音と切り刻んだ歌声という表面的な記号だけをなぞったため、様式が急速に飽きられたのである。それでも、憂鬱を電子音楽で表現するという方向性は、その後のローファイな作品群や、現在のベースミュージック全般に確実に受け継がれている。</p>
