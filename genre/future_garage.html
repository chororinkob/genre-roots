<h1>Future Garage（フューチャーガレージ）とは</h1>
<p>フューチャー・ガラージは、弾んだリズムと深い憂鬱を組み合わせたベースミュージックである。2000年代半ば〜後半にイギリスで登場し、2009年ごろに呼称が定着した。 低音は、温かくフィルターをかけたリーズベース、サブベースや、フィル</p>
<p>フューチャー・ガラージは、弾んだリズムと深い憂鬱を組み合わせたベースミュージックである。2000年代半ば〜後半にイギリスで登場し、2009年ごろに呼称が定着した。

低音は、温かくフィルターをかけたリーズベース、サブベースや、フィルターを動かした矩形波ベースが担う。その上に、柔らかいリード音や単純な旋律が乗ることがある。和音は持続音が中心で、抑制的な展開が多い。

リズムの土台は、UKガラージの2ステップ型が典型で、四つ打ち型もある。拍を飛ばすキックと、ずれたハイハットで揺らぎを出し、独特のよろめくような感じを作る。さらに、拍を均等に割らず前後に振り分けるスウィングが深くかけられる。そのため、機械で作られていながら、人が手で叩いたようなずれが生まれる。テンポはおおむね130〜140 BPMで、それ以外もある。

上に重ねる音でいちばん大事なのは、人の声の扱いだ。ソウルやR&amp;Bの歌を細かく切り刻み、音程を上下にずらして再構成する。歌詞の文脈より、感情の質感を前面に出す。

さらに、レコードノイズ、雨音、ゲームや映画から採った効果音などが薄く敷かれ、深夜の都市を歩いている感覚を作る。踊るためというより、夜の帰り道のための音楽である。</p>
<h2>成り立ち</h2><p>2000年代前半、イギリスのダンス音楽は分裂していた。これが、このジャンルが生まれた背景にある。

UKガラージは2001年前後に、クラブでの暴力事件で逆風を受けた。一方で、その前から続いていたダーク・ガラージの流れが、グライムとダブステップに発展した。

この状況で、後にこの流れの決め手と評されるようになる作品を残したのがBurialだ。ロンドン南部で育ったWilliam Bevanは、2005年のEPで登場した。続いて2006年のアルバム『Burial』、2007年の『Untrue』を、匿名で発表した。

とりわけ2007年の作品は、拍の升目に頼らない独特の方法で作られた。本人の話では、Sound Forgeで波形を見ながら、手作業で配置したという。そのために生じる微妙なずれが、生々しい人間らしさを生んだ。彼は自分の作品を、クラブの帰りのミニキャブや深夜バス、誰かと一緒の帰り道、夜遅くにロンドンを歩いて帰る道のための音楽だと語っている。雨音については、曲の粗を隠すために一部使っていると述べている。

Untrueは、音楽メディアの年間ランキングで1位や2位に選ばれた。Mercury Prizeの候補入りのあと、2008年8月5日、新聞The Sunの『暴露』企画が報じられた直後に、本人がMySpaceでWill Bevanと名乗った。本名は、それより先の2008年2月に、新聞がすでに報じていた。

フューチャー・ガラージという呼称は、L2Sを主宰するDJ・制作者のWhistlaが提唱したとされる。Burialらの音は、後にこの呼称で語られるようになった。土台を支えたのは、Kode9が2004年に設立したHyperdubや、Paul RoseによるHotflushといったレーベルである。

同じころ、Mount Kimbieは、環境音や声のサンプルと電子音を混ぜた、より繊細な方向を示した。後にJames Blakeは歌を前面に出し、ポスト・ダブステップの文脈から出て、ポップ寄りの評価を得た。Zombyは匿名で活動し、レイヴやジャングルの参照を含む幅広い作風を示している。

呼称は2010年前後〜2010年代前半に広く使われ、今も使われている。</p>
