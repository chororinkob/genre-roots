<h1>Future Garage（フューチャーガレージ）とは</h1>
<p>2000年代末のイギリスで現れた、弾んだリズムと深い憂鬱を組み合わせたベースミュージックである。リズムの土台はUKガラージの二歩踏みと呼ばれる型が典型で(四つ打ちの曲もある)、四つ打ちを崩し、スネアを2拍目と4拍目に置きながら、キ</p>
<p>2000年代末のイギリスで現れた、弾んだリズムと深い憂鬱を組み合わせたベースミュージックである。リズムの土台はUKガラージの二歩踏みと呼ばれる型が典型で(四つ打ちの曲もある)、四つ打ちを崩し、スネアを2拍目と4拍目に置きながら、キックを不規則な位置に散らすことで独特のよろめくような感じを作る。加えて、拍を均等に割らず前後に振り分けるスウィングが深くかけられ、機械で作られていながら人が手で叩いたようなずれが生じる。テンポは130〜140 BPMとされる。低音は温かくフィルターをかけたリーズベースやサブベース(矩形波系)が担い、その上に柔らかいリード音や単純な旋律が乗ることがある。上に重ねる音でいちばん大事なのは人の声の扱いで、ソウルやR&amp;Bの歌を細かく切り刻み、音程を上下にずらし、意味を成さない断片として並べ直す。誰かが歌っているのに何を言っているか分からないという状態が、この音楽の感情表現の中心になっている。さらにレコードの針音、雨、電車、遠くの話し声といった環境の録音が薄く敷かれ、深夜の都市を歩いている感覚を作る。和音は短調の持続音が中心で、はっきりした展開や盛り上がりを避け、同じ情景が延々と続く。踊るためというより、独りで移動しながら聴くために作られた音楽である。</p>
<h2>成り立ち</h2><p>背景には、2000年代前半のイギリスのダンス音楽の分裂がある。1990年代末に華やかな流行を極めたUKガラージは、暴力事件によってクラブから締め出され、その残骸から、グライムとダブステップが分かれて生まれた。この状況で決め手となる作品を残したのがBurialである。ロンドン南部で育ったWilliam Bevanは、素性を一切明かさないまま2006年と2007年に作品を発表した。とりわけ2007年のアントゥルーは、音楽制作ソフトの波形を目で見ながら手作業で配置するという、拍の升目に頼らない独特の方法で作られており、そのために生じる微妙なずれが、生々しい人間らしさを生んだ。彼は自分の作品を、夜行バスや、夜中に一人で街を歩いて帰る道のための音楽だと語っている。雨音の使用については、曲の粗を隠すために一部使っていると述べている。Untrueは、Resident AdvisorやSputnikmusicで年間1位、The Wireでは2位となった。Mercury Prizeの候補入りのあと、新聞The Sunが正体を暴く企画を始めたことを受け、2008年8月5日に、彼は自らWill Bevanと名乗った。フューチャー・ガラージという呼称は、DJ・制作者のWhistlaが命名したとされ、2009年11月にFuture Garage Forumが登場して広まった。土台を支えたのはKode9が2004年に設立したHyperdubと、Paul RoseによるHotflushといったレーベル群である。同時期にMount Kimbieは、環境音や声のサンプルと電子音を混ぜたより繊細な方向を示し、後にJames Blakeが歌を前面に出すことで、この音響を主流のポップスへ接続した。Zombyは匿名を保ちながら、より断片的で不穏な作品を残している。流行のピークは2010年代前半だが、呼称は現在も使われている。憂鬱を電子音楽で表現するという方向性は、その後のベースミュージックにも影響を与えたと指摘する論者もいる。</p>
