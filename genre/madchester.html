<h1>Madchester（マッドチェスター）とは</h1>
<p>ギターを持ったバンドが、ファンクやディスコのドラム様式、ハウスなどのダンス音楽、地元インディーを混ぜ合わせた、1980年代末〜1990年代初頭のイングランド北部の音楽である。特徴はドラムの叩き方にあり、ファンクやディスコ由来のドラ</p>
<p>ギターを持ったバンドが、ファンクやディスコのドラム様式、ハウスなどのダンス音楽、地元インディーを混ぜ合わせた、1980年代末〜1990年代初頭のイングランド北部の音楽である。特徴はドラムの叩き方にあり、ファンクやディスコ由来のドラム様式（Funky Drummer系のシャッフル・ビート）と、Reniのゆったりしたオフビートの叩き方が用いられる。この独特のよれた感覚が、腰から動くような踊りやすさを生んだ。代表曲のテンポはおおむね100〜130 BPM前後で、曲ごとに異なる。ギターは、きらびやかで鳴りの明るい「jingle-jangle」と呼ばれる音が基調で、曲によってワウペダル（音色を波打たせるペダル）や歪みも使う。サンプラー（録音を素材として取り込む機械）で既成曲の断片を取り込んだ例もあり、Fools Goldのベース（Young MCの曲から）やStep Onのサンプリングなどが知られる。歌は感情を込めて張り上げるより、気だるく投げやりに呟かれることが多い。歌詞は日常の断片、薬物体験、地元の風景、意味を成さない言葉遊びを扱う。服装も音の一部と見なされ、裾の広がったズボンや大きめの上着といった緩い装いが、音楽の緩さと対応していた。</p>
<h2>成り立ち</h2><p>舞台はイングランド北西部の工業都市マンチェスターである。1970年代の脱工業化によって職を失い荒廃したこの街で、テレビ司会者のTony Wilsonらが1978年にFactory Recordsを設立し、1982年にはFactory Records、New Order、Tony Wilsonらの出資でThe Haçiendaというクラブを開いた。当初は客が入らず莫大な赤字を出し続けたが、1986年から1988年にかけてシカゴ由来のハウスとアシッドハウスがイギリスへ流入し、そこにエクスタシー（興奮作用のある薬物）の流行が重なると、状況は一変する。Haçiendaのクラブ文化、MDMAの流通（1987年に始まり1988年に増加）、地元インディーの伝統が重なったことが、この音楽を生んだ条件だった。中心となったのはThe Stone RosesとHappy Mondaysである。前者は1989年のデビュー作で、Reniによる異様に滑らかなドラムと、John Squireの色彩豊かなギター、Ian Brownの気だるい歌を組み合わせたが、発売当初のチャートの初動は控えめ（全英32位）で、音楽誌の評価は絶賛から平凡まで割れたが、商業的な上昇は翌年以降になり、1990年2月に最高19位へ上がった。後者は1988年の作品をMartin Hannettの制作で発表した後、1990年にはロンドンのDJであるPaul Oakenfoldを迎え、ダンス音楽の作法を全面的に導入した。Shaun Ryderの支離滅裂な歌詞と、ダンサーでありマラカス奏者でもあるBezの存在は、この一群の反権威的な気風を象徴していた。マッドチェスターという呼称はFactory Records周辺で生まれた語で、映像監督のBailey Brothers（Philip ShottonとKeith Jobling）の発案をTony Wilsonが採用して広めた。Happy Mondaysは彼の指示でEPの題名を「Rave On」から「Madchester Rave On」(1989年)に改めており、これを契機に報道で定着した。Inspiral Carpets、The Charlatans、808 Stateらが続き、1990年5月にThe Stone Rosesがスパイク島（ウィドネス）で5月27日に行った約2万7000〜3万人規模の野外公演は、世代の記念碑として語られる一方、当時は音響や運営への批判があった一方、楽しんだ観客も多く、評価は割れていた。終焉は早かった。The Haçiendaは麻薬の売買をめぐる暴力団の抗争の場となり、銃器の持ち込みと刺傷事件が相次いだ。客が酒より薬物に流れて収益が上がらない赤字も重なり、1997年6月に閉店する。Factory Recordsはクラブの赤字と、Happy Mondaysのアルバム制作費の超過などに耐えられず、1992年に倒産したとされる。The Stone Rosesは所属レーベルとの契約をめぐる裁判（1990年9月〜1991年5月）などで数年を空費したとされ、復帰作を出した頃には時代が去っていた。それでもこの数年間が残した、ダンス音楽とバンドの垣根を取り払うという発想は、The Stone RosesなどがOasisらブリットポップの勢力に影響を与えたという形で引き継がれた。</p>
