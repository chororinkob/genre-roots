<h1>Madchester（マッドチェスター）とは</h1>
<p>マッドチェスターは、ギターを持ったバンドによる、ファンクやディスコのドラムスタイルと、ハウスなどのダンス音楽・インディーの混合を取り込んだ音楽だ。1980年代末〜1990年代初頭のイングランド北部で生まれた。 ギターは、jingl</p>
<p>マッドチェスターは、ギターを持ったバンドによる、ファンクやディスコのドラムスタイルと、ハウスなどのダンス音楽・インディーの混合を取り込んだ音楽だ。1980年代末〜1990年代初頭のイングランド北部で生まれた。

ギターは、jingle-jangle（きらびやかで鳴りの明るいギター）が基調だ。曲によって、ワウペダル（音色を波打たせるペダル）や歪みも使う。

ベースは、低音を支えるより主旋律に近い動きを見せることが多い。そこへ、タンバリンやコンガ、サンプラー（録音を素材として取り込む機械）で取り込んだ既成曲の断片、ハウス由来のピアノの和音が乗ることもある。

最大の特徴は、ドラムの叩き方にある。ファンクやディスコ由来のドラムスタイル（Funky Drummer系のシャッフル・ビート）と、Reniの「ゆったりしたオフビート」の叩き方が用いられる。この独特のよれた感覚が、腰から動くような踊りやすさを生んだ。テンポは、代表曲はおおむね100〜130 BPM前後といった幅で示される。

歌は、感情を込めて張り上げるより、気だるく投げやりに呟かれることが多い。歌詞は、日常の断片、薬物体験、地元の風景、意味を成さない言葉遊びを扱う。

服装も、音の一部と見なされた。裾の広がったズボンや大きめの上着といった緩い装いが、音楽の緩さと対応していた。</p>
<h2>成り立ち</h2><p>舞台は、イングランド北西部の工業都市マンチェスターだ。1970年代の脱工業化によって、この街は職を失い荒廃していた。そこでテレビ司会者のTony Wilsonらが、1978年にFactory Recordsを設立した。1982年には、Factory Records、New Order、Tony Wilsonらの出資で、The Haçiendaというクラブを開いた。

当初は客が入らず、莫大な赤字を出し続けた。しかし1986年から1988年にかけて、シカゴ由来のハウスとアシッドハウスがイギリスへ流入した。そこにエクスタシー（興奮作用のある薬物）の流行が重なると、状況は一変する。The Haçiendaのクラブ文化、MDMAの流通（1987年に始まり1988年に増加）、地元インディーの伝統が重なったことが、この音楽を生んだ。

中心となったのは、The Stone RosesとHappy Mondaysだ。前者は1989年のデビュー作で、Reniによる異様に滑らかなドラムと、John Squireの色彩豊かなギター、Ian Brownの気だるい歌を組み合わせた。ただ、音楽誌の評価は割れ（絶賛から平凡まで）、初動は全英32位だった。1990年2月に最高19位へ上がった。

後者は、1988年の作品をMartin Hannettの制作で発表した。その後、1990年にはロンドンのDJであるPaul Oakenfoldを迎え、ダンス音楽の作法を全面的に導入した。Shaun Ryderの支離滅裂な歌詞と、ダンサーでありマラカス奏者でもあるBezの存在は、この一群の反権威的な気風をよく表していた。

マッドチェスターという呼称は、Factory Records周辺で生まれた語だ。映像監督のBailey Brothers（Philip ShottonとKeith Jobling）の発案を、Tony Wilsonが採用して広めた。Happy Mondaysは彼の指示で、EPの題名を「Rave On」から「Madchester Rave On」(1989年)に改めている。これを契機に、報道で定着した。

Inspiral Carpets、The Charlatans、808 Stateらが続いた。1990年5月にThe Stone Rosesがスパイク島で行った、2万7000〜3万人規模の野外公演（1990年5月27日、ウィドネス）は、世代の記念碑として語られる。当時は、音響や運営への批判があった。一方で、楽しんだ観客も多く、評価は割れていた。のちに伝説化した。

終焉は早かった。The Haçiendaは麻薬の売買をめぐる暴力団の抗争の場となり、銃器の持ち込みと刺傷事件が相次いだ。この暴力・銃撃事件と、薬物のため酒の売上が伸びない赤字が重なり、1997年6月に閉店した。Factory Recordsは、クラブの赤字とレコードの制作費に耐えられず、1992年に倒産した（主因はHappy Mondaysの『Yes Please!』の制作費超過が大きいとされる）。

The Stone RosesはSilvertoneとの契約をめぐる裁判（1990年9月の差し止めから1991年5月の判決まで）を抱え、復帰作を出した頃には時代が去っていた。それでもThe Stone RosesなどがOasisらBritpop勢に影響した。</p>
