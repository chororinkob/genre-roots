<h1>Madchester（マッドチェスター）とは</h1>
<p>ギターを持ったバンドが、クラブで鳴っていたアシッドハウスの躍動をそのまま自分たちの演奏へ取り込んだ、1980年代末のイングランド北部の音楽である。最大の特徴はドラムの叩き方にあり、ロックの硬い二拍四拍ではなく、ハイハットを細かく揺</p>
<p>ギターを持ったバンドが、クラブで鳴っていたアシッドハウスの躍動をそのまま自分たちの演奏へ取り込んだ、1980年代末のイングランド北部の音楽である。最大の特徴はドラムの叩き方にあり、ロックの硬い二拍四拍ではなく、ハイハットを細かく揺らしながら拍の裏を微妙に遅らせる、ファンクやディスコに近い緩んだ刻みが用いられる。この独特のよれた感覚が、腰から動くような踊りやすさを生んだ。テンポは概ね105から125 BPMで、ダンス音楽としては速すぎず、ロックとしては遅い中間の速度に置かれる。ギターはワウペダルを踏んで鳴らす掻き鳴らしや、残響の深い煌めくアルペジオが中心で、歪みは強くない。ベースは低音を支えるより主旋律に近い動きを見せ、そこへタンバリンやコンガ、サンプラーで取り込んだ既成曲の断片、ハウス由来のピアノの和音が乗る。歌は感情を込めて張り上げるより、気だるく投げやりに呟かれることが多い。歌詞は日常の断片、薬物体験、地元の風景、意味を成さない言葉遊びを扱う。服装も音の一部と見なされ、裾の広がったズボンや大きめの上着といった緩い装いが、音楽の緩さと対応していた。</p>
<h2>成り立ち</h2><p>舞台はイングランド北西部の工業都市マンチェスターである。1970年代の脱工業化によって職を失い荒廃したこの街で、テレビ司会者のTony Wilsonらが1978年にFactory Recordsを設立し、1982年にはその資金でThe Haçiendaというクラブを開いた。当初は客が入らず莫大な赤字を出し続けたが、1986年から1988年にかけてシカゴ由来のハウスとアシッドハウスがイギリスへ流入し、そこにエクスタシーの流行が重なると、状況は一変する。踊るために集まった若者と、ギターを弾いていた若者が同じ場所に居合わせたことが、この音楽を生んだ直接の条件だった。中心となったのはThe Stone RosesとHappy Mondaysである。前者は1989年のデビュー作で、Reniによる異様に滑らかなドラムと、John Squireの色彩豊かなギター、Ian Brownの気だるい歌を組み合わせ、批評と売り上げの両方で成功した。後者は1988年の作品をMartin Hannettの制作で発表した後、1990年にはロンドンのDJであるPaul Oakenfoldを迎え、ダンス音楽の作法を全面的に導入した。Shaun Ryderの支離滅裂な歌詞と、楽器を演奏せずただ踊るだけのBezの存在は、この一群の反権威的な気風を象徴していた。マッドチェスターという呼称は、1989年にHappy Mondaysが出した作品の題名に由来し、そこから報道が一斉に使い始めた。Inspiral Carpets、The Charlatans、808 Stateらが続き、1990年5月にThe Stone Rosesがスパイク島で行った約2万7000人規模の野外公演は、世代の記念碑として語られる一方、音響が劣悪で何も聞こえなかったという証言も多い。終焉は早かった。The Haçiendaは麻薬の売買をめぐる暴力団の抗争の場となり、銃器の持ち込みと刺傷事件が相次いだ末に1997年に閉店する。Factory Recordsはクラブの赤字とレコードの制作費に耐えられず1992年に倒産した。The Stone Rosesは所属レーベルとの訴訟で数年を空費し、復帰作を出した頃には時代が去っていた。それでもこの数年間が残した、ダンス音楽とバンドの垣根を取り払うという発想は、その後のブリットポップやビッグビート、さらに現在のインディーロックにまで引き継がれている。</p>
