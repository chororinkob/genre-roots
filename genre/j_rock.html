<h1>J-Rock（ジェイロック）とは</h1>
<p>「J-ROCK」は1990年代にマーケット用語として使われたが、J-POPと違って日本では浸透しなかった。一般的な呼称は「日本のロック」や「邦ロック」である。英語圏のロックとは異なる独自の性格を持つ。 旋律と和声（コードの響き）に</p>
<p>「J-ROCK」は1990年代にマーケット用語として使われたが、J-POPと違って日本では浸透しなかった。一般的な呼称は「日本のロック」や「邦ロック」である。英語圏のロックとは異なる独自の性格を持つ。

旋律と和声（コードの響き）にも特徴がある。日本語は1音節あたりの情報量が少ない(研究ではベトナム語の49%)。同じ内容を伝えるのに音節数が多く必要なので、細かい音符で詰め込む書き方が発達した。日本のポピュラー音楽では、終盤のサビでの転調（調を変えること）が定番技法とされる。

曲構成は、イントロ、Aメロ、Bメロ、サビ、間奏などからなる型が多い。Cメロや大サビを置く構成もある。

歌詞は青春、葛藤、社会への違和感、そして日常の心情を扱う。

TVアニメ主題歌は放送枠(約89秒)の制約を受ける。</p>
<h2>成り立ち</h2><p>日本のロックの起点には諸説ある。グループ・サウンズ期(1960年代後半)やロカビリー(1950年代末)、加藤和彦の言う1968年、1972年のキャロル説などがある。

1960年代半ばには、若者の楽器演奏が一気に広まった。1962年に初来日し、1965年1月の2回目の公演から人気に火がついたThe Venturesによるエレキ・ブームがあった。そして1966年には、The Beatlesの日本武道館公演があった。この時期にグループ・サウンズと呼ばれる流れが生まれ、ザ・スパイダース、ザ・タイガースらが人気を得た。多くは歌謡曲の作家が曲を書く仕組みだった。それでも、ザ・スパイダースのかまやつひろしのように自作曲を手がける例や、自作自演を志向するグループもあった。

1970年前後、日本語でロックを歌えるかという論争が起きる。内田裕也らの英語派は、日本語とロックの結びつきに成功したとは思わないと批判した。これに対し、はっぴいえんどの大瀧詠一、細野晴臣、松本隆、鈴木茂は、日本語の語感を活かした独自の歌唱と作詞で、実際の作品で応えた。1971年11月のアルバム風街ろまんは論争を沈静化させた作品と評価される。ただし、1972年のキャロルの成功で論争が問題外になったとする見方もある。

1970年代前半（1972年）にキャロルが、後半（1978年）にサザンオールスターズが登場した。1980年代には、BOØWY、RCサクセションが、より広い層へロックを届けた。

1980年代末から1990年代前半にかけて、いわゆるバンド・ブームが起こった。テレビ番組イカ天は、すでに広がっていたバンド人気を加速させ、多くのバンドのメジャーデビューのきっかけになった。1990年代には、ミスターチルドレン、スピッツ、ブランキー・ジェット・シティ、そしてビジュアル系の一群が並行して活動した。

2000年代前半には、ASIAN KUNG-FU GENERATIONはアニメとの結び付きを通じて若年層に広がった。BUMP OF CHICKENはドラマ挿入歌『天体観測』(2001年)などで支持を広げ、アニメ映画のタイアップは2003年からだった。RADWIMPSは2001年結成・2005年メジャーデビューで、アニメ映画との結び付きは2016年の『君の名は。』以降に強まった。

2010年代以降は、ONE OK ROCKが海外での活動を本格化させた。また、YouTubeやフェス出演を通じて、BABYMETALやBAND-MAIDが海外で支持を広げた。近年は、King Gnuのようなバンドや、Vaundyのような個人のアーティストや、Adoのような歌い手など、ロックの枠を超えて音楽全般を横断する存在が目立っている。</p>
