<h1>J-Rock（ジェイロック）とは</h1>
<p>日本のロックの総称で、英語圏のロックとは異なる独自の性格を持つ。最大の違いは旋律と和声にあり、日本語の歌詞を乗せるため一音符あたりの情報量が多くなり、細かい符割りで言葉を詰め込む書法が発達した。和声はロックの三和音にとどまらず、歌</p>
<p>日本のロックの総称で、英語圏のロックとは異なる独自の性格を持つ。最大の違いは旋律と和声にあり、日本語の歌詞を乗せるため一音符あたりの情報量が多くなり、細かい符割りで言葉を詰め込む書法が発達した。和声はロックの三和音にとどまらず、歌謡曲やJ-POPと共通する複雑な進行、とりわけ短調で始まり長調へ抜ける循環や、最後のサビでの転調が頻繁に用いられる。曲構成もイントロ、Aメロ、Bメロ、サビ、間奏、Dメロという型が浸透しており、四分から五分の中で複数回の起伏を作る。演奏面では技術水準が高く、ギターのソロやベースの動きが緻密に書かれ、即興よりも構築が重視される。音の作りは中高音域の明瞭さを優先し、歌が常に前に出るよう調整される。歌唱は高音域を張る力強い発声が好まれ、感情を抑えない直接的な表現が選ばれる。歌詞は青春、葛藤、社会への違和感、そして日常の心情を扱い、比喩よりも直截な言葉が使われることが多い。アニメやドラマの主題歌としての結び付きが強く、それが構成上の制約にもなっている。</p>
<h2>成り立ち</h2><p>出発点は1960年代半ばで、1962年に来日したThe Venturesによるエレキ・ブーム、そして1966年のThe Beatlesの日本武道館公演が、若者の楽器演奏を一気に広めた。この時期にグループ・サウンズと呼ばれる潮流が生まれ、ザ・スパイダース、ザ・タイガースらが人気を得たが、多くは歌謡曲の作家が曲を書く体制であり、自作自演には至らなかった。1970年前後、日本語でロックを歌えるかという論争が起きる。内田裕也らは日本語では成立しないと主張し、はっぴいえんどの大瀧詠一、細野晴臣、松本隆、鈴木茂は、日本語の語感を活かした独自の歌唱と作詞で実践的に反論した。1971年のアルバム風街ろまんは、この論争に事実上の決着をつけた作品とされる。1970年代後半にはキャロルや、サザンオールスターズが登場し、1980年代にはBOØWY、RCサクセションが、より広い層へロックを届けた。1980年代末から1990年代前半にかけて、いわゆるバンド・ブームが起こり、テレビ番組イカ天が素人バンドを紹介したことにより、爆発的な数のバンドが生まれた。1990年代にはミスターチルドレン、スピッツ、ブランキー・ジェット・シティ、そしてビジュアル系の一群が並行して活動した。2000年代前半には、ASIAN KUNG-FU GENERATION、BUMP OF CHICKEN、RADWIMPSといったバンドが、アニメとの結び付きを通じて若年層に広がった。2010年代以降は、ONE OK ROCKが海外での活動を本格化させ、また動画共有サイトを経由してBABYMETALやBAND-MAIDが国外で予想外の支持を得た。近年はKing Gnu、Vaundy、Adoのように、ロックの枠を超えて音楽全般を横断する作家が主流を占めている。</p>
