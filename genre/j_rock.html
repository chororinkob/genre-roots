<h1>J-Rock（ジェイロック）とは</h1>
<p>日本のロックを指す呼び名で（1990年代にマーケット用語として使われたが、日本ではあまり浸透せず、一般には「日本のロック」や「邦ロック」と呼ばれる）、英語圏のロックとは異なる独自の性格を持つとされる。旋律と和声（コードの響き）にも</p>
<p>日本のロックを指す呼び名で（1990年代にマーケット用語として使われたが、日本ではあまり浸透せず、一般には「日本のロック」や「邦ロック」と呼ばれる）、英語圏のロックとは異なる独自の性格を持つとされる。旋律と和声（コードの響き）にも特徴があり、日本語は1音節あたりの情報量が少なく（研究ではベトナム語の49％）、同じ内容を伝えるのに音節数が多く必要なので、細かい音符で言葉を詰め込む書き方が発達した。和声では、最後のサビでの転調（調を変えること）が、日本のポピュラー音楽の定番の技法とされる。曲構成もイントロ、Aメロ、Bメロ、サビ、間奏などからなる型が多く、Cメロや大サビを置く構成もある。歌詞は青春、葛藤、社会への違和感、そして日常の心情を扱うものが多いが、はっぴいえんどの松本隆のように、ダブルミーニング（二つの意味を持たせる技法）などを駆使した歌詞もある。アニメやドラマの主題歌との結び付きが強く、テレビアニメの主題歌は放送枠（約89秒）の制約を受ける。</p>
<h2>成り立ち</h2><p>出発点には諸説があり（1950年代末のロカビリー、1960年代後半のグループ・サウンズ期、加藤和彦の言う1968年、1972年のキャロルのデビューなど）、その流れの一つとして、1962年に初来日し、1965年1月の2回目の公演から人気に火がついたThe Venturesによるエレキ・ブーム、そして1966年のThe Beatlesの日本武道館公演が、若者の楽器演奏を一気に広めた。この時期にグループ・サウンズと呼ばれる潮流が生まれ、ザ・スパイダース、ザ・タイガースらが人気を得たが、多くは歌謡曲の作家が曲を書く仕組みだったが、ザ・スパイダースのかまやつひろしのように自作曲を手がける例や、自作自演を志向するグループもあった。1970年前後、日本語でロックを歌えるかという論争が起きる。内田裕也らの英語派は、日本語とロックの結びつきに成功したとは思わないと批判し、はっぴいえんどの大瀧詠一、細野晴臣、松本隆、鈴木茂は、日本語の語感を活かした独自の歌唱と作詞で、実際の作品で応えた。1971年11月のアルバム風街ろまんは、この論争を沈静化させた作品と評価されるが、1972年のキャロルの成功で論争が問題外になったとする見方もある。1970年代前半（1972年）にキャロルが、後半（1978年）にサザンオールスターズが登場し、1980年代にはBOØWY、RCサクセションが、より広い層へロックを届けた。1980年代末から1990年代前半にかけて、いわゆるバンド・ブームが起こり、テレビ番組イカ天は、すでに広がっていたバンド人気を加速させ、多くのバンドのメジャーデビューのきっかけになった。1990年代にはミスターチルドレン、スピッツ、ブランキー・ジェット・シティ、そしてビジュアル系の一群が並行して活動した。2000年代前半には、ASIAN KUNG-FU GENERATIONがアニメとの結び付きを通じて、BUMP OF CHICKENがドラマ挿入歌『天体観測』（2001年）などで、それぞれ若年層に支持を広げ（BUMP OF CHICKENのアニメ映画のタイアップは2003年から）、RADWIMPSも2001年結成・2005年メジャーデビューで、アニメ映画との結び付きは2016年の『君の名は。』以降に強まった。2010年代以降は、ONE OK ROCKが海外での活動を本格化させ、またYouTubeやフェス出演を通じてBABYMETALやBAND-MAIDが海外で支持を広げた。近年はKing Gnuのようなバンドや、Vaundyのような個人のアーティスト、Adoのような歌い手など、ロックの枠を超えて音楽全般を横断する存在が目立っている。</p>
