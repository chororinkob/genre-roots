<h1>J-Rock（ジェイロック）とは</h1>
<p>日本のロックの総称で、英語圏のロックとは異なる独自の性格を持つ。最大の違いは旋律と和声（コードの響き）にあり、日本語の歌詞を乗せるため一音符あたりの情報量が多くなり、細かい音符の割り振りで言葉を詰め込む書き方が発達した。和声はロッ</p>
<p>日本のロックの総称で、英語圏のロックとは異なる独自の性格を持つ。最大の違いは旋律と和声（コードの響き）にあり、日本語の歌詞を乗せるため一音符あたりの情報量が多くなり、細かい音符の割り振りで言葉を詰め込む書き方が発達した。和声はロックの三和音にとどまらず、歌謡曲やJ-POPと共通する複雑な進行、とりわけ短調で始まり長調へ抜ける循環や、最後のサビでの転調（調を変えること）が頻繁に用いられる。曲構成もイントロ、Aメロ、Bメロ、サビ、間奏などからなる型が多く、Cメロや大サビを置く構成もあり、四分から五分の中で複数回の起伏を作る。演奏面では技術水準が高く、ギターのソロやベースの動きが緻密に書かれ、即興よりも組み立てが重視される。音の作りは中高音域の明瞭さを優先し、歌が常に前に出るよう調整される。歌唱は高音域を張る力強い発声が好まれ、感情を抑えない直接的な表現が選ばれる。歌詞は青春、葛藤、社会への違和感、そして日常の心情を扱い、比喩よりも率直な言葉が使われることが多い。アニメやドラマの主題歌としての結び付きが強く、それが構成上の制約にもなっている。</p>
<h2>成り立ち</h2><p>出発点は1960年代半ばで、1962年に初来日し、1965年1月の2回目の公演から人気に火がついたThe Venturesによるエレキ・ブーム、そして1966年のThe Beatlesの日本武道館公演が、若者の楽器演奏を一気に広めた。この時期にグループ・サウンズと呼ばれる潮流が生まれ、ザ・スパイダース、ザ・タイガースらが人気を得たが、多くは歌謡曲の作家が曲を書く仕組みだったが、ザ・スパイダースのかまやつひろしのように自作曲を手がける例や、自作自演を志向するグループもあった。1970年前後、日本語でロックを歌えるかという論争が起きる。内田裕也らの英語派は、日本語とロックの結びつきに成功したとは思わないと批判し、はっぴいえんどの大瀧詠一、細野晴臣、松本隆、鈴木茂は、日本語の語感を活かした独自の歌唱と作詞で、実際の作品で応えた。1971年のアルバム風街ろまんは、この論争に実質的な決着をつけた作品とされる。1970年代前半（1972年）にキャロルが、後半（1978年）にサザンオールスターズが登場し、1980年代にはBOØWY、RCサクセションが、より広い層へロックを届けた。1980年代末から1990年代前半にかけて、いわゆるバンド・ブームが起こり、テレビ番組イカ天が素人バンドを紹介したことにより、爆発的な数のバンドが生まれた。1990年代にはミスターチルドレン、スピッツ、ブランキー・ジェット・シティ、そしてビジュアル系の一群が並行して活動した。2000年代前半には、ASIAN KUNG-FU GENERATIONやBUMP OF CHICKENといったバンドが、アニメとの結び付きを通じて若年層に広がり、RADWIMPSも2001年結成・2005年メジャーデビューで、アニメ映画との結び付きは2016年の『君の名は。』以降に強まった。2010年代以降は、ONE OK ROCKが海外での活動を本格化させ、また動画共有サイトを経由してBABYMETALやBAND-MAIDが国外で予想外の支持を得た。近年はKing GnuやVaundyのような作家や、Adoのような歌い手など、ロックの枠を超えて音楽全般を横断する存在が目立っている。</p>
