<h1>Gregorian chant（グレゴリアン・チャント）とは</h1>
<p>グレゴリオ聖歌は、単声の旋律がラテン語の祈祷文に密着して進む聖歌であり、和音進行や強い拍で高揚を作る音楽ではなく、終止音と朗誦音を軸に旋法の輪郭をゆっくり浮かび上がらせる音楽である。基本は無伴奏のユニゾンで、器楽が前面に出ることは</p>
<p>グレゴリオ聖歌は、単声の旋律がラテン語の祈祷文に密着して進む聖歌であり、和音進行や強い拍で高揚を作る音楽ではなく、終止音と朗誦音を軸に旋法の輪郭をゆっくり浮かび上がらせる音楽である。基本は無伴奏のユニゾンで、器楽が前面に出ることはほとんどなく、声そのものが石造聖堂の残響を受けて長く尾を引く。リズムは拍節で刻むというよりラテン語のアクセントと句読に従う自由な流れで、速く歌われても舞曲のような推進力には向かわない。1音節1音のシラブル様式、2〜数音を乗せるネウマ様式、長い装飾を連ねるメリスマ様式が使い分けられ、独唱と斉唱が応じ合う応答詩篇唱、二つの合唱群が交代する交互詩篇唱、全員でまっすぐ進む直行唱が典礼内で機能を分ける。厚い和声や劇的な独唱で聴かせるオペラ、感情の山をコードで作る近代合唱やゴスペルとは異なり、音色の純度、息の長さ、語の聖性、空間との溶け合いそのものが聴きどころである。</p>
<h2>成り立ち</h2><p>グレゴリオ聖歌という名は教皇グレゴリウス1世に結びつくが、現代の研究では彼が現存する全レパートリーの作者だとは見なされていない。現在伝わる姿の中核は8〜10世紀のカロリング朝期、フランク人の住む西欧〜中欧で整えられ、古ローマ聖歌とガリア聖歌の融合を経て形成されたと考えられている。カール大帝は自領にローマ系典礼歌を導入し、各地の聖歌を統一する方針を進めた。メスのクロデガングのような教会改革者もその制度化に関わったとされる。もっとも、今日伝わるグレゴリオ聖歌は9世紀頃から16世紀頃まで長い時間をかけて成立したとみなされており、単一の年や単独の作者に還元できる音楽ではない。当初の伝承は口承が中心で、ミサと聖務日課のための曲は2,000曲を大きく超えていたが、長いあいだ書き留められていなかった。9世紀になると歌い回しのニュアンスを補助するネウマが発達し、のちに音高を示す4線譜と四角ネウマへ進み、さらに近代五線譜の成立にも連なった。レパートリーの内部では通常文のキリエ、グローリア、クレド、固有文のイントロイトゥスやグラドゥアーレが典礼の機能に応じて整理され、9〜16世紀に栄えた続唱の流れからは13世紀の「Dies irae」のような著名曲も現れた。こうした単旋律の蓄積は後のポリフォニー成立に決定的な土台を与えた。近代以降の大きな転機は19世紀後半のソレム修道院による復興である。初期写本の収集と校訂から『Paleographie Musicale』や『Liber usualis』へ至る流れが生まれ、1904年にはソレム系の校訂を基盤とするバチカン版が委嘱された。一方でリズム解釈をめぐってメディチェア版や計量的な読みと対立し、論争も絶えなかった。20世紀にはドム・ウジェーヌ・カルディーヌがセミオロジー研究で古ネウマの意味を読み直し、フレール・コロンバ・ケリーのような実践家も自然な語勢に基づく歌唱を追求した。第2バチカン公会議後は典礼での独占的地位を失ったが、ローマ教会はなお典礼に最もふさわしい音楽と位置づける。さらに1994年、ベネディクト会サント・ドミンゴ・デ・シロス修道院のアルバム『Chant』がBillboard 200で3位、ダブル・プラチナに達し、祈りの実用音楽であった聖歌が世界的な聴取対象として再浮上した。</p>
