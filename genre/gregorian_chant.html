<h1>Gregorian chant（グレゴリアン・チャント）とは</h1>
<p>グレゴリオ聖歌は、単声の旋律がラテン語の祈祷文に密着して進む聖歌だ。和音進行や強い拍で気分を盛り上げる音楽ではない。終止音（旋律が落ち着く音）と朗誦音（祈りの言葉を唱える中心の音）を軸に、旋法（音階の型）の輪郭をゆっくり浮かび上が</p>
<p>グレゴリオ聖歌は、単声の旋律がラテン語の祈祷文に密着して進む聖歌だ。和音進行や強い拍で気分を盛り上げる音楽ではない。終止音（旋律が落ち着く音）と朗誦音（祈りの言葉を唱える中心の音）を軸に、旋法（音階の型）の輪郭をゆっくり浮かび上がらせる音楽である。

基本は、伴奏のないユニゾン（全員が同じ旋律を歌うこと）だ。楽器が前面に出ることはほとんどない。声そのものが石造りの聖堂の残響を受けて、長く尾を引く。

リズムについては、再構成されたリズムをめぐって現在も議論が続いている。ソレム学派は、ラテン語のアクセントと句読に従う自由な流れとする。速く歌われても、舞曲のような推進力には向かわない。

旋律の付け方は三つに分かれ、使い分けられる。1音節に1音をあてるシラブル型、2〜数音を乗せるネウマ型、1音節に長い装飾的な旋律を連ねるメリスマ型だ。

歌い方の形にも、三つある。独唱と斉唱が応じ合う応答詩篇唱、二つの合唱群が交代する交互詩篇唱、全員でまっすぐ進む直行唱だ。これらが典礼（教会の儀式）の中で、役割を分ける。

厚い和声や劇的な独唱で聴かせるオペラとは異なる。感情の山をコードで作る近代合唱やゴスペルとも異なる。音色の純度、息の長さ、語の聖性、空間との溶け合いそのものが、聴きどころである。</p>
<h2>成り立ち</h2><p>グレゴリオ聖歌という名は、教皇グレゴリウス1世に結びつく。しかし現代の研究では、彼が現存する全レパートリーの作者だとは見なされていない。

現在伝わる姿の中核は、750年頃以降のカロリング朝下で形成が始まった。フランク人の住む西欧〜中欧で整えられ、古ローマ聖歌とガリア聖歌の融合を経て形成されたと考えられている。ピピン3世とメスのクロデガングの時代に、ローマ典礼と聖歌の導入が始まった。カール大帝がそれを継承・推進して、各地の聖歌を統一する方針を進めた。もっとも、グレゴリオ聖歌は主に9〜10世紀にフランク人地域で発展し、のちに追加・改訂があったとされる。単一の年や単独の作者に還元できる音楽ではない。

当初の伝承は口承が中心だった。ミサと聖務日課のための曲は2,000曲を超えていたとされるが、長いあいだ書き留められていなかった。9世紀になると、歌い回しのニュアンスを補助するネウマが発達した。のちに音高を示す4線譜と四角ネウマへ進み、さらに近代五線譜の成立にも連なった。

レパートリーの内部では、通常文のキリエ、グローリア、クレド、固有文のイントロイトゥスやグラドゥアーレが、典礼の機能に応じて整理された。9〜16世紀に栄えた続唱の流れからは、13世紀の「Dies irae」のような著名曲も現れた。聖歌を定旋律とするオルガヌムが、後のポリフォニー（複数の旋律を同時に重ねる音楽）、すなわち西洋多声音楽の初期段階となった。

近代以降の大きな転機は、19世紀後半のソレム修道院による復興である。初期写本の収集と校訂から、『Paléographie musicale』(1889年にソレムが刊行開始)や『Liber usualis』へ至る流れが生まれた。1904年、ピウス10世がPothierを委員長とする委員会に公式版の編纂を命じた。委員会はPothierの旧著を基にし、ソレム修道院は途中で離脱した。

ソレムは、メディチェア版(1614〜15年刊)を土台とするPustet版(ラティスボン版、1860年代末〜1871年刊。教皇庁の承認を重ねて事実上の公式版となった)の旋律の真正性を批判して、写本研究を進めた。リズムでは、計量的解釈の立場とも論争した。

20世紀には、ドム・ウジェーヌ・カルディーヌがセミオロジー研究で古ネウマの意味を読み直した。コロンバ・ケリー神父(Fr. Columba Kelly, OSB)のような実践家も、自然な語勢に基づく歌唱を追求した。

第2バチカン公会議後は、他の音楽がより広く用いられるようになった。しかしローマ教会はなお、ローマ典礼に特にふさわしいと認め、他の条件が同等なら「第一の席(pride of place)」を与えるべきとしている。

さらに1994年、ベネディクト会サント・ドミンゴ・デ・シロス修道院のアルバム『Chant』が、Billboard 200で3位、ダブル・プラチナに達した。祈りの実用音楽であった聖歌が、世界的な聴取対象として再浮上した。</p>
