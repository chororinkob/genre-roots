<h1>Chillwave（チルウェーブ）とは</h1>
<p>チルウェイヴは、2000年代末に現れた電子ポップだ。記憶の中の音楽を再現しようとするような、ぼんやりかすんだ手触りを持つ。 音の元になるのは、1980年代のシンセサイザーの音色やディスコの断片などだ。これらは、速度を落としたり、フ</p>
<p>チルウェイヴは、2000年代末に現れた電子ポップだ。記憶の中の音楽を再現しようとするような、ぼんやりかすんだ手触りを持つ。

音の元になるのは、1980年代のシンセサイザーの音色やディスコの断片などだ。これらは、速度を落としたり、フィルターで高い音を削ったりして、原型を曖昧にされる。制作は、ソフトウェア中心の自宅制作が多い。

和音は、長調・短調のダイアトニックを使う。そのなかに、どこか物悲しい響きが含まれるように作られる。

リズムは、眠たげなドラムパターンや、ヴィンテージのドラムマシンで作られる。テンポは低〜中程度で、穏やかである。

歌は入るが、音量を絞って、全体の中へ沈められる。歌声は、部分的にぼやけたり、かすんだりしている。

曲全体の特徴として、重要なもののひとつは、音の劣化をわざと作り出す点だ。カセットテープの走行の乱れで生じる音程のふらつきを模倣した揺れが、全体に薄くかけられる。この不安定な揺れが、はっきり思い出せない過去を聴いているという感覚を生む。残響は極めて深くかけられ、全ての音が霧の向こうで鳴っているように処理される。

夏の終わり、少年期の郊外の風景、失われた休暇といった具体的な情景を喚起する。単なる音響実験ではなく、強い情緒を持つ音楽である。</p>
<h2>成り立ち</h2><p>2009年、アメリカの匿名の風刺ブログが、半ば冗談で一つの言葉を作った。この呼称は、音楽家が名乗ったものではない。

当時のインターネットでは、個人が運営する音楽ブログが、新しい音楽を見つけて名前を与える文化が盛んだった。この語は同じ年の夏にブログの世界で広まり、2010年には主流メディアも取り上げた。名づけられた側の作り手たちは、多くが最初は不満を示した。それでも、定着を止めることはできなかった。

中心となったのは、主に3人である（これにMemory Tapesなどを加える見方もある）。まず、Ernest Greeneである。図書館情報学の学位を取ったあと職がなく、ジョージア州の実家に戻って音楽を作っていた。Washed Out名義で2009年に出した楽曲は短期間で広まり、のちにアメリカのテレビ番組の主題歌になって、広く知られた。次に、メキシコ生まれでテキサス育ちのAlan Palomoだ。Neon Indianとして、より鮮やかで壊れかけた電子音の作品を出した。最後に、サウスカロライナ州のChaz Bundick(現在はChaz Bear名義)である。Toro y Moi名義で、より音楽的に洗練された方向を追った。

三者に共通していたのは、制作の条件である。大手のレコード会社を通さず、自室で録音したものをインターネットに置き、まもなくインディーレーベルと契約した。

背景について、批評家は二つの点を指摘している。ひとつは2008年の金融危機だ。就職先を失った若い世代が、実家の自室で過去を懐かしみながら音楽を作る状況が、現実にあった。もうひとつは、ちょうどこの頃、1980年代に幼少期を過ごした世代が20代前半〜半ばになり、自分の記憶そのものを素材にする段階に入っていたことである。

同じ2009年には、音楽評論家のDavid Keenanが、記憶の中の大衆文化を再構成する音楽を指して、ヒプナゴジック・ポップという語を出した。この二つの呼称は、重なる部分のある別の概念である。

流行としては、2011年前後に急速に沈静化した。ブログ文化の衰退とともに流行語としては衰えたが、ジャンル名としては、回顧的に今も使われている。しかし、その美学は直後に現れたヴェイパーウェイヴへ引き継がれた。さらに、現在のローファイ・ヒップホップや、記憶と郷愁を主題とするインターネット音楽の広い流れにも、影響したとする見方もある。</p>
