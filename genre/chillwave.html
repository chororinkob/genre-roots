<h1>Chillwave（チルウェーブ）とは</h1>
<p>2000年代末に現れた、記憶の中の音楽を再現しようとするような、霞んだ質感の電子ポップである。最も重要な特徴は音の劣化を意図的に作り出す点にあり、カセットテープの走行の乱れによって生じる音程のふらつきを模倣した揺れが、全体に薄くか</p>
<p>2000年代末に現れた、記憶の中の音楽を再現しようとするような、霞んだ質感の電子ポップである。最も重要な特徴は音の劣化を意図的に作り出す点にあり、カセットテープの走行の乱れによって生じる音程のふらつきを模倣した揺れが、全体に薄くかけられる。この不安定な揺れが、はっきり思い出せない過去を聴いているという感覚を生む。音源には1980年代のシンセサイザーの音色、柔らかいロックやディスコの断片、テレビ番組の音楽などが用いられ、速度を落としたりフィルターで高域を削ったりして原型を曖昧にする。残響は極めて深くかけられ、全ての音が霧の向こうで鳴っているように処理される。リズムは打ち込みの単純な四つ打ちや、緩く跳ねたパターンが中心で、テンポは90から115 BPM程度と穏やかである。歌は入るが、音量を絞って全体の中へ沈められ、歌詞は聞き取れないことが前提となっている。和声は明るい長調でありながら、どこか物悲しい響きを含むよう設計される。制作は寝室のパソコン一台で完結し、専門的な機材も演奏技術も必要としない。夏の終わり、少年期の郊外の風景、失われた休暇といった具体的な情景を喚起する点で、単なる音響実験ではなく強い情緒を持つ音楽である。</p>
<h2>成り立ち</h2><p>この呼称は音楽家が名乗ったものではなく、2009年にアメリカの匿名の音楽ブログが、半ば冗談として作った造語である。当時のインターネットでは、個人が運営する音楽ブログが新しい音楽を発見し名前を与えるという文化が最盛期にあり、この語も数週間のうちに広まった。名づけられた側の作り手たちは概ねこの呼称を嫌ったが、定着を止めることはできなかった。中心となったのは三人である。ジョージア州の田舎町で図書館情報学を学びながら音楽を作っていたErnest Greeneは、Washed Out名義で2009年に発表した楽曲が短期間で拡散し、後にアメリカのテレビ番組の主題歌に採用されて広く知られた。テキサス州出身のAlan PalomoはNeon Indianとして、より鮮やかで壊れかけた電子音による作品を発表し、サウスカロライナ州のChaz BundickはToro y Moi名義で、より音楽的に洗練された方向を追求した。三者に共通していたのは、大手のレコード会社も高価な機材も介さず、自室で録音したものを直接インターネットに置いたという制作条件である。背景には二つの事情がある。ひとつは2008年の金融危機で、就職先を失った若い世代が、実家の自室で過去を懐かしみながら音楽を作るという状況が現実に存在した。もうひとつは、ちょうどこの頃、1980年代に幼少期を過ごした世代が20代後半に差しかかり、自分の記憶そのものを素材化する段階に入っていたことである。音楽評論家David Keenanが同じ2009年に、記憶の中の大衆文化を再構成する音楽を指してヒプナゴジック・ポップという語を提示しており、この二つの呼称はほぼ同じ現象を別の角度から捉えたものだった。流行としてはわずか二、三年で沈静化し、ブログ文化の衰退とともに語自体も使われなくなる。しかしその美学は直後に現れたヴェイパーウェイヴへ引き継がれ、さらに現在のローファイ・ヒップホップや、記憶と郷愁を主題とするインターネット音楽の広い流れの中に、はっきりと痕跡を残している。</p>
