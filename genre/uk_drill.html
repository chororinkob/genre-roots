<h1>UK Drillとは</h1>
<p>2010年代にロンドンで発達した、極めて暗く簡素なヒップホップである。アメリカのシカゴで生まれたドリルを出発点としながら、リズムの構造がイギリス独自のものへ作り替えられている点が決定的である。テンポは表記上140 BPM前後だが、</p>
<p>2010年代にロンドンで発達した、極めて暗く簡素なヒップホップである。アメリカのシカゴで生まれたドリルを出発点としながら、リズムの構造がイギリス独自のものへ作り替えられている点が決定的である。テンポは表記上140 BPM前後だが、スネアを三拍目に置く構えを取るため、体感は半分の重さとなる。この分野を一瞬で識別させるのは低音の扱いで、808系の長く伸びる音を、鳴っている最中に音程を滑らかに上下させる。この滑走する低音が、旋律の役割と打楽器の役割を同時に担う。刻みも独特で、細かい高音の分割が均等ではなく、拍の裏へ跳ねるように配置される。この跳ねはUKガラージやグライムといったイギリス固有のダンス音楽から受け継がれたもので、アメリカのドリルにはない足取りを生む。上物は極端に少なく、不吉な短調のシンセの単音、あるいは弦楽を模した音がひとつ置かれる程度で、和声はほとんど動かない。全体の音数が少なく、隙間が多い。ラップの発声は感情を排し、低く抑えた口調で淡々と語られる。歌詞は地区の対立、警察、貧困、そして日常化した暴力を、俗語と隠語によって描く。</p>
<h2>成り立ち</h2><p>2012年前後、シカゴ南部で生まれたドリルは、暴力を淡々と語る歌詞と、極端に暗く簡素な伴奏によって、アメリカのヒップホップに衝撃を与えていた。この音源が動画共有サイトを通じてロンドンへ届く。ロンドン南部の若者たちは、この形式が自分たちの置かれた状況を語るのに適していると直感した。ただし彼らはアメリカの音をそのまま模倣したのではなく、自分たちが慣れ親しんだイギリスのダンス音楽の跳ねたリズム感覚を持ち込み、まったく別の躍動を作り上げたのである。2014年前後から、ロンドン南部の地区ごとに集団が形成され、動画共有サイトに簡素な映像とともに作品を投稿する形で急速に広まった。制作者ではM1OnTheBeatやAXL Beatsが、低音を滑走させる手法を確立している。この分野は当初から深刻な社会問題と結びついてきた。ロンドンでは若者による刺傷事件が増加しており、この音楽がその原因であるという主張が、警察と一部の報道によって繰り返された。実際に警察の要請で数百本の動画が削除され、演者に対して特定の楽曲の演奏を禁じる裁判所の命令が出される事態にまで至っている。2019年には、命令に違反して自らの楽曲を演奏した二人の演者に執行猶予付きの判決が下された。これは音楽の演奏そのものが刑事罰の対象となる異例の事態であり、表現の自由をめぐる重大な問題として議論を呼んだ。擁護する側は、この音楽は暴力を作り出しているのではなく、既に存在する現実を記録しているにすぎず、原因は貧困と行政の失敗にあると主張する。2019年から2020年にかけて、ロンドンの制作者の伴奏がニューヨークのブルックリンへ渡り、Pop Smokeを中心とする新しい潮流を生んだ。彼は2020年に射殺されている。現在、Central Ceeらが国際的な成功を収め、この音楽はイギリス発の最大の輸出品のひとつとなっている。</p>
