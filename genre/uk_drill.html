<h1>UK Drillとは</h1>
<p>2010年代にロンドンで発達した、とても暗く簡素なヒップホップだ。アメリカのシカゴで生まれたドリルを出発点にしながら、リズムの構造をイギリス独自のものへ作り替えた点が決め手になっている。 テンポは表記上140 BPM前後だが、体感</p>
<p>2010年代にロンドンで発達した、とても暗く簡素なヒップホップだ。アメリカのシカゴで生まれたドリルを出発点にしながら、リズムの構造をイギリス独自のものへ作り替えた点が決め手になっている。

テンポは表記上140 BPM前後だが、体感ではテンポが半分のように重く感じられる。このハーフタイム感そのものは、トラップと共通である。スネアは、2小節ごとに3拍目ではなく4拍目に来る。

この分野をひと聴きで見分けさせるのは、低音の扱いだ。「808」というドラムマシン由来の長く伸びる低音を、鳴っている最中に、音の高さを滑らかに上下させる。この滑る低音が、旋律の役割と打楽器の役割を同時に受け持つ。

刻みも独特で、ハイハットは3+3+2の跳ねるパターンである。この跳ねは、グライムを中心に、UKガラージやロード・ラップの影響も受けたものだ。それが、アメリカのドリルにはない足取りを生む。

メロディーは、暗い旋律（ピアノ、弦、ベルなど）を、少ない音数で繰り返し置くことが多い。全体の音数が少なく、隙間が多い。

ラップの声は感情を抑え、低い口調で淡々と語られる。歌詞は、地区どうしの対立、警察、貧困、そして日常になった暴力を、俗語と隠語で描く。</p>
<h2>成り立ち</h2><p>出発点は、アメリカのシカゴだ。2010年ごろにシカゴ南部で生まれ、2012年に全国的に注目されたドリルは、暴力を淡々と語る歌詞と、とても暗く簡素な伴奏で、アメリカのヒップホップに衝撃を与えていた。

この音源が、動画共有サイトを通じてロンドンへ届く。ロンドン南部の若者たちのもとで、すでにあったロード・ラップの流れに、シカゴ・ドリルの美学が結びついた。ただし彼らは、アメリカの音をそのまま真似たのではない。自分たちが慣れ親しんだイギリスのダンス音楽の跳ねたリズム感覚を持ち込み、まったく別の躍動を作り上げたのである。

UKドリルは、2012〜2013年ごろに南ロンドンで始まったとされる。2014年前後には67が注目を集めた。地区ごとに集団ができ、動画共有サイトに簡素な映像とともに作品を投稿する形で、急速に広まった。Carns HillやQUIETPVCKは、初期を代表する制作者である。AXL Beatsはグライム由来の808について語り、ブルックリン向けにも活動を広げた。

一方で、この分野は当初から深刻な社会問題と結びついてきた。ロンドンでは若者による刺傷事件が増えており、この音楽がその原因だという主張が、警察と一部の報道によって繰り返された。実際に、警察の要請で数百本の動画が削除された。歌詞の内容（対立グループへの言及など）を理由に演奏・配信を制限する命令や、警察の許可制を課す命令も出された。

2019年には、ギャング差止命令に違反して自分たちの曲を演奏した2人の演者に、執行猶予付きの禁錮刑の判決が下された。曲の演奏で禁錮刑が出たのは英国法史上初とされる異例の事態で、表現の自由をめぐる重大な問題として議論を呼んだ。擁護する側は、この音楽は暴力を作り出しているのではなく、すでにある現実を記録しているにすぎないと主張する。原因は貧困と行政の失敗にある、というのである。

それでも音は海を渡った。ブルックリン・ドリルは2014年ごろにシカゴ・ドリルの影響の下で始まり、2016〜17年にAXL BeatsらUKの制作者のビートを取り入れて、22GzやSheff Gらの曲で独自の音を固めた。2019年にはPop Smokeが、それを主流へ広めた。彼は2020年に射殺されている。

現在は、Central Ceeらが国際的な成功を収め、この音楽はアイルランドやオランダ、オーストラリアなどにも広がっている。</p>
