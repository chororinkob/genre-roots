<h1>Delta Blues（デルタブルース）とは</h1>
<p>デルタブルースは、ミシシッピ州北西部、ミシシッピ川とヤズー川に挟まれた広大な綿花地帯「ミシシッピ・デルタ」の労働の中から生まれた、最も古い部類に入るブルースのスタイルの一つだ。後のロックやシカゴ・ブルースなどの源流のひとつに位置す</p>
<p>デルタブルースは、ミシシッピ州北西部、ミシシッピ川とヤズー川に挟まれた広大な綿花地帯「ミシシッピ・デルタ」の労働の中から生まれた、最も古い部類に入るブルースのスタイルの一つだ。後のロックやシカゴ・ブルースなどの源流のひとつに位置する音楽である。

主役はギターやハーモニカで、編成は少人数だ。録音ではギター1本と自分の声だけの弾き語りも多い。ただ、実際の演奏は複数人で行うほうが一般的だった。弾き語りの独奏を重視する見方もある。

特徴的な奏法の一つは「スライドギター(ボトルネック奏法)」だ。ガラス瓶の首を折ったものや金属の筒を、たいていは左手の指にはめる。それをフレットで押さえず、弦に軽く当てたまま滑らせる。すると、西洋音楽の半音（ピアノの隣り合う鍵盤の差）の枠に収まらない、滑らかな音程変化が生まれる。この人の泣き声のようにうねる音色が、歌声と会話するように交互に鳴らされる。

テンポは曲によって幅がある。同じ短い型を繰り返しながら、情念を掘り下げていく。Patton などでは、演奏はきっちりした小節数（決まった長さのまとまり）に収まらない曲も多い。歌い手が感情の赴くままに小節を伸び縮みさせるためだ。

歌われるのは、貧困、失恋、放浪、孤独といった人生の重みである。

当時の録音環境と、80年以上経た盤の劣化によるノイズと歪みも相まって、遠い時代から幽霊の声が届いているような、独特の生々しさを持つ。</p>
<h2>成り立ち</h2><p>20世紀の変わり目には、すでに何らかの形で存在していたとされる。最初期の録音が残る1920年代から30年代にかけて、ミシシッピ・デルタ地域で綿花栽培に従事していたアフリカ系アメリカ人の間で広がった。奴隷制廃止後もなお、小作人として過酷な労働と人種差別に縛られていた人々の生活が、その音楽的土壌である。

中心にいたのが、Charley Pattonだ。「デルタブルースの父」と呼ばれ、「Pony Blues」(1929)などの録音を残した。ギターを背中に回して弾くといった派手なパフォーマンスでも知られ、Hendrix らに影響したと推測する論者もいる。Son Houseは、伝道師と演奏家の間で葛藤しながら、激しい情念を叩きつけるようなスライド奏法で強い影響を残した。

Robert Johnsonは、わずか29曲の録音を残し、1938年に27歳で謎の死を遂げた。彼は「深夜の十字路(クロスロード)で悪魔に魂を売り、ギターの腕を手に入れた」という伝説とともに語られる。この伝説は、もとは別のブルース歌手Tommy Johnsonの話とされ、「Cross Road Blues」の歌詞には悪魔は出てこない。それでも彼は、ブルース史上、最も有名な神話の一つを持つ人物となった。彼の「Cross Road Blues」(1936)は、後にEric Claptonが在籍したバンドCreamが、「Crossroads」の題で1968年にライブ録音してカバーした（アルバム『Wheels of Fire』所収）。これにより、世界的に知られることになる。

Skip Jamesは、ベントニア派の代表とする資料も多い（デルタ・ブルースの演奏家とする資料もある）。独特の高音のファルセットと不吉に響く短調の調弦で、他に類を見ない暗鬱な世界を作り上げた。

録音の場所は人によって異なる。Pattonは、1929年6月14日にリッチモンド(Gennett)で録音した。同年11〜12月と1930年5月28日にはグラフトンで、1934年1〜2月にはニューヨークで録音している。Son House(1930年)とSkip James(1931年)は、ウィスコンシン州グラフトンのParamount社で録音した。Robert Johnsonは、1936年11月23・26・27日にサンアントニオのGunter Hotel 414号室で録音した。1937年6月19〜20日には、ダラスの臨時スタジオ(508 Park Avenue、Vitagraph/Warner Bros.の建物)で録音した。臨時の場所で録音したのはJohnsonだけではない。いずれも当時の録音機材で、音質は決して良くない。

しかし1960年代、イギリスやアメリカの若い白人音楽家たちが、これらの古いレコードを発掘・再評価した。これをきっかけに、忘れられかけていたデルタブルースは、ロックの源流の一つとされるようになった。</p>
<h2>代表曲</h2><ul><li>Devil Got My Woman (Skip James)</li><li>Hard Time Killing Floor Blues (Skip James)</li><li>Death Letter (Son House)</li><li>Terraplane Blues (Robert Johnson)</li><li>Walkin' Blues (Robert Johnson)</li><li>Pony Blues (Charley Patton)</li><li>Hellhound on My Trail (Robert Johnson)</li><li>High Water Everywhere (Charley Patton)</li><li>Fixin' to Die Blues (Bukka White)</li><li>Love in Vain (Robert Johnson)</li><li>Big Road Blues (Tommy Johnson)</li><li>Preachin' the Blues (Son House)</li></ul>
