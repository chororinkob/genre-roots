<h1>Delta Blues（デルタブルース）とは</h1>
<p>ミシシッピ川流域の広大な綿花地帯「ミシシッピ・デルタ」の労働の中から生まれた、ブルースの最も原始的で剥き出しの形。アコースティックギター1本と自分の声だけという最小限の編成で、貧困、失恋、放浪、孤独といった人生の重みを歌う。最大の</p>
<p>ミシシッピ川流域の広大な綿花地帯「ミシシッピ・デルタ」の労働の中から生まれた、ブルースの最も原始的で剥き出しの形。アコースティックギター1本と自分の声だけという最小限の編成で、貧困、失恋、放浪、孤独といった人生の重みを歌う。最大の特徴は「スライドギター(ボトルネック奏法)」で、ガラス瓶の首を折ったものや金属の筒を左手の指にはめ、弦を押さえずに滑らせることで、西洋音楽の半音の枠に収まらない滑らかな音程変化を生み出す。この人の泣き声のようにうねる音色が、歌声と会話するように交互に鳴らされる。演奏はきっちりした小節数に収まらないことも多く、歌い手が感情の赴くままに小節を伸び縮みさせる。テンポはゆったりで、同じ短い型を繰り返しながら情念を掘り下げていく。当時の劣悪な録音環境が残したノイズと歪みも相まって、遠い時代から幽霊の声が届いているような、独特の生々しさを持つ。後のロック、ソウル、あらゆるポピュラー音楽の最も深い根に位置する音楽である。</p>
<h2>成り立ち</h2><p>1920年代から30年代にかけて、ミシシッピ・デルタ地域で綿花栽培に従事していたアフリカ系アメリカ人の間で形成された。奴隷制廃止後もなお、小作人として過酷な労働と人種差別に縛られていた人々の生活が、その音楽的土壌である。Charley Pattonは「デルタブルースの父」と呼ばれ、「Pony Blues」(1929)などの録音を残すとともに、ギターを背中に回して弾くといった派手なパフォーマンスでも知られ、後のロックのステージ作法の原型ともされる。Son Houseは、伝道師と演奏家の間で葛藤しながら、激しい情念を叩きつけるようなスライド奏法で強い影響を残した。Robert Johnsonは、わずか29曲の録音を残して1938年に27歳で謎の死を遂げたが、「深夜の十字路(クロスロード)で悪魔に魂を売り、ギターの腕を手に入れた」という伝説とともに語られ、ブルース史上最も神話化された人物となった。彼の「Cross Road Blues」(1936)は、後にEric Claptonが在籍したバンドCreamによってカバーされ、世界的に知られることになる。Skip Jamesは、独特の高音のファルセットと不吉に響く短調の調弦で、他に類を見ない暗鬱な世界を作り上げた。これらの録音は、いずれも移動式の録音機材でホテルの一室などを臨時のスタジオとして急ぎ収録されたもので、音質は決して良くない。しかし1960年代、イギリスやアメリカの若い白人音楽家たちがこれらの古いレコードを発掘・再評価したことをきっかけに、忘れられかけていたデルタブルースは、ロック革命の理論的支柱として世界的に位置づけ直されることになった。</p>
<h2>代表曲</h2><ul><li>Devil Got My Woman (Skip James)</li><li>Terraplane Blues (Robert Johnson)</li><li>Pony Blues (Charley Patton)</li><li>Death Letter (Son House)</li></ul>
