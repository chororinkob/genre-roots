<h1>Miami Bass（マイアミベース）とは</h1>
<p>1980年代の米国フロリダ州マイアミで生まれた、超低音とテンポの速さを軸とするヒップホップの一派。BPMは120〜145とヒップホップとしては極端に速く、ダンスのための音楽として設計されている。中核はRoland TR-808のバ</p>
<p>1980年代の米国フロリダ州マイアミで生まれた、超低音とテンポの速さを軸とするヒップホップの一派。BPMは120〜145とヒップホップとしては極端に速く、ダンスのための音楽として設計されている。中核はRoland TR-808のバスドラムで、その減衰を極限まで長く伸ばして30Hz前後まで下げた音が、曲の間じゅう地面を揺らし続ける。この低音は自動車の大型スピーカーで鳴らすことを前提としており、車内で低音を競う文化と不可分に結び付いている。リズムはハイハットの細かい刻みと、裏拍で入るクラップが組み合わされ、シンコペーションの効いた跳ねる感触を作る。上物は少なく、単純なシンセの音型、サイレン、そして加工した声のサンプルが繰り返される。ラップは早口で、掛け合いや観客への呼びかけが多用され、内容は性的な話題、パーティー、そして踊りの指示が中心。歌詞の露骨さはしばしば法的な争いを招いた。曲構成はDJがミックスしやすい長いイントロと反復するフックを持ち、クラブやカーステレオでの連続再生を想定している。北部のヒップホップの内省や社会批評とは対極にある、徹底して身体的で享楽的な音楽である。</p>
<h2>成り立ち</h2><p>1980年代初頭、マイアミのクラブとラジオを中心に形成された。技術的な原点は、ドイツのグループKraftwerkが1977年に発表したTrans-Europe Expressと、それを下敷きにAfrika Bambaataaが1982年に発表したPlanet Rockで、この二曲が示したTR-808中心の電子的なリズムが、マイアミで独自の方向へ発展した。最初期の中心人物はDJ、プロデューサーのAmos Larkins II、そしてMC ADEで、後者が1985年に発表したBass Rockはジャンルの名称の由来ともされる。決定的な存在となったのが2 Live Crewで、リーダーのLuther Campbell（Luke Skyywalker名義でも活動）が運営したレーベルLuke Recordsを拠点に、露骨な性的表現を前面に出した作品を量産した。1989年のアルバムAs Nasty As They Wanna Beは、1990年にフロリダ州の連邦地裁で猥褻と判定され、レコード店主とバンド構成員が逮捕されるという米国音楽史上に残る事件となった。この判決は翌年の控訴審で覆され、表現の自由を巡る重要な判例として記録されている。またLuther Campbellは、映画の題名を無断で連想させる名義を巡ってGeorge Lucasから訴えられ、Luke Skyywalkerの名を放棄している。音の面ではDynamix II、Dj Magic Mike、Poison Clanらが多様な展開を示し、テンポの速さと低音の深さを競った。文化的には、カリブ海からの移民が多いマイアミの土地柄、ソカやジャマイカのサウンドシステム文化の影響が指摘される。1990年代半ば以降は主流の座を失ったが、その低音とテンポの感覚はニューオーリンズのバウンス、ブラジルのバイレ・ファンキ、そしてブレイクスやゲットー・テックへ直接受け継がれ、現在のトラップにおける808の使い方の遠い祖先にあたる。</p>
<h2>代表曲</h2><ul><li>Me So Horny (2 Live Crew)</li><li>Throw the D (2 Live Crew)</li><li>Drop That Bass (DJ Magic Mike)</li></ul>
