<h1>Miami Bass（マイアミベース）とは</h1>
<p>マイアミ・ベースは、1980年代の米国フロリダ州マイアミで生まれた、超低音とテンポの速さを軸とするヒップホップの一派だ。ダンスのための音楽として設計されている。 BPM（1分間の拍数）は概ね100〜140で、典型は120前後〜13</p>
<p>マイアミ・ベースは、1980年代の米国フロリダ州マイアミで生まれた、超低音とテンポの速さを軸とするヒップホップの一派だ。ダンスのための音楽として設計されている。

BPM（1分間の拍数）は概ね100〜140で、典型は120前後〜130台だが、曲による。ヒップホップとしては速い。

中核は、Roland TR-808のバスドラムだ。約50Hz（とても低い音の高さ）前後の音を、減衰を長くして持続させている。この低音は、ティーンクラブやスケート場、ラジオ向けに発展した。のちに車載オーディオ文化と強く結び付いた。

リズムは、ハイハットの細かい刻みと、2・4拍目(バックビート)で入るクラップ（手拍子の音）が組み合わされる。シンコペーション（拍をずらして強調するリズム）の効いた、跳ねる感触を作る。上物（メロディーなど上に重ねる音）は少ない。単純なシンセの音型、サイレン、そして加工した声のサンプルが繰り返される。

ラップは、シンプルで直接的だ。掛け合いが多く、速さは曲により幅がある。観客への呼びかけが多用され、内容は性的な話題、パーティー、そして踊りの指示が中心である。歌詞の露骨さは、しばしば法的な争いを招いた。

曲構成は、DJがミックスしやすい長いイントロと、反復するフック（耳に残る部分）を持つ。クラブやカーステレオでの連続再生を想定している。北部のヒップホップの内省や社会批評とは違い、ダンスとパーティー志向が強い音楽である。</p>
<h2>成り立ち</h2><p>舞台は、1980年代のマイアミだ。この音楽は、クラブとラジオを中心に形成され、1985年のBass Rock Expressが始まりとされることが多い。

技術的な背景には、Afrika Bambaataaが1982年に発表したPlanet Rockがある。ドイツのグループKraftwerkのTrans-Europe ExpressとNumbersを下敷きに、TR-808で作られた曲だ。そのTR-808中心の電子的なリズムが、マイアミで独自の方向へ発展した。なお、Trans-Europe Express自体はTR-808を使っていない。

最初期の中心人物は、プロデューサーのAmos Larkins II、そしてMC ADEである。後者が1985年に発表したBass Rock Expressは、Miami bassの始まりとされる説が有力だ。ただし、起源には諸説あり、James &quot;Maggotron&quot; McCauleyを「Miami bassの父」と呼ぶ評論家もいる。

決定的な存在となったのが、2 Live Crewである。1984年にカリフォルニア州で結成されたこのグループに、のちにマイアミでLuther Campbell（Luke Skyywalker名義でも活動）が加わった。この人物が運営した、のちにLuke Recordsと改称するレーベルを拠点に、彼らは露骨な性的表現を前面に出した作品を量産した。

1989年のアルバムAs Nasty As They Wanna Beは、1990年にフロリダ州の連邦地裁で猥褻と判定された。レコード店主とバンド構成員が逮捕され、米国音楽史上に残る事件となった。この判決は1992年の控訴審（第11巡回区）で覆され、表現の自由を巡る重要な判例として記録されている。

またLuther Campbellは、スター・ウォーズの登場人物名Skywalkerの権利を巡って、George Lucasから訴えられた。1990年9月の示談（話し合いでの決着）で、Luke Skyywalkerの名を放棄している。

音の面では、Dynamix II、DJ Magic Mike、Poison Clanらが多様な展開を示した。文化的には、カリブ海からの移民が多いマイアミの土地柄が影響した。キューバ系やドミニカ系などの音楽、ジャマイカのサウンドシステム（巨大な移動式の音響設備）文化の影響が指摘される。

1990年代半ばには、Quad City DJ's、69 Boyz、95 Southなどの曲でヒットチャートに復調した。その低音とテンポの感覚は、ブラジルのバイレ・ファンキに受け継がれた。ニューオーリンズのバウンスとは類似点が指摘される。さらに、フロリダ・ブレイクス（切り刻んだドラムが主役のダンス音楽）に強い影響を与え、ゲットー・テックとも近い関係にある。現在のトラップにおける808の使い方にも、影響が指摘される。</p>
