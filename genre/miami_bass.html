<h1>Miami Bass（マイアミベース）とは</h1>
<p>1980年代の米国フロリダ州マイアミで生まれた、超低音とテンポの速さを軸とするヒップホップの一派。BPM（1分間の拍数）は120〜135程度とヒップホップとしては速く、ダンスのための音楽として設計されている。中核はRoland T</p>
<p>1980年代の米国フロリダ州マイアミで生まれた、超低音とテンポの速さを軸とするヒップホップの一派。BPM（1分間の拍数）は120〜135程度とヒップホップとしては速く、ダンスのための音楽として設計されている。中核はRoland TR-808のバスドラムで、その減衰を極限まで長く伸ばして30Hz（とても低い音の高さ）前後まで下げた音が、曲の間じゅう地面を揺らし続ける。この低音は自動車の大型スピーカーで鳴らすことを前提としており、車内で低音を競う文化と切り離せないほど結び付いている。リズムはハイハットの細かい刻みと、裏拍（拍と拍の間）で入るクラップ（手拍子の音）が組み合わされ、シンコペーション（拍をずらして強調するリズム）の効いた跳ねる感触を作る。上物（メロディーなど上に重ねる音）は少なく、単純なシンセの音型、サイレン、そして加工した声のサンプルが繰り返される。ラップは早口で、掛け合いや観客への呼びかけが多用され、内容は性的な話題、パーティー、そして踊りの指示が中心。歌詞の露骨さはしばしば法的な争いを招いた。曲構成はDJがミックスしやすい長いイントロと反復するフック（耳に残る部分）を持ち、クラブやカーステレオでの連続再生を想定している。北部のヒップホップの内省や社会批評とは対極にある、徹底して身体的で享楽的な音楽である。</p>
<h2>成り立ち</h2><p>1980年代、マイアミのクラブとラジオを中心に形成され、1985年のBass Rock Expressが始まりとされることが多い。技術的な背景として、Afrika Bambaataaが1982年に発表したPlanet Rockが、ドイツのグループKraftwerkのTrans-Europe ExpressとNumbersを下敷きにTR-808で作られ、そのTR-808中心の電子的なリズムが、マイアミで独自の方向へ発展した。Trans-Europe Express自体はTR-808を使っていない。最初期の中心人物はプロデューサーのAmos Larkins II、そしてMC ADEで、後者が1985年に発表したBass Rock ExpressはMiami bassの始まりとされる。起源には諸説あり、James &quot;Maggotron&quot; McCauleyを「Miami bassの父」と呼ぶ評論家もいる。決定的な存在となったのが2 Live Crewで、1984年にカリフォルニア州で結成されたこのグループに、のちにマイアミで加わったLuther Campbell（Luke Skyywalker名義でも活動）が運営したレーベルLuke Recordsを拠点に、露骨な性的表現を前面に出した作品を量産した。1989年のアルバムAs Nasty As They Wanna Beは、1990年にフロリダ州の連邦地裁で猥褻と判定され、レコード店主とバンド構成員が逮捕されるという米国音楽史上に残る事件となった。この判決は1992年の控訴審（第11巡回区）で覆され、表現の自由を巡る重要な判例として記録されている。またLuther Campbellは、スター・ウォーズの登場人物名Skywalkerの権利を巡ってGeorge Lucasから訴えられ、1990年9月の示談（話し合いでの決着）でLuke Skyywalkerの名を放棄している。音の面ではDynamix II、Dj Magic Mike、Poison Clanらが多様な展開を示し、テンポの速さと低音の深さを競った。文化的には、カリブ海からの移民が多いマイアミの土地柄、キューバ系やドミニカ系などの音楽、ジャマイカのサウンドシステム（巨大な移動式の音響設備）文化の影響が指摘される。1990年代半ば以降は主流の座を失ったが、その低音とテンポの感覚はニューオーリンズのバウンスやブラジルのバイレ・ファンキに受け継がれ、ブレイクス（切り刻んだドラムが主役のダンス音楽）に強い影響を与え、ゲットー・テックとも近い関係にあり、現在のトラップにおける808の使い方の遠い祖先にあたる。</p>
