<h1>NRG Tranceとは</h1>
<p>NRG（Energy＝エネルギー）の名の通り、トランスの高揚感の中でも「感動」より「爆発力」に全振りしたスタイル。ハードトランスとほぼ同義で語られることが多く、両者の間に明確な線引きはないが、NRGトランスは特に、金属的にわざと歪</p>
<p>NRG（Energy＝エネルギー）の名の通り、トランスの高揚感の中でも「感動」より「爆発力」に全振りしたスタイル。ハードトランスとほぼ同義で語られることが多く、両者の間に明確な線引きはないが、NRGトランスは特に、金属的にわざと歪ませたキックドラム、酸っぱく歪んだアシッドベースライン（TB-303的な効果音）、ピッチを上げて甲高く加工したボーカルチョップ、そしてレイブ黎明期から使われる「うなる」ようなシンセ音色ホバーサウンドを多用する点に個性がある。テンポはBPM 140〜155とトランスの中でも最速クラス。曲の大半を静かなブレイクダウン（音数を減らした展開部）に費やし、そこから一気にキックが戻ってくる瞬間に爆発的なカタルシスを生む「ビルドアップ→ドロップ」の構成そのものはトランス全般と共通するが、NRGトランスのドロップはより攻撃的で肉体的、シンセリードは鋭く刺すように攻めてくる。叙情性よりもアドレナリン、優しさよりも力強さ。聴いていると全力疾走している時のような心拍数の上昇を感じる、拳を突き上げて踊るためのハイオクタン燃料のような音楽。日本ではパラパラダンス（振り付けを揃えて踊るクラブダンスのスタイル）の定番BPMとして深く根付き、ユーロビートと並んで独自の受容のされ方をした。</p>
<h2>成り立ち</h2><p>1990年代半ば、レイヴ・ムーブメントが過激化する中で、通常のトランスよりもさらに速く硬いサウンドを求める潮流がドイツを中心とするヨーロッパ各地で生まれた。「NRG」という呼び名自体は一つの起源に定まっているわけではないが、1970年代末〜80年代のディスコの高速派生形であるHi-NRG（Patrick Cowleyらが確立）の「エネルギー志向」から着想を得たとする見方があり、テクノ／ハードコア由来の攻撃性とトランスの構造美が合流して形成された。ドイツのユニットScooterは、H.P. Baxxterの絶叫混じりのMCとハードコア／テクノ由来の攻撃的なビートを組み合わせたスタイルでこのジャンルの世界的な顔となり、「Hyper Hyper」(1994)などのヒット曲で各国のシングルチャートを賑わせた。日本では、このジャンルがパラパラダンス文化と強く結びつき、独自の人気を博した。大阪出身のDJ Yoji Biomehanikaは、その象徴的な存在としてNRGトランスを世界のクラブシーンに広め、日本のダンスミュージックシーンを代表する国際的DJの一人となった。イギリスのTidy Traxレーベル（Tidy Boysが運営、Vinylgrooverらを擁する）はNRGトランス／ハードトランスの重要な拠点となり、Hennes &amp; ColdやPulsedriver（ドイツ）らもこの潮流を支えた代表格。Cosmic Gateは初期作品でNRG的な硬質サウンドを鳴らしていたが、後にプログレッシブトランス方面へとスタイルを移していった。ハードトランスとの境界が曖昧なまま発展したジャンルであり、2000年代に隆盛するハードスタイル（Hardstyle）の前史の一つとしても位置づけられる。</p>
<h2>代表曲</h2><ul><li>Hyper Hyper (Scooter)</li><li>Fire Wire (Cosmic Gate)</li><li>Sandstorm (Darude)</li></ul>
