<h1>NRG Tranceとは</h1>
<p>NRG（Energy＝エネルギー）の名の通り、トランスの高揚感のうち「感動」より「爆発力」にすべてを振ったスタイルだ。音はハードトランスに近いが、別のジャンルとして扱われる(線引きが難しいとされるのは、NRGの中のnu-NRGとh</p>
<p>NRG（Energy＝エネルギー）の名の通り、トランスの高揚感のうち「感動」より「爆発力」にすべてを振ったスタイルだ。音はハードトランスに近いが、別のジャンルとして扱われる(線引きが難しいとされるのは、NRGの中のnu-NRGとhard NRGの間である)。

NRGトランスの持ち味は、次の音を多用する点にある。圧縮された909系の4つ打ちのキックドラム。酸っぱく歪んだアシッドベースライン（TB-303的な効果音）。挑発的・下品なサンプル、掛け声系サンプルのボーカル。そして、1990年代初頭のベルギー・テクノ以来使われる、「うなる」ようなシンセの音色フーバー・サウンドだ。

テンポは平均155〜165BPMで、イギリスのハードハウス(150〜155BPM)よりやや速い。

ブレイクダウン（音数を減らした展開部）は大きく、高揚感に満ちて、劇的とされる。曲は、キックが戻ってくる瞬間に爆発的な解放感を生む「ビルドアップ→ドロップ」の構成をとる。古典的なトランスの型は「ビルドアップ→ブレイクダウン→クライマックス」だ。だが、NRGトランスのドロップはより攻撃的で肉体的で、シンセのリードは鋭く刺すように攻めてくる。

しみじみした味わいよりも興奮、優しさよりも力強さ。聴いていると、全力疾走している時のように心拍数が上がっていく。拳を突き上げて踊るための、ハイオクタン燃料のような音楽だ。</p>
<h2>成り立ち</h2><p>1990年代半ば、イギリスで新しい流れが生まれた。通常のトランスよりも、さらに速く硬いサウンドを求める流れだ。1996〜97年頃のイギリスのハードハウスから派生し、ドイツのハードトランスの影響を受けたとされる。一方、イギリス流のドイツ系トランス、ハード・アシッド・トランスからの分派とする見方もある。

「NRG」という呼び名については、イギリスの業界人による命名が記録されている。nu-NRGはBlu Peter、hard NRGはDJ Kristianによるものだ。

また、1970年代末〜80年代のディスコを高速にした派生形、Hi-NRG（Patrick Cowleyらが形を固めた）については、そこから進化したとする見方と、無関係とする見方がある。こうして、テクノ／ハードコア由来の攻撃性と、トランスの構造美が合流して生まれた。

一方、同時代のハード系ダンス音楽として、ドイツのユニットScooterがある。Scooterは、H.P. Baxxterの絶叫混じりのMCと、ハードコア／テクノ由来の攻撃的なビートを組み合わせたスタイルだ。ハードコア・テクノやハッピーハードコア系の代表的なユニットとして知られ、「Hyper Hyper」(1994)などのヒット曲を出した。

神戸市出身のDJ Yoji Biomehanikaは、NRG/ハードトランス系を代表するDJの一人として、世界のクラブシーンで活動している。DJ Magの人気投票では2005年に最高位の32位に入るなど、国際的に評価されている。

イギリスのTidy Traxレーベル（Tidy Boysが運営）は、Hard NRGを制作するレーベルとして挙げられる。周辺のハード系アーティストとしては、ドイツのHennes &amp; Coldがハードトランス、Pulsedriverがユーロダンスの担い手である。Cosmic Gateは、初期にはハードトランス寄りの硬質なサウンドを鳴らしていたが、後にプログレッシブトランスの方面へとスタイルを移していった。

このジャンルは、ハードトランスの影響を受けつつも、別のジャンルとして扱われている。</p>
