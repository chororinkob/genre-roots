<h1>NRG Tranceとは</h1>
<p>NRG（Energy＝エネルギー）の名の通り、トランスの高揚感の中でも「感動」より「爆発力」に全振りしたスタイル。ハードトランスに近い音だが別のジャンルとして扱われる(線引きが難しいとされるのは、NRGの中のnu-NRGとhard</p>
<p>NRG（Energy＝エネルギー）の名の通り、トランスの高揚感の中でも「感動」より「爆発力」に全振りしたスタイル。ハードトランスに近い音だが別のジャンルとして扱われる(線引きが難しいとされるのは、NRGの中のnu-NRGとhard NRGの間である)。NRGトランスは特に、金属的にわざと歪ませたキックドラム、酸っぱく歪んだアシッドベースライン（TB-303的な効果音）、ピッチを上げて甲高く加工したボーカルチョップ、そしてレイブ黎明期から使われる「うなる」ようなシンセ音色フーバー・サウンドを多用する点に個性がある。テンポは平均155〜165BPMで、イギリスのハードハウス(150〜155BPM)よりやや速い。ブレイクダウン（音数を減らした展開部）は短く、キックが戻ってくる瞬間に爆発的なカタルシスを生む「ビルドアップ→ドロップ」の構成はトランス全般と共通するが、NRGトランスのドロップはより攻撃的で肉体的、シンセリードは鋭く刺すように攻めてくる。叙情性よりもアドレナリン、優しさよりも力強さ。聴いていると全力疾走している時のような心拍数の上昇を感じる、拳を突き上げて踊るためのハイオクタン燃料のような音楽。日本ではパラパラダンス（振り付けを揃えて踊るクラブダンスのスタイル）が主にユーロビートで踊られ、後年にはトランスなどの曲にも振り付けが作られるようになった。</p>
<h2>成り立ち</h2><p>1990年代半ば、レイヴ・ムーブメントが過激化する中で、通常のトランスよりもさらに速く硬いサウンドを求める潮流がイギリスで生まれた。1996〜97年頃のイギリスのハードハウスから派生し、ドイツのハードトランスの影響を受けたとされる。「NRG」という呼び名の由来には諸説あるが、イギリスの業界人による命名（nu-NRGはBlu Peter、hard NRGはDJ Kristian）が記録されている。また、1970年代末〜80年代のディスコの高速派生形であるHi-NRG（Patrick Cowleyらが確立）の「エネルギー志向」から着想を得たとする見方があり、テクノ／ハードコア由来の攻撃性とトランスの構造美が合流して形成された。ドイツのユニットScooterは、H.P. Baxxterの絶叫混じりのMCとハードコア／テクノ由来の攻撃的なビートを組み合わせたスタイルで、ハードコア・テクノやハッピーハードコア系の代表的なユニットとして知られ、「Hyper Hyper」(1994)などのヒット曲を出した。神戸市出身のDJ Yoji Biomehanikaは、NRGトランスの代表的な担い手として世界のクラブシーンで活動し、DJ Magの人気投票で32位に入るなど、国際的に評価されている。イギリスのTidy Traxレーベル（Tidy Boysが運営）は、Hard NRGを制作するレーベルとして挙げられる。ドイツのHennes &amp; Coldはハードトランス、Pulsedriverはユーロダンスやハードダンスの担い手である。Cosmic Gateは初期にはハードトランス寄りの硬質なサウンドを鳴らしていたが、後にプログレッシブトランス方面へとスタイルを移していった。ハードトランスの影響を受けつつ、別のジャンルとして扱われる。</p>
