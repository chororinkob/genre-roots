<h1>Japanese Reggae（ジャパレゲ）とは</h1>
<p>ジャマイカのレゲエの型を、日本のミュージシャンが日本語で鳴らす音楽である。代表曲22曲を動画で聴け、ルーツと影響のつながりを地図でたどれる。</p>
<p>ジャマイカのレゲエの型を、日本のミュージシャンが日本語で鳴らす音楽である。一言でいうと、日本語で歌うレゲエ・ダンスホールだ。音の土台はベースとドラムにある。ベースは低音を太く長めに伸ばし、曲の骨格を握る。ドラムはワンドロップと呼ばれる叩き方で、3拍目にキックとスネアを落とすのが目印だ。テンポはおおむね65〜95 BPMのダンスホール系の速さが中心で、リディムと呼ばれる共有の伴奏音源に声を乗せていく。ギターとキーボードは2拍・4拍の裏を短く刻むオフビート奏法を使い、和音はマイナーコードを基調にした艶のある進行が好まれる。メロディーは音域を狭くして同じ音形を繰り返すため、一度で耳に残る。エレクトリックピアノやオルガン、ブラスセクション、カウベルのパーカッションが色を添え、ダブ由来のエコーとリバーブが空間を包む。
歌い方には2系統ある。ひとつはDeeJayと呼ぶ、ラップに近い語りのスタイルで、パトワを交えることもある。もうひとつは歌モノと呼ぶメロディアスな歌唱で、1曲をDeeJayとシンガーが分け合う形も定番だ。歌詞は恋愛、仲間、故郷、夏の海や祭りといった身近な題材が中心で、英語よりも日本語の意味がはっきり伝わる点が本家との違いである。曲の組み立ては、イントロでリディムを見せ、DeeJayと歌が交互に長く粘り、終盤でサビのフックを反復して締める。ダンスの上で鳴らす前提の、身体先行の音楽だ。</p>
<h2>成り立ち</h2><p>1960年代にジャマイカで生まれたレゲエが海を越えて日本に届いたのは、1970年代のことである。転機になったのが、1979年のボブ・マーリー&amp;ザ・ウェイラーズの来日公演だった。この公演をきっかけに日本でレゲエ人気が高まり、1980年にはパーカッショニストのペッカーがジャマイカに渡り、ザ・ウェイラーズやスライ&amp;ロビーとともにアルバム『ペッカー・パワー』を作った。日本初のダブ・アルバムとされる作品である。
しかし当初、レゲエを演奏する場所はディスコやライブハウスの片隅だった。1982年、トランペット奏者のこだま和文を中心にMUTE BEATが結成され、ダブだけを追究するインストゥルメンタル・バンドとして頭一つ抜けた存在になる。1984年の「Shonen Tiger」などの曲で名を知られ、国内外で活動した。一方、1970年代後半から横浜ではRANKIN TAXIがサウンドシステム「タクシー・ハイファイ」を率い、レゲエ・ダンスの文化を街に根付かせた。1987年にはジャマイカの大型フェス、レゲエ・サンスプラッシュの舞台に立つ日本人アーティストも現れた。日本語でレゲエを歌うことでは、ジャマイカ在住歴のあるNAHKIが先駆けとされ、のちに「ジャパレゲ」という略称が広まった。
80年代末から90年代には、地下のイベントでラッパーとレゲエDeeJayが同じ土俵に立つ機会が増え、ヒップホップとの交流が深まった。91年には横浜でMIGHTY CROWNが結成され、サウンドシステムを備えたダンスホール文化が本格化する。95年に始まった横浜レゲエ祭は、クラブで150人ほどの観客から出発し、2000年代には横浜スタジアムで3万人を集める日本最大級のレゲエ・フェスに育った。
そして2000年、三木道三の「大和」がシングルチャートにランクインし、翌2001年の「Lifetime Respect」はレゲエとして初のオリコン1位を獲得、90万枚以上を売った。2002年にはMINMIの「The Perfect Vision」が50万枚を突破した。さらに湘南乃風やFIRE BALL、PUSHIMが注目を集め、J-POPのチャートでもレゲエのリディムを使う曲が増えた。2007年の湘南乃風「睡蓮花」のような大ヒットを経て、ジャパレゲは日本のポップスの一画に定着した。フェスとクラブのダンス、配信の時代を通じてシーンは続いており、横浜レゲエ祭は2023年に最終開催されたものの、ジャパレゲは日本の音楽の一部として残っている。</p>
