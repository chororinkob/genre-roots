<h1>Neo- Psychedelia（ネオサイケデリア）とは</h1>
<p>1960年代のサイケデリック・ロックの手法を、後の時代の感覚と技術で再構成した音楽。基本編成はギター、ベース、ドラム、鍵盤だが、音の処理が中心的な表現手段となる。ギターにはファズ、フェイザー、ディレイ、そして逆再生が用いられ、鍵盤</p>
<p>1960年代のサイケデリック・ロックの手法を、後の時代の感覚と技術で再構成した音楽。基本編成はギター、ベース、ドラム、鍵盤だが、音の処理が中心的な表現手段となる。ギターにはファズ、フェイザー、ディレイ、そして逆再生が用いられ、鍵盤にはメロトロンや古いアナログ・シンセを模した音色が選ばれる。録音では、音像を左右に大きく振るパンニング、そして意図的にテープを揺らしたようなピッチの不安定さが加えられる。和声は機能和声から離れ、旋法的な進行や、同じ和音の上を長く漂う構造が好まれる。旋律は歌ものとしての体裁を保ちつつ、途中で予告なく崩れることがある。リズムは中庸で、四つ打ちに近い単調な刻みを長く続ける場合と、変拍子を織り込む場合の両方がある。歌唱は残響を深くかけ、複数の声を重ねて誰が歌っているか分からなくする処理が多用される。歌詞は夢、記憶、意識の変容、日常の中の非現実を扱う。1960年代の直接の模倣ではなく、その後のポスト・パンク、シューゲイザー、電子音楽の語彙を経由している点が決定的な違いである。</p>
<h2>成り立ち</h2><p>1970年代末から1980年代初頭、パンク以後の世代が1960年代の音楽を再発見したところから始まる。イギリスでは1980年代前半、ロンドンのクラブを中心にペイズリー・アンダーグラウンドと呼ばれる動きが起き、米国ロサンゼルスではThe Dream Syndicate、The Rain Parade、The Three O'Clockといったバンドが、1960年代のフォーク・ロックとサイケデリアを再解釈した。イギリス側ではJulian Copeが率いたThe Teardrop Explodes、そしてEcho &amp; the Bunnymenが、この感覚をポスト・パンクの文脈で提示した。1980年代半ばにはThe Jesus and Mary Chainがノイズと甘い旋律を結合させ、Spacemen 3が反復と持続音を極めた。1990年代に入ると、この系譜は複数の方向へ分岐する。イギリスではThe Verveが初期作品で大音量の音響を追求し、米国ではThe Flaming Lipsが1997年の四枚のCDを同時に再生させる実験を経て、1999年のThe Soft Bulletinで管弦楽的な色彩を獲得した。オクラホマ州出身の彼らは、この分野を最も長く継続した存在の一つである。並行してMercury RevやOlivia Tremor Controlらが米国南部と北東部で活動した。2000年代以降、Animal Collectiveが電子的な手法とコラージュを持ち込み、オーストラリアではTame Impalaが、Kevin Parkerによるほぼ一人での制作により、この様式を主流の規模へ押し上げた。彼の2015年のCurrentsは、ロックの編成から離れて電子的な質感へ移行し、以後のポップス全般に影響を与えている。日本でも1990年代以降、独自の系譜が育っている。</p>
