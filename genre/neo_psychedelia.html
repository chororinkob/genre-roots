<h1>Neo- Psychedelia（ネオサイケデリア）とは</h1>
<p>1960年代のサイケデリック・ロックの手法を、後の時代に受け継いだ音楽。ジャンルは多様で、ジャングリーな（きらきらと鳴る）ギター・ポップ、歪んだ即興演奏、録音の実験などを含む。たとえばSpacemen 3は、強く歪んだギターとシン</p>
<p>1960年代のサイケデリック・ロックの手法を、後の時代に受け継いだ音楽。ジャンルは多様で、ジャングリーな（きらきらと鳴る）ギター・ポップ、歪んだ即興演奏、録音の実験などを含む。たとえばSpacemen 3は、強く歪んだギターとシンセサイザーを使い、和音やテンポをほとんど変えず、全曲に持続音を響かせた。英国と米国では質感が違うとされ、米国では前衛ロックの謎めいた面や、はかなく消えるような音の質感が強調され、歌うような細かい飾りの多い英国のサイケデリアとは対照的だった。歌詞は、薬物体験を前面に出すものもあれば、風変わりな歌詞や、現実離れした内容、政治的な内容を伴うものもある。1960年代の手法を更新したものも、忠実に踏襲したものも含む。</p>
<h2>成り立ち</h2><p>1970年代末から1980年代初頭、パンク以後の世代が、1960年代の音楽を再発見した。ネオ・サイケデリアは、そこから始まる。

イギリスでは、1970年代末の英国ポスト・パンクを起点に、「the New Psychedelia」「acid punk」と呼ばれる動きが起きた。Julian Copeが率いたThe Teardrop Explodes、そしてEcho &amp; the Bunnymenが、この感覚をポスト・パンクの文脈で示した。

これと並行して、米国カリフォルニアでは「ペイズリー・アンダーグラウンド」と呼ばれる動きが生まれた。ロサンゼルスでは、The Dream Syndicate、Rain Parade、The Three O'Clockといったバンドが、1960年代のフォーク・ロックとサイケデリアを再解釈した。

1980年代半ばには、The Jesus and Mary Chainが、ノイズと甘い旋律を結合させた。Spacemen 3は、反復と持続音を極めた。

1990年代に入ると、この系譜は複数の方向へ分岐する。イギリスでは、The Verveが初期作品で大音量の音響を追求した。米国では、The Flaming Lipsが1997年に、4枚のCDを同時に再生させる実験を行った。そして1999年のThe Soft Bulletinで、オーケストラのような色彩を獲得する。オクラホマ州出身の彼らは、1983年結成で、現在も活動を続けている。並行して、Mercury RevやThe Olivia Tremor Controlらが、米国南部と北東部で活動した。

2000年代以降は、Animal Collectiveが、ループ、サンプリング、サウンド・コラージュ、エレクトロニカを取り入れた。オーストラリアではTame Impalaが、ネオ・サイケデリアの流れを汲む作品で商業的成功を収めた。Kevin Parkerによる、スタジオ録音ではほぼ一人での制作である。彼の2015年のCurrentsは、ギターよりもシンセサイザーを重視した、ダンス志向の作風へ移行した。

日本のサイケデリック系シーンは、1960年代から続く。</p>
