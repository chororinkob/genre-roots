<h1>Drone（ドローン）とは</h1>
<p>ドローンは、1つの音、あるいは1つの和音を極端に長く伸ばし続け、その中で起きるごくわずかな変化だけで作品を成り立たせる音楽だ。 音源はさまざまだ。弓で弾き続ける弦楽器、ハーモニウムやパイプオルガンのように息継ぎなしで鳴らせる鍵盤、</p>
<p>ドローンは、1つの音、あるいは1つの和音を極端に長く伸ばし続け、その中で起きるごくわずかな変化だけで作品を成り立たせる音楽だ。

音源はさまざまだ。弓で弾き続ける弦楽器、ハーモニウムやパイプオルガンのように息継ぎなしで鳴らせる鍵盤、フィードバックさせたエレキギターとアンプ、シンセサイザーの発振器、テープループ、そして人間の声が使われる。

調律にも特徴がある。Youngの系統の作品では、平均律ではなく、倍音列に基づく純正律を採用する例が多い。うなりの生じない澄んだ響きを狙う例もあれば、逆に極端なうなりを作る例もある。

旋律の展開も、拍の刻みも、わざと取り除かれている。聴き手の注意は、次に何が来るかではなく、今鳴っている音の中で何が起きているかへ向かう。持続音を長く聴き続けると、ふだんは聞き流している現象がはっきり耳に入ってくる。複数の音の周波数の差から生まれるうなり、倍音の浮き沈み、部屋の反射による定在波、さらには聴覚そのものが作り出す結合音などだ。こうした音そのものの内側を観察させることが、ドローンの中心の狙いである。

音量の幅は大きい。ほとんど聞こえないごく小さな音から、Sunn O)))のようにアンプを積み上げ、体が震えるほどの低い周波数を浴びせる実践まで含む。

曲の長さは20分から数時間に及び、長期展示型のサウンド＆ライト環境もある。ドローンはアンビエントと重なる部分も大きい。ただし、持続する音へ意識を集中させる、集中した聴き方を求める作品が多い。</p>
<h2>成り立ち</h2><p>持続音を音楽の土台に置く考え方そのものは、世界各地に古くからあった。インド古典音楽のタンプーラ、スコットランドのバグパイプ、ヨーロッパのハーディガーディ、教会音楽のオルガンの持続低音などだ。これを西洋の作品の考え方のもとで、独立した表現として広げた1960〜70年代にかけての先駆者には、La Monte Youngのほか、Pauline Oliveros、パリのÉliane Radigue、Charlemagne Palestine、Yoshi Wada、Phill Niblockらがいる。

La Monte Youngは、アイダホ州生まれでロサンゼルス育ちの作曲家だ。1958年の弦楽三重奏曲で、すでに極端に長い持続音を使っていた。1962年にグループを結成し、のちにTheatre of Eternal Musicと称した。この集団には、ヴァイオリンのTony Conradと、Youngのパートナーで光の環境作品を手がけたMarian Zazeelaが参加した。さらに、1964年にLou ReedとともにThe Velvet Undergroundを共同結成したJohn Caleも、並行してTheatre of Eternal Musicに参加していた。彼らは、倍音列に基づく純正律で、同じ和音を何時間も持続させる演奏を行った。Youngが1964年から取り組んだ『The Well-Tuned Piano』は、独自の調律を施したピアノによる、5時間を超える作品である。

また、YoungとMarian Zazeelaは、1966年にニューヨークの自宅ロフトで最初の連続音の環境を作った(1969年にミュンヘンで公開)。これが、1969年以降さまざまな版で展開された長期展示型のサウンド＆ライト環境『Dream House』となった。1979〜85年版はDiaの委託でハリソン通りに置かれ、現在の版は1993年からChurch Street 275番地にある。定常的な正弦波と光の空間で、現在の版はシーズン制で、開館時間も限られる。

Youngは1970年から、インドのキラーナ流派の歌手Pandit Pran Nathに師事した。ただし、持続音の作品はそれより前にある(1957〜58年、1962年に結成し、のちにTheatre of Eternal Musicと称するグループなど)。Young自身は、ドローンへの関心の源として、風の音、変圧器の60サイクルのうなり、タンプーラ、ウェーベルン、雅楽の笙などを挙げている。インド音楽は、影響の一つである。

Youngらの試みの影響は、Cale、Riley、Radigueらを通じて、少しずつ周りの領域へ広がった。John Caleが持ち込んだ持続するヴィオラの音は、The Velvet Undergroundの「Venus in Furs」などに刻まれ、ロックの側へドローンを流し込んだ。Terry Rileyは『In C』(1964)で、反復と持続を結びつけた。フランスのÉliane Radigueは、ARP 2500シンセサイザーを使い、ほとんど変化しない音の移り変わりだけで長大な作品を作り、チベット仏教の思想と結びつけた。Pauline Oliverosは、ディープ・リスニングを提唱した。ディープ・リスニングは聴き方の実践・美学で、1988年に貯水槽で録音した経験から名付けられた。

1990年代以降、この語法はロックとメタルの側から再発見された。アメリカのEarthは『Earth 2』(1993)で、ドローン的な持続音の上に、極端に遅いメタル・リフを繰り返す構成のアルバムを作った。Earthは1990年代初頭にドローン・メタルを形作り、『Earth 2』はその代表作・決定的作品とされる。その影響のもとでSunn O)))が結成され、アンプの壁と儀式のような演出によって、ドローンを体で感じる体験として示した。

一方、テキサスのStars of the Lidは、弦とギターの持続を重ねた静かな作風で、別の系譜を作った。アメリカのPhill Niblockは、同じ楽器のごく小さな音程の差から生まれるうなりを主題にした、密度の高い作品を長年発表し続けた。日本でも、灰野敬二らが持続音と轟音による即興を独自に展開している。

現在では、アンビエント、実験音楽、メタル、サウンド・アートの各領域にまたがる、基本の語法として定着している。</p>
