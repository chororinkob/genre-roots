<h1>Drone（ドローン）とは</h1>
<p>1つの音、あるいは1つの和音を極端に長く持続させ、その内部で起きるごくわずかな変化だけで作品を成立させる音楽。旋律の展開も拍の刻みも意図的に排され、聴き手の注意は次に何が来るかではなく、今鳴っている音の中で何が起きているかへ向けら</p>
<p>1つの音、あるいは1つの和音を極端に長く持続させ、その内部で起きるごくわずかな変化だけで作品を成立させる音楽。旋律の展開も拍の刻みも意図的に排され、聴き手の注意は次に何が来るかではなく、今鳴っている音の中で何が起きているかへ向けられる。持続音を長く聴き続けると、複数の音の周波数差から生じるうなり、倍音の浮き沈み、部屋の反射による定在波、さらには聴覚そのものが作り出す結合音といった、通常は聞き流される現象が前景化してくる。この音そのものの内部を観察させることが、ドローンの中心的な狙いである。音源は多様で、弓で弾き続ける弦楽器、ハーモニウムやパイプオルガンのように息継ぎなく鳴らせる鍵盤、フィードバックさせたエレキギターとアンプ、シンセサイザーの発振器、テープループ、そして人間の声が用いられる。調律も特徴的で、平均律ではなく倍音列に基づく純正律を採用し、うなりの生じない澄んだ響きを狙う例と、逆に極端なうなりを作る例の双方がある。音量の幅は大きく、ほとんど聞こえない極小の音から、Sunn O)))のようにアンプを積み上げて身体が振動するほどの低周波を浴びせる実践までを含む。曲の長さは20分から数時間、恒久設置の作品では数年に及ぶこともある。アンビエントが背景として聞き流されることを許容するのに対し、ドローンはむしろ持続する音へ意識を集中させることを要求する点で性格が異なる。</p>
<h2>成り立ち</h2><p>持続音を音楽の土台に置く発想自体は、インド古典音楽のタンプーラ、スコットランドのバグパイプ、ヨーロッパのハーディガーディ、教会音楽のオルガン点など、世界各地に古くから存在した。これを西洋の作品概念のもとで独立した表現として確立したのが、1960年代のニューヨークである。カリフォルニア出身の作曲家La Monte Youngは1958年の弦楽三重奏曲ですでに極端に長い持続音を用い、1962年には自身のグループTheatre of Eternal Musicを結成した。この集団にはヴァイオリンのTony Conrad、後にThe Velvet Undergroundへ加わるJohn Cale、そしてYoungのパートナーで光の環境作品を手がけたMarian Zazeelaが参加し、彼らは倍音列に基づく純正律で同じ和音を何時間も持続させる演奏を行った。Youngが1964年から取り組んだ『The Well-Tuned Piano』は独自の調律を施したピアノによる5時間を超える作品であり、1979年にニューヨークへ設けた恒久設置作品『Dream House』は、定常的な正弦波と光の空間を年単位で鳴らし続けた。Youngはインドのキラーナ流派の歌手Pandit Pran Nathに師事しており、インド古典音楽の思想がこの実践の直接の源泉になっている。影響は隣接する領域へ一気に波及した。John Caleが持ち込んだ持続するヴィオラの音はThe Velvet Undergroundの「Venus in Furs」などに刻まれ、ロックの側へドローンを流し込んだ。Terry Rileyは『In C』(1964)で反復と持続を接続し、フランスのÉliane RadigueはARP 2500シンセサイザーを用いて、ほとんど変化しない音の推移だけで長大な作品を作り、チベット仏教の思想と結びつけた。Pauline Oliverosはアコーディオンと巨大な貯水槽の残響を使ったディープ・リスニングを提唱している。1990年代以降、この語法はロックとメタルの側から再発見された。アメリカのEarthは『Earth 2』(1993)で、極端に遅く歪んだギターの持続だけでアルバムを構成し、ドローン・メタルの起点となる。その影響下でSunn O)))が結成され、アンプの壁と儀式的な演出によってドローンを身体的な体験として提示した。テキサスのStars of the Lidは弦とギターの持続を重ねた静謐な作風で別の系譜を作り、アメリカのPhill Niblockは同じ楽器の微細な音程差から生じるうなりを主題とする高密度な作品を長年発表し続けた。日本でも灰野敬二らが持続音と轟音による即興を独自に展開している。現在ではアンビエント、実験音楽、メタル、サウンド・アートの各領域にまたがる基礎的な語法として定着している。</p>
<h2>代表曲</h2><ul><li>The Well-Tuned Piano (La Monte Young)</li><li>Four Violins (Tony Conrad)</li><li>Monoliths &amp; Dimensions (Sunn O)))</li><li>The Tired Sounds of Stars of the Lid (Stars of the Lid)</li></ul>
