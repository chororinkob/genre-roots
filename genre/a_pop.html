<h1>A-POP（エーポップ）とは</h1>
<p>テレビアニメやゲームの曲を、音の型ではなく使われる場所と売り方でまとめたポップスだ。代表曲22曲を動画で聴け、ルーツと影響のつながりを地図でたどれる。</p>
<p>テレビアニメやゲームの曲を、音の型ではなく使われる場所と売り方でまとめたポップスだ。主題歌に限らず、幅広い曲を含む。曲ごとの作風はばらばらだ。共通するのは、作品の名前を背負い、短い時間で印象を残す仕事をする点である。

中心になる楽器は、打ち込みのシンセサイザーと、軽く歪ませたエレキギターだ。速いパッセージを刻むピアノも使う。ドラムは生のキットより、サンプリングしたキックとスネアを組んだ音が多い。ここにブラスやストリングスを重ね、サビの頭で音の層を一気に厚くする。

メロディは音の跳び幅が大きい。サビの出だしで1オクターブ近く駆け上がり、高い音を長く伸ばす形が多い。和音はJ-POPの王道進行を土台にする。7thやadd9を足し、明るく開いた響きにする。最後のサビの直前で転調し、同じメロディを半音上げて繰り返す手法も定番だ。

リズムは、4つ打ちのキックと、8分や16分を刻むハイハットで組む。テンポは150〜170 BPMが中心だ。2拍目と4拍目には、スネアのアクセントが来る。曲によっては3拍子や変拍子を一部だけ差し込み、作品の変わった雰囲気を音で示す。

歌い方は、子音を立ててまっすぐ通す声が基本だ。声優が歌う場合は役の声色を残し、語尾を跳ねさせたりセリフを差し込んだりする。Aメロは小声で抑え、サビで一気に開く落差のつけ方が好まれる。掛け声やコーラスを多重に重ね、大勢で歌っているように聞かせる演出も多い。

歌詞は作品の世界観をなぞる。恋や冒険を主人公の視点で書き、必殺技の名前や決めゼリフを歌詞に織り込む。意味より語感を優先し、早口で畳みかける部分を作る曲もある。『最強○×計画』のように、電波ソング寄りの曲もある。

曲の組み立ては、短いイントロ、Aメロ、Bメロ、サビという4つの区画を、90秒ほどで一巡させる。アニメOPの場合、テレビサイズは約89秒とされる。間奏にはゲーム音楽風のアルペジオや効果音を置く。最後のサビは転調で持ち上げて閉じる。

J-POPとの違いは、作品とのタイアップを前提にしない市場の呼び名である点にある。A-POPはアニソンを含む、より広い括りだ。実際に鳴っているのは、秋葉原のクラブ、アニソンDJイベント、声優のライブ、ダンスバトルのフロアである。</p>
<h2>成り立ち</h2><p>A-POPが提唱される前、アニメ・ゲーム系の関係者には、J-POPへのコンプレックスがあったと金杉は語る。その空気を変えたいと考えたのが、美少女ゲームのプロデューサーだった金杉肇だ。彼は『Piaキャロットへようこそ!!』『Canvas』『EVE〜new generation〜』などを手がけ、ゲーム音楽の現場から業界を見ていた。

言葉そのものは2000年の時点で使われていた。ボイスアニメージュという媒体の2000年の誌面に、A-POPという語が見える。

転機は2005年からのアキバブームだ。秋葉原に萌え系の店とイベントが増え、アニメやゲームの曲が街の音として流れるようになる。同じ2005年、ドワンゴと文化放送が大型イベント『アニメロサマーライブ』を始めた。会場に声優やアニソン歌手が集まった。

2007年、第3回のアニメロサマーライブはサブタイトルを『Generation-A』とし、A-POPという言葉を大々的に打ち出したと金杉は語る。金杉はこの語を、アニメのAと秋葉原のAの両方にかけたと説明している。ドワンゴ・エージー・エンタテインメントは、A-POPに特化したレコード会社として進む方針を打ち出した。

金杉は、J-POPへのコンプレックスや、その空気を変えたい思いを動機として挙げている。アニメやゲームの曲を歌う歌手が、テレビアニメを経てJ-POP市場へ移る動きを、彼は「回収」と呼んで批判した。美少女ゲームで歌い、アニメで歌い、最後はJ-POPの仕組みに吸い取られるのか、という問いだ。ロックもジャズもアニメの音楽も上下はない、という言い方もしている。

現場では別の動きが同時に進んだ。MOSAIC.WAVの『最強○×計画』、Honey Beeの『NO ROCK NO LIFE』、織姫よぞらの『妄想ブレイク』が、A-POPを前面に打ち出した曲として並んだ。金杉がプロデュースしたクサカンムリは、『Pia♥キャロットへようこそ!!G.P.』の主題歌を歌うA-POPユニットとして売り出された。所属したTeraBytes Recordsは、非商用目的のMAD、サンプリングは自由という方針を取った。クサカンムリのメンバーが、桃井はるこやKOTOKOのファンだったと金杉は述べている。

場所も整っていった。秋葉原のクラブMOGRAは火曜日にA-POP BARと名付けたアニソンDJの営業を続け、幅広い年代のアニメ曲と同人音楽をかけた。2010年からは都市型のアニソンDJフェス『Re:animation』が始まった。2019年の第13回を最後に、運営会社の破産に伴って終了した。

2010年代に入ると、A-POPという呼び名はダンスの現場でも使われるようになった。涼宮あつきは秋葉原を拠点にするダンスグループREAL AKIBA BOYZの一員として、A-POPソングだけで争う2on2のダンスバトル『あきばっか〜の』を始めた。かかる曲はアニソン、ボカロ、VTuber楽曲まで含み、何が流れるかは本番まで分からない。ストリートダンス、ヲタ芸、コスプレ、ネタ芸が同じフロアで混ざり、2026年の時点で開催13年目を迎えた。東京体育館では2年続けて開催され、2on2は200組400名が申込の上限だった。

定義の曖昧さは最後まで残った。ウィキペディアの記事も、A-POPはJ-POPと同じく輪郭がぼやけており、ジャンルというより市場の旗印だと書いている。アニソン、ゲームソング、萌えソング、声優の曲まで含むとされ、同人CDは金杉のインタビューに出てくる語である。音の特徴では切り分けられない。現在はボカロやVTuber楽曲も含まれる。</p>
