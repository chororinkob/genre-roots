<h1>Rōkyoku（ナニワブシ）とは</h1>
<p>浪曲は、三味線一本を伴奏に、物語を節と啖呵で語る日本の大衆芸能だ。代表曲22曲を動画で聴け、ルーツと影響のつながりを地図でたどれる。</p>
<p>浪曲は、三味線一本を伴奏に、物語を節と啖呵で語る日本の大衆芸能だ。語り手を浪曲師、三味線弾きの相方を曲師と呼ぶ。一人の語りと一本の三味線だけで、演劇のように人物が入れ替わる物語を聞かせる音楽である。

中心の楽器は三味線で、低音の太い太棹を使う。調弦は三下りという型にする。曲師は小ぶりの撥で弾き、節に合わせて手（定型のフレーズ）を繰り出す。関西節では皮をやや緩く張った三味線がベンベンと低く鳴り、節を聞かせる。関東節ではカンカンカンと高く澄んだ音になり、哀切な趣を添える。上方では曲師にギターが付くこともある。

メロディーは、曲師の三味線の手を土台に、浪曲師が自由な節を乗せて作る。コード進行で運ぶ音楽ではなく、節回しの抑揚で情景と感情を描く。拍子もテンポも一定にしないことが多い。語りの緩急そのものがリズムであり、打楽器は基本使わない。

歌い方は二通りある。旋律に乗せて歌う節と、歯切れのよい話し言葉の啖呵だ。決めぜりふで啖呵を切る場面が聴かせどころになる。登場人物はすべて浪曲師が声色で演じ分ける。節には型があり、虎造節や幸枝若節のように、作った浪曲師の名で呼ばれる。

歌詞の主題は、義士や侠客、親子の情など、涙をそそる人情話が中心である。演目の題名は外題と呼ばれ、『天保水滸伝』『清水次郎長伝』のような長編が名高い。

曲の組み立ては、一つの外題を数回に分けて口演する。導入で場面を整え、中盤で葛藤を語り、決めの啖呵と締めの節で終わることが多い。寄席や大会の舞台では、客席から合いの手や声援が飛ぶことがある。講談との違いは、語りのスタイル（読む・語る、三味線の有無）にある。</p>
<h2>成り立ち</h2><p>浪曲の系譜は、江戸時代にさかのぼる。門付けと呼ばれる大道芸のひとつ、ちょんがれ（阿呆陀羅経）やデロレン祭文が土台になり、同じ源流を持つ説経節の影響を受けながら育った。江戸時代の語り手には非人身分や願人坊主らが多く、芸は差別されながら受け継がれた。文化・文政頃（19世紀前期）の大坂の浪花伊助が、ちょんがれを「浮かれ節」と名付けて売り出したとされる。ただし伝説で、時期にも諸説ある。

しかし、明治初期に浮かれ節が浪花節と呼ばれて広まった。寄席には上がれたが、東京では盛り場のヒラキが中心で、現在の舞台形式は明治40年前後に整った。

転機は明治40年前後に訪れる。浪曲師の初代桃中軒雲右衛門は、政治結社・玄洋社の頭山満らと結びついた。大陸浪人の宮崎滔天は、1902年に「桃中軒牛右衛門」の名で雲右衛門に弟子入りした。新聞記者に台本の作成を依頼し、義士伝を演目の中心に据えた。これが新機軸だった。紋付袴姿で屏風を背に「不弁」と言うのみで本題に入る新演出と、一息の長い「三段流し」で、評判を呼んだ。1907年6月7日から約1か月（30日間とする資料もある）、東京の本郷座に進出し、3時間以上の長講で連日の大入りとなった。上流・中流層にまで人気が広がり、雲右衛門は浪曲界の中興の祖と呼ばれる。ただし大正3年（1914年）7月4日、大審院第3刑事部は、三光堂のレコードの複製盤をめぐる裁判で、浪花節は著作権法上の音楽的著作物ではないと判定した。著作権法違反を認めず、被告人は無罪だった。

雲右衛門と並んで（同時代に）二代目吉田奈良丸らが黄金期を築いた。二代目広沢虎造は、師匠譲りの関西節を土台に、中京節・関東節の要素を取り入れたとされる虎造節で、『清水次郎長伝』を当たり芸にした。二代目玉川勝太郎の『天保水滸伝』は全国的なヒットになった。1930年代には日本で最も人気のあるジャンルのひとつとなり、全盛期には約3000人の演者がいたと見積もられる。

1951年の民放ラジオ開局を機に、ラジオ浪曲のブームが起きる。ラジオ東京系で放送された、二代目広沢虎造の連続読み番組の枠「虎造アワー」や、国友忠の『銭形平次』、二代目広沢菊春の『姿三四郎』など、連続番組が編成された。アマチュアののど自慢番組も全国を沸かせた。しかし戦後は洋楽やテレビの普及で客が離れ、寄席は次々に消えた。1970年5月に浅草の木馬館が「木馬浪曲会」として定席化し、約1年後に「木馬亭」の名を使うようになり、浪曲定席として存続する。一方、関西では道頓堀の朝日座が1984年に閉鎖され、中座も1999年の浪曲お別れ興行で幕を下ろした。

歌謡浪曲の流れも生まれた。二葉百合子の『岸壁の母』は、1954年に菊池章子が歌った曲のセリフ入りカバーで、1972年にロングヒットとなった。三門博は新内節を取り込んだ三門節で『唄入り観音経』を歌った。三波春夫らは歌謡曲へ転じ、節回しは演歌の歌唱にも伝わっている。初代京山幸枝若は高音でノリのよい幸枝若節を作り、戦後の関西を支えた。木馬亭の定席や各地の大会を拠点に、故・国本武春らが古典と新機軸を演じ分け、他ジャンルと混ぜる試みも続けられた。</p>
