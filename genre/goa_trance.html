<h1>Goa Trance（ゴアトランス）とは</h1>
<p>インドのゴア州の野外パーティーで鳴らすために作られた、催眠的で東洋的なトランス。テンポは130〜150BPM（1分間の拍数）で、四つ打ちのキックの裏に8分音符のオフビート（拍の間）・ベースが置かれる骨格はトランス一般と同じだが、上</p>
<p>インドのゴア州の野外パーティーで鳴らすために作られた、催眠的で東洋的なトランス。テンポは130〜150BPM（1分間の拍数）で、四つ打ちのキックの裏に8分音符のオフビート（拍の間）・ベースが置かれる骨格はトランス一般と同じだが、上物の作り方が根本的に異なる。中心となるのは16分音符で刻まれる長大なアルペジオ（和音を一音ずつ順に弾く奏法）で、これが単一の調に留まらず、東洋的な音階の中を数分間かけて上昇し変形していく。音階選びが最大の特徴で、ハーモニックマイナー（独特の哀愁がある短調の音階）やフリギア旋法（中東風の暗い音階の型）、さらに増2度を含む中東・インド風の音程が多用され、西洋の長短調の枠から外れた浮遊感が生まれる。音色はTB-303やJuno、SH-101といったアナログ機材のほか、Nord LeadやAccess Virusといったシンセの金属的で鋭い音が中心で、フェイザーとフランジャー（どちらも音をうねらせる効果）で常に揺らされる。低域はキックとベースだけで整理され、中高域に大量の音が層をなす独特の音の帯域の配置を持つ。曲は8分から12分に及び、明確なサビを持たず、要素が絶えず入れ替わり続ける。ヴォーカルはほとんどなく、代わりにSF映画などから抜き出したヴォーカル・サンプル（録音から切り出した声）の英語の語りの断片が差し込まれる。ヒンドゥー教の絵や図柄、幾何学模様の視覚文化と切り離せないほど結びついている。</p>
<h2>成り立ち</h2><p>1960年代末から続くインドのゴア州のヒッピー共同体が母体になっている。ゴアはポルトガルの植民地だったが1961年にインドへ編入され、その後1960年代後半から欧米の若者が陸路でインドへ向かうヒッピー・トレイルの終着点の一つになった。Anjuna、Vagatorといった浜辺で、彼らは満月の夜に音楽をかけて夜通し踊る集まりを続けた。当初はロックが中心だったが、1970年代末から1980年代にかけて、電子音楽が持ち込まれる。決定的な役割を果たしたのはGoa Gilというアメリカ人で、本名Gilbert Levey、1951年カリフォルニア州生まれ（サンラファエルとする資料が多い）。彼は1969年にサンフランシスコを離れ、アムステルダム経由でインドへ向かい、ゴアに定住し（時期は資料により異なる）、ヒンドゥー教の修行者(サドゥー)となり、DJとして8〜24時間にわたる長時間の演奏を行った。彼はパーティーを娯楽ではなく宗教的な儀式と位置づけ、その思想が後のサイケデリック・トランス文化全体の基調になった。1980年代のゴアではKraftwerk、Front 242、New Orderといったヨーロッパの電子音楽がかけられていたが、DJたちは歌詞のある部分をテープで消して器楽だけにするという加工を施していた。これは曲を長くして、トランス的な部分を延ばすための編集だった。この実践が後のゴアトランスの器楽中心の性格につながったとされる。1990年前後に、ヨーロッパから来た音楽家たちが現地の需要に合わせて自ら曲を作り始める。中心となったのはドイツのSven Vath周辺の人脈と、イギリスのDragonfly Records(Youth、本名Martin Glover が1993年に設立)、そしてTIP Recordsだった。Astral Projection(イスラエル)、Man With No Name、Hallucinogen(Simon Posford)、Total Eclipse、Juno Reactorがこの時期の代表格になる。とりわけイスラエルの存在が大きく、兵役を終えた若者がインドを旅する慣習があったため、ゴアの文化がそのままイスラエルへ持ち帰られ、同国が制作の一大拠点になった。1990年代半ばにヨーロッパで商業的な注目を集め、1997年前後が頂点となる。しかし過剰な流行により音が定型化し、1998年以降は急速に衰えた。同時にゴア州では、パーティーによる騒音、薬物、外国人の増加に地元住民と当局が反発し、2000年1月にはボンベイ高等裁判所が深夜の増幅音楽を禁止した。以後も規制と違反が続いている。この後、音楽的な系譜はサイケデリック・トランスとして受け継がれ、ブラジル、南アフリカ、日本、イスラエル、ポルトガルの野外音楽祭へ場を移して現在も続いている。</p>
