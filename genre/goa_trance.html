<h1>Goa Trance（ゴアトランス）とは</h1>
<p>インドのゴア州のパーティー文化から生まれ、制作と流通は英国・ヨーロッパ・イスラエルなどが担った、催眠的で東洋的なトランス。テンポは130〜150BPM（1分間の拍数）で、四つ打ちのキックに、ドローン的で16分音符的なベースが乗り、</p>
<p>インドのゴア州のパーティー文化から生まれ、制作と流通は英国・ヨーロッパ・イスラエルなどが担った、催眠的で東洋的なトランス。テンポは130〜150BPM（1分間の拍数）で、四つ打ちのキックに、ドローン的で16分音符的なベースが乗り、ベースは音域が厚くキックと重なることもある。中心となるのは16分音符で刻まれる長大なアルペジオ（和音を一音ずつ順に弾く奏法）で、これと東洋的なベース進行が曲全体を支え、展開は主にレイヤーの追加とパーカッションの変化で作られる。音階選びが特徴のひとつで、ハーモニックマイナー（独特の哀愁がある短調の音階）やフリギア旋法（中東風の暗い音階の型）、さらに増2度を含む中東・インド風の音程が多用され、西洋の長短調の枠から外れた浮遊感が生まれる。音色はTB-303やJuno、SH-101といったアナログ機材のほか、Nord Leadなどのシンセも使われ、Access Virusは1990年代末以降に広まった。レゾナンス（共鳴）付きフィルターのスクエルチ音（ぐにゅぐにゅと鳴る音）など、フェイザーやフランジャー（どちらも音をうねらせる効果）を含む多様なエフェクトが使われる。低域はキックとベースだけで整理され、中高域に大量の音が層をなす独特の音の帯域の配置を持つ。曲は8分から12分に及び、明確なサビを持たず、徐々にレイヤーを重ねて盛り上げ、後半でクライマックスに達する。ヴォーカルはほとんどなく、代わりにSF映画などから抜き出したヴォーカル・サンプル（録音から切り出した声）の英語の語りの断片が差し込まれる。装飾にはヒンドゥー教などの宗教図像、エイリアン、キノコ、サイケデリック・アート、シャーマニズム、テクノロジーなどが多い。</p>
<h2>成り立ち</h2><p>1960年代末から続くインドのゴア州のヒッピー共同体が母体になっている。ゴアはポルトガルの植民地だったが1961年にインドへ編入され、その後1960年代後半から欧米の若者が陸路でインドへ向かうヒッピー・トレイルの終着点の一つになった。Anjuna、Vagatorといった浜辺で、彼らは満月の夜に音楽をかけて夜通し踊る集まりを続けた。当初はロックが中心だったが、1970年代末から1980年代にかけて、電子音楽が持ち込まれる。初期の中心人物の一人がGoa Gilというアメリカ人で、本名Gilbert Levey、1951年カリフォルニア州生まれ（サンラファエルとする資料が多い）。彼は1969年にサンフランシスコを離れ、アムステルダム経由でインドへ向かい、ゴアに定住し（時期は資料により異なる）、ヒンドゥー教の修行者(サドゥー)となり、DJとして8〜24時間にわたる長時間の演奏を行った。彼はパーティーを娯楽ではなく宗教的な儀式と位置づけ、その思想がパーティーの美学に影響した。1980年代のゴアではKraftwerk、Front 242、Nitzer Ebbといったヨーロッパの電子音楽がかけられていたが、DJたちは歌詞のある部分をテープで消して器楽だけにするという加工を施していた。これは曲を長くして、トランス的な部分を延ばすための編集だった。この実践が後のゴアトランスの器楽中心の性格につながったとされる。1990年代前半（1992〜94年ごろ）から、英国などで制作とレーベル設立が本格化する。中心となったのはイギリスのDragonfly Records(Youth、本名Martin Glover が1993年に設立)とTIP Records、Blue Roomなどだった。ドイツのSven Vathらのトランスは、その前提となり並走する潮流だった。Astral Projection(イスラエル)、Man With No Name、Hallucinogen(Simon Posford)、Total Eclipse、Juno Reactorが代表格になり、代表作は1993〜97年ごろに生まれた。とりわけイスラエルの存在が大きく、兵役を終えた若者がインドを旅する慣習があったため、持ち帰ったゴアの文化がイスラエルで発展してサイケデリック・トランスへ変質し、同国が制作の一大拠点になった。1990年代半ばにヨーロッパで商業的な注目を集め、1997年前後が頂点となる。しかしその後は売上が落ち、レーベルの失敗が続いたが、音楽は野外のシーンで存続した。同時にゴア州では、パーティーによる騒音と睡眠妨害を問題にした環境団体の公益訴訟を受け、2000年1月にボンベイ高等裁判所ゴア支部が暫定命令で午後10時から午前7時の増幅音楽を禁止した。当局はむしろ音楽の許可を出す側にいて、批判された。以後も規制と違反が続いている。この後、音楽的な系譜はサイケデリック・トランスとして受け継がれ、ブラジル、南アフリカ、日本、イスラエル、ポルトガルの野外音楽祭へ場を移して現在も続いている。</p>
