<h1>Goa Trance（ゴアトランス）とは</h1>
<p>ゴアトランスは、インドのゴア州のパーティー文化から生まれた、催眠的で東洋的なトランスだ。制作と流通は、英国・ヨーロッパ・イスラエルなどが担った。 テンポは130〜150BPM（1分間の拍数）。4/4のキックに、ドローン的で16分音</p>
<p>ゴアトランスは、インドのゴア州のパーティー文化から生まれた、催眠的で東洋的なトランスだ。制作と流通は、英国・ヨーロッパ・イスラエルなどが担った。

テンポは130〜150BPM（1分間の拍数）。4/4のキックに、ドローン的で16分音符的なベースが乗る。ゴアのベースは音域が厚く、キックと重なることもある。

中心になるのは、16分音符で刻まれる長大なアルペジオ（和音を一音ずつ順に弾く奏法）だ。このアルペジオと東洋的なベース進行が、曲全体を支える。展開は主に、レイヤーの追加とパーカッションの変化で作る。

音階選びは、特徴のひとつだ。ハーモニックマイナー（独特の哀愁がある短調の音階）やフリギア旋法（中東風の暗い音階の型）が多用される。さらに、増2度を含む中東・インド風の音程も多用され、西洋の長短調の枠から外れた浮遊感が生まれる。

音色は、TB-303やJuno、SH-101といったアナログ機材のほか、Nord Leadなどが使われる。Virusは90年代末以降に広まった。レゾナンス(共鳴)付きフィルターのスクエルチ音など、多様なエフェクトが使われる。低域はキックとベースだけで整理され、中高域に大量の音が層をなす、独特の音の帯域の配置を持つ。

曲は8分から12分に及ぶ。明確なサビを持たず、徐々にレイヤーを重ねて盛り上げる。ヴォーカルはほとんどない。代わりに、SF映画などから抜き出したヴォーカル・サンプル（録音から切り出した声）の、英語の語りの断片が差し込まれる。

装飾には、ヒンドゥー教などの宗教図像、エイリアン、キノコ、サイケデリック・アート、シャーマニズム、テクノロジーなどが多い。</p>
<h2>成り立ち</h2><p>母体になったのは、1960年代末から続く、インドのゴア州のヒッピー共同体だ。

ゴアはポルトガルの植民地だったが、1961年にインドへ編入された。その後、1960年代後半から、欧米の若者が陸路でインドへ向かうようになった。ヒッピー・トレイルと呼ばれる道だ。ゴアは、その終着点の一つになった。AnjunaやVagatorといった浜辺で、彼らは満月の夜に音楽をかけ、夜通し踊る集まりを続けた。当初はロックが中心だった。しかし1970年代末から1980年代にかけて、電子音楽が持ち込まれる。

初期の中心人物の一人が、Goa Gilというアメリカ人だ。本名はGilbert Leveyで、1951年カリフォルニア州生まれ（サンラファエルとする資料が多い）。彼は1969年にサンフランシスコを離れ、アムステルダム経由でインドへ向かった。ゴアに定住し（時期は資料により異なる）、ヒンドゥー教の修行者(サドゥー)となった。DJとしては、8〜24時間にわたる長時間の演奏を行った。彼はパーティーを娯楽ではなく宗教的な儀式と位置づけ、その思想が美学に影響した。

1980年代のゴアでは、Kraftwerk、Front 242、Nitzer Ebbといったヨーロッパの電子音楽がかけられていた。DJたちは、歌詞のある部分をテープで消して、器楽だけにする加工を施していた。これは曲を長くして、トランス的な部分を延ばすための編集だった。この実践が、後のゴアトランスの器楽中心の性格につながったとされる。

1990年代前半(1992〜94年ごろ)から、英国などで制作・レーベル設立が本格化した。中心となったのは、イギリスのDragonfly Records(Youth、本名Martin Glover が1993年に設立)とTIP Records、Blue Roomなどだ。ドイツ・トランスは、その前提・並走する流れだった。Astral Projection(イスラエル)、Man With No Name、Hallucinogen(Simon Posford)、Total Eclipse、Juno Reactorが代表格になる。代表作は1993〜97年ごろである。

とりわけ、イスラエルの存在が大きかった。兵役を終えた若者がインドを旅する慣習があったため、ゴアの文化がイスラエルへ持ち帰られた。持ち帰った文化を発展させ、サイケデリック・トランスへ変質させた結果、同国が制作の大きな拠点になった。

1990年代半ばに、ヨーロッパで商業的な注目を集め、1997年前後が頂点となる。1996〜97年に商業的ピークを迎えたが、その後は売上が落ち、レーベルが破綻した。音楽は野外シーンで存続した。

一方、ゴア州では、2000年1月に規制が入った。ボンベイ高裁ゴア支部が、環境団体の公益訴訟を受けて、暫定命令で午後10時〜午前7時の増幅音楽を禁止した。当局はむしろ許可を出す側で批判された。以後も、規制と違反が続いている。

この後、音楽的な系譜はサイケデリック・トランスとして受け継がれた。ブラジル、南アフリカ、日本、イスラエル、ポルトガルの野外音楽祭へ場を移して、現在も続いている。</p>
