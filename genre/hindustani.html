<h1>Hindustani Classical（ヒンドゥスターニー）とは</h1>
<p>ヒンドゥスターニー古典音楽は、北インド、パキスタン、バングラデシュに伝わる古典音楽だ。 中心になるのは、ラーガという旋法（音の並び方の型）の体系である。ラーガは単なる音階ではない。上行と下行で異なる音の並び、強調すべき音、装飾の付</p>
<p>ヒンドゥスターニー古典音楽は、北インド、パキスタン、バングラデシュに伝わる古典音楽だ。

中心になるのは、ラーガという旋法（音の並び方の型）の体系である。ラーガは単なる音階ではない。上行と下行で異なる音の並び、強調すべき音、装飾の付け方が決まっている。北インドの体系では、演奏すべき時刻や季節まで示される。ラーガとは、旋律を生むための規則の集合だ。数百のラーガが存在する。

時間の枠組みはターラという。6拍、7拍、10拍、16拍といった周期に区切られる。その第一拍をサムと呼び、サムに全員が集まることが、演奏の要になる。

基本の編成は、独奏者、伴奏のタブラ（ドゥルパドの伴奏はタブラではなくパカーワジ）、そしてドローン（持続低音）を出すタンプーラだ。タンプーラの弦が生む倍音（高い音の成分）の霞の中で、音程の微妙な差が聴き取られる。楽器は、シタール、サロード、サーランギー、バーンスリー、サントゥールなどが使われる。

器楽の典型的な演奏は、拍のない自由な導入部、アーラープから始まる。低い音から少しずつ音域を広げ、ラーガの性格を示していく。次に、拍を持つジョールが来る。続いて、加速するジャーラーへ進む。最後は、作曲された旋律、ガットの上で即興が展開される。ガットには、タブラの伴奏が付く。

ドゥルパドは、アーラープのあとに作曲部分（バンディッシュ）が続き、パカーワジが伴奏する。声楽のヒヤールは構成が異なる。一曲が1時間を大きく超えることもある。

伝統的には、譜面ではなく、師から弟子への口伝えが中心だった。20世紀以降は、記譜法（楽譜の書き方）も教育に用いられている。この師弟の系譜を、ガラーナーと呼ぶ。</p>
<h2>成り立ち</h2><p>源流は、サーマ・ヴェーダの詠唱の伝統（旋律を付けた詠唱）にあるとされる。のちに『ナーティヤ・シャーストラ』が、音の理論を記した。成立年代は諸説あるが、紀元前200年〜紀元200年ごろが有力とされる。

12〜13世紀頃から、インド亜大陸の音楽は、徐々に南北に分かれていったとされる。有力な説明は、こうだ。北部がイスラーム王朝の支配下に入り、アラブとペルシアの音楽的要素を取り込んだ。この融合を代表する人物が、13〜14世紀のAmir Khusrauである。シタールとタブラの発明を彼のものとする伝承があるが、学界では否定的だ。シタールの確かな初出は、1739年頃である。伝承では、カッワーリーの創始者ともされる。

16世紀、ムガル帝国のAkbar大帝の宮廷には、Tansenという伝説的な歌手がいた。彼が歌えば雨が降り、灯が灯ったという言い伝えが残る。

以後、ムガル期以降に音楽家の家系が形成された。帝国が解体したあとも、藩王国（インドの地方の小国）の後ろ盾のもとで、音楽は多様化した。こうして、ガラーナーと呼ばれる流派の違いが生まれた。ヒヤールという声楽形式は、17世紀までに宮廷芸能として成立した。18世紀のムハンマド・シャー期に形が整って地位を高め、19世紀頃にかけてドゥルパドに代わる主流となった。より即興の自由度が高い形式である。

ムガル帝国の衰退とイギリスの支配の進展で、音楽家への後ろ盾は段階的に弱まった。Oudhは1856年の併合後、ワジド・アリー・シャーがカルカッタに移り、その音楽伝統がベンガルに影響した。Patiala、Banaras、Rampur、Gwaliorなどでは後ろ盾が続いた。マハラジャやナワーブの力と後ろ盾が衰えたのは、20世紀初頭とされる。

この危機に対応したのが、20世紀初頭のVishnu Narayan BhatkhandeとVishnu Digambar Paluskarだ。Bhatkhandeがラーガの分類と記譜法（楽譜の書き方）、Paluskarが音楽学校の設立を中心に担い、王侯の私物だった音楽を市民に開いた。ただし、それまで演奏を担っていたイスラーム教徒の師匠（ウスタード）や、宮廷に仕えた女性芸能者（タワーイフ）から、芸の継承を取り戻そうとする側面があったと論じる研究がある。その成功は部分的だったとされる。Bhatkhande自身も、イスラーム教徒の師匠に学んでいる。

全インド・ラジオは、1930年代に整備された。1936年に現在の名称に改称している。独立前後から、古典音楽家の主要な活動の場となった。Ravi Shankarは、1949年（1948年とする資料もある）から1956年まで、その音楽監督を務めた。のちにシタールを国外に持ち出す。

メニューインとの共演（1950年代〜）などで、西洋ではすでに知られていた。1966年にThe BeatlesのGeorge Harrisonが彼に師事したことを機に、ポピュラー音楽の若い聴衆にも広く知られた。1967年のモントレー・ポップ・フェスティバルと、1969年のウッドストックで演奏している。Ali Akbar Khan、Bismillah Khan、Bhimsen Joshiらが、20世紀の巨匠として名を残している。</p>
<h2>代表曲</h2><ul><li>Raga Desh (Hariprasad Chaurasia)</li><li>Raga Malkauns (Nikhil Banerjee)</li><li>Raag Bhoop (Kishori Amonkar)</li><li>Raga Todi (Pran Nath)</li><li>The Emperor (Darbari Kanra) (Ali Akbar Khan)</li><li>Raga Pilu (Amjad Ali Khan)</li><li>Raga Malkauns (Kumar Gandharva)</li><li>Bhoopali Tarana (Bade Ghulam Ali Khan)</li><li>Raga Marwa (Vilayat Khan)</li><li>Raga Shuddha Todi (Zia Mohiuddin Dagar)</li></ul>
