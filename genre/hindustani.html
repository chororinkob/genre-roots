<h1>Hindustani Classical（ヒンドゥスターニー）とは</h1>
<p>北インドとパキスタンに伝わる古典音楽。核となるのはラーガという旋法の体系で、単なる音階ではなく、上行と下行で異なる音の並び、強調すべき音、装飾の付け方、演奏すべき時刻や季節までが定められた、旋律を生むための規則の集合である。数百の</p>
<p>北インドとパキスタンに伝わる古典音楽。核となるのはラーガという旋法の体系で、単なる音階ではなく、上行と下行で異なる音の並び、強調すべき音、装飾の付け方、演奏すべき時刻や季節までが定められた、旋律を生むための規則の集合である。数百のラーガが存在する。時間の枠組みはターラで、六拍、七拍、10拍、16拍といった周期に区切られ、その第一拍であるサムに全員が集まることが演奏の要になる。演奏は独奏者、伴奏のタブラ、そして通奏低音を出すタンプーラという編成が基本で、タンプーラの弦が生む倍音の霞の中で音程の微妙な差が聴き取られる。楽器はシタール、サロード、サーランギー、バーンスリー、サントゥールなど。演奏は必ず拍のない自由な導入部アーラープから始まり、低い音から少しずつ音域を広げてラーガの性格を提示し、次に拍を持つジョール、加速するジャーラーへ進み、最後に打楽器を伴う作曲された旋律ガットの上で即興が展開される。一曲が30分から二時間に及ぶことも珍しくない。すべての音が譜面ではなく師から弟子へ口伝で受け継がれ、この師弟の系譜をガラーナーと呼ぶ。</p>
<h2>成り立ち</h2><p>源流はヴェーダの詠唱にさかのぼり、紀元前後の『ナーティヤ・シャーストラ』が音の理論を記している。十三世紀頃、インド亜大陸の音楽は南北に分かれた。北部がイスラーム王朝の支配下に入り、ペルシアと中央アジアの音楽的要素を取り込んだためである。この融合を象徴する人物が十三世紀のAmir Khusrauで、シタールとタブラの発明を彼に帰する伝承があり、カッワーリーの創始者ともされる。十六世紀、ムガル帝国のAkbar大帝の宮廷にはTansenという伝説的な歌手がおり、彼が歌えば雨が降り灯が灯ったという逸話が残る。以後、宮廷の庇護のもとで音楽家の家系が形成され、ガラーナーの制度が確立した。十八世紀のムハンマド・シャーの時代にはヒヤールという声楽形式が発展し、より即興の自由度が高いこの様式が主流になった。十九世紀、イギリスの植民地支配によって宮廷が解体されると、音楽家は庇護を失って困窮した。この危機に対応したのが二十世紀初頭のVishnu Narayan BhatkhandeとVishnu Digambar Paluskarで、彼らはラーガを体系的に分類し、記譜法と音楽学校を作って、王侯の私物だった音楽を市民に開いた。ただし同時に、それまで演奏を担っていたイスラーム教徒の家系や、宮廷に仕えた女性歌手たちが排除される側面もあった。独立後の1950年代以降、全インド・ラジオが演奏の場を提供し、Ravi Shankarがシタールを国外に持ち出す。1966年、The BeatlesのGeorge Harrisonが彼に師事したことで西洋の若者に爆発的に知られ、1967年のモントレー・ポップ・フェスティバルと1969年のウッドストックで演奏した。Ali Akbar Khan、Bismillah Khan、Bhimsen Joshiらが二十世紀の巨匠として名を残している。</p>
