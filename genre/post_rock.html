<h1>Post-Rock（ポストロック）とは</h1>
<p>ロックの楽器編成をそのまま用いながら、ロックの目的である歌とリフの反復を放棄し、音色と時間の推移そのものを聴かせる音楽である。歌が入らない曲が多く、入る場合も歌詞の意味を伝えるためではなく、楽器の一つとして響きの層に埋め込まれる。</p>
<p>ロックの楽器編成をそのまま用いながら、ロックの目的である歌とリフの反復を放棄し、音色と時間の推移そのものを聴かせる音楽である。歌が入らない曲が多く、入る場合も歌詞の意味を伝えるためではなく、楽器の一つとして響きの層に埋め込まれる。ギターはコードを掻き鳴らすのではなく、ディレイとリバーブを深くかけたアルペジオや、同じ音を高速で繰り返し弾くトレモロ・ピッキングで面としての音を作り、複数のギターが異なる周期の音型を重ねることで、拍の位置が曖昧な織物のような響きが生まれる。ベースは低音を支えるより旋律を担うことが多く、ドラムはジャズやクラウトロックの影響で、跳ねたシンバルワークや一定のテンポを刻み続けるモータリックなパターンを使う。管楽器、弦楽器、鍵盤ハーモニカ、グロッケンシュピールといったロック外の楽器も抵抗なく導入される。最大の特徴は時間設計にあり、曲はしばしば8分から20分に及び、極端に小さな音量から始まって長い時間をかけて積み上がり、頂点で全ての楽器が一斉に鳴る。この静と動の落差による構成は、後に多くの追随者を生んだ定型である。歌詞のない音楽でありながら、映画音楽のように具体的な情景を喚起する点が、抽象性を旨とする実験音楽との違いである。</p>
<h2>成り立ち</h2><p>呼称としてのポストロックは、イギリスの音楽評論家Simon Reynoldsが1994年、Bark Psychosisのヘックスを論じる中で用いたことで広まった。ロックの楽器でロック以外のことをする音楽、という彼の定義がそのまま名前として定着した経緯がある。ただし実践は呼称に先行しており、決定的な先例はイギリスのTalk Talkである。ヒットを重ねたシンセポップのバンドだった彼らは、1988年のスピリット・オブ・エデンと1991年のラフィング・ストックで、即興の断片を長時間録音して切り貼りするという当時のロックにあり得ない方法を採り、レコード会社との訴訟に発展しながらも、静寂と余白を主役にした作品を残した。アメリカ側の起点はケンタッキー州ルイヴィルのSlintで、1991年のスパイダーランドは、囁きと絶叫、静けさと轟音を極端に対比させる構成と、変拍子を含む冷たい演奏によって、以後10年以上にわたる指針となった。1990年代半ばにはシカゴのTortoiseが、ダブ、ミニマル音楽、ジャズを取り込んだ音響志向を打ち出し、1996年のミリオンズ・ナウ・リヴィング・ウィル・ネヴァー・ダイでこの分野の中心地をシカゴに置いた。1997年はこの音楽の当たり年で、グラスゴーのMogwaiがヤング・チームを、モントリオールのGodspeed You! Black EmperorがConstellation Recordsからエフ・シャープ・エー・シャープ・インフィニティを発表する。後者は資本主義への嫌悪と終末感を、ジャケットの意匠から演奏の作法まで一貫した思想として提示し、政治性を伴う集団として特異な位置を占めた。アイスランドのSigur Rósは1999年のアーゲイティス・ビリユンで、ヴァイオリンの弓でギターを弾く奏法と造語による歌詞を用い、この音楽を世界的な聴衆へ届けた。2000年代にはテキサスのExplosions in the Skyがアメリカン・フットボールを題材にした映画やテレビの音楽に採用され、静かに始まり劇的に盛り上がる構成が広告や映像の常套手段として消費されるようになる。この過剰な様式化により、2010年代には型通りで退屈だという批判が定着したが、日本のMonoをはじめ各国に強固なシーンが残り、現在も長尺の器楽ロックの基準として機能し続けている。</p>
