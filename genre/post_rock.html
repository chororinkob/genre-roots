<h1>Post-Rock（ポストロック）とは</h1>
<p>ポストロックは、ロックの楽器編成をそのまま用いながら、歌やリフ主導の構造より、音色・質感・ダイナミクスを重視する音楽だ。時間の推移そのものを聴かせる。 中心はギターだ。コードを掻き鳴らすのではなく、ディレイとリバーブ（遅延と残響の</p>
<p>ポストロックは、ロックの楽器編成をそのまま用いながら、歌やリフ主導の構造より、音色・質感・ダイナミクスを重視する音楽だ。時間の推移そのものを聴かせる。

中心はギターだ。コードを掻き鳴らすのではなく、ディレイとリバーブ（遅延と残響の効果）を深くかけたアルペジオ（和音を1音ずつ順に弾く奏法）を使う。同じ音を高速で繰り返し弾く、トレモロ・ピッキングも使う。これらで面としての音を作る。複数のギターが異なる周期の音型を重ねることで、拍の位置が曖昧な、織物のような響きが生まれることがある。

ベースは、低音を支えるより旋律を担うことが多い。ドラムは、ジャズやクラウトロックの影響を受けている。跳ねたシンバルワークや、一定のテンポを刻み続けるモータリック（機械のように一定の速さで進む）なパターンを使う。管楽器、弦楽器、鍵盤ハーモニカ、グロッケンシュピール（金属板を叩く鉄琴）といった、ロック外の楽器も抵抗なく導入される。

歌は少ない。入る場合も、楽器的に扱われたり、語りになったりすることが多い。

最大の特徴は時間設計にある。長尺の曲が多い。2000年代の第2波では、静から轟音へ至る構成が定型化した。

歌詞のない音楽でありながら、映画音楽のように具体的な情景を喚起する。この点が、抽象性を旨とする実験音楽との違いである。</p>
<h2>成り立ち</h2><p>「ポストロック」という呼び名は、イギリスの音楽評論家Simon Reynoldsが広めた。1994年、Bark Psychosisのヘックスを論じる中で用いたのが始まりだ。ロックの楽器でロック以外のことをする音楽、という彼の定義が、そのまま名前として定着した経緯がある。

ただし、実践は呼び名より先にあった。先駆者の一つとされるのが、イギリスのTalk Talkだ。ヒットを重ねたシンセポップのバンドだった彼らは、1988年のスピリット・オブ・エデンと、1991年のラフィング・ストックで、新しい方法を採った。即興を長時間録音し、デジタル機材で編集・再構成するという、当時のポップ/ロックでは異例の方法である。契約をめぐってEMIと法廷で争いながらも、静寂と余白を主役にした作品を残した。

アメリカ側の先駆者の一つは、ケンタッキー州ルイヴィルのSlintだ。1991年のスパイダーランドは、囁きと絶叫、静けさと轟音を極端に対比させる構成と、変拍子を含む冷たい演奏によって特徴づけられる。発売当初は売れなかったが、後に再評価され、ポストロックやマスロックの先駆作とされる。

1990年代半ばには、シカゴのTortoiseが、ダブ（レゲエを加工した音楽）、ミニマル音楽（短い型を反復する音楽）、ジャズを取り込んだ音響志向を打ち出した。1996年のミリオンズ・ナウ・リヴィング・ウィル・ネヴァー・ダイで、シカゴ(Tortoiseら)を拠点とするシーンが、ポストロックを定着させた流れの一つとして注目された。

1997年は、この音楽の当たり年だった。グラスゴーのMogwaiが、ヤング・チームを発表した。モントリオールのGodspeed You! Black Emperorは、Constellation Records(LP、1997年)から作品を出した。翌1998年には、Kranky(CD、LPの約1.6倍の長さで、38分から63分に再編集された)から、エフ・シャープ・エー・シャープ・インフィニティを発表する。後者は、資本主義への嫌悪と終末感を、ジャケットの意匠から演奏の作法まで、一貫した思想として提示した。政治性を伴う集団として、特異な位置を占めた。

アイスランドのSigur Rósは、1999年のアーゲイティス・ビリユンで、チェロの弓でギターを弾く奏法を用いた。一部の曲では、意味を持たない音節による歌唱（Vonlenska／ホープランディック）も用いた（次作『( )』では全編がこの言葉）。こうして、この音楽を世界的な聴衆へ届けた。

2000年代には、テキサスのExplosions in the Skyが、アメリカン・フットボールを題材にした映画『Friday Night Lights』（2004年）の音楽に参加した。静かに始まり劇的に盛り上がる構成は、広告や映像の常套手段として消費されるようになる。この過剰なスタイル化に対しては、クレッシェンド（だんだん大きくなる）型が定型化しているという批判もある。しかし、日本のMonoをはじめ各国に強固なシーンが残り、現在も長尺の器楽ロックの分野で活動が続いている。</p>
