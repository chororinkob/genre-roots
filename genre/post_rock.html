<h1>Post-Rock（ポストロック）とは</h1>
<p>ロックの楽器編成をそのまま用いながら、歌やリフ主導の構造より、音色・質感・ダイナミクスを重視し、時間の推移そのものを聴かせる音楽である。歌は少なく、入る場合も楽器的に扱われたり、語りになったりすることが多い。ギターはコードを掻き鳴</p>
<p>ロックの楽器編成をそのまま用いながら、歌やリフ主導の構造より、音色・質感・ダイナミクスを重視し、時間の推移そのものを聴かせる音楽である。歌は少なく、入る場合も楽器的に扱われたり、語りになったりすることが多い。ギターはコードを掻き鳴らすのではなく、ディレイとリバーブ（遅延と残響の効果）を深くかけたアルペジオ（和音を1音ずつ順に弾く奏法）や、同じ音を高速で繰り返し弾くトレモロ・ピッキングで面としての音を作り、複数のギターが異なる周期の音型を重ねて、拍の位置が曖昧な織物のような響きを作ることがある。ベースが中心的な役割を担うことが多く、ドラムはジャズやクラウトロックの影響で、跳ねたシンバルワークや一定のテンポを刻み続けるモータリック（機械のように一定の速さで進む）なパターンを使う。管楽器、弦楽器、鍵盤ハーモニカ、グロッケンシュピール（金属板を叩く鉄琴）といったロック外の楽器も抵抗なく導入される。特徴の一つは時間設計にあり、長尺の曲が多い。2000年代の第2波では、極端に小さな音量から始まって長い時間をかけて積み上がり、頂点で全ての楽器が一斉に鳴る、静から轟音へ至る構成が定型化した。質感や雰囲気を重視する。映画・映像の音楽に使われることも多い。</p>
<h2>成り立ち</h2><p>呼称としてのポストロックは、イギリスの音楽評論家Simon Reynoldsが1994年、Bark Psychosisのヘックスを論じる中で用いたことで広まった。「ロックの楽器でロック以外のことをする音楽」という彼の定義は1994年5月の別の記事のもので、名称が確立したのはTortoiseの1996年作の後とされる。ただし実践は呼称に先行しており、先駆者の一つとされるのがイギリスのTalk Talkである。ヒットを重ねたシンセポップのバンドだった彼らは、1988年のスピリット・オブ・エデンと1991年のラフィング・ストックで、即興を長時間録音し、デジタル機材で編集・再構成するという、当時のポップ／ロックでは異例の方法（Canなどに先例はある）を採り、契約をめぐってEMIと法廷で争いながらも、静寂と余白を主役にした作品を残した。アメリカ側の先駆者の一つはケンタッキー州ルイヴィルのSlintで、1991年のスパイダーランドは、囁きと絶叫、静けさと轟音を極端に対比させる構成と、変拍子を含む冷たい演奏で知られる。発売当初は売れなかったが、後に再評価され、ポストロックやマスロックの先駆作とされる。1990年代半ばにはシカゴのTortoiseが、ダブ（レゲエを加工した音楽）、ミニマル音楽（短い型を反復する音楽）、ジャズを取り込んだ音響志向を打ち出し、1996年のミリオンズ・ナウ・リヴィング・ウィル・ネヴァー・ダイでシカゴを拠点とする潮流が、ポストロックを確立した動きの一つとして注目された。1997年には、グラスゴーのMogwaiがヤング・チームを、モントリオールのGodspeed You! Black EmperorがConstellation Records(LP、1997年)から、翌1998年にはKranky(CD、LPの約1.6倍の長さ（38分から63分）)からエフ・シャープ・エー・シャープ・インフィニティを発表する。後者は資本主義への嫌悪と終末感を、ジャケットの意匠から演奏の作法まで一貫した思想として提示し、政治性を伴う集団として特異な位置を占めた。アイスランドのSigur Rósは1999年のアーゲイティス・ビリユンで、チェロの弓でギターを弾く奏法と、一部の曲での意味を持たない音節による歌唱（Vonlenska／ホープランディック）を用い（次作『( )』では全編がこの言葉）、この音楽を世界的な聴衆へ届けた。2000年代にはテキサスのExplosions in the Skyがアメリカン・フットボールを題材にした映画『Friday Night Lights』（2004年）の音楽に参加し、静かに始まり劇的に盛り上がる構成が映画や映像の音楽で多く使われるようになる。この過剰な様式化に対しては、クレッシェンド（だんだん大きくなる）型が定型化しているという批判もあるが、日本のMonoをはじめ各国に強固なシーンが残り、現在も長尺の器楽ロックの分野で活動が続いている。</p>
