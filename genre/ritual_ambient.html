<h1>Ritual Ambient（リチュアルアンビエント）とは</h1>
<p>リチュアル・アンビエントは、宗教儀式や呪術の場を音で再現する、あるいは作り上げることを目的としたアンビエントの一系統だ。 中心となるのは打楽器のくり返しである。フレームドラムや大型の太鼓、ボウル、ゴングを不規則な間隔で強く打つ作品</p>
<p>リチュアル・アンビエントは、宗教儀式や呪術の場を音で再現する、あるいは作り上げることを目的としたアンビエントの一系統だ。

中心となるのは打楽器のくり返しである。フレームドラムや大型の太鼓、ボウル、ゴングを不規則な間隔で強く打つ作品もある。その残響を長いリヴァーブで空間全体に満たす。

持続音・旋律の両面を担う楽器としては、ヒマラヤ地域のシンギングボウル、ディジュリドゥ、ハーモニウム、ハルモニカ、笛、擦弦楽器のドローンが使われる。平均律に縛られない音程が用いられることがある。

リズムには4拍子の均等な拍節を避け、7拍子や不定形の周期を用いる作品もある。日常の時間の感覚を外すように作られる。

人声の扱いが特徴的だ。チベット仏教の倍音唱法(一人で複数の音を同時に出す)、モンゴルのホーミー、意味を持たない呪文めいた朗誦などが、多重録音で重ねられる。正教会風の低い斉唱を用いる作品もある。

歌詞は既存の宗教言語(サンスクリット、ラテン語、古ノルド語)か、作家が創作した架空の言語で歌われる。狙いは意味の伝達ではなく、音節が体に与える効果である。

空間の処理では、実在の教会や洞窟のインパルス応答を用いたコンヴォリューション・リヴァーブを使う作品もある。聴き手を特定の場所に置く効果を狙うものだ。

ダークアンビエントとは素材を共有する。しかし、恐怖ではなく変性意識や陶酔へ導く意図がはっきりしている点、そして人間の体の動き(叩く、唱える、歩く)の痕跡を残す点が、区別の決め手になる。</p>
<h2>成り立ち</h2><p>このジャンルは、1980年代のインダストリアル文化と、1960年代以降のオカルト復興および民族音楽への関心が交わる地点で生まれたとも言われる。思想の背景としては、Aleister Crowleyの魔術体系、Austin Osman Spareの図像、Carlos Castanedaの著作、そしてMircea Eliadeのシャーマニズム研究といった書物が、影響源として挙げられることがある。

重要な先駆の一つが、イギリスのCoilだ。Peter ChristophersonとJohn Balanceが1982年に結成した。ChristophersonはThrobbing GristleとPsychic TVを、John BalanceはPsychic TVを経ていた。彼らは、魔術的な実践を制作そのものに組み込むことを公言していた。1990年代の作品では薬物体験（『Love's Secret Domain』、1991年）、1990年代末には月（『Moon's Milk』）を主題にし、儀式音楽の言葉づかいを電子音と結びつけた。John Balanceは2004年、自宅の2階部分（踊り場とも、バルコニーとも伝えられる）から転落して死去した。Christophersonも2010年に死去している。

並行して、Genesis P-Orridgeが1981年にThee Temple ov Psychick Youthを立ち上げた。これは音楽グループというより、実際に儀式を行う組織として運営され、Psychic TVの活動と切り離せなかった。1992年、この団体をめぐり、イギリスのテレビ局Channel 4の番組が、悪魔崇拝の騒ぎの中で、P-Orridgeが児童を虐待する映像があると主張した。警察は自宅を捜索した。しかし映像は、1980年代初頭の映像作品「First Transmissions」で、虐待ではなかった。Channel 4は告発を撤回した。それでもP-Orridgeは、公正な扱いを受けられないと考え、帰国せずアメリカ（のちニューヨーク）に移った。

しばしばこのジャンルと隣接して語られるのが、Dead Can Danceだ。1981年にオーストラリアのメルボルンで結成され、1982年にロンドンへ移った。Brendan Perryはブズーキ、ハーディガーディなどを、Lisa Gerrardはヤンチンなどを演奏した。アフリカ由来のリズムの影響も受け、Gerrardは自ら編み出した言語で歌った。1988年の「The Serpent's Egg」以降の作品は、のちの儀式的な音楽表現に影響を与えたとされる。

北欧では、1987年にスウェーデンでCold Meat Industryが設立された。Raison d'être、Ordo Rosarius Equilibrio、Arcanaといった作り手が、中世キリスト教（聖歌・教会音楽）やオカルト的な図像を用いた作品を発表した。

しばしばこのジャンルと隣接して語られる、ノルウェーのWardrunaは、2002年または2003年（資料により異なる）にEinar Selvikらが結成した。実際に古代北欧の楽器を作って演奏し、ルーン文字の体系に沿った3部作を発表した。後にテレビシリーズ「ヴァイキング〜海の覇者たち〜」の音楽で広く知られた。一方で、この系統は北欧異教の復興と結びついている。そのため、極右の民族主義運動に流用される危険を常に抱えている。Selvikは、極右の人々がルーン文字を汚していると批判し、極右との関係を公然と否定している。

2010年代以降では、しばしばこのジャンルと隣接して語られるHeilungが、2014年に結成された。人骨や鹿の骨を用いた楽器と大規模な演劇的な公演で、Castlefestなどの音楽祭で注目を集め、Glastonbury（2024年）にも出演した。</p>
