<h1>Ritual Ambient（リチュアルアンビエント）とは</h1>
<p>宗教儀式や呪術の場を音で再現、あるいは捏造することを目的としたアンビエントの一系統。中心となるのは打楽器の反復で、フレームドラムや大型の太鼓、ボウル、ゴングを不規則な間隔で強く打ち、その残響を長いリヴァーブで空間全体に満たす。旋律</p>
<p>宗教儀式や呪術の場を音で再現、あるいは捏造することを目的としたアンビエントの一系統。中心となるのは打楽器の反復で、フレームドラムや大型の太鼓、ボウル、ゴングを不規則な間隔で強く打ち、その残響を長いリヴァーブで空間全体に満たす。旋律楽器としては、チベットのシンギングボウル、ディジュリドゥ、ハーモニウム、ハルモニカ、笛、擦弦楽器のドローンが用いられ、いずれも西洋の平均律から外れた微分音を含む音程が意図的に選ばれる。人声の扱いが特徴的で、チベット仏教の倍音唱法(一人で複数の音を同時に出す)、モンゴルのホーミー、正教会風の低い斉唱、意味を持たない呪文めいた朗誦などが多重録音で重ねられる。歌詞は既存の宗教言語(サンスクリット、ラテン語、古ノルド語)か、あるいは作家が創作した架空の言語で、意味の伝達ではなく音節の身体的な効果が狙いになる。リズムには4拍子の均等な拍節を避け、7拍子や不定形の周期を用いて日常の時間感覚を外す設計がなされる。空間処理では実在の教会や洞窟のインパルス応答を用いたコンヴォリューション・リヴァーブが使われ、聴き手を特定の場所に置く効果を狙う。ダークアンビエントと素材を共有するが、恐怖ではなく変性意識や陶酔へ導く意図が明確な点、そして人間の身体行為(叩く、唱える、歩く)の痕跡を残す点が区別の要になる。</p>
<h2>成り立ち</h2><p>1980年代のインダストリアル文化と、1960年代以降のオカルト復興および民族音楽への関心が交差する地点で生まれた。思想的背景としてAleister Crowleyの魔術体系、Austin Osman Spareの図像、Carlos Castanedaの著作、そしてMircea Eliadeのシャーマニズム研究といった書物が、当時のアンダーグラウンド音楽家の間で共有されていた。直接の起源として重要なのがイギリスのCoilで、Peter ChristophersonとJohn Balanceが1982年に結成した。二人はThrobbing GristleとPsychic TVを経ており、魔術的実践を制作行為そのものに組み込むことを公言していた。1980年代後半から1990年代の作品では、月の満ち欠けや薬物体験を主題にし、儀式音楽の語彙を電子音と結合させた。Balanceは長年アルコール依存に苦しみ2004年に転落死、Christophersonも2010年に死去している。並行して、Genesis P-Orridgeが1981年に立ち上げたThee Temple ov Psychick Youthは、音楽グループというより実際に儀式を行う組織として運営され、Psychic TVの活動と不可分だった。この団体はイギリスで1992年にテレビ番組が儀式の映像を悪魔崇拝と結びつけて報道したことを機に捜査対象となり、P-Orridgeは事実上の亡命を余儀なくされた。もう一つの流れがオーストラリアのDead Can Danceで、Brendan PerryとLisa Gerrardは中世ヨーロッパと中東、アフリカの楽器を実際に演奏し、Gerrardは自ら編み出した言語で歌った。1988年の「The Serpent's Egg」以降の作品は、儀式的なアンビエントの主要な参照源になった。北欧ではスウェーデンのCold Meat Industryが1987年に設立され、Raison d'Etre、Ordo Rosarius Equilibrio、Arcanaといった作家が中世キリスト教や北欧異教の図像を用いた作品を発表した。ノルウェーのWardrunaは2003年にEinar Selvikが立ち上げ、実際に古代北欧の楽器を製作・演奏し、ルーン文字の体系に沿った3部作を発表、後にテレビシリーズ「ヴァイキング〜海の覇者たち〜」の音楽で広く知られた。この系統は北欧異教復興と結びついているため、極右の民族主義運動に流用される危険を常に抱えており、Selvikをはじめ複数の音楽家が公然と極右との関係を否定する声明を出している。2010年代以降はHeilungが2014年に結成され、鹿の角や人骨を用いた楽器と大規模な演劇的公演で欧米の音楽祭の主要な出演者となり、この分野を最も大衆的な規模へ押し上げた。</p>
