<h1>Sōkyoku（ソウキョク）とは</h1>
<p>箏（こと）という日本の弦楽器を奏でる室内楽。代表曲22曲を動画で聴け、ルーツと影響のつながりを地図でたどれる。</p>
<p>箏（こと）という日本の弦楽器を奏でる室内楽。13本の弦を張った約180cmの桐製の楽器を中心に据えた音楽の総称である。弦の下には調弦用の柱（じ）と呼ばれる駒を置き、右手の3本の指に爪（つめ）をはめて弦をはじく。左手の指で弦を押えて音程を上げる押し手や、弦をこするすり手といった技法が、音に独特のうねりと余韻を与える。調弦は平調子が基本で、都節音階と呼ばれる5音音階による旋律が中心になる。西洋音楽のように和音進行で曲を進めるのではなく、1本の旋律線とその装飾で音楽を作る点が特徴だ。打楽器は使わず、爪ではじく弦の粒立ちがリズムを担い、拍子は曲ごとに大きく異なる。歌を伴う曲では箏が歌の旋律を先取りしたり飾ったりし、地歌では三味線が、三曲合奏では尺八が加わって合わさる。曲の組み立てには、数段に分けた器楽曲の段物と、歌曲形式の組歌という二つの型がある。歌詞の主題は自然の風景、四季の移ろい、恋の心が多い。雅楽の箏が儀式の音楽なのに対し、こちらは世俗的な題材を扱い、中国の古箏とも調弦も奏法も異なる。現在も生田流と山田流の家元制度のもとで演奏され、邦楽のコンサートやホールの舞台で聴かれている。</p>
<h2>成り立ち</h2><p>箏の起源は中国にあり、7世紀から8世紀にかけて雅楽の楽器として日本に伝えられた。雅楽で使われた楽箏が日本の箏の直接の祖先である。中世には筑紫箏という流儀が生まれ、雅楽の伝統を守る修行の音楽として受け継がれた。近世に入り、筑紫箏の系譜を学んだ盲目の音楽家・八橋検校（1614〜1685）が当道座の検校として活躍した。八橋は三味線音楽で広まっていた都節音階を箏に持ち込み、従来の調弦を平調子や雲井調子へと改めた。この新調弦のもとで「六段の調」をはじめとする段物や、「菜蕗」「雲井の曲」などの箏組歌を作曲し、近代箏曲の祖とされる。八橋ののち、元禄の頃に京都の生田検校が箏曲を整理し、地歌と呼ばれる三味線音楽に箏を合奏させる形を広めた。これが生田流である。箏・三味線・尺八が合わさる演奏は三曲と呼ばれ、茶席などで親しまれた。しかし江戸では山田検校斗養一が、江戸っ子好みの浄瑠璃を取り入れた新作を作り、山田流を創始した。生田流が上方の地歌と結びついたのに対し、山田流は東京で歌を中心に発展した。江戸後期には光崎検校が「五段砧」「秋風の曲」を、吉沢検校が「千鳥の曲」「春の曲」などを作曲し、箏曲の芸術性はさらに深まった。しかし明治になると西洋音楽が流入し、三味線から独立した「明治新曲」が多く作られるようになった。寺島花野の「新高砂」や菊武祥庭の「稚児桜」がその例である。大正・昭和に入ると宮城道雄が西洋音楽の影響を受けた新曲を次々と発表した。尺八との合奏曲「春の海」は有名で、低音用の十七絃という楽器も開発した。大正末から昭和10年代には久本玄智や中能島欣一らも加わり、新しい作曲運動「新日本音楽」が盛り上がった。戦後はクラシック系の作曲家も創作に参入し、現代邦楽と呼ばれる分野が広がった。現在も生田流と山田流が主要な流派として続き、ポピュラー音楽の影響を受けた現代曲も作られている。</p>
<h2>代表曲</h2><ul><li>春の海 (宮城道雄)</li><li>六段の調 (八橋検校)</li><li>菜蕗 (八橋検校)</li><li>八段の調 (八橋検校)</li><li>五段砧 (光崎検校)</li><li>秋風の曲 (光崎検校)</li><li>千鳥の曲 (吉沢検校)</li><li>春の曲 (吉沢検校)</li><li>夏の曲 (吉沢検校)</li><li>新高砂 (寺島花野)</li><li>稚児桜 (菊武祥庭)</li><li>秋の調べ (宮城道雄)</li><li>落葉の踊り (宮城道雄)</li><li>泉 (宮城道雄)</li><li>瀬音 (宮城道雄)</li><li>茶音頭 (菊岡検校)</li><li>西行桜 (菊崎検校)</li><li>末の契 (松浦検校)</li><li>砧 (生田検校)</li><li>北海民謡調 (宮城道雄)</li><li>都踊 (宮城道雄)</li><li>江の島曲 (山田検校)</li></ul>
