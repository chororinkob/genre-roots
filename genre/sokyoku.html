<h1>Sōkyoku（ソウキョク）とは</h1>
<p>箏曲は、箏（こと）という日本の弦楽器を奏でる音楽だ。代表曲20曲を動画で聴け、ルーツと影響のつながりを地図でたどれる。</p>
<p>箏曲は、箏（こと）という日本の弦楽器を奏でる音楽だ。座敷や家庭など、比較的小規模な場で演奏されてきた。

中心になる楽器は箏。13本の弦を張った、全長約180〜190cmの桐製の楽器だ。この楽器を主役に据えた音楽の総称が箏曲である。弦の下には、調弦用の柱（じ）と呼ばれる駒を置く。右手の3本の指に爪（つめ）をはめて弦をはじく。左手の指で弦を押えて音程を上げる押し手や引き色、ゆり色といった技法が、音に独特のうねりと余韻を与える。

調弦は平調子が基本だ。都節音階と呼ばれる5音音階による旋律が中心になる。西洋音楽のように和音進行で曲を進めるのではない。基本は1本の旋律線とその装飾で音楽を作る。ただし、本手・替手による二部合奏や重音奏法もある。

打楽器は使わない。爪ではじく弦の粒立ちがリズムを担う。拍子は曲ごとに大きく異なる。

歌を伴う曲では、箏が歌の旋律を先取りしたり飾ったりする。地歌では三味線が、三曲の合奏では尺八が加わって合わさる。

歌詞は文学的だ。和歌、謡曲、漢詩、物語など、題材は多様である。

古典の基本形は、数段に分けた器楽曲の段物と、歌曲形式の組歌という、八橋作品の二種である。のちに地歌系の手事物や明治新曲などが加わった。

雅楽の箏が儀式の音楽なのに対し、箏曲は世俗的な題材を扱う。中国の古箏とも異なる。古箏は現代21本が代表的。現在も生田流と山田流の家元制度のもとで演奏され、邦楽のコンサートやホールの舞台で聴かれている。</p>
<h2>成り立ち</h2><p>箏の起源は中国にある。奈良時代（8世紀）に、雅楽の楽器として唐から伝わった。雅楽で使われた楽箏が、日本の箏の直接の祖先である。

雅楽や寺院歌謡をもとに、賢順らが箏の伴奏による歌曲として大成させたのが筑紫箏だ。筑紫箏は佐賀藩などで伝えられた。ただし、成立の事情には不明な点が多い。

近世に入り、筑紫箏の系譜を学んだ盲目の音楽家・八橋検校（1614〜1685）が、当道座の検校として活躍した。八橋は、当時民間で一般的になりつつあった都節音階を箏に持ち込み、従来の調弦を平調子や雲井調子へと改めた。この新しい調弦のもとで、「六段の調」など八橋作と伝えられる段物や、「菜蕗」「雲井の曲」などの箏組歌を作った。近世箏曲の祖とされる人物である。

八橋ののち、元禄の頃には京都の生田検校が箏曲を整理し、地歌と呼ばれる三味線音楽に箏を合奏させる形を広めたとされる。これが生田流である。地歌三味線・箏・胡弓による合奏は三曲と呼ばれる。のちに尺八も加わり、現在は尺八入りが主流である。

しかし江戸では、山田検校斗養一が江戸っ子好みの浄瑠璃を取り入れた新作を作り、山田流を創始した。生田流が上方の地歌と結びついたのに対し、山田流は江戸で歌を中心に発展した。

江戸後期には、光崎検校が「五段砧」「秋風の曲」を、吉沢検校が「千鳥の曲」「春の曲」などを作曲した。箏曲の芸術性はさらに深まった。

しかし明治になると西洋音楽が流入し、地歌から独立した「明治新曲」が多く作られるようになった。箏のみで、歌も含めた曲が増えた。寺島花野の「新高砂」や菊武祥庭の「稚児桜」がその例である。

大正・昭和に入ると、宮城道雄が西洋音楽の影響を受けた新曲を次々と発表した。尺八との合奏曲「春の海」は有名で、低音用の十七絃という楽器も開発した。新しい作曲運動「新日本音楽」は、1920年の新日本音楽大演奏会に始まり、大正末から昭和10年代に広がった。久本玄智や中能島欣一らも加わった。

戦後、特に1960年代後半以降は、クラシック系の作曲家も創作に参加し、現代邦楽と呼ばれる分野が広がった。現在も生田流と山田流が主要な流派として続き、ポピュラー音楽の影響を受けた現代曲も作られている。</p>
