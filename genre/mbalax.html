<h1>Mbalax（ムバラックス）とは</h1>
<p>ムバラは、セネガルで生まれたダンス音楽だ。主役は、複雑に重なり合う打楽器である。 中心になるのは、サバールと呼ばれる一群の太鼓だ。細長い胴に山羊の皮を張り、片手に細い棒を持ち、もう一方の手は素手で叩くという独特の奏法を使う。この棒</p>
<p>ムバラは、セネガルで生まれたダンス音楽だ。主役は、複雑に重なり合う打楽器である。

中心になるのは、サバールと呼ばれる一群の太鼓だ。細長い胴に山羊の皮を張り、片手に細い棒を持ち、もう一方の手は素手で叩くという独特の奏法を使う。この棒と手の音色の差によって、一人の奏者が、手のみ、棒のみ、手と棒の組み合わせの3区分の音を打ち分けられる。

複数のサバール奏者が、それぞれ違う音型を刻む。さらに、脇に挟んで音の高さを変えるタマという小型の太鼓が加わる。こうして、とても音が詰まった、何層ものリズムができあがる。これらのリズムはもともと、ウォロフ社会の(セレール人の宗教音楽ニュープなども溶け合ったとされる)儀礼や集会で演奏されるもので、話し言葉に由来するbàkkという楽句を含む。

この土台の上に、ギター、低音楽器、管楽器が乗る。キューバ由来と言えるのは、主にコード進行とブラスだ(コンゴの音楽なども影響した)。ギターの刻みには、サバール由来の要素が大きい。歯切れのよい刻みと、みんなで声を合わせるような明るい合奏が使われる。

歌はとても高い音域で、喉を張り上げ、細かな節回しをつけて歌われる。この装飾的な歌い方は、グリオの伝統から直接引かれたとされる。イスラームの詠唱の影響が聞き取れるとも言われる。言語は主にウォロフ語だ。歌詞は、社会への訴えや、宗教的な指導者への讃辞を扱う。</p>
<h2>成り立ち</h2><p>1960年の独立より前から、セネガルの首都ダカールの社交場では、キューバ音楽が一番の人気だった。

この音楽は、植民地の時代にレコードを通じて入ってきたもので、洗練のトレードマークとされた。地元の楽団は、スペイン語の歌詞を音で覚えて歌う例が多かった。

独立後の1970年代、この状況を見直そうという声が生まれる。自分たちの言語と、自分たちの土地のリズムで演奏すべきではないか、という意識である。

この転換の普及に大きく貢献したのが、Youssou N'Dourだった。彼は母方がグリオ(世襲的に歴史と系譜を語り継ぐ家系)で、12歳ごろから地域の宗教行事などで歌い始めた。ただし、本人はその伝統の中で育てられたわけではないとする説もある。

1976年、16歳の彼は、キューバ風の楽団Star Bandに加入する。そして次第に、ウォロフ語の歌詞を演奏に持ち込んでいく。サバールの太鼓そのものを加えたのは、もっと後である。

1970年代後半(説により1977〜79年)、彼はStar Bandを離れたメンバーらとÉtoile de Dakarを結成した。この楽団と、後のSuper Étoile de Dakarにおいて、この混ぜ合わせは進んだ。Étoile de Dakarは、最初のムバラのバンドとしばしば見なされる。その背景には、親バンドのStar Bandがすでにタマとウォロフ語の曲を取り入れ、先駆となっていたことがある。N'Dourは、Super Étoile期にサバールの太鼓を加えるなどして、その流れを推し進めた。

1980年代、彼は国際的な舞台に立つようになる。1984年には、Super Étoile de Dakarがパリのアフリカ・フェットでヨーロッパ初公演を行った。1986年にはPeter Gabrielの『In Your Eyes』に参加し、Gabrielの前座も務めた。1988年には、Human Rights Now!ツアーにも出演した。1994年にNeneh Cherryと歌った楽曲は、世界的な大ヒットとなった。2005年には、イスラームの精神性を主題とする作品で、国際的な音楽賞を受賞した。

並行して、国内ではThione SeckやOmar Peneが高い支持を保った。Baaba Maalは、北部の民族の伝統を土台とする別の系統を築いている。

この音楽は、宗教とも深く結びついている。セネガルの人口の約95〜97%はイスラーム教徒で、その大半がスーフィーの教団(ティジャーニーヤやムリッドなど)に属している。宗教的な主題も、歌詞に取り上げられる。Youssou N'Dourは後に政治の世界へ入り、大臣を務めるまでになった。現在も、ダカールの社交場で広く鳴らされる音楽であり続けている。</p>
