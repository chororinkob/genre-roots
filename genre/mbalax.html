<h1>Mbalax（ムバラックス）とは</h1>
<p>セネガルで生まれた、打楽器の複雑な重なりを主役とするダンス音楽である。核となるのはサバールと呼ばれる一群の太鼓で、細長い胴に山羊の皮を張り、片手に細い棒を持ち、もう一方は素手で叩くという独特の奏法が用いられる。この、棒と手の音色の</p>
<p>セネガルで生まれた、打楽器の複雑な重なりを主役とするダンス音楽である。核となるのはサバールと呼ばれる一群の太鼓で、細長い胴に山羊の皮を張り、片手に細い棒を持ち、もう一方は素手で叩くという独特の奏法が用いられる。この、棒と手の音色の差によって、一人の奏者が二種類の音を打ち分けることができる。複数のサバール奏者がそれぞれ異なる音型を刻み、さらに脇に挟んで音の高さを変えるタマという小型の太鼓が加わることで、極めて密度の高い多層のリズムが作られる。これらのリズムはもともと、ウォロフ社会の儀礼や集会において特定の意味を伝えるものであり、聴き手はその型を聞き分けることができる。この土台の上に、ギター、低音楽器、そして管楽器が乗る。ギターと管楽器の語法は意外にもキューバ音楽に由来し、歯切れの良い刻みと明るい斉奏が用いられる。歌唱は極めて高い音域で、喉を張り上げ、装飾を凝らして歌われ、イスラームの詠唱の影響が聞き取れる。言語はウォロフ語である。歌詞は社会への訴え、宗教的な指導者への讃辞、恋愛、そして共同体の道徳を扱う。</p>
<h2>成り立ち</h2><p>1960年の独立以前から、セネガルの首都ダカールの社交場では、キューバ音楽が圧倒的な人気を誇っていた。植民地期にレコードを通じて流入したこの音楽は、洗練の象徴とされ、地元の楽団はスペイン語の歌詞を意味も分からず模倣して歌っていた。独立後の1970年代、この状況に対する反省が生まれる。自分たちの言語と、自分たちの土地のリズムで演奏すべきではないかという意識である。この転換を最も鮮やかに実行したのがYoussou N'Dourだった。彼はグリオと呼ばれる、世襲的に歴史と系譜を語り継ぐ家系の出身であり、幼少期から儀礼の場で歌ってきた。1970年代末、彼はキューバ風の楽団に加わりながら、次第にウォロフ語の歌詞と、伝統的なサバールのリズムを演奏に持ち込んでいく。1979年に結成したÉtoile de Dakar、そして後のSuper Étoile de Dakarにおいて、この折衷は完成した。決定的だったのは、伝統の打楽器奏者を電気楽器の楽団に正式に組み込んだことである。1980年代、彼は欧米の音楽家に見出され、国際的な舞台に立つようになる。1994年にNeneh Cherryと歌った楽曲は世界的な大ヒットとなり、2005年にはイスラームの精神性を主題とする作品で国際的な音楽賞を受賞した。並行して、Thione SeckやOmar Peneが国内で高い支持を保ち、Baaba Maalは北部の民族の伝統を基盤とする別の系統を確立している。この音楽は宗教とも深く結びついている。セネガルの人口の大半はイスラームの一派に属しており、その指導者を讃える楽曲は最も重要な演目のひとつである。Youssou N'Dourは後に政治の世界へ入り、大臣を務めるに至った。現在も、ダカールの夜の社交場で最も鳴らされる音楽であり続けている。</p>
