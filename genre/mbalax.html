<h1>Mbalax（ムバラックス）とは</h1>
<p>セネガルで生まれた、打楽器が複雑に重なり合うことを主役とするダンス音楽である。核となるのはサバールと呼ばれる一群の太鼓で、細長い胴に山羊の皮を張り、片手に細い棒を持ち、もう一方は素手で叩くという独特の奏法が用いられる。この、棒と手</p>
<p>セネガルで生まれた、打楽器が複雑に重なり合うことを主役とするダンス音楽である。核となるのはサバールと呼ばれる一群の太鼓で、細長い胴に山羊の皮を張り、片手に細い棒を持ち、もう一方は素手で叩くという独特の奏法が用いられる。この、棒と手の音色の差によって、一人の奏者が2種類の音を打ち分けることができる。複数のサバール奏者がそれぞれ異なる音型を刻み、さらに脇に挟んで音の高さを変えるタマという小型の太鼓が加わることで、とても音が詰まった、何層ものリズムができあがる。これらのリズムはもともと、ウォロフ社会の(セレール人の宗教音楽ニュープなども溶け合った)儀礼や集会において特定の意味を伝える合図のようなものであり、聴き手はその型を聞き分けることができる。この土台の上に、ギター、低音楽器、そして管楽器が乗る。ギターと管楽器の語法は意外にも主にキューバ音楽に由来し(コンゴの音楽なども影響した)、歯切れのよい刻みと、みんなで声を合わせるような明るい合奏が使われる。歌はとても高い音域で、喉を張り上げ、細かな節回しをつけて歌われ、イスラームの詠唱の影響が聞き取れる。言語は主にウォロフ語である。歌詞は社会への訴え、宗教的な指導者への讃辞、恋愛、そして共同体の道徳を扱う。</p>
<h2>成り立ち</h2><p>1960年の独立以前から、セネガルの首都ダカールの社交場では、キューバ音楽が圧倒的な人気だった。植民地期にレコードを通じて流入したこの音楽は、洗練の象徴とされ、地元の楽団はスペイン語の歌詞を意味も分からず模倣して歌っていた。独立後の1970年代、この状況を見直そうという声が生まれる。自分たちの言語と、自分たちの土地のリズムで演奏すべきではないかという意識である。この転換を最も鮮やかに実行したのがYoussou N'Dourだった。彼は母方がグリオ(世襲的に歴史と系譜を語り継ぐ家系)で、12歳ごろから地域の宗教行事などで歌い始めた。ただし本人はその伝統の中で育てられたわけではないとする資料もある。1970年代末、彼はキューバ風の楽団に加わりながら、次第にウォロフ語の歌詞と、伝統的なサバールのリズムを演奏に持ち込んでいく。1970年代後半(資料により1977〜79年)にStar Bandを離れたメンバーらと結成したÉtoile de Dakar、そして後のSuper Étoile de Dakarにおいて、この混ぜ合わせは完成した。その背景には、親バンドのStar Bandがすでにタマとウォロフ語の曲を取り入れ、先駆となっていたことがある。N'Dourは、Super Étoile期にサバールの太鼓を加えるなどして、その流れを推し進めた。1980年代、彼は欧米の音楽家に見出され、国際的な舞台に立つようになる。1994年にNeneh Cherryと歌った楽曲は世界的な大ヒットとなり、2005年にはイスラームの精神性を主題とする作品で国際的な音楽賞を受賞した。並行して、Thione SeckやOmar Peneが国内で高い支持を保ち、Baaba Maalは北部の民族の伝統を基盤とする別の系統を確立している。この音楽は宗教とも深く結びついている。セネガルの人口の約89%はイスラーム教徒で、その大半がスーフィーの教団(ティジャーニーヤやムリッドなど)に属しており、宗教的な主題も歌詞に取り上げられる。Youssou N'Dourは後に政治の世界へ入り、大臣を務めるに至った。現在も、ダカールの社交場で広く鳴らされる音楽であり続けている。</p>
