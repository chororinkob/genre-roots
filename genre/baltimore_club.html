<h1>Baltimore Club（ボルチモアクラブ）とは</h1>
<p>アメリカ・メリーランド州ボルティモアで生まれた、極めて反復的で断片的なダンス音楽である。テンポはおおむね125〜130 BPMである。リズムの土台は四つ打ちのキックだが、その上に敷かれるのは既存の音源から取られた特定の打楽器の型で</p>
<p>アメリカ・メリーランド州ボルティモアで生まれた、極めて反復的で断片的なダンス音楽である。テンポはおおむね125〜130 BPMである。リズムの土台は四つ打ちのキックだが、その上に敷かれるのは既存の音源から取られた特定の打楽器の型である。とりわけLyn Collinsの「Think (About It)」(1972年)とGazの「Sing Sing」(1978年)のドラムの断片が、多くの曲の土台になっている。上物は極端に簡素で、有名なポップスやリズム・アンド・ブルースの歌の一節が短く切り刻まれ、同じ音節が連続して繰り返される。この連打によって言葉は意味を失い、打楽器の役割を担うことになる。加えて、演者や聴衆が発する短い掛け声が呼びかけと応答の形で配置され、聴き手は声を返すことが期待される。和声はほとんど動かない。DJ向けのトラックが中心だが、歌い手がヴァースを歌う、歌ものの曲構造を持つ作品も多く、旋律的な素材もサンプリングされる。</p>
<h2>成り立ち</h2><p>1980年代末のボルティモアは、製造業の衰退によって荒廃し、麻薬の売買と暴力が日常化した都市だった。この街の黒人の若者にとって、週末の踊りの場は数少ない解放の機会である。1990年前後、地元のDJたちが、シカゴのハウスとヒップホップを軸に、マイアミ・ベースや英国のレイヴ系のブレイクビーツなども混ぜて、ファンクなどの断片を大量に貼り付ける手法を実験し始めた。中心となったのはScottie B、Frank Ski、Shawn Caesarといった人物で、彼らは既存のレコード店で働きながら、店頭で互いのレコードを売り合った。この分野の特異な点として、Miss Tonyのような性的少数者の演者が初期から重要な役割を果たしたことが挙げられる。とりわけMiss Tony(本人はゲイの男性)は、この音楽の最も愛された声のひとつとなり、その存在は、保守的な環境における性的少数者の可視化という意味も持っていた。当初は地元ラジオの届く範囲が中心だった。作品は地元のラジオ局と、街角で売られる自作の音源、そして高校のダンスパーティーを通じて広まり、1990年代のうちにニュージャージーやボストン周辺、ヴァージニアなど近隣へ波及した。2000年前後、ニューアークのDJがこの音楽を持ち帰り、独自に発展させたことで、ニュージャージー州に派生の様式が生まれた。2000年代半ばには、アメリカの制作者Diploがこの音楽に注目し、地元のBlaqstarrらを国際的な舞台へ引き上げる。この過程については、外部の関心を搾取的だと見る地元の声があった。近年では女性の作り手TT the Artistらが、この音楽の起源と担い手を記録する活動を行っている。2020年代、短編動画の流行を通じて、この様式に由来するリズムが、ニュージャージーのJersey clubを介して世界的に広まった。</p>
