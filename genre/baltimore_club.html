<h1>Baltimore Club（ボルチモアクラブ）とは</h1>
<p>アメリカ・メリーランド州ボルティモアで生まれた、極めて反復的で断片的なダンス音楽である。テンポはほぼ一定して130 BPM前後に固定されており、この速度が様式の定義に含まれるほど厳格に守られる。リズムの土台は四つ打ちのキックだが、</p>
<p>アメリカ・メリーランド州ボルティモアで生まれた、極めて反復的で断片的なダンス音楽である。テンポはほぼ一定して130 BPM前後に固定されており、この速度が様式の定義に含まれるほど厳格に守られる。リズムの土台は四つ打ちのキックだが、その上に敷かれるのは既存の音源から取られた特定の打楽器の型である。とりわけ1970年代のファンクの録音から取られた二つの断片が、四半世紀にわたってほぼ全ての楽曲で使われ続けており、この共有された素材の上で差異を競うという構造は、ジャマイカの音楽文化と同じ発想である。上物は極端に簡素で、有名なポップスやリズム・アンド・ブルースの歌の一節が短く切り刻まれ、同じ音節が連続して繰り返される。この連打によって言葉は意味を失い、打楽器の役割を担うことになる。加えて、演者や聴衆が発する短い掛け声が呼びかけと応答の形で配置され、聴き手は声を返すことが期待される。和声はほとんど動かず、旋律も存在しない。曲は2分から3分と短く、構成は導入と反復のみである。踊るための実用に徹しており、録音単体で鑑賞することはほとんど想定されていない。</p>
<h2>成り立ち</h2><p>1980年代末のボルティモアは、製造業の衰退によって荒廃し、麻薬の売買と暴力が日常化した都市だった。この街の黒人の若者にとって、週末の踊りの場は数少ない解放の機会である。1990年前後、地元のDJたちが、シカゴのハウスの四つ打ちに、ファンクとヒップホップの断片を大量に貼り付けるという手法を実験し始めた。中心となったのはScottie B、Frank Ski、DJ Spenといった人物で、彼らはレコード店を兼ねた拠点を構え、自作の音源を直接販売した。この分野の特異な点として、初期から性的少数者の演者が中心にいたことが挙げられる。とりわけ女装して演じたMiss Tonyは、この音楽の最も愛された声のひとつとなり、その存在は、保守的な環境における性的少数者の可視化という意味も持っていた。流通は徹底して地元に限られた。作品は地元のラジオ局と、街角で売られる自作の音源、そして高校のダンスパーティーを通じて広まり、20年近くこの街の外へはほとんど出なかった。この閉鎖性が、極端に純化した様式を保つ結果にもつながっている。2000年前後、ニューアークのDJがこの音楽を持ち帰り、独自に発展させたことで、ニュージャージー州に派生の様式が生まれた。2000年代半ばには、アメリカの制作者Diploがこの音楽に注目し、地元のBlaqstarrらを国際的な舞台へ引き上げる。この過程では、外部の制作者が利益を得る一方、地元の作り手には10分な還元がなかったという批判が繰り返し提起された。近年では女性の作り手TT the Artistらが、この音楽の起源と担い手を記録する活動を行っている。2020年代、短編動画の流行を通じて、この様式のリズムは再び世界的に広まった。</p>
