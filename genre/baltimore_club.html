<h1>Baltimore Club（ボルチモアクラブ）とは</h1>
<p>ボルティモア・クラブは、アメリカ・メリーランド州ボルティモアで生まれたダンス音楽だ。とてもくり返しが多く、細切れの音をつなぎ合わせて作られる。 テンポはおおむね125〜130 BPMだ。リズムの土台は、裏拍を含む、シンコペーション</p>
<p>ボルティモア・クラブは、アメリカ・メリーランド州ボルティモアで生まれたダンス音楽だ。とてもくり返しが多く、細切れの音をつなぎ合わせて作られる。

テンポはおおむね125〜130 BPMだ。リズムの土台は、裏拍を含む、シンコペーションしたキックである。その上に、既存の音源から取った特定の打楽器の型が重ねられる。とくにLyn Collinsの「Think (About It)」(1972年)と、Gazの「Sing Sing」(1978年)のドラムの断片が、多くの曲の土台になっている。

上に重ねる音は、ごく簡素だ。有名なポップス、リズム・アンド・ブルース、ヒップホップ、テレビ番組の主題歌などの一節が短く切り刻まれ、同じ音節が続けて繰り返される。この連打によって言葉は意味を失い、打楽器の役目を担うと受け取られている。さらに、演者や聴衆が発する短い掛け声が、呼びかけと応答の形で入る。聴き手は声を返すことが期待される、と受け取られている。

DJ向けのトラックが中心だが、歌い手がヴァースを歌う、歌ものの曲の組み立てを持つ傾向もある。メロディーのある素材もサンプリングされる。</p>
<h2>成り立ち</h2><p>1980年代末のボルティモアは、製造業の衰退に加え、労働争議や殺人率の上昇、ヘロイン禍を抱えた都市だった。この街の黒人の若者にとって、週末の踊りの場は解放の機会だったとも言われる。

1980年代後半〜1990年代初頭、地元のDJたちが新しい手法を試し始めた。シカゴ・ハウスとヒップホップ、そして両者を混ぜたヒップハウスを軸に、マイアミ・ベースや英国のレイヴ系のブレイクビーツなども混ぜて、ファンクなどの断片を大量に貼り付けるやり方である。

中心となったのは、Scottie B、Frank Ski、Shawn Caesarといった人物だ。当時、CaesarはDJ's Outletで、Scottie BはInner City Recordsで働いていた。2人は「どちらが相手のレコードをより多く売れるか」を競った。一方、Frank Skiはラジオ(92Q)の人物で、2 Hyped Brothers &amp; A Dogの「Doo Doo Brown」(1991年)を制作した。

Miss Tonyのようなゲイの演者も、初期から重要な役割を果たした。とりわけMiss Tony(本人はゲイの男性)は、この音楽の広く愛された声となった。その存在は、保守的な環境の中で、性的少数者の存在を目に見える形にするという意味も持っていた。

当初は、地元ラジオの届く範囲が中心だった。作品は、地元のレコード店と12インチ盤、ホワイトレーベルの先行配布を含むラジオ、10代向けのクラブやローラースケート場などを通じて広まった。そして1990年代のうちに、ニュージャージーやボストン周辺、ヴァージニアなど、東海岸の各地へ波及した。

2000年前後には、ニューアークのDJがこの音楽を持ち帰り、独自に発展させた。こうして、ニュージャージー州に派生のスタイルが生まれた。

2000年代半ばには、アメリカの制作者Diploがこの音楽に注目し、地元のBlaqstarrらを国際的な舞台へ引き上げる。この流れについては、外部の関心を搾取的だと見る地元の声があった。一方で、地元のレーベルの側には、より大きな舞台に上げてくれたと受け止める見方もあった。

近年では、女性の作り手TT the Artistらが、この音楽の歴史と現在の担い手を記録する活動を行っている。そして2020年代、短編動画の流行を通じて、この音楽に由来するリズムが、ニュージャージーのJersey clubを介して世界中に広まった。</p>
