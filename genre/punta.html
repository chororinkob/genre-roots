<h1>Punta（プンタ）とは</h1>
<p>中央アメリカのカリブ海沿岸に暮らすガリフナの人々に伝わる、打楽器と歌による舞踊音楽である。中心となる楽器は二種類の太鼓で、低音を担うセグンダと、高音で複雑な即興を刻むプリメーロが対をなす。いずれも木をくり抜いた胴に動物の皮を張った</p>
<p>中央アメリカのカリブ海沿岸に暮らすガリフナの人々に伝わる、打楽器と歌による舞踊音楽である。中心となる楽器は二種類の太鼓で、低音を担うセグンダと、高音で複雑な即興を刻むプリメーロが対をなす。いずれも木をくり抜いた胴に動物の皮を張ったもので、素手で叩かれる。ここに亀の甲羅を叩く音、貝殻や種を詰めた振り物、そして手拍子が加わる。リズムは二拍を基本としながら、拍の内側を三つに割る感覚が同時に働く複合的な構造を持ち、この二つの数え方が重なることで独特の揺れが生まれる。テンポは速く、踊りは腰と尻を細かく激しく振る動きが中心となる。上体はほとんど動かさず、下半身だけを高速で動かすのが良しとされる。歌唱は女性が中心を担うのが伝統で、一人が短い句を歌い、他の女性たちが応答する掛け合いの形を取る。使われる言語はガリフナ語で、アラワク系の言語にカリブ系とアフリカ系、さらにフランス語や英語の語彙が混ざった独特のものである。歌詞は日常の出来事、噂話、亡くなった者への語りかけ、そして共同体内の諍いへの当てこすりを扱い、女性が社会的な不満を公に表明する場としても機能してきた。</p>
<h2>成り立ち</h2><p>ガリフナの人々の成立そのものが、この音楽の背景をなす。十七世紀、東カリブ海の小アンティル諸島に浮かぶセントビンセント島に、難破船や逃亡によってアフリカ系の人々が到達した。彼らは島の先住民である島カリブ族と混交し、独自の集団を形成する。言語は先住民のものを受け継ぎ、身体的な特徴と一部の文化はアフリカ由来という、他に例の少ない成り立ちを持つ集団が生まれた。十八世紀を通じて彼らはイギリスの支配に激しく抵抗したが、1796年に敗北する。翌1797年、イギリスは5000人規模の彼らを船に乗せ、ホンジュラス沖のロアタン島へ強制的に移送した。輸送中に多くが死亡し、生き残った者は中央アメリカ本土のカリブ海沿岸へ散り、現在のベリーズ、ホンジュラス、グアテマラ、ニカラグアへ広がった。この強制移住の記憶が、音楽と踊りの中に保存され続けている。プンタは本来、葬儀の際に行われる儀礼と結びついていた。故人を送る夜に演奏され、生命の力を確認する意味を持つ踊りとされる。すなわち死と性が同じ場で表現される音楽であり、外部の観察者にはしばしば猥雑な見世物として誤解されてきた。転機は1970年代後半である。ベリーズの音楽家ペン・カヤタノが、伝統的な太鼓の型をエレキギターに移し替える試みを始めた。太鼓の二つの声部をギターの低音弦と高音弦に振り分けるという発想で、これによって伝統的なリズムを保ったまま現代的な編成が可能になった。これを発展させたのがアンディ・パラシオらの世代で、電気楽器による編成を確立し、プンタ・ロックと呼ばれる形を作った。この動きは単なる音楽的な革新ではなく、失われつつあった言語と文化を若い世代につなぎ止めるための運動でもあった。当時、都市部やアメリカ合衆国へ移住した若者の間でガリフナ語を話せない世代が増えており、踊れる音楽として提示することが継承の手段となったのである。2001年、ガリフナの言語、舞踊、音楽は国際連合教育科学文化機関によって人類の口承及び無形遺産の傑作に宣言されている。</p>
