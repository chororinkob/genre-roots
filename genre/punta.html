<h1>Punta（プンタ）とは</h1>
<p>中央アメリカのカリブ海沿岸に暮らすガリフナの人々に伝わる、打楽器と歌による踊りの音楽である。 中心の楽器は2種類の太鼓だ。低い音を受け持つセグンダと、高い音で複雑な即興を刻むプリメーロが対になっている。どちらも木をくり抜いた胴に動</p>
<p>中央アメリカのカリブ海沿岸に暮らすガリフナの人々に伝わる、打楽器と歌による踊りの音楽である。

中心の楽器は2種類の太鼓だ。低い音を受け持つセグンダと、高い音で複雑な即興を刻むプリメーロが対になっている。どちらも木をくり抜いた胴に動物の皮を張ったもので、素手で叩く。ここに、ひょうたんに種を詰めて柄を付けた振り物(マラカス)、法螺貝、そして手拍子が加わる。近年加わった楽器として、亀の甲羅を棒で叩く例もある。

リズムは2拍子系の同じ型を刻み続けるのが基本だ。3拍子系の別の踊り(チュンバやフングフングなど)と組み合わされることも多い。テンポは速く、踊りは腰と尻を細かく激しく振る動きが中心になる。上体はほとんど動かさず、下半身だけを高速で動かす。ただし、元来の保守的な踊り方は腰を穏やかに揺らすもので、激しく挑発的な踊り方は別のスタイルとされる。

歌詞は、伝統的に女性が作ることが多い。一人が短い句を歌い、他の女性たちが応える掛け合いの形を取る。

使われる言語はガリフナ語だ。アラワク系の言語にカリブ系の語やフランス語・英語の語彙が混ざり、アフリカ系の語もわずかに含む、独特の言葉である。歌詞は日常の出来事や共同体の関心事、亡くなった者への語りかけ、死や苦しみを扱い、風刺や社会批評も含む。</p>
<h2>成り立ち</h2><p>この音楽の背景には、ガリフナの人々の成り立ちそのものがある。

17世紀、東カリブ海の小アンティル諸島に浮かぶセントビンセント島に、アフリカ系の人々が到達した。その経緯は難破船とも逃亡ともされ、諸説ある。彼らは島の先住民である島カリブ族と混ざり合い、独自の集団をつくる。言語は先住民のものを受け継ぎ、身体的な特徴と一部の文化はアフリカ由来という、他に例の少ない成り立ちを持つ集団が生まれた。

1763年以降、彼らはイギリスの入植に抵抗し、1769〜73年と1795〜96年に武力衝突した。しかし1796年に敗北する。同じ1796年にバリゾー島へ収容され、1797年3月に生存者約2,250人が船に乗せられた。彼らはホンジュラス沖のロアタン島へ強制的に移送され、約2,000〜2,500人がロアタン島に到着した。バリゾー島での収容中に約半数が死亡し、生存者の航海中にも死者が出た。生き残った者は中央アメリカ本土のカリブ海沿岸へ散り、現在のベリーズ、ホンジュラス、グアテマラ、ニカラグアへ広がった。

この強制移住の記憶は、音楽と踊りの中に今も保たれている。プンタは葬儀や通夜でも踊られ、現在は誕生会や祝日など多くの場でも行われる。死と喜びが同じ場で表される音楽だ。外部の観察者には、踊りが性的な表現と受け取られることがある。

転機は1970年代末から1980年代初め(1978〜1981年と諸説ある)である。ベリーズの音楽家ペン・カヤタノは、亀の甲羅を打楽器に取り入れ、電気楽器を導入して、伝統的な歌と打楽器を増幅した。プンタ・ロックの創始者として広く知られる。アンディ・パラシオらの世代は、その流行のなかでガリフナの文化運動を担った。

この動きは、単に音楽の新しさだけではなかった。失われつつあった言語と文化を、若い世代につなぎ止めるための運動でもあった。当時、都市部やアメリカ合衆国へ移住した若者の間で、ガリフナ語を話せない世代が増えていた。踊れる音楽として示すことが、受け継ぐための手段となったのである。

2001年、ガリフナの言語、舞踊、音楽は、国際連合教育科学文化機関によって人類の口承及び無形遺産の傑作に宣言された。2008年には、無形文化遺産の代表一覧表に記載された。</p>
