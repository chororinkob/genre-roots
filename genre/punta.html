<h1>Punta（プンタ）とは</h1>
<p>中央アメリカのカリブ海沿岸に暮らすガリフナの人々に伝わる、打楽器と歌による踊りの音楽である。中心となる楽器は2種類の太鼓で、低い音を受け持つセグンダと、高い音で複雑な即興を刻むプリメーロが対になっている。いずれも木をくり抜いた胴に</p>
<p>中央アメリカのカリブ海沿岸に暮らすガリフナの人々に伝わる、打楽器と歌による踊りの音楽である。中心となる楽器は2種類の太鼓で、低い音を受け持つセグンダと、高い音で複雑な即興を刻むプリメーロが対になっている。いずれも木をくり抜いた胴に動物の皮を張ったもので、素手で叩かれる。ここに貝殻や種を詰めた振り物(マラカス)、法螺貝、そして手拍子が加わる。亀の甲羅を打楽器に使う例もある。リズムは2拍子系の同じ型を刻み続けるのが基本で、3拍子系の別の踊り(チュンバやフングフングなど)としばしば組み合わされる。テンポは速く、踊りは腰と尻を細かく激しく振る動きが中心となる。上体はほとんど動かさず、下半身だけを高速で動かすのが良しとされる。女性が作詞や歌唱の中心を担うことが多く、一人が短い句を歌い、他の女性たちが応答する掛け合いの形を取る。使われる言語はガリフナ語で、アラワク系の言語にカリブ系とアフリカ系、さらにフランス語や英語の語彙が混ざった独特のものである。歌詞は日常の出来事、噂話、亡くなった者への語りかけ、そして村の人たちの間のいさかいへの当てこすりを扱い、女性が社会的な不満を公に表明する場としても機能してきた。</p>
<h2>成り立ち</h2><p>ガリフナの人々の成り立ちそのものが、この音楽の背景にある。17世紀、東カリブ海の小アンティル諸島に浮かぶセントビンセント島に、難破船や逃亡によってアフリカ系の人々が到達した。彼らは島の先住民である島カリブ族と混ざり合い、独自の集団をつくる。言語は先住民のものを受け継ぎ、身体的な特徴と一部の文化はアフリカ由来という、他に例の少ない成り立ちを持つ集団が生まれた。18世紀を通じて彼らはイギリスの支配に激しく抵抗したが、1796年に敗北する。翌1797年、イギリスは5000人規模の彼らを船に乗せ、ホンジュラス沖のロアタン島へ強制的に移送した。輸送中に多くが死亡し、生き残った者は中央アメリカ本土のカリブ海沿岸へ散り、現在のベリーズ、ホンジュラス、グアテマラ、ニカラグアへ広がった。この強制移住の記憶が、音楽と踊りの中に保存され続けている。プンタは葬儀や通夜でも踊られ、現在は誕生会や祝日など多くの場でも行われる。死と喜びが同じ場で表現される音楽であり、外部の観察者にはしばしば猥雑な見世物として誤解されてきた。転機は1970年代末から1980年代初め(資料により1978〜1981年)である。ベリーズの音楽家ペン・カヤタノが、亀の甲羅を打楽器に取り入れ、電気楽器を導入して、伝統的な歌と打楽器を増幅するプンタ・ロックを作った。アンディ・パラシオらの世代は、その流行のなかでガリフナの文化運動を担った。この動きは単なる音楽の新しさだけではなく、失われつつあった言語と文化を若い世代につなぎ止めるための運動でもあった。当時、都市部やアメリカ合衆国へ移住した若者の間でガリフナ語を話せない世代が増えており、踊れる音楽として提示することが継承の手段となったのである。2001年、ガリフナの言語、舞踊、音楽は国際連合教育科学文化機関によって人類の口承及び無形遺産の傑作に宣言されている。</p>
