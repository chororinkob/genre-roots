<h1>J-Eurobeatとは</h1>
<p>イタリア産ユーロビートの型をそのまま用いながら、日本人歌手が日本語で歌う、あるいは日本のJ-POPの楽曲をユーロビート風に編曲した形態。BPMは150〜160、四つ打ちのキック、駆け上がる16分音符のシンセベース、サビ前の上昇音型</p>
<p>イタリア産ユーロビートの型をそのまま用いながら、日本人歌手が日本語で歌う、あるいは日本のJ-POPの楽曲をユーロビート風に編曲した形態。BPMは150〜160、四つ打ちのキック、駆け上がる16分音符のシンセベース、サビ前の上昇音型といった骨格は本家と同一で、変わるのは歌詞の言語と旋律の作り方である。日本語は一音節あたりの母音が明確で子音が少ないため、英語より音符に対して字数が多く必要になり、結果として符割りが細かく、言葉数の詰まった歌唱になる。旋律も歌謡曲の影響で、短調の哀愁を強調した動きや、サビの頭で最高音に飛ぶ構成が好まれる。編曲面ではオリジナルより上物の音数がやや多く、シンセのオブリガート（歌の合間を埋める装飾旋律）が厚めに入る傾向がある。歌詞の主題は恋愛の切なさと別れ、夜の街、疾走感で、原詞の翻訳ではなく日本語で新たに書き下ろされるのが通例。カラオケでの歌唱、パラパラの振り付け、そしてクラブでの連続再生を前提に作られており、既存のJ-POPヒット曲をカバーする形も多い。歌謡曲的な情緒とヨーロッパ産の機械的な推進力が同居する点が最大の聴きどころである。</p>
<h2>成り立ち</h2><p>1990年代の日本で、イタリア産ユーロビートの人気が頂点に達したことを受けて派生した。土台にあるのは1990年から続くエイベックスのコンピレーション・シリーズSuper Eurobeat で、その日本語版・国内制作版という位置づけで各種の派生シリーズが企画された。前史としては1980年代後半のコンピレーションThat's Eurobeat が日本市場にこの音を根付かせており、その流れを汲む国内制作路線と、既存のJ-POPをユーロビート編曲でカバーするシリーズが並行して育った。1995年から2000年代にかけては、エイベックスがMAX、globe、hitomi、そしてtrf といった自社アーティストの楽曲をユーロビート編曲でリミックスし、原盤とは別商品として大量に販売した。もう一つの柱がアニメ主題歌のユーロビート編曲で、『頭文字D』関連作品では日本語詞の楽曲も制作された。歌手側では、m.o.v.e が1997年の結成以来、ラップと女性ボーカルにユーロビート的な高速ビートを組み合わせ、『頭文字D』の主題歌を継続的に担当したことで、日本語ユーロビートの代表格となった。制作面では、イタリアのA-Beat C やTime Records から供給されたカラオケ音源に日本語詞を乗せる方式と、日本人編曲家が一から作る方式が併存した。文化的背景としては、1990年代のディスコおよびクラブでのパラパラの流行、アーケードの音楽ゲームによる若年層への浸透、そしてカラオケ産業の拡大が重なり、日本語で歌えるユーロビートへの需要が生じたことが大きい。2000年代半ば以降、パラパラ・ブームの終息とCD市場の縮小により制作は大きく減ったが、m.o.v.e の楽曲や『頭文字D』関連曲は現在も配信と動画共有サイトを通じて聴かれ続けており、近年は海外のインターネット文化を経由して逆輸入的に再注目されている。</p>
<h2>代表曲</h2><ul><li>Feel Like Dance (globe)</li><li>TRY ME 〜私を信じて〜 (安室奈美恵)</li><li>EZ DO DANCE (TRF)</li><li>Survival dAnce 〜no no cry more〜 (TRF)</li><li>Body Feels EXIT (安室奈美恵)</li></ul>
