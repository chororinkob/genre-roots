<h1>J-Eurobeatとは</h1>
<p>イタリア産ユーロビートの型をそのまま用いながら、日本人歌手が日本語で歌う、あるいは日本のJ-POPの楽曲をユーロビート風に編曲した形態。BPMは140以上のものが多く、四つ打ちのキック、駆け上がる16分音符のシンセベース、サビ前の</p>
<p>イタリア産ユーロビートの型をそのまま用いながら、日本人歌手が日本語で歌う、あるいは日本のJ-POPの楽曲をユーロビート風に編曲した形態。BPMは140以上のものが多く、四つ打ちのキック、駆け上がる16分音符のシンセベース、サビ前の上昇音型といった土台は本家と同じで、変わるのは歌詞の言語と旋律の作り方である。日本語は一音節あたりの母音が明確で子音が少ないため、英語より音符に対して字数が多く必要になり、結果として音符の割り当てが細かく、言葉数の詰まった歌唱になる。メロディーも歌謡曲の影響で、短調の哀愁を強調した動きや、サビの頭で最高音に飛ぶ構成が好まれる。編曲面ではオリジナルより上に重ねる音の数がやや多く、シンセのオブリガート（歌の合間を埋める装飾旋律）が厚めに入る傾向がある。歌詞の主題は恋愛の切なさと別れ、夜の街、疾走感で、原詞の翻訳ではなく日本語で新たに書き下ろされるのが通例。カラオケでの歌唱、パラパラの振り付け、そしてクラブでの連続再生を前提に作られており、既存のJ-POPヒット曲をカバーする形も多い。歌謡曲的な情緒とヨーロッパ産の機械的な推進力が同居する点が最大の聴きどころである。</p>
<h2>成り立ち</h2><p>日本人歌手によるユーロビートは1980年代からすでにあり、1990年にSuper Eurobeatが再始動し、1995〜96年頃にエイベックス系アーティストのJ-EUROが本格化した。始まりを1本の線で断定することはできず、1990年代前半の日本ではユーロビート自体の人気は下がっていた。土台にあるのは1990年に始まったコンピレーション・シリーズSuper Eurobeat(エイベックス独自の発売はVol.9の1990年11月から)で、その日本語版・国内制作版という位置づけで各種の派生シリーズが企画された。前史としては1986年に始まり1994年頃まで続いたコンピレーションThat's Eurobeat が日本市場にこの音を根付かせており、その流れを汲む国内制作路線と、既存のJ-POPをユーロビート編曲でカバーするシリーズが並行して育った。1995〜96年頃には、A-Beat C系の楽曲を日本人アーティストが歌うJ-EUROが人気になった(安室奈美恵「TRY ME」、MAX「TORA TORA TORA」など)。1999〜2001年頃には、MAX(HYPER EURO MAX、2000年6月)、globe(EURO global、2000年8月)、trf(SUPER EUROBEAT収録など)らの楽曲のユーロビート・リミックスが展開した。もう一つの柱がアニメ主題歌のユーロビート編曲で、『頭文字D』関連作品では日本語詞の楽曲も制作された。歌手側では、m.o.v.e は1997年に結成され、ダンスミュージックを基調に幅広いジャンルを手がけるなかで、『頭文字D』の主題歌を継続的に担当した。制作面では、イタリアのA-Beat C やTime Records から供給されたカラオケ音源に日本語詞を乗せる方式と、日本人編曲家が一から作る方式が併存した。文化的背景としては、1990年代のディスコおよびクラブでのパラパラの流行、アーケードの音楽ゲームによる若年層への浸透、そしてカラオケ産業の拡大が重なり、日本語で歌えるユーロビートへの需要が生まれたことが大きい。2000年代前半、第3次パラパラブーム(1999〜2001年)が終息した2002年頃以降は制作が減ったが、m.o.v.e の楽曲や『頭文字D』関連曲は現在も配信と動画共有サイトを通じて聴かれ続けており、近年は海外のインターネット文化を経由して逆輸入的に再注目されている。</p>
<h2>代表曲</h2><ul><li>Feel Like Dance (globe)</li><li>EZ DO DANCE (TRF)</li><li>Gamble Rumble (m.o.v.e)</li><li>Rage Your Dream (m.o.v.e)</li><li>Running in the 90's (Max Coveri)</li><li>Around the World (m.o.v.e)</li><li>Survival dAnce 〜no no cry more〜 (TRF)</li><li>Chase the Chance (安室奈美恵)</li><li>Give me a Shake (MAX)</li><li>DEPARTURES (globe)</li><li>BOY MEETS GIRL (TRF)</li><li>Body Feels EXIT (安室奈美恵)</li><li>TRY ME 〜私を信じて〜 (安室奈美恵)</li><li>Don't Stop the Music (Dave Rodgers)</li></ul>
