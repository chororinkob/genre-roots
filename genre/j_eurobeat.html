<h1>J-Eurobeatとは</h1>
<p>これは、イタリア産ユーロビートの型をそのまま使いながら、日本人歌手が日本語で歌う音楽だ。日本のJ-POPの曲をユーロビート風に編曲したものも、この形に入る。 土台は本家と同じだ。BPMは140以上のものが多い。四つ打ちのキック、駆</p>
<p>これは、イタリア産ユーロビートの型をそのまま使いながら、日本人歌手が日本語で歌う音楽だ。日本のJ-POPの曲をユーロビート風に編曲したものも、この形に入る。

土台は本家と同じだ。BPMは140以上のものが多い。四つ打ちのキック、駆け上がる16分音符のシンセベース、サビ前の上昇音型が、その柱になる。変わるのは、歌詞の言語とメロディーの作り方である。

メロディーは、短調の哀愁を強めた動きが好まれ、歌謡曲の影響とも言われる。サビの頭で最高音に飛ぶ構成も好まれるとされる。

歌い方には、日本語ならではの特徴が出る。日本語は一音節あたりの母音がはっきりしていて、子音が少ない。そのため英語より、音符に対して多くの字数が必要になる。結果として、音符の割り当てが細かくなり、言葉数の詰まった歌唱になると考えられる。

曲の作り方では、イタリア製の曲に日本語の歌詞を付けるカバー型が代表的である。既存のJ-POPのヒット曲をカバーする形も多い。パラパラの振り付けは、ユーロビートに付けられたものだ。1990年代のカラオケでの提供が、カバー曲の人気を後押しした。

歌謡曲らしい情緒と、ヨーロッパ産の機械的な推進力が同居している。そこが最大の聴きどころである。</p>
<h2>成り立ち</h2><p>日本人歌手によるユーロビートは、1980年代からすでにあった。

前史となったのが、That's Eurobeat（アルファレコード、1986年10月〜1994年2月）だ。このシリーズは、洋楽のユーロビートと日本独自の曲の両方を収め、日本のディスコ市場で広く流行した。

1990年1月21日には、Super EurobeatがBEATFREAK発・エイベックス日本発売で始まった。土台にあるのは、1990年に始まったコンピレーション・シリーズSuper Eurobeatだ(エイベックス独自の発売はVol.9の1990年11月から)。ここから、派生シリーズ（J-Euroシリーズ、頭文字D関連、リミックス企画など）が展開された。

とはいえ、始まりを1本の線で断定することはできない。1990年代前半の日本では、SUPER EUROBEATは目立たなかったが、水面下で制作と刊行は続いていた。

1995〜96年頃に、J-EUROが本格化したとされる。1995〜96年頃には、A-Beat C系の曲を日本人アーティストが歌うJ-EUROが、人気を集めた(安室奈美恵「TRY ME」、MAX「TORA TORA TORA」など)。1999〜2001年頃には、MAX(HYPER EURO MAX、2000年6月)やglobe(EURO global、2000年8月)らの曲の、ユーロビート・リミックスが展開した。

もう一つの柱がアニメだ。アニメ『頭文字D』では、バトルシーンにSUPER EUROBEAT曲が使われ、OP/EDはm.o.v.eが歌った。『頭文字D』関連作品では、日本語詞の曲も作られた。歌手の側では、m.o.v.eが1997年に結成された。ダンスミュージックを基調に幅広いジャンルを手がけながら、『頭文字D』の主題歌を続けて担当した。

制作の面では、次の方式が並んでいた。イタリアのA-Beat CやTime Recordsから届いたカラオケ音源に、日本語詞を乗せる方式。そして、日本人編曲家が一から作る方式である。

背景には、1990年代のディスコやクラブでのパラパラの流行があった。アーケードの音楽ゲームが若い世代に広め、カラオケ産業も拡大した。これらが重なったことが、日本語で歌えるユーロビートへの需要が生まれた要因の一つとされる。

2000年代前半、第3次パラパラブーム(1999〜2001年)は、2002年以降に終息した。それでも、m.o.v.eの曲や『頭文字D』関連曲は、今も配信と動画共有サイトで聴かれ続けている。近年は『頭文字D』の影響で、海外でネットミーム化した。</p>
