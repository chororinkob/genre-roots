<h1>Japanoise（ジャパノイズ）とは</h1>
<p>1970年代末の日本の地下から生まれた、極めて過激なノイズ音楽だ。代表曲22曲を動画で聴け、ルーツと影響のつながりを地図でたどれる。</p>
<p>1970年代末の日本の地下から生まれた、極めて過激なノイズ音楽だ。「Japanese」と「noise」を混ぜた造語で、メルツバウや非常階段、インキャパシタンツらの活動を指し、主に海外、なかでも北米のインディー・メディアで定着した呼び名である。

音の源は、楽器よりも機材そのものだ。メルツバウの秋田昌美は、ギターのフィードバックだけでなく、ソニーのモノラル・カセットレコーダーやテープ・ループ、ミキサーのフィードバック、金属弦の自作楽器を使い、音を削り、刻み、つなぎ合わせた。エフェクターは1990年代後半のBOSS SE-70などが中心で、モジュラーは近年の機材だ。ハナタラシの山塚アイは、ドリルや電動工具を持ち込み、演奏の一部として鳴らした。インキャパシタンツの美川俊治は、主にフィードバックとヴォーカル、各種のエレクトロニクスを使い、音楽的な発想や人間の意図にも影響されない「純粋なノイズ」を目指した。ソルマニアは、大野雅彦が1984年に大阪で始めたプロジェクトだ。大野は、自作した実験的なエレクトリック・ギターをライブや録音で使う。

和音やメロディ、音階といった要素は、ほとんど捨てている。調性のある歌は出てこない。

リズムも、一定の拍子も保たない。数えられる拍もなく、音の塊が重なり、途切れ、また押し寄せる。ただしメルツバウは、MerzbeatやMerzbirdでは太いビートを混ぜる例も見せた。

歌い方として、歌はほとんどない。叫びやうめき、マイクを通した音の奔流が「声」の代わりを務める。歌詞もほとんど存在しない。インキャパシタンツが、銀行員や公務員という昼の仕事にちなんだ題名を付けたように、言葉は曲名や作品タイトルの側に回る。

曲の組み立てには、最初から最後まで最大音量を張り通す一点突破型と、低い音の層を長く積み上げるドローン型という傾向がある。ディストーションは効果音ではなく、音そのものとして使われる。

ロックの枠を残すノイズロックとの分かれ道は、楽曲の形式を捨てた点だ。この過激さは、のちのハーシュ・ノイズにつながるとともに、音と音のあいだの静けさを聴くオンキョーという分岐の一つとされる。

音は、ライブハウスとカセット、CDの中で鳴る。客席に立つと、音というより圧迫であり、耳鳴りのように体に残る。</p>
<h2>成り立ち</h2><p>この流れの前史は、1960年までさかのぼる。1960年、小杉武久や刀根康尚を含む6人の若い音楽家が「グループ・音楽」を結成し、5月8日にはノイズを使ったテープ作品「Automatism」と「Object」を残した。これは前衛音楽の実験にとどまり、直接の流れにはならなかったが、音そのものでノイズを作る例として、ジャパノイズ史の記述でしばしば先駆として挙げられる。

動き出すのは1970年代末だ。セックス・ピストルズの解散と前後してパンクが日本に上陸し、東京ではロッカーズ、関西（京都・神戸・大阪）では関西ノーウェイヴという二つの流れができた。後にノイズへ進む面々は、まずここで音を鳴らし始めた。ウルトラ・ビデのJOJO広重とHideも、その一人だった。

1979年、京都で非常階段が生まれた。螺旋階段というバンドのJOJO広重と頭士奈生樹に、高山謙一を含めた3人がセッションを行い、その中で高山が「これは螺旋じゃなくて非常階段だ」と言ったのが、名前の由来である。高山は最初のリハーサルのあとでバンドを離れ、1979年秋のライブには現れなかった。同じ年の秋には、京都の喫茶店ドラッグ・ストアで初ライブを果たした。1980年6月、新宿ACBホールに出ていたのは、JOJO広重が組んだ新バンド「腐食のマリィ」だった。主催側の工藤冬里が、これを誤って「非常階段」と告知し、その名を再び使うことになった。1980年から翌年にかけては、照明を割り、消火器を噴き、生魚を撒くといった演奏で噂になった。1980年12月にはスプリット盤「終末処理場」が出て、雑誌フールズメイトで秋田昌美が批評を書いた。

1979年には、秋田昌美が自室でメルツバウを始めている。名前は、ダダの芸術家クルト・シュヴィッタースの作品Merzbauから取った。ルー・リードの「Metal Machine Music」を、刺激を受けた作品の一つとして、ギターのフィードバックだけに頼らない音の抽象化を進めた。以降、500を超える作品を発表することになる。

1981年（資料により1980年とも）、大阪で美川俊治がインキャパシタンツを始めた。上京後に小堺文雄が加わり、2人は主にフィードバックとヴォーカル、各種のエレクトロニクスを使い、音楽的な発想や人間の意図にも影響されない「純粋なノイズ」を目指した。1983年には、山塚アイがハナタラシを結成している。最初のLP『Hanatarashi』（1985）から『2』（1988）、『3』（1989とされる）へと進むにつれ、音は破壊の波へと変わっていった。ライブではショベルカーで会場の壁を突き破ったり、丸ノコを背負って自分の脚を切りそうになったこともあり、多くの会場から出禁になった。

しかし1980年代後半には、次の世代が育っていった。活動を始めた時期が資料と合わない人も複数いる。KK NULLは1985年にレーベルNux Organizationを立ち上げ、ドイツのDossier社向けに、日本のノーウェイヴ／オルタナティブ音楽の編集盤を作った。ボアダムズの初のリリースであるEP「Anal by Anal」は、1986年に出た。マゾンナ、ソルマニア、K2、MSBR、Aube、ペイン・ジャークらも、自作の機材とカセットで活動を広げていった。その拠点となったのが、JOJO広重が1984年に大阪で設立したアルケミー・レコードで、非常階段、ハナタラシ、マゾンナ、インキャパシタンツ、メルツバウの作品を世に送り出した。

一方、日経平均が最高値を付けたのは1989年12月29日である。そのころから、海外の注目が高まっていった。ニューヨーク側では、ジョン・ゾーンとソニック・ユースが仲介役を務めた。灰野敬二や暴力温泉芸者がソニック・ユースと共演し、マゾンナはBeckの前座を務めた。NULLのゼニ・ゲバは海外で強い評価を得て、ボアダムズはNirvanaのアルバム「In Utero」の時期に共演した。

2009年には、The Wire誌のニック・ケインが、メルツバウ、非常階段、インキャパシタンツの優位を、1990年以降のノイズ音楽における大きな動きの一つと評した。インキャパシタンツが初めて海外で公演を行ったのは1999年、オーストリアのウェルズでの音楽祭である。2000年には、メルツバウの50枚組の編集ボックス「Merzbox」が出た。ノッティンガム大学教授のポール・ヘガティは2007年、日本で作られたノイズの登場以降でなければ、ノイズ音楽という言葉は多くの点で意味を持たないと書いている。</p>
