<h1>Japanoise（ジャパノイズ）とは</h1>
<p>1980年代の日本の地下から生まれた、極めて過激なノイズ音楽である。代表曲22曲を動画で聴け、ルーツと影響のつながりを地図でたどれる。</p>
<p>1980年代の日本の地下から生まれた、極めて過激なノイズ音楽である。「Japanese」と「noise」を混ぜた造語で、メルツバウや非常階段、インキャパシタンツらの活動を世界が呼ぶときに使う名前である。

音の源は、楽器というより機材そのものである。メルツバウの秋田昌美は、ギターのフィードバックだけでなく、オープンリールのテープ、ミキサー、エフェクター、各種の電子モジュールを使って、音を削り、刻み、つなぎ合わせた。ハナタラシの山塚アイはドリルや電動工具を持ち込み、演奏の一部として鳴らした。インキャパシタンツの美川俊治はフィードバックと電子音だけに頼り、音楽の意図さえ排した「純粋なノイズ」を掲げた。ソルマニアのような改造ギターの乱用もある。

和音、メロディ、音階といった要素を、ほぼ捨てている。調性のある歌は出てこない。

リズムも一定の拍子も保たない。数えられるような拍もなく、音の塊が重なり、途切れ、再び押し寄せる。ただしメルツバウはMerzbeatやMerzbirdでは、太いビートを混ぜる例も見せた。

歌い方として、歌はほとんどない。叫び、うめき、マイク越しの奔流が「声」の代わりを務める。歌詞もほぼ存在しない。インキャパシタンツが銀行員や公務員の昼職にちなんだ題名を付けたように、言葉は曲名や作品タイトルの側に回る。

曲の組み立ては二種類に大別される。最初から最後まで最大音量を張り通す一点突破型と、低い音の層を長く積み上げるドローン型である。ディストーションは効果音ではなく、音そのものとして使われる。

ロックの枠を残すノイズロックとの分かれ道は、楽曲の形式を捨てた点である。この過激さがのちのハーシュ・ノイズの土台となり、音と音のあいだの静けさを聴くオンキョーという分岐も生んだ。

音はライブハウスとカセット、CDの中で鳴る。客席に立つと、音というより圧迫であり、耳鳴りのように身体に残る。</p>
<h2>成り立ち</h2><p>流れの前史は1960年までさかのぼる。5月8日、小杉武久や刀根康尚を含む6人の若い音楽家が「グループ・音楽」を結成し、ノイズを用いたテープ作品「Automatism」と「Object」を残した。前衛音楽の実験にとどまり、直接の流れにはならなかったが、音そのものでノイズを作る先例となった。

動き出すのは1978年である。セックス・ピストルズの解散と前後してパンクが日本に上陸し、東京ではロッカーズ、大阪では関西ノーウェイヴという二つの流れができた。後にノイズへ走る面々は、まずここで鳴らし始めた。ウルトラ・ビデのJOJO広重とHideもその一人だった。

1979年、京都で非常階段が生まれる。螺旋階段というバンドのJOJO広重と頭士奈生樹が即興セッションを行い、見ていた高山謙一が「これは螺旋じゃなくて非常階段だ」と言ったのが名前の由来である。同年秋には京都の喫茶店ドラッグ・ストアで初ライブを果たした。1980年6月、新宿ACBホールでの出演を誤記で「非常階段」と案内され、その名が定着した。1980年から翌年にかけて、照明を割り、消火器を噴き、生魚を撒くといった演奏で噂になった。1980年12月にはスプリット盤「終末処理場」が出て、雑誌フールズメイトで秋田昌美が批評を書いた。

1979年には秋田昌美が自室でメルツバウを始めている。名前はダダの芸術家クルト・シュヴィッタースの作品Merzbauから取った。ルー・リードの「Metal Machine Music」を出発点に、ギターのフィードバックだけに頼らない音の抽象化を進めた。以降、500を超える作品を発表することになる。

1981年、大阪で美川俊治がインキャパシタンツを始める。上京後に小堺文雄が加わり、二人はフィードバックと電子音だけで、音楽の意図すら排した「純粋なノイズ」を掲げた。1983年には山塚アイがハナタラシを結成した。1985年の1作目「Hanatarashi」から1988年の「2」、1989年の「3」へと進むにつれ、音は破壊の波へと変わっていった。ライブではショベルカーで会場の壁を突き破り、丸ノコを背負って自らの脚を切りそうになったこともあり、多くの会場から出禁になった。

しかし1980年代後半には、次の世代が育った。KK NULLが1985年にレーベルNux Organizationを立ち上げ、ドイツのDossier社向けの編集盤で日本の流れを海外へ紹介した。ボアダムズの1st「Anal by Anal」は1986年に出た。メイソンナ、ソルマニア、K2、MSBR、Aube、ペイン・ジャークらが自作機材とカセットで活動を広げた。拠点になったのが、JOJO広重が運営する大阪のアルケミック・レコードであり、非常階段、ハナタラシ、メイソンナ、インキャパシタンツ、メルツバウの作品を世に出した。

一方、1989年にバブル経済が崩れる前後から、海外の注目が一気に高まった。ニューヨーク側ではジョン・ゾーンとソニック・ユースが仲介役となった。灰野敬二や暴力温泉芸者がソニック・ユースと共演し、メイソナはBeckの前座を務めた。NULLのゼニ・ゲバは日本より海外で人気を得て、ボアダムズはNirvanaのアルバム「In Utero」の時期に共演した。

それでも1990年代には、The Wire誌のニック・ケインが、メルツバウ、非常階段、インキャパシタンツの頭角を1990年以降のノイズ音楽の大きな動きの一つと評した。インキャパシタンツの初めての海外公演は1999年、オーストリアのウェルズでの祭りだった。2000年にはメルツバウの50枚組の編集ボックス「Merzbox」が出た。音楽学者のポール・へガティは2007年、日本で作られたノイズの登場以降でなければ、ノイズ音楽という言葉は多くの点で意味を持たないと書いた。ノイズ音楽の中心地としての日本というイメージは、今も言葉として生き続けている。</p>
