<h1>Horrorcore（ホラーコア）とは</h1>
<p>ホラー映画の語彙と演出をヒップホップへ全面的に持ち込んだ形式である。歌詞は殺人、切断、死体、悪魔、精神の崩壊を扱い、しばしば加害者の一人称で書かれる。この視点の選択が本質的で、聴き手は犯人の思考の内側に置かれ、逃げ場のない不快さを</p>
<p>ホラー映画の語彙と演出をヒップホップへ全面的に持ち込んだ形式である。歌詞は殺人、切断、死体、悪魔、精神の崩壊を扱い、しばしば加害者の一人称で書かれる。この視点の選択が本質的で、聴き手は犯人の思考の内側に置かれ、逃げ場のない不快さを味わうことになる。ただし内容の多くは明らかに現実離れした誇張であり、B級映画と同じ様式化された恐怖として受け取ることが前提になっている。音の面では、短調の不気味なオルガンや鍵盤、増四度を含む不安定な音程、逆再生した音、金属が擦れる音、悲鳴や笑い声、雷鳴といった効果音が用いられる。素材としてホラー映画の劇伴が直接引用されることも多い。ドラムは重く沈んだ音色で、テンポは概ね80から95 BPMと遅く、全体を靄のような残響が覆う。ラップの発声は喉を絞った低音や、正気を失ったような裏声、複数の人格を演じ分ける台詞回しなど、演劇的な手法が多用される。曲の合間には短い寸劇が挿入され、アルバム全体で一本の物語を語る構成も珍しくない。同じ暴力を扱うギャングスタ・ラップが現実の報告を目指すのに対し、こちらは明確に虚構であることを表明している点が最大の違いである。</p>
<h2>成り立ち</h2><p>先駆はいくつかある。1991年にヒューストンのGeto Boysが発表した楽曲は、罪の意識にさいなまれ幻覚を見る男の内面を描き、暴力の描写が心理的な恐怖に転じうることを示した。より直接的な起点はデトロイトで、Eshamが1989年に発表した作品は、ロックの暗い質感とヒップホップを結びつけ、本人はこれをアシッド・ラップと名づけた。デトロイトという、産業の衰退によって荒廃した都市の空気が、この陰鬱な様式を育てた土壌だったことは繰り返し指摘されている。1994年、ニューヨークではRZA、Prince Paul、Frukwan、Poeticの四人がGravediggazを結成し、シックス・フィート・ディープを発表した。参加者はいずれも既に実績のある制作者や演者であり、キャリアの行き詰まりを共有する者同士が、墓場という主題のもとに集まったという経緯を持つ。同じくデトロイトでは、Joseph BruceとJoseph Utslerによる二人組Insane Clown Posseが道化の化粧をまとって登場し、自主レーベルPsychopathic Recordsを構えて独自の神話体系に基づく一連の作品を発表した。1997年には大手傘下のレーベルから出した作品が、内容を理由に発売直後に回収されるという事件が起きている。彼らの熱心な聴き手はジャガロと呼ばれ、家族的な共同体を形成したが、2011年にアメリカ連邦捜査局がジャガロを犯罪組織として分類したことにより、就職や親権をめぐって不利益を被る者が現れ、2017年にはワシントンで抗議の行進が行われるという、音楽の分類が現実の人権問題に転じる異例の事態にまで発展した。ほかにサクラメントのBrotha Lynch Hung、ヒューストンのGanksta N-I-P、カンザスシティのTech N9neらが独自の道を歩み、いずれも大手の流通に頼らず、地元と通信販売を基盤に長く活動を続けた。現在では、暗い音色と虚構的な暴力の描写はトラップやサウンドクラウド・ラップの中に溶け込み、様式としての境界は曖昧になっている。</p>
