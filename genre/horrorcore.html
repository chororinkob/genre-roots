<h1>Horrorcore（ホラーコア）とは</h1>
<p>ホラー映画やオカルト、暴力・死を題材にしたハードコア・ヒップホップの形式である。歌詞は殺人、切断、死体、悪魔、精神の崩壊を扱い、Geto Boysの『Assassins』のように、加害者自身の視点（連続殺人犯の視点）で語る曲もある</p>
<p>ホラー映画やオカルト、暴力・死を題材にしたハードコア・ヒップホップの形式である。歌詞は殺人、切断、死体、悪魔、精神の崩壊を扱い、Geto Boysの『Assassins』のように、加害者自身の視点（連続殺人犯の視点）で語る曲もある。ただし現実離れした誇張が多く、受け止め方は作品や作り手で異なり、論争もある。音の面では、シンセやサンプルによる不気味な音色、ホラー映画音楽の引用、不吉な効果音が用いられる。テンポは中庸〜遅めが多い。曲の合間に短い寸劇が挿入されたり（『6 Feet Deep』など）、アルバム全体で1本の物語を語るコンセプト・アルバムの例もある。同じ暴力を扱うギャングスタ・ラップに対し、こちらは現実の都市暴力の範囲を超える、超自然的・猟奇的な題材が中心である。</p>
<h2>成り立ち</h2><p>起点は一つに定まらず、1980年のJimmy Spicerを先駆とみなす説もあり、Ghetto Boys（1986年結成。1988年にGhetto Boys名義でデビューし、のち1989〜90年にGeto Boysへ改称。資料により異なる）、Ganxsta N.I.P.（1986年から自称Psycho Rapを実践したが、当時はホラーコアとは見なされていなかった）、His Majesti（1988年）、Esham（1989年）などが挙げられる。Violent Jは、Geto Boysの1988年の「Assassins」を最初に録音されたホラーコア曲と述べている。1991年にヒューストンのGeto Boysが発表した「Mind Playing Tricks on Me」（アルバム『We Can't Be Stopped』）は、パラノイア、不安、トラウマにさいなまれる男の内面を描き、暴力の描写が心理的な恐怖に転じうることを示した（この曲はギャングスタ・ラップにも分類される）。デトロイトのEshamが1989年に発表した作品は、ロックの暗い質感とヒップホップを結びつけ、本人はこれをアシッド・ラップと名づけた（本人は「horrorcore」という呼称を拒んでいる）。クラック流行や失業、人口減少に揺れた1980年代のデトロイトが、Eshamの作品の背景となった。1991年にニューヨークでRZA、Prince Paul、Frukwan、Poeticの4人がGravediggazを結成し、1994年8月9日にシックス・フィート・ディープを発表した。Prince Paul、Frukwan、Poeticと、Wu-Tang Clan結成（1992年）前でTommy Boyから契約を切られていたRZAの4人は、キャリアの低迷期にあった中で、Prince Paulのトラックをきっかけに集まり、RZAがGravediggazの名を提案した。同じくデトロイトでは、Joseph BruceとJoseph Utslerによる2人組Insane Clown Posseが道化の化粧をまとって登場し、自主レーベルPsychopathic Recordsを構えて独自の神話体系に基づく一連の作品を発表した。1997年6月24日にDisneyの子会社Hollywood Recordsから発売された『The Great Milenko』は、数時間で回収された。Disneyは歌詞が不適切だったと説明したが、南部バプテスト連盟のボイコットとの関連も指摘されている。彼らの熱心な聴き手はジャガロと呼ばれ、家族的な共同体を形成したが、2011年にFBI主導の機関が報告書でジャガロを「緩やかに組織化された混成のギャング」と分類したことにより、就職や親権をめぐって不利益を被る者が現れたとICPと米国自由人権協会（ACLU）は主張し、2017年にはワシントンで抗議の行進が行われるという、ファンがギャングに分類されたことが現実の人権問題に発展する異例の事態にまで至った。ほかにサクラメントのBrotha Lynch Hung、ヒューストンのGanxsta N.I.P.、カンザスシティのTech N9neらが独自の道を歩み、大手との契約や流通を経験しつつ、のちに自主的な体制で活動した者もいる。現在では、暗い音色と虚構的な暴力の描写はトラップやサウンドクラウド・ラップの中に溶け込み、様式としての境界が曖昧になったと評されることもある。</p>
<h2>代表曲</h2><ul><li>Mind Playing Tricks on Me (Geto Boys)</li><li>Boogie Woogie Wu (Insane Clown Posse)</li><li>Piggy Pie (Insane Clown Posse)</li><li>Halls of Illusions (Insane Clown Posse)</li><li>Meat Cleaver (Brotha Lynch Hung)</li><li>Chicken Huntin' (Insane Clown Posse)</li><li>Slaughter House (Sematary)</li><li>Diary of a Madman (Gravediggaz)</li><li>Wicket Shit (Esham)</li><li>Nowhere to Run, Nowhere to Hide (Gravediggaz)</li><li>1-800-Suicide (Gravediggaz)</li><li>Blood Brothers (Gravediggaz)</li></ul>
