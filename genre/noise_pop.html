<h1>Noise Pop（ノイズポップ）とは</h1>
<p>ノイズポップは、口ずさめるほど甘いメロディーを、耳に刺さる轟音とハウリングで覆い隠す音楽だ。この矛盾そのものを、やり方にしている。 曲の土台は単純だ。1960年代のガール・グループの歌やビートグループのように、三つか四つの和音と、</p>
<p>ノイズポップは、口ずさめるほど甘いメロディーを、耳に刺さる轟音とハウリングで覆い隠す音楽だ。この矛盾そのものを、やり方にしている。

曲の土台は単純だ。1960年代のガール・グループの歌やビートグループのように、三つか四つの和音と、明快で覚えやすい歌のメロディーでできていることが多い。その骨組みの上に、ギターの歪みとフィードバック(音の跳ね返りによる鳴き)で作った高い音の壁が、ずっと鳴り続ける形で重なる。

この轟音は飾りではなく、主役だ。しばしば歌より音量が大きく、聴き手は霞の向こうにメロディーを探し当てることになる。さらに残響を厚くかけ、複数の音を重ねる。The Jesus and Mary Chainのサイコキャンディは、1960年代の制作者が用いた音の壁と呼ばれる手法を、歪みで再現したような音だと評された。

ドラムは、The Jesus and Mary Chainでは、立ったまま叩くスネアとフロアタムに、タンバリンを加えた簡素な編成だった。テンポは、中くらいの速さの曲が多いが、速い曲もある。

歌は感情を込めて張り上げず、抑揚をつけずに、あるいは気だるく歌われる傾向がある。その声は、大きな音の中に埋もれていく。歌詞は恋愛や欲望を扱うことが多い。その甘さと轟音との落差が、独特の危うさを生む。

シューゲイザーとは近い間柄だ。ただ、シューゲイザーが浮遊し、溶けていく方向を目指すのに対し、ノイズポップはあくまで簡潔なポップスの形を保っている。</p>
<h2>成り立ち</h2><p>決め手となった一枚は、1985年にThe Jesus and Mary Chainが発表したサイコキャンディだ。バンドを率いたのは、スコットランド出身の兄弟、William ReidとJim Reidである。

彼らは、1960年代のアメリカの制作者Phil Spectorが作った、甘美なガール・グループの曲を愛していた。その曲を、アンプの限界まで歪ませたギターで演奏する。この着想を、彼らは実行に移した。サイコキャンディは、ワーナー系のBlanco y Negro Recordsから、1985年11月に発売された。

彼らはデビューシングルを、Alan McGeeが主宰するCreation Records(1983年設立)から、1984年に発売している。McGeeは、1986年9月までバンドのマネージャーを務めた。

彼らのライブは20分ほどで終わることが多く、客の暴動のような反応がつきまとった。たとえば1985年3月のNorth London Polytechnicでは、バンドは20分足らずで退場した。客は缶を投げてステージに上がり、機材を壊した。

甘さと暴力を同時に示す発想は、各地で試された。アメリカでは、1981年にニューヨークで結成されたSonic Youthや、1984年結成のマサチューセッツ州のDinosaur Jr.、ホーボーケンのYo La Tengoが、並行して(あるいは先行して)、旋律と轟音を両立させる方向を追い求めた。Sonic YouthとDinosaur Jr.は、ノイズポップの最も認知された先駆とされる。

一方イギリスでは、ダブリン出身で、ロンドンを拠点にしたMy Bloody Valentineが、1986年のEPから、The Jesus and Mary Chainの影響でポップとノイズを混ぜ合わせ始めた。彼らはのちに、より音の響きを追う方向へ進み、シューゲイザーを完成させる。

1980年代後半のイギリスでは、ブリストルにSarah Records(1987年設立)が生まれた。商業性を拒む姿勢の小レーベルで、インディーポップやトゥイー・ポップのレーベルとして知られる。

アメリカ側では、ワシントンD.C.近郊(メリーランド州シルバー・スプリング)のBlack Tambourineが、ごく短い活動期間ながら、後年高く評価されている。

ノイズポップという呼び名の起源は、はっきりしない。1993年に始まったサンフランシスコのNoise Pop Festivalは、「知る限り自分たちが最初にこの語を使った」と述べている。明確な運動として掲げられたものではない。

1990年代のインディーには、影響が続いた。歪んだギターの下に甘い旋律を隠すという構造は、オルタナティヴ・ロックやインディーポップに共通する言葉となった。今も新しい世代によって、繰り返し再発見されている。</p>
