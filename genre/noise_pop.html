<h1>Noise Pop（ノイズポップ）とは</h1>
<p>甘く口ずさめる旋律を、耳を刺す轟音とハウリングで覆い隠すという矛盾を方法にした音楽である。楽曲の骨格そのものは1960年代の少女合唱団の歌謡やビートグループのように単純で、三つか四つの和音と、明快で覚えやすい歌の旋律から成る。その</p>
<p>甘く口ずさめる旋律を、耳を刺す轟音とハウリングで覆い隠すという矛盾を方法にした音楽である。楽曲の骨格そのものは1960年代の少女合唱団の歌謡やビートグループのように単純で、三つか四つの和音と、明快で覚えやすい歌の旋律から成る。その骨格の上に、ギターの歪みとフィードバックによる高音域の壁が、常時鳴り続ける形で被せられる。この轟音は装飾ではなく主役であり、しばしば歌より音量が大きく、聴き手は旋律を霞の向こうに探し当てることになる。加えて残響を厚くかけ、複数の音を重ねることで、1960年代の制作者が用いた音の壁と呼ばれる手法を、歪みによって再現するという意識が働いている。ドラムは装飾を削り、床の太鼓と手拍子のような単純な刻みを繰り返すことが多く、テンポは中庸である。歌唱は感情を込めて張り上げず、平坦に、あるいは気だるく歌われ、音量の中へ埋められる。歌詞は恋愛や欲望を扱うが、その甘さと轟音との落差が独特の危うさを生む。シューゲイザーと近縁だが、あちらが浮遊と溶解を志向するのに対し、こちらはあくまで簡潔なポップスの形を保っている点が異なる。</p>
<h2>成り立ち</h2><p>決定的な一枚は1985年、スコットランド出身の兄弟William ReidとJim Reidが率いるThe Jesus and Mary Chainが発表したサイコキャンディである。彼らは、1960年代のアメリカの制作者Phil Spectorが作り上げた甘美な少女合唱団の楽曲を愛しながら、それをアンプの限界まで歪ませたギターで演奏するという着想を実行した。当時のイギリスでこの作品を世に出したのはAlan McGeeが主宰するCreation Recordsで、彼らのライブは20分程度で終わり、演奏中に客と乱闘が起きることも珍しくなく、報道はそれを煽情的に書き立てた。実際、彼らの初期の公演には暴動騒ぎがつきまとっている。この、甘さと暴力を同時に提示するという発想は、瞬く間に各地へ波及した。アメリカではニューヨークのSonic Youthが既に不協和な実験を進めており、ホーボーケンのYo La Tengoやマサチューセッツのdinosaur jrが、旋律と轟音を両立させる方向を追求した。イギリスではMy Bloody Valentineが当初この様式から出発し、後により音響的な方向へ進んでシューゲイザーを完成させる。1980年代後半のイギリスでは、こうした歪んだギターと甘い旋律を持つ小規模なバンドが多数現れ、その多くはブリストルのSarah Recordsのような、徹底して商業性を拒む姿勢の小レーベルから作品を出した。アメリカ側ではワシントンD.C.のBlack Tambourineが、極端に短い活動期間ながら後年高く評価されている。ノイズポップという呼称は、こうした一群をまとめて指すために音楽誌が用いたもので、明確な運動として掲げられたものではない。1990年代以降、この手法は特定の分野に留まらず一般化した。歪んだギターの下に甘い旋律を隠すという構造は、オルタナティヴ・ロック、シューゲイザー、インディーポップの共通の語彙となり、現在も新しい世代によって繰り返し再発見されている。</p>
<h2>代表曲</h2><ul><li>Just Like Honey (The Jesus and Mary Chain)</li><li>Sugarcube (Yo La Tengo)</li><li>You Made Me Realise (My Bloody Valentine)</li></ul>
