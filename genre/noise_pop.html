<h1>Noise Pop（ノイズポップ）とは</h1>
<p>口ずさめるほど甘いメロディーを、耳に刺さる轟音とハウリングで覆い隠す、という矛盾をそのまま方法にした音楽である。曲の土台そのものは1960年代のガール・グループの歌やビートグループのように単純で、三つか四つの和音と、明快で覚えやす</p>
<p>口ずさめるほど甘いメロディーを、耳に刺さる轟音とハウリングで覆い隠す、という矛盾をそのまま方法にした音楽である。曲の土台そのものは1960年代のガール・グループの歌やビートグループのように単純で、三つか四つの和音と、明快で覚えやすい歌の旋律から成る。その骨格の上に、ギターの歪みとフィードバック(音の跳ね返りによる鳴き)で作った高い音の壁が、ずっと鳴り続ける形で重ねられる。この轟音は装飾ではなく主役であり、しばしば歌より音量が大きく、聴き手はメロディーを、霞の向こうに探し当てることになる。加えて残響を厚くかけ、複数の音を重ねることで、1960年代の制作者が用いた音の壁と呼ばれる手法を、歪みによって再現するという意図がある。ドラムは装飾を削り、床の太鼓と手拍子のような単純な刻みを繰り返すことが多く、テンポは中庸である。歌唱は感情を込めて張り上げず、抑揚をつけず、あるいは気だるく歌われ、音の大きさの中に埋もれていく。歌詞は恋愛や欲望を扱うが、その甘さと轟音との落差が独特の危うさを生む。シューゲイザーと近縁だが、あちらが浮遊と溶解を志向するのに対し、こちらはあくまで簡潔なポップスの形を保っている点が異なる。</p>
<h2>成り立ち</h2><p>決め手となった一枚は1985年、スコットランド出身の兄弟William ReidとJim Reidが率いるThe Jesus and Mary Chainが発表したサイコキャンディである。彼らは、1960年代のアメリカの制作者Phil Spectorが作り上げた甘美なガール・グループの楽曲を愛しながら、それをアンプの限界まで歪ませたギターで演奏するという着想を実行した。この作品はワーナー系のBlanco y Negro Recordsから1985年11月に発売された。デビューシングルを出したのはAlan McGeeが主宰するCreation Records(1984年)で、McGeeはその後もマネージャーを務めた。彼らのライブは20分程度で終わることが多く、客の暴動めいた反応がつきまとった。例えば1985年3月のNorth London Polytechnicでは、バンドは20分足らずで退場し、客が缶を投げてステージに上がり、機材を壊した。甘さと暴力を同時に提示する発想は、各地で試みられた。アメリカでは、1981年結成のニューヨークのSonic Youthや、1984年結成のマサチューセッツ州のDinosaur Jr.、ホーボーケンのYo La Tengoが、並行して(あるいは先行して)旋律と轟音を両立させる方向を追求した。Sonic YouthとDinosaur Jr.は、ノイズポップの最も認知された先駆とされる。イギリスではMy Bloody Valentineが当初この様式から出発し、後により音響的な方向へ進んでシューゲイザーを完成させる。1980年代後半のイギリスでは、こうした歪んだギターと甘い旋律を持つ小規模なバンドが多数現れ、その中には、ブリストルのSarah Records(1987年設立)のような、徹底して商業性を拒む姿勢の小レーベルから作品を出したバンドもあるが、Sarah Recordsは全体としてはジャングリーなインディーポップやトゥイー・ポップのレーベルとして知られる。アメリカ側ではワシントンD.C.近郊(メリーランド州シルバー・スプリング)のBlack Tambourineが、極端に短い活動期間ながら後年高く評価されている。ノイズポップという呼称の起源ははっきりしない。1993年に始まったサンフランシスコのNoise Pop Festivalは、「知る限り自分たちが最初にこの語を使った」と述べている。明確な運動として掲げられたものではない。1990年代以降、この手法は特定の分野に留まらず一般化した。歪んだギターの下に甘い旋律を隠すという構造は、オルタナティヴ・ロック、シューゲイザー、インディーポップの共通の語彙となり、現在も新しい世代によって繰り返し再発見されている。</p>
<h2>代表曲</h2><ul><li>Just Like Honey (The Jesus and Mary Chain)</li><li>Head On (The Jesus and Mary Chain)</li><li>April Skies (The Jesus and Mary Chain)</li><li>Dsco (Sweet Trip)</li><li>Crazy for You (Best Coast)</li><li>You Made Me Realise (My Bloody Valentine)</li><li>Easy on Your Own? (Alvvays)</li><li>Drive It All Over Me (My Bloody Valentine)</li><li>Sugarcube (Yo La Tengo)</li><li>Some Candy Talking (The Jesus and Mary Chain)</li><li>Feed Me with Your Kiss (My Bloody Valentine)</li><li>Cherry Chapstick (Yo La Tengo)</li></ul>
