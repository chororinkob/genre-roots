<h1>Jùjú（ジュジュミュージック）とは</h1>
<p>ナイジェリア南西部のヨルバ人の間で発達した、ギターと太鼓を軸とする音楽である。最大の特徴は複数のギターの絡み合いにある。2本から数本（King Sunny Adéの編成では5本以上）のエレクトリックギターが、それぞれ異なる短い音型</p>
<p>ナイジェリア南西部のヨルバ人の間で発達した、ギターと太鼓を軸とする音楽である。最大の特徴は複数のギターの絡み合いにある。2本から数本（King Sunny Adéの編成では5本以上）のエレクトリックギターが、それぞれ異なる短い音型を反復し、周期のずれによって網目のような織物を作る。この手法は、複数のギターを伝統的な打楽器のアンサンブルのように噛み合わせるものと説明され、和音の進行よりも音型の重なりで音楽が進む。もう一つの核が、締め太鼓の一種であるトーキングドラムである。砂時計形の胴に張った2枚の皮を紐で結び、脇に挟んで締め具合を変えることで、音の高さを連続的に変化させられる。ヨルバ語は音の高さで語の意味が変わる声調言語であるため、この太鼓は実際に言葉を喋ることができ、演奏者は聴衆に語りかける。加えて瓢箪に網を掛けた振り楽器や、複数の打楽器が重なる。歌唱は独唱と合唱の掛け合いが基本で、内容は依頼主や有力者への讃辞、諺、道徳的な教訓が中心となる。曲は典型的に15〜20分程度とされ、20分を超えるのは主にライブでの引き延ばしである。国際盤『Juju Music』では3〜8分に編集されている。</p>
<h2>成り立ち</h2><p>起源は1920〜30年代のラゴスにあるとされる（1932年にラゴスで現れたとする記述もある）。当時この港町には、ヤシ酒を出す酒場でギターを弾き語る音楽が広まっており、そこへ小型の枠太鼓が加えられた。音楽の名の由来には諸説がある（Tunde Kingは、タンバリンを投げて受ける動作を聴衆が「ジュ・ジュ」と呼んだと語り、Kingがブラジル風の小型のタンバリン状の太鼓の音を指して名づけたとする説明もあり、神秘的な連想から植民地期の「アフリカの精霊信仰」を指す語で呼ばれたとする説もある）。1930年代に活動したTunde Kingが、この呼称を用いた最初期の演者として記録されている。当初は数人の小編成による素朴な音楽だった。転機は1960年前後、ナイジェリアの独立と前後する時期である。I.K. Dairoは、この音楽に手風琴を導入し、1948年までにすでに加わっていたトーキングドラムなどヨルバの要素を強調して、編成を拡大し、ヨルバ文化の誇りを歌う内容へと深化させた。彼は当時としては珍しく、民族の垣根を越えて支持され（Edo語、Urhobo語、Itsekiri語、Hausa語の歌詞も使い、支持が主たる民族集団の外へ広がった）、国民的な存在となる。1960年代から1970年代には、Ebenezer Obeyが宗教的なメッセージと社会批評を取り入れた歌詞で、主に都市の上流層に支持され、King Sunny Adéがより器楽的で華やかな、大衆的な訴求力のある方向を追求した。両者の競争は、この音楽の黄金期を形作っている。国際的な転機は1982年である。前年にBob Marleyが死去し、レコード会社Island Recordsは次の世界的なアフリカ系音楽の担い手を探していた。同社はKing Sunny Adéと契約し、彼の作品を国際市場へ送り出す。欧米の批評家は彼を熱狂的に受け入れたが、次のマーリーという売り出し方には無理があり、3枚の作品の後に契約は打ち切られた。この経緯は、西洋の産業がアフリカの音楽を扱う際の構造的な問題を象徴する事例として語られる。国内では1980年代以降、より打楽器中心のフジに若い聴衆を奪われたが、この音楽は儀礼や祝宴の場で演奏される音楽として現在も生き続けている。</p>
