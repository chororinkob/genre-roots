<h1>Jùjú（ジュジュミュージック）とは</h1>
<p>ジュジュは、ナイジェリア南西部のヨルバ人の間で発達した、ギターと太鼓を軸とする音楽だ。 最大の特徴は、複数のギターの絡み合いにある。2本から数本（King Sunny Adéの編成では5本以上）のエレクトリックギターが、それぞれ異</p>
<p>ジュジュは、ナイジェリア南西部のヨルバ人の間で発達した、ギターと太鼓を軸とする音楽だ。

最大の特徴は、複数のギターの絡み合いにある。2本から数本（King Sunny Adéの編成では5本以上）のエレクトリックギターが、それぞれ異なる短い音型を反復して重ね、打楽器アンサンブルのように噛み合う。この手法は、複数のギターを伝統的な打楽器のアンサンブルのように噛み合わせるものと説明される。和音の進行よりも、音型の重なりで音楽が進んでいく。

もう一つの核が、締め太鼓の一種であるトーキングドラムだ。砂時計形の胴に2枚の皮を張り、紐で結んである。これを脇に挟んで締め具合を変えると、音の高さを連続的に変えられる。ヨルバ語は、音の高さで語の意味が変わる声調言語だ。そのため、この太鼓はヨルバ語の声調とリズムをまねて「語る」ことができ、諺や称賛の名を演奏に織り込む。ほかに、瓢箪に網を掛けた振り楽器や、複数の打楽器が重なる。

歌は、独唱と合唱の掛け合いが基本だ。歌う内容は、依頼主や有力者への讃辞、諺、道徳的な教訓が中心になる。

King Sunny Adéのナイジェリア盤では、15〜20分級の長い曲が典型で、ライブも長時間だった。ジャンル全体では、録音媒体や時代によって曲の長さが違い、I.K. Dairoの頃は約3分だった。国際盤『Juju Music』では、Blackwellの要望で、既存曲を3〜8分の個別の曲に録り直した、または短縮した。</p>
<h2>成り立ち</h2><p>ジュジュの起源は、1920〜30年代のラゴスにあるとされる（1932年にラゴスで現れたとする説もある）。当時この港町では、ヤシ酒を出す酒場で、ギターを弾きながら歌う音楽が広まっていた。そこへ小型の枠太鼓が加わった。

音楽の名前の由来には諸説がある。Tunde Kingは、タンバリンを投げて受ける動作を、聴衆が「ジュ・ジュ」と呼んだと語っている。Kingが、ブラジル風の小型のタンバリン状の太鼓の音を指して名づけたとする説明もある。さらに、神秘的な連想から、植民地期の「アフリカの精霊信仰」を指す語で呼ばれたとする説もある。1930年代に活動したTunde Kingが、この呼び名を使った最初期の演者として記録されている。初めは数人の小さな編成による、素朴な音楽だった。

転機は1960年前後、ナイジェリアの独立と前後する時期に訪れる。I.K. Dairoは、この音楽に手風琴を取り入れた。さらに、1948年に導入されたトーキングドラムなど、ヨルバの要素を強調して編成を広げ、ヨルバ文化の誇りを歌う内容へと深めた。彼は民族の垣根を越えて支持された（Edo語、Urhobo語、Itsekiri語、Hausa語の歌詞も使い、支持が主たる民族集団の外へ広がった）。こうして彼は国民的な存在となる。

1960年代から1970年代には、Ebenezer Obeyが、宗教的なメッセージと社会批評を取り入れた歌詞で、主に都市の上流層に支持された。一方、King Sunny Adéは、より器楽的で華やかな、大衆に訴える力のある方向を追い求めた。両者の競争が、この音楽の黄金期を形作ったと言われる。

国際的な転機は1982年に来る。前年にBob Marleyが死去し、レコード会社Island Recordsは、次の世界的なアフリカ系音楽の担い手を探していた。同社はKing Sunny Adéと契約し、彼の作品を国際市場へ送り出した。欧米の批評家は彼を熱狂的に受け入れた。しかし、次のマーリーという売り出し方には無理があり、3枚のアルバムの後に契約関係が終わった。この経緯を、西洋の産業がアフリカの音楽を扱う際の構造的な問題を表す例と見る見方もある。

国内では1980年代に、より打楽器中心のフジが、ナイジェリアの主流ポップの座に就いた。ジュジュは主流の座を譲った。それでもこの音楽は、社交ダンス音楽・商業ポピュラー音楽として、祝宴やコンサートの場で今も演奏されている。</p>
