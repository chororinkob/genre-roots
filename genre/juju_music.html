<h1>Jùjú（ジュジュミュージック）とは</h1>
<p>ナイジェリア南西部のヨルバ人の間で発達した、ギターと太鼓を軸とする音楽である。最大の特徴は複数のギターの絡み合いにある。二本から四本のエレクトリックギターが、それぞれ異なる短い音型を反復し、周期のずれによって網目のような織物を作る</p>
<p>ナイジェリア南西部のヨルバ人の間で発達した、ギターと太鼓を軸とする音楽である。最大の特徴は複数のギターの絡み合いにある。二本から四本のエレクトリックギターが、それぞれ異なる短い音型を反復し、周期のずれによって網目のような織物を作る。この手法は西アフリカ全域の弦楽器の伝統に由来し、和音の進行よりも音型の重なりで音楽が進む。ギターは歪ませず、高音を強調した澄んだ音色が用いられる。もう一つの核が、締め太鼓の一種であるトーキングドラムである。砂時計形の胴に張った二枚の皮を紐で結び、脇に挟んで締め具合を変えることで、音の高さを連続的に変化させられる。ヨルバ語は音の高さで語の意味が変わる声調言語であるため、この太鼓は実際に言葉を喋ることができ、演奏者は聴衆に語りかける。加えて瓢箪に網を掛けた振り楽器や、複数の打楽器が重なる。歌唱は独唱と合唱の掛け合いが基本で、内容は依頼主や有力者への讃辞、諺、道徳的な教訓が中心となる。曲は極めて長く、一曲が20分を超えることも珍しくない。</p>
<h2>成り立ち</h2><p>起源は1920年代のラゴスにある。当時この港町には、ヤシ酒を出す酒場でギターを弾き語る音楽が広まっており、そこへ小型の枠太鼓が加えられた。この太鼓の呼び名が、そのまま音楽の名になったとされる。1930年代に活動したTunde Kingが、この呼称を用いた最初期の演者として記録されている。当初は数人の小編成による素朴な音楽だった。転機は1960年前後、ナイジェリアの独立と前後する時期である。I.K. Dairoは、この音楽に手風琴と本格的なトーキングドラムを導入し、編成を拡大して、ヨルバ文化の誇りを歌う内容へと深化させた。彼は当時としては珍しく、宗教や民族の垣根を越えて支持され、国民的な存在となる。1960年代から1970年代には、Ebenezer Obeyが道徳的で説教的な歌詞によって広い層に支持され、King Sunny Adéがより器楽的で華やかな方向を追求した。両者の競争は、この音楽の黄金期を形作っている。国際的な転機は1982年である。前年にBob Marleyが死去し、レコード会社Island Recordsは次の世界的なアフリカ系音楽の担い手を探していた。同社はKing Sunny Adéと契約し、彼の作品を国際市場へ送り出す。欧米の批評家は彼を熱狂的に受け入れたが、次のマーリーという売り出し方には無理があり、三枚の作品の後に契約は打ち切られた。この経緯は、西洋の産業がアフリカの音楽を扱う際の構造的な問題を象徴する事例として語られる。国内では1980年代以降、より打楽器中心のフジに若い聴衆を奪われたが、この音楽は儀礼や祝宴の場で演奏される音楽として現在も生き続けている。</p>
