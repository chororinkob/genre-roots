<h1>Melodic Speedcore（メロディックスピードコア）とは</h1>
<p>BPM 250から400を超える極端な速さのキックドラムの上に、はっきりとした旋律と和声を乗せるスピードコアの一派である。核となる矛盾は、打点の間隔が0.2秒を切る密度と、人間が歌える程度の速さで動く旋律とを、同じ曲の中で共存させ</p>
<p>BPM 250から400を超える極端な速さのキックドラムの上に、はっきりとした旋律と和声を乗せるスピードコアの一派である。核となる矛盾は、打点の間隔が0.2秒を切る密度と、人間が歌える程度の速さで動く旋律とを、同じ曲の中で共存させる点にある。そのため旋律は全音符や2分音符に相当する長い音価で書かれ、キックが刻む速度に対して意図的に何倍も遅く進む。使われる音色はトランスやハッピーハードコア由来のスーパーソウ、明るいプラックシンセ、ピアノ、弦楽器風のパッドで、調性は長調のまま感動的な進行を取ることが多く、歪みきったキックとの落差そのものが快感の仕掛けになっている。低域はキックが占有し続けるため、ベースラインは事実上省略されるか、キックの中に埋め込まれる形で処理される。構成は明快で、旋律を提示する導入、リズムを止めて旋律だけを聴かせるブレイクダウン、そして最も密度の高い展開部という三部構成が定型となる。同じ速度帯でも、ノイズと混沌を志向するテラーコアやスピードノイズと異なり、こちらは泣ける旋律を極限の速度で聴かせるという、ある種の様式美を追求している。</p>
<h2>成り立ち</h2><p>スピードコアは1990年代前半、オランダとドイツのガバの現場でテンポの上限を試す悪ふざけとして始まり、当初は速さと歪みだけを競う純度の高い攻撃性が身上だった。そこへ旋律を持ち込む発想が生まれた背景には、同じ時期にイギリスで発達したハッピーハードコアと、その影響を強く受けた日本のハードコア、いわゆるJ-COREの存在がある。日本では1990年代末から2000年代にかけて、東京や大阪の同人音楽の即売会と小箱のクラブを舞台に、アニメやゲームの旋律感覚を持つ作家が大量に現れた。1997年に始動したDJ SharpnelはSHARPNELSOUNDを拠点に、アニメ素材と高速キックを組み合わせた作品を量産し、m1dyはSpeedcore Dandyと題した一連の作品で、絶叫サンプルと極端な速度の型を作った。この日本的な旋律嗜好が海外のスピードコア勢に逆輸入され、2000年代半ばにはドイツ語圏のSpeedcore Worldwideなどのネットレーベルからも、明確なメロディーを持つ高速トラックが無償配布されるようになる。流通が無料のダウンロードとファイル共有に依存していたため、制作者に金銭的な見返りはほとんどなく、シーンは趣味的な相互交換として維持された。2010年代以降はSoundCloudとBandcampが発表の場となり、さらにロリコアやニンテンドーコアと呼ばれる周辺領域と混ざり合いながら、インターネット上の若い作家に受け継がれている。一方で、旋律を入れることは軟弱で商業的だとする硬派なスピードコア愛好家からの反発も根強く、シーン内部では長らく本物か否かという不毛な線引きの議論が続いてきた。</p>
