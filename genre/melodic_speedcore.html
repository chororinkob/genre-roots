<h1>Melodic Speedcore（メロディックスピードコア）とは</h1>
<p>BPM 300前後から400を超える極端な速さのキックドラムの上に、はっきりとした旋律と和声を乗せるスピードコアの一派である。核となる矛盾は、打点の間隔が0.2秒を切る密度と、人間が歌える程度の速さで動く旋律とを、同じ曲の中で共存</p>
<p>BPM 300前後から400を超える極端な速さのキックドラムの上に、はっきりとした旋律と和声を乗せるスピードコアの一派である。核となる矛盾は、打点の間隔が0.2秒を切る密度と、人間が歌える程度の速さで動く旋律とを、同じ曲の中で共存させる点にある。そのため旋律は、多くの曲で、全音符や2分音符に相当する長い音価で書かれ、キックが刻む速度に対して何倍も遅く進む傾向がある。使われる音色はトランスやハッピーハードコア由来のスーパーソウ、明るいプラックシンセ、ピアノ、弦楽器風のパッドで、調性は長調のまま感動的な進行を取ることが多く、歪みきったキックとの落差そのものが快感の仕掛けになっている。低域はキックが占有し続けるため、ベースラインは多くの曲で、事実上省略されるか、キックの中に埋め込まれる形で処理される傾向がある。構成は明快で、旋律を提示する導入、リズムを止めて旋律だけを聴かせるブレイクダウン、そして最も密度の高い展開部という三部構成が多くの曲で見られる傾向である。同じ速度帯でも、ノイズと混沌を志向するテラーコア（概ね200〜300 BPM前後で、スピードコア（約300 BPM以上）より遅い）やスピードノイズと異なり、こちらは泣ける旋律を極限の速度で聴かせるという、ある種の様式美を追求している。</p>
<h2>成り立ち</h2><p>スピードコアは1990年代前半〜半ばに、ベネルクス・ドイツのハードコア／ガバから派生した。名称や先駆的な曲には北米（ニューヨークなど）も関わる。当初は速さと歪みだけを競う純度の高い攻撃性が身上だった。そこへ旋律を持ち込む発想が生まれた背景には、ハードコアと同人音楽、アニメソングを土壌とし、電波系・オタク文化の影響を受けた日本のハードコア、いわゆるJ-COREの存在がある。日本では1990年代末から2000年代にかけて、同人音楽の即売会やクラブを舞台に、アニメやゲームの旋律感覚を持つ作家が大量に現れた。DJ Sharpnelは、1996年に奈良で結成されたPROJECT GABBANGELIONを前身とし（1998年に「高速音楽隊シャープネル」と改称、2000年に現在のユニットになった）、SHARPNELSOUNDを拠点に、アニメ素材と高速キックを組み合わせた作品を量産した。m1dyは、2002年のアルバム『Speedcore Dandy』（SHARPNELSOUNDから発売、2003年に『Speedcore Dandy XXX』として再発）で、絶叫サンプルと極端な速度の作風で知られる。日本のJ-core系の作家が旋律的な高速曲を広め、海外にも波及した可能性がある。2000年代初頭にネットレーベルが登場し、2010年代に大きく増えた。Speedcore Worldwideは2012年創設。無料配布が中心だが、ヴァイナルやCD-Rの限定盤も併存した。2010年代以降はSoundCloudとBandcampが発表の場となり、さらにJ-COREの派生であるロリコアなどと混ざり合いながら、インターネット上の若い作家に受け継がれている。一方で、歌入りやハッピーな要素を「スピードコアではない」とする立場もある。</p>
