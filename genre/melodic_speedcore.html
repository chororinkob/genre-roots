<h1>Melodic Speedcore（メロディックスピードコア）とは</h1>
<p>メロディック・スピードコアは、スピードコアの一派だ。BPM 300前後から400を超える極端に速いキックドラムの上に、はっきりとした旋律と和音を乗せる。 この音楽の核には、矛盾がある。打点の間隔が約0.2秒以下という密度のキックと</p>
<p>メロディック・スピードコアは、スピードコアの一派だ。BPM 300前後から400を超える極端に速いキックドラムの上に、はっきりとした旋律と和音を乗せる。

この音楽の核には、矛盾がある。打点の間隔が約0.2秒以下という密度のキックと、人が歌える程度の速さで動く旋律を、同じ曲の中に同居させる点だ。そのため旋律は、多くの曲で、全音符や2分音符にあたる長い音の長さ（音価）で書かれる。キックが刻む速さより、何倍も遅く進む傾向がある。

使われる音色は、トランスやハードコア系でも使われるスーパーソウ（のこぎり波を重ねた厚い音）、明るいプラックシンセ（短く弾けるように鳴る音）、ピアノ、弦楽器風のパッド（和音を持続させる柔らかい音）だ。調は長調のまま、感動的な進行を取ることが多い。歪みきったキックとの落差そのものが、快感を生む仕掛けになっている。

低い音域は、キックが占め続ける。そのためベースラインは、多くの曲で事実上省かれるか、キックの中に埋め込まれる形で処理される傾向がある。

曲の組み立ては分かりやすい。旋律を示す導入、リズムを止めて旋律だけを聴かせる区間（ブレイクダウン）、そして最も密度の高い展開部の三部構成が、多くの曲で見られる傾向である。

この音楽は、攻撃的で圧迫感のある雰囲気を持つテラーコア（200〜300 BPM前後とされ、境界には揺れがあるが、スピードコア（約300 BPM以上）より遅い）とは違う。こちらは、泣ける旋律を極限の速さで聴かせるという、ある種の型の美しさを追い求めている。</p>
<h2>成り立ち</h2><p>スピードコアは、1990年代前半〜半ばに、ベネルクスとドイツのハードコア／ガバから枝分かれした。名称や先駆的な曲には、北米（ニューヨークなど）も関わる。当初は速さと攻撃性を打ち出し、ネタ的・競争的な側面もあった。

そこへ旋律を持ち込む流れに関わった可能性があるのが、日本のハードコア、のちにJ-COREと呼ばれるものだ。ハードコアと同人音楽を土壌とし、電波系・J-POP・オタク文化の影響を受けた音楽である。日本では1990年代末から2000年代にかけて、同人音楽の即売会やクラブを舞台に、アニメやゲームの旋律感覚を持つ作家が多数現れた。

DJ Sharpnelは、1996年に奈良で結成されたPROJECT GABBANGELIONを前身とする（1998年に「高速音楽隊シャープネル」と改称、2000年に現在のユニットになった）。SHARPNELSOUNDを拠点に、アニメ素材と高速キックを組み合わせた作品を次々に生み出した。

m1dyは、2002年のアルバム『Speedcore Dandy』（SHARPNELSOUNDから発売、2003年にIntikrecとNestから『Speedcore Dandy XXX』として再発）で知られる。作風は、サンプリングを多用した極端な速さだ。

一方、1990年代後半には、トラッカー・シーンからネットレーベルが分かれて出てきた。Speedcore Worldwideは2012年に創設された。無料配布が中心だが、ヴァイナルやCD-Rの限定盤も並行して出された。

2010年代以降は、SoundCloudとBandcampが発表の場になった。さらに、J-COREの派生とされることもあるロリコアなどと混ざり合いながら、インターネット上の若い作家に受け継がれている。

ただし一部には、歌入りやハッピーな要素を「スピードコアではない」とする立場もある。</p>
