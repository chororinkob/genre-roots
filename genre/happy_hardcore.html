<h1>Happy Hardcore（ハッピーハードコア）とは</h1>
<p>ハッピーハードコアは、高速のキックに、明るく多幸的な旋律を乗せた系統だ。 テンポはおおむね160〜180BPM（1分間の拍数）。土台はハードコアのゆがんだ四つ打ちだが、そのキックは歪ませつつも音程を感じさせる丸い音に整えられること</p>
<p>ハッピーハードコアは、高速のキックに、明るく多幸的な旋律を乗せた系統だ。

テンポはおおむね160〜180BPM（1分間の拍数）。土台はハードコアのゆがんだ四つ打ちだが、そのキックは歪ませつつも音程を感じさせる丸い音に整えられることが多く、攻撃性より弾む感覚が優先される。

この上に、ピアノの華やかなリフ、明るい長調の和声、そして甲高く加工した女性ヴォーカルが乗る。和声（コードの響き）は、明るい長調の旋律が主体である。ベースは単純なオフビート（拍の間）のシンセ音であることが多く、低域を強調しすぎず、ピアノと歌の帯域を空ける。

ブレイクビーツ（切り刻んだドラムの音）が残っている場合もある。初期のものにはAmen Breakの断片が刻まれていることが多い。

ヴォーカルは音程操作が特徴的で、原曲より数半音上げることで、人間離れした無邪気な響きを作ることが多い。

歌詞は愛、友情、パーティーの喜びといった直接的で肯定的な主題を歌う。

曲の構成は明快で、導入、ブレイクダウン(打楽器を止めてピアノと歌だけにする)、そして復帰という型を取ることが多い。ブレイクダウンでは感傷的な旋律が示され、そこから一気に高速のキックへ戻る落差が快感の中心になる。

ガバ（約140〜190BPM）に比べ明るく、ブレイクビーツやピアノ中心の点で異なる。この明るさは長らく批評家から嘲笑の対象となったが、連帯感を語る当事者が多い。</p>
<h2>成り立ち</h2><p>舞台は、1992年末から1994年末のイギリスだ。ハードコア・レイヴの内部分裂から、この音楽は生まれた。ベルギー・ドイツ・オランダのハードコア・テクノも、ルーツの一つとされる。

当時のレイヴでは、ブレイクビーツと低音を重視する層と、ピアノと歌の高揚感を求める層の嗜好が分かれつつあった。前者はジャングルへ、後者はハッピーハードコアへ進んだ。この分裂には人種的・階級的な要素があったことも、当事者や研究者によって指摘されることがある。ジャングルがロンドンの黒人文化と結びついたのに対し、ハッピーハードコアは、ロンドン・バーミンガム以外の、白人ラヴァーが多い地域（エセックス、ノーサンプトン、イングランド北部、南海岸など）で強かった。スコットランドではバウンシーテクノ主体で、後に広がった。

呼称は当初 4-beat や happy hardcore と呼ばれ、1994年末までにシーンとして形になった。中心となった作家は、Slipmatt、DJ Sy、DJ Seduction、Vibes &amp; Wishdokta、Dougalだ。このうちSlipmatt、DJ Sy、DJ Seduction、Vibes &amp; Wishdoktaは1993〜94年から活動していた。Hixxy、Sharkey、Force &amp; Stylesは1994年以降に台頭した世代とされる。Scott Brown(スコットランド、グラスゴー)はバウンシーテクノの人物で、ハッピーハードコアからハードトランス、ガバまで幅広く手がけた。

レーベルでは成立期にKniteforceやImpact、Hectic、Just Another Labelなどが機能した。のちにHappy Vibes、Essential Platinum、Blatant Beatsなどが加わり、Bonkersという編集盤シリーズが1996年から始まって商業的な柱になった。イベントとしてはHelter Skelter、Dreamscape、United Danceが数千人規模で開催されたとされる。

オランダとオーストラリアにも独自の音楽の場が生まれた。オーストラリアでは2000年代初頭にシドニーで1500人規模のイベントが開かれた。2000年代後半に衰退し、2010年代に再興した。

この音楽は当初、主流の音楽誌からは嘲笑され、低俗なダンス音楽として扱われた。一方で、1995年にSimon ReynoldsがiD誌で論じ、1996年にはBBCラジオ1のJohn Peelの番組でScott Brownのセッションが放送されるなど、取り上げた例もある。制作者側もそれを自覚しており、あえて「馬鹿げていること」を誇りとする文化が形成された。自らを真面目に捉えない姿勢を誇りとし、連帯感を語る当事者が多い。薬物の問題は他のレイヴ文化と同様に深刻で、エクスタシーが広く使われていた（DJ Syの証言）。

90年代末にはスティグマが強まり、勢いが落ちたとする見方がある一方、90年代末をピークとする見方もある。その後、UKハードコアと呼ばれる系統が現れ、テンポは1990年代から続く170BPM前後のまま、より洗練された制作技術と、トランス的な旋律の影響を受けたとされる（時期・範囲には諸説）。この形は現在も継続している。

日本では、1990年代後半にJ-COREが生まれ（ガバやハードコア・テクノ系）、2000年代前半にファイル共有網で広まった。ハッピーハードコア系のコンピレーションも1998年（Dancemania SPEEDシリーズ）から日本で出ていた。2010年代には、アニメの主題歌をリミックス（別の人が作り直す）する文化とも結びつきながら、英語圏のアニメファンへ広がっていった。またSNS上では、当時を知らない若い世代がこの音を再発見し、皮肉抜きの多幸感として受け止める動きも起きている。</p>
