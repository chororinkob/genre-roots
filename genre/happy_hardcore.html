<h1>Happy Hardcore（ハッピーハードコア）とは</h1>
<p>高速のキックに、明るく多幸的な旋律を乗せた系統。テンポは160〜180BPM。土台はハードコアのゆがんだ四つ打ちだが、そのキックは歪ませつつも音程を感じさせる丸い音に整えられ、攻撃性より弾む感覚が優先される。この上に、ピアノの華や</p>
<p>高速のキックに、明るく多幸的な旋律を乗せた系統。テンポは160〜180BPM。土台はハードコアのゆがんだ四つ打ちだが、そのキックは歪ませつつも音程を感じさせる丸い音に整えられ、攻撃性より弾む感覚が優先される。この上に、ピアノの華やかなリフ、明るい長調の和声、そして甲高く加工した女性ヴォーカルが乗る。ヴォーカルの音程操作が特徴的で、原曲より数半音上げることで人間離れした無邪気な響きを作る。和声は圧倒的に長調で、これがハードコア系全般の中では極めて珍しい特徴になっている。曲の構成は明快で、導入、ブレイクダウン(打楽器を止めてピアノと歌だけにする)、そして復帰という型を守る。ブレイクダウンでは感傷的な旋律が提示され、そこから一気に高速のキックへ戻る落差が快感の中心になる。ベースは単純なオフビートのシンセ音で、低域を強調しすぎず、ピアノと歌の帯域を空ける。ブレイクビーツが残っている場合もあり、初期のものほどAmen Breakの断片が刻まれている。歌詞は愛、友情、パーティーの喜びといった直接的で肯定的な主題を歌う。同じテンポ帯のガバやスピードコアと比べると、暗さや暴力性が徹底的に排除されている点で対極に位置する。この明るさは長らく批評家から嘲笑の対象となったが、共同体の結束はきわめて強い。</p>
<h2>成り立ち</h2><p>1992年から1994年頃のイギリスで、ハードコア・レイヴの内部分裂から生まれた。当時のレイヴでは、ブレイクビーツと低音を重視する層と、ピアノと歌の高揚感を求める層の嗜好が分かれつつあった。前者はジャングルへ、後者はハッピーハードコアへ進んだ。この分裂には人種的・階級的な要素があったことも、当事者や研究者によって指摘されている。ジャングルがロンドンの黒人文化と結びついたのに対し、ハッピーハードコアはイングランド北部と中部の白人労働者階級の若者に支持された。呼称は当初 4-beat や happy hardcore と呼ばれ、1994年前後に定着した。中心となった作家はScott Brown(スコットランド、グラスゴー)、Hixxy、Sharkey、Dougal、Force &amp; Styles、Slipmatt、Vibes &amp; Wishdokta。レーベルではKniteforce、Happy Vibes、Essential Platinum、Blatant Beatsが機能し、Bonkersという編集盤シリーズが1996年から始まって商業的な柱になった。イベントとしてはHelter Skelter、Dreamscape、United Dance が数千人規模で開催された。オランダとオーストラリアにも独自のシーンが生まれ、とりわけオーストラリアでは2000年代に大きな支持を得た。この音楽は当初から批評的にはほぼ完全に無視され、あるいは嘲笑された。イギリスの音楽誌はこれを最も低俗なダンス音楽として扱い、真面目な議論の対象にしなかった。制作者側もそれを自覚しており、あえて「馬鹿げていること」を誇りとする文化が形成された。この開き直りが、逆に極めて強固な共同体の結束を生んだ。薬物の問題は他のレイヴ文化と同様に深刻で、とりわけ安価な代替薬物による健康被害が報告された。1990年代末には市場が縮小し、シーンは大きく後退した。2000年代前半にはUKハードコアという名で再編され、テンポは170BPM前後に固定され、より洗練された制作技術と、トランス由来の壮大な旋律が導入された。この形は現在も継続している。2010年代以降は、日本で独自の発展を遂げたJ-COREや、アニメの主題歌をリミックスする文化と結びつき、東アジアで新しい聴衆を獲得した。またSNS上では、当時を知らない若い世代がこの音を再発見し、皮肉抜きの多幸感として受け止める動きも起きている。</p>
