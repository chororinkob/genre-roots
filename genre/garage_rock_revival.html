<h1>Garage Rock Revival（ガレージロックリバイバル）とは</h1>
<p>2000年前後に起きた、1960年代のガレージロックとパンクの簡素な編成に立ち返る運動。ポストパンク・リバイバルやインディー・ロック・リバイバルとも呼ばれる。編成はギター、ベース、ドラム、歌という最小限のものが基本で、The Wh</p>
<p>2000年前後に起きた、1960年代のガレージロックとパンクの簡素な編成に立ち返る運動。ポストパンク・リバイバルやインディー・ロック・リバイバルとも呼ばれる。編成はギター、ベース、ドラム、歌という最小限のものが基本で、The White Stripesのようにベースのいない2人組もある。鍵盤は、ピアノやFarfisaなどのオルガンが使われることもある。ギターの音は真空管アンプを歪ませただけの、加工の少ない生々しい音で、エフェクトは少なく、ファズやトレモロが中心だが、Jack Whiteは『Seven Nation Army』などで、音を1オクターブ下げるDigiTech Whammyというペダルも使った。リフは三つか四つの和音の反復で、ソロがあっても短く、技巧を見せない。ドラムは装飾のない八ビートで、シンバルの音が大きく被る。テンポは毎分120から160拍程度、曲は二分半から三分と短く、前奏はほぼない。録音では、多重録音を減らし、ライブ演奏に近い録り方が主に取られ(一部の曲はトラックごとに録音された)、演奏の粗さや音程の揺れがそのまま残される。歌唱は張り上げるか、気だるく吐き捨てるかのどちらかで、技巧より態度が重んじられる。歌詞は恋愛、退屈、苛立ち、都市の生活で、政治的な主張は薄い。服装も要素の一つで、細身のジーンズと革ジャン、あるいは統一した色の衣装といった視覚的な記号が伴った。同時期に主流だったニューメタルやポップパンクの過剰な制作と比べると、音の情報量の少なさそのものが主張になっている。</p>
<h2>成り立ち</h2><p>前史として、1980年代から、60年代のガレージロックを再評価する小さな流れが世界各地にあった。ガレージ・パンクのバンドとして知られたGories、thee Mighty Caesars、the Mummies、thee Headcoatsのほか、日本からもGuitar Wolfや5.6.7.8'sが出た。だが大きな転換が起きたのは2001年前後で、二つの都市がほぼ同時に注目された。ニューヨークではThe Strokesがデビュー作『Is This It』を発表する。2001年7月30日にオーストラリアで先行発売され、米国盤は9月25日から10月9日に延期されて曲目も変更された。乾いたギターと簡素な構成は圧倒的な影響力を持った。デトロイトではThe White Stripesが、Jack WhiteとMeg Whiteの2人だけ、ベースもなしという編成で、2001年の『White Blood Cells』と2003年の『Elephant』を発表した。2人は兄妹だと名乗っていたが、実際には離婚した元夫婦であったことが後に判明している。ほかにスウェーデンのThe Hives、オーストラリアのThe Vines、ニューヨークのYeah Yeah Yeahs、イギリスのThe Libertinesが続き、音楽誌はこれをザ、で始まる名前のバンドの時代と呼んだ。背景には複数の要因があった。1990年代末のニューメタルと過剰に作り込まれたポップスへの反動、2001年九月の同時多発テロ後のニューヨークという象徴性、そしてインターネットによる音源の流通が、レーベルの宣伝力に頼らない広がりを可能にしたことである。イギリスではこの流れがArctic Monkeysに引き継がれ、2006年、彼らは初週363,735枚という英国史上最速のデビュー作の売上を記録した。バンドのMySpaceのページはファンが作ったもので、バンド自身は当初その存在を知らなかったと語っている。2010年前後にはこの運動は一段落したが、少人数の生演奏に立ち返るという発想はその後も繰り返し現れている。</p>
<h2>代表曲</h2><ul><li>Seven Nation Army（The White Stripes）</li><li>Are You Gonna Be My Girl（Jet）</li><li>I Bet You Look Good on the Dancefloor（Arctic Monkeys）</li><li>Hard to Explain (The Strokes)</li><li>Hate to Say I Told You So（The Hives）</li><li>Fell in Love with a Girl (The White Stripes)</li><li>Walk Idiot Walk (The Hives)</li><li>Get Free (The Vines)</li><li>Hotel Yorba (The White Stripes)</li><li>Date with the Night (Yeah Yeah Yeahs)</li><li>Main Offender (The Hives)</li><li>Cold Hard Bitch (Jet)</li></ul>
