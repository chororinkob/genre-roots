<h1>Garage Rock Revival（ガレージロックリバイバル）とは</h1>
<p>ガレージロック・リバイバルは、2000年代初頭に起きた、1960年代のガレージロックとパンクの簡素な編成に立ち返る動きだ。ほぼ重なる呼び名として、ポストパンク・リバイバルやインディー・ロック・リバイバルとも呼ばれる。ただし、ジャン</p>
<p>ガレージロック・リバイバルは、2000年代初頭に起きた、1960年代のガレージロックとパンクの簡素な編成に立ち返る動きだ。ほぼ重なる呼び名として、ポストパンク・リバイバルやインディー・ロック・リバイバルとも呼ばれる。ただし、ジャンルとしての一体性には異論もある。

編成は、ギター、ベース、ドラム、歌という最小限のものが基本だ。The White Stripesのように、ベースのいない2人組もある。鍵盤では、ピアノやFarfisaなどのオルガンが使われることもある。

ギターの音は、真空管アンプを歪ませただけの、手を加えすぎない生々しい音だ。エフェクトは少なめのことが多く、ファズやトレモロが中心である。ただしJack Whiteは、『Seven Nation Army』などで、音を1オクターブ下げるDigiTech Whammyというペダルも使った。リフは単音の短いフレーズの反復が多い。ソロがあっても短く、技巧を見せない。

ドラムは単純で原始的な叩き方だ。曲によって、4分音符が中心のものや、スネアを抜いた高速のビートなどがある。シンバルの音が大きくかぶる。

短い曲が多い。録音では多重録音を減らし、ライブ演奏に近い録り方が主に取られた(一部の曲はトラックごとに録音された)。演奏の粗さや音程の揺れは、そのまま残される。

歌は、声を張り上げるか、気だるく吐き捨てるかのどちらかだ。上手さよりも態度が大切にされる。歌詞は恋愛、退屈、苛立ち、都市の生活が多く、政治的な主張は薄い傾向がある。

服装も要素の一つで、細身のジーンズと革ジャン、あるいは統一した色の衣装といった見た目のしるしが伴うことが多かった。同時期に主流だったニューメタルの過剰な制作と比べると、音の数の少なさそのものが主張になっている。</p>
<h2>成り立ち</h2><p>前史として、1980年代から、60年代のガレージロックを見直す小さな流れが世界各地にあった。ガレージ・パンクのバンドとして知られたGories、thee Mighty Caesars、the Mummies、thee Headcoatsのほか、日本からもGuitar Wolfや5.6.7.8'sが出た。

だが、商業的な突破は2001年だった。二つの都市が、ほぼ同時に注目を集めたのである。

ニューヨークでは、The Strokesがデビュー作『Is This It』を発表する。2001年7月30日にオーストラリアで先に発売された。米国のコンパクトディスク盤は、9月25日から10月9日に延期され、曲目も変更された。一方、米国のアナログ盤は9月11日に発売され、元の曲目のままだった。乾いたギターと簡素な構成は、後に続くバンドに大きな影響を与えたと広く評価される。

デトロイトでは、The White Stripesが2001年の『White Blood Cells』と2003年の『Elephant』を発表した。Jack WhiteとMeg Whiteの基本は2人で、ベース奏者はいない編成だった。2人は兄妹だと名乗っていたが、実際には離婚した元夫婦だったことが後に分かっている。

ほかに、スウェーデンのThe Hives、オーストラリアのThe Vines、ニューヨークのYeah Yeah Yeahs、イギリスのThe Libertinesが続いた。メディアの一部は、The Strokes、The White Stripes、The Hives、The Vinesを「The」バンドと呼んだ。

背景には、1990年代末のニューメタル、ヒップホップ、ポスト・ブリットポップの商業性への反動があった。

2005〜06年ごろのArctic Monkeysなどでは、インターネットを通じた広がりが大きく働いた。イギリスでは、この流れがArctic Monkeysに引き継がれる。2006年、彼らは初週363,735枚を売り上げた。これは当時、英国史上最速のデビュー作の売上だった。のちに2007年にLeona Lewisが更新したが、バンドのデビュー作としては現在も最速である。バンドのMySpaceのページはファンが作ったもので、バンド自身はMySpaceが何かも知らなかったと語っている。

2010年前後に、この運動は一段落した。それでも、少人数の生演奏に立ち返るという発想は、その後も繰り返し現れている。</p>
<h2>代表曲</h2><ul><li>Seven Nation Army（The White Stripes）</li><li>Are You Gonna Be My Girl（Jet）</li><li>I Bet You Look Good on the Dancefloor（Arctic Monkeys）</li><li>Hard to Explain (The Strokes)</li><li>Hate to Say I Told You So（The Hives）</li><li>Fell in Love with a Girl (The White Stripes)</li><li>Walk Idiot Walk (The Hives)</li><li>Get Free (The Vines)</li><li>Hotel Yorba (The White Stripes)</li><li>Date with the Night (Yeah Yeah Yeahs)</li><li>Main Offender (The Hives)</li><li>Cold Hard Bitch (Jet)</li></ul>
