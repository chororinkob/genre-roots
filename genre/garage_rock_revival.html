<h1>Garage Rock Revival（ガレージロックリバイバル）とは</h1>
<p>2000年前後に起きた、1960年代のガレージロックとパンクの簡素な編成に立ち返る運動。編成はギター、ベース、ドラム、歌という最小限で、鍵盤も打ち込みも使わないことが原則になる。ギターの音は真空管アンプを歪ませただけの、加工の少な</p>
<p>2000年前後に起きた、1960年代のガレージロックとパンクの簡素な編成に立ち返る運動。編成はギター、ベース、ドラム、歌という最小限で、鍵盤も打ち込みも使わないことが原則になる。ギターの音は真空管アンプを歪ませただけの、加工の少ない生々しい音で、エフェクトはファズとトレモロ程度に限られる。リフは三つか四つの和音の反復で、ソロがあっても短く、技巧を見せない。ドラムは装飾のない八ビートで、シンバルの音が大きく被る。テンポは毎分120から160拍程度、曲は二分半から三分と短く、前奏はほぼない。録音の方針が決定的で、多重録音を減らして一発録りに近い方法が取られ、演奏の粗さや音程の揺れがそのまま残される。歌唱は張り上げるか、気だるく吐き捨てるかのどちらかで、技巧より態度が重んじられる。歌詞は恋愛、退屈、苛立ち、都市の生活で、政治的な主張は薄い。服装も要素の一つで、細身のジーンズと革ジャン、あるいは統一した色の衣装といった視覚的な記号が伴った。同時期に主流だったニューメタルやポップパンクの過剰な制作と比べると、音の情報量の少なさそのものが主張になっている。</p>
<h2>成り立ち</h2><p>前史として、1980年代から90年代にかけて、60年代のガレージロックを再評価する小さな流れが世界各地にあった。オーストラリアのThe Scientists、ニューヨークのThe Cramps、スウェーデンのThe Hellacopters、シアトルのMudhoneyなどである。だが大きな転換が起きたのは2001年前後で、二つの都市がほぼ同時に注目された。ニューヨークではThe Strokesが2001年七月にデビュー作『Is This It』を発表する。裕福な家庭の子弟による作られたバンドだという批判もあったが、乾いたギターと簡素な構成は圧倒的な影響力を持った。デトロイトではThe White Stripesが、Jack WhiteとMeg Whiteの二人だけ、ベースもなしという編成で、2001年の『White Blood Cells』と2003年の『Elephant』を発表した。二人は兄妹だと名乗っていたが、実際には離婚した元夫婦であったことが後に判明している。ほかにスウェーデンのThe Hives、オーストラリアのThe Vines、ニューヨークのYeah Yeah Yeahs、イギリスのThe Libertinesが続き、音楽誌はこれをザ、で始まる名前のバンドの時代と呼んだ。背景には複数の要因があった。1990年代末のニューメタルと過剰に作り込まれたポップスへの反動、2001年九月の同時多発テロ後のニューヨークという象徴性、そしてインターネットによる音源の流通が、レーベルの宣伝力に頼らない広がりを可能にしたことである。イギリスではこの流れがArctic Monkeysに引き継がれ、2006年、彼らはMySpaceで広まった無名の若者として英国史上最速のデビュー作の売上を記録した。2010年前後にはこの運動は一段落したが、少人数の生演奏に立ち返るという発想はその後も繰り返し現れている。</p>
<h2>代表曲</h2><ul><li>Seven Nation Army（The White Stripes）</li><li>Fell in Love with a Girl (The White Stripes)</li><li>Hate to Say I Told You So（The Hives）</li><li>Are You Gonna Be My Girl（Jet）</li><li>I Bet You Look Good on the Dancefloor（Arctic Monkeys）</li></ul>
