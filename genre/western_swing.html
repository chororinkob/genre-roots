<h1>Western Swing（ウエスタンスウィング）とは</h1>
<p>1930年代のアメリカ南西部で生まれた、踊るための音楽だ。カントリーとジャズが混ざり合っている。 いちばんの特徴は編成にある。フィドル、ギター、ベースに、電気式のスティールギターが加わる。このスティールギターは、当時としてはとても</p>
<p>1930年代のアメリカ南西部で生まれた、踊るための音楽だ。カントリーとジャズが混ざり合っている。

いちばんの特徴は編成にある。フィドル、ギター、ベースに、電気式のスティールギターが加わる。このスティールギターは、当時としてはとても早い段階で取り入れられたものだ。さらに、ジャズのビッグバンドから借りたサックスやトランペット、ピアノ、そしてドラムが並ぶ。カントリーの世界では、ドラムは長く避けられてきた。それを堂々と使ったことが、この音楽の型破りぶりを示している。

リズムは、初期には2拍を基本(two-four)としていた。のちに4/4拍子のスウィングも取り入れ、ポルカやワルツの拍に強いバックビートを重ねたとされる。これが、ダンスホールの床で足を滑らせて踊るための勢いを生む。テンポは速めから中庸まで幅がある。

和音は、カントリーの三つの音の和音だけでなく、六の和音や減和音を含むジャズの表現も使われる。

多くのバンドでは、演奏の中心は即興だ。フィドル、スティールギター、管楽器が順に前へ出て、一節ずつソロを回す。この形は、ジャズやブルースのソロのスタイルを取り入れたものである(自由な即興は、独奏者ごとにも集団でも行われた)。

歌も重要な要素だった。演奏中には、奏者を名指しで煽る掛け声や奇声が飛び交い、録音にもそのまま残っている。踊り手の反応が音楽を決める、現場に密着した音楽である。</p>
<h2>成り立ち</h2><p>舞台はテキサス州とオクラホマ州だ。1920年代から1930年代にかけて、この地域では各地の音楽が交わっていた。アングロ系の弦楽器による踊りの音楽、黒人のブルースとジャズ、メキシコ系の音楽、そしてドイツやチェコからの移民が持ち込んだポルカとワルツである。そこへ大恐慌と砂嵐が重なり、農村は荒れ果てた。人々は週末のダンスホールで、数時間だけ現実を忘れようとした。

1930年代前半、フォートワースで活動していたLight Crust Doughboysというバンドが、製粉会社の提供するラジオ番組で地域の人気を集める。この番組の司会を務めた企業経営者W. Lee O'Danielは、後にテキサス州知事にまで上り詰めた。音楽と地方政治が結びついていた事情もうかがえる。

このバンドから独立したMilton Brownは、Musical Browniesを率いてピアノを取り入れた。電気式スティールギターはBob Dunnが加入して持ち込み、その録音は、電気で音を大きくした楽器を録音した最初期の一つとされる。Brownは、Bob Willsと並ぶ最初期の先駆者で、「ウェスタン・スウィングの父(Father of Western Swing)」と呼ばれる。しかし1936年4月に自動車事故で負傷し、5日後に肺炎で、32歳で亡くなった。

もう一人の中心人物が、フィドル奏者のBob Willsだ。Texas Playboysを率いて編成を大きくし、1940年に発表したニュー・サン・アントニオ・ローズで全米的な成功を収める。彼のバンドではLeon McAuliffeがスティールギターを担当した。演奏の切り替わりでBob Willsが奏者の名を呼ぶ掛け声は、この音楽のトレードマークになった。

一方、西海岸では、ダストボウル期（1930年代）からの移住者が先に市場を作っていた。戦時中の人口流入がそれを広げて開花させ、この音楽は西海岸へ広がる。ただし、その地で人気を得たSpade Cooleyは、1961年に妻を殺害した罪で有罪となり、この分野の歴史に暗い影を落としている。

1944年の戦時税（30%、のち20%）がダンスの場を減らした。好みの変化もあって、この音楽はやがて衰えた。

それでも、電気楽器の早い導入、即興の重視、跳ねたリズムという特徴は、ホンキートンクやロカビリー、ロックンロールに影響を与えたとされる。1970年にはMerle Haggardが、敬意を込めたアルバム『A Tribute to the Best Damn Fiddle Player in the World (or, My Salute to Bob Wills)』を発表し、再評価のきっかけの一つとなった。</p>
