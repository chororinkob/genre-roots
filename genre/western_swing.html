<h1>Western Swing（ウエスタンスウィング）とは</h1>
<p>1930年代のアメリカ南西部で生まれた、踊るためのカントリーとジャズの混血である。編成が最大の特徴で、フィドル、ギター、ベース、そして当時としては極めて早い段階で導入された電気式のスティールギターに加え、ジャズのビッグバンドから借</p>
<p>1930年代のアメリカ南西部で生まれた、踊るためのカントリーとジャズの混血である。編成が最大の特徴で、フィドル、ギター、ベース、そして当時としては極めて早い段階で導入された電気式のスティールギターに加え、ジャズのビッグバンドから借りたサックスやトランペット、ピアノ、そしてドラムが並ぶ。カントリーの世界ではドラムは長らく忌避されており、これを堂々と使ったことがこの音楽の異端性を示している。リズムは二拍を基調とし、4分音符を均等ではなく前後に振り分ける跳ねた刻みが徹底され、ダンスホールの床で足を滑らせるための推進力を生む。テンポは概ね120から180 BPMと軽快である。和声はカントリーの三和音を離れ、六の和音や属七、減和音を含むジャズの語法が用いられる。演奏の中心は即興で、フィドル、スティールギター、管楽器が順に前へ出て一節ずつ独奏を回す形式は完全にジャズのものである。歌は歌詞のある部分だけで、曲の大半は演奏に費やされる。演奏中には奏者を名指しで煽る掛け声や奇声が飛び交い、録音にもそのまま残されている。踊り手の反応が音楽を決めるという、現場に密着した性格を持つ音楽である。</p>
<h2>成り立ち</h2><p>舞台はテキサス州とオクラホマ州である。1920年代から1930年代にかけて、この地域には各地の音楽が交差していた。アングロ系の弦楽器による舞踊音楽、黒人のブルースとジャズ、メキシコ系の音楽、そしてドイツやチェコからの移民が持ち込んだポルカとワルツである。加えて大恐慌と砂嵐による農村の荒廃があり、人々は週末のダンスホールで数時間だけ現実を忘れることを求めた。1930年代前半、フォートワースで活動していたLight Crust Doughboysというバンドが、製粉会社の提供するラジオ番組を通じて地域的な人気を得る。この番組の司会を務めた企業経営者は後にテキサス州知事にまで上り詰めており、音楽と地方政治が結びついていた事情も窺える。このバンドから独立したMilton Brownは、Musical Browniesを率いて電気式スティールギターとピアノを導入し、この様式の実質的な創始者と評価されているが、1936年に自動車事故で32歳の若さで死亡した。もう一人の中心人物であるフィドル奏者Bob Willsは、Texas Playboysを率いて編成を拡大し、1940年に発表したニュー・サン・アントニオ・ローズによって全米的な成功を収める。彼のバンドではLeon McAuliffeがスティールギターを担当し、演奏の切り替わりでBob Willsが奏者の名を呼ぶ掛け声は、この音楽の象徴となった。第二次世界大戦中から戦後にかけて、軍需産業を求めてテキサスからカリフォルニアへ大量の労働者が移住したことにより、この音楽は西海岸へ広がる。ただしその地で人気を得たSpade Cooleyは、1961年に妻を殺害した罪で有罪となり、この分野の歴史に暗い影を落としている。1950年代に入ると、大人数を養う経済的な負担と、より小編成のホンキートンクやロカビリーの台頭によって衰退した。しかし電気楽器の早期導入、即興の重視、跳ねたリズムという特徴は、ロカビリーを経てロックンロールの成立に寄与しており、1970年にはMerle Haggardが敬意を込めた作品を発表して再評価の口火を切った。</p>
