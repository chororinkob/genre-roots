<h1>Big Band（ビッグバンド）とは</h1>
<p>10人から20人規模という大編成のバンドによる、華やかでスウィングするジャズ。複数のサックス奏者からなるサックスセクション、トランペットセクション、トロンボーンセクションがそれぞれ層を成して重なり、リズムセクションがそれを支える、</p>
<p>10人から20人規模という大編成のバンドによる、華やかでスウィングするジャズ。複数のサックス奏者からなるサックスセクション、トランペットセクション、トロンボーンセクションがそれぞれ層を成して重なり、リズムセクションがそれを支える、まさにゴージャスという言葉がふさわしいサウンドを作り出す。テンポはBPM 120〜200で、跳ねるようなスウィングのリズムに乗って実際に踊ることを前提に作られている。基本的には事前にアレンジされた譜面に基づく演奏だが、要所要所のソロパートでは個々の奏者の即興も光る。1930〜40年代、「スウィング時代」と呼ばれる時代のメインストリームを担った音楽である。ビッグバンドの演奏では、サックス隊と金管隊が短いフレーズを掛け合う「リフ」の応酬が緊張感を高めていき、そこにソリストが立ち上がって即興を披露するという構成が定番であった。この時代、ジャズは「鑑賞するための芸術音楽」ではなく、ダンスホールで人々が実際に踊るための、まぎれもない大衆娯楽であった。</p>
<h2>成り立ち</h2><p>1920年代のアメリカで、ダンスホールの大型化とともに形をとった。当時のダンスホールは数百人から数千人を収容し、電気的な拡声がまだ普及していなかったため、フロアの隅まで音を届けるには演奏者の数を増やすしかなかった。この必要が、サックス、トランペット、トロンボーンをそれぞれ一つの塊にまとめた10人以上の編成を生む。決定的な役割を果たしたのが、Fletcher Hendersonの楽団で編曲を担当したDon Redmanである。彼は管楽器を同族の集団として扱い、セクション同士が短い決め句を投げ合う呼びかけと応答の書法を確立した。1930年代前半、大恐慌でレコードの売り上げが壊滅する一方、ラジオ放送と映画は安価な娯楽として全国へ普及し、ビッグバンドはその主役となる。1935年8月、ロサンゼルスのPalomar BallroomでBenny Goodmanの楽団が観客の熱狂的な反応を得たことが、スウィング時代の幕開けとされる。この日Goodmanが演奏した譜面の多くは、黒人であるFletcher Hendersonが書いたものだった。同じ時期、カンザスシティのCount Basie楽団はリフの反復とブルースに根ざした軽やかなスウィングを、ニューヨークのDuke Ellington楽団は個々の奏者の音色を前提に書かれた管弦楽的な作曲を、それぞれ極めていく。Chick Webb、Jimmie Lunceford、Artie Shaw、Glenn Millerらの楽団も人気を競い、ハーレムのSavoy Ballroomでは楽団同士が競演するバトル・オブ・ザ・バンズが名物となった。Benny Goodmanが1936年にTeddy WilsonとLionel Hamptonを迎えたことは、人種混合の編成を公然と行った初期の例として重要である。一方で黒人楽団は南部の巡業で宿泊も食事も拒否され、危険な移動を強いられていた。第二次世界大戦は転機となる。徴兵で楽団員が失われ、ガソリンとゴムの配給制限が巡業を困難にし、1942年から始まったアメリカ音楽家連盟の録音ストライキが打撃を与えた。さらに戦後は娯楽への課税と、歌手中心の市場への移行が重なり、多くの楽団が解散する。しかし書法そのものは映画音楽、テレビ、そして学校のジャズバンド教育の中に残り、Thad JonesとMel Lewisの楽団やMaria Schneiderのような現代の作曲家によって今も更新され続けている。</p>
