<h1>Big Band（ビッグバンド）とは</h1>
<p>ビッグバンドは、10人以上（標準は15〜17人前後）という大編成のバンドによる、華やかでスウィングするジャズだ。1930〜40年代、「スウィング時代」と呼ばれる時代の、主流を担った音楽である。この時代、ジャズは「鑑賞するための芸術</p>
<p>ビッグバンドは、10人以上（標準は15〜17人前後）という大編成のバンドによる、華やかでスウィングするジャズだ。1930〜40年代、「スウィング時代」と呼ばれる時代の、主流を担った音楽である。この時代、ジャズは「鑑賞するための芸術音楽」ではなかった。ダンスホールで人々が実際に踊るための、まぎれもない大衆娯楽であった。

複数のサックス奏者からなるサックスセクションが、中心の一つだ。これにトランペットセクションとトロンボーンセクションが加わる。それぞれが層を成して重なり、リズムセクション（拍や和音を支える楽器の組）がそれを支える。まさにゴージャスという言葉がふさわしいサウンドになる。

リズムは、跳ねるようなスウィングだ。その上で実際に踊ることを前提に作られている。

基本的には、事前にアレンジ（編曲）された譜面に基づく演奏だ。ただし、要所要所のソロパートでは、個々の奏者の即興も光る。

曲の組み立てでは、サックス隊と金管隊が短いフレーズを掛け合う「リフ」（繰り返す短いフレーズ）の応酬が定番であった。これが緊張感を高めていく。そこにソリストが立ち上がり、即興を披露するという構成も定番であった。</p>
<h2>成り立ち</h2><p>ビッグバンドの始まりには諸説あり、1910年代前半とする説もある。1920年代のアメリカで、ダンスホールの大型化とともに形をとった。そして1935〜46年のスウィング時代に、全盛を迎えた。

当時のダンスホールは、数百人から数千人を収容した。大型ホールで音量が必要になったことも一因として、編成が大型化したとされる。サックス、トランペット、トロンボーンをそれぞれ一つの塊にまとめた、10人以上の編成が生まれる。

Fletcher Hendersonの楽団で編曲を担当したDon Redmanが、Hendersonとともに、セクション書法とコール・アンド・レスポンスの型を築いた。Redmanは管楽器を同族の集団として扱い、セクション同士が短い決め句を投げ合う書法を用いた。その書法は、後のビッグバンドの書き方の基礎になった。

1930年代前半、大恐慌でレコードの売り上げが壊滅した。そうした中で、ビッグバンドは1930年代にラジオ中継（リモート放送）で全国に広まり、1935年以降に主流となった。

1935年8月、ロサンゼルスのPalomar Ballroomで、Benny Goodmanの楽団が観客の熱狂的な反応を得た。これが、スウィング時代の幕開けとされる。この夜の最初のセットは、市販の汎用アレンジで、観客の反応は冷ややかだった。しかしGoodmanがFletcher Hendersonらの編曲に切り替えると、観客が熱狂したとされる（ブッキング担当Willard Alexanderの回想による）。

同じ時期、カンザスシティのCount Basie楽団は、リフの反復とブルースに根ざした軽やかなスウィングを、極めていく。ニューヨークのDuke Ellington楽団は、個々の奏者の音色を前提に書かれた、管弦楽的（オーケストラのような）作曲を、極めていく。Chick Webb、Jimmie Lunceford、Artie Shaw、Glenn Millerらの楽団も、人気を競った。ハーレムのSavoy Ballroomでは、楽団同士が競演するバトル・オブ・ザ・バンズが名物となった。

Benny Goodmanは、Teddy Wilsonとは1935年に録音し、1936年に公の場で共演した。1936年にはLionel Hamptonを迎えた。これは、人種混合の編成を公然と行った初期の例として重要である。一方で、黒人楽団は南部の巡業で宿泊も食事も拒否され、危険な移動を強いられていた。

第二次世界大戦は転機となる。徴兵で楽団員が失われた。ガソリンとゴムの配給制限が、巡業を困難にした。1942年から始まったアメリカ音楽家連盟の録音ストライキも、打撃を与えた。さらに、戦時中の1944年に導入されたキャバレー税が戦後も続き、歌手が人気を集めたことなどほかの要因と重なって打撃となり、多くの楽団が解散する。

しかしこの手法そのものは、例えば映画音楽、テレビ、学校のジャズバンド教育の中に残った。Thad Jones/Mel Lewis楽団（1965年〜）の系譜はVanguard Jazz Orchestraとして今も続き、Maria Schneiderのような作曲家も新作を書き続けている。</p>
