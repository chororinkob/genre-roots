<h1>Shōmyōとは</h1>
<p>声明は、お経や経典に節をつけて、僧侶たちが斉唱する日本の仏教声楽だ。代表曲22曲を動画で聴け、ルーツと影響のつながりを地図でたどれる。</p>
<p>声明は、お経や経典に節をつけて、僧侶たちが斉唱する日本の仏教声楽だ。通常は無伴奏だが、法会によっては雅楽器が付く場合がある。

法会では、法螺・鐃・鈸・磬・鏧・鈴などが、行道の開始や区切り、唱え始めの合図に使われる。

旋律は、雅楽と共通する五音（宮商角徴羽）を階名とする。同じ経文でも宗派や流派によって旋律は異なり、天台声明と真言声明では音の感じが大きく違う。

声明は、呂・律・中曲という音階・旋律に関する3つの考え方でパターン化されている。今日では3つの区別を「旋律法や装飾法の相違」とするほうが実際的だとされる。テンポはきまっておらず、全体としてゆったりしている。

歌い方は、太く低い声で体全体を共鳴させるのが基本で、数人の僧侶による斉唱が一つの音を長く引く。ユリ（揺り）という装飾的な唱法が重要で、流派ごとに異なる。

歌詞には梵語・漢語・日本語があり、梵語の陀羅尼などは原音の音写をそのまま唱える。

曲は梵讃（梵語の讃）・漢讃・和讃、伽陀、唄、散華などに分かれ、法会では四箇法要と呼ばれる一連の曲列で式次第を飾る。

西洋のグレゴリオ聖歌と同じく宗教儀礼のための声楽だが、音の組み立ても発声の仕方も違う。寺院の法会や朝晩の勤行で実際に歌われ、近年はコンサートの舞台でも演奏されている。</p>
<h2>成り立ち</h2><p>インドでは、口伝で教えが広まった。それが中国に伝わると中国語に訳され、唱え方も中国風になった。この中国の仏教声楽が梵唄（ぼんばい）と呼ばれた。

魏の曹植（そうしょく）が魚山で梵唄を創始したと伝えられる。この説は『法苑珠林』などの記述から通説になっている。

日本へは仏教とともに中国・朝鮮半島を経て伝わり、752年（天平勝宝4年）の東大寺大仏開眼法要で四箇法要を営んだ記録が残る。奈良時代にはすでに盛んに行われていたと考えられ、南都仏教の寺院で独自の唱え方が育った。

声明の姿を決めたのは平安時代だ。最澄と空海が、唐で学んだ唱法をそれぞれ持ち帰り、天台声明と真言声明という二つの大きな流れが始まった。天台では円仁・安然が伝承を発展させた。真言では真雅以降に体系化が進み、寛朝が中興の祖として新しい曲の作曲と既存曲の整備に努めた。

1109年（天仁2年）、融通念仏の祖となる良忍が、京都・大原に来迎院を再興した（寺伝では円仁創建）。山号を、中国の声明発祥の地とされる魚山（ぎょざん）に見立て、大原魚山声明として伝承の中心になった。

鎌倉時代には、湛智（たんち）が天台声明の音楽理論を体系化し、現在まで受け継がれる土台を作った。浄土教系の融通念仏・浄土宗・浄土真宗の声明は、この天台声明の系譜である。

真言声明では12世紀中頃、京都・仁和寺で僧15人が曲節を比較検討する会を開き、覚性法親王が本相応院流・新相応院流・醍醐流・中川大進流の4流に整理した。しかし、その後の歴史は平坦ではなかった。

戦乱で寺院が荒れ、僧侶が散って流派の伝承が途切れる例が相次いだ。真言系の本相応院流・新相応院流・醍醐流の3流は、今は伝承がはっきりせず、または途絶えたとされる。醍醐寺には独自の声明も伝わる。

現在、真言声明は智山声明（京都・智積院）・豊山声明（奈良・長谷寺）・南山進流（高野山）の三系統に伝わる。智山・豊山の系譜は、南山進流から分かれたとも、中川大進流由来に醍醐古流を加えたとも説明が分かれる。

声明は口伝で伝えられてきたため、のちに墨譜や博士（はかせ）という記譜法が考え出された。ただし、正式に身につけるには、師から直接受ける口伝が欠かせないとされる。

声明の語り部分である講式の影響を受けて、中世の語り物音楽である平曲が生まれたとされる。御詠歌は、多くの宗派の信者が巡礼などで歌う。起源は巡礼歌とされる。

戦後は音楽としての価値が見直され、国立劇場での声明公演や海外公演が行われた。寺の儀礼を離れた新しい表現も追求されている。</p>
