<h1>EBM（エレクトロニック・ボディ・ミュージック）とは</h1>
<p>エレクトロニック・ボディ・ミュージックの略で、インダストリアルの攻撃性とダンスフロアの機能性を接続した電子音楽。名の通り身体を動かすことを目的に設計されており、四つ打ちのバスドラムに乗せて、太く歪んだシーケンスベース（自動演奏で繰</p>
<p>エレクトロニック・ボディ・ミュージックの略で、インダストリアルの攻撃性とダンスフロアの機能性を接続した電子音楽。名の通り身体を動かすことを目的に設計されており、四つ打ちのバスドラムに乗せて、太く歪んだシーケンスベース（自動演奏で繰り返される低音）が16分音符で執拗に反復する。このベースラインが大きな特徴で、アナログシンセを使った、反復するシーケンスのベースラインが特徴的な要素である。テンポはダンス向けの速めのもので、ドラムは主にRoland TR-808などの電子ドラムを、リヴァーブ（残響）を深くかけた金属的な質感で鳴らす。パーカッションに金属を叩く音やサンプリング（録音して取り込んだ）した工場のノイズを混ぜることも多い。ヴォーカルは歌うというより命令口調で怒鳴る、あるいは低い声で唱えるスタイルで、ほぼ無加工か、わずかに歪ませた程度で、リヴァーブやエコーを足すことが多い。歌詞は軍事、規律、身体、監禁、政治的抑圧といった主題を、意図的に曖昧な言い回しで扱う。しばしば軍服風の衣装や全体主義を思わせる絵やマークが用いられたため、政治的立場を巡る誤解や批判の的にもなった。構成は展開に乏しく、同じフレーズを長く回してブレイク（演奏が一瞬止まる部分）で抜き、また戻すという単純な骨格を持つ。同時代のシンセポップと比べると旋律性を捨てており、テクノと比べると人力の演奏とヴォーカルの存在感が強い。</p>
<h2>成り立ち</h2><p>1980年代初頭にドイツとベルギーで現れ、ドイツとイギリスの実験音楽の土壌から生まれた。「electronic body music」という語は、1977年11月にKraftwerkのRalf Hütterが英国のSounds誌のインタビューで最初に使ったとされる。DAFは1981年に近縁語の「Körpermusik」（ボディ・ミュージック）を使った。DAFはGabi DelgadoとRobert Görlの2人組で、生ドラムとシーケンサー（自動演奏装置）だけの極端に切り詰めた編成に、ドイツ語で命令する歌を乗せた。1981年の「Alles ist gut」や「Der Mussolini」は、ムッソリーニやヒトラーの名を踊りの号令として叫ぶという挑発的な内容で、大きな論争を呼んだ。彼ら自身は全体主義への皮肉だと主張したが、誤読される危険を承知の上での挑発でもあった。ジャンルの様式を形作った中心的な存在の一つがベルギーのFront 242で、1981年にルーヴェン近郊のアールスホットでDaniel BressanuttiとDirk Bergenが結成し、1984年の「No Comment」、1988年の「Front by Front」でスタイルを確立した。彼らはEBMという語を明確に自称し、軍服風の衣装とスライドショーを使った視覚演出も含めて様式を定義した。同じくベルギーのThe Neon JudgementやA Split-Second、そしてブリュッセルのレーベルPlay It Again Sam(PIAS)、ドイツのZoth Ommogが場を支えた。ベルギーでは、EBMの盤を遅い回転で再生したことから生まれた、テンポを落としたニュービートが1987年前後に爆発的に流行し、EBMの周辺文化と重なりながらヨーロッパのクラブに広まった。アメリカではシカゴのWax Trax! Recordsが受け皿となり、Ministry、Front Line Assembly、KMFDMがEBMの表現をより歪んだギターと結合させてインダストリアル・ロックへ展開した。この過程でNine Inch Nailsが1989年の「Pretty Hate Machine」で大衆化し、EBM由来のシーケンスがアメリカのオルタナティヴ市場に入り込む。一方、本流のEBMは1990年代前半にダークエレクトロ、後半にフューチャーポップやアグロテックといった派生が生まれ、ロンドン結成のVNV NationやスウェーデンのCovenantが情感のこもった旋律を加えた形で継承した。2000年代にはオールドスクールなEBMへの回帰が起こり、2010年代後半にはベルリンのクラブでインダストリアル・テクノやハードグルーヴの文脈でEBMのシーケンスが再び力を取り戻し、新世代のEBMバンドも現れている。</p>
