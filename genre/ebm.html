<h1>EBM（エレクトロニック・ボディ・ミュージック）とは</h1>
<p>エレクトロニック・ボディ・ミュージックの略で、インダストリアルの攻撃性とダンスフロアの機能性を接続した電子音楽。名の通り身体を動かすことを目的に設計されており、四つ打ちのバスドラムに乗せて、反復するシーケンスベース（自動演奏で繰り</p>
<p>エレクトロニック・ボディ・ミュージックの略で、インダストリアルの攻撃性とダンスフロアの機能性を接続した電子音楽。名の通り身体を動かすことを目的に設計されており、四つ打ちのバスドラムに乗せて、反復するシーケンスベース（自動演奏で繰り返される低音）が続く。このベースラインが大きな特徴で、シンセサイザーによる、反復するシーケンスのベースラインが特徴的な要素である。テンポはダンス向けの速めのもので、ドラムはドラムマシンやサンプルによる打音が中心で、機種はバンドごとに異なり、金属的な質感で鳴らされることが多い。パーカッションに金属を叩く音やサンプリング（録音して取り込んだ）した工場のノイズを混ぜることも多い。ヴォーカルは歌うというより命令口調で怒鳴る、あるいは低い声で唱えるスタイルで、ほぼ無加工か、わずかに歪ませた程度で、リヴァーブやエコーを足すことが多い。歌詞は挑発的・対決的な主題を、命令調の直接的な言葉で扱う。しばしば軍服風の衣装や全体主義を思わせる絵やマークが用いられたため、政治的立場を巡る誤解や批判の的にもなった。構成は展開に乏しく、同じフレーズを長く回してブレイク（演奏が一瞬止まる部分）で抜き、また戻すという単純な骨格を持つ。</p>
<h2>成り立ち</h2><p>1980年代初頭にドイツとベルギーで現れ、ドイツとイギリスの実験音楽の土壌から生まれた。「electronic body music」という語は、1977年11月にKraftwerkのRalf Hütterが英国のSounds誌のインタビューで最初に使ったとされる（1978年7月の別の雑誌でも使っており、Front 242自身は「数年前からあった語」と述べている）。DAFは1981年に近縁語の「Körpermusik」（ボディ・ミュージック）を使った。DAFはGabi DelgadoとRobert Görlの2人組で、生ドラムと、シーケンサー（自動演奏装置）で動かすアナログシンセ2台（Korg MS-20とARP Odyssey）という極端に切り詰めた編成に、ドイツ語で命令する歌を乗せた。1981年のアルバム『Alles ist gut』に収録された「Der Mussolini」は、ムッソリーニやヒトラーの名を踊りの号令として叫ぶという挑発的な内容で、大きな論争を呼んだ。彼ら自身は、特定の対象を狙ったものではなく、メディアで飛び交う言葉のパロディだと説明した。ジャンルの様式を形作った中心的な存在の一つがベルギーのFront 242で、1981年にルーヴェン近郊のアールスホットでDaniel BressanuttiとDirk Bergenが結成し、1984年の「No Comment」、1988年の「Front by Front」でスタイルを確立した。彼らはEBMという語を明確に自称し、匿名性を意識したサングラスと軍服風の制服で、リヴェットヘッド（rivethead）系のスタイルに影響を与えた。同じくベルギーのThe Neon JudgementやA Split-Second、そしてブリュッセルのレーベルPlay It Again Sam(PIAS)、ドイツのZoth Ommogが場を支えた。ベルギーでは、EBMの盤を遅い回転で再生したことから生まれたとされる（DJ Dikke Ronny説など、語り手により異なる）、テンポを落としたニュービートが1987年前後に爆発的に流行し、EBMの周辺文化と重なりながらヨーロッパのクラブに広まった。北米ではシカゴのWax Trax! Recordsが受け皿となり、同レーベルを通じて、Ministry（米国）、Front Line Assembly（カナダ）、KMFDM（ドイツ系）らがEBMの表現を歪んだギターと結合させてインダストリアル・ロックへ展開した（Ministryは1988年、Front Line Assemblyは1990年ごろから）。この過程でNine Inch Nailsが1989年の「Pretty Hate Machine」で大衆化し、EBM由来のシーケンスがアメリカのオルタナティヴ市場に入り込む。一方、EBMとインダストリアルからエレクトロ・インダストリアルが生まれ、そこから1990年代前半にダークエレクトロ、後半にフューチャーポップやアグロテックといった派生が生まれ、ロンドンで活動を始めたVNV NationやスウェーデンのCovenantが情感のこもった旋律を加えた形で継承した。2000年代にはオールドスクールなEBMへの回帰が起こり、2010年代後半にはベルリンなどのクラブでインダストリアル・テクノやテクノの文脈でEBMが再評価され、新世代のEBMバンドも現れている。</p>
