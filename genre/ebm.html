<h1>EBM（エレクトロニック・ボディ・ミュージック）とは</h1>
<p>この音楽の名は、エレクトロニック・ボディ・ミュージックの略だ。インダストリアルの攻撃性と、ダンスフロアの機能性を接続した電子音楽である。名の通り、身体を動かすことを目的に設計されている。 土台は四つ打ちのバスドラムだ。その上で、太</p>
<p>この音楽の名は、エレクトロニック・ボディ・ミュージックの略だ。インダストリアルの攻撃性と、ダンスフロアの機能性を接続した電子音楽である。名の通り、身体を動かすことを目的に設計されている。

土台は四つ打ちのバスドラムだ。その上で、太く歪んだシーケンスベース（自動演奏で繰り返される低音）が、16分音符で執拗に反復することが多い。このベースラインが大きな特徴だ。アナログシンセを使った、反復するシーケンスのベースラインが、特徴的な要素になっている。

テンポは、ダンス向けの速めのものだ。ドラムは、ドラムマシンやサンプルによる打音が中心で、機種はバンドごとに異なる。リヴァーブ（残響）を深くかけた、金属的な質感で鳴らす。パーカッションには、金属を叩く音を使う。サンプリング（録音して取り込んだ）した工場のノイズを混ぜることも多い。

ヴォーカルは、歌うというより、命令口調で怒鳴るか、低い声で唱えるスタイルだ。ほぼ無加工か、わずかに歪ませた程度で、リヴァーブやエコーを足すことが多い。

歌詞は、挑発的・対決的な主題を、命令調の直接的な言葉で扱う。しばしば、軍服風の衣装や、全体主義を思わせる絵やマークが用いられた。そのため、政治的立場を巡る誤解や批判の的にもなった。

曲の構成は、展開に乏しい。同じフレーズを長く回し、ブレイク（演奏が一瞬止まる部分）で抜き、また戻す。そういう単純な骨格を持つ。同時代のシンセポップと比べると、旋律性が薄いことが多い。テクノと比べると、人力の演奏とヴォーカルの存在感が強いとされる。</p>
<h2>成り立ち</h2><p>1980年代初頭、ドイツとベルギーでこの音楽は現れた。ドイツとイギリスの実験音楽の土壌から生まれた音楽だ。

「electronic body music」という語は、1977年11月に、KraftwerkのRalf Hütterが、英国のSounds誌のインタビューで最初に使ったとされる。DAFは、1981年に近縁語の「Körpermusik」（ボディ・ミュージック）を使った。DAFは、Gabi DelgadoとRobert Görlの2人組だ。生ドラム、シーケンサー（自動演奏装置）で駆動するアナログシンセ（MS-20、ARP Odyssey）、ヴォーカルという最小編成に、ドイツ語で命令する歌を乗せた。

1981年のアルバム『Alles ist gut』に収録された「Der Mussolini」は、ムッソリーニやヒトラーの名を、踊りの号令として叫ぶ。挑発的な内容で、大きな論争を呼んだ。彼ら自身は、特定の対象を狙ったものではなく、メディアで飛び交う言葉のパロディだと説明した。

ジャンルのスタイルを形作った中心的な存在の一つが、ベルギーのFront 242だ。1981年、ルーヴェン近郊のアールスホットで、Daniel BressanuttiとDirk Bergenが結成した。1984年の「No Comment」、1988年の「Front by Front」で、スタイルを固めた。彼らはEBMという語を明確に自称した。匿名性を意識したサングラスと、軍服風の制服で、リヴェットヘッド（rivethead）系のスタイルに影響を与えた。

同じくベルギーのThe Neon JudgementやA Split-Second、そしてブリュッセルのレーベルPlay It Again Sam(PIAS)、ドイツのZoth Ommogが、この場を支えた。ベルギーでは、EBMの盤を遅い回転で再生したことから生まれたとされる、ニュービートが現れた。テンポを落とした音楽で、1987年前後に爆発的に流行した。EBMの周辺文化と重なりながら、ヨーロッパのクラブに広まった。

北米では、Wax Trax!が受け皿となった。同レーベルを通じて、Ministry（米）、Front Line Assembly（加）、KMFDM（独）らが、ギターを加えたインダストリアル・ロックへ展開した（Ministryは1988年、FLAは1990年頃から）。この過程で、Nine Inch Nailsが1989年の「Pretty Hate Machine」で大衆化した。EBM由来のシーケンスが、アメリカのオルタナティヴ市場に入り込んだのである。

一方、EBMとインダストリアルからエレクトロ・インダストリアルが生まれ、そこから1990年代前半にダークエレクトロ、後半にフューチャーポップやアグロテックといった派生が生まれた。ロンドンで活動を始め、のちハンブルク拠点のVNV Nationや、スウェーデンのCovenantが、情感のこもった旋律を加えた形で継承した。

2000年代には、オールドスクールなEBMへ戻る動きが起こった。2010年代後半には、ベルリンなどのクラブで、インダストリアル・テクノやテクノの文脈でEBMが再評価された。新世代のEBMバンドも現れている。</p>
