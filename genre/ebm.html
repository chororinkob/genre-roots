<h1>EBM（エレクトロニック・ボディ・ミュージック）とは</h1>
<p>エレクトロニック・ボディ・ミュージックの略で、インダストリアルの攻撃性とダンスフロアの機能性を接続した電子音楽。名の通り身体を動かすことを目的に設計されており、四つ打ちのバスドラムに乗せて、太く歪んだシーケンスベースが16分音符で</p>
<p>エレクトロニック・ボディ・ミュージックの略で、インダストリアルの攻撃性とダンスフロアの機能性を接続した電子音楽。名の通り身体を動かすことを目的に設計されており、四つ打ちのバスドラムに乗せて、太く歪んだシーケンスベースが16分音符で執拗に反復する。このベースラインが最大の識別点で、Roland TB-303ではなくOberheim MatrixやSequential Circuits Pro-Oneといったアナログシンセの矩形波を、フィルターを絞って唸らせた音が使われる。テンポは120〜140BPM。ドラムはRoland TR-808や909、Simmonsの電子ドラムを、リヴァーブを深くかけた金属的な質感で鳴らす。パーカッションに金属を叩く音やサンプリングした工場のノイズを混ぜることも多い。ヴォーカルは歌うというより命令口調で怒鳴る、あるいは低い声で唱えるスタイルで、ディストーションとディレイをかけて非人間的に加工される。歌詞は軍事、規律、身体、監禁、政治的抑圧といった主題を、意図的に曖昧な言い回しで扱う。しばしば軍服風の衣装や全体主義的な図像が用いられたため、政治的立場を巡る誤解や批判の的にもなった。構成は展開に乏しく、同じフレーズを長く回してブレイクで抜き、また戻すという単純な骨格を持つ。同時代のシンセポップと比べると旋律性を捨てており、テクノと比べると人力の演奏とヴォーカルの存在感が強い。</p>
<h2>成り立ち</h2><p>1980年代前半のベルギーを中心に、ドイツとイギリスの実験音楽の土壌から生まれた。用語そのものはドイツのDeutsch Amerikanische Freundschaft(DAF)が1980年前後に自らの音楽を説明するために使ったのが最初期の例とされる。DAFはGabi DelgadoとRobert Gorlの二人組で、生ドラムとシーケンサーだけの極端に切り詰めた編成に、ドイツ語で命令する歌を乗せた。1981年の「Alles ist gut」や「Der Mussolini」は、ムッソリーニやヒトラーの名を踊りの号令として叫ぶという挑発的な内容で、大きな論争を呼んだ。彼ら自身は全体主義への皮肉だと主張したが、誤読される危険を承知の上での挑発でもあった。ジャンルの中核を形作ったのはベルギーのFront 242で、1981年にブリュッセルでDaniel Bressanuttiらが結成し、1984年の「No Comment」、1988年の「Front by Front」でスタイルを確立した。彼らはEBMという語を明確に自称し、軍服風の衣装とスライドショーを使った視覚演出も含めて様式を定義した。同じくベルギーのThe Neon JudgementやA Split-Second、Bene Gesserit、そしてブリュッセルのレーベルPlay It Again Sam(PIAS)、ドイツのZoth Ommogが場を支えた。ベルギーではさらにテンポを上げ音を粗くしたニュービートが1987年前後に爆発的に流行し、EBMの周辺文化と重なりながらヨーロッパのクラブに広まった。アメリカではシカゴのWax Trax! Recordsが受け皿となり、Ministry、Front Line Assembly、KMFDMがEBMの語彙をより歪んだギターと結合させてインダストリアル・ロックへ展開した。この過程でNine Inch Nailsが1989年の「Pretty Hate Machine」で大衆化し、EBM由来のシーケンスがアメリカのオルタナティヴ市場に流入する。一方、本流のEBMは1990年代に入るとアグロテックやフューチャーポップといった派生に分岐し、ドイツのVNV NationやCovenantが叙情的な旋律を加えた形で継承した。2000年代以降はテクノやミニマルの現場から再発見され、2010年代後半にはベルリンのクラブでインダストリアル・テクノやハードグルーヴの文脈でEBMのシーケンスが復権、コペンハーゲンのHardwaxやハンブルクのシーンから新世代のEBMバンドが現れている。</p>
