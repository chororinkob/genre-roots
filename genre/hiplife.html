<h1>Hiplife（ヒップライフ）とは</h1>
<p>ガーナで生まれた、ハイライフとヒップホップを結合させた音楽である。名称もこの二つを繋げた造語である。土台にはヒップホップ由来の打ち込みのドラムと低音があるが、その上に乗る旋律と和声はハイライフから引き継がれている。ハイライフの最大</p>
<p>ガーナで生まれた、ハイライフとヒップホップを結合させた音楽である。名称もこの二つを繋げた造語である。土台にはヒップホップ由来の打ち込みのドラムと低音があるが、その上に乗る旋律と和声はハイライフから引き継がれている。ハイライフの最大の特徴は、複数のギターが高音域で分散和音を反復し、周期のずれによって網目を作る書法であり、これがそのまま用いられる。加えて金管楽器の斉奏や、電子鍵盤による明るい和音が重ねられる。和声は長調が中心で、四つの和音を循環させる進行が多い。リズムは四つ打ちではなく、拍を三つと三つと二つに割る不均等な配置が骨格をなし、これは西アフリカ全域に共通する感覚である。テンポは概ね95から115 BPM。決定的に重要なのは言語で、英語ではなくアカン系のトウィ語をはじめとする現地語でラップされる。声調を持つこれらの言語をラップの拍に乗せるために、独自の韻の踏み方と語尾の処理が発達した。歌詞は日常の観察、恋愛、諺、社会風刺を扱い、年長者への敬意を示す表現も織り込まれる。歌う部分とラップの部分が明確に分かれ、繰り返し部分は必ず歌われる点も特徴である。</p>
<h2>成り立ち</h2><p>背景には二つの流れが交わっている。ひとつは20世紀前半からガーナで発達したハイライフで、これは西アフリカ沿岸の弦楽器の伝統とヨーロッパの吹奏楽が結びついたもので、独立運動の高揚とともに国民的な音楽となっていた。しかし1970年代から1980年代の経済破綻と軍事政権下で、音楽産業は壊滅し、多くの演奏家が国外へ去っている。もうひとつはアメリカのヒップホップで、これは1980年代を通じて世界中の若者へ届いていた。この二つを結びつけたのがReggie Rockstoneである。彼はロンドンで生まれ、ガーナとイギリスを行き来しながら育ち、若い頃はイギリスで英語のラップをしていた。1994年に父祖の地であるアクラへ戻った彼は、英語で韻を踏むことに意味を見出せず、トウィ語でラップするという決断をする。当時これは奇異なことと受け取られたが、彼が1997年に発表した作品によって、現地語のラップが一気に若者の標準となった。この時期のガーナには追い風があった。1992年に民政へ移管され、1995年以降には民間のラジオ局が次々に開局して、若い制作者が自作を放送に乗せる回路が生まれたのである。Obrafourは高度な詩の技術と諺の引用によってこの分野に文学的な深みを与え、VIPやTic Tacが大衆的な人気を確立した。当初、ハイライフの旧世代からは、伝統を破壊する軽薄な音楽だという批判が強かった。しかし現地語で語ることの正当性は次第に認められていく。2000年代以降はSarkodieのような技巧的なラッパーが現れ、また同時期にアゾントと呼ばれる踊りの流行を経て、この音楽は隣国ナイジェリアのアフロビーツと融合しながら、西アフリカ全体の潮流へ溶け込んでいった。</p>
