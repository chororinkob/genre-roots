<h1>Hiplife（ヒップライフ）とは</h1>
<p>ヒップライフは、ガーナで生まれた、ハイライフとヒップホップを結びつけた音楽だ。名前も、この二つをつなげた造語である。 土台には、ヒップホップ由来の打ち込みのドラムと低音がある。その上に乗るメロディーと和音は、ハイライフから受け継が</p>
<p>ヒップライフは、ガーナで生まれた、ハイライフとヒップホップを結びつけた音楽だ。名前も、この二つをつなげた造語である。

土台には、ヒップホップ由来の打ち込みのドラムと低音がある。その上に乗るメロディーと和音は、ハイライフから受け継がれている。ハイライフの特徴は、ジャズのような管楽器と、2本指で弾くギターにある。ヒップライフは、そこからサンプルやループを取り入れる。

制作はコンピューターが中心で、サンプルを多く使う。リズム面では、ハイライフ由来のサンプルやループを、ヒップホップ系のビートに重ねる。

何よりも大切なのは言葉だ。アカン系のトウィ語をはじめとする現地語が中心で、英語やピジンも合わせて使われてラップされる。ラップは諺や語りのスタイルを取り込んだ。

歌詞は、日常の観察、恋愛、諺、社会風刺を扱う。</p>
<h2>成り立ち</h2><p>ヒップライフの背景では、二つの流れが交わっている。

ひとつは、20世紀前半からガーナで発達したハイライフだ。西アフリカ沿岸の弦楽器の伝統と、ヨーロッパの吹奏楽が結びついたもので、独立運動の盛り上がりとともに国民的な音楽となっていた。しかし1970年代から1980年代には、政情不安と経済悪化、夜間外出禁止令で、ライブ中心のハイライフが衰退した。多くの音楽家が国外へ出た。

もうひとつは、アメリカのヒップホップだ。1980年代を通じて、世界中の若者へ届いていた。

この二つを結びつけた先駆者・牽引者として評価が高いのが、Reggie Rockstoneだ。ただし起源には異論がある。1973年のGyedu-Blay Ambolleyの「Simigwado」や、1993年のTalking Drumsの、現地語を交えたラップ「Aden」を先例とする見方もあり、ほかにも先例とされる例がある。

Reggie Rockstoneは英国生まれだ。幼少期はクマシとアクラで過ごし、アクラ、ニューヨーク、ロンドンを行き来しながら育った。若い頃は、イギリスで英語のラップをしていた。ロンドンでの活動に手応えがなく、1994年に父祖の地であるアクラへ戻った彼は、現地語でのラップを選んだ。当時、これは奇異なことと受け取られた。しかし彼が1997年に発表したアルバム『Makaa Maka』は、トゥイ語で全編を録音した最初期のヒップライフのアルバムのひとつである。ガーナのポピュラー音楽を一変させたと評価され、現地語のラップを広く知らしめた。

この時期のガーナには追い風があった。1992年の選挙を経て、1993年1月に民政へ移された。1995年以降には民間のラジオ局が次々に開局し、若い制作者が自分の曲を放送で流してもらう道が生まれたのである。

Obrafourは、高度な詩の技術と諺の引用によって、この分野に文学的な深みを与えた。VIPやTic Tacは、大衆的な人気を固めた。

当初、ハイライフの古い世代からは、伝統を壊す軽薄な音楽だという批判が強かった。それでも、現地語で語ることの正当性は、次第に認められていく。

2009年には、技巧的なラッパーのSarkodieがデビューアルバム『Makye』を発表した。2010年代前半には、アゾントと呼ばれる踊りが流行した。この音楽は、西アフリカの別の国であるナイジェリアのアフロビーツと融合しながら、西アフリカ全体の流れへ溶け込んでいったとも言われる。</p>
