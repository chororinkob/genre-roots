<h1>Garage Rock（ガレージロック）とは</h1>
<p>楽器を手にして間もない10代の若者が、自宅のガレージや地下室で練習し、地元のダンスパーティーや高校の体育館で演奏していた音楽である。演奏技術の未熟さを隠さず、むしろ勢いと粗さをそのまま録音した点に特徴がある。編成はギター2本、ベー</p>
<p>楽器を手にして間もない10代の若者が、自宅のガレージや地下室で練習し、地元のダンスパーティーや高校の体育館で演奏していた音楽である。演奏技術の未熟さを隠さず、むしろ勢いと粗さをそのまま録音した点に特徴がある。編成はギター2本、ベース、ドラムに、Farfisa や Vox Continental といった小型のコンボオルガンが加わることが多く、この安価な電子オルガンの薄く鋭い音色がこの時代の特徴となっている。ギターは初期のファズボックス（音を荒く歪ませる箱型の機器）を踏んだ潰れた音で、基本的なコードだけを激しく掻き鳴らし、ソロはブルースの型を大まかになぞる程度に留まる。リズムは4/4拍子で単純に前へ突き進み、テンポは速めのものが多く、ドラムは粗い叩き方をする。歌は音程が不安定なまま怒鳴るように歌われ、歌詞は失恋の恨み、親や学校への苛立ち、思い通りにならない女の子への不満といった、極めて狭く切実な10代の関心事に集中する。曲は短く、間奏も切り詰められている。録音は短時間で終えられることが多く、機材も限られていたため、音は前に出るが薄く、それがかえって切迫感を生んだ。後のパンクロックが理念として掲げた素人性を、こちらは素人っぽさ、あるいは意図的な粗さとして体現していた点が本質的な違いである。</p>
<h2>成り立ち</h2><p>サーフ・ロックに続き、1964年2月にThe BeatlesがEd Sullivan Showに出演してアメリカ中の家庭に映し出されたこと（ブリティッシュ・インヴェイジョン）も、きっかけの一つとなった。数か月のうちに全米の郊外で、数え切れないほどの10代のバンドが結成され、親の車庫が練習場所になった。前年の1963年にはオレゴン州ポートランドのThe Kingsmenがルイ・ルイを録音しており、歌詞が聞き取れないほど不明瞭なこの演奏は、猥褻な内容が隠されているという噂を呼び、FBIが31か月にわたって調査した末に、聞き取り不能で猥褻とは判断できないと結論づけるという珍事を生んだ。この事件は結果的に曲を全米に知らしめ、下手であることが力になるという逆説を証明した。ワシントン州タコマのThe Sonicsは1964年のザ・ウィッチや後のサイコで、録音レベルを振り切らせた凶暴な音を残し、後年、パンクに大きな影響を与えたバンドの一つとなる。1966年前後が最盛期で、ロサンゼルスのThe Standellsのダーティ・ウォーター、ミシガン州のQuestion Mark and the Mysteriansの96ティアーズ、カリフォルニアのThe Seeds、テキサス州オースティンのThe 13th Floor Elevatorsが相次いでヒットを出した。The 13th Floor ElevatorsはRoky Ericksonの絶叫と、電気増幅した壺を吹くという奇怪な楽器によって、サイケデリック・ロックの先駆けにもなった。技術面ではファズボックスの普及が大きく、1965年にThe Rolling Stonesのサティスファクションで使われたことで、Maestro FZ-1ファズ・トーンは売り切れた。しかし一発屋が多く、メンバーは進学や徴兵、就職によって散っていった。ベトナム戦争の徴兵はこの世代を直撃し、シーンの終焉を早めた一因でもある。忘れられかけていたこれらの音源を掘り起こしたのが、1972年にLenny KayeがElektraのために編纂したコンピレーション、ナゲッツである。その解説文で使われたパンク・ロックという語が、後のジャンル名の由来のひとつとなった。以降、1970年代のThe Cramps、1980年代のペイズリー・アンダーグラウンド、そして2001年前後のThe StrokesやThe White Stripes、The Hivesによるガレージロック・リバイバルに至るまで、素人臭くて短くて速いという価値観は繰り返し発掘され続けている。</p>
