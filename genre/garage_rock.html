<h1>Garage Rock（ガレージロック）とは</h1>
<p>ガレージロックは、楽器を手にして間もない10代の若者が、自宅のガレージや地下室で練習し、地元のダンスパーティーや高校の体育館で演奏していた音楽である。演奏技術の未熟さを隠さず、勢いと粗さをそのまま録音した点に特徴がある。 編成は、</p>
<p>ガレージロックは、楽器を手にして間もない10代の若者が、自宅のガレージや地下室で練習し、地元のダンスパーティーや高校の体育館で演奏していた音楽である。演奏技術の未熟さを隠さず、勢いと粗さをそのまま録音した点に特徴がある。

編成は、ギター2本、ベース、ドラムが基本だ。そこに、Farfisa や Vox Continental といった小型のコンボオルガンが加わることが多い。この安価な電子オルガンの薄く鋭い音色が、この時代の特徴となっている。

ギターは、初期のファズボックス（音を荒く歪ませる箱型の機器）を踏んだ潰れた音で、基本的なコードだけを激しく掻き鳴らす。ソロは、ブルースの型を大まかになぞる程度に留まることが多い。

リズムは4/4拍子で、単純に前へ突き進む。テンポはミドルから速めまで幅があり、ドラムは粗い叩き方をする。

歌は、音程が不安定なまま怒鳴るように歌われる。歌詞は、失恋の恨み、親や学校への苛立ち、思い通りにならない女の子への不満といった、極めて狭く切実な10代の関心事に集中する。

曲は短く、間奏も切り詰められている。録音は短時間で終えられることが多く、機材も限られていた。そのため、音は前に出るが薄く、それがかえって切迫感を生んだ。批評家はこの音楽をパンクの先駆と見なし、当時「punk rock」と呼んだ。</p>
<h2>成り立ち</h2><p>サーフ・ロックに続いて、きっかけの一つとなったのが、1964年2月のできごとだ。The BeatlesがEd Sullivan Showに出演し、アメリカ中の家庭に映し出された（ブリティッシュ・インヴェイジョン）。ほどなくして全米の郊外で、数え切れないほどの10代のバンドが結成された。親の車庫が練習場所になった。

その前年の1963年、オレゴン州ポートランドのThe Kingsmenがルイ・ルイを録音していた。歌詞が聞き取れないほど不明瞭なこの演奏は、猥褻な内容が隠されているという噂を呼んだ。FBIは1964年に調査を開始し、約2年以上かけて「解読不能で、猥褻とは判断できない」と結論づけた。これは珍事を生んだ。すでに全米ヒットとなっていた曲が、騒動でさらに話題になった。

ワシントン州タコマのThe Sonicsは、1964年のザ・ウィッチや後のサイコで、録音レベルを振り切らせた凶暴な音と評される演奏を残した。後年、パンクに大きな影響を与えたバンドの一つとなる。

1966年前後が最盛期だった。ロサンゼルスのThe Standellsのダーティ・ウォーター、ミシガン州のQuestion Mark and the Mysteriansの96ティアーズ、カリフォルニアのThe Seeds、テキサス州オースティンのThe 13th Floor Elevatorsが、相次いでヒットを出した。The 13th Floor ElevatorsはRoky Ericksonの絶叫と、Tommy Hallが壺の口に向かって声を出し、共鳴とリバーブを付ける「エレクトリック・ジャグ」によって、サイケデリック・ロックの先駆けにもなった。

技術面では、ファズボックスの普及が大きかった。1965年にThe Rolling Stonesのサティスファクションで使われたことで、Maestro FZ-1ファズ・トーンは売り切れた。

しかし、一発屋が多かった。メンバーは進学や徴兵、就職によって散っていった。ベトナム戦争の徴兵はこの世代を直撃し、シーンの終焉を早めた一因でもある。

それでも、音源は消えなかった。忘れられかけていたこれらの音源を掘り起こしたのが、1972年にLenny KayeがElektraのために編纂したコンピレーション、ナゲッツである。その解説文で使われたパンク・ロックという語が、後のジャンル名の由来のひとつとなった。

以降、素人臭くて短くて速いという価値観は、繰り返し発掘され続けている。1970年代のThe Cramps、1980年代のChesterfield Kings、The Fuzztones、The Pandoras、Lyres、そして2001年前後のThe StrokesやThe White Stripes、The Hivesによるガレージロック・リバイバルに至るまで、それは続いている。</p>
