<h1>UK Hardcoreとは</h1>
<p>イギリスで独自に発展した、明るく旋律的な高速ダンス音楽。テンポは毎分165から180拍程度で、キックは四つ打ちだが、ガバのように歪ませず、硬く締まった音で軽く跳ねる。決定的な特徴はベースとリズムの組み立てで、キックの間にオフビート</p>
<p>イギリスで独自に発展した、明るく旋律的な高速ダンス音楽。テンポは毎分165から180拍程度で、キックは四つ打ちだが、ガバのように歪ませず、硬く締まった音で軽く跳ねる。決定的な特徴はベースとリズムの組み立てで、キックの間にオフビートのベースが入り、そこに切り刻んだブレイクビーツの断片が重なることで、跳ね上がるような推進力が生まれる。上物は極めて旋律的で、明るい長調のシンセによる分かりやすい主旋律が置かれ、ピアノのリフや上昇するアルペジオが高揚を作る。和音は長調の四和音の循環が中心である。ボーカルの扱いも特徴的で、女性歌手による感情的な歌唱を、音程を上げて速く加工したものが多用され、この高い声が様式の署名になっている。曲の構成は明快で、静かな導入部から、すべてが抜ける溜めの部分を経て、キックと旋律が同時に戻る解放の瞬間に頂点が置かれる。歌詞は愛、希望、夜、一緒に踊ろうという呼びかけといった肯定的な内容に限定される。演奏の場は大型の屋内催しで、観客は手を高く上げ、笑顔で跳ね続ける。攻撃性を完全に排した多幸感が、この音楽の核心である。</p>
<h2>成り立ち</h2><p>系譜は1991年から92年頃のイギリスのレイヴにさかのぼる。当時のブレイクビーツ・ハードコアは、切り刻んだドラムのループとピアノのリフ、そして加工した歌声を組み合わせた高速の音楽で、屋外の無許可のレイヴで鳴らされていた。1993年頃、この流れは二つに分かれる。暗く低音を重視する方向はジャングル、そしてドラムンベースへ進み、明るく旋律的な方向はハッピー・ハードコアと呼ばれるようになった。後者を担ったのはSlipmatt、Dougal、Hixxy、Sy and Unknown、Brisk、Vibesといったロンドン周辺のDJたちで、レーベルではKniteforce、Happy Hardcore、Essential Platinumが受け皿となった。1995年から97年頃が最初の絶頂期で、Bonkersというコンピレーションのシリーズが、若者の間で爆発的に売れた。1990年代末には一度勢いを失うが、2000年代前半に大きく変わる。それまでの跳ねたブレイクビーツを減らし、より締まった四つ打ちと、トランス寄りの旋律を取り入れた新しい形が現れ、これがUKハードコアと呼ばれるようになった。中心にいたのはBrisk、Gammer、Darren Styles、Re-Con、Squadで、レーベルではNext GenerationとRelentlessが主導した。とりわけDarren Stylesは、歌ものの旋律とこの高速のリズムを結びつけ、2000年代後半に大きな人気を得た。日本ではこの様式が独自に受容され、2000年代半ばからM-ProjectやRyu☆、DJ Noriken、そして音楽ゲームを通じて広く浸透し、日本製のUKハードコアが逆に英国へ紹介される事態も起きた。2010年代以降は聴衆の規模こそ縮小したが、熱心な支持層と大型の催しは今も継続している。</p>
