<h1>UK Hardcoreとは</h1>
<p>イギリスで独自に発展した、明るく旋律的な高速ダンス音楽。テンポは毎分165から180拍程度で、キックは四つ打ちだが、ガバほど極端には歪ませず、硬く締まった音で軽く跳ねる。決定的な特徴はベースとリズムの組み立てで、四つ打ちのキックの</p>
<p>イギリスで独自に発展した、明るく旋律的な高速ダンス音楽。テンポは毎分165から180拍程度で、キックは四つ打ちだが、ガバほど極端には歪ませず、硬く締まった音で軽く跳ねる。決定的な特徴はベースとリズムの組み立てで、四つ打ちのキックの間にオフビートのベース(キック&amp;ベース)が入ることで、跳ね上がるような推進力が生まれる。ブレイクビーツが主体なのは1990年代前半のブレイクビーツ・ハードコアや初期のハッピーハードコアで、その後は次第に失われていった。上物は極めて旋律的で、明るい長調のシンセによる分かりやすい主旋律が置かれ、ピアノのリフや上昇するアルペジオが高揚を作る。ボーカルの扱いも特徴的で、女性歌手による感情的な歌唱を、音程を上げて速く加工したものが多用され、この高い声が様式の署名になっている。曲の構成は明快で、静かな導入部から、すべてが抜ける溜めの部分を経て、キックと旋律が同時に戻る解放の瞬間に頂点が置かれる。歌詞は愛、希望、夜、一緒に踊ろうという呼びかけといった明るい内容が多い。演奏の場は大型の屋内催しで、観客は手を高く上げ、笑顔で跳ね続ける。攻撃性より多幸感が前面に出ることが、この音楽の大きな特徴である。</p>
<h2>成り立ち</h2><p>系譜は1991年から92年頃のイギリスのレイヴにさかのぼる。当時のブレイクビーツ・ハードコアは、切り刻んだドラムのループとピアノのリフ、そして加工した歌声を組み合わせた高速の音楽で、Fantazia、Dreamscape、Raindanceなどが開く合法の大規模なレイヴと、フリーパーティーの音響集団による無許可のレイヴの両方で鳴らされていた。1992年末から1993年にかけて、この流れは分かれ始める。暗い方向はダークコアやハードコア・ジャングル、そしてドラムンベースへ進み、明るく旋律的な方向はハッピー・ハードコアと呼ばれるようになった。ハッピー・ハードコアが独立した場として固まったのは1994年末とされる。後者を担ったのはSlipmatt、Dougal、Hixxy、Sy and Unknown、Brisk、Vibesといったイングランド南部・中部の各地のDJたちで、レーベルではKniteforce、Hectic、Homegrown、Impact、Essential Platinumなどが受け皿となった。1995年から97年頃が最初の絶頂期で、Bonkersというコンピレーションのシリーズが、若者の間で爆発的に売れた。1990年代末には一度勢いを失うが、2000年代初めに大きく変わる。ハッピー・ハードコアは1990年代半ば以降ブレイクビーツを減らして硬い四つ打ちへ向かっていたが、ここにトランス寄りの旋律が取り入れられた。この形は、ハッピー・ハードコアの派生形・別称として「UKハードコア」と呼ばれる(時期や範囲には諸説ある)。中心にいたのはBrisk、Gammer、Darren Styles、Re-Con、Squad-Eで、レーベルではサウサンプトンのNext Generationなどがあった。とりわけDarren Stylesは、歌ものの旋律とこの高速のリズムを結びつけ、2000年代後半に大きな人気を得た。日本には1990年代末(Dancemania Speedなど)から伝わって受容され、2000年代以降は音楽ゲームとJ-COREの中で、M-ProjectやRyu☆、DJ Norikenらによって独自に発展した。2010年代以降は聴衆の規模こそ縮小したが、熱心な支持層と大型の催しは今も継続している。</p>
