<h1>UK Hardcoreとは</h1>
<p>イギリスで独自に発展した、明るく旋律的な高速のダンス音楽だ。 テンポは毎分165から180拍ほど。キックは四つ打ちだが、ガバほど極端には歪ませないとされることが多い。硬く締まった音で、軽く跳ねるように鳴る。 ベースとリズムの組み立</p>
<p>イギリスで独自に発展した、明るく旋律的な高速のダンス音楽だ。

テンポは毎分165から180拍ほど。キックは四つ打ちだが、ガバほど極端には歪ませないとされることが多い。硬く締まった音で、軽く跳ねるように鳴る。

ベースとリズムの組み立ては、いちばんの特徴とされることが多い。四つ打ちのキックの間に、裏拍でベースが入る形(キック&amp;ベース)がよく使われる。これによって、跳ね上がりながら前へ進むような勢いが生まれる。ブレイクビーツが主体だったのは、1990年代前半のブレイクビーツ・ハードコアや初期のハッピー・ハードコアまでで、その後は次第に使われなくなった。

上に重ねる音は、とてもメロディアスだ。明るい長調のシンセが分かりやすい主旋律を奏で、ピアノのリフや上昇するアルペジオが高揚感を作る。

ボーカルの扱いにも特徴がある。音程を上げたボーカルがはっきり目立つのは、1990年代のハッピー・ハードコアだ。UKハードコアでは、音程を上げる加工と、歌い上げる本物のボーカルの両方が使われる。

歌詞の例としては、愛、希望、夜、一緒に踊ろうという呼びかけといった、明るい内容がある。

曲の組み立てははっきりしている。静かな導入部から、すべての音が抜ける溜めの部分を経て、キックと旋律が同時に戻ってくる。この一気に解き放たれる瞬間に、いちばんの盛り上がりが置かれる。

演奏の場は大型の屋内イベントで、観客は手を高く上げ、笑顔で跳ね続ける。攻撃性より多幸感が前に出ることが、この音楽の大きな特徴である。</p>
<h2>成り立ち</h2><p>始まりは、1991年から92年頃のイギリスのレイヴにさかのぼる。

当時のブレイクビーツ・ハードコアは、細かく切り刻んだドラムのループに、ピアノのリフと加工した歌声を組み合わせた高速の音楽だった。Fantazia、Dreamscape、Raindanceなどが開く合法の大規模なレイヴでも、フリーパーティーの音響集団による無許可のレイヴでも、この音楽が鳴っていた。

1992年末から1993年にかけて、この流れは分かれ始める。暗い方向はダークコアになった。レゲエ／ラガのベースを強めた方向はハードコア・ジャングルになり、のちにドラムンベースが派生した。一方、明るく旋律的な方向は、ハッピー・ハードコアと呼ばれるようになった。ハッピー・ハードコアが独立した分野として固まったのは、1994年末とされる。

この明るい方向を担ったのは、Slipmatt、Dougal、Hixxy、Sy and Unknown、Brisk、Vibesといった、イングランド南部・中部の各地のDJたちだ。レーベルでは、Kniteforce、Hectic、Homegrown、Impact、Essential Platinumなどが受け皿となった。

最初の絶頂期は、1995年から97年頃だった。Bonkersシリーズは1996年に始まり、1990年代半ばから後半にかけて商業的に人気を集めた。ハードコア系で最も売れたコンピレーションのシリーズとされる。

1990年代末には、一度勢いを失う。しかし2000年代初めに、大きな変化が起きた。ハッピー・ハードコアは1990年代半ば以降、ブレイクビーツを減らして硬い四つ打ちへ向かっていた。そこに、トランス寄りの旋律が取り入れられたのだ。この形は、ハッピー・ハードコアの派生形・別称として「UKハードコア」と呼ばれる(時期や範囲には諸説ある)。

中心にいたのは、Brisk、Gammer、Darren Styles、Re-Con、Squad-Eだ。レーベルでは、サウサンプトンのNext Generationなどがあった。Darren Stylesは、2008年のソロ作『Skydivin'』で全英4位となり、ゴールド認定を得た。

日本には、1990年代末からDancemania Speedなどを通じて伝わり、受け入れられた。2000年代以降は、音楽ゲームとJ-COREの中で、M-ProjectやRyu☆、DJ Norikenらによって独自に発展した。ただし、3人の主軸はそれぞれ違う。M-Projectはマキナを軸に、UKハードコアも手がける。Ryu☆の主なジャンルは、ハッピー・ハードコア、J-POP、トランスとされる。DJ Norikenは、主にUKハードコアとハードダンスを扱う。

2010年代以降も、イベントは続いており、国際的な広がりも見られる。一方で、1990年代ほどの規模ではないとする見方もある。</p>
