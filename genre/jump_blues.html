<h1>Jump Blues（ジャンプブルース）とは</h1>
<p>ジャンプ・ブルースは、ブルースに、大編成ジャズの勢いと、踊るための速さを掛け合わせた音楽だ。曲の多くは12小節ブルースを土台にしている。 編成は、典型的には5〜7人だ。サックスを中心とする1本から3本の管楽器に、ピアノまたはギター</p>
<p>ジャンプ・ブルースは、ブルースに、大編成ジャズの勢いと、踊るための速さを掛け合わせた音楽だ。曲の多くは12小節ブルースを土台にしている。

編成は、典型的には5〜7人だ。サックスを中心とする1本から3本の管楽器に、ピアノまたはギター、ウッドベース、ドラムが加わる。大編成の例もある。これはスウィング楽団を、採算が取れる規模まで縮めた形である。人数が減ったぶん、一人ひとりの音量と存在感が増している。

リズムは、三連符を土台に跳ねるシャッフルである。ベースは4分音符を歩くように刻む。ドラムはハイハットとスネアで、前へ前へと押し出す。

管楽器は、短い決め文句を全員で吹くリフを繰り返す。その合間に歌が入る。中間部では、テナーサックスが吠えるような独奏を取る。このソロが目指すのは、音楽としての洗練よりも、客を興奮させることだ。極端な高音の絶叫や、同じ音を延々と吹き続ける手法があった。床に寝転がって吹くといった、見世物のような演出もあった。リズム・アンド・ブルースのホンキング・テナーの代表格、Big Jay McNeelyがその例だ。

歌は、語りかけと叫びの中間だ。深刻な嘆きではなく、酒、賭け事、色恋、失敗談を、陽気に、しばしば滑稽に歌う。歌詞に会話や語りを挟み込む、話芸のような性格が強い。目的は、聴衆を笑わせて踊らせることである。</p>
<h2>成り立ち</h2><p>ジャンプ・ブルースは1930年代後半に現れ、1940年代前半の戦時下で後押しされた。

当時、大編成のジャズ楽団は苦しい立場にあった。徴兵で奏者が抜け、戦時の移動制限で長距離の巡業も難しくなった。1944年には、既存のキャバレー税が5%から30%へ引き上げられた（のち20%）。こうしたいくつもの事情が重なり、大人数の楽団は経済的に成り立ちにくくなっていた。そこで広まったのが、少人数でも大編成に負けない熱量を出せるジャンプ・ブルースである。

中心にいたのはルイ・ジョーダンだ。彼が率いたティンパニー・ファイヴは、黒人向けチャートで通算18回、計113週も首位に立った。他のどのアーティストの約2倍という成績である。代表作は、1945年の『カルドニア』や1946年の『チュー・チュー・チブギ』などだ。彼のレコードは、すでに全盛だったジュークボックス市場で成功した。3分以内に収まり、大きな音で鳴らしたときに映え、歌詞が笑えるという条件を満たしていたためとも考えられる。

同じころ、ロイ・ブラウンが1947年6月または7月に『グッド・ロッキン・トゥナイト』を録音し、同年秋に発売した。同じ年の12月にはワイノニー・ハリスの盤が録音され、1948年に発売されて大ヒットした。「ロッキン」という語は、もともと船の揺れを表す言葉として生まれた。20世紀初頭からは、宗教的な熱狂や性的な隠語の意味でも使われた。ただ、この曲では、音楽のスタイルを指す使い方として評価されている。この語は、ロックンロールという名称の背景の一つとされる。

一方、西海岸では、ジョニー・オーティスやT・ボーン・ウォーカーが同じ種類の音楽を発展させた。ウォーカーは、エレキギターを独奏楽器として定着させた先駆者の一人となった。

1954年、ビッグ・ジョー・ターナーが『シェイク、ラトル・アンド・ロール』を吹き込んだ。同じ年、ビル・ヘイリーが歌詞を穏やかに書き換えてカバーし、白人市場で大きく売れた。黒人音楽が、白人の演者を通って主流の市場に届く。この流れは、その後も何度も繰り返されることになる。

やがてジャンプ・ブルースは、1950年代にリズム・アンド・ブルースやロックンロールへ流れ込み、独立した流行としては衰えた（時期は50年代〜60年代初頭と見方が分かれる）。それでも、1970年代からスタイルを守り続けたルームフル・オブ・ブルース(1967年結成)や、1990年代に人気を集めたブライアン・セッツァー楽団(1992年結成、1994年にデビュー作)などによって再び評価された。今では、大編成の華やかさを持つ踊るための音楽として、再び演奏されている。</p>
