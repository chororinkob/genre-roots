<h1>Jump Blues（ジャンプブルース）とは</h1>
<p>ブルースの和音進行に、大編成ジャズの推進力と、踊るための速さを掛け合わせた様式である。編成は5人から7人程度で、サックスを中心とする1本から3本の管楽器、ピアノ、ギター、ウッドベース、ドラムという構成を取る。これはスウィング楽団を</p>
<p>ブルースの和音進行に、大編成ジャズの推進力と、踊るための速さを掛け合わせた様式である。編成は5人から7人程度で、サックスを中心とする1本から3本の管楽器、ピアノ、ギター、ウッドベース、ドラムという構成を取る。これはスウィング楽団を経済的に成り立つ規模まで縮めた形であり、人数が減ったぶん一人あたりの音量と存在感が増している。リズムは三連符を土台に跳ねるシャッフルである。ベースは4分音符を歩くように刻み、ドラムはハイハットとスネアで前へ前へと押し出す。管楽器は短い決め文句を全員で吹くリフを反復し、その合間に歌が入り、中間部でテナーサックスが咆哮する独奏を取る。この独奏は音楽的な洗練よりも興奮の演出を目的としており、極端な高音の絶叫や、同じ音を延々と吹き続ける手法、床に寝転がって吹くといった見世物的な演出もあった(Big Jay McNeelyなど)。歌は語りかけと叫びの中間で、深刻な嘆きではなく、酒、賭け事、色恋、失敗談を陽気に、しばしば滑稽に歌う。歌詞に会話や語りを挟み込む話芸的な性格が強く、聴衆を笑わせて踊らせることが目的である。</p>
<h2>成り立ち</h2><p>ジャンプ・ブルースは1930年代後半に現れ、1940年代前半の戦時下で後押しされた。当時、大編成のジャズ楽団は苦境に立たされていた。徴兵で奏者が抜け、戦時の移動制限で長距離の巡業が難しくなり、1944年には娯楽税も課されて、大人数の楽団を経済的に成り立たなくしていた。この状況で、少人数でありながら大編成に匹敵する熱量を出す編成として広まったのがジャンプ・ブルースである。中心にいたのはルイ・ジョーダンで、彼が率いたティンパニー・ファイヴは、黒人向けチャートで通算18回、計113週も首位に立ち、他のどのアーティストの約2倍という成績を残した。1945年の『カルドニア』、1946年の『チュー・チュー・チブギ』などが代表作で、彼のレコードはジュークボックスという新しい流通経路に完璧に適合していた。3分以内に収まり、大きな音で鳴らしたときに映え、歌詞が笑えるという条件を満たしていたためである。同時期にはロイ・ブラウンが1947年6月に『グッド・ロッキン・トゥナイト』を録音して発売し、同じ年の12月に録音されたワイノニー・ハリス盤(1948年発売)が大ヒットした。ここで使われた「ロッキン」という語は、船の揺れを表す言葉として生まれ、20世紀初頭から宗教的な熱狂や性的な隠語の意味でも使われており、ロックンロールという名称の背景の一つとされる。西海岸ではジョニー・オーティスやT・ボーン・ウォーカーが同種の音楽を発展させ、ウォーカーはエレキギターを独奏楽器として確立した先駆者の一人となった。1954年にビッグ・ジョー・ターナーが吹き込んだ『シェイク、ラトル・アンド・ロール』は、同年にビル・ヘイリーが歌詞を穏当に書き換えてカバーし、白人市場で大きく売れた。この構図、すなわち黒人音楽が白人の演者を経由して主流市場に届くという流れは、以後何度も繰り返されることになる。ジャンプ・ブルースそのものは50年代後半にロックンロールとリズム・アンド・ブルースに吸収されて姿を消したが、1990年代のスウィング・リバイバルの中で、ルームフル・オブ・ブルース(1967年結成)やブライアン・セッツァーの楽団(1994年デビュー)などによって再評価され、大編成の華やかさを持つ舞踏音楽として再び演奏されている。</p>
