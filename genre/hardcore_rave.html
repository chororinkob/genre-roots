<h1>Hardcore Rave（ハードコアレイブ）とは</h1>
<p>1990年代前半のイギリスのレイヴから生まれた、高速で断片的なダンス音楽。テンポは概ね140〜155BPM前後(出典により幅がある)と、当時としては速く、四つ打ちのキックにブレイクビーツを重ねる二重構造が最大の特徴になる。ブレイク</p>
<p>1990年代前半のイギリスのレイヴから生まれた、高速で断片的なダンス音楽。テンポは概ね140〜155BPM前後(出典により幅がある)と、当時としては速く、四つ打ちのキックにブレイクビーツを重ねる二重構造が最大の特徴になる。ブレイクビーツにはファンクのドラム録音から切り出した数小節、とりわけ「Amen Break」と呼ばれる断片が多用され、これをサンプラーで刻み、原曲より速い速度で再生する。この結果、ドラマーが人力では不可能な速度で叩いているような効果が生まれる。ベースはレゲエのサウンドシステム文化から受け継いだ深く沈むサブベースで、しばしば低音だけで空間を満たす。上物はシンセの短い和音の突き刺し、ピアノの明るいリフ、そして加工した女性ヴォーカルの断片。ヴォーカルは意味を伝えるより、高い音程に上げられて楽器のように扱われる。この甲高い声はハッピーな高揚を作る装置として機能した。曲の構成は激しい落差を持ち、ブレイクで全てを抜いて叫び声とサイレンだけにし、そこから全要素を一気に戻す。制作にはAkai S950やAKAI S1000といった限られたメモリのサンプラーが使われ、その制約から生じる粗い音質そのものが時代の刻印になっている。後のジャングル、ドラムンベース、ハッピーハードコアの共通の祖先にあたる。</p>
<h2>成り立ち</h2><p>1990年から1993年頃のイギリスで、アシッドハウス以降のレイヴ文化が加速する中で生まれた。背景には、1988年から1989年のセカンド・サマー・オブ・ラヴが政府の規制によって締め上げられたという事情がある。1990年のEntertainments (Increased Penalties) Actにより無許可のパーティー主催者に重い罰金が科されるようになり、主催者は直前の告知や海賊放送、電話での告知などで規制をかいくぐり、大型のレイヴは1992年まで続いた。音楽的な転換点は、ハウスのテンポが徐々に上がり、そこにヒップホップ由来のブレイクビーツが混ざり始めたことにある。決定的だったのはサンプラーの普及で、Akaiの機種が中古で入手可能になったことで、若い制作者が既存のレコードから断片を切り出して再構成できるようになった。とりわけThe Winstonsが1969年に録音した「Amen, Brother」のドラム独奏部分は、Amen Breakとして無数の楽曲に使われることになる。この録音のドラマーGregory C. Coleman(ミドルネームはCylvesterとSylvesterの両表記がある)は生涯ほとんど報酬を得ず、2006年にホームレス状態で死去したことが後に報じられ、サンプリング文化の倫理を問う象徴的な事例となった。主要な作品としては、The Prodigyの1991年「Charly」、Altern-8、SL2「On a Ragga Tip」、Acen、4heroが挙がる。レーベルではSuburban Base、Reinforced Records(4heroが1989年に設立)、Moving Shadow、Shut Up and Danceが中心となった。文化としては、ロンドンとイングランド中部の倉庫が主要な現場で、M25沿線の野外の大規模パーティーは1989年が盛りだった。海賊放送のCentreforce(1989〜90年)やFantasy FMなどのレイヴ局が情報を媒介した。参加者は労働者階級の若者が中心で、階級的な背景がこの音楽の荒々しさと結びついていた。薬物の問題は深刻で、MDMAだけでなく安価な代替品が流通し、健康被害が相次いだ。1992年後半から分岐が始まる。より暗い方向がダークコアとなり、低音を重視する方向がジャングルとなり、明るくピアノと甲高い歌を強調する方向がハッピーハードコアとなった。なお、ガバはこの分岐の先ではなく、オランダのロッテルダムやアムステルダムでハウスやテクノから別に発展した系統である。この分裂の背景には、シーンの人種的・階級的な分断も指摘されている。1994年のCriminal Justice and Public Order Actは、第63条で警察に退去指示の権限を与え、違法なレイヴは難しくなったが、フリーパーティーは形を変えて続いた。しかし残した遺産は大きく、現在のドラムンベース、ダブステップ、UKベース全般がこの時期の音の語彙を受け継いでいる。</p>
