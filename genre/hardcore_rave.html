<h1>Hardcore Rave（ハードコアレイブ）とは</h1>
<p>ハードコア・レイヴは、1990年代前半のイギリスのレイヴから生まれた、速くて細切れのダンス音楽だ。 テンポは概ね140〜155BPM前後(出典により幅がある)で、当時としては速かった。いちばんの特徴は、四つ打ちのキックにブレイクビ</p>
<p>ハードコア・レイヴは、1990年代前半のイギリスのレイヴから生まれた、速くて細切れのダンス音楽だ。

テンポは概ね140〜155BPM前後(出典により幅がある)で、当時としては速かった。いちばんの特徴は、四つ打ちのキックにブレイクビーツを重ねる、二つの層の作りである。

ブレイクビーツには、ヒップホップ由来のさまざまなブレイク(「Amen Break」と呼ばれる断片など)が使われる。これをサンプラーで刻み、原曲より速い速度で再生する。その結果、ドラマーが人の手では無理な速さで叩いているように聞こえる。

ベースは、レゲエのサウンドシステム文化の影響を受けた、深く沈むサブベースだ。しばしば低音だけで空間を満たす。

上に重ねる音は、シンセの短い和音を突き刺すような音、ピアノの明るいリフ、そして高音化されたヴォーカルの断片である。ヴォーカルは意味を伝えるためではなく、高い音程に上げられて楽器のように扱われる。

曲の組み立ては落差が激しい。ブレイクで全てを抜いてサイレンだけにし、そこから全ての音を一気に戻す。

制作にはAkaiのサンプラーが使われた。12ビットのS950(およびS900)の粗い音質が、時代の手触りを作った。16ビットのS1000も、同じ時代の標準機だった。

後のジャングルとドラムンベースの祖先にあたる。ハッピーハードコアは、この音楽と欧州大陸のハードコアテクノの両方から生まれた。</p>
<h2>成り立ち</h2><p>1990年から1993年頃のイギリスで、アシッドハウス以降のレイヴ文化が勢いを増す中、この音楽は生まれた。

背景には、1988年から1989年のセカンド・サマー・オブ・ラヴが、政府の規制で厳しく取り締まられたという事情がある。1990年のEntertainments (Increased Penalties) Actにより、無許可のパーティーの主催者に重い罰金が科されるようになった。それでも主催者は、直前の告知や海賊放送、電話での告知などで規制をかいくぐった。大型のレイヴは1992年まで続いた。

音楽の面での転換点は、ハウスのテンポが少しずつ上がり、そこにヒップホップ由来のブレイクビーツが混ざり始めたことにある。もう一つの背景は、サンプラーの普及だ。S900の中古価格がS950登場後に大きく下がり、安価な12ビット機が手に入りやすくなった。これで若い制作者が、既存のレコードから断片を切り出して組み直せるようになった。

とりわけ、The Winstonsが1969年に録音した「Amen, Brother」のドラム独奏部分は、Amen Breakとして、とくにダークコアやジャングル以降の無数の曲に使われることになる。この録音のドラマーGregory C. Coleman(ミドルネームには綴りが2通りある)は、生涯ほとんど報酬を得なかった。2006年にホームレス状態で亡くなったことが後に報じられ、サンプリング文化の倫理を問う代表的な例となった。

主な作品としては、The Prodigyの1991年「Charly」、Altern-8、SL2「On a Ragga Tip」、Acen、4heroが挙がる。レーベルではSuburban Base、Reinforced Records(4heroが1989年に設立)、Moving Shadow、Shut Up and Danceが中心となった。

文化の面では、ロンドンおよびその周辺（M25沿線）、ミルトン・キーンズなどの合法的な大箱が主な現場だった。M25沿線の野外の大規模パーティーは、1989年が盛りだった。海賊放送のCentreforce(1989〜90年)やFantasy FMなどのレイヴ局が、情報を伝える役目を担った。

労働者階級の若者が中心だったという見方がある。階級的な背景が、この音楽の荒々しさと結びついていたという見方もある。一方で薬物の問題は深刻で、社会問題になった。

1992年後半から、分岐が始まる。より暗い方向がダークコアとなり、低音を重視する方向がジャングルとなった。明るくピアノと甲高い歌を強調する方向は、ハッピーハードコアとなった。なお、ガバはこの分岐の先ではない。オランダのロッテルダムやアムステルダムで、ハウスやテクノから別に発展した系統である。この分裂の背景には、シーンの人種的・階級的な分断も指摘されている。

1994年のCriminal Justice and Public Order Actは、第63条で警察に退去指示の権限を与えた。違法なレイヴは難しくなったが、フリーパーティーは形を変えて続いた。

しかし、残したものは大きい。ジャングルを経て、今のドラムンベースにつながっている。ダブステップなどUKベース全般についても、ハードコアからの連続性を主張する見方(ハードコア・コンティニュアム論)があるが、異論もある。</p>
