<h1>Ethereal Wave（エセリアルウェーブ）とは</h1>
<p>ダークウェイヴの一分派で、暗さよりも透明感と浮遊感を追求した音楽。決定的な特徴はエフェクトを多用したギターの音響空間で、そこに高音域の女性ヴォーカルが加わる。歌詞は聞き取りにくいことがあり（Cocteau Twinsのように造語や</p>
<p>ダークウェイヴの一分派で、暗さよりも透明感と浮遊感を追求した音楽。決定的な特徴はエフェクトを多用したギターの音響空間で、そこに高音域の女性ヴォーカルが加わる。歌詞は聞き取りにくいことがあり（Cocteau Twinsのように造語や外国語由来の語を含む例が代表的だが、ジャンル全体の条件ではない）、多重録音とリヴァーブ（残響）によって人の声が霧のように広がる。Cocteau Twinsなどの例では、ギターにコーラス（音に厚みを出す効果）、フランジャー（音をうねらせる効果）、ロングディレイ（長く遅れて繰り返す反響）などの効果を重ね、加工された持続音として鳴る。空間系エフェクト（音に広がりを足す効果）による厚みが中心だが、初期には歪みやフィードバックも使われ、和音をかき鳴らすというより残響の層を作る道具として使われる。ドラムはドラムマシンを使うことが多く、Cocteau Twinsのようにドラムマシンの音がはっきり前面に出る例もある。ベースはポスト・パンク由来のベースラインを持つ。テンポは遅く、拍の輪郭も意図的に曖昧にされる。和声（コードの響き）は短調中心の暗く浮遊した響きが多い。歌詞の主題は解釈に委ねられ、聴き手が意味を重ねる余地が設計上の狙いになっている。ドリームポップやシューゲイザーと隣接するが、より非現実的で、ロマンティックで幻想的な主題が多い。</p>
<h2>成り立ち</h2><p>1980年代前半のイギリス、とりわけロンドンのレーベル4AD Recordsを中心に形成された。決定的な役割を果たしたのはスコットランドのグランジマウス出身のCocteau Twinsで、Robin GuthrieとWill Heggieが1979年に結成し、Elizabeth Fraserは1981年に加わってヴォーカルになった。彼らの1984年の「Treasure」は、批評家から「最初の完全な実現」と評された。Guthrieが多数のエフェクターを通した非現実的なギターの層を作り、Fraserは造語や外国語由来の語を含む聞き取りにくい歌唱で歌った。Fraserは、2009年のGuardianの記事によれば、歌詞を書くのが昔から苦手だが、あるとき何かがひらめいて「サウンドと喜びに従う」と語っている。この手法は言語による制約を外すことで、声を楽器のように扱うという意外な組み合わせを成立させた。4ADの主宰Ivo Watts-Russellは、所属アーティストの寄せ集めによる企画バンドThis Mortal Coilを1983年に始動させ、Tim BuckleyやBig Starの曲を静かな編曲でカヴァーし、神秘的で奥深い音響を4ADの共通の表現に育てた。デザイナーVaughan Oliverによる、輪郭のぼやけた抽象的なジャケット群も、音の性質を視覚化して市場に浸透させた。「ethereal wave」という呼称は、ドイツのファンジン（ファン手作りの冊子）を中心にヨーロッパの音楽誌が名づけ（米国では「ethereal goth」も使われた）、ドイツのHyperium Recordsが1990年代に出した編集盤シリーズ「Heavenly Voices」も広める役割を果たした。この時期にはLove Spirals Downwards、Faith and the Muse、Black Tape for a Blue Girlといったアメリカのバンドが加わり（Projekt RecordsやHyperium Recordsの周辺にはイギリスのAttritionのようなダークウェイヴ／インダストリアル系も作品を出した）、Projekt Recordsが1983年にSam Rosenthalによって設立されて北米側の拠点になった。1990年代前半にはCocteau Twins内部でGuthrieとFraserの13年続いた関係が1993年に終わり（Guthrieはアルコールと薬物をやめるためリハビリに入った）、1997年に解散する。Elizabeth Fraserはその後、1998年のMassive Attackの「Teardrop」で歌った。この曲は、1994〜95年に恋人だったJeff Buckley（Tim Buckleyの息子）についての曲だと、本人が「ある意味、彼についての曲。少なくとも私にはそう感じられる」と語っており、Buckleyは1997年に溺死している。音楽的な影響はシューゲイザーやドリームポップに引き継がれている。</p>
<h2>代表曲</h2><ul><li>Song to the Siren (This Mortal Coil)</li><li>Heaven or Las Vegas (Cocteau Twins)</li><li>Carolyn's Fingers (Cocteau Twins)</li><li>Yulunga (Dead Can Dance)</li><li>Sweetness and Light (Lush)</li><li>Pandora (Cocteau Twins)</li><li>Cantara (Dead Can Dance)</li><li>Persephone (Cocteau Twins)</li><li>Kangaroo (This Mortal Coil)</li><li>Anywhere Out of the World (Dead Can Dance)</li><li>Another Day (This Mortal Coil)</li><li>Avincenna (Love Spirals Downwards)</li></ul>
