<h1>Ethereal Wave（エセリアルウェーブ）とは</h1>
<p>ダークウェイヴの一分派で、暗さよりも透明感と浮遊感を追求した音楽。核となるのは女性ヴォーカルで、歌詞の意味を伝えることを放棄し、声を純粋な音響素材として扱う点が最大の特徴になる。実在しない創作言語や、意味を解体した音節の連なりで歌</p>
<p>ダークウェイヴの一分派で、暗さよりも透明感と浮遊感を追求した音楽。核となるのは女性ヴォーカルで、歌詞の意味を伝えることを放棄し、声を純粋な音響素材として扱う点が最大の特徴になる。実在しない創作言語や、意味を解体した音節の連なりで歌われ、多重録音とリヴァーブによって人の声が霧のように広がる。ギターはコーラス、フランジャー、ロングディレイを何段も重ね、原音がほとんど判別できないほど加工された持続音として鳴る。歪みではなく空間系エフェクトによる厚みが基本原理で、和音をかき鳴らすというより残響の層を作る道具として使われる。ドラムは控えめで、ドラムマシンが遠くで鳴るか、あるいは完全に省かれる。ベースは低域を静かに支え、旋律を主張しない。テンポは遅く、拍節の輪郭も意図的に曖昧にされる。和声は長調と短調の境界を溶かすような、機能を持たない浮遊した響きを好み、開放弦や複数の弦の共鳴を利用したドローンが下敷きになることが多い。曲の構成は明確なサビを持たず、音の層が増減する波として進む。歌詞の主題は解釈に委ねられ、聴き手が意味を投影する余地が設計上の狙いになっている。ドリームポップやシューゲイザーと隣接するが、より非現実的で、地上の恋愛や日常の情景を歌わない点で区別される。</p>
<h2>成り立ち</h2><p>1980年代前半のイギリス、とりわけロンドンのレーベル4AD Recordsを中心に形成された。決定的な役割を果たしたのはスコットランドのグランジマウス出身のCocteau Twinsで、Robin Guthrie、Will Heggie、Elizabeth Fraserの3人が1979年に結成した。彼らは1984年の「Treasure」で完成形に到達する。Guthrieが多数のエフェクターを通した非現実的なギターの層を作り、Fraserが実在しない言葉で歌った。Fraser自身は当初、歌詞を書くことへの自信のなさと、意味を固定したくないという意識の両方から意味不明な音節を選んだと語っている。この手法は言語による制約を外すことで、声を楽器化するという逆説を成立させた。4ADの主宰Ivo Watts-Russellは、所属アーティストの寄せ集めによる企画バンドThis Mortal Coilを1983年に始動させ、Tim BuckleyやBig Starの曲を静謐な編曲でカヴァーし、幽玄な音響を4ADの共通言語に育てた。デザイナーVaughan Oliverによる、輪郭のぼやけた抽象的なジャケット群も、音の性質を視覚化して市場に浸透させた。ethereal waveやethereal darkwaveという呼称は、当初は音楽誌よりもファンやレコード店が使う分類で、ドイツのHyperium Recordsが1990年代に出した編集盤シリーズ「Heavenly Voices」によって商品カテゴリとして定着した。この時期にはLove Spirals Downwards、Faith and the Muse、Black Tape for a Blue Girl、Attritionといったアメリカやドイツのバンドが加わり、Projekt Recordsが1983年にSam Rosenthalによって設立されて北米側の拠点になった。批判もあり、意味を持たない歌詞は逃避的で内容がないという指摘や、女性ヴォーカルを妖精のような非人間的存在として扱う紋切り型への疑問が向けられた。1990年代半ばにはCocteau Twins内部でGuthrieとFraserの私生活の破綻と薬物依存が重なり、1997年に解散する。Elizabeth Fraserはその後、1997年のMassive Attackの「Teardrop」で歌い、恋人であったTim Buckleyの息子Jeff Buckleyが同年に溺死するという出来事を経て、長く表舞台から遠ざかった。音楽的な遺産はシューゲイザー、ドリームポップ、そして2010年代のウィッチハウスやアンビエントポップに引き継がれている。</p>
<h2>代表曲</h2><ul><li>Heaven or Las Vegas (Cocteau Twins)</li><li>Song to the Siren (This Mortal Coil)</li><li>Sweetness and Light (Lush)</li><li>Yulunga (Dead Can Dance)</li></ul>
