<h1>Ethereal Wave（エセリアルウェーブ）とは</h1>
<p>エセリアル・ウェイヴは、ダークウェイヴの一分派だ。暗さよりも、透明感と浮遊感を追求した音楽である。 決定的な特徴は、エフェクトを多用したギターの音響空間だ。Cocteau Twinsなどの例では、ギターは、コーラス（音に厚みを出す</p>
<p>エセリアル・ウェイヴは、ダークウェイヴの一分派だ。暗さよりも、透明感と浮遊感を追求した音楽である。

決定的な特徴は、エフェクトを多用したギターの音響空間だ。Cocteau Twinsなどの例では、ギターは、コーラス（音に厚みを出す効果）、フランジャー（音をうねらせる効果）、ロングディレイ（長く遅れて繰り返す反響）を何段も重ねる。原音がほとんど判別できないほど加工された持続音として鳴る。空間系エフェクト（音に広がりを足す効果）が中心だが、初期には歪みやフィードバックも使われた。和音をかき鳴らすというより、残響の層を作る道具として使われる。

そこに、高音域の女声（時にオペラ的で、歌詞は聞き取りにくい）が加わる。Cocteau Twinsのように歌詞が聞き取りにくい例が代表的だが、ジャンル全体の条件ではない。多重録音とリヴァーブ（残響）によって、人の声が霧のように広がる。

ドラムマシンを使うことが多い。音は、代表例ほどはっきり前面に出るものもある。ベースは、ポスト・パンク由来のベースラインを持つ。テンポは遅く、拍の輪郭も意図的に曖昧にされる。

和声（コードの響き）は短調中心だ。開放弦（押さえずに鳴らす弦）や、複数の弦の共鳴を利用したドローン（鳴り続ける低い音）が下敷きになる例がある。

曲の構成は、Cocteau Twinsなどの例では、明確なサビを持たない。音の層が増減する波として進む。歌詞の主題は解釈に委ねられ、聴き手が意味を重ねる余地が設計上の狙いになっている。ドリームポップやシューゲイザーと隣接するが、ロマンティック／幻想的な主題が多い。</p>
<h2>成り立ち</h2><p>1980年代前半のイギリスで、エセリアル・ウェイヴは形成された。とりわけロンドンのレーベル4AD Recordsが、その中心だった。

決定的な役割を果たしたのは、スコットランドのグランジマウス出身のCocteau Twinsだ。Robin GuthrieとWill Heggieが1979年に結成し、Elizabeth Fraserは1981年に加わってヴォーカルになった。彼らの1984年の「Treasure」は、批評家から&quot;最初の完全な実現&quot;と評された。Guthrieが多数のエフェクターを通した非現実的なギターの層を作り、Fraserが、造語や外国語由来の語を含み、意味の聞き取りにくい歌唱をした。Guardian（2009年）によれば、Fraser自身は、歌詞を書くのが昔から苦手で、音に従って歌うと語っている。この手法は言語による制約を外すことで、声を楽器のように扱うという意外な組み合わせを成立させた。

4ADの主宰Ivo Watts-Russellは、所属アーティストの寄せ集めによる企画バンドThis Mortal Coilを1983年に始動させた。Tim BuckleyやBig Starの曲を静かな編曲でカヴァーし、神秘的で奥深い音響を4ADの共通の表現に育てた。デザイナーVaughan Oliverによる、輪郭のぼやけた抽象的なジャケット群も、音の性質を視覚化して市場に浸透させた。

呼び名の広がりにも、ヨーロッパが関わった。ethereal waveという呼称は、ドイツのzine（Glasnost、Aeterna、Entry、Black、Astan など）を中心にヨーロッパの音楽誌が命名した。米国では「ethereal goth」が使われた。また、ドイツのHyperium Recordsが1990年代に出した編集盤シリーズ「Heavenly Voices」も広める役割を果たした。

この時期には、Love Spirals Downwards、Faith and the Muse、Black Tape for a Blue Girlといったアメリカのバンドが加わった。イギリスの、ProjektとHyperiumの周辺で活動したダークウェイヴ／インダストリアル系のAttritionも加わった。Projekt Recordsが1983年にSam Rosenthalによって設立され、北米側の拠点になった。

しかし、1990年代前半には、Cocteau Twins内部でGuthrieとFraserの13年続いた関係が1993年に終わった（Guthrieはアルコールと薬物をやめるためリハビリに入った）。バンドは1997年に解散する。Elizabeth Fraserはその後、1998年のMassive Attackの「Teardrop」で歌った。この曲は、1994〜95年に恋人だったJeff Buckley（Tim Buckleyの息子）について、本人は『ある意味、彼についての曲』と述べている。Buckleyは1997年に溺死している。

音楽的な影響は、シューゲイザーやドリームポップに引き継がれている。</p>
<h2>代表曲</h2><ul><li>Song to the Siren (This Mortal Coil)</li><li>Heaven or Las Vegas (Cocteau Twins)</li><li>Carolyn's Fingers (Cocteau Twins)</li><li>Yulunga (Dead Can Dance)</li><li>Sweetness and Light (Lush)</li><li>Pandora (Cocteau Twins)</li><li>Cantara (Dead Can Dance)</li><li>Persephone (Cocteau Twins)</li><li>Kangaroo (This Mortal Coil)</li><li>Anywhere Out of the World (Dead Can Dance)</li><li>Another Day (This Mortal Coil)</li><li>Avincenna (Love Spirals Downwards)</li></ul>
