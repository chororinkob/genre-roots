<h1>Jam Band（ジャムバンド）とは</h1>
<p>ジャム・バンドは、録音した作品よりも、その場限りの即興演奏を目的とするロックだ。 編成の基本は、ギター、ベース、ドラムに鍵盤楽器を加えた形である。打楽器奏者が複数いる場合も多い。Grateful Deadは音の明瞭さを重視した(W</p>
<p>ジャム・バンドは、録音した作品よりも、その場限りの即興演奏を目的とするロックだ。

編成の基本は、ギター、ベース、ドラムに鍵盤楽器を加えた形である。打楽器奏者が複数いる場合も多い。Grateful Deadは音の明瞭さを重視した(Wall of Sound)。

曲は、あくまで即興に入るための足がかりとして扱われる。歌が終わった後に始まる演奏部分は、20分、時に40分に及ぶ。演奏者は互いの音を聴きながら、既存の曲を延ばし、コード進行やヴァンプ、リズムの上で即興する。曲と曲の間を切れ目なくつなぐ(セグエ)ことも多い。

ブルース、ジャズ、ファンク、ブルーグラスなどの要素を取り込み、セット全体でジャンルをまたぐことが多い。

決定的なのは、公演ごとにセットリストを大きく変えるという原則だ。同じ曲でも、演奏は毎回変わる。そのため聴き手は複数の公演を追いかけ、録音を交換し、演奏内容を記録して比べる。録音の自由な交換を許す文化が、このジャンルの特徴の一つである。</p>
<h2>成り立ち</h2><p>雛形を作った代表格は、1965年にカリフォルニア州パロアルトで結成されたGrateful Dead(当時の名はThe Warlocks)である。The Allman Brothers BandやHawkwindも、この分野の先駆に数えられる。

Grateful Deadの前身は、フォークとブルーグラス、ブルースの素養を持つ演奏者の集まりだった。しかし、幻覚剤を使った集団的な催しで伴奏を務めるうちに、決められた曲を決められた通りに演奏するという発想を捨てた。

1970年代を通じて、彼らの録音作品にはチャート上位やゴールド認定もあったが、最大のヒットは1987年である。一方、公演には熱狂的なファンが生まれた。ファンはデッドヘッズと呼ばれ、なかにはツアーを追って各地の公演に通う者も多かった。

彼らの重要な決断の一つは、観客の録音を禁じるどころか、1984年に会場内に録音専用の区画(tapers' section)を公式に設けたことだ(録音は1960年代末から1970年代初めに広まり、事実上黙認されていた)。テープの交換は無償が原則とされ、売買は仲間うちのルールで禁じられた。無料の複製が需要を奪うのではなく育てる、というこの実例は、後年インターネット時代の議論でも引用されることになる。

1995年にJerry Garciaが亡くなり、バンドは終わる。だが、その方法論はすでに受け継がれていた。

1983年にヴァーモント州の大学で結成されたPhishは、1990年代を通じて後継者としての立場を固める。彼らは1999年の年末、フロリダの湿地帯で、大晦日の深夜(午後11時35分〜50分ごろ)から元日の日の出まで、約7時間半(7時間20分とも言われる)にわたる長いセットを演奏した。途中には小休止や間があった。この催しは、この分野の伝説となった。

同じころ、Widespread Panic、The String Cheese Incident、moe.といったバンドが現れた。Dave Matthews Bandは、より歌もの寄りの形で巨大な商業的成功を収める。2002年にテネシー州で始まった大規模な野外音楽祭Bonnarooは、ジャム・バンドも多く出演する大型フェスの代表例となった(Phishは1996年から自前のフェスを開いている)。

批判もある。演奏が自己満足的で冗長だという批判、そして聴衆が白人に偏っているという批判がある。それでも、録音ではなく現場の体験に価値を置くという原則は、後のライブ中心の音楽産業の状況に通じるものだったと見る人もいる。</p>
<h2>代表曲</h2><ul><li>Ants Marching (Dave Matthews Band)</li><li>Jessica（Allman Brothers Band）</li><li>Dark Star（Grateful Dead）</li><li>Eyes of the World (Grateful Dead)</li><li>Shakedown Street (Grateful Dead)</li><li>You Enjoy Myself（Phish）</li><li>Franklin's Tower (Grateful Dead)</li><li>Tweezer (Phish)</li><li>Wilson (Phish)</li><li>Fire on the Mountain (Grateful Dead)</li><li>Warehouse (Dave Matthews Band)</li></ul>
