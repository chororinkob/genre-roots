<h1>Jam Band（ジャムバンド）とは</h1>
<p>録音された作品よりも、その場限りの即興演奏を目的とするロックである。楽曲はあくまで即興へ入るための足場として扱われ、歌が終わった後に始まる演奏部分が20分、時に40分に及ぶ。この即興は、和音進行を保ったまま独奏を回す型と、進行その</p>
<p>録音された作品よりも、その場限りの即興演奏を目的とするロックである。楽曲はあくまで即興へ入るための足場として扱われ、歌が終わった後に始まる演奏部分が20分、時に40分に及ぶ。この即興は、和音進行を保ったまま独奏を回す型と、進行そのものを離れて全員で未知の場所へ向かう型に大別され、後者こそがこの分野の醍醐味とされる。演奏者は互いの音を聴きながら、誰が主導するでもなく調性やテンポを変え、時に別の曲へそのまま繋がっていく。ジャンルの越境も常態で、一曲の中でブルーグラス、ジャズ、ファンク、レゲエ、現代音楽の要素が次々に現れる。編成はギター、ベース、ドラムに鍵盤楽器を加えたものが基本で、打楽器奏者が複数在籍する場合も多い。音量は過剰にならず、各楽器の音が分離して聴こえるよう配慮される。決定的なのは公演ごとに演奏曲目が全く異なるという原則で、同じ曲でも二度と同じ演奏にならない。そのため聴き手は複数の公演を追いかけ、録音を交換し、演奏内容を記録して比較する。音楽が商品としてではなく、共有される出来事として存在している点が、この分野を他と分ける最大の特徴である。</p>
<h2>成り立ち</h2><p>全ての原点は1965年にサンフランシスコで結成されたGrateful Deadである。彼らはフォークとブルーグラス、ブルースの素養を持つ演奏者の集まりだったが、幻覚剤を用いた集団的な催しの伴奏を務めるうちに、決められた曲を決められた通りに演奏するという発想を捨てた。1970年代を通じて彼らは、録音作品では中程度の成功しか収めなかったが、公演には熱狂的な追随者が生まれ、生活の全てを投げ打って全米を追いかける者たちはデッドヘッズと呼ばれた。彼らの最も重要な決断は、観客による録音を禁じるどころか、会場内に録音専用の区画を設けて公認したことである。テープの交換は無償で行われることが原則とされ、売買は共同体の掟として禁じられた。この、無料の複製が需要を殺すのではなく育てるという実例は、後年インターネット時代の議論において繰り返し引用されることになる。1995年にJerry Garciaが死去してバンドは終わるが、その方法論は既に受け継がれていた。1983年にヴァーモント州の大学で結成されたPhishは、より高度な作曲と演奏技術を持ち込み、1990年代を通じて後継者の地位を確立する。彼らは1999年の年末にフロリダの湿地帯で、日没から翌朝の日の出まで休憩なしで演奏し続けるという催しを行い、この分野の伝説となった。同時期にWidespread Panic、String Cheese Incident、moe.といった集団が現れ、Dave Matthews Bandはより歌もの寄りの形で巨大な商業的成功を収める。2002年にテネシー州で始まった大規模な野外祭典は、この文化を制度化した。批判も根強い。演奏が自己満足的で冗長だという指摘、そして聴衆が白人の中産階級に極端に偏っているという指摘である。それでも、録音ではなく現場の体験に価値を置くという原則は、現在の音楽産業がライブ中心へ移行した状況を数十年先取りしていたと評価されている。</p>
<h2>代表曲</h2><ul><li>Dark Star（Grateful Dead）</li><li>You Enjoy Myself（Phish）</li><li>Jessica（Allman Brothers Band）</li></ul>
