<h1>Contemporary R&amp;B（コンテンポラリーアールアンドビー）とは</h1>
<p>1970年代末〜80年代初頭のディスコ末期に起こり、1980年代後半に「contemporary R&amp;B」と呼ばれて定着した、ソウルの伝統を打ち込みと現代的な制作技術によって更新したリズム・アンド・ブルースである。テンポは資料によ</p>
<p>1970年代末〜80年代初頭のディスコ末期に起こり、1980年代後半に「contemporary R&amp;B」と呼ばれて定着した、ソウルの伝統を打ち込みと現代的な制作技術によって更新したリズム・アンド・ブルースである。テンポは資料により60〜100 BPM前後から120以上まで幅があり（ハーフタイムで数値が倍になることもある）、リズムは生演奏ではなく打ち込みが中心となる。ニュー・ジャック・スウィングで確立した、16分音符を均等に割らず前後に振り分ける跳ねた刻み（現代R&amp;B全般が備えるわけではない）があり、これがヒップホップの硬いドラムと組み合わされることで、機械的でありながら粘る躍動が生まれる。低音は電子的な音で、旋律的に動く。上物は電気ピアノ、シンセサイザーの持続音、そして高音域の短い装飾音が中心で、隙間を多く残す設計が好まれる。和声（コードの響き）はジャズとゴスペルに由来する複雑な積み方を用い、四和音（4つの音を重ねた和音）や九の和音といった拡張和音（基本の和音に音を足した、響きの厚い和音）が特徴である。歌唱こそがこの分野の核心である。メリスマ（一つの音節を複数の音程にわたって装飾する技法）は、現代R&amp;Bの歌手がよく用いる。さらに、自らの声を重ねて厚い和音を作る重ね録りが多用される。多重録音による声の重ね録りは、1947年12月に録音（1948年発売）されたPatti Page「Confess」が、歌手が自分の声でハーモニーを付けた最初の例とされ、1950年代初頭にLes Paul &amp; Mary Fordが広く普及させた(Fordが自分自身とハーモニーを付けた)。歌詞は恋愛の機微、欲望、別れ、そして自己肯定を扱う。ラップが挿入されることも一般化している。</p>
<h2>成り立ち</h2><p>1980年代初頭、ソウルとファンクは電子楽器への移行を進めていた。1980年代半ば以降、R&amp;Bのリズムはヒップホップの文化や音楽の要素と結びついていった。この二つを結合させた動きは、ニュー・ジャック・スウィング(new jack swing)と呼ばれ、Teddy Riley、Bernard Belle、Jimmy Jam &amp; Terry Lewisらが主導したとされる(Andre HarrellはRileyを「発明者」と呼んでいる)。1987年前後に、ヒップホップの硬いドラムに、跳ねた刻みと歌を乗せる手法が現れ、この語はVillage Voice誌のBarry Michael Cooperの記事で造語された(掲載日は1987年10月18日とする資料と、1988年10月18日とする資料があり、確定していない)。1986年にはJimmy JamとTerry Lewisがミネアポリスで、Janet Jacksonの『Control』を通じて、自立した女性の声と鋭い打ち込みを結びつけている。この作品はニュー・ジャック・スウィングに先行し、その成立に影響したとされる。1990年代前半には、Mariah Careyが5オクターブの音域とホイッスル・ボイス（極端に高い音域を用いる特殊な発声）で知られ、装飾の技法（メリスマ）を広めたと評された。後続の歌手に大きな影響を与えた。2010年前後には、メリスマ偏重への批判や、その後退も語られた。1990年代半ば、制作の面で決定的な転換が起きた。跳ねたリズムは1980年代半ばからあったが、Timbalandは「つっかえるような（stuttering）」と評される、不規則で隙間の多いリズムを持ち込んだのである。Timbalandらが制作し、TimbalandとMissy Elliottは17曲中9曲に関わったAaliyahの1996年の作品『One in a Million』は、この分野の音に大きな影響を与えたとされる。当のAaliyahは2001年、飛行機事故により22歳で死去している。2000年前後にはDestiny's Childが、複雑な声の重なりと強い自己主張によって女性群像の新しい像を提示し、そこから現れたBeyoncéのソロ作『Dangerously in Love』（2003年）は、全米で500万枚以上を売り、グラミー賞を5部門で受賞した。この分野の歴史には、直視すべき暗部もある。1990年代から2000年代にかけて最も成功した男性歌手の一人であるR. Kellyは、長年にわたり未成年への性的虐待の疑惑を指摘されながら活動を続け、2021年9月に連邦陪審が恐喝（RICO）罪とマン法違反（売春などを目的とした州をまたぐ移動を禁じる法律の違反）など全9件で有罪とし、2022年6月に禁錮30年の量刑を受けた。こうした経緯は、この分野の評価に影を落としている。2010年代以降はFrank OceanやSZAが、より内省的で構造の自由な方向を開いている。</p>
