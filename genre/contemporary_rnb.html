<h1>Contemporary R&amp;B（コンテンポラリーアールアンドビー）とは</h1>
<p>1980年代以降の、ソウルの伝統を打ち込みと現代的な制作技術によって更新したリズム・アンド・ブルースである。テンポは概ね60から110 BPMと落ち着いており、リズムは生演奏ではなく打ち込みが中心となる。この分野を特徴づけるのは、</p>
<p>1980年代以降の、ソウルの伝統を打ち込みと現代的な制作技術によって更新したリズム・アンド・ブルースである。テンポは概ね60から110 BPMと落ち着いており、リズムは生演奏ではなく打ち込みが中心となる。この分野を特徴づけるのは、16分音符を均等に割らず前後に振り分ける跳ねた刻みで、これがヒップホップの硬いドラムと組み合わされることで、機械的でありながら粘る躍動が生まれる。低音は電子的な音で、旋律的に動く。上物は電気ピアノ、シンセサイザーの持続音、そして高音域の短い装飾音が中心で、隙間を多く残す設計が好まれる。和声はジャズとゴスペルに由来する複雑な積み方を用い、四和音や九の和音、そして予期しない転調が頻繁に現れる。歌唱こそがこの分野の核心である。一つの音節を多数の音程にわたって装飾する技法が極限まで発達し、その速度と正確さが歌手の評価の基準となる。さらに、自らの声を何十層にも重ねて厚い和音を作る手法が標準となり、これは録音技術の発達によって初めて可能になったものである。歌詞は恋愛の機微、欲望、別れ、そして自己肯定を扱う。ラップが挿入されることも一般化している。</p>
<h2>成り立ち</h2><p>1980年代初頭、ソウルとファンクは電子楽器への移行を進めていたが、若い聴き手はヒップホップへ流れつつあった。この二つを結合させたのがTeddy Rileyである。1987年前後、彼はヒップホップの硬いドラムに、跳ねた刻みと歌を乗せるという手法を確立し、これは新しい躍動という名で呼ばれた。同時期、Jimmy JamとTerry Lewisはミネアポリスで、Janet Jacksonの作品を通じて、自立した女性の声と鋭い打ち込みを結びつけている。1990年代前半には、Whitney HoustonとMariah Careyが歌唱技術の水準を極限まで引き上げた。後者は極端に高い音域を用いる特殊な発声を武器とし、装飾の技法を後続の全ての歌手に義務づける結果となった。この時期、装飾が過剰であるという批判も生まれている。1990年代半ば、制作の面で決定的な転換が起きた。Timbalandが、それまでの均等な拍の感覚を捨て、不規則で隙間の多いリズムを持ち込んだのである。彼がAaliyahのために作った1996年の作品は、この分野の音を根本から変えた。当のAaliyahは2001年、飛行機事故により22歳で死去している。2000年前後にはDestiny's Childが、複雑な声の重なりと強い自己主張によって女性群像の新しい像を提示し、そこから現れたBeyoncéが以後の20年を規定した。この分野の歴史には、直視すべき暗部もある。1990年代から2000年代にかけて最も成功した男性歌手の一人であるR. Kellyは、長年にわたり未成年への性的虐待の疑惑を指摘されながら活動を続け、2021年から2022年にかけて性的人身売買などの罪で有罪判決を受けた。産業と報道が長くこれを黙認したという事実は、この分野の評価に消せない影を落としている。2010年代以降はFrank OceanやSZAが、より内省的で構造の自由な方向を開いている。</p>
