<h1>Contemporary R&amp;B（コンテンポラリーアールアンドビー）とは</h1>
<p>この音楽は、ソウルの伝統を、打ち込みと現代的な制作技術で更新したリズム・アンド・ブルースだ。1970年代末〜80年代初頭のディスコ末期に起こり、1980年代後半に「contemporary R&amp;B」と呼ばれて定着した。 リズムは、</p>
<p>この音楽は、ソウルの伝統を、打ち込みと現代的な制作技術で更新したリズム・アンド・ブルースだ。1970年代末〜80年代初頭のディスコ末期に起こり、1980年代後半に「contemporary R&amp;B」と呼ばれて定着した。

リズムは、生演奏ではなく打ち込みが中心となる。テンポは、資料により60〜100前後から120以上まで幅があり、ハーフタイムで倍の数値にもなる。16分音符を均等に割らず、前後に振り分ける跳ねた刻みは、ニュー・ジャック・スウィングで定着した特徴である。現代R&amp;B全般が備えるわけではない。これがヒップホップの硬いドラムと組み合わされると、機械的でありながら粘る躍動が生まれる。

低音は電子的な音で、旋律的に動く。上物は、電気ピアノ、シンセサイザーの持続音、高音域の短い装飾音が中心だ。隙間を多く残す設計が好まれる。

和声（コードの響き）は、ジャズとゴスペルに由来する複雑な積み方を用いる。7thや9thなどの拡張和音が特徴である。

歌唱こそが、この分野の核心である。一つの音節を多数の音程にわたって装飾する技法を、メリスマという。メリスマは、現代R&amp;Bの歌手がよく用いる技法だ。さらに、ボーカルの重ね録りは多用される。多重録音による声の重ね録りは、1947年12月録音、1948年発売のPatti Page「Confess」が先行した。1950年代初頭には、Les Paul &amp; Mary Fordが広く普及させた(Fordが自分自身とハーモニーを付けた)。現代の重ね録りは、技術の進歩で層数が増えたものである。

歌詞は、恋愛の機微、欲望、別れ、そして自己肯定を扱う。ラップが挿入されることも、一般化している。</p>
<h2>成り立ち</h2><p>1980年代初頭、ソウルとファンクは電子楽器への移行を進めていた。1980年代半ば以降、R&amp;Bのリズムは、ヒップホップ文化・音楽の要素と結びついた。

この二つを結合させた動きは、ニュー・ジャック・スウィング(new jack swing)と呼ばれる。Teddy Riley、Bernard Belle、Jimmy Jam &amp; Terry Lewisらが主導したとされる(Andre HarrellはRileyを「発明者」と呼んでいる)。1987年前後に、ヒップホップの硬いドラムに、跳ねた刻みと歌を乗せる手法が現れた。この語は、Village Voice記事(Barry Michael Cooper)で造語された。記事の日付は1988年10月18日とみられる。

これに先立つ1986年の『Control』は、ニュー・ジャック・スウィングに先行して、その成立に影響した。Jimmy JamとTerry Lewisはミネアポリスで、Janet Jacksonの作品を通じて、自立した女性の声と鋭い打ち込みを結びつけている。

1990年代前半には、Mariah Careyが現れた。彼女は、5オクターブの音域とホイッスル・ボイス（超高音域の発声）で知られ、メリスマを広めたと評された。後続の歌手に大きな影響を与えた。のちの2010年前後には、メリスマ偏重への批判や、その後退が語られた。

1990年代半ば、制作の面で決定的な転換が起きた。跳ねたリズムは、1980年代半ばからあった。Timbalandは1990年代半ば以降、「stuttering（つっかえるような）」と評されるリズムを持ち込んだのである。Timbalandらが制作し、TimbalandとMissy Elliottが17曲中9曲に関与したAaliyahの1996年の作品『One in a Million』は、この分野の音を根本から変えた。当のAaliyahは2001年、飛行機事故により22歳で死去している。

2000年前後には、Destiny's Childが、複雑な声の重なりと強い自己主張によって、女性群像の新しい像を提示した。そこから現れたBeyoncéは、2003年のソロ作『Dangerously in Love』で全米1位、グラミー5部門を獲得した。

この分野の歴史には、直視すべき暗部もある。1990年代から2000年代にかけて最も成功した男性歌手の一人であるR. Kellyは、長年にわたり未成年への性的虐待の疑惑を指摘されながら活動を続けた。2021年9月に連邦陪審が恐喝(RICO)罪とマン法違反など全9件で有罪とし、2022年6月に禁錮30年の量刑を受けた。こうした経緯は、この分野の評価に影を落としている。

2010年代以降は、Frank OceanやSZAが、より内省的で構造の自由な方向を開いている。</p>
