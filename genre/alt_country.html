<h1>Alt-Country（オルタナカントリー）とは</h1>
<p>カントリーの楽器編成と物語性を、パンクやインディーロックの姿勢で扱う音楽である。使われる楽器はペダルスティール、バンジョー、フィドル、マンドリン、生ギターといった伝統的なもので、そこにエレクトリックギターの歪みや、荒く録られたドラ</p>
<p>カントリーの楽器編成と物語性を、パンクやインディーロックの姿勢で扱う音楽である。使われる楽器はペダルスティール、バンジョー、フィドル、マンドリン、生ギターといった伝統的なもので、そこにエレクトリックギターの歪みや、荒く録られたドラムが加わる。決定的に異なるのは録音の思想で、主流のカントリーが音程と拍を機械で修正して完璧に整えるのに対し、こちらは演奏の揺れ、雑音、失敗に近い瞬間をそのまま残す。この生々しさが誠実さの証と見なされている。テンポは遅めから中庸で、三拍子のワルツや、ゆっくりとしたホンキートンクの型が多い。和声は伝統的な三和音を基本としつつ、短調や、解決しないまま宙に浮く進行を織り込んで陰りを与える。歌唱は技巧を誇示せず、掠れた声や不安定な音程を隠さない。歌詞が最も重要な要素で、扱われるのは経済的に取り残された地方の町、廃れた工場、依存症、失われた家族、そして出口のない生活である。カントリーが伝統的に用意してきた信仰や家族による救済を、あえて提示しないまま終わる作品が多い。同じ楽器を使いながら、主流のカントリーが肯定するものを疑うという立場が、この分野の一貫した性格である。</p>
<h2>成り立ち</h2><p>先駆者として必ず名が挙がるのはGram Parsonsである。1968年にThe Byrdsに加入した彼は、ロックの聴衆に本格的なカントリーを聴かせる作品を主導し、その後Flying Burrito Brothersを結成して、この二つの音楽の融合を追求した。彼は1973年に薬物により26歳で死亡し、遺体が友人によって砂漠へ持ち去られて焼かれるという異様な後日談まで残している。直接の起点は1990年である。イリノイ州ベルヴィルという寂れた工業の町で結成されたUncle Tupeloが発表したノー・ディプレッションは、大恐慌時代の古い曲名を題名に借り、カントリーの楽器とハードコア・パンクの演奏を接合した。この題名はそのままこの分野の別称となり、1995年に創刊された同名の専門誌が、散在していた作り手たちを一つの潮流として可視化した。バンドはJay FarrarとJeff Tweedyの対立によって1994年に解散し、前者はSon Volt、後者はWilcoを結成する。Wilcoはその後、カントリーの枠を大きく踏み越えて実験的な方向へ進み、2001年には完成した作品を所属会社に拒否されて契約を解除された末、同じ企業傘下の別会社が買い直して発表するという皮肉な経緯をたどり、その作品が最高の評価を得た。1994年にシカゴで設立されたBloodshot Recordsは、この分野の作品を集中的に世に出す拠点となる。1998年にLucinda Williamsが発表したカー・ホイールズ・オン・ア・グラヴェル・ロードは、6年をかけて何度も録り直された難産の作品でありながら、南部の風景と女性の視点を高い文学性で描き切り、この分野の最高峰と評されている。Gillian Welchは、現代の作り手でありながら戦前の音楽の質感を精密に再現する手法を採り、Ryan Adamsは早熟な才能で注目を集めたが、後年に複数の女性への不適切な言動が報じられて評価が揺らいだ。Drive-By Truckersは2001年に、南部ロックの歴史と人種問題を正面から扱う長編を発表している。2000年代以降、この分野はアメリカーナというより広い呼称に吸収されつつあるが、主流の商業カントリーへの批判的な立場は現在も受け継がれている。</p>
