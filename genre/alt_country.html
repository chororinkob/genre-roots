<h1>Alt-Country（オルタナカントリー）とは</h1>
<p>カントリーの楽器編成と物語性を、パンクやインディーロックの姿勢で扱う音楽である。使われる楽器はペダルスティール、バンジョー、フィドル、マンドリン、生ギターといった伝統的なもので、そこにエレクトリックギターの歪みや、荒く録られたドラ</p>
<p>カントリーの楽器編成と物語性を、パンクやインディーロックの姿勢で扱う音楽である。使われる楽器はペダルスティール、バンジョー、フィドル、マンドリン、生ギターといった伝統的なもので、そこにエレクトリックギターの歪みや、荒く録られたドラムが加わる。決定的に違うのは録音の考え方で、ナッシュヴィルの主流が洗練された制作とポップ志向を強めたのに対し、こちらはローファイな音を選び、演奏の揺れ、雑音、失敗に近い瞬間をそのまま残す。この生々しさが誠実さの証と見なされている。テンポは曲によって幅があり、『No Depression』のような速くパンク的な演奏もあれば、3拍子のワルツやホンキートンクの型もある。和音は伝統的な三つの音の和音を基本としつつ、短調や、落ち着かないまま宙に浮く和音の流れを織り込んで陰りを与えることもある。歌い方は上手さを見せつけず、掠れた声や不安定な音程を隠さない。歌詞が最も重要な要素で、扱われることが多いのは経済的に取り残された地方の町、廃れた工場、依存症、失われた家族、そして出口のない生活である。カントリーが伝統的に用意してきた信仰や家族による救済を、あえて提示しないまま終わる作品もある。同じ楽器を使いながら、主流のカントリーが肯定するものを疑うという立場が、この分野に見られる傾向である。</p>
<h2>成り立ち</h2><p>しばしば先駆けとして名前が挙がるのはGram Parsonsである。1968年にThe Byrdsに加入した彼は、ロックの聴衆に本格的なカントリーを聴かせる作品を主導し、その後Flying Burrito Brothersを結成して、この二つの音楽の融合を追求した。彼は1973年に薬物により26歳で死亡し、遺体が友人によって砂漠へ持ち去られて焼かれるという異様な後日談まで残している。しばしば最初のalt-country作品とされるのは1990年の作品である(それ以前にもJason and the ScorchersやLong Ryders、Xなど、パンクとカントリーの融合の先例がある)。イリノイ州ベルヴィルという寂れた工業の町で結成されたUncle Tupeloが発表したノー・ディプレッションは、大恐慌時代の古い曲名を題名に借り、カントリーの楽器とハードコア・パンクの演奏を接合した。この題名はこの分野を象徴する名となり、1995年に創刊された同名の専門誌が、散在していた作り手たちを一つの潮流として目に見える形にした。バンドはJay FarrarとJeff Tweedyの対立によって1994年に解散し、前者はSon Volt、後者はWilcoを結成する。Wilcoはその後、カントリーの枠を大きく踏み越えて実験的な方向へ進み、2001年6月には完成した作品を所属会社に拒否されて契約を離れ、マスターを手に同じ企業傘下のNonesuchと契約して2002年4月に発表するという皮肉な経緯をたどり、その作品が最高の評価を得た。1993〜94年(初リリースは1994年)にシカゴで設立されたBloodshot Recordsは、この分野の作品を集中的に世に出す拠点となる。1998年にLucinda Williamsが発表したカー・ホイールズ・オン・ア・グラヴェル・ロードは、前作から6年ぶりで、約3年かけて全面的に録り直された難産の作品でありながら、南部の風景と女性の視点を高い文学性で描き切り、一部の媒体でこの分野の最高峰と評されている。Gillian Welchは、現代の作り手でありながら戦前の農村音楽の要素を現代的な感覚と融合させる手法を採り、Ryan Adamsは早熟な才能で注目を集めたが、後年に複数の女性への不適切な言動が報じられて評価が揺らいだ。Drive-By Truckersは2001年に、南部ロックの歴史と人種問題を正面から扱う長編を発表している。2000年代以降、この分野はアメリカーナというより広い呼称に吸収されつつあるが、主流の商業カントリーへの批判的な立場は現在も受け継がれている。</p>
