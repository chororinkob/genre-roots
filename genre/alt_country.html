<h1>Alt-Country（オルタナカントリー）とは</h1>
<p>この音楽は、カントリーの楽器編成と物語性を、パンクやインディーロックの姿勢で扱う音楽である。 使われる楽器は、ペダルスティール、バンジョー、フィドル、マンドリン、生ギターといった伝統的なものだ。そこにエレクトリックギターの歪みや、</p>
<p>この音楽は、カントリーの楽器編成と物語性を、パンクやインディーロックの姿勢で扱う音楽である。

使われる楽器は、ペダルスティール、バンジョー、フィドル、マンドリン、生ギターといった伝統的なものだ。そこにエレクトリックギターの歪みや、荒く録られたドラムが加わる。

違いとして挙げられるのは、録音の考え方である。ナッシュヴィルの主流は、洗練された制作とポップ志向を強めた。これに対し、こちらはローファイな音を選ぶ。演奏の揺れ、雑音、失敗に近い瞬間をそのまま残す。この生々しさが、誠実さの証と見なされることが多い。

和音は、伝統的な三つの音の和音が基本だ。そこに、短調や、落ち着かないまま宙に浮く和音の流れを織り込み、陰りを与えることもある。

テンポは曲によって幅がある。アルバム『No Depression』に多い、速くパンク的な演奏もあれば、3拍子のワルツやホンキートンクの型もある。

歌い方は、上手さを見せつけない。掠れた声や不安定な音程を隠さない。

歌詞が最も重要な要素である。多く扱われるのは、経済的に取り残された地方の町、廃れた工場、依存症、失われた家族、そして出口のない生活だ。カントリーが伝統的に用意してきた、信仰や家族による救済を、あえて示さないまま終わる作品もある。同じ楽器を使いながら、主流のカントリーが肯定するものを疑う。この立場が、この分野に見られる傾向である。</p>
<h2>成り立ち</h2><p>先駆けとして名前がよく挙がるのは、Gram Parsonsである。1968年にThe Byrdsに加入した彼は、ロックの聴衆に本格的なカントリーを聴かせる作品を主導した。その後、Flying Burrito Brothersを結成し、この二つの音楽の融合を追求した。彼は1973年に、薬物とアルコールの過剰摂取で26歳で死亡した。遺体が友人によって砂漠へ持ち去られて焼かれるという、異様な後日談まで残している。

最初のalt-country作品とされるのは、1990年の作品である。しばしばそう言われる。それ以前にも、Jason and the ScorchersやLong Ryders、Xなど、パンクとカントリーの融合の先例がある。この作品を出したのは、Uncle Tupeloである。イリノイ州ベルヴィルという、セントルイス近郊の、製造業・炭鉱の歴史を持つ町で結成された。発表したノー・ディプレッションは、大恐慌時代の古い曲名を題名に借りた。カントリーの楽器とハードコア・パンクの演奏を接合した作品だった。この題名は、この分野のトレードマークとなる。1995年に創刊された同名の専門誌が、散在していた作り手たちを、一つの流れとして目に見える形にした。

しかし、バンドはJay FarrarとJeff Tweedyの対立によって、1994年に解散する。前者はSon Volt、後者はWilcoを結成した。Wilcoはその後、カントリーの枠を大きく踏み越え、実験的な方向へ進む。2001年6月にReprise側が『Yankee Hotel Foxtrot』を拒否した。その後、交渉の末に8月に契約解消で合意した。マスターを手に、同じ企業傘下のNonesuchと契約し、2002年4月に発表する。皮肉な経緯をたどったその作品は、年間ベストに選ばれるなど極めて高い評価を得た。

一方、1993〜94年(初リリースは1994年)にシカゴで設立されたBloodshot Recordsは、この分野の作品を集中的に世に出す拠点となる。

1998年には、Lucinda Williamsが、カー・ホイールズ・オン・ア・グラヴェル・ロードを発表した。前作から6年ぶりで、制作は約3年に及んだ。最初のセッションは破棄され、Steve Earleらのもとで録り直された。そうした作品でありながら、南部の風景と女性の視点を、高い文学性で描き切った。一部の媒体では、この分野の最高峰と評されている。

Gillian Welchは、現代の作り手でありながら、戦前の農村音楽の要素を現代的な感覚と融合させる手法を採った。Ryan Adamsは、早熟な才能で注目を集めた。ただ、後年に複数の女性への不適切な言動が報じられ、評価が揺らいだ。Drive-By Truckersは2001年に、人種問題などを、Lynyrd Skynyrdを軸にした物語で扱う長編を発表している。

2000年代以降、この分野はアメリカーナというより広い呼称に吸収されつつある。それでも、主流の商業カントリーへの批判的な立場は、現在も受け継がれている。</p>
