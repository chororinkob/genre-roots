<h1>Power Noise（パワーノイズ）とは</h1>
<p>工業的な騒音を素材にしながら、それを規則正しい拍の上に配置した様式である。リズミック・ノイズとも呼ばれる。通常の音楽が用いる旋律と和音をほぼ排除し、代わりに歪んだ打撃音、金属の衝突音、機械の駆動音、そして白色雑音を音の素材として扱</p>
<p>工業的な騒音を素材にしながら、それを規則正しい拍の上に配置した様式である。リズミック・ノイズとも呼ばれる。通常の音楽が用いる旋律と和音をほぼ排除し、代わりに歪んだ打撃音、金属の衝突音、機械の駆動音、そして白色雑音を音の素材として扱う。決定的なのは、それらを無秩序に垂れ流すのではなく、四つ打ちを含む明確な拍節の上に厳密に配置する点である。この、雑音でありながら踊れるという矛盾した性質が様式の核心をなす。テンポは一分間に120から160拍程度で、バスドラムは極度に圧縮され、音の壁として空間を埋める。制作の手法としては、録音した金属音や電子音を短く切り刻み、それを反復させて打楽器の代わりに使う。同じ素材にフィルターと歪みを重ねがけして音色を変え、それを層として積む。この積み方が細かく設計されているため、一見すると単なる騒音の塊に聞こえるものが、実際には精密に組み立てられている。歌はほとんど用いられず、稀に加工された叫びや無線通信を模した声が挿入される。演奏では映像が併用されることが多く、工場、機械、廃墟、医療機器といった図像が用いられる。</p>
<h2>成り立ち</h2><p>源流は1970年代後半の英国のインダストリアル音楽である。スロッビング・グリッスルが工場の騒音や録音した会話を音楽として提示したことで、雑音を素材として扱う枠組みが成立した。1980年代にはドイツのアインシュテュルツェンデ・ノイバウテンが電動工具と鉄板を楽器として使い、この方向を推し進めた。一方でエレクトロニック・ボディ・ミュージックの流れがあり、ベルギーのフロント二四二らが硬質な電子音を明確な拍の上に置く形を確立していた。この二つの流れが交わった地点に位置するのが、この様式である。決定的な役割を果たしたのはドイツの制作者たちだった。1993年、シュテファン・アルトがバイエルン州でアント=ザンを設立し、同じ年にウド・ヴィースマンがハンズ・プロダクションを立ち上げる。この二つのレーベルが、以後この領域のほぼすべての主要作品を送り出すことになる。アント=ザンは造形的な装丁と一貫した美意識で知られ、ハンズはより実験的で硬質な作品を扱った。中心となった演者には、ドイツのウィンターケルテ、シナプスケイプ、ノイセックス、そしてアメリカのコンヴァーターやイミネント・スターヴェイションがいる。彼らは雑音を無秩序に垂れ流すのではなく、拍の上に厳密に構成するという方法論を共有していた。発表の場として重要だったのが、1998年にドイツのクレーフェルトで始まった音楽祭マシーネンフェストである。この催しは2019年まで毎年開かれ、欧州各地からこの種の音楽の演者と聴き手が集まる中心地として機能した。同種の催しにフォームズ・オブ・ハンズがあり、いずれも数百人規模の小さな集まりで、演者と聴き手の距離が近いことが特徴だった。この音楽は商業的な拡大をほとんど志向せず、ゴシックやEBMの聴衆と場を共有しながら独自の圏域を保った。2000年代に入ると、ここで培われた歪んだ打撃音の作り方が、より広い電子音楽の領域へ流出していく。とりわけ極度に圧縮された打撃音を音の壁として使う手法は、後のダブステップや各種のハードダンスの音作りに間接的な影響を与えた。マシーネンフェストの終了後も、欧州を中心に少数ながら継続的に作品が発表され続けている。</p>
