<h1>Power Noise（パワーノイズ）とは</h1>
<p>パワー・ノイズは、工場のような騒音を素材にしながら、それを規則正しい拍の上に並べた音楽だ。リズミック・ノイズとも呼ばれる。 旋律や和声は脇役で、主役はリズムである。音の素材には、歪んだ打撃音、金属の衝突音、機械の駆動音を使う。 決</p>
<p>パワー・ノイズは、工場のような騒音を素材にしながら、それを規則正しい拍の上に並べた音楽だ。リズミック・ノイズとも呼ばれる。

旋律や和声は脇役で、主役はリズムである。音の素材には、歪んだ打撃音、金属の衝突音、機械の駆動音を使う。

決め手は、それらを好き勝手に垂れ流さない点にある。四つ打ちを含むはっきりした拍の上に、きっちりと並べていく。雑音なのに踊れる。この矛盾した性質こそが、このスタイルの中心だ。

テンポはおおむね120から160 BPM程度だ。歪んだキックドラムを軸にし、バスドラムは音量の差をつぶすほど強く圧縮される。その音が壁のように空間を埋める。

素材にフィルターと歪みを重ねがけして音色を変え、それを層として積む。この積み方が細かく設計されている。そのため、一見ただの騒音の塊に聞こえても、実際には精密に組み立てられている。

歌はほとんど使われない。まれに、加工された叫びが差し込まれる。一部の演者は、演奏で映像を一緒に使い、工場、機械、廃墟、医療機器といったイメージを映し出す。</p>
<h2>成り立ち</h2><p>源流の一つは、1970年代の英国のインダストリアル音楽だ。スロッビング・グリッスルがテープ素材や加工音を用いたことで、雑音を素材として扱う枠組みができあがった。

1980年代には、ドイツのアインシュテュルツェンデ・ノイバウテンが、電動工具や鉄板を楽器として使い、この方向をさらに押し進めた。

一方で、エレクトロニック・ボディ・ミュージックの流れもあった。ベルギーのフロント242らが、硬い電子音をはっきりした拍の上に置く形を固めていた。

この二つの流れに、ポストインダストリアルやノイズ、ジャパノイズ、ハードコア・テクノやガバなど、さまざまな源流が合わさった。そして1990年代半ばのドイツ・ベルギー・英国で、このスタイルが生まれたと整理されることが多い。先駆けとしては、1980年から活動するスペインのEsplendor Geométricoや、ベルギーのDiveなどが挙げられる。

担い手はドイツ勢が中心で、ベルギー勢も発展に力を貸した。1993年、シュテファン・アルトがバイエルン州でアント=ザンを設立した。それより前の1990年には、ウド・ヴィースマンがハンズ・プロダクションを立ち上げていた。この二つは、1990年代のドイツで中心的なレーベルの一つとなる。アント=ザンは、凝った造形の装丁と一貫した美意識で知られた。ハンズはリズミック・ノイズを核に、IDMやブレイクコア、アンビエントなど幅広く扱った。

中心となった演者には、ドイツのウィンターケルテ、シナプスケイプ、ノイセックス、アメリカのコンヴァーター、ベルギーのイミネント・スターヴェイションがいる。彼らは、雑音を好き勝手に垂れ流すのではなく、拍の上にきっちり組み立てるというやり方を共有していた。

発表の場として大事だったのが、1999年にドイツのアーヘンで始まったマシーネンフェストという催しである(のち複数の会場を経て、最終的にオーバーハウゼンで開かれた)。この催しは2018年まで毎年開かれ、欧州各地からこの種の音楽の演者と聴き手が集まる中心地になった。同じような催しにフォームズ・オブ・ハンズがある。いずれも比較的小規模な集まりで、演者と聴き手の距離が近いのが特徴だった。

この音楽は、比べてみれば小さな市場にとどまった。それでも、ゴシックやEBMの聴衆と場を分け合いながら、独自の世界を保った。

一方、1990年代にはインダストリアル・テクノが生まれた。2010年代にそれが再び盛り上がった時期には、パワー・ノイズ側との接点があるとされる(Ancient Methods が PAL の曲をサンプリングし、ハンズからも作品を出したなど)。マシーネンフェストが終わったあとも、欧州を中心に、少ないながら作品が発表され続けている。</p>
