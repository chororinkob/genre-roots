<h1>Space Disco（スペースディスコ）とは</h1>
<p>1970年代後半に、宇宙やSFの題材をディスコに持ち込んだ一群である。音の面での特徴は、シンセサイザーと自動演奏装置の多用である(生のオーケストラと併用する作品も多い)。それまでのディスコは大人数の生演奏によって作られていたが、こ</p>
<p>1970年代後半に、宇宙やSFの題材をディスコに持ち込んだ一群である。音の面での特徴は、シンセサイザーと自動演奏装置の多用である(生のオーケストラと併用する作品も多い)。それまでのディスコは大人数の生演奏によって作られていたが、この様式では低音の音型を機械が正確に反復し、その上に電子的な音色が重ねられることが多い。この、人間らしい揺らぎを取り除いた均一なくり返しこそが、宇宙らしい冷たさの表現として選ばれた。テンポは概ね120から130 BPMで、キックは四つ打ちを保つ。上に重ねる音には、宇宙船の飛行音や警報を模した効果音、金属的なシンセの旋律、そして弦楽合奏を模した壮大な伸びる音が置かれる。声も加工され、機械を通したような音色や、遠くから届くような残響を伴う。長尺の12インチ版やアルバム版が作られることがあり、途中に楽器だけの展開部が設けられる。歌詞は宇宙旅行、地球外生命、未来都市、そして人間と機械の恋愛といった主題を扱い、映画的な物語性を持つ。演者の見た目の表現も一体で作り込まれ、銀色の衣装、覆面や兜、全身を金属色に塗るといった演出が用いられた。音楽と衣装と物語が分かちがたく結びついている点が、この様式の性格を最もよく表している。</p>
<h2>成り立ち</h2><p>1970年代半ばのヨーロッパで始まったこの様式は、1977年に二つの出来事が重なって隆盛した。ひとつは映画における宇宙を主題とする大作のかつてない成功であり、これによって宇宙の意匠が世界的な流行となる。もうひとつが、ドイツのミュンヘンで起きた音楽的な事件である。イタリア出身の制作者Giorgio Moroderが、Pete Bellotteとともに、Donna Summerの歌のための伴奏のほぼ全てを合成音で作り上げた(キックドラムだけは生ドラム)。曲名は「I Feel Love」(1977年7月発売)である。自動演奏装置が刻む低音の反復は、人間には不可能な正確さを持ち、シンセの反復ループと四つ打ちを組み合わせた点が画期的だった。Bowieによれば、この楽曲を聴いたBrian Enoは「今後15年のクラブ音楽を変える」と述べたという。この一曲は電子ダンス音楽の主要な起点の一つとなった。ただし「I Feel Love」は電子ディスコの画期であり、空間ディスコの代表例としてはMecoやSpace、Dee D. Jacksonなどが挙げられる。フランスでも並行して動きがあった。Cerroneは1977年、「Supernature」で、化学物質で変異した生物が人類に復讐するという、SF的な環境警告の物語を、生のオーケストラとシンセサイザーを融合させて提示した。同じくフランスのSpaceは、覆面をかぶった演者による神秘的な演出で、器楽の楽曲を国際的なヒットにしている。Rocketsは全身を銀色に塗り、頭を剃り上げるという徹底した見た目の演出で知られた。1978年にはイギリスでSarah Brightmanが宇宙兵士への恋を歌い、アメリカでは映画音楽をディスコに編曲した楽曲が全米一位を獲得している。この流行は短く、1980年前後には下火になったとされる。原因は複合的で、断定できない。しかしその影響は甚大だった。機械が刻む反復による舞踏音楽という発想は、そのままイタリアのイタロ・ディスコ、シカゴのハウス、デトロイトのテクノへ受け継がれる。さらに1990年代のフレンチ・ハウス、とりわけ覆面をかぶった2人組のDaft Punkは、Spaceを参照例の一つに挙げており、視覚面でよく似ている。</p>
<h2>代表曲</h2><ul><li>Chase (Giorgio Moroder)</li><li>Supernature (Cerrone)</li><li>Magic Fly (Space)</li><li>Love in C Minor (Cerrone)</li><li>Megatron Man (Patrick Cowley)</li><li>From Here to Eternity (Giorgio Moroder)</li><li>Space Invaders (Player One)</li><li>A Place Called Space (The Juan Maclean)</li><li>Star Wars Theme / Cantina Band (Meco)</li><li>Dance Boy Dance (Alexander Robotnick)</li><li>Disco Lunar Module (Alden Tyrell)</li></ul>
