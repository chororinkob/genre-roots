<h1>Space Disco（スペースディスコ）とは</h1>
<p>スペース・ディスコは、宇宙やSFの題材をディスコに持ち込んだ音楽の一群だ。始まりは1970年代半ばで、SFの主題が目立つようになったのは1970年代後半である。 音の面での特徴は、シンセサイザーと自動演奏装置を多く使うことだ(生の</p>
<p>スペース・ディスコは、宇宙やSFの題材をディスコに持ち込んだ音楽の一群だ。始まりは1970年代半ばで、SFの主題が目立つようになったのは1970年代後半である。

音の面での特徴は、シンセサイザーと自動演奏装置を多く使うことだ(生のオーケストラと併用する作品も多い)。それまでのディスコには、オーケストラを多用する作品が多かった。これに対してこのスタイルでは、低音の音型を機械が正確にくり返し、その上に電子的な音色を重ねることが多い。人間らしい揺らぎを取り除いた、この均一なくり返しは、宇宙らしい冷たさの表現と評される。

テンポは概ね120台前半から130前後のBPMで、キックは四つ打ちを保つ。

上に重ねる音には、宇宙船の飛行音や警報をまねた効果音、金属的なシンセの旋律、弦楽合奏をまねた壮大に伸びる音が置かれる。

声も加工される。機械を通したような音色や、遠くから届くような残響が付く。

歌詞は、宇宙旅行、地球外生命、未来都市、そして人間と機械の恋愛といった主題を扱い、映画のような物語性を持つ。

曲の形では、長尺の12インチ版やアルバム版が作られることがあり、途中に楽器だけの展開部が設けられる。

演者の見た目も、音楽と一体で作り込まれた。銀色の衣装、覆面や兜、顔や肌を金属色に塗るといった演出が使われた。音楽と衣装と物語が切り離せないほど結びついている点が、このスタイルの性格を最もよく表している。</p>
<h2>成り立ち</h2><p>このスタイルは、1970年代半ばのヨーロッパで始まった。盛んになった理由には、諸説ある。映画の影響が指摘される一方、SpaceやRocketsのように、映画の公開前から動きがあった。

映画の世界では、宇宙を主題とする大作がかつてない成功を収めた。これによって、宇宙のイメージが世界的な流行となる。

一方、ドイツのミュンヘンでは、音楽の世界で大きな出来事が起きていた。イタリア出身の制作者Giorgio Moroderが、Pete Bellotteとともに、Donna Summerの歌の伴奏を、ほぼ全て合成音で作り上げたのだ。キックドラムだけは生ドラムだったとされるが、Moogで模擬したとする説もある。曲名は「I Feel Love」である。1977年7月、最初は「Can't We Just Sit Down (And Talk It Over)」のB面として発売され、約2か月後にA面とB面を入れ替えて再発売された。自動演奏装置が刻む低音のくり返しと、シンセの反復ループ、そして四つ打ちを組み合わせた点が画期的だった。Bowieの回想では、この曲を聴いたBrian Enoは「このシングルは今後15年のクラブ音楽の音を変える」と述べたという。この一曲は、電子ダンス音楽の主な出発点の一つとなった。

ただし「I Feel Love」は、電子ディスコの画期となった曲だが、宇宙ディスコの直接の例とする見方は少ない。Moroderの電子的な手法が、全体の下地になったとする見方がある。宇宙ディスコの代表例としては、MecoやSpace、Dee D. Jacksonなどが挙げられる。

フランスでも、並行して動きがあった。Cerroneは1977年、「Supernature」を発表した。化学物質で変異した生物が人類に復讐するという、SF的な環境警告の物語を、交響的なオーケストレーションとシンセサイザーを融合させて描いた。同じフランスのSpaceは、宇宙飛行士風の宇宙服とヘルメットで素性を隠した演者による神秘的な演出で、楽器だけの曲を国際的なヒットにしている。Rocketsは、顔や肌を銀色に塗り、頭を剃り上げ、ラメの衣装を着るという徹底した見た目の演出で知られた。

1977年には、アメリカで映画音楽をディスコに編曲した曲が全米一位を獲得した。1978年には、イギリスでSarah BrightmanがHot Gossip名義の「I Lost My Heart to a Starship Trooper」で宇宙兵士への恋を歌っている。

その後、米国ではディスコ全体が1979年以降に衰えたが、欧州では1980年代半ばまで続いた。原因は複合的で、断定できない。

Moroderらの電子ディスコは、宇宙ディスコも含めて、イタリアのイタロ・ディスコや、シカゴのハウスの下地の一つになった。さらに1990年代のフレンチ・ハウス、とりわけ1999年からロボットのヘルメットと衣装で素性を隠した2人組のDaft Punkは、Spaceを参照例の一つに挙げており、見た目の面でもよく似ていると評される。</p>
<h2>代表曲</h2><ul><li>Chase (Giorgio Moroder)</li><li>Supernature (Cerrone)</li><li>Magic Fly (Space)</li><li>Love in C Minor (Cerrone)</li><li>Megatron Man (Patrick Cowley)</li><li>From Here to Eternity (Giorgio Moroder)</li><li>Space Invaders (Player One)</li><li>A Place Called Space (The Juan Maclean)</li><li>Star Wars Theme / Cantina Band (Meco)</li><li>Dance Boy Dance (Alexander Robotnick)</li><li>Disco Lunar Module (Alden Tyrell)</li></ul>
