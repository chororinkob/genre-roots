<h1>Space Disco（スペースディスコ）とは</h1>
<p>1970年代後半に、宇宙とSFの主題をディスコに持ち込んだ一群である。音の面で決定的なのは、シンセサイザーと自動演奏装置の全面的な採用である。それまでのディスコは大人数の生演奏によって作られていたが、この様式では低音の音型を機械が</p>
<p>1970年代後半に、宇宙とSFの主題をディスコに持ち込んだ一群である。音の面で決定的なのは、シンセサイザーと自動演奏装置の全面的な採用である。それまでのディスコは大人数の生演奏によって作られていたが、この様式では低音の音型を機械が正確に反復し、その上に電子的な音色が重ねられる。この、人間の揺らぎを排した均質な反復こそが、宇宙的な無機質さの表現として選ばれた。テンポは概ね120から130 BPMで、キックは四つ打ちを保つ。上物には、宇宙船の飛行音や警報を模した効果音、金属的なシンセの旋律、そして弦楽合奏を模した壮大な持続音が置かれる。声も加工され、機械を通したような音色や、遠くから届くような残響を伴う。曲の構造は長く、8分から12分に及ぶものも多く、途中に器楽だけの展開部が設けられる。歌詞は宇宙旅行、地球外生命、未来都市、そして人間と機械の恋愛といった主題を扱い、映画的な物語性を持つ。演者の視覚表現も一体で設計され、銀色の衣装、覆面や兜、全身を金属色に塗るといった演出が用いられた。音楽と衣装と物語が分かちがたく結びついている点が、この様式の性格を最もよく表している。</p>
<h2>成り立ち</h2><p>1977年という年に、二つの出来事が重なった。ひとつは映画における宇宙を主題とする大作の空前の成功であり、これによって宇宙の意匠が世界的な流行となる。もうひとつが、ドイツのミュンヘンで起きた音楽的な事件である。イタリア出身の制作者Giorgio Moroderが、Pete Bellotteとともに、Donna Summerの歌のための伴奏を全て合成音で作り上げた。自動演奏装置が刻む低音の反復は、人間には不可能な正確さを持ち、当時としては未聞の音だった。この楽曲を聴いたBrian Enoが、これから15年間のクラブ音楽はこれで決まったと語ったという逸話が伝えられている。実際、この一曲がその後の電子ダンス音楽の全ての出発点となった。フランスでも並行して動きがあった。Cerroneは1977年、超自然を主題とする作品で、環境破壊への警告を含む物語を大編成の演奏で提示した。同じくフランスのSpaceは、覆面をかぶった演者による神秘的な演出で、器楽の楽曲を国際的なヒットにしている。Rocketsは全身を銀色に塗り、頭を剃り上げるという徹底した視覚表現で知られた。イギリスではSarah Brightmanが宇宙兵士への恋を歌い、アメリカでは映画音楽をディスコに編曲した楽曲が全米一位を獲得している。この流行は極めて短く、1980年前後には終息した。ディスコ全体への反発と、宇宙の意匠が急速に陳腐化したことが原因である。しかしその影響は甚大だった。機械が刻む反復による舞踏音楽という発想は、そのままイタリアのイタロ・ディスコ、シカゴのハウス、デトロイトのテクノへ受け継がれる。さらに1990年代のフレンチ・ハウス、とりわけ覆面をかぶった二人組による活動は、この時代の視覚と音の双方を明確に参照したものだった。</p>
<h2>代表曲</h2><ul><li>Magic Fly (Space)</li><li>Star Wars Theme / Cantina Band (Meco)</li><li>Supernature (Cerrone)</li><li>Chase (Giorgio Moroder)</li></ul>
