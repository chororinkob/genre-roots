<h1>Shonan Sound（ショウナンサウンド）とは</h1>
<p>海と夏を題材にした日本のポップスだ。代表曲22曲を動画で聴け、ルーツと影響のつながりを地図でたどれる。</p>
<p>海と夏を題材にした日本のポップスだ。波の音を思わせる明るいエレキギターと、よく通る男性ボーカルが前に出る。中心になる楽器はエレキギター、ベース、ドラムス、キーボードだ。曲によってはアコースティックギターやウクレレ、ハワイアン風のスチールギターが加わる。ストリングスやブラスを重ねた録音も多い。加山雄三の録音では、モズライトのエレキギターがトレモロ奏法で揺れる。サーフ・ロックのアーミングが、そのまま日本の海の音になった。

和音は長調が基本だ。明るいメジャーセブンスに、少しだけ切ないマイナーコードを混ぜる。歌謡曲の流れをくむ、耳に残る節回しも特徴だ。メロディは跳躍が少なく、歌いやすい音域にまとまる。サビでは音が上がって、一気に開放感を出す。

リズムは4分の4拍子が中心で、テンポは100〜130 BPMあたり。8ビートの上でハイハットを細かく刻む。ベースはルートを中心に、軽く跳ねる。サビの前で一度ドラムが抜けて、また戻ってくる形も定番だ。

歌い方は、力みの少ない素直な声だ。加山雄三のように語りかけるように歌う例と、桑田佳祐のようにシャウトを混ぜて崩す例がある。TUBEの前田亘輝のように、高音をまっすぐ伸ばす歌い方も定番だ。コーラスを重ねて、海辺の広がりを出す。

歌詞には海、砂浜、波、ヨット、夕日が並ぶ。固有名詞が多いのも特徴だ。茅ヶ崎、江の島、鎌倉、葉山、鵠沼といった地名が曲の住所になる。恋の歌でも、舞台は必ず海の近くに置かれる。

曲は静かな導入からサビで開ける形が多い。間奏でギターソロを置き、最後はコーラスで畳みかける。シティポップやAORと重なるが、あちらが都会の夜を描くのに対し、こちらは昼の海と砂を描く。サーフ・ロックと違って、波の音そのものより歌を主役に据える。</p>
<h2>成り立ち</h2><p>1956年、石原裕次郎が主演した映画『狂った果実』が公開された。舞台は逗子と鎌倉で、裕次郎がウクレレを弾き語る場面がある。大滝詠一は、この映画とその曲を「湘南サウンドの原点」と呼んだ。海辺の若者の暮らしを歌にする土台は、この時すでにできていた。

1960年、加山雄三は東宝と専属契約を結ぶ。1961年には映画『大学の若大将』で若大将シリーズが始まり、同じ年に「大学の若大将／夜の太陽」で歌手デビューした。加山は横浜で生まれ、茅ヶ崎で育った。1965年7月から8月にかけて、来日したザ・ベンチャーズとテレビ番組で共演する。彼らが使ったモズライトのギターは、日本公演のあとに加山の手へ渡った。このギターは映画『エレキの若大将』で使われている。1966年3月には、来日中だったベンチャーズから直接ギターの指導を受けた。1965年12月に発売した「君といつまでも」は350万枚を売り、加山の名を全国に広げた。茅ヶ崎の上原謙通りは、しだいに加山雄三通りと呼ばれるようになる。

同じ茅ヶ崎で、加瀬邦彦が動いていた。加瀬はキャノンボール、ザ・スパイダース、寺内タケシとブルージーンズを経て、1966年11月にザ・ワイルドワンズを結成する。メンバーは加瀬邦彦、植田芳暁、鳥塚しげき、島英二の4人だ。グループ名は加山雄三が星占いで付けた。デビュー曲「想い出の渚」は東芝音楽工業から出て、ヒットした。加瀬は茅ヶ崎在住の高校時代から加山と親しかった。1962年に結成されたザ・ランチャーズには、加山自身も一時期在籍している。彼らは1967年11月に「真冬の帰り道」でデビューした。

映画とテレビが、海辺のイメージを全国へ配った。1966年、加山は全編英語詞のアルバム『恋は紅いバラ ～Exciting Sound Of Yuzo Kayama And The Launchers』を出している。従兄弟の喜多嶋兄弟らと作ったこの作品で、加山は自分のルーツであるアメリカン・ポップスを正面から鳴らした。

1970年代に入ると、海辺の音楽はフォークと交わる。茅ヶ崎育ちの岩沢幸矢と岩沢二弓の兄弟は、1969年にブレッド&amp;バターとしてデビューする。1975年12月の「セーリング・オン・ボード」、1979年7月の「あの頃のまま」、1981年7月の「ホテル・パシフィック」と、海辺の暮らしを描く曲を続けて出した。「ホテル・パシフィック」の作詞は呉田軽穂、つまり松任谷由実の別名義だ。同じ時期、茅ヶ崎出身の尾崎紀世彦は1971年に「また逢う日まで」で日本レコード大賞を取っている。

「湘南サウンド」という言葉が広く使われるようになったのは、1970年代の後半から1980年代の前半だ。きっかけのひとつがサザンオールスターズである。1976年、茅ヶ崎で生まれ育った桑田佳祐がバンドを結成する。1978年のデビュー曲「勝手にシンドバッド」は「砂まじりの茅ヶ崎」で始まった。バンドのメンバーで湘南出身なのは桑田だけだったが、歌詞は茅ヶ崎の地名を全国に配った。1982年の「チャコの海岸物語」、1985年の「鎌倉物語」、1990年の「希望の轍」と、海辺の曲は続く。2000年の「HOTEL PACIFIC」は茅ヶ崎での野外ライブのために作られた。

一方、1985年6月にデビューしたTUBEは、この呼び名を最も分かりやすく体現した。デビュー曲は「ベストセラー・サマー」だ。1990年の「あー夏休み」が当たり、1991年のアルバム『湘南』には「湘南My Love」「はよつけ鎌倉」「茅ヶ崎Pipeline」「葉山でDance! All Night」が入った。ただしメンバーの出身地は厚木市、座間市、町田市で、湘南ではない。前田亘輝は厚木市の出身だ。湘南という地名が、土地ではなく夏のイメージの商品名として使われた例である。

この時期、呼び名そのものへの疑問も出た。湘南の範囲は曖昧で、湘南サウンドに入れられるミュージシャンの出身地もばらばらだった。茅ヶ崎在住の音楽評論家・宮治淳一は、湘南サウンドを地域性、時代性、音楽性が絡み合ったもので、今も明確な定義が難しいと話している。1990年代から2000年代には、海を題材にした曲はJ-POPの夏の定番として定着した。2001年、桑田佳祐のソロ「波乗りジョニー」は110万枚を売っている。

2010年、加山雄三は茅ヶ崎市民栄誉賞を受けた。2020年にはデビュー60周年のモニュメントが茅ヶ崎に置かれた。2013年に結成されたSuchmosは「湘南発」と紹介され、ボーカルのYONCEは茅ヶ崎の出身で在住もしている。2015年のアルバム『THE BAY』には、茅ヶ崎が歌詞に出る「GAGA」が入った。しかしメンバーの多くは横浜市の出身で、湘南サウンドの後継と言い切るには無理がある。近年は「湘南サウンド」という言葉を聞く機会が減った。名前に湘南が付く湘南乃風も、このジャンルには数えられない。それでも海と夏を歌う曲は、毎年夏になると新しい形で作られ続けている。</p>
