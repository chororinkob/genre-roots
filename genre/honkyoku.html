<h1>Honkyoku（ホンキョク）とは</h1>
<p>一言でいうと、尺八一本だけの独奏で吹き上げる禅の音楽だ。代表曲22曲を動画で聴け、ルーツと影響のつながりを地図でたどれる。</p>
<p>一言でいうと、尺八一本だけの独奏で吹き上げる禅の音楽だ。虚無僧と呼ばれる僧たちが修行として吹いた曲群の呼び名で、無伴奏の縦笛だけで一曲が組み上がる。

音を出すのは、竹の一節を通し、手前4つ・奥1つの計5つの指孔を開けた縦笛・尺八だ。歌口と呼ばれる斜めに切った縁に息を直接当てて鳴らすため、息の音そのものが音色に混ざり、風のうなりに似た質感をもつ。奏法の中心は、あごの動きで笛の角度を変え、音程を下げる「メリ」と上げる「カリ」。この二つの動きで、一音の内側を滑らかに揺らす。荒い息を音頭に混ぜる「ムラ息」を使うと、音が咆哮のように爆ぜる。

旋律は日本独自の五音音階「陰旋法」を土台にする。和音はなく、旋律線が一本だけ伸びる。音程は半音単位で微妙に揺らされ、楽譜に書き写せない細かい陰影が多い。

リズムに拍子はない。固定した小節もテンポもなく、句と句のあいだに意図的な沈黙を挟む。音が消えたあとの静けさまでが音楽の一部になる。

歌と歌詞はない。すべてが無伴奏の器楽だ。曲の構成に定型はなく、異なる旋律の断片を一列に並べ、反復ではなく呼吸の長さで展開する。一曲は数分から、長いもので10分を超える。寺の坐禅堂や座敷といった修行の場で吹かれ、いまはコンサートホールや個人の稽古場でも吹かれている。</p>
<h2>成り立ち</h2><p>江戸時代（1600～1868年）の日本で、本曲は虚無僧という僧たちのあいだで形を整えた。虚無僧は深編笠の一種・天蓋を頭にかぶり、尺八を吹きながら諸国を旅して施しを請うた。出自は武士階級、とくに主を失った浪人が多かった。禅宗の一派・普化宗の寺に属し、読経の代わりに尺八を吹く「吹禅」を修行とした。全国に40前後の虚無僧寺があり、寺ごとに独自の曲を育てていた。

起源の物語は古い。唐の禅者・普化に始まる系譜を記した『虚鐸伝記』（1795年）などが伝えている。ただしこの系譜は後世に創作されたと見られている。一方、曲そのものはすでに古く、1664年の文献『絃竹初心集』に曲名が記されていた。琴古流の最古の曲は700年ほど前に作られたとも言われる。

決定的だったのが黒沢琴古（1710～1771年）だ。江戸の虚無僧寺・一月寺に関わったこの人物は、各地の虚無僧寺を巡って伝承曲を採集し、30余曲を整理・作曲して琴古流本曲の基礎を築いた。「虚空」「虚霊」「鹿の遠音」など、今日の主要曲の多くがここで整えられた。

しかし1871年、明治政府は普化宗を廃止する。仏教弾圧（廃仏毀釈）の波のなかで虚無僧は制度ごと消え、尺八の演奏も約4年間禁じられた。禁令が解けると、演奏家たちは俗楽の教師として尺八を続ける道を選んだ。1896年には中尾都山が都山流を興し、尺八は箏・三味線との合奏の世界へ広がっていった。

他方、京都の明暗寺を中心に、本曲そのものを受け継ぐ流れも続いた。20世紀には海童道祖が虚無僧の吹き方を独自に研ぎ直し、弟子の横山勝也が本曲を世界に紹介した。山口五郎や宮田まゆみらの録音も名演として残る。明治の動乱で多くの曲が失われたと言われるなかで、現存する本曲は世界最大級の独奏笛音楽のレパートリーとされる。現在も琴古流や明暗系の各流派、海外の愛好家たちによって吹き継がれている。</p>
