<h1>Honkyoku（ホンキョク）とは</h1>
<p>尺八を吹き上げる禅の音楽だ。代表曲22曲を動画で聴け、ルーツと影響のつながりを地図でたどれる。</p>
<p>尺八を吹き上げる禅の音楽だ。基本は独奏で、例外として二管の曲もある。虚無僧と呼ばれる僧たちが修行として吹いた曲群の呼び名で、無伴奏の縦笛だけで一曲が組み上がる。

使う楽器は尺八という縦笛だ。竹の根元部分から作り、指孔は手前に4つ、奥に1つの計5つ。歌口と呼ばれる斜めに切った縁に息を直接当てて鳴らす。息の音そのものが音色に混ざり、風のうなりに似た質感をもつ。奏法の中心は、あごの動きで笛の角度を変え、音程を下げる「メリ」と上げる「カリ」だ。この二つの動きで、一音の内側を滑らかに揺らす。荒い息を音の頭に混ぜる「ムラ息」を使うと、音が咆哮のように爆ぜる。

旋律は陰旋法的な5音音階とされる。和音はなく、旋律線が1本だけ伸びる。音程は半音単位で微妙に揺らされ、楽譜に書き写せない細かい陰影が多い。

リズムに拍子はない。固定した小節もテンポもなく、句と句のあいだに意図的な沈黙を挟む。音が消えたあとの静けさまでが音楽の一部になる。

歌と歌詞はない。無伴奏の器楽だ。曲の構成に定型はなく、曲によって異なる。曲の長さは曲によって大きく異なる。吹かれる場所は、寺の坐禅堂や座敷といった修行の場だ。いまはコンサートホールや個人の稽古場でも吹かれている。</p>
<h2>成り立ち</h2><p>虚無僧の原型は中世にさかのぼる。江戸時代（1603～1868年）の日本で、本曲は虚無僧という僧たちのあいだで形を整えた。虚無僧は深編笠の一種・天蓋を頭にかぶり、尺八を吹きながら諸国を旅して施しを請うた。出自は武士階級で、とくに主を失った浪人が多かった。臨済宗の一派ともされる普化宗の寺に属し、読経の代わりに尺八を吹く「吹禅」を修行とした。全国に虚無僧寺があり、寺ごとに独自の曲を育てていた。

起源を伝える物語は古い。唐の禅者・普化に始まる系譜を記した『虚鐸伝記』（1795年）などが伝えている。ただしこれは18世紀末に整えられた由緒書で、原典は確認されない。一方、1664年の一節切の書『糸竹初心集』に、のちに本曲と呼ばれる曲と関わる曲名が見える。琴古流の本曲の作曲年代は不詳だ。伝承として古いとされる。

決定的だったのが黒沢琴古（1710～1771年）だ。下総国小金（現・千葉県松戸市小金）の虚無僧寺・一月寺に関わったこの人物は、各地の虚無僧寺を巡って伝承曲を採集し、30余曲を整理・作曲して琴古流本曲の基礎を築いたと伝えられる。「虚空」「虚霊」「鹿の遠音」など、今日の主要曲の多くが、この流れに連なるとされる。

しかし明治政府は、幕府との結びつきが強かったことなどから1871年に普化宗を廃止した。当時の仏教政策の影響も指摘される。虚無僧は制度ごと消え、尺八の演奏も数年間禁じられたとされる。禁令が解けると、演奏家たちは俗楽の教師として尺八を続ける道を選んだ。1896年には中尾都山が都山流を興し、尺八は箏・三味線との合奏の世界へ広がっていった。

他方、廃止後の1888年に再興された京都の明暗寺（明暗教会）を中心に、本曲そのものを受け継ぐ流れも続いた。20世紀には海童道祖が虚無僧の吹き方を独自に研ぎ直した。弟子の横山勝也は欧米などで演奏し、本曲の独奏リサイタルも行った。山口五郎の録音も名演として残る。明治の動乱で多くの曲が失われたと言われるなかで、現存する本曲は150曲あまりが伝承されている。現在も琴古流や明暗系の各流派、海外の愛好家たちによって吹き継がれている。</p>
