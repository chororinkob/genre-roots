<h1>Grime（グライム）とは</h1>
<p>ロンドンの団地から生まれた、電子音とラップが正面衝突するような音楽。最大の特徴はテンポで、毎分140拍前後という、ヒップホップよりはるかに速い速度に固定されている。リズムは四つ打ちではなく、二拍四拍を強調しながらも拍が欠けたり跳ね</p>
<p>ロンドンの団地から生まれた、電子音とラップが正面衝突するような音楽。最大の特徴はテンポで、毎分140拍前後という、ヒップホップよりはるかに速い速度に固定されている。リズムは四つ打ちではなく、二拍四拍を強調しながらも拍が欠けたり跳ねたりする不規則な組み方で、ジャマイカ由来のダンスホールの骨格が透けて見える。音色は徹底して安っぽく、初期は家庭用ゲーム機のソフトや廉価なシンセで作られたため、ピコピコした電子音、金属的なストリングス、ノコギリ波のベースが剥き出しで鳴る。和音はほとんど使われず、単音の旋律と低音だけで曲が成立する。MCの発声が核心で、速いテンポに合わせて息継ぎを詰め、攻撃的に押し込むように言葉を吐き出す。訛りはロンドンの多民族地区のもので、ジャマイカ英語やコックニーが混ざる。歌詞は自慢と挑発、貧困、地元の日常、そして相手を名指しで攻撃する応酬が多い。発表の場も特徴的で、正規のレコードよりも海賊ラジオ局の生放送や、複数のMCが順番にマイクを奪い合うクラッシュと呼ばれる対戦形式が中心だった。アメリカのヒップホップと比べると、低音の圧よりも速度と言葉の密度で押す点が決定的に異なる。</p>
<h2>成り立ち</h2><p>生まれたのは2000年前後、ロンドン東部のバウ、ホームズリー、タワーハムレッツといった公営団地の密集する地区である。直接の親はUKガラージで、そこから甘い歌ものを取り除き、低音と攻撃的なMCだけを残したものがグライムになった。決定的な起点とされるのが、Wileyが作った『Eskimo』(2002)を含む一連の楽曲で、彼はこの氷のように冷たい音をエスキ・ビートと名づけた。Wileyが率いたRoll Deepと、そこから派生したDizzee Rascalが最初の突破口となり、Dizzeeは2003年、18歳で発表した『Boy in da Corner』でイギリス最高の音楽賞であるマーキュリー賞を受賞した。同じ年、彼はイビサ島で刺されて重傷を負っている。シーンを支えたのは正規の放送ではなく、団地の屋上に無許可でアンテナを立てた海賊ラジオ局で、Rinse FM、Deja Vu FM、Freezeといった局から新曲が流れた。またJammer宅の地下室で撮影されたLord of the Mics というクラッシュの映像シリーズが、MCの実力を決める場となった。KanoやGhettsといった名手がここから出ている。しかし2000年代半ば、ロンドン警視庁は暴力の温床とみなしてフォーム696という書類を導入し、主催者に出演者の人種や客層の申告を求めた。この制度は黒人音楽の公演を狙い撃ちにしていると批判され、2017年にようやく廃止された。商業的にも一度は行き詰まり、多くのMCがポップスやEDMに転向した。復活は2014年頃で、Skeptaが『That's Not Me』を自主制作で発表し、2016年の『Konnichiwa』でマーキュリー賞を受賞、Stormzyは2019年にグラストンベリー・フェスティバルの大トリを黒人英国人として初めて務めた。</p>
<h2>代表曲</h2><ul><li>Boy in da Corner (Dizzee Rascal)</li><li>Shutdown (Skepta)</li><li>Gang Signs &amp; Prayer (Stormzy)</li></ul>
