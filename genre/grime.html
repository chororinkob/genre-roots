<h1>Grime（グライム）とは</h1>
<p>ロンドンの団地から生まれた、電子音とラップが正面衝突するような音楽。最大の特徴はテンポで、おおむね140BPM前後で作られることが多く、ヒップホップの標準的なテンポより速い（ただしハーフタイム感がある）。リズムは四つ打ちではなく、</p>
<p>ロンドンの団地から生まれた、電子音とラップが正面衝突するような音楽。最大の特徴はテンポで、おおむね140BPM前後で作られることが多く、ヒップホップの標準的なテンポより速い（ただしハーフタイム感がある）。リズムは四つ打ちではなく、拍の位置をずらしたブレイクビート（ドラムの切り貼りで作る不規則なリズム）で、拍が欠けたり跳ねたりする不規則な組み方で、ジャマイカ由来のダンスホールのリズムの一部を変形した形になっている。音色は徹底して安っぽく、初期はPCの音楽ソフト（Fruity Loops）やPlayStation用ソフト「Music 2000」などで作られたため、ピコピコした電子音、金属的なストリングス、矩形波（スクエア波）のベースが剥き出しで鳴る。和声は簡素で、短いフレーズ、ストリングスのスタッカート、低音が中心になる。MC（ラップのように語る人）の発声が核心で、速いテンポに合わせて息継ぎを詰め、攻撃的に押し込むように言葉を吐き出す。訛りはロンドンの多民族地区のもので、ジャマイカ英語やコックニーなどが混ざる（マルチカルチュラル・ロンドン・イングリッシュ、MLEと呼ばれる）。歌詞は自慢と挑発、貧困、地元の日常、そして相手を名指しで攻撃する応酬が多い。発表の場も特徴的で、正規のレコードよりも海賊ラジオ局の生放送や、MC同士が互いをディスし合って勝敗を競うクラッシュと呼ばれる対戦形式が中心だった。</p>
<h2>成り立ち</h2><p>生まれたのは2000年代初頭（2002年頃）、ロンドン東部のバウ、ニューハム、タワーハムレッツといった公営団地の密集する地区である。UKガラージから発展し、ジャングル、ダンスホール、ヒップホップの影響も受けた。諸説ある中で有力な起点の候補の一つとされるのが、Wileyが作った『Eskimo』(制作は1999年末か2000年末で、本人の記憶による、2002年7月にレコード発売)を含む一連の楽曲で、彼はこの氷のように冷たい音をエスキ・ビートと名づけた。Dizzee Rascalのソロ作が最初の大きな突破口となり、Dizzeeは2003年、18歳で発表した『Boy in da Corner』でイギリスで最も権威ある音楽賞の一つであるマーキュリー賞を受賞した。同じ年の2003年7月、彼はキプロスのアイヤ・ナパで、Roll Deepの一員として現地に滞在中、クラブでの口論の後に襲われて刺され、重傷を負っている。シーンを支えたのは正規の放送ではなく、団地の屋上に無許可でアンテナを立てた海賊ラジオ局で、Rinse FM、Deja Vu FM、Freeze FMといった局から新曲が流れた。またJammer宅の地下室で撮影されたLord of the Mics というクラッシュの映像シリーズが、MCの実力を決める場となった。KanoやGhettsらもクラッシュに参加した。しかし2000年代半ば、ロンドン警視庁は、2005年にクラブでの銃撃事件が続いたことを受けて、フォーム696という書類を導入し、主催者に出演者・DJの氏名、住所、電話番号と、来場が見込まれる民族グループ（客層）の申告を求めた（民族に関する設問は2008年12月の改訂で削除された（2009年とする資料もある））。この制度は黒人音楽の公演を標的にしていると批判され、警視庁は否定した。2017年にようやく廃止された。商業的にも一度は行き詰まり、多くのMCがポップスやダンスポップに転向した。復活は2014年頃で、Skeptaが『That's Not Me』を自身らのレーベルBoy Better Knowから発表し、2016年の『Konnichiwa』でマーキュリー賞を受賞、Stormzyは2019年にグラストンベリー・フェスティバルのピラミッド・ステージのヘッドライナーを、黒人英国人のソロ・アーティストとして初めて務めた。</p>
