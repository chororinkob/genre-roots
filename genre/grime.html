<h1>Grime（グライム）とは</h1>
<p>グライムは、ロンドンの団地から生まれた、電子音とラップが正面衝突するような音楽だ。 音は、徹底して安っぽい。初期は、PCの音楽ソフト（Fruity Loops）やPlayStation用ソフト『Music 2000』などで作られた</p>
<p>グライムは、ロンドンの団地から生まれた、電子音とラップが正面衝突するような音楽だ。

音は、徹底して安っぽい。初期は、PCの音楽ソフト（Fruity Loops）やPlayStation用ソフト『Music 2000』などで作られた。そのため、ピコピコした電子音、金属的なストリングス、矩形波（スクエア波）のベースが、剥き出しで鳴る。和声は簡素で、短いフレーズ、ストリングスのスタッカート、低音が中心だ。

最大の特徴はテンポである。おおむね140BPM前後で作られることが多い。ヒップホップの標準的なテンポより速いが、ハーフタイム感がある。

リズムは四つ打ちではない。拍の位置をずらしたブレイクビート（ドラムの切り貼りで作る不規則なリズム）である。拍が欠けたり跳ねたりする不規則な組み方で、ジャマイカ由来のダンスホールのリズムの一部を変形している。

核心になるのは、MC（ラップのように語る人）の発声だ。速いテンポに合わせて息継ぎを詰め、攻撃的に押し込むように言葉を吐き出す。訛りは、ロンドンの多民族地区のものだ。ジャマイカ英語やコックニーが混ざる（Multicultural London English、MLE）。

歌詞は、自慢と挑発、貧困、地元の日常が多い。相手を名指しで攻撃する応酬も多い。

発表の場も特徴的だった。正規のレコードよりも、海賊ラジオ局が中心だった。そこでは、複数のMCがマイクを回す形式の生放送が行われた。MC同士が互いをディスし合って勝敗を競うクラッシュもあった。</p>
<h2>成り立ち</h2><p>舞台は、2000年代初頭のロンドン東部だ。バウ、ニューハム、タワーハムレッツといった、公営団地の密集する地区で、グライムは生まれた。

UKガラージから発展し、ジャングル、ダンスホール、ヒップホップの影響も受けた。諸説ある中で、有力な起点の候補の一つとされるのが、Wileyが作った『Eskimo』を含む一連の楽曲だ。制作は1999年末か2000年末（本人の記憶による）で、2002年7月にレコードが発売された。彼は、この氷のように冷たい音をエスキ・ビートと名づけた。

Wileyが率いたRoll Deepがあり、Dizzee Rascalのソロ作が最初の大きな突破口となった。Dizzeeは2003年、18歳で『Boy in da Corner』を発表し、イギリスで最も権威ある音楽賞の一つであるマーキュリー賞を受賞した。同じ年の2003年7月、彼はキプロスのアイヤ・ナパで、Roll Deepの一員として現地に滞在中、クラブでの口論の後に襲われて刺され、重傷を負っている。

シーンを支えたのは、正規の放送ではなかった。団地の屋上に無許可でアンテナを立てた海賊ラジオ局である。Rinse FM、Deja Vu FM、Freeze FMといった局から、新曲が流れた。また、Jammer宅の地下室で撮影されたLord of the Micsというクラッシュの映像シリーズが、MCの実力を決める場となった。Kano、Ghettsらもクラッシュに参加した。

しかし、2005年、クラブでの銃撃事件の続発を受けて、ロンドン警視庁はフォーム696という書類を導入した。主催者に、出演者・DJの氏名、住所、電話番号と、来場が見込まれる民族グループ（客層）の申告を求めるものだった（民族に関する設問は2008年12月の改訂で削除された（2009年とする資料もある））。この制度は、黒人音楽を標的にしているとの批判があり、ロンドン警視庁は否定したが、2017年にようやく廃止された。

商業的にも、グライムは一度は行き詰まった。多くのMCが、ポップスやダンスポップに転向した。

復活は、2014年頃である。Skeptaが『That's Not Me』を、自身らのレーベルBoy Better Knowから発表した。2016年には『Konnichiwa』でマーキュリー賞を受賞した。Stormzyは2019年に、グラストンベリー・フェスティバルのピラミッド・ステージのヘッドライナーを、黒人英国人のソロ・アーティストとして初めて務めた。</p>
