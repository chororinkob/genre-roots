<h1>Bluegrass（ブルーグラス）とは</h1>
<p>ブルーグラスは、アコースティック楽器だけで演奏される、高速で技巧的な音楽だ。アメリカ南部のルーツ系（カントリー系）の弦楽バンド音楽である。 編成は5弦バンジョー、マンドリン、フィドル、アコースティック・ギター、ウッドベース、そして</p>
<p>ブルーグラスは、アコースティック楽器だけで演奏される、高速で技巧的な音楽だ。アメリカ南部のルーツ系（カントリー系）の弦楽バンド音楽である。

編成は5弦バンジョー、マンドリン、フィドル、アコースティック・ギター、ウッドベース、そして時にドブロ（金属の共鳴板を持つスライド・ギター）だ。伝統的には打楽器は使わない。

最大の技術的特徴は、5弦バンジョーのスクラッグス・スタイルだ。親指、人差し指、中指にピックを着け（指のピックは金属が一般的）、3本指を使う。8分音符を基本とする分散和音（ロール）を、途切れなく繰り出す。

和声（コードの響き）は三和音（基本の3音の和音）中心だ。ただ、テンポの速さと各声部の動きの複雑さが、独特の緊張を生む。

リズムはマンドリンとギターが担う。マンドリンが2拍目と4拍目を短く弾く、いわゆるチョップという奏法が、ドラムのスネアの代わりを務める。BPMは速く、拍子の書き方は2/2や4/4など、慣習によって異なる。

歌唱は、極めて高い音域で張り上げるハイ・ロンサム・サウンドと呼ばれる発声が理想とされる。声の重なりは、2声から4声（デュエット、トリオ、カルテット）が用いられる。標準はトリオ。

歌詞は故郷への思慕、山での生活、殺人譚、信仰、そして死を扱う。明るい音と暗い内容の対比が特徴であるという指摘もある。

演奏形式はジャズに近く、歌の合間に各楽器が順番にソロを取る。</p>
<h2>成り立ち</h2><p>ブルーグラスは、1940年代、ケンタッキー州出身のマンドリン奏者Bill Monroeが、自身の楽団Blue Grass Boysで固めたスタイルに始まる。ジャンルの名称は、この楽団名、ひいてはケンタッキー州の愛称であるブルーグラス・ステートに由来する。

決定的な年は1945年だ。この年に加入したバンジョー奏者Earl Scruggsが、3本指で弾く奏法を高速のロール奏法へ発展させて持ち込んだ（3本指の奏法そのものは、彼の故郷のノースカロライナ州西部などで以前から行われていた）。バンジョーは伴奏楽器と見られがちだった。しかしScruggsの手により、旋律を高速で刻む主役楽器へ変貌した。ギターと歌のLester Flattも、その少し前に加入していた。この編成が、今日まで続く標準形となった。

FlattとScruggsは1948年に独立し、The Foggy Mountain Boysを結成した。彼らが1949年に録音した（発売は1950年）楽曲Foggy Mountain Breakdownは、1967年の映画Bonnie and Clydeで使われて再び脚光を浴び、1968年に全米Hot 100で55位に入った。Bill Monroeは、1948年の独立後しばらくは関係は保たれていたが、1955年前後のOpry加入問題をきっかけに決裂したとされる。Flattとの和解は1970年代初め（1971年説と1973年説がある）。

戦後に本格化した、アパラチア地方の農村から都市の工場への大量の人口移動が、都市部の聴衆層の形成に影響したという解釈がある。都会で暮らす人々にとって、この音楽は失われた故郷を呼び起こすものだったという見方もある。

1950年代後半には、ロックンロールとナッシュビル・サウンドの人気が脅威となり、Bill Monroeの商業的な地位が下がった。しかし、1960年代のフォーク・リヴァイヴァル（民謡の復興運動）により、大学生層に再発見された。1961年にバージニア州ルレイで、最初期のブルーグラス・フェスティバルの一つが開かれ、1965年にFincastleで最初の3日間開催の野外フェスティバルが開かれた。これらが新たな受け皿となった。

1972年、The Nitty Gritty Dirt Bandが古参の演奏家たちを招いて制作したWill the Circle Be Unbrokenは、世代を超えた交流のしるしとなった。2000年の映画O Brother, Where Art Thou?のサウンドトラックは、ブルーグラスを含むルーツ音楽への関心を再び高めた。現在では、技巧を極限まで追求するプログレッシヴ・ブルーグラスから、初期のスタイルを厳格に守る一派まで、幅広く共存している。</p>
