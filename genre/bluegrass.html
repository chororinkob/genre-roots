<h1>Bluegrass（ブルーグラス）とは</h1>
<p>アコースティック楽器だけで演奏される、高速で技巧的なアメリカ南部の民衆音楽。編成は五弦バンジョー、マンドリン、フィドル、アコースティック・ギター、ウッドベース、そして時にドブロ（金属の共鳴板を持つスライド・ギター）で、打楽器は使わ</p>
<p>アコースティック楽器だけで演奏される、高速で技巧的なアメリカ南部の民衆音楽。編成は五弦バンジョー、マンドリン、フィドル、アコースティック・ギター、ウッドベース、そして時にドブロ（金属の共鳴板を持つスライド・ギター）で、打楽器は使わない。リズムはマンドリンとギターが担い、マンドリンが二拍目と四拍目を短く弾く、いわゆるチョップという奏法が、ドラムのスネアの代わりを務める。BPMは速く、二分の二拍子で刻まれることが多い。最大の技術的特徴は五弦バンジョーのスクラッグス・スタイルで、親指、人差し指、中指の三本に金属の爪をはめ、三本指の連続的な組み合わせで途切れない16分音符の流れを作る。演奏形式はジャズに近く、歌の合間に各楽器が順番にソロを取る。歌唱は極めて高い音域で張り上げるハイ・ロンサム・サウンドと呼ばれる発声が理想とされ、三声または四声の重なりが用いられる。和声は三和音中心だが、テンポの速さと各声部の動きの複雑さが独特の緊張を生む。歌詞は故郷への思慕、山での生活、殺人譚、信仰、そして死を扱い、明るい音と暗い内容の対比が特徴である。</p>
<h2>成り立ち</h2><p>1940年代、ケンタッキー州出身のマンドリン奏者Bill Monroeが、自身の楽団Blue Grass Boysで確立した様式に始まる。ジャンルの名称は、この楽団名、ひいてはケンタッキー州の愛称であるブルーグラス・ステートに由来する。決定的な年は1945年で、この年に加入したバンジョー奏者Earl Scruggsが、三本指を使う独自の奏法を持ち込んだ。それまでバンジョーは伴奏楽器だったが、Scruggsの手により旋律を高速で刻む主役楽器へ変貌した。ギターと歌のLester Flattも同時期に加入し、この編成が今日まで続く標準形となった。FlattとScruggsは1948年に独立してThe Foggy Mountain Boysを結成、彼らの1949年の楽曲Foggy Mountain Breakdownは、1967年の映画Bonnie and Clydeで使われて全国的に知られた。Bill Monroeは彼らの離脱を長く許さず、20年以上口をきかなかったと伝えられる。この音楽が生まれた背景には、第二次世界大戦後、アパラチア地方の農村から都市の工場へ大量の人口が移動したことがある。都会で暮らす人々にとって、この音楽は失われた故郷を呼び起こす装置として機能した。1950年代半ばにはロックンロールの台頭で商業的に苦境に陥ったが、1960年代のフォーク・リヴァイヴァルにより大学生層に再発見され、1965年にバージニア州で始まった野外のブルーグラス・フェスティバルが新たな受け皿となった。1972年、The Nitty Gritty Dirt Bandが古参の演奏家たちを招いて制作したWill the Circle Be Unbrokenは、世代を超えた交流の象徴となった。2000年の映画O Brother, Where Art Thou?のサウンドトラックは、この音楽を再び大衆的な注目に引き戻した。現在では技巧を極限まで追求するプログレッシヴ・ブルーグラスから、初期の様式を厳格に守る一派まで幅広く共存している。</p>
<h2>代表曲</h2><ul><li>Foggy Mountain Breakdown (Flatt &amp; Scruggs)</li><li>Man of Constant Sorrow (The Soggy Bottom Boys)</li><li>Blue Moon of Kentucky (Bill Monroe)</li><li>The Fox (Nickel Creek)</li><li>Dust in a Baggie (Billy Strings)</li></ul>
