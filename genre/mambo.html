<h1>Mambo（マンボ）とは</h1>
<p>金管楽器隊(ブラスセクション)が叩きつける爆発的なエネルギーと、アフリカ系キューバ人の音楽に由来する複雑なポリリズム(複数の異なるリズムが同時進行すること)が融合した、熱狂的なダンスミュージック。トランペット、トロンボーン、サック</p>
<p>金管楽器隊(ブラスセクション)が叩きつける爆発的なエネルギーと、アフリカ系キューバ人の音楽に由来する複雑なポリリズム(複数の異なるリズムが同時進行すること)が融合した、熱狂的なダンスミュージック。トランペット、トロンボーン、サックスによるビッグバンド編成が、ジャズ的な洗練されたアレンジで咆哮し、その下でコンガやティンバレスといった打楽器群が複雑に絡み合うリズムを叩き出す。テンポは速く、音楽と、全身を大きく使う情熱的なダンスとが、切り離せない一体のものとして発展してきた。1940〜50年代、ニューヨークのラテンクラブが最も熱気を帯びていた黄金期を象徴する音楽である。「マンボ」という名は、もともとダンソンの終盤にある、即興的でシンコペーション(拍の強弱をずらすこと)の強い区間を指した。ビッグバンド版では、リフの反復(グアヘオ)やスウィング、ジャズの要素が重んじられた。</p>
<h2>成り立ち</h2><p>1930年代のキューバで、当時の主流だった舞曲ダンソンを刷新する試みから生まれた。ダンソンは19世紀末に成立した優雅な舞曲だが、1930年代には形式が硬直し、若者には古臭く感じられていた。1937〜38年ごろ、Arcaño y sus Maravillasという楽団に在籍していたベース奏者Israel López(通称Cachao)と、その兄でチェロ奏者・作曲家のOrestes Lópezが、ダンソンの終盤にアフリカ系キューバ音楽のリズムを取り込んだ即興的な区間を加えた。Orestes Lópezが1938年に書いた曲「Mambo」(Cachaoとの共作とする記述もある)が、その名の由来とされる。この区間ではリズムセクションが短い定型句(モントゥーノ)を反復し、その上に管楽器が短い決め句を重ねる構造がとられ、踊り手が自由に動ける場が生まれた。この発想を大編成のビッグバンドへ拡大したのがピアニストのDámaso Pérez Pradoである。彼はキューバでの評価が振るわず1948〜49年ごろにメキシコへ移り、そこで金管を極端に高い音域で咆哮させ、サックスの厚い層を対置し、自ら唸り声の掛け声を入れる強烈な様式を完成させた。「Que rico el mambo」や「Mambo No. 5」は各国で大ヒットし、彼はマンボ王と呼ばれる。ニューヨークのダンスホールPalladium Ballroomが震源地となり、1948年ごろからアメリカでマンボ熱が始まって、1950年代前半にはマンボ・ブームが世界を覆った。ここではプエルトリコ系のTito Puente、キューバ系のMachito(出生地はハバナまたはタンパとされ諸説ある)、そしてTito Rodríguezの三楽団が競い合い、人種の壁を越えて白人・黒人・ラテン系の客が同じフロアで踊った。この場は、後のサルサにつながる土壌の一つとなる。一方、Pérez Pradoは1953年にメキシコから国外退去となり、1964年まで再入国を許されなかった。理由には諸説あり、労働許可証をめぐる興行師との紛争とされるのが通説である。商業音楽しか作らないという批判を受けがちだったともされる。マンボと並行して、1950年代にはdanzón-mamboからチャチャチャが生まれた。マンボの要素は、のちにサルサにも取り込まれていった。</p>
<h2>代表曲</h2><ul><li>Oye Como Va (Tito Puente)</li><li>Mambo No. 5 (Pérez Prado)</li><li>Que Rico el Mambo (Pérez Prado)</li><li>Ran Kan Kan (Tito Puente)</li><li>Mambo Italiano (Rosemary Clooney)</li><li>Patricia (Pérez Prado)</li><li>Cherry Pink and Apple Blossom White (Pérez Prado)</li><li>Para Los Rumberos (Tito Puente)</li><li>Mambo Gozón (Tito Puente)</li><li>Mambo No. 8 (Pérez Prado)</li><li>Mambo Jambo (Pérez Prado)</li><li>El Mambo Diablo (Tito Puente)</li></ul>
