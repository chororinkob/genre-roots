<h1>Mambo（マンボ）とは</h1>
<p>金管楽器隊(ブラスセクション)が叩きつける爆発的なエネルギーと、アフリカ系キューバ人の音楽に由来する複雑なポリリズム(複数の異なるリズムが同時進行すること)が融合した、熱狂的なダンスミュージック。トランペット、トロンボーン、サック</p>
<p>金管楽器隊(ブラスセクション)が叩きつける爆発的なエネルギーと、アフリカ系キューバ人の音楽に由来する複雑なポリリズム(複数の異なるリズムが同時進行すること)が融合した、熱狂的なダンスミュージック。トランペット、トロンボーン、サックスによるビッグバンド編成が、ジャズ的な洗練されたアレンジで咆哮し、その下でコンガやティンバレスといった打楽器群が複雑に絡み合うリズムを叩き出す。テンポは速く(BPM 160〜220)、音楽と、全身を大きく使う情熱的なダンスとが、切り離せない一体のものとして発展してきた。1940〜50年代、ニューヨークのラテンクラブが最も熱気を帯びていた黄金期を象徴する音楽である。楽曲の構成上、後半に向かって管楽器のリフが次々と積み重なり、打楽器のソロを挟みながら熱狂が最高潮に達していく「マンボ・セクション」と呼ばれる展開部を持つのが定型で、この盛り上がりの設計こそがマンボの真骨頂とされる。</p>
<h2>成り立ち</h2><p>1930年代のキューバで、当時の主流だった舞曲ダンソンを刷新する試みから生まれた。ダンソンは19世紀末に成立した優雅な舞曲だが、1930年代には形式が硬直し、若者には古臭く感じられていた。1938年頃、Arcaño y sus Maravillasという楽団に在籍していたベース奏者Israel López(通称Cachao)と、その兄でチェロ奏者・作曲家のOrestes Lópezが、ダンソンの終盤にアフリカ系キューバ音楽のリズムを取り込んだ即興的な区間を加えた。Orestes Lópezが1938年に書いた曲「Mambo」が、その名の由来とされる。この区間ではリズムセクションが短い定型句(モントゥーノ)を反復し、その上に管楽器が短い決め句を重ねる構造がとられ、踊り手が自由に動ける場が生まれた。この発想を大編成のビッグバンドへ拡大したのがピアニストのDámaso Pérez Pradoである。彼はキューバでの評価が振るわず1948年にメキシコへ移り、そこで金管を極端に高い音域で咆哮させ、サックスの厚い層を対置し、自ら唸り声の掛け声を入れる強烈な様式を完成させた。「Que rico el mambo」や「Mambo No. 5」は各国で大ヒットし、彼はマンボ王と呼ばれる。1950年代前半にはマンボ・ブームが世界を覆い、ニューヨークのダンスホールPalladium Ballroomが震源地となった。ここではプエルトリコ系のTito Puente、キューバ出身のMachito、そしてTito Rodríguezの三楽団が競い合い、人種の壁を越えて白人・黒人・ラテン系の客が同じフロアで踊った。この場が、後のサルサを生む直接の土壌となる。一方で、Pérez Pradoの派手な様式は本国キューバでは商業的すぎると批判され、彼はメキシコで一時入国を拒否される事態も経験した。1959年のキューバ革命によってアメリカとキューバの音楽的な往来が断たれた後、マンボの遺産はニューヨークでサルサへ、そしてチャチャチャへと引き継がれていった。</p>
<h2>代表曲</h2><ul><li>Mambo No. 5 (Pérez Prado)</li><li>Oye Como Va (Tito Puente)</li><li>Que Rico el Mambo (Pérez Prado)</li><li>Ran Kan Kan (Tito Puente)</li><li>Mambo Italiano (Rosemary Clooney)</li></ul>
