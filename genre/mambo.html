<h1>Mambo（マンボ）とは</h1>
<p>マンボは、アフリカ系キューバ人の音楽に由来する複雑なポリリズムと、ビッグバンドのスタイルの金管楽器隊が叩きつける爆発的なエネルギーが融合した、熱狂的なダンス音楽だ。ポリリズムとは、複数の異なるリズムが同時に進むことをいう。 原型は</p>
<p>マンボは、アフリカ系キューバ人の音楽に由来する複雑なポリリズムと、ビッグバンドのスタイルの金管楽器隊が叩きつける爆発的なエネルギーが融合した、熱狂的なダンス音楽だ。ポリリズムとは、複数の異なるリズムが同時に進むことをいう。

原型は、チャランガ編成で演奏されたダンソン・マンボである。金管とサックスを中心にしたビッグバンドのスタイルは1940年代後半以降のもので、担い手はPérez Pradoやニューヨークの楽団だった。

そのビッグバンド編成では、トランペット、トロンボーン、サックスが、ジャズ風の洗練されたアレンジで咆哮する。その下で、コンガやティンバレスといった打楽器群が、複雑に絡み合うリズムを叩き出す。

テンポは速い。音楽と、全身を大きく使う情熱的なダンスとは、切り離せない一体のものとして発展してきた。1940〜50年代、ニューヨークのラテンクラブが最も熱気を帯びていた黄金期を代表する音楽である。

「マンボ」という名は、もともとダンソンの終盤にある区間を指した。即興的で、シンコペーションの強い部分だ。シンコペーションとは、拍の強弱をずらすことをいう。ビッグバンド版では、ホーンのリフ、つまりグアヘオの反復や、スウィング、ジャズの要素が重んじられた。</p>
<h2>成り立ち</h2><p>1930年代のキューバで、当時の主流だった舞曲ダンソンを新しくしようとする試みから、マンボは生まれた。ダンソンは19世紀末に成り立った優雅な舞曲だが、1930年代には型にはまった形式だった。

1937〜38年ごろ、Arcaño y sus Maravillasという楽団に、ベース奏者のIsrael Lópezと、その兄でチェロ奏者・作曲家のOrestes Lópezが在籍していた。弟は通称Cachaoと呼ばれる。兄弟は、ダンソンの終盤に、アフリカ系キューバ音楽のリズムを取り込んだ即興的な区間を加えた。

Orestes Lópezが1938年に書いた曲「Mambo」が、その名の由来とされる。Cachaoとの共作とする説もある。この区間では、ピアノやリズム群がモントゥーノと呼ばれる短い決まったフレーズを繰り返す。その上でフルートが即興し、弦がリズム和音を刻んだ。こうして、踊り手が自由に動ける場が生まれた。

ピアニストのDámaso Pérez Pradoは、この名称と要素を取り入れ、ジャズ風のビッグバンドのスタイルとして世界に広めた。ただし、両者の受け継ぎの関係については議論がある。彼はキューバの保守的な音楽界で受け入れられにくかったとされ、1948〜49年ごろにメキシコへ移った。移った年には諸説ある。そこで彼は、金管楽器を極端に高い音で吠えるように鳴らし、サックスの厚い重なりをぶつけ、自らも唸り声の掛け声を入れる強烈なスタイルを完成させた。「Que rico el mambo」や「Mambo No. 5」は各国で大ヒットし、彼はマンボ王と呼ばれる。一方で、一部の批評家は後年の録音を型にはまったものと見た。

アメリカでは、ニューヨークのダンスホールPalladium Ballroomが震源地となり、1947〜48年ごろからマンボ熱が始まった。マンボは1940年代末から50年代にかけて、メキシコと米国、とくにニューヨークを中心に大流行した。ここでは、プエルトリコ系のTito Puente、出生地がハバナまたはタンパとされ諸説あるキューバ系のMachito、そしてTito Rodríguezの三楽団が競い合った。人種の壁を越えて、白人・黒人・ラテン系の客が同じフロアで踊った。この場は、後のサルサにつながる土壌の一つとなる。

しかし、Pérez Pradoは1953年にメキシコから国外退去となり、1964年まで再入国を許されなかった。その理由には諸説ある。国歌を編曲したという俗説や、Restrepoが述べた、労働許可証をめぐる興行師との対立などだ。

マンボと並行して、1950年代にはダンソン・マンボからチャチャチャが生まれた。マンボの要素は、のちにサルサにも取り込まれていった。</p>
