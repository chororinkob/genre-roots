<h1>Melodic Death Metal（メロデス）とは</h1>
<p>メロディックデスメタルは、デスメタルの咆哮と高速のリズムを保ちながら、ギターにはっきりと歌える旋律を与えた音楽である。 中心になるのは、2本のギターによる重奏だ。主旋律に対して、3度あるいは6度上の音（ドに対するミやラ）を並べ、同</p>
<p>メロディックデスメタルは、デスメタルの咆哮と高速のリズムを保ちながら、ギターにはっきりと歌える旋律を与えた音楽である。

中心になるのは、2本のギターによる重奏だ。主旋律に対して、3度あるいは6度上の音（ドに対するミやラ）を並べ、同じ動きで重ねる書き方がよく用いられる。この哀愁を帯びた響きは、この分野の特徴の一つである。この手法は、NWOBHM（Iron Maidenなど）に代表される英国の伝統的ヘヴィメタルから受け継がれた。とりわけ、2本のギターが旋律を掛け合うバンドの影響が大きい。そこにデスメタルの速度と歪みが加わり、勇壮さと悲哀が同居する独特の質感が生まれた。

音階は、短調系の旋法だ。エオリアンが基調で、フリジアンやドリアンも混ざる。和声的短音階の使用例もある。

演奏面では、同じ音を細かく連打するトレモロによる高速の刻みが多い。複数の弦をまたいで、和音を一音ずつ弾く速いフレーズも多用される。

ドラムは、高速のツーバスが中心だ。ブラストビート（極端に速いスネアとバスドラムの連打）は時折使われる。ツインペダル(または2台のバスドラム)による連打、そして疾走する2ビート（1拍おきにバスドラムとスネアを交互に打つ形）を使い分ける。

ヴォーカルは、唸り声または絶叫が基本だ。クリーンボーカルも多用される。

曲の途中には、生ギターによる静かな間奏が置かれ、緩急がはっきりつけられる。歌詞は、暴力描写に限らず、社会問題・内面・神話など多様である。資料が挙げる違いは、「旋律的なギター」「クリーンボーカルを使うこと」「ヴァース/コーラス構造をとりやすいこと」である。</p>
<h2>成り立ち</h2><p>英国のCarcassが、1993年の『Heartwork』で先駆けの一つとなった。それを、スウェーデンのAt the Gates、Dark Tranquillity、In Flamesが、1990年代半ばに発展させた。スウェーデン西岸の港湾都市イェーテボリが、その中心である。

同じスウェーデンでも、ストックホルムでは、特定の歪みの機材を使った泥のように濁った音のデスメタルが定着していた。しかし、イェーテボリの若者たちは、それとは別の道を選んだ。彼らはNWOBHM（Iron Maidenなど）に代表される英国の伝統的ヘヴィメタルが持っていた、2本のギターによる旋律の掛け合いを、デスメタルへ持ち込んだ。

中心となったのは、Dark Tranquillity、At the Gates、In Flamesの三組だ。いずれも、10代の頃から互いを知る狭い交友関係の中から生まれたとされる。技術面で決定的だったのは、Studio Fredmanという録音所と、そこを主宰したFredrik Nordströmだった。彼の手による輪郭のはっきりした音作りが、この地域の作品に共通の質感を与えたと言われる。

1995年にAt the Gatesが発表したスローター・オブ・ザ・ソウルは、無駄を削ぎ落とした簡潔なリフと圧倒的な疾走感によって、この分野の決定盤となる。しかし、バンドは1996年に解散してしまう。ギタリストAnders Björlerが、成功の重圧と、レーベルからスタジオに戻るよう迫られる圧力を受けて脱退したとされる。残りのメンバーは継続しないと決めたという。この作品は、発売当時から好評で売れ、解散後に伝説的な地位がさらに高まった。

1995年のDark Tranquillityの『The Gallery』、1996年のIn Flamesの『The Jester Race』が続き、スタイルは完成する。並行して、イギリスのCarcassが1993年に発表した作品も、重要な例だ。内臓を題材とする過激な出自から、旋律的な方向へ転じた。同バンドのMichael Amottは、その後スウェーデンでArch Enemyを結成した。

2000年代には、メロディック・メタルコアを通じて、影響が広がった。2000年代のメロディック・メタルコアの多くが、イェーテボリ勢（特にAt the Gates）の影響を受けた。メタルコア自体は1980年代後半から1990年代初頭に、ハードコアから派生して生まれていた。しかし、メロデスの影響で、メロディック・メタルコアと呼ばれる旋律的な一派が広まる。2000年代には、Killswitch Engageなどが主流の人気を得た。

皮肉なことに、本家であるIn Flamesは、2000年代に入ってギターの旋律とソロを減らし、シンセサイザーや電子音をはっきり使うようになった。その結果、初期からの愛好家から、ルーツを捨てて商業的な音を選んだと激しく批判され、この対立は長く尾を引いた。1992年結成のAmon Amarthのように、北欧神話を掲げて人気を集めるバンドもある。このスタイルそのものは、世界中に定着している。</p>
