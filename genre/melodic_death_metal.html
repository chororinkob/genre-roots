<h1>Melodic Death Metal（メロデス）とは</h1>
<p>デスメタルの咆哮と高速のリズムを保ちながら、ギターにはっきりと歌える旋律を与えた音楽である。中核となるのは2本のギターによる重奏で、主旋律に対して3度あるいは6度上の音（ドに対するミやラ）を並べて同じ動きで重ねる書き方が慣習的に用</p>
<p>デスメタルの咆哮と高速のリズムを保ちながら、ギターにはっきりと歌える旋律を与えた音楽である。中核となるのは2本のギターによる重奏で、主旋律に対して3度あるいは6度上の音（ドに対するミやラ）を並べて同じ動きで重ねる書き方が慣習的に用いられ、この哀愁を帯びた響きが特徴の一つである。ただしバンドや曲によって違いがあり、リフ中心の曲もある。この手法はIron Maidenなどに代表される英国の伝統的ヘヴィメタル、とりわけ2本のギターが旋律を掛け合うバンドから受け継がれたものだが、そこにデスメタルの速度と歪みが加わることで、勇壮さと悲哀が同居する独特の質感が生まれた。音階は短調系の旋法（エオリアンが基調で、フリジアンやドリアンも混ざる）が中心で、和声的短音階が使われる例もある。演奏面では同じ音を細かく連打するトレモロによる高速の刻みと、複数の弦をまたいで和音を一音ずつ弾く速いフレーズが多用され、ドラムは高速のツーバス（ツインペダル、または2台のバスドラムによる連打）が中心で、ブラストビート（極端に速いスネアとバスドラムの連打）は時折使われ、疾走する2ビート（1拍おきにバスドラムとスネアを交互に打つ形）を使い分ける。ヴォーカルは唸り声または絶叫が基本で、クリーンボーカルも多用される。曲の途中には生ギターによる静かな間奏が置かれ、緩急がはっきりつけられる。歌詞は暴力描写に限らず、社会問題・内面・神話など多様である。純粋なデスメタルとの違いとして、旋律的なギターを使うこと、クリーンボーカルを使うこと、ヴァース／コーラス構造をとりやすいことが挙げられる。</p>
<h2>成り立ち</h2><p>英国のCarcassが1993年の『Heartwork』で先駆けの一つとなったとする見方があり（起源には諸説ある）、スウェーデンのAt the Gates、Dark Tranquillity、In Flamesが1990年代半ばに発展させた。スウェーデン西岸の港湾都市イェーテボリがその中心である。同じスウェーデンでもストックホルムでは、特定の歪みの機材を使った泥のように濁った音のデスメタルが確立していたが、イェーテボリの若者たちはそれとは別の道を選び、Iron Maidenなどに代表される英国の伝統的ヘヴィメタルが持っていた、2本のギターによる旋律の掛け合いをデスメタルへ持ち込んだ。中心となったのはDark Tranquillity、At the Gates、In Flamesの三組で、Dark TranquillityのMikael Stanneの回想では、いずれも同じバス路線沿いの近所の仲間だったとされ、10代の頃から互いを知る狭い交友関係の中から生まれている。技術面で決定的だったのはStudio Fredmanという録音所と、そこを主宰したFredrik Nordströmで、At the Gates、In Flames、Dark Tranquillityらがここで録音し、彼の音作りが、この地域の作品に共通の質感を与えたとされる。1995年にAt the Gatesが発表したスローター・オブ・ザ・ソウルは、無駄を削ぎ落とした簡潔なリフと圧倒的な疾走感によって、この分野の決定盤となる。しかしバンドは1996年、メンバーの説明によれば、ギタリストAnders Björlerが成功の重圧と、レーベルからスタジオに戻るよう迫られる圧力を受けて脱退し、残りのメンバーが継続しないと決めて解散してしまった。この作品は発売当時から好評で売れ、解散後に伝説的な地位がさらに高まった。1995年のDark Tranquillityの『The Gallery』、1996年のIn Flamesの『The Jester Race』が続き、様式は完成する。それに先立つ1993年にイギリスのCarcassが発表した作品も、内臓を題材とする過激な出自から旋律的な方向へ転じた例として重要で、同バンドのMichael Amottはその後スウェーデンでArch Enemyを結成した。2000年代にメロディック・メタルコアを通じて、この音楽の影響が広がった。2000年代のメロディック・メタルコアの多くが、イェーテボリ勢（特にAt the Gates）の影響を受けた。メタルコア自体は1980年代後半〜1990年代初頭にハードコアから派生しており、メロデスの影響でメロディック・メタルコアと呼ばれる旋律的な一派が広まり、2000年代にKillswitch Engageなどが主流の人気を得た。皮肉なことに、本家であるIn Flamesは2000年代に入って旋律をより歌いやすい形へ変え（ギターの旋律とソロは減った）、電子音を導入した結果、初期からの愛好家から「ルーツを捨てた」「商業的な音を選んだ」と激しく非難され、この対立は長く尾を引いた。1992年結成のAmon Amarthのように、北欧神話を掲げて人気を集めるバンドもあり、様式そのものは世界中に定着している。</p>
