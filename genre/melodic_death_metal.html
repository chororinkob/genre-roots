<h1>Melodic Death Metal（メロデス）とは</h1>
<p>デスメタルの咆哮と高速のリズムを保ちながら、ギターにはっきりと歌える旋律を与えた音楽である。中核となるのは二本のギターによる重奏で、主旋律に対して三度あるいは六度上の音を平行に重ねる書法が徹底して用いられ、この哀愁を帯びた響きがこ</p>
<p>デスメタルの咆哮と高速のリズムを保ちながら、ギターにはっきりと歌える旋律を与えた音楽である。中核となるのは二本のギターによる重奏で、主旋律に対して三度あるいは六度上の音を平行に重ねる書法が徹底して用いられ、この哀愁を帯びた響きがこの分野を一瞬で判別させる印である。この手法は1980年前後のイギリスのヘヴィメタル、とりわけ二本のギターが旋律を掛け合うバンドから受け継がれたものだが、そこにデスメタルの速度と歪みが加わることで、勇壮さと悲哀が同居する独特の質感が生まれた。音階は自然短音階と和声的短音階が中心で、後者に含まれる増二度の跳躍が、東欧的とも古風とも言える響きを作る。演奏面ではトレモロによる高速の刻みと、複数の弦をまたぐ分散和音の速い走句が多用され、ドラムはブラストビートとツーバス連打、そして疾走する二拍子を使い分ける。ヴォーカルは咆哮と絶叫の中間にあたる、言葉が聞き取れる程度の鋭い叫びが標準で、旋律は歌わない。曲の途中には生ギターや鍵盤による静かな間奏が置かれ、緩急がはっきりつけられる。歌詞は死、自然、戦い、内面の闘争を扱う。純粋なデスメタルの持つ不定形な混沌とは異なり、こちらは常に旋律という背骨を保っている点が最大の違いである。</p>
<h2>成り立ち</h2><p>発祥地はスウェーデン西岸の港湾都市イェーテボリで、時期は1990年代前半である。同じスウェーデンでもストックホルムでは、特定の歪みの機材を使った泥のように濁った音のデスメタルが確立していたが、イェーテボリの若者たちはそれとは別の道を選び、Iron Maidenをはじめとする1980年代前半のイギリスのヘヴィメタルが持っていた、二本のギターによる旋律の掛け合いをデスメタルへ持ち込んだ。中心となったのはDark Tranquillity、At the Gates、In Flamesの三組で、いずれも10代の頃から互いを知る狭い交友関係の中から生まれている。技術面で決定的だったのはStudio Fredmanという録音所と、そこを主宰したFredrik Nordströmで、彼の手による輪郭のはっきりした音作りが、この地域の作品に共通の質感を与えた。1995年にAt the Gatesが発表したスローター・オブ・ザ・ソウルは、無駄を削ぎ落とした簡潔なリフと圧倒的な疾走感によって、この分野の決定盤となる。しかしバンドは作品の完成直後に人間関係の破綻から解散してしまい、その評価が定まったのは解散後だった。同年のDark Tranquillityの作品、翌1996年のIn Flamesの作品が続き、様式は完成する。並行してイギリスのCarcassが1993年に発表した作品も、内臓を題材とする過激な出自から旋律的な方向へ転じた例として重要で、同バンドのMichael Amottはその後スウェーデンでArch Enemyを結成した。この音楽が世界史的な意味を持ったのは2000年前後である。アメリカのハードコア・パンクの若者たちがイェーテボリの旋律を発見し、自分たちの構造と組み合わせた結果、メタルコアという巨大な潮流が生まれ、以後10年以上にわたって主流の市場を席巻した。皮肉なことに、本家であるIn Flamesは2000年代に入って旋律をより歌いやすい形へ変え、電子音を導入した結果、初期からの愛好家から裏切り者として激しく非難され、この対立は長く尾を引いた。現在ではAmon Amarthのように北欧神話を掲げて巨大な会場を満たすバンドも現れ、様式そのものは世界中に定着している。</p>
