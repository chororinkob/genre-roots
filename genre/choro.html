<h1>Choro（ショーロ）とは</h1>
<p>ショーロはブラジル固有のインストゥルメンタル音楽であり、ヨーロッパの舞踏音楽とアフリカ系ブラジル人のリズム感覚が融合して生まれた複雑かつ即興性の高いジャンルだ。メロディーは非常に装飾的で、クロマティックな経過音や半音階的な動きが多</p>
<p>ショーロはブラジル固有のインストゥルメンタル音楽であり、ヨーロッパの舞踏音楽とアフリカ系ブラジル人のリズム感覚が融合して生まれた複雑かつ即興性の高いジャンルだ。メロディーは非常に装飾的で、クロマティックな経過音や半音階的な動きが多用される。和声はヨーロッパのクラシック音楽に近い機能和声を基盤としながら、属7和音や減7和音を多用し、転調も頻繁に行われる。音階はメジャー・マイナーを基本としつつ、ドミナント7thコードにフラット9thやシャープ5thを加えた複雑な色彩を持つ。

使用楽器は7弦ギター（セッチコルダス）、カバキーニョ（小型の4弦ギター）、パンデイロ（タンバリン型打楽器）、フルート、クラリネット、バンドリン（マンドリンに似た8弦楽器）が中心だ。7弦ギターは低音弦を使ったバス・ラインの演奏が特徴で、メロディー楽器の動きに対してカウンターメロディーを奏でる役割も担う。カバキーニョはコードのリズムを刻み、パンデイロは手のひらや指先を使った多彩な奏法でポリリズム的なグルーヴを生み出す。

リズムは2拍子系が基本で、テンポは毎分120〜160拍程度が多い。16分音符を細かく刻むシンコペーションが随所に現れ、強拍と弱拍の関係が絶えず揺さぶられる。これはアフリカ系の音楽的感覚に由来するもので、「ゴスト・ノート」と呼ばれる微妙なアクセントの移動が演奏者の個性を際立たせる。

曲の構成はロンド形式（A-B-A-C-A など）が典型的で、各セクションは16小節または32小節で構成されることが多い。即興はジャズほど自由ではなく、メロディーの装飾（オルナメンテーション）として行われる。音響的にはアコースティックが基本で、エフェクト類は使用しない。演奏は屋外の広場、カフェ、私的な集まり（ロダ・ジ・ショーロ）で行われることが多く、聴衆と演奏者が同じ空間を共有するインフォーマルな雰囲気が特徴だ。ボーカルは基本的に存在せず、純粋なインストゥルメンタル音楽として成立している点でサンバやボサノヴァと明確に異なる。ボサノヴァが洗練されたコード感とボーカルを前面に出すのに対し、ショーロは器楽の技巧と即興的な対話を最大の聴かせどころとする。</p>
<h2>成り立ち</h2><p>ショーロの歴史は19世紀後半のリオデジャネイロに始まる。1870年代、ブラジルの首都リオには、ポルトガルからもたらされたポルカ、マズルカ、ショティッシュ、ワルツといったヨーロッパの舞踏音楽が流行していた。これらをブラジルの音楽家たちが演奏するうちに、アフリカ系ブラジル人のリズム感覚——シンコペーションや複合的なポリリズム——が自然に混入し、独自の音楽スタイルが形成されていった。

このジャンルの父と呼ばれるのがフルート奏者のジョアキン・アントニオ・ダ・シルヴァ・カラード（通称カラード・ジュニア、1848–1880）だ。彼は1870年代に「Choro do Callado」というアンサンブルを結成し、ショーロの形式確立に大きく貢献したフルーティスト・作曲家として音楽史に刻まれている。また、シキーニャ・ゴンザーガやエルネスト・ナザレーもこの時代のショーロ発展を牽引した重要人物だ。エルネスト・ナザレーの作品「Odeon」（1910年）はショーロの古典として今日も演奏され続けている。

しかし、ショーロの歴史において最大の巨人はエルネスト・ナザレーとシキーニャ・ゴンザーガだ。ナザレーは1863年生まれのピアニスト・作曲家で、ヨーロッパのサロン音楽とブラジルのリズムを高度に融合させた作品を多数残した。シキーニャ・ゴンザーガは女性作曲家・ピアニストとして当時の社会的偏見に抗いながら活躍し、1899年にブラジル初のカーニバル音楽「Ó Abre Alas」を作曲したことでも知られる。

20世紀初頭、ショーロは「ショーリーニョ」と呼ばれる小規模な演奏グループによって広まった。この時代に登場したのが、ショーロ史上最大の天才と称されるマンドリン奏者のジャコブ・ド・バンドリン（本名ジャコブ・ピック・ビッテンクール、1918年生まれ）だ。彼は超絶技巧と豊かな音楽性でショーロを芸術的な高みへと引き上げ、「Noites Cariocas」（1957年）などの名作を残した。

1930〜40年代にはサンバが国民的音楽として台頭し、ショーロは一時的に大衆の関心から遠ざかった。ラジオ放送の普及とともにサンバやボレロが主流となり、ショーロは「古い音楽」として扱われる時期が続いた。しかし1970年代、ブラジルの軍事独裁政権下で民族文化の再評価が起きる中、ショーロは復興運動（ルネサンス）を迎えた。パウリーニョ・ダ・ヴィオラらが中心となってショーロの復興を牽引し、若い世代への普及活動を展開した。フルーティストのアルタミロ・カリーリョもこの時代に活躍した重要な奏者だ。

この復興期に登場したのが、現代ショーロを世界に知らしめたギタリスト・ピアニスト・作曲家のエグベルト・ジスモンチと、7弦ギタリストのジノ・7コルダス（本名ホロニアス・ジ・ソウザ・ライス）だ。また、ショーロとジャズを融合させたアプローチを試みたアルトゥール・モレイラ・リマらも重要な役割を果たした。ギタリストのラファエル・ラベロは1976年に若手グループ「Os Carioquinhas」の14歳のメンバーとして復興運動に参加し、その卓越した才能で注目を集め、主に1980〜90年代にかけてショーロ界を代表する奏者として活躍した。

現在、ショーロはブラジル国内で「ロダ・ジ・ショーロ」と呼ばれる即興的な演奏集会を通じて生き続けており、リオデジャネイロやサンパウロの音楽学校でも正式に教えられている。ボサノヴァやMPB（ムジカ・ポプラール・ブラジレイラ）への影響も大きく、アントニオ・カルロス・ジョビンもショーロの和声語法を吸収した作曲家の一人だ。国際的にも評価が高まっており、ヨーロッパや日本でもショーロ専門の演奏グループが活動している。</p>
