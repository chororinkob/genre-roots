<h1>Choro（ショーロ）とは</h1>
<p>ショーロは、ブラジル固有のインストゥルメンタル音楽だ。ヨーロッパの舞踏音楽と、アフリカ系ブラジル人のリズム感覚が融け合って生まれた。複雑で、即興の要素が強いジャンルである。 中心になる楽器は、7弦ギター（セッチコルダス）、カバキー</p>
<p>ショーロは、ブラジル固有のインストゥルメンタル音楽だ。ヨーロッパの舞踏音楽と、アフリカ系ブラジル人のリズム感覚が融け合って生まれた。複雑で、即興の要素が強いジャンルである。

中心になる楽器は、7弦ギター（セッチコルダス）、カバキーニョ（小型の4弦ギター）、パンデイロ（タンバリン型打楽器）、フルート、クラリネット、バンドリン（マンドリンに似た8弦楽器）だ。7弦ギターは、低音弦でベースの線を弾くのが特徴で、メロディー楽器の動きに合わせてカウンターメロディーも奏でる。カバキーニョはコードのリズムを刻む。パンデイロは、手のひらや指先を使った多彩な奏法で、いくつものリズムが重なり合うノリを生む。

メロディーはとても装飾が多い。和声は、ヨーロッパのクラシック音楽に近い機能和声（和音どうしの役割で進行が決まる、クラシックの和声）を土台にしている。そのうえで属7和音を多く使い、転調も頻繁に行われる。音階はメジャーとマイナーが基本だ。

リズムは2拍子系が基本で、テンポは速く陽気な曲が多い。16分音符を細かく刻むシンコペーションがあちこちに現れ、強い拍と弱い拍の関係が絶えず揺さぶられる。これはアフリカ系の音楽的な感覚に由来するとされる。

器楽が中心で、歌詞付きの曲もある。ボサノヴァが洗練されたコード感と歌を前に出すのに対し、ショーロは楽器の技巧と、即興のかけ合いを一番の聴かせどころとする。

曲は3つの部分（A・B・C）からなる。3部のロンド形式（A-B-A-C-A）が原型で、くり返しを含めた演奏順はAABBACCAとなる。各部は16小節と言われることが多いが、実際の曲では32小節など、長さはさまざまだ。即興はジャズほど自由ではなく、メロディーの飾り（オルナメンテーション）として行われる。音はアコースティックが基本で、エフェクトは使わない。

演奏は、屋外の広場やカフェ、私的な集まり（ロダ・ジ・ショーロ）で行われることが多い。聴き手と演奏者が同じ場にいる、くだけた雰囲気が特徴だ。</p>
<h2>成り立ち</h2><p>ショーロが始まったのは、19世紀後半のリオデジャネイロだ。

19世紀半ば、ブラジルの首都リオでは、ヨーロッパの舞踏音楽が流行していた。ポルカ（ボヘミア生まれの舞曲で、1845年ごろにリオへ伝わった。1844〜46年説もある）、マズルカ、ショティッシュ、ワルツなどだ。ブラジルの音楽家たちがこれらを演奏するうちに、アフリカ系ブラジル人のリズム感覚が自然に混ざり込んだ。シンコペーションや、いくつも重なるポリリズムである。こうして、独自の音楽スタイルができあがっていった。

このジャンルの父と呼ばれるのが、フルート奏者のジョアキン・アントニオ・ダ・シルヴァ・カラード（通称カラード・ジュニア、1848–1880）だ。彼は1870年ごろ、「Choro Carioca」（通称Choro do Callado）という合奏団を結成し、最初期のショーロ合奏団を組織した。ジャンルの創始者の一人とされるフルート奏者・作曲家として、音楽史に名を残している。

また、シキーニャ・ゴンザーガは初期の作品群で、エルネスト・ナザレーはショーロの前身となるブラジル風タンゴで、その土台を築いた。エルネスト・ナザレーの作品「Odeon」（1909〜10年ごろ）は、ショーロの前身とされるブラジル風タンゴの代表作だ。今日もショーロの演奏会やロダ・ジ・ショーロで取り上げられる。

しかし、ショーロというジャンルの形を固め、集大成を担ったとされるのは、ピシンギーニャ（Pixinguinha）である。ナザレーの作品は、ショーロの前身とされるブラジル風タンゴとして知られる。ナザレーは1863年生まれのピアニスト・作曲家だ。ヨーロッパのサロン音楽とブラジルのリズムを高い水準で融け合わせた作品を、数多く残した。シキーニャ・ゴンザーガは女性の作曲家・ピアニストで、当時の社会の偏見に立ち向かいながら活躍した。1899年には、ブラジル初のカーニバル行進曲（マルシャ）とされる「Ó Abre Alas」を作曲したことでも知られる。

ショーロの合奏団は「ヘジオナル（regional）」と呼ばれる。「ショリーニョ」はショーロの愛称で、「小さな嘆き」という意味だ。20世紀半ば（1940〜60年代）に活躍したのが、ショーロを代表するマンドリン奏者、ジャコブ・ド・バンドリン（本名ジャコブ・ピック・ビッテンクール、1918年生まれ）だ。彼は超絶技巧と豊かな音楽性で、ショーロを芸術の高みへ引き上げた。「Noites Cariocas」（1957年）などの名作も残している。

1930〜40年代のショーロは、むしろ活気にあふれていた。1947年に作曲され、1949年に発売された「Brasileirinho」は国内で大ヒットし、のちに世界中で演奏・カバーされた。しかし1950〜60年代にボサノヴァが人気を集めると、ショーロは人気を落とした。「古い音楽」として扱われる時期が続いた。

1970年代になると、ショーロは復興運動（ルネサンス）を迎えた。1973年のショー『Sarau』などがきっかけとなり、パウリーニョ・ダ・ヴィオラらが若い世代への普及活動を広げた。フルート奏者のアルタミロ・カリーリョも、この時代に活躍した重要な奏者だ。

7弦ギタリストのディノ・7コルダス（本名ホロンジーノ・ジョゼ・ダ・シルヴァ、1918〜2006年）は、1930年代後半から活動していた。ギタリスト・ピアニスト・作曲家のエグベルト・ジスモンチは、ショーロ作品も手がける。ただし主な活動は、ブラジル音楽・ジャズ・現代音楽にまたがる。アルトゥール・モレイラ・リマは、ショパンの解釈で知られるクラシックのピアニストで、ナザレーやショーロの作品も録音している。

ギタリストのラファエル・ラベロは、1975〜76年ごろ、12〜14歳のころに、姉らと若手グループ「Os Carioquinhas」を結成し、復興運動に加わった。卓越した才能で注目を集め、主に1980〜90年代にかけて、ショーロ界を代表する奏者として活躍した。

今もショーロは、ブラジル国内で「ロダ・ジ・ショーロ」と呼ばれるくだけた合奏の集まりを通じて生き続けている。リオデジャネイロやサンパウロの音楽学校でも、正式に教えられている。ボサノヴァやMPB（ムジカ・ポプラール・ブラジレイラ）への影響も大きく、アントニオ・カルロス・ジョビンもショーロの伝統と深い縁がある。国際的な評価も高まり、ヨーロッパや日本でもショーロ専門の演奏グループが活動している。</p>
