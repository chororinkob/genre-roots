<h1>Choro（ショーロ）とは</h1>
<p>ショーロはブラジル固有のインストゥルメンタル音楽であり、ヨーロッパの舞踏音楽とアフリカ系ブラジル人のリズム感覚が融合して生まれた複雑かつ即興性の高いジャンルだ。メロディーは非常に装飾的で、クロマティックな経過音や半音階的な動きが多</p>
<p>ショーロはブラジル固有のインストゥルメンタル音楽であり、ヨーロッパの舞踏音楽とアフリカ系ブラジル人のリズム感覚が融合して生まれた複雑かつ即興性の高いジャンルだ。メロディーは非常に装飾的で、クロマティックな経過音や半音階的な動きが多用される。和声はヨーロッパのクラシック音楽に近い機能和声を基盤としながら、属7和音や減7和音を多用し、転調も頻繁に行われる。音階はメジャー・マイナーを基本とする。

使用楽器は7弦ギター（セッチコルダス）、カバキーニョ（小型の4弦ギター）、パンデイロ（タンバリン型打楽器）、フルート、クラリネット、バンドリン（マンドリンに似た8弦楽器）が中心だ。7弦ギターは低音弦を使ったバス・ラインの演奏が特徴で、メロディー楽器の動きに対してカウンターメロディーを奏でる役割も担う。カバキーニョはコードのリズムを刻み、パンデイロは手のひらや指先を使った多彩な奏法でポリリズム的なグルーヴを生み出す。

リズムは2拍子系が基本で、テンポは速く陽気なものが多い。16分音符を細かく刻むシンコペーションが随所に現れ、強拍と弱拍の関係が絶えず揺さぶられる。これはアフリカ系の音楽的感覚に由来するとされる。また、「ゴスト・ノート」と呼ばれる、音の高さがはっきりしない、またはごく弱く弾く音が、リズムに細かな表情を加える。

曲の構成は、16小節の3つの部分（A・B・C）をAABBACCAの順に演奏するロンド形式が標準的で、ABACAの短縮形もある。即興はジャズほど自由ではなく、メロディーの装飾（オルナメンテーション）として行われる。音響的にはアコースティックが基本で、エフェクト類は使用しない。演奏は屋外の広場、カフェ、私的な集まり（ロダ・ジ・ショーロ）で行われることが多く、聴衆と演奏者が同じ空間を共有するインフォーマルな雰囲気が特徴だ。ボーカルは基本的に存在せず（歌詞付きの例外もある）、純粋なインストゥルメンタル音楽として成立している点でサンバやボサノヴァと明確に異なる。ボサノヴァが洗練されたコード感とボーカルを前面に出すのに対し、ショーロは器楽の技巧と即興的な対話を最大の聴かせどころとする。</p>
<h2>成り立ち</h2><p>ショーロの歴史は19世紀後半のリオデジャネイロに始まる。19世紀半ば、ブラジルの首都リオには、ポルカ（ボヘミア生まれの舞曲で、1844〜45年にリオへ伝わった）、マズルカ、ショティッシュ、ワルツといったヨーロッパの舞踏音楽が流行していた。これらをブラジルの音楽家たちが演奏するうちに、アフリカ系ブラジル人のリズム感覚——シンコペーションや複合的なポリリズム——が自然に混入し、独自の音楽スタイルが形成されていった。

このジャンルの父と呼ばれるのがフルート奏者のジョアキン・アントニオ・ダ・シルヴァ・カラード（通称カラード・ジュニア、1848–1880）だ。彼は1870年代に「Choro do Callado」というアンサンブルを結成し、最初期のショーロ合奏団を組織し、ジャンルの創始者の一人とされるフルーティスト・作曲家として音楽史に刻まれている。また、シキーニャ・ゴンザーガやエルネスト・ナザレーもこの時代のショーロ発展を牽引した重要人物だ。エルネスト・ナザレーの作品「Odeon」（1909年）はショーロの古典として今日も演奏され続けている。

しかし、ショーロというジャンルの確立と集大成を担ったとされるのは、ピシンギーニャ（Pixinguinha）である。ナザレーの作品は、ショーロの前身とされるブラジル風タンゴとして知られる。ナザレーは1863年生まれのピアニスト・作曲家で、ヨーロッパのサロン音楽とブラジルのリズムを高度に融合させた作品を多数残した。シキーニャ・ゴンザーガは女性作曲家・ピアニストとして当時の社会的偏見に抗いながら活躍し、1899年にブラジル初のカーニバル行進曲（マルシャ）とされる「Ó Abre Alas」を作曲したことでも知られる。

ショーロの合奏団は「ヘジオナル（regional）」と呼ばれる。「ショリーニョ」はショーロの愛称で、「小さな嘆き」を意味する。20世紀半ば（1940〜60年代）に活躍したのが、ショーロを代表するマンドリン奏者のジャコブ・ド・バンドリン（本名ジャコブ・ピック・ビッテンクール、1918年生まれ）だ。彼は超絶技巧と豊かな音楽性でショーロを芸術的な高みへと引き上げ、「Noites Cariocas」（1957年）などの名作を残した。

1930〜40年代のショーロはむしろ活況で、1949年には「Brasileirinho」が国内外で大ヒットした。しかし1950〜60年代にボサノヴァが台頭すると、ショーロは人気を落とし、「古い音楽」として扱われる時期が続いた。1970年代になると、ショーロは復興運動（ルネサンス）を迎えた。パウリーニョ・ダ・ヴィオラらが中心となってショーロの復興を牽引し、若い世代への普及活動を展開した。フルーティストのアルタミロ・カリーリョもこの時代に活躍した重要な奏者だ。

7弦ギタリストのディノ・7コルダス（本名ホロンジーノ・ジョゼ・ダ・シルヴァ、1918〜2006年）は、1930年代後半から活動していた。ギタリスト・ピアニスト・作曲家のエグベルト・ジスモンチは、ショーロ作品も手がけるが、主な活動はブラジル音楽・ジャズ・現代音楽にまたがる。アルトゥール・モレイラ・リマは、ショパン解釈で知られるクラシックのピアニストで、ナザレーやショーロの作品も録音している。ギタリストのラファエル・ラベロは1976年、13〜14歳のころに姉らと若手グループ「Os Carioquinhas」を結成して復興運動に参加し、その卓越した才能で注目を集め、主に1980〜90年代にかけてショーロ界を代表する奏者として活躍した。

現在、ショーロはブラジル国内で「ロダ・ジ・ショーロ」と呼ばれる即興的な演奏集会を通じて生き続けており、リオデジャネイロやサンパウロの音楽学校でも正式に教えられている。ボサノヴァやMPB（ムジカ・ポプラール・ブラジレイラ）への影響も大きく、アントニオ・カルロス・ジョビンもショーロの和声語法を吸収した作曲家の一人だ。国際的にも評価が高まっており、ヨーロッパや日本でもショーロ専門の演奏グループが活動している。</p>
