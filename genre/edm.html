<h1>EDM（エレクトロニックダンスミュージック）とは</h1>
<p>2010年前後から北米を中心に大衆化した、ダンス音楽の総称だ。米国の音楽産業と音楽メディアが、米国のレイヴ文化を再ブランドするために押し出した呼び名である。このうちビッグルームは、フェス会場向けに設計された。 音の土台はシンセサイ</p>
<p>2010年前後から北米を中心に大衆化した、ダンス音楽の総称だ。米国の音楽産業と音楽メディアが、米国のレイヴ文化を再ブランドするために押し出した呼び名である。このうちビッグルームは、フェス会場向けに設計された。

音の土台はシンセサイザーと、音を加工する技術だ。サイドチェイン・コンプレッサーを使うと、キックが鳴るたびに、ほかの音が凹む。この「ポンピング」と呼ばれる効果が、音の土台を作る。ドロップの音色にも違いがあり、鋸波の分厚いリードならビッグルーム、うねる低音ならダブステップ寄り、ハイハットの連打が細かければトラップ寄りとなる。

ビッグルームでは、旋律が単純でミニマルだ。4コード循環は多く見られるが、全体には当てはまらない。

テンポ（BPM）は、ハウス系で128前後が中心だ。ただし、細かいスタイルによって幅がある。ハウス系とビッグルーム系では、四つ打ちが基本になる。ダブステップやトラップは、ハーフタイムだ。

歌が入る曲もある。ボーカル曲には、ヴァースとコーラスを備えた歌ものも多い。短いフックだけとは限らない。

曲の組み立てには、型がある。ビッグルームなどでは、導入から始まり、ビルドアップに進む。ビルドアップは、スネアの連打を徐々に速め、ホワイトノイズの上昇音とピッチの上がるシンセを重ねて、緊張を極大化する区間だ。その頂点で、全ての音が一瞬消える無音が来る。そして「ドロップ」で、最も派手な部分が解放される。このビルドアップからドロップまでを、2回程度繰り返す型が典型だ。ドロップの音色に加え、テンポとリズムの型でも、細かいスタイルは分かれる。

仕上げでは、音圧を最大まで押し上げるマスタリングが施される。屋外の巨大スピーカー、照明、放水、花火といった演出と同期することを前提に、作られている。</p>
<h2>成り立ち</h2><p>「エレクトロニック・ダンス・ミュージック」という語自体は、1980年代から存在した。しかし、現在の意味での用法が広まったのは、2010年代初頭だ。北米の音楽産業が、既存のハウス、トランス、ダブステップなどを一括して売り出すために、マーケティング用語として採用したのである。

欧州の大型イベントは、影響を与えた可能性がある。ただ、米国側にもEDCなどの既存の土台があった。欧州ブランドの本格的な米国展開は、大衆化の後である。

米国での拡大を牽引した代表的なフェスの一つが、Electric Daisy Carnivalだ。ロサンゼルスのプロモーターInsomniac Eventsを率いるPasquale Rotellaが開催した。2010年のロサンゼルス開催には、主催者発表で2日間延べ約18.5万人が集まった。しかし、15歳の少女が薬物摂取により死亡する事故が起き、翌2011年にラスベガスへ移転した。この事件は、大規模レイヴ／フェスにおける薬物問題を語るときの代表的な例となった。

音楽の面で決定的だったのは、フランスのDavid Guettaだ。2009〜10年に、Kelly Rowland、Akonらとのシングルで米ヒットを重ねた。The Black Eyed Peasの『I Gotta Feeling』のプロデュースでも、成功を収めた。続いて、スウェーデンのSwedish House Mafia（Axwell、Steve Angello、Sebastian Ingrosso）、オランダのAfrojack、Hardwell、Martin Garrix、そして米国のSkrillexが、それぞれ異なる音の個性で、この流れを拡大した。

産業のしくみも変わった。2000年代から、SiriusとXM（のちのSiriusXM）には、電子音楽の専門チャンネルがあった。2012年には、Tiësto専用チャンネルが開設された。報道では、ナイトクラブ運営会社との複数年の居住公演契約で、1公演あたり約40万ドル（Calvin Harrisの場合）という例もある。こうして、産業構造そのものが変わった。

一方で、批判も強かった。DJがあらかじめ用意した音源を再生するだけの「プレイボタン押し」問題、楽曲構造の均質化、チケット価格の高騰、そして薬物関連の死亡事故が、しばしば議論されたとされる。

2015〜16年にかけて、フェス市場は飽和した。より柔らかいフューチャー・ベースやトロピカル・ハウス、あるいはテクノへ戻る動きへと、関心が分散した。それでも、産業としての規模は維持されている。</p>
