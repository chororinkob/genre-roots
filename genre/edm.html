<h1>EDM（エレクトロニックダンスミュージック）とは</h1>
<p>2010年前後から北米を中心に大衆化した、フェスの大舞台で鳴らすことを前提に設計されたダンス音楽の総称。BPMは128前後が標準で、徹底した四つ打ちのキックと、サイドチェイン・コンプレッサーによってキックが鳴るたび他の音が凹む「ポ</p>
<p>2010年前後から北米を中心に大衆化した、フェスの大舞台で鳴らすことを前提に設計されたダンス音楽の総称。BPMは128前後が標準で、徹底した四つ打ちのキックと、サイドチェイン・コンプレッサーによってキックが鳴るたび他の音が凹む「ポンピング」効果が土台を作る。構造は極端に定型化しており、導入から始まり、ビルドアップ（スネアの連打を徐々に速め、ホワイトノイズの上昇音とピッチの上がるシンセを重ねて緊張を極大化する区間）、その頂点で全ての音が一瞬消える無音、そして「ドロップ」で最も派手な部分が解放される、という流れを曲ごとに一度から二度繰り返す。ドロップの中身によって細かい下位様式が分かれ、鋸波の分厚いリードならビッグルーム、うねる低音ならダブステップ寄り、ハイハットの連打が細かければトラップ寄りとなる。和声は長調あるいは短調の単純な四和音循環で、旋律は口ずさめる範囲に抑えられる。歌が入る場合は感情を高ぶらせる短いフックのみ。音圧を最大まで押し上げるマスタリングが施され、屋外の巨大スピーカー、照明、放水、花火といった演出と同期することを前提に作られている。</p>
<h2>成り立ち</h2><p>「エレクトロニック・ダンス・ミュージック」という語自体は1980年代から存在したが、現在の意味での用法は2009年から2012年頃、北米の音楽産業が既存のハウス、トランス、ダブステップなどを一括して売り出すために採用したマーケティング用語として広まった。土壌を作ったのは、2000年代を通じてヨーロッパで巨大化したフェス、とりわけベルギーのTomorrowland（2005年開始）とオランダのSensation で、これらが提示した大規模な演出と観客動員の手法が北米に持ち込まれた。米国側の起点は、ロサンゼルスのプロモーターInsomniac Events を率いるPasquale Rotella が開催したElectric Daisy Carnival で、2010年のロサンゼルス開催で約18万人を集めたが、15歳の少女が薬物摂取により死亡する事故が起き、翌年ラスベガスへ移転を余儀なくされた。この事件は、ジャンルの急拡大と薬物問題が切り離せないことを早い段階で露呈させた。音楽面では、フランスのDavid Guetta が2009年のアルバムOne Love でAkon やThe Black Eyed Peas といった米国のポップ／ヒップホップ勢と組み、ダンス音楽をビルボードの主流に押し上げたことが決定的だった。続いてスウェーデンのSwedish House Mafia（Axwell、Steve Angello、Sebastian Ingrosso）、オランダのAfrojack、Hardwell、Martin Garrix、そして米国のSkrillex が、それぞれ異なる音の個性でこの流れを拡大した。2012年にはSiriusXM が専門チャンネルを設け、ラスベガスの大手カジノがDJに年間数千万ドル規模の契約を提示するなど、産業構造そのものが変わった。批判も強く、DJがあらかじめ用意した音源を再生するだけの「プレイボタン押し」問題、楽曲構造の均質化、チケット価格の高騰、そして薬物関連の死亡事故が繰り返し議論された。2016年前後にはフェス市場が飽和し、より柔らかいフューチャー・ベースやトロピカル・ハウス、あるいはテクノ回帰へと関心が分散したが、産業としての規模は維持されている。</p>
