<h1>EDM（エレクトロニックダンスミュージック）とは</h1>
<p>2010年前後から北米を中心に大衆化した、米国の音楽産業が、既存のハウス、トランス、ダブステップなどを一括して売り出すために押し出したダンス音楽の総称。このうちビッグルームはフェスの会場向けに設計された。BPMはハウス系で128前</p>
<p>2010年前後から北米を中心に大衆化した、米国の音楽産業が、既存のハウス、トランス、ダブステップなどを一括して売り出すために押し出したダンス音楽の総称。このうちビッグルームはフェスの会場向けに設計された。BPMはハウス系で128前後が中心で（下位様式では幅がある）、ハウス系では四つ打ちのキック（ダブステップやトラップはハーフタイムの型）と、サイドチェイン・コンプレッサーによってキックが鳴るたび他の音が凹む「ポンピング」効果が土台を作る。構造は、ビッグルームなどでは典型的に、導入から始まり、ビルドアップ（スネアの連打を徐々に速め、ホワイトノイズの上昇音とピッチの上がるシンセを重ねて緊張を極大化する区間）、その頂点で音が一瞬途切れる無音、そして「ドロップ」で最も派手な部分が解放される、という流れを曲ごとに2回程度繰り返す型が多い。ドロップの音色に加え、テンポとリズムの型でも細かい下位様式が分かれ、鋸波の分厚いリードならビッグルーム、うねる低音ならダブステップ寄り、ハイハットの連打が細かければトラップ寄りとなる。ビッグルームでは旋律が単純でミニマルで、口ずさめる範囲に抑えられ、4コードの循環も多く見られる。歌が入る場合は、短いフックだけのこともあれば、ヴァースとコーラスを備えた歌ものも多い。音圧を最大まで押し上げるマスタリングが施され、ビッグルームなど、大きな会場で鳴らすことを前提にした曲も多い。</p>
<h2>成り立ち</h2><p>「エレクトロニック・ダンス・ミュージック」という語自体は1980年代から存在したが、現在の意味での用法は2010年代初頭、北米の音楽産業が既存のハウス、トランス、ダブステップなどを一括して売り出すために採用したマーケティング用語として広まった。背景には、2000年代を通じてヨーロッパで巨大化した大型イベント、とりわけベルギーのTomorrowland（2005年開始）やオランダの屋内イベントSensationがあるが、米国側にもElectric Daisy Carnivalのような既存の基盤があった。欧州ブランドの本格的な米国展開は、大衆化の後だった。米国での拡大を牽引した代表的フェスの一つは、ロサンゼルスのプロモーターInsomniac Events を率いるPasquale Rotella が開催したElectric Daisy Carnival で、2010年のロサンゼルス開催で主催者発表の約18万人（2日間の延べ人数）を集めたが、15歳の少女が薬物摂取により死亡する事故が起き、翌2011年にラスベガスへ移転した。この事件は、ジャンルの急拡大と薬物問題が切り離せないことを早い段階で露呈させた。音楽面では、フランスのDavid Guetta が2009年のアルバムOne Love でAkon やThe Black Eyed Peas といった米国のポップ／ヒップホップ勢と組み、ダンス音楽をビルボードの主流に押し上げたことが決定的だった。続いてスウェーデンのSwedish House Mafia（Axwell、Steve Angello、Sebastian Ingrosso）、オランダのAfrojack、Hardwell、Martin Garrix、そして米国のSkrillex が、それぞれ異なる音の個性でこの流れを拡大した。2000年代からSiriusとXM（のちのSiriusXM）に電子音楽の専門チャンネルがあり、2010年代のブームでさらに拡充され、報道ベースで（噂を含め）、ラスベガスの大手カジノがDJに年間数千万ドル規模の契約を提示するなど、産業構造そのものが変わった。批判も強く、DJがあらかじめ用意した音源を再生するだけの「プレイボタン押し」問題、楽曲構造の均質化、チケット価格の高騰、そして薬物関連の死亡事故が繰り返し議論された。2016年前後にはフェス市場が飽和し、より柔らかいフューチャー・ベースやトロピカル・ハウス、あるいはテクノ回帰へと関心が分散したが、産業としての規模は維持されている。</p>
