<h1>Chiptune（チップチューン）とは</h1>
<p>家庭用ゲーム機や初期のパソコンに搭載された音源チップの、極端に限られた発音能力を前提として作られる音楽。代表的な例の一つはファミリーコンピュータの音源で、矩形波（角張った波形）が二系統、三角波（山形の波形）が一系統、ノイズが一系統</p>
<p>家庭用ゲーム機や初期のパソコンに搭載された音源チップの、極端に限られた発音能力を前提として作られる音楽。代表的な例の一つはファミリーコンピュータの音源で、矩形波（角張った波形）が二系統、三角波（山形の波形）が一系統、ノイズが一系統、そして短いサンプル再生が一系統という五つの発音枠しかない。この制約下で和音、旋律、ベース、打楽器の全てを賄う必要があるため、独特の作曲技法が発達した。代表的なのがアルペジオ（和音の音を一つずつ順に鳴らす奏法）で、和音を同時に鳴らせない代わりに構成音を1秒間に数十回の速さで順に切り替え、耳が一つの和音のようにまとめて聴くことで和音に聴こえさせる。これは、同時発音数が少ない中で和音を表現するための手法で、チップチューンの特徴の一つである。打楽器は主にノイズ音源の音量を瞬時に絞ることで再現されるが、三角波やサンプル再生を使う例もあり、ベースは三角波が担う。矩形波はデューティ比（波形の上下の比率）を変えることで音色を変化させ、細い音から太い音まで作り分ける。ビブラート（音の揺らし）やピッチ（音の高さ）の微細な上下を打ち込みで書き込むことで表情を付ける手法も定番。BPM（1分間の拍数）や拍子は自由だが、限られた発音数のため音を詰め込みすぎず、旋律線の明快さが最重要となる。制約が様式そのものを規定している音楽である。</p>
<h2>成り立ち</h2><p>起源は、諸説あるが1970年代後半〜1980年代初頭の、日本を中心としたアーケードゲームの音楽にあるとされ（ゲーム内の連続した背景音楽を最初に使ったとされるのは1978年のSpace Invadersなど）、1970年代後半にはゲーム機と家庭用コンピュータにも音源チップが載り、1980年代前半に普及した。イギリスのSinclair ZX Spectrum（初代は音源チップを持たずビープ音1音のみで、3音のチップが載ったのは1985年（スペイン。英国は1986年）のZX Spectrum 128から）、米国のCommodore 64、そして日本の任天堂のファミリーコンピュータが、それぞれ独自の音源を備えていた。とりわけCommodore 64に搭載されたSIDチップは、フィルターと4種類の波形（三角波、のこぎり波、パルス波、ノイズ）を持ち（同時に鳴らせるのは3音）、当時としては表現力が高く、Rob HubbardやMartin Galwayといったプログラマー兼作曲家が高度な作品を残した。日本では、ファミコンの音源を用いて近藤浩治がスーパーマリオブラザーズ（1985年）の音楽を、すぎやまこういちがドラゴンクエスト（1986年）の音楽を書き、限られた発音数の中で記憶に残る旋律を作る技術が磨かれた。デモシーン（プログラミング技術を見せ合う文化）と呼ばれる、プログラミング技術を競う地下文化は、1980年代初頭の家庭用コンピュータとクラッキング（コピー防止を破る行為）文化から生まれ、ヨーロッパを中心に発達した。そこでトラッカーと呼ばれる縦書きの音楽制作ソフトが使われ、1989年にはトラッカーによる最初期とされるチップチューンが現れ、1990年代に普及が進んだ。Amigaで生まれたトラッカー形式は、PCではScream Tracker、FastTracker、Impulse Trackerなどに展開し、電子音楽制作の広がりを後押しした。1980年代以降に人気が衰えたあと、1990年代末に再び人気が出る動きが生まれた。ゲームボーイを楽器にするライブ文化は、2000年前後に登場したゲームボーイ用ソフトLittle Sound Dj（スウェーデンのJohan Kotlinskiが開発）とNanoloopが、2000年代半ば以降に支えた。これにより実機を楽器として演奏することが可能になり、ニューヨークを中心にライブ演奏の文化が広がった。Blip Festival（2006年開始）といったイベントが国際的な交流の場となり、Anamanaguchi、Nullsleep、Bit Shifterらが代表的な演奏者となった。現在は独立系ゲームの音楽として広く採用されるほか、制約のある音を意図的に選ぶ考え方として、ポップスや電子音楽にも取り込まれている。</p>
