<h1>Chiptune（チップチューン）とは</h1>
<p>家庭用ゲーム機や初期のパソコンに搭載された音源チップの、極端に限られた発音能力を前提として作られる音楽。中心となるのはファミリーコンピュータの音源で、矩形波が二系統、三角波が一系統、ノイズが一系統、そして短いサンプル再生が一系統と</p>
<p>家庭用ゲーム機や初期のパソコンに搭載された音源チップの、極端に限られた発音能力を前提として作られる音楽。中心となるのはファミリーコンピュータの音源で、矩形波が二系統、三角波が一系統、ノイズが一系統、そして短いサンプル再生が一系統という五つの発音枠しかない。この制約下で和音、旋律、ベース、打楽器の全てを賄う必要があるため、独特の作曲技法が発達した。代表的なのがアルペジオで、和音を同時に鳴らせない代わりに構成音を一秒間に数十回の速さで順に切り替え、耳の残像で和音に聴こえさせる。この高速の切り替えが、チップチューン特有の震えるような響きを生む。打楽器はノイズ音源の音量を瞬時に絞ることで再現され、ベースは三角波が担う。矩形波はデューティ比、すなわち波形の上下の比率を変えることで音色を変化させ、細い音から太い音まで作り分ける。ビブラートやピッチの微細な上下を打ち込みで書き込むことで表情を付ける手法も定番。BPMや拍子は自由だが、限られた発音数のため音を詰め込みすぎず、旋律線の明快さが最重要となる。制約が様式そのものを規定している稀な例である。</p>
<h2>成り立ち</h2><p>起源は1980年代初頭のゲーム機と家庭用コンピュータにある。イギリスのSinclair ZX Spectrum、米国のCommodore 64、そして日本の任天堂のファミリーコンピュータが、それぞれ独自の音源チップを備えていた。とりわけCommodore 64に搭載されたSIDチップは、フィルターと三種類の波形を持ち、当時としては表現力が高く、Rob HubbardやMartin Gallowayといったプログラマー兼作曲家が高度な作品を残した。日本では、ファミコンの音源を用いて近藤浩治がスーパーマリオブラザーズ（1985年）の音楽を、すぎやまこういちがドラゴンクエスト（1986年）の音楽を書き、限られた発音数の中で記憶に残る旋律を作る技術が磨かれた。1990年代に入ると、ヨーロッパを中心にデモシーンと呼ばれる、プログラミング技術を競う地下文化が発達し、そこでトラッカーと呼ばれる縦書きの音楽制作ソフトが普及した。Amiga用のSoundTrackerに始まるこの系譜は、後のFastTracker、Impulse Trackerへと続き、電子音楽制作の裾野を広げた。ゲーム音源そのものを使って音楽を作るという意識的な運動が生まれたのは2000年前後で、ゲームボーイ用ソフトLittle Sound Dj（スウェーデンのJohan Kotlinskiが開発）とNanoloopの登場が決定的だった。これにより実機を楽器として演奏することが可能になり、ニューヨークやストックホルムを中心にライブ演奏の文化、いわゆる8bitシーンが成立した。Blip Festival（2006年開始）といったイベントが国際的な交流の場となり、Anamanaguchi、Nullsleep、Bit Shifterらが代表的な演奏者となった。現在は独立系ゲームの音楽として広く採用されるほか、制約のある音を意図的に選ぶ美学として、ポップスや電子音楽にも取り込まれている。</p>
