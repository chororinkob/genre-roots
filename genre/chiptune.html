<h1>Chiptune（チップチューン）とは</h1>
<p>チップチューンは、家庭用ゲーム機や初期のパソコンに搭載された音源チップの、極端に限られた発音能力を前提として作られる音楽だ。 代表的な例の一つは、ファミリーコンピュータの音源だ。矩形波（角張った波形）が二系統、三角波（山形の波形）</p>
<p>チップチューンは、家庭用ゲーム機や初期のパソコンに搭載された音源チップの、極端に限られた発音能力を前提として作られる音楽だ。

代表的な例の一つは、ファミリーコンピュータの音源だ。矩形波（角張った波形）が二系統、三角波（山形の波形）が一系統、ノイズが一系統、そして短いサンプル再生が一系統という、五つの発音枠しかない。この制約下で、和音、旋律、ベース、打楽器の全てを賄う必要がある。そのため、独特の作曲技法が発達した。

代表的なのがアルペジオ（和音の音を一つずつ順に鳴らす奏法）だ。和音を同時に鳴らせない代わりに、構成音を1秒間に数十回の速さで順に切り替える。耳が一つの和音のようにまとめて聴く。この高速の切り替えは、同時発音数が少ない中で和音を表現するための手法である。

打楽器は、主にノイズ音源で作る。ただ、三角波やDPCMを使う例もある。ベースは三角波が担う。矩形波は、デューティ比（波形の上下の比率）を変えることで音色を変化させ、細い音から太い音まで作り分ける。

ビブラート（音の揺らし）やピッチ（音の高さ）の微細な上下を、打ち込みで書き込むことで表情を付ける手法も定番だ。

BPM（1分間の拍数）や拍子は自由だ。ただ、限られた発音数のため、音を詰め込みすぎない。旋律線の明快さが最重要となる。制約がスタイルそのものを規定している。</p>
<h2>成り立ち</h2><p>起源には諸説ある。1970年代後半〜1980年代初頭の、日本を中心としたアーケードゲームの音楽にあるとされる（Gun Fightが世界初のマイクロプロセッサ搭載アーケードゲーム。ゲーム内の連続BGMの最初は、Space Invaders(1978)やRally-X(1980)とされている）。

1970年代後半には、ゲーム機と家庭用コンピュータにも音源チップが載っていた。それが1980年代前半に普及した。イギリスのSinclair ZX Spectrum、米国のCommodore 64、そして日本の任天堂のファミリーコンピュータが、それぞれ独自の音源を備えていた。その初代は、音源チップを持たず、ビープ音1音のみだった。3音のチップが載ったのは、1985年（スペイン。英国は1986年）のZX Spectrum 128からである。

とりわけCommodore 64に搭載されたSIDチップは、当時としては表現力が高かった。フィルターと4種類の波形（三角波、のこぎり波、パルス波、ノイズ）を持つ（同時に鳴らせるのは3音）。Rob HubbardやMartin Galwayといったプログラマー兼作曲家が、高度な作品を残した。

日本では、ファミコンの音源を用いて、近藤浩治がスーパーマリオブラザーズ（1985年）の音楽を書いた。すぎやまこういちは、ドラゴンクエスト（1986年）の音楽を書いた。限られた発音数の中で記憶に残る旋律を作る技術が、磨かれた。

デモシーン（プログラミング技術を見せ合う文化）と呼ばれる、プログラミング技術を競う地下文化がある。1980年代初頭の家庭用コンピュータとクラッキング（コピー防止を破る行為）文化から生まれ、ヨーロッパを中心に発達した。そこで、トラッカーと呼ばれる縦書きの音楽制作ソフトが使われた。1989年にはトラッカーによる最初期とされるチップチューンが現れ、1990年代に普及が進んだ。

Amigaで生まれたトラッカー形式は、PCではScream Tracker、FastTracker 2、Impulse Trackerなどに展開した。電子音楽制作の広がりを後押しした。1990年代末には、再評価の動きが出た。

2000年前後に登場したゲームボーイ用ソフトLittle Sound Dj（スウェーデンのJohan Kotlinskiが開発）とNanoloopが、2000年代半ば以降のゲームボーイを楽器にするライブ文化を支えた。これにより、実機を楽器として演奏することが可能になった。ニューヨークを中心に、ライブ演奏の文化、いわゆる8bitの音楽のライブ文化が広がった。

Blip Festival（2006年開始）といったイベントが、国際的な交流の場となった。Anamanaguchi、Nullsleep、Bit Shifterらが、代表的な演奏者となった。

現在は、独立系ゲームの音楽として広く採用されている。制約のある音を意図的に選ぶ考え方として、ポップスや電子音楽にも取り込まれている。</p>
