<h1>Operetta（オペレッタ）とは</h1>
<p>オペレッタは、19世紀半ばのヨーロッパで定着した、軽やかで喜劇的な音楽劇だ。 オペラと同じく、管弦楽と歌手を用いる。ただし全編を歌で通さず、台詞による会話の場面が挟まれる。台詞はオペラ・コミックなどにも見られる特徴である。オペレッ</p>
<p>オペレッタは、19世紀半ばのヨーロッパで定着した、軽やかで喜劇的な音楽劇だ。

オペラと同じく、管弦楽と歌手を用いる。ただし全編を歌で通さず、台詞による会話の場面が挟まれる。台詞はオペラ・コミックなどにも見られる特徴である。オペレッタは、音楽・管弦楽の規模・上演時間のいずれも、オペラより軽い。編成は中規模の管弦楽で、弦とホルンの柔らかさに、木管の軽妙な合いの手が乗る。

音楽は、親しみやすさを最優先する。ワルツ、ポルカ、ギャロップ、マズルカ、カンカンといった同時代の舞曲のリズムや形式が取り入れられる。旋律は、一度聴けば口ずさめる明快さで書かれる。和声は基本的に平明なものが中心だが、20世紀にはジャズなどの語法も取り入れられた。

歌唱は、オペラほどの声量と技巧を必ずしも要求されない。言葉が明瞭に聞こえることが重んじられ、俳優としての演技力も問われることがある。

物語は、恋の取り違え、身分の入れ替わり、変装、誤解が積み重なる喜劇である。風刺的な作品が多い。

後年の大規模な作品では、終幕に合唱を置く例が多い。舞台には大人数の踊り手が加わり、視覚的な華やかさも売り物になる。主に、市民が気軽に通う商業劇場で上演された。</p>
<h2>成り立ち</h2><p>1850年前後、パリで、オペレッタは独立した形式として認められた。創始者をJacques OffenbachとするかHervéとするかは議論がある。Offenbachは、形式を磨き上げて発展させた人物とされる。

1855年、ドイツ生まれのユダヤ系作曲家Offenbachが、パリ万国博覧会の客を当て込んで、シャンゼリゼに小さな劇場Bouffes-Parisiensを開いた。当時のフランスでは、大きな歌劇場が国家的な特権を持っていた。小劇場は、興行許可の条件で出演人数が制限されていた。彼はその制約の中で、少人数の風刺的な音楽劇を作った。やがて規制が緩むと、1858年に『地獄のオルフェ』を発表する。ギリシャ神話を茶化し、第二帝政の社交界を風刺した作品だ。終幕の「地獄のギャロップ（Galop infernal）」は、のちの1890年代にムーラン・ルージュなどでカンカンの伴奏に使われ、世界中で知られる旋律となった。

彼は、本人の数え方では100以上、広義のオペレッタとしては約100作を書いた。『美しきエレーヌ』(1864)などで絶大な人気を得たが、帝政との結びつきとドイツ生まれのために、1870年に不評を買った。1871年末にパリへ戻り、1870年代後半には再評価された。Gaîté劇場の経営失敗（1874〜75年頃）で財政難に陥ったが、1876年の米国ツアーで損失を回復した。『ホフマン物語』は、未完のまま1880年に没した。

この形式は、ウィーンに渡り、独自の発展を遂げる。Johann Strauss IIは、1874年に『こうもり』を書いた。ワルツの魅力を全面に出した作風で、ウィーン・オペレッタの黄金期を代表する作品である。続くFranz Lehárは、1905年の『メリー・ウィドウ』で世界的な成功を収めた。この作品は各国で上演され、映画にもなった。

イギリスでは、GilbertとSullivanの組が、1870年代から90年代にかけて『ミカド』などを書いた。英語圏独自の伝統を作った組である。オペレッタに分類されることもあるが、作者側は「コミック・オペラ」と呼んでいた。

第一次世界大戦後も、1920〜30年代前半には、KálmánやLehár、Paul Abrahamが世界的な成功を収めた。しかし1930年代、ナチス政権がユダヤ系の作曲家や台本作家を排除した。多くの担い手が、亡命（国を追われて外国で暮らすこと）または殺害され、この迫害が衰退を決定づけたとされる。Emmerich Kálmánは亡命した。Paul Abrahamは、1946年に梅毒性の脳疾患による精神病を発症し、精神科施設に収容された。

その一方で、この形式は受け継がれてアメリカに渡り、ミュージカルへ流れ込んだ。Victor HerbertやSigmund Rombergを経て、ブロードウェイの音楽劇の基礎の一つとなった。</p>
<h2>代表曲</h2><ul><li>Orpheus in the Underworld（Jacques Offenbach）</li><li>Die Fledermaus（Johann Strauss II）</li><li>Lippen schweigen (André Rieu)</li><li>Ich bin die Christel von der Post (Lucia Popp)</li><li>The Mikado（Gilbert &amp; Sullivan）</li><li>Glitter and Be Gay (Barbara Cook)</li><li>Can-Can (Wiener Philharmoniker)</li><li>I Am the Very Model of a Modern Major-General (D'Oyly Carte Opera Company)</li><li>Der Zigeunerbaron Overture (Wiener Philharmoniker)</li><li>Dein ist mein ganzes Herz (Richard Tauber)</li><li>Three Little Maids from School (D'Oyly Carte Opera Company)</li></ul>
