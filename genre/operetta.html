<h1>Operetta（オペレッタ）とは</h1>
<p>19世紀半ばのヨーロッパで確立した、軽やかで喜劇的な音楽劇。オペラと同じく管弦楽と歌手を用いるが、全編を歌で通さず、台詞による会話の場面が挟まれる。台詞はオペラ・コミックなどにも見られる特徴で、オペレッタは音楽・管弦楽の規模・上演</p>
<p>19世紀半ばのヨーロッパで確立した、軽やかで喜劇的な音楽劇。オペラと同じく管弦楽と歌手を用いるが、全編を歌で通さず、台詞による会話の場面が挟まれる。台詞はオペラ・コミックなどにも見られる特徴で、オペレッタは音楽・管弦楽の規模・上演時間もオペラより軽い。音楽は親しみやすさを最優先し、ワルツ、ポルカ、ギャロップ、マズルカ、カンカンといった同時代の舞曲がそのまま用いられる。旋律は一度聴けば口ずさめる明快さで書かれ、和声も基本的な機能和声の範囲に収まる。歌唱はオペラほどの声量と技巧を必ずしも要求されず、言葉が明瞭に聞こえることが重んじられ、俳優としての演技力が同等に問われる。編成は中規模の管弦楽で、弦とホルンの柔らかさに、木管の軽妙な合いの手が乗る。曲の並びは序曲、独唱、二重唱、大人数の合唱で幕を閉じる型が多く、幕切れに盛り上がる大合唱を置く作品が多い。物語は恋の取り違え、身分の入れ替わり、変装、誤解が積み重なる喜劇で、権力者や社交界への痛烈な風刺が仕込まれることも多い。舞台には大人数の踊り手が加わり、視覚的な華やかさも売り物になる。上演の場は宮廷の劇場ではなく、市民が気軽に通う商業劇場である。</p>
<h2>成り立ち</h2><p>オペレッタは1850年前後にパリで独立した形式として認められた。創始者をJacques OffenbachとするかHervéとするかは議論があり、Offenbachは形式を洗練・発展させた人物とされる。1855年、ドイツ生まれのユダヤ系作曲家Offenbachが、パリ万国博覧会の客を当て込んでシャンゼリゼに小さな劇場Bouffes-Parisiensを開いた。当時のフランスでは、大きな歌劇場が国家的な特権を持ち、小劇場は登場人物の数まで法律で制限されていた。彼はその制約の中で、少人数の風刺的な音楽劇を作り、やがて規制が緩むと1858年に『地獄のオルフェ』を発表する。ギリシャ神話を茶化し、第二帝政の社交界を風刺したこの作品の終幕の「地獄のギャロップ（Galop infernal）」は、のちに1890年代にムーラン・ルージュなどでカンカンの伴奏に使われ、世界中で知られる旋律となった。彼は本人の数え方では100以上、オペレッタとしては約100作を書き、『美しきエレーヌ』(1864)などで絶大な人気を得たが、普仏戦争でドイツ出身であることを理由に排撃され、晩年は不遇だった。この形式はウィーンに渡り、独自の発展を遂げる。Johann Strauss IIが1874年に『こうもり』を書き、ワルツの魅力を全面に出した作風でウィーン・オペレッタの黄金期を開いた。続くFranz Lehárは1905年の『メリー・ウィドウ』で世界的な成功を収め、この作品は各国で上演され映画にもなった。イギリスではGilbertとSullivanの組が、1870年代から90年代にかけて『ミカド』などを書き、英語圏独自の伝統を作った。オペレッタに分類されることもあるが、作者側は「コミック・オペラ」と呼んでいた。第一次世界大戦後も、1920〜30年代前半にはKálmánやLehár、Paul Abrahamが世界的な成功を収めた。しかし1930年代、ナチス政権がユダヤ系の作曲家や台本作家を排除し、多くの担い手が亡命または殺害され、衰退はこの迫害以降が大きかった。Emmerich Kálmánは亡命し、Paul Abrahamは失意のうちに精神を病んだ。その一方で、この形式の遺産はアメリカに渡ってミュージカルへ流れ込み、Victor HerbertやSigmund Rombergを経て、ブロードウェイの音楽劇の基礎となった。</p>
<h2>代表曲</h2><ul><li>Orpheus in the Underworld（Jacques Offenbach）</li><li>Die Fledermaus（Johann Strauss II）</li><li>Lippen schweigen (André Rieu)</li><li>Ich bin die Christel von der Post (Lucia Popp)</li><li>The Mikado（Gilbert &amp; Sullivan）</li><li>Glitter and Be Gay (Barbara Cook)</li><li>Can-Can (Wiener Philharmoniker)</li><li>I Am the Very Model of a Modern Major-General (D'Oyly Carte Opera Company)</li><li>Der Zigeunerbaron Overture (Wiener Philharmoniker)</li><li>Dein ist mein ganzes Herz (Richard Tauber)</li><li>Three Little Maids from School (D'Oyly Carte Opera Company)</li></ul>
