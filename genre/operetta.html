<h1>Operetta（オペレッタ）とは</h1>
<p>十九世紀半ばのヨーロッパで確立した、軽やかで喜劇的な音楽劇。オペラと同じく管弦楽と歌手を用いるが、全編を歌で通さず、台詞による会話の場面が挟まれる点が構造上の最大の違いである。音楽は親しみやすさを最優先し、ワルツ、ポルカ、ギャロッ</p>
<p>十九世紀半ばのヨーロッパで確立した、軽やかで喜劇的な音楽劇。オペラと同じく管弦楽と歌手を用いるが、全編を歌で通さず、台詞による会話の場面が挟まれる点が構造上の最大の違いである。音楽は親しみやすさを最優先し、ワルツ、ポルカ、ギャロップ、マズルカ、カンカンといった同時代の舞曲がそのまま用いられる。旋律は一度聴けば口ずさめる明快さで書かれ、和声も基本的な機能和声の範囲に収まる。歌唱はオペラほどの声量と技巧を必ずしも要求されず、言葉が明瞭に聞こえることが重んじられ、俳優としての演技力が同等に問われる。編成は中規模の管弦楽で、弦とホルンの柔らかさに、木管の軽妙な合いの手が乗る。曲の並びは序曲、独唱、二重唱、大人数の合唱で幕を閉じる型が定型で、幕切れには必ず高揚が置かれる。物語は恋の取り違え、身分の入れ替わり、変装、誤解が積み重なる喜劇で、権力者や社交界への痛烈な風刺が仕込まれることも多い。舞台には大人数の踊り手が加わり、視覚的な華やかさも売り物になる。上演の場は宮廷の劇場ではなく、市民が気軽に通う商業劇場である。</p>
<h2>成り立ち</h2><p>誕生の地はパリである。1855年、ドイツ生まれのユダヤ系作曲家Jacques Offenbachが、パリ万国博覧会の客を当て込んでシャンゼリゼに小さな劇場Bouffes-Parisiensを開いた。当時のフランスでは、大きな歌劇場が国家的な特権を持ち、小劇場は登場人物の数まで法律で制限されていた。彼はその制約の中で、少人数の風刺的な音楽劇を作り、やがて規制が緩むと1858年に『地獄のオルフェ』を発表する。ギリシャ神話を茶化し、第二帝政の社交界を風刺したこの作品の終幕で鳴るカンカンは、世界中で知られる旋律となった。彼は生涯に100以上の作品を書き、『美しきエレーヌ』(1864)などで絶大な人気を得たが、普仏戦争でドイツ出身であることを理由に排撃され、晩年は不遇だった。この形式はウィーンに渡り、独自の発展を遂げる。Johann Strauss IIが1874年に『こうもり』を書き、ワルツの魅力を全面に出した作風でウィーン・オペレッタの黄金期を開いた。続くFranz Lehárは1905年の『メリー・ウィドウ』で世界的な成功を収め、この作品は各国で上演され映画にもなった。イギリスではGilbertとSullivanの組が、1870年代から90年代にかけて『ミカド』などを書き、英語圏独自の伝統を作った。二十世紀に入り、第一次世界大戦と帝国の崩壊で社交界そのものが消滅すると、この形式は急速に力を失う。さらに1930年代、ナチス政権がユダヤ系の作曲家や台本作家を排除し、多くの担い手が亡命または殺害された。Emmerich Kálmánは亡命し、Paul Abrahamは失意のうちに精神を病んだ。その一方で、この形式の遺産はアメリカに渡ってミュージカルへ流れ込み、Sigmund RombergやVictor Herbertを経て、ブロードウェイの音楽劇の基礎となった。</p>
<h2>代表曲</h2><ul><li>Orpheus in the Underworld（Jacques Offenbach）</li><li>Die Fledermaus（Johann Strauss II）</li><li>The Mikado（Gilbert &amp; Sullivan）</li></ul>
