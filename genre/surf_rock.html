<h1>Surf Rock（サーフロック）とは</h1>
<p>1960年代前半の米国西海岸で確立した、器楽中心のロック。音色が最大の識別点で、Fender Stratocasterなどのシングルコイル・ピックアップのギターを、Fender Reverbユニットという独立した残響装置に通す。こ</p>
<p>1960年代前半の米国西海岸で確立した、器楽中心のロック。音色が最大の識別点で、Fender Stratocasterなどのシングルコイル・ピックアップのギターを、Fender Reverbユニットという独立した残響装置に通す。この装置はバネの振動を利用したスプリング・リバーブで、金属的で長く尾を引く残響を生み、波しぶきを連想させる。奏法の核はトレモロ・ピッキング、すなわち単音を極めて速く上下に弾き続ける技法で、これによって旋律が震えながら持続する。加えて、低音弦を滑らせて轟音を作るグリッサンド、いわゆる波の音を模した下降も定番。ギターにはヴィブラート・アームによる音程の揺らしが常時かけられる。BPMは140〜180と速く、ドラムは二拍目と四拍目を強打しつつ、タムの連打で疾走感を煽る。和声は短調が多く、とりわけスペインやアラブを思わせる音階、たとえばハーモニック・マイナーやフリギア旋法が用いられ、これが独特の異国的な緊張を生む。歌のある系統では、明るい長調とファルセットを含む多声コーラスが特徴で、内容は波乗り、車、恋、そして夏の海辺の生活を扱う。</p>
<h2>成り立ち</h2><p>1961年、カリフォルニア州南部のバルボアで、Dick Dale（本名Richard Monsour）が確立した。彼はレバノン系の家系に育ち、叔父から中東の音楽を聴いて育ったため、その旋法感覚をギターに持ち込んだ。1962年の代表曲Misirlouは、地中海地域に古くから伝わる民謡を、超高速のトレモロ・ピッキングで演奏したものである。彼は極端な大音量を求め、楽器メーカーFenderの創業者Leo Fenderと共同で、当時としては異例の高出力アンプ、そして1961年にFender Reverbユニットを開発した。これがこの音楽の音色そのものを規定した。地元のランドマークとされるバルボアのRendezvous Ballroomでの演奏には、数千人の若者が押し寄せた。同時期、The Venturesがワシントン州タコマから登場し、1960年のWalk, Don't Runで全国的な成功を収めた。彼らは器楽曲を中心とし、その後日本で桁外れの人気を得て、エレキ・ブームと呼ばれる現象を引き起こし、日本のロックの直接の起点となった。The Surfarisの1963年のWipe Out、The Chantaysの1962年のPipelineが、この様式の代表曲として広く知られる。歌のある系統ではThe Beach Boysが決定的で、Brian Wilsonが多声のコーラスと洗練された和声を持ち込み、1963年のSurfin' U.S.A.で全国的な現象となった。しかし1964年のThe Beatlesの米国上陸により、この流行は急速に終息した。1994年、映画Pulp Fictionの冒頭でDick DaleのMisirlouが使われたことにより、この音楽は世代を超えて再発見され、以後も映画や広告で繰り返し用いられている。</p>
<h2>代表曲</h2><ul><li>Wipe Out (The Surfaris)</li><li>Penetration (The Pyramids)</li><li>Surfin' U.S.A. (The Beach Boys)</li><li>Walk Don't Run (The Ventures)</li><li>Pipeline (The Chantays)</li></ul>
