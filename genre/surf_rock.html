<h1>Surf Rock（サーフロック）とは</h1>
<p>1950年代後半から1960年代前半にかけて米国西海岸で生まれた、器楽中心のロック。音色が最大の識別点で、Fender Stratocasterなどのシングルコイル・ピックアップ（弦の振動を電気信号にする部品）のギターを、Fend</p>
<p>1950年代後半から1960年代前半にかけて米国西海岸で生まれた、器楽中心のロック。音色が最大の識別点で、Fender Stratocasterなどのシングルコイル・ピックアップ（弦の振動を電気信号にする部品）のギターを、Fender Reverbユニットという独立した残響装置に通す。この装置はバネの振動を利用したスプリング・リバーブで、金属的で長く尾を引く残響を生み、波しぶきを連想させる。奏法の核はトレモロ・ピッキング（単音を極めて速く上下に弾き続ける技法）で、これによって旋律が震えながら持続する。加えて、低音弦を滑らせて轟音を作るグリッサンド（音を滑らせる奏法）、いわゆる波の音を模した下降も定番。ギターにはヴィブラート・アーム（弦の張りを変えて音を揺らす部品）が使われ、主に音を下方向に曲げるために用いられた。BPM（1分間の拍数）は中〜速いテンポで（代表曲はおおむね150〜170前後）、ドラムのスネアは2拍目（裏打ちや2回打ち）と4拍目に置かれ、曲によってはタムの連打（Wipe Outなど）が加わる。和声（コードの響き）では、短調の曲が目立つ一方、ブルースの基本進行（I-IV-V）や長調の曲も多い。目立つ曲では、スペインやアラブを思わせる音階、たとえばハーモニック・マイナーやフリギア旋法（中東風の響きの音階の型）が用いられ、これが独特の異国的な緊張を生む。歌のある系統では、明るい長調とファルセットを含む多声コーラスが特徴で、内容は波乗り、車、恋、そして夏の海辺の生活を扱う。</p>
<h2>成り立ち</h2><p>1961年ごろ、カリフォルニア州南部のバルボアで活動したDick Dale（本名Richard Monsour）が、一般に創始者とされる。ただし、最初のサーフ・シングルについては諸説がある。彼はレバノン系の家系に育ち、叔父から中東の音楽の影響を受け（叔父はタラバキという太鼓とウードを弾いた）、その音階の感覚をギターに持ち込んだとされる。1962年の代表曲Misirlouは、東地中海の民謡（作者不詳で、確認できる最古の録音は1927年）を、超高速のトレモロ・ピッキングで演奏したものである。彼は極端な大音量を求め、楽器メーカーFenderの創業者Leo Fenderと協力して、当時としては異例の高出力アンプを開発した（独立型のFender Reverbユニットは1961年にFenderが発売したもので、開発の経緯にはDale自身の主張による実際以上に語られている面があると指摘されている）。この大音量のアンプは、Daleの音を形づくる大きな要素の一つだった。地元のランドマークとされるバルボアのRendezvous Ballroomでの演奏には、数千人の若者が押し寄せた。これより前の1958年にワシントン州タコマで結成されたThe Venturesは、1960年のWalk, Don't Runで全国的な成功を収め、サーフ以前に器楽ロックを広めた先行者として、サーフ・ロックにも影響を与えた。彼らは器楽曲を中心とし、その後日本で大きな人気を得て、エレキ・ブームと呼ばれる現象を引き起こし、日本のポップスやロックに多大な影響を与えた（日本のロックの起点には諸説ある）。The Surfarisの1963年のWipe Out、The Chantaysの1962年のPipelineが、この様式の代表曲として広く知られる。歌のある系統ではThe Beach Boysが代表的な存在で、Brian Wilsonが多声のコーラスと洗練された和声を持ち込み、1963年のSurfin' U.S.A.で全国的な現象となった。しかし1964年初頭からのブリティッシュ・インヴェイジョン（The Beatlesを含む）と他ジャンルの台頭で、この流行は衰退した。1994年、映画Pulp Fictionの冒頭でDick DaleのMisirlouが使われたことも一因となって、この音楽が再び注目され、以後も映画などで繰り返し用いられている。</p>
<h2>代表曲</h2><ul><li>Surfin' Bird (The Trashmen)</li><li>Wipe Out (The Surfaris)</li><li>Surfin' U.S.A. (The Beach Boys)</li><li>Walk Don't Run (The Ventures)</li><li>Apache (The Shadows)</li><li>I Get Around (The Beach Boys)</li><li>Surf Rider (The Lively Ones)</li><li>Pipeline (The Chantays)</li><li>Surfer Girl (The Beach Boys)</li><li>Catch a Wave (The Beach Boys)</li><li>Perfidia (The Ventures)</li><li>California Sun (The Rivieras)</li><li>Out of Limits (The Marketts)</li><li>Baja (The Astronauts)</li><li>Mr. Moto (The Belairs)</li><li>Penetration (The Pyramids)</li><li>Hawaii Five-O (The Ventures)</li><li>Boss (The Rumblers)</li><li>Fun, Fun, Fun (The Beach Boys)</li><li>Church Key (The Revels)</li><li>Let's Go Trippin' (Dick Dale)</li></ul>
