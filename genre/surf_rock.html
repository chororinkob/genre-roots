<h1>Surf Rock（サーフロック）とは</h1>
<p>サーフ・ロックは、米国西海岸で、1950年代後半〜1960年代初頭に発生した、器楽中心のロックだ。 最大の識別点は音色だ。Fender Stratocasterなどのシングルコイル・ピックアップ（弦の振動を電気信号にする部品）のギ</p>
<p>サーフ・ロックは、米国西海岸で、1950年代後半〜1960年代初頭に発生した、器楽中心のロックだ。

最大の識別点は音色だ。Fender Stratocasterなどのシングルコイル・ピックアップ（弦の振動を電気信号にする部品）のギターを、Fender Reverbユニットという独立した残響装置に通す。この装置はバネの振動を利用したスプリング・リバーブで、金属的で長く尾を引く残響を生む。その響きは、波しぶきを連想させる。

奏法の核は、トレモロ・ピッキング（単音を極めて速く上下に弾き続ける技法）だ。これによって、旋律が震えながら持続する。加えて、低音弦を滑らせて轟音を作るグリッサンド（音を滑らせる奏法）も定番である。いわゆる波の音を模した下降だ。ギターにはヴィブラート・アーム（弦の張りを変えて音を揺らす部品）が使われ、主に音を下方向に曲げるために用いられた。

BPM（1分間の拍数）は、中〜速いテンポだ。代表曲はおおむね150〜170前後である。ドラムは、スネアが2拍目(裏打ちや2回打ち)と4拍目に置かれる。曲によっては、タムの連打(Wipe Outなど)が加わる。

和声（コードの響き）は、短調や中東・スペイン風の音階を用いる曲が目立つ。一方、I-IV-Vのブルース進行や長調の曲も多い。とりわけ、スペインやアラブを思わせる音階が用いられる。たとえば、ハーモニック・マイナーやフリギア旋法（中東風の響きの音階の型）だ。これが、独特の異国的な緊張を生む。

歌のある系統では、明るい長調とファルセットを含む多声コーラスが特徴だ。内容は、波乗り、車、恋、そして夏の海辺の生活を扱う。</p>
<h2>成り立ち</h2><p>カリフォルニア州南部のバルボアで活動したDick Dale（本名Richard Monsour）は、一般に創始者とされる。ただし、最初のサーフ・シングルには諸説がある。Bel-Airsは、1961年6月の「Mr. Moto」が最初だと主張している。

この人物はレバノン系の家系に育った。叔父の影響を受け、叔父から太鼓のタラバキとウードを教わったとされる。その音階の感覚を、ギターに持ち込んだと本人は語っている。1962年の代表曲Misirlouは、東地中海の民謡（作者不詳で、確認できる最古の録音は1927年）を、超高速のトレモロ・ピッキングで演奏したものである。

彼は極端な大音量を求めた。楽器メーカーFenderの創業者Leo Fenderと協力して、当時としては異例の高出力アンプを開発した。独立型のFender Reverbユニットは、1961年にFenderが発売したものである。開発の経緯には、Dale自身の主張によって実際以上に語られている面があるとも言われる。大音量のアンプは、Daleの音の大きな要素の一つだった。地元のランドマークとされるバルボアのRendezvous Ballroomでの演奏には、数千人の若者が押し寄せたとも言われる。

サーフ以前に器楽ロックを広め、サーフ・ロックにも影響を与えた先行者として、The Venturesがワシントン州タコマから登場した。1960年のWalk, Don't Runで、全国的な成功を収めた。彼らは器楽曲を中心とした。その後、日本で人気を得て、エレキ・ブームと呼ばれる現象を引き起こし、日本のポップスやロックに多大な影響を与えた（日本のロックの起点には諸説ある）。

The Surfarisの1963年のWipe Out、The Chantaysの1962年12月発売のPipelineが、このスタイルの代表曲として広く知られる。歌のある系統では、The Beach Boysが代表的な存在だった。Brian Wilsonが多声のコーラスと洗練された和声を持ち込み、1963年のSurfin' U.S.A.で全国的な現象となった。

しかし、1964年初頭からのブリティッシュ・インヴェイジョン(ビートルズ含む)と他ジャンルの人気で、ブームは衰退した。

1994年、映画Pulp Fictionの冒頭で、Dick DaleのMisirlouが使われた。1990年代のサーフ・リバイバルは、Pulp Fictionでの使用も一因となった。以後も、映画などで繰り返し用いられている。</p>
