<h1>Jōruri（ジョウルリ）とは</h1>
<p>三味線1挺の音にのせて語る音楽で、1段を一人の太夫が語り分けるのが基本だ。代表曲21曲を動画で聴け、ルーツと影響のつながりを地図でたどれる。</p>
<p>三味線1挺の音にのせて語る音楽で、1段を一人の太夫が語り分けるのが基本だ。人形芝居の舞台で鳴ることもあれば、舞台を離れて座敷や稽古場で語られることもある。

中心になる楽器は三味線だ。義太夫節では最も大きく低く響く太棹を使う。常磐津節と清元節は中棹で、新内節も中棹である。糸は太く、胴には厚い皮を張り、象牙製の大きな撥で強く打つ。ドラムの代わりに、この低い打音が場面の重さを作る。

和音は使わない。旋律は語りの抑揚から生まれた節回しで動き、近世邦楽に広く見られる陰旋法に近い音階が土台になる。同じ音を細かく揺らす回しや、悲嘆・恋慕などを沈んだ調子で切々と訴えるクドキが、感情の山になる。三味線は語りをなぞるだけでなく、声の隙間を埋める合いの手を入れる。

リズムは決まった拍ではなく、詞章の息に合わせて伸び縮みするといわれる。4拍を刻むような反復はなく、太夫の語りの速さそのものがテンポになるとされる。

歌い方は歌ではなく語りだ。台詞を運ぶ詞と、情景を節で語る地を使い分ける。人物の科白は声の高さと息づかいを変えて描き分ける。声を張り上げる見せ場もある。

詞章は、武士の合戦や政変を描く時代物と、町人の心中や金銭の行き違いを描く世話物に分かれる。義理と人情の板挟み、身分違いの恋、借金と駆け落ちが繰り返し語られる。

曲はいくつもの段を並べた長い構成をとる。段は口・中・切で構成される。同じ三味線音楽でも、長唄は歌と囃子で舞台を飾るが、浄瑠璃は語りで事件そのものを進める。素浄瑠璃として座敷で通しで聞かせる形もあり、そこでは語りの巧拙だけが勝負になる。</p>
<h2>成り立ち</h2><p>浄瑠璃の元になったのは、室町時代に語られていた浄瑠璃姫と牛若丸の恋物語だ。三河矢矧の長者夫婦が薬師如来に祈願して授かった娘と若き日の源義経の悲恋に、薬師如来の霊験を混ぜた話で、その内容は享禄年間（1528〜1532年）にはほぼ固まっていたと考えられている。語り手は扇拍子を打ちながら、仏の功徳を説いて歩いた。

永禄年間（1558〜1570年）ごろに琉球から三線が渡ったとされ、これが三味線に育つと、語りに音が付く。三味線をいち早く音曲に取り入れたのは上方の盲人たちだった。沢住検校が浄瑠璃と三味線を結びつけ、人形回しの伴奏として使われるようになるのは文禄年間（1593〜1596年）ごろとされる。滝野検校の門人だった杉山丹後掾と、沢住検校の門人だった薩摩浄雲が、京の浄瑠璃を江戸へ運んだ。弟子たちは各地で流派を立て、浄瑠璃は一気に広がった。

しかし、この段階の浄瑠璃は筋書きの面白さで聞かせるものだった。転機は大坂で起きる。近松門左衛門（1653〜1725年）は京都の公家に仕えたと見られ、浄瑠璃作者に転じた。天和3年（1683年）に宇治加賀掾のために書いた世継曽我が加賀掾の一座で上演される。翌貞享元年（1684年）、京都で加賀掾のもとで語っていた竹本義太夫（1651〜1714年）が大坂道頓堀に竹本座を開き、この作品で旗揚げし、義太夫が語って評判をとる。そして貞享2年（1685年）、近松作の出世景清を義太夫が語り、浄瑠璃は文学として立ち上がる。初演を貞享3年（1686年）とする資料もある。この作品より前を古浄瑠璃、以後を新浄瑠璃と呼んで区別する。

義太夫は播磨節や嘉太夫節、小唄の節を混ぜ、豪快で華麗な語りを作った。元禄14年（1701年）には筑後掾の位を受け、竹本筑後掾と名乗る。元禄16年（1703年）の曽根崎心中の初演は大反響を得て、竹本座の経営を安定させた。江戸時代には、初演の後に多くの改作物が生まれている。歌舞伎では昭和28年（1953年）、文楽では昭和30年（1955年）に復活上演された。宝永2年（1705年）に義太夫は座本を初代竹田出雲に譲ったとされる。正徳5年（1715年）の国性爺合戦は初日から17ヶ月続く大当たりとなり、享保5年（1720年）の心中天網島、享保6年（1721年）の女殺油地獄と重い世話物が続いた。近松は1725年に没するまで、時代物約90作、世話物24作を残したとされる。

一方、江戸では別の流れが育った。都太夫一中（1650〜1724年）が元禄から宝永ごろに京都で一中節を始め、その弟子の宮古路豊後掾が豊後節として享保19年（1734年）に江戸で大評判となる。この流れから延享4年（1747年）に常磐津文字太夫が常磐津節を立てた。常磐津節からは富本節が分かれ、文化11年（1814年）には清元延寿太夫が清元節を興す。鶴賀新内は宝暦・明和年間（1751〜1771年）に美声で人気をとり、新内節を生んだ。常磐津節と清元節は歌舞伎舞踊の伴奏に食い込み、新内節は吉原の街頭を流して歩く「流し」の形で江戸の庶民に届いた。流派の名の起こりも生々しい。常磐津は、文字太夫が関東文字太夫と改名しようとして、北町奉行に禁じられたのが発端だ。その帰り道に常盤橋を渡って「常盤」が出た。「津」は師の宮古路豊後掾の本名「石津左司馬」から取ったものだという説が有力とされる。

明治になると、人形浄瑠璃は文楽座の名で生き残り、やがて文楽と呼ばれるようになる。義太夫節の太夫と三味線、人形遣いの三者がそろって演じる形が今に続く。2003年にユネスコの「人類の口承及び無形遺産に関する傑作」に宣言され、2008年には無形文化遺産の代表的な一覧表に載った。現在、浄瑠璃の流派は義太夫節、河東節、一中節、常磐津節、富本節、清元節、新内節、宮薗節の8つが残る。</p>
