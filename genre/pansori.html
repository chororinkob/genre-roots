<h1>Pansori（パンソリ）とは</h1>
<p>朝鮮半島に伝わる、歌い手一人と太鼓奏者一人だけで長大な物語を演じる声楽である。編成は極端に簡素で、歌い手は扇を手に立ち、伴奏者は横に座って樽形の太鼓を膝に置いて叩く。この二人だけで、完全な形では六時間から八時間に及ぶ物語が語られる</p>
<p>朝鮮半島に伝わる、歌い手一人と太鼓奏者一人だけで長大な物語を演じる声楽である。編成は極端に簡素で、歌い手は扇を手に立ち、伴奏者は横に座って樽形の太鼓を膝に置いて叩く。この二人だけで、完全な形では六時間から八時間に及ぶ物語が語られる。表現は三つの要素から成る。旋律を伴って歌う部分、拍節を持たず語りとして述べる部分、そして扇と身振りによる所作である。この三つを切り替えながら、歌い手は語り手と登場人物の全てを一人で演じ分ける。決定的に重要なのが発声で、澄んだ美声はむしろ避けられ、極度に嗄れ、割れ、砕けた声が最高の技とされる。この声は数年に及ぶ過酷な訓練によって作られ、滝の前で声が潰れるまで叫び続け、その後に再び形成された声こそが本物とされてきた。リズムには複数の周期的な型があり、最も遅く重々しいものから、極端に速く切迫したものまでが場面に応じて使い分けられる。伴奏者は単に拍を刻むだけでなく、要所で掛け声を発して歌い手を鼓舞し、聴衆も同様に声をかけることが期待される。したがってこの芸能は、演者と聴き手の応答によって成立する。</p>
<h2>成り立ち</h2><p>起源は17世紀から18世紀の朝鮮半島南西部、全羅道の地域にあるとされる。母体となったのは、巫俗の儀礼で語られていた歌であり、それを担ったのは最下層の身分に置かれた放浪の芸能者たちだった。彼らは市場や祭りの場で、貴族から庶民までを相手に演じ、身分の低さゆえに社会の矛盾を風刺することも許されていた。19世紀半ば、この芸能に転機が訪れる。申在孝という人物が、それまで口伝であった演目を整理して文字に記録し、後援者として演者を支援した。彼はまた、それまで男性に限られていたこの芸能に初めて女性の歌い手を育てたことでも知られる。この整理によって、もともと12あった演目のうち五つが現在まで伝わる形で定着した。日本による植民地統治の時代、この芸能は衰退した。伝統文化が抑圧されたことに加え、西洋の演劇の影響で、複数人が演じる舞台形式へ改変される動きも進み、本来の一人で演じる形は周縁へ追いやられる。朝鮮戦争と、その後の急速な近代化はさらに追い打ちをかけ、1970年代にはこの芸能を全曲通して演じられる者はごくわずかとなっていた。復興の契機は意外なところから訪れる。1993年、林権澤監督の映画が、この芸能に生涯を捧げる親子を描いて大きな話題となり、韓国国内で観客動員の記録を作った。この映画によって、若い世代がこの芸能を再発見したのである。2003年には国際連合の機関によって無形文化遺産に登録された。近年ではさらに新しい展開がある。伝統的な歌唱にベースとドラムを組み合わせた集団が、2020年に韓国観光の宣伝映像で用いられ、その映像が世界中で数億回再生されるという事態が起きた。数百年前の物語の歌が、現代の映像文化を通じて世界へ届いたのである。</p>
