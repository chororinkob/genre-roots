<h1>Pansori（パンソリ）とは</h1>
<p>パンソリは、朝鮮半島に伝わる声楽だ。歌い手一人と太鼓奏者一人だけで、長大な物語を演じる。 編成はきわめて簡素だ。歌い手は扇を手に立つ。鼓手（伴奏者）は座り、前に置いた樽形の太鼓（ソリブク）を、左のてのひらと右手の撥で叩く。この2人</p>
<p>パンソリは、朝鮮半島に伝わる声楽だ。歌い手一人と太鼓奏者一人だけで、長大な物語を演じる。

編成はきわめて簡素だ。歌い手は扇を手に立つ。鼓手（伴奏者）は座り、前に置いた樽形の太鼓（ソリブク）を、左のてのひらと右手の撥で叩く。この2人だけで、完全な形では演目により数時間から8時間以上に及ぶ物語を語る。

表現は三つの要素から成る。歌（チャン）、語り（アニリ）、身振り（パルリム）だ。歌い手はこの三つを切り替えながら、語り手と登場人物の全てを一人で演じ分ける。

何より大事なのが発声だ。ユネスコは、長く厳しい訓練で多様な声色を身につけ、複雑なレパートリーを覚えると説明している。

リズムには、決まった周期で繰り返す型（長短）が複数ある。最も遅く重々しいものから、極端に速く切迫したものまでを、場面に応じて使い分ける。

伴奏者は、ただ拍を刻むだけではない。要所で掛け声（チュイムセ）をかけて歌い手を励まし、聴衆も同じように声をかけることが期待される。つまりこの芸能は、演者と聴き手のやりとりで成り立っている。</p>
<h2>成り立ち</h2><p>ユネスコは、パンソリが17世紀の朝鮮半島南西部で生まれたと説明している。ただし、時期・発祥地・もとになったジャンルには諸説ある。確かな記録が残るのは18世紀半ば（1753〜54年）からで、全羅道を含む湖南地域で発展した。ユネスコは、おそらく巫女の語り歌の新しい表現として生まれたとも説明している。

当初、それは下層の民衆や芸人の芸能だった。彼らは市場や広場などの野外で演じた。演目には、風刺の効いたものもあった。

19世紀半ば、この芸能に転機が訪れる。申在孝という人物が、それまで主に口伝だった6つの演目を整理・改作し、台本として残したのだ。それ以前にも、春香歌などの一部は文字で記録されていた。申在孝は後援者として演者を支え、最初の女性の歌い手（名唱）とされる陳彩仙らを育てたことでも知られる。19世紀後半には、両班など上流層にも、この芸能を楽しむ人が広がった。

現在伝わる五つの演目は、もともと12あった演目のうち残ったものだ（申在孝が整理した6つには、いまは上演されない演目も含まれる）。

一方、複数人が演じる舞台形式の創劇は、植民地化より前の1900年代に始まった。日本による植民地統治の時代には、レコード産業や芸妓の組合、検閲などの影響で、この芸能は姿を変え、衰えていった。本来の一人で演じる形は、隅へ追いやられた。

朝鮮戦争と、その後の急速な近代化が、さらに追い打ちをかけた。1960年代には、全曲を通して歌える歌い手がきわめて少なくなった。

それでも、1968年以降に、全曲を通して歌う完唱が復活した。1964年の文化財指定と、1968年以降の完唱などで復興が進み、1993年の映画でパンソリへの関心も高まった。1993年、林権澤監督の映画は、パンソリ歌手の養父と養子を描いて大きな話題となった。ソウルで100万人を超えた、初の韓国映画である。

2003年には、国際連合の機関から「人類の口承及び無形遺産の傑作」と宣言された。2008年には、無形文化遺産の代表一覧表に記載された。

近年は、さらに新しい展開もある。伝統的な歌唱を取り入れた集団が、2020年に韓国観光の宣伝映像に起用された。2020年7月に公開された映像は、複数のプラットフォームの合計で、数か月のうちに2億回を超えて再生された。数百年前の物語の歌が、現代の映像文化を通じて世界へ届いたのである。</p>
<h2>代表曲</h2><ul><li>水宮歌 (キム・ジュンス)</li><li>興甫歌「朴を割る場面」(アン・スクソン)</li><li>短歌「四季の歌（サチョルガ）」(チョ・サンヒョン)</li><li>春香歌「蓬の髪（ススクテモリ）」(イム・バンウル)</li><li>水宮歌「虎が降りてくる」(パク・ドンジン)</li><li>四川歌 (イ・ジャラム)</li><li>春香歌「獄中歌（オクチュンガ）」(チョン・サンヒ)</li><li>沈清歌「沈奉事が目を開く場面」(ソン・チャンスン)</li><li>春香歌「別れの歌（イビョルガ）」(パク・エリ)</li><li>赤壁歌「赤壁火戦」(アン・スクソン)</li><li>沈清歌 (伝承曲)</li></ul>
