<h1>Pansori（パンソリ）とは</h1>
<p>朝鮮半島に伝わる、歌い手一人と太鼓奏者一人だけで長大な物語を演じる声楽である。編成は極端に簡素で、歌い手は扇を手に立ち、鼓手（伴奏者）はあぐらで座って、前に置いた樽形の太鼓（ソリブク）を左のてのひらと右手の撥で叩く。この二人だけで</p>
<p>朝鮮半島に伝わる、歌い手一人と太鼓奏者一人だけで長大な物語を演じる声楽である。編成は極端に簡素で、歌い手は扇を手に立ち、鼓手（伴奏者）はあぐらで座って、前に置いた樽形の太鼓（ソリブク）を左のてのひらと右手の撥で叩く。この二人だけで、完全な形では三時間から八時間以上に及ぶ物語が語られる。表現は三つの要素から成る。旋律を伴って歌う部分、拍節を持たず語りとして述べる部分、そして扇と身振りによる所作である。この三つを切り替えながら、歌い手は語り手と登場人物の全てを一人で演じ分ける。決定的に重要なのが発声で、澄んだ美声よりも、嗄れて力強い、割れたような声が高く評価されるとされる。この声は数年に及ぶ長く厳しい訓練によって作られ、滝の前で声が潰れるまで叫び続けた末に得た声こそが本物だという言い伝えもある。リズムには複数の周期的な型があり、最も遅く重々しいものから、極端に速く切迫したものまでが場面に応じて使い分けられる。伴奏者は単に拍を刻むだけでなく、要所で掛け声を発して歌い手を鼓舞し、聴衆も同様に声をかけることが期待される。したがってこの芸能は、演者と聴き手の応答によって成立する。</p>
<h2>成り立ち</h2><p>起源は17世紀の朝鮮半島南西部にあるとされ、正確な発祥地は不明だが、全羅道を含む湖南地域で発展した。ユネスコは、おそらく巫女の語り歌の新しい表現として生まれたと説明する。それを担ったのは最下層の身分に置かれた放浪の芸能者たちだった。彼らは市場や祭りの場で、貴族から庶民までを相手に演じ、身分の低さゆえに社会の矛盾を風刺することも許されていた。19世紀半ば、この芸能に転機が訪れる。申在孝という人物が、それまで口伝であった6つの演目を整理して文字に記録し、後援者として演者を支援した。彼はまた、最初の著名な女性の歌い手（名唱）である陳彩仙らを育てたことでも知られる。現在伝わる五つの演目は、もともと12あった演目のうち残ったものである（申在孝が整理した6つには、現在は上演されない演目も含まれる）。日本による植民地統治の時代、この芸能は衰退した。伝統文化が抑圧されたことに加え、西洋の演劇の影響で、複数人が演じる舞台形式へ改変される動きも進み、本来の一人で演じる形は周縁へ追いやられる。朝鮮戦争と、その後の急速な近代化はさらに追い打ちをかけ、1970年代にはこの芸能を全曲通して演じられる者はごくわずかとなっていた。復興の契機は意外なところから訪れる。1993年、林権澤監督の映画が、この芸能に生涯を捧げる親子を描いて大きな話題となり、韓国国内で観客動員の記録を作った。この映画によって、若い世代がこの芸能を再発見したのである。2003年には国際連合の機関によって「人類の口承及び無形遺産の傑作」と宣言され、2008年に無形文化遺産の代表一覧表へ記載された。近年ではさらに新しい展開がある。伝統的な歌唱にベースとドラムを組み合わせた集団が、2020年に韓国観光の宣伝映像で用いられ、その映像が世界中で数億回再生されるという事態が起きた。数百年前の物語の歌が、現代の映像文化を通じて世界へ届いたのである。</p>
<h2>代表曲</h2><ul><li>水宮歌 (キム・ジュンス)</li><li>興甫歌「朴を割る場面」(アン・スクソン)</li><li>短歌「四季の歌（サチョルガ）」(チョ・サンヒョン)</li><li>春香歌「蓬の髪（ススクテモリ）」(イム・バンウル)</li><li>水宮歌「虎が降りてくる」(パク・ドンジン)</li><li>四川歌 (イ・ジャラム)</li><li>春香歌「獄中歌（オクチュンガ）」(チョン・サンヒ)</li><li>沈清歌「沈奉事が目を開く場面」(ソン・チャンスン)</li><li>春香歌「別れの歌（イビョルガ）」(パク・エリ)</li><li>赤壁歌「赤壁火戦」(アン・スクソン)</li><li>沈清歌 (伝承曲)</li></ul>
