<h1>Lento Violento（レントヴィオレント）とは</h1>

<p>イタリアで生まれた、遅くて激しいという矛盾した名前を持つ様式である。名称はイタリア語で「遅くて暴力的(激しい)」を意味する。テンポは一分間に70から120拍程度と極端に遅い。部族的なハウスやアフロ・テクノ由来の低いテンポに、ハードコア由来の重く歪んだキックに、アシッドハウスのようなくり返しの音が重なる。バスドラムは1拍ごとに重く落とされ、音の高さを持った長い響きを引きずる。上に重ねる音には、暗くアシッドなくり返しの音や、ボーカルのサンプルが敷かれ、より硬質で反復的な、聴きにくく踊りにくい音になることもある。加工された声や電子的に変換された話し声などが挿入される。人気はイタリアで高く、欧州や南米では中程度とされる。曲の組み立ては単純なくり返しが中心で、複雑な展開はほとんどない。</p>
<h2>成り立ち</h2><p>名前を考え出したのは、イタリアのディージェイ、ジジ・ダグスティーノである(様式の起源は諸説ある)。彼は1990年代末から2000年代初めに「Bla Bla Bla」「Another Way」「The Riddle」「L'Amour toujours」といった曲で欧州全域の商業的な成功を収めた人物で、当時はイタロ・ダンスの代表的な存在だった。2000年代、彼はこの重く遅い音を一つの様式として打ち出し、レント・ヴィオレントという名を与えた。2007年4月には2枚組アルバム『Lento Violento ...e altre storie』を発売している。ドットール・ダグ(Dottor Dag)やレント・ヴィオレント・マン(Lento Violento Man)といった別名義も使い分け、同じ手法を異なる角度から試した。2005年から2010年1月まで、ラジオ局m2oで自分の番組も持っていた。この動きはイタリア国内、とりわけ北部のクラブで受け入れられ、2000年代後半から2010年代前半にかけて熱烈な支持を集めた。イタリア国外での人気は、欧州や南米で中程度とされる。なお、既存曲の速度を落として深い残響を加える手法(スロー＋リバーブ)は、ヒップホップのチョップド・アンド・スクリュードやヴェイパーウェイヴに由来し、2017年ごろに流行したもので、この様式とは別の流れである。2009年ごろには、Technoboyの「The Undersound」のように、この様式を他のハードダンスと融合させた例も出ている。ダグスティーノ自身は2021年12月に重い病を公表して活動を長く中断したが、その後回復し、2024年2月に第74回サンレモ音楽祭のゲストとして出演して復帰を果たしている。</p>
