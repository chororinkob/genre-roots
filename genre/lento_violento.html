<h1>Lento Violento（レントヴィオレント）とは</h1>
<p>イタリアで生まれた、「遅い」と「激しい」という矛盾した言葉を名前に持つスタイルである。名称はイタリア語で「遅くて暴力的(激しい)」を意味する。 テンポはおおむね70〜120 BPM前後だ。85〜115 BPMとする見方もあり、幅が</p>
<p>イタリアで生まれた、「遅い」と「激しい」という矛盾した言葉を名前に持つスタイルである。名称はイタリア語で「遅くて暴力的(激しい)」を意味する。

テンポはおおむね70〜120 BPM前後だ。85〜115 BPMとする見方もあり、幅がある。ただ、拍の数よりも、遅く感じるミニマルなリズムと、攻撃的な音作りのほうが特徴である。

リズムの土台は、部族的なハウスやアフロ・テクノから来た低いテンポだ。そこに、ハードコア由来の重く歪んだキックと、アシッドハウスのようなくり返しの音が重なる。キックは、ハードコアやハードスタイルから来た硬く歪んだ音で、それを遅いテンポで鳴らす。

上に重ねる音には、暗くアシッドなくり返しの音や、ボーカルのサンプルが使われる。より硬く、くり返しの強い、聴きにくく踊りにくい音になることもある。加工された声や、電子的に変換された話し声なども差し込まれる。

曲の組み立ては単純なくり返しが中心で、複雑な展開はほとんどない。</p>
<h2>成り立ち</h2><p>この名前を考え出したのは、イタリアのDJ、ジジ・ダゴスティーノである(スタイルの起源には諸説ある)。彼は1990年代末から2000年代初めに、「Bla Bla Bla」「Another Way」「The Riddle」「L'Amour toujours」といった曲で、欧州の複数の国のチャートで上位に入った。当時は、イタロ・ダンスの代表的な存在だった。

このスタイルの発祥は、1990年代末から2000年代初めである。名称が定着したのは2003年以降だ。レント・ヴィオレントという名は、彼が名付けたとされる。ただし本人は、これをジャンルというより、自分のプロジェクトや名義だと説明している。

2007年4月27日には、2枚組の『Lento Violento ...e altre storie』を発売した。新曲35曲を収め、イタリアのチャートで3位に入っている。彼は、ドットール・ダグ(Dottor Dag)やレント・ヴィオレント・マン(Lento Violento Man)といった別名義も使い分けた。別名義は、イタロ・ダンスの作品と区別するために使われた。2005年から2010年1月までは、ラジオ局m2oで自分の番組も持っていた。

この動きは、イタリア国内のクラブで受け入れられた。その後も、本人はこの名義で作品を発表している。イタリア国外での人気は、欧州や南米で中程度とされる。

なお、既存の曲の速度を落とし、深い残響を加える手法(スロー＋リバーブ)は、このスタイルとは別の流れである。この手法は、ヒップホップのチョップド・アンド・スクリュードやヴェイパーウェイヴに由来する。2017年ごろに登場し、2020年ごろに大きく流行した。

一方、2009年には、Technoboy Meets Ruffianの「The Undersound」のように、このスタイルをハードスタイルと融合させた例も出ている。

ダゴスティーノ自身は、2021年12月に病状の悪化を発表して、活動を休止した。それでも2024年2月9日、第74回サンレモ音楽祭の第4夜に、ゲストとして出演した。客船のステージでDJのセットを披露し、ライブに復帰した。</p>
