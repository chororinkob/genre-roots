<h1>Lento Violento（レントヴィオレント）とは</h1>
<p>イタリアで生まれた、遅くて激しいという矛盾した名を持つ様式である。名称はイタリア語でそのまま遅い暴力を意味する。テンポは一分間に60から90拍程度と極端に遅いが、これは通常の速いダンス音楽の音をそのまま半分の速度で再生したような質</p>
<p>イタリアで生まれた、遅くて激しいという矛盾した名を持つ様式である。名称はイタリア語でそのまま遅い暴力を意味する。テンポは一分間に60から90拍程度と極端に遅いが、これは通常の速いダンス音楽の音をそのまま半分の速度で再生したような質感を持つ。実際、制作の手法としても既存の速い曲を減速させることが出発点になっており、それによって生じる引き伸ばされた不自然な音色が、この様式の個性そのものになっている。バスドラムは一拍ごとに重く落とされ、音程を持った長い胴体を引きずる。上物には子供向けの玩具のような単純で甲高い旋律が乗ることが多く、この幼稚さと重々しさの落差が独特の可笑しみと不気味さを生む。加工された声、電子的に変換された話し声、擬音が頻繁に挿入され、真面目な音楽としてよりも、意図的に馬鹿馬鹿しさを持ち込んだ表現として作られている。しかし演奏の場では聴き手が全力で踊る対象となっており、遅い拍に合わせて大きく体を振る独特の踊り方が定着している。曲の構成は単純な反復が中心で、複雑な展開はほとんど設けられない。</p>
<h2>成り立ち</h2><p>生みの親はイタリアのディージェイ、ジジ・ダグスティーノである。彼は1990年代末に『ラルバ』や『ボンジュール・ヴィエトナム』といった曲で欧州全域の商業的な成功を収めた人物で、当時はイタロ・ダンスの代表的な存在だった。2000年代前半、彼は自分の演奏の途中で意図的に再生速度を大きく落とし、曲を引きずるように鳴らす遊びを始める。回転数を落とすと音程も下がり、明るい曲が奇怪に歪む。この効果を面白がった彼は、これを単なる余興ではなく一つの様式として体系化し、レント・ヴィオレントという名を与えた。2007年には自らこの名を冠したラジオ番組を始め、一連の作品を発表する。ルーレット・トリッキーやウーカーといった別名義を使い分け、同じ手法を異なる角度から試した。この動きはイタリア国内、とりわけ北部のクラブで受け入れられ、2000年代後半から2010年代前半にかけて熱狂的な支持を集めた。若者たちは遅い拍に合わせて全身を大きく振る踊り方を作り出し、その様子を撮影した動画が広く共有された。踊り方そのものが様式の一部として認識されるという、珍しい成立の仕方をしている。イタリア国外での評価は当初、冗談音楽として扱われることが多かった。極端に遅く、幼稚な旋律が乗り、時に擬音まで挿入される音楽は、真面目な批評の対象になりにくかったのである。しかし2010年代半ば以降、既存の音楽を減速させて別の意味を与えるという手法が、他の領域でも一般的になっていく。特に既存曲の速度を落として深い残響を加える手法が世界的に流行し、また実験的な電子音楽の作り手が意図的に安価で粗い音を使う潮流が広がったことで、この様式の発想が先駆けだったと再評価されるようになった。近年ではイタリア国外の制作者がこの手法に接近する例も現れ、単なる余興から様式としての地位を得つつある。ダグスティーノ自身は2021年に重い病を公表して活動を長く中断したが、その後回復し、2023年に復帰を果たしている。</p>
