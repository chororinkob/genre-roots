<h1>Motown（モータウン）とは</h1>
<p>デトロイトのモータウン・レコードが1960年代に量産した、教会音楽ゆずりの熱量をポップスの型に流し込んだソウル。専属スタジオバンドThe Funk Brothersの演奏が土台で、James Jamersonがフェンダー・プレシジ</p>
<p>デトロイトのモータウン・レコードが1960年代に量産した、教会音楽ゆずりの熱量をポップスの型に流し込んだソウル。専属スタジオバンドThe Funk Brothersの演奏が土台で、James Jamersonがフェンダー・プレシジョンベース一本で弾く、8分音符の隙間を細かく縫うシンコペーションだらけのベースラインが曲の推進力を作る。Benny Benjaminのドラムは二拍目と四拍目を強く打ち、そこにタンバリンを重ね、さらに木の板を踏み鳴らす音やチェーンを叩く音まで加えて裏拍を極端に立たせる。ヴィブラフォンやグロッケンシュピールが高音でキラキラした粒を撒き、デトロイト交響楽団の弦とホーンが上に乗る。テンポはおおむね毎分一一〇から一三〇拍で、走り出したくなる速さに保たれている。曲は二分半前後と短く、冒頭数秒で耳を掴むイントロのフックがあり、すぐにサビが来る。歌手とバックコーラスが呼びかけと応答を繰り返す構造は教会の礼拝そのものである。歌詞は恋の喜びと痛みに絞られ、公民権運動のさなかにあえて政治的な主題を避けた。同時代のサザンソウルの拠点だったスタックスが一発録りの緩さと生々しさを持ち味にしたのに対し、モータウンは何度も重ね録りし、社内試聴会で合格しなければ発売しないという徹底した品質管理で磨き上げた点が対照的である。</p>
<h2>成り立ち</h2><p>1959年、フォードの自動車工場で働きながら曲作りをしていたBerry Gordy Jr.が、家族から800ドルを借りてデトロイトのウェスト・グランド大通りに小さな家を買い、看板にHitsville U.S.A.と掲げた。彼は工場のベルトコンベアの発想をそのまま音楽に持ち込み、素人の少年少女が入口から入って完成されたスターとして出てくる仕組みを作った。作曲はHolland-Dozier-Hollandの三人組やSmokey Robinsonが担い、演奏は地元のジャズクラブから集めたThe Funk Brothersが地下スタジオで昼夜を問わず録音し、新人には歩き方や食事の作法、記者への受け答えまで教える社内学校Artist Developmentが置かれた。スローガンはThe Sound of Young Americaで、黒人音楽を黒人向けの市場に閉じ込めず白人の家庭にも届けるという明確な戦略があった。The Miraclesの『Shop Around』(1960)が初のミリオンセラーとなり、The Supremesは1964年の『Where Did Our Love Go』から立て続けに全米一位を五曲続けた。The Temptations、Four Tops、Martha and the Vandellas、Marvin Gaye、Stevie Wonderが続き、1968年には全米ヒットチャートの上位に同社の曲が常時並ぶ状態になった。だが内側には軋みがあった。Funk Brothersはヒット曲の演奏者名をレコードに一切記載されず定額の給料で働かされ、Holland-Dozier-Hollandは印税をめぐって訴訟を起こして1968年に去った。Marvin Gayeがベトナム戦争と警官暴力を歌った『What's Going On』(1971)をGordyは商売にならないと言って発売を渋り、押し切られる形で出した結果、社の代表作となった。1967年のデトロイト暴動と自動車産業の衰退を背景に、Gordyは1972年に本社をロサンゼルスへ移し、置き去りにされたFunk Brothersの多くは無名のまま亡くなった。それでもモータウンの録音技法とコーラスの型は、その後のディスコ、ニュージャックスウィング、日本のシティポップに至るまで広く受け継がれている。</p>
<h2>代表曲</h2><ul><li>My Girl (The Temptations)</li><li>Ain't Too Proud to Beg (The Temptations)</li><li>Superstition (Stevie Wonder)</li><li>I Want You Back (Jackson 5)</li></ul>
