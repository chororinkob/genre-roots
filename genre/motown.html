<h1>Motown（モータウン）とは</h1>
<p>デトロイトのモータウン・レコードが1960年代に量産した、教会音楽ゆずりの熱量をポップスの型に流し込んだソウル。専属スタジオバンドThe Funk Brothersの演奏が土台で、James Jamersonが主にフェンダー・プレ</p>
<p>デトロイトのモータウン・レコードが1960年代に量産した、教会音楽ゆずりの熱量をポップスの型に流し込んだソウル。専属スタジオバンドThe Funk Brothersの演奏が土台で、James Jamersonが主にフェンダー・プレシジョンベースを右手人差し指1本で弾く、シンコペーション（拍をずらして強調するリズム）やゴーストノート（弾いたかどうか分かりにくいほど弱い音）、半音ずつ上がり下がりする動きを多用したベースラインが、曲を前へ進める力を作る。Benny Benjaminのドラムは、強弱がはっきりした勢いのある演奏（ダイナミックな演奏）で知られ、そこにパーカッショニストのJack Ashfordがタンバリンを重ね、さらに足踏みやウッドブロックの音なども加えて、裏拍を目立たせる。曲によっては雪道用のチェーンを叩く音も使われ、Martha and the Vandellasの『Nowhere to Run』(1965)ではIvy Jo Hunterがそれを叩いた。ヴィブラフォン（金属の鍵盤を叩く楽器）が高音でキラキラした粒を撒き、Motown専属のホーン（トランペットやサックスなどの管楽器）の演奏が加わり、しばしばデトロイト交響楽団の弦も重なる。テンポは中くらいから速めの曲が中心だが、ゆっくりしたバラードも多い。曲は二分半前後と短く、冒頭数秒で耳を掴むイントロのフック（耳に残る部分）があり、すぐにサビが来る。歌手とバックコーラスが呼びかけと応答を繰り返す歌い方（コール・アンド・レスポンス）は、ゴスペル（教会で歌われる宗教音楽）から取り入れたものである。歌詞は恋の喜びと痛みに絞られ、公民権運動のさなか、基本的に政治的な主題を避けていた（ただし例外もあり、1963年に演説を録音して発売したり、1970年にBlack Forumという別のレーベルを作ったりした）。同時代のサザンソウルの拠点だったスタックスが、譜面を使わず口頭で編曲を作る即興的な方法による、緩さと生々しさを持ち味にしたのに対し、モータウンは何度も重ね録りし、社内試聴会で合格しなければ発売しないという徹底した品質管理で磨き上げた点が対照的である。</p>
<h2>成り立ち</h2><p>1959年、1957年にフォード系のリンカーン・マーキュリー工場を辞めて専業の作曲家・音楽プロデューサーとして活動していたBerry Gordy Jr.が、家族の互助会から800ドルを借りてTamla Recordsというレーベルを始め（翌1960年にMotown Record Corporationという会社にした）、同じ1959年にデトロイトのウェスト・グランド大通りの小さな家を買い、看板にHitsville U.S.A.と掲げた。彼は工場のベルトコンベアの発想をそのまま音楽に持ち込み、素人の少年少女が入口から入って完成されたスターとして出てくる仕組みを作った。作曲はHolland-Dozier-Hollandの3人組やSmokey Robinsonが担い、演奏は地元のジャズクラブから集めたThe Funk Brothersが通称「地下スタジオ」（実際は地下ではなく、数段下りて入る地上階の部屋で、もとは車庫を改装した写真スタジオ）で昼夜を問わず録音し、新人には歩き方や食事の作法、記者への受け答えまで教える社内学校Artist Developmentが置かれた。スローガンはThe Sound of Young Americaで、黒人音楽を黒人向けの市場に閉じ込めず白人の家庭にも届けるという明確な戦略があった。The Miraclesの『Shop Around』(1960)が初のミリオンセラーとなり、The Supremesは1964年の『Where Did Our Love Go』から立て続けに全米一位を5曲続けた。The Temptations、Four Tops、Martha and the Vandellas、Marvin Gaye、Stevie Wonderが続き、その後も同社の曲が全米ヒットチャートの上位に並び続け、同社系のレーベルは1961〜71年に100曲を超えるトップ10ヒットを出した。だが内側にはひずみがあった。Funk Brothersは長く、ヒット曲の演奏者名をレコードに記載されず（Motownの主な作品で、演奏者全員の名前が載ったのは、1971年のMarvin Gaye『What's Going On』が最初）、週ごとの決まった契約料と、録音ごとの報酬を組み合わせて払われていたとされる（金額や、誰がもらえたかは、資料によって食い違う）。Holland-Dozier-Hollandは、印税と利益配分をめぐる対立から、1967〜68年にMotownを去った。そのあとMotownが契約違反で訴え、Holland-Dozier-Hollandの側も訴え返して（反訴して）、長い争いになった。Marvin Gayeがベトナム戦争と警官暴力を歌った『What's Going On』(1971)をGordyは、サウンドが古く、白人の聴き手の支持を失うことを心配して、難色を示したと伝えられる（本人は一部を否定している）。発売されると、社の代表作となった。Gordyは映画・テレビ産業への進出を目指して、1972年に本社をロサンゼルスへ移し、Funk Brothersの多くは解雇されたり、散り散りになったりした。移転のころは広く知られていなかったが、2000年代に入って高く評価されるようになった。それでもモータウンの洗練されたポップな作り方は、後のR&amp;Bに影響を与えたと言われている。</p>
