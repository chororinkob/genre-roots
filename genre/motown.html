<h1>Motown（モータウン）とは</h1>
<p>モータウンは、デトロイトのモータウン・レコードが1960年代に量産したソウルだ。教会音楽ゆずりの熱量を、ポップスの型に流し込んでいる。 演奏の土台は、専属スタジオバンドのThe Funk Brothersだ。中でもJames Ja</p>
<p>モータウンは、デトロイトのモータウン・レコードが1960年代に量産したソウルだ。教会音楽ゆずりの熱量を、ポップスの型に流し込んでいる。

演奏の土台は、専属スタジオバンドのThe Funk Brothersだ。中でもJames Jamersonは、主にフェンダー・プレシジョンベースを、右手の人差し指1本で弾いた。そのベースラインは、シンコペーション（拍をずらして強調するリズム）やゴーストノート、半音階的な動きを多用している。この動きが、曲を前へ進める力になる。

ドラムはBenny Benjamin。イントロやセクションの前に入れるフィル（区切りに入れる短い装飾的な演奏）が特徴的だと言われる。パーカッショニストのJack Ashfordは、タンバリンやヴィブラフォンのほか、足踏み・ウッドブロックなども演奏した。『Nowhere to Run』では、Ivy Jo Hunterが雪道用チェーンを叩いた。ヴィブラフォン（金属の鍵盤を叩く楽器）は高音でキラキラした粒を撒く。そこにMotownのホーンセクションが加わり、しばしばデトロイト交響楽団の弦も重なる。

テンポはミッド〜アップテンポが中心だが、スローなバラードも多い。曲は2分台前半〜後半の曲が多い。冒頭の数秒で耳を掴むイントロのフック（耳に残る部分）があり、すぐにサビが来る。

歌手とバックコーラスは、呼びかけと応答を繰り返す。この構造は、ゴスペルに由来するコール・アンド・レスポンスの歌唱スタイルを取り入れたものだ。

歌詞は、恋の喜びと痛みに絞られている。公民権運動のさなかでも、基本的に政治的な主題を避けていたとされる。ただし例外もあり、1963年に演説を録音して発売したり、1970年にBlack Forumという別のレーベルを作ったりした。

同じ時代のサザンソウルの拠点だったスタックスは、譜面を使わず、口頭で編曲を作る即興的な方法をとった。その緩さと生々しさが持ち味だった。それに対してモータウンは、何度も重ね録りをした。社内試聴会で合格しなければ発売しないという、徹底した品質管理で磨き上げた。この点が対照的である。</p>
<h2>成り立ち</h2><p>1959年、Berry Gordy Jr.はレーベルを立ち上げた。彼は1957年にLincoln-Mercury（Ford系）の工場を辞め、専業の作曲家・音楽プロデューサーとして活動していた。家族の互助会から800ドルを借りてTamlaを設立し、1960年にMotown Record Corporationとして法人化した。同じ1959年には、デトロイトのウェスト・グランド大通りの小さな家を買い、看板にHitsville U.S.A.と掲げた。

彼は、工場のベルトコンベアの発想をそのまま音楽に持ち込んだ。素人の少年少女が入口から入り、完成されたスターとして出てくる仕組みを作ったのだ。作曲はHolland-Dozier-Hollandの3人組やSmokey Robinsonが担った。演奏は、地元のジャズクラブから集めたThe Funk Brothersが、昼夜を問わず録音した。場所は通称「地下スタジオ」（Snakepit。実際は数段下りる地上階の一室で、元は車庫を改装した写真スタジオ）である。新人には、歩き方や食事の作法、記者への受け答えまで教える社内学校Artist Developmentが置かれた。

スローガンはThe Sound of Young Americaだった。黒人音楽を黒人向けの市場に閉じ込めず、白人の家庭にも届けるという、明確な戦略があった。

その戦略は当たった。The Miraclesの『Shop Around』(1960)が初のミリオンセラーとなった。The Supremesは、1964年の『Where Did Our Love Go』から、立て続けに全米一位を5曲続けた。The Temptations、Four Tops、Martha and the Vandellas、Marvin Gaye、Stevie Wonderが続いた。その後も同社の曲は、全米ヒットチャートの上位に並び続けた。同社系のレーベルは、1961〜71年に100曲を超えるトップ10ヒットを出した。

だが、内側にはひずみがあった。Funk Brothersは長く、ヒット曲の演奏者名をレコードに記載されなかった。Motownの主要作品で、ミュージシャン全員が名指しでクレジットされたのは、1971年の『What's Going On』が最初だ。報酬は、週単位の契約料とセッション報酬が組み合わさっていたとされるが、金額・対象者は資料で食い違う。

Holland-Dozier-Hollandも去った。印税・利益配分をめぐる対立から、1967〜68年に退社したのだ。Motownは契約違反で提訴し、HDHが反訴して、長期の係争になった。

1971年には、Marvin Gayeがベトナム戦争と警官暴力を歌った『What's Going On』が出た。Gordyは、サウンドが古く、白人層の支持を失うことを懸念して難色を示したと伝えられる（本人は一部を否定）。それでも発売された結果、この作品は社の代表作となった。

その翌年の1972年、Gordyは映画・テレビ産業への進出を目指して、本社をロサンゼルスへ移した。Funk Brothersは、1972年の移転で多くが解雇・離散した。移転当時は広く知られていなかったが、2000年代に再評価された。

それでもMotownの洗練されたポップ志向は、後のR&amp;Bに影響を与えたと評される。</p>
