<h1>Motown（モータウン）とは</h1>
<p>デトロイトのモータウン・レコードが1960年代に量産した、教会音楽ゆずりの熱量をポップスの型に流し込んだソウル。専属スタジオバンドThe Funk Brothersの演奏が土台で、James Jamersonが主にフェンダー・プレ</p>
<p>デトロイトのモータウン・レコードが1960年代に量産した、教会音楽ゆずりの熱量をポップスの型に流し込んだソウル。専属スタジオバンドThe Funk Brothersの演奏が土台で、James Jamersonが主にフェンダー・プレシジョンベースを右手人差し指1本で弾く、8分音符の隙間を細かく縫うシンコペーション（拍をずらして強調するリズム）だらけのベースラインが、曲を前へ進める力を作る。Benny Benjaminのドラムは、イントロやセクションの前に入れるフィル（区切りに入れる短い装飾的な演奏）が特徴的で、そこにパーカッショニストのJack Ashfordがタンバリンを重ね、さらに足踏みやウッドブロックの音、雪道用のチェーンを叩く音まで加えて裏拍を極端に立たせる。ヴィブラフォン（金属の鍵盤を叩く楽器）が高音でキラキラした粒を撒き、デトロイト交響楽団の弦とホーンが上に乗る。テンポは曲によって幅があるが、走り出したくなる速さに保たれている。曲は二分半前後と短く、冒頭数秒で耳を掴むイントロのフック（耳に残る部分）があり、すぐにサビが来る。歌手とバックコーラスが呼びかけと応答を繰り返す構造は教会の礼拝そのものである。歌詞は恋の喜びと痛みに絞られ、公民権運動のさなか、基本的に政治的な主題を避けていた（ただし例外もあり、1963年に演説を録音して発売したり、1970年にBlack Forumという別のレーベルを作ったりした）。同時代のサザンソウルの拠点だったスタックスが、譜面を使わず口頭で編曲を作る即興的な方法による、緩さと生々しさを持ち味にしたのに対し、モータウンは何度も重ね録りし、社内試聴会で合格しなければ発売しないという徹底した品質管理で磨き上げた点が対照的である。</p>
<h2>成り立ち</h2><p>1959年、1957年にフォードの自動車工場を辞めて専業の作曲家・音楽プロデューサーとして活動していたBerry Gordy Jr.が、家族の互助会から800ドルを借りてレーベルを始め、同じ1959年にデトロイトのウェスト・グランド大通りの小さな家を買い、看板にHitsville U.S.A.と掲げた。彼は工場のベルトコンベアの発想をそのまま音楽に持ち込み、素人の少年少女が入口から入って完成されたスターとして出てくる仕組みを作った。作曲はHolland-Dozier-Hollandの3人組やSmokey Robinsonが担い、演奏は地元のジャズクラブから集めたThe Funk Brothersが通称「地下スタジオ」（実際は1階奥の旧写真スタジオ）で昼夜を問わず録音し、新人には歩き方や食事の作法、記者への受け答えまで教える社内学校Artist Developmentが置かれた。スローガンはThe Sound of Young Americaで、黒人音楽を黒人向けの市場に閉じ込めず白人の家庭にも届けるという明確な戦略があった。The Miraclesの『Shop Around』(1960)が初のミリオンセラーとなり、The Supremesは1964年の『Where Did Our Love Go』から立て続けに全米一位を5曲続けた。The Temptations、Four Tops、Martha and the Vandellas、Marvin Gaye、Stevie Wonderが続き、その後も同社の曲が全米ヒットチャートの上位に並び続け、同社系のレーベルは1961〜71年に100曲を超えるトップ10ヒットを出した。だが内側にはひずみがあった。Funk Brothersは長く、ヒット曲の演奏者名をレコードに記載されず（1971年のMarvin Gaye『What's Going On』で初めて名前が載った）、月給と1曲ごとの報酬が混在する形で働かされ、Holland-Dozier-Hollandは印税と利益配分をめぐる紛争からMotownが契約違反で提訴し、HDH側が反訴する形で係争となり1968年に去った。Marvin Gayeがベトナム戦争と警官暴力を歌った『What's Going On』(1971)をGordyは商売にならないと言って発売を渋り、押し切られる形で出した結果、社の代表作となった。Gordyは映画・テレビ産業への進出を目指して、1972年に本社をロサンゼルスへ移し、置き去りにされたFunk Brothersの多くは無名のまま亡くなった。それでもモータウンの録音技法とコーラスの型は、その後のディスコやニュージャックスウィングなど、後のソウルやR&amp;Bに広く受け継がれている。</p>
