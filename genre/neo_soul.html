<h1>Neo Soul（ネオソウル）とは</h1>
<p>ネオ・ソウルは、打ち込みの正確なグルーヴ（ノリ）が標準になった1990年代のR&amp;Bに対し、あえて生演奏の微妙なもたつきや揺れを残したソウルだ。 鍵盤は、フェンダー・ローズやウーリッツァーの電気ピアノ、ハモンドB-3オルガン、クラビ</p>
<p>ネオ・ソウルは、打ち込みの正確なグルーヴ（ノリ）が標準になった1990年代のR&amp;Bに対し、あえて生演奏の微妙なもたつきや揺れを残したソウルだ。

鍵盤は、フェンダー・ローズやウーリッツァーの電気ピアノ、ハモンドB-3オルガン、クラビネットが好まれる。これらは1950〜60年代に登場し、1970年代のソウルやファンクで定着した楽器だ。丸く芯のある音で和音を敷く。

和声（コードの響き）はジャズ由来だ。9度、11度、13度を重ねたテンションコード（響きに色合いを足した和音）や、予想を裏切る借用和音（別の調から借りてきた和音）が当たり前に使われる。単純な三和音（基本の3音の和音）で終わることが少ない。

リズムの核はドラムだ。機械の刻む格子から意図的に微妙にずらして叩く、いわゆるよろけたビートが特徴になる。ベースは指弾きのエレキベースやウッドベースで、拍の頭を微妙に遅らせて粘りを出すことがある。

ボーカルは、歌手によってはメリスマを抑えたり、語りに近い歌い方をしたりする。多重録音した自分の声を分厚く重ねて和音を作る手法も多い。歌詞は恋愛だけでなく、自尊心、精神性、黒人としての来歴、日常の細部、社会への違和感まで広がる。

曲は四分を超えることが珍しくなく、後半で長い即興のやりとりに突入する構成も好まれることがある。同時代の華やかなコンテンポラリーR&amp;Bと比べると、音数は少なく、低音は太く、全体に暗めで湿った質感に仕上げられることが多い。</p>
<h2>成り立ち</h2><p>音楽業界のKedar Massenburgが、この呼び名を作ったとされる。本人は1995年、まだマネージャーだった時期に作ったと述べている。のちに1997〜2004年にモータウンの社長を務めた。彼は、自分が手がけたD'AngeloやErykah Baduを売り込む言葉として、1990年代半ば〜後半に使い始めた。

音の先駆けは、1990年に登場したイギリスのOmar（英国ではOmarが先駆けと評される）や、アメリカのTony! Toni! Toné!、Meshell Ndegeocelloの『Plantation Lullabies』(1993)あたりに既にあった。だが、決定的だったのは、1995年のD'Angeloのデビュー作『Brown Sugar』である。

ヴァージニア州リッチモンドの牧師の家に生まれた彼は、教会でピアノやオルガンを弾いて育った。Princeの「書き、制作し、演奏する」姿勢の影響を受けて、自ら多くの楽器を演奏し、制作を主導した（共同制作者もいた）。

1997年には、テキサス州ダラス出身のErykah Baduが『Baduizm』を発表した。頭に巻いた大きな布とジャズ的な歌唱で、それまでのR&amp;B歌手像を書き換えた。

フィラデルフィアでは、Jazzyfatnastees（Mercedes MartinezとTracey Moore）が創設した女性向けの定期ライブBlack Lilyが、The Rootsの協力を得て、Questloveの自宅地下室から始まった。Jill Scottらフィラデルフィアの歌手を世に出した場だ。D'Angelo、Common、Bilalをつないだ場は、主にニューヨークのElectric Lady Studiosなどだった。ドラムのAhmir Questlove Thompsonが人を連れてきた。Soulquariansの一員だった、デトロイト出身のプロデューサーJ Dillaは、ほとんどクオンタイズ（演奏のズレを機械で揃える処理）に頼らず、意図的にずらしたドラムを持ち込んだ。

2000年、D'Angeloが前作から約4年半ぶりに『Voodoo』を完成させた。1996年末に始まったセッションを経た作品だ（1998〜99年の録音が主にアルバムに残った）。ニューヨークのエレクトリック・レディ・スタジオで、長時間の即興を録りためて編集した作品で、ジャンルの頂点とされる。

しかし、同作の『Untitled (How Does It Feel)』の、腰から上が裸の姿を映したビデオが、彼を性的な見世物として消費させた。約14年間、新作が出なかった。本人はツアー後に表舞台から退き、2012年にライブ復帰した。性的なイメージへの不快感や友人の自殺、依存症などが重なったとされる。

その空白期、Jill Scott、Musiq Soulchild、Angie Stone、Anthony Hamiltonらが系譜をつないだ。2010年代には、Robert Glasper、Hiatus Kaiyote、そしてKendrick Lamarの『To Pimp a Butterfly』(2015)に、その手法が流れ込んだ。2014年、D'Angeloは警官による黒人殺害への抗議のさなかに『Black Messiah』を突然発表し、復帰を果たした。</p>
