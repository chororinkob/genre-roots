<h1>Neo Soul（ネオソウル）とは</h1>
<p>打ち込みの正確なグルーヴが標準になった1990年代のR&amp;Bに対し、あえて生演奏の微妙なもたつきや揺れを残したソウル。鍵盤はフェンダー・ローズやウーリッツァーの電気ピアノ、ハモンドB-3オルガン、クラビネットといった1970年代の楽</p>
<p>打ち込みの正確なグルーヴが標準になった1990年代のR&amp;Bに対し、あえて生演奏の微妙なもたつきや揺れを残したソウル。鍵盤はフェンダー・ローズやウーリッツァーの電気ピアノ、ハモンドB-3オルガン、クラビネットといった1970年代の楽器が好まれ、丸く芯のある音で和音を敷く。和声はジャズ由来で、九度、11度、13度を重ねたテンションコードや、予想を裏切る借用和音が当たり前に使われ、単純な三和音で終わることが少ない。リズムの核はドラムで、機械の刻む格子から意図的に数十ミリ秒ずらして叩く、いわゆるよろけたビートが特徴になる。ベースは指弾きのエレキベースやウッドベースで、拍の頭を微妙に遅らせて粘りを出す。ボーカルは装飾を延々と重ねる技巧的な歌い回しを抑え、耳元で語りかけるような近い距離感で歌われ、多重録音した自分の声を分厚く重ねて和音を作る手法も多い。歌詞は恋愛だけでなく、自尊心、精神性、黒人としての来歴、日常の細部、社会への違和感まで広がる。曲は四分を超えることが珍しくなく、後半で長い即興のやりとりに突入する構成も好まれる。同時代の華やかなコンテンポラリーR&amp;Bと比べると、音数は少なく、低音は太く、全体に暗めで湿った質感に仕上げられる。</p>
<h2>成り立ち</h2><p>呼び名を作ったのはモータウンの重役だったKedar Massenburgで、自分が手がけたD'AngeloやErykah Baduを売り込む言葉として1990年代半ばに使い始めた。音の原型は1991年に登場したイギリスのOmarや、アメリカのTony Toni Toné、Meshell Ndegeocelloの『Plantation Lullabies』(1993)あたりに既にあったが、決定的だったのは1995年のD'Angeloのデビュー作『Brown Sugar』である。ヴァージニア州リッチモンドの牧師の家に生まれた彼は、教会のオルガンで育ち、Marvin GayeやPrinceの音を独りで多重録音して再現してみせた。翌1996年にはテキサス州ダラス出身のErykah Baduが『Baduizm』を発表し、頭に巻いた大きな布とジャズ的な歌唱で、それまでのR&amp;B歌手像を書き換えた。フィラデルフィアではThe Rootsの拠点だったスタジオと、彼らが主催した非公式のジャム・セッションが人材の交差点となり、ドラムのAhmir Questlove ThompsonがD'Angelo、Common、Bilalらをつないだ。ニューヨーク側では、デトロイト出身のプロデューサーJ Dillaが、クオンタイズを切って手で置いたずれたドラムを持ち込み、この揺れが世代全体の基準になった。2000年、D'Angeloが五年をかけて完成させた『Voodoo』は、ニューヨークのエレクトリック・レディ・スタジオで長時間の即興を録りためて編集した作品で、ジャンルの頂点とされる。しかし同作の『Untitled』の裸体を映したビデオが彼を性的な見世物として消費させ、本人は重圧から酒と薬に溺れて14年間表舞台から消えた。その空白期、Jill Scott、Musiq Soulchild、Angie Stone、Anthony Hamiltonらが系譜をつなぎ、2010年代にはRobert Glasper、Hiatus Kaiyote、そしてKendrick Lamarの『To Pimp a Butterfly』(2015)にその語法が流れ込んだ。2014年、D'Angeloは警官による黒人殺害への抗議のさなかに『Black Messiah』を突然発表し、復帰を果たした。</p>
<h2>代表曲</h2><ul><li>Brown Sugar (D'Angelo)</li><li>On &amp; On (Erykah Badu)</li><li>The Way (Jill Scott)</li><li>Get You (Daniel Caesar)</li><li>Love Galore (SZA)</li></ul>
