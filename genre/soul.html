<h1>Soul（ソウル）とは</h1>
<p>ソウルは、ゴスペルの語法をR&amp;Bやブルースと融合させた音楽だ。 最大の楽器は歌手の声そのもの。一つの音節を複数の音程で装飾するメリスマ、絞り出すようなグロウル（うなるような声）、裏声へ跳ね上がるファルセット、語尾を掠れさせるラスプ</p>
<p>ソウルは、ゴスペルの語法をR&amp;Bやブルースと融合させた音楽だ。

最大の楽器は歌手の声そのもの。一つの音節を複数の音程で装飾するメリスマ、絞り出すようなグロウル（うなるような声）、裏声へ跳ね上がるファルセット、語尾を掠れさせるラスプといった技法が、惜しみなく使われる。

牧師と会衆のやり取りに由来し、アフリカに根を持ち、黒人教会で受け継がれたコール・アンド・レスポンス（呼びかけと応答の掛け合い）が、曲の骨格に組み込まれている。リードとバックコーラスが掛け合いながら、熱を上げていく。

伴奏では、ハモンドB-3オルガンのレスリースピーカー（回転して音を揺らすスピーカー）が生む、揺れた音色が基本になる。Steve CropperらがTelecasterで刻むカッティング（弦を短く切るように弾く奏法）の例が代表的だ。エレクトリックベースは、ウォーキングとシンコペーションを混ぜた動きをする。そしてスネアで2拍4拍を強く叩くバックビート（2・4拍を強く打つリズム）が、リズムの基本になる。

テンポは、バラードの遅いテンポから100BPM以上の速い曲まで幅広い。バラードでは、8分音符の3連符（12/8的なフィール）を刻むピアノが、情感を支える曲が多い。

管楽器のセクションでは、テナーサックスとトランペットが同じ音やオクターブでリフを吹き、歌の合間を埋める曲が多い。

和声は、ドミナント7thやサブドミナント・マイナーを使う曲が多い。ブルーノート（ブルース特有の少し音程を下げた音）が、旋律に影を落とす。

歌詞は、失恋、欲望、貧困、誇りといった生身の主題を扱い、抽象に逃げない。ソウルはゴスペルの語法をR&amp;Bやブルースと融合させた音楽であり、後のコンテンポラリーR&amp;Bやファンクが受け継ぐ土台になった。</p>
<h2>成り立ち</h2><p>舞台は、1950年代後半から1960年代初頭の、アメリカ各地のアフリカ系アメリカ人コミュニティだ。ソウルは、ゴスペルの語法をR&amp;Bやブルースと融合させて生まれた。ゴスペルから世俗へ移った歌手（Sam Cookeなど）が、大きな役割を果たした。

Ray Charlesは、ソウルの普及者・原型の一つとしてしばしば挙げられる。1954年の「I Got a Woman」は、ゴスペルのSouthern Tonesが1954年に録音した「It Must Be Jesus」を元にしたとされる（クレジットはBob King名義とする記述がある）。神ではなく女性への賛歌へと、置き換えたものだった。教会音楽を色恋に流用する行為は、ゴスペル界・信者から強い反発を受けた。

Sam Cookeは、ゴスペルグループThe Soul Stirrersの看板歌手だった。しかし1956〜57年に世俗歌手へ転向すると、熱心な信者のファンから反発を受けた。それでも「You Send Me」で全米1位を獲得した。

1960年代に入ると、レーベルごとに個性が分かれる。デトロイトのMotownでは、Berry Gordy Jr.が自動車工場の流れ作業を模した制作体制を敷いた。Holland-Dozier-Hollandの作曲チームとThe Funk Brothersの演奏で、洗練されたポップ寄りのサウンドを量産した。

対してメンフィスのStax Recordsは、Booker T. &amp; the M.G.'sという白人と黒人の混成バンドを専属に据えた。ヘッド・アレンジ中心で、スタジオ内で即興的にアレンジを固める制作方法をとり、Otis Reddingを送り出した。Atlanticから貸し出されたSam &amp; Daveも、Staxで録音した。

アラバマ州のFAME Studiosでは、白人のリズムセクション（拍や和音を支える楽器の組）が黒人歌手を支えた。ここで、Aretha Franklinの1967年「I Never Loved a Man (The Way I Love You)」が録音された。1964年の公民権法で隔離は違法となったが、慣行と社会的圧力で隔離は残った。そうした土地で人種混成の録音を行ったことは、シンボルとしての意味を持った（当事者は自らを「colorblind」と述べている）。

公民権運動の高まりとともに、ソウルは黒人の誇りを表現する媒体となった。James Brownの1968年「Say It Loud - I'm Black and I'm Proud」が、その代名詞となる。しかし1968年のMartin Luther King Jr.暗殺はメンフィスで起き、Stax内部の人種間の信頼にも亀裂を生んだとされる。

1960年代に始まっていた社会派の流れは、1970年代にMarvin Gayeの「What's Going On」やCurtis Mayfieldの作品で大きく展開した。一方、フィラデルフィアのGamble &amp; HuffがBunny Siglerらとともに、弦楽器を重ねたフィリーソウルを発展させたとされる。それがディスコへ流れ込んだ。

1980年代以降は、コンテンポラリーR&amp;Bへ形を変えた。1990年代には、ネオソウルとして生演奏の質感が戻ってきた。</p>
