<h1>Soul（ソウル）とは</h1>
<p>教会で培われたゴスペルの歌唱技術を、そのまま世俗的な恋愛や生活の歌に持ち込んだ音楽。最大の楽器は歌手の声そのもので、一つの音節を複数の音程で装飾するメリスマ、絞り出すようなグロウル、裏声へ跳ね上がるファルセット、語尾を掠れさせるラ</p>
<p>教会で培われたゴスペルの歌唱技術を、そのまま世俗的な恋愛や生活の歌に持ち込んだ音楽。最大の楽器は歌手の声そのもので、一つの音節を複数の音程で装飾するメリスマ、絞り出すようなグロウル、裏声へ跳ね上がるファルセット、語尾を掠れさせるラスプといった技法が惜しみなく使われる。牧師と会衆のやり取りに由来するコール・アンド・レスポンスが曲の骨格に組み込まれ、リードとバックコーラスが掛け合いながら熱を上げていく。伴奏はハモンドB-3オルガンのレスリースピーカーが生む揺れた音色、テレキャスターのカッティング、ウォーキングとシンコペーションを混ぜたエレクトリックベース、そしてスネアの2拍4拍を強く叩くバックビートが基本。テンポは60〜120BPM程度で、バラードでは16分音符を細かく刻むトリプレット系のピアノが情感を支える。管楽器のセクションはテナーサックスとトランペットが同度やオクターブでリフを吹き、歌の合間を埋める。和声はドミナント7thやサブドミナント・マイナーを多用し、ブルーノートが旋律に影を落とす。歌詞は失恋、欲望、貧困、誇りといった生身の主題を扱い、抽象に逃げない。ゴスペルが神に向ける言葉をそのまま恋人に向け替えた、という構造がソウルの本質であり、後のR&amp;Bやファンクが受け継ぐ土台になった。</p>
<h2>成り立ち</h2><p>1950年代後半のアメリカ南部と中西部で、ゴスペル歌手が教会を離れて世俗の音楽へ移ることで生まれた。決定的な一歩を踏み出したのはRay Charlesで、1954年の「I Got a Woman」はゴスペルのAlex Bradfordの曲「It Must Be Jesus」の旋律を、神ではなく女性への賛歌に置き換えたものだった。教会音楽を色恋に流用する行為は聖職者から冒涜と激しく非難され、Charlesは長く批判に晒された。Sam CookeはゴスペルグループThe Soul Stirrersの看板歌手だったが、1957年に世俗歌手へ転向すると熱心な信者のファンから裏切り者と罵られ、それでも「You Send Me」で全米1位を獲得した。1960年代に入るとレーベルごとに個性が分かれる。デトロイトのMotownはBerry Gordy Jr.が自動車工場の流れ作業を模した制作体制を敷き、Holland-Dozier-Hollandの作曲チームとThe Funk Brothersの演奏で洗練されたポップ寄りのサウンドを量産した。対してメンフィスのStax Recordsは、Booker T. &amp; the M.G.'sという白人と黒人の混成バンドを専属に据え、一発録りの生々しい音でOtis ReddingやSam &amp; Daveを送り出した。アラバマ州のFAME Studiosでは白人のリズムセクションが黒人歌手を支え、Aretha Franklinの1967年「I Never Loved a Man (The Way I Love You)」が録音された。人種隔離が法として残る土地で白人と黒人が同じ部屋で演奏することは、それ自体が政治的な行為だった。公民権運動の高まりとともにソウルは黒人の誇りを表現する媒体となり、James Brownの1968年「Say It Loud - I'm Black and I'm Proud」がその象徴となる。しかし1968年のMartin Luther King Jr.暗殺はメンフィスで起き、Stax内部の人種間の信頼にも亀裂を生んだ。1970年代にはMarvin Gayeの「What's Going On」やCurtis Mayfieldがベトナム戦争や都市の貧困を歌う社会派の路線を確立する一方、フィラデルフィアのGamble &amp; Huffが弦楽器を重ねたフィリーソウルを作り、それがディスコへ流れ込んだ。1980年代以降はコンテンポラリーR&amp;Bへ形を変え、1990年代にはネオソウルとして生演奏の質感が回帰した。</p>
<h2>代表曲</h2><ul><li>Respect (Aretha Franklin)</li><li>What's Going On (Marvin Gaye)</li><li>Sittin' On The Dock of the Bay (Otis Redding)</li></ul>
