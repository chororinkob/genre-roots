<h1>Gothic Metal（ゴシックメタル）とは</h1>
<p>ドゥームやデスメタルの重さに、ゴシックロック由来の暗く耽美な雰囲気を融合させた音楽。ギターは低く調弦して分厚い和音を鳴らすが、同時に長い残響をかけた清らかな音色のアルペジオが多用され、重さと繊細さが交互に現れる。編成にはシンセサイ</p>
<p>ドゥームやデスメタルの重さに、ゴシックロック由来の暗く耽美な雰囲気を融合させた音楽。ギターは低く調弦して分厚い和音を鳴らすが、同時に長い残響をかけた清らかな音色のアルペジオが多用され、重さと繊細さが交互に現れる。編成にはシンセサイザーやピアノ、時に本物の弦楽器や合唱が加わり、教会音楽を思わせる響きを作る。テンポは毎分60から100拍程度と遅めで、荘重に進む。和声はほぼ短調で、旋律的短音階や半音階的な進行を用いて悲哀を強調し、これが同種のメタルの中でも特に旋律を重んじる性格を生んでいる。歌唱に最大の特徴があり、低く唸るデスヴォイスと、澄んだソプラノの女声が同じ曲の中で交互に、あるいは同時に歌われる。この対比は美女と野獣と呼ばれ、このジャンルの署名になっている。歌詞は死、喪失、禁じられた愛、宗教的な罪、吸血鬼や幽霊といった文学的な意匠を扱い、十九世紀の英国ゴシック小説やロマン派詩の引用も多い。視覚表現も不可分で、黒いレースや十九世紀風の衣装、廃墟や墓地での撮影が定型になっている。ライブは煙と蝋燭を模した照明で、劇場的に演出される。</p>
<h2>成り立ち</h2><p>始まりは1990年代初頭のイギリス北部である。ヨークシャー州ハリファックスで1988年に結成されたParadise Lostが、デスメタルの重さに旋律とシンセを持ち込み、1991年の『Gothic』でこの言葉を音楽の名として定着させた。同じ時期、リヴァプールのAnathemaとハダーズフィールドのMy Dying Brideが同種の方向を追求し、この三組はまとめてピースヴィル・スリーと呼ばれた。レーベルPeacevilleがその発表の場だった。My Dying Brideはヴァイオリンを常時編成に加え、20分を超える曲で圧倒的な悲哀を作った。1990年代半ば、この様式は大陸へ広がる。ノルウェーではThe 3rd and the Mortalが女性歌手を前面に出し、フィンランドではAmorphisやSentencedが北欧の旋律を持ち込んだ。決定的だったのはオランダのThe Gatheringで、1995年、Anneke van Giersbergenを迎えた『Mandylion』が、女声を主役に据えた新しい形を提示した。同じ年、ノルウェーのTheatre of Tragedyが『Theatre of Tragedy』で、男性のデスヴォイスと女性のソプラノを対比させる型を確立し、これが美女と野獣と呼ばれ広く模倣された。フィンランドのNightwishは1996年に結成され、オペラの発声を持つTarja Turunenを迎えて、より交響的な方向へ進み、これは後にシンフォニック・メタルとして分岐した。オランダのWithin Temptationとエピカ、スイスのLacuna Coilが続き、2000年代前半には欧州で大規模な市場を形成した。ドイツのType O Negativeは、ニューヨーク発ながらこの語法に近く、Peter Steeleの極端に低い声で独自の位置を占めた。2000年代半ば以降は主流の座を降りたが、欧州の大型野外祭では今も安定した聴衆を集めている。</p>
<h2>代表曲</h2><ul><li>Gothic（Paradise Lost）</li><li>Black No.1（Type O Negative）</li><li>To Mega Therion（Therion）</li><li>Ice Queen（Within Temptation）</li><li>The Phantom Agony (Epica)</li></ul>
