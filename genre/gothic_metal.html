<h1>Gothic Metal（ゴシックメタル）とは</h1>
<p>ゴシック・メタルは、ドゥームやデスメタルの重さに、ゴシックロック由来の暗く耽美な雰囲気を融合させた音楽だ。 中心はギターだ。低く調弦（弦の音合わせ）して、分厚い和音を鳴らす。同時に、長い残響をかけた清らかな音色のアルペジオ（和音を</p>
<p>ゴシック・メタルは、ドゥームやデスメタルの重さに、ゴシックロック由来の暗く耽美な雰囲気を融合させた音楽だ。

中心はギターだ。低く調弦（弦の音合わせ）して、分厚い和音を鳴らす。同時に、長い残響をかけた清らかな音色のアルペジオ（和音を1音ずつ順に弾く奏法）が、多く使われる。そのため、重さと繊細さが交互に現れる。編成には、シンセサイザーやピアノが加わる。時には本物の弦楽器や合唱も加わり、教会音楽を思わせる響きを作る。

和声（コードの響き）は、ほぼ短調だ。旋律的短音階（短調の音階の一種）や、半音階的な進行を使って、悲哀を強調する傾向がある。

テンポは、遅めからミドルテンポが中心で、荘重に進む。

歌唱の特徴として、低く唸るデスヴォイスと、澄んだソプラノの女声が、同じ曲の中で交互に、あるいは同時に歌われる。この対比は美女と野獣と呼ばれ、ジャンルの重要な流れの一つである。

歌詞は、死、喪失、禁じられた愛、宗教的な罪、吸血鬼や幽霊といった、文学的な意匠を扱う。19世紀の英国ゴシック小説やロマン派詩の引用も多い傾向がある。

見た目の面では、一部のバンドは耽美的な衣装や映像を用いる。</p>
<h2>成り立ち</h2><p>多くの資料では、始まりは1990年代初頭のイギリス北部とされる。

その中心にいたのが、ウェスト・ヨークシャーのハリファックスで1988年に結成されたParadise Lostだ。彼らは、デスメタルの重さに旋律とシンセを持ち込んだ。1991年に発表した『Gothic』は、のちにジャンル名の由来とされるアルバムになった。同じ時期に、リヴァプールのAnathemaと、ブラッドフォードのMy Dying Brideが、同種の方向を追求した。この三組は、まとめてピースヴィル・スリーと呼ばれた。レーベルPeacevilleが、その発表の場だった。My Dying Brideは、ヴァイオリンを編成に加えた（時期によって編成から外れた期間もある）。7〜12分台の長尺曲が中心で、のちには27分の曲も作り、圧倒的な悲哀を作った。

1990年代半ば、このスタイルは大陸へ広がる。ノルウェーでは、The 3rd and the Mortalが女性歌手を前面に出した。フィンランドでは、Sentencedが、メロディックデスメタルから出発し、1996年頃にゴシックメタルへ移行した。

決定的だったのは、オランダのThe Gatheringだ。1994年にAnneke van Giersbergenが加入し、彼女を迎えた1995年の『Mandylion』が、女声を主役にした最初期の作品の一つとして、新しい形を示した。

同じ年、ノルウェーのTheatre of Tragedyは、Wikipediaなどでは「アルバム全編をこの対比に充てた最初のバンド」とされ、広く模倣された。

フィンランドのNightwishは、1996年に結成された。結成時からのボーカリストは、オペラの発声を持つTarja Turunenだ。彼女とともに、ゴシックの要素を取り込んだシンフォニック／パワーメタルのバンドとなった。ゴシックメタルの周辺では、Within TemptationやLacuna Coilなどが、国際的に成功した。

アメリカ（ブルックリン）のType O Negativeは、ジャンル最初期から活動したバンドだ。美女と野獣型とは別の、ドゥームとゴシックロックの融合型として、Peter Steeleの極端に低い声で、独自の位置を占めた。

2000年代には、欧州、とくにフィンランドで、主流に近づいた。欧州の大型野外祭では、今も安定した聴衆を集めているとされる。</p>
