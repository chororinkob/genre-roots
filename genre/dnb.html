<h1>Drum and Bass（ドラムアンドベース）とは</h1>
<p>1秒あたり約2.8回という速いブレイクビーツと、その半分の速さで動く重い低音を組み合わせた電子ダンス音楽。テンポは160〜180BPMだが、ベースラインとコード進行は80〜90BPMの感覚で進むため、聴き手は速さと遅さを同時に感じ</p>
<p>1秒あたり約2.8回という速いブレイクビーツと、その半分の速さで動く重い低音を組み合わせた電子ダンス音楽。テンポは160〜180BPMだが、ベースラインとコード進行は80〜90BPMの感覚で進むため、聴き手は速さと遅さを同時に感じる二重構造になる。ドラムはアーメン・ブレイクをはじめとするファンクのドラム・ループを一打ずつ切り離し、順序を組み替えて作られ、スネアの位置をずらすことでうねりを生む。低音は正弦波に近いサブベース、あるいはリース・ベースと呼ばれる複数の鋸歯状波をわずかにずらして唸らせた音で、クラブの巨大なスピーカーで初めて全貌が聴こえるよう設計されている。曲の構成は、静かな導入から16小節または32小節でドラムが一斉に入る瞬間（ドロップ）を軸に組み立てられる。上物はジャズのピアノやサックス、映画音楽の弦、女性ボーカルの断片、SF的な効果音まで幅広く、この上物の選び方によってリキッド、ニューロファンク、ジャンプアップなどの下位様式に分かれる。ハウスやテクノが均等な四つ打ちで身体を上下させるのに対し、こちらは不均等なブレイクビーツで細かく身体を分節させる点が根本的に違う。</p>
<h2>成り立ち</h2><p>1990年代初頭のイギリスで、レイブから枝分かれして生まれた。1991年前後のブレイクビーツ・ハードコアは、四つ打ちのバスドラムとヒップホップから借りたブレイクビーツを重ねていたが、DJたちがレコードの回転数を上げて速くかけるうちに、ブレイクビーツだけが残って四つ打ちが消えていった。ここに、カリブ系移民の子どもたちが持っていたレゲエのサウンドシステム文化——低音の圧力と、その場で声を乗せるMCの存在——が合流し、1993年頃にジャングルと呼ばれる形になる。決定的な素材が、The Winstonsが1969年に録音した「Amen, Brother」の間奏6秒間、いわゆるアーメン・ブレイクだった。ロンドンのReinforced Recordsを拠点にした4heroや、Goldie、Dego、Marc Macがこの解体作業を推し進める。Goldieは1995年のアルバム「Timeless」で長尺の構成と管弦楽的な広がりを持ち込み、この音楽が長時間聴かせる作品になりうることを示した。彼が主宰したレーベルMetalheadzと、ロンドンの会場Blue Noteでの日曜の催しが、1990年代半ばの中心地になる。並行してLTJ Bukemのレーベル Good Lookingが、ジャズと環境音楽を取り込んだ穏やかな系統を確立した。この頃から「ジャングル」という呼称に付きまとった暴力的な印象を避けるため、より中立的な「ドラムンベース」の語が使われるようになる。1997年、ブリストルのRoni Sizeが率いたReprazentのアルバム「New Forms」が英国の権威ある音楽賞マーキュリー・プライズを受賞し、批評的な評価が確立した。1996年前後にはEd Rush、Optical、Trace、Nico らによる暗く金属的なテックステップが台頭し、その後Andy CのRAM Records、Hospital Recordsなどが商業的な基盤を作る。2000年代にはPendulumがロック的な編成でチャートに入り、2010年代以降はブラジル、日本、南アフリカなど各地に定着した。イギリスの黒人青年文化から生まれた音楽が、警察による会場規制や偏見にさらされながら国際的な標準になった経緯は、この分野を語るうえで欠かせない。</p>
<h2>代表曲</h2><ul><li>New Forms（Roni Size）</li><li>Valley of the Shadows（Origin Unknown）</li><li>Timewarp（Sub Focus）</li><li>If We Ever（High Contrast）</li></ul>
