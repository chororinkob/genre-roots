<h1>Drum and Bass（ドラムアンドベース）とは</h1>
<p>1秒あたり約2.8回という速いブレイクビーツと、その半分の速さで動く重い低音を組み合わせた電子ダンス音楽。テンポは一般に160〜180BPM（1996年ごろからは主に170〜180）だが、ベースラインとコード進行は半分の速さ（80</p>
<p>1秒あたり約2.8回という速いブレイクビーツと、その半分の速さで動く重い低音を組み合わせた電子ダンス音楽。テンポは一般に160〜180BPM（1996年ごろからは主に170〜180）だが、ベースラインとコード進行は半分の速さ（80〜90BPM）で捉えられることが多く、聴き手は速さと遅さを同時に感じる二重構造になる。ドラムはアーメン・ブレイクをはじめとするファンクのドラム・ループを一打ずつ切り離し、順序を組み替えて作られ、スネアの位置をずらすことでうねりを生む。低音は正弦波（なめらかな波形）に近いサブベース（耳より体に響く極低音）、あるいはリース・ベースと呼ばれる、いまは複数の鋸歯状波（のこぎりの歯のような波形）をわずかにずらして重ね、唸らせて作ることが多い音で、クラブの大音量のスピーカーで、体に強く感じられる。曲の構成は、8・16・32小節ごとの区切りが一般的で、ドラムがいったん引いたあと、より複雑なビートと重いベースが戻ってくる瞬間（ドロップ）が山場になる。上物（メロディーなど上に重ねる音）はジャズのピアノやサックス、映画音楽の弦、女性ボーカルの断片、SF的な効果音まで幅広く、この上物の選び方、ベースの音色、ムードの違いによって、リキッド、ニューロファンク、ジャンプアップなどの細かい種類に分かれる。ハウスやテクノが均等な四つ打ちで身体を上下させるのに対し、こちらは不均等なブレイクビーツで細かく身体を区切って動かす点が根本的に違う。</p>
<h2>成り立ち</h2><p>1990年代初頭のイギリスで、レイブから枝分かれして生まれた。1991年前後のブレイクビーツ・ハードコアは、四つ打ちのバスドラムとヒップホップから借りたブレイクビーツを重ねていたが、DJたちが速いテンポでかけ、ブレイクビーツを重んじる流れが進むなかで、四つ打ちは後ろに下がっていった。ここに、カリブ系移民の子どもたちが持っていたレゲエのサウンドシステム（巨大なスピーカーを積んだ移動式の音響設備）文化——低音の圧力と、その場で声を乗せるMCの存在——が合流し、1991〜92年ごろから「ジャングル」という呼び名と音楽の形が現れ、1993年ごろにかけて独立した音楽になる。「ジャングル」という言葉の由来には諸説ある。最もよく知られた素材の一つが、The Winstonsが1969年に録音した「Amen, Brother」の間奏の約6〜7秒間、いわゆるアーメン・ブレイクだった。ロンドンのReinforced Recordsを拠点にした4hero（Marc MacとDego）やGoldieがこの解体作業を推し進める。Goldieは1995年のアルバム「Timeless」で長い構成と管弦楽的（オーケストラのような）な広がりを持ち込み、この音楽が長時間聴かせる作品になりうることを示した。彼が主宰したレーベルMetalheadzと、ロンドンの会場Blue Noteでの日曜の催しが、1990年代半ばの中心地になる。並行してLTJ Bukemのレーベル Good Lookingが、ジャズと環境音楽を取り込んだ穏やかな系統を確立した。1995年までに、より中立的な「ドラムンベース」の語が総称として使われるようになる。「ジャングル」という呼称に付きまとった暴力的な印象を避けるためという見方もあるが、反応としてか、独立した動きとしてかは定説がない。1997年、ブリストルのRoni Sizeが率いたReprazentのアルバム「New Forms」が英国の権威ある音楽賞マーキュリー・プライズを受賞し、批評的な評価が確立した。1996年前後にはEd Rush、Trace、Nicoらが形づくった暗く金属的なテックステップが人気を集めた。のちにEd RushとOpticalが、そこからニューロファンクを発展させた。1992年設立のAndy CのRAM Recordsや、1996年設立のHospital Recordsなどが商業的な基盤を作った。2000年代にはPendulumがロック的な編成でチャートに入り、ブラジル、日本、南アフリカなど各地にも2000年代にかけて広がった。2010年代以降も、各地で世代を替えながら続いている。イギリスのレイブとジャマイカのサウンドシステム文化の中で、黒人系の若者を中心に支持され、メディアの偏見や警察の注目にさらされながら世界に広がった経緯は、この分野を語るうえで欠かせない。</p>
