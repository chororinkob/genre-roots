<h1>Drum and Bass（ドラムアンドベース）とは</h1>
<p>ドラムンベースは、速いブレイクビーツと、その半分の速さで動く重い低音を組み合わせた電子ダンス音楽だ。ブレイクビーツは1秒あたり約2.8回の速さで刻まれる。 テンポは一般に160〜180BPMで、1996年ごろからは主に170〜18</p>
<p>ドラムンベースは、速いブレイクビーツと、その半分の速さで動く重い低音を組み合わせた電子ダンス音楽だ。ブレイクビーツは1秒あたり約2.8回の速さで刻まれる。

テンポは一般に160〜180BPMで、1996年ごろからは主に170〜180になった。ところがベースラインとコード進行は、半分の速さにあたる80〜90BPMの感覚で捉えられることがある。そのため聴き手は、速さと遅さを同時に感じることがある。これが二重構造と呼ばれる。

ドラムは、アーメン・ブレイクをはじめとするファンクのドラム・ループを、一打ずつ切り離して作る。切り離した音は順序を組み替える。スネアの位置をずらすことで、うねりが生まれる。

低音には、大きく分けて二つの種類がある。ひとつは、正弦波（なめらかな波形）に近いサブベースだ。耳より体に響く極低音をいう。もうひとつは、リース・ベースと呼ばれる音で、現在は、わずかにデチューンした鋸歯状波（のこぎりの歯のような波形）を重ねて作るのが一般的だ。こうした低音は、クラブの大音量のサウンドシステムで、体感として強く感じられる。

曲の山場は、ドロップである。ドラムが一度引いた後、より複雑なビートと重いベースが戻る瞬間をいう。曲の構成は、8・16・32小節単位が一般的だ。

上物（メロディーなど上に重ねる音）は、ジャズのピアノやサックス、映画音楽の弦、女性ボーカルの断片、SF的な効果音まで幅広い。上物、ベースの音色、ムードの違いによって、リキッド、ニューロファンク、ジャンプアップなどのスタイルに枝分かれする。

ハウスやテクノは、均等な四つ打ちで身体を上下させる。これに対し、ドラムンベースは不均等なブレイクビーツで、細かく身体を区切って動かす。この点が根本的に違う。</p>
<h2>成り立ち</h2><p>1990年代初頭のイギリスで、レイブから枝分かれして生まれた。

1991年前後のブレイクビーツ・ハードコアは、四つ打ちのバスドラムと、ヒップホップから借りたブレイクビーツを重ねていた。やがてテンポの上昇とブレイクビーツ重視が進み、四つ打ちが後退した。

ここに、カリブ系移民の子どもたちが持っていたレゲエのサウンドシステム（巨大なスピーカーを積んだ移動式の音響設備）文化が合流する。低音の圧力と、その場で声を乗せるMCの存在だ。こうして1991〜92年ごろから「ジャングル」の語とスタイルが現れ、1993年ごろにかけて独立したスタイルになる。

最も代表的な素材の一つが、The Winstonsが1969年に録音した「Amen, Brother」の間奏約6〜7秒間、いわゆるアーメン・ブレイクだった。ロンドンのReinforced Recordsを拠点にした4hero（Marc MacとDego）やGoldieが、この解体作業を推し進める。Goldieは1995年のアルバム「Timeless」で、長い構成と管弦楽的（オーケストラのような）な広がりを持ち込んだ。この音楽が長時間聴かせる作品になりうることを示したのだ。

彼が主宰したレーベルMetalheadzと、ロンドンの会場Blue Noteでの日曜の催しが、1990年代半ばの中心地になる。並行してLTJ Bukemのレーベル Good Lookingが、ジャズと環境音楽を取り込んだ穏やかな系統を固めた。

1995年までに、より中立的な「ドラムンベース」の語が総称として使われるようになる。「ジャングル」という呼称に付きまとった暴力的な印象を避けるためという見方もある。ただ、反応としてか、独立した動きとしてかは定説がない。

1997年、ブリストルのRoni Sizeが率いたReprazentのアルバム「New Forms」が、英国の権威ある音楽賞マーキュリー・プライズを受賞した。批評的な評価が定着した。

1996年前後には、暗く金属的なテックステップを、Ed Rush、Trace、Nicoらが形成した。のちにEd RushとOpticalが、ニューロファンクへ発展させた。1992年設立のAndy CのRAM Recordsや、1996年設立のHospital Recordsなどが、商業的な土台を作った。

2000年代にはPendulumがロック的な編成でチャートに入った。また、2000年代にかけて、ブラジル・日本・南アフリカなど各地に広がった。

UKレイブとジャマイカのサウンドシステム文化の中で、黒人系の若者を中心に支持され、メディアの偏見や警察の注目にさらされながら世界に広がった経緯は、この分野を語るうえで欠かせない。</p>
