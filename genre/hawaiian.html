<h1>Hawaiian（ハワイアン）とは</h1>
<p>ハワイ諸島に伝わる音楽と、そこから発展した現代のハワイ音楽である。 伝統の中心にあるのは、メレ（歌・詩）の中の詠唱、つまりオリやメレ・フラだ。一つの音を中心に唱えるスタイルもあり、言葉の抑揚とくり返しで、家系の歴史や神話、土地の記</p>
<p>ハワイ諸島に伝わる音楽と、そこから発展した現代のハワイ音楽である。

伝統の中心にあるのは、メレ（歌・詩）の中の詠唱、つまりオリやメレ・フラだ。一つの音を中心に唱えるスタイルもあり、言葉の抑揚とくり返しで、家系の歴史や神話、土地の記憶を伝える。

詠唱の伴奏には、二連の瓢箪でできた打楽器イプ・ヘケや、サメの皮を張った太鼓パフが使われる。フラの踊り手は、竹の棒プイリや石のカスタネットなどを手にする。

19世紀以降は、外から来た楽器が加わり、現代の姿ができた。ウクレレは弦をはじく4弦の小型の楽器で、高音の軽い響きが特徴だ。スラック・キー・ギターは、弦をゆるめて、開放弦だけで和音が鳴るように調弦したギターである。親指で低音を刻みながら指で旋律を弾く、独奏のスタイルが発達した。スチール・ギターは、金属の棒を弦に当てて滑らせ、音の高さを切れ目なく変える楽器だ。あの独特の伸びる音は、ハワイで生まれた。

讃美歌が持ち込まれたことで、西洋の和声と合唱のスタイルが定着した。素朴な長調の響きが好まれる。

歌い方の代表的な特徴の一つが、ハワイアン・ファルセットだ。地声と裏声をわざと行き来させ、声が裏返る瞬間そのものを美しさとして聴かせる。

歌詞はハワイ語と英語で書かれる。土地の名、雨や風、花、愛、そして失われた王国への思いを、ふたつの意味を込めた表現で歌う。</p>
<h2>成り立ち</h2><p>1778年にJames Cookが来るまで、ハワイには文字がなかった。歴史や家系の流れは、主に詠唱によって伝えられていた。

19世紀初め、キリスト教の宣教師が島にやって来た。1820年代から讃美歌を教えたことで、合唱の和声と長調のメロディーが持ち込まれた。この和声とハワイ語の詠唱が混ざり合い、ヒメニと呼ばれる独自の合唱が生まれる。

1870年代から80年代には、ポルトガル領マデイラ島などから移民がやって来た。彼らが持ち込んだマシェーテ（ブラギーニャ）やラジャオンなどの楽器が原型となり、1880年代にウクレレが生まれた。名前は「跳ねる蚤」という意味だとされるが、語源には諸説ある。

同じころ、王のDavid Kalakauaはフラを復興させた。フラは、宣教師の影響を受けて1830年に人前での上演が禁じられ、のちに免許制で規制されていた。王は、王国の文化政策として音楽を守った。王の妹Liliuokalaniは作曲家でもあり、『Aloha Oe』を書いている。

だが1893年、アメリカ系を中心とする実業家や住民らの「安全委員会」が、アメリカ軍の支援を受けてクーデターを起こし、女王を退位させた。1898年、ハワイはアメリカに併合される。それに先立つ1896年、ハワイ共和国の法律で、ハワイ語は学校の授業の言葉として禁じられた。話す人は激減していく。

皮肉にも、音楽は逆に広まった。1915年のサンフランシスコ万国博覧会(パナマ・パシフィック万国博覧会)で、ハワイ音楽は大人気となる。翌1916年には、ハパ・ハオレを多く含むハワイ音楽のレコードが、アメリカ本土で他のほぼすべてのジャンルより売れたと言われる。博覧会の後には、ティン・パン・アレーの作家たちも、英語詞のハワイ風の曲であるハパ・ハオレを数多く作った。

大きな転機は1970年代に訪れる。ハワイアン・ルネサンスと呼ばれる文化の復興運動が起こった。Gabby Pahinuiはスラック・キーの伝統をよみがえらせた。The Sons of Hawaiiはハワイ語と文化への敬愛を、のちにIsrael Kamakawiwooleは主権回復の主張も、音楽に取り戻した。

Israelは1997年に38歳で亡くなった。それでも、彼がウクレレ1本で弾き語った『Over the Rainbow』は、世界中で聴かれ続けている。これは『What a Wonderful World』とのメドレーで、1988年に録音された原盤は1993年のアルバム『Facing Future』に収められた。1990年の『Ka Anoi』には、別の録音が入っている。</p>
