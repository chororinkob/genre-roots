<h1>Hawaiian（ハワイアン）とは</h1>
<p>ハワイ諸島に伝わる音楽と、そこから発展した現代のハワイ音楽。核となる伝統はメレと呼ばれる詠唱で、メロディーの幅が狭く、言葉の抑揚とくり返しで、家系の歴史や神話、土地の記憶を伝えるものである。詠唱の伴奏には、二連の瓢箪の打楽器イプ・</p>
<p>ハワイ諸島に伝わる音楽と、そこから発展した現代のハワイ音楽。核となる伝統はメレと呼ばれる詠唱で、メロディーの幅が狭く、言葉の抑揚とくり返しで、家系の歴史や神話、土地の記憶を伝えるものである。詠唱の伴奏には、二連の瓢箪の打楽器イプ・ヘケや、サメ皮を張った太鼓パフが用いられる(フラの踊り手は、竹の棒プイリや石のカスタネットなどを使う)。19世紀以降、外来の楽器が加わって現代の姿ができた。ウクレレは4弦の小型撥弦楽器で、高音の軽い響きが特徴である。スラック・キー・ギターは、ギターの弦をゆるめて開放弦だけで和音が鳴る調弦にしたもので、親指で低音を刻みながら指で旋律を弾く独奏形式が発達した。スチール・ギターは金属の棒を弦に当てて滑らせ、音程を連続的に変化させる楽器で、あの独特の伸びる音はハワイ発祥である。和音は讃美歌に由来する三つの音の和音が基本で、素朴な長調の響きが好まれる。歌唱の最大の特徴は、地声と裏声を意図的に断続させるハワイアン・ファルセットで、声が裏返る瞬間そのものを美しさとして聴かせる。歌詞はハワイ語と英語で、土地の名、雨や風、花、愛、そして失われた王国への思いを、ふたつの意味を込めた表現で歌う。</p>
<h2>成り立ち</h2><p>1778年のJames Cookの到来以前、ハワイには文字がなく、歴史と系譜は主に詠唱によって伝えられていた。19世紀初頭、キリスト教の宣教師が来島し、1820年代から讃美歌を教えたことで、4声の和音と、長調のメロディーが持ち込まれた。この和声とハワイ語の詠唱が混ざり、ヒメニと呼ばれる独自の合唱が生まれる。1870年代から80年代、ポルトガル領マデイラ島からの契約労働者が、ブラギーニャという小型の弦楽器を持ち込み、これがウクレレになった。名は跳ねる蚤という意味だとされる。この時期、王のDavid Kalakauaは、宣教師の影響を受けて1830年に公の上演が禁じられ、のち免許制で規制されていたフラを復興させ、王国の文化政策として音楽を保護した。彼の妹Liliuokalaniは作曲家でもあり、『Aloha Oe』を書いている。だが1893年、米系を中心とする実業家・居住者らの「安全委員会」が、米軍の支援のもとでクーデターを起こして女王を退位させ、1898年にハワイはアメリカに併合された。ハワイ語は、併合に先立つ1896年に、ハワイ共和国の法律で学校の授業言語として禁じられ、話者は激減する。皮肉にも音楽は逆に広まった。1915年のサンフランシスコ万国博覧会(パナマ・パシフィック万国博覧会)でハワイ音楽が大人気となり、翌1916年には、ハワイ先住の音楽の録音が米国のほかのどのジャンルよりも売れた。同じ時期には、ティン・パン・アレーが作ったハワイ風の曲(ハパ・ハオレ)も多数出回った。大きな転機は1970年代である。ハワイアン・ルネサンスと呼ばれる文化復興運動が起こり、Gabby Pahinuiがスラック・キーの伝統を再興し、The Sons of Hawaiiはハワイ語と文化への敬愛を、後にIsrael Kamakawiwooleは主権回復の主張も、音楽に取り戻した。Israelは1997年に38歳で亡くなったが、彼がウクレレ1本で弾き語った『Over the Rainbow』(『What a Wonderful World』とのメドレーで、1988年に録音され、1993年のアルバム『Facing Future』に収録された)は世界中で聴かれ続けている。</p>
<h2>代表曲</h2><ul><li>Over the Rainbow/What a Wonderful World (Israel Kamakawiwo'ole)</li><li>Kaulana Na Pua (The Sons of Hawaii)</li><li>Hi'ilawe (Gabby Pahinui)</li><li>Honolulu City Lights (Keola Beamer)</li><li>Pearly Shells (Don Ho)</li><li>Tiny Bubbles (Don Ho)</li><li>White Sandy Beach of Hawai'i (Israel Kamakawiwoʻole)</li><li>Pua Lilia (Ledward Kaapana)</li><li>Waikiki Hula (Gabby Pahinui)</li><li>Kaimana Hila (Hui Ohana)</li></ul>
