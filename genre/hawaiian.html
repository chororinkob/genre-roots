<h1>Hawaiian（ハワイアン）とは</h1>
<p>ハワイ諸島に伝わる音楽と、そこから発展した現代のハワイ音楽。核となる伝統はメレと呼ばれる詠唱で、旋律の幅が狭く、言葉の抑揚と反復によって系譜や神話、土地の記憶を伝えるものである。伴奏は瓢箪の打楽器イプや、竹の棒プイリ、石のカスタネ</p>
<p>ハワイ諸島に伝わる音楽と、そこから発展した現代のハワイ音楽。核となる伝統はメレと呼ばれる詠唱で、旋律の幅が狭く、言葉の抑揚と反復によって系譜や神話、土地の記憶を伝えるものである。伴奏は瓢箪の打楽器イプや、竹の棒プイリ、石のカスタネットで、旋律楽器を持たない。十九世紀以降、外来の楽器が加わって現代の姿ができた。ウクレレは四弦の小型撥弦楽器で、高音の軽い響きが特徴である。スラック・キー・ギターは、ギターの弦をゆるめて開放弦だけで和音が鳴る調弦にしたもので、親指で低音を刻みながら指で旋律を弾く独奏形式が発達した。スチール・ギターは金属の棒を弦に当てて滑らせ、音程を連続的に変化させる楽器で、あの独特の伸びる音はハワイ発祥である。和声は讃美歌に由来する三和音が基本で、素朴な長調の響きが好まれる。歌唱の最大の特徴は、地声と裏声を意図的に断続させるハワイアン・ファルセットで、声が裏返る瞬間そのものを美として聴かせる。歌詞はハワイ語と英語で、土地の名、雨や風、花、愛、そして失われた王国への思いを、二重の意味を込めた表現で歌う。</p>
<h2>成り立ち</h2><p>1778年のJames Cookの到来以前、ハワイには文字がなく、歴史と系譜はすべて詠唱によって伝えられていた。十九世紀初頭、キリスト教の宣教師が来島し、1820年代から讃美歌を教えたことで、四声の和声と長調の旋律が持ち込まれた。この和声とハワイ語の詠唱が混ざり、ヒメニと呼ばれる独自の合唱が生まれる。1870年代から80年代、ポルトガル領マデイラ島からの契約労働者が、ブラギーニャという小型の弦楽器を持ち込み、これがウクレレになった。名は跳ねる蚤という意味だとされる。この時期、王のDavid Kalakauaは、宣教師によって禁じられていたフラの詠唱を復興させ、王国の文化政策として音楽を保護した。彼の妹Liliuokalaniは作曲家でもあり、『Aloha Oe』を書いている。だが1893年、アメリカ系の砂糖農園主らがクーデターで女王を退位させ、1898年にハワイはアメリカに併合された。ハワイ語は学校で禁止され、話者は激減する。皮肉にも音楽は逆に広まった。1915年のサンフランシスコ万国博覧会でハワイ音楽が大人気となり、1920年代のアメリカ本土ではハワイのレコードが最も売れるジャンルのひとつになった。ただしそこで作られたのは、観光向けに作られた模造品が大半だった。転換は1970年代である。ハワイアン・ルネサンスと呼ばれる文化復興運動が起こり、Gabby Pahinuiがスラック・キーの伝統を再興し、The Sons of Hawaiiや、後にIsrael Kamakawiwooleが、ハワイ語と主権回復の主張を音楽に取り戻した。Israelは1997年に38歳で亡くなったが、彼のウクレレ一本による『Over the Rainbow』は世界中で聴かれ続けている。</p>
