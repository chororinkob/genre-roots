<h1>J-POP（ジェイポップ）とは</h1>
<p>1990年代以降の日本の大衆音楽を包括的に指す呼び名。特定の音の様式ではなく、日本で作られたポピュラー音楽をまとめて呼ぶ言い方として使われる。とはいえ共通する作りはあり、AメロからBメロを経てサビへ向かい、最後にもう一段高い転調（</p>
<p>1990年代以降の日本の大衆音楽を包括的に指す呼び名。特定の音の様式ではなく、日本で作られたポピュラー音楽をまとめて呼ぶ言い方として使われる。とはいえ共通する作りはあり、AメロからBメロを経てサビへ向かい、最後にもう一段高い転調（曲の途中で調が変わること）で締める展開がよく見られる。和声（コードの響き）は四つの和音を循環させる型が広く使われ、とくにIV・V・iii・viをこの順に並べる王道進行や、vi・IV・V・Iという小室進行がよく使われ、切なさと高揚を同時に出す響きが好まれる。テンポの速い曲が目立ち、1分間に130拍を超える曲も現れた。旋律の音数が多めで、1拍に詰め込む文字数も多めの曲が目立つ。歌唱は感情の起伏をはっきり出す張った声が主流で、サビでは複数の声を重ねて厚みを作る曲が多い。伴奏は打ち込みと生演奏の混成で、時代ごとにダンス音楽、ロックバンド、ヒップホップ、ボーカロイド（歌声合成ソフト）由来の高速な譜割り（言葉を拍に当てはめる配置）などを貪欲に取り込んできた。歌詞は恋愛を歌うものが多いが、応援、旅立ち、季節の情景を歌うものも多い。カラオケで歌われることを考えて、声の高さの幅や言葉の乗せ方が作られている曲も多い。</p>
<h2>成り立ち</h2><p>呼称そのものは1988年末から1989年初頭に生まれたとされ、命名の時期は証言により異なる。1988年10月に開局したFMラジオ局J-WAVEが、「和製○○」から脱却し、洋楽と並べて聴ける邦楽という特別感を出す言葉として考案した造語が「J-POP」だと伝えられる。当初は限られた洗練された邦楽だけを指したが、1993年から1995年ごろにかけて、日本のポピュラー音楽全体を指す語として定着したとされる。音楽の系譜としては、戦前から続く歌謡曲、1970年代に自作自演の歌手たちが起こしたニューミュージック、そしてシティポップ（1970年代後半から1980年代に流行した、都会的な雰囲気のポップス）などがもとになったとされる。1980年代終盤から1990年代前半のバンドブームとも、並行して成り立った。日本ではCDが1980年代半ばにLP（レコード盤）の生産枚数を追い抜き、1990年代には音楽の売上の中心になった。バブル崩壊後の景気低迷の中でもCDの売上は伸び続けて、1998年にはCDなどの音楽ソフトの生産額が6,074億9,400万円と過去最高になった。日本は現在も、米国に次ぐ世界第二位の市場である（2025年の実績）。この時期を代表するのが、ビーイング系と呼ばれた制作会社主導のヒットの量産と、作曲家の小室哲哉である。小室はTRF、globe、安室奈美恵、華原朋美らを次々と手がけ、打ち込みのダンス音楽を土台に、はっきりしたサビを持つ作風で、1994年から1999年に「小室ブーム」と呼ばれる社会現象を起こした。もう一つの推進力がタイアップ制度（ドラマやCMなどと組む宣伝）で、テレビドラマの主題歌やCM曲として起用されることが売上に直結し、1990年代にはミリオンセラー（100万枚以上売れた作品。シングルとアルバムの合計）が、1991年の9作品から1994年の32作品へと続々と出た。1998年、宇多田ヒカルが15歳で発表した「Automatic」は、それまでの歌謡曲とは違う歌い方やリズムの乗り方が新鮮だと評され、翌年のアルバム「First Love」は日本の歴代最高売上を記録した。1998年をピークにCD市場は縮小に転じ、着うたやライブ興行へ収益の軸が移る。アイドルグループの大規模化が進み、2005年頃から増えた特典付きの販売手法が、2010年代にはAKB48などで常態化して売上表を占め、音楽の評価と売上がかけ離れているという批判も強まった。日本は世界的な定額配信への移行が遅れ、2020年代の現在も、物理媒体（音楽ソフト）が過半を占める。2025年は約57%だった。転換点は2020年前後で、動画共有サイトと配信を通じて、米津玄師やYOASOBIのようなインターネット発のアーティストや、歌い手のAdoが人気を集めた。アニメ作品を経由して国外の聴き手を獲得する例も出てきた。2023年には、アニメ『【推しの子】』の主題歌であるYOASOBIの「アイドル」が、アメリカを除く世界のチャートで日本の曲として初めて1位になった。J-POPは国内向けの閉じた市場から、外へ開かれた状態に移りつつある。</p>
