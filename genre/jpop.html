<h1>J-POP（ジェイポップ）とは</h1>
<p>1990年代以降の日本の大衆音楽を、まとめて指す呼び名だ。特定の音のスタイルではなく、日本で制作されたポピュラー音楽を指す言葉として使われる。 伴奏は、打ち込みと生演奏の混成だ。時代ごとに、ダンス音楽、ロックバンド、ヒップホップ、</p>
<p>1990年代以降の日本の大衆音楽を、まとめて指す呼び名だ。特定の音のスタイルではなく、日本で制作されたポピュラー音楽を指す言葉として使われる。

伴奏は、打ち込みと生演奏の混成だ。時代ごとに、ダンス音楽、ロックバンド、ヒップホップ、ボーカロイド（歌声合成ソフト）由来の高速な譜割り（言葉を拍に当てはめる配置）などを、貪欲に取り込んできた。

和声（コードの響き）は、四つの和音を循環させる型が広く使われる。とくに、IV・V・iii・viをこの順に並べる王道進行や、vi・IV・V・Iという小室進行がよく使われる。切なさと高揚を同時に出す響きが好まれる。

テンポの速い曲が目立つ(BPM130超も登場)。旋律の音数が多く、1拍に詰め込む文字数も多い傾向がある。

歌い方は、感情の起伏をはっきり出す張った声が主流だ。サビでは、複数の声を重ねて厚みを作ることが多い。

歌詞は恋愛が中心の傾向があり、応援、旅立ち、季節の情景も多い。カラオケで歌われることを前提に、音域と譜割りが設計されていることが多い点も特徴といえる。

曲の組み立てには、共通する作りがある。AメロからBメロを経てサビへ向かい、最後にもう一段高い転調（曲の途中で調が変わること）で締めることが多い。この展開の型が、広く共有される傾向がある。</p>
<h2>成り立ち</h2><p>呼称そのものは、1988年末から1989年初頭に生まれたとされる。命名の時期は、証言により異なる。

1988年10月に開局したFMラジオ局J-WAVEが、「和製○○」から脱却しようとした。洋楽と並べて聴ける邦楽という特別感を出す言葉として考案した造語が、「J-POP」だと伝えられる。当初は、限られた洗練された邦楽だけを指した。しかし1990年代のうちに、日本のポピュラー音楽全体を指す語へ広がった。

音楽の系譜としては、戦前から続く歌謡曲、1970年代に自作自演の歌手たちが起こしたニューミュージック、そして1980年代のシティポップなどを、スタイルの源流とする。バンドブームとも並行して成立した。

1980年代半ばにLPを逆転したCDが、1990年代に市場の主役となった。バブル崩壊後の景気低迷の中でも、CDの売上は伸び続けた。1998年には、CDなどの音楽ソフトの生産額が6,074億9,400万円と過去最高になった。日本は現在も世界第2位の音楽市場である（IFPI、2025年実績）。

この時期を代表するのが、ビーイング系と呼ばれた制作会社主導のヒットの量産と、作曲家の小室哲哉である。小室は、TRF、globe、安室奈美恵、華原朋美らを次々と手がけた。打ち込みのダンス・ミュージックを基軸とし、明確なサビを持つ作風で、1994〜99年に「小室ブーム」を起こした。

もう一つの推進力が、タイアップ制度（ドラマやCMなどと組む宣伝）だった。テレビドラマの主題歌やCM曲として起用されることが、売上に直結した。1990年代には、ミリオンセラーが1991年の9作品から1994年の32作品へと続出した(シングル・アルバム合算)。

1998年、宇多田ヒカルが15歳で発表した「Automatic」は、それまでの歌謡曲的な発声とは異なるリズムの乗り方で衝撃を与えたと評された。翌年のアルバム「First Love」は、日本の歴代最高売上を記録した。

しかし、1998年をピークに、CD市場は縮小に転じた。着うたやライブ興行へ、収益の軸が移っていったと見られる。アイドルグループの大規模化も進んだ。2005年頃から増えた特典付きの販売手法は、2010年代にはAKB48などで常態化して売上表を占めた。音楽の評価と売上がかけ離れているという批判も強まった。

日本は、世界的な定額配信への移行が遅れた。物理媒体(音楽ソフト)が過半(2025年は約57%)を占める。転換点は2020年前後だった。動画共有サイトと配信を通じて、米津玄師、YOASOBI、歌い手のAdoといった、インターネット発のアーティストが人気を集めた。

アニメ作品を経由して国外の聴き手を獲得する例も増えている。J-POPは、国内向けの閉じた市場から、再び外へ開かれた状態に移りつつあるとも言われる。</p>
