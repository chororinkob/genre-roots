<h1>J-POP（ジェイポップ）とは</h1>
<p>1990年代以降の日本の大衆音楽を包括的に指す呼び名。特定の音の様式ではなく、日本語で歌われ、日本国内の流通に乗るポピュラー音楽全般を覆う枠として使われる。とはいえ共通する作りはあり、AメロからBメロを経てサビへ向かい、最後にもう</p>
<p>1990年代以降の日本の大衆音楽を包括的に指す呼び名。特定の音の様式ではなく、日本語で歌われ、日本国内の流通に乗るポピュラー音楽全般を覆う枠として使われる。とはいえ共通する作りはあり、AメロからBメロを経てサビへ向かい、最後にもう一段高い転調で締めるという展開の型が広く共有されている。和声はコードの動きが多く、四つの和音で単純に回すことは少ない。とくにIV・V・iii・viをこの順に並べる王道進行や、vi・IV・V・Iという小室進行がよく使われ、切なさと高揚を同時に出す響きが好まれる。テンポは120〜180BPMと速めで、旋律の音数が多く、一拍に詰め込む文字数も多い。歌唱は感情の起伏をはっきり出す張った声が主流で、サビでは複数の声を重ねて厚みを作る。伴奏は打ち込みと生演奏の混成で、時代ごとにダンス音楽、ロックバンド、ヒップホップ、ボーカロイド由来の高速な譜割りなどを貪欲に取り込んできた。歌詞は恋愛が中心だが、応援、旅立ち、季節の情景も多い。カラオケで歌われることを前提に、音域と譜割りが設計されている点も特徴といえる。</p>
<h2>成り立ち</h2><p>呼称そのものは1988年に生まれた。同年10月に開局したFMラジオ局J-WAVEが、洋楽中心の編成の中で日本語の楽曲をかける枠を作る際、「歌謡曲」という古い響きを避けるために考案した造語が「J-POP」である。当初は限られた洗練された邦楽だけを指したが、1990年代のうちに日本のポピュラー音楽全体を指す語へ広がった。音楽の系譜としては、戦後の歌謡曲、1970年代に自作自演の歌手たちが起こしたニューミュージック、そして1980年代のシティポップやバンドブームが直接の前身にあたる。1990年代前半、CDという媒体の普及と好景気が重なり、日本の音楽市場は世界第二位の規模に達した。この時期を代表するのが、ビーイング系と呼ばれた制作会社主導のヒットの量産と、作曲家の小室哲哉である。小室はTRF、globe、安室奈美恵、華原朋美らを次々と手がけ、四つ打ちのダンスビートと転調を多用した作風で1990年代半ばの音を決定づけた。もう一つの推進力がタイアップ制度で、テレビドラマの主題歌やCM曲として起用されることが売上に直結し、1990年代にはミリオンセラーが年間数十作出る異常な状況が生まれる。1998年、宇多田ヒカルが15歳で発表した「Automatic」は、それまでの歌謡曲的な発声とは異なるリズムの乗り方で衝撃を与え、翌年のアルバム「First Love」は日本の歴代最高売上を記録した。2000年代に入るとCD市場は縮小に転じ、着うたやライブ興行へ収益の軸が移る。アイドルグループの大規模化と、握手券などの特典を付けた販売手法が売上表を占め、音楽の評価と売上が乖離しているという批判も強まった。日本は世界的な定額配信への移行が遅れ、2010年代後半まで物理媒体への依存が続く。転換点は2020年前後で、動画共有サイトと配信を通じて米津玄師、YOASOBI、Adoといった、インターネット発の作り手が主流になった。アニメ作品を経由して国外の聴き手を獲得する例も急増し、J-POPは国内向けの閉じた市場から、再び外へ開かれた状態に移りつつある。</p>
