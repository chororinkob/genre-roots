<h1>Nu Style（ニュースタイル）とは</h1>
<p>ハードスタイルの中で、2000年代後半以降に確立された新しい音作りを指す呼称である。旧来のハードスタイルとの最大の違いはバスドラムの構造にある。初期のものが単純な打撃音を歪ませただけだったのに対し、こちらは音を二つの部分に明確に分</p>
<p>ハードスタイルの中で、2000年代後半以降に確立された新しい音作りを指す呼称である。旧来のハードスタイルとの最大の違いはバスドラムの構造にある。初期のものが単純な打撃音を歪ませただけだったのに対し、こちらは音を二つの部分に明確に分けて設計する。頭の短い破裂音と、そこに続く音程を持った長い胴体である。胴体の音程を下降させることで独特の圧迫感が生まれ、同時にこの部分が和音の低音を兼ねるため、ベース楽器を別に置く必要がなくなった。この設計思想が、その後のハードスタイル全体の標準になっている。テンポは一分間に150拍前後で四つ打ちを取る。上物には明快な旋律が置かれ、ピアノや弦楽器を模した音色、あるいは歪ませた合成音が用いられる。曲の構成は明確に演出されており、盛り上げ、休止、解放という順序が繰り返される。休止の区間では打楽器がすべて止まり、旋律だけが残ってから全体が戻る。この落差の設計に技術の多くが注がれている。旧来のものに比べて音が整理され、聴きやすく、かつ大規模な会場で映えるよう設計されている点が、この呼称が生まれた理由そのものである。</p>
<h2>成り立ち</h2><p>ハードスタイルは2000年前後のオランダで、ガバとハードトランスの中間に位置する音楽として成立した。初期の音は荒く、バスドラムは単に歪ませただけの単純な打撃音だった。転機は2007年前後である。この時期、制作技術の面で二つの変化が起きた。一つは、音を細かく設計できる制作ソフトが安価に普及したこと。もう一つは、バスドラムの余韻部分に音程を持たせるという発想が広まったことである。この二つが結びつき、頭と胴体を分けて設計する手法が確立された。中心となったのはオランダの制作者たちで、とりわけヘッドハンターズやウェイステッド・ペネンギンズ、そしてノイズコントローラーズがこの方向を推し進めた。同時期に事業として急拡大していたのが屋外の大規模な音楽祭である。数万人を相手にする会場では、荒く整理されていない音は混濁して聞こえない。音を明確に分離し、低音の輪郭を保つ必要から、この新しい設計が実際的にも要請された。すなわち音楽の変化は、会場の規模の変化に対する応答でもあった。呼称としてのニュー・スタイルは、この新しい音作りを旧来のものと区別するために自然発生的に使われるようになったものである。同時期には、旧来の荒い音への回帰を掲げるロー・ハードスタイルという対抗的な流れも生まれ、両者を区別する必要が生じたことも呼称の定着を後押しした。2010年代に入ると、この音作りはハードスタイルの標準そのものになり、あえて区別する必要が薄れていく。現在ではこの呼称は、2007年から2012年頃の特定の時期の音を指す歴史的な用語として使われることが多い。ただしここで確立されたバスドラムの設計思想は、その後のハードダンス系のほぼすべての様式に引き継がれている。</p>
