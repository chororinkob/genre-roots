<h1>Nu Style（ニュースタイル）とは</h1>
<p>ハードスタイルの中の、メロディックで多幸感のある一派(ユーフォリック)を指すとする説が多い呼称で、時期や定義には諸説がある。旧来のハードスタイルとの違いとしてしばしば挙げられるのはバスドラムの構造である。初期のハードスタイルがハー</p>
<p>ハードスタイルの中の、メロディックで多幸感のある一派(ユーフォリック)を指すとする説が多い呼称で、時期や定義には諸説がある。旧来のハードスタイルとの違いとしてしばしば挙げられるのはバスドラムの構造である。初期のハードスタイルがハードトランス由来のリバース・ベースを特徴としたのに対し、こちらは音を二つの部分にはっきり分けて作る。頭の短い破裂音と、そこに続く、音の高さを持った長い響きである。胴体の音程を下降させることで独特の圧迫感が生まれ、同時にこの部分が和音の低音を兼ねるため、ベース楽器を別に置く必要がなくなった。この設計は、ハードスタイルの標準的な技法の一つである。テンポは一分間に150拍前後で四つ打ちを取る。上に重ねる音には、分かりやすいメロディーが置かれ、ピアノや弦楽器を模した音色、あるいは歪ませた合成音が用いられる。曲の組み立てははっきり演出されており、盛り上げ、休止、解放という順序が繰り返される。休止の区間では打楽器がすべて止まり、旋律だけが残ってから全体が戻る。この落差の作り込みに技術の多くが注がれている。旧来のものに比べて音が整理され、聴きやすく、大規模な会場で映えるよう設計されている。</p>
<h2>成り立ち</h2><p>ハードスタイルは1990年代末から2000年代初頭に、オランダ、ベルギー、イタリアで成立した。テクノ、ニュービート、ハードコアの影響を受け、ハードトランスの「リバース・ベース」の影響も指摘される。初期の音は荒々しかった。転機は2004〜2006年ごろで、バスドラムの余韻部分に音程を持たせる(ピッチを操作する)技法が広まった。2008年のHeadhunterzとWildstylezの『Project One』では、音程のあるキックが目立つ使われ方をしている。中心となったのは、オランダのヘッドハンターズやノイズコントローラーズ、スウェーデン出身のウェイステッド・ペンギンズ(2008年結成)らである。「ニュー・スタイル」という語は、初期にはユーフォリックなスタイルの別名としても使われ、2007年にはすでに曲名にも使われていた。2010年ごろ(2007〜09年に萌芽したとする資料もある)には、旧来の荒い音への回帰を掲げるロー・ハードスタイルという対抗する流れも生まれた。キックでベースの音まで鳴らす「ピッチング」と呼ばれる手法は、ハードスタイル全般の標準的な技法となっている。ハードスタイルの大規模な催しには、2003年に始まったDefqon.1や、2000年にアイントホーフェンで初回が開かれ2008年からGelreDomeで開かれているQlimaxなどがある。テンポは、初期は140拍前後で作られたが、現代のハードスタイルでは150拍前後が多い。</p>
