<h1>Nu Style（ニュースタイル）とは</h1>
<p>ハードスタイルの中で使われる呼び名である。メロディックで多幸感のある一派、つまりユーフォリックの旧称・前身とする見方と、それとは別物とする見方がある。時期や定義にも諸説がある。 旧来のハードスタイルとの違いとして、よく挙げられるの</p>
<p>ハードスタイルの中で使われる呼び名である。メロディックで多幸感のある一派、つまりユーフォリックの旧称・前身とする見方と、それとは別物とする見方がある。時期や定義にも諸説がある。

旧来のハードスタイルとの違いとして、よく挙げられるのはバスドラムの作りである。初期のハードスタイルは、ハードトランスから来たリバース・ベースを特徴としていた。これに対し、こちらは音を二つの部分にはっきり分けて作る。頭の短い破裂音と、それに続く、音の高さを持った長い響きだ。この胴体の部分の音程を下げていくことで、独特の圧迫感が生まれる。同時に、キック自体にベース音を担わせることもできる。この作りは、ハードスタイルの標準的な技法の一つである。

テンポは毎分150拍前後が多く、四つ打ちを刻む。その上には、ユーフォリック系に一般的な特徴として、分かりやすいメロディーが乗り、ピアノや弦楽器をまねた音色や、歪ませた合成音が使われる。

曲の組み立ても、ユーフォリック系に一般的な形で、はっきりと演出されている。盛り上げ、休止、解放という順番が繰り返される。休止の区間では打楽器がすべて止まり、旋律だけが残ったあとで全体が戻ってくる。この落差の作り込みに、技術の多くが注がれている。旧来のものに比べて音が整理されて聴きやすい。</p>
<h2>成り立ち</h2><p>ハードスタイルは、1990年代末〜2000年代初頭にオランダなどで形づくられたとされる。正確な起源は特定できない。テクノ、ニュービート、ハードコアの影響を受け、ハードトランスの「リバース・ベース」の影響も指摘されている。

初期の音は荒々しかった。転機は2004〜2006年ごろとされ、バスドラムの余韻の部分に音程を持たせる(ピッチを操作する)技法が広まった。2008年のアルバム『Headhunterz &amp; Wildstylez Present: Project One』では、音程のあるキックが目立つ形で使われている。

中心となったのは、オランダのHeadhunterzやノイズコントローラーズ、そしてスウェーデン出身のウェイステッド・ペンギンズ(2008年結成)らである。「Nu Style」という語は、初期にはユーフォリックなスタイルの別名としても使われた。2007年には、すでにLikquid &amp; Kayemの曲「We Bring The Nu Style」の題名にも使われていた。

一方、2010年ごろには、旧来の荒い音に戻ることを掲げるロー・ハードスタイルという対抗する流れも生まれた(2007〜09年に芽生えたとする説もある)。キックでベースの音まで鳴らす「ピッチング」と呼ばれる手法は、今ではハードスタイル全般の標準的な技法になっている。

ハードスタイルの大きな催しには、2003年に始まったDefqon.1や、Qlimaxなどがある。後者は2000年にアイントホーフェンで初回が開かれ、2003年からはGelreDomeで開かれていた。テンポは、初期は140拍前後で作られていたが、現代のハードスタイルでは150拍前後が多い。</p>
