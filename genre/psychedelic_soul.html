<h1>Psychedelic Soul（サイケデリックソウル）とは</h1>
<p>サイケデリック・ソウルは、1960年代末に、ソウルの歌と演奏に、サイケデリック・ロックの音の実験と社会批判を結びつけた音楽だ。 編成の中心はソウルの楽団だが、そこへエレクトリックギターが前に出てくる点が違う。とくにワウペダルを踏ん</p>
<p>サイケデリック・ソウルは、1960年代末に、ソウルの歌と演奏に、サイケデリック・ロックの音の実験と社会批判を結びつけた音楽だ。

編成の中心はソウルの楽団だが、そこへエレクトリックギターが前に出てくる点が違う。とくにワウペダルを踏んで音色を上下に動かす弾き方がトレードマークだ。しゃべるような、あるいは唸るようなギターの音が、このスタイルの特徴になっている。低音では強いベースラインが特徴で、一部にファズ・ベースも使われた。

録音の段階では、さまざまな処理が積極的に加えられた。音の波のタイミングをずらして生まれる渦巻くような効果（フェイザー）、深い残響、左右への音の移動などだ。こうして、素材の生々しさをわざと歪める。

曲の長さが大きく変わったことも重要だ。それまで3分ほどだったソウルの曲が、七分、10分、時に20分を超える長さへ広がった。Whitfieldの制作などでは、長い導入や間奏が用いられた。

歌唱では、Temptationsなどでリードを交代する手法が使われた。これによって、一つの物語を複数の視点から語れるようになった。

歌詞では、貧困、麻薬、戦争、家庭の崩壊、人種差別を扱う曲が増えた。</p>
<h2>成り立ち</h2><p>1968年は、大きな転機の年だ。この年の四月、Martin Luther King Jr.が暗殺され、全米の都市で暴動が起きた。ベトナムでの戦争は泥沼になり、都市の黒人社会では麻薬が広がっていたとされる。公民権運動が掲げた統合の理想は色あせ、より急進的な黒人解放の考え方が支持を集めていたとされる。

こうした中で、恋愛だけを歌うソウルでは、もう現実に応えられないという考えが広がっていく。

この転換を担った先駆者の一つが、サンフランシスコのSly and the Family Stoneだ。彼らは、人種も男女も混ざった編成を持つ、最初の主要なアメリカのロックグループの一つとされる。その存在そのものが、理想を示していた。しかし1971年に発表した作品では、その理想が崩れた後の暗さと疲れが描かれた。原始的なドラムマシンも使い、多重録音を重ねた濃密で暗い音だ。それは、幸せな気分の裏側を突きつけるものだった。

一方、デトロイトのMotownでは、制作者のNorman Whitfieldが同じ転換を進めた。彼はThe Temptationsを、甘い恋愛歌のグループから、社会を語るグループへ作り変えた。1968年以降、麻薬中毒や貧困、父親の不在をテーマにした曲を送り出した。1972年の作品では、12分に及ぶ長さと、四分近い楽器だけの導入で、ソウルの曲の常識を破っている。

メンフィスでは、Isaac Hayesが1969年に、一曲を18分にわたって展開する作品を発表した。ソウルでも長い作品が作れることを示したのだ。The Chambers Brothersは、1967年のアルバムに約11分の版を収めた。そして1968年、3〜5分に短くしたシングル版が全米11位のヒットになった。George ClintonのParliamentとFunkadelicも、このスタイルの先駆者の一組である。

この流れは、のちにEarth, Wind &amp; Fireなどのファンクやディスコへとつながった。Isaac HayesやCurtis Mayfieldらの、映画音楽のようなソウルにもつながっている。この時期の実験精神は、後のヒップホップでも頻繁にサンプリングされ、数えきれない曲に引用され続けている。</p>
<h2>代表曲</h2><ul><li>Everyday People (Sly and the Family Stone)</li><li>Ball of Confusion (The Temptations)</li><li>That Lady (The Isley Brothers)</li><li>Family Affair (Sly and the Family Stone)</li><li>Cloud Nine (The Temptations)</li><li>Stand! (Sly and the Family Stone)</li><li>Smiling Faces Sometimes (The Undisputed Truth)</li><li>Psychedelic Shack (The Temptations)</li><li>Walk on By (Isaac Hayes)</li><li>Superfly (Curtis Mayfield)</li><li>Innervisions (Stevie Wonder)</li><li>Amen (Rotary Connection)</li></ul>
