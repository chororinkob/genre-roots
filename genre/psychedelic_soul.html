<h1>Psychedelic Soul（サイケデリックソウル）とは</h1>
<p>1960年代末に、ソウルの歌と演奏に、サイケデリック・ロックの音響実験と社会批判を接合した音楽である。編成の中核はソウルの楽団だが、そこへエレクトリックギターが前面に出てくる点が異なる。とりわけワウペダルを踏んで音色を上下に動かす</p>
<p>1960年代末に、ソウルの歌と演奏に、サイケデリック・ロックの音響実験と社会批判を接合した音楽である。編成の中核はソウルの楽団だが、そこへエレクトリックギターが前面に出てくる点が異なる。とりわけワウペダルを踏んで音色を上下に動かす奏法が象徴的で、この、しゃべるような、あるいは唸るようなギターの音がこの様式の刻印となっている。低音も歪ませた音色が用いられ、旋律的に激しく動き回る。録音の段階では、位相をずらして生じる渦巻くような効果、深い残響、左右への音の移動といった処理が積極的に施され、素材の生々しさを意図的に歪める。曲の長さが大きく変わったことも重要で、それまで三分程度だったソウルの楽曲が、七分、10分、時に20分を超える長さへ拡張された。冒頭に長い器楽の導入が置かれ、歌に入るまでに数分を要する構成も定型となる。歌唱は独唱者を固定せず、複数の歌手が一行ずつ交代で歌う手法が用いられ、これによって一つの物語を複数の視点から語ることが可能になった。歌詞は恋愛を離れ、貧困、麻薬、戦争、家庭の崩壊、人種差別を直接扱う。</p>
<h2>成り立ち</h2><p>1968年という年が決定的である。この年の四月、Martin Luther King Jr.が暗殺され、全米の都市で暴動が起きた。ベトナムでの戦争は泥沼化し、都市の黒人社会では麻薬が蔓延していた。公民権運動が掲げた統合の理想は色褪せ、より急進的な黒人解放の思想が支持を集めていた。この状況において、恋愛だけを歌うソウルはもはや現実に応えられないという認識が広がる。この転換を主導したのがサンフランシスコのSly and the Family Stoneである。彼らは人種と性別を越えた編成という点でも当時前例がなく、その存在そのものが理想の提示だった。しかし1971年に発表した作品では、その理想が破綻した後の暗さと消耗が、初期のドラムマシンによる無機質な音とともに提示され、多幸感の裏側を突きつけた。デトロイトのMotownでは、制作者Norman Whitfieldが同じ転換を実行する。彼はThe Temptationsを甘い恋愛歌の集団から社会を語る集団へ作り変え、1968年以降、麻薬中毒や貧困、父親の不在を主題とする楽曲を送り出した。1972年の作品では、12分に及ぶ長さと、四分近い器楽の導入によって、ソウルの楽曲の常識を破っている。メンフィスではIsaac Hayesが1969年に、一曲を18分にわたって展開する作品を発表し、ソウルにも長編の表現が可能であることを示した。The Chambers Brothersは1968年に、時代の切迫を主題とする長大な楽曲で成功を収める。この流れは二つの方向へ分岐した。ひとつはGeorge Clintonの一派によるファンクの拡張であり、もうひとつは1970年代半ばの、より洗練されたソウルである。同時に、この時期の実験精神は、後のヒップホップの制作者が最も好んで発掘する音源となり、無数の楽曲に引用され続けている。</p>
<h2>代表曲</h2><ul><li>Stand! (Sly and the Family Stone)</li><li>Cloud Nine (The Temptations)</li><li>Superfly (Curtis Mayfield)</li><li>Innervisions (Stevie Wonder)</li></ul>
