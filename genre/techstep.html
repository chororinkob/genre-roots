<h1>Techstep（テックステップ）とは</h1>
<p>テックステップは、1990年代半ばのドラムンベースから枝分かれしたスタイルだ。人の手で演奏したようなファンクの感じを、わざと削ぎ落としている。 いちばんの特徴はベースだ。わずかに音程をずらした複数のノコギリ波を重ねて、うなりを生じ</p>
<p>テックステップは、1990年代半ばのドラムンベースから枝分かれしたスタイルだ。人の手で演奏したようなファンクの感じを、わざと削ぎ落としている。

いちばんの特徴はベースだ。わずかに音程をずらした複数のノコギリ波を重ねて、うなりを生じさせるリースベースを使う。これを歪みとフィルターで金属的に加工した音が、曲の中心を占める。

和音は最小限だ。短調の断片的なコードや、ペダル的な持続音だけに切り詰められている。歌えるようなメロディーは、ほとんどない。

テンポは165〜180BPMほどだ。ブレイクビーツは、生ドラムの断片を使う場合でも、圧縮をかける。こうして、機械が刻んだような硬く均一な音の手ざわりに整えられる。

音色は、SF的でインダストリアルな雰囲気を持つ。レゲエやソウルに由来する温かみは、意識的に排除された。

同じ時期のジャズステップや、のちに広まったリキッド系は、旋律と生演奏の質感を目指した。これに対しテックステップは、冷たく無機質な感じと重さそのものを美意識とする点で、対照的である。</p>
<h2>成り立ち</h2><p>テックステップは1995年ごろに生まれた。名前が付いたのは1996年ごろで、Ed RushとTraceが作ったとされる。彼らは、レーベルNo U-Turn Recordsを率いたエンジニアのNicoとともに、その音を形作った。

テックステップは、それまでのジャングルが持っていたラガ／R&amp;B的要素を、意図的に削ぎ落とした。そして、より冷たくテクニカルな方向へ進んだ。「テック」はデトロイト・テクノではなく、1990年代前半のベルギーの荒々しいハードコア・テクノを指すとされる。都市の未来的なイメージや、サイバーパンク的な世界観が、その音作りに影響を与えたとも言われる。

Source Directは、暗く緻密なドラムンベースで知られた。Photekも、精密な音作りで高く評価された。ただし、両者をテックステップに含めるかどうかは見方が分かれる。一般には、Metalheadz系の暗く精緻なドラムンベースとされる。

一方で、テックステップの登場は、当時のドラムンベースシーンに大きな論争を巻き起こした。ジャングル以来のレゲエ的な陽気さや、ソウルフルな要素を切り捨てたからだ。冷たすぎる、メロディがないという批判があった。

テックステップは、1990年代後半に勢いを増した。その後、Ed Rush &amp; Opticalが設立したレーベルVirus Recordingsを中心に、ニューロファンクへと発展していく。ニューロファンクは、より緻密で、音色が変化するベースを持つ。</p>
