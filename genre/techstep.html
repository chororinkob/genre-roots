<h1>Techstep（テックステップ）とは</h1>
<p>1990年代半ばのドラムンベースから分岐した、人の手で演奏したようなファンクの感じを、わざと削ぎ落とした様式。テンポは170〜175BPM前後で、ブレイクビーツは生ドラムの断片を使う場合でも極端な圧縮とゲート処理をかけ、機械が刻ん</p>
<p>1990年代半ばのドラムンベースから分岐した、人の手で演奏したようなファンクの感じを、わざと削ぎ落とした様式。テンポは170〜175BPM前後で、ブレイクビーツは生ドラムの断片を使う場合でも極端な圧縮とゲート処理をかけ、機械が刻んだかのような硬く均一な音の手ざわりに整えられる。いちばんの特徴はベースで、わずかに音程をずらした複数のノコギリ波を重ねてうなりを生じさせるリースベースを、歪みとフィルターで金属的に加工した音が中心を占める。和音は最小限で、短調の断片的なコードやペダル的な持続音のみに切り詰められ、歌えるようなメロディーはほとんどない。曲の構成は16小節や32小節の区切りで冷たく切り替わり、山場以外の展開を省いて緊張を保ち続ける。音色の参照元は、SF映画が描くディストピア、工場の騒音、警報音であり、レゲエやソウルに由来する温かみは意識的に排除された。同時期のジャズステップや、のちに広まったリキッド系が旋律と生演奏の質感を志向したのに対し、テックステップは冷たく無機質な感じと重さそのものを美意識とする点で、正反対の立場にある。</p>
<h2>成り立ち</h2><p>1995〜96年ごろ、Ed RushとTrace、そしてレーベルNo U-Turn Recordsを率いたエンジニアのNicoが、このスタイルの名前を作り、音を作り上げた。それまでのジャングルが持っていたレゲエ/ラスタファリ由来の音楽的要素を意図的に取り除き、より冷たくテクニカルな方向へと進化させたスタイルである。「テクノ的なDnB」と呼ばれることもあるが、「テック」はデトロイト・テクノではなく、1990年代前半のベルギーの荒々しいハードコア・テクノを指すとされ、テクノとの関係を強調しすぎるべきではないとも言われる。都市の未来的なイメージや、サイバーパンク的な世界観が、その音響美学に強い影響を与えている。Source Directは、極端に切り詰めたミニマルな構成の冷たく緻密なドラムンベースで知られ、Photekも精密な音響設計で高く評価された。両者をテックステップに含めるかどうかは見方が分かれ、一般にはMetalheadz系の暗く精緻なドラムンベースとされる。No U-Turn Recordsのリリースは、黒い謎めいたラベルで記憶されている。テックステップの登場は、当時のドラムンベースシーンに大きな論争を巻き起こした。ジャングル以来のレゲエ的な陽気さやソウルフルな要素を切り捨てたことで、「魂のない機械的な音楽になった」という批判が愛好家の一部から上がった一方、若い世代のプロデューサーたちには、旧来の様式に縛られない自由な音作りの手本として熱狂的に受け入れられた。1997年前後にはこのスタイルがシーンの主流となり、その後、Ed Rush &amp; Opticalが設立したレーベルVirus Recordingsを中心に、より有機的でうねる音色を持つニューロファンクへと発展していくことになる。</p>
