<h1>Techstep（テックステップ）とは</h1>
<p>1990年代半ばのドラムンベースから分岐した、有機的なファンク感を意図的に削ぎ落とした様式。テンポは170〜175BPM前後で、ブレイクビーツは生ドラムの断片を使う場合でも極端な圧縮とゲート処理をかけ、機械が刻んだかのような硬く均</p>
<p>1990年代半ばのドラムンベースから分岐した、有機的なファンク感を意図的に削ぎ落とした様式。テンポは170〜175BPM前後で、ブレイクビーツは生ドラムの断片を使う場合でも極端な圧縮とゲート処理をかけ、機械が刻んだかのような硬く均質な質感へ整えられる。最大の特徴はベースで、シンセのプリセット由来の「フーヴァー」音や、わずかに音程をずらした複数のノコギリ波を重ねてうなりを生じさせるリースベースを、歪みとフィルターで金属的に加工した音が中心を占める。和声は最小限で、短調の断片的なコードやペダル的な持続音のみに切り詰められ、歌えるような旋律はほとんど存在しない。曲の構成は16小節や32小節の区切りで冷徹に切り替わり、落としどころ以外の展開を排して緊張を持続させる。音色の参照元は、SF映画が描くディストピア、工場の騒音、警報音であり、レゲエやソウルに由来する温かみは意識的に排除された。同時期のリキッド系やジャズステップが旋律と生演奏の質感を志向したのに対し、テックステップは無機質さと重さそのものを美学とする点で対極に位置する。</p>
<h2>成り立ち</h2><p>1996年頃、Ed Rush &amp; Optical、Trace、そしてレーベルNo U-Turn Recordsを率いたNicoが、このスタイルを確立した。それまでのジャングルが持っていたレゲエ/ラスタファリ由来の音楽的要素を意図的に取り除き、より冷たくテクニカルな方向へと進化させた「テクノ的なDnB」として位置づけられる。都市の未来的なイメージや、サイバーパンク的な世界観が、その音響美学に強い影響を与えている。Source Directは、極端に切り詰められたミニマルな構成でテックステップの美学をさらに先鋭化させ、Photekもまた、精密な音響設計によってこの潮流と近い評価を受けた。No U-Turn Recordsのリリースは、しばしば映画『マトリックス』のような近未来的なグラフィックデザインのジャケットで飾られ、視覚面でもこのジャンルの冷たく未来的な世界観を強化していた。テックステップの登場は、当時のドラムンベースシーンに大きな論争を巻き起こした。ジャングル以来のレゲエ的な陽気さやソウルフルな要素を切り捨てたことで、「魂のない機械的な音楽になった」という批判が愛好家の一部から上がった一方、若い世代のプロデューサーたちには、旧来の様式に縛られない自由な音作りの手本として熱狂的に受け入れられた。1997年前後にはこのスタイルがシーンの主流となり、その後、Ed Rush &amp; Opticalが設立したレーベルVirus Recordingsを中心に、より有機的でうねる音色を持つニューロファンクへと発展していくことになる。日本でもこの時期のテックステップは熱心なファンを獲得し、クラブイベントを通じて独自のシーンが形成された。</p>
<h2>代表曲</h2><ul><li>The Bleeps Tune (Nico)</li><li>Bacteria (Ed Rush &amp; Optical)</li><li>Mutant Jazz (Trace)</li></ul>
