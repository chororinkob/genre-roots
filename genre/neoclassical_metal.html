<h1>Neoclassical Metal（ネオクラシカルメタル）とは</h1>
<p>バロック期（およびPaganiniらロマン派）の古典音楽の影響が強いヘヴィメタルである。 楽器は、Malmsteenの機材がトレードマークになっている。Fender Stratocasterの指板を波形に削ったスキャロップ指板の改</p>
<p>バロック期（およびPaganiniらロマン派）の古典音楽の影響が強いヘヴィメタルである。

楽器は、Malmsteenの機材がトレードマークになっている。Fender Stratocasterの指板を波形に削ったスキャロップ指板の改造品を、Marshallの積み上げたアンプへ通す。

和声的短音階がよく使われ、旋法（フリギアン・ドミナントなど）も用いられる。減七和音も特徴的である(ペンタトニックも使われる)。この音階に含まれる増2度の跳躍が、荘厳とも不吉ともつかない独特の緊張を生む。メロディーの作り方も古典音楽のようだ。分散和音を階段のように駆け上がる音の動き、同じ低音を保持したまま上声部を動かす保続音、主題を別の音高で繰り返す反復進行(ゼクエンツ)が多用される。

演奏技術では、隣り合う弦を一方向の一振りで連続して弾くスウィープ奏法、左手だけで音を出すレガート、高速の交互撥弦が要求される。非常に速い演奏が日常的に用いられる。ギターとキーボードのユニゾンもよく使われる。テンポは中速から速く、曲は歌があるものでも間奏が長い。

演奏の正確さと速度が価値の中心に置かれる。そのため、聴くというより競技を観るような性格をもつ音楽でもある。</p>
<h2>成り立ち</h2><p>土台ができたのは、1960年代末から1970年代である。英国のDeep PurpleのRitchie Blackmoreは、ロックのギターに古典音楽の分散和音と旋法を持ち込んだ。ドイツのScorpionsに1973〜78年に在籍したUli Jon Rothも、同じ方向を追求した。

アメリカでは、Ozzy Osbourneのバンドに加わったRandy Rhoadsが、正規の音楽教育で得た知識をリフと間奏に注ぎ込んだ。彼はこの路線を大衆化させたが、1982年に飛行機事故で25歳で死亡している。

大きな転換点は1983年である。スウェーデンのストックホルム出身のYngwie Malmsteenが、アメリカへ渡った。彼は5歳で与えられたギターを、7歳のとき、テレビで放映されたJimi Hendrixの死去の報道(ギターを壊す映像)を見て弾き始めた。本人は、音楽的な影響ではなく映像のインパクトだったと語っている。10代では、Niccolò PaganiniやJohann Sebastian Bachなどの古典音楽に傾倒した。

1984年に発表した実質的な独奏作品ライジング・フォースは、歌よりギターが主役という構成だった。それでも全米Billboard 200で最高60位となり、ネオクラシカルという語がそのままスタイルの名として定着する。

この動きを産業として支えたのが、カリフォルニアのShrapnel Recordsである。主宰者のMike Varneyは、雑誌の連載を通じて無名の速弾き奏者を発掘した。Tony MacAlpine、Vinnie Moore、Paul Gilbert、そしてMarty FriedmanとJason Beckerによる2人組が、次々に世に出た。

とりわけJason Beckerの生涯は特筆される。彼は19〜20歳でDavid Lee Rothのバンドに加入した。その直後の1989年、筋萎縮性側索硬化症と診断され、数年の余命を宣告された。しかし現在に至るまで生存している。全身がほぼ動かない状態で、目の動きを使った意思伝達方式と、チームの協力によって作曲を続けている。

1980年代後半には、速弾きの流行が過熱した。グランジやニュー・メタルが人気を集めたことで主流での人気は低下し、この分野は一時勢いを失ったとされる。しかし日本などでは支持が続いた。Stratovariusのようなパワーメタルや、Alexi Laiho率いるChildren of Bodomのようなメロディックデスメタルへ形を変えて生き延び、現在ではネット上でもパロディや演奏動画が広まった。</p>
<h2>代表曲</h2><ul><li>Far Beyond the Sun (Yngwie Malmsteen)</li><li>Arpeggios from Hell (Yngwie Malmsteen)</li><li>Altitudes (Jason Becker)</li><li>Scarified (Racer X)</li><li>Sea of Lies (Symphony X)</li><li>Technical Difficulties (Racer X)</li><li>Speed Metal Symphony (Cacophony)</li><li>Concerto (Cacophony)</li><li>Black Star (Yngwie Malmsteen)</li><li>Serrana (Jason Becker)</li><li>Daydream (Vinnie Moore)</li><li>The Ninja (Vinnie Moore)</li></ul>
