<h1>Neoclassical Metal（ネオクラシカルメタル）とは</h1>
<p>18世紀のヨーロッパの古典音楽、とりわけバロック期の書法をエレクトリックギターの上で再現しようとしたヘヴィメタルである。音階の選択が決定的で、通常のロックが用いるブルース由来のペンタトニックをほぼ完全に捨て、和声的短音階と、その第</p>
<p>18世紀のヨーロッパの古典音楽、とりわけバロック期の書法をエレクトリックギターの上で再現しようとしたヘヴィメタルである。音階の選択が決定的で、通常のロックが用いるブルース由来のペンタトニックをほぼ完全に捨て、和声的短音階と、その第五音から始まるフリギア旋法の変種を主軸とする。この音階に含まれる増二度の跳躍が、荘厳とも不吉ともつかない独特の緊張を生む。旋律の作り方も古典音楽的で、分散和音を階段状に駆け上がる音型、同じ低音を保持したまま上声部を動かす保続音、そして主題を別の音高で繰り返す模倣進行が多用される。演奏技術では、隣り合う弦を一方向の一振りで連続して弾くスウィープ奏法、左手だけで音を出すレガート、そして高速の交互撥弦が要求され、毎秒10音を超える速さが日常的に用いられる。楽器はFender Stratocasterの指板を削って弦を押さえやすくした改造品が象徴的で、それをMarshallの積み上げたアンプへ通す。鍵盤楽器がギターと同じ走句を寸分違わず合奏する場面が最大の見せ場となる。テンポは中速から速く、曲は歌があるものでも間奏が長い。歌詞は北欧神話、中世、魔術、運命といった荘重な題材を扱う。演奏の正確さと速度が価値の中心に置かれるため、聴くというより競技を観るような性格を帯びる音楽でもある。</p>
<h2>成り立ち</h2><p>土台を作ったのは1970年前後のイギリスである。Deep PurpleのRitchie Blackmoreは、ロックのギターに古典音楽の分散和音と旋法を持ち込み、Scorpionsに在籍したUli Jon Rothも同じ方向を追求した。アメリカではOzzy Osbourneのバンドに加わったRandy Rhoadsが、正規の音楽教育で得た知識をリフと間奏に注ぎ込み、この路線を大衆化させたが、1982年に飛行機事故で25歳で死亡している。決定的な転換点は1983年、スウェーデンのストックホルム出身のYngwie Malmsteenがアメリカへ渡ったことである。彼は7歳のとき、テレビで放映されたJimi Hendrixの死去の報道を見てギターを手にしたと語っており、同時にNiccolò Paganiniの無伴奏カプリスやJohann Sebastian Bachの鍵盤作品を独学で研究していた。1984年に発表した実質的な独奏作品ライジング・フォースは、歌よりギターが主役という構成でありながら商業的に成功し、ネオクラシカルという語がそのまま様式の名として定着する。この動きを産業として支えたのがカリフォルニアのShrapnel Recordsで、主宰者のMike Varneyは雑誌の連載を通じて無名の速弾き奏者を発掘し、Tony MacAlpine、Vinnie Moore、Paul Gilbert、そしてMarty FriedmanとJason Beckerによる二人組を次々に世に出した。とりわけJason Beckerの生涯は特筆される。彼は20歳でDavid Lee Rothのバンドに抜擢された直後の1989年、筋萎縮性側索硬化症と診断されて数年の余命を宣告された。しかし現在に至るまで生存し、全身がほぼ動かない状態で、眼球の動きだけで文字を伝える方法によって作曲を続けている。1980年代後半には速弾きの流行が過熱し、技術のみを競う風潮への反発と、1991年前後のグランジの台頭によって市場は急速に冷え込み、この分野は一時ほぼ壊滅した。しかしヨーロッパ、特にフィンランドやスウェーデン、そして日本では支持が途切れず、Stratovariusのようなパワーメタルや、Alexi Laiho率いるChildren of Bodomのようなメロディックデスメタルへ形を変えて生き延び、現在では動画投稿を通じた若い演奏者の技術誇示の文化として、また別の形で息づいている。</p>
<h2>代表曲</h2><ul><li>Far Beyond the Sun (Yngwie Malmsteen)</li><li>Concerto (Cacophony)</li><li>Scarified (Racer X)</li><li>Altitudes (Jason Becker)</li><li>The Ninja (Vinnie Moore)</li></ul>
