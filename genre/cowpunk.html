<h1>Cowpunk（カウパンク）とは</h1>
<p>カントリーの楽器編成と曲の型を、パンクの速度と粗さで演奏する音楽である。編成にはエレクトリックギターに加えて、ペダルスティール、フィドル、マンドリン、そして弦を叩きつけて弾くコントラバスが加えられることが多い。しかし演奏の作法は完</p>
<p>カントリーの楽器編成と曲の型を、パンクの速度と粗さで演奏する音楽である。編成にはエレクトリックギターに加えて、ペダルスティール、フィドル、マンドリン、そして弦を叩きつけて弾くコントラバスが加えられることが多い。しかし演奏の作法は完全にパンクのもので、テンポは速く、テンポの揺れは修正されず、音程の乱れも隠されない。ギターはカントリー由来の金属的な音色を保ちながら、歪みを深くかけて掻き鳴らされる。リズムは二拍を強く踏むホンキートンクの型を、パンクの速度で叩くことで、跳ねながら突進するという独特の感触を生む。曲の構造はカントリーの伝統に忠実で、明快な歌の部分と繰り返し部分を持ち、2分から3分と短い。和声は三和音を中心とした単純なものである。歌唱は技巧を排し、怒鳴る、あるいは酔って歌うような荒れた発声が選ばれ、二声の和音が加えられる場合もある。歌詞は酒、失恋、貧困、法の外側で生きる者といったカントリーの伝統的な主題を扱いながら、そこにパンクの怒りと自嘲が混ざる。真面目に伝統を継承しているのか、それを茶化しているのかを、意図的に曖昧にしている点が特徴である。</p>
<h2>成り立ち</h2><p>1980年前後のアメリカとイギリスで、ほぼ同時に発生した。パンクが登場から数年を経て定型化し、速く短い曲を叫ぶだけでは物足りなくなった演奏者たちが、自分たちが幼少期から耳にしてきた土着の音楽へ目を向けたのである。アメリカでの中心地はロサンゼルスだった。この街のパンクの現場は暴力的で殺伐としていたが、その周辺にはカントリーやロカビリーの素養を持つ演奏者が少なくなかった。The Blastersは1950年代のリズム・アンド・ブルースとロカビリーを再生させ、パンクの代表格だったXは、1985年にThe Knittersという別名義で、完全にカントリーの編成による作品を発表している。テキサス出身の元パンク奏者が結成したRank and Fileは、この折衷を最も明確に打ち出した。Maria McKeeが率いたLone Justiceは、力強い歌唱によってこの分野に大きな注目を集めた。テネシー州ナッシュヴィルでは、カントリーの本場でありながら、Jason and the Scorchersが、伝統的な楽曲を猛烈な速度で演奏するという挑発的な実践を行い、地元の保守層を憤慨させながら若い聴衆を獲得した。アリゾナ州のMeat Puppetsは、ハードコア・パンクの現場から出発しながら、カントリーと幻覚的な感覚を混ぜた独特の作品を残している。イギリスではリーズのThe Mekonsが、炭鉱労働者の長期の争議に深く関わりながら、アメリカのカントリーを労働者の音楽として引き受けるという政治的な選択を行った。この分野は商業的にはほとんど成功しなかった。パンクの聴き手からは保守的だと言われ、カントリーの聴き手からは不真面目だと言われるという、双方から拒まれる立場に置かれたためである。それでも、1990年代のオルタナティヴ・カントリーは、この試みを直接の前史としており、伝統音楽を借り物ではなく自分たちのものとして扱う姿勢は、そこへ確実に引き継がれた。</p>
