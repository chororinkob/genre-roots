<h1>Cowpunk（カウパンク）とは</h1>
<p>カントリーの楽器編成と曲の型を、パンクの速度と粗さで演奏する音楽である。編成にはエレクトリックギターに加えて、ペダルスティール（ペダルで音程を変える、金属の弦の楽器）、フィドル、マンドリン、そして弦を叩きつけて弾くコントラバスが加</p>
<p>カントリーの楽器編成と曲の型を、パンクの速度と粗さで演奏する音楽である。編成にはエレクトリックギターに加えて、ペダルスティール（ペダルで音程を変える、金属の弦の楽器）、フィドル、マンドリン、そして弦を叩きつけて弾くコントラバスが加えられることが多い。しかし演奏の作法は完全にパンクのもので、テンポは速く、テンポの揺れは修正されず、音程の乱れも隠されない。ギターはカントリー由来の金属的な音色を保ちながら、歪みを深くかけて掻き鳴らされる。リズムは2拍を強く踏むホンキートンク（酒場向けのカントリー）の型を、パンクの速度で叩くことで、跳ねながら突進するという独特の感触を生む。曲の構造はカントリーの伝統に忠実で、明快な歌の部分と繰り返し部分を持ち、2分から3分と短い。和声は三和音を中心とした単純なものである。歌唱は技巧を排し、怒鳴る、あるいは酔って歌うような荒れた発声が選ばれ、2声の和音が加えられる場合もある。歌詞は酒、失恋、貧困、法の外側で生きる者といったカントリーの伝統的な主題を扱いながら、そこにパンクの怒りと自嘲が混ざる。真面目に伝統を継承しているのか、それを茶化しているのかを、意図的に曖昧にしている点が特徴である。</p>
<h2>成り立ち</h2><p>1970年代末から1980年代初頭に、イギリスと南カリフォルニアで生まれた。パンクが登場から数年を経て定型化し、速く短い曲を叫ぶだけでは物足りなくなった演奏者たちが、自分たちが幼少期から耳にしてきた土着の音楽へ目を向けたのである。アメリカでの中心地はロサンゼルスだった。この街のパンクの現場は暴力的で殺伐としていたが、その周辺にはカントリーやロカビリーの素養を持つ演奏者が少なくなかった。The Blastersは1950年代のリズム・アンド・ブルースとロカビリーを再生させ、パンクの代表格だったXの3人（Exene Cervenka、John Doe、DJ Bonebrake）が、Dave Alvin（The Blasters）とJonny Ray Bartel（The Red Devils）を加えたサイドプロジェクト（本業の合間に別の仲間と組む活動）The Knittersで、1985年にカントリー、フォーク、ロカビリーの色が濃い作品を発表している。カリフォルニア出身の元The Dilsのメンバーがテキサス州オースティンで結成したRank and Fileは、この折衷の先駆けの一つとなった。Maria McKeeが率いたLone Justiceは、力強い歌唱によってこの分野に大きな注目を集めた。テネシー州ナッシュヴィルでは、カントリーの本場でありながら、Jason and the Scorchersが、伝統的な楽曲を猛烈な速度で演奏するという挑発的な実践を行い、当時のナッシュヴィルでは異端として受け止められ、1980年代のナッシュヴィル発のロックバンドとして初めて大手レーベルと契約した。アリゾナ州のMeat Puppetsは、ハードコア・パンクの現場から出発しながら、カントリーと幻覚的な感覚を混ぜた独特の作品を残している。イギリスではリーズのThe Mekonsが、炭鉱労働者のストライキを支援する公演をきっかけに活動を再開し、1985年にカントリー色を強めた。Lone JusticeやJason and the Scorchersのように、大手レーベルと契約したバンドもあった。同類のバンド群は、1990年代のオルタナティヴ・カントリーの出現の基礎になったとされ、伝統音楽を借り物ではなく自分たちのものとして扱う姿勢は、そこへ引き継がれた。</p>
<h2>代表曲</h2><ul><li>Ball and Chain (Social Distortion)</li><li>Lake of Fire (Meat Puppets)</li><li>Mommy's Little Monster（Social Distortion）</li><li>Sweet, Sweet Baby (I'm Falling) (Lone Justice)</li><li>Ways to Be Wicked（Lone Justice）</li><li>American Music（The Blasters）</li><li>Border Radio (The Blasters)</li><li>Marie Marie (The Blasters)</li><li>Long White Cadillac (The Blasters)</li><li>Rank and File（Rank and File）</li><li>Amanda Ruth (Rank and File)</li><li>Lost and Found（Jason and the Scorchers）</li></ul>
