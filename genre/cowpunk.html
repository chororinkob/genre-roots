<h1>Cowpunk（カウパンク）とは</h1>
<p>カウパンクは、カントリーの楽器編成と曲の型を、パンクの速度と粗さで演奏する音楽だ。 カウパンクは単一のスタイルではなく、バンドごとに編成が違う。Violent Femmesは、マウンテン・バンジョー、フィドル、ユダヤ・ハープなどを</p>
<p>カウパンクは、カントリーの楽器編成と曲の型を、パンクの速度と粗さで演奏する音楽だ。

カウパンクは単一のスタイルではなく、バンドごとに編成が違う。Violent Femmesは、マウンテン・バンジョー、フィドル、ユダヤ・ハープなどを使った。Knittersは、アップライトベース、アコーディオン、アコースティックギターなどを使った。パンクの勢い・粗さを取り入れたバンドが多い一方、アコースティックな作品や洗練された制作のバンドもあり、音は一様ではない。

和声は三和音を中心とした単純なものだ。

リズムは、2拍を強く踏むホンキートンク（酒場向けのカントリー）の型を、パンクの速度で叩く。そのため、跳ねながら突進するような独特の感触が生まれる。

歌唱は、技巧を排し、怒鳴る、あるいは酔って歌うような荒れた発声が選ばれることもある。2声の和音が加えられる場合もある。

歌詞は、酒、失恋、貧困、法の外側で生きる者といった、カントリーの伝統的な主題を扱う。そこにパンクの怒りと自嘲が混ざる。真摯な継承から皮肉・パロディまで、バンドによって幅がある。

曲の構造はカントリーの伝統に忠実で、明快な歌の部分と繰り返し部分を持つ。長さは短い曲が多い。</p>
<h2>成り立ち</h2><p>1970年代末から1980年代初頭に、イギリスと南カリフォルニアで生まれた音楽だ。

背景には複数の要因があった。ニューウェーブの商業化でパンクの「本物らしさ」が失われたという幻滅、1980年代初頭のロサンゼルスのハードコアの暴力的な現場、商業化したカントリーに対してクラシック・カントリーへ向かった動きなどである。

アメリカでの中心地はロサンゼルスだった。この街のパンクの現場は暴力的で殺伐としていたが、その周辺にはカントリーやロカビリーの素養を持つ演奏者が少なくなかった。The Blastersは、1950年代のリズム・アンド・ブルースとロカビリーを再生させた。パンクの代表格だったXの3人（Exene Cervenka、John Doe、DJ Bonebrake）は、Dave Alvin（The Blasters）と、後にThe Red Devilsで活動するJonny Ray Bartelを加えて、サイドプロジェクト（本業の合間に別の仲間と組む活動）The Knittersを始めた。1985年には、カントリー、フォーク、ロカビリーの色が濃い作品を発表している。

カリフォルニア出身の元The Dilsのメンバーは、テキサス州オースティンでRank and Fileを結成した。このバンドは、この折衷の先駆けの一つとなった。Maria McKeeが率いたLone Justiceは、力強い歌唱によって、この分野に大きな注目を集めた。

一方、テネシー州ナッシュヴィルは、カントリーの本場だった。そこでJason and the Scorchersは、伝統的な楽曲を猛烈な速度で演奏するという、挑発的な実践を行った。当時のナッシュヴィルでは異端として受け止められたが、1983年にEMIと契約し、1980年代のナッシュヴィル発のロックバンドとして初めて大手レーベルと契約したとされる。アリゾナ州のMeat Puppetsは、ハードコア・パンクの現場から出発した。そしてカントリーと幻覚的な感覚を混ぜ、独特の作品を残している。

イギリスでは、リーズのThe Mekonsが、炭鉱労働者のストライキを支援する公演をきっかけに活動を再開した。1985年には、カントリー色を強めた。Lone JusticeやJason and the Scorchersのように、大手レーベルと契約したバンドもあった。

同類のバンド群は、1990年代のオルタナティヴ・カントリーの出現の基礎になったとされる。伝統音楽を借り物ではなく自分たちのものとして扱う姿勢は、そこへ引き継がれた。</p>
