<h1>Proto-Punk（プロトパンク）とは</h1>
<p>プロト・パンクは、1960年代から1970年代半ばにかけて作られた、後のパンクロックの要素を先取りしていた音楽を、後になってまとめて指すための呼び名である。当時この名で呼ばれた音楽は存在せず、あくまで遡って与えられた分類である。た</p>
<p>プロト・パンクは、1960年代から1970年代半ばにかけて作られた、後のパンクロックの要素を先取りしていた音楽を、後になってまとめて指すための呼び名である。当時この名で呼ばれた音楽は存在せず、あくまで遡って与えられた分類である。ただし「punk」の語は当時から批評家が使っていた。

多くの作品に見られる傾向は、演奏の巧みさや洗練を目標にしない姿勢である。ギターは歪みとハウリングを制御せずに鳴らす。ソロも音階をなぞるより、雑音に近い勢いを優先する。ベースは複雑に動かず、低音を押し出す。

多くの作品では、コードは三つか四つで、曲の組み立ては単純なくり返しである。演奏は前のめりで荒い。ドラムは装飾を削って、直線的に叩く。テンポは中庸から速めで、同じフレーズを何分もくり返し続けて、聴き手を追い詰める曲も多い。

歌は上手さより切迫感を選び、怒鳴る、呟く、朗読するといった形を取る。歌詞は退屈な郊外の生活、薬物、性、暴力、都市の荒廃といった、当時の主流のロックが避けた題材を扱う。しばしば一人称で、身も蓋もなく語られる。

当時の主流の洗練された音やスタイルに背を向けた作品も多い。例として、StoogesやModern Loversの単純な反復などがある。前衛志向のVelvet Undergroundや、グラム寄りのNew York Dollsなど、例外もある。この一群は、後のパンクの要素を先取りした点で括られる。</p>
<h2>成り立ち</h2><p>舞台の一つは、1967年のニューヨークだ。Andy Warholが後援したThe Velvet Undergroundが、ドイツ出身の歌手Nicoを迎えたデビュー作を発表した。売り上げは惨憺たるものだった。しかし、暴力や麻薬中毒を淡々と描く歌詞と、John Caleの弾く持続音の不快な響きは、後に無数の追随者を生むことになる。

もう一つの中心はデトロイト周辺である。1968年10月にGrande Ballroomで録音されたMC5のキック・アウト・ザ・ジャムズは、翌1969年に発表された。すると、冒頭の卑猥な掛け声が問題視された。地元の百貨店(Hudson's)が販売を拒否したため、バンドは広告で報復した。その結果、レコード会社から契約を切られるという騒動になった。彼らのマネージャーJohn Sinclairは、ホワイト・パンサー党という急進的な政治組織を主導していた。音楽と急進的な政治運動が結びついていた点でも異例だった。

同じミシガン州アナーバーでは、James OsterbergがIggy Popと名乗ってThe Stoogesを率いた。1969年のデビュー作はJohn Caleの制作で、1970年のファン・ハウスはより暴力的な形で発表した。彼は舞台上でガラス片で自らを傷つけ、観客の上に身を投げる演出を行った。それは後のパンクに影響を与えた。1973年のロウ・パワーはDavid Bowieがリミックスを担当した。だが商業的には失敗し、バンドは薬物問題などを背景に1974年2月に解散する。

ニューヨークでは、1971年結成、1973年にデビュー盤のNew York Dollsが、化粧と女装をまとった粗い演奏で登場した。後にSex Pistolsを仕掛けるMalcolm McLarenが、一時彼らの世話を焼いた。

マサチューセッツでは、Jonathan Richman率いるThe Modern Loversが、1972年にJohn Caleの制作で録音した楽曲を作品化できないまま解散した。John Caleのセッション音源が世に出たのは、パンクが始まった後の1976年だった。

デトロイトでは、黒人三兄弟によるDeathが、1975年に激烈で野性的な原パンクと評される音源を録音した。Hackney家の説明では、Columbiaの重役Clive Davis(当時はColumbiaからAristaへ移る時期)側が支援した。だが名前変更を求められ、David Hackneyが拒んだ。1976年に自主制作のシングルを500枚出し、7曲が2009年にDrag Cityから発売された。

これらは商業的成功が限定的だった作品が多く、評価も賛否が分かれた。それでも、のちにパンクの先駆として再評価されている。</p>
<h2>代表曲</h2><ul><li>I Wanna Be Your Dog (The Stooges)</li><li>Kick Out the Jams (MC5)</li><li>No Fun (The Stooges)</li><li>Search and Destroy (Iggy and The Stooges)</li><li>Personality Crisis (New York Dolls)</li><li>Gimme Danger (The Stooges)</li><li>White Light/White Heat (The Velvet Underground)</li><li>Trash (New York Dolls)</li><li>Raw Power (The Stooges)</li><li>Motor City Is Burning (MC5)</li><li>Roadrunner (The Modern Lovers)</li><li>Jet Boy (New York Dolls)</li></ul>
