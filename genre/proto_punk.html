<h1>Proto-Punk（プロトパンク）とは</h1>
<p>1960年代半ばから1970年代前半にかけて作られた、後のパンクロックの要素を先取りしていた音楽を、後年になってまとめて指すための呼び名である。当時この名で呼ばれた音楽は存在せず、あくまで遡って与えられた分類である。共通するのは、</p>
<p>1960年代半ばから1970年代前半にかけて作られた、後のパンクロックの要素を先取りしていた音楽を、後年になってまとめて指すための呼び名である。当時この名で呼ばれた音楽は存在せず、あくまで遡って与えられた分類である。共通するのは、演奏の巧みさや洗練を目標にしない姿勢で、コードは三つか四つ、曲の構成は単純な繰り返し、演奏は前のめりで荒い。ギターは歪みとハウリングを制御せずに鳴らし、ソロも音階をなぞるより雑音に近い勢いを優先する。ドラムは装飾を削って直線的に叩き、ベースは複雑に動かず低音を押し出す。テンポは中庸から速めで、同じ音型を何分も反復し続けて聴き手を追い詰める曲も多い。歌は上手さより切迫感を選び、怒鳴る、呟く、朗読するといった形を取る。歌詞は退屈な郊外の生活、薬物、性、暴力、都市の荒廃といった、当時の主流のロックが避けた題材を扱い、しばしば一人称で身も蓋もなく語られる。同時代に主流だったプログレッシブ・ロックや技巧的なハードロックへの、意識的あるいは無意識の反対物として存在していた点が、この一群を束ねる最大の共通項である。</p>
<h2>成り立ち</h2><p>最初の震源は1967年のニューヨークで、Andy Warholが後援したThe Velvet Undergroundが、ドイツ出身の歌手Nicoを迎えたデビュー作を発表した。売り上げは惨憺たるものだったが、暴力や麻薬中毒を淡々と描く歌詞と、John Caleの弾く持続音の不快な響きは、後に無数の追随者を生むことになる。もう一つの中心はデトロイト周辺である。1968年10月にGrande Ballroomで録音されたMC5のキック・アウト・ザ・ジャムズは、翌1969年に発表されるや冒頭の卑猥な掛け声が問題視され、地元の100貨店が販売を拒否したためバンドが広告で報復し、レコード会社から契約を切られるという騒動を起こした。彼らのマネージャーJohn Sinclairはホワイト・パンサー党という急進的な政治組織を主導しており、音楽と政治的暴力が直結していた点でも異例だった。同じミシガン州アナーバーでは、James OsterbergがIggy Popと名乗ってThe Stoogesを率い、1969年のデビュー作をJohn Caleの制作で、1970年のファン・ハウスをより暴力的な形で発表した。彼は舞台上で自らの胸をガラスで切り、観客の上に身を投げる演出を行い、後のパンクの身体表現の原型となった。1973年のロウ・パワーはDavid Bowieが仕上げに関わったが、商業的には失敗し、バンドは薬物によって崩壊する。ニューヨークでは1973年にNew York Dollsが、化粧と女装をまとった粗い演奏で登場し、後にSex Pistolsを仕掛けるMalcolm McLarenが一時彼らの世話を焼いた。マサチューセッツではJonathan Richman率いるThe Modern Loversが、1972年にJohn Caleの制作で録音した楽曲を作品化できないまま解散し、その音源が世に出たのはパンクが始まった後の1976年だった。デトロイトでは黒人三兄弟によるDeathが1974年にパンクそのものと言える音源を録音していたが、レコード会社に拒まれてお蔵入りし、発掘されたのは2009年である。これらはいずれも同時代には売れず、批評的にも無視されたが、1976年以降のパンクの担い手たちが自らの祖先として名指ししたことで、まとめて再評価されるに至った。</p>
<h2>代表曲</h2><ul><li>I Wanna Be Your Dog (The Stooges)</li><li>Kick Out the Jams (MC5)</li><li>Personality Crisis (New York Dolls)</li><li>White Light/White Heat (The Velvet Underground)</li><li>Search and Destroy (Iggy and The Stooges)</li></ul>
