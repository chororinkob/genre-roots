<h1>Parapara Eurobeat（パラパラユーロビート）とは</h1>
<p>1分間に150〜160拍という速い四つ打ちと、これに合わせた振り付けの踊りが一体になった日本独自のダンス文化とその音楽。音の設計はごく明快で、均等に踏み続けるバスドラム、裏拍で開くハイハット、8分音符で細かく動く鋸歯状波のシンセベ</p>
<p>1分間に150〜160拍という速い四つ打ちと、これに合わせた振り付けの踊りが一体になった日本独自のダンス文化とその音楽。音の設計はごく明快で、均等に踏み続けるバスドラム、裏拍で開くハイハット、8分音符で細かく動く鋸歯状波のシンセベース、そして高い音域で駆け上がる派手なシンセの旋律という四層で構成される。和声は短調の四つのコードを循環させる型が圧倒的に多く、切迫感と高揚感を同時に作る。曲は導入、Aメロ、緊張を高めるブリッジ、そして一気に開放するサビという型で組み立てられ、16小節単位で区切りが揃うため振り付けを当てはめやすい。歌唱は英語で、女性の伸びやかな声か男性のハイトーンが中心。パラパラはこの音楽に合わせて、足はほとんど動かさず腕と手だけを一定の型で振る集団の踊りで、曲ごとに決まった振り付けが存在し、踊り手は事前にそれを覚えて臨む。イタリアで制作された曲を日本の会社が買い付けて編集するという、産地と消費地が完全に分かれた特異な流通構造を持つ点も大きな特徴である。</p>
<h2>成り立ち</h2><p>起源は1970年代末から1980年代のイタロ・ディスコとハイエナジーにさかのぼる。1980年代前半、東京のディスコで欧州製の速い電子ディスコがかかり、客が振り付けを合わせて踊る習慣が生まれた。当時は「マハラジャ」など大型ディスコの時代で、踊りは第一次のパラパラとして局所的に流行する。1990年、エイベックスがコンピレーション「SUPER EUROBEAT」の刊行を開始したことが決定的だった。同社はイタリアのミラノ周辺の制作会社——Giacomo Maiolini率いるTime Recordsや、Giancarlo PasquiniによるA-Beat Cなど——と契約し、日本市場向けに大量の楽曲を発注する方式を確立する。Pasquiniは Dave Rodgers名義で自ら歌い、この分野の象徴的な存在になった。作り手も歌い手もイタリア人でありながら、本国イタリアではほとんど流通せず、日本だけで消費されるという奇妙な構造が生まれる。1990年代前半には東京・芝浦のジュリアナ東京がお立ち台とジュリ扇の光景で社会現象となり、1994年に六本木で開業した大型ディスコのヴェルファーレが次の拠点となった。第三次の大流行は1999年から2000年頃で、テレビ番組で振り付けが紹介され、女子高生を中心に爆発的に広がる。ガングロや厚底靴といった当時の若者の外見文化と分かちがたく結び付いていた。同時期、しげる（木村しげる）ら振付師の存在や、曲ごとの振り付けを収録したビデオの販売が、全国への普及を支えた。もう一つの推進力が、1998年に始まったアニメ「頭文字D」である。峠を走る車の場面にユーロビートが全面的に使われ、この結び付きは海外の視聴者にまで届いて、日本国外にユーロビートの愛好者を生んだ。2000年代半ば以降、ディスコ文化の衰退とともに大衆的な流行は去ったが、SUPER EUROBEATは200巻を超えて刊行が続き、動画共有サイトを通じて世界中に新しい聴き手を得ている。</p>
<h2>代表曲</h2><ul><li>Night Fever (Eurogroove)</li><li>Boom Boom Fire (D. Essex)</li><li>Velfarre 2000 (Dave Rodgers)</li><li>Love &amp; Money (Lou Grant)</li><li>Mickey Mouse March (Domino)</li></ul>
