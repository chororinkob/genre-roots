<h1>Parapara Eurobeat（パラパラユーロビート）とは</h1>
<p>パラパラ・ユーロビートは、速い四つ打ちの音楽と、それに合わせた振り付けの踊りが一体になった、日本独自のダンス文化とその音楽だ。テンポは140〜160 BPM前後が多く、時期により幅がある。 音の作りはとても明快で、基本の4要素で組</p>
<p>パラパラ・ユーロビートは、速い四つ打ちの音楽と、それに合わせた振り付けの踊りが一体になった、日本独自のダンス文化とその音楽だ。テンポは140〜160 BPM前後が多く、時期により幅がある。

音の作りはとても明快で、基本の4要素で組み立てられる。均等に踏み続けるバスドラム、裏拍で開くハイハット、8分音符のオクターブ奏法を多用したFM音源系のシンセベース、そして高い音域で駆け上がる派手なシンセの旋律である。

和声では、サビなどで短調系の4コード進行が多く使われる。これが切迫感と高揚感を同時に生む。

歌は英語で、女性の伸びやかな声か、男性のハイトーンが中心とされる。

曲は、Aメロ・Bメロ・サビ、そして8小節のシンセリフで組み立てられる。

パラパラは、主にこの音楽に合わせて踊られ、後にはトランスやJ-POPにも広がった。上半身は決まった手・腕の振り、下半身は2ステップ（左右移動）などの簡単な足運びで踊る。集団で踊るもので、曲ごとに決まった振り付けがある。踊り手は前もってそれを覚えて臨む。

イタリアで作られた曲を、日本の会社が買い付けて編集する。この、産地と消費地が大きく分かれた珍しい流通の仕組みも、大きな特徴である。</p>
<h2>成り立ち</h2><p>ルーツは、1970年代半ばのユーロ・ディスコと、1980年代前半のハイエナジーやイタロ・ディスコにある。

パラパラそのものは、1980年代半ば（1986年頃）に、新宿・歌舞伎町の東亜会館（中高生が集まるディスコビル）で生まれたとされる。ただし起源には、竹の子族を起源とする説など、諸説ある。そして第1次ブーム（1986〜90年）として流行した。

1990年、コンピレーション「SUPER EUROBEAT」のシリーズが始まった（当初はBeat Freak名義、第9巻からエイベックス独自の発売）。これが決定的だった。エイベックスは、北イタリア（ブレーシャ、マントヴァ周辺など）の制作会社と、より直接的で密接な契約関係を築いた。ブレーシャのGiacomo Maiolini率いるTime Recordsや、Alberto ContiniとGiancarlo PasquiniらによるA-Beat Cなどである。こうして、日本市場向けに大量の楽曲を発注する仕組みを作り上げた。ただし、アルファなどの先行例もあった。Pasquiniは、Dave Rodgers名義で自ら歌い、この分野の代名詞的な存在になった。

制作の中心はイタリア人で、歌い手には英国人など、イタリア人以外もいる。それでいて、作品は日本向けの編集盤が中心だった。産地と消費地が大きく分かれる、奇妙な構造が生まれたのである。

一方、1990年代前半には、東京・芝浦のジュリアナ東京が、お立ち台とジュリ扇の光景で社会現象になった。ただし、ジュリアナは別系統のハードコアテクノなどの店で、ユーロビートは一切かからなかった。ジュリアナのブームで、ユーロビートの人気は全国的に衰えた。1994年8月にジュリアナが閉店すると、マハラジャなどに客が戻り、これが1994〜98年の第2次ブームとなった。1994年に六本木で開業したヴェルファーレは、1999〜2001年の第3次ブームの中心となった大型ディスコの一つだ。

第三次の大流行は、1999年から2001年頃だ。テレビ番組で振り付けが取り上げられ、女子高生を中心に爆発的な人気を得た。ブームは、ガングロや厚底靴といった当時のギャル文化と重なって広がった。同じ頃、テレビ番組『SMAP×SMAP』で木村拓哉が「バッキー木村」として踊ったことも、きっかけのひとつとされる。曲ごとの振り付けを収めたビデオの販売が、全国への広がりを支えた。

1998年に始まったアニメ「頭文字D」では、バトルシーンにSUPER EUROBEATが使われた。これが、ユーロビートの人気や海外での認知を支えた。この結び付きは海外の視聴者にまで届き、日本の外にもユーロビートの愛好者を生んだ。

第3次ブーム（1999〜2001年）のあと、熱は落ち着いた。2005年にはエイベックスが第4次ブームを狙った企画を行ったが、ブームの再燃には至らなかった（第4次ブームの到来は諸説あり、はっきりしない）。大衆的な流行は去った。

それでもSUPER EUROBEATは通巻250巻に達し、その後は年次版として続いている。動画共有サイトを通じて、世界中に新しい聴き手を得ている。</p>
