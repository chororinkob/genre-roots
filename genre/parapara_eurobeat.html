<h1>Parapara Eurobeat（パラパラユーロビート）とは</h1>
<p>1分間に150〜160拍という速い四つ打ちと、これに合わせた振り付けの踊りが一体になった日本独自のダンス文化とその音楽。音の設計はごく明快で、均等に踏み続けるバスドラム、裏拍で開くハイハット、8分音符で細かく動く鋸歯状波のシンセベ</p>
<p>1分間に150〜160拍という速い四つ打ちと、これに合わせた振り付けの踊りが一体になった日本独自のダンス文化とその音楽。音の設計はごく明快で、均等に踏み続けるバスドラム、裏拍で開くハイハット、8分音符で細かく動く鋸歯状波のシンセベース、そして高い音域で駆け上がる派手なシンセの旋律という四層で構成される。和声は短調の四つのコードを循環させる型が多く、切迫感と高揚感を同時に作る。曲は導入、Aメロ、緊張を高めるブリッジ、そして一気に開放するサビという型で組み立てられ、16小節単位で区切りが揃うため振り付けを当てはめやすい。歌唱は英語で、女性の伸びやかな声か男性のハイトーンが中心。パラパラはこの音楽に合わせて、上半身は決まった手・腕の振り、下半身は2ステップ（左右移動）などの簡単な足運びで行う集団の踊りで、曲ごとに決まった振り付けが存在し、踊り手は事前にそれを覚えて臨む。イタリアで制作された曲を日本の会社が買い付けて編集するという、産地と消費地が大きく分かれた特異な流通構造を持つ点も大きな特徴である。</p>
<h2>成り立ち</h2><p>起源は1970年代末から1980年代のイタロ・ディスコとハイエナジーにさかのぼる。パラパラは1980年代半ば（1986年頃）に、新宿・歌舞伎町の東亜会館（中高生が集まるディスコビル）で生まれたとされ、第1次ブーム（1986〜90年）として流行した。1990年、エイベックスがコンピレーション「SUPER EUROBEAT」の刊行を開始したことが決定的だった。同社は北イタリア（ブレーシャ、マントヴァ周辺など）の制作会社——ブレーシャのGiacomo Maiolini率いるTime Recordsや、Giancarlo PasquiniによるA-Beat Cなど——と契約し、日本市場向けに大量の楽曲を発注する方式を確立する。Pasquiniは Dave Rodgers名義で自ら歌い、この分野の象徴的な存在になった。作り手も歌い手もイタリア人でありながら、日本向けの編集盤が中心で、産地と消費地が大きく分かれるという奇妙な構造が生まれる。1990年代前半には東京・芝浦のジュリアナ東京がお立ち台とジュリ扇の光景で社会現象となり、1994年に6本木で開業した大型ディスコのヴェルファーレが次の拠点となった。第三次の大流行は1999年から2001年頃で、テレビ番組で振り付けが紹介され、女子高生を中心に爆発的に広がる。ガングロや厚底靴といった当時の若者の外見文化と分かちがたく結び付いていた。同時期、テレビ番組『SMAP×SMAP』で木村拓哉が「バッキー木村」として踊ったことも契機のひとつとされ、曲ごとの振り付けを収録したビデオの販売が、全国への普及を支えた。もう一つの推進力が、1998年に始まったアニメ「頭文字D」である。峠を走る車の場面にユーロビートが全面的に使われ、この結び付きは海外の視聴者にまで届いて、日本国外にユーロビートの愛好者を生んだ。第3次ブーム（1999〜2001年）の後に沈静化し、2005年ごろに第4次ブームもあったが、ディスコ文化の衰退とともに大衆的な流行は去った。SUPER EUROBEATは通巻250巻に達し、その後は年次版として続いており、動画共有サイトを通じて世界中に新しい聴き手を得ている。</p>
<h2>代表曲</h2><ul><li>Don't Stop the Music 2006 (Lou Grant)</li><li>Mickey Mouse March (Domino)</li><li>Seventies (Mega NRG Man)</li><li>Boom Boom Fire (D. Essex)</li><li>Millennium (Domino)</li><li>Para Para Paradise (Domino)</li><li>Love &amp; Money (Lou Grant)</li><li>Fire Fire (Mega NRG Man)</li><li>Dancing Queen (Domino)</li><li>Queen of Eurobeat (Domino)</li><li>Eurogroove Theme (Eurogroove)</li><li>Dive To Paradise (Eurogroove)</li></ul>
