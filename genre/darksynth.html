<h1>Darksynth（ダークシンス）とは</h1>
<p>ダークシンセは、シンセウェイヴの音の言葉を使いながら、明るい懐かしさを捨てて、ホラーと暴力の場面を描く音楽だ。 見分けるいちばんのポイントは、音色の攻撃的な感じにある。ノコギリ波のリードには歪みが深くかけられる。ベースは低く濁り、</p>
<p>ダークシンセは、シンセウェイヴの音の言葉を使いながら、明るい懐かしさを捨てて、ホラーと暴力の場面を描く音楽だ。

見分けるいちばんのポイントは、音色の攻撃的な感じにある。ノコギリ波のリードには歪みが深くかけられる。ベースは低く濁り、パッドは不協和な音程を含んで不穏に揺れる。金属を打つ打撃音、逆再生した悲鳴、心臓の鼓動をまねた低い音が、曲のあちこちに置かれることもある。

和音は短調で、フリギア旋法やハーモニック・マイナーが選ばれることもある。半音の緊張を、落ち着かせないまま保ち続ける。メロディーは短いフレーズをしつこくくり返し、その上で音色だけが少しずつ歪みを深めていく曲もある。

テンポは毎分90〜130拍ほどで、110拍前後が典型とされる。四つ打ちに近い硬い刻みか、機械的な8分音符のくり返しが土台になり、リズムははっきりと前へ押し出す。

歌はほとんど入らない。入る場合も、メタルの怒号や加工された囁きに限らず、ゲストの歌い手が澄んだ声で歌う例もある。

曲によっては、はっきりしたドロップがあり、そこでは全ての音が最大の歪みで一斉に鳴る。

ジョン・カーペンターら1980年代のホラー映画の音楽を取り入れようという試みでもある。Carpenter BrutやDance With The Deadのように、ヘヴィメタルのギターを取り入れる作家もいる。シンセウェイヴが夜のドライブなら、ダークシンセは深夜の逃走劇の音だ。</p>
<h2>成り立ち</h2><p>2010年代前半、シンセウェイヴのシーンの内側から、もっと暗く重い方向を求める作家たちが現れ、枝分かれした。ダークシンセのほか、Dark Synthwave、Dreadwave、Slasher Synthなどと呼ばれることもある。

中心人物とされるのは、フランスのPerturbator（James Kent）だ。2012年から2014年にかけて、Terror 404、I Am the Night、Dangerous Daysを発表した。2012〜2013年には、Perturbator、Carpenter Brut、Mega Drive、Dance With The Deadらが並行して、この系統の形を作ったとされる。彼はもともとブラックメタルのバンドでギターを弾いていた。

同じくフランスのCarpenter Brut（Franck Hueso）は、名前そのものがホラー映画監督ジョン・カーペンターへの言及である。2012年から2015年にかけて3部作のEPを発表した。のちにバンド編成での演奏で、メタルの観客層にも食い込んだ。

一方、米国ではテキサス出身のGosT（James Lollar）が、2014年末にBlood Musicと契約したとされ、2019年にはCentury Mediaと契約した。こうしてメタル業界とのつながりが進んだ。

普及要因の一つは、2012年のゲームHotline Miamiだ。第1作でくり返し流れる主要なレベル曲4曲のうち、3曲はM.O.O.N.、1曲はJasper Byrneの曲だ。Perturbatorなどの楽曲も収録された。極端に暴力的なゲームの内容と結び付いて、この音は浸透した。続編（2015年）には、Carpenter Brutなどの新しい作家も加わった。

ライブでは、一部の作家がドラムとギターを加えたバンド編成で演奏している。Carpenter BrutがHellfest 2023に、PerturbatorがRock am Ring 2017に出演するなど、ロック／メタル系の大型フェスへの出演例もある。この流れの中で、メタル界との接点が生まれた。

近年は、サイバーパンクを主題とするゲームの音楽に使われた例もある。</p>
<h2>代表曲</h2><ul><li>Hydrogen (M|O|O|N)</li><li>Maniac (Carpenter Brut)</li><li>Humans Are Such Easy Prey (Perturbator)</li><li>Anarchy Road (Carpenter Brut)</li><li>She Is Young, She Is Beautiful, She Is Next (Perturbator)</li><li>Lustful Sacraments (Perturbator)</li><li>Behemoth (GosT)</li><li>Out of Body (Dance with the Dead)</li><li>Dangerous Days (Perturbator)</li><li>Neo Tokyo (Perturbator)</li><li>The Wrath of Code (Dan Terminus)</li><li>Night Business (Perturbator)</li></ul>
