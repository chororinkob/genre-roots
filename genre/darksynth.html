<h1>Darksynth（ダークシンス）とは</h1>
<p>シンセウェイヴの語彙を用いながら、明るい郷愁を排してホラーと暴力の情景を描く系統。BPMは100〜140、四つ打ちに近い硬い刻みか、機械的な8分音符の反復が基調で、リズムは明確に前へ押す。最大の識別点は音色の攻撃性で、鋸波のリード</p>
<p>シンセウェイヴの語彙を用いながら、明るい郷愁を排してホラーと暴力の情景を描く系統。BPMは100〜140、四つ打ちに近い硬い刻みか、機械的な8分音符の反復が基調で、リズムは明確に前へ押す。最大の識別点は音色の攻撃性で、鋸波のリードには歪みが深くかけられ、ベースは低く濁り、パッドは不協和な音程を含んで不穏に揺れる。金属を打つ打撃音、逆再生した悲鳴、心臓の鼓動を模した低周波が随所に配される。和声は短調、とりわけフリギア旋法やハーモニック・マイナーが選ばれ、半音の緊張を解決させないまま持続させる。旋律は反復的な短い動機を執拗に繰り返し、その上で音色だけが徐々に歪みを深めていくという展開が定型。曲構成には明確なドロップがあり、そこでは全ての音が最大の歪みで一斉に鳴る。歌はほとんど入らず、入る場合はメタルの怒号か、加工された囁きである。ジョン・カーペンターら1980年代のホラー映画の音楽、そしてヘヴィメタルのギターの攻撃性を、シンセだけで再現しようという試みであり、シンセウェイヴが夜のドライブなら、ダークシンセは深夜の逃走劇の音である。</p>
<h2>成り立ち</h2><p>2010年代前半、シンセウェイヴのシーン内部から、より暗く重い方向を求める作家たちによって分化した。名称としてはダークシンセ、ホラーシンセ、あるいはシンセウェイヴのメタル寄りという意味でメタルウェイヴなどが併用された。中心人物はフランスのPerturbator（James Kent）で、2012年から2014年にかけてTerror 404、I Am the Night、Dangerousを発表し、この系統の語彙をほぼ一人で確立した。彼はもともとブラックメタルのバンドでギターを弾いていた経歴を持ち、その攻撃性をシンセに移し替えた点が決定的だった。同じくフランスのCarpenter Brut（Franck Hueso）は、名前自体がホラー映画監督ジョン・カーペンターへの言及であり、2012年から2015年にかけて三部作EPを発表、後にバンド編成での演奏でメタルの観客層にも食い込んだ。米国側ではGost（James Lollar）がオカルト的な主題を持ち込み、メタルのレーベルBlood Music、次いでCentury Mediaと契約するなど、メタル産業との接続が進んだ。決定的な普及の契機は2012年のゲームHotline Miamiで、Perturbatorをはじめとする作家の楽曲が、極端に暴力的なゲーム内容と結び付いて若年層に浸透した。同作の続編（2015年）でもこの傾向は強化された。ライブ面では、当初は一人がシンセの前に立つだけの形式だったが、2010年代後半にはドラムとギターを加えたバンド編成が主流となり、メタルのフェスへの出演が常態化した。この過程で、電子音楽のシーンとメタルのシーンという本来交わらない二つの観客層が接続された点が、このジャンルの最も特異な達成である。近年はサイバーパンクを主題とする映像作品やゲームの音楽としても定着している。</p>
<h2>代表曲</h2><ul><li>Dangerous Days (Perturbator)</li><li>She Is Young, She Is Beautiful, She Is Next (Perturbator)</li><li>The Wrath of Code (Dan Terminus)</li><li>Behemoth (GosT)</li><li>No Man's Land (Mega Drive)</li></ul>
