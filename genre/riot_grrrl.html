<h1>Riot Grrrl（ライオットガール）とは</h1>
<p>1990年代前半に、女性を中心とする担い手が、パンクの手法を用いて性差別と暴力に抗議した運動であり、その音楽である。音そのものは、意図的に洗練を拒んでいる。 多くの場合、ギターは単純な和音を歪ませてかき鳴らす。ベースがあるのはBi</p>
<p>1990年代前半に、女性を中心とする担い手が、パンクの手法を用いて性差別と暴力に抗議した運動であり、その音楽である。音そのものは、意図的に洗練を拒んでいる。

多くの場合、ギターは単純な和音を歪ませてかき鳴らす。ベースがあるのはBikini Kill(Kathi Wilcox)などで、ベースは太く動く。ドラムは直線的に叩かれることが多い。

演奏技術の未熟さは隠されず、むしろ肯定される。上手くなければ演奏してはいけないという規範そのものが、人を締め出す仕組みだという認識があるからだ。

テンポは速い。曲は多くは短い(おおむね1〜4分)。

最も重要なのはヴォーカルだ。旋律を歌う部分、喉を裂くような絶叫、子どもじみた甲高い発声が、同一曲の中で唐突に切り替わる。この声の使い分けは、女性に期待される可愛らしさと、それを裏切る怒りとを同時に提示する戦略と解釈されることが多い。

歌詞は率直で、個人的な体験に基づくものが多い。性暴力、近親姦、摂食障害、身体への視線、家父長制、そして女性同士の連帯が題材になる。

演奏の場も設計の一部だ。暴力的になりがちな客席の最前列を女性に明け渡すよう求める慣行が生まれた。運動側では、音楽は目的ではなく、意識を変えるための手段として位置づけられている。この点が、この分野の本質である。</p>
<h2>成り立ち</h2><p>舞台はアメリカ北西部ワシントン州の州都で、大学町でもあるオリンピアと、首都ワシントンD.C.である。

1980年代のパンクの現場は、理念としては平等を掲げていた。しかし実際には男性の身体的な暴力が支配しており、ハードコアの現場が男性中心で暴力的になり、女性が前方から退いた。

1990年前後、この状況に耐えかねた女性たちが、自分たちで演奏し、自分たちで発信することを始める。中心的なバンドの一つはBikini Killだ。Kathleen Hannaを歌手とするこのバンドは、演奏中に客席へ向かって女性を前へと呼びかけ、実際に最前列の秩序を作り変えた。

1991年にワシントンD.C.で、Jen Smithが「girl riot」を発案したとされるのが通説だが、諸説ある。BratmobileのMolly NeumanとAllison Wolfeを中心に、Hanna、Smithらが共同で、ミニジン『riot grrrl』を創刊し（1991年7月）、運動の名を与えた。その手作りの印刷物が全米へ郵送されることで、共同体が形成された。この小冊子文化は極めて重要で、言葉が音楽と並んで共同体の回路を作った。

1991年にオリンピアで開かれた催し(K RecordsのInternational Pop Underground Convention)では、初日がほぼ女性のみの出演者構成(Girl Night)だった。これは、この運動にとって大きな一歩となった。Kill Rock StarsやK Recordsといった地元の小レーベルが作品を発表した。Heavens to BetsyのCorin Tuckerは後にSleater-Kinneyを結成し、より高い音楽的完成度でこの姿勢を継承した。イギリスではHuggy Bearが呼応している。

しかし運動は早期に困難に直面した。1992年に報道が過熱し（同年11月のNewsweekなど）、大手の報道機関がこの運動を流行の一種として取り上げ、参加者の意図を歪めて描いた。そのため、1992年にKathleen Hannaらが「media blackout」(報道機関への取材拒否)を呼びかける。この沈黙は運動を守った。一方で、外部への広がりを制限したという見方がある。

加えて、参加者が白人の中産階級の女性に偏っており、人種や階級の問題を十分に扱えなかったという批判は、内部からも提起され続けた。運動としては1990年代半ばから後半にかけて衰退する。しかし、その影響は音楽に留まらない。第三波と呼ばれるフェミニズムの流れを実践面で支え、2000年代以降の各地の女性主体の音楽祭や、ロシアの抗議集団Pussy Riotが影響を受けたと公言するに至るまで、影響が及んでいる。</p>
