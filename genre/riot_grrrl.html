<h1>Riot Grrrl（ライオットガール）とは</h1>
<p>1990年代前半に、女性を中心とする担い手が、パンクの手法を用いて性差別と暴力に抗議した運動であり、その音楽である。音そのものは意図的に洗練を拒む。ギターは単純な和音を歪ませて掻き鳴らし、ベースは太く動き、ドラムは直線的に叩かれる</p>
<p>1990年代前半に、女性を中心とする担い手が、パンクの手法を用いて性差別と暴力に抗議した運動であり、その音楽である。音そのものは意図的に洗練を拒む。ギターは単純な和音を歪ませて掻き鳴らし、ベースは太く動き、ドラムは直線的に叩かれる。演奏技術の未熟さは隠されず、むしろ、上手くなければ演奏してはいけないという規範そのものが排除の装置だという認識のもとで、肯定される。テンポは速く、曲は1分から3分と短い。決定的に重要なのはヴォーカルで、旋律を歌う部分と、喉を裂くような絶叫、そして子どもじみた甲高い発声が、同一曲の中で唐突に切り替わる。この声の使い分けは、女性に期待される可愛らしさと、それを裏切る怒りとを同時に提示する意図的な戦略である。歌詞は極めて直截で、性暴力、近親姦、摂食障害、身体への視線、家父長制、そして女性同士の連帯を、比喩を用いずに述べる。演奏の場も設計の一部で、暴力的になりがちな客席の最前列を女性に明け渡すよう求める慣行が生まれた。音楽は目的ではなく、意識を変えるための手段として位置づけられている点が、この分野の本質である。</p>
<h2>成り立ち</h2><p>舞台はアメリカ北西部ワシントン州の小さな大学町オリンピアと、首都ワシントンD.C.である。1980年代のパンクの現場は、理念としては平等を掲げながら、実際には男性の身体的な暴力が支配しており、女性は壁際に追いやられるか、演者の恋人としてしか扱われないことが常態だった。1990年前後、この状況に耐えかねた女性たちが、自分たちで演奏し、自分たちで発信することを始める。中心となったのはBikini Killで、Kathleen Hannaを歌手とするこのバンドは、演奏中に客席へ向かって女性を前へと呼びかけ、実際に最前列の秩序を作り変えた。同じ町のBratmobileのAllison WolfeとMolly Neumanは、自作の小冊子の中でこの運動の名を作り出し、その手作りの印刷物が全米へ郵送されることで、共同体が形成された。この小冊子文化は極めて重要で、音楽よりも先に言葉が回路を作ったのである。1991年にオリンピアで開かれた催しでは、初日が女性の演者だけの日として設定され、この運動の可視化を決定づけた。Kill Rock StarsやK Recordsといった地元の小レーベルが作品を発表し、Heavens to BetsyのCorin Tuckerは後にSleater-Kinneyを結成して、より高い音楽的完成度でこの姿勢を継承した。イギリスではHuggy Bearが呼応している。しかし運動は早期に困難に直面した。1992年から1993年にかけて、大手の報道機関がこの運動を流行の一種として取り上げ、参加者の意図を歪めて描いたため、当事者たちは報道機関への一切の取材拒否を決定する。この沈黙は運動を守った一方で、外部への広がりを制限した。加えて、参加者が白人の中産階級の女性に偏っており、人種や階級の問題を10分に扱えなかったという批判は、内部からも提起され続けた。運動としては1990年代半ばに退潮するが、その影響は音楽に留まらない。第三波と呼ばれるフェミニズムの潮流を実践面で支え、2000年代以降の各地の女性主体の音楽祭や、ロシアの抗議集団に至るまで、直接の系譜が引かれている。</p>
