<h1>Festival EDMとは</h1>
<p>EDMの中でも、屋外の大規模フェスの主舞台で数万人を一斉に反応させることに最適化された様式。BPMは128前後、ビッグルーム・ハウスと呼ばれる系統がその中核で、ドロップでは鋸波を何層も重ねた極太のリード音が、ほとんど旋律を持たない</p>
<p>EDMの中でも、屋外の大規模フェスの主舞台で数万人を一斉に反応させることに最適化された様式。BPMは128前後、ビッグルーム・ハウスと呼ばれる系統がその中核で、ドロップでは鋸波を何層も重ねた極太のリード音が、ほとんど旋律を持たない短い動機を繰り返す。特徴は音の密度ではなく、むしろ削ぎ落とし方にあり、ドロップ後は低音のキックと一本の巨大なリード、そして時折入るシンバルだけになる。これは屋外で音が拡散し反響する環境でも輪郭が失われないようにするための設計で、室内で聴くと素っ気なく感じられるほど単純である。ビルドアップは長く、スネアの連打が4分音符から32分音符まで段階的に加速し、ホワイトノイズの上昇音とサイレン、そしてMCの煽り声が重なる。その頂点で全ての音が一秒ほど完全に停止する「無音」が置かれ、この空白が観客の期待を最大化する仕掛けになっている。和声は短調の四和音循環が多く、ドロップ前のブレイクダウンでは感情を煽るピアノや弦の音、そして観客が合唱できる歌が挿入される。照明、レーザー、火柱、紙吹雪といった演出と拍単位で同期させることを前提に、構造が完全に予測可能な形で書かれている点が最大の特徴である。</p>
<h2>成り立ち</h2><p>2010年から2014年にかけて、EDMの商業的な最盛期に確立した。原型はオランダのトランスとダッチ・ハウスにあり、とりわけTiësto が2000年代前半にトランスを巨大会場向けに単純化し、2004年のアテネ五輪開会式で演奏したことが、ダンス音楽をスタジアム規模の演出と結び付ける先例となった。決定的な楽曲面での転換は、2010年前後のオランダ勢によるもので、Afrojack のTake Over Control、Hardwell のSpaceman（2012年）、そしてSwedish House Mafia のOne（2010年）やDon't You Worry Child（2012年）が、ドロップの構造と観客の合唱を前提とした型を定着させた。中でも2013年、当時17歳だったオランダのMartin Garrix が発表したAnimals は、旋律らしい旋律を持たず、単純な音型の反復だけでドロップを構成した点で象徴的で、世界各国のチャートを制覇した一方、「音楽が空洞化した」という批判の的にもなった。舞台となったのはベルギーのTomorrowland、米国のElectric Daisy Carnival とUltra Music Festival、そしてマイアミのMiami Music Week で、これらのフェスの映像がYouTube で数千万回再生されることが新曲を広める最大の経路となった。産業面では、ラスベガスのカジノがHakkasan、Omnia といった大型クラブでDJに巨額の契約を提示し、レジデンシー（専属出演契約）が主要な収入源となった。批判は多岐にわたり、楽曲の構造が同一化したこと、DJが事前に用意した進行を再生するだけになったこと、そして薬物関連の事故が繰り返し起きたことが指摘された。2015年前後には市場が飽和し、トロピカル・ハウスやフューチャー・ベースといったより柔らかい音へ関心が移り、さらに2020年前後にはテクノやハードスタイルへ主導権が移った。ただしフェス自体は現在も世界規模で開催されており、この様式は「大会場で確実に機能する型」として定番の位置を保っている。</p>
<h2>代表曲</h2><ul><li>Save The World (Swedish House Mafia)</li><li>Dare You (Hardwell ft. Matthew Koma)</li><li>Tremor (Dimitri Vegas &amp; Like Mike vs. Martin Garrix)</li><li>Spaceman (Hardwell)</li><li>Boneless (Steve Aoki, Chris Lake &amp; Tujamo)</li></ul>
