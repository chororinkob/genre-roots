<h1>Festival EDMとは</h1>
<p>EDMの中でも、屋外の大きなフェスのメインステージで、数万人を一斉に盛り上げることに合わせて作られたスタイルだ。中心にあるのは、ビッグルーム・ハウスと呼ばれる系統である。BPMは128前後だ。 ドロップでは、鋸波を何層も重ねた極太</p>
<p>EDMの中でも、屋外の大きなフェスのメインステージで、数万人を一斉に盛り上げることに合わせて作られたスタイルだ。中心にあるのは、ビッグルーム・ハウスと呼ばれる系統である。BPMは128前後だ。

ドロップでは、鋸波を何層も重ねた極太のリード音が鳴る。そのリード音が、単純で最小限のメロディーの短いフレーズをくり返す。特徴は音の多さではなく、むしろそぎ落とし方にある。ドロップの後は、キック（とサブベース）と主役のリードを中心にした、音数の少ない構成になる。

作りはミニマルで、大ホール風のリバーブを多く使う。屋外では音が広がって反響する。そうした場所でも輪郭が失われないようにするための作りだと説明されることがある。室内で聴くと、素っ気なく感じるほど単純である。

和音は、短調の4コードのくり返しが多い（例外もある）。ドロップ前のブレイクダウンでは、感情を高めるピアノや弦の音、そして観客が合唱できる歌が入る。

ビルドアップは長い。スネアの連打が、4分音符から8分・16分音符へと段階的に速くなる。そこにホワイトノイズの上昇音とサイレンが重なる。ライブでは、MCの煽りが重なることもある。

その頂点、ドロップの直前には、半小節〜1小節ほどの短い空白（ブレイク）が置かれる。リバーブの余韻やボーカルが残ることも多い。この空白が、観客の期待を最大まで高める仕掛けになっている。

曲の構成は、照明、レーザー、火柱、紙吹雪といった演出と、拍単位で合わせることを前提に、定型化している。</p>
<h2>成り立ち</h2><p>2010年から2014年にかけて、EDMが商業的に最も盛り上がった時期に、このスタイルは固まった。原型は、プログレッシブ・ハウスとエレクトロ・ハウスを軸にしている。そこにダッチ・ハウスやトランスの影響も受けて、形ができあがった。

さかのぼると、Tiësto は2004年8月のアテネ五輪開会式で、90分のセットを披露した。これは、ダンス音楽とスタジアム規模の演出との結び付きを示す、代表的な出来事となった。

ビッグルームは、スウェーデン・ノルウェー・オランダなど欧州で、2010〜12年ごろに形になったとされる。広めた曲には「Epic」「Cannonball」、Hardwellの「Spaceman」(2012年)などがある。一方、Afrojackの「Take Over Control」(2010年)とSwedish House Mafiaの「One」(2010年)は、ビッグルームの一歩手前のエレクトロ／プログレッシブ・ハウスとして位置づけられる。

2013年には、当時17歳だったオランダのMartin Garrix がAnimals を発表した。極めてミニマルなドロップで、このスタイルの代名詞となった曲である。英国など複数の国で1位、米国のHot 100で21位となった。その一方で、ネット上では本人が作ったのかを疑う声も上がった。

舞台となったのは、ベルギーのTomorrowland、米国のElectric Daisy Carnival とUltra Music Festival、そしてマイアミのMiami Music Week だ。これらのフェスの映像はYouTube で数百万〜億単位で再生され、それが新曲を広める経路の一つとなった。

産業の面では、ラスベガスで、運営会社Hakkasan Groupなどが、MGM Grand内のHakkasan（2013年開業）などの大型クラブで、人気DJに高額のレジデンシー契約を提示した（Omniaは2015年開業）。

しかし、批判もさまざまに出た。楽曲の構造が似たものばかりになったこと、DJが事前に用意した進行を再生するだけになったこと、そして薬物関連の事故が繰り返し起きたことが指摘された。

2015〜2016年にかけて、市場は飽和した。関心は、トロピカル・ハウスやフューチャー・ベースといった、より柔らかい音へ移り、その後は分散した。

それでも、サンプル配信サービス Splice では、ビッグルーム系サンプルのダウンロードが2023〜24年に急増した。フェス自体も、今も世界規模で開かれている。このスタイルは「大会場で確実に機能する型」として、定番の位置を保っている。</p>
