<h1>Isicathamiya（イシカタミヤ）とは</h1>
<p>南アフリカのズールー系男性による無伴奏合唱の様式。名称はズールー語の動詞cathama(忍び足で歩く)に由来し、その名のとおり音を立てずに歌い踊ることが様式の核心にある。編成は10人から20人程度で、1人のリードシンガーが旋律を提</p>
<p>南アフリカのズールー系男性による無伴奏合唱の様式。名称はズールー語の動詞cathama(忍び足で歩く)に由来し、その名のとおり音を立てずに歌い踊ることが様式の核心にある。編成は10人から20人程度で、1人のリードシンガーが旋律を提示し、残り全員が四声の和音で応える。声部はベースが最も人数が多く、その上にバリトン、テナー、そして高音のアルトが乗る。ムブーベが胸を張って吼えるように歌うのに対し、イシカタミヤは音量を抑え、息の混じった柔らかい発声で和音の粒を揃えることに徹底した注意を払う。歌い手は横一列に並び、足を高く上げてから床を踏み鳴らさずにそっと下ろす独特の振り付けを揃えて行う。テンポは遅く、拍は歌そのものの呼吸によって決まり、途中で自由に伸縮する。和声は宣教師由来の讃美歌の四声体を基礎としながら、ズールー語の声調に沿って旋律が動くため、西洋的な終止感とは異なる収まり方をする。歌詞は故郷への望郷、家族との別離、鉱山労働の苦しみ、聖書の一節、そして仲間への呼びかけを扱う。白いスーツや揃いの衣装、白い靴で舞台に立つのが伝統的な装いである。</p>
<h2>成り立ち</h2><p>20世紀初頭の南アフリカ、都市へ出稼ぎに出たズールー系男性労働者の生活の中から生まれた。アパルトヘイト体制のもとで黒人男性は家族を農村に残して単身でヨハネスブルグやダーバンの鉱山・工場へ移り、男性だけの宿舎に住むことを強いられた。宿舎では夜間の騒音が禁じられ、管理人に見つかれば罰せられたため、男たちは足音を立てず、声を抑えて歌うことを覚えた。これがcathama(忍び足)という名の由来であり、様式そのものが抑圧の産物であることを示している。土台となったのは、宣教師の学校で教えられた讃美歌の四声和声、アメリカから巡業に来たミンストレル・ショーやジュビリー・シンガーズがもたらした合唱様式、そしてズールーの伝統的な結婚式の歌である。1930年代からは、日曜の夜に各宿舎の合唱団が集まり、審査員を招いて優劣を競う徹夜の大会が定着した。ジャンルを広く知らしめたのは1939年にSolomon Lindaが録音した「Mbube」の大成功であり、そこから派生した抑制的な様式が後にイシカタミヤと呼ばれるようになる。1960年にJoseph Shabalalaがダーバンで結成したLadysmith Black Mambazoは、この分野の頂点となった。彼らは南アフリカの合唱大会で勝ちすぎたために出場を禁じられ、以後は審査対象外の招待演奏を続けたという逸話が残る。1986年、アメリカのPaul Simonがアルバム『Graceland』で彼らを起用したことにより、イシカタミヤは世界的に知られるようになった。ただしこの作品は、当時国際社会が課していた南アフリカへの文化的ボイコットを破ったとして激しい論争を呼んだ。宿舎文化そのものは失われつつあるが、現在も教会と競技会を通じて歌い継がれている。</p>
