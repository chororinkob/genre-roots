<h1>Isicathamiya（イシカタミヤ）とは</h1>
<p>イシカタミヤは、南アフリカのズールー系の男性が、楽器を使わずに歌う合唱のスタイルだ。名前はズールー語の動詞cathama(静かに歩く)から来ている。抑えた声で歌い、踊ることが、このスタイルの特徴である。 人数は4人から20人を超え</p>
<p>イシカタミヤは、南アフリカのズールー系の男性が、楽器を使わずに歌う合唱のスタイルだ。名前はズールー語の動詞cathama(静かに歩く)から来ている。抑えた声で歌い、踊ることが、このスタイルの特徴である。

人数は4人から20人を超えるものまである。1人のリードシンガーが旋律を歌い出し、残りの全員が4声の和音で応える。声の役割は、最も人数の多いベースが土台になり、その上にテナー(リード)、アルト、そして最も高いファルセットのソプラノが乗る。

和音は、宣教師が伝えた讃美歌の4声の重なりを土台にしている。

ムブーベは、胸を張って吼えるように歌う。それに対してイシカタミヤは、抑えた音量で、声を溶け合わせる柔らかい発声で歌う。和音の一つひとつの響きを揃えることに、細かく気を配る。

歌い手は、つま先立ちの振り付けを揃えて踊る。ズールーの舞踊ンゴマから来た足踏みの動きも取り入れる。前半は静かに歌い、後半は足の動きが加わる。その足踏みの踊りでは、体を曲のリズムに合わせる。

歌詞は、故郷への思い、家族との別れ、労働の苦しみ、聖書の一節、そして政治や社会の問題を扱う。

舞台の衣装は、揃いのスーツに白い手袋と白いシャツ、黒い光沢のある靴(二色の靴とする説もある)、そして赤いソックスが典型的な装いである。</p>
<h2>成り立ち</h2><p>第一次世界大戦後の1920〜30年代、南アフリカで、都市へ出稼ぎに出たズールー系の男性労働者の暮らしの中で、イシカタミヤの今の形の原型が固まった。19世紀末のミンストレル巡業にさかのぼる、という説もある。

黒人の男たちは、家族を農村に残して単身で、ナタール地方やヨハネスブルグ、ダーバンの炭鉱や工場へ移った。そして、男だけの宿舎に住むことが多かった。

名前の由来は、ズールー語の動詞cathama(静かに歩く)である。宿舎の警備員を起こさないための足運びだった、という説明もある。ただし、これは定まった説ではない。

土台になったのは、宣教師の学校で教えられた讃美歌の4声の和声だ。アメリカから巡業に来たミンストレル・ショーやジュビリー・シンガーズが持ち込んだ合唱のスタイルや、ズールーの昔ながらの結婚式の歌も土台になった。のちには、土曜の夜から日曜の朝にかけて、各宿舎の合唱団が集まるようになった。審査員を招いて優劣を競う、徹夜の大会が定着した。

1939年、Solomon Lindaが曲Mbubeを録音した。この曲が、力強い歌い方の古いスタイル『ムブーベ』の名の由来になった。一方、穏やかなスタイルがイシカタミヤと呼ばれるようになったのは、1960年代末から70年代初めにかけてだ(Enock MasinaのKing Star Brothersなどの歌い方)。

この音楽を世界に広めたのは、Ladysmith Black Mambazoと『Graceland』である。Ladysmith Black Mambazoは、Joseph Shabalalaが1950年代末から60年代初めに結成した前身のグループEzimnyamaから始まる(結成年は1959〜1964年と説が分かれる)。彼らは、この分野で最も有名な存在になった。南アフリカの合唱大会で勝ちすぎたために出場を禁じられ、それからは審査されない招待演奏を続けた。出場を禁じられた時期は、1960年代末とも、1973年以降ともいわれる。

1986年、アメリカのPaul Simonが、アルバム『Graceland』で彼らを起用した。これにより、イシカタミヤは世界に知られるようになった。しかし、この作品は大きな論争も呼んだ。当時、国際社会は南アフリカに文化的なボイコットを課しており、それを破ったと批判されたのだ。

その後、競技会の会場は、宿舎から都市部の会館や教会の施設へ移った。</p>
