<h1>Isicathamiya（イシカタミヤ）とは</h1>
<p>南アフリカのズールー系男性による無伴奏合唱の様式。名称はズールー語の動詞cathama(そっと歩く)に由来し、抑えた声で歌い踊ることが様式の特徴である。編成は4人から20人を超える規模まであり、1人のリードシンガーが旋律を提示し、</p>
<p>南アフリカのズールー系男性による無伴奏合唱の様式。名称はズールー語の動詞cathama(そっと歩く)に由来し、抑えた声で歌い踊ることが様式の特徴である。編成は4人から20人を超える規模まであり、1人のリードシンガーが旋律を提示し、残り全員が4声の和音で応える。声部はベースが最も人数が多く、その上にテナー(リード)、アルト、そして最も高いファルセットのソプラノが乗る。ムブーベが胸を張って吼えるように歌うのに対し、イシカタミヤは音量を抑え、息の混じった柔らかい発声で和音の粒を揃えることに徹底した注意を払う。歌い手は、つま先立ちの振り付けを揃えて行い、ズールーの舞踊ンゴマに由来する足踏みの動きも取り入れる。テンポは遅く、後半の足踏みの踊りでは、体を曲のリズムに合わせる。和声は宣教師由来の讃美歌の4声体を基礎とする。歌詞は故郷への望郷、家族との別離、労働の苦しみ、聖書の一節、そして仲間への呼びかけを扱う。揃いのスーツに白い手袋と白いシャツ、黒い光沢のある靴(二色の靴とする資料もある)、赤いソックスで舞台に立つのが伝統的な装いである。</p>
<h2>成り立ち</h2><p>第一次世界大戦後の1920〜30年代の南アフリカ、都市へ出稼ぎに出たズールー系男性労働者の生活の中から生まれた。黒人男性は家族を農村に残して単身で、ナタール地方やヨハネスブルグ、ダーバンの炭鉱・工場へ移り、男性だけの宿舎に住むことが多かった。名称の由来は、ズールー語の動詞cathama(そっと歩く)である。宿舎の警備員を起こさないための足運びだった、という説明もあるが、確立した定説ではない。土台となったのは、宣教師の学校で教えられた讃美歌の4声和声、アメリカから巡業に来たミンストレル・ショーやジュビリー・シンガーズがもたらした合唱様式、そしてズールーの伝統的な結婚式の歌である。のちには、土曜の夜から日曜の朝にかけて各宿舎の合唱団が集まり、審査員を招いて優劣を競う徹夜の大会が定着した。1939年にSolomon Lindaが録音した「Mbube」が名を与えたのは、力強い様式のムブーベである。穏やかな様式がイシカタミヤと呼ばれるようになったのは1960年代末から70年代にかけてで(Enock MasinaのKing Star Brothersなどの歌い方)、世界に知らしめたのはLadysmith Black Mambazoと『Graceland』である。Joseph Shabalalaが1950年代末から60年代初めに前身のグループEzimnyamaを結成したLadysmith Black Mambazo(結成年は資料により1959〜1964年と割れる)は、この分野の頂点となった。彼らは南アフリカの合唱大会で勝ちすぎたために出場を禁じられ、以後は審査対象外の招待演奏を続けたという逸話が残る。1986年、アメリカのPaul Simonがアルバム『Graceland』で彼らを起用したことにより、イシカタミヤは世界的に知られるようになった。ただしこの作品は、当時国際社会が課していた南アフリカへの文化的ボイコットを破ったとして激しい論争を呼んだ。宿舎文化そのものは失われつつあるが、現在も教会と競技会を通じて歌い継がれている。</p>
