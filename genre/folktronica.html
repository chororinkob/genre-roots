<h1>Folktronica（フォークトロニカ）とは</h1>
<p>アコースティックなフォークの音色と、電子音楽の編集技術を一つの曲の中で組み合わせた様式。生ギターの爪弾き、バンジョー、フィドル、ハーモニウム、木琴、素朴な歌声といったフォークの素材を録音し、それをサンプラーやパソコン上で細かく切り</p>
<p>アコースティックなフォークの音色と、電子音楽の編集技術を一つの曲の中で組み合わせた様式。生ギターの爪弾き、バンジョー、フィドル、ハーモニウム、木琴、素朴な歌声といったフォークの素材を録音し、それをサンプラーやパソコン上で細かく切り刻み、順序を入れ替え、ループさせて再構築する。ドラムは生の打楽器の録音を一打ずつ切り出して並べ直したものや、意図的にノイズを混ぜたグリッチと呼ばれる断続音が使われ、テンポは90〜130BPMと穏やか。低音は電子的なサブベースが担い、ここだけが明確に現代的な質感を持つ。和声はフォーク由来の開放的な長調や旋法が多く、同じ短い和音の連なりを何度も繰り返しながら、上に乗る音の層だけを少しずつ入れ替えて展開する。歌が入る場合はごく控えめで、言葉が聞き取れないほど加工されることも多い。テープのヒスノイズ、レコードの針音、屋外で録った鳥や雨の音といった環境音が積極的に混ぜられ、手触りの温かさと機械の冷たさが同居する。踊るためではなく、部屋で長く流し続けるために設計された音楽といえる。</p>
<h2>成り立ち</h2><p>1990年代末から2000年代前半のイギリスで、ポスト・ロックとエレクトロニカの周辺から生まれた。前段として、1996年にBeth Ortonが発表した「Trailer Park」がある。彼女はもともとWilliam OrbitやThe Chemical Brothersの作品に歌で参加しており、フォークの弾き語りと電子的な伴奏を違和感なく同居させたことでフォークトロニカの母と呼ばれた。呼称そのものを定着させたのは、ロンドンのKieran Hebdenである。彼はポスト・ロック・バンドFridgeで活動したのち、Four Tet名義で2001年に「Pause」、2003年に「Rounds」を発表した。ジャズやフォークのレコードから切り出した断片を、パソコン上で緻密に組み替えたこれらの作品は、電子音楽が温かく有機的でありうることを示し、この分野の基準作となる。同時期、レーベルDominoやWarp Records、Leaf、Typeといったところが受け皿となり、ロンドンのTunng、アイスランドのMúm、カナダのDan SnaithによるManitoba（のちのCaribou）、アメリカのThe Booksが並行して作品を発表した。とくにThe Booksは、古い教育用テープや説教の録音から拾った人の声の断片をチェロとギターに縫い合わせ、この様式の実験的な極を示している。背景にあったのは技術の変化である。2000年前後に一般のパソコンで多重録音と細密な編集ができるようになり、スタジオを借りずに一人で完結する制作が可能になった。同時に、1990年代のダンス音楽の速さと大音量への飽きから、静かで小規模な音楽への揺り戻しが起きていた。2000年代後半にはイギリスのBibioやGold Pandaが続き、アメリカではSufjan Stevensが管弦楽と打ち込みを混ぜた大作を作る。2016年にBon Iverが発表した「22, A Million」は、声を極端に加工しながらフォークの構造を保つ作品として、この発想が主流の音楽にまで浸透したことを示した。現在ではフォークトロニカという呼称自体があまり使われないが、生音と電子的な編集を区別しないという前提は、今日のポピュラー音楽の標準になっている。</p>
<h2>代表曲</h2><ul><li>Rounds (Four Tet)</li><li>Swim (Caribou)</li><li>Ambivalence Avenue (Bibio)</li></ul>
