<h1>Folktronica（フォークトロニカ）とは</h1>
<p>アコースティックなフォークの音色と、電子音楽の編集技術を一つの曲の中で組み合わせた様式。生ギターの爪弾き、バンジョー、フィドル、ハーモニウム、木琴、素朴な歌声といったフォークの素材を録音し、それをサンプラーやパソコン上で細かく切り</p>
<p>アコースティックなフォークの音色と、電子音楽の編集技術を一つの曲の中で組み合わせた様式。生ギターの爪弾き、バンジョー、フィドル、ハーモニウム、木琴、素朴な歌声といったフォークの素材を録音し、それをサンプラーやパソコン上で細かく切り刻み、順序を入れ替え、ループさせて再構築する。ドラムには、生の打楽器の録音を切り出して並べ直したものや、意図的にノイズを混ぜたグリッチと呼ばれる断続音が使われることがあり、テンポは穏やかなものが多い。和声はフォーク由来の開放的な長調や旋法が多く、同じ短い和音の連なりを何度も繰り返しながら、上に乗る音の層だけを少しずつ入れ替えて展開する。歌が入る場合はごく控えめで、言葉が聞き取れないほど加工されることも多い。テープのヒスノイズ、レコードの針音、屋外で録った鳥や雨の音といった環境音が積極的に混ぜられ、手触りの温かさと機械の冷たさが同居する。踊るためではなく、部屋で長く流し続けるために設計された音楽といえる。</p>
<h2>成り立ち</h2><p>1990年代から2000年代に、英国を中心に米国やアイスランドなどで並行して現れた(起源には諸説あり、1991年のUltramarineの作品を先駆とする見方もある)。ポスト・ロックとエレクトロニカの周辺から生まれた。前段として、1996年にBeth Ortonが発表した「Trailer Park」がある。彼女はもともとWilliam OrbitやThe Chemical Brothersの作品に歌で参加しており、フォークの弾き語りと電子的な伴奏を違和感なく同居させたことでフォークトロニカの「女王(queen)」と評された。呼称は、英国のメディアがロンドンのKieran Hebdenの音楽を形容して広まったもので、本人はこのラベルから距離を置いている。彼はポスト・ロック・バンドFridgeで活動したのち、Four Tet名義で2001年に「Pause」、2003年に「Rounds」を発表した。ジャズやフォークのレコードから切り出した断片を、パソコン上で緻密に組み替えたこれらの作品は、電子音楽が温かく有機的でありうることを示し、この分野の基準作となる。同時期、レーベルのDominoやLeafなどが受け皿となり、ロンドンのTunng、アイスランドのMúm、カナダのDan SnaithによるManitoba（のちのCaribou）、アメリカのThe Booksが並行して作品を発表した。とくにThe Booksは、古物店で見つけたカセット(自己啓発や催眠療法のものなど)や講義の録音から拾った人の声の断片をチェロとギターに縫い合わせ、この様式の実験的な極を示している。背景にあったのは技術の変化である。2000年前後に一般のパソコンで多重録音と細密な編集ができるようになり、スタジオを借りずに一人で完結する制作が可能になった。当時の評論では、Orton作品が、ダンスで疲れたクラバーのための「解毒剤」として売り出された。2000年代後半から2010年代初頭にかけて、イギリスのBibio(2008年にWarp契約)やGold Panda(初のフルアルバムは2010年)が続き、アメリカではSufjan Stevensが2010年の『The Age of Adz』で管弦楽と打ち込みを混ぜた大作を作る。2016年にBon Iverが発表した「22, A Million」は、声を極端に加工しながらフォークの構造を保つ作品として、この発想が主流の音楽にまで浸透したことを示した。この呼称は、2020年代の報道でも使われている。</p>
