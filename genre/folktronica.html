<h1>Folktronica（フォークトロニカ）とは</h1>
<p>フォークトロニカは、アコースティックなフォークの音色と、電子音楽の編集の技を、一つの曲の中で組み合わせたスタイルだ。 素材になるのは、生ギターの爪弾き、バンジョー、フィドル、素朴な歌声といったフォークの音である。これらを録音し、サ</p>
<p>フォークトロニカは、アコースティックなフォークの音色と、電子音楽の編集の技を、一つの曲の中で組み合わせたスタイルだ。

素材になるのは、生ギターの爪弾き、バンジョー、フィドル、素朴な歌声といったフォークの音である。これらを録音し、サンプラーやパソコン上で細かく切り刻む。そして順序を入れ替え、ループさせて、組み立て直す。

和音には、フォーク由来の開放的な長調や旋法が使われることがある。同じ短い和音の連なりを繰り返し、上に乗る音の層を少しずつ入れ替えて展開する曲もある。

ドラムには、生の打楽器の録音を切り出して並べ直したものが使われることがある。わざとノイズを混ぜた、グリッチと呼ばれる途切れ途切れの音が使われることもある。テンポは穏やかな曲もある。

声を素材のように加工する例もあるが、歌を主役にする作品も多い。

テープのヒスノイズ、レコードの針音、屋外で録った鳥や雨の音といった環境音も、積極的に混ぜられる。温かな手触りと機械の冷たさが、一つの音の中に同居する。踊るための音楽というより、部屋で聴くような、ダンス向けではない聴き方に向く作品が多い。</p>
<h2>成り立ち</h2><p>フォークトロニカは、1990年代から2000年代にかけて、英国を中心に、米国やアイスランドなどで並行して現れた。起源には諸説あり、1991年のUltramarineの作品を先駆とする見方もある。ポスト・ロック、エレクトロニカ、アンビエント・ハウス、トリップホップなどの周辺で、それぞれに現れた音楽だ。

その前の作品として、1996年にBeth Ortonが発表した「Trailer Park」がある。彼女はもともと、William OrbitやThe Chemical Brothersの作品に歌で参加していた。報道はOrtonを、クラブ明けに聴く歌手という意味で「comedown queen」と呼び、クラブ客に好まれたと評された。フォークの弾き語りと電子的な伴奏を違和感なく同居させたことで、後年、フォークトロニカの「女王(queen)」とも呼ばれた。

呼称は、英国のメディアがロンドンのKieran Hebdenの音楽に使ったのが最初とされる。本人は、このラベルから距離を置いている。彼はポスト・ロック・バンドFridgeで活動しながら、1998年からFour Tet名義でも活動した。そして2001年に「Pause」、2003年に「Rounds」を発表する。どちらも、ジャズやニューエイジなどの録音のサンプルを、パソコン上で緻密に組み替えた作品だ。電子音楽も温かく有機的になれることを示し、この分野の基準になる作品となった。

同じころ、DominoやLeafが、Four TetやカナダのDan SnaithによるManitoba（のちのCaribou）の受け皿となった。一方、ロンドンのTunng、アイスランドのMúm、アメリカのThe Booksは、別のレーベル（Static Caravan、FatCat、Tomlabなど）から作品を出した。とくにThe Booksは、古物店などで集めたカセット(自己啓発・催眠療法のものなど)の声の断片を、チェロとギターに縫い合わせた。このスタイルの、実験的で極端な例である。

背景にあったのは技術の変化だ。Four Tetの「Rounds」も、パソコン上で作られた作品だ。スタジオを借りずに、一人で完結する制作が可能になったのである。

2000年代後半から2010年代初めにかけては、イギリスのBibio(2008年にWarpと契約)やGold Panda(初のフルアルバムは2010年)が続いた。アメリカでは、Sufjan Stevensが2010年の『The Age of Adz』で電子音を大きく取り入れた作品を作り、これをこの流れに数える見方もある。2016年にBon Iverが発表した「22, A Million」は、声の加工と断片的な編集を前面に出した作品で、Billboard 200で2位を記録した。この呼称は、2020年代の報道でも使われている。</p>
