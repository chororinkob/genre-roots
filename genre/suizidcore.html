<h1>Suizidcore（スイジッドコア）とは</h1>
<p>ドイツ語で自殺を意味するSuizidを冠した、スピードコアの中でも自己破壊的な主題を前面に出した一派である。この名称は、Pressterror(本名David Köhler)という特定の制作者と結び付いて使われてきた。音の構成は、</p>
<p>ドイツ語で自殺を意味するSuizidを冠した、スピードコアの中でも自己破壊的な主題を前面に出した一派である。この名称は、Pressterror(本名David Köhler)という特定の制作者と結び付いて使われてきた。音の構成は、極端に速く歪んだキックドラムとノイズという点でスピードコアやテラーコアと共通するが、より暗く、グリッチ的で重く、悲鳴のような音が入ることが多いとされる。テンポは、スピードコアの目安である300 BPM以上で、エクストラトーンと同じ速度帯(かつては1,000〜3,600 BPMの帯域を指した)とする説明もあり、Pressterrorの作品もスピードコアやエクストラトーンに分類されている。主題は暴力、ゴア、自殺、死で、孤立や無価値感、身体の消滅といった内容を扱う歌詞やサンプルが使われ、聴き手を励ますことも慰めることも放棄している。</p>
<h2>成り立ち</h2><p>Suizidcoreという名称は、Pressterrorという制作者と結び付いて語られる。確認できる最古の作品は、2013年1月1日にLegs Akimbo Recordsから出たPressterrorの『Drrrrrrrressurection Of Suizidcore EP!』で、この音楽はPressterrorが主導し、名称を商標登録までしたとされる(編集者が自由に書き込める資料による)。2019年には、Pressterrorの作品がSpeedcore Worldwide(2012年にThorsten Kuznikが設立したネットレーベル)から出ている。名称の発祥について、2000年代前半のドイツ語圏の匿名の掲示板から生まれたという説明は、出典で確認できなかった。参照点として挙げられるのは、1990年代に成立した抑うつ的ブラックメタルで、Ophthalamia、Katatonia、Bethlehem、Forgotten Tomb、Shiningといったバンドが先駆者とされる。なかでもBethlehemが1996年に発表したディクティウス・テ・ネカーレは、題名がラテン語で「自らを殺せ」という意味であり、スウェーデンのSilencerのような極端に不安定な絶叫とともに知られる。ハードコアテクノ側の背景としては、1994年に創設されたハンブルクのレーベルFischkopf Hamburgがあるが、1990年代末には活動を終えており、この音楽の足場だったとは言えない。この分野は当然ながら深刻な倫理的批判を受けてきた。自殺を美化し、精神的に不安定な若い聴き手を危険に晒すという指摘があり、擁護する側は、口に出せない感情を音にする場が必要だと主張し、この対立は決着していない。現在はBandcampやSoundCloudの片隅で、抑うつ的な主題を扱うインターネット音楽の広い流れの一部として、細々と存続している。</p>
