<h1>Suizidcore（スイジッドコア）とは</h1>
<p>ドイツ語で自殺を意味するSuizidを名前に冠した、スピードコアの一派である。スピードコアの中でも、自己破壊的な主題を前面に出している。この名称は、Pressterror(本名David Köhler)という特定の制作者と結び付い</p>
<p>ドイツ語で自殺を意味するSuizidを名前に冠した、スピードコアの一派である。スピードコアの中でも、自己破壊的な主題を前面に出している。この名称は、Pressterror(本名David Köhler)という特定の制作者と結び付いて使われてきた。

音の作りは、極端に速く歪んだキックドラムとノイズを使う点で、スピードコアと共通する。ただ、エクストラトーンと比べると、より暗く、グリッチ的で重い。悲鳴のような音が入ることが多いとされる。

テンポは、スピードコアの目安である300 BPM以上だ。1,000 BPM以上のエクストラトーンに近い速度帯とされ、Pressterrorの作品も、スピードコアやエクストラトーンに分類されている。

主題は暴力、ゴア、自殺、死とされる。ボーカルはほぼ無く、ホラー映画やドイツ語のサンプル、悲鳴のような音が使われる。</p>
<h2>成り立ち</h2><p>Suizidcoreという名称は、Pressterrorという制作者と結び付いて語られる。

初期の作品の一つは、2013年3月23日にLegs Akimbo Recordsから出たPressterrorの『Drrrrrrrressurection Of Suizidcore EP!』だ。この音楽はPressterrorが主導したとされる。2019年には、Pressterrorの作品がSpeedcore Worldwide(2012年にThorsten Kuznikが設立したネットレーベル)から出ている。名称の発祥については、2000年代前半のドイツ語圏の匿名の掲示板から生まれたという説があるが、裏付けは得られていない。

なお、抑うつ的ブラックメタルは1990年代〜2000年代初頭にかけて形成され、Ophthalamia、Katatonia、Bethlehem、Forgotten Tomb、Shiningといったバンドが先駆者と関連づけられる。なかでもBethlehemが1996年に発表したディクティウス・テ・ネカーレは、題名がラテン語で「自らを殺さねばならない」という意味だ。この作品は、スウェーデンのSilencerのような、極端に不安定な絶叫とともに知られる。

Pressterror以外の使用は少なく、事実上廃れたとする見方がある。Pressterror個人は活動を続けている。</p>
