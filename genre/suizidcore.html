<h1>Suizidcore（スイジッドコア）とは</h1>
<p>ドイツ語で自殺を意味するSuizidを冠した、スピードコアの中でも特に自己破壊的な主題を前面に出した一派である。音の構成は極端に速く歪んだキックドラムとノイズという点でスピードコアやテラーコアと共通するが、決定的に異なるのは音色と</p>
<p>ドイツ語で自殺を意味するSuizidを冠した、スピードコアの中でも特に自己破壊的な主題を前面に出した一派である。音の構成は極端に速く歪んだキックドラムとノイズという点でスピードコアやテラーコアと共通するが、決定的に異なるのは音色と情感の設計で、明るさや攻撃的な高揚を意図的に排し、低い持続音、濁った短調の和音、極端に長い残響、そして人の泣き声や呼吸音を思わせる素材が用いられる。テンポは300 BPM前後から上で、しかし刻みは細かく装飾されず、同じ打点が延々と繰り返されることで祝祭ではなく反復による消耗が演出される。上物にはドローンや壊れかけたピアノ、テープの劣化を模した揺れが乗り、意図的にミックスの解像度を落として、遠くで鳴っているようなくぐもった質感に整えられることも多い。曲の展開は上昇せず、盛り上がりの頂点を用意しないまま突然断ち切られる終わり方が好まれる。歌詞やサンプルは孤立、無価値感、身体の消滅といった主題を扱い、聴き手を励ますことも慰めることも放棄している。フロアでの機能をほぼ完全に捨てた、内向きの極限音楽である。</p>
<h2>成り立ち</h2><p>2000年代前半、ドイツ語圏のインターネット上には、無償配布を前提とした膨大なハードコアテクノのネットレーベルが林立していた。テンポの上限を競う遊びが一巡した後、一部の作り手は速度そのものではなく、その速度が生む消耗感と絶望感を主題化する方向へ進み、その一群にSuizidcoreという名が付けられた。この命名はレーベルや評論家によるものではなく、匿名の制作者と聴き手が交わす掲示板の会話から生まれた俗称であり、当初から挑発的な意図を含んでいた。参照点として明確だったのは、同じドイツ語圏で1990年代に成立した抑うつ的ブラックメタルで、なかでもBethlehemが1996年に発表したディクティウス・テ・ネカーレ、すなわち自らを殺せという題名の作品や、スウェーデンのSilencerが残した極端に不安定な絶叫は、極限まで加速した電子音楽の側にも同じことができるはずだという発想を与えた。ハードコアテクノ側の足場としては、ハンブルクのFischkopf Schallplattenが用意した陰鬱な音響と、Speedcore Worldwideのようなネットレーベルの無審査の発表機構があった。この分野は当然ながら深刻な倫理的批判を受けてきた。自殺を美化し、精神的に不安定な若い聴き手を危険に晒すという指摘は、シーンの内部からも繰り返し提起され、実際に配信停止や出品取り下げに至った作品も存在する。擁護する側は、口に出せない感情を音にする場が必要だと主張し、この対立は決着していない。作品の多くは匿名で発表され、数年で消えるサイトに置かれたまま失われており、体系的な記録はほとんど残っていない。現在はBandcampやSoundCloudの片隅で、抑うつ的な主題を扱うインターネット音楽の広い流れの一部として、細々と存続している。</p>
