<h1>Funky House（ファンキーハウス）とは</h1>
<p>ディスコとファンクのレコードから抜き出した断片を素材に、明るく踊りやすく仕立てたハウスの一系統。中核はサンプリング（既存の録音の一部を取り込む）技法で、1970年代から1980年代初頭のディスコ、ソウル、ファンクの曲から数小節ほど</p>
<p>ディスコとファンクのレコードから抜き出した断片を素材に、明るく踊りやすく仕立てたハウスの一系統。中核はサンプリング（既存の録音の一部を取り込む）技法で、1970年代から1980年代初頭のディスコ、ソウル、ファンクの曲から数小節ほどの印象的な箇所(弦楽器のリフ、ホーンのフレーズ、歌の一節、ギターのカッティング)を切り出し、ループさせて土台にする。原曲より速度を上げてピッチが高くなり、声が甲高く聞こえる加工が使われることもある。土台は四つ打ちで、テンポは約128BPM前後（資料により120〜128や128〜136）。キックは中低域に厚みを持たせ、2拍4拍のクラップ（手拍子の音）かスネアを明瞭に鳴らし、16分音符のハイハットとシェイカーで前へ押す勢いを作る。ベースはスラップベース（弦を叩いたりはじいたりして弾く低音）のサンプルか、それを模したシンセの跳ねる音で、16分音符のシンコペーション（拍をずらして強調するリズム）を多用する。上物にはブラスセクション（金管楽器の一団）のスタブ（短く刺す音）、Fender Rhodesのコード、ワウをかけたギターが重なる。和声（コードの響き）はディスコ由来のメジャーセブンスや9thを含む明るい響きが多い。構成はDJ向けの長いイントロとアウトロを持ち、中盤にサンプルだけになるブレイクを置いて再び全要素を戻すという分かりやすい山場を作る。歌詞は入る場合、踊ること、夜、愛といった明快な主題が多い。インストゥルメンタルの曲も多い。ディープハウスと比べて内面を見つめる性質が薄く、フレンチハウスとは手法に重なる部分があり、より直接的で陽性な仕上げになるとされる。</p>
<h2>成り立ち</h2><p>起源には諸説あり、1980年代後半の米国に源流があるとする説がある。用語と商業的な広まりは、1990年代後半から2000年代のイギリスやフランスなどヨーロッパが中心だった。サンプラーの低価格化とディスコ再評価の流れが交差して生まれた。前史として、1980年代末のニューヨークでTodd Terryがヒップホップ的な断片の切り貼り手法をハウスへ持ち込んだことが影響を与えたとされ、1990年代初頭からはMasters at Workがラテンとディスコの素材を織り込んだことも下地になった。E-mu SP-1200やAkai S1000といったサンプラーの普及が制作を後押しし、これによりレコードの断片をパッド（叩いて鳴らす板）や外部のMIDI鍵盤で自在に鳴らすことが可能になった。1990年代半ば、フランスのパリでDaft Punk、Cassius、Dimitri from Parisらが、1970年代末から1980年代初頭のヨーロッパのディスコやアメリカのソウルを素材に、フィルターを開閉して抑揚を作る手法（フレンチ・ハウス）を確立した。Bob Sinclarがその名を名乗ったのは1998年で、国際的な成功は2000年代になる。Daft Punkの1997年「Homework」と、Stardustの1998年「Music Sounds Better with You」(Chaka Khanのサンプルを用いた)は多くの国のチャートに入る大ヒットになり、この作法を決定づけた。イギリスではロンドンのFull Intentionが活躍した。同時期の米国側の関連人物としてはRoger SanchezやErick Morilloも挙げられる。2000年のModjo「Lady (Hear Me Tonight)」やSpiller「Groovejet」が全英チャートを制した。フレンチ・ハウスはfilter houseとも呼ばれ、funky houseという語は時代によって指す音楽が異なる。イギリスのクラブ文化ではミニストリー・オブ・サウンドやHed Kandi、スペインのPachaといったブランドが編集盤を大量に売り、イビサ島の夏のシーズンと結びついた商業的な形態が確立した。ピークは2000年から2006年頃とされる。2010年代にはディスコやファンクの素材を使ったハウス（funk-house、ニュー・ディスコ）が盛り上がり、Purple Disco Machine、Dr Packer、Folamourといった作家が新しい世代の聴衆を得ている。2000年代半ばにロンドンで生まれたUKファンキーは、soca、soulful house、funky house、UKガラージなどの影響を受けた別系統で、当時はfunky houseとも呼ばれた。</p>
<h2>代表曲</h2><ul><li>World Hold On (Bob Sinclar)</li><li>Gypsy Woman (She's Homeless) (Crystal Waters)</li><li>Show Me Love (Robin S)</li><li>Another Chance (Roger Sanchez)</li><li>Sound of Freedom (Bob Sinclar)</li><li>Horny '98 (Mousse T. vs. Hot 'n' Juicy)</li><li>Groovejet (If This Ain't Love) (Spiller)</li><li>I Feel for You (Bob Sinclar)</li><li>Rock This Party (Bob Sinclar)</li><li>Keep on Jumpin' (Todd Terry)</li><li>Gym Tonic (Bob Sinclar &amp; Thomas Bangalter)</li><li>Sing It Back (Boris Dlugosch Mix) (Moloko)</li></ul>
