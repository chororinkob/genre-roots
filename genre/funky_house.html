<h1>Funky House（ファンキーハウス）とは</h1>
<p>ディスコとファンクのレコードから抜き出した断片を素材に、明るく踊りやすく仕立てたハウスの一系統。中核はサンプリング（既存の録音の一部を取り込む）技法で、1970年代のディスコ、ソウル、ファンクの曲から4小節から8小節の印象的な箇所</p>
<p>ディスコとファンクのレコードから抜き出した断片を素材に、明るく踊りやすく仕立てたハウスの一系統。中核はサンプリング（既存の録音の一部を取り込む）技法で、1970年代のディスコ、ソウル、ファンクの曲から4小節から8小節の印象的な箇所(弦楽器のリフ、ホーンのフレーズ、歌の一節、ギターのカッティング)を切り出し、ループさせて土台にする。原曲より速度を上げてピッチが高くなり、声が甲高く聞こえる加工も定番になっている。土台は四つ打ちで、テンポは125〜132BPM。キックは中低域に厚みを持たせ、2拍4拍のクラップ（手拍子の音）かスネアを明瞭に鳴らし、16分音符のハイハットとシェイカーで前へ押す勢いを作る。ベースはスラップベース（弦を叩いたりはじいたりして弾く低音）のサンプルか、それを模したシンセの跳ねる音で、16分音符のシンコペーション（拍をずらして強調するリズム）を多用する。上物にはブラスセクション（金管楽器の一団）のスタブ（短く刺す音）、Fender Rhodesのコード、ワウをかけたギターが重なる。和声（コードの響き）はディスコ由来のメジャーセブンスや9thを含む明るい響きが中心。構成はDJ向けの長いイントロとアウトロを持ち、中盤にサンプルだけになるブレイクを置いて再び全要素を戻すという分かりやすい山場を作る。歌詞は入る場合、踊ること、夜、愛といった明快な主題に限られる。ディープハウスと比べて内面を見つめる性質がなく、フレンチハウスとは手法をほぼ共有するが、より直接的で陽性な仕上げになる点が異なる。</p>
<h2>成り立ち</h2><p>1980年代末のアメリカに源流があり、1990年代にイギリスやフランスなどヨーロッパで広まった。サンプラーの低価格化とディスコ再評価の流れが交差して生まれた。前史として、1980年代末のニューヨークでTodd Terryがヒップホップ的な断片の切り貼り手法をハウスへ持ち込み、Masters at Workがラテンとディスコの素材を織り込んだことが下地になった。決定的だったのはE-mu SP-1200やAkai S1000といったサンプラーの普及で、これによりレコードの断片をパッド（叩いて鳴らす板）や外部のMIDI鍵盤で自在に鳴らすことが可能になった。1990年代半ば、フランスのパリでDaft Punk、Cassius、Bob Sinclar、Dimitri from Parisらが、1970年代のフレンチ・ディスコやアメリカのソウルを素材に、フィルターを開閉して抑揚を作る手法を確立した。Daft Punkの1997年「Homework」と、Stardustの1998年「Music Sounds Better with You」(Chaka Khanのサンプルを用いた)は世界的な大ヒットになり、この作法を決定づけた。イギリスではロンドンのFull Intentionが、米国のRoger SanchezやErick Morilloとともに同様の路線を展開し、2000年のModjo「Lady (Hear Me Tonight)」やSpiller「Groovejet」が全英チャートを制した。フレンチ・ハウスはfilter houseとも呼ばれ、funky houseという語は時代によって指す音楽が異なる。イギリスのクラブ文化ではミニストリー・オブ・サウンドやHed Kandi、スペインのPachaといったブランドが編集盤を大量に売り、イビサ島の夏のシーズンと結びついた商業的な形態が確立した。この商業化には強い批判もあり、同時期のディープハウスやテクノの側からは、安易なサンプル頼みで創造性がないという非難が向けられた。2000年代後半にはエレクトロハウスとより攻撃的なサウンドが主流を奪い、ファンキーハウスは一時的に時代遅れのレッテルを貼られた。しかし2010年代にはディスコやファンクの素材を使ったハウス（funk-house、ニュー・ディスコ）が盛り上がり、Purple Disco Machine、Dr Packer、Folamourといった作家が新しい世代の聴衆を得ている。2000年代半ばにロンドンで生まれたUKファンキーは、soca、soulful house、funky house、UKガラージなどの影響を受けた別系統で、当時はfunky houseとも呼ばれた。</p>
