<h1>Funky House（ファンキーハウス）とは</h1>
<p>ファンキーハウスは、ディスコとファンクのレコードから抜き出した断片を素材に、明るく踊りやすく仕立てたハウスの一種だ。 中心になるのは、サンプリング（既存の録音の一部を取り込む）技法だ。1970年代〜1980年代初頭のディスコ、ソウ</p>
<p>ファンキーハウスは、ディスコとファンクのレコードから抜き出した断片を素材に、明るく踊りやすく仕立てたハウスの一種だ。

中心になるのは、サンプリング（既存の録音の一部を取り込む）技法だ。1970年代〜1980年代初頭のディスコ、ソウル、ファンクの曲から、典型的には4小節から8小節の印象的な箇所を切り出す。弦楽器のリフ、ホーンのフレーズ、歌の一節、ギターのカッティングなどだ。これをループさせて土台にする。原曲より速度を上げてピッチが高くなり、声が甲高く聞こえる加工がされることがある。

土台は四つ打ちで、テンポは約128 BPM前後（資料により120〜128、128〜136）だ。キックは中低域に厚みを持たせる。2拍4拍にクラップ（手拍子の音）かスネアを明瞭に鳴らし、16分音符のハイハットとシェイカーで、前へ押す勢いを作る。

ベースは、スラップベース（弦を叩いたりはじいたりして弾く低音）のサンプルか、それを模したシンセの跳ねる音だ。16分音符のシンコペーション（拍をずらして強調するリズム）を多用する。

上物には、ブラスセクション（金管楽器の一団）のスタブ（短く刺す音）、Fender Rhodesのコード、ワウをかけたギターが重なる。和声（コードの響き）は、ディスコ由来のメジャーセブンスや9thを含む明るい響きが中心になることが多い。

曲の構成は、DJ向けの長いイントロとアウトロを持つ。中盤にサンプルだけになるブレイクを置き、再び全要素を戻す。分かりやすい山場を作るのである。

歌詞は、入る場合、典型的には踊ること、夜、愛といった明快な主題が多い。

ディープハウスと比べると、内面を見つめる性質は薄いとされる。フレンチハウスとは手法をほぼ共有するが、より直接的で陽性な仕上げになる点が異なる。</p>
<h2>成り立ち</h2><p>ファンキーハウスの起源には諸説あり、1980年代後半の米国説がある。用語と商業的な広まりは、1990年代後半〜2000年代のUKが中心である。サンプラーの低価格化とディスコ再評価の流れが交差して生まれた。

前史として、1980年代末のニューヨークで、Todd Terryがヒップホップ的な断片の切り貼り手法をハウスへ持ち込んだ。1990年代初頭からは、Masters at Workがラテンとディスコの素材を織り込んだ。これらが影響を与えたとされる。

E-mu SP-1200やAkai S1000といったサンプラーの普及が、制作を後押しした。これにより、レコードの断片をパッド（叩いて鳴らす板）や外部のMIDI鍵盤で、自在に鳴らすことが可能になった。

1990年代前半〜半ば、フランスで、Daft Punk、Cassius、Dimitri from Parisらが、1970年代末〜1980年代初頭のヨーロッパのディスコを素材にした。フィルターを開閉して抑揚を作る手法（French house）を、定着させたのである。Bob Sinclarは、1998年以降、2000年代に成功した。funky houseとは重なる部分がある。

Daft Punkの1997年「Homework」と、Stardustの1998年「Music Sounds Better with You」(Chaka Khanのサンプルを用いた)は、大ヒットになった。この作法は、ここで決まった。

イギリスにはロンドンのFull Intentionがいる。同時期に米国側の関連人物として、Roger SanchezやErick Morilloも挙げられる。2000年のModjo「Lady (Hear Me Tonight)」やSpiller「Groovejet」が、全英チャートを制した。フレンチ・ハウスはfilter houseとも呼ばれ、funky houseという語は時代によって指す音楽が異なる。

イギリスのクラブ文化では、ミニストリー・オブ・サウンドやHed Kandi、スペインのPachaといったブランドが、編集盤を大量に売った。イビサ島の夏のシーズンと結びついた商業的な形態が、定着した。

しかし、この商業化には強い批判もあった。同時期のディープハウスやテクノの側からは、安易なサンプル頼みで創造性がないという非難が向けられたとも言われる。ピークは2000〜2006年頃である。

それでも2010年代には、ディスコやファンクの素材を使ったハウス（funk-house、ニュー・ディスコ）が盛り上がった。Purple Disco Machine、Dr Packer、Folamourといった作家が、新しい世代の聴衆を得ている。

2000年代半ばにロンドンで生まれたUKファンキーは、別の系統だ。soca、soulful house、funky house、UKガラージなどの影響を受けた。当時は、funky houseとも呼ばれることがあった。</p>
