<h1>Funky House（ファンキーハウス）とは</h1>
<p>ディスコとファンクのレコードから抜き出した断片を素材に、明るく踊りやすく仕立てたハウスの一系統。中核はサンプリング技法で、1970年代のディスコ、ソウル、ファンクの曲から4小節から8小節の印象的な箇所(弦楽器のリフ、ホーンのフレー</p>
<p>ディスコとファンクのレコードから抜き出した断片を素材に、明るく踊りやすく仕立てたハウスの一系統。中核はサンプリング技法で、1970年代のディスコ、ソウル、ファンクの曲から4小節から8小節の印象的な箇所(弦楽器のリフ、ホーンのフレーズ、歌の一節、ギターのカッティング)を切り出し、ループさせて土台にする。原曲より速度を上げてピッチが高くなり、声が甲高く聞こえる加工も定番になっている。土台は四つ打ちで、テンポは125〜132BPM。キックは中低域に厚みを持たせ、2拍4拍のクラップかスネアを明瞭に鳴らし、16分音符のハイハットとシェイカーで前へ押す推進力を作る。ベースはスラップベースのサンプルか、それを模したシンセの跳ねる音で、16分音符のシンコペーションを多用する。上物にはブラスセクションのスタブ、Fender Rhodesのコード、ワウをかけたギターが重なる。和声はディスコ由来のメジャーセブンスや9thを含む明るい響きが中心。構成はDJ向けの長いイントロとアウトロを持ち、中盤にサンプルだけになるブレイクを置いて再び全要素を戻すという分かりやすい山場を作る。歌詞は入る場合、踊ること、夜、愛といった明快な主題に限られる。ディープハウスと比べて内省性がなく、フレンチハウスとは手法をほぼ共有するが、より直接的で陽性な仕上げになる点が異なる。</p>
<h2>成り立ち</h2><p>1990年代半ばのアメリカとイギリス、フランスで、サンプラーの低価格化とディスコ再評価の流れが交差して生まれた。前史として、1980年代末のニューヨークでTodd Terryがヒップホップ的な断片の切り貼り手法をハウスへ持ち込み、Masters at Workがラテンとディスコの素材を織り込んだことが下地になった。決定的だったのはE-mu SP-1200やAkai S1000といったサンプラーの普及で、これによりレコードの断片を鍵盤で自在に鳴らすことが可能になった。1990年代半ば、フランスのパリでDaft Punk、Cassius、Bob Sinclar、Dimitri from Parisらが、1970年代のフレンチ・ディスコやアメリカのソウルを素材に、フィルターを開閉して抑揚を作る手法を確立した。Daft Punkの1997年「Homework」と、Stardustの1998年「Music Sounds Better with You」(Chaka Khanのサンプルを用いた)は世界的な大ヒットになり、この作法を決定づけた。イギリスではロンドンを中心にThe Full Intention、Roger Sanchez、Erick Morilloが同様の路線を展開し、1999年のModjo「Lady (Hear Me Tonight)」やSpiller「Groovejet」が全英チャートを制した。この時期にfunky houseやfilter houseという呼称が定着する。イギリスのクラブ文化ではミニストリー・オブ・サウンドやPacha、Hed Kandiといったブランドが編集盤を大量に売り、イビサ島の夏のシーズンと結びついた商業的な形態が確立した。この商業化には強い批判もあり、同時期のディープハウスやテクノの側からは、安易なサンプル頼みで創造性がないという非難が向けられた。実際に法的な問題も頻発し、無許諾サンプリングによる訴訟や差し止めが相次いだ。とくに2000年代前半には、権利処理費用が高騰したことでこの手法が経済的に成立しにくくなり、シーンは縮小する。2000年代後半にはエレクトロハウスとより攻撃的なサウンドが主流を奪い、ファンキーハウスは一時的に時代遅れの烙印を押された。しかし2010年代後半から、いわゆるディスコハウスやフューチャー・ファンクの流れで手法が再評価され、Purple Disco Machine、Dr Packer、Folamourといった作家が新しい世代の聴衆を得ている。またイギリスでは2000年代後半にUKファンキーという別系統が同名に近い呼称で登場したが、これはアフリカやカリブのリズムを取り入れたUKガラージの派生であり、直接の関係はない。</p>
