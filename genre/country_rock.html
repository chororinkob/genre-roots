<h1>Country Rock（カントリーロック）とは</h1>
<p>ロックバンドの編成に、カントリーの楽器と歌の作法を持ち込んだ音楽である。中心にあるのはペダルスティールギターで、足のペダルと膝のレバーによって弦の張力を演奏中に変化させ、和音の内部の音だけを滑らかに動かすことができる。この、和音が</p>
<p>ロックバンドの編成に、カントリーの楽器と歌の作法を持ち込んだ音楽である。中心にあるのはペダルスティールギターで、足のペダルと膝のレバーによって弦の張力を演奏中に変化させ、和音の内部の音だけを滑らかに動かすことができる。この、和音が溶けるように変化する響きが、この分野を一瞬で識別させる音である。加えてドブロやバンジョー、フィドル、マンドリンが用いられ、エレクトリックギターは歪ませずに澄んだ音で弾かれることが多い。歌唱では複数の声を近い音程で重ねる密集した和声が重視され、主旋律のすぐ上に三度を、時にはさらに五度を寄り添わせる。この歌い方はアメリカ南部の教会音楽と兄弟デュオの伝統に由来する。リズムは4/4を基本に、二拍目と四拍目を軽く踏む素直な刻みで、テンポは90から130 BPM程度の中庸が中心である。和声は三和音を主体とし、ブルースのような濁りを避けて明るく開かれた響きを保つ。歌詞は放浪、故郷、恋愛、そして都市生活への疲れと田舎への憧れを扱う。ロックの音量とカントリーの穏やかさを両立させ、大きな会場でも角の立たない音を作る点に、この様式の設計思想がある。</p>
<h2>成り立ち</h2><p>1960年代後半のアメリカでは、ロックが政治的な急進性とサイケデリックな実験へ向かう一方、その反動として素朴な音楽への回帰を求める動きが生まれていた。決定的な役割を果たしたのはGram Parsonsである。フロリダ出身で裕福だが崩壊した家庭に育った彼は、1968年にThe Byrdsへ加入すると、バンドをナッシュヴィルへ連れて行き、本格的なカントリーの作品スウィートハート・オブ・ザ・ロデオを作らせた。同年、彼らは保守的なカントリーの牙城であるグランド・オール・オプリの舞台に立つが、長髪のロックバンドに対する客席の反応は冷ややかで、この試みが当時いかに挑戦的だったかを物語っている。同じ1968年、カナダとアメリカの混成であるThe Bandがミュージック・フロム・ビッグ・ピンクを発表し、翌1969年にはBob Dylanがナッシュヴィルで録音した作品を出したことで、この方向は一気に正当性を得た。Gram Parsonsはその後Flying Burrito Brothersを結成し、さらにEmmylou Harrisという才能を見出して二重唱の様式を確立するが、1973年に薬物により26歳で死亡している。舞台はやがてロサンゼルスへ移った。ローレル・キャニオンと呼ばれる丘陵地帯に音楽家が集まって共同生活を送り、そこから生まれた人脈が、Poco、Linda Ronstadt、そして1971年に結成されたThe Eaglesへとつながる。彼女の伴奏をしていた演奏者たちが独立して結成されたThe Eaglesは、カントリーの和声とロックの推進力を極めて聴きやすい形にまとめ、1976年の編集盤は史上最も売れたアルバムのひとつとなった。しかしこの商業的な成功は、当初あった土着的な緊張感を失わせたという批判も生み、パンクの世代からは打倒すべき退屈さの象徴として名指しされることになる。1972年にはNitty Gritty Dirt Bandが、若いロック世代の演奏者と戦前から活動する伝説的なカントリーの奏者たちを一堂に集めた作品を制作し、二つの世代の和解を象徴する記念碑を残した。この分野の遺産は、1990年代のオルタナティヴ・カントリーと、現在の主流のカントリーの双方に、異なる形で受け継がれている。</p>
