<h1>Hands Up（ハンズアップ）とは</h1>
<p>ユーロダンスにハッピーハードコアやトランスの要素が加わり、単純な高揚を最大化した系統。名称は聴衆が両手を上げる動作に由来する。テンポは約138〜155BPM（1分間の拍数。資料により140BPM前後ともされる）。土台は四つ打ちのキ</p>
<p>ユーロダンスにハッピーハードコアやトランスの要素が加わり、単純な高揚を最大化した系統。名称は聴衆が両手を上げる動作に由来する。テンポは約138〜155BPM（1分間の拍数。資料により140BPM前後ともされる）。土台は四つ打ちのキックとオフビート（拍の間）・ベースで、後にジャンプスタイルやハードスタイル由来の歪んだキックも加わり、その上に極めて分かりやすい旋律が置かれる。旋律は主にスーパーソウ（ノコギリ波を重ねた厚い）波形のリードで示され、短く歯切れのよい覚えやすいリフが多く、一度聴けば覚えられる単純さで設計される。ヴォーカルの扱いが特徴的で、ピッチを上げた歌声（女性の歌手のほか、ピッチを上げた男性の声も多い）か、あるいは既存のポップスをカヴァーした歌唱が乗る。この加工された声がジャンルの特徴になっている。ストロフェ（ヴァース）とリフレイン（コーラス）のポップな構成が基本で、長い盛り上げを作るトランス的な構成とは異なる。ブレイクダウン（山場の前に静かになる部分）が置かれることもある。曲は短めで、ラジオやコンピレーションでの流通を前提とする。歌詞は愛、夜、パーティーといった前向きで直接的な主題を扱う。テクノやハウスの側からは単純で商業的な形式と見なされることもあったが、ドイツ語圏と東欧では長年にわたり安定した支持を保っている。ハードスタイルと比べてキックの歪みが弱く、旋律の甘さが際立つ。</p>
<h2>成り立ち</h2><p>2000年代初頭（1990年代後半からの流れ）にドイツで成立したとされる。前史は1990年代のユーロダンスにある。ドイツ、オランダ、イタリアなどではSnap、Culture Beat、2 Unlimitedといった先行世代が、四つ打ちに歌とラップを乗せる形式でチャートを席巻していた。ユーロダンスは1996年ごろから人気が下降し、1990年代末にはハウスやトランスに移っていた。同時に、ベルギー・ドイツ・オランダではハードトランスが発展しており、ユーロダンスにハッピーハードコアやトランスの要素が加わって成立し、後にジャンプスタイルやハードスタイル由来の歪んだキックが加わった。中心となったのはドイツの制作者で、Cascada(Natalie Horlerを擁するドイツのユニット)、Groove Coverage、DJ Manian、Yanou、Special D、Scooter周辺、そしてItalobrothersが挙がる。Cascadaの2005年「Everytime We Touch」は世界的なヒットとなった（サビはMaggie Reillyの1992年の同名曲から借りている）。Cascadaはこの系統で商業的に最も成功した例の一つである。レーベルではZooland RecordsやAndorfineなどが機能し、編集盤シリーズが大量に流通した。もう一つの重要な現場が東欧である。中・東欧、とくにポーランドでこの音楽は支持され、クラブ文化と結びついた。ポーランドでは、ディスコ・ポロという既存の大衆音楽が、2002年以降、一部の演奏者によってユーロダンスやテクノなど各種のダンス音楽と結びつけられた。2000年代半ばにヨーロッパで商業的な頂点を迎え、ドイツのヒットチャートでは、Scooterの「Nessaja」が1位になるなど、一部の曲が上位に入った。しかし一部の批評家からは、洗練されていないと見なされた。2010年代初頭にはelectro houseやbig room houseの盛り上がりに押されて、主流からは後退する。しかし完全には消えず、ドイツ語圏と東欧では地域的な音楽として存続している。近年、ナイトコア編集やプレイリストを通じて、当時の楽曲が再発見されている。</p>
<h2>代表曲</h2><ul><li>Stamp on the Ground (ItaloBrothers)</li><li>Evacuate the Dancefloor (Cascada)</li><li>Everytime We Touch (Cascada)</li><li>Love Is on Fire (ItaloBrothers)</li><li>Moonlight Shadow (ItaloBrothers)</li><li>Welcome to the Club (Manian)</li><li>Maria (I Like It Loud) (Scooter)</li><li>Ravers in the UK (Manian)</li><li>Upside Down (ItaloBrothers)</li><li>Loco (Manian)</li><li>Ravers Fantasy (Manian)</li><li>Heaven (Manian)</li></ul>
