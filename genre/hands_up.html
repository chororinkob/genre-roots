<h1>Hands Up（ハンズアップ）とは</h1>
<p>ハンズ・アップは、ユーロダンスにハッピーハードコアやトランスの要素が加わって成立し、単純な高揚を最大化した系統だ。名称は聴衆が両手を上げる動作に由来する。 テンポは約138〜155BPM（1分間の拍数）の曲が多い。土台は四つ打ちの</p>
<p>ハンズ・アップは、ユーロダンスにハッピーハードコアやトランスの要素が加わって成立し、単純な高揚を最大化した系統だ。名称は聴衆が両手を上げる動作に由来する。

テンポは約138〜155BPM（1分間の拍数）の曲が多い。土台は四つ打ちのキックとオフビート（拍の間）・ベースだ。後にジャンプスタイル／ハードスタイル由来の歪んだキックが加わった。ハードスタイルと比べてキックの歪みが弱く、旋律の甘さが際立つ。

その上に極めて分かりやすい旋律が置かれる。旋律は主にスーパーソウ（ノコギリ波を重ねた厚い）波形のリードで示され、覚えやすい短いシンセ・リフである。

ヴォーカルの扱いが特徴的だ。ピッチを上げた歌声（女性の歌手のほか、ピッチを上げた男性の声も多い）か、あるいは既存のポップスをカヴァーした歌唱が乗る。この加工された声が、ジャンルの目印になっている。歌詞は愛、夜、パーティーといった直接的な主題を扱う。

曲の構成は、ストロフェ（ヴァース）＝リフレイン（コーラス）のポップな構成が基本だ。長い盛り上げを作るトランス的な構成とは異なる。

一部の批評家からは洗練されていないと見なされたが、ドイツ語圏と東欧では長年にわたり安定した支持を保っている。</p>
<h2>成り立ち</h2><p>ハンズ・アップは、2000年代初頭（1990年代後半からの流れ）にドイツで成立したとされる。前史は1990年代のユーロダンスにある。ドイツ、オランダ、イタリアなどではSnap!、Culture Beat、2 Unlimitedといった先行世代が、四つ打ちに歌とラップを乗せる形式でチャートを席巻していた。

ユーロダンスは1996年ごろから人気が下降し、1990年代末にはハウスやトランスに移っていた。同時に、ハードトランスがベルギー・ドイツ・オランダで発展していた。ユーロダンスにハッピーハードコアやトランスの要素が加わって成立し、後にジャンプスタイル／ハードスタイル由来の歪んだキックが加わった。

中心となったのはドイツの制作者で、Cascada(Natalie Horlerを擁するドイツのユニット)、Groove Coverage、DJ Manian、Yanou、Special D.、Scooter周辺、そしてItaloBrothersが挙がる。Cascadaの2005年「Everytime We Touch」は世界的なヒットとなった（サビはMaggie Reillyの1992年の同名曲から借りている）。Cascadaはこの系統で商業的に最も成功した例の一つである。レーベルではZooland RecordsとAndorfineなどが機能し、編集盤シリーズが大量に流通した。

もう一つの重要な現場が東欧である。中・東欧、特にポーランドでこの音楽は支持された。ポーランドでは、ディスコ・ポロという既存の大衆音楽が、2002年以降、一部の演奏者によってユーロダンスやテクノなど各種のダンス音楽と結びつけられた。

2000年代半ばにヨーロッパで商業的な頂点を迎えた。Scooterの「Nessaja」が1位になるなど、一部の曲がチャート上位に入った。ただ、一部の批評家からは洗練されていないと見なされた。2010年代初頭にはelectro houseやbig room houseに押されて後退した。それでも完全には消えず、ドイツ語圏と東欧では地域的な音楽として存続している。近年、ナイトコア編集やプレイリストを通じて再発見されている。</p>
<h2>代表曲</h2><ul><li>Stamp on the Ground (ItaloBrothers)</li><li>Evacuate the Dancefloor (Cascada)</li><li>Everytime We Touch (Cascada)</li><li>Love Is on Fire (ItaloBrothers)</li><li>Moonlight Shadow (ItaloBrothers)</li><li>Welcome to the Club (Manian)</li><li>Maria (I Like It Loud) (Scooter)</li><li>Ravers in the UK (Manian)</li><li>Upside Down (ItaloBrothers)</li><li>Loco (Manian)</li><li>Ravers Fantasy (Manian)</li><li>Heaven (Manian)</li></ul>
