<h1>Hands Up（ハンズアップ）とは</h1>
<p>ユーロダンスとハードダンスの語彙を組み合わせ、単純な高揚を最大化した系統。名称は聴衆が両手を上げる動作に由来する。テンポは140〜150BPM。土台はハードダンス由来の歪ませた四つ打ちのキックとオフビート・ベースで、その上に極めて</p>
<p>ユーロダンスとハードダンスの語彙を組み合わせ、単純な高揚を最大化した系統。名称は聴衆が両手を上げる動作に由来する。テンポは140〜150BPM。土台はハードダンス由来の歪ませた四つ打ちのキックとオフビート・ベースで、その上に極めて分かりやすい旋律が置かれる。旋律は主にスーパーソウ波形の厚いリードで提示され、音程の動きは大きく、一度聴けば覚えられる単純さで設計される。和声は自然短音階の4コード循環がほぼ全曲で用いられる。ヴォーカルの扱いが特徴的で、原曲より数半音上げて甲高くした女性の歌声か、あるいは既存のポップスをカヴァーした歌唱が乗る。この加工された声は人間離れした明るさを生み、ジャンルの記号になっている。曲の構成は完全に定型化しており、導入、歌、ブレイクダウン、そしてリードの旋律が爆発する部分という順序をとる。ブレイクダウンでは打楽器を止め、ピアノや歌だけにしてから復帰する。曲の長さは3分半から5分と短く、ラジオでの放送と配信での消費を前提とする。歌詞は愛、夜、パーティー、別れといった直接的な主題を扱う。テクノやハウスの側からは最も単純で商業的な形式として軽視されてきたが、ドイツ語圏と東欧では長年にわたり安定した支持を保っている。ハードスタイルと比べてキックの歪みが弱く、旋律の甘さが際立つ。</p>
<h2>成り立ち</h2><p>2000年代前半のドイツを中心とする中欧で成立した。前史は1990年代のユーロダンスにある。ドイツ、オランダ、イタリアではSnap、Culture Beat、2 Unlimited、Cascadaの先行世代が、四つ打ちに歌とラップを乗せる形式でチャートを席巻していた。この市場が2000年前後に飽和した後、より速く硬い音への需要が生まれた。同時に、オランダとドイツではハードハウスやハードトランスが発展しており、その歪んだキックとユーロダンスの旋律が結合した。呼称としてのhands upは2000年代前半にドイツ語圏で定着した。中心となったのはドイツとオーストリア、スイスの制作者で、Cascada(Natalie Horlerを擁するドイツのユニット)、Groove Coverage、DJ Manian、Yanou、Special D、Scooter周辺、そしてItalobrothersが挙がる。Cascadaの2005年「Everytime We Touch」は世界的なヒットとなり、この系統の商業的な頂点を示した。レーベルではZooland Records、Tiger Records、Andorfineが機能し、編集盤シリーズが大量に流通した。もう一つの重要な現場が東欧である。ポーランド、チェコ、ハンガリー、ロシアでこの音楽は極めて広く受容され、地元の言語による歌唱を持つ楽曲が大量に作られた。ポーランドではディスコ・ポロという既存の大衆音楽と融合し、独自の形態が生まれている。2000年代半ばから後半が最盛期で、ドイツのヒットチャートでは恒常的に上位を占めた。しかし批評的な扱いは一貫して低かった。音楽誌はこれを最も低俗で使い捨ての音楽として扱い、ダンス音楽の内部からも軽蔑された。制作者側もそれを自覚しており、深い芸術性を主張せず、機能に徹するという態度が共有されていた。2010年前後にはEDMの隆盛によって市場を奪われ、主流からは後退する。しかし完全には消えず、ドイツ語圏と東欧では地域的な音楽として存続し、また日本では2000年代後半にパラパラ文化やゲームセンターの音楽ゲームを通じて独自に受容された。2010年代後半以降、当時の楽曲がSNSの短い動画で再発見され、若い世代が皮肉抜きに楽しむ現象が起きている。近年ではハードスタイルやユーロビートの再評価とも連動し、ドイツを中心に新しい制作者が現れている。</p>
<h2>代表曲</h2><ul><li>Everytime We Touch (Cascada)</li><li>Maria (I Like It Loud) (Scooter)</li><li>Stamp on the Ground (ItaloBrothers)</li></ul>
