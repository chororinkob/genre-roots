<h1>Flashcore（フラッシュコア）とは</h1>
<p>フラッシュコアは、スピードコアのスタッカート的な質感を受け継ぎながら、速さ自体は目的としない電子音楽だ。テンポに決まりはなく、速くない例(200BPM未満)もある。スピードコア、インダストリアル・ノイズ、電子音響の間にある、前衛的</p>
<p>フラッシュコアは、スピードコアのスタッカート的な質感を受け継ぎながら、速さ自体は目的としない電子音楽だ。テンポに決まりはなく、速くない例(200BPM未満)もある。スピードコア、インダストリアル・ノイズ、電子音響の間にある、前衛的なスタイルである。

特徴は、ピッチが急降下する短いキックと、四つ打ちからの逸脱だ。La Pesteは、Ableton Live、Bidule、Kyma Xを使うと語っている。La Pesteには、キックにピッチベンド効果をかけ、加速・減速させる例がある。

リズムは、四つ打ちとその分割からの、暗示的または明示的な逸脱が中心だ。一定のテンポがない例もある。

曲の構成は、サビや展開部といった歌もの的な型を持たない。主に、密度の増減とノイズ帯域の移り変わりで聴かせる。グリッチ（機械の誤作動のような音）やクリックといった、短く断片化した音の密な構造が前面に押し出され、ハーモニーやリズムの枠を超えようとする。踊るための音楽というより、音響そのものを聴かせる実験音楽に近い位置にある。</p>
<h2>成り立ち</h2><p>1998年、フランスのローラン・ミアロンは、La Peste名義での制作と並行して、自主レーベルHangars Liquidesを立ち上げた。当初はスピードコア志向のレーベルだった。Flashcoreの名で作品を出し始めたのは、2000〜2001年頃からとされる。

当時のフランスには、レイヴ／フリーテクノ・シーンに根ざしたフレンチコア(約200BPM)の動きがすでにあった。Micropointは、1992年にRadiumとAl Coreが結成した、最初期のフレンチコア・ユニットである。Audiogenicは、Radiumが1996年に作った、同じ流れのレーベルだ。

しかしミアロンは、速さ自体を目的にはしなかった。ピッチが大きく減衰する短いキックを特徴とし、電子音響の技法を、スピードコアを出自とする作品に持ち込んだ。その背景には、ミアロン本人が師として挙げるFrançois BayleやBernard Parmegiani、Iannis Xenakis、György Ligetiといった作曲家がいる。BayleとParmegianiは電子音響・アクースマティック音楽、Xenakisは確率論的（偶然や確率の考え方を使った）な音楽、Ligetiは主にミクロポリフォニーの作曲家である。

同じころ、オーストラリア・ニューカッスルのBloody Fist Recordsでは、Mark Newlandsが自らも加わるNasenblutenなどとともに、安価な機材と粗い音でハードコアの高速化を進めていた。

フラッシュコアという呼び名は、ミアロンが付けたものだ。Hangars Liquides公式サイトの宣言文「manifesto」も彼が書き、レーベルの目指す方向を示した。ただし、商業的な成功とは無縁だった。少なくとも2007年時点ではシーンは小さく、クラブでかかる機会もほとんどなかった。

2003年には、アメリカのXanopticonがHymen Recordsから『Liminal Space』を出しており、ブレイクコア作品として知られる。Xanopticonの作品は、フラッシュコアとされることもある。エクストラトーンやスプリッターコアといった隣接する語と混用されることもありながら、少数の作家によって続けられている。</p>
