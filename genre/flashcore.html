<h1>Flashcore（フラッシュコア）とは</h1>
<p>スピードコアをさらに突き詰め、キックドラムそのものを合成音として一から設計し直した電子音楽である。テンポはBPM 300から1000超に及び、1分間に1000発を超える打点は人間の聴覚では個々の打撃として分離できず、連続した低い唸</p>
<p>スピードコアをさらに突き詰め、キックドラムそのものを合成音として一から設計し直した電子音楽である。テンポはBPM 300から1000超に及び、1分間に1000発を超える打点は人間の聴覚では個々の打撃として分離できず、連続した低い唸り、すなわち音の高さとして知覚される。このリズムが音色へ変わる境界領域を意図的に扱う点が、既存のキック音源を歪ませて速く並べるだけのスピードコアとの決定的な違いである。制作にはグラニュラーシンセシスや加算合成、CsoundやReaktorといった音響合成環境が用いられ、サイン波を数十ミリ秒で急激にピッチダウンさせたうえでウェーブシェイパーやディストーションで倍音を足すことで、一発ごとに輪郭の異なる打点が作られる。リズムは小節ではなくミリ秒単位で配置され、4/4拍子の枠を保ちながら打点の間隔を微細にずらすことで、うねりや破綻が生まれる。曲の構成はサビや展開部といった歌もの的な型を持たず、密度の増減とノイズ帯域の推移だけで聴かせる。グリッチ、クリック、標本化周波数の限界で生じる折り返し歪みが積極的に前面へ押し出され、旋律や和声はほとんど用いられない。踊るための音楽というより、音響そのものを聴かせる実験音楽に近い位置にある。</p>
<h2>成り立ち</h2><p>1998年、パリのローラン・ミアロンがLa Peste名義での制作と並行して自主レーベルHangars Liquidesを立ち上げたことが直接の起点である。当時のフランスには、Micropointを擁するAudiogenicやRadiumのように、ガバの延長線上で極端な高速化と歪みを競う土壌がすでにあった。しかしミアロンはテンポを上げることそのものより、キックの波形を一発ずつ設計し直す方向へ進み、電子音響の技法をダンスフロアの文脈へ持ち込んだ。背景には、Karlheinz StockhausenがKontakteで示した、リズムを加速させ続ければやがて音の高さに変わるという連続体の発想や、Iannis Xenakisの確率論的な音響構成があり、フラッシュコアはそれをハードコアの側から実践した形になっている。同時期、オーストラリア・ニューカッスルのBloody Fist Recordsでは、Mark Newlands率いるNasenblutenやToecutterが安価な機材と粗い音でハードコアの高速化を進めており、両者は郵便と通販カタログを通じて緩やかにつながっていた。フラッシュコアという呼称はHangars Liquides周辺の作品を指す言葉として使われ始め、明確な宣言や運動として提唱されたわけではない。商業的な成功とは終始無縁で、プレス枚数は数百枚単位、クラブでかかる機会もほとんどなく、聴き手は世界中に散らばった数千人規模にとどまった。2000年代にはアメリカのXanopticonがHymen Recordsからブレイクコアとの中間的な作品を発表し、ドイツやポーランドのネットレーベルが無償配布で受け皿となった。現在はBandcampやSoundCloudが主な発表の場であり、エクストラトーンやスプリッターコアといった細分化した呼称と混ざり合いながら、少数の作家によって続けられている。</p>
<h2>代表曲</h2><ul><li>La Peste - 1000 Needles</li><li>Hangars Liquides - HL001</li><li>Toecutter - The Great Australian Bite</li></ul>
