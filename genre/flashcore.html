<h1>Flashcore（フラッシュコア）とは</h1>
<p>スピードコアをさらに突き詰め、キックドラムそのものを合成音として一から設計し直した電子音楽である。テンポに決まりはなく、速くない例(200BPM未満)もある。スピードコア、インダストリアル・ノイズ、電子音響の間にある前衛的な様式で</p>
<p>スピードコアをさらに突き詰め、キックドラムそのものを合成音として一から設計し直した電子音楽である。テンポに決まりはなく、速くない例(200BPM未満)もある。スピードコア、インダストリアル・ノイズ、電子音響の間にある前衛的な様式で、特徴はピッチが急降下する短いキックと、四つ打ちからの逸脱である。制作にはAbleton LiveやBidule、Kyma Xといった環境が用いられ、一発ごとに輪郭の異なるキックが作られる。リズムは四つ打ちとその分割からの逸脱が中心で、打点の間隔を微細にずらすことで、うねりや破綻が生まれる。曲の構成はサビや展開部といった歌もの的な型を持たず、密度の増減とノイズ帯域の推移だけで聴かせる。グリッチ（機械の誤作動のような音）、クリック、標本化周波数（デジタル録音の細かさ）の限界で生じる折り返し歪み（音が折り返してゆがむ現象）が積極的に前面へ押し出され、旋律や和声はほとんど用いられない。踊るための音楽というより、音響そのものを聴かせる実験音楽に近い位置にある。</p>
<h2>成り立ち</h2><p>1998年、フランスのローラン・ミアロンがLa Peste名義での制作と並行して自主レーベルHangars Liquidesを立ち上げた。当初はスピードコア志向のレーベルで、Flashcoreの名で作品を出し始めたのは2000年以降とされる。当時のフランスには、Radiumが創設メンバーのMicropointや、Audiogenicのように、ガバの延長線上で歪んだ高速の音を追う、フレンチコア(約200BPM)の動きがすでにあった。しかしミアロンはテンポを上げることそのものより、キックの波形を一発ずつ設計し直す方向へ進み、電子音響の技法をダンスフロアの文脈へ持ち込んだ。背景には、ミアロン本人が師として挙げるFrançois BayleやBernard Parmegiani、Iannis Xenakis、György Ligetiといった作曲家の、電子音響や確率論的（偶然や確率の考え方を使った）な音響構成がある。同時期、オーストラリア・ニューカッスルのBloody Fist Recordsでは、Mark Newlandsが自らも加わるNasenblutenなどとともに、安価な機材と粗い音でハードコアの高速化を進めていた。フラッシュコアという呼称はミアロンが名づけ、宣言文『Flashcore Manifesto』も彼が書いて、レーベルの志向を示した。商業的な成功とは終始無縁で、クラブでかかる機会もほとんどなく、聴き手は世界中に散らばった少数にとどまった。2000年代にはアメリカのXanopticonがHymen Recordsからブレイクコアとの中間的な作品を発表した。現在はBandcampやSoundCloudが主な発表の場であり、エクストラトーンやスプリッターコアといった細分化した呼称と混ざり合いながら、少数の作家によって続けられている。</p>
