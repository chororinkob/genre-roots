<h1>Electro（エレクトロ）とは</h1>
<p>Roland TR-808が鳴らす硬い電子音のドラムと、ヴォコーダーで機械化された声を軸にした1980年代前半のダンス音楽。最大の特徴はリズムで、ディスコやハウスのような均等な四つ打ちではなく、バスドラムとスネアの間に16分音符の</p>
<p>Roland TR-808が鳴らす硬い電子音のドラムと、ヴォコーダーで機械化された声を軸にした1980年代前半のダンス音楽。最大の特徴はリズムで、ディスコやハウスのような均等な四つ打ちではなく、バスドラムとスネアの間に16分音符のシンコペーションを大量に差し込んだ跳ねるブロークンビートを使う。TR-808の低く伸びるバスドラム、乾いたリムショット、シャラシャラ鳴るカウベルとハンドクラップが定番の音色で、そこにシンセサイザーの単音で打ち込んだベースラインが機械的に絡む。テンポは110〜130BPM。旋律はごく単純な短調の反復が多く、和声はほとんど変化しない。声は生身の歌よりも、ヴォコーダーやトークボックスで加工した平坦な合成音声が好まれ、歌詞はロボット、宇宙、未来都市、機械と人間の境界といったSF的な主題を扱う。ブレイクダンスの伴奏として鳴っていた音楽であり、身体の動きを区切るために音の一つ一つが短く切り立って配置される。ヒップホップと出自を共有するが、サンプリングとラップではなく電子音とヴォコーダーを主役にした点が決定的に違う。</p>
<h2>成り立ち</h2><p>1982年、ニューヨークのブロンクスで生まれた。Afrika Bambaataaは、制作者Arthur Bakerと鍵盤奏者John Robieとともに、ドイツのKraftwerkの「Trans-Europe Express」の旋律と「Numbers」のリズムを組み合わせ、当時発売されたばかりのRoland TR-808で全体を打ち込んだ「Planet Rock」を制作した。レーベルTommy Boy Recordsから出たこの一曲は、ヒップホップに電子音の語彙を持ち込み、以後のダンス音楽の設計図となる。Kraftwerkへの使用許諾は取られておらず、後に訴訟となって和解している。続いてMan Parrishの「Hip Hop, Be Bop (Don't Stop)」(1982)、Hashimの「Al-Naafiysh (The Soul)」(1983)、Newcleusの「Jam On It」(1984)が続き、ニューヨークの街頭ではこの音でブレイクダンスが踊られた。ロサンゼルスではEgyptian Loverが、マイアミではDynamix IIらがそれぞれ地域色を加え、低音を極端に強調したマイアミ・ベースが派生する。もう一つの重要な系譜がデトロイトである。Juan AtkinsとRichard Davisは1981年にCybotronを結成し、1983年の「Clear」で、荒廃した自動車産業都市の未来像を電子音で描いた。ここから直接デトロイト・テクノが生まれている。イギリスでも影響は大きく、ヨークシャーのUnique 3らによる低音を強調したブリープ・テクノがこの語彙を受け継いだ。だが1986年前後、サンプラーの普及とRun-D.M.C.以降のロック寄りのヒップホップの台頭により、エレクトロは急速に古臭いものとされ、市場から消えた。復活は1990年代である。デトロイトのDrexciyaは、奴隷船から海へ投げ込まれた人々の子孫が海底に築いた王国という神話を掲げ、暗く硬質なエレクトロを発表し続けた。ドイツのAnthony RotherやAux 88らも同時期に活動し、2000年前後にはニューヨークとベルリンでエレクトロクラッシュと呼ばれる再解釈の流行が起きる。2020年代の現在も、TR-808の音とヴォコーダーの声は、クラブ音楽の共通語として使われ続けている。</p>
<h2>代表曲</h2><ul><li>Egypt, Egypt (Egyptian Lover)</li><li>Freak-A-Zoid (Midnight Star)</li><li>Al-Naafiysh (Hashim)</li></ul>
