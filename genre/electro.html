<h1>Electro（エレクトロ）とは</h1>
<p>Roland TR-808が鳴らす硬い電子音のドラムと、シンセサイザーの電子音を軸にした1980年代前半のダンス音楽。最大の特徴はリズムで、ディスコやハウスのような均等な四つ打ちではなく、ブレイクビート（ドラムだけの短い間奏部分を</p>
<p>Roland TR-808が鳴らす硬い電子音のドラムと、シンセサイザーの電子音を軸にした1980年代前半のダンス音楽。最大の特徴はリズムで、ディスコやハウスのような均等な四つ打ちではなく、ブレイクビート（ドラムだけの短い間奏部分を繰り返す手法）を電子的に模したパターンで、バスドラムにシンコペーション（拍をずらして強調するリズム）があり、スネアやクラップ（手拍子の音）が裏拍を強調する、跳ねたリズム（ブロークンビート）を使う。TR-808の低く伸びるバスドラム、乾いたリムショット（太鼓の縁を叩く音）、シャラシャラ鳴るカウベルとハンドクラップ（手拍子の音）が定番の音色で、そこにシンセサイザーの単音で打ち込んだベースライン（低音の旋律）が機械的に絡む。代表曲のテンポは概ね115〜130BPM前後で、曲により異なる。旋律は短い反復フレーズが多い。声は生身の歌よりも、ヴォコーダーやトークボックスで加工した平坦な合成音声が好まれ、歌詞はロボット、宇宙、未来都市、機械と人間の境界といったSF的な主題を扱う。ブレイクダンスの場で多く使われた音楽である。ヒップホップと出自を共有するが、サンプリング（既存の録音の取り込み）よりも電子音を主役にする。インストゥルメンタルの曲が多く、ボーカル入りの曲では、ヴォコーダー（声を機械的な響きに変える装置）で加工した声がよく使われる。</p>
<h2>成り立ち</h2><p>1980年代初頭にニューヨークを中心に成立したとされ（日本の東京やデトロイトを起源に挙げる説もあるなど、諸説ある）、直接の先駆はKraftwerkとYMOとされる。Planet Rockが転換点となったのは1982年のことだ。Afrika Bambaataaは、制作者Arthur Bakerと鍵盤奏者John Robieとともに、ドイツのKraftwerkの「Trans-Europe Express」の旋律と「Numbers」のリズムを組み合わせ、Roland TR-808（1980年発売）のドラムを、外部のミュージシャンに打ち込ませ、John RobieがProphet-5とMicromoogを手弾きで演奏して（サンプリングではなく再演奏）「Planet Rock」を制作した。レーベルTommy Boy Recordsから出たこの一曲は、ヒップホップに電子音の表現を持ち込み、エレクトロというジャンルの青写真になったと評されている。Kraftwerkへの使用許諾は取られておらず、Kraftwerk側がレーベルに連絡して、1枚売れるごとに1ドルが支払われることで合意した。続いてMan Parrishの「Hip Hop, Be Bop (Don't Stop)」(1982)、Hashimの「Al-Naafiysh (The Soul)」(1983)、Newcleusの「Jam On It」(1984)が続き、ニューヨークの街頭ではこの音でブレイクダンスが踊られた。ロサンゼルスではEgyptian Loverが、フロリダでは、1985年に結成されたDynamix IIらが活動し、1980年代中盤にマイアミで低音を極端に強調したマイアミ・ベースが成立した（起源には諸説ある）。もう一つの重要な系譜がデトロイトである。Juan AtkinsとRichard Davisは1980年にCybotronを結成し（1981年は最初のシングルの発売年）、衰退したデトロイトを「未来都市」の着想とし、1983年の「Clear」は反復するリズムと異星的な音響が特徴である。ここからデトロイト・テクノの形成に重要な役割を果たした。イギリスでも影響は大きく、ヨークシャーのUnique 3らによる低音を強調したブリープ・テクノにも、この語彙との影響関係が指摘される。だが1980年代中頃、ドラムマシンのミニマルなビートやロックのサンプルを使う新世代のヒップホップが台頭し、シンセ中心のエレクトロは後退した。1990年代後半に再評価が進んだ。デトロイトのDrexciyaは、奴隷船から海へ投げ落とされた妊娠中のアフリカ人女性の、生まれなかった子どもたちが、胎内で水中呼吸に適応して海底に築いた王国という神話を掲げ、暗く硬質なエレクトロを発表し続けた。1990年代以降は、ドイツのAnthony Rotherや、デトロイトのAux 88らも活動し、1990年代後半に始まったエレクトロクラッシュと呼ばれる再解釈の流行は、ミュンヘンのレーベルGigolo Recordsが中心とされ、命名者はDJ Hellとする説とLarry Teeとする説がある。ニューヨークでの普及は、Larry Teeの2001年のフェスティバルが大きかった。2020年代の現在も、TR-808系のサウンドは広く使われているが、現在の制作者の多くはコンピューターとサンプリングを使っている。</p>
<h2>代表曲</h2><ul><li>Egypt, Egypt (Egyptian Lover)</li><li>Al-Naafiysh (Hashim)</li><li>Electric Kingdom (Twilight 22)</li><li>Play at Your Own Risk (Planet Patrol)</li><li>Freak-A-Zoid (Midnight Star)</li><li>Bassline (Mantronix)</li><li>Din Daa Daa (George Kranz)</li><li>Don't Stop the Rock (Freestyle)</li><li>Hip Hop Be Bop (Don't Stop) (Man Parrish)</li><li>Nunk (Warp 9)</li><li>Looking for the Perfect Beat (Afrika Bambaataa &amp; Soulsonic Force)</li></ul>
