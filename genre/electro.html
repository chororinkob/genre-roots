<h1>Electro（エレクトロ）とは</h1>
<p>Roland TR-808が鳴らす硬い電子音のドラムと、ヴォコーダーで機械化された声を軸にした1980年代前半のダンス音楽。最大の特徴はリズムで、ディスコやハウスのような均等な四つ打ちではなく、バスドラムとスネアの間に16分音符の</p>
<p>Roland TR-808が鳴らす硬い電子音のドラムと、ヴォコーダーで機械化された声を軸にした1980年代前半のダンス音楽。最大の特徴はリズムで、ディスコやハウスのような均等な四つ打ちではなく、バスドラムとスネアの間に16分音符のシンコペーションを大量に差し込んだ跳ねるブロークンビートを使う。TR-808の低く伸びるバスドラム、乾いたリムショット、シャラシャラ鳴るカウベルとハンドクラップが定番の音色で、そこにシンセサイザーの単音で打ち込んだベースラインが機械的に絡む。テンポは110〜130BPM前後のものが多い。旋律はごく単純な短調の反復が多く、和声はほとんど変化しない。声は生身の歌よりも、ヴォコーダーやトークボックスで加工した平坦な合成音声が好まれ、歌詞はロボット、宇宙、未来都市、機械と人間の境界といったSF的な主題を扱う。ブレイクダンスの伴奏として鳴っていた音楽であり、身体の動きを区切るために音の一つ一つが短く切り立って配置される。ヒップホップと出自を共有するが、サンプリングよりも電子音を主役にする。インストゥルメンタルが多数派だが、ラップ入りの曲もあり、ヴォコーダーで加工した声がよく使われる。</p>
<h2>成り立ち</h2><p>1980年代初頭に日本（東京）や米国（ニューヨーク、デトロイト）で生まれ、直接の先駆はKraftwerkとYMOとされる。Planet Rockが転換点となったのは1982年のことだ。Afrika Bambaataaは、制作者Arthur Bakerと鍵盤奏者John Robieとともに、ドイツのKraftwerkの「Trans-Europe Express」の旋律と「Numbers」のリズムを組み合わせ、Roland TR-808（1980年発売）でドラムを打ち込み、John RobieがMicromoogとProphet-5で旋律を演奏した「Planet Rock」を制作した。レーベルTommy Boy Recordsから出たこの一曲は、ヒップホップに電子音の語彙を持ち込み、以後のダンス音楽の設計図となる。Kraftwerkへの使用許諾は取られておらず、Kraftwerk側がレーベルに連絡して、1枚売れるごとに1ドルが支払われることで合意した。続いてMan Parrishの「Hip Hop, Be Bop (Don't Stop)」(1982)、Hashimの「Al-Naafiysh (The Soul)」(1983)、Newcleusの「Jam On It」(1984)が続き、ニューヨークの街頭ではこの音でブレイクダンスが踊られた。ロサンゼルスではEgyptian Loverが、フロリダでは、1985年に結成されたDynamix IIらがのちに地域色を加え、低音を極端に強調したマイアミ・ベースが派生する。もう一つの重要な系譜がデトロイトである。Juan AtkinsとRichard Davisは1980年にCybotronを結成し（1981年は最初のシングルの発売年）、1983年の「Clear」で、荒廃した自動車産業都市の未来像を電子音で描いた。ここからデトロイト・テクノの形成に重要な役割を果たした。イギリスでも影響は大きく、ヨークシャーのUnique 3らによる低音を強調したブリープ・テクノがこの語彙を受け継いだ。だが1986年前後、サンプラーの普及とRun-D.M.C.以降のロック寄りのヒップホップの台頭により、エレクトロは急速に古臭いものとされ、市場から消えた。復活は1990年代である。デトロイトのDrexciyaは、奴隷船から海へ投げ込まれた人々の子孫が海底に築いた王国という神話を掲げ、暗く硬質なエレクトロを発表し続けた。1990年代以降は、ドイツのAnthony Rotherや、デトロイトのAux 88らも活動し、1990年代後半に始まったエレクトロクラッシュと呼ばれる再解釈の流行は、ミュンヘンを発祥の地とし、のちにベルリン、ロンドン、ニューヨークへ広がった。2020年代の現在も、TR-808の音とヴォコーダーの声は、クラブ音楽の共通語として使われ続けている。</p>
<h2>代表曲</h2><ul><li>Egypt, Egypt (Egyptian Lover)</li><li>Al-Naafiysh (Hashim)</li><li>Electric Kingdom (Twilight 22)</li><li>Play at Your Own Risk (Planet Patrol)</li><li>Freak-A-Zoid (Midnight Star)</li><li>Bassline (Mantronix)</li><li>Din Daa Daa (George Kranz)</li><li>Don't Stop the Rock (Freestyle)</li><li>Hip Hop Be Bop (Don't Stop) (Man Parrish)</li><li>Sharevari (A Number of Names)</li><li>Nunk (Warp 9)</li><li>Looking for the Perfect Beat (Afrika Bambaataa &amp; Soulsonic Force)</li></ul>
