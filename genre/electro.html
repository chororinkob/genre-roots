<h1>Electro（エレクトロ）とは</h1>
<p>エレクトロは、Roland TR-808のドラムと、シンセの電子音を軸にした、1980年代前半のダンス音楽だ。ヴォコーダー（声を機械的な響きに変える装置）等で加工した声がよく使われるが、インストも多い。 TR-808の低く伸びるバ</p>
<p>エレクトロは、Roland TR-808のドラムと、シンセの電子音を軸にした、1980年代前半のダンス音楽だ。ヴォコーダー（声を機械的な響きに変える装置）等で加工した声がよく使われるが、インストも多い。

TR-808の低く伸びるバスドラム、乾いたリムショット（太鼓の縁を叩く音）、シャラシャラ鳴るカウベルとハンドクラップ（手拍子の音）が定番の音色だ。そこにシンセサイザーの単音で打ち込んだベースライン（低音の旋律）が機械的に絡む。旋律は短い反復フレーズが多い。

最大の特徴はリズムだ。ディスコやハウスのような均等な四つ打ちではなく、ブレイクビートを電子的に模したパターンを使う。キックにシンコペーション（拍をずらして強調するリズム）があり、スネアまたはクラップが裏拍（バックビート）を強調する。代表曲のテンポは概ね115〜130BPM前後（曲により異なる）である。

声は生身の歌よりも、ヴォコーダーやトークボックスで加工した平坦な合成音声が好まれる。歌詞はロボット、宇宙、未来都市、機械と人間の境界といったSF的な主題を扱う。インストゥルメンタルの曲とボーカル入りの曲が混在し、ヴォコーダーで加工した声がよく使われる。

ブレイクダンスの場で多く使われた。ヒップホップと出自を共有するが、サンプリング（既存の録音の取り込み）よりも電子音を主役にする。</p>
<h2>成り立ち</h2><p>エレクトロは、ニューヨークを中心に1980年代初頭に成立した。直接の先駆はKraftwerkとYMOとされる。

Planet Rockが転換点となったのは1982年のことだ。Afrika Bambaataaは、制作者Arthur Bakerと鍵盤奏者John Robieとともに、「Planet Rock」を制作した。ドイツのKraftwerkの「Trans-Europe Express」の旋律と「Numbers」のリズムを組み合わせた。Roland TR-808（1980年発売）のドラムは、外部のミュージシャンに打ち込ませた。John RobieがProphet-5とMicromoogを手弾きで演奏した（サンプリングではなく再演奏）。

レーベルTommy Boy Recordsから出たこの一曲は、ヒップホップに電子音の表現を持ち込んだ。Reighleyは、エレクトロの青写真になったと評した。Kraftwerkへの使用許諾は取られておらず、Kraftwerk側がレーベルに連絡して、1枚売れるごとに1ドルが支払われることで合意した。

続いて、Man Parrishの「Hip Hop, Be Bop (Don't Stop)」(1982)、Hashimの「Al-Naafiysh (The Soul)」(1983)、Newcleusの「Jam On It」(1984)が出て、ニューヨークの街頭ではこの音でブレイクダンスが踊られた。

ロサンゼルスではEgyptian Loverがのちに地域色を加えた。低音を極端に強調したマイアミ・ベースは、1980年代中盤にマイアミで成立した（起源には諸説ある）。1985年に結成されたDynamix IIは、初期の影響力ある一組である。

もう一つの重要な系譜がデトロイトである。Juan AtkinsとRichard Davisは1980年にCybotronを結成した（1981年は最初のシングルの発売年）。Cybotronは、衰退したDetroitを「未来都市」の着想とした。Clear（1983）は反復するリズムと異星的な音響が特徴である。ここからデトロイト・テクノの形成に重要な役割を果たした。

イギリスでも影響は大きく、ヨークシャーのUnique 3らによる低音を強調したブリープ・テクノにも、この音づくりとの影響関係が指摘される。

だが1980年代中頃、ドラムマシンのミニマルなビートやロックのサンプルを使う新世代のヒップホップが人気を集め、シンセ中心のエレクトロは後退した。1990年代後半に再評価が進んだ。デトロイトのDrexciyaは、ある神話を掲げた。奴隷船から海へ投げ落とされた妊娠中のアフリカ人女性の、生まれなかった子どもたちが、胎内で水中呼吸に適応して海底に築いた王国である。彼らは、暗く硬質なエレクトロを発表し続けた。

1990年代以降は、ドイツのAnthony Rotherや、デトロイトのAux 88らも活動した。1990年代後半に始まったエレクトロクラッシュと呼ばれる再解釈の流行は、ミュンヘンのレーベルGigolo Recordsが中心とされる。命名者はDJ Hellとする説とLarry Teeとする説がある。ニューヨークでの普及は、Larry Teeの2001年Electroclash Festivalが大きかった。

2020年代、TR-808系のサウンドは現在も広く使われる。</p>
