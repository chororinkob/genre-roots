<h1>Sludge Metal（スラッジメタル）とは</h1>
<p>スラッジ・メタルは、ドゥームメタルの遅さとハードコア・パンクの荒々しさを混ぜ合わせた、粘りつくような重さを持つ音楽だ。 主役はギター。通常より低く調弦し（ダウンチューニング）、アンプの歪みを限界まで上げる。ファズ（音を強く歪ませる</p>
<p>スラッジ・メタルは、ドゥームメタルの遅さとハードコア・パンクの荒々しさを混ぜ合わせた、粘りつくような重さを持つ音楽だ。

主役はギター。通常より低く調弦し（ダウンチューニング）、アンプの歪みを限界まで上げる。ファズ（音を強く歪ませる効果）を重ねて、音の輪郭を溶かすこともある。ベースも歪ませてギターと同じ音域を重ね、低音の塊を作ることが多い。

旋律は控えめで、リフ中心の曲が多い。

テンポは極端に遅いのが基本だ。一部のバンドは、曲の途中で速いパートへ切り替える。

歌唱は、喉を潰すような絶叫と悲鳴が中心だ。歌詞の言葉は判別しにくいことが多い。歌詞はニヒリスティックで、貧困・薬物依存・環境汚染などを扱うことが多い。

録音は粗く、音が団子になる状態が好まれる傾向がある。ライブは耐えがたい音量で行われ、空気の圧力そのものが体験の中身になる。</p>
<h2>成り立ち</h2><p>源流のひとつは、1980年代半ばのカリフォルニアのハードコア・パンク（Black Flag、Flipper、Fang）にさかのぼるとされる。

1980年代末にはMelvinsがこの音を発展させた。その影響下で、1990年代にニューオーリンズなどルイジアナ勢が人気を集め、スラッジ・メタルのシーンとして最大級の拠点のひとつになった。

音の最大の源流のひとつは、イギリスのBlack Sabbathだ。その遅く重いリフを、アメリカのハードコア・パンク、とくにBlack FlagがMy Warの片面で見せた遅さと、Melvinsの実験が結びつけた。

ニューオーリンズでは、1988年にEyehategodが結成された。1990年の『In the Name of Suffering』と1993年の『Take as Needed for Pain』は、このスタイルを代表する作品となった。彼らは、フィードバック（音が鳴り返して響き続ける現象）を多用した荒々しい音で知られる。

歌手のMike Williamsは、実際に長年の薬物依存（ヘロイン）の中にあった。2005年のハリケーン・カトリーナで家を失い、その後、Morgan Cityで麻薬容疑により逮捕・収監された。バンド仲間は数日〜数週間連絡が取れなかったが、のちに収監を把握し、釈放に動いた。収監は91日間だった。

同じ街では、CrowbarがKirk Windsteinを中心に、より旋律的で悲哀に満ちた重さを作ったと評される。そこへDown、Soilent Green、そしてホーマのAcid Bathらが加わり、ルイジアナは一つの音楽の拠点を形成した。ジョージア州アセンズのHarvey Milkは、ノイズ・ロック／実験的ロックの文脈でスラッジと隣接する。

1990年代以降、Neurosisが（1992年の『Souls at Zero』以降）ハードコアから変化した。1997〜98年に結成されたIsisやCult of Lunaが続き、この手法はより長大で構築的な方向へ広げられた。それが、後にポストメタルと呼ばれる流れを生んだ。2000年代以降は、MastodonやBaronessといったバンドが、スラッジとプログレッシブ・メタルを融合させた。

ただし、CrowbarのKirk Windsteinは、「スラッジ」という呼称への違和感を述べている。</p>
