<h1>Sludge Metal（スラッジメタル）とは</h1>
<p>ドゥームメタルの遅さとハードコア・パンクの荒々しさを混ぜ合わせた、粘りつくような重さを持つ音楽。ギターは最も低い弦をさらに下げる変則調弦を用い、アンプの歪みを限界まで上げ、しばしばファズを重ねて音の輪郭を溶かす。リフは単純な二音か</p>
<p>ドゥームメタルの遅さとハードコア・パンクの荒々しさを混ぜ合わせた、粘りつくような重さを持つ音楽。ギターは最も低い弦をさらに下げる変則調弦を用い、アンプの歪みを限界まで上げ、しばしばファズを重ねて音の輪郭を溶かす。リフは単純な二音か三音の反復で、一つの和音を極端に長く伸ばして、次の音まで数秒待たせる。テンポは毎分50から80拍程度と極端に遅いが、曲の途中で突然ハードコア並みの速さに切り替わり、また沈み込むという落差が様式の核心にある。ベースは歪ませてギターと同じ音域を重ね、低音の塊を作る。ドラムはシンバルを長く鳴らし、タムを多用して重量感を出す。和声は短調やフリギア旋法の断片で、旋律的な展開はほぼない。歌唱は喉を潰すような絶叫と悲鳴が中心で、歌詞の言葉は判別しにくい。歌詞の主題は薬物依存、貧困、暴力、精神の崩壊、南部の湿った風土と閉塞感で、抽象的な悪魔崇拝ではなく生々しい人生の泥が描かれる。録音は意図的に汚く、音が団子になる状態が好まれる。ライブは耐えがたい音量で行われ、空気の圧力そのものが体験の中身になる。</p>
<h2>成り立ち</h2><p>生まれたのは1980年代末から90年代初頭のアメリカ南部、とりわけルイジアナ州ニューオーリンズと、隣接するジョージア州アセンズである。この地域は湿度が高く、経済的に困窮し、麻薬の流通が深刻な問題となっていた。音の直接の親はイギリスのBlack Sabbathで、その遅く重いリフを、アメリカのハードコア・パンク、とくにBlack FlagがMy Warの片面で見せた遅さと、Melvinsの実験が接続した。ニューオーリンズでは1988年にEyehategodが結成され、1990年の『In the Name of Suffering』と1993年の『Take as Needed for Pain』で、この様式を決定づけた。彼らの音は意図的に不快で、フィードバックの雑音がそのまま曲の一部になっていた。歌手Mike Williamsは実際に長年の薬物依存と極度の貧困の中にあり、2005年のハリケーン・カトリーナで家を失い、一時は行方不明とされ刑務所に収容されていた。同じ街ではCrowbarがKirk Windsteinを中心に、より旋律的で悲哀に満ちた重さを作り、Down、Acid Bath、Soilentgreenが続いて、ニューオーリンズは一つのシーンを形成した。ジョージア州アセンズではHarvey Milkが、より変則的な方向を示した。1990年代半ばには、この語法がNeurosisやIsis、Cultによってより長大で構築的な方向へ広げられ、後にポストメタルと呼ばれる流れを生んだ。2000年代以降はMastodonやBaronessといったバンドが、ここから出発してより広い聴き手に届いた。ただし当事者たちは、この音楽が彼らの実際の生活の苦痛から出てきたものであり、様式として消費されることに対して複雑な感情を語り続けている。</p>
