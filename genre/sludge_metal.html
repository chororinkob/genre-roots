<h1>Sludge Metal（スラッジメタル）とは</h1>
<p>ドゥームメタルの遅さとハードコア・パンクの荒々しさを混ぜ合わせた、粘りつくような重さを持つ音楽。ギターは最も低い弦をさらに下げる変則調弦（通常と違う弦の合わせ方）を用い、アンプの歪みを限界まで上げ、しばしばファズ（音を強く歪ませる</p>
<p>ドゥームメタルの遅さとハードコア・パンクの荒々しさを混ぜ合わせた、粘りつくような重さを持つ音楽。ギターは最も低い弦をさらに下げる変則調弦（通常と違う弦の合わせ方）を用い、アンプの歪みを限界まで上げ、しばしばファズ（音を強く歪ませる効果）を重ねて音の輪郭を溶かす。テンポは極端に遅いのが基本で、一部のバンドは曲の途中で速いパートへ切り替える。ベースは歪ませてギターと同じ音域を重ね、低音の塊を作る。和声（コードの響き）は短調やフリギア旋法（暗い響きの音階の型）の断片で、旋律的な展開はほぼない。歌唱は喉を潰すような絶叫と悲鳴が中心で、歌詞の言葉は判別しにくい。歌詞の主題は薬物依存、貧困、暴力、精神の崩壊、南部の湿った風土と閉塞感で、抽象的な悪魔崇拝ではなく生々しい人生の泥が描かれる。録音は意図的に汚く、音が団子になる状態が好まれる。ライブは耐えがたい音量で行われ、空気の圧力そのものが体験の中身になる。</p>
<h2>成り立ち</h2><p>起源は1980年代半ばのカリフォルニアのハードコア・パンク（Black Flag、Flipper、Fang）にさかのぼり、1980年代末にワシントン州のMelvinsとニューオーリンズ勢が発展させ、1990年代にはルイジアナが最大級の音楽の拠点になった。ルイジアナ一帯は湿度が高く、経済的に困窮し、麻薬の流通が深刻な問題となっていた。音の直接の親はイギリスのBlack Sabbathで、その遅く重いリフを、アメリカのハードコア・パンク、とくにBlack FlagがMy Warの片面で見せた遅さと、Melvinsの実験が結びつけた。ニューオーリンズでは1988年にEyehategodが結成され、1990年の『In the Name of Suffering』と1993年の『Take as Needed for Pain』で、この様式を決定づけた。彼らの音は意図的に不快で、フィードバック（音が鳴り返して響き続ける現象）の雑音がそのまま曲の一部になっていた。歌手Mike Williamsは実際に長年の薬物依存と極度の貧困の中にあり、2005年のハリケーン・カトリーナで家を失い、その後、麻薬容疑でMorgan Cityで逮捕され、友人らは収監を知らなかった。同じ街ではCrowbarがKirk Windsteinを中心に、より旋律的で悲哀に満ちた重さを作り、Down、Soilent Green、そしてホーマのAcid Bathらが加わり、ルイジアナは一つの音楽の拠点を形成した。ジョージア州アセンズではHarvey Milkが、より変則的な方向を示した。1990年代以降、Neurosisが（1992年の『Souls at Zero』以降）ハードコアから変化し、1997〜98年に結成されたIsisやCult of Lunaが続いて、この手法はより長大で構築的な方向へ広げられ、後にポストメタルと呼ばれる流れを生んだ。2000年代以降はMastodonやBaronessといったバンドが、ここから出発してより広い聴き手に届いた。ただしCrowbarのKirk Windsteinは、「スラッジ」という呼称への違和感を述べている。</p>
