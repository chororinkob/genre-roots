<h1>Phonk（フォンク）とは</h1>
<p>1990年代メンフィスの自主制作カセットの音を、インターネット上で2010年代に組み直した音楽。核になるのはメンフィスのラップの声と、再生速度を落とすなどの加工（チョップド・アンド・スクリュード）、そして1990年代初頭のヒップホ</p>
<p>1990年代メンフィスの自主制作カセットの音を、インターネット上で2010年代に組み直した音楽。核になるのはメンフィスのラップの声と、再生速度を落とすなどの加工（チョップド・アンド・スクリュード）、そして1990年代初頭のヒップホップなどのサンプル（録音から切り出した素材）である。金属質なカウベルの連打はドリフト・フォンクの特徴とされるが、原型のメンフィス音にも結びつけられる。低音は歪ませた808のベースが唸り、そこに1990年代初頭のヒップホップなどのサンプルが重なり、ジャズやファンクの要素が混じることが多い。ピッチを下げたテンポも好まれた。声の扱いが独特で、メンフィス時代のラップの断片を借りてきて、速度を落として音程を下げる。声が歪み、フィルターで潰されて内容が聞き取れないこともある。全体はカセットテープを何度もダビングしたような、高音が潰れ、テープの揺れとノイズが残る質感に整えられる。テンポは資料によって幅があり、毎分110〜150拍などとされるが、拍を半分で感じるため重く沈んで聞こえる。2020年前後には、運転・筋トレ・格闘技・アニメなどの動画でよく使われるドリフト・フォンクという派生が主流になり、こちらはテンポが上がり、シンセのリフが前に出て、より直線的で攻撃的になっている。ボーカルは声ネタ（サンプル）として使われ、歌詞が聞き取れないほど加工されることが多い。ドリフト・フォンクは動画の背景として使われることが多い。</p>
<h2>成り立ち</h2><p>原点は1980年代後半から1990年代前半のメンフィスにある。DJ Screwのヒューストン流の遅回しとは別に、この街ではDJ Spanish FlyやTommy Wright III、Three 6 Mafiaの前身であるTriple Six Mafia、Lord Infamousらが、粗末な機材でカセットを録音していた。DJ Spanish Flyのテープは店やクラブ、車のトランクで売られ、Tommy Wright IIIは学校や卸売りで販売した。音は暗く、ホラー映画の音源やサタニズムの意匠を借り、殺人や麻薬を淡々と語る内容で、主に地域や南部での流通だった。この埋もれた録音群が2010年代にYouTubeやSoundCloudなどオンラインで再発見され、録音当時はまだ幼児か、生まれる前後だった世代の耳に届く。2010〜11年ごろから、SpaceGhostPurrpが率いたRaider Klan（2008年結成）と、そこに集まった若者たちが、当時のメンフィス音源を素材にした新曲を作り始めた。SpaceGhostPurrpは2011年までに「phonk」を作品名・曲名に使っており（『Mysterious Phonk』は2012年6月発売で、4ADから出た初の商業アルバム。過去のミックステープ曲の再構成）、語の考案・普及者として最も広く挙げられる。DJ SmokeyやDJ Yung Vampは「new-age phonk」の制作者に位置づけられる。呼び名は既存のファンクを綴り替えたものである。この段階では主にインターネット上で広がったが、4ADから作品が発売された。2010年代後半には、ロシア、ウクライナ、ベラルーシなど東欧出身の制作者が主要な担い手となった。「Brazilian phonk」という呼び名は2023年ごろに使われ始めた。2010年代後半にロシアで生まれたドリフト・フォンクという、筋トレ、ドリフト、サッカー、アニメ、格闘技、ストリートレースなどの動画で使われる高速で攻撃的な派生が、2020年前後にTikTokで爆発的に拡散した。2021年にはデンマークのPlayaPhonkが『Phonky Town』をヒットさせ、2025年にはロンドン生まれのMXZIが『Montagem Tomada』をヒットさせた。原型を作ったメンフィスの当事者の一部は、長く正当な対価を得られず、Lord Infamousは2013年に亡くなり、Tommy Wright IIIは2011年にDiplo主宰のMad Decentのパーティーに招かれてフィラデルフィアで公演し、2010年代にネット経由で欧州にも支持層ができたとされる。無断サンプリングと、暗い意匠を娯楽として消費することへの批判は今も続いている。</p>
