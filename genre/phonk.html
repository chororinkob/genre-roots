<h1>Phonk（フォンク）とは</h1>
<p>1990年代メンフィスの自主制作カセットの音を、インターネット上で2010年代に組み直した音楽。核になるのは金属質なカウベルの連打で、ハイハットの代わりに一定の間隔でカンカンと打ち鳴らされ、これが聞こえたらこのジャンルだと分かる目</p>
<p>1990年代メンフィスの自主制作カセットの音を、インターネット上で2010年代に組み直した音楽。核になるのは金属質なカウベルの連打で、ハイハットの代わりに一定の間隔でカンカンと打ち鳴らされ、これが聞こえたらこのジャンルだと分かる目印になっている。低音は歪ませた八〇八のベースが唸り、そこに古いソウルやジャズを再生速度を落として貼りつけたサンプルが重なる。声の扱いが独特で、メンフィス時代のラップの断片を借りてきて、速度を落として音程を下げ、ダブルスピーカーで割れたような加工を施す。全体はカセットテープを何度もダビングしたような、高音が潰れ、テープの揺れとノイズが残る質感に整えられる。テンポはおおむね毎分130から150拍だが、拍を半分で感じるため重く沈んで聞こえる。2020年前後には運転動画向けに設計されたドリフト・フォンクという派生が主流になり、こちらはテンポが上がり、シンセのリフが前に出て、より直線的で攻撃的になっている。歌が入らずインストのまま完結する曲が多く、ゲーム配信や運転映像の背景として消費される前提で作られている点が、聴くことそのものを目的とした従来のヒップホップと大きく異なる。</p>
<h2>成り立ち</h2><p>原点は1990年代前半のメンフィスにある。DJ Screwのヒューストン流の遅回しとは別に、この街ではDJ Spanish FlyやTommy Wright III、Three 6 Mafiaの前身であるTriple Six Mafia、Lord Infamousらが、粗末な機材で録音したカセットを街頭や車のトランクで手売りしていた。音は暗く、ホラー映画の音源やサタニズムの意匠を借り、殺人や麻薬を淡々と語る内容で、全国流通に乗ることはほとんどなかった。この埋もれた録音群が2010年前後、YouTubeやSoundCloudに次々と再アップロードされ、当時生まれてもいなかった世代の耳に届く。2013年から14年頃、SpaceGhostPurrpが率いたRaider Klanと、そこに集まった若者たちが、当時のメンフィス音源を素材にした新曲を作り始め、DJ SmokeyとDJ Yungが自分たちの音をフォンクと名づけた。呼び名は既存のファンクを綴り替えたものである。この段階では完全にインターネット上の匿名文化で、レーベルも公演もなく、無料配布と再生数だけで広がった。2017年から19年にかけてロシア、ウクライナ、ブラジルの若い制作者が大量に参入し、とくにブラジルではファンキ・カリオカの要素と混ざった。2020年、ロシアのKordhellやPlaya Phonk、ブラジルのMXZIらが、走行動画や格闘技の入場、ゲーム配信の背景として使われる高速で攻撃的な派生を作り、これがTikTokで爆発的に拡散してドリフト・フォンクと呼ばれた。原型を作ったメンフィスの当事者の多くは金銭的な見返りを得ておらず、Lord Infamousは2013年に亡くなり、Tommy Wright IIIは2020年代になってようやく招聘されて欧州を回るようになった。無断サンプリングと、暗い意匠を娯楽として消費することへの批判は今も続いている。</p>
<h2>代表曲</h2><ul><li>Murder in My Mind (Kordhell)</li><li>Phonky Town (PlayaPhonk)</li><li>Midnight (Soudiere)</li></ul>
