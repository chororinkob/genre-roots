<h1>Phonk（フォンク）とは</h1>
<p>1990年代メンフィスの自主制作カセットの音を、インターネット上で2010年代に組み直した音楽。核になるのはメンフィスのラップの声と、再生速度を落とすなどの加工（チョップド・アンド・スクリュード）、そして1990年代初頭のヒップホ</p>
<p>1990年代メンフィスの自主制作カセットの音を、インターネット上で2010年代に組み直した音楽。核になるのはメンフィスのラップの声と、再生速度を落とすなどの加工（チョップド・アンド・スクリュード）、そして1990年代初頭のヒップホップなどのサンプルである。金属質なカウベルの連打はドリフト・フォンクの特徴で、原型のフォンクでは必須ではない。低音は歪ませた808のベースが唸り、そこに古いソウルやジャズを再生速度を落として貼りつけたサンプルが重なる。声の扱いが独特で、メンフィス時代のラップの断片を借りてきて、速度を落として音程を下げ、ダブルスピーカーで割れたような加工を施す。全体はカセットテープを何度もダビングしたような、高音が潰れ、テープの揺れとノイズが残る質感に整えられる。テンポは資料によって幅があり、毎分110〜150拍などとされるが、拍を半分で感じるため重く沈んで聞こえる。2020年前後には運転動画向けに設計されたドリフト・フォンクという派生が主流になり、こちらはテンポが上がり、シンセのリフが前に出て、より直線的で攻撃的になっている。歌が入らずインストのまま完結する曲が多く、ゲーム配信や運転映像の背景として消費される前提で作られている点が、聴くことそのものを目的とした従来のヒップホップと大きく異なる。</p>
<h2>成り立ち</h2><p>原点は1980年代後半から1990年代前半のメンフィスにある。DJ Screwのヒューストン流の遅回しとは別に、この街ではDJ Spanish FlyやTommy Wright III、Three 6 Mafiaの前身であるTriple Six Mafia、Lord Infamousらが、粗末な機材で録音したカセットを街頭や車のトランクで手売りしていた。音は暗く、ホラー映画の音源やサタニズムの意匠を借り、殺人や麻薬を淡々と語る内容で、全国流通に乗ることはほとんどなかった。この埋もれた録音群が2010年前後、YouTubeやSoundCloudに次々と再アップロードされ、当時生まれてもいなかった世代の耳に届く。2012年ごろから、SpaceGhostPurrpが率いたRaider Klan（2008年結成）と、そこに集まった若者たちが、当時のメンフィス音源を素材にした新曲を作り始めた。SpaceGhostPurrpは2012年にすでに「phonk」を名乗っており（デビュー作『Mysterious Phonk』は2012年6月発売）、語の考案・普及者として最も広く挙げられる。DJ SmokeyやDJ Yung Vampは「new-age phonk」の制作者に位置づけられる。呼び名は既存のファンクを綴り替えたものである。この段階では主にインターネット上で広がったが、4ADなどからの作品発売や公演もあった。2017〜19年には、ロシア、ウクライナ、ベラルーシなど東欧の若い制作者が中心となって大量に参入した。「Brazilian phonk」という呼び名は2023年ごろに使われ始めた。2010年代後半にロシアで生まれたドリフト・フォンクという、走行動画や格闘技の入場、ゲーム配信の背景として使われる高速で攻撃的な派生が、2020年前後にTikTokで爆発的に拡散した。2020〜21年にはデンマークのPlayaPhonkや、ロンドン生まれのMXZIらがヒットさせた。原型を作ったメンフィスの当事者の多くは金銭的な見返りを得ておらず、Lord Infamousは2013年に亡くなり、Tommy Wright IIIは2011年にDiploに呼ばれてフィラデルフィアで公演し、2010年代にネット経由で欧州にも支持層ができたとされる。無断サンプリングと、暗い意匠を娯楽として消費することへの批判は今も続いている。</p>
