<h1>Phonk（フォンク）とは</h1>
<p>フォンクは、1990年代メンフィスの自主制作カセットの音を、インターネット上で2010年代に組み直した音楽だ。 核になるのは、メンフィスのラップの声と、再生速度を落とすなどの加工（チョップド・アンド・スクリュード）である。そこに、</p>
<p>フォンクは、1990年代メンフィスの自主制作カセットの音を、インターネット上で2010年代に組み直した音楽だ。

核になるのは、メンフィスのラップの声と、再生速度を落とすなどの加工（チョップド・アンド・スクリュード）である。そこに、1990年代初頭のヒップホップなどのサンプル（録音から切り出した素材）が加わる。1990年代初頭のヒップホップなどのサンプルには、ジャズやファンクの要素が混じることが多い。ピッチを下げたテンポも好まれた。

低音は、歪ませた808のベースが唸る。金属質なカウベルの連打はドリフト・フォンクの特徴とされ、原型のフォンクでは必須ではないと見られる。

声の扱いは独特だ。メンフィス時代のラップの断片を借りてきて、速度を落として音程を下げる。声が歪み、フィルターで潰されて、内容が聞き取れないこともある。ボーカルは声ネタ（サンプル）として使われ、歌詞が聞き取れないほど加工されることが多い。

全体は、カセットテープを何度もダビングしたような質感に整えられる。高音が潰れ、テープの揺れとノイズが残る。

テンポは資料によって幅があり、毎分110〜150拍前後などとされる。ただし拍を半分で感じるため、重く沈んで聞こえることが多い。

2020年前後には、運転・筋トレ・格闘技・アニメなどの動画でよく使われるドリフト・フォンクという派生が主流になった。こちらはテンポが上がり、シンセのリフが前に出て、より直線的で攻撃的になっている。ドリフト・フォンクは動画の背景として使われることが多い。</p>
<h2>成り立ち</h2><p>原点は、1980年代後半から1990年代前半のメンフィスにある。DJ Screwのヒューストン流の遅回しとは別に、この街ではDJ Spanish FlyやTommy Wright III、Three 6 Mafiaの前身であるTriple Six Mafia、Lord Infamousらが、粗末な機材で録音したカセットを売っていた。DJ Spanish Flyのテープは、店やクラブ、車のトランクで売られた。Tommy Wright IIIは、学校や卸売りで販売した。

音は暗かった。ホラー映画の音源やサタニズムの意匠を借り、殺人や麻薬を淡々と語る内容である。流通は主に地域・南部で、全国には広がらなかった。

この埋もれた録音群が、2010年代にオンラインで再発見された。録音当時はまだ幼児か、生まれる前後だった世代の耳に届く。2010〜11年ごろから、SpaceGhostPurrpが率いたRaider Klan（2008年結成）と、そこに集まった若者たちが、当時のメンフィス音源を素材にした新曲を作り始めた。

SpaceGhostPurrpは2011年までに「phonk」を作品名・曲名に使っており、語の考案・普及者として最も広く挙げられる。『Mysterious Phonk』は2012年6月発売の、4ADから出た初の商業アルバムで、過去のミックステープ曲の再構成である。DJ SmokeyやDJ Yung Vampは「new-age phonk」の制作者に位置づけられる。呼び名は、既存のファンクを綴り替えたものだ。この段階では主にインターネット上で広がったが、4ADから作品が発売された。

2010年代後半には、ロシアで登場した流れが加わる。主要な制作者は東欧出身者が多い。「Brazilian phonk」という呼び名は、2023年ごろに使われ始めた。

2010年代後半にロシアで生まれたのが、ドリフト・フォンクである。筋トレ・ドリフト・サッカー・アニメ・格闘技・ストリートレースなどの動画の背景として使われる、高速で攻撃的な派生だ。2020年前後にTikTokで爆発的に拡散した。2021年にデンマークのPlayaPhonkが『Phonky Town』をヒットさせ、2025年にはロンドン生まれのMXZIが『Montagem Tomada』をヒットさせた。

一方、原型を作ったメンフィスの当事者について、一部の当事者は、長く正当な対価を得られなかった。Lord Infamousは2013年に亡くなった。Tommy Wright IIIは2011年に、Diplo主宰のMad Decentのパーティーに招かれてフィラデルフィアで公演した。2010年代にネット経由で欧州にも支持層ができたとされる。無断サンプリングと、暗い意匠を娯楽として消費することへの批判は、今も続いていると言われる。</p>
