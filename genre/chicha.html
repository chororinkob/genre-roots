<h1>Chicha（チチャ）とは</h1>
<p>ペルーで生まれた、コロンビアのクンビアとアンデスの音楽、そして欧米の電気楽器を融合させた音楽である。リズムの土台はクンビア由来の二拍子で、拍を細かく分割しながら跳ねる躍動を持ち、テンポは概ね95から115 BPMと踊りやすい速度に</p>
<p>ペルーで生まれた、コロンビアのクンビアとアンデスの音楽、そして欧米の電気楽器を融合させた音楽である。リズムの土台はクンビア由来の二拍子で、拍を細かく分割しながら跳ねる躍動を持ち、テンポは概ね95から115 BPMと踊りやすい速度に置かれる。打楽器はティンバレス、コンガ、そして瓢箪に刻みを入れて擦るギロが担い、絶え間ない細分を刻む。この音楽を一瞬で識別させるのはエレクトリックギターの音色である。深い残響と揺れる効果を深くかけた、金属的で伸びのある単音の旋律が主役となり、その奏法は同時代のアメリカの海辺の音楽や、幻覚的なロックから借りられている。加えて、小型の電子オルガンによる細く鋭い和音が層を作る。決定的に重要なのは旋律の性質で、これはアンデス高地の伝統音楽に由来する五音音階に基づいており、短調の哀愁を帯びた音の並びが、陽気なクンビアのリズムの上で鳴る。この、踊れるのに切ないという二重性がこの音楽の核心である。歌唱は素朴で、時に力任せに歌い上げられる。歌詞は都市へ移り住んだ者の生活、労働、貧困、故郷への思い、そして恋愛を扱う。</p>
<h2>成り立ち</h2><p>背景にあるのは20世紀後半のペルーで起きた巨大な人口移動である。1950年代から、アンデス高地の農村から首都リマへ、数百万規模の人々が生活を求めて移住した。彼らは市の周縁に無許可の集落を築き、差別と貧困の中で生活基盤を作り上げていく。彼らが持ち込んだのは、高地の伝統音楽ワイノの旋律感覚だった。一方、1960年代のリマの若者は、ラジオを通じてコロンビアのクンビアと、アメリカやイギリスのロックを聴いていた。この二つが交差したのが、この音楽の誕生である。1966年にリマで結成されたLos Destellosは、中心人物Enrique Delgadoが電気ギターでクンビアを演奏するという発想を実行し、この分野の起点となった。アマゾン地域のプカルパでは、Juaneco y su Comboが、熱帯の情景と土着の信仰を主題にした独自の作風を打ち立てる。しかし1977年、彼らを乗せた小型機が墜落し、主要な構成員のほとんどが死亡するという悲劇が起きた。1980年代には、移住者の共同体の内側からLos Shapisが現れ、彼らの音楽は都市の周縁に暮らす人々の自己肯定の象徴となる。とりわけChacalónと呼ばれた歌手Lorenzo Palaciosは、貧しい家庭に生まれ、移住者たちの偶像となった。1994年に彼が死去した際には、数十万人が葬列に集まったと伝えられる。この音楽の名称は、トウモロコシを発酵させた伝統的な酒に由来するが、同時にペルー社会では、低俗で粗野なものを指す蔑称としても用いられてきた。実際、中産階級以上の層からは長く侮蔑の対象とされている。2000年代以降、欧米の収集家によって当時の音源が編集盤としてまとめられ、国際的な再評価が起こった。現在では、ペルーの都市文化を最もよく表す音楽として、国内でも正当な位置を与えられつつある。</p>
