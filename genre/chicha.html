<h1>Chicha（チチャ）とは</h1>
<p>チチャは、ペルーで生まれた音楽だ。コロンビアのクンビアとアンデスの音楽に、欧米の電気楽器を混ぜ合わせている。 この音楽だと一瞬で分かるのは、エレクトリックギターの音色である。深い残響と揺れる効果をたっぷりかけた、金属のように硬く、</p>
<p>チチャは、ペルーで生まれた音楽だ。コロンビアのクンビアとアンデスの音楽に、欧米の電気楽器を混ぜ合わせている。

この音楽だと一瞬で分かるのは、エレクトリックギターの音色である。深い残響と揺れる効果をたっぷりかけた、金属のように硬く、よく伸びる音で、一音ずつメロディーを弾く。これが主役だ。その弾き方は、同じ時代のアメリカの海辺の音楽や、幻覚的なロックから借りたものだ。さらに、Farfisa製などの電子オルガンが、細く鋭い和音を重ねる。

なによりも大切なのは、メロディーの性質だ。メロディーは、アンデス高地の伝統音楽から来た5音音階を土台にしている。短調的な哀愁を帯びた音の並びが、陽気なクンビアのリズムの上で鳴る。踊れるのに切ない。この二面性が、この音楽の中心である。

リズムの土台はクンビアから来ている。楽譜では2拍子系または4拍子で書かれる。拍を細かく分けながら、弾むような勢いを持つ。テンポは中庸から速めの、踊るのに向いた速さだ。打楽器はティンバレス、コンガ、そして瓢箪に刻みを入れてこするギロなどが受け持ち、絶え間なく細かいリズムを刻む。

歌い方は素朴で、時には力任せに歌い上げる。

歌詞は、都市へ移り住んだ人の暮らし、仕事、貧しさ、故郷への思い、そして恋愛を扱う。</p>
<h2>成り立ち</h2><p>背景にあるのは、20世紀後半のペルーで起きた大きな人口の移動である。

1940年代から、アンデス高地の農村から首都リマへ、多くの人々が暮らしを求めて移り住んだ。この動きは、とくに1950年代以降に加速した。リマの人口は、1940年の約60万人から、1970年代半ばの約370万人へと急に増えた。移り住んだ人々は市の外れに無許可の集落を作り、差別と貧しさの中で暮らしの土台を築いていく。彼らが持ち込んだのは、高地の伝統音楽ワイノのメロディーの感覚だった。

一方、1960年代のリマの若者は、ラジオでコロンビアのクンビアや、アメリカやイギリスのロックを聴いていた。この音楽は、リマ、中央高地、アマゾンという複数の地域で、1960年代に並行して形づくられた。

1966年にリマで結成されたLos Destellosでは、中心人物のEnrique Delgadoが、電気ギターでクンビアを弾くという発想を形にした。彼らは電気ギターとベースを中心にした編成で、ペルー・クンビアの発展に重要な役割を果たした。主要な先駆者の一つである。

ただし、この音楽の起源には諸説ある。名称の由来とされる曲「La Chichera」(Los Demonios del Mantaro、1965年)や、アマゾン地域のバンドも先駆けとされる。アマゾン地域のプカルパでは、Juaneco y su Comboが、熱帯の風景と土地の信仰を題材にした独自の作風を打ち立てる。しかし1977年、彼らを乗せた小型機が墜落し、メンバー5人が亡くなる悲劇が起きた(創設者のJuan Wong Paredesら4人は乗っていなかった)。

1980年代には、Los Shapisが登場する。1981年にアンデス地方のチュパカ(Chupaca)で結成され、1983年にリマへ移ったバンドだ。彼らの音楽は、都市の外れに暮らす人々が自分たちを誇るための旗印となる。とりわけ、Chacalónと呼ばれた歌手Lorenzo Palaciosは、貧しい家庭に生まれ、移り住んだ人々のアイドルになった。1994年に彼が亡くなった時には、6万人以上〜約7万人が葬列に集まったと伝えられる。

名前は、トウモロコシを発酵させた伝統的な酒「チチャ」から来ている。音楽の名前になった経緯には、酒の売り手を歌った曲「La Chichera」を通じたという説と、Los Shapisが1980年代に採用して定着させたという説がある。この名前は同時に、ペルー社会では、品がなく粗野なものを指す蔑称としても使われてきた。実際、中流より上の人々からは、長く侮蔑の対象とされてきた。

それでも2000年代以降、欧米の収集家が当時の音源を編集盤にまとめ、国際的な再評価が起きた。現在では、ペルーの都市文化を最もよく表す音楽として、国内でも正当な位置を与えられつつある。</p>
