<h1>Hardstyle（ハードスタイル）とは</h1>
<p>歪ませたキックと、そのキックの余韻を音程として使う独特の手法を核とする音楽。テンポは140〜155BPM。この系統を決定づけているのがリバース・ベースと呼ばれる仕掛けで、キックの直後に、音程を持つ低音を逆再生風の減衰で鳴らす。この</p>
<p>歪ませたキックと、そのキックの余韻を音程として使う独特の手法を核とする音楽。テンポは140〜155BPM。この系統を決定づけているのがリバース・ベースと呼ばれる仕掛けで、キックの直後に、音程を持つ低音を逆再生風の減衰で鳴らす。この結果、キックとその余韻が一組になって「ドッ・ウーン」という二段構えの打撃を作り、これが延々と反復されることで独特の跳ねる推進力が生まれる。近年はキック自体が音程を持つよう合成され、キックと低音が一体化した設計も多い。上物はトランス由来の壮大な旋律で、スーパーソウのリードやピアノ、弦楽器風のパッドが用いられる。和声は自然短音階の循環が中心で、感傷的な情緒を作る。曲の構成は明確に定型化されており、導入、第一のドロップ、ブレイクダウン、第二のドロップという順序をとる。ブレイクダウンでは打楽器が止まり、歌や旋律が感情を蓄積してから、キックが戻る。ヴォーカルは男性の力強い歌唱、女性の伸びやかな歌唱、そしてMCの煽りが使い分けられる。歌詞は団結、誇り、逆境の克服といった主題が多く、共同体への帰属意識を強く喚起する。ハードコアと比べてテンポが遅く、キックの歪みも抑制されており、旋律と感情表現の比重が大きい。大型野外音楽祭での集団的な体験を前提として設計されている点が、この音楽の本質的な条件になっている。</p>
<h2>成り立ち</h2><p>2000年前後のオランダで、ガバとハードトランスの交差点から生まれた。当時のオランダでは、ガバが極右の暴力集団と結びつけて報道されたことで社会的な評判を落とし、シーンが縮小していた。一方でハードトランスやハウスの側にも、より攻撃的な音を求める層が存在した。この隙間に生まれたのがハードスタイルである。初期の重要な作家としてはThe Prophet(Dov Elkabas)、DJ Zany、Lady Dana、Luna、Pavo、Dana、Showtekが挙がる。とりわけThe Prophetは1990年代からガバのDJとして活動しており、2000年前後にテンポを落として旋律を導入する方向へ舵を切った。レーベルではScantraxx(The Prophetが2002年に設立)、Fusion Records、Dutch Master Worksが中心となった。技術的な起点は、キックの余韻に音程を持たせるリバース・ベースの発明にある。これは元来、ガバのキックの処理から偶然生まれた手法とされ、2000年前後に定型として確立した。この一つの技法がジャンル全体を規定した点で、極めて珍しい成立過程を持つ。産業面での決定的な役割を果たしたのがオランダのイベント運営会社Q-danceで、2003年にDefqonという野外音楽祭を開始し、後にQlimax(屋内、2000年開始)、Qapital、Defqon.1へ発展させた。これらは数万人規模の動員を持ち、精緻な照明と炎の演出を伴う集団的儀式のような形式を確立した。参加者は特定の服装と身振り(ジャンプするような独特の踊り)を共有し、強い帰属意識を持つ共同体を形成した。2000年代半ばから2010年代にかけて、この音楽はオランダを越えてイタリア、ドイツ、オーストラリア、日本へ広がった。とりわけオーストラリアでは大きな支持を得ている。2010年前後には、より遅く重いユーフォリック・ハードスタイルと、より攻撃的なローシュタイルへの分岐が起きた。後者は歪みの強い生のキックを用い、原点回帰を掲げた。批判としては、旋律の定型化、歌詞の内容の空虚さ、そして共同体の閉鎖性が挙げられる。また薬物の問題は深刻で、オランダの大型イベントでは検査サービスが提供され、それでも死亡事故が報告されている。近年はハードスタイルのキック合成技術が他ジャンルへ広く輸出され、ポップスやヒップホップの制作にも影響を及ぼしている。</p>
