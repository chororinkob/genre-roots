<h1>Hardstyle（ハードスタイル）とは</h1>
<p>歪ませたキックと、そのキックの余韻を音程として使う独特の手法を核とする音楽。テンポは初期の140BPMから、年とともに上昇し、150〜160BPMに達した。この系統を決定づけているのがリバース・ベースと呼ばれる仕掛けで、キックとキ</p>
<p>歪ませたキックと、そのキックの余韻を音程として使う独特の手法を核とする音楽。テンポは初期の140BPMから、年とともに上昇し、150〜160BPMに達した。この系統を決定づけているのがリバース・ベースと呼ばれる仕掛けで、キックとキックの間の裏拍に、音程を持つ低音を置く。この結果、キックと低音が交互に鳴って「ドッ・ウーン」という二段構えの打撃を作り、これが延々と反復されることで独特の跳ねる推進力が生まれる。2000年代半ば以降、キックの音程を低音に合わせる手法が広まり、キックと低音が一体化した曲も多い。上物（メロディーなど上に重ねる音）はトランス由来の壮大な旋律で、スーパーソウ（複数の音を重ねた厚い音）のリード（主旋律の音）やピアノ、弦楽器風のパッド（持続する背景の音）が用いられる。和声は短調の切ない旋律が多いが、ユーフォリック系（明るく盛り上がる方向）では長調もよく使われる。曲の構成は、導入、ビルドアップ（盛り上げ部分）、ドロップ（山場で低音が一気に出る部分）、ブレイクダウン、ビルドアップ、ドロップという流れが多くの曲で見られる。ブレイクダウンでは打楽器が止まり、歌や旋律が感情を蓄積してから、キックが戻る。ヴォーカルは男性の力強い歌唱、女性の伸びやかな歌唱、そしてMC（場を盛り上げる司会）の煽りが使い分けられる。歌詞は団結、誇り、逆境の克服といった主題が多く、共同体への帰属意識を強く喚起する。テンポはハードコアより遅い。ユーフォリック系は旋律を大事にするが、ローシュタイル（より攻撃的な一派）は歪みが強く、旋律は控えめである。屋内の大きなイベントでも野外の音楽祭でも、大勢が一緒に盛り上がる場が作られてきた。</p>
<h2>成り立ち</h2><p>1990年代後半に、オランダ・ベルギー・イタリアに起源があるとされ、正確な起源は特定できず、起点を2000年前後とする見方もある。特徴の多くはハードトランス（リバース・ベースなど）に由来する。ガバには一部に右翼的な少数派の支持があり、レーベルや作家が否定声明を出したが、1990年代半ばにはオランダの主流文化になっていた。一方でハードトランスやハウスの側にも、より攻撃的な音を求める層が存在した。この隙間に生まれたのがハードスタイルである。初期から活動した作家としてはThe Prophet(Dov Elkabas)、DJ Zany、Lady Dana(Danaとも)、Luna、Pavo、Showtekが挙がる。とりわけThe Prophetは1983年からDJとして活動しており、のちにハードコアからハードスタイルへ移った。旋律をはっきり出す方向への変化は、2000年代半ば（2005年ごろ）の動きとされる。レーベルでは、2000年代前半はScantraxx(The Prophetが2002年に設立)とFusion Records、2005年以降はDutch Master Worksも加わって中心となった。技術的な特徴は、キックの間の裏拍に音程を持つ低音を置くリバース・ベースにある。これはハードトランスに由来する手法とされ（Scot Projectなどが例に挙がる）、ハードスタイルで定型として確立した。産業面での決定的な役割を果たしたのがオランダのイベント運営会社Q-danceで、屋内イベントのQlimaxを2000年に（当初はトランス／テクノ中心）、野外音楽祭のDefqon.1を2003年に始め、2013年にはアムステルダムのZiggo Domeで屋内イベントのQapitalも始めた。集まる人数は、Qlimaxが3万人近く、Defqon.1が1日6万人超、Qapitalが約1.7万人と、イベントごとに違う。どれも精緻な照明と炎の演出を伴う集団的儀式のような形式を確立した。参加者は特定の服装と身振り(ジャンプするような独特の踊り)を共有し、強い帰属意識を持つ共同体を形成した。この音楽はオランダの外にも広がった。オーストラリアでは2009年からDefqon.1が開かれ、2018年まで続いた。2019年以降は、会場が支援をやめたため開かれていない。2000年代後半から2010年前後にかけて、感情的な旋律と強いピッチ（音の高さ）変調のキックを特徴とするユーフォリック・ハードスタイルが広がり、その反動として、より攻撃的なローシュタイルが成立した。後者は歪みの強い生のキックを用い、原点回帰を掲げた。また薬物の問題は深刻で、Defqon.1は薬物を全面禁止する方針（zero-tolerance）をとる。死亡事例としては、2018年にシドニー（豪州）のDefqon.1で2名が亡くなった。2019年7月の検視審問（死因を調べる公的な審問）で、主催者Q-danceの責任者Simon Coffey氏が、薬物を調べる検査施設の導入を望むと述べた。シドニー版では2013年と2015年にも死者が出ている。オランダ版でも2024年に26歳男性が亡くなったと報じられ、警察は「不自然な死」としたが、薬物との因果は未確認である。</p>
