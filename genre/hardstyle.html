<h1>Hardstyle（ハードスタイル）とは</h1>
<p>ハードスタイルは、歪ませたキックと、そのキックの余韻を音程として使う独特の手法を核とする音楽だ。 テンポは初期の140BPMから年とともに上昇し、150〜160BPMに達した。ハードコアと比べるとテンポは遅い。2000年代半ば以降</p>
<p>ハードスタイルは、歪ませたキックと、そのキックの余韻を音程として使う独特の手法を核とする音楽だ。

テンポは初期の140BPMから年とともに上昇し、150〜160BPMに達した。ハードコアと比べるとテンポは遅い。2000年代半ば以降、キックの音程を低音に合わせる手法が広まった。

この系統を決定づけているのが、リバース・ベースと呼ばれる仕掛けだ。キックとキックの間の裏拍に、音程を持つ低音を置く。すると、キックと低音が交互に鳴って「ドッ・ウーン」という二段構えの打撃になる。これが延々と反復されることで、独特の跳ねる推進力が生まれる。

上物（メロディーなど上に重ねる音）は、トランス由来の壮大な旋律だ。スーパーソウ（複数の音を重ねた厚い音）のリード（主旋律の音）やピアノ、弦楽器風のパッド（持続する背景の音）が用いられることが多い。和声は、短調の感傷的な旋律が多い一方、ユーフォリックでは長調も多用される。ユーフォリック系は旋律重視だが、ローは歪みが強く旋律が控えめである。

ヴォーカルは、男性の力強い歌唱、女性の伸びやかな歌唱、そしてMC（場を盛り上げる司会）の煽りが使い分けられることが多い。歌詞は団結、誇り、逆境の克服といった主題が多く、共同体への帰属意識を強く喚起する。

曲の構成は、導入→ビルドアップ→ドロップ（山場で低音が一気に出る部分）→ブレイクダウン→ビルドアップ→ドロップ、という流れが一般的で、多くの曲で見られる。ブレイクダウンでは打楽器が止まり、歌や旋律が感情を蓄積してから、キックが戻る。屋内の大型イベントと野外音楽祭の両方で、集団的な体験の場が作られた。</p>
<h2>成り立ち</h2><p>1990年代後半、オランダ・ベルギー・イタリアで生まれたとされる。ただし、起点を2000年前後とする見方もある。正確な起源は特定できない。

土台の一つはハードトランスで、特徴の多くはここに由来する。リバース・ベースもその一つだ。一方、ガバには一部に右翼的な少数派の支持があり、レーベルや作家が否定声明を出したが、1990年代半ばにはオランダの主流文化になっていた。そして、ハードトランスやハウスの側にも、より攻撃的な音を求める層が存在した。この隙間に生まれたのがハードスタイルだと言われる。

初期から活動した作家としては、The Prophet(Dov Elkabas)、DJ Zany、Lady Dana(Danaとも)、Luna、Pavo、Showtekが挙がる。とりわけThe Prophetは1983年からDJとして活動しており、ハードコアから移行した。旋律的な方向への転換は2000年代半ば(2005年頃)の動きである。レーベルでは、Scantraxx(The Prophetが2002年に設立)とFusion Recordsが2000年代前半の中心となり、2005年以降はDutch Master Worksも加わった。

技術的な特徴は、キックの間の裏拍に音程を持つ低音を置くリバース・ベースにある。これはハードトランスに由来する手法とされ（Scot Projectなどが例に挙がる）、ハードスタイルで定型として定着した。

産業面で決定的な役割を果たしたのが、オランダのイベント運営会社Q-danceだ。屋内イベントのQlimaxを2000年にアイントホーフェンのBeursgebouwで始めた（当初はトランス／テクノ中心。Q-danceのハードスタイル紹介ページは「2001年2月3日にアムステルダムで初回」と書いている）。野外音楽祭のDefqon.1は2003年に始め、2013年にはアムステルダムのZiggo Domeで、屋内イベントのQapitalも始めた。Qlimaxは約3万人弱、Defqon.1は1日6万人超、Qapitalは約1.7万人規模の動員を持つ。精緻な照明と炎の演出を伴う、集団的儀式のような形式が固まった。参加者は特定の服装と身振り(ジャンプするような独特の踊り)を共有することが多く、強い帰属意識を持つ共同体を形成した。

2009年からはオーストラリアでもDefqon.1が開かれ、2018年まで続いた（2019年以降は会場が支援を撤回して中止）。

2010年前後には、感情的な旋律と強いピッチ（音の高さ）変調のキックを特徴とするユーフォリック・ハードスタイルが広がった。その反動として、2000年代後半〜2010年前後に、より攻撃的なRawstyle（ロウスタイル）が成立した。後者は歪みの強い生のキックを用い、原点に戻ることを掲げた。

一方で、薬物の問題は深刻だ。Defqon.1は薬物を全面禁止する方針（zero-tolerance）をとる。死亡した例としては、2018年シドニー（豪州）のDefqon.1で2名が死亡した。2019年7月の検視審問では、Q-danceの責任者が、場外での薬物検査の仕組みを導入してほしいと証言した。オランダ版でも2024年に26歳男性が死亡したと報じられた。警察は不自然な死とし、原因の追加説明は拒んだという。薬物との因果は未確認である。</p>
