<h1>Terrorcore（テロコア）とは</h1>
<p>ハードコア・テクノの中でも、恐怖と不快感を与えることを明確な目的に据えた様式。テンポは毎分200から250拍程度、時に300拍を超え、キックは歪みきって元の打撃音の形をとどめない。他の高速ハードコアと決定的に違うのは、音色と素材の</p>
<p>ハードコア・テクノの中でも、恐怖と不快感を与えることを明確な目的に据えた様式。テンポは毎分200から250拍程度、時に300拍を超え、キックは歪みきって元の打撃音の形をとどめない。他の高速ハードコアと決定的に違うのは、音色と素材の選び方である。ホラー映画の悲鳴や台詞、実際の事件の音声、機械の軋み、金属の擦過音、耳をつんざく高周波が積極的に用いられ、聴き手を心地よくさせる要素が意図的に排除される。旋律はほぼ存在せず、あっても不協和な音程で不安を煽るためだけに置かれる。音量の処理も過激で、全体を潰して耳に刺さる状態が保たれる。曲の構成は緊張と解放という通常の設計を取らず、緊張のまま最後まで押し切るものが多い。声は絶叫、笑い声、加工された低い呟きで、悪魔的あるいは猟奇的な文言が用いられる。ジャケットや映像も血や解剖図、廃墟といった意匠で統一される。演奏の場は地下のクラブや、通常の催しの深夜の時間帯で、観客層は限られる。快楽ではなく耐久を試す音楽であり、その極端さ自体が価値とされる点で、他の様式とは前提から異なる。</p>
<h2>成り立ち</h2><p>起点は1990年代半ばのオランダとドイツにある。1990年代前半、ロッテルダムのガバが確立した後、その速度と過激さをさらに押し進める一派が現れた。オランダではDJ Freakや、ベルリンから活動したMoveable Force、そしてドイツのLenny Deeが運営したIndustrial Strength Recordsが、この方向の拠点になった。Lenny Deeはニューヨーク出身で、1991年にこのレーベルをニューヨークで設立し、ヨーロッパの過激なハードコアを世界に流通させた人物である。1990年代半ば、Fifth Era、Delta 9、Disciples of Annihilation、そしてイギリスのDJ Producerらが、恐怖を主題にした作品を発表した。名称としてのテラーコアが定着したのはこの頃で、恐怖を意味する語をハードコアに冠したものである。並行して、より速度に特化したスピードコアや、極端な音を追うノイズコアが分岐し、これらの境界は当事者の間でも曖昧なまま扱われてきた。2000年代には、この方向がフランスのフリーパーティーの文化や、日本のノイズ音楽とも交差した。日本ではDJ Technoranchやm1dyといった作り手が独自の展開を見せ、m1dyは秋葉原の意匠と極端な速度を結びつけたスピードコアで海外にも知られた。この音楽は本質的に商業的な成功と相容れず、聴衆は常に少数だった。作り手の多くが他の職業を持ち、レコードは少部数で作られ、催しは小規模で行われてきた。2010年代以降はインターネットを通じて世界中の少数の愛好家が結びつき、その存在は途切れることなく続いている。</p>
<h2>代表曲</h2><ul><li>Fuckin Hostile（DJ Skinhead）</li><li>Industrial Strength（Disciples of Annihilation）</li><li>Killing Scum（Noize Suppressor）</li></ul>
