<h1>Terrorcore（テロコア）とは</h1>
<p>テラーコアは、ガバの延長にある、高速で攻撃的なハードコア・テクノのスタイルだ。ホラー系サンプルなどの、恐怖を感じさせる要素を持つ曲が多い。 ホラー映画の悲鳴や台詞が使われる。機械の軋み、金属の擦れる音、耳をつんざく高い周波数の音も</p>
<p>テラーコアは、ガバの延長にある、高速で攻撃的なハードコア・テクノのスタイルだ。ホラー系サンプルなどの、恐怖を感じさせる要素を持つ曲が多い。

ホラー映画の悲鳴や台詞が使われる。機械の軋み、金属の擦れる音、耳をつんざく高い周波数の音も、積極的に使われるとされる。聴き手を心地よくさせる要素は、わざと取り除かれるとされる。音量の処理も過激で、全体を限界まで圧縮し、耳に刺さる状態が保たれるとされる。

旋律は少なく、あっても暗く目立たない。不協和な（耳障りに濁った）音程で、不安を煽るためだけに置かれる。

テンポは、約200〜300 BPMとされるが、その幅には諸説ある。キックは、強く歪ませたガバ系のキックである。

ボーカルは少なく、あっても叫び声や短いサンプルが中心だ。

曲の構成は、短いブレイクダウンと唐突な爆発的ドロップを持つ、フロア向けのものが多いとされる。</p>
<h2>成り立ち</h2><p>テラーコアの起点には、諸説がある。オランダで、ロッテルダムのガバから1990年代前半〜半ばに生まれたとする説もあれば、初期のスピードコアのシーンから生まれたとする説もある。「ロッテルダム（1995年頃）説」と「スピードコア・シーン説」だ。1994年にフランクフルトで、Marc AcardipaneのPlanet Core Productions系のレーベルKotzakが興ったことを起点とする説もある。ハードコアテクノ自体が、ロッテルダム、ニューヨーク、ニューキャッスルで同時発生的に現れたとする説もある。

イギリスでは、DJ Freak（本名John Bennett。インダストリアル・ハードコアやスピードコアの初期の先駆者）が、スピードコア/インダストリアル・ハードコアの先駆けとされる。

一方アメリカでは、Lenny Deeが運営したIndustrial Strength Recordsが、この方向の拠点になった。Lenny Deeはニューヨーク出身だ。1991年にこのレーベルをニューヨークで設立し、アメリカのハードコアシーンの中心となった。同時に、ヨーロッパ（Acardipaneら）やオーストラリアの作品もリリースした。

1990年代半ばには、Delta 9、Disciples of Annihilationらが、スピードコア/インダストリアル・ハードコア系の作品を発表した。イギリスのThe DJ Producerは、ハードコアテクノの制作者である。

テラーコアという名前が定着した時期は、はっきりしない。恐怖を意味する語を、ハードコアに冠した名前である。

スピードコアは、同じ時代の隣にある分野だ。1990年代前半〜半ばに成り立ち、用語は1995年にさかのぼる。ノイズコアは別の系統で、1980年代半ばのハードコア・パンク系である。テクノ側でこの語を使う例は、ごく一部だ。これらの境界は、当事者の間でも曖昧なまま扱われてきた。

1990年代半ばから、フランスのフリーパーティー/フリーテクノの文化と結びついたのは、フレンチコア（frenchcore）だ。テラーコアとは別のスタイルとして語られるが、境界は流動的である。

日本では、DJ TECHNORCH（本名 山下泰、1984年3月3日生）やm1dyといった作り手が、J-COREやスピードコアの方面で活動した。m1dyは「Tokyo Style Speedcore」で、海外にも知られた。

2010年代半ば（2015年前後）には、ヨーロッパを中心に、フレンチコア、アップテンポ・ハードコアとともにテラーコアの人気が高まった。2010年代以降は、インターネットを通じて、世界中の愛好家が結びついている。</p>
