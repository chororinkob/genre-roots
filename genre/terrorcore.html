<h1>Terrorcore（テロコア）とは</h1>
<p>ハードコア・テクノの中でも、恐怖と不快感を与えることを明確な目的に据えた様式。テンポは、おおむね200拍前後〜300拍程度の幅を持ち、キックは歪みきって元の打撃音の形をとどめない。他の高速ハードコアと決定的に違うのは、音色と素材の</p>
<p>ハードコア・テクノの中でも、恐怖と不快感を与えることを明確な目的に据えた様式。テンポは、おおむね200拍前後〜300拍程度の幅を持ち、キックは歪みきって元の打撃音の形をとどめない。他の高速ハードコアと決定的に違うのは、音色と素材の選び方である。ホラー映画の悲鳴や台詞、機械の軋み、金属の擦過音、耳をつんざく高周波が積極的に用いられ、聴き手を心地よくさせる要素が意図的に排除される。旋律はほぼ存在せず、あっても不協和な（耳障りに濁った）音程で不安を煽るためだけに置かれる。音量の処理も過激で、全体を限界まで圧縮して耳に刺さる状態が保たれる。曲の構成は緊張と解放という通常の設計を取らず、緊張のまま最後まで押し切るものが多い。声は絶叫、笑い声、加工された低い呟きで、悪魔的あるいは猟奇的な文言が用いられる。快楽ではなく耐久を試す音楽であり、その極端さ自体が価値とされる点で、他の様式とは前提から異なる。</p>
<h2>成り立ち</h2><p>起点には諸説があり、オランダ（ロッテルダムのガバから）で1990年代前半〜半ばに生まれたとする資料や、初期のスピードコアのシーンから生まれたとする資料がある。「ロッテルダム（1995年頃）説」と「スピードコア・シーン説」があり、ハードコアテクノ自体がロッテルダム、ニューヨーク、ニューキャッスルで同時発生的に出現したとする説もある。イギリスのDJ Freak（本名John Bennett。インダストリアル・ハードコアやスピードコアの初期の先駆者）は、スピードコア/インダストリアル・ハードコアの先駆とされる。アメリカのLenny Deeが運営したIndustrial Strength Recordsも、この方向の拠点になった。Lenny Deeはニューヨーク出身で、1991年にこのレーベルをニューヨークで設立し、ヨーロッパの過激なハードコアを世界に流通させた人物である。1990年代半ば、Delta 9、Disciples of Annihilation、そしてイギリスのThe DJ Producerらが、スピードコア/インダストリアル系の作品を発表した。名称としてのテラーコアが定着したのはこの頃で、恐怖を意味する語をハードコアに冠したものである。スピードコアは同時代の隣接領域（1990年代前半〜半ばに成立し、用語は1995年に遡る）で、ノイズコアは別系統（1980年代半ばのハードコア・パンク系）で、テクノ側の用法はごく一部である。これらの境界は当事者の間でも曖昧なまま扱われてきた。2000年代のフランスのフリーパーティーの文化と結びついたのはフレンチコア（frenchcore）であり、テラーコアとは区別される。日本ではDJ TECHNORCH（本名 山下泰、1984年3月3日生、東京）やm1dyといった作り手が独自の展開を見せ、m1dyは「東京のスピードコア（Tokyo Style Speedcore）」で海外にも知られた。比較的小規模なシーンだが、2010年代半ば（2015年前後）に注目が高まった。作り手の多くが他の職業を持ち、レコードは少部数で作られ、催しは小規模で行われてきた。2010年代以降はインターネットを通じて世界中の少数の愛好家が結びついている。</p>
