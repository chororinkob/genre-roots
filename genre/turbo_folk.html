<h1>Turbo Folk（ターボフォーク）とは</h1>
<p>1980年代末以降の旧ユーゴスラビア圏、とくにセルビアで発達した、民謡的な歌い回しと電子的なダンスビートを合体させたポピュラー音楽。旋律の骨格はバルカン半島とオスマン帝国由来の音階、とりわけ増二度を含むヒジャーズ系の旋法にあり、歌</p>
<p>1980年代末以降の旧ユーゴスラビア圏、とくにセルビアで発達した、民謡的な歌い回しと電子的なダンスビートを合体させたポピュラー音楽。旋律の骨格はバルカン半島とオスマン帝国由来の音階、とりわけ増二度を含むヒジャーズ系の旋法にあり、歌手は語尾を細かく揺らすメリスマと、鼻にかかった強い発声で歌う。伴奏にはかつてアコーディオンやフルラ(縦笛)、タンブリツァ(撥弦楽器)が使われたが、ターボフォークではそれらをシンセサイザーが模倣し、ドラムマシンが四つ打ちや高速の2拍子を刻む。テンポは110〜140BPM程度が中心で、途中で加速するコロ(輪舞)風の器楽間奏が挿入されることが多い。近年はハウス、レゲトン、トラップのビートを取り込み、ラップのパートを持つ曲も一般的になっている。歌詞は不倫、嫉妬、金、酒、復讐、都会での孤独といった通俗的で直截な主題を扱い、しばしば露骨な性的表現を含む。ミュージックビデオは高級車、ナイトクラブ、豪邸、露出の多い衣装といった記号で構成される。実際に鳴っている場所はカファナと呼ばれる酒場、屋外の巨大なクラブ、そして結婚式であり、隣国のチャルガ(ブルガリア)、マネレ(ルーマニア)、タリャヴァ(アルバニア)とは兄弟関係にある。</p>
<h2>成り立ち</h2><p>1980年代後半から1990年代にかけての、当時のユーゴスラビア(現在のセルビアを中心とする地域)で発展した。Lepa Brenaは、伝統的なフォーク歌謡にディスコ的なアレンジを施し、この様式の先駆者として広く知られる存在となった。Ceca(本名Svetlana Ražnatović)は、1990年代を代表するスーパースターとなり、後にセルビアの著名な犯罪組織のボスと結婚したことでも大きな話題を呼んだ。ユーゴスラビア紛争(1990年代)の時代には、ターボフォークが民族主義的な感情や戦時下の享楽主義と結びつけられ、政治的に強く物議を醸すジャンルとなった。「ターボフォーク」という名称自体、当時の風刺的なバンド、Rambo Amadeusが揶揄的に用いた呼び名が定着したものとされる。2000年代以降はそうした政治色が徐々に薄まり、セルビアだけでなくバルカン半島全域で楽しまれるパーティーミュージックとして定着している。Jelena Karleušaも、この潮流を代表する歌手の一人である。ターボフォークは、1970〜80年代にすでに存在していた「新作フォーク音楽(ノヴォコンポノヴァナ・ムジカ)」という、伝統フォークを現代的にアレンジする潮流を直接の下敷きとしている。セルビアのレーベルGrand Productionは、こうしたターボフォーク系アーティストの主要な発信拠点として機能し、歌手Dragana Mirkovićなど数多くのスターを輩出した。知識層からは政治指導者スロボダン・ミロシェヴィッチ政権時代の退廃・享楽主義を象徴する存在として批判的に語られることも多く、単なる音楽ジャンル以上の社会的・政治的な含みを持つ言葉として現在も議論の対象になり続けている。</p>
<h2>代表曲</h2><ul><li>Jugoslovenka (Lepa Brena)</li><li>Kukavica (Ceca)</li><li>Ide maca oko tebe (Jelena Karleuša)</li></ul>
