<h1>Turbo Folk（ターボフォーク）とは</h1>
<p>ターボフォークは、1980年代末以降の旧ユーゴスラビア圏、とくにセルビアで発達したポピュラー音楽だ。民謡的な歌い回しと、電子的なダンスビートを合わせたものである。 伴奏の中心はシンセサイザーで、アコーディオンや金管楽器も加わる。旋</p>
<p>ターボフォークは、1980年代末以降の旧ユーゴスラビア圏、とくにセルビアで発達したポピュラー音楽だ。民謡的な歌い回しと、電子的なダンスビートを合わせたものである。

伴奏の中心はシンセサイザーで、アコーディオンや金管楽器も加わる。旋律の骨格は、バルカン半島とオスマン・マカーム系の旋法（ヒジャーズ系を含む）にある。コロ(輪舞)由来の旋律を引用する曲もある。

リズムは、ドラムマシンが刻む4/4拍子の四つ打ち（全部の拍にバスドラムを打つリズム）のダンスビートが中心だ。近年は、EDM、トラップ、ヒップホップの要素を取り込む傾向がある。

歌手は、語尾を細かく揺らすメリスマ（一つの音節を音程を変えながら長く歌う技法）と、装飾的で震わせるような歌唱で歌う。

歌詞は、愛、嫉妬、夜遊び、失恋、富や地位といった、通俗的でストレートな主題を扱う。批評家からは、性的で物質主義的な図像だと評される。

実際に鳴っている場所は、カファナと呼ばれる酒場、クラブ、祝祭の場などだ。ブルガリアのチャルガ、ルーマニアのマネレ、コソボ・北マケドニア発祥のタリャヴァなど、バルカンの他のポップフォークと並行して発展した関連ジャンルでもある。</p>
<h2>成り立ち</h2><p>1980年代末から1990年代初頭に成立し、1990年代に盛んになった。舞台は、当時のユーゴスラビア(現在のセルビアを中心とする地域)である。

ターボフォークの前には、新作フォークがあった。1960年代半ばに成立して1980年代に市場を支配した、商業的フォーク歌謡「新作フォーク音楽(ノヴォコンポノヴァナ・ムジカ)」である。ターボフォークは、その発展形だ。

起源については、いくつかの説がある。新作フォーク(1960年代半ば〜)の発展形とする説がある。Lepa Brenaの1982年のアルバム『Čačak, Čačak』『Mile voli disko』を起点とする見方もある。Lepa Brenaは、伝統的なフォーク歌謡にディスコ的なアレンジを施し、このスタイルの先駆者とする見方がある。一方、Rambo Amadeusは、ターボフォークの音の起源は1984年のHolger Czukayのアルバム『Der Osten ist Rot』にあると述べている。

名称にも経緯がある。モンテネグロ出身のソロ音楽家Rambo Amadeusが、自分の風刺的な音楽を冗談で「ターボフォーク」と呼んだ(1988年の記事に用例がある)。のちにこの語が、別の実際のジャンルを指すようになった。

スターも生まれた。Ceca(出生名Svetlana Veličković)は、1988年に録音デビューした。1993年のアルバム『Šta je to u tvojim venama』は30万枚超を売り上げ、初の単独公演には約1万人が集まった。こうして1990年代を代表するスーパースターとなった。1995年2月19日には、犯罪組織の首領で準軍事組織の指導者でもあったArkanと結婚し、その結婚式は大きく報じられた。

ユーゴスラビア紛争(1990年代)の時代には、ターボフォークが民族主義的な感情や戦時下の享楽主義と結びつけられた。政治的に強く物議を醸すジャンルとなった。セルビアのレーベルGrand Productionは1998年に設立された大手で、ターボフォーク系を含む多数のフォーク系歌手を擁し、歌手Dragana Mirkovićも一時所属した。

しかし、2000年代以降はそうした政治色が徐々に薄まった。セルビアだけでなくバルカン半島全域で楽しまれるパーティーミュージックとして定着している。Jelena Karleušaも、この流れを代表する歌手の一人である。

一方、知識層からは、政治指導者スロボダン・ミロシェヴィッチ政権時代の退廃・享楽主義の代名詞のような存在として、批判的に語られることも多い。単なる音楽ジャンル以上の社会的・政治的な含みを持つ言葉として、現在も議論の対象になり続けている。</p>
