<h1>Intelligent Techno（インテリジェントテクノ）とは</h1>
<p>インテリジェント・テクノは、踊るためではなく、座って聴くために作られたテクノの系統だ。四つ打ちや反復といった語彙をテクノから受け継ぎながら、和音、音色、曲の組み立ての複雑さを前面に出す。家で聴くことを目的として宣伝された。ただし、</p>
<p>インテリジェント・テクノは、踊るためではなく、座って聴くために作られたテクノの系統だ。四つ打ちや反復といった語彙をテクノから受け継ぎながら、和音、音色、曲の組み立ての複雑さを前面に出す。家で聴くことを目的として宣伝された。ただし、フロアとの境界ははっきりしていない。

テンポの幅は広く、一曲の中で拍子や速さが変わることもある。リズムはドラムマシンの音を使いつつ、打つタイミングを細かくずらし、複雑なポリリズムや変拍子を組み込む作品がある。

和音は、テクノの単純なくり返しから離れる。ジャズやクラシックに近い複雑な和音、転調、複数の旋律が絡み合う書き方(対位法)が使われる作品がある。

音色づくりに最も力が注がれることが多い。アナログシンセの粗い倍音、加工したフィールド録音、逆再生、グラニュラー合成で音を細かい粒にする手法などが組み合わされることが多い。

メロディーははっきりと存在する。しばしば哀愁を帯びた美しいメロディーが、歪んだリズムの上に置かれる。この美と暴力の同居が、ジャンルの感情の中心とされることが多い。

ヴォーカルはまれで、あっても加工された断片であることが多い。

曲の組み立てはDJ向けの型を持たないことが多く、序奏から展開して終わりまで、楽曲として完結している。アルバム単位で聴かれることが前提で、Warpはアルバムを軸にした活動を目指した。

この名前は後になって、傲慢な響きがあるとして当事者から嫌われた。なお、この系統はart techno、intelligent techno、electronicaなどさまざまな名で呼ばれたのち、IDMという名を得た。</p>
<h2>成り立ち</h2><p>1990年代前半のイギリスで、このテクノは生まれた。

呼び名には1991年に先に使われた例があり、1992年にWarp Recordsが出した編集盤「Artificial Intelligence」が、その言葉を広める大きなきっかけとなった。ジャケットには electronic listening music という文句が書かれていた。その文句のとおり、この編集盤は、踊るためではなく家で椅子に座って聴くための電子音楽という、はっきりした提案だった。

ジャケットには、肘掛け椅子に座ってくつろぐアンドロイドが描かれ、その傍らにはKraftwerk『Autobahn』とPink Floyd『The Dark Side of the Moon』のレコードが置かれていた。この絵が、踊る音楽から聴く音楽への転換を、目に見える形で宣言した。

Warp Recordsは、Steve Beckett、Rob Mitchell、Robert Gordonが1989年にシェフィールドで設立したレーベルだ。当初は、ブリープ・テクノと呼ばれる地元の音を扱っていた。「Artificial Intelligence」には、The Dice Man(Aphex TwinのRichard D. James)、Autechre、B12(Musicology名義)、Speedy Jらが参加した。その後Warpは、Aphex Twinの1994年「Selected Ambient Works Volume II」、Autechreの1994年「Amber」、Boards of Canadaの1998年「Music Has the Right to Children」といった作品を出し、この分野の中心となった。

同じころ、ほかのレーベルも独自の方向を切り開いた。コーンウォールで設立され、翌年にロンドンへ移ったRephlex(Richard D. JamesとGrant Wilson-Claridgeが1991年に設立)や、ロンドンのNinja Tuneである。ヨーロッパ大陸では、ドイツのMille Plateaux(Achim Szepanskiが1994年に設立し、哲学者Gilles DeleuzeとFélix Guattariの著作から名を取った)が、より理論的な立場から実験的な電子音楽を世に出した。

一方、intelligent technoという呼び名は、1991年11月にインターネット上のUsenetで、Coilの「The Snow」EPについて使われた。1992年後半には、英米の音楽誌にも現れた。1993年8月にメーリングリストIDM listが作られ、intelligent dance musicという言葉が広く使われるようになった。

しかし、この言葉は広く批判されてきた。ほかのテクノは知的でない、という意味を含んでしまうからだ。Aphex TwinやAutechreのSean Boothなど、多くの当事者がこの呼び名を拒んだり、軽く扱ったりしている。Richard D. Jamesは1997年9月のインタビューで、そういう用語があること自体が笑える、「知的」と言えばほかは愚かということになる、他人の音楽に対して意地悪だ、と述べた。そして、自分はジャンル名を使わないと語った。

それでも名前は定着してしまった。IDMという略称は、批判は根強いものの、慣用的な分類名として今も使われている。

1990年代半ば以降はドリルンベースなどへ枝分かれし、1990年代後半から2000年前後にかけてはグリッチが注目を集めた。2000年代には、WarpがFlying Lotusらと契約した。

なお、聴くための電子音楽という考え方には、先例もあった。1980年代後半〜1990年頃のThe OrbやKLFのアンビエント・ハウスと、デトロイト・テクノである。</p>
