<h1>Intelligent Techno（インテリジェントテクノ）とは</h1>
<p>踊るためではなく座って聴くために設計されたテクノの系統。四つ打ちや反復の語彙をテクノから受け継ぎながら、ダンスフロアの機能性を意図的に外し、和声、音色、構成の複雑さを前面に出す。テンポは幅広く、80BPM程度の遅いものから150B</p>
<p>踊るためではなく座って聴くために設計されたテクノの系統。四つ打ちや反復の語彙をテクノから受け継ぎながら、ダンスフロアの機能性を意図的に外し、和声、音色、構成の複雑さを前面に出す。テンポは幅広く、80BPM程度の遅いものから150BPMを超えるものまであり、一曲の中で拍子や速度が変化することもある。リズムはドラムマシンの素材を用いつつ、打点を微細にずらし、複雑なポリリズムや変拍子を組み込む。和声はテクノの単純な循環を離れ、ジャズやクラシックに近い複雑な和音、転調、対位法的な声部の絡み合いが用いられる。音色設計に最も労力が注がれ、アナログシンセの粗い倍音、加工したフィールド録音、逆再生、グラニュラー合成による粒子化といった手法が組み合わされる。旋律は明確に存在し、しばしば哀愁を帯びた美しいものが、歪んだリズムの上に置かれる。この美と暴力の同居がジャンルの情緒的な核になっている。曲の構成はDJ用の型を持たず、序奏から展開して終結するという楽曲としての完結性を持つ。ヴォーカルは稀で、あっても加工された断片。アルバム単位で聴かれることを前提としており、実際に流通の主体もシングル盤ではなくアルバムだった。この名称は後年、傲慢な響きを持つとして当事者から嫌われ、IDMやエレクトロニカという呼称に置き換えられていった。</p>
<h2>成り立ち</h2><p>1990年代前半のイギリスで生まれた。直接の起点は1992年にWarp Recordsが発表した編集盤「Artificial Intelligence」で、ジャケットに記された electronic listening music という文句が示す通り、踊るためではなく家で椅子に座って聴くための電子音楽という明確な提案だった。ジャケットには、スピーカーの前の椅子に座ってくつろぐアンドロイドが描かれ、その足元にKraftwerkとPink Floydのレコードが置かれていた。この図像が、踊る音楽から聴く音楽への転換を視覚的に宣言した。Warp RecordsはSteve BeckettとRob Mitchellが1989年にシェフィールドで設立したレーベルで、当初はブリープ・テクノと呼ばれる地元の音を扱っていた。「Artificial Intelligence」にはThe Dice Man(Aphex TwinのRichard D. James)、Autechre、B12、Musicology、Speedy Jらが参加した。以後Warpは、Aphex Twinの1994年「Selected Ambient Works Volume II」、Autechreの1994年「Amber」、Boards of Canadaの1998年「Music Has the Right to Children」といった作品を発表し、この分野の中心となった。並行して、シェフィールドのRephlex(Richard D. JamesとGrant Wilson-Claridgeが1991年に設立)、ロンドンのNinja Tuneといったレーベルが独自の方向を切り開いた。ヨーロッパ大陸ではドイツのMille Plateaux(Achim Szepanskiが1994年に設立し、哲学者Gilles DeleuzeとFelix Guattariの著作から名を取った)が、より理論的な立場から実験的な電子音楽を出版した。intelligent technoやintelligent dance musicという呼称は、1993年にアメリカのインターネットのメーリングリストIDM listで使われ始めたとされる。しかしこの語は当初から批判された。他のテクノが知的でないという含意を持つためで、Aphex TwinやAutechreをはじめ、当事者のほとんどがこの呼称を公然と拒否している。Richard D. Jamesは複数のインタビューで、この語を作った人間は馬鹿げていると発言した。それでも名称は定着してしまい、現在ではIDMという略称が中立的な分類として使われている。1990年代末以降はドリルンベースやグリッチ、後年のエレクトロニカへ分岐し、2000年代にはWarpがFlying Lotusらを迎えて世代交代した。この系統が確立した「ダンス由来の音楽をアルバムとして構成する」という発想は、その後の電子音楽全般の基本前提になっている。</p>
