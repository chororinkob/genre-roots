<h1>Bounce（バウンスミュージック）とは</h1>
<p>アメリカ・ルイジアナ州ニューオーリンズで生まれた、ひたすら踊るためのヒップホップである。最大の特徴は、多くの楽曲が同じ二つの伴奏の型を共有している点にある。ひとつは1980年代のニューヨークのレコードから取られた特徴的な打楽器の音</p>
<p>アメリカ・ルイジアナ州ニューオーリンズで生まれた、ひたすら踊るためのヒップホップである。最大の特徴は、多くの楽曲が同じ二つの伴奏の型を共有している点にある。ひとつは1980年代のニューヨークのレコードから取られた特徴的な打楽器の音型であり、もうひとつは別の既成曲から取られた型で、この二つが長年にわたり地元の楽曲の核であり続けており、後にはCheeky Blakk beatやRoll Call beatなども加わった。個々の曲の差異は、その上に乗せる声と言葉、そして細部の装飾だけで作られる。テンポは長らく中速だったが、ハリケーン・カトリーナの後は速い曲調が増え、打点は跳ねながらも執拗に反復される。上物は多くないが、最初の型のベルのような音の連なりや、ブラスバンドなどの旋律の断片が使われることがある。声の扱いが本領で、演者は歌うのではなく、短い定型句を叫び、聴衆に応答を求める。呼びかけと応答の構造が曲の全体を貫き、聴き手が声を返さなければ音楽が成立しない設計になっている。歌詞は地元の区画の名を次々に呼び上げるもの、踊りの動作を具体的に指示するもの、そして性的な内容が中心で、詩的な比喩はほとんど用いられない。腰を激しく振る踊りと不可分であり、録音を聴くだけでは半分しか伝わらない音楽である。</p>
<h2>成り立ち</h2><p>1980年代後半にその原型が現れ、1991年にニューオーリンズのクラブでMC T. Tucker(T.T. Tuckerとも表記)とDJ Irvが演奏した楽曲が、最初のバウンス作品と広く見なされている。彼らが用いた伴奏は、1986年にニューヨークのThe Showboysが発表したレコードの一部だった。その盤は本国ではほとんど売れなかったが、南部で受容され、メンフィスのDJ Spanish Flyが1990年に使ったのが早い例とされる。ニューオーリンズへ伝わった経路ははっきりしないが、MC T. Tuckerが1986年のニューヨーク旅行で購入して持ち帰ったという証言もあり、以後この街の音楽の共有された土台となる。地元の言葉ではこの伴奏に固有の通称が付けられ、今なお使われ続けている。ひとつの型を全員が共有し、その上で個性を競うという発想は、ジャマイカのサウンドシステム文化と比べられることもある。この都市は文化的に「カリブ的」と形容されることもある。1990年代を通じて、DJ JubileeやDJ Jimiといった演者が地元で活動し、街の区画ごとの帰属意識と結びついて広まった。この音楽は極めて土地に密着しているが、南部には広く影響を与えた。アトランタのクランクの担い手であるLil JonやYing Yang Twinsはバウンスの掛け声を取り入れ、Juvenileの『Back That Azz Up』のような例もある。ただし全国的な主流にはならなかった。特筆すべきは性的少数者の役割である。1998年にKatey RedがTake Fo' Recordsと契約して1999年に初作を出し、性別を越境した演者たちが現れた。彼女たちが全国的に注目されるようになったのは2000年代後半以降である。彼女たちの活動は現地でsissy bounceと呼ばれたが、当事者の一部はこの呼び分けを拒んでいる。それでも保守的な南部において、性的少数者が大衆的な人気を得るという稀有な状況を作り出した。Big Freediaはその代表格で、後年、BeyoncéやDrakeの楽曲でサンプリングされるなどして、この音楽を世界へ届けている。2005年のハリケーン・カトリーナは、この都市を壊滅させ、住民を全米へ離散させた。多くの音楽家が家と生活を失い、シーンは大きな打撃を受ける。しかし皮肉なことに、離散した人々がヒューストンやアトランタでこの音楽を伝えたことにより、外部への広がりが生まれ、のちの復興と国際的な評価につながった。現在、腰を振る踊りは世界的な現象となっている。この踊りはニューオーリンズのバウンスの現場から広まったとされ、さらに遠い源流は中央アフリカ系の舞踊にまでさかのぼるとされる。</p>
