<h1>Bounce（バウンスミュージック）とは</h1>
<p>アメリカ・ルイジアナ州ニューオーリンズで生まれた、ひたすら踊るためのヒップホップである。最大の特徴は、ほぼ全ての楽曲が同じ二つの伴奏の型を共有している点にある。ひとつは1980年代のニューヨークのレコードから取られた特徴的な打楽器</p>
<p>アメリカ・ルイジアナ州ニューオーリンズで生まれた、ひたすら踊るためのヒップホップである。最大の特徴は、ほぼ全ての楽曲が同じ二つの伴奏の型を共有している点にある。ひとつは1980年代のニューヨークのレコードから取られた特徴的な打楽器の音型であり、もうひとつは別の既成曲から取られた型で、この二つが四半世紀にわたり地元の全ての楽曲の土台であり続けている。個々の曲の差異は、その上に乗せる声と言葉、そして細部の装飾だけで作られる。テンポは概ね95から105 BPMで、打点は跳ねながらも執拗に反復される。上物はほとんど存在せず、簡素な打楽器と低音だけの状態が延々と続くことも多い。声の扱いが本領で、演者は歌うのではなく、短い定型句を叫び、聴衆に応答を求める。呼びかけと応答の構造が曲の全体を貫き、聴き手が声を返さなければ音楽が成立しない設計になっている。歌詞は地元の区画の名を次々に呼び上げるもの、踊りの動作を具体的に指示するもの、そして性的な内容が中心で、詩的な比喩はほとんど用いられない。腰を激しく振る踊りと不可分であり、録音を聴くだけでは半分しか伝わらない音楽である。</p>
<h2>成り立ち</h2><p>1991年、ニューオーリンズのクラブでMC T. TuckerとDJ Irvが演奏した楽曲が、この分野の出発点とされる。彼らが用いた伴奏は、1986年にニューヨークのThe Showboysが発表したレコードの一部だった。その盤は本国ではほとんど売れなかったが、なぜかニューオーリンズでのみ熱狂的に受容され、以後この街の音楽の共有された土台となる。地元の言葉ではこの伴奏に固有の通称が付けられ、今なお使われ続けている。ひとつの型を全員が共有し、その上で個性を競うという発想は、ジャマイカのサウンドシステム文化と構造的に同じであり、カリブ海に面したこの都市の性格を反映している。1990年代を通じて、DJ JubileeやDJ Jimiといった演者が地元でカセットを売り、街の区画ごとの帰属意識と結びついて広まった。この音楽は極めて土地に密着しており、他都市ではほとんど知られないまま四半世紀が過ぎている。特筆すべきは性的少数者の役割である。1998年前後から、Katey Redをはじめとする、性別を越境した演者たちが中心的な位置を占めるようになった。彼女たちの活動は現地で独自の呼称を与えられ、保守的な南部において、性的少数者が大衆的な人気を得るという稀有な状況を作り出した。Big Freediaはその代表格で、後年、国際的な大歌手の楽曲に参加してこの音楽を世界へ届けている。2005年のハリケーン・カトリーナは、この都市を壊滅させ、住民を全米へ離散させた。多くの音楽家が家と生活を失い、シーンは一度断絶する。しかし皮肉なことに、離散した人々がヒューストンやアトランタでこの音楽を伝えたことにより、外部への広がりが生まれた。現在、腰を振る踊りは世界的な現象となっているが、その起源がこの都市の性的少数者と黒人共同体にあるという事実は、しばしば忘れられている。</p>
<h2>代表曲</h2><ul><li>Get Ready Ready (DJ Jubilee)</li><li>Azz Everywhere (Big Freedia)</li><li>Nice for What (Drake)</li><li>Where Dey At (DJ Jimi)</li></ul>
