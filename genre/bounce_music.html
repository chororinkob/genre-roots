<h1>Bounce（バウンスミュージック）とは</h1>
<p>バウンスは、アメリカ・ルイジアナ州ニューオーリンズで生まれた、ひたすら踊るためのヒップホップである。 最大の特徴は、多くの楽曲が同じ二つの伴奏の型を共有している点にある。ひとつは1980年代のニューヨークのレコードから取られた、特</p>
<p>バウンスは、アメリカ・ルイジアナ州ニューオーリンズで生まれた、ひたすら踊るためのヒップホップである。

最大の特徴は、多くの楽曲が同じ二つの伴奏の型を共有している点にある。ひとつは1980年代のニューヨークのレコードから取られた、特徴的な打楽器の音型だ。もうひとつは別の既成曲から取られた型である。この二つは、長年にわたり地元の楽曲の核であり続けている。後にはCheeky Blakk beatやRoll Call beatなども加わった。曲ごとの違いは、声や言葉に加えて、どの型をどう組み合わせるかでも生まれる。

上物（メロディーなど上に重ねる音）は多くない。ただ、最初の型のベルのような音の連なりや、ブラスバンドなどの旋律の断片が使われることがある。

テンポは長らく中速だったが、ハリケーン・カトリーナの後は速い曲調が増えた。打点は跳ねながらも、しつこいほど繰り返される。

声の扱いが本領だ。演者は歌うのではなく、短い定型句を叫び、聴衆に応答を求める。コール＆レスポンスは特徴のひとつである。DJがTriggermanを2枚で繋ぎ、MCが定型句を載せる形で、聴衆の参加を促す。

歌詞は、地区・団地・学校の名の呼び上げ、踊りの指示、性的でしばしば物議を醸す内容、ユーモアが特徴である。腰を激しく振る踊りと切り離せず、クラブやブロックパーティなどの生の現場で発展した、ダンス音楽である。</p>
<h2>成り立ち</h2><p>1980年代後半に、バウンスの原型（『Buck Jump Time』など）があった。1991年前後にニューオーリンズのクラブでMC T. Tucker(T.T. Tuckerとも表記)とDJ Irvが演奏した『Where Dey At』が、最初のバウンス作品と広く見なされている（年は資料により1991〜1993年）。

彼らが使った伴奏は、1986年にニューヨークのThe Showboysが発表したレコードの一部だった。その盤は本国では商業的には振るわなかった。しかし南部で受け入れられ、メンフィスのDJ Spanish Flyが使ったのが早い例とされる。その年と曲は、1989年の『Smokin' Onion』、または1990年の『Trigga Man』など、資料により異なる。

ニューオーリンズへ伝わった経路ははっきりしない。ただ、MC T. Tuckerが1986年のニューヨーク旅行で購入して持ち帰ったという証言もある。以後、この伴奏はこの街の音楽の共有された土台となる。地元の言葉では、この伴奏に固有の通称が付けられ、今なお使われ続けている。

ひとつの型を全員が共有し、その上で個性を競うという発想は、ジャマイカのダンスホールと比べられる。共通のリズムトラックに多数の演者が乗る形が似ている、と指摘されることもある。この都市は文化的に「カリブ的」と形容されることもある。

1990年代を通じて、DJ JubileeやDJ Jimiといった演者が地元で活動した。バウンスは街の区画ごとの帰属意識と結びついて広まった。この音楽は極めて土地に密着しているが、南部には広く影響を与えた。アトランタのクランクの担い手であるLil JonやYing Yang Twinsは、バウンスの掛け声を取り入れた。バウンスは長く地域的な音楽だったが、1999年のJuvenileの『Back That Azz Up』のように全国的ヒットになった例もある。

特筆すべきは性的少数者の役割である。1998年にKatey RedがTake Fo' Recordsと契約し、1999年に初作を出した。性別を越境した演者たちが現れた。彼女たちが全国的に注目されるようになったのは、2000年代後半以降である。彼女たちの活動は現地でsissy bounceと呼ばれたが、当事者の一部はこの呼び分けを拒んでいる。それでも保守的な南部において、性的少数者が大衆的な人気を得るという稀有な状況を作り出した。Big Freediaはその代表格だ。後年、BeyoncéやDrakeの楽曲でサンプリングされるなどして、この音楽を世界へ届けている。

2005年のハリケーン・カトリーナは、この都市を壊滅させ、住民を全米へ離散させた。多くの音楽家が家と生活を失い、シーンは大きな打撃を受ける。しかし皮肉なことに、離散した人々がヒューストンやダラスなどテキサスの都市でこの音楽を伝えたことにより、外部への広がりが生まれた。それがのちの復興と国際的な評価につながった。

現在、腰を振る踊りは世界的な現象となっている。この踊りはニューオーリンズのバウンスの現場から広まったとされる。さらに遠い源流は中央アフリカ系の舞踊にまでさかのぼるとされる。コートジボワールのマプーカなど、西アフリカの舞踊を源流とする説もある。</p>
