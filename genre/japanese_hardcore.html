<h1>Japanese Hardcore（ジャパニーズ・ハードコア）とは</h1>
<p>一言でいうと、米英のハードコア・パンクを、日本でさらに速く、さらに歪ませて鳴らす音楽だ。代表曲22曲を動画で聴け、ルーツと影響のつながりを地図でたどれる。</p>
<p>一言でいうと、米英のハードコア・パンクを、日本でさらに速く、さらに歪ませて鳴らす音楽だ。1曲が1分から2分で終わることも珍しくない。曲間をほとんど置かず、次の曲へ突っ込む。

中心はエレクトリック・ギター、ベース、ドラムの3点だ。ギターは真空管アンプを限界まで歪ませ、低い帯域を削って耳に刺さる音だけを残す。コードは2つか3つを曲中で回すだけで、パワーコードの連打が土台になる。その上に、トレモロ・ピッキングで刻む単音リフが乗る。ベースはピックで16分音符を刻み、ギターの低音と一体化して壁を作る。

和音の動きは少ない。半音や全音で上下する2コードの往復がほとんどで、そこに短い下降フレーズを差し込む。一部のバンドは、その上に泣きのメロディを歌うリード・ギターを重ねる。金属の速弾きと、歌える旋律が同じ曲に入るのが、この音楽の分かれ目になる。

リズムは4分の4拍子だ。スネアは2拍目と4拍目に落ちる。ハイハットを8分で刻みながら、バスドラムを16分で詰める。曲の頭で速いフィルを1回入れたら、あとは最後まで減速しない。2拍目と4拍目を抜いたDビートを使うバンドも多い。タムはあまり叩かず、スネアとシンバルが前に出る。

歌は叫ぶというより、喉を潰す発声だ。言葉の意味より音の圧を優先する。息継ぎの位置が聞き取れるほど荒く、語尾は伸ばさずに切る。サビでは全員が同じ言葉を叫び、観客がそのまま返す。

歌詞は社会への怒り、戦争、核、人間の醜さ、それでも生き延びること。日本語と英語が混ざる。皮肉や下品な冗談を混ぜるバンドもいる。

曲の組み立ては、イントロなしで頭から全力だ。AメロとBメロの区別は薄い。ギターのリフが切り替わる所が実質のサビになる。終わりは急に切るか、そのまま加速して幕を閉じる。

米国のハードコアとの違いは、金属的なギターと、旋律を残す点にある。英国のディスチャージに近い爆音の壁を作るバンドと、メタルのリードを入れるバンドに分かれる。音が鳴る場所は、新宿アンチノックや椿ハウスのような小さなライブハウスだ。客はステージ前に詰め、腕を振り回すモッシュで応じる。</p>
<h2>成り立ち</h2><p>1970年代末、東京にはすでにパンク・バンドがいた。1977年に結成されたSSが、日本のハードコアの最初のバンドとされている。当時の日本は高度経済成長が終わり、公害や学生運動の挫折が社会に残っていた。海外のパンクとハードコアのレコードが輸入され、それを聴いた10代が楽器を買った。

1980年6月、遠藤ミチロウがザ・スターリンを結成する。1982年7月1日に出た2枚目のアルバム『Stop Jap』は、英語圏のハードコアを日本語の歌詞と芝居がかった歌で作り直した作品になった。同じころ、1981年9月にGauze、1981年に東京でG.I.S.M.が動き出す。G.I.S.M.は1984年に『Detestation』を出し、パンクに金属的なギターと工業音楽の噪音を混ぜた。

1982年、コンピレーション・アルバム『City Rocker』が出る。Gauzeはここに10曲を提供した。1984年にはG.I.S.M.が『Hardcore Unlawful Assembly』に参加する。この作品を企画したのはAAレコードのチャーミーだった。

1984年初め、ザ・カムズを抜けたばかりのベース奏者、小川ミノルがリップ・クリームを始める。チャーミーに『Hardcore Unlawful Assembly』への参加を誘われ、その場で新しいバンド名を口にしたのがきっかけだった。1984年8月15日にEP『Lonely Rock』を出し、1986年の『Kill Ugly Pop』で、金属的な速さとロックのリフを両立させた。Gauzeは1985年6月に『Fuck Heads』、1986年3月に『Equalizing Distort』を出し、速く演奏しているように聞こえる運び方を突き詰めた。

しかし会場の外では、パンクであること自体が不利益になった。デス・サイドの石屋は、見た目だけで差別され、就職の面接で落とされたと語っている。電車で避けられ、警察と暴力団の両方から目をつけられた。バスタードのギター、ジギャクは部屋を借りることも難しかった。ライブでは毎回誰かが血を流した。G.I.S.M.の横山サケビはステージで火炎放射器を振り回し、一般人への暴行で2か月の服役をした。

1987年、デス・サイドがEP『Satisfy the Instinct』を出す。1988年、ボーカルの石屋と鉄アレイのベース、勝田が「Burning Spirits」という名前でライブとツアーの網を作る。名前はプロレスラーのブルーザー・ブロディがアントニオ猪木の目について語った言葉から取った。ゴールデンウィークに最初のツアーが回り、1988年の大晦日には新宿アンチノックのオールナイト興行を引き継いで毎年恒例の催しにした。

1989年にデス・サイドは『Wasted Dream』、1991年に『Bet on the Possibility』を出す。ギターのCHELSEA（岸田浩之）は、金属の速弾きと泣きのメロディを1本のギターで弾き分けた。1992年にはバスタードが『Wind of Pain』を出し、同じ言葉をより重く太く鳴らした。デス・サイドは1994年まで走り続け、その後CHELSEAはペイントボックスを結成する。

一方、高知市ではディスクローズが1990年から2007年まで活動した。英国のディスチャージの演奏をほぼそのまま増幅し、ファズと歪みを重ねて核戦争を歌う。同じ時期、大阪のS.O.B.、東京のコンヒューズ、クロウ、ナイトメアが、それぞれ別の方向へハードコアを曲げていった。

1990年8月、リップ・クリームは2本のラスト・ライブで幕を閉じた。1990年代に入ると、主要なバンドが次々に活動を止めた。それでもBurning Spiritsの大晦日は続き、1996年にはジャッジメントが『No Reason Why』を出した。

2001年2月10日、G.I.S.M.のギター、ランディ・ウチダが癌で死亡する。バンドは追悼の2公演を行って解散した。2007年6月5日にはディスクローズの川上英樹が急性アルコール中毒で死亡し、同じ2007年にCHELSEAも逝去した。2015年、デス・サイドがCHELSEAの追悼のために再結成する。2019年4月25日、遠藤ミチロウが膵臓癌で死亡した。

2022年11月、Gauzeが解散する。2023年8月24日、横山サケビが死亡した。現在、音源の再発が続き、海外のレーベルが初期作品を箱にまとめている。2025年の取材では、東京、大阪、名古屋、岡山、川崎と横浜の周辺で新しいバンドが動いている。石屋は今、作家としてパンクの歴史を書いている。暴力で知られた場所は、四半世紀を経て、記録を残す対象になった。</p>
