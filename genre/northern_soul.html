<h1>Northern Soul（ノーザンソウル）とは</h1>
<p>音楽の様式ではなく、イギリス北部で生まれた聴き方と踊り方の運動である。対象となるのは1960年代のアメリカで作られたソウルの、しかも商業的に失敗して忘れられた無名の作品であり、テンポが速く、力強く、そして入手が困難であることが価値</p>
<p>音楽の様式ではなく、イギリス北部で生まれた聴き方と踊り方の運動である。対象となるのは1960年代のアメリカで作られたソウルの、しかも商業的に失敗して忘れられた無名の作品であり、テンポが速く、力強く、そして入手が困難であることが価値の条件とされた。音楽的な特徴を挙げるなら、概ね100から130 BPMの速い四拍子、Motownの様式に近い分厚い打楽器と手拍子、そして力任せに歌い上げる歌唱である。ただし重要なのは、これらが同時代の流行ではなく、既に10年近く前の、しかも売れなかった音源だという点にある。踊り方が独特で、体操に近い動きが発達した。後方への宙返り、片足での高速な回転、床を滑る動き、そして高く蹴り上げる動作が、個人技として競われる。これは集団で揃って踊るのではなく、一人ずつが技を見せる形式であり、踊り手同士の間には明確な序列があった。演奏の場は日没から翌朝まで続く催しで、参加者は数百キロを移動して集まった。運動の標語と、拳を握った意匠が共有され、参加すること自体が帰属の証となる、極めて閉鎖的で結束の強い文化を形成した。</p>
<h2>成り立ち</h2><p>1960年代後半のイギリス北部は、繊維や炭鉱といった産業の衰退が始まり、若い労働者にとって展望の乏しい土地だった。ロンドン中心の流行から取り残されたこの地域で、若者たちはアメリカのソウルのレコードに独自の価値を見出す。呼称そのものは1970年、ロンドンでレコード店を営む記者Dave Godinが、北部から来る客が求める音楽を店員に説明するために使ったのが始まりとされる。中心となった会場は、マンチェスターの店を皮切りに、1973年に開場したウィガンの会場へ移った。ここでは土曜の深夜から日曜の朝八時まで演奏が続けられ、全国から若者が集まった。この文化には固有の規則があった。DJは自分がかけている盤の正体を隠すため、レーベル面に別の紙を貼り付けた。他人が同じ盤を手に入れれば希少性が失われるためである。この競争は音源の発掘を極端に推し進め、アメリカの倉庫に眠っていた在庫が大量に買い付けられた。象徴的な例が、1965年にMotownが制作しながらほとんど廃棄された一枚で、現存が数枚しか確認されておらず、史上最も高額なシングル盤のひとつとなっている。この運動には深刻な影の部分もあった。夜通し踊り続けるために覚醒剤が広く用いられ、警察による摘発が繰り返された。健康を損ない、あるいは依存に苦しんだ参加者も少なくない。1981年にウィガンの会場が閉鎖されると、運動は縮小したが、消滅はしなかった。参加者は中年になっても催しに通い続け、現在も各地で集まりが開かれている。この運動が残したものは大きい。忘れられた音源を発掘して価値を与えるという発想、DJが選曲によって文化を作るという構造、そして音楽を通じた強い共同体の形成は、後のイギリスのクラブ文化の全ての前提となった。</p>
