<h1>Northern Soul（ノーザンソウル）とは</h1>
<p>ノーザン・ソウルは、ある種のスタイルのソウルを土台にした、聴き方と踊り方の運動だ。北イングランドおよびミッドランズで、1970年代初頭に定着した。 対象は主に、1960年代半ばのアメリカで作られたソウルだ。その中でも、珍しく、見過</p>
<p>ノーザン・ソウルは、ある種のスタイルのソウルを土台にした、聴き方と踊り方の運動だ。北イングランドおよびミッドランズで、1970年代初頭に定着した。

対象は主に、1960年代半ばのアメリカで作られたソウルだ。その中でも、珍しく、見過ごされていた盤が中心だった(後年は新しい録音や英国の録音も加わって範囲が広がった)。価値の条件とされたのは、テンポが速いこと、力強いこと、そして手に入りにくいことである。

音の特徴を挙げるなら、100 BPM（1分間の拍数）以上の速い4拍子だ。Motown（アメリカのレコード会社）のスタイルに近い分厚い打楽器が鳴り、そこにソウルフルなボーカルが乗る。

ただし大事なのは、これらが同じ時代の流行ではなかったという点だ。主に1965〜70年頃の米国盤で、商業的に成功しなかったものが多い。ただし例外もある。

踊り方も独特だ。スピン、フリップ、バックドロップなど派手な動きも見られ、個人技として競われる。ただし基本は横滑りの動きで、アクロバットの強調は誇張とする指摘がある。一人ずつが技を見せる個人技の面が強い。その一方で、曲の決まった箇所で一斉に手拍子を打つなど、集団での一体感もあった。腕の立つ踊り手がDJの舞台の近くで踊れるなど、上下関係のようなものも見られた。

演奏の場は、深夜から翌朝まで続く催しだった。参加者は数百キロを移動して集まった。運動の標語と、拳を握ったデザインが共有された。参加すること自体が仲間の一員である証となり、結束の強い文化が生まれた。</p>
<h2>成り立ち</h2><p>1960年代後半のイギリス北部では、繊維や炭鉱といった産業の、1950年代から続く衰退が進んでいた。若い労働者にとって、将来の見通しの乏しい土地だった。

ロンドン中心の流行から取り残されたこの地域で、若者たちはアメリカのソウルのレコードに独自の価値を見いだす。この動きには1960年代後半に前史があり、1970年代初頭に定着したとされる。

呼び名そのものは、ロンドンでレコード店を営む記者Dave Godinが考えた。北部から来る客が求める音楽を、店員に説明するための店内用語だった。考えたのは1968年とされ、ほかに1966〜67年とする説もある。雑誌での初出時期は資料により異なる。

中心となった会場は、マンチェスターのクラブTwisted Wheelから始まった。その後、1972〜73年のGolden Torchを経て、1973年にオールナイターを始めたウィガンの会場へ移る。Blackpool Meccaも並行する主要会場だった。ここでは土曜の深夜から日曜の朝八時まで演奏が続き、全国から若者が集まった。

この文化には独自の決まりがあった。DJは、自分がかけている盤の正体を隠すため、レーベル面に別の紙を貼った。他人が同じ盤を手に入れれば、珍しさが失われるからである。この競争は音源探しを極端に推し進め、アメリカの倉庫に眠っていた在庫が大量に買い付けられた。代表的な例が、1965年にMotownが作りながら、ほとんど捨てられた一枚だ。現存は数枚しか確認されておらず、史上最も高額なシングル盤のひとつとなっている。

一方で、この運動には深刻な影の部分もあった。夜通し踊り続けるために覚醒剤（眠気を飛ばす薬物）が広く使われ、警察の取り締まりが繰り返された。健康を損ない、あるいは依存に苦しんだ参加者もいた。

1981年にウィガンの会場が閉鎖されると、運動は縮小した。それでも、消えはしなかった。参加者は中年になっても催しに通い続け、今も各地で集まりが開かれている。

この運動が残したものは大きい。忘れられた音源を掘り起こして価値を与えるという発想。DJが選曲によって文化を作るという仕組み。そして、音楽を通じた強い仲間のつながり。これらは、現代のクラブ文化やスーパースターDJ文化の形成に向けた重要な一歩とされる。</p>
