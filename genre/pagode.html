<h1>Pagode（パゴーヂ）とは</h1>
<p>サンバの一系統で、裏庭や集会所の輪になった宴から生まれた、親密で会話的な様式。編成が独特で、通常のサンバの大編成とは違い、小さな打楽器群を中心にした少人数で演奏される。中心になるのはタンタンという手で叩く低音の太鼓で、これが従来の</p>
<p>サンバの一系統で、裏庭や集会所の輪になった宴から生まれた、親密で会話的な様式。編成が独特で、通常のサンバの大編成とは違い、小さな打楽器群を中心にした少人数で演奏される。中心になるのはタンタンという手で叩く低音の太鼓で、これが従来のスルドの代わりに低音を刻む。加えて、手で叩く高音の太鼓レピキ・ヂ・マォン、鈴の付いた片面太鼓パンデイロ、そして通常より弦の張りが強く音の伸びる小型四弦楽器バンジョ・カヴァキーニョが加わる。テンポは90〜110BPM、2拍子で、裏拍を強調した細かいシンコペーションが絶えず動き続ける。和声は7thや9thを含む洗練されたコードが使われ、ボサノヴァに近い響きを持つ場合もある。歌は一人が主旋律を歌い、周囲の全員が繰り返しの部分を合唱で返すコール・アンド・レスポンスが基本で、聴き手と演奏者の境界がない。歌詞は日常の恋愛、友人との酒、貧困を笑い飛ばす機知、地元への愛着を扱う。舞台上の見世物ではなく、円卓を囲んで飲みながら演奏するという場そのものが、この音楽の定義に含まれている。</p>
<h2>成り立ち</h2><p>1970年代末、リオデジャネイロ北部の労働者地区で始まった。中心になったのは、ラモス地区にあったカシーキ・ヂ・ラモスというカーニバル団体の集会所で、毎週開かれていた集まりである。当時のサンバは、カーニバルの巨大なパレードのために大音量と大人数へ肥大しており、それに飽き足りない演奏者たちが、輪になって顔の見える距離で演奏する原点回帰を求めた。この場からFundo de Quintal（裏庭の底、の意）というグループが生まれる。彼らは音の面で二つの発明を行った。一つは、Ubirany Félix do Nascimentoが考案した手叩きの太鼓レピキ・ヂ・マォンで、もう一つはSereno（Sebastião Ferreira）が広めたタンタンである。従来は肩に掛けて撥で叩いていた低音の太鼓を、膝に乗せて素手で叩くようにしたことで、音量が下がり、屋内での会話的な演奏が可能になった。さらにバンジョーの胴にカヴァキーニョの棹を付けたバンジョ・カヴァキーニョをAlmir Guinetoが考案し、屋外でも通る芯のある音を得た。この輪からZeca Pagodinho、Jorge Aragão、Arlindo Cruz、Sombrinhaといった作り手が育っていく。1980年代半ばには大手レコード会社が目をつけ、テレビ番組を通じて全国に広がった。1990年代には、サンパウロを中心に、電気ベースやキーボードを加えて甘い恋愛歌に特化したパゴーヂ・ロマンチコが台頭する。Raça Negra、Só Pra Contrariar、Art Popularといったグループが桁違いの売上を記録したが、リオの古参からはサンバの魂を売ったと厳しく批判され、この対立は今も続いている。2000年代以降はZeca Pagodinhoが国民的な人気を保ち、根の側と商業の側が並存する形に落ち着いた。裏庭で輪になって歌うという形式そのものは、ブラジル各地の日常に今も生き続けている。</p>
