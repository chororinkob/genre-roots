<h1>Pagode（パゴーヂ）とは</h1>
<p>パゴーヂはサンバの一系統で、裏庭や集会所で輪になって開かれた宴から生まれた。親密で、会話のようなスタイルの音楽だ。 編成は独特である。通常のサンバの大編成とは違い、小さな打楽器群を中心にした少人数で演奏される。中心になるのはタンタ</p>
<p>パゴーヂはサンバの一系統で、裏庭や集会所で輪になって開かれた宴から生まれた。親密で、会話のようなスタイルの音楽だ。

編成は独特である。通常のサンバの大編成とは違い、小さな打楽器群を中心にした少人数で演奏される。中心になるのはタンタンという、手で叩く低音の太鼓だ。従来のスルド（大きな低音の太鼓）の代わりに、低音を刻む。加えて、手で叩く高音の太鼓レピキ・ヂ・マォンと、鈴の付いた片面太鼓パンデイロが入る。さらに、カヴァキーニョの棹とバンジョーの胴を組み合わせた4弦楽器、バンジョ・カヴァキーニョが加わる。音が大きく、打楽器の多い場でも通る楽器だ。

テンポはおおむね中庸で、目安として90〜110BPM程度（1分間の拍数）である。拍子は2拍子で、裏拍を強調した細かいシンコペーション（拍をずらして強調するリズム）が絶えず動き続ける。和声（コードの響き）にも洗練がある。

歌は、一人が主旋律を歌い、周囲の全員が繰り返しの部分を合唱で返す、コール・アンド・レスポンス（呼びかけと応答）が基本だ。聴き手と演奏者の境界がない。歌詞は日常の恋愛、友人との酒、貧困を笑い飛ばす機知、地元への愛着を扱う。原点の場は、裏庭やquadraでの飲食を伴う輪の宴だった。</p>
<h2>成り立ち</h2><p>舞台は、リオデジャネイロ北部の労働者地区である。集まりは1975年に始まり、この地区のrodaで萌芽した。Fundo de Quintalは1979〜80年に結成され、1980年に初LPを出して型を固めた。

中心になったのは、オラリア地区にあるカシーキ・ヂ・ラモス（Ramos地区の若者グループから生まれ、先住民をテーマに命名された）というカーニバル団体の本部だ。毎週水曜日に、そこで集まりが開かれていた。カーニバルの商業化で、作曲家が新作を披露する場が減り、Cacique de Ramosがその受け皿になった。集まりは1975年にUbiranyが仲間を呼んで始めた。

この場から、Fundo de Quintal（裏庭の奥、の意）というグループが生まれる。彼らは音の面で、いくつかの発明を行った。一つは、Ubirany Félix do Nascimentoが導入したとされる、手叩きの太鼓レピキ・ヂ・マォンである。もう一つは、Sereno（本名Jalcireno Fontoura de Oliveira）が導入したとされるタンタンだ。従来は肩に掛けて、片手に撥、もう片手は素手で叩いていた低音の太鼓スルドがあった。その代わりに素手で叩くタンタンを使うようにしたのは、スルドの音が強く、カヴァキーニョやヴィオラォンの音を覆ってしまったためとされる。

さらに、バンジョーの胴にカヴァキーニョの棹を付けたバンジョ・カヴァキーニョを、Almir Guinetoがサンバに導入・普及させたとされる（創案者かどうかは諸説ある）。これで、屋外でも通る芯のある音を得た。この輪から、Zeca Pagodinho、Jorge Aragão、Arlindo Cruz、Sombrinhaといった作り手が育っていく。1978年にBeth Carvalhoのアルバム『De Pé no Chão』に参加したことで、大手レーベルとの接点が生まれた。Zeca PagodinhoもBeth Carvalhoに1983年に録音へ招かれ、全国に広がっていった。

1990年代には、サンパウロを中心に、電気ベースやキーボードを加えて甘い恋愛歌に特化したパゴーヂ・ロマンチコが人気を集める。Raça Negraは10年で約1,600万枚、Só Pra Contrariarは1997年だけで330万枚を売った。Art Popularも成功したが規模は小さい。一方で、リオの伝統派(Nei Lopesら)から、内容の浅い『サンバではない商業音楽』という批判や線引きがあった。現在は緊張が和らぎ、並存している。2000年代以降はZeca Pagodinhoが国民的な人気を保ち、根の側と商業の側が並存する形に落ち着いた。裏庭で輪になって歌うという形式そのものは、ブラジル各地の日常に今も生き続けているとされる。</p>
