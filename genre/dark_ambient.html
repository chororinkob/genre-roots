<h1>Dark Ambient（ダークアンビエント）とは</h1>
<p>ダークアンビエントは、アンビエントの持続音の構造を保ちながら、情緒を不安と恐怖の方向へ振り切った音楽だ。 基本の素材は、低域を占める重いドローン（鳴り続ける低い音）である。そこに、金属のきしみやうねりに似たこすれる音、遠くで反響す</p>
<p>ダークアンビエントは、アンビエントの持続音の構造を保ちながら、情緒を不安と恐怖の方向へ振り切った音楽だ。

基本の素材は、低域を占める重いドローン（鳴り続ける低い音）である。そこに、金属のきしみやうねりに似たこすれる音、遠くで反響する打撃音が加わる。逆再生や極端なピッチ変更（音の高さの変更）を施した人声や自然音も使われる。音は、低域のドローンやうなりを基調とする。作例によっては、20〜200Hzの低域と、時折差し込まれる不快な高域の間に、大きな空白を作る。この空白が、地下空間や巨大な洞窟の感覚を生む。

和声（コードの響き）は、不協和なうねりを含む。微分音を用いる作品もある。二つの近接した周波数が干渉して生じるビート(唸り)そのものが、緊張の源になる。

リズムは基本的に存在しない。あっても、心拍や滴る水音のように、不規則な間隔で置かれる。

歌詞やヴォーカルはまれである。あっても、言葉として認識できない加工が施される。

音作りの技術には、次のようなものが多用される。長いリヴァーブ（残響。数十秒に及ぶことも多い）。コンヴォリューション・リヴァーブ（実在の場所の響きを取り込んで再現する残響）による、実在の廃墟や地下施設のインパルス応答（その場所の響きの記録）。テープの劣化やビットの間引き（デジタル音の細かさを落とすこと）によるノイズ付加。グラニュラー合成（音を細かい粒に刻んで組み直す手法）による音の引き伸ばし。

曲は、数十分に及ぶことも珍しくない。聴き手を長時間の閉じ込められた感覚の中に置くことが、設計目的になっている。

ホラー映画やゲームの音響設計と手法を共有している。Lustmordのように映画音楽に関わる作家もいる。</p>
<h2>成り立ち</h2><p>ダークアンビエントは、1980年代のインダストリアル文化の内側から生まれた。1990年代前半には、独立した分類として定着した。

前史には、イギリスのThrobbing Gristleがある。1978年のアルバム『D.o.A: The Third and Final Report of Throbbing Gristle』などで、不気味な持続音を見せた。同グループの解散後には、Peter ChristophersonとJohn Balanceが結成したCoilや、Genesis P-Orridgeが率いたPsychic TVが、儀式的な音響を聴かせた。

とりわけ重要なのは、イギリスのLustmord(Brian Williams)である。彼はSPKのメンバーだった経歴を持ち、1980年代から人の立ち入らない場所での録音を素材に用いた。1990年の「Heresy」では、地下聖堂、洞窟、鉱山、深い防空壕、カタコンベで録音した音や、地震・火山由来の素材を用いている。この作品は、ダークアンビエントの金字塔／集大成的作品と評価される。Williamsは後にハリウッドの映画音響の仕事に進んだ。この分野の手法が商業映画に入り込む道筋も、彼が作った。

オーストラリアのSPKは1978年に結成された。1987年作『Zamia Lehmanni: Songs of Byzantine Flowers』は、ダークアンビエントの発展に影響を与えたとされる。1990年代には、スウェーデンのRaison d'être（1991年開始）、ドイツのHerbst9（1997年結成）、スウェーデンのDeutsch Nepal（1991年開始）らが続いた。

決定的な役割を果たしたのが、スウェーデンのレーベルCold Meat Industryである。Roger Karmanikが1987年にスウェーデンで設立した。Raison d'être、Brighter Death Now、Ordo Rosarius Equilibrio、Mortiisといった作家群を擁し、ダークアンビエントと儀式音楽の中心地になった。このレーベルは、装丁に宗教的・死を思わせる絵やマークを多用した。独特の統一感で、スウェーデンのダークアンビエント／インダストリアルを代表するレーベルとなった。ただし、政治的に受け取られうる意匠を用いた作品があった（創設者本人は政治性を否定）。

もう一つの流れとして、ブラックメタルからの合流がある。ノルウェーのBurzumのVarg Vikernesは、1993年に、同じ音楽の世界のØystein Aarsethを殺害して収監された。獄中でシンセサイザーと通常のテープレコーダー以外の楽器・機材を持てなかったため、それらだけで1994〜95年に録音した。それが、1997年に発表した「Dauði Baldrs」である。この経緯自体が示すように、ブラックメタルの周辺では殺人や放火の事件が起きていた。ダークアンビエントの一部も、その周辺にあった。ただし、この世界全体が極右思想だとするのは定説ではない。

並行して、MortiisはEmperorを脱退した。彼は、擬似的な中世ファンタジーの世界観を持つダンジョン・シンセという派生で、1993年にEra I期の活動を開始した。デビュー作『Født til å herske』は、1994年に発表された。起源はMortiis、Burzum、あるいは英国のJim Kirkwood（Where Shadows Lie 1990年、King of the Golden Hall 1991年）とする見方があり、諸説ある。

1990年代以降は、ゲーム音楽との結びつきが強まる。1993年の「Doom」、1999年の「Silent Hill」、2008年の「Dead Space」といったホラー作品の音響は、ダークアンビエントと近い不穏な響きを持つ。ただし、作り方はそれぞれ異なる（Doomはテクノとメタル調、Dead Spaceは偶然性を用いた弦・管の奏法）。

2010年代には、Cryo Chamberというレーベルが2011年に登場した。Lovecraftの神話体系に基づく大規模な共作企画で、新世代の作家を組織した。1時間前後のミックス動画を公式YouTubeチャンネルで公開し、多くの再生数を得ている。</p>
<h2>代表曲</h2><ul><li>Black Star (Lustmord)</li><li>Rundgang um die transzendentale Säule der Singularität (Burzum)</li><li>The Darkness That Lurks in Our Mind (Akira Yamaoka)</li><li>Silent Heaven (Akira Yamaoka)</li><li>Memory of the Waters (Akira Yamaoka)</li><li>Heresy (Lustmord)</li><li>A Room Between the Rooms (Kammarheit)</li><li>Are You Shivering? (Coil)</li><li>Dark River (Coil)</li><li>Cellblock (Atrium Carceri)</li><li>Within the Depths of Silence and Phormations (Raison d'être)</li></ul>
