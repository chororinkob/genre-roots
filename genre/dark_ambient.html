<h1>Dark Ambient（ダークアンビエント）とは</h1>
<p>アンビエントの持続音の構造を保ちながら、情緒を不安と恐怖の方向へ振り切った音楽。基本素材は低域を占める重いドローン（鳴り続ける低い音）、金属のきしみやうねりに似たこすれる音、遠くで反響する打撃音、逆再生や極端なピッチ変更（音の高さ</p>
<p>アンビエントの持続音の構造を保ちながら、情緒を不安と恐怖の方向へ振り切った音楽。基本素材は低域を占める重いドローン（鳴り続ける低い音）、金属のきしみやうねりに似たこすれる音、遠くで反響する打撃音、逆再生や極端なピッチ変更（音の高さの変更）を施した人声や自然音。低域のドローンやうなりを基調とし、作例によっては、中高域を削って低域と時折差し込まれる高域の間に大きな空白を作り、地下空間や巨大な洞窟のような感覚を生む。技術的には長いリヴァーブ（残響）、コンヴォリューション・リヴァーブ（実在の場所の響きを取り込んで再現する残響）による実在の廃墟や地下施設のインパルス応答（その場所の響きの記録）、テープの劣化やビットの間引き（デジタル音の細かさを落とすこと）によるノイズ付加、グラニュラー合成（音を細かい粒に刻んで組み直す手法）による音の引き伸ばしが多用される。リズムは基本的に存在せず、あっても心拍や滴る水音のように不規則な間隔で置かれる。和声（コードの響き）は不協和なうねりを含み、微分音を用いる作品もあり、二つの近接した周波数が干渉して生じるビート(唸り)そのものが緊張の源になる。曲は数十分に及ぶことも珍しくなく、聴き手を長時間の閉じ込められた感覚の中に置くことが設計目的になっている。歌詞やヴォーカルはまれで、あっても言葉として認識できない加工が施される。ホラー映画やゲームの音響設計と手法を共有しており、Lustmordのように、劇伴（映像作品の背景音楽）や映画音楽に関わる作家もいる。</p>
<h2>成り立ち</h2><p>1980年代のインダストリアル文化の内側から生まれ、1990年代前半に独立した分類として確立した。前史として、イギリスのThrobbing Gristleが1978年のアルバム『D.o.A: The Third and Final Report of Throbbing Gristle』などで見せた不気味な持続音や、同グループの解散後にPeter ChristophersonとJohn Balanceが結成したCoil、Genesis P-Orridgeが率いたPsychic TVの儀式的な音響がある。とりわけ重要なのはイギリスのLustmord(Brian Williams)で、彼はSPKのメンバーだった経歴を持ち、1980年代から人の立ち入らない場所での録音を素材に用いた。1990年の「Heresy」では、地下聖堂、洞窟、鉱山、深い防空壕、カタコンベなどで録音した音や、地震・火山由来の素材を用いており、ダークアンビエントの金字塔、1987〜89年の作業の集大成と評価される。音響設計の原型は、1986年発売の「Paradise Disowned」などの80年代作品にすでに見られる。Williamsは後にハリウッドの映画音響の仕事に進み、この分野の手法が商業映画に入り込む道筋も作った。オーストラリアのSPK（1978年結成）の1987年作『Zamia Lehmanni: Songs of Byzantine Flowers』もダークアンビエントの発展に影響を与えたとされ、1990年代にはスウェーデンのRaison d'être（1991年開始）、ドイツのHerbst9（1997年結成）、スウェーデンのDeutsch Nepal（1991年開始）らが続いた。決定的な役割を果たしたのがスウェーデンのレーベルCold Meat Industryで、Roger Karmanikが1987年にスウェーデンで設立し、Raison d'être、Brighter Death Now、Ordo Rosarius Equilibrio、Mortiisといった作家群を擁して、ダークアンビエントと儀式音楽の中心地になった。同レーベルは装丁に宗教的・死を思わせる絵やマークを多用し、独特の統一感で、スウェーデンのダークアンビエントやインダストリアルを代表するレーベルとなった。ただし、政治的に受け取られうる意匠を用いた作品もあった（創設者本人は政治性を否定している）。もう一つの流れとしてブラックメタルからの合流がある。ノルウェーのBurzumのVarg Vikernesは、1993年に同じ音楽の世界のØystein Aarsethを殺害して収監され、獄中ではシンセサイザーと通常のテープレコーダー以外の楽器・録音機材を持てなかったため、それらだけで1994〜95年に録音して1997年に発表した「Dauði Baldrs」を制作した。この経緯自体が示すように、ブラックメタルの周辺では殺人や放火の事件が起きており、ダークアンビエントの一部もその周辺にあった。ただし、この世界全体が極右思想だとするのは定説ではない。並行してMortiisはEmperorを脱退後の1993年に活動を始め（デビュー作『Født til å herske』は1994年）、擬似的な中世ファンタジーの世界観を持つダンジョン・シンセの源流の一つとされる（Mortiis、Burzum、あるいは英国のJim Kirkwoodの1990年や1991年の作品を起源とする見方があり、諸説ある）。1990年代以降は、ゲーム音楽との結びつきが強まる。1993年の「Doom」、1999年の「Silent Hill」、2008年の「Dead Space」といったホラー作品の音響は、ダークアンビエントと近い不穏な響きを持つが、作り方はそれぞれ異なる（Doomはテクノとメタル調、Dead Spaceは偶然性を用いた弦・管の奏法）。2010年代にはCryo Chamberというレーベルが2011年に登場し、Lovecraftの神話体系に基づく大規模な共作企画で新世代の作家を組織し、1時間前後のミックス動画を公式YouTubeチャンネルで公開し、多くの再生数を得ている。</p>
<h2>代表曲</h2><ul><li>Black Star (Lustmord)</li><li>Rundgang um die transzendentale Säule der Singularität (Burzum)</li><li>The Darkness That Lurks in Our Mind (Akira Yamaoka)</li><li>Silent Heaven (Akira Yamaoka)</li><li>Memory of the Waters (Akira Yamaoka)</li><li>Heresy (Lustmord)</li><li>A Room Between the Rooms (Kammarheit)</li><li>Are You Shivering? (Coil)</li><li>Dark River (Coil)</li><li>Cellblock (Atrium Carceri)</li><li>Within the Depths of Silence and Phormations (Raison d'être)</li></ul>
