<h1>Dark Ambient（ダークアンビエント）とは</h1>
<p>アンビエントの持続音の構造を保ちながら、情緒を不安と恐怖の方向へ振り切った音楽。基本素材は低域を占める重いドローン、金属の軋みやうねりに似た擦過音、遠くで反響する打撃音、逆再生や極端なピッチ変更を施した人声や自然音。周波数配置に特</p>
<p>アンビエントの持続音の構造を保ちながら、情緒を不安と恐怖の方向へ振り切った音楽。基本素材は低域を占める重いドローン、金属の軋みやうねりに似た擦過音、遠くで反響する打撃音、逆再生や極端なピッチ変更を施した人声や自然音。周波数配置に特徴があり、中高域を意図的に削って耳障りな明るさを排し、20〜200Hzの低域と、時折差し込まれる不快な高域の間に大きな空白を作る。この空白が地下空間や巨大な洞窟の感覚を生む。技術的には長いリヴァーブ(数十秒に及ぶことも多い)、コンヴォリューション・リヴァーブによる実在の廃墟や地下施設のインパルス応答、テープの劣化やビットの間引きによるノイズ付加、グラニュラー合成による音の引き伸ばしが多用される。リズムは基本的に存在せず、あっても心拍や滴る水音のように不規則な間隔で置かれる。和声は微分音や不協和なうねりを含み、二つの近接した周波数が干渉して生じるビート(唸り)そのものが緊張の源になる。曲は数十分に及ぶことも珍しくなく、聴き手を長時間の閉塞感の中に置くことが設計目的になっている。歌詞やヴォーカルはまれで、あっても言葉として認識できない加工が施される。ホラー映画やゲームの音響設計と手法を共有しており、実際に多くの作家が劇伴の仕事に流れている。</p>
<h2>成り立ち</h2><p>1980年代のインダストリアル文化の内側から生まれ、1990年代前半に独立した分類として確立した。前史として、イギリスのThrobbing Gristleが1979年の「20 Jazz Funk Greats」などで見せた不気味な持続音や、同グループの解散後にPeter ChristophersonとJohn Balanceが結成したCoil、Genesis P-Orridgeが率いたPsychic TVの儀式的な音響がある。とりわけ重要なのはイギリスのLustmord(Brian Williams)で、彼はSPKのメンバーだった経歴を持ち、1980年代から人の立ち入らない場所での録音を素材に用いた。1990年の「Heresy」では、実際に屠殺場、カタコンベ、洞窟で録音した音を極端に加工して用いており、ダークアンビエントの音響設計の原型を確立した作品と評価される。Williamsは後にハリウッドの映画音響の仕事に進み、この分野の手法が商業映画に流入する経路も作った。同時期にオーストラリアのSPK、スウェーデンのRaison d'Etre、ドイツのHerbst9、ノルウェーのDeutsch Nepalらが活動した。決定的な役割を果たしたのがスウェーデンのレーベルCold Meat Industryで、Roger Karmanikが1987年にリンシェーピングで設立し、Raison d'Etre、Brighter Death Now、Ordo Rosarius Equilibrio、Mortiisといった作家群を擁して、ダークアンビエントと儀式音楽の中心地になった。同レーベルは装丁に宗教的・死の図像を多用し、独特の統一感で北欧の暗黒音楽の代名詞となったが、一部の作品が政治的に問題ある図像を扱ったことで批判も受けた。もう一つの流れとしてブラックメタルからの合流がある。ノルウェーのBurzumのVarg Vikernesは、1993年に同じシーンのØystein Aarsethを殺害して収監され、獄中では弦楽器の使用が許されなかったためシンセサイザーのみで1997年の「Dauði Baldrs」を制作した。この経緯自体が示すように、ブラックメタルの周辺には暴力と極右思想の問題が深く絡んでおり、ダークアンビエントの一部もその文脈を引きずっている。並行してMortiisはEmperorを脱退後に、擬似的な中世ファンタジーの世界観を持つダンジョン・シンセという派生を1993年頃に立ち上げた。1990年代後半以降は、ゲーム音楽との結びつきが強まる。1994年の「Doom」や2004年以降の「Silent Hill」「Dead Space」といったホラー作品の音響設計が、ダークアンビエントの語彙をそのまま採用した。2010年代にはCryo Chamberというレーベルが登場し、Lovecraftの神話体系に基づく大規模な共作企画で新世代の作家を組織し、YouTubeでの数時間の連続再生という形態で予想外に広い聴衆を獲得している。</p>
