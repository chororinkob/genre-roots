<h1>Latin Jazz（ラテンジャズ）とは</h1>
<p>ジャズの和声と即興を、ラテンアメリカ、とりわけキューバとブラジルのリズム体系の上に載せた音楽である。二つの大きな系統がある。ひとつはアフロ・キューバン系で、二本の木の棒で打たれるクラーベという非対称なリズムの型が全体の骨格を決める</p>
<p>ジャズの和声と即興を、ラテンアメリカ、とりわけキューバとブラジルのリズム体系の上に載せた音楽である。二つの大きな系統がある。ひとつはアフロ・キューバン系で、二本の木の棒で打たれるクラーベという非対称なリズムの型が全体の骨格を決める。この型は二小節を一組として、片方に三つ、もう片方に二つの打点を置くもので、演奏者は全員がこの見えない枠に従う。低音は拍の頭を鳴らさず、その手前や後ろへずらして置くトゥンバオという型を刻み、ピアノは和音を分解した反復音型を弾き続ける。打楽器はコンガ、ボンゴ、ティンバレス、マラカスが重なり、それぞれが異なる周期を刻む。もうひとつはブラジル系で、こちらはボサノヴァやサンバに由来し、より軽く跳ねた二拍子と、複雑な和声を特徴とする。いずれの系統でも、管楽器やピアノによる即興の独奏がジャズと同様に回されるが、独奏者は常にリズムの型を意識しなければならず、拍の裏を強調する語法が求められる。テンポは中庸から速く、曲は5分から10分に及ぶ。ジャズの自由な即興と、動かしがたい定型のリズムとの緊張が、この分野の面白さの核心である。</p>
<h2>成り立ち</h2><p>起点は1940年代のニューヨークである。当時、ハーレムやブロンクスにはキューバとプエルトリコからの移民が大量に流入しており、ジャズの演奏者たちと日常的に接触していた。決定的な役割を果たしたのがキューバ出身のMario Bauzáである。彼はジャズの楽団で演奏した経験を持ち、義兄弟のMachitoが率いる楽団の音楽監督として、1943年、ジャズの和声とアフロ・キューバンのリズムを構造的に統合した楽曲を作った。これがこの分野の最初の成果とされる。1947年にはDizzy Gillespieが、キューバの打楽器奏者Chano Pozoを自らの楽団に迎え入れる。二人は共通の言語を持たなかったが音で意思疎通し、その共作は今日まで演奏され続けている。しかしChano Pozoは翌1948年、ハーレムの酒場で麻薬の取引をめぐる諍いから射殺された。33歳だった。1950年代にはTito Puenteがティンバレス奏者として、ニューヨークの舞踏場を席巻する。もうひとつの系統は1960年代前半に開かれた。ブラジルで生まれたボサノヴァが、アメリカのサックス奏者Stan Getzによって紹介され、1964年にJoão GilbertoとAntônio Carlos Jobimを迎えて録音された作品は世界的な大成功を収めた。ここで無名だったAstrud Gilberto が急遽歌ったことが、この音楽の国際的な普及を決定づけている。1959年の革命後、キューバとアメリカの国交が断絶したことで、両者の直接的な交流は数十年にわたって途絶えた。しかしキューバ国内では独自の発展が続き、1970年代にChucho Valdésが率いたIrakereが、ジャズとキューバの伝統と現代音楽を統合した高度な音楽を作り上げる。現在では、ラテンアメリカ各国の音楽とジャズの交配は当然のこととなり、この分野は特定の様式というより、ジャズの世界的な広がりそのものを示す領域となっている。</p>
