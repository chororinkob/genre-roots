<h1>Latin Jazz（ラテンジャズ）とは</h1>
<p>ラテン・ジャズは、ジャズの和音と即興を、ラテンアメリカ、とりわけキューバとブラジルのリズムの仕組みの上に載せた音楽だ。大きな系統が二つある。 ひとつはアフロ・キューバン系だ。ここでは、2本の木の棒で打つクラーベという非対称なリズム</p>
<p>ラテン・ジャズは、ジャズの和音と即興を、ラテンアメリカ、とりわけキューバとブラジルのリズムの仕組みの上に載せた音楽だ。大きな系統が二つある。

ひとつはアフロ・キューバン系だ。ここでは、2本の木の棒で打つクラーベという非対称なリズムの型が、全体の骨組みを決める。この型は2小節を一組にして、片方に三つ、もう片方に二つの打点を置く。演奏者は全員が、この目に見えない枠に従う。

低音はしばしば、拍の頭の直前の音を次の頭まで引き延ばし、頭そのものは鳴らさない。この型をトゥンバオという。ピアノは和音を一音ずつに分けて、同じ形をくり返し弾き続ける。打楽器はコンガ、ボンゴ、ティンバレス、マラカスが重なる。各パートは1小節または2小節のパターンを持つが、すべて2小節のクラーベに合わせる。

もうひとつはブラジル系で、ボサノヴァやサンバから来ている。スウィングしない、ストレートな2拍子の感覚と、複雑な和音が特徴だ。

どちらの系統でも、管楽器やピアノによる即興のソロが、ジャズと同じように順番に回される。ただし、ソロを弾く人は常にリズムの型を意識しなければならない。クラーベに沿ったフレーズ感が求められる。

テンポは遅めから速いものまで幅がある。曲の長さも、4〜5分の曲から10分を超えるジャムまで幅がある。Machito楽団のジャムは、10〜15分の長さだった。ジャズの自由な即興と、動かしがたい決まったリズムとの緊張が、この分野のおもしろさの中心である。</p>
<h2>成り立ち</h2><p>定説では、本格的な起点は1940年代のニューヨークとされる。当時、イースト・ハーレムでは住民の大半がプエルトリコ系だった。キューバからも音楽家を中心に人が移ってきた。彼らはジャズの演奏者たちと、日常的に接していた。

決定的な役割を果たしたのは、キューバ出身のMario Bauzáだ。彼はジャズの楽団で演奏した経験を持っていた。そして義兄弟のMachitoが率いる楽団の音楽監督として、1943年、ジャズの和声とアフロ・キューバンのリズムを、曲の骨組みから結びつけた曲を作った。この曲「Tanga」は、定説ではクラーベに基づく最初のジャズ曲とされる。録音は1948年12月、発売は1949年である。それ以前にも、原型はあった。Jelly Roll Mortonが語った「スパニッシュ・ティンジ」という考え方や、Juan Tizolの「Caravan」（Duke Ellingtonとの連名、1936〜37年）である。

1947年には、Dizzy Gillespieが、キューバの打楽器奏者Chano Pozoを自分の楽団に迎え入れる。2人は共通の言葉を持たなかったと言われる(通訳がいたとする話もある)。それでも音で意思を通わせ、その共作は今も演奏され続けている。しかしChano Pozoは翌1948年、ハーレムの酒場で、賭け屋で大麻の売人でもあったEusebio Muñozに撃ち殺された(動機は諸説ある)。33歳だった。1950年代には、Tito Puenteがティンバレス奏者として、ニューヨークのダンスホールを席巻する。

もうひとつの系統は、1960年代前半に開かれた。ブラジルで生まれたボサノヴァを、アメリカのギタリストCharlie Byrdとサックス奏者Stan Getzが取り上げた。1963年にはJoão GilbertoとAntônio Carlos Jobimを迎えて録音が行われ、1964年に発売された作品は世界的な大成功を収めた。ここで、無名だったAstrud Gilbertoが歌った。起用の経緯には諸説あるが、Astrudの英語詞は「The Girl from Ipanema」のヒットを大きく後押しした。

一方、1959年の革命の後、1961年にキューバとアメリカの国交が断絶し、両国の公式な交流は制限された。それでもキューバ国内では、独自の発展が続いた。1970年代には、Chucho Valdésが率いたIrakereが、ジャズとキューバの伝統と現代音楽を一つにした高度な音楽を作り上げる。1977年には、Dizzy GillespieやStan Getzがジャズ・クルーズでハバナを訪れ、共演もした。Irakereは1978年にニューポート・ジャズ・フェスティバルに出演し、1980年にはグラミー賞を受賞している。

今では、ラテンアメリカ各国の音楽とジャズを掛け合わせるのは、当たり前のことになった。この分野は特定のスタイルというより、ジャズの世界的な広がりそのものを示す領域になっている。</p>
