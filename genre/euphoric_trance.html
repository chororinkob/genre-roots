<h1>Euphoric Trance（ユーフォリックトランス）とは</h1>
<p>ユーフォリック・トランスは、トランスの中でも、感情の盛り上がりそのものを最大にすることに、すべてを合わせた系統だ。名称の euphoric は多幸感を意味する。目標は、聴き手を涙が出るほどの感動へ押し上げることにある。 テンポは目</p>
<p>ユーフォリック・トランスは、トランスの中でも、感情の盛り上がりそのものを最大にすることに、すべてを合わせた系統だ。名称の euphoric は多幸感を意味する。目標は、聴き手を涙が出るほどの感動へ押し上げることにある。

テンポは目安として135〜140BPM前後。四つ打ちのキックとオフビート・ベースという骨組みは共通だが、この系統ではメロディーの比重が圧倒的に大きい。

主なメロディーは長い音符で作られる。上がって頂点に達し、また下がるという、はっきりした弧を描くことが多い。和音は長調の和音に基づく流れが多いとされる。

音色は、スーパーソウ波形を大量に重ねて作る。コーラスとリヴァーブで幅を極端に広げた、壁のような厚みが特徴だ。

曲の組み立ては、最も重要な要素だ。序盤にリズムだけの導入を置き、中盤ですべての打楽器を止めるブレイクダウンへ入る。ブレイクダウンは2分近くに及ぶこともある。ピアノや弦楽器風のパッドと歌が、リズムなしで感情を最大までため込んでいく。

その後、白色雑音のライザーが少しずつ音量と音程を上げる。多くの曲では、スネアの連打は4分音符から32分音符まで速まり、一瞬の完全な無音を挟んで、キックと主旋律が同時に戻る。

ヴォーカルは、女性の伸びやかな歌唱が典型的だ。飛翔、解放、永遠といった抽象的な言葉を歌う。アップリフティング・トランスとほぼ同じ意味で扱われることも多い。</p>
<h2>成り立ち</h2><p>ユーフォリック・トランスは、1990年代後半から2000年代前半にかけて、オランダ、ドイツ、イギリスで広がった(名称は1996年にプログレッシブ・トランスの後に生まれたとされる)。

1997年には、Gatecrasherがシェフィールドの Republic(定員1350人)に定着した。Godskitchenは、ケンブリッジでの初回イベントの後、1996年5月にノーサンプトンで毎週開催を始めた。その後、コヴェントリー、1997年のミルトン・キーンズ(4,000人規模)、バーミンガムと広がった。数千人規模の特設イベントも開くようになり、大型会場の普及と並行して広がった。

制作の面では、オランダの貢献が大きい。Ferry Corstenは複数の名義で活動し、とりわけSystem Fとして「Out of the Blue」を発表した(正式発売は1999年、プロモ先行は1998年)。この曲が、この系統の代表作となった。同じくTiëstoも、1999年の「Sparkles」や、Delerium「Silence」のリミックス(2000年)で、世界的な成功を収めた。

Armin van Buurenは、2001年からラジオ番組A State of Tranceを始めた。そして、世界的に影響力のあるラジオ番組・イベントブランドを築いた。

ドイツではATBやPaul van Dykが、イギリスではAbove &amp; Beyond(2000年結成)、Chicane、Solarstoneが加わった。Above &amp; Beyondは2000年(一説に1999年夏)にレーベルAnjunabeatsを設立した。このレーベルは、この系統の中心的な組織になっている。フィンランドのSuper8 &amp; Tab、オーストラリアのtyDiといった各国の作り手も続いた。

1990年代末〜2000年代初頭が、商業的な頂点だった。イビサ島のクラブとイギリスの大型イベントが、市場を支えた。

しかし、2002年頃から反動が起きる。感傷的すぎる、型どおりで先が読める、薬物の効果に頼った安易な感動だ、といった批判が、批評家や、アンダーグラウンド志向のダンス音楽ファンから向けられた。この時期、トランス全体が「ダサい音楽」という扱いを受けた。商業的な勢いは落ち、一部のDJはほかの音に移った。

それでも、共同体は解散しなかった。Armin van BuurenのA State of Tranceが世界各地で大型イベントを続け、存続の核が保たれた。トランスの商業的成功は、2010年前後にEDMが盛んになる下地になった。

近年は、当時の作品が若い世代に再発見されている。2020年代には、トランスの復興が各地で報告されている。</p>
