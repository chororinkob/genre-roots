<h1>Euphoric Trance（ユーフォリックトランス）とは</h1>
<p>トランスの中でも、感情の高揚そのものを最大化することに全てを最適化した系統。名称の euphoric は多幸感を意味し、聴き手を涙が出るほどの感動へ押し上げることが設計目標になる。テンポは138〜142BPM。四つ打ちのキックとオ</p>
<p>トランスの中でも、感情の高揚そのものを最大化することに全てを最適化した系統。名称の euphoric は多幸感を意味し、聴き手を涙が出るほどの感動へ押し上げることが設計目標になる。テンポは138〜142BPM。四つ打ちのキックとオフビート・ベースの骨格は共通だが、この系統では旋律の比重が圧倒的に大きい。主旋律は長い音符で構成され、上行して頂点に達し下降するという明確な弧を描く。和声は自然短音階の循環が基本で、サブドミナントから始まる進行によって切迫感と憧憬を同時に生む。音色はスーパーソウ波形を大量に重ね、コーラスとリヴァーブで幅を極端に広げた壁のような厚みが特徴。曲の構成が最も重要で、序盤にリズムだけの導入を置き、中盤で全ての打楽器を止めるブレイクダウンへ入る。ブレイクダウンは2分近くに及ぶこともあり、ピアノや弦楽器風のパッドと歌が、リズムなしで感情を最大まで蓄積する。その後、白色雑音のライザーが徐々に音量と音程を上げ、スネアの連打が4分音符から32分音符まで加速し、一瞬の完全な無音を挟んでからキックと主旋律が同時に戻る。この復帰の瞬間が全体の存在理由といってよい。ヴォーカルは女性の伸びやかな歌唱で、飛翔、解放、永遠といった抽象的な言葉を歌う。アップリフティング・トランスとほぼ同義で扱われることも多い。</p>
<h2>成り立ち</h2><p>1990年代末から2000年代前半にかけて、イギリスとオランダ、ドイツで確立した。直接の起点はイギリスのクラブ文化にある。1997年前後、シェフィールドのGatecrasherとバーミンガムのGodskitchenが数千人規模のイベントを定期開催するようになり、そこで求められたのが、巨大な会場で数千人が同時に感情の頂点を共有できる音楽だった。ブレイクダウンを極端に引き伸ばし、復帰の瞬間に全員が両手を上げるという体験が、この形式の設計目標として明確化された。制作面ではオランダの貢献が大きい。Ferry Corstenは複数の名義で、とりわけSystem Fとして1999年に「Out of the Blue」を発表し、この系統の代表作となった。同じくTiestoは1999年の「Sparkles」やDelerium「Silence」のリミックス(2000年)で世界的成功を収めた。Armin van Buurenは2001年からラジオ番組A State of Tranceを開始し、この音楽の世界的な流通網を構築した。ドイツではATBやPaul van Dykが、イギリスではAbove &amp; Beyond(2000年結成)、Chicane、Solarstoneが加わった。Above &amp; Beyondは2006年にレーベルAnjunabeatsを本格化させ、この系統の中心的な組織になっている。フィンランドのSuper8 &amp; Tab、オーストラリアのtyDiといった各国の作家も続いた。2000年から2003年が商業的な頂点で、イビサ島のクラブとイギリスの大型イベントが市場を支えた。しかし2004年前後から反動が起きる。感傷的すぎる、定型的で予想がつく、薬物の効果に依存した安易な感動であるといった批判が、テクノやハウス、そしてミニマルの側から集中的に向けられた。この時期にトランス全体が「ダサい音楽」という扱いを受け、多くのクラブが編成を変えた。市場は大きく縮小し、いくつもの主要レーベルが閉鎖した。しかし共同体は解散せず、Armin van BuurenのA State of Tranceが世界各地で大型イベントを続けたことで存続の核が保たれた。2010年前後のEDMの隆盛では、この系統が完成させた「長いブレイクダウンと爆発的な復帰」の構造が、そのままビッグルームやプログレッシブ・ハウスに移植された。近年は当時の作品が若い世代に再発見され、2020年代にはトランスの復興が各地で報告されている。</p>
