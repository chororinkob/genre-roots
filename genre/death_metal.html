<h1>Death Metal（デスメタル）とは</h1>
<p>デスメタルは、極限まで重く暗く攻撃的に設計された、ヘヴィメタルの一派だ。 ギターは、通常より低い調弦を使う。たとえば全音下げ（全部の弦を全音低く合わせること）や、ドロップC（低音弦をさらに下げた調弦）などだ。弾き方は、パーム・ミュ</p>
<p>デスメタルは、極限まで重く暗く攻撃的に設計された、ヘヴィメタルの一派だ。

ギターは、通常より低い調弦を使う。たとえば全音下げ（全部の弦を全音低く合わせること）や、ドロップC（低音弦をさらに下げた調弦）などだ。弾き方は、パーム・ミュートで低音弦を刻む。

旋律や和音は、短調、または無調的な要素が用いられる。ソロにも、半音階的・無調（調の中心がない）的な要素のある速弾きが見られる。

ドラムは、ダブルキックやブラストビートが多用される。バスドラムはツインペダル（バスドラムを2本の足で踏む装置）を使い、16分音符で高速に連打される（例：テンポ200 BPM前後で、毎分数百打以上）。

歌唱は、グロウルまたはデスヴォイスと呼ばれる、低く唸る発声だ。声帯より上の組織（いわゆる仮声帯など）を震わせて出すことが多い。身につけるには訓練が必要になる。歌詞は聴き取りにくい。

歌詞の主題は、死、解剖学的な描写、戦争、反宗教、そして人間の身体の脆さが中心だ。ほかに、宗教、哲学、SF、政治にも及ぶ。ホラー映画的な誇張と、現実的な残酷さの両方を含む。

曲の組み立ては、リフの継ぎ足しによる。テンポや拍子が急に切り替わる曲も多い。演奏には高度な体力と正確さが要求される。</p>
<h2>成り立ち</h2><p>1980年代半ば、スラッシュメタルがさらに過激化する中で、デスメタルは生まれた。

名称の由来には諸説ある（Possessedの1984年のデモ「Death Metal」、Deathの1984年のデモ「Death by Metal」など）。この語は、1983年の同人誌や、Hellhammerらの1984年のスプリット盤『Death Metal』にも見られる。PossessedのJeff Becerraは、自分が名付けたと述べている。フロリダ州アルタモンテスプリングスのバンドDeathの中心人物、Chuck Schuldinerは、1983年または1984年にMantasの名で結成した。1987年のアルバムScream Bloody Goreが、ジャンルの出発点とされる。ただしSchuldiner自身は、創始者という評価に否定的だった。

より早い時期のPossessedも、先行例とされる。サンフランシスコ・ベイエリアのバンドで、1985年の作品Seven Churchesがある。この二組のどちらが最初かは、長く議論されている。

1980年代末から1990年代初頭にかけて、フロリダ州タンパが世界的な中心地となった。Morrisound Recordingスタジオで録音された作品群、すなわちMorbid Angel、Obituary、Deicide、Cannibal Corpseらの音は、Morris兄弟とScott Burnsらが手がけた。

並行してスウェーデンでも、独自の流れが生まれた。まずNihilist（のちのEntombed）が先駆けとなる。続いて、ストックホルムのEntombed、Dismember、そしてゴットランド島ヴィスビーのGrave らが、Boss HM-2という歪みペダルを最大まで上げた、独特の粗い音を広めた。いわゆるスウェディッシュ・バズソー・トーンだ。こうして、フロリダ勢とは異なる系統を築いた。

メロディック・デスメタルは、Carcassらが先駆となった。イェーテボリのAt the Gates、In Flames、Dark Tranquillityの3組が、旋律を重視したこのスタイルを発展・定着させた（3組を起源とみる見方もある）。これが、後の世界的な流行につながった。

しかし、社会的にはしばしば批判や規制の対象となった。Cannibal Corpseの作品は、オーストラリアで全作品が販売禁止（1996年）、ドイツで複数作品が指定または没収の対象となった。2014年のロシア・ツアーでは、8公演中6公演が中止された。1990年代の米国では、上院議員らが批判する運動の標的にもなった。

Chuck Schuldinerは晩年、技巧と構成をより追求した作品を残した。だが、脳腫瘍のため2001年に34歳で死去している。

現在は、世界中に地域ごとのシーンが存在する。テクニカル・デスメタル、ブルータル・デスメタル、デスコアなど、数多くの細かいスタイルに分岐している。</p>
