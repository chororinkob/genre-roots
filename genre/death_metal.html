<h1>Death Metal（デスメタル）とは</h1>
<p>極限まで重く暗く攻撃的に設計されたヘヴィメタルの一派。ギターは通常より低い調弦、たとえば全音下げ（全部の弦を全音低く合わせること）やドロップC（低音弦をさらに下げた調弦）などを用い、パーム・ミュートで低音弦を刻む。旋律線には半音階</p>
<p>極限まで重く暗く攻撃的に設計されたヘヴィメタルの一派。ギターは通常より低い調弦、たとえば全音下げ（全部の弦を全音低く合わせること）やドロップC（低音弦をさらに下げた調弦）などを用い、パーム・ミュートで低音弦を刻む。旋律線には半音階（半音ずつ上下する音の並び）、減5度の三全音（不安定に響く音程）、不協和な音程が用いられ、短調、または調の中心を感じさせない無調的な響きが使われることもある。ソロにも、半音階的・無調（調の中心がない）的な要素のある速弾きが見られる。ドラムはダブルキックやブラストビート（スネアとバスドラムを交互に極めて高速で打ち続ける技法）が多用され、音の壁のように聞こえる。重く遅いグルーヴを持ち味とするバンドもある。バスドラムはツインペダル（バスドラムを2本の足で踏む装置）を使い、16分音符で高速に連打される（例：テンポ200前後で、毎分数百打以上）。歌唱はグロウルまたはデスヴォイスと呼ばれる低く唸る発声で、声帯より上の組織（いわゆる仮声帯など）を震わせて出し、身につけるには訓練が必要になる。歌詞は聴き取りにくい。曲構成はリフの継ぎ足しによるもので、テンポと拍子が予告なく切り替わる。歌詞は死、解剖学的な描写、戦争、反宗教、そして人間の身体の脆さといった主題を扱い、ホラー映画的な誇張と現実的な残酷さの両方を含む。演奏には高度な体力と正確さが要求され、技術競争の側面も強い。</p>
<h2>成り立ち</h2><p>1980年代半ば、スラッシュメタルがさらに過激化する過程で生まれた。名称の由来には諸説あり（Possessedの1984年のデモ「Death Metal」、Deathの1984年のデモ「Death by Metal」など）、フロリダ州アルタモンテスプリングスのバンドDeathの中心人物Chuck Schuldinerは、1983年または1984年にMantasの名で結成し、1987年のアルバムScream Bloody Goreがジャンルの出発点とされる。Schuldiner自身は創始者という評価に否定的だった。より早い時期のPossessedというサンフランシスコ・ベイエリアのバンドの1985年の作品Seven Churchesも先行例とされ、この二組のどちらが最初かは長く議論されている。1980年代末から1990年代初頭にかけて、フロリダ州タンパが世界的な中心地となった。重要な役割を果たしたのが、Morrisound Recordingスタジオで、Morris兄弟とScott Burnsらが手がけた録音で、Morbid Angel、Obituary、Deicide、Cannibal Corpseらの作品が生まれた。並行してスウェーデンでは、ストックホルムのEntombed、Dismember、そしてゴットランド島ヴィスビーのGrave らが、Boss HM-2という歪みペダルを最大まで上げた独特の粗い音、いわゆるスウェディッシュ・バズソー・トーンを、先駆けとなったNihilist（のちのEntombed）に続いて広め、フロリダ勢とは異なる系統を築いた。同国イェーテボリではAt the Gates、In Flames、Dark Tranquillityが、英国のCarcassらの先駆を受けて旋律を重視したメロディック・デスメタルを発展させ、後の世界的な流行につながった（この3組を起源とみる見方もある）。社会的にはしばしば批判や規制の対象となり、Cannibal Corpseの作品はオーストラリア（1996年）で全作品が販売禁止となり、ドイツでも複数の作品が指定や没収の対象となり、ロシアでは公演が中止され、1990年代の米国では上院議員らが批判する運動の標的にもなった。Chuck Schuldinerは晩年、技巧と構成をより追求した作品を残したが、脳腫瘍のため2001年に34歳で死去している。現在は世界中に地域ごとのシーンが存在し、テクニカル・デスメタル、ブルータル・デスメタル、デスコアなど多数の下位様式に分岐している。</p>
