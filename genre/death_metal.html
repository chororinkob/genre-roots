<h1>Death Metal（デスメタル）とは</h1>
<p>極限まで重く暗く攻撃的に設計されたヘヴィメタルの一派。ギターは通常より低い調弦、たとえば全音下げ（全部の弦を全音低く合わせること）やドロップC（低音弦をさらに下げた調弦）などを用い、パーム・ミュートで低音弦を刻む。旋律線には半音階</p>
<p>極限まで重く暗く攻撃的に設計されたヘヴィメタルの一派。ギターは通常より低い調弦、たとえば全音下げ（全部の弦を全音低く合わせること）やドロップC（低音弦をさらに下げた調弦）などを用い、パーム・ミュートで低音弦を刻む。旋律線には半音階（半音ずつ上下する音の並び）、減5度の三全音（不安定に響く音程）、そして不協和な音程が意図的に配される。短調の曲が多く、調の中心がはっきりしない（無調的な）響きが使われることもある。ソロにも、半音階的・無調（調の中心がない）的な要素のある速弾きが見られる。ドラムではダブルキック（バスドラムを2回続けて踏む奏法）やブラストビートと呼ばれる技法がよく使われる。ブラストビートは、スネアとバスドラムを交互に極めて高速で打ち続けて、音の壁のような迫力を作る。バスドラムはツインペダル（バスドラムを2本の足で踏む装置）を使い、16分音符で高速に連打される（例：テンポ200前後で、毎分数百打以上）。歌唱はグロウルまたはデスヴォイスと呼ばれる低く唸る発声で、声帯より上の組織（いわゆる仮声帯など）を震わせて出し、身につけるには訓練が必要になる。歌詞は聴き取りにくい。曲構成はリフの継ぎ足しによるもので、テンポや拍子が予告なく切り替わることもよくある。歌詞は死、解剖学的な描写、戦争、反宗教、哲学、SF、政治、そして人間の身体の脆さといった主題を扱い、ホラー映画的な誇張と現実的な残酷さの両方を含む。演奏には高度な体力と正確さが要求される。</p>
<h2>成り立ち</h2><p>1980年代半ば、スラッシュメタルがさらに過激化する過程で生まれた。名称の由来には諸説あり（Possessedの1984年のデモ「Death Metal」、Deathの1984年のデモ「Death by Metal」など）、フロリダ州アルタモンテスプリングスのバンドDeathの中心人物Chuck Schuldinerは、1983年または1984年にMantasの名で結成し、1987年のアルバムScream Bloody Goreがジャンルの出発点とされる。Schuldiner自身は創始者という評価に否定的だった。より早い時期のPossessedというサンフランシスコ・ベイエリアのバンドの1985年の作品Seven Churchesも先行例とされ、この二組のどちらが最初かは長く議論されている。1980年代末から1990年代初頭にかけて、フロリダ州タンパが世界的な中心地となった。中心になったのは、Morrisound Recordingというスタジオである。ここでは、Morris兄弟（Jim MorrisとTom Morris）とScott Burnsらが録音を手がけた。ここで録音された作品には、Morbid Angel、Obituary、Deicide、Cannibal Corpseらのものがある。並行してスウェーデンでは、Entombedの前身バンドNihilistが、Boss HM-2という歪みペダルをつまみを最大まで上げて使う独特の粗い音を先に使い始め、ストックホルムのEntombed、Dismember、そしてゴットランド島ヴィスビーのGrave らがそれを広めた。この音はいわゆるスウェディッシュ・バズソー・トーンと呼ばれ、フロリダ勢とは異なる系統を築いた。旋律を重視したメロディック・デスメタルは、イギリスのCarcassが1993年のアルバムHeartworkで先駆けとなり、スウェーデンのイェーテボリのAt the Gates、In Flames、Dark Tranquillityがさらに発展させて定着させた（この三組が起源だとみる見方もある）。これが後の世界的な流行につながった。社会的にはしばしば批判や規制の対象となった。Cannibal Corpseの作品は、オーストラリアで全作品の販売が禁止され（1996年）、ドイツでは複数の作品が、未成年への販売などを制限する指定や、裁判所による没収の対象となり、ロシアでは2014年のツアーで、予定された8公演のうち6公演が中止され、1990年代の米国では上院議員らが批判する運動の標的にもなった。Chuck Schuldinerは晩年、技巧と構成をより追求した作品を残したが、脳腫瘍のため2001年に34歳で死去している。現在は世界中に地域ごとのシーンが存在し、テクニカル・デスメタル、ブルータル・デスメタル、デスコアなど多数の下位様式に分岐している。</p>
