<h1>Death Metal（デスメタル）とは</h1>
<p>極限まで重く暗く攻撃的に設計されたヘヴィメタルの一派。ギターは通常より低い調弦、たとえば全音下げやドロップCなどを用い、パーム・ミュートで低音弦を刻む。旋律線には半音階、減五度の三全音、そして不協和な音程が意図的に配され、調性の中</p>
<p>極限まで重く暗く攻撃的に設計されたヘヴィメタルの一派。ギターは通常より低い調弦、たとえば全音下げやドロップCなどを用い、パーム・ミュートで低音弦を刻む。旋律線には半音階、減五度の三全音、そして不協和な音程が意図的に配され、調性の中心を感じさせないようにしてある。ソロはブルースの音階から離れ、無調的に上下する速弾きが主流。ドラムはブラストビートと呼ばれる技法が核で、スネアとバスドラムを交互に極めて高速で打ち続けることで、拍の感覚を消し去るような音の壁を作る。バスドラムはツインペダルで一分あたり200回を超える速度で連打される。歌唱はグロウルまたはデスヴォイスと呼ばれる、声帯を締めて低く唸る発声で、歌詞は聴き取れないことが前提となる。この発声は横隔膜からの息の圧力で作られ、独自の訓練を要する。曲構成はリフの継ぎ足しによるもので、テンポと拍子が予告なく切り替わる。歌詞は死、解剖学的な描写、戦争、反宗教、そして人間の身体の脆さといった主題を扱い、ホラー映画的な誇張と現実的な残酷さの両方を含む。演奏には高度な体力と正確さが要求され、技術競争の側面も強い。</p>
<h2>成り立ち</h2><p>1980年代前半、スラッシュメタルがさらに過激化する過程で生まれた。名称の由来はフロリダ州タンパのバンドDeathで、中心人物Chuck Schuldinerが1983年にMantasの名で結成し、1987年のアルバムScream Bloody Goreがジャンルの出発点とされる。彼はより早い時期のPossessedというサンフランシスコのバンドの1985年の作品Seven Churchesにも先行例を認めており、この二組のどちらが最初かは長く議論されている。1980年代末から1990年代初頭にかけて、フロリダ州タンパが世界的な中心地となった。決定的だったのはレコーディング技術者Scott Burnsと、彼が働いたMorrisound Recordingスタジオで、ここで録音された作品群、すなわちMorbid Angel、Obituary、Deicide、Cannibal Corpseらの音が、ジャンルの標準的な音像を定めた。並行してスウェーデンのストックホルムでは、Entombed、Dismember、Grave らが、Boss HM-2という歪みペダルを最大まで上げた独特の粗い音、いわゆるスウェディッシュ・バズソー・トーンを確立し、フロリダ勢とは異なる系統を築いた。同国イェーテボリではAt the Gates、In Flames、Dark Tranquillityが旋律を重視したメロディック・デスメタルを生み出し、後の世界的な流行につながった。社会的には常に激しい非難の的で、Cannibal Corpseの作品はドイツ、オーストラリア、ニュージーランドなどで販売禁止や輸入規制の対象となり、1990年代の米国では議会での議論にも取り上げられた。Chuck Schuldinerは晩年、技巧と構成をより追求した作品を残したが、脳腫瘍のため2001年に34歳で死去している。現在は世界中に地域ごとのシーンが存在し、テクニカル・デスメタル、ブルータル・デスメタル、デスコアなど多数の下位様式に分岐している。</p>
