<h1>Burning Spirits（バーニング・スピリッツ）とは</h1>
<p>一言でいうと、ヘヴィメタルの疾走感を取り入れた日本のハードコア・パンクのスタイルだ。代表曲22曲を動画で聴け、ルーツと影響のつながりを地図でたどれる。</p>
<p>一言でいうと、ヘヴィメタルの疾走感を取り入れた日本のハードコア・パンクのスタイルだ。中心になる楽器は、歪みの強いエレキギター2本とベース、ドラムスだ。リードギターがとりわけ重要で、Motörhead風の突進するリフに、NWOBHM（英国産メタルの流れ）を思わせる高音の速弾きソロが重なる。このソロが曲の一番の聴かせどころになる。

和音は単純なパワーコードを土台にしつつ、曲の途中で急にコード進行が切り替わる劇的な展開を持ち込む。リードはメロディアスで、悲壮感のある音階を高く歌い上げるように弾く。だから荒々しいのに不思議と高揚感が残る。

リズムは速い4拍子が基本で、ドラムは180〜200 BPM前後の連打に近い速さでビートを刻む。アクセントはまず1拍目に来て、ブレイクで一気に止めてから畳みかける。精度の高いツーバス的な足回りより、前に倒れた重量感のある8分打ちが好まれる。

歌い方は叫び声に近いシャウトと、うなりを含んだハイトーンのボーカルだ。言葉よりも声の勢いが前に出るが、サビでは仲間が声を合わせて歌えるキャッチーな口返し（リフレイン）を挟む。

歌詞の主題は、苦境に耐えること、自由、反骨、自分の道を曲げずに生きるという自分決定の精神だ。答え合わせの八月も負けを認めない意志をはっきり唱える。</p>
<h2>成り立ち</h2><p>Burning Spiritsは、1988年に東京で始まった企画ライブの名前から広まった日本のハードコアのスタイルだ。出発点をつくったのは、DEATH SIDEのボーカルのISHIYAと、鉄アレイのベーシストのKATSUTAの2人だ。1980年代後半、2人は所属バンドの枠を越えて合同ツアーを企てるようになり、その企画に名前が要った。名前の案を出したのはKATSUTAで、由来はプロレスだ。ブルーザー・ブロディが新日本プロレスに移籍した際、「猪木の目にバーニングスピリットを見た」と語ったエピソードから取り、その場で即決した。1988年のゴールデンウィークの鉄アレイとDEATH SIDEのツアーが最初とISHIYAは述べている。同年の大晦日には、新宿アンチノックで行われていたLAST BOMB/FINAL BOMBS主宰のオールナイト企画「BOMB OF BLAZE」を引き継ぎ、以後、大晦日のBURNING SPIRITSが定例になった。夏には全国ツアーを回り、春と秋にも日本を半周した。しかし、DEATH SIDEはボーカルとギターの度重なる軋轢から1990年代半ばに解散する。ある種の悲劇はこれで終わらない。ギタリストのChelsea（岸田裕之、1967〜2007年）は2007年に亡くなり、シーンから中心のギターを奪った。それでも火は消えなかった。解散後、ChelseaはPaintboxを結成し、ISHIYAとYouはFORWARDを始め、ドラムのMukaiはJudgementで活動した。KATSUTAは鉄アレイの脱退後にEXTINCT GOVERNMENTやPUNK ADDICTをやりながら、毎年ハロウィンの企画を守り続けた。DEATH SIDEと鉄アレイは、いずれも同タイトルの曲「BURNING SPIRITS」を持つ。音楽面では、1980年代半ばのGudonやPoison Artsが置いたメタリックな土台のうえに、DEATH SIDEの1st EP『Satisfy the Instinct』（1987年）や1stフルアルバム『Wasted Dream』（1989年）、『Bet on the Possibility』（1991年）、鉄アレイのアルバム（1991年）、Bastardの『Wind of Pain』（1992年）が出来上がった。CrudeやInsane Youth、Mustang、Warhead、Nightmareらもこの流れに連なる。1990年代末から2000年代初めには、TragedyやFrom Ashes Riseら米国のバンドがこの語法をcrustやd-beatと混ぜ、neocrustと呼ばれる流れの一部になった。海外ではSelfish、Violent Spirit、Teargasなど多くの後継バンドが生まれ、この音を指すカテゴリーとして「BURNING SPIRITS HARDCORE」が使われ始めた。国内でも横浜のDIYレーベル、BURNING SPIRITS RECORDSがオムニバス盤を発表してシーンを支えた。現在も大晦日の新宿アンチノックでの開催が続いており、FORWARDと鉄アレイが中心になって企画を守り続けている。なお、この名前は1970年に録音された米国のジャズ・サックス奏者Sonny Simmonsのアルバムの題名でもあるが、こちらとは無関係だ。</p>
