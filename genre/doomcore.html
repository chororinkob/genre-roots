<h1>Doomcore（ドゥームコア）とは</h1>
<p>ハードコア・テクノの歪んだ音を、極端に遅い速度で鳴らす様式である。ドゥームコアという名が示すとおり、破滅と重さを主題としている。テンポは一分間に60から90拍程度まで落とされ、同系統の他の様式が200拍前後で走るのとは正反対の設計</p>
<p>ハードコア・テクノの歪んだ音を、極端に遅い速度で鳴らす様式である。ドゥームコアという名が示すとおり、破滅と重さを主題としている。テンポは一分間に60から90拍程度まで落とされ、同系統の他の様式が200拍前後で走るのとは正反対の設計になっている。ただし音そのものは減速で穏やかになるわけではなく、むしろ逆で、ハードコア特有の過剰に圧縮され歪んだバスドラムがそのまま用いられる。速い曲では一瞬で通り過ぎる打撃音が、遅い速度では一発ごとに空間を占領し、余韻が完全に減衰するまで聴かせることになる。この、打撃の全長を聴かされる感覚が重苦しさの正体である。音の隙間には長く伸びる低い持続音や、不協和な和音の塊が敷かれ、旋律らしい旋律はほとんど現れない。使われる音階は短調や、調性の枠から外れた不安定な響きが中心である。声の素材は加工された叫び、映画やニュースからの引用、宗教的な詠唱などで、意味を伝えるためというより不穏さを補強するために置かれる。曲の構成は展開に乏しく、同じ音型を延々と反復しながら少しずつ音を足していく形が多い。聴き手を高揚させるのではなく、圧迫し続けることを目的とした設計である。</p>
<h2>成り立ち</h2><p>1990年代前半、オランダとドイツを中心にハードコア・テクノが速度を上げ続けた時期がある。一分間に180拍から始まった競争は数年で200拍を超え、さらに上を目指す流れが加速していた。この一方向の競争に対する反動として、あえて逆方向へ振り切る発想が現れた。速度を上げれば激しくなるという前提そのものを疑い、遅くすることで別種の重さを得ようとしたのである。同じ発想の転換は他ジャンルでも起きており、メタルの領域では1980年代末にドゥーム・メタルが同じ理由で減速を選んでいる。名称もこの流れを意識して付けられた。決定的な役割を果たしたのはドイツの制作者たちで、1990年代半ばにディージェイ・ボットやモリス、そしてルインズ・オブ・ザ・アースといった名義が、遅く重い作品を発表しはじめた。とりわけドイツのレーベルであるフィッシュカプフやドリーム・トラックスが、この方向の作品を継続的に発表する場となった。同じ頃、オランダの現場ではハードコアの催しの終盤、明け方の時間帯にこうした遅い曲をかける習慣が生まれ、独自の役割を得ていく。長時間踊り続けた聴き手が消耗しきった時間帯に、高速の曲ではなく圧迫する遅い曲を流すという構成である。2000年代以降はインダストリアル・ハードコアと呼ばれる領域と重なり合いながら発展した。ドイツのPCPやフランスの地下の現場と結びつき、商業的な拡大をほとんど志向しないまま独自の圏域を保っている。現在では、実験的な電子音楽やノイズの領域からこの様式に接近する作り手も増え、ダンス音楽というより聴かせるための音響作品として制作されることも多くなった。速度で競わないという最初の選択が、結果としてこの様式を長く生き延びさせている。</p>
