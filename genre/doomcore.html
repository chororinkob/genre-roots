<h1>Doomcore（ドゥームコア）とは</h1>
<p>ドゥームコアは、ハードコア・テクノの歪んだ音を、極端に遅い速度で鳴らすスタイルだ。その名が示すとおり、破滅と重さをテーマにしている。 テンポはおおむね130〜160 BPMとする見方があるが、挙げられる数字は人によってばらばらで、</p>
<p>ドゥームコアは、ハードコア・テクノの歪んだ音を、極端に遅い速度で鳴らすスタイルだ。その名が示すとおり、破滅と重さをテーマにしている。

テンポはおおむね130〜160 BPMとする見方があるが、挙げられる数字は人によってばらばらで、決まりは無いとする作り手も多い。ハードコア・テクノ系では遅めの傾向があり、同じ系統のほかのスタイルが200 BPM前後で走るのとは対照的な作りになっている。

ただし、速度を落としたからといって、音が穏やかになるわけではない。キックには、ほかのハードコアより歪みを抑えた、ドラムマシンTR-909系の音が使われる。音の余韻も、ほかのハードコアより短い。ときには残響が加えられる。

音の隙間には、長く伸びる低い持続音や、不協和な和音の塊が敷かれる。旋律が主役ではない曲が多い。

声の素材には、怖い声や叫びを録った音が使われる。

曲の中では、同じ旋律を繰り返すことが多い。</p>
<h2>成り立ち</h2><p>1990年代前半、オランダ、ベルギー、ドイツを中心に、ハードコア・テクノが速度を上げ続けた時期がある。初期のハードコアは160〜180 BPM前後から始まり、のちに200 BPMを超えるようになった。

その中で、最初期のドゥームコアは、初期ハードコアの暗いインダストリアルな雰囲気を引き継ぐ形で生まれたとされる。多くはMarc Trauner(Acardipane)が別名義で作った。1993年のThe Moverのアルバム『The Final Sickness』の収録曲を、「最初のドゥームコア」と見る向きもある。一方で、1991年に出たThe Moverの『Frontal Sickness Part 1』を、ドゥームコアの始まりと見る声もあり、「最初」には諸説ある。ただし、当時はその語は使われていなかったという見方がある。

中心となったのは、Marc Acardipane(本名Marc Trauner。The Mover、Mescalinum Unitedなどの名義)と、彼が関わったPCP(Planet Core Productions)だ。彼らは1990年代前半にフランクフルトで、その原型を作った。PCPの系列レーベルであるCold Rush Recordsも、この方向の作品を発表する場となった。

PCPが土台を作った。PCPは1989年から1997年まで活動したとされるが、1996年末に最後の作品を出して解散したという見方もある。2000年代初頭には新しい世代の作り手が現れたが、その音は初期のものとはかなり違う。商業的な拡大をほとんど目指さないまま、独自の世界を保っている、という見方がある。

その後も作り手は増え、曲によってテンポの幅は広い。</p>
<h2>代表曲</h2><ul><li>Nightflight (Nonstop to Kaos) (The Mover)</li><li>Doom (The Mover)</li><li>The Final Sickness (PCP)</li><li>The Emperor Takes Place (The Mover)</li><li>Mesmerize (The Mover)</li><li>Reconstructin' Instructions (The Mover)</li><li>Stealth (The Mover)</li><li>Changing Platforms (The Mover)</li><li>Damper (PCP)</li><li>Havoc In Brest Bay (Foglz)</li><li>Outline (PCP)</li></ul>
