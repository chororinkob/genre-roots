<h1>Doomcore（ドゥームコア）とは</h1>
<p>ハードコア・テクノの歪んだ音を、極端に遅い速度で鳴らす様式である。ドゥームコアという名が示すとおり、破滅と重さを主題としている。テンポは一分間におおむね130〜160拍で、ハードコア・テクノ系では最も遅く、同系統の他の様式が200</p>
<p>ハードコア・テクノの歪んだ音を、極端に遅い速度で鳴らす様式である。ドゥームコアという名が示すとおり、破滅と重さを主題としている。テンポは一分間におおむね130〜160拍で、ハードコア・テクノ系では最も遅く、同系統の他の様式が200拍前後で走るのとは対照的な設計になっている。ただし音そのものは減速で穏やかになるわけではない。キックは他のハードコアより歪みを抑えたドラムマシンTR-909系の音が使われるが、速い曲では一瞬で通り過ぎる打撃音が、遅い速度では一発ごとに空間を占領する。この、打撃の全長を聴かされる感覚が重苦しさの正体である。音の隙間には長く伸びる低い持続音や、不協和な和音の塊が敷かれ、旋律らしい旋律はほとんど現れない。使われる音階は短調や、調性の枠から外れた不安定な響きが中心である。声の素材は加工された叫び、映画やニュースからの引用、宗教的な詠唱などで、意味を伝えるためというより不穏さを補強するために置かれる。曲の構成は展開に乏しく、同じ音型を延々と反復しながら少しずつ音を足していく形が多い。聴き手を高揚させるのではなく、圧迫し続けることを目的とした設計である。</p>
<h2>成り立ち</h2><p>1990年代前半、オランダとドイツを中心にハードコア・テクノが速度を上げ続けた時期がある。初期のハードコアは一分間に160〜180拍前後から始まり、のちに200拍を超えるようになった。その中で、最初期のドゥームコアは、初期ハードコアの暗いインダストリアルな雰囲気を引き継ぐ形で生まれたとされる。多くはMarc Trauner(Acardipane)が別名義で制作し、1993年のThe Mover『Final Frontier』の収録曲を「最初のドゥームコア」と見る向きもあるが、当時はその語は使われていなかったとされる。メタルの領域では、1980年代前半にドゥーム・メタルが独立したジャンルとして確立しているが、名称の由来は不明で、断定できない。中心となったのはMarc Acardipane(本名Marc Trauner。The Mover、Mescalinum Unitedなどの名義)と、彼が関わったPCP(Planet Core Productions)で、1990年代前半にフランクフルトやロッテルダム周辺で、その雛形を作った。PCPの傍系レーベルであるCold Rush RecordsやTest Recordsも、この方向の作品の発表の場となった。PCP(1989〜97年)が基盤を作り、2000年代以降はインダストリアル・ハードコアと呼ばれる領域などの別の担い手が受け継ぎながら発展した。商業的な拡大をほとんど志向しないまま独自の圏域を保っている。現在では、実験的な電子音楽やノイズの領域からこの様式に接近する作り手も増え、ダンス音楽というより聴かせるための音響作品として制作されることも多くなった。速度で競わないという最初の選択が、結果としてこの様式を長く生き延びさせている。</p>
