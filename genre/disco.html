<h1>Disco（ディスコ）とは</h1>
<p>ディスコは、ダンスフロアのための音楽だ。土台になるのは「四つ打ち」で、1小節に4回、バスドラムを均等に踏み続ける。 演奏は、生のオーケストラのような分厚い音になる。弦楽器の高音の駆け上がり、ホーンの合いの手、ワウをかけたギターの1</p>
<p>ディスコは、ダンスフロアのための音楽だ。土台になるのは「四つ打ち」で、1小節に4回、バスドラムを均等に踏み続ける。

演奏は、生のオーケストラのような分厚い音になる。弦楽器の高音の駆け上がり、ホーンの合いの手、ワウをかけたギターの16分カッティング、Fender Rhodesやクラヴィネットの和音が重なる。多くは生のオーケストラ（弦・ホーン）が支えたが、弦シンセサイザーなど電子楽器も使われた。

ベースは、8分音符でオクターブを行き来する、跳ねる型が定番になる。

リズムは、ハイハットを裏拍で開閉して、前に進む勢いを作る。テンポはおおむね110〜130BPM（115〜130が中心。それより遅い曲・速い曲もある）で、大半が4分の4拍子だ。踊り手が拍を数えずに済むよう、構造は規則的に作られていることが多い。ファンクと材料は近いが、ファンクが1拍目の強調と隙間で跳ねるのに対し、ディスコは全拍を均等に踏んで、途切れない連続性を作る傾向がある点が違うと言われる。

歌唱は、女性のゴスペル由来のメリスマ（またはラン）を効かせた力強い声か、男性のファルセットが多いとされる。歌詞は、恋愛、夜、踊ること、そして生き延びることを称える。

曲は、歌より長い間奏を持つ。途中で打楽器だけのブレイクに落ち、また全部が戻ってくる展開で、フロアを煽る。12インチシングルは、溝の間隔を広げて音量と音質を稼ぐために広まった。ディスコのDJは、これを使って曲を長く途切れなく流した。</p>
<h2>成り立ち</h2><p>1960年代後半から、ニューヨーク、フィラデルフィア、ボルティモアなどの都市の夜の現場で、ディスコは形成された。公認されない人々の避難所として生まれ、1970年代に拡大した。

土壌になったのは、1969年のストーンウォールの反乱以降に増えたとされる同性愛者の集まり場と、黒人、ラテン系、ゲイなどの人々が集まる私的なパーティーだ。

1970年2月、David Mancusoが自宅ロフトで「The Loft」を始めた。酒を売らず、招待制で、音質と客の安全に力を注いだ集まりで、以後のクラブ文化の原型になった。Francis Grassoらが先鞭をつけたあと、The GalleryのNicky Sianoは3台のターンテーブルで発展させた。のちにParadise Garageで神格化されるLarry Levanらも、曲を途切れさせずに繋ぎ、フロアの高揚を一晩かけて設計する技術を洗練させていく。

音源の側では、フィラデルフィアのKenny GambleとLeon Huffが率いたPhiladelphia International Recordsが、専属楽団MFSBによる、弦とホーンを厚く重ねたソウルを量産した。1973年録音(シングル発売は1974年)の「Love Is the Message」は、フロアの讃美歌となった。

レコード・プロデューサーTom Moultonは、曲を編集して伸ばす手法を考案した。音量と音質を稼げる12インチのレコードが、プロモ用として1970年代半ばに広まる（1976年5月にSalsoulから出た『Ten Percent』（Walter Gibbonsリミックス）が、ディスコ時代以降で最初に一般発売された12インチ・シングル）。

1977年にStudio 54開業と映画公開でディスコが主流文化に入り、人気は1978〜79年にかけて頂点に達した。ミュンヘンでGiorgio MoroderがDonna Summerのために制作した「I Feel Love」は、伴奏のほぼ全部をMoogシンセサイザーのシーケンスに置き換えた。この曲は、のちのハウスやテクノの設計図となった。同年末の映画「Saturday Night Fever」とBee Geesによるサウンドトラックは世界的大ヒットとなり、ディスコは巨大産業になる。マンハッタンのStudio 54は、有名人と過剰の代名詞として連日報じられた。

しかし、粗製乱造で市場は飽和した。1979年7月12日、シカゴのComiskey Parkで、ラジオDJのSteve Dahlらが、Chicago White Soxの販促として「Disco Demolition Night」を企画した。観客が持ち寄ったディスコのレコードを爆破し、会場は暴動に発展した。

この事件は、音楽の趣味を装った同性愛嫌悪と人種差別の噴出だったとする解釈もある。ただし、Steve Dahlは否定しており、学者の間でも論争がある。その後、ディスコの名称が敬遠され、「dance」などの語が使われるようになった。

それでも、音楽は消えなかった。ディスコの文化は、ポスト・ディスコ期の、シカゴのハウス、デトロイトのテクノ、ニューヨークのガラージなどに受け継がれた。</p>
