<h1>Disco（ディスコ）とは</h1>
<p>1小節に4回、均等にバスドラムを踏み続ける「四つ打ち」を土台にした、ダンスフロアのための音楽。ハイハットは裏拍で開閉して前進感を作り、ベースは8分音符でオクターブを行き来する跳ねる型が定番になる。ここに弦楽器の高音の駆け上がり、ホ</p>
<p>1小節に4回、均等にバスドラムを踏み続ける「四つ打ち」を土台にした、ダンスフロアのための音楽。ハイハットは裏拍で開閉して前進感を作り、ベースは8分音符でオクターブを行き来する跳ねる型が定番になる。ここに弦楽器の高音の駆け上がり、ホーンの合いの手、ワウをかけたギターの16分カッティング、Fender Rhodesやクラヴィネットの和音が重なり、生演奏による分厚いオーケストラ・サウンドになる。テンポは110〜130BPM、ほぼ全曲が4分の4拍子で、踊り手が拍を数えずに済むよう構造が徹底して規則的に作られている。曲は歌より長い間奏を持ち、途中で打楽器だけのブレイクに落ち、また全部が戻ってくる展開でフロアを煽る。歌唱は女性のゴスペル由来のこぶし（メリスマ）を効かせた力強い声か、男性のファルセットが多い。歌詞は恋愛、夜、踊ること、そして生き延びることを称える。ファンクと材料は近いが、ファンクが1拍目の強調と隙間で跳ねるのに対し、ディスコは全拍を均等に踏んで途切れない連続性を作る点が違う。DJが二枚のレコードを繋いで途切れなく流すために、12インチシングルという長尺盤が生まれた。</p>
<h2>成り立ち</h2><p>1970年代初頭のニューヨークで、公認されない人々の避難所として始まった。1969年のストーンウォールの反乱以降に増えた同性愛者の集まり場、そして黒人とプエルトリコ系の若者が集う会員制の私的なパーティーが土壌である。1970年2月、David Mancusoが自宅ロフトで始めた「The Loft」は、酒を売らず招待制で、音質と客の安全だけに全力を注いだ集まりで、以後のクラブ文化の原型になった。The GalleryのNicky Siano、のちにParadise Garageで神格化されるLarry Levanらが、二台のターンテーブルで曲を途切れさせずに繋ぎ、フロアの高揚を一晩かけて設計する技術を確立する。音源の側では、フィラデルフィアのKenny GambleとLeon Huffが率いたPhiladelphia International Recordsが、専属楽団MFSBによる弦とホーンを厚く重ねたソウルを量産し、1973年の「Love Is the Message」がフロアの讃美歌となった。技術者Tom Moultonは踊る時間を長くするために曲を編集して伸ばす手法を考案し、その必要から1975年頃に12インチシングルという規格が生まれる。1977年はディスコの頂点である。ミュンヘンでGiorgio MoroderがDonna Summerのために制作した「I Feel Love」は、伴奏のほぼ全部をMoogシンセサイザーのシーケンスに置き換え、のちのハウスやテクノの設計図となった。同年末の映画「Saturday Night Fever」とBee Geesによるサウンドトラックは世界的大ヒットとなり、ディスコは巨大産業になる。マンハッタンのStudio 54は有名人と過剰の象徴として連日報じられた。しかし粗製乱造で市場は飽和し、1979年7月12日、シカゴのComiskey ParkでラジオDJのSteve Dahlが企画した「Disco Demolition Night」では観客が持ち寄ったディスコのレコードを爆破し、暴動に発展した。この事件は音楽の趣味を装った同性愛嫌悪と人種差別の噴出として語られ、業界は一夜にしてディスコという語を封印する。だが音楽自体は消えず、シカゴのハウス、デトロイトのテクノ、ニューヨークのガラージへと名前を変えて生き延びた。</p>
<h2>代表曲</h2><ul><li>Stayin' Alive (Bee Gees)</li><li>I Will Survive (Gloria Gaynor)</li><li>Le Freak (Chic)</li></ul>
