<h1>Mor Lam（モーラム）とは</h1>
<p>モーラムはラオスの伝統的な歌謡で、タイ東北部（イサーン地方）でも盛んな、口伝えの歌謡の伝統に根ざした音楽ジャンルである。その音響的な核心は「ケーン」と呼ばれる竹管の口風琴（マウスオルガン）にある。ケーンは複数の竹管を束ね、金属の自</p>
<p>モーラムはラオスの伝統的な歌謡で、タイ東北部（イサーン地方）でも盛んな、口伝えの歌謡の伝統に根ざした音楽ジャンルである。その音響的な核心は「ケーン」と呼ばれる竹管の口風琴（マウスオルガン）にある。ケーンは複数の竹管を束ね、金属の自由簧（フリーリード＝息で震える薄い金属片）を備えた構造を持ち、息を吸うときも吐くときも音を出せる（吸気と呼気を素早く切り替えて鳴らす）ため、途切れない持続音（ドローン）と旋律音が同時に鳴り響く独特の音響を生む。音階はペンタトニック（5音音階）の2系統があり、旋律は言葉の声調（声の高低のつき方）に合わせて柔軟に作られる。

ボーカルスタイルは「ラム」と呼ばれる即興的な語り歌で、歌い手（モー）は高速かつ複雑なリズムパターンに乗せて、詩的な歌詞を即興で紡ぐ。声域は広く、ファルセット（裏声）と地声を自在に切り替える技法が多用される。歌詞の主題は恋愛・農村生活・仏教的な教え・社会批評など多岐にわたり、地域の言語（ラオ語・イサーン語）の声調を旋律に組み込む点が音楽的に重要である。

現代のモーラムでは「ポーン・ラン」と呼ばれる木製の鍵盤打楽器に加え、エレクトリックギター・ベース・ドラムセット・キーボードが加わり、電気で増幅した音が主流となっている。テンポは中程度から速いものまで幅広く、ダンスミュージックとしての機能を強く持つ。

隣接ジャンルである「ルークトゥン」（タイのカントリーポップ）と比較すると、ルークトゥンがバンコクの商業音楽産業と結びついた洗練された編曲を持つのに対し、モーラムはより即興性・口伝えの性格・地域性が強く、ケーンの音色が前面に出る点で明確に異なる。演奏は農村の祭礼・葬儀・結婚式・野外フェスティバルなど、コミュニティの儀式的な場で行われることが多い。</p>
<h2>成り立ち</h2><p>モーラムは数百年にわたる、ラオス・メコン川流域の口伝えの詩歌の伝統にもとづくとされる。起源については確定した記録がなく、諸説がある。「ラム」とは「歌う・詠む」を意味するラオ語であり、「モー」は「専門家・達人」を意味する。すなわちモーラムとは「歌の達人」を指す言葉であり、ジャンル名そのものが演者の技芸への敬意を示している。

伝統的なモーラムは宮廷文化ではなく農村共同体の中で育まれた。ラオスおよびタイ東北部（イサーン地方）の農民たちは、稲作の季節や仏教行事に合わせて歌い手を招き、夜通し歌と踊りを楽しんだ。この形式は「モーラム・クロン」（男女の歌い手が掛け合いで即興する形式）や「モーラム・ルアン」（一人が衣装で登場人物を演じ分ける物語形式）、「モーラム・ムー」（劇団形式）など複数の小さな型に分かれていた。

1947年ごろにはモーラムがスタジオで録音されるようになり、レコードが作られ始めた。録音の初期の歌手として、Khan-Thong、Tong-Kam-Peng-Di、Chaweewan Dumnernの名が文献に挙がる。

1960年代末にエレキギターやオルガンが導入され、1970年代後半から1980年代にかけてタイ全国へ広がった。この時期、エレクトリック楽器を積極的に取り入れた「モーラム・シン」（モダンモーラム）が確立された。モーラム・シンはケーンの音色を保ちながら、エレクトリックギターのカッティングやドラムセットのビートを融合させ、ダンスフロア向けの高速テンポを採用した。この変容はイサーン農村から都市部への労働移民の増加とも連動しており、バンコクの工場労働者たちが故郷の音楽を自分たちのよりどころとして求めたことが商業的成功を後押しした。

政治的背景も無視できない。ラオスは内戦下の1964〜73年に激しい爆撃を受け、1975年の共産党政権の成立後には、約30万人が難民としてタイへ流入した。この人口移動はラオスとタイ・イサーンのモーラム文化をさらに混ざり合わせ、国境を越えた音楽的交流を生んだ。一方でバンコクでは、モーラムは下層や地方の人々の音楽と見られがちで、差別と誇りの両方を背負った音楽として機能した。

2000年代以降、モーラムは国際的な再評価を受けるようになった。米国シアトルのレーベル「Sublime Frequencies」が、1970〜80年代のモーラム録音（主にイサーンのもの）を編集盤『Molam』として世界市場向けに発売し、欧米のワールドミュージックファンの間で注目を集めた。また、1969年生まれでロイエット県出身のジントラー・プーンラープ（Jintara Poonlarp）は、1987年のデビュー以来、現代においても人気のあるモーラム歌手の一人として活躍し続けている。

近年ではエレクトロニックダンスミュージックとの融合も進んでおり、若い世代の間でも人気を博している。バンコクのクラブやヨーロッパのフェスティバル（グラストンベリー等）にもモーラムのDJやバンドが登場するようになり、ジャンルの地理的・文化的な広がりは大きく広がっている。</p>
