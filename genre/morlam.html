<h1>Mor Lam（モーラム）とは</h1>
<p>モーラムは、ラオスとタイ東北部（イサーン地方）に共通する伝統的な歌謡だ。口伝えの歌謡の伝統に根ざしている。 音の中心は「ケーン」と呼ばれる竹管の口風琴（マウスオルガン）だ。ケーンは複数の竹管を束ね、金属の自由簧（フリーリード＝息で</p>
<p>モーラムは、ラオスとタイ東北部（イサーン地方）に共通する伝統的な歌謡だ。口伝えの歌謡の伝統に根ざしている。

音の中心は「ケーン」と呼ばれる竹管の口風琴（マウスオルガン）だ。ケーンは複数の竹管を束ね、金属の自由簧（フリーリード＝息で震える薄い金属片）を備えている。息を吸うときも吐くときも音を出せる（吸気と呼気を素早く切り替えて鳴らす）。そのため、途切れない持続音（ドローン）と旋律音が同時に鳴り響く、独特の響きが生まれる。

ケーンは7音を備え、5音の旋法（ライ）を2つの系統（タン・サン／タン・ヤオ）に分けて用いる。旋律は、言葉の声調（声の高低のつき方）に合わせて柔軟に作られる。

現代のモーラムでは、ケーンやピンに加え、地域によってはポーン・ランも使われる。そこにエレキギター・ベース・ドラムセット・キーボードが加わり、電気で増幅した音が主流になっている。テンポは中くらいから速いものまで幅広く、踊るための音楽という役割を強く持つ。

歌い方は「ラム」と呼ばれる語り歌だ。歌い手（モー）は、速く複雑なリズムに乗せて歌う。掛け合い形式（クロン）などでは即興で韻を紡ぐが、多くの曲目では歌詞は決まっている。声域は広く、声調に合わせた旋律、跳躍、会話的な歌唱が特徴だ。

歌詞のテーマは、恋愛・農村の暮らし・仏教の教え・社会批評など幅広い。地域の言語（ラオ語・イサーン語）の声調を旋律に組み込む点が、音楽の上で大切である。

隣のジャンルである「ルークトゥン」（タイのカントリーポップ）は、中部で生まれ、後にイサーンで広く支持された大衆歌謡だ。モーラムの影響を受けて発展し、現代のモーラムとは互いに混ざり合っている。演奏は、農村の祭り・葬儀・結婚式・野外フェスティバルなど、地域の儀式の場で行われることが多い。</p>
<h2>成り立ち</h2><p>モーラムは、ラオス・メコン川流域で数百年にわたって口伝えされてきた詩歌の伝統にもとづくとされる。起源については確定した記録がなく、諸説がある。「ラム」は「歌う・詠む」を意味するラオ語で、「モー」は「専門家・達人」を意味する。つまりモーラムとは「歌の達人」を指す言葉である。

伝統的なモーラムは、主に農村共同体の祭りや儀礼の中で育まれた。ただし19世紀には、シャムの宮廷人にも愛好者がいた。ラオスとタイ東北部（イサーン地方）の農民たちは、稲作の季節や仏教行事に合わせて歌い手を招き、夜通し歌と踊りを楽しんだ。その形は、いくつかの小さな型に分かれていた。「モーラム・クロン」（男女の歌い手が掛け合いで即興する形式）、「モーラム・ルアン」（独演の物語歌で、一人が衣装で登場人物を演じ分ける形式）、「モーラム・ムー」（劇団形式）などである。

1947年ごろには、モーラムがスタジオで録音されるようになり、レコードが作られ始めた。初期に録音した歌手として、Khan-Thong、Tong-Kam-Peng-Di、Chaweewan Dumnernの名が文献に挙がる。

1960年代末には、エレキギターやオルガンが取り入れられた。モーラムは1970年代後半から1980年代にかけて、タイ全国へ広がった。電気楽器を取り入れた現代的なモーラムの中から、速くて踊るための「モーラム・シン」が1980年代前後に広まった。モーラム・シンはケーンの音色を保ちながら、エレキギターやドラムセットのビートを混ぜ合わせ、ダンスフロア向けの速いテンポを採用した。この変化は、イサーンの農村から都市部へ働きに出る人が増えたことともつながっている。バンコクの工場で働く人たちが、故郷の音楽を心のよりどころとして求めた。それが商業的な成功を後押しした。

政治の動きも見逃せない。ラオスは内戦下の1964〜73年に激しい爆撃を受け、1975年には共産党政権が成立した。約30万人（人口の約1割）が、1975年以降にタイなどへ逃れたと推計される。この人の移動が、ラオスとタイ・イサーンのモーラム文化をさらに混ぜ合わせ、国境を越えた音楽の交流を生んだ、という見方もある。一方でバンコクでは、モーラムは下層や地方の人々の音楽と見られがちだった。モーラムは、差別と誇りの両方を背負った音楽になった。

2000年代以降、モーラムは世界で改めて評価されるようになった。米国シアトルのレーベル「Sublime Frequencies」は、1970〜80年代のモーラム録音（主にイサーンのもの）を集めた。そして2005年に、編集盤『Molam: Thai Country Groove From Isan』として世界市場向けに発売した。これが、欧米のワールドミュージックのファンの間で注目を集めた。また、ジントラー・プーンラープ（Jintara Poonlarp）はロイエット県出身で、生年は戸籍上は1969年、1971年ともされる。1987年にグラミーから第1作を発表し、今も人気のあるモーラム歌手の一人として活躍を続けている。

近年は、エレクトロニック・ダンス・ミュージックとの融合も進み、若い世代にも人気を集めている。バンコクのクラブやヨーロッパのフェスティバル（グラストンベリー等）にも、モーラムのDJやバンドが登場するようになった。ジャンルの地理的・文化的な広がりは、大きく広がっている。</p>
