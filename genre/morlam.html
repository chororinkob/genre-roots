<h1>Mor Lam（モーラム）とは</h1>
<p>モーラムはラオスおよびタイ東北部（イサーン地方）を発祥とする口承歌謡の伝統に根ざした音楽ジャンルである。その音響的な核心は「ケーン」と呼ばれる竹製の口琴（バンブーオルガン）にある。ケーンは複数の竹管を束ねた構造を持ち、演奏者が息を</p>
<p>モーラムはラオスおよびタイ東北部（イサーン地方）を発祥とする口承歌謡の伝統に根ざした音楽ジャンルである。その音響的な核心は「ケーン」と呼ばれる竹製の口琴（バンブーオルガン）にある。ケーンは複数の竹管を束ねた構造を持ち、演奏者が息を吸いながら・吐きながら同時に音を出すことができるため、途切れない持続音（ドローン）と旋律音が同時に鳴り響く独特の音響を生む。音階はペンタトニック（五音音階）を基本としながら、西洋音楽の半音階とは異なる微分音的な音程を含むため、独特の「揺れ」や「うねり」を持つ旋律が特徴である。

ボーカルスタイルは「ラム」と呼ばれる即興的な語り歌で、歌い手（モー）は高速かつ複雑なリズムパターンに乗せて、詩的な歌詞を即興で紡ぐ。声域は広く、ファルセット（裏声）と地声を自在に切り替える技法が多用される。歌詞の主題は恋愛・農村生活・仏教的な教え・社会批評など多岐にわたり、地域の言語（ラオ語・イサーン語）の声調を旋律に組み込む点が音楽的に重要である。

現代のモーラムでは「ポーン・ラン」と呼ばれる木製の鍵盤打楽器に加え、エレクトリックギター・ベース・ドラムセット・キーボードが加わり、アンプリファイドされたサウンドが主流となっている。リズムは2拍子・4拍子を基本とし、テンポは中程度（BPM 100〜140）から速いもの（BPM 160以上）まで幅広い。アクセントは偶数拍に置かれることが多く、ダンスミュージックとしての機能を強く持つ。

隣接ジャンルである「ルークトゥン」（タイのカントリーポップ）と比較すると、ルークトゥンがバンコクの商業音楽産業と結びついた洗練されたアレンジを持つのに対し、モーラムはより即興性・口承性・地域性が強く、ケーンの音色が前面に出る点で明確に異なる。演奏は農村の祭礼・葬儀・結婚式・野外フェスティバルなど、コミュニティの儀礼的な場で行われることが多い。</p>
<h2>成り立ち</h2><p>モーラムの起源は少なくとも数百年前のラオス・メコン川流域の口承詩歌の伝統に遡ることができる。「ラム」とは「歌う・詠む」を意味するラオ語であり、「モー」は「専門家・達人」を意味する。すなわちモーラムとは「歌の達人」を指す言葉であり、ジャンル名そのものが演者の技芸への敬意を示している。

伝統的なモーラムは宮廷文化ではなく農村共同体の中で育まれた。ラオスおよびタイ東北部（イサーン地方）の農民たちは、稲作の季節や仏教行事に合わせて歌い手を招き、夜通し歌と踊りを楽しんだ。この形式は「モーラム・クルアン」（二人の歌い手が掛け合いで即興する形式）や「モーラム・ムー」（劇団形式）など複数のサブスタイルに分化していた。

20世紀に入り、ラジオ放送の普及がモーラムの商業化を加速させた。1950〜60年代にはタイのバンコクやラオスのヴィエンチャンでレコーディングが行われるようになり、ジャンルとしての輪郭が明確になっていった。この時期の重要人物として、タイ・イサーン出身の歌手チャリンパット・ソンクラーチャイ（Charinphat Songkhrachai）が挙げられる。彼女は伝統的なラムの語法を保ちながら商業録音に適応させ、モーラムを全国的な聴衆に届けた先駆者の一人である。

1970〜80年代はモーラムの黄金期と呼ばれる。この時期、ジャワン・ドゥアンジャイ（Jintara Poonlarp）やポンシリ・ウォラポン（Pongsit Kampee）らが登場し、エレクトリック楽器を積極的に取り入れた「モーラム・シン」（モダンモーラム）が確立された。モーラム・シンはケーンの音色を保ちながら、エレクトリックギターのカッティングやドラムセットのビートを融合させ、ダンスフロア向けの高速テンポを採用した。この変容はイサーン農村から都市部への労働移民の増加とも連動しており、バンコクの工場労働者たちが故郷の音楽をアイデンティティとして求めたことが商業的成功を後押しした。

政治的背景も無視できない。ベトナム戦争期、ラオスは激しい爆撃を受け、多くのラオス人がタイへ難民として流入した。この人口移動はラオスとタイ・イサーンのモーラム文化をさらに混交させ、国境を越えた音楽的交流を生んだ。一方でタイ政府は長らくイサーン文化を「後進的」とみなす中央集権的な文化政策を取っており、モーラムは差別と誇りの両方を背負った音楽として機能した。

2000年代以降、モーラムは国際的な再評価を受けるようになった。フランスのレーベル「Sublime Frequencies」が1970〜80年代のタイ・ラオスのモーラム録音を世界市場向けにコンパイルし、欧米のワールドミュージックファンの間で注目を集めた。また、ジャワン・ドゥアンジャイの娘であるジントラー・プーンラープ（Jintara Poonlarp）は現代においても最も人気のあるモーラム歌手の一人として活躍し続けている。

近年ではエレクトロニックダンスミュージックとの融合も進んでおり、「モーラム・エレクトロ」や「モーラム・ディスコ」と呼ばれるサブジャンルが若い世代の間で人気を博している。バンコクのクラブシーンやヨーロッパのフェスティバル（グラストンベリー等）にもモーラムのDJやバンドが登場するようになり、ジャンルの地理的・文化的射程は大きく広がっている。</p>
