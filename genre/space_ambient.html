<h1>Space Ambient（スペースアンビエント）とは</h1>
<p>宇宙空間や天体の情景を音で描くことを主題としたアンビエントの一系統。核となるのは極めてゆっくりと変化する広大なパッド音で、アタックを完全に消し、数十秒かけて音量が立ち上がり同じくらい時間をかけて消えていく設計になる。音色はアナログ</p>
<p>宇宙空間や天体の情景を音で描くことを主題としたアンビエントの一系統。核となるのは極めてゆっくりと変化する広大なパッド音で、アタックを完全に消し、数十秒かけて音量が立ち上がり同じくらい時間をかけて消えていく設計になる。音色はアナログシンセのオシレータをわずかにずらして重ねたデチューン音、金属的な倍音を持つFM音源、そして無限に上昇し続けるように聴こえるシェパードトーンなどが使われる。空間処理が構造そのもので、数秒から数十秒に及ぶリヴァーブと、フィードバックを高く設定したディレイによって、音源の位置が特定できない広がりを作る。ステレオ幅を極端に広げ、左右で異なる残響を鳴らして三次元的な浮遊感を演出する。周波数の配置は下から上まで薄く均等に埋められ、中域に不自然な密集を作らないことで無重力感が生じる。リズムはほぼ存在せず、あってもシーケンサーによる規則的なアルペジオが遠くで脈打つ程度で、これはベルリン・スクールから受け継いだ語彙になる。素材として実際の宇宙探査機の観測データを可聴域に変換した音や、無線通信の記録、パルサーの周期信号が使われることもある。曲は20分から1時間を超えることも珍しくない。ダークアンビエントと近いが、恐怖より畏敬と静寂に軸足があり、ニューエイジより無機質で人間中心的な癒しの意図を持たない点で区別される。</p>
<h2>成り立ち</h2><p>1970年代のドイツ、いわゆるベルリン・スクールの電子音楽が直接の母体になった。1969年のApollo 11による月面着陸と、1970年代のVoyager計画に象徴される宇宙開発の熱狂が、電子楽器という当時最新の技術と結びついたことが背景にある。Tangerine Dreamは1967年にEdgar Froeseがベルリンで結成し、1974年の「Phaedra」でMoogのシーケンサーによる反復と広大なメロトロンの層を組み合わせ、Virgin Recordsから発表して国際的に成功した。同じくKlaus Schulzeは1972年の「Irrlicht」以降、1曲が片面全体を占める長大な構成を確立し、宇宙を主題とする作風を深めた。Ash Ra Tempelのマヌエル・ゲッチングは1984年の「E2-E4」で、1時間近くにわたる単一のシーケンスを提示している。もう一つの重要な源流はフランスで、Jean-Michel Jarreが1976年の「Oxygène」を自宅の台所を改造したスタジオで録音し、当初どのレーベルにも断られながら最終的に世界で1200万枚以上を売り上げた。彼は1979年にパリのコンコルド広場で100万人規模の野外公演を行い、電子音楽と巨大な光の演出を結びつけた。宇宙探査そのものと直接結びついた例としては、Vangelisの1976年「Albedo 0.39」が天文学の数値を主題にし、彼は後にCarl SaganのテレビシリーズやNASAの映像で音楽が使われた。日本では冨田勲が1970年代にMoogでクラシック曲を電子化した後、1978年の「宇宙幻想」など宇宙を主題にした作品を制作している。1980年代から1990年代にかけて、この系統は宇宙をテーマにしたプラネタリウム上映と結びつき、実際に世界各地の科学館で常設の音楽として使われるようになった。ノルウェーのBiosphereは1997年の「Substrata」で北極圏の荒涼とした情景を描き、この分野に極地と宇宙を重ねる視点を持ち込んだ。同時期にSteve Roach(アメリカ)、Robert Rich、Alio Die(イタリア)、Solar Fields(スウェーデン)が活動し、Hearts of SpaceというアメリカのラジオHearts of Space番組が1973年から放送を続けてこの音楽の受容基盤を作った。同名のレーベルも1984年に設立されている。2000年代以降は、宇宙を扱う映画やゲームの劇伴、そしてYouTubeでの睡眠用や作業用の長時間動画として大量に消費される形態が定着した。近年はNASAが公開する探査機の実際の電磁波データを音に変換した素材が広く利用され、科学的なデータと芸術表現の境界を曖昧にする作品も現れている。</p>
