<h1>Space Ambient（スペースアンビエント）とは</h1>
<p>スペース・アンビエントは、宇宙空間や天体の情景を音で描くことをテーマにした、アンビエントの一系統だ。 中心になるのは、とてもゆっくり変化する広大なパッド音である。音の立ち上がりを消し、時間をかけて音量が上がり、同じように時間をかけ</p>
<p>スペース・アンビエントは、宇宙空間や天体の情景を音で描くことをテーマにした、アンビエントの一系統だ。

中心になるのは、とてもゆっくり変化する広大なパッド音である。音の立ち上がりを消し、時間をかけて音量が上がり、同じように時間をかけて消えていく作りが多い。

音色には、アナログシンセのオシレータをわずかにずらして重ねたデチューン音が使われる。金属的な倍音を持つFM音源や、無限に上がり続けるように聴こえるシェパードトーンなども使われる。

空間の加工が、曲の組み立てそのものになっている。数秒から数十秒に及ぶリヴァーブと、フィードバックを高く設定したディレイで、音の出どころが分からない広がりを作る。多くの場合、ステレオの幅を広げ、左右で違う残響を鳴らして、三次元的な浮遊感を出す。周波数の配置は、下から上まで薄く均等に埋められる傾向がある。

リズムは控えめなことが多い。シーケンサーによる規則的なアルペジオが、遠くで脈打つように使われることも多い。これはベルリン・スクールから受け継いだ表現である。

素材として、実際の宇宙望遠鏡や探査機の観測データを、耳に聞こえる音に変えたものが使われることもある。無線通信の記録や、パルサーの周期信号が使われることもある。

ダークアンビエントと近いが、恐怖より畏敬と静寂に軸足があるとされる。ニューエイジとの関係は分類が割れており、ニューエイジの派生とする見方が一般的だ。ただし、それと区別する論者もいる。</p>
<h2>成り立ち</h2><p>有力な源流の一つは、1970年代のドイツ、いわゆるベルリン・スクールの電子音楽だった。1969年のApollo 11による月面着陸に代表される、宇宙開発の時代背景とも結びついたと指摘されることがある。

Tangerine Dreamは、1967年にEdgar Froeseがベルリンで結成したグループだ。1974年の「Phaedra」で、Moogのシーケンサーによる反復と、広大なメロトロンの層を組み合わせた。この作品はVirgin Recordsから発表され、国際的に成功した。

同じくKlaus Schulzeは、1972年に「Irrlicht」を出した。これは宇宙をテーマにしない、管弦楽の録音を加工したドローン作品だった。彼はこれ以降、1曲がレコードの片面全体を占める長大な構成を固め、宇宙をテーマにする作風を深めた。Ash Ra Tempelのマヌエル・ゲッチングは、1981年録音、1984年発表の「E2-E4」で、1時間近く続く単一のシーケンスを示している。

一方、もう一つの重要な源流はフランスにあった。Jean-Michel Jarreは1976年の「Oxygène」を、自宅の台所を改造したスタジオで録音した。Island Recordsなど複数のレーベルに断られたが、Disques Motors（Dreyfus）から発売され、世界で推定1800万枚（2016年）を売り上げた。彼は1979年、パリのコンコルド広場で推定100万人の野外公演を行い、電子音楽と巨大な光の演出を結びつけた。

Vangelisの1976年の「Albedo 0.39」は、宇宙を主題にした例で、天文学の数値をテーマにした。彼の音楽は、後にCarl Saganのテレビシリーズ「Cosmos」（1980年）で使われた。探査との結びつきの例としては、「Mythodea」が探査機2001 Mars Odysseyのミッションのテーマに使われた。

日本では、冨田勲が1970年代にMoogでクラシック曲を電子化した。1978年の「宇宙幻想」では、クラシックなどの既成曲を、宇宙のテーマで編曲した作品を作っている。

1980年代初めには、アンビエントやニューエイジから派生した「プラネタリウム音楽」と呼ばれる音楽もあったとされる。ノルウェーのBiosphereが1997年に出した「Substrata」は、寒冷な自然をテーマにしたアンビエントの代表作で、Space ambientとは別系統として受け入れられてきた。同じ時期にはSteve Roach(アメリカ)、Robert Rich、Alio Die(イタリア)が活動し、2000年前後からはSolar Fields(スウェーデン)も加わった。

それを支えたのが、Hearts of Spaceというアメリカのラジオ番組だ。1973年に地方局で始まり、1983年に全米配信となって、この音楽が受け入れられる土台を作った。同じ名前のレーベルも1984年に設立されている。

2000年代以降は、宇宙を扱う映画やゲームの劇伴として使われ、2010年代以降はYouTubeでの睡眠用や作業用の長時間動画としても聴かれるようになった。近年は、NASAが公開する宇宙望遠鏡や探査機のデータを、耳に聞こえる音に変えた素材が公開されている。科学的なデータと芸術表現の境目をあいまいにする作品も現れている。</p>
