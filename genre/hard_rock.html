<h1>Hard Rock（ハードロック）とは</h1>
<p>エレクトリックギターの歪んだ音を音楽の中心に据え、大音量で演奏することを前提に組み立てられたロックである。骨格をなすのはパワーコードと呼ばれる、根音と完全5度だけを鳴らす和音で、3度を省くことで歪みをかけても濁らず、和音の明暗が曖</p>
<p>エレクトリックギターの歪んだ音を音楽の中心に据え、大音量で演奏することを前提に組み立てられたロックである。骨格をなすのはパワーコードと呼ばれる、根音と完全5度だけを鳴らす和音で、3度を省くことで歪みをかけても濁らず、和音の明暗が曖昧なまま強い推進力だけが残る。リフと呼ばれる短い反復音型が曲の主役となり、リフはコード進行をなぞる傾向がある。音階はブルース由来のマイナー・ペンタトニック（5音の短調音階）とブルーノート（哀愁を帯びた低めの音）が基本で、チョーキング（弦を押し上げて音程を上げる）やビブラート（音を揺らす）、スライド（指を滑らせる）といった、音程を連続的に動かす奏法が多用される。多くは4/4拍子で、ドラムはバスドラムとスネアによる重い2拍4拍の刻みを土台に、フィルイン（区切りに入れる短い装飾的な演奏）で区切りを作る。機材面ではGibson Les PaulやFender Stratocasterといったギターを、Marshallの真空管アンプにつなぎ、アンプ自体を限界まで歪ませる方法が典型で、ファズ（音をわざと割る機材）などを併用する奏者もいた。ヴォーカルは唸る、しゃがれる、叫ぶといった歌い方が多く、ときに高音域やファルセット（裏声）も使い、歌詞は多くの場合、恋愛、放浪、反抗、快楽を扱う。ハードロックはブルース的なロックンロールの性格（バックビートのスウィング感、コード進行をなぞるリフ）を保ち、ヘヴィメタルはさらに大音量・高強度で、リフが独立した旋律として働き、スウィングを持たない。</p>
<h2>成り立ち</h2><p>起点は1960年代半ばの米国と英国で、アメリカのブルースを模倣していた若いバンドが、音量と歪みという当時は事故と見なされていた要素を意図的に武器に変え始めたことにある。1964年にThe Kinksが発表したユー・リアリー・ガット・ミーでは、Dave Daviesが小型アンプのスピーカーを剃刀で切り裂いて割れた音を作ったと本人は主張しており（兄のRay Daviesの関与をめぐって、当事者の証言は割れている）、研究者のRobert Walserは、この曲を「パワーコードを軸にした最初のヒット曲」と評している（ただし、1958年のLink Wray「Rumble」など、それより前の例もある）。ロンドンにあるJim Marshallの店の技術者Ken Branらが1962年にJTM45というアンプを作り始め、1965年後半には100ワットの大出力機が出た。こうした大出力アンプは、大会場での演奏を可能にすると同時に、真空管を飽和させた独特の歪みを標準の音色にした。Cream、The Jimi Hendrix Experience、The Whoがブルースを土台に即興と音量を押し広げ、アメリカではBlue Cheerが1967年にサマータイム・ブルースを異様な音量で録音し（発売は1968年）、同じ1968年、Steppenwolfのボーン・トゥ・ビー・ワイルドの歌詞に現れたヘヴィメタル・サンダーという一節は、歌詞に「heavy metal」が出た最初期の例とされる（ジャンル名の語源には諸説あり、William S. Burroughsの1961年の小説『The Soft Machine』などに、さらに早い使用例がある）。1969年のLed Zeppelin、1970年のDeep Purpleのイン・ロック、そして同じ1970年にデビューしたBlack Sabbathの3組が、ハードロックとヘヴィメタルの形を固め、世界中の手本になった。1970年代半ばにはオーストラリアのAC/DCが、装飾を削ぎ落とした反復するリフだけで押し切る方法論を持ち込み、1980年2月にBon Scottが急死し、後任にBrian Johnsonを迎えて同年7月に発表されたバック・イン・ブラックは、史上最も売れたロックアルバムの一つとなった。アメリカではKissが演劇的な化粧と火薬の演出で、大規模な見世物としてのロックを広め、1972年に結成されたVan Halenが1978年に出したデビュー作では、Eddie Van Halenが両手を指板に置くタッピング奏法を広く知られるようにした。1980年代後半にはGuns N' Rosesのアペタイト・フォー・ディストラクションが、退廃したロサンゼルスの空気とともに全米1位を獲得し、米国のデビュー作として史上最も売れたアルバムとなる。しかし1990年代にはR&amp;B、ヒップホップ、グランジなどが人気を集め、ハードロックは勢いを落とした。とくにグラム・メタル（派手な化粧や衣装で人気を集めたメタル）の見た目や雰囲気は、グランジのバンドたちに否定された。それでも巨大な会場を満たす音楽としての機能は失われず、多くのジャンルに影響を与えた。</p>
