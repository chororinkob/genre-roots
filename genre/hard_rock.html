<h1>Hard Rock（ハードロック）とは</h1>
<p>ハードロックは、エレクトリックギターの歪んだ音を中心に据え、大音量で演奏することを前提に組み立てられたロックである。 主役はギターだ。機材面では、Gibson Les PaulやFender Stratocasterといったギター</p>
<p>ハードロックは、エレクトリックギターの歪んだ音を中心に据え、大音量で演奏することを前提に組み立てられたロックである。

主役はギターだ。機材面では、Gibson Les PaulやFender StratocasterといったギターをMarshallの真空管アンプに繋ぎ、アンプ自体を歪ませる手法が典型である。ファズなどを併用する奏者もいた。

和音の骨格は「パワーコード」と呼ばれる、根音と完全5度だけを鳴らす和音だ。3度を省くことで、歪みをかけても濁らない。和音の明暗が曖昧なまま、強い推進力だけが残る。

曲の主役になるのは、「リフ」と呼ばれる短い反復音型だ。リフはコード進行をなぞる傾向がある。音階は、ブルース由来のマイナー・ペンタトニック（5音の短調音階）とブルーノート（哀愁を帯びた低めの音）が基本だ。チョーキング（弦を押し上げて音程を上げる）、ビブラート（音を揺らす）、スライド（指を滑らせる）といった、音程を連続的に動かす奏法が多用される。

多くは4/4拍子で、ドラムはバスドラムとスネアによる重い2拍4拍の刻みを土台にしている。区切りには、フィルイン（区切りに入れる短い装飾的な演奏）を入れて、曲の流れを作る。

ヴォーカルは、唸る、しゃがれる、叫ぶといった歌唱が多い。ときに高音域やファルセットも用いる。歌詞は多くの場合、恋愛、放浪、反抗、快楽を扱う。

ハードロックは、ブルース的なロックンロールの性格を保っている。バックビートのスウィング感があり、リフはコード進行をなぞる。ヘヴィメタルはさらに大音量・高強度で、リフが独立した旋律として働き、スウィングを持たないとされる。</p>
<h2>成り立ち</h2><p>舞台は、1960年代半ばの米国と英国だ。アメリカのブルースを模倣していた若いバンドが、音量と歪みという、当時は事故と見なされていた要素を、意図的に武器に変え始めた。これが起点である。

1964年、The Kinksがユー・リアリー・ガット・ミーを発表した。Dave Daviesは、小型アンプのスピーカーを剃刀で切り裂いて割れた音を作ったと、本人は主張している。兄のRay Daviesの関与をめぐっては、当事者の証言は割れている。研究者のRobert Walserは、この曲を「パワーコードを軸にした最初のヒット曲」と評している(ただしLink Wray『Rumble』(1958年)など先例もある)。

音を支えたのは、アンプの進化だった。Jim Marshallは、1962年に店の技術者Ken BranらとJTM45を作り始め、1965年後半に100W機を出した。この大出力アンプは、大会場での演奏を可能にした。同時に、真空管を飽和させた独特の歪みを、標準の音色にした。

Cream、The Jimi Hendrix Experience、The Whoは、ブルースを土台に即興と音量を押し広げた。アメリカでは、Blue Cheerが1967年にサマータイム・ブルースを異様な音量で録音した（発売は1968年）。1968年、Steppenwolfのボーン・トゥ・ビー・ワイルドの歌詞に、ヘヴィメタル・サンダーという一節が現れる。これは、歌詞に「heavy metal」が出た最初期の例とされる。ジャンル名の語源には諸説あり、William S. Burroughsの1961年の小説『The Soft Machine』などに、さらに早い使用例がある。

そして、1969〜70年に、Led Zeppelin、Deep Purple、Black Sabbathの3組が、ハードロック/ヘヴィメタルのスタイルを固めた。

1970年代半ばには、オーストラリアのAC/DCが登場する。装飾を削ぎ落とし、反復するリフだけで押し切る方法論を持ち込んだ。Bon Scottが1980年2月に急死すると、後任にBrian Johnsonを迎え、同年7月にバック・イン・ブラックを発表した。このアルバムは、史上最も売れたロックアルバムの一つとなった。

アメリカでは、Kissが化粧と火薬の演出で、大規模な見世物としてのロックを広めた。Van Halenは1978年のデビュー作で、Eddie Van Halenが両手を指板に置くタッピング奏法を、広く知らしめた。

1980年代後半には、Guns N' Rosesのアペタイト・フォー・ディストラクションが、退廃したロサンゼルスの空気とともに、全米1位を獲得した。米国のデビュー作として、史上最も売れたアルバムとなった。

しかし、R&amp;B・ヒップホップ・グランジ等が人気を集め、ハードロックの人気は落ちていく。特に、グラム・メタル的な美学は、グランジに否定された。それでも、巨大な会場を満たす音楽としての機能は失われず、多くのジャンルに影響を与えた。</p>
