<h1>Hard Rock（ハードロック）とは</h1>
<p>エレクトリックギターの歪んだ音を音楽の中心に据え、大音量で演奏することを前提に組み立てられたロックである。骨格をなすのはパワーコードと呼ばれる、根音と完全五度だけを鳴らす和音で、三度を省くことで歪みをかけても濁らず、和音の明暗が曖</p>
<p>エレクトリックギターの歪んだ音を音楽の中心に据え、大音量で演奏することを前提に組み立てられたロックである。骨格をなすのはパワーコードと呼ばれる、根音と完全五度だけを鳴らす和音で、三度を省くことで歪みをかけても濁らず、和音の明暗が曖昧なまま強い推進力だけが残る。リフと呼ばれる短い反復音型が曲の主役となり、歌のためのコード進行ではなく、リフそのものが曲の骨組みを決める。音階はブルース由来のマイナー・ペンタトニックとブルーノートが基本で、チョーキングやビブラート、スライドといった、音程を連続的に動かす奏法が多用される。テンポは概ね110から140 BPMの4/4拍子で、ドラムはバスドラムとスネアによる重い二拍四拍の刻みを土台に、フィルインで区切りを作る。機材面ではGibson Les PaulやFender Stratocasterといったギターを、Marshallの真空管アンプへ直結し、アンプ自体を限界まで歪ませることで音が作られてきた。ヴォーカルは高音域を張り上げる歌唱が主流で、歌詞は恋愛、放浪、反抗、快楽を扱う。曲は3分から6分程度で、間奏に長いギターソロを置く構成が定型である。ヘヴィメタルと比べると、ブルースの語法と歌えるメロディーを保っている点が最大の違いといえる。</p>
<h2>成り立ち</h2><p>起点は1960年代半ばのイギリスで、アメリカのブルースを模倣していた若いバンドが、音量と歪みという当時は事故と見なされていた要素を意図的に武器に変え始めたことにある。1964年にThe Kinksが発表したユー・リアリー・ガット・ミーでは、Dave Daviesが小型アンプのスピーカーを剃刀で切り裂いて割れた音を作り、これが歪んだギターリフの最初期の例として語り継がれている。Jim Marshallが1962年にロンドンの店で作り始めた大出力アンプは、大会場での演奏を可能にすると同時に、真空管を飽和させた独特の歪みを標準の音色にした。Cream、The Jimi Hendrix Experience、The Whoがブルースの型を解体して即興と轟音を持ち込み、アメリカではBlue Cheerが1968年にサマータイム・ブルースを異様な音量で録音し、同年Steppenwolfのボーン・トゥ・ビー・ワイルドの歌詞に現れたヘヴィメタル・サンダーという一節が、後のジャンル名の語源となった。1969年のLed Zeppelin、1970年のDeep Purpleのイン・ロックによって様式は確立し、以後この二組が世界的な基準を作る。1970年代半ばにはオーストラリアのAC/DCが、装飾を削ぎ落とした反復するリフだけで押し切る方法論を持ち込み、1980年にBon Scottが急死した直後に発表されたバック・イン・ブラックは、史上最も売れたロックアルバムの一つとなった。アメリカではKissが演劇的な化粧と花火で見世物としてのロックを完成させ、1978年に登場したVan Halenでは、Eddie Van Halenが両手を指板に置くタッピング奏法を広め、ギター演奏の技術水準そのものを塗り替えた。1980年代後半にはGuns N' Rosesのアペタイト・フォー・ディストラクションが、退廃したロサンゼルスの空気とともに商業的頂点を記録する。しかし過剰な様式化と華美な見た目への反発から、1991年前後のグランジの登場によって主流の座を明け渡した。それでも巨大な会場を満たす音楽としての機能は失われず、ヘヴィメタル、パンク、グランジ、ストーナーロックに至るまで、ギターを歪ませる音楽のほぼ全てがここを共通の出発点としている。</p>
<h2>代表曲</h2><ul><li>Whole Lotta Love (Led Zeppelin)</li><li>Highway Star (Deep Purple)</li><li>Back in Black (AC/DC)</li><li>Sweet Child o' Mine (Guns N' Roses)</li><li>Crazy Train (Ozzy Osbourne)</li></ul>
