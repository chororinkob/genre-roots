<h1>Darkcore（ダークコア）とは</h1>
<p>1992年から1993年にかけてのイギリスで、多幸感に満ちたレイヴ音楽が一転して暗く沈み込んだ、ジャングルとドラムンベースの直接の前身にあたる音楽である。テンポは150から160 BPM前後、アーメン・ブレイクをはじめとする生ドラ</p>
<p>1992年から1993年にかけてのイギリスで、多幸感に満ちたレイヴ音楽が一転して暗く沈み込んだ、ジャングルとドラムンベースの直接の前身にあたる音楽である。テンポは150から160 BPM前後、アーメン・ブレイクをはじめとする生ドラムのループを細かく刻み直したブレイクビーツが骨格をなすが、それ以前のブレイクビート・ハードコアが多用したピアノの和音や女性ヴォーカルは削ぎ落とされ、代わりに低く唸るサブベース、不協和なシンセの持続音、そして映画から抜き出した不吉な台詞が空間を占める。技術的な核心はAkai S1000などのサンプラーによるタイムストレッチで、音の長さだけを引き伸ばした際に生じる、金属が軋むような不自然な質感を欠陥ではなく音色として積極的に採用した点にある。これによって人の声を引き伸ばした亡霊のような音が作られ、この分野を象徴する響きとなった。曲の構成は導入で不穏な空気を作り、ブレイクビーツを反復させながら少しずつ要素を足し、中盤でリズムを完全に落として恐怖を煽ってから最も激しい部分へ戻る型を取る。同時期のハッピーハードコアが上へ向かう高揚を追ったのに対し、こちらは下へ沈む重力を追った音楽である。</p>
<h2>成り立ち</h2><p>1988年以降のイギリスのレイヴ文化は、エクスタシーがもたらす多幸感と一体だったが、1991年から1992年にかけて、その反動が現れ始める。連日の使用による消耗、警察の取り締まりの強化、そして商業化によるシーンの荒廃が重なり、若い制作者たちの音は目に見えて暗くなった。中心地はロンドン北西部で、Dego McFarlaneとMarc Macらが1989年に設立したReinforced Recordsがこの転回の司令塔となる。同レーベルの4heroは1990年に精神病院からの通報を模したミスター・カークス・ナイトメアで既に不穏な方向を示していたが、決定的だったのは1992年、後にGoldieとして知られるClifford PriceがRufige Kru名義で発表したターミネーターである。この曲はタイムストレッチの副産物である歪んだ質感を主役に据え、映画の題名が示す通り、機械的で非人間的な恐怖を音にした。同年にはDoc Scottのヒア・カムズ・ザ・ドラムズが、1993年にはRam RecordsからOrigin Unknownのヴァレー・オブ・ザ・シャドウズが登場し、後者に収められた臨死体験の語りのサンプルは、この時期の空気を象徴するものとして今も引用され続けている。Moving ShadowやBasement Recordsといったレーベルも同じ方向へ舵を切り、ホラー映画やSF映画からの引用が共通語となった。1994年の刑事司法・公共秩序法が屋外レイヴを事実上封じると、シーンは室内のクラブへ移り、そこでレゲエのサウンドシステム文化と深く結びついた結果、ダークコアはジャングルへ、さらにドラムンベースへと姿を変えていった。GoldieがMetalheadzを設立し1995年にタイムレスを発表したことで、この暗さは芸術的な評価を得る段階へ進む。短命な過渡期でありながら、後のテックステップ、ダブステップ、さらには現在のベースミュージック全般に至るまで、暗いイギリスのダンス音楽の原型として参照され続けている。</p>
