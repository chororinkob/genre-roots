<h1>Doujin music（ドウジンオンガク）とは</h1>
<p>「同人音楽」は、自主制作CDを即売会やネットで頒布する、日本の音楽シーンを指す言葉である。同人誌即売会で頒布する形が、日本的なところだ。 東方Projectをはじめとするゲーム音楽の原曲を、別のジャンルへ編み直す「アレンジ文化」は</p>
<p>「同人音楽」は、自主制作CDを即売会やネットで頒布する、日本の音楽シーンを指す言葉である。同人誌即売会で頒布する形が、日本的なところだ。

東方Projectをはじめとするゲーム音楽の原曲を、別のジャンルへ編み直す「アレンジ文化」は、その大きな柱の一つである。完全オリジナルの楽曲もある。

使う機材は、Cubase等のDAWとソフトシンセが中心だ。歪ませたディストーションギターや、ゲーム音源の打ち込み音も混ざる。

原曲のメロディは、短調で、哀しさと疾走感をあわせ持つものが多いと言われる。これを、トランスなら120〜150 BPM、ハードコアテクノなら160〜200 BPMほどの4つ打ちキックに載せる。そしてサビを繰り返し、高揚を積み上げていく形が多い。

ブレイクで1拍だけ全部の音を止め、サイドチェイン（キックに合わせて他の音を一瞬弱める処理）でベースを脈打たせる演出が使われることもある。

ボーカルには、「萌え声」と呼ばれる、アニメのキャラクターのような甘く高い声が多いと言われる。シャウトや早口でたたみかける歌い方、掛け合いも珍しくない。

歌詞は、キャラクターの心情やギャグ・パロディを主題にする。電波ソングのような過剰さに振り切ることもある。

同人アレンジには、原曲の旋律を素材として、別のジャンルに大きく変奏するものがある。一方で、原曲重視のアレンジを掲げるサークルもあり、8ビット音源やレトロゲーム音楽のアレンジも多い。

実際に鳴る場所は、コミックマーケットやM3の即売会の会場と、ニコニコ動画のランキングだ。CDジャケットとプロモーション動画が、セットで楽しまれる。</p>
<h2>成り立ち</h2><p>同人音楽の土台は、1975年に虎ノ門の日本消防会館で始まった同人誌即売会「コミックマーケット」にある。

同人誌の文化は、やがて音楽へも広がった。1980年代後半には、ミュージくん（1988年）やローランドのMT-32などで、個人がコンピュータ音楽を作れるようになった。SC-55の発売は1991年3月である。パソコン通信（ニフティサーブなど）でMIDIデータをやり取りする活動が、同人音楽の原点の一つとされる。

転機は1990年代後半だ。CD-Rが普及し、DTM（デスクトップ・ミュージック）が広まった。自宅で打ち込んだ曲を少部数で焼き、即売会で売る。今の同人音楽の原型が、ここで生まれた。1998年には、音に特化した即売会「M3（音系・メディアミックス同人即売会）」が誕生した。

さらに2002年8月、コミックマーケット62で、ZUNのサークル「上海アリス幻樂団」が、Windows用のシューティングゲーム『東方紅魔郷』を頒布する。その親しみやすいメロディは、同人アレンジャーたちの格好の素材になった。2004年4月には、東方オンリーイベント「博麗神社例大祭」の第1回が、大田区産業プラザPiOで開かれた。「博麗神社秋季例大祭」の第1回は2014年11月24日で、現在は春の本祭と秋季の年2回である。

2006年12月にニコニコ動画が始まると、楽曲は動画と結びつき、爆発的に広がった。IOSYSの『魔理沙は大変なものを盗んでいきました』は、2006年8月に『東方乙女囃子』で発表された。2006年11月にプロモーションFlashが公開され、2007年3月にニコニコ動画へ投稿される。ネットミームのような大ヒットとなり、数百万回再生された。

同年8月に初音ミクが登場すると、ボーカロイド曲を頒布するオンリー即売会「THE VOC@LOiD M@STER（ボーマス）」が生まれた。同人音楽の裾野は、一気に広がった。2008年11月には、IOSYSが『チルノのパーフェクトさんすう教室』を収めたアルバム『東方氷雪歌集』を発表した。⑨（バカ）というキャラクター設定と共に、大人気となった。

全盛期は2000年代後半から2010年代前半と言われる。SOUND HOLICやCOOL&amp;CREATEなど、多くのサークルがプロ顔負けの質で競い合った。この間、東方Projectの二次創作ガイドラインは、2004年の「東方楽曲及びZUN氏作曲楽曲の二次使用に関する条件」の公開に始まった。その後も2011年の新ガイドライン、2020年の改訂など、何度かに分けて公開・改訂された。こうして、原作側とファンの創作の関係が整えられていった。

一方で、CD市場が縮むとともに、ダウンロード販売やストリーミング配信へ移っていった。即売会に出ず、ネットだけで活動する作家も増えた。2020年には、コミックマーケットが一度も開かれず、春の博麗神社例大祭も中止になった。それでもM3、コミックマーケット、博麗神社例大祭は、その後も開かれ続けている。ニコニコ超会議のような大型イベントとも連携しながら、同人音楽は今も、日本のポピュラー音楽の奥深くで独自の市場を作っている。</p>
<h2>代表曲</h2><ul><li>Help me, ERINNNNNN!! (ビートまりお / COOL&amp;CREATE)</li><li>魔理沙は大変なものを盗んでいきました (IOSYS)</li><li>ナイト・オブ・ナイツ (ビートまりお)</li><li>Bad Apple!! feat. nomico (Alstroemeria Records)</li><li>U.N.オーエンは彼女なのか？ (上海アリス幻樂団)</li><li>亡き王女の為のセプテット (上海アリス幻樂団)</li><li>フラワリングナイト (上海アリス幻樂団)</li><li>有頂天マゾヒスティック (IOSYS)</li><li>ウサテイ (IOSYS)</li><li>ひれ伏せ愚民どもっ！ (IOSYS)</li><li>taboo tears you up (IOSYS)</li><li>お人形遊び (IOSYS)</li></ul>
