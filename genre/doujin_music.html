<h1>Doujin music（ドウジンオンガク）とは</h1>
<p>「同人音楽」は、自主制作CDを即売会やネットで頒布する日本独自の音楽シーンを指す言葉である。音像の中心は、東方Projectをはじめとするゲーム音楽の原曲を別ジャンルへ編み直す「アレンジ文化」にある。原曲のメロディは短調中心で哀感</p>
<p>「同人音楽」は、自主制作CDを即売会やネットで頒布する日本独自の音楽シーンを指す言葉である。音像の中心は、東方Projectをはじめとするゲーム音楽の原曲を別ジャンルへ編み直す「アレンジ文化」にある。原曲のメロディは短調中心で哀感と疾走感を併せ持ち、これをトランスなら毎分140〜150拍、ハードコアテクノなら170〜180拍の4つ打ちキックに載せ、サビを反復させて高揚を積み上げるのが基本形だ。使用機材はCubase等のDAWとソフトシンセが主力で、歪ませたディストーションギターやゲーム音源の打ち込み音も混在する。ブレイクで一拍だけ全音を止め、サイドチェイン圧縮でベースを脈打たせる演出も頻出する。ボーカルは「萌え声」と呼ばれる高キーの甲高い発声が特徴で、シャウトや早口の畳みかけ、掛け合いも珍しくない。歌詞はキャラクターの心情やギャグ・パロディを主題とし、電波ソング的な過剰さに振り切る場合もある。アニメ主題歌のカバーが原曲の歌唱法をなぞる傾向があるのに対し、同人アレンジは原曲の旋律を素材として別ジャンルに徹底的に変奏する点で異なる。実際に鳴る場所はコミックマーケットやM3の即売会会場、ニコニコ動画のランキングであり、CDジャケットとプロモーション動画がセットで消費される。</p>
<h2>成り立ち</h2><p>同人音楽の土壌は、1975年に虎ノ門の日本消防会館で始まった同人誌即売会「コミックマーケット」にある。同人誌文化はやがて音楽へも広がり、1980年代にはパソコン通信の電子掲示板やFM音源を持つパソコンを使ったテクノポップ系の同人活動が各地で芽生えた。転機は1990年代後半、CD-Rの普及とDTM（デスクトップ・ミュージック）の台頭である。自宅で打ち込んだ曲を数百枚単位で焼き、即売会で売るという現在の同人音楽の原型がここで成立し、1998年には音に特化した即売会「M3（音系・メディアミックス同人即売会）」が誕生した。さらに2002年8月、コミックマーケット62でZUNのサークル「上海アリス幻樂團」がWindows用シューティングゲーム『東方紅魔郷』を頒布する。親しみやすいメロディは同人アレンジャーたちの格好の素材となり、2004年4月には東方オンリーイベント「博麗神社例大祭」が大田区産業プラザPioで第1回を開催、以後春の風物詩として定着した。2006年12月にニコニコ動画が開設されると、楽曲は動画と結びついて爆発的に拡散した。2007年、IOSYSの『魔理沙は大変なものを盗んでいきました』は、同人アレンジ初のネットミーム的大ヒットとなり、プロモーション動画は数百万回再生を記録した。同年8月に初音ミクが登場すると、ボーカロイド曲を頒布するオンリー即売会「THE VOC@LOiD M@STER（ボーマス）」が生まれ、同人音楽の裾野は一気に広がった。2008年11月、IOSYSは『チルノのパーフェクトさんすう教室』を収めたアルバム『東方氷雪歌集』を発表し、⑨（バカ）というキャラクター設定と共に大人気となった。全盛期は2000年代後半から2010年代前半で、SOUND HOLICやCOOL&amp;CREATEなど多数のサークルがプロ顔負けのクオリティで競い合った。この間、2010年にはZUNが東方Projectの二次創作ガイドラインを公開し、原作側とファン創作の関係を制度化した。一方でCD市場の縮小とともにダウンロード販売やストリーミング配信へ移行し、即売会に出ずネットのみで活動する作家も増えた。それでもM3、コミケ、例大祭は毎年開催され続け、ニコニコ超会議のような大型イベントとも連携しながら、同人音楽は日本のポピュラー音楽の最奥で現在も独自の市場を形成している。</p>
