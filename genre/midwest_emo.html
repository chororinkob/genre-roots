<h1>Midwest Emo（ミッドウェストエモ）とは</h1>

<p>アメリカ中西部を中心に生まれた、繊細な旋律と不器用な感情表現を組み合わせたロックである。最も特徴的なのはギターの扱いで、和音を掻き鳴らすのではなく、変則的な調弦を用いて、押さえた弦と開放弦を混ぜた分散和音を弾く。この結果、複数の音が響き合いながら濁り、鐘のような、あるいは水滴のようなきらめきが生まれる。この音色はこの分野の代名詞となっている。二本のギターがそれぞれ別の音型を弾き、周期のずれた反復が重なることで、拍の位置が曖昧になる浮遊感が作られる。拍子も4/4に留まらず、7/8や5/4といった変拍子が自然に混ぜられるが、それは技巧の誇示ではなく、旋律の都合で必要になった結果として現れる。ベースは旋律的に動き、ドラムは手数を抑えて空間を残す。テンポは中庸で、静かな部分から徐々に高まり、後半で全楽器が歪みを解放するという構成が定型である。歌唱は技術的に洗練されておらず、音程が不安定で、時に裏返る。この巧くなさが誠実さの記号として機能している。歌詞は失恋、友人との疎遠、故郷の町、季節の移り変わりといった具体的で私的な情景を扱い、比喩よりも日記のような直截さが選ばれる。</p>
<h2>成り立ち</h2><p>1990年代半ば、アメリカ中西部の大学町がこの音楽の揺籃となった。イリノイ州、インディアナ州、ミネソタ州、カンザス州といった地域には、大都市のような音楽産業がない代わりに、大学の寮や地下室で演奏する自主的な共同体が存在した。原型を作ったのはイリノイ州シカゴ周辺で活動したCap'n Jazzで、1990年に10代の兄弟Tim KinsellaとMike Kinsellaを中心に結成されたこのバンドは、混沌とした演奏と甲高い叫びによって、後続に決定的な影響を与えた。彼らは1995年に解散するが、そこから複数のバンドが枝分かれし、Tim KinsellaはJoan of Arcを、Mike Kinsellaは後にOwenを始めた。1997年、イリノイ大学のあるアーバナ・シャンペーンで結成されたAmerican Footballは、Mike Kinsellaを中心に、変則調弦による繊細な音型とトランペットを取り入れた作品を1999年に発表した。しかし彼らは商業的な成功を得られず、学業や就職のためにその年のうちに解散している。カンザス州ローレンスのThe Get Up Kidsは、より歌の分かりやすい方向を提示して人気を集め、フロリダのSunny Day Real Estateやワシントン州の一群と並んで、この情緒的なロックを全国へ広げた。流通を支えたのはPolyvinylやJade Treeといった小規模なレーベル、そして手作りの機関紙と通信販売である。2000年代前半、エモという語が大手の売り出す商業的なバンド群を指す言葉として広まり、独特の髪型や化粧を伴う流行と結びついた結果、本来の中西部の一群は忘れられかけた。事態が反転したのは2010年前後である。インターネット上でAmerican Footballの唯一の作品が再発見され、その孤独な情感と特徴的なジャケットの一軒家の写真が、新しい世代に強く響いた。彼らは2014年に再結成し、解散から15年を経て初めて広い聴衆の前に立つことになる。現在ではこの様式は世界中で模倣され、日本や東南アジアにも独自のシーンが存在する。</p>
