<h1>Midwest Emo（ミッドウェストエモ）とは</h1>
<p>ミッドウェスト・エモは、アメリカ中西部を中心に生まれた、繊細な旋律と不器用な感情表現を組み合わせたロックである。 最も特徴的なのはギターの扱いだ。和音を掻き鳴らすのではなく、押さえた弦と開放弦（指で押さえずに鳴らす弦）を混ぜた分散</p>
<p>ミッドウェスト・エモは、アメリカ中西部を中心に生まれた、繊細な旋律と不器用な感情表現を組み合わせたロックである。

最も特徴的なのはギターの扱いだ。和音を掻き鳴らすのではなく、押さえた弦と開放弦（指で押さえずに鳴らす弦）を混ぜた分散和音を弾く。しばしば変則調弦が用いられる（例：American Footballは曲ごとに調弦が違う）。複数の音が響き合いながら濁り、鐘のような、あるいは水滴のようなきらめきが生まれる。この音色は、この分野の代名詞となっている。2本のギターがそれぞれ別の音型を弾き、周期のずれた反復が重なることで、拍の位置が曖昧になる浮遊感が作られる。

拍子も4/4に留まらず、7/8や5/4といった変拍子（定型から外れた拍子）が混ぜられる。こうした点は、math rockの要素と結びつけて語られる。循環するギターパートと、刻むようなベースラインが特徴である。静と動の対比や、歪みの爆発を含む曲もある。

歌唱は技術的に洗練されておらず、音程が不安定で、時に裏返る。この巧くなさが、誠実さの記号として機能している。

歌詞は、失恋、友人との疎遠、故郷の町、季節の移り変わりといった情景を扱う。私的で内省的な歌詞が多い。</p>
<h2>成り立ち</h2><p>この音楽は、1990年代前半から半ばにかけて、シカゴ郊外やChampaign-Urbana、カンザスシティ周辺、ミルウォーキーなどの郊外・大学町で育った。

イリノイ州、インディアナ州、ウィスコンシン州、カンザス州といった地域には、大学の寮や地下室で演奏する自主的な共同体が存在した。原型を作ったバンドの一つが、イリノイ州シカゴ周辺で活動したCap'n Jazzである。1989年(当初はToe Jam名義)に、10代前半の兄弟Tim KinsellaとMike Kinsellaを中心に結成された。混沌とした演奏と甲高い叫びによって、後続に決定的な影響を与えた。

彼らは1995年に解散する。そこから複数のバンドが枝分かれし、Tim KinsellaはJoan of Arcを、Mike Kinsellaは後にOwenを始めた。

1997年、イリノイ大学のあるアーバナ・シャンペーンで、American Footballが結成された。Mike Kinsellaを中心とするこのバンドは、変則調弦による繊細な音型とトランペットを取り入れた作品を、1999年に発表した。しかし彼らは、大学卒業とメンバーの居住地の分散により、アルバム発表後まもなく活動を終えた(活動期間は1997〜2000年)。当初の評価は控えめだったが、その後売れ続けた。

一方、カンザスシティで結成されたThe Get Up Kidsは、より歌の分かりやすい方向を提示して人気を集めた。ワシントン州シアトルのSunny Day Real Estateなどと並んで、この情緒的なロックを全国へ広げた。流通を支えたのは、PolyvinylやJade Treeといった小規模なレーベル、そして手作りの機関紙（ファンが作る小冊子）と通信販売である。

2000年代前半、エモという語が、大手の売り出す商業的なバンド群を指す言葉として広まった。独特の髪型や化粧を伴う流行と結びついた結果、本来の中西部の一群の注目度は相対的に下がった。

事態が動いたのは、2000年代前半からファイル共有や掲示板で口コミが広がり、2000年代後半〜2010年代前半のリバイバルで再評価が加速したことによる。インターネット上でAmerican Footballの唯一のアルバムが再発見され、その孤独な情感と特徴的なジャケットの一軒家の写真が、新しい世代に強く響いた。彼らは2014年に再結成した。2000年の解散から14年後の再結成で、広い聴衆の前に立つことになる。

現在では、このスタイルは世界中で模倣され、日本や東南アジアにも独自のシーンが存在する。</p>
