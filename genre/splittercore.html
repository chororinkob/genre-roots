<h1>Splittercore（スプリッターコア）とは</h1>
<p>ハードコア・テクノの速度競争を極限まで押し進めた領域の一つである。テンポは一分間におおむね600〜1000拍(資料により500台後半から)で、機関銃の連射のように聞こえるキックの連なりが特徴である。1000拍以上はエクストラトーン</p>
<p>ハードコア・テクノの速度競争を極限まで押し進めた領域の一つである。テンポは一分間におおむね600〜1000拍(資料により500台後半から)で、機関銃の連射のように聞こえるキックの連なりが特徴である。1000拍以上はエクストラトーンと呼ばれ、音程のように聞こえるのはそちらの領域で語られる。バスドラムは極度に歪ませた短い音が用いられ、余韻を持たない。上物として置かれるのは、加工された叫び、電子的な持続音、そして意図的に不快感を与える高周波である。曲の構成は、極端に速いキックの連なりを軸に組み立てられる。踊るための音楽としては機能せず、聴覚の限界そのものを主題にした実験的な性格が強い。ハードコア・テクノは1990年代前半にオランダ、ベルギー、ドイツで生まれた160拍以上の速い様式で、スプリッターコアはその速度の先にある領域の一つにあたる。</p>
<h2>成り立ち</h2><p>1990年代前半にハードコア・テクノが速度を上げ続けた結果、一分間に200拍を超える領域に到達した。ここからさらに上を目指す流れが、複数の名前を伴って分岐していく。300拍以上(〜600程度)をスピードコア、600〜1000拍をスプリッターコア、1000拍以上をエクストラトーンと呼び分ける。名称の語源は確定していないが、ドイツ語のSplitterは「破片」を意味する。この領域を成立させたのは技術的な条件だった。生の演奏では到達不可能な速度で、制作用のソフトウェアの普及が後押ししたが、ハード面でも早くから極端な高速化の試みがあった。1992年録音・1993年発売のMobyの「Thousand」は約1,015BPMで、1998年にはベルギーのEinrichがオシロスコープでキックをトリガーして3600BPM以上を実現している。発祥の地や時期は特定できない。ドイツのレーベルであるフィッシュカプフは、1994年に創設された1990年代半ばの実験的ハードコアのレーベルとして知られるが、スプリッターコアとの結び付きを示す出典は確認できない。この領域には最初から、音楽として成立しているのかという問いがつきまとってきた。踊れず、旋律もなく、聴いていて快適でもない音が何のために作られるのか、という疑問である。これに対しては、聴覚の限界そのものを主題にしていることに意味がある、という見方がある。実際、この様式は音楽というより聴覚の実験に近い性格を持ち、20世紀の現代音楽が行ってきた問いの延長線上にあるという評価もある。演奏の場は極めて限定的で、参加者が数十人規模の催しか、インターネット上での共有が中心である。商業的な流通はほとんど存在せず、作品の多くは無料で配布されてきた。2010年代以降は、極端さを競う姿勢が一種の遊戯として受け止められ、冗談と真剣さの境界にある表現として若い世代に再発見されている。動画共有サイトでは、速度の記録を更新すること自体を目的とした作品も投稿されており、当初の実験的な問題意識とは別の楽しまれ方が生まれている。</p>
