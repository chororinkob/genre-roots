<h1>Splittercore（スプリッターコア）とは</h1>
<p>スプリッターコアは、ハードコア・テクノの速さ比べを極限まで押し進めた領域の一つだ。 テンポはおおむね600〜1000 BPMで、機関銃の連射のように聞こえるキックの連打が特徴である。1000 BPM以上はエクストラトーンと呼ばれ、</p>
<p>スプリッターコアは、ハードコア・テクノの速さ比べを極限まで押し進めた領域の一つだ。

テンポはおおむね600〜1000 BPMで、機関銃の連射のように聞こえるキックの連打が特徴である。1000 BPM以上はエクストラトーンと呼ばれ、音が音程のように聞こえるのは、そちらの領域で語られる話だ。

バスドラムには、極端に歪ませた短い音が使われ、ほとんど余韻を持たない。上に重ねられる音としては、短く鋭いレイヴ風の音、甲高い主旋律の音、ノイズ、パチパチという音、ホラーやインダストリアル風の雰囲気などがある。

曲は、極端に速いキックの連打を軸に組み立てられる。

ハードコア・テクノは、1990年代前半にオランダ、ベルギー、ドイツで生まれた、160 BPM以上の速いスタイルだ。スプリッターコアは、その速さのさらに先にある領域の一つにあたる。</p>
<h2>成り立ち</h2><p>1990年代前半、ハードコア・テクノは速さを上げ続け、ついに200 BPMを超える領域に届いた。ここからさらに上を目指す流れが、いくつもの名前に分かれていく。300 BPM以上(〜600程度)をスピードコア、600〜1000 BPMをスプリッターコア、1000 BPM以上をエクストラトーンと呼び分けることが多い。ただし、スピードコアの下限は人によって変わり、境界は固定したものではない。

名前の由来には諸説ある。Pengoのスピードコアのミックス「splitter mix」から来たという説のほか、衝撃的に裂けるような感覚を表すという見方もある。ドイツ語のSplitterは「破片」を意味する。

1992年録音・1993年発売のMobyの「Thousand」は、ピーク時で約1,015BPMだった。1998年には、ベルギーのEinrich 3600 BPMがオシロスコープ（電気信号を波形で映す機器）を、キックの音を鳴らす引き金に使い、3600BPM以上を実現している。ただし、どちらも1000 BPMを超える速さで、スプリッターコアではなくエクストラトーンの領域にあたる。Einrichは、エクストラトーンの創始者として語られる人物だ。発祥の地や時期は特定できない。

この領域には、音楽として成り立っているのかという問いがつきまとってきた。踊れず、旋律もなく、聴いていて心地よくもない音が、何のために作られるのか、という疑問である。これに対しては、聴覚の限界そのものをテーマにしていることに意味がある、という見方がある。

演奏の場はごく限られ、一部の催しやフェスティバルのほか、インターネット上での共有が中心である。商業的な流通は少なく、作品の多くは無料で配られてきたとされる。

2010年代以降は、インターネットの文化の中で広まった。暴力的で暗い一方、ときに冗談めいた面も持つとされる。</p>
