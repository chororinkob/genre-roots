<h1>Splittercore（スプリッターコア）とは</h1>
<p>ハードコア・テクノの速度競争を極限まで押し進めた領域の一つである。テンポは一分間に600拍から1000拍を超える範囲に達し、この速度では個々の打撃音を拍として聞き分けることが人間の聴覚では不可能になる。結果として何が起きるかという</p>
<p>ハードコア・テクノの速度競争を極限まで押し進めた領域の一つである。テンポは一分間に600拍から1000拍を超える範囲に達し、この速度では個々の打撃音を拍として聞き分けることが人間の聴覚では不可能になる。結果として何が起きるかというと、連続した打撃音が一つの持続する音として知覚され、しかもその繰り返しの速さが音程として聞こえはじめる。すなわちリズムが音色に変質する。この現象こそが、この様式の核心である。制作者は打撃音の間隔を変えることで、事実上その音の高さを演奏している。速度を上げ下げすると旋律が生まれるという逆転が起きるため、通常の音楽とは全く異なる作曲の発想が必要になる。バスドラムは極度に歪ませた短い音が用いられ、余韻を持たない。上物として置かれるのは、加工された叫び、電子的な持続音、そして意図的に不快感を与える高周波である。曲の構成は、聴き取れる速度の区間と、音程に変質した区間を往復する形が多く、その境界をまたぐ瞬間が最大の聞かせどころになる。踊るための音楽としては機能せず、聴覚の限界そのものを主題にした実験的な性格が強い。</p>
<h2>成り立ち</h2><p>1990年代前半にハードコア・テクノが速度を上げ続けた結果、一分間に200拍を超える領域に到達した。ここからさらに上を目指す流れが、複数の名前を伴って分岐していく。300拍前後をスピードコア、1000拍を超える領域をエクストラトーンと呼び、その中間に位置づけられたのがスプリッターコアである。名称は分裂を意味する語に由来し、拍が分裂して聞き分けられなくなる状態を指している。この領域を成立させたのは技術的な条件だった。生の演奏では到達不可能な速度であり、また初期の機材では処理できなかった。制作用のソフトウェアが高速な打撃音の生成を可能にしたことで、はじめて音として実現できるようになったのである。すなわち、機材の性能が上がったことがそのまま新しい表現を生んだ例にあたる。中心となったのはドイツを中心とする欧州の制作者たちで、1990年代後半から2000年代前半にかけて活動が集中した。とりわけドイツのレーベルであるフィッシュカプフや、それに連なる小規模な発表の場が舞台となった。この領域には最初から、音楽として成立しているのかという問いがつきまとってきた。踊れず、旋律もなく、聴いていて快適でもない音が何のために作られるのか、という疑問である。制作者側の応答は一貫しており、聴覚が拍を拍として処理できなくなる境界そのものを提示することに意味がある、というものだった。実際、この様式は音楽というより聴覚の実験に近い性格を持ち、二十世紀の現代音楽が行ってきた問いの延長線上にあるという評価もある。演奏の場は極めて限定的で、参加者が数十人規模の催しか、インターネット上での共有が中心である。商業的な流通はほとんど存在せず、作品の多くは無料で配布されてきた。2010年代以降は、極端さを競う姿勢が一種の遊戯として受け止められ、冗談と真剣さの境界にある表現として若い世代に再発見されている。動画共有サイトでは、速度の記録を更新すること自体を目的とした作品も投稿されており、当初の実験的な問題意識とは別の楽しまれ方が生まれている。</p>
