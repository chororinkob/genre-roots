<h1>UK Garage（ガラージ）とは</h1>
<p>イギリスで独自に変形したハウスの一系統で、拍の裏側を跳ねさせる独特のリズムが最大の特徴。基本形は四つ打ちだが、そこにスウィングと呼ばれる16分音符のタイミングのずれを深くかけ、シャッフルする跳ねた質感を作る。テンポは128〜135</p>
<p>イギリスで独自に変形したハウスの一系統で、拍の裏側を跳ねさせる独特のリズムが最大の特徴。基本形は四つ打ちだが、そこにスウィングと呼ばれる16分音符のタイミングのずれを深くかけ、シャッフルする跳ねた質感を作る。テンポは128〜135BPM。もう一つの型が2ステップで、こちらは1拍目と3拍目のキックを抜いて、スネアの位置をずらすことで拍の骨格そのものを崩す。パーカッションはハイハットとリムショット、シェイカーが細かく散らされ、特に打点の一つ一つに異なる音量とパンを与えて人間味のある揺れを作る。ベースは低く沈む正弦波か、あるいは短く切ったサブベースで、キックの隙間に潜り込むように置かれる。上物はR&amp;Bのヴォーカルを切り刻んだもの、ソウルの和音、そして時に弦楽器のサンプルが重なる。ヴォーカルの扱いが特徴的で、女性歌手のフレーズを細かく分断して音程を上げ、リズム楽器のように配置するチョップの技法が多用される。また、MCがフロアで韻を踏んで煽る文化があり、これがのちのグライムに繋がった。歌詞は恋愛、金、車、夜遊びといった享楽的な主題が中心。ハウスと比べて拍が跳ね、ジャングルと比べてテンポが遅く洗練された仕上げになる点で区別される。</p>
<h2>成り立ち</h2><p>1990年代半ばのロンドンで、アメリカのガラージ・ハウスをイギリスのクラブが独自に解釈したことから生まれた。名称はニューヨークのクラブParadise Garageに由来するが、音は大きく異なる。きっかけは実務的なもので、当時ロンドンのクラブではジャングルが主流だったが、その速さと暗さに疲れた客のために、DJがガラージ・ハウスのレコードを回転数を上げて速くかけるという操作を行った。これによりヴォーカルが甲高くなり、跳ねた質感が生まれ、独自のスタイルが生まれた。初期の重要な場はロンドン東部のSunday Sessionと呼ばれる日曜昼の集まりや、Twice as Nice(1996年開始)といったクラブで、ジャングルと違って服装規定があり、シャンパンを飲む洗練された装いが特徴だった。この点でジャングルの荒々しい文化とは階級的にも意識的に差異化されていた。海賊放送(パイレーツ・ラジオ)が普及の中心で、ロンドンの高層団地の屋上に違法な送信機を設置したRinse FMやFreek FMが情報網を担った。1997年から2001年が最盛期で、Doubleoseven「RIP Groove」、Tina Moore「Never Gonna Let You Go」のイギリス版リミックス、Artful Dodgerの1999年「Re-Rewind」(Craig Davidが歌った)、Sweet Female Attitude「Flowers」、So Solid Crewの2001年「21 Seconds」が全英チャートの上位に入った。So Solid Crewは30人規模の集団で、公演での銃撃事件や逮捕が相次ぎ、大衆紙による犯罪と結びつけた報道が過熱した。この結果、ロンドンの多くのクラブがガラージのイベント開催を拒否し、警察がイベントの中止を求めるようになった。この排除が皮肉にも次の展開を生む。締め出された若いMCたちが、より暗く攻撃的なビートに乗せて韻を踏む方向へ進み、それがグライムとなって2002年前後に結実した。同時にダブステップがサウス・ロンドンのCroydonから生まれ、2ステップの骨格から旋律を削ぎ落として低音に集中する方向へ分岐した。UKガラージ自体は2000年代半ばに一度衰退したが、2010年前後にDisclosureやJamie xxがその語彙を再解釈して国際的に成功し、以後はUKベース全般の共通語彙として定着した。近年もSNS上で若い世代が2ステップのリズムを再発見し続けている。</p>
