<h1>UK Garage（ガラージ）とは</h1>
<p>イギリスで独自に変形したハウスの一系統で、拍の裏側を跳ねさせる独特のリズムが最大の特徴。基本形は四つ打ちだが、そこにスウィングと呼ばれる16分音符のタイミングのずれを深くかけ、シャッフルする跳ねた質感を作る。テンポは130BPM前</p>
<p>イギリスで独自に変形したハウスの一系統で、拍の裏側を跳ねさせる独特のリズムが最大の特徴。基本形は四つ打ちだが、そこにスウィングと呼ばれる16分音符のタイミングのずれを深くかけ、シャッフルする跳ねた質感を作る。テンポは130BPM前後。もう一つの型が2ステップで、こちらは2拍目と4拍目のキックを抜き、キックを1拍目と3拍目付近に置いて、スネアは2・4拍を保つことで拍の骨格そのものを崩す。パーカッションはハイハットとリムショット（太鼓の縁を叩く音）、シェイカーが細かく散らされ、特に打点の一つ一つに異なる音量とパン（左右の位置）を与えて人間味のある揺れを作る。ベースは低く沈む正弦波（最もなめらかで純粋な波形）か、あるいは短く切ったサブベース（体に響く極低音）で、キックの隙間に潜り込むように置かれる。上物（メロディーなど上に重ねる音）はR&amp;Bのヴォーカルを切り刻んだもの、ソウルの和音、そして時に弦楽器のサンプルが重なる。ヴォーカルの扱いが特徴的で、女性歌手のフレーズを細かく分断して音程を上げ、リズム楽器のように配置するチョップ（細かく切り刻む）の技法が多用される。また、MCがフロアで韻を踏んで煽る文化があり、これがのちのグライムに繋がった。歌詞は恋愛、金、車、夜遊びといった享楽的な主題が中心。ハウスと比べて拍が跳ね、ジャングルと比べてテンポが遅く洗練された仕上げになる点で区別される。</p>
<h2>成り立ち</h2><p>1990年代半ばのロンドンで、アメリカのガラージ・ハウスをイギリスのクラブが独自に解釈したことから生まれた。名称はニューヨークのクラブParadise Garageに由来するが、音は大きく異なる。きっかけについては複数の説がある。ジャングルの凋落で客層が離れる中、DJがアメリカ盤のガラージ・ハウスをピッチアップ（回転数を上げて速く再生）してかけたことが発端の一つとされる。これによりヴォーカルが甲高くなり、跳ねた質感が生まれ、独自のスタイルが生まれた。初期の重要な場はロンドン南部で「Sunday Scene」と呼ばれた日曜の午後から夜の集まりや、Twice as Niceといったクラブで、ジャングルと違って服装規定があり、シャンパンを飲む洗練された装いが特徴だった。この点でジャングルの荒々しい文化とは階級的にも意識的に区別されていた。海賊放送(パイレーツ・ラジオ)が普及の中心で、ロンドンの高層団地の屋上に違法な送信機を設置したRinse FMやFreek FMが情報網を担った。1997年から2001年が最盛期で、Double 99「RipGroove」(1997年)、Tina Moore「Never Gonna Let You Go」(1995年に米国で制作されたリミックスが1997年に英国で再発されてヒット)、Artful Dodgerの1999年「Re-Rewind」(Craig Davidが歌った)、Sweet Female Attitude「Flowers」、So Solid Crewの2001年「21 Seconds」が全英チャートの上位に入った。So Solid Crewは30人規模の集団で、公演での銃撃事件や逮捕が相次ぎ、大衆紙による犯罪と結びつけた報道が過熱した。この結果、警察がこのグループの公演を禁止し、悪評でガラージ全体が逆風を受けるようになった。この排除が皮肉にも次の展開を生む。締め出された若いMCたちが、より暗く攻撃的なビートに乗せて韻を踏む方向へ進み、それがグライムとなって2002年前後に実を結んだ。同時にダブステップがサウス・ロンドンのCroydonから生まれ、2ステップの骨格から旋律を削ぎ落として低音に集中する方向へ分岐した。UKガラージ自体は2001〜2002年ごろに主流から後退したが、2010年代前半から半ば（2012〜2015年ごろ）にDisclosureやJamie xxがその表現を再解釈して国際的に成功し、以後はUKベース全般の共通の表現として定着した。近年もSNS上で若い世代が2ステップのリズムを再発見し続けている。</p>
