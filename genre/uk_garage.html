<h1>UK Garage（ガラージ）とは</h1>
<p>ガラージ・ハウスにジャングル、ラガ、R&amp;Bなどが混ざってイギリスで生まれた音楽で、拍の裏側を跳ねさせる独特のリズムが最大の特徴。基本形は四つ打ちだが、そこにスウィングと呼ばれる16分音符のタイミングのずれを深くかけ、シャッフルする</p>
<p>ガラージ・ハウスにジャングル、ラガ、R&amp;Bなどが混ざってイギリスで生まれた音楽で、拍の裏側を跳ねさせる独特のリズムが最大の特徴。基本形は四つ打ちだが、そこにスウィングと呼ばれる16分音符のタイミングのずれを深くかけ、シャッフルする跳ねた質感を作る。テンポは130BPM前後。もう一つの型が2ステップで、こちらは2拍目と4拍目のキックを抜き、キックを1拍目と3拍目付近に置いて、スネアはオフビートの配置やアクセントも用い（2・4拍が基本になる曲もある）、拍の骨格そのものを崩す。パーカッションはシャッフルしたハイハットと、リムショット（太鼓の縁を叩く音）やウッドブロックが細かく散らされ、人間味のある揺れを作る。ベースは低く沈むサブベース（体に響く極低音）が特徴で、波形は正弦波（最もなめらかで純粋な波形）的なものが使われることもあり、キックの隙間に潜り込むように置かれる。上物（メロディーなど上に重ねる音）はR&amp;Bのヴォーカルを切り刻んだもの、ソウルの和音、そして時に弦楽器のサンプルが重なる。ヴォーカルの扱いが特徴的で、女性歌手のフレーズを細かく分断して音程を上げ、リズム楽器のように配置するチョップ（細かく切り刻む）の技法が多用される。また、MCがフロアで韻を踏んで煽る文化があり、これがのちのグライムに繋がった。ヴォーカル曲はR&amp;B的な恋愛の歌が多い一方、MCが主導する暗いガラージでは暴力や路上の題材も扱われた。ハウスと比べて拍が跳ね、ジャングルと比べてテンポが遅く洗練された仕上げになる点で区別される。</p>
<h2>成り立ち</h2><p>1990年代前半から半ばにかけてのロンドンで、アメリカのガラージ・ハウスにジャングル、ラガ、R&amp;Bなどが混ざり、イギリスのクラブで独自に発展して生まれた。名称はニューヨークのクラブParadise Garageに由来するが、音は大きく異なる。きっかけについては複数の説がある。ジャングルが硬質な音になって客層が離れる中、DJがアメリカ盤のガラージ・ハウスをピッチアップ（回転数を上げて速く再生）してかけたことが発端の一つとされる。これによりヴォーカルが甲高くなり、さらにイギリスの制作者がジャングル由来の低音を加え、パーカッションをいっそう跳ねさせて、独自のスタイルが生まれた。初期の重要な場はロンドン南部で「Sunday Scene」と呼ばれた日曜に開かれたアフターパーティーや夜のイベント群や、Twice as Niceというクラブナイト（イベント）で、服装規定（テニスシューズ・ジーンズ・野球帽の禁止）があり、シャンパンを飲む洗練された装いが特徴だった。ジャングルのシーンにもデザイナーブランド志向はあったが、ガラージのクラブは洗練を競う場だった。海賊放送(パイレーツ・ラジオ)が普及の中心で、ロンドンの団地などから違法に送信した海賊放送局が情報網を担った。初期のRinse FMは高層団地を転々としながら放送し（1994年にジャングル局として始まり、1997年ごろガラージ中心になった）、Freek FMは最初期のガラージの主要な放送局だった。1997年から2001年が最盛期で、Double 99「RipGroove」(1997年)、Tina Moore「Never Gonna Let You Go」(1995年に米国で制作されたリミックスが1997年に英国で再発されてヒット)、Artful Dodgerの1999年「Re-Rewind」(Craig Davidが歌った)、Sweet Female Attitude「Flowers」、So Solid Crewの2001年「21 Seconds」が全英チャートの上位に入った。So Solid Crewは20人超（のち約30人に拡大したとされる）の集団で、2001年11月に公演会場（ロンドンのAstoria）で銃撃事件が起き（グループの関与はなかったと報じられている）、これに加えてメンバーの逮捕や有罪が重なり、大衆紙による犯罪と結びつけた報道が過熱した。この結果、警察がこのグループの公演を禁止し、悪評でガラージ全体が逆風を受けるようになった。MCが主役の暗いガラージは、別の流れも生んだ。2000年前後に暗いガラージの上でMCが主役になり、それが2000年代前半にグライムとして形を取った（主流になったのは2003〜04年ごろで、起点には諸説ある）。同時にダブステップが、サウス・ロンドン（CroydonのBig Apple RecordsやFWD&gt;&gt;など）で、UKガラージの2ステップ的なリズムとダブ的な疎な制作が結びついて生まれ、低音に集中する方向へ分岐した。UKガラージ自体は2001〜2002年ごろに主流から後退したが、2011年ごろから2ステップの再評価が始まり、2010年代前半から半ば（2012〜2015年ごろ）にDisclosureやJamie xxがその表現を再解釈して国際的に成功し、以後はUKベースの作り手がUKガラージや2ステップを参照するようになった。近年もSNS上で若い世代が2ステップのリズムを再発見し続けている。</p>
