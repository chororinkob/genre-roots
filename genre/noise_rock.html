<h1>Noise Rock（ノイズロック）とは</h1>
<p>ロックバンドの編成を保ちながら、通常は避けるべき失敗とされる音、すなわちハウリング、歪みの飽和、弦の共振、不協和な響きを積極的に作品の中心へ据える音楽である。ギターは標準的なチューニングを捨て、複数の弦を同じ音に合わせたり全体を極</p>
<p>ロックバンドの編成を保ちながら、通常は避けるべき失敗とされる音、すなわちハウリング、歪みの飽和、弦の共振、不協和な響きを積極的に作品の中心へ据える音楽である。ギターは標準的なチューニングを捨て、複数の弦を同じ音に合わせたり全体を極端に下げたりして、コードを押さえると必ず唸りが生じる状態を作る。弾き方も指板の上を滑らせる、弦の下に金属棒やドライバーを差し込む、アンプの前に立ってフィードバックを持続させるなど、音程を制御しない手法が用いられる。低音は太く歪んだベースが担い、しばしばギターより前に出る。ドラムは装飾を削り、一定の重い刻みを機械的に繰り返すか、逆に拍を崩して雪崩のように叩き込む。曲によっては生ドラムの代わりにドラムマシンが使われ、その硬く冷たい正確さが人力の演奏と衝突する効果を狙う。歌は絶叫、呟き、朗読、絡みつくような語りなど旋律から離れた形を取り、歌詞は暴力、性、精神の破綻、社会への嫌悪といった不快な主題を扱うことが多い。構成は緊張の持続を優先し、解放や大団円を意図的に与えない。同じ轟音でもシューゲイザーが甘い和声を霞ませるのに対し、こちらは和声そのものを敵視する点で異なる。</p>
<h2>成り立ち</h2><p>直接の起点は1978年のニューヨークで起きたノー・ウェイヴである。パンクが定型化したことへの反発から、演奏技術も伝統も持たない者たちがロックの語法を根本から拒否し、Brian Enoが制作した同年のコンピレーション、ノー・ニューヨークには、James Chanceを擁するThe Contortions、Lydia Lunchが率いたTeenage Jesus and the Jerks、Mars、Arto Lindsayらが在籍したDNAが収められた。彼らはギターをまともに調律せず、和音を弾かず、曲を完成させないことを方法とした。この空気の中から1981年に登場したSonic Youthは、変則チューニングとドライバーやヤスリを弦に挟む奏法を体系化し、1988年のデイドリーム・ネイションで実験性とポップな快楽を両立させ、後のオルタナティヴ・ロック全体を用意した。同時期のニューヨークではMichael GiraのSwansが、極端に遅く重い反復と暴力的な音量で、聴衆を耐久試験にかけるような演奏を続けていた。中西部では独立系レーベルが決定的な役割を果たす。シカゴのTouch and Goを引き継いだCorey Ruskは、Steve AlbiniのBig Blackを世に出した。Big Blackは1986年のアトマイザーで、生ドラマーを置かずRolandのリズムマシンを使い、金属的なギターとアメリカ社会の暗部を描く歌詞を組み合わせ、この分野の思想的な原型となった。ミネアポリスではTom Hazelmyerが1986年に始めたAmphetamine Reptileが、この音の一大拠点となる。テキサスのButthole Surfersは幻覚的で猥雑なライブで悪名を得て、David Yow率いるThe Jesus Lizardは危険極まりないステージ上の振る舞いで伝説となった。日本では大阪のBoredomsが、山塚アイの奇声と脈絡を欠いた展開で1980年代末から海外へ衝撃を与え、ノイズロックが英米だけの現象ではないことを示した。1990年代前半、Nirvanaの成功によりこの周辺のバンドが一斉にメジャーと契約したが、その多くは商業的に失敗し、シーンは再び独立系へ戻る。現在もProvidenceのLightning Boltのような二人組が、床に置いた機材を客に囲まれて鳴らす形式でこの伝統を継いでおり、その暴力的な音響はスラッジ、ポストハードコア、ポストパンクの各分野へ深く浸透している。</p>
