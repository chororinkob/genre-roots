<h1>Noise Rock（ノイズロック）とは</h1>
<p>ノイズロックは、ロックバンドの編成を保ちながら、ふつうは避けるべき失敗とされる音を、進んで作品の中心に置く音楽だ。その音とは、ハウリング、歪みが振り切れた状態、弦の共振、不協和な響きである。 主役はギター。標準的なチューニングを捨</p>
<p>ノイズロックは、ロックバンドの編成を保ちながら、ふつうは避けるべき失敗とされる音を、進んで作品の中心に置く音楽だ。その音とは、ハウリング、歪みが振り切れた状態、弦の共振、不協和な響きである。

主役はギター。標準的なチューニングを捨てるバンドもある。複数の弦を同じ音に合わせたり、全体を極端に下げたりするバンドでは、コードを押さえると唸りが生じる傾向がある。弾き方も、指板の上を滑らせる、弦の下に金属棒やドライバーを差し込む、アンプの前に立ってフィードバックを持続させるなど、音の高さをコントロールしない手法が使われる。

低音は、太く歪んだベースが担う。バンドによっては、ギターより前に出る。

ドラムは装飾を削る。一定の重い刻みを機械的に繰り返すか、逆に拍を崩して雪崩のように叩き込む。曲によっては、生ドラムの代わりにドラムマシンが使われる。その硬く冷たい正確さが、人力の演奏と衝突する効果を狙っている。

歌は、絶叫、呟き、朗読、絡みつくような語りなど、メロディーから離れた形をとる。歌詞は、暴力、性、精神の破綻、社会への嫌悪といった不快な主題を扱うことが多い。

曲の組み立ては、緊張を保ち続けることを優先する。解放や大団円は、意図的に与えない。同じ轟音でも、シューゲイザーが甘い和声を霞ませるのに対し、こちらは無調の響きを取り入れる傾向がある点で異なる。</p>
<h2>成り立ち</h2><p>重要な源流の一つは、1970年代後半のニューヨークで起きたノー・ウェイヴだ。先駆には、1960年代のバンドもいる。パンクが定型化したことへの反発から、ロックの表現を根本から問い直す人たちが現れた。

Brian Enoが制作した1978年のコンピレーション、ノー・ニューヨークには、James Chanceを擁するThe Contortions、Lydia Lunchが率いたTeenage Jesus and the Jerks、Mars、Arto Lindsayらが在籍したDNAが収められた。彼らはギター中心の編成が多いが、サックスやキーボードを含むバンドもあった。目指したのは、従来の演奏の作法を壊すことだった。

この空気の中から、1981年にSonic Youthが登場する。変則チューニングと、ドラムスティックやドライバーを弦の間に差し込み、ヤスリなどを弦の上で擦る奏法を、きちんと形にした。1988年のデイドリーム・ネイションでは、実験性とポップな快楽を両立させた。そして、後のオルタナティヴ・ロックに大きな影響を与えた。同時期のニューヨークでは、Michael GiraのSwansが、極端に遅く重い反復と暴力的な音量で、聴衆を耐久試験にかけるような演奏を続けていた。

一方、中西部では、独立系レーベルが決定的な役割を果たす。Touch and Goは、1979年にミシガン州でファンジンとして始まった。1983年にCorey Ruskが引き継ぎ、のちにシカゴへ移り、Steve AlbiniのBig Blackの作品を手がけた。Big Blackは、1986年のアトマイザー期には、生ドラマーを置かずリズムマシンを使った。クレジット上は「Roland」名義である。金属的なギターと、アメリカ社会の暗部を描く歌詞を組み合わせ、この分野の先駆者の一つとなった。

1986年には、Tom Hazelmyerがワシントン州でAmphetamine Reptileを設立し、のちにミネアポリスへ移した。このレーベルが、この音の大きな拠点となる。テキサスのButthole Surfersは、幻覚的で猥雑なライブで悪名を得た。David Yow率いるThe Jesus Lizardは、危険極まりないステージ上の振る舞いで伝説となった。

日本でも動きがあった。大阪のBoredomsは、山塚アイの奇声と脈絡を欠いた展開で知られる。1980年代末に米国のアンダーグラウンドと接点を持ち、1990年前後の米国盤を機に注目された。ノイズロックが英米だけの現象ではないことを示したバンドだ。

その後、メジャーとの契約も進む。Sonic Youthは1990年にDGCと契約し、ノイズロックの文脈ではメジャー契約の初期の例となった。The Jesus Lizardも1995年にCapitolと契約した。

現在も、ProvidenceのLightning Boltのような2人組が、床に置いた機材を客に囲まれて鳴らす形式で、この伝統を継いでいる。ノイズロックはポストパンクやハードコアから生まれ、その暴力的な音響は、のちにスラッジ、ポストハードコアの各分野へ影響した。</p>
