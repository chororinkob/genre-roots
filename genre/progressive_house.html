<h1>Progressive House（プログレッシブハウス）とは</h1>
<p>ハウスの四つ打ちを保ちながら、長い時間をかけて少しずつ音を積み上げていく構成を特徴とする系統。名称の progressive は、プログレッシブ・ロックの複雑さではなく、段階的に進行するという意味に近い。一曲が7分から12分に及び</p>
<p>ハウスの四つ打ちを保ちながら、長い時間をかけて少しずつ音を積み上げていく構成を特徴とする系統。名称の progressive は、プログレッシブ・ロックの複雑さではなく、段階的に進行するという意味に近い。一曲が7分から12分に及び、最初の数分は最小限の要素だけで進み、そこに16小節あるいは32小節ごとに新しい層が一つずつ加わっていく。この積層の過程そのものが内容になる。テンポは126〜134BPM。キックは中低域を厚く占め、サイドチェイン・コンプレッションによって上物の音量がキックに合わせて周期的に沈み、脈打つような呼吸を作る。この処理がジャンルの質感を決定づけている。ベースは持続音に近い低いうねりで、旋律というより地面として機能する。上物はアルペジエーターによる16分音符の細かい分散和音、長いリリースを持つパッド、そしてディレイを深くかけた単音のリード。和声はマイナー調の4コード循環が基本で、コード進行が変わらないまま音色の変化だけで数分間の緊張を維持する。曲の頂点ではブレイクダウンで打楽器が全て抜け、パッドと残響だけになり、そこからフィルターを徐々に開いてキックが戻る。ヴォーカルは入る場合、短いフレーズを繰り返す抽象的なもの。トランスと隣接するが、トランスの高揚した旋律に対して、より抑制的で暗く、地面を這う質感を保つ点が異なる。</p>
<h2>成り立ち</h2><p>1990年代前半のイギリスで生まれた。背景には、1988年から1990年のアシッドハウスとレイヴの熱狂が政府の規制で締め上げられ、大規模な野外パーティーから室内のクラブへ場が移ったという事情がある。狭い箱で長時間かけて客を高揚させるには、レイヴの即効的な高揚とは異なる、じわじわと積み上げる構成が必要だった。呼称としてのprogressive houseは1992年にイギリスの音楽誌Mixmagが用いたのが早い例とされる。中心となったのはロンドンのレーベルGuerrillaで、William Orbitのプロジェクトなどを擁した。またLeftfield(Neil BarnesとPaul Daley)の1990年の「Not Forgotten」や、Sasha(Alexander Coe)とJohn Digweedというイギリスの二人のDJが決定的な役割を果たした。SashaとDigweedは1994年から組んで長時間のDJセットを行い、1996年の編集盤「Northern Exposure」で、複数の曲を重ねて一つの物語のように繋ぐ手法を提示した。1990年代半ばには一度衰退したが、1999年前後にBedrock(Digweedのレーベル)、Hooj Choons、Yoshitoshiといったレーベルを軸に復活する。この時期はより暗くミニマルな方向へ進み、Hernan Cattaneo(アルゼンチン)、James Holden、Nick Warrenが加わった。2000年代前半にはアメリカとカナダにも広がり、Deep Dishが2005年にグラミー賞を受賞している。2008年前後から大きな変質が起きる。オランダやスウェーデンの制作者が、この形式の積層と巨大なブレイクダウンを、より短く分かりやすいポップな構成に圧縮し、それがEDMの主流形式となった。Swedish House Mafia、Deadmau5、Eric Prydz、そして2011年のAviciiがこの流れを代表する。この時期にプログレッシブ・ハウスという語は、元来の長尺で内省的な音楽ではなく、巨大な会場で鳴るドロップ中心の音楽を指すようになり、両者の乖離が問題になった。旧来の支持者は新しい用法を批判し、原型を指すのに「プログレッシブ」の語を避けてメロディック・ハウスやオーガニック・ハウスといった呼称が使われるようになる。2010年代後半以降はAnjunadeepやAll Day I Dream(Lee Burridgeが2011年に始めた)といった場が、原型に近い長尺で瞑想的な形式を継承している。</p>
<h2>代表曲</h2><ul><li>Xpander (Sasha)</li><li>Strobe (Deadmau5)</li><li>Call on Me (Eric Prydz)</li><li>Born Slippy .NUXX (Underworld)</li><li>Leftism (Leftfield)</li></ul>
