<h1>Progressive House（プログレッシブハウス）とは</h1>
<p>ハウスの四つ打ちを保ちながら、長い時間をかけて少しずつ音を積み上げていく構成を特徴とする系統。名称の progressive は、ロックで「実験的なもの」を指して使われた語で、ディスコでは1980年代初頭のデトロイトでイタロ・ディ</p>
<p>ハウスの四つ打ちを保ちながら、長い時間をかけて少しずつ音を積み上げていく構成を特徴とする系統。名称の progressive は、ロックで「実験的なもの」を指して使われた語で、ディスコでは1980年代初頭のデトロイトでイタロ・ディスコを指して使われた例があり、ハウスでも主流と区別するために使われた（ハウスの自然な進化という意味合いもあるとの、レーベル主宰者の発言がある）。一曲は6〜7分台から10分超まで幅があり、最初の数分は最小限の要素だけで進み、そこに8〜16小節ごと（長い構成では32小節ごと）に新しい層が一つずつ加わっていく。この積層の過程そのものが内容になる。テンポはおおむね122〜132BPM程度で、資料により幅がある。キックは中低域を厚く占め、サイドチェイン・コンプレッション（別の音に合わせて音量を自動で下げる処理）によって上物（メロディーなど上に重ねる音）の音量がキックに合わせて周期的に沈み、脈打つような呼吸を作る。この処理は、2000年代以降のモダンなプログレッシブ・ハウスやフェスティバル系で顕著な手法である。ベースは重く低い音で、持続音に近い低いうねりとして地面のように機能する曲もある。上物には、アルペジエーター（和音を自動で一音ずつ鳴らす機能）による16分音符の細かい分散和音、長いリリース（音が消えるまでの長さ）を持つパッド、ディレイを深くかけた単音のリードなどが使われることがある。現代の曲ではメロディーを強調するものも多い。和声（コードの響き）はマイナー調の4コード循環のように同じ進行を繰り返し、音色の変化だけで数分間の緊張を維持する曲もある（豊かな和声進行を持つ曲もある）。曲の頂点ではブレイクダウン（曲の山場の前に静かになる部分）で打楽器が全て抜け、パッドと残響だけになり、そこからフィルターを徐々に開いてキックが戻る。ヴォーカルは入る場合、短いフレーズを繰り返す抽象的なもの。トランスと近接し、初期は同義的に使われた。後のアップリフティング・トランスと比べると、アンセム的な盛り上げが少なく、リズムの層を重視する点が異なる。</p>
<h2>成り立ち</h2><p>1990年代前半のイギリスで生まれた。背景には、1980年代後半から1990年にかけてのアシッドハウスとレイヴの熱狂が政府の規制で締め上げられ、大規模な野外パーティーから室内のクラブへ場が移ったという事情があるという見方がある。狭い箱で長時間かけて客を高揚させるには、レイヴの即効的な高揚とは異なる、じわじわと積み上げる構成が必要だったという見方もある。呼称としてのprogressive houseは1992年にイギリスの音楽誌Mixmagが用いたのが早い例とされる。中心的なレーベルの一つがロンドンのGuerillaで、William Orbitのプロジェクトなどを擁した。またLeftfield(Neil Barnesが単独で書いた1990年のデビュー曲「Not Forgotten」)や、ウェールズ出身のSasha(Alexander Coe)とイングランドのJohn Digweedという2人のDJが決定的な役割を果たした。SashaとDigweedは1993年初頭から組んで長時間のDJセットを行い、1994年の3枚組ミックス「Renaissance: The Mix Collection」に続き、1996年の2枚組ミックス「Northern Exposure」を南北2つの「旅」として構成し、ジャンルの確立に寄与した。1990年から1999年ごろにかけて、Hooj Choons（1990年設立）、Yoshitoshi（1994年設立）、Bedrock（1998年設立。最初の編集盤は1999年）といったレーベルが活動の軸になった。この時期にはHernan Cattaneo(アルゼンチン)とNick Warrenが加わり、James Holdenは2000年代に台頭した。アメリカではワシントンD.C.を拠点とするイラン系アメリカ人のデュオDeep Dishが1994年にレーベルYoshitoshiを設立して活動し、2002年にDido「Thank You」のリミックスでグラミー賞を受賞している（プログレッシブ・ハウスの作品での受賞ではない）。2010年代に大きな変質が起きる。大会場向けの「フェスティバル系（メインステージ）プログレッシブ・ハウス」が広まり、この形式の積層と巨大なブレイクダウンを、より短く分かりやすい構成に圧縮した形が、スウェーデンのSwedish House MafiaやAviciiの台頭とともに国際的に広まった。Eric PrydzやDeadmau5は従来の雰囲気に近い立場にとどまったとされる（一部の曲はポップ寄り）。この時期にプログレッシブ・ハウスという語は、元来の長尺で内省的な音楽ではなく、巨大な会場で鳴るドロップ中心の音楽を指すようになり、両者の乖離が問題になった。旧来の支持者は新しい用法を批判した。原型に近い音は、現在はメロディック・ハウスやオーガニック・ハウスなど別のカテゴリーで扱われることも多い。2010年代後半以降はAnjunadeepやAll Day I Dream(Lee Burridgeが2011年に始めた)といった場が、プログレッシブ寄りの流れを汲む、よりメロディックで瞑想的な系統を担っている。</p>
