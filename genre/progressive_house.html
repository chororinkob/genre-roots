<h1>Progressive House（プログレッシブハウス）とは</h1>
<p>プログレッシブ・ハウスは、ハウスの四つ打ちを保ちながら、長い時間をかけて少しずつ音を積み上げていく構成を特徴とする系統だ。 名称の progressive は、ロックで「実験的なもの」を指して使われた語である。ディスコでは、198</p>
<p>プログレッシブ・ハウスは、ハウスの四つ打ちを保ちながら、長い時間をかけて少しずつ音を積み上げていく構成を特徴とする系統だ。

名称の progressive は、ロックで「実験的なもの」を指して使われた語である。ディスコでは、1980年代初頭のデトロイトで、イタロ・ディスコを指す呼び名として使われた例がある。ハウスの自然な進化という見方もある。

一曲は6〜7分台から10分超まで幅がある。最初の数分は最小限の要素だけで進み、そこに8〜16小節ごと（長い構成では32小節も）に、新しい層が一つずつ加わっていく。この積層の過程そのものが内容になる。テンポはおおむね122〜132 BPM程度（資料により幅がある）。

キックは中低域を厚く占める。サイドチェイン・コンプレッション（別の音に合わせて音量を自動で下げる処理）によって、上物（メロディーなど上に重ねる音）の音量がキックに合わせて周期的に沈み、脈打つような呼吸を作る。この処理は、2000年代以降のモダンなプログレッシブ・ハウスやフェス系ではっきり表れる手法である。

Prydz系など一部のサブスタイルでは、ベースは持続音に近い低いうねりで、旋律というより地面として機能する。上物は、アルペジエーター（和音を自動で一音ずつ鳴らす機能）による16分音符の細かい分散和音、長いリリース（音が消えるまでの長さ）を持つパッド、そしてディレイを深くかけた単音のリードなどが使われる。和声（コードの響き）はマイナー調の4コード循環のまま、音色の変化だけで数分間の緊張を維持する傾向がある。

曲の頂点では、ブレイクダウン（曲の山場の前に静かになる部分）で打楽器が全て抜け、パッドと残響だけになる。そこからフィルターを徐々に開いて、キックが戻る。ヴォーカルは、入る場合、短いフレーズを繰り返す抽象的なものだ。

トランスと近接し、初期は同義的に使われた。後のアップリフティング・トランスと比べると、アンセム的な盛り上げが少なく、リズムの層を重視する。</p>
<h2>成り立ち</h2><p>プログレッシブ・ハウスは、1990年代前半のイギリスで生まれた。背景には、1988年から1990年のアシッドハウスとレイヴの熱狂が政府の規制で締め上げられ、大規模な野外パーティーから室内のクラブへ場が移ったという事情があるという見方がある。狭い箱で長時間かけて客を高揚させるには、レイヴの即効的な高揚とは異なる、じわじわと積み上げる構成が必要だったと見られる。

呼称としてのprogressive houseは、1992年にイギリスの音楽誌Mixmagが用いたのが早い例とされる。中心的なレーベルの一つが、ロンドンのレーベルGuerillaで、William Orbitのプロジェクトなどを擁した。またLeftfield(Neil Barnesが単独で書いた1990年のデビュー曲「Not Forgotten」)や、Sasha(Alexander Coe)とJohn Digweedというイギリスの2人のDJが、決定的な役割を果たした。

SashaとDigweedは、1993年初頭から組んで長時間のDJセットを行った。1994年の『Renaissance: The Mix Collection』に続く1996年のNorthern Exposureは、南北2つの『旅』として構成した2枚組ミックスで、ジャンルが固まることに寄与した。

1990年から1999年ごろにかけて、Hooj Choons（1990年設立）、Yoshitoshi（1994年設立）、Bedrock（1998年設立、初のBedrock編集盤は1999年）といったレーベルが活動の軸になった。Hernan Cattaneo(アルゼンチン)、Nick Warrenが加わった。James Holdenは2000年代に注目を集めた。アメリカでは、ワシントンD.C.を拠点とするイラン系アメリカ人のデュオDeep Dishが、1994年にレーベルYoshitoshiを設立して活動した。2002年にDido「Thank You」のリミックスでグラミー賞を受賞している（プログレッシブ・ハウスの作品での受賞ではない）。

2010年代、大会場向けの『festival／mainstage progressive house』が広まり、Avicii、Swedish House Mafiaが人気を集めた。Prydz、Deadmau5は従来の性格に近い立場とされる（一部の曲はポップ寄り）。この時期にプログレッシブ・ハウスという語は、元来の長尺で内省的な音楽ではなく、巨大な会場で鳴るドロップ中心の音楽を指すようになった。両者の乖離が問題になった。

旧来の支持者は、新しい用法を批判した。原型に近い音は、現在はメロディック・ハウス／オーガニック・ハウスなど別のカテゴリーで扱われることも多い。2010年代後半以降は、AnjunadeepやAll Day I Dream(Lee Burridgeが2011年に始めた)といった場は、プログレッシブ寄りの流れを汲む、よりメロディックで瞑想的な系統である。</p>
