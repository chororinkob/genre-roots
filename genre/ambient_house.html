<h1>Ambient House（アンビエントハウス）とは</h1>
<p>アンビエント・ハウスは、ハウスの繰り返す組み立てと、アンビエントの漂うような響きを組み合わせた音楽である。 四つ打ちのキックが置かれる曲もあれば、リズムそのものがない曲もある。同じ一枚のアルバムの中で、両者が行き来する。テンポはミ</p>
<p>アンビエント・ハウスは、ハウスの繰り返す組み立てと、アンビエントの漂うような響きを組み合わせた音楽である。

四つ打ちのキックが置かれる曲もあれば、リズムそのものがない曲もある。同じ一枚のアルバムの中で、両者が行き来する。テンポはミッドテンポ(中くらいの速さ)からダウンテンポで、速さを測っても意味がない曲もある。

いちばん大事なのは音の重ね方だ。長く伸ばした和音の下地が何枚も重ねられる。そこへ深い残響と、音を遅れて繰り返す効果がかけられ、音が空間の中に浮かんでいるように聞こえる。

素材の選び方も独特だ。シンセサイザーの音だけでなく、鳥の声、水の音、羊の鳴き声、無線の交信、古い映画の台詞、宇宙飛行士の通信記録といった、放送・映画・効果音盤などから採った素材が、ほかの音と同じ重みで使われる。これらは効果音として添えられるのではない。メロディーに負けない重みを持って置かれる。

低音はダブの影響を受けている。深く沈んだベースに、反響音が加えられる。

長い曲も多い。たとえば、The Orbの1989年のシングルは19分07秒ある。展開はとてもゆるやかで、要素が少しずつ入れ替わりながら、情景が移り変わっていく。踊る場の休憩のための空間で流すこと、あるいは自宅で横になって聴くことが前提とされている。</p>
<h2>成り立ち</h2><p>1988年から1989年のイギリスが舞台である。

アシッド・ハウスが爆発的に流行し、一晩中踊り続ける催しが各地で開かれるようになった。そうなると当然、休む場所が必要になる。会場には別室が設けられ、そこで穏やかな音楽が流されるようになった。やがて、この空間のための音楽が、独立した分野として意識されるようになっていく。

中心となった人物とされるのは、Alex PatersonとJimmy Cautyである。Patersonは1988年にCautyとともにThe Orbを結成した。そして1989年に、ロンドンのクラブ(Heaven)で休息の部屋の選曲を担当した。

1989年10月には、極端に長い題名を持つ曲が発表された。SFラジオドラマ由来の効果音や自然音、Minnie Ripertonの声のサンプルなどを大胆に使った曲だ。この曲は、拍を前に出さない音楽が、ダンス文化の内側から生まれうることを示した。

The KLFの一員でもあるJimmy Cautyは、The Orbの共同創設者として、1990年4月に脱退した。この二組は深くつながっている。1990年、The KLFは『Chill Out』と題した作品を発表した。アメリカ南部を夜通し移動する架空の旅として組み立てられ、列車の音や無線放送、羊の声が途切れなくつながれた一続きの作品だ。これが、この分野の記念碑となった。

同じころ、マンチェスターの808 Stateは1989年に「Pacific」を発表した(11月発売、全英10位)。Graham Massey本人の演奏のサックスと、鳥の声のサンプルを使った曲だ。これがイギリス全土でヒットし、この方向は広い聴き手を得る。

1992年には、Aphex Twinが『Selected Ambient Works 85–92』を発表した。一般にはアンビエント・テクノの作品として扱われるが、アンビエント・ハウスと同じ流れで語られることもある。10代前半から録りためた録音をまとめた作品だ。ダンス音楽の流れから生まれた響きが、それだけで聴くに値することを示した。The Future Sound of Londonは、アンビエント、ハウス、トリップホップ、ダブなどにまたがり、境界を押し広げる存在とされる。

この分野が持った歴史的な意味は大きいとされる。踊るための音楽と聴くための音楽の境目を取り払い、環境音の使用を広めた。そして、ダウンテンポやチルアウトとは同時期に並行して発展し、IDMと呼ばれる領域の形成に影響を与えた。</p>
