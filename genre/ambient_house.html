<h1>Ambient House（アンビエントハウス）とは</h1>
<p>ハウスの反復する構造と、アンビエントの浮遊した音響を組み合わせた音楽である。四つ打ちのキックが置かれる場合もあれば、リズムそのものが存在しない場合もあり、同じ一枚の中で両者が行き来する。テンポはミッドテンポ(中くらいの速さ)からダ</p>
<p>ハウスの反復する構造と、アンビエントの浮遊した音響を組み合わせた音楽である。四つ打ちのキックが置かれる場合もあれば、リズムそのものが存在しない場合もあり、同じ一枚の中で両者が行き来する。テンポはミッドテンポ(中くらいの速さ)からダウンテンポで、計測が意味を持たない曲もある。いちばん大事なのは音の重ね方で、長く伸ばした和音の下地が何枚も重ねられ、そこへ深い残響と、音を遅れて繰り返す効果がかけられることで、音が空間の中に浮かんでいるように聞こえる。素材の選択が独特で、シンセサイザーの音だけでなく、鳥の声、水の音、羊の鳴き声、無線の交信、古い映画の台詞、宇宙飛行士の通信記録といったその場で録った音が、ほかの音と同じ重みの素材として使われる。これらは効果音として添えられるのではなく、メロディーに負けない重みを持って置かれる。低音はダブの影響を受けており、深く沈んだベースに反響音が加えられる。曲は10分から20分を超えることも多く、展開はとてもゆるやかで、要素が少しずつ入れ替わりながら情景が移り変わる。踊り場の休息のための空間で鳴らすこと、あるいは自宅で横になって聴くことが前提とされている。</p>
<h2>成り立ち</h2><p>1988年から1989年のイギリスが舞台である。アシッド・ハウスの爆発的な流行によって、一晩中踊り続ける催しが各地で開かれるようになると、当然、休む場所が必要になった。会場には別室が設けられ、そこで穏やかな音楽が流されるようになる。この空間のための音楽が、独立した分野として意識されるようになっていった。決定的な人物はAlex PatersonとJimmy Cautyである。Patersonはロンドンのクラブ(Heaven)で休息の部屋の選曲を担当しながら、1988年にCautyとともにThe Orbを結成した。1989年10月に発表された、極端に長い題名を持つ楽曲は、SFラジオドラマ由来の効果音や自然音、Minnie Ripertonの声のサンプルなどを大胆に用い、拍を前面に出さない音楽がダンス文化の内側から生まれうることを示した。The KLFの一員でもあるJimmy Cautyは、The Orbの共同創設者として1990年4月に脱退した。この二組は密接に関係している。1990年、The KLFはチルアウトと題した作品を発表した。これはアメリカ南部を夜通し移動する架空の旅として構成され、列車の音や無線放送、羊の声が途切れなく繋がれた一続きの作品であり、この分野の記念碑となった。同じ時期、マンチェスターの808 Stateは1989年に、サックスと鳥の声のサンプルを用いた「Pacific State」(11月発売、全英10位)を発表し、これがイギリス全土でヒットしたことで、この方向は広い聴衆を得る。1992年にはAphex Twinが、10代前半から録りためた録音をまとめた作品『Selected Ambient Works 85–92』を発表し、ダンス音楽の文脈から生まれた音響が単独で鑑賞に堪えることを示した。The Future Sound of Londonは、より映像的で精緻な音響設計を追求している。この分野が持った歴史的な意義は大きい。踊るための音楽と聴くための音楽の境界を取り払い、環境音を音楽の素材として一般化させ、そして後のダウンテンポ、チルアウト、IDMと呼ばれる領域の形成に影響を与えた。</p>
