<h1>Ambient House（アンビエントハウス）とは</h1>
<p>ハウスの反復する構造と、アンビエントの浮遊した音響を組み合わせた音楽である。四つ打ちのキックが置かれる場合もあれば、リズムそのものが存在しない場合もあり、同じ一枚の中で両者が行き来する。テンポは概ね110から125 BPM、あるい</p>
<p>ハウスの反復する構造と、アンビエントの浮遊した音響を組み合わせた音楽である。四つ打ちのキックが置かれる場合もあれば、リズムそのものが存在しない場合もあり、同じ一枚の中で両者が行き来する。テンポは概ね110から125 BPM、あるいは計測が意味を持たない。決定的な要素は音の層の作り方で、長く伸ばした和音の敷物が幾重にも重ねられ、そこへ深い残響と遅延効果がかけられることで、音が空間の中に浮かんでいるように配置される。素材の選択が独特で、シンセサイザーの音だけでなく、鳥の声、水の音、羊の鳴き声、無線の交信、古い映画の台詞、宇宙飛行士の通信記録といった現場の録音が、対等な要素として用いられる。これらは効果音として添えられるのではなく、旋律に匹敵する重みを持って配置される。低音はダブの影響を受けており、深く沈んだベースに反響音が加えられる。曲は10分から20分を超えることも多く、展開は極めて緩やかで、要素が少しずつ入れ替わりながら情景が移り変わる。踊り場の休息のための空間で鳴らすこと、あるいは自宅で横になって聴くことが前提とされている。</p>
<h2>成り立ち</h2><p>1988年から1989年のイギリスが舞台である。アシッド・ハウスの爆発的な流行によって、一晩中踊り続ける催しが各地で開かれるようになると、必然的に休息の必要が生じた。会場には別室が設けられ、そこで穏やかな音楽が流されるようになる。この空間のための音楽が、独立した領域として自覚されていった。決定的な人物はAlex Patersonである。彼はロンドンのクラブで休息の部屋の選曲を担当しながら、The Orbという名義で制作を始めた。1989年に発表された、極端に長い題名を持つ楽曲は、宇宙飛行士の通信の録音や羊の鳴き声を大胆に用い、拍のない音楽がダンス文化の内側から生まれうることを証明した。初期にはThe KLFのJimmy Cautyが協力しており、この二組は密接に関係している。1990年、The KLFはチルアウトと題した作品を発表した。これはアメリカ南部を夜通し移動する架空の旅として構成され、列車の音や無線放送、羊の声が途切れなく繋がれた一続きの作品であり、この分野の記念碑となった。同じ時期、マンチェスターの808 Stateは1989年に、パンフルートを模した音色による穏やかな楽曲を発表し、これがイギリス全土でヒットしたことで、この方向は広い聴衆を得る。1992年にはAphex Twinが、10代の頃の録音をまとめた作品を発表し、ダンス音楽の文脈から生まれた音響が単独で鑑賞に堪えることを示した。The Future Sound of Londonは、より映像的で精緻な音響設計を追求している。この分野が持った歴史的な意義は大きい。踊るための音楽と聴くための音楽の境界を取り払い、環境音を音楽の素材として一般化させ、そして後のダウンテンポ、チルアウト、IDMと呼ばれる領域の全てを準備した。</p>
