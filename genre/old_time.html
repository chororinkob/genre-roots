<h1>Old-Time Music（オールドタイム）とは</h1>
<p>アメリカのアパラチア山脈周辺で受け継がれてきた、ブルーグラス以前の弦楽合奏の音楽である。編成の中心はフィドルと五弦バンジョーで、そこにギター、時にマンドリンや低音楽器が加わる。決定的に重要なのがバンジョーの奏法で、指で弦を弾き上げ</p>
<p>アメリカのアパラチア山脈周辺で受け継がれてきた、ブルーグラス以前の弦楽合奏の音楽である。編成の中心はフィドルと五弦バンジョーで、そこにギター、時にマンドリンや低音楽器が加わる。決定的に重要なのがバンジョーの奏法で、指で弦を弾き上げるのではなく、手の甲を外に向けて爪で弦を下向きに叩き、同時に親指が最も短い第五弦を鳴らすという奏法が用いられる。この、途切れることのない細かい刻みが打楽器の役割を担い、独特の推進力を生む。調弦も標準ではなく、曲ごとに弦の音を張り替えて、開放弦が常に共鳴するように調整される。フィドルも同様に変則的な調弦を用い、二本の弦を同時に擦って持続音を鳴らす。この持続音があるため、和声は近代的な進行を持たず、旋法的で古風な響きを保つ。最も本質的な違いはブルーグラスとの対比にある。ブルーグラスが各奏者の独奏を順に回すのに対し、こちらは全員が最初から最後まで同じ旋律と伴奏を繰り返し続け、独奏は存在しない。曲はAABBの二部形式を延々と反復するもので、これは踊りが終わるまで続けるためである。つまり鑑賞ではなく、共同体の踊りのための実用音楽である。</p>
<h2>成り立ち</h2><p>この音楽の成立には、しばしば語られない重要な事実がある。中心楽器であるバンジョーは、ヨーロッパ由来ではなく、西アフリカから奴隷として連行された人々が持ち込んだ弦楽器を起源とする。瓢箪に皮を張って作られたその楽器は、南部の農園で黒人によって演奏され、その奏法と音楽が、白人の入植者が持つイギリス諸島由来のフィドル音楽と接触することで、この弦楽合奏の様式が生まれた。つまりこの音楽は最初から人種の混淆の産物である。しかし19世紀、白人が顔を黒く塗って黒人を戯画的に演じる興行が全米で流行し、その中でバンジョーが白人の楽器として広まった結果、この楽器の起源は忘れられていった。20世紀に入ると録音産業がこの音楽を記録し始める。1923年のFiddlin' John Carsonの録音は最初期の商業カントリーとされ、1927年にテネシー州で行われた一連の録音では、The Carter FamilyとJimmie Rodgersが発掘され、これが商業カントリーの起点となった。Charlie Pooleや、Gid Tanner and the Skillet Lickersといった楽団が人気を得たが、1930年代の大恐慌とラジオの普及によって、この音楽は次第に古臭いものと見なされる。転機は1952年である。前衛的な芸術家Harry Smithが、自らの膨大な収集から選んだ戦前の録音をまとめた編集盤を発表し、これが埋もれていた音楽を若い世代へ伝えた。1960年代のフォーク復興運動では、New Lost City Ramblersのように、戦前の演奏を忠実に再現しようとする一群が現れる。近年では、この音楽の黒人の起源を回復しようとする動きが重要である。Carolina Chocolate Dropsは、高齢の黒人フィドル奏者Joe Thompsonに直接学び、消されてきた黒人の弦楽合奏の伝統を舞台へ戻した。現在も各地で、踊りのための生きた音楽として演奏され続けている。</p>
