<h1>Old-Time Music（オールドタイム）とは</h1>
<p>オールドタイムは、アメリカをはじめ北米の各地、とくにアパラチア山脈周辺で受け継がれてきた、ブルーグラス以前の弦楽合奏の音楽だ。踊りの伴奏を中心に発展した音楽で、歌やバラッドも含む。 編成の中心はフィドルと5弦バンジョーだ。そこにギ</p>
<p>オールドタイムは、アメリカをはじめ北米の各地、とくにアパラチア山脈周辺で受け継がれてきた、ブルーグラス以前の弦楽合奏の音楽だ。踊りの伴奏を中心に発展した音楽で、歌やバラッドも含む。

編成の中心はフィドルと5弦バンジョーだ。そこにギター、時にマンドリンや低音楽器が加わる。決定的に重要なのがバンジョーの奏法である。指で弦を弾き上げるのではなく、手を爪のような形にして、人差し指または中指の爪の背で弦を下向きに叩く。その直後の裏拍で、親指が最も短い第五弦を鳴らす。この、途切れることのない細かい刻みが打楽器の役割を担い、独特の推進力を生む。

調弦は、多くの場合、曲やキーに合わせて変える(フィドルではクロスチューニング)。開放弦の共鳴やドローンを活かす。フィドルも同様に変則的な調弦を用いる。隣の開放弦が、旋律の上や下で鳴り続けるドローンになる。このドローンが、素朴で古風な響きを生む。

最も本質的な違いは、ブルーグラスとの対比にある。ブルーグラスが各奏者の独奏を順に回すのに対し、こちらは独奏(ブレイク)がまれにしか取られない。旋律楽器が同じ旋律をそろって弾くのが基本である。

曲はAABBの二部形式（前半の旋律を繰り返し、後半の旋律を繰り返す形）が一般的だ。これを繰り返して、踊りが終わるまで続ける。</p>
<h2>成り立ち</h2><p>この音楽の成立には、しばしば語られない重要な事実がある。中心楽器であるバンジョーは、西アフリカの楽器にルーツを持つ系譜を、アフリカ系の人々が北米・カリブ海でヨーロッパ的要素も取り入れて作り上げた楽器である。瓢箪に皮を張って作られたその楽器は、南部の農園で黒人によって演奏された。その奏法と音楽が、ヨーロッパ各地(イギリス諸島を含む)のフィドルの伝統と混ざり合う。こうして、この弦楽合奏のスタイルが生まれた。つまりこの音楽は、成立の初期からアフリカとヨーロッパ双方の要素を含む。

しかし19世紀、白人が顔を黒く塗って黒人を戯画的に演じる興行が全米で流行した。その中でバンジョーが白人の楽器として広まり、この楽器の起源は忘れられていった。

20世紀に入ると、録音産業がこの音楽を記録し始める。1922年のEck Robertsonに続き、1923年のFiddlin' John Carsonの録音は、歌入りの最初期の商業録音として知られる。1927年にテネシー州・バージニア州にまたがるブリストルで、一連の録音(ブリストル・セッション)が行われた。これはThe Carter FamilyとJimmie Rodgersの商業デビューとなり、現代のカントリー音楽の「ビッグバン」と一部で呼ばれる(異論もある)。Charlie Pooleが率いた楽団や、Gid Tanner and the Skillet Lickersといった楽団が人気を得た。しかし、1930年代の大恐慌でレコード産業が打撃を受け、音楽の嗜好も変化した。他方でラジオは、同系統の音楽を広める役割も果たした。

1952年のアンソロジーは、復興世代に大きな影響を与えた一つの契機である。前衛的な芸術家Harry Smithが、自らの膨大な収集から選んだ戦前の録音をまとめた編集盤を発表した。ブルースやゴスペルなども含む盤で、これが埋もれていた音楽を若い世代へ伝えた。1950年代末から、New Lost City Ramblersのように、戦前の録音に学びつつ、単に写すだけにとどまらない演奏をする一群が現れる。

近年では、この音楽の黒人の起源を回復しようとする動きが重要である。Carolina Chocolate Dropsは、高齢の黒人フィドル奏者Joe Thompsonに直接学び、ほぼ失われかけていた黒人の弦楽合奏の伝統を舞台へ戻した。現在も各地で、踊りのための生きた音楽として演奏され続けている。</p>
<h2>代表曲</h2><ul><li>Wildwood Flower (The Carter Family)</li><li>Reuben's Train (Foghorn Stringband)</li><li>Hills of Mexico (Lonesome Ace Stringband)</li><li>Country Blues (Dock Boggs)</li><li>The Coo Coo Bird (Clarence Ashley)</li><li>The Blackest Crow (Bruce Molsky)</li><li>No Depression in Heaven (The New Lost City Ramblers)</li><li>Cluck Old Hen (Tommy Jarrell)</li><li>John Hardy (Mike Seeger)</li><li>Concord Rag (J.E. Mainer's Mountaineers)</li><li>Oh Death (Dock Boggs)</li></ul>
