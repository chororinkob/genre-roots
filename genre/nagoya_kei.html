<h1>Nagoya Keiとは</h1>
<p>名古屋系は、ヴィジュアル系の中でも名古屋発祥の、暗く重く劇場的な音を指す言葉だ。代表曲22曲を動画で聴け、ルーツと影響のつながりを地図でたどれる。</p>
<p>名古屋系は、ヴィジュアル系の中でも名古屋発祥の、暗く重く劇場的な音を指す言葉だ。

ギターとベースの太く低いリフを土台に、マイナーコードを中心とした緊張感のある和音で曲を進めるのが基本で、華やかさより重さと激しさを前に出す。

メロディはAメロで音域を絞って沈み込ませ、サビで切ない音使いへ転じる構成が多いとされ、この落差が聴きどころとされる。

リズムは4拍子が中心とされる。ドラムは速い8ビートの刻みから、重くのしかかる遅いリフの上でシンバルを強打するパートまで幅が広いという特徴もある。バスドラムを連打して地鳴りのように響かせる奏法も使われることがあるとされる。

ボーカルは、喉を絞るように荒々しく吐き出すシャウトが基本で、低く落ち着いた歌い方と組み合わされることもあるとされる。絶叫に近い叫びを効果的に挟む曲もある。

歌詞は、内面の闇や生きづらさ、絶望といった重い主題が中心で、飾らない直球の言葉で書かれる。

曲の組み立ては、イントロから襲いかかるタイプと、長い静けさを経て感情を解き放つタイプに分かれる傾向があり、派手なソロより全体の緊張感を重視するとされる。

音作りは、ギターアンプを歪ませるディストーションが基本で、装飾を削ぎ落とした引き算的な質感が好まれる。コテコテ系の華麗な装飾で見せるスタイルとは対照的で、黒服系のクールな空気に対しては、より暴力的で黒い音と言われる。

インダストリアル的な冷たさを帯びるバンドや、80年代のビートロック的なバンドも含むが、共通するのは暗さと激しさという点だけで、明確な枠組みはない。</p>
<h2>成り立ち</h2><p>背景には、1980年代の名古屋の地下音楽シーンがある。当時の名古屋では、今池を中心にポストパンク的な動きが起こっていた。この流れとは別に、1990年前後になると若いバンドたちが次々に育っていく。1989年にはSilver~Roseが結成され、黒服系のスタイルで名古屋のインディーズシーンを引っ張った。当時はまだヴィジュアル系という言葉がなく、こうしたバンドはお化粧バンドや逆毛バンド、ハードロックゴシック系と呼ばれていた。

1991年、黒夢が結成される。黒夢はSilver~Roseとともに名古屋の2大巨頭と呼ばれ、インディーズ時代の1stフル・アルバム「亡骸を…」やデモテープ「生きていた中絶児」などで、のちに名古屋系と呼ばれる暗く激しい音を切り開いた。藤が丘のライブハウス、MUSIC FARMを拠点とするバンドが多く、TI+DEEやマニキュア、Sleep My Dear、Sus4、GARNETといった顔ぶれが同じシーンで鳴らしていた。1993年にはLaputaとROUAGEが相次いで結成され、ジャンルとしての輪郭が固まっていく。黒夢は1994年2月にシングル「for dear」でメジャーデビューを果たし、同年7月には「ICE MY LIFE」を発表する。1990年代のはじめには、「名古屋系」という言葉が流行し始めていた。

Silver~RoseのベーシストKAIKIは、名古屋・大須のレコード店、円盤屋と手を組み、レーベルnoirを設立したとされる。noirと円盤屋とMUSIC FARMの3つが、シーンを支える柱になったと言われる。1995年、黒夢はアルバム「feminism」を発表するが、その制作中にギタリストの臣が失踪し、のちに脱退となった。バンドは方向性を変えていき、この変化はソフトヴィジュアル系と呼ばれる流れのきっかけとして語られる。

しかし、1996年ごろにはLaputaとROUAGEがメジャーデビューして作風を変え、noirも閉じたことで、第一次とされる波は終わりを迎える。1998年前後には、Donuts Record Westの開設をきっかけに第二次の波が始まり、kein、Phobia、Lamielといったバンドが、名古屋系の文脈でも語られるようになる。これらのバンドはより重く、遅く、文学的な作風へ進み、2000年以降はdeadmanやGULLET、Blastなど、メンバーの新しいバンドへと受け継がれた。merry go roundは第一次から活動を続け、2004年の解散まで名古屋系を背負ったが、2004年までに大半のバンドが解散し、ジャンルは一つの区切りを迎えたとされる。

一方、黒夢のライブは、首を吊る縄を使った劇場的な演出で知られる。公演中にボーカルの清春が実際に首を吊ってしまったことも、本人談として語り草になっている。愛知県在住の漫画家・なかむら治彦は、この背景について、管理教育に抑圧された若者が自己主張の場を求め、重くて深い歌詞を好んだのではないかと述べている。新潟のbabysitterやGalrudaなど、名古屋でも活動した同じような暗さを持つバンドが名古屋系と呼ばれることもあり、この呼び名は地域を超えた音の記号となっていった。

その後も、この流れは途切れていない。2013年には、次世代の名古屋系を掲げてアルルカンが結成され、激しさと切なさを両立させる楽曲で若いリスナーをつかんだ。ギタリストのaieが黒夢からの影響を語るkeinは2024年11月にメジャーデビューを果たし、keinは結成から27年を数える。</p>
