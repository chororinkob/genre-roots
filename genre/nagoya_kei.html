<h1>Nagoya Keiとは</h1>
<p>名古屋系とは、ヴィジュアル系のなかでも名古屋発祥の、暗く重く劇場的なサウンドを指す言葉である。代表曲22曲を動画で聴け、ルーツと影響のつながりを地図でたどれる。</p>
<p>名古屋系とは、ヴィジュアル系のなかでも名古屋発祥の、暗く重く劇場的なサウンドを指す言葉である。ギターとベースの太く低いリフを土台に、マイナーコードを中心とした緊張感のある和音で曲を進めるのが基本で、華やかさよりも重さと激しさを前面に出す。メロディはAメロで音域を絞って沈み込ませ、サビで急に切ない音使いへ転じる構成が多く、この落差が聴きどころになる。リズムは4拍子が中心で、ドラムは速い8ビートの刻みから、重くのしかかる遅いリフの上でシンバルを強打するパートまで幅が広い。バスドラムを連打して地鳴りのように響かせる奏法もよく使われる。ボーカルは、喉を絞るように荒々しく吐き出すシャウトと、低く落ち着いた歌唱を曲中で切り替え、サビで一気にハイトーンへ伸び上げる。絶叫に近い叫びを効果的に挟むのもこのジャンルの代名詞である。歌詞は内面の闇、生きづらさ、絶望といった重い主題が中心で、飾らない直球の言葉で書かれる。曲の構成はイントロから襲いかかるタイプと、長い静けさを経て感情を解き放つタイプに分かれ、派手なソロより全体の緊張感を重視する。音作りは歪んだギターアンプのディストーションが基本で、装飾を削ぎ落とした引き算的な質感が好まれる。コテコテ系の華麗な装飾で見せるスタイルとは対照的で、黒服系のクールな空気に対しては、より暴力的で黒い音と形容される。インダストリアル的な冷たさを帯びるバンドや80年代のビートロック的なバンドも含むが、一致するのは暗さと激しさという点だけで、明確な枠組みはない。</p>
<h2>成り立ち</h2><p>名古屋系の物語は、1980年代の名古屋の地下音楽シーンから始まる。当時の名古屋では今池を中心にポストパンク的なムーブメントが起こっており、この下地の上に1990年前後の若いバンドたちが育っていく。1989年にはSilver~Roseが結成され、黒服系のスタイルで名古屋のインディーズシーンを牽引した。当時はまだヴィジュアル系という言葉がなく、こうしたバンドはお化粧バンドや逆毛バンド、ハードロックゴシック系と呼ばれていた。
1991年、黒夢が結成される。黒夢はSilver~Roseとともに名古屋の2大巨頭と呼ばれ、インディーズ時代の「亡骸を…」や「生きていた中絶児」などの楽曲で、のちに名古屋系と呼ばれる暗く激しいサウンドを切り開いた。藤が丘のライブハウスMUSIC FARMを拠点とするバンドが多く、TI+DEEやマニキュア、Sleep My Dear、Sus4、GARNETといった顔ぶれが同じシーンで鳴らしていた。1993年にはLaputaとROUAGEが相次いで結成され、ジャンルとしての輪郭が固まっていく。黒夢は1994年2月にシングル「for dear」でメジャーデビューを果たし、同年7月には「ICE MY LIFE」を発表する。音楽雑誌で「名古屋系」という言葉が流行し始めたのもこのころである。
1994年にはSilver~RoseのベーシストKAIKIが、名古屋・大須のレコード店円盤屋と手を組み、レーベルnoirを設立する。noirと円盤屋とMUSIC FARMの3つが、シーンを支える柱となった。1995年、黒夢はアルバム「feminism」を発表するが、その制作中に作曲を担うギタリストの臣が脱退し、バンドは方向性を変えていく。この変化はのちにソフトヴィジュアル系と呼ばれる流れにもつながった。
しかし、1996年ごろにはLaputaとROUAGEがメジャーデビューして作風を変え、noirも閉じたことで、第一次とされる波は終わりを迎える。1998年前後にはDonuts Record Westの開設を機に第二次の波が始まり、keinやPhobia、Lamielといったバンドが登場する。これらのバンドはより重く、遅く、文学的な作風へ進み、2002年ごろからはdeadmanやGULLET、Blastなどメンバーの新バンドへと受け継がれた。merry go roundは第一次から活動を続け、2004年の解散まで名古屋系を背負ったが、2004年までに大半のバンドが解散し、ジャンルはひとつの区切りを迎えたとされる。
一方で、黒夢のライブは首を吊る縄を用いた劇場的な演出で知られ、公演中にボーカルの清春が実際に首を吊ってしまう事故が起きたことも語り草になっている。背景には、管理教育に抑圧された若者が自己主張の場を求め、重くて深い歌詞を好んだという指摘もある。新潟のbabysitterやGalrudaなど、土地を離れた同種の暗さを持つバンドが名古屋系と呼ばれることもあり、名詞は地域を超えた音の記号となっていった。
その後も流れは途切れていない。2013年には次世代名古屋系を掲げてアルルカンが結成され、激しさと切なさを両立させる楽曲で若いリスナーをつかんだ。黒夢の影響を直接受けたkeinは2025年にメジャーデビューを果たし、名古屋系の音は結成から四半世紀を超えて現役で鳴り続けている。</p>
