<h1>Moombahton（ムンバートン）とは</h1>
<p>ハウスの構造を大幅に減速させ、レゲトンのリズムを重ねた音楽。テンポは108〜112BPM前後に固定されており、この遅さがジャンルの定義そのものになっている。リズムの骨格はレゲトンのデムボウ・パターンで、一小節の中でキックが1拍目と</p>
<p>ハウスの構造を大幅に減速させ、レゲトンのリズムを重ねた音楽。テンポは108〜112BPM前後に固定されており、この遅さがジャンルの定義そのものになっている。リズムの骨格はレゲトンのデムボウ・パターンで、一小節の中でキックが1拍目と3拍目付近に置かれ、スネアまたはリムショットが独特の跳ねた位置に3回入る三連的な感覚を持つ。この構造がハウスの四つ打ちの均等さを崩し、腰を使った踊り方を誘発する。ベースは深く沈む正弦波で、しばしばオランダのダッチハウス由来の、ピッチが下降する叫ぶような音(ダーティ・ダッチ)が用いられる。上物は少なく、シンセの短い突き刺し、ラテンのパーカッション(コンガ、ティンバレス、カウベル)、そしてホーンのサンプルが重なる。テンポが遅い分、一音一音の重量感が強く、キックの余韻が長く残る。ヴォーカルはスペイン語のラップやシャウト、あるいは英語の短いフレーズで、加工されて楽器のように扱われることも多い。構成はEDMの型を踏襲し、ビルドアップと無音を経てドロップへ落ちるが、そのドロップが遅いテンポで来ることが独特の肩透かしと快感を生む。レゲトンと比べて電子音の比重が高く、EDM全般と比べて劇的に遅い点が最大の識別点になる。</p>
<h2>成り立ち</h2><p>2009年、アメリカのワシントンD.C.の郊外で、極めて具体的な一つの出来事から生まれた。DJのDave Nada(本名Dave Villegas)は、いとこが主催する高校生の無断欠席パーティー(ディッチ・パーティー)でDJを頼まれた。集まっていたのは大半がラテン系の若者で、レゲトンを聴いていた。Nadaは手持ちのハウスのレコードでは場が持たないと考え、オランダのAfrojackが手がけたSilvio Ecomo &amp; Chuckie「Moombah」のリミックスを、通常の128BPMではなく108BPMまで落として再生した。すると、レゲトンに慣れた身体にそのテンポが合致し、フロアが熱狂した。この即興的な発見が、そのままジャンルの誕生になった。Nadaは曲名の Moombah とレゲトンの語尾を合わせて moombahton と名付け、2010年に無料配布のEP「Moombahton」を発表した。当時のブログ文化とSoundCloudの普及が拡散を加速させ、数か月のうちに世界中の制作者が同じ手法で楽曲を作り始めた。初期の重要な参加者としてはMunchi(オランダ在住のドミニカ系制作者)、Sabo、Nadastrom(Nada自身のユニット)、Dillon Francis、Diploが挙げられる。とりわけMunchiは、この形式にダッチハウスの攻撃性とドミニカのデンボウを持ち込み、moombahcoreというより激しい派生を作った。DiploのレーベルMad Decentが受け皿となり、2011年前後に商業的な広がりを見せる。Skrillexも初期から関心を示し、2012年前後にはこのテンポ帯の楽曲を制作した。ジャンルとしての寿命は短く、2012年頃には流行としての勢いを失った。批判としては、単にテンポを落としただけで音楽的独自性に欠けるという指摘や、ラテン文化を外部の白人制作者が消費しているという文化的専有の問題が提起された。しかし影響は残った。2015年前後から主流ポップスがラテンのリズムを大量に取り込む流れが起き、Justin Bieberの2015年「Sorry」やMajor Lazer &amp; DJ Snakeの「Lean On」といった世界的ヒットは、moombahtonが確立したテンポと質感を明確に継承している。この意味で、短命なジャンルでありながら2010年代後半のポップスの方向を準備した役割は大きい。近年はラテン・トラップやレゲトンの世界的隆盛の中に吸収された形で存続している。</p>
