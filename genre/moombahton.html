<h1>Moombahton（ムンバートン）とは</h1>
<p>ハウスの構造を大幅に減速させ、レゲトンのリズムを重ねた音楽。テンポは約108BPM（1分間の拍数。100〜110BPM程度の幅で語られる）が目安とされ（Nada本人は「唯一の本当のルールはテンポが約108BPMであること」と述べて</p>
<p>ハウスの構造を大幅に減速させ、レゲトンのリズムを重ねた音楽。テンポは約108BPM（1分間の拍数。100〜110BPM程度の幅で語られる）が目安とされ（Nada本人は「唯一の本当のルールはテンポが約108BPMであること」と述べている）、この遅さがジャンルの定義そのものになっている。リズムの骨格はレゲトンでも中核となるデムボウ（ジャマイカのダンスホール由来の跳ねるリズム）・パターンで、キックは1小節に4拍を刻み、デムボウ全体が3+3+2（トレシージョ）のクロスリズムで、スネアまたはリムショット（太鼓の縁を叩く音）がその一部を担う。この跳ねたリズムは、ミッドテンポでスウィング感があると評される。ベースは太く広がるベースラインで、しばしばオランダのダッチハウス由来の、上下に滑る鋭い電子スタブ（短く刺す音）（ダーティ・ダッチ）が重ねられる。上物（メロディーなど上に重ねる音）には、レイヴ系のシンセや、アカペラのラップのサンプル、レゲトン由来の弾むパーカッションが重なることがある。テンポが遅い分、一音一音の重量感が強いと評されることがある。ヴォーカルは入る場合、レゲトンのようにスペイン語のラップを乗せたり、アカペラのラップのサンプルを使ったりすることがある。構成はEDMの型を踏襲し、ビルドアップ（徐々に盛り上げる部分）と無音を経てドロップ（山場で一気に爆発する部分）へ落ちるが、ビルドとドロップの構成を使う点が特徴で、そのドロップが遅いテンポで来る。レゲトンと比べて電子音の比重が高く、ハウス（約128BPM）より約20BPM遅い、レゲトンと同程度のミッドテンポである点が最大の識別点になる。</p>
<h2>成り立ち</h2><p>2009年、アメリカのワシントンD.C.郊外（メリーランド州プリンスジョージズ郡）で、Nada本人の語りによれば、極めて具体的な一つの出来事から生まれた。DJのDave Nada(本名David Villegas)は、いとこが主催する高校生の無断欠席パーティー(ディッチ・パーティー)でDJを頼まれた。集まっていたのは大半がラテン系の若者で、レゲトンを聴いていた。Nadaは手持ちのハウス（CDに入れていたダッチハウスなど）では場が持たないと考え、オランダのAfrojackが手がけたSilvio Ecomo &amp; Chuckie「Moombah」のリミックス（別の人が作り直した版）を、通常の128BPM前後（資料により130〜138BPMとも）ではなく108BPMまで落として再生した。すると、レゲトンに慣れた身体にそのテンポが合致し、フロアが熱狂した。この即興的な発見を足がかりに、その後のエディット（既存曲の手直し版）の制作と共有を経てジャンルになった。Nadaは曲名の Moombah とレゲトンの語尾を合わせて moombahton と名付け、2010年3月にT&amp;A Recordsから無料配布の5曲入りEP「Moombahton」を発表した。当時のブログ文化とSoundCloudの普及が拡散を加速させ、数か月のうちに世界中の制作者が同じ手法で楽曲を作り始めた。初期の重要な参加者としてはMunchi(オランダ在住のドミニカ系制作者)、Sabo、Nadastrom(NadaとMatt Nordstromのデュオ。2007年結成)、Dillon Francis、Diploが挙げられる。とりわけMunchiは、ダブステップの要素を持ち込んだmoombahcoreというより激しい派生の形成に大きく関わった一人である。DiploのレーベルMad Decentが受け皿となり、2011年前後に商業的な広がりを見せる。Skrillexも2010〜11年にはすでに関与していた。ジャンルとしての寿命は短く、2012〜13年ごろにはトラップに取って代わられ、流行としての勢いを失った。批判としては、定型化したという批判や、ジャンルがラテンの根から離れたという懸念が示された。Nada自身は2020年にラテンのルーツへの回帰を掲げてレーベルHermanitoを設立している。しかし影響は残った。2015年前後から主流ポップスがラテンのリズムを大量に取り込む流れが起き、Justin Bieberの2015年「Sorry」やMajor Lazer &amp; DJ Snakeの「Lean On」といった世界的ヒットは、moombahtonの影響を指摘されている（「Sorry」は約100BPM、「Lean On」は約98BPM）。この意味で、短命なジャンルでありながら2010年代半ばのヒット曲に影響を与えたと指摘されている。近年はラテンアメリカで、ネオ・ペレオなど実験的なレゲトン融合の中で再び注目されている。</p>
