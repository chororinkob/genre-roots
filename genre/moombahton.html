<h1>Moombahton（ムンバートン）とは</h1>
<p>ムーンバートンは、ハウスの構造を大幅に減速させ、レゲトンのリズムを重ねた音楽だ。 テンポは108BPM（1分間の拍数）前後が目安とされ（Nada本人は、The Guardian（2011年4月）で「唯一のルールはテンポが約108B</p>
<p>ムーンバートンは、ハウスの構造を大幅に減速させ、レゲトンのリズムを重ねた音楽だ。

テンポは108BPM（1分間の拍数）前後が目安とされ（Nada本人は、The Guardian（2011年4月）で「唯一のルールはテンポが約108BPMであること」と述べている）、この遅さがジャンルの定義そのものになっている。レゲトンと比べて電子音の比重が高い。そして、ハウス(約128 BPM)より約20 BPM遅い、レゲトンと同程度のミッドテンポである点が最大の識別点になる。テンポが遅い分、一音一音の重量感が強く、キックの余韻が長く残ると評される。

リズムの骨格は、レゲトンのデムボウ（1990年代初頭のジャマイカのダンスホールのリディム(Shabba Ranks「Dem Bow」、1990年)が元で、レゲトンの中核の打楽器要素として使われる、跳ねるリズム）・パターンだ。キックは1小節に4拍を刻む。デムボウ全体が3+3+2（トレシージョ）のクロスリズムで、スネアまたはリムショット（太鼓の縁を叩く音）がその一部を担う。この跳ねたリズムが腰を使った踊り方を誘発すると言われる。

ベースは、太く広がるベースラインだ。しばしば、オランダのダッチハウス由来の、上下に滑る鋭い電子スタブ（短く刺す音）（ダーティ・ダッチ）が重ねられる。上物（メロディーなど上に重ねる音）には、レイヴ系シンセ、レゲトン由来の弾むパーカッション、アカペラのラップのサンプルが重なる。

ヴォーカルは、レゲトンでは通常スペイン語のラップを上に乗せ、moombahtonではアカペラのラップのサンプルを使うことがある。

構成はEDMの型を踏襲する。ビルドアップ（徐々に盛り上げる部分）と無音を経て、ドロップ（山場で一気に爆発する部分）へ落ちる。そのドロップが遅いテンポで来ることが、独特の肩透かしと快感を生むと評される。</p>
<h2>成り立ち</h2><p>舞台は、2009年のアメリカ、D.C.郊外(メリーランド州プリンスジョージズ郡)だ。Nadaの証言によれば、極めて具体的な一つの出来事から、このジャンルは生まれた。

DJのDave Nada(本名David Villegas)は、いとこが主催する高校生の無断欠席パーティー(ディッチ・パーティー)でDJを頼まれた。集まっていたのは大半がラテン系の若者で、レゲトンを聴いていた。Nadaは、手持ちのハウス（CDに入れていたダッチハウスなど）では場が持たないと考えた。そこで、オランダのAfrojackが手がけたSilvio Ecomo &amp; Chuckie「Moombah」のリミックス（別の人が作り直した版）を、通常の128BPM前後（資料により130〜138BPMとも）ではなく108BPMまで落として再生した。すると、レゲトンに慣れた身体にそのテンポが合致し、フロアが熱狂した。

この即興的な発見を足がかりに、その後のエディット（既存曲の手直し版）の制作と共有を経て、ジャンルになった。Nadaは曲名の Moombah とレゲトンの語尾を合わせて moombahton と名付け、2010年3月、T&amp;A Recordsから無料配布の5曲入りEP「Moombahton」を発表した。当時のブログ文化とSoundCloudの普及が拡散を加速させ、数か月のうちに世界中の制作者が同じ手法で楽曲を作り始めた。

初期の重要な参加者としては、Munchi(オランダ在住のドミニカ系制作者)、Sabo、Nadastrom(Dave NadaとMatt Nordstromのデュオ、2007年結成)、Dillon Francis、Diploが挙げられる。とりわけMunchiは、ダブステップ要素を持ち込んだmoombahcoreの形成に大きく関わった一人である。DiploのレーベルMad Decentが受け皿となり、2011年前後に商業的な広がりを見せる。Skrillexも2010〜11年には、すでに関与していた。

しかし、ジャンルとしての寿命は短かった。2012〜13年ごろにはトラップに取って代わられ、流行としての勢いを失った。批判としては、定型化したという批判や、ジャンルがラテンのルーツから離れたという懸念が提起された。

それでも、影響は残った。2015年前後から、主流ポップスがラテンのリズムを大量に取り込む流れが起きた。Justin Bieberの2015年「Sorry」やMajor Lazer &amp; DJ Snakeの「Lean On」といった世界的ヒットは、moombahtonの影響を指摘されている（「Sorry」は約100BPM、「Lean On」は約98BPM）。短命なジャンルでありながら、2010年代半ばのヒット曲に影響を与えたと指摘されている。

そして、ラテンアメリカでは、ネオ・ペレオなど実験的なレゲトン融合の中で再び注目されている。</p>
