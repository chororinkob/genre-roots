<h1>Hardtek（ハードテック）とは</h1>
<p>1990年代末のフランスで、フリーパーティー(無許可・無料の野外レイブ)の現場から生まれた高速ダンス音楽。テンポは170〜190BPM前後で、キックドラムはディストーションで低音を潰し、頭の尖った打撃音として鳴らす。ハードコアテク</p>
<p>1990年代末のフランスで、フリーパーティー(無許可・無料の野外レイブ)の現場から生まれた高速ダンス音楽。テンポは170〜190BPM前後で、キックドラムはディストーションで低音を潰し、頭の尖った打撃音として鳴らす。ハードコアテクノに近い速度を持ちながら、ガバのような真正面からの直撃ではなく、拍の裏に細かいキックやスネアを差し込む跳ねたグルーヴを持つため、踊り手は上下ではなく前後に体を揺らす。上物には、アシッド由来のRoland TB-303の甲高いフィルター音、ピッチを上下させて波打たせるシンセリード、そしてレゲエやラガの声ネタ、映画の台詞、アニメの効果音などが雑多に貼り付けられる。展開は、長いブレイクで緊張を溜め、キックが復帰する瞬間に解放するという単純明快な型を繰り返す。同じ速度帯のフレンチコアがキックの歪みそのものを主役に据えるのに対し、ハードテックはリズムの跳ね方とサンプルの遊び心に重心があり、より雑食的で祝祭的である。実際に鳴っているのは、廃工場や森の中に無許可で設営されたサウンドシステムの前であり、その音は数日にわたって鳴り続けることも珍しくない。</p>
<h2>成り立ち</h2><p>起源は1992年、イギリスから大陸ヨーロッパへ渡ったサウンドシステム集団Spiral Tribeにある。同年、イングランドのカースルモートンで数万人規模の無許可レイブが発生し、政府は1994年に刑事司法・公共秩序法を制定して野外レイブを事実上禁止した。追われたSpiral Tribeとその周辺は機材を積んでフランスへ移動し、そこでテクニヴァルと呼ばれる大規模な無料野外パーティーの文化を根づかせる。フランス各地に自前のサウンドシステムを持つ集団(トライブ)が生まれ、廃工場や採石場、農地を占拠して数日間音を鳴らし続けるという生活様式が定着した。音楽的には、当初はイギリス由来のミニマルなテクノが中心だったが、2000年前後から速度と歪みが増し、跳ねたグルーヴを持つ独自の様式としてハードテックが分離していく。パリを拠点とするRadiumはこの音を確立した代表的な作り手であり、Dr. Macabre、Le Bask、Floxytekらが続いた。レーベルではAstrofonik、Karnage Records、そして通信販売とダウンロードの仕組みを整えたAudiogenic Recordsが流通を担った。フランス政府はテクニヴァルを繰り返し取り締まり、2001年のマリアーニ修正条項によって大規模な集会には事前の届け出が義務づけられたが、シーンは地下で継続した。2010年代にはインターネット配信と動画サイトを通じて音源が国境を越え、イタリア、スペイン、日本、東欧へも広がる。現在はフレンチコアやアップテンポといった隣接様式と人材を共有しながら、依然としてフリーパーティーの現場を主戦場とし続けている。</p>
<h2>代表曲</h2><ul><li>Fucking Bass (Narkotek)</li><li>Hardcore DNA (Spiral Tribe)</li><li>Teknival (Audiogenic Records)</li></ul>
