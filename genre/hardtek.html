<h1>Hardtek（ハードテック）とは</h1>
<p>フランスなどのフリーパーティー(無許可・無料の野外レイブ)の現場で、1990年代前半のフリー・テクノ(free tekno)から2000年前後に呼称や様式が分かれていったとされる高速ダンス音楽。起源には諸説ある。テンポは150〜1</p>
<p>フランスなどのフリーパーティー(無許可・無料の野外レイブ)の現場で、1990年代前半のフリー・テクノ(free tekno)から2000年前後に呼称や様式が分かれていったとされる高速ダンス音楽。起源には諸説ある。テンポは150〜185BPM前後(資料による)で、キックドラムは歪みをかけた頭の尖った打撃音として鳴らされることがあるが、歪みは主役ではない。ハードコアテクノに近い速度を持ちながら、ガバのような真正面からの直撃ではなく、拍の裏に細かいキックやスネアを差し込む跳ねたグルーヴを持つため、踊り手は上下ではなく前後に体を揺らす。上物には、アシッド由来のRoland TB-303の甲高いフィルター音、ピッチを上下させて波打たせるシンセリード、そしてレゲエやラガ（ジャマイカ発祥のダンスホールの歌い方）の声ネタ、映画の台詞、アニメの効果音などが雑多に貼り付けられる。展開は、長いブレイクで緊張を溜め、キックが復帰する瞬間に解放するという単純明快な型を繰り返す。より速いフレンチコア(約200BPM)がキックの歪みそのものを主役に据えるのに対し、ハードテックはリズムの跳ね方とサンプルの遊び心に重心があり、より雑食的で祝祭的である。実際に鳴っているのは、廃工場や森の中に無許可で設営されたサウンドシステムの前であり、その音は数日にわたって鳴り続けることも珍しくない。</p>
<h2>成り立ち</h2><p>起源は、イギリスから大陸ヨーロッパへ渡ったサウンドシステム集団Spiral Tribeにあるとされるが、はっきりした定説はない。1992年5月、イングランドのカースルモートンで数万人規模の無許可レイブが発生し、その後メンバーが起訴されて、1993年3月に無罪となった。Spiral Tribeは1993年に大陸へ渡り、パリを拠点に、1993年夏にフランスのボーヴェで最初のテクニヴァル(大規模な無料野外パーティー)を開き、その文化を根づかせる。政府が刑事司法・公共秩序法を制定して野外レイブを事実上禁止したのは、その後の1994年である。フランス各地に自前のサウンドシステムを持つ集団(トライブ)が生まれ、廃工場や採石場、農地を占拠して数日間音を鳴らし続けるという生活様式が定着した。音楽的には、当初はアシッドハウスを出発点に、ハードコアやジャングル、テクノの影響を受けて暗い方向へ進んだが、2000年前後から速度と歪みが増し、跳ねたグルーヴを持つ独自の様式としてハードテックが分離していく。パリを拠点とするRadiumはフレンチコア/ハードコアテクノの代表的な作り手であり、ハードテックの担い手にはFloxytekらがいる。Dr. Macabre(パリ生まれのハードコア/テクノの制作者)や、1999年にサウンドシステムPSKTを結成したLe Baskも、フランスのハードコアのシーンで知られる。レーベルではAstrofonik(2003年創設)、Karnage Records(1998年にトゥールーズで創設)、そしてRadiumが1996年に設立したAudiogenic Recordsなどが流通を担った。フランス政府はテクニヴァルを繰り返し取り締まり、2001年のマリアーニ修正条項によって大規模な集会には事前の届け出が義務づけられたが、シーンは地下で継続した。1990年代にはフリーテクノの動きがイタリアやスペイン、チェコなどにも広がり、のちにインターネット配信と動画サイトを通じて音源が国境を越えて聴かれるようになる。現在はフレンチコアやアップテンポといった隣接様式と人材を共有しながら、依然としてフリーパーティーの現場を主戦場とし続けている。</p>
