<h1>Hardtek（ハードテック）とは</h1>
<p>ハードテックは、フランスなどのフリーパーティー(無許可・無料の野外レイブ)の現場で鳴る高速ダンス音楽だ。1990年代前半のフリー・テクノ(free tekno)から、2000年前後に呼び名やスタイルが分かれていったとされる。起源に</p>
<p>ハードテックは、フランスなどのフリーパーティー(無許可・無料の野外レイブ)の現場で鳴る高速ダンス音楽だ。1990年代前半のフリー・テクノ(free tekno)から、2000年前後に呼び名やスタイルが分かれていったとされる。起源には諸説ある。

テンポは150〜185BPM前後(説による)で、ハードコアテクノに近い速さを持つ。

キックドラムは、歪みをかけた、頭の尖った打撃音として鳴らされることがある。ただし、歪みは主役ではない。ベースは反復的で跳ねる、または裏拍に置かれる。

上物には、アシッド由来のRoland TB-303の甲高いフィルター音や、ピッチを上下させて波打たせるシンセリードが使われる。さらに、映画の台詞やテレビ番組、広告の音声などが、雑多に貼り付けられる。レゲエやラガ（ジャマイカ発祥のダンスホールの歌い方）の声ネタは、ハードテックから派生したサブジャンルで特に目立つ。

曲の展開は、ブレイクや盛り上げ、リズムの再開でつくる傾向がある。

より速いフレンチコア(約200BPM)は、キックの歪みそのものを主役に据える。これに対しハードテックは、リズムの跳ね方とサンプルの遊び心に重心がある。より雑食的で、お祭りのような音楽である。

実際に鳴っているのは、廃工場や森の中に無許可で設営されたサウンドシステムの前だ。その音が数日にわたって鳴り続けることも珍しくない。</p>
<h2>成り立ち</h2><p>起源は、イギリスから大陸ヨーロッパへ渡ったサウンドシステム集団Spiral Tribeにあるとされる。ただし、はっきりした定説はない。

1992年5月、イングランドのカースルモートンで、推定2万〜4万人が集まる無許可レイブが起きた。その後メンバーが起訴され、1994年に裁判が終わり、全員が無罪となった。

Spiral Tribeは、裁判が終わる前の1992〜93年にかけて、段階的に大陸へ渡った。拠点もベルリンやパリなど複数あった。1993年夏には、フランスのボーヴェで最初のテクニヴァル(参加者1,000人未満の、5日間のパーティー)を開き、その文化を根づかせていく。一方イギリスでは、英国政府が1994年に刑事司法・公共秩序法を制定し、野外レイブへの取り締まりの権限を大きく強めた。

フランス各地には、自前のサウンドシステムを持つ集団(トライブ)が生まれた。廃工場や採石場、農地を占拠し、数日間音を鳴らし続ける暮らし方が定着した。

音楽の面では、当初はアシッドハウスを出発点に、ハードコアやジャングル、テクノの影響を受けて暗い方向へ進んだ。しかし2000年前後から速さと歪みが増し、跳ねたグルーヴを持つ独自のスタイルとして、ハードテックが分かれていく。ただし、呼び名の使い方は一つではない。フリーテクノ全体の別名とする使い方もあり、2000年代の狭い意味のスタイルとして語られることもある。

作り手では、フランスのRadiumがフレンチコア/ハードコアテクノの代表的な存在だ。ハードテックの担い手にはFloxytekらがいる。Dr. Macabre(パリ生まれのハードコア/テクノの制作者)や、1999年にサウンドシステムPSKTを結成したLe Baskも、フランスのハードコアのシーンで知られる。

レーベルでは、Astrofonik(2003年創設)、Karnage Records(1998年にトゥールーズで創設)、そしてRadiumが1996年に設立したとされるAudiogenic Recordsなどが流通を担った。

フランス政府はテクニヴァルを繰り返し取り締まった。2001年のマリアーニ修正条項によって、大規模な集会には事前の届け出が義務づけられた。それでも、シーンは地下で続いた。

1990年代には、フリーテクノの動きがイタリアやスペイン、チェコなどにも広がった。のちには、インターネット配信と動画サイトを通じて、音源が国境を越えて聴かれるようになる。現在はフレンチコアやアップテンポといった隣のジャンルと人材を共有しながら、今もフリーパーティーの現場を主な舞台にし続けている。</p>
