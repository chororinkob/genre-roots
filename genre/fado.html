<h1>Fado（ファド）とは</h1>
<p>ファドは、ポルトガルの歌だ。名前は、宿命を意味する語に由来する。 伴奏の基本は、2種類の弦楽器である（近年は、ポルトガル・ギターが2本になる編成や、低音楽器が加わる編成もある）。ひとつはポルトガル・ギターで、洋梨のような丸い胴を持</p>
<p>ファドは、ポルトガルの歌だ。名前は、宿命を意味する語に由来する。

伴奏の基本は、2種類の弦楽器である（近年は、ポルトガル・ギターが2本になる編成や、低音楽器が加わる編成もある）。ひとつはポルトガル・ギターで、洋梨のような丸い胴を持つ12弦の楽器だ。六組の複弦を張り、扇形に広がる金属の糸巻き装置を持つ。奏者は指に爪を付けて弾き、細かく震える装飾音と、歌に絡みつく対旋律（歌とは別に重ねる旋律）を担う。ポルトガル・ギターは、この音楽を特徴づける楽器で、歌に対旋律を添える。もうひとつは伴奏用のギターで、和音とリズムを刻む。低音の弦楽器が加わることもある。

拍子は、伝統的なファド（ファド・カスティーソ）では4拍子が基本だ。短調の「ファド・メノール」は、遅いテンポで歌われることが多い。一方、長調の「ファド・コルリード」は速く、モウラリアは速い〜中庸とされる。和声（コードの響き）は基本的でありながら、切ない響きを持つ進行が選ばれる。

歌唱がこの音楽の中心である。歌手は派手な動きを避け、その場に立って、しばしば目を閉じて歌う。ただし、身振りや言葉の即興も、主に伝統的・アマチュアの場では表現の一部である。声は喉を絞って絞り出され、語尾を長く伸ばし、装飾を凝らして震わせるとされる。

歌詞の主要な主題の一つはsaudadeで、失われたもの、あるいは決して手に入らなかったものへの、名づけがたい思慕である。ほかに日常や街を歌う曲もある。この感情を指す固有の語があり、他の言語に正確には訳せないとされる。</p>
<h2>成り立ち</h2><p>舞台は、リスボンの貧民街だ。この歌は、少なくとも1820年代のリスボンまでたどれるとされる。起源には諸説がある（18世紀半ばにブラジルから持ち込まれたとする説や、アフロ・ブラジルの歌舞と地元の歌が融合したとする説など）。

1820年代から1840年代には、リスボンの貧民街で歌われていた。港に近いこれらの地区は、船乗り、娼婦、馬車の御者らが出入りする場所だった。その周縁的な生活の中から、この歌は現れた。

名声を得た最初の歌い手とされるのが、Maria Severa Onofrianaである。彼女は娼婦だったとされ、貴族の伯爵と関係を持ったことで知られ、1846年に26歳で死去した。女性の歌手が黒い肩掛けをまとう慣習は、彼女の死を悼んだことに由来するとも、彼女が失恋後に自らまとった喪の肩掛けに由来するとも伝えられている。

20世紀の中心は、Amália Rodriguesである。彼女は貧しい家に生まれ、果物売りをしながら歌った。やがて国際的な名声を得て、この音楽を世界へ知らしめた。ただし彼女の評価には複雑さが伴う。

20世紀のポルトガルでは、1926年のクーデターに始まる独裁（国民独裁）が、1933年にEstado Novo（新国家）体制となり、1974年に終わった。その政権は、この歌を検閲のもとに置いた。

「3つのF（フットボール、ファティマ、ファド）」という言い方で、ファドは、娯楽と信仰と競技によって民衆の政治的関心を逸らす政策の一部だったと語られる。だが、研究者の評価は分かれる。ファド史研究者のMichael Colvinは、政権がファドを宣伝の道具として使ったわけではないと述べている（Colvinは、検閲によって政権の「進歩」観と明確に矛盾しないようにし、「貧しくても陽気」（pobrete mas alegrete）という像を広めて、体制を揺るがしかねない歌を抑え込んだと述べる。一方、Lila Ellen Grayは、1950年代以降に国家が観光産業・国営ラジオでファドを動員したと論じている）。検閲により、体制の「進歩」観と矛盾する歌や左派的な歌は大きく抑え込まれた。Colvinはさらに、「貧しくても陽気」の像の推進を指摘する。

1974年、ほぼ無血の革命（カーネーション革命）によって独裁が終わった。すると、この歌は体制の代名詞として左派から批判・敵視され、コンテストの中断やラジオ・テレビでの露出の急減を招いた。1976年ごろから回復に向かった。

皮肉なことに、後年になってAmália Rodrigues自身が、密かに非合法の共産党へ資金を提供していたことが明らかになった。1999年にサラマーゴ（ノーベル賞作家）が証言し、共産党書記長も、寄付が数年にわたり党の資金として記録されたと確認している（金額は非公開。政治犯の家族支援への寄付とする別の解説もある）。

1980〜90年代に復興が始まったとされる（20世紀末は人気が低迷し、21世紀初頭に関心が再燃したともされる）。若い世代が、政治的な負荷から解放されたこの歌を再び手に取った。Mísiaらが先に活躍したのち、デビュー作『Fado em Mim』を2001年にポルトガルで発売し、2002年に国際発売したMarizaをはじめとする歌手が、国際的な成功を収めている。2011年には、国際連合の機関によって無形文化遺産に登録された。</p>
