<h1>Fado（ファド）とは</h1>
<p>ポルトガルの、宿命を意味する語を名とする歌である。伴奏の基本編成は2種類の弦楽器で（近年は、ポルトガル・ギターが2本になる編成や、低音楽器が加わる編成もある）、ひとつはポルトガル・ギターと呼ばれる、洋梨のような丸い胴を持つ12弦の</p>
<p>ポルトガルの、宿命を意味する語を名とする歌である。伴奏の基本編成は2種類の弦楽器で（近年は、ポルトガル・ギターが2本になる編成や、低音楽器が加わる編成もある）、ひとつはポルトガル・ギターと呼ばれる、洋梨のような丸い胴を持つ12弦の楽器で、六組の複弦を張り、扇形に広がる金属の糸巻き装置を持つ。奏者は指に爪を付けて弾き、細かく震える装飾音と、歌に絡みつく対旋律（歌とは別に重ねる旋律）を担う。この楽器は、この音楽を特徴づける楽器である。もうひとつは伴奏用のギターで、和音とリズムを刻む。低音の弦楽器が加わることもある。拍子は、伝統的なファド（ファド・カスティーソ）では規則的な4拍子が基本で、短調の「ファド・メノール」は遅いテンポで歌われることが多い一方、長調の「ファド・コルリード」は通常は速いテンポで、「モウラリア」は速い〜中庸のテンポで演奏されるとされる。和声（コードの響き）は基本的でありながら、切ない響きを持つ進行が選ばれる。歌唱がこの音楽の中心である。歌手は派手な動きを避け、その場に立って、歌い、身振りや言葉の即興も表現の一部とされる（即興は20世紀半ば以降に減ったとされ、主に伝統的な場やアマチュアの場に残る）。声は低く、かすれ、力んだ声と評される。歌詞の主要な主題の一つは、失われたもの、あるいは決して手に入らなかったものへの、名づけがたい思慕（saudade）である。ほかに、日常や街を題材にした曲もある。この感情を指す固有の語があり、他の言語に正確には訳せないとされる。</p>
<h2>成り立ち</h2><p>この歌は、少なくとも1820年代のリスボンまでたどれるとされ、起源には諸説がある（18世紀半ばにブラジルから持ち込まれたとする説や、アフロ・ブラジルの歌舞と地元の歌が融合したとする説など）。1820年代から1840年代には、リスボンの貧民街で歌われていた。港に近いこれらの地区は、船乗り、娼婦、馬車の御者らが出入りする場所であり、その周縁的な生活の中からこの歌は現れた。最初に名声を得た歌い手とされるのがMaria Severa Onofrianaである。彼女は娼婦だったと伝えられ、貴族の伯爵との関係が伝説として語られ、1846年に26歳で死去した。女性の歌手が黒い肩掛けをまとうという慣習は、彼女の死を悼んだことに由来するとも、彼女が失恋後に自らまとった喪の肩掛けに由来するとも伝えられている。20世紀の中心はAmália Rodriguesである。彼女は貧しい家に生まれ、果物売りをしながら歌い、やがて国際的な名声を得て、この音楽を世界へ知らしめた。ただし彼女の評価には複雑さが伴う。20世紀のポルトガルは、1926年のクーデターに始まり、1933年にEstado Novo（新国家）体制となった独裁体制が1974年まで続き、政権はこの歌を検閲のもとに置いた。「3つのF（フットボール、ファティマ、ファド）」という言い方で、娯楽と信仰と競技によって民衆の政治的関心を逸らす政策の一部だったと語られるが、研究者の評価は分かれ、ファド史研究者のMichael Colvinは、政権がファドを宣伝の道具として使ったわけではないと述べている（Colvinは、検閲によって政権の「進歩」観と明確に矛盾しないようにし、「貧しくても陽気」（pobrete mas alegrete）という像を広めて、体制を揺るがしかねない歌を抑え込んだと述べる。一方、Lila Ellen Grayは、1950年代以降に国家が観光産業・国営ラジオでファドを動員したと論じている）。歌詞は検閲を受け、体制の「進歩」観と矛盾する歌や左派的な歌は大きく抑え込まれたが、検閲をすり抜けた曲もあった。「貧しくても陽気」という庶民像の推進も、Colvinによって指摘されている。1974年にほぼ無血の革命（カーネーション革命）によって独裁が終わると、この歌は体制の象徴として左派から批判・敵視され、コンテストの中断やラジオ・テレビでの露出の急減を招いた。1976年に民主体制が安定してから、演奏の場を取り戻していった。皮肉なことに、後年になってAmália Rodrigues自身が、密かに非合法の共産党へ資金を提供していたことが、1999年にサラマーゴ（ノーベル賞作家）の証言により明らかになり、共産党書記長も寄付が数年にわたり党の資金として記録されたと確認している（金額は非公開。政治犯の家族支援への寄付とする別の解説もある）。1980〜90年代に復興が始まったとされる（20世紀末は人気が低迷し、21世紀初頭に関心が再燃したともされる）。若い世代が政治的な負荷から解放されたこの歌を再び手に取り、Mísiaらが先に活躍したのち、デビュー作が2001年にポルトガルで発売され、2002年に国際発売されたMarizaをはじめとする歌手が国際的な成功を収めている。2011年には国際連合の機関によって無形文化遺産に登録された。</p>
