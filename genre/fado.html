<h1>Fado（ファド）とは</h1>
<p>ポルトガルの、宿命を意味する語を名とする歌である。伴奏の編成が厳密に定まっている点が特徴で、二種類の弦楽器が用いられる。ひとつはポルトガル・ギターと呼ばれる、洋梨のような丸い胴を持つ12弦の楽器で、六組の複弦を張り、扇形に広がる金</p>
<p>ポルトガルの、宿命を意味する語を名とする歌である。伴奏の編成が厳密に定まっている点が特徴で、二種類の弦楽器が用いられる。ひとつはポルトガル・ギターと呼ばれる、洋梨のような丸い胴を持つ12弦の楽器で、六組の複弦を張り、扇形に広がる金属の糸巻き装置を持つ。奏者は指に爪を付けて弾き、細かく震える装飾音と、歌に絡みつく対旋律を担う。この楽器の泣くような高音が、この音楽の情感を決定づけている。もうひとつは伴奏用のギターで、和音とリズムを刻む。低音の弦楽器が加わることもある。拍子は四拍子か緩やかな二拍子で、テンポは遅い。調性は短調が圧倒的に多く、和声は基本的でありながら、切ない響きを持つ進行が選ばれる。歌唱がこの音楽の中心である。歌手は身振りをほとんど交えず、その場に立ち尽くし、しばしば目を閉じて歌う。声は喉を絞って絞り出され、語尾を長く伸ばし、装飾を凝らして震わせる。歌詞の主題は、失われたもの、あるいは決して手に入らなかったものへの、名づけがたい思慕である。この感情を指す固有の語があり、他の言語に正確には訳せないとされる。</p>
<h2>成り立ち</h2><p>この歌が生まれたのは1820年代から1840年代のリスボンの貧民街である。港に近いこれらの地区には、船乗り、娼婦、犯罪者、そして植民地から戻った者たちが暮らしており、その周縁的な生活の中からこの歌は現れた。伝説的な最初の歌い手とされるのがMaria Severa Onofrianaである。彼女は娼婦であり、貴族の伯爵と関係を持ったことで知られ、1846年に26歳で死去した。歌手が黒い肩掛けをまとうという慣習は、彼女の死を悼んだことに由来すると伝えられている。20世紀の中心はAmália Rodriguesである。彼女は貧しい家に生まれ、果物売りをしながら歌い、やがて国際的な名声を得て、この音楽を世界へ知らしめた。ただし彼女の評価には複雑さが伴う。20世紀のポルトガルは、1930年代から1974年まで長期の独裁体制下にあり、政権はこの歌を国民の統治に利用した。娯楽と信仰と競技によって民衆の政治的関心を逸らすという政策の中に、この歌が明確に位置づけられていたのである。歌詞は検閲を受け、社会批判は許されず、宿命を受け入れるという主題が奨励された。1974年に無血革命によって独裁が終わると、この歌は体制の象徴として左派から激しく拒絶され、一時的に演奏の場を失う。皮肉なことに、後年になってAmália Rodrigues自身が、密かに非合法の共産党へ資金を提供していたことが明らかになり、その立場は単純ではなかったことが判明した。1990年代以降、若い世代が政治的な負荷から解放されたこの歌を再び手に取り、Marizaをはじめとする歌手が国際的な成功を収めている。2011年には国際連合の機関によって無形文化遺産に登録された。</p>
