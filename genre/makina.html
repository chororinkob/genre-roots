<h1>Mákina（マキナ）とは</h1>
<p>マキナは、スペインで独自に発展した、速いテンポの電子のダンス音楽だ。バレンシアのbakalaoを土台に、カタルーニャで独自のスタイルとして形作られ、拠点となるクラブが育っていった。 テンポは一分間に150から180拍。四つ打ちのバ</p>
<p>マキナは、スペインで独自に発展した、速いテンポの電子のダンス音楽だ。バレンシアのbakalaoを土台に、カタルーニャで独自のスタイルとして形作られ、拠点となるクラブが育っていった。

テンポは一分間に150から180拍。四つ打ちのバスドラムの上には、一般に、とても明快で、歌えるほど分かりやすいメロディーが乗る。このメロディーの性格が最大の特徴とされ、催眠的でトランス風のメロディーが繰り返される。ハッピー・ハードコア、バウンシー・テクノ、ハード・トランス、ユーロダンスなどの影響を受けている。

低音は跳ねるように上下する音の並びで、拍の裏を強く押し出す。この裏拍の押し出しが、独特の前へ進む感じを生み、踊る人の体を上下に弾ませる。

歌が入る場合は、女性の高い声か、加工された男性のかけ声が使われることが多い。歌詞は、恋愛や夜遊びを扱う単純なものが多いとされる。

曲の組み立ては、一般に分かりやすい。導入、盛り上げ、メロディーの披露、休止、もう一度の披露という順番が繰り返されることが多い。休止の区間では、バスドラムが完全に止まることが多い。旋律だけが残るか、無音に近い状態が作られてから、一気に全体が戻ってくる。

英国の一部の地域に輸出された後は、そこで速い語りが乗る形に変わり、本国とは別の発展を遂げた。</p>
<h2>成り立ち</h2><p>源流となったのは、1982年ごろから1990年代半ばにかけて、スペインのバレンシア地方で起きた社会現象だ。

当時この地域では、El Saler通り（CV-500）沿いの約30キロメートルの区間に、巨大なクラブが並んでいた。若者たちは金曜から月曜までの約72時間、車で店から店へ移動しながら踊り続けた。木曜の夜からだったとする説もある。そんな文化ができあがっていた。

この移動を含む一連の行動は、ルタ・デル・バカラオ、すなわちタラのルートという奇妙な名で呼ばれた。名称の由来には諸説ある。1983年にレコード店Zic Zacで使われたスラングに由来するとも、薬物や満員のフロアを指す隠語に由来するとも、同名のパブに由来するともいわれる。ルタ・デストロイという別名は、Barracaの関係者Vicente Pizcuetaが付けたものだ。ただ、定着したのは、メディアが広めたルタ・デル・バカラオという呼び名だった。

現場の初期には、ポストパンクやニューウェーブ、ギター音楽が流れていた。1986年から91年ごろには、EBMやテクノへと移っていく。こうしたバレンシアのクラブ音楽は、バレンシア・サウンドと呼ばれた。

一方、カタルーニャ各地（バルセロナ県・ジローナ県）では、ここから電子音と旋律を強めた方向へ進んだ。バレンシアで併用されていたマキナという語が、カタルーニャで独自のスタイルを指す呼び名として定着する。マキナは、スペイン語で機械を意味するmáquinaを、Kで綴ったものだ。

1990年代を通じて、ポン・アエリ、チャシス、スコルピア、Xque（X-Què?）といったクラブが拠点となった。それぞれが専属のディージェイを抱え、複数のクラブが自前の制作やレーベル活動を行って競い合った。スクデーロやシャビ・メトラリャといった演者が地域で人気を集め、この音楽は若者文化そのものとして根づいていく。

しかし同時に、週末の徹夜の夜遊びと大量の薬物使用、そして帰り道の交通事故が、深刻な社会問題になった。報道が過熱し、警察の取り締まりも強化された。1993年の『Operación Bakalao』などがその例だ。行政による営業時間の規制も、段階的に厳しくなっていく。

Ruta del Bakalaoの最盛期を担った多くの店は、1996年ごろまでに閉店し、ルタとしての時代は幕を閉じた。マキナ系のクラブも、2000年代を通じて閉店や衰退が続いた。Scorpiaは2003年、Xqueは2007年、Chasisは2009年、Pont Aeriは2012年に店を閉じている。

一方で、この音楽は思わぬ形で海を渡っていた。英国北東部(タインサイド)のプロモーターDJ Scottは、スペインへ飛び、レーベルのBit Musicなどから大量のレコードを持ち帰ったと、本人が語っている。英国北東部ではマキナとして定着し、進行役が高速の語りを乗せる形が特徴になった。

これは、英国北西部発のScouse houseとは別の系統だ。こちらはUKバウンス、のちにDonkとも呼ばれる。北東部では、一部がScouse houseに置き換えられた。それでもマキナは英国北東部で独自色を強めながら発展し、今も続いている。本国のディージェイとの行き来もあった。

近年は、スペイン本国でも懐かしむように見直す動きが進み、当時の演者を集めた、Makina LegendsやBarcelona Remember Festivalなどの催しが開かれるようになった。</p>
