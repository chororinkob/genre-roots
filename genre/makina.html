<h1>Mákina（マキナ）とは</h1>
<p>スペインのカタルーニャ地方で独自に発展した高速の電子舞曲である。テンポは一分間に160から180拍で、四つ打ちのバスドラムの上に、極めて明快で歌えるほど分かりやすい旋律が乗る。この旋律の性格が最大の特徴で、シンセサイザーで演奏され</p>
<p>スペインのカタルーニャ地方で独自に発展した高速の電子舞曲である。テンポは一分間に160から180拍で、四つ打ちのバスドラムの上に、極めて明快で歌えるほど分かりやすい旋律が乗る。この旋律の性格が最大の特徴で、シンセサイザーで演奏されるにもかかわらず、地中海地方の大衆歌謡の節回しを思わせる親しみやすさを持つ。同時期の他の高速な様式が攻撃性や暗さを追求したのに対し、この様式は一貫して明るく開放的な方向を選んだ。低音は跳ねるように上下する音型で、拍の裏を強く押し出す。この裏拍の押し出しが独特の前進感を作り、踊り手の体を上下に弾ませる。曲の構成は分かりやすく、序奏、盛り上げ、旋律の提示、休止、再提示という順序が繰り返される。休止の区間ではバスドラムが完全に止まり、旋律だけが残るか、あるいは無音に近い状態が作られてから一気に全体が戻る。歌が入る場合は女性の高い声か、加工された男声のかけ声が用いられ、歌詞は恋愛や夜遊びを扱う単純なものが多い。英国の一部地域に輸出された後は、そこで速い語りが乗せられる形に変化し、本国とは別の発展を遂げた。</p>
<h2>成り立ち</h2><p>起源は1980年代後半から90年代初頭にかけて、バルセロナ近郊のバレンシア地方で起きた社会現象である。当時この地域では、高速道路沿いに巨大なクラブが並び、若者が金曜の夜から日曜まで車で店から店へ移動しながら踊り続けるという文化が成立していた。この移動を含む一連の行動はルタ・デル・バカラオ、すなわちタラのルートという奇妙な名で呼ばれた。名称の由来は諸説あり、道中で食べた料理に由来するとも、隠語だともいわれる。後年には破壊を意味するルタ・デストロイという呼び名も広まった。この現場で流れていたのが、ニューウェーブやインダストリアルを取り込んだ独特の高速音楽で、これがバレンシア・サウンドと呼ばれた。バルセロナ周辺ではここから電子音と旋律を強めた方向へ進み、スペイン語で機械を意味するマキナという名で呼ばれるようになる。1990年代を通じて、ポン・アエリ、チャシス、スコルピア、シケといったクラブが拠点となり、それぞれが専属のディージェイと自主レーベルを抱えて競い合った。スクデーロやシャビ・メトラリャといった演者が地域的な人気を集め、この音楽は若者文化そのものとして定着していく。しかし同時に、週末の徹夜の遊興と大量の薬物使用、そして帰路の交通事故が深刻な社会問題となった。報道は否定的な論調に傾き、行政による営業時間の規制が段階的に強化される。2000年代前半にはこの文化圏は急速に縮小し、主要なクラブが次々と閉店した。一方で、この音楽は思わぬ形で海を渡っていた。休暇でスペインを訪れた英国北東部の若者が現地で受容し、ニューカッスルやサンダーランド周辺に持ち帰ったのである。そこでは進行役が高速の語りを乗せる形に作り替えられ、UKバウンスやスークースといった名で呼ばれる独自の文化に育った。本国とは切り離されたまま発展し、現在も続いている。近年ではスペイン本国でも懐古的な再評価が進み、当時の演者を集めた大規模な催しが開かれるようになった。40代以上となったかつての若者たちが再び集まる場として機能している。</p>
