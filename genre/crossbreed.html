<h1>Crossbreed（クロスブリード）とは</h1>
<p>ドラムンベースの複雑なブレイクビーツと、ハードコア・テクノの歪んだキックを掛け合わせた様式。名称は交配を意味する語で、二つの異なる系統の音楽を混ぜたという意味である。リズムの構造が最大の特徴で、土台にはドラムンベース由来の細かく切</p>
<p>ドラムンベースの複雑なブレイクビーツと、ハードコア・テクノの歪んだキックを掛け合わせた様式。名称は交配を意味する語で、二つの異なる系統の音楽を混ぜたという意味である。リズムの構造が最大の特徴で、土台にはドラムンベース由来の細かく切り刻んだブレイクビーツ（打楽器の断片をつないだ複雑なリズム）があり、拍の隙間に無数のドラムが詰め込まれる。そこにハードコア由来の歪ませたキックが、4/4の推進力を保ったまま打ち込まれる。この二つが同時に鳴ることで、規則的でありながら常に足を取られるような不安定さが生まれる。テンポは毎分170から180拍程度で、ドラムンベースの標準的な速度と重なる。ベースはドラムンベース（特にダークステップ）とハードコアの融合に由来する、音色そのものが激しく変形する歪んだ低音で、金属が軋むような質感を持つ。上物（土台の上に重ねる音）は最小限で、暗く不穏な効果音、警報、加工した声の断片が置かれる。旋律や和音はほとんど使われない。曲の構成は緊張の維持を重視し、静かな導入から一気に音の壁へ移行する。演奏の場はオランダやイギリスの中規模の催しと、ハードコアの催しの中に設けられた専門の演目である。</p>
<h2>成り立ち</h2><p>2000年代半ば〜後半（諸説）に生まれ、2006年(Beatportの発売日は2007年2月19日)には、CounterstrikeとEye-Dの12インチのシングル「The Power to Distort / Motherfucking Skulls」がPRSPCTから出ている。背景には二つの流れの接近があった。ひとつはドラムンベースの側で、2000年代を通じてニューロファンクと呼ばれる、歪んだ低音と機械的な質感を追う一派が発展していた。もうひとつはハードコア・テクノの側で、こちらも歪んだキックの設計を極限まで突き詰めていた。この二つは音色の面で急速に似通っていき、両方の催しに出入りする作り手が現れる。Current Valueの名義で活動するTim Eliotは、ドイツのドラムンベース制作者でベルリンを拠点とし、2010年の『Crossbreed Definition Series part 3』にSwitch Techniqueらと並んで参加した。ジャンルの主要人物として資料が挙げるのは、The Outside Agency、Switch Technique、Cooh、Counterstrike、Gancher &amp; Ruin、Katharsys、Sinister Souls、Lucy Furrなどである。ジャンル名は、The Outside Agency（DJ HiddenとEye-D）が自分たちのレーベルGenosha One Seven Five（2008年設立とする資料あり）から2010年に出した『Crossbreed Definition Series』に由来する。PRSPCTは先駆レーベルの一つに挙げられる（Yellow Stripe、Future Sicknessと並記）が、創設者Thrasher本人は「PRSPCTはクロスブリードのレーベルではない」と述べている。PRSPCTは2002年にロッテルダムでThrasher（Gareth de Wijk）が始めたイベントブランドで、レーベルはその後に加わった。PRSPCT周辺にはCounterstrike、The Panacea、Katharsys、Limewax、Sinister Souls、Donny、Eye-Dといった作り手が集まった（Sinister Soulsは2009年始動で、PRSPCTからのアルバム『Horns Up』は2014年、Donnyは英国の制作者でBarcode Recordingsを主宰している）。ガバは1990年代にロッテルダムとアムステルダムで発展した。クロスブリードの発祥地を一都市に断定する根拠はなく、名付け親のThe Outside Agencyはゴース（Goes）を拠点とする。この音楽は商業的には小規模で、聴衆はドラムンベースとハードコアの両方に通じた層に限られる。しかし二つの巨大な系統をつなぐ位置にあることから、双方の作り手に影響を与え続けている。</p>
