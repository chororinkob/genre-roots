<h1>Crossbreed（クロスブリード）とは</h1>
<p>ドラムンベースの複雑なブレイクビーツと、ハードコア・テクノの歪んだキックを掛け合わせた様式。名称は交配を意味する語で、二つの異なる系統の音楽を混ぜたという意味である。リズムの構造が最大の特徴で、土台にはドラムンベース由来の細かく切</p>
<p>ドラムンベースの複雑なブレイクビーツと、ハードコア・テクノの歪んだキックを掛け合わせた様式。名称は交配を意味する語で、二つの異なる系統の音楽を混ぜたという意味である。リズムの構造が最大の特徴で、土台にはドラムンベース由来の細かく切り刻んだブレイクビーツがあり、拍の隙間に無数のドラムが詰め込まれる。そこにハードコアの歪ませたキックが、四つ打ちではなく変則的な位置に打ち込まれる。この二つが同時に鳴ることで、規則的でありながら常に足を取られるような不安定さが生まれる。テンポは毎分170から180拍程度で、ドラムンベースの標準的な速度と重なる。ベースはニューロファンクの系譜を引く、音色そのものが激しく変形する歪んだ低音で、金属が軋むような質感を持つ。上物は最小限で、暗く不穏な効果音、警報、加工した声の断片が置かれる。旋律や和音はほとんど使われない。曲の構成は緊張の維持を重視し、静かな導入から一気に音の壁へ移行する。演奏の場はオランダやイギリスの中規模の催しと、ハードコアの催しの中に設けられた専門の演目である。</p>
<h2>成り立ち</h2><p>生まれたのは2010年前後のオランダである。背景には二つの流れの接近があった。ひとつはドラムンベースの側で、2000年代を通じてニューロファンクと呼ばれる、歪んだ低音と機械的な質感を追う一派が発展していた。もうひとつはハードコア・テクノの側で、こちらも歪んだキックの設計を極限まで突き詰めていた。この二つは音色の面で急速に似通っていき、両方の催しに出入りする作り手が現れる。決定的な役割を果たしたのはオランダのCurrent Value、ドイツ生まれのTim Eliotで、彼はドラムンベースの制作者として出発しながら、極端に歪んだ音でハードコアの聴衆にも受け入れられた。またオランダのThe Outsideと、レーベルPRSPCTが中心的な役割を果たした。PRSPCTはThrasherが2002年にロッテルダムで始めたレーベルで、当初はドラムンベースを扱っていたが、次第にハードコアとの交配を明確な方針として掲げ、2011年頃からクロスブリードという言葉を積極的に使い始めた。ここからCounterstrike、The Panacea、Katharsys、Limewax、Sinister Souls、Donny、Eye-Dといった作り手が集まり、独自の場を作った。同じロッテルダムという都市が、1990年代にガバを生み、2010年代にこの様式を生んだことは偶然ではなく、過激な電子音楽を受け入れる土壌が長く続いていることを示している。この音楽は商業的には小規模で、聴衆はドラムンベースとハードコアの両方に通じた層に限られる。しかし二つの巨大な系統をつなぐ位置にあることから、双方の作り手に影響を与え続けている。</p>
