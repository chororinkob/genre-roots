<h1>Crossbreed（クロスブリード）とは</h1>
<p>クロスブリードは、ドラムンベースの複雑なブレイクビーツと、ハードコア・テクノの歪んだキックを掛け合わせた音楽だ。名前は交配を意味する語で、二つの異なる系統の音楽を混ぜたことを表している。 最大の特徴は、リズムの組み立てにある。土台</p>
<p>クロスブリードは、ドラムンベースの複雑なブレイクビーツと、ハードコア・テクノの歪んだキックを掛け合わせた音楽だ。名前は交配を意味する語で、二つの異なる系統の音楽を混ぜたことを表している。

最大の特徴は、リズムの組み立てにある。土台には、ドラムンベース由来の細かく切り刻んだブレイクビーツ（打楽器の断片をつないだ複雑なリズム）があり、拍の隙間に無数のドラムが詰め込まれることが多い。そこにハードコア由来の歪ませたキックが、4分の4拍子の推進力を保ったまま打ち込まれる。二つが同時に鳴ることで、規則的なのに、常に足を取られるような不安定さが生まれる。テンポはドラムンベース寄りで、170 BPM台前後が多いとされる。

ベースは、ドラムンベース（特にダークステップ）とハードコアの融合に由来するとされる、歪んだ低音が多い。音色そのものが激しく変形し、金属が軋むような質感を持つ。上物（土台の上に重ねる音）は最小限の傾向があり、暗く不穏な効果音、警報、加工した声の断片が置かれる。旋律や和音はほとんど使われない傾向がある。

曲の構成は、緊張を保ち続けることを重んじる。静かな導入から、一気に音の壁へと移ることが多い。演奏の場は、オランダとイギリスを中心に、欧州各地の催しである。</p>
<h2>成り立ち</h2><p>クロスブリードは、2000年代半ば〜後半（諸説）に生まれた。2006年（デジタル版の発売日は2007年2月19日）には、CounterstrikeとEye-Dの12インチのシングル「The Power to Distort / Motherfucking Skulls」が、PRSPCTから出ている。

背景には、二つの流れの接近があった。ひとつはドラムンベースの側だ。ニューロファンクと呼ばれる、歪んだ低音と機械的な質感を追う一派が、1990年代後半に登場し、2000年代にも発展した。もうひとつはハードコア・テクノの側で、こちらも歪んだキックの作り込みを極限まで突き詰めていた。二つは音色の面で急速に似通っていき、両方の催しに出入りする作り手が現れる。

Current Valueの名義で活動するTim Eliotは、ベルリンを拠点とするドイツのドラムンベース制作者だ。2010年の『Crossbreed Definition Series part 3』に、Switch Techniqueらと並んで参加した。ジャンルの主要人物としては、Switch Technique、Cooh、Counterstrike、Gancher &amp; Ruin、Katharsys、Sinister Souls、Lucy Furrなどが挙げられる。The Outside Agencyは、クロスブリードの元祖とも呼ばれる。

ジャンル名は、The Outside Agency（DJ HiddenとEye-D）が、自分たちのレーベルGenosha One Seven Five（2008年設立とする説がある）から2010年に出した『Crossbreed Definition Series』に由来する。名付け親はThe Outside Agencyとされる。

PRSPCTは、先駆レーベルの一つに挙げられる（Yellow Stripe、Future Sicknessと並記）。しかし、PRSPCTがクロスブリード専門のレーベルとされることに、創設者Thrasher本人は異議を唱えている（ジャンルの枠付け自体を拒んでいる）。一方で、2005年の初リリースには後のクロスブリードに通じる要素があったと、本人も語っている。PRSPCTは2002年にロッテルダムでThrasher（Gareth de Wijk）が始めたイベントブランドで、レーベルは2005年に加わった。

PRSPCT周辺には、Counterstrike、The Panacea、Katharsys、Limewax、Sinister Souls、Donny、Eye-Dといった作り手が集まった（Sinister Soulsは2009年始動で、PRSPCTからのアルバム『Horns Up』は2014年、Donnyは英国の制作者でBarcode Recordingsを主宰している）。

ガバは、1990年代にロッテルダムとアムステルダムで発展した。クロスブリードの発祥地を一都市に断定する根拠はなく、名付け親のThe Outside Agencyはゴース（Goes）を拠点とする。

この音楽は、比較的ニッチな音楽とされる。しかし二つの巨大な系統をつなぐ位置にあり、双方の催しに出入りする作り手が現れた。</p>
