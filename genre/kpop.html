<h1>K-POP（ケーポップ）とは</h1>
<p>韓国発の、視覚表現と音楽を一体として設計する大衆音楽。音楽的な最大の特徴は、一曲の中に複数の異なる様式を接続する構成にある。ヒップホップのヴァース、R&amp;Bのプリコーラス、EDMのドロップ、そしてロックのギターが、三分から四分の間に</p>
<p>韓国発の、視覚表現と音楽を一体として設計する大衆音楽。音楽的な最大の特徴は、一曲の中に複数の異なる様式を接続する構成にある。ヒップホップのヴァース、R&amp;Bのプリコーラス、EDMのドロップ、そしてロックのギターが、三分から四分の間に切り替わりながら現れ、これをジャンル・スイッチングと呼ぶ。和声は短調の四和音循環が多いが、大サビ直前で予告なく転調することも多い。BPMは90〜130と幅広く、リズムはトラップ由来の変速するハイハットや、ムーンバートン、ラテン系の跳ねる型など、最新の国際的な流行が即座に取り込まれる。編成は完全に打ち込みで、生楽器は装飾として用いられる。歌唱は分業が徹底しており、主旋律を担う歌唱担当、ラップ担当、そして高音の一節だけを担う担当が明確に分かれる。歌詞は韓国語を基調に英語のフックが混ざり、自己肯定、恋愛、若さ、社会への違和感を扱う。決定的に重要なのは振付で、群舞の隊形変化が音楽の構造に対応して設計されており、サビの決めの動作、いわゆるポイント・ダンスが曲の識別子として機能する。音と映像が分離できない形で作られている点が、他の大衆音楽と最も異なる。</p>
<h2>成り立ち</h2><p>起点は1992年、ソウルのテレビ番組に出演したソテジワアイドゥル（Seo Taiji and Boys）である。彼らは米国のヒップホップとニュージャックスウィングを韓国語に接続し、審査員から低い評価を受けながら爆発的な人気を得て、それまでのバラード中心の歌謡界を一変させた。産業としての形は1995年、Lee Soo-manが設立したSM Entertainmentが作った。彼は練習生制度、すなわち10代前半から数年にわたり歌唱、舞踊、語学、演技を訓練し、その中から選抜して集団を編成するという方式を確立した。1996年のH.O.T.がその最初の成功例である。1997年のアジア通貨危機により国内市場が縮小したことが、逆に海外進出を促した。1990年代末には中国と台湾で韓流という語が生まれ、2000年代には日本市場が最大の収益源となった。2010年前後に第二の転換が起きる。YouTubeとTwitterの普及により、テレビ放送を経由せずに世界へ届く経路が生まれ、2012年のPSYのGangnam Styleが、YouTubeで史上初めて10億回再生を突破した。以後、BIGBANG、EXO、BLACKPINK、そして2013年にデビューしたBTSが世界市場で成功を収めた。BTSは中小規模の事務所から出発し、SNSでの直接的な発信によりファン共同体を築いた点で、従来の型を変えた。産業構造には深刻な問題も伴った。長期の専属契約、いわゆる奴隷契約を巡る訴訟、練習生の過酷な生活、外見への圧力、そして所属歌手の自死が繰り返し社会問題となっている。2019年には芸能人による性犯罪と、複数の若い歌手の死が相次ぎ、業界の在り方が国会でも議論された。政府は文化産業を輸出の柱として支援を続けており、国家戦略と商業が深く結び付いている点も特徴である。</p>
