<h1>K-POP（ケーポップ）とは</h1>
<p>韓国発の大衆音楽だ。視覚表現と音楽を一体として設計するのが特徴である。 打ち込み主体の楽曲が多いが、バンド編成のグループも存在する。複数のジャンルの要素を一曲に混ぜる曲が多い。ヒップホップのヴァース、R&amp;Bのプリコーラス、EDMの</p>
<p>韓国発の大衆音楽だ。視覚表現と音楽を一体として設計するのが特徴である。

打ち込み主体の楽曲が多いが、バンド編成のグループも存在する。複数のジャンルの要素を一曲に混ぜる曲が多い。ヒップホップのヴァース、R&amp;Bのプリコーラス、EDMのドロップ、そしてロックのギターが、三分から四分の間に切り替わりながら現れる。

リズムには、トラップ由来の変速するハイハットや、ムーンバートン、ラテン系の跳ねる型などが使われる。海外の流行を取り入れた曲がある。

歌唱は、グループ内でメインボーカル、ラッパーなどの役割が割り振られることが多い。兼任も多い。歌詞は、韓国語を基調に、英語のフックが混ざる。扱う題材は、自己肯定、恋愛、若さ、社会への違和感などが多い。

振付（ポイント・ダンス、隊形変化）が重視される。群舞の隊形変化は、音楽の構造に対応して設計されている。サビの決めの動作は、いわゆるポイント・ダンスと呼ばれ、曲の識別子として機能する。音と映像は、分離できない形で作られている。</p>
<h2>成り立ち</h2><p>1992年、ソウルのテレビ番組に、ソテジワアイドゥル（Seo Taiji and Boys）が出演した。これが、現代的K-POPの起点とされる。この見方は「有力な見方」であり、諸説あることも添えておく。

彼らは、米国のヒップホップとニュージャックスウィングを、韓国語に接続した。審査員から低い評価を受けながら、爆発的な人気を得た。当時はトロットやバラードが厚い中で、1980年代からダンス音楽が主流化していた。そこにラップ、メタル、ニュージャックスウィングを持ち込んで、転換点となった。

産業としての形を作ったのは、SM Entertainmentだ。1989年にSM Studioとして設立され、1995年にSM Entertainmentへ改称した。率いたのはLee Soo-manで、練習生型のアイドル育成を広めた中心的存在として、YGやJYPなどとともに産業を形づくった。

彼は、練習生制度を、日本のアイドル育成モデルを取り入れて広めた。10代前半から数年にわたり、歌唱、舞踊、語学、演技を訓練し、その中から選抜して集団を編成する方式である。1996年のH.O.T.が、その最初期の大きな成功例だ。

1997年のアジア通貨危機は、海外市場を求める動きを後押しした。海外での人気は、1996年ごろから始まっていた。1999年11月の北京青年報の記事が、韓流という語の確認できる最古の用例とされる（諸説あり）。2000年代には、日本が最大の海外市場となった。2008年度のK-POP輸出の68%が、日本向けだった。

2010年前後に、第二の転換が起きる。YouTubeとTwitterが普及して、テレビ放送を経由せずに世界へ届く経路が生まれたのだ。2012年には、PSYのGangnam Styleが、YouTubeで史上初めて10億回再生を突破した。2010年代には、BIGBANG、EXO、BLACKPINK、そして2013年にデビューしたBTSが、アジアを中心に海外でも成功した。BTSは、中小規模の事務所から出発し、SNSでの直接的な発信によりファン共同体を築いた点で、従来の型を変えたと評価されている。

しかし、産業構造には深刻な問題も伴った。長期の専属契約、いわゆる奴隷契約を巡る訴訟、練習生の過酷な生活、外見への圧力、そして所属歌手の自死が、繰り返し社会問題となっている。

2019年には、芸能人による性犯罪が起き、複数の若い歌手（SulliやGoo Hara）の死が相次いだ。ネット上の中傷への対策も含めて、業界の在り方が議論された。国会でも、2019年10月時点で、「Sulli法」と呼ばれる法案が議論される見込みと報じられた。

一方、政府は文化産業を輸出の柱として支援を続けているとされる。国家戦略と商業が深く結び付いている点も、特徴である。</p>
