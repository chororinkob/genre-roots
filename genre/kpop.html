<h1>K-POP（ケーポップ）とは</h1>
<p>韓国発の、視覚表現と音楽を一体として設計する大衆音楽。複数ジャンルの要素を一曲に混ぜる曲が多い。ヒップホップのヴァース、R&amp;Bのプリコーラス、EDMのドロップ、そしてロックのギターが、三分から四分の間に切り替わりながら現れる。リズ</p>
<p>韓国発の、視覚表現と音楽を一体として設計する大衆音楽。複数ジャンルの要素を一曲に混ぜる曲が多い。ヒップホップのヴァース、R&amp;Bのプリコーラス、EDMのドロップ、そしてロックのギターが、三分から四分の間に切り替わりながら現れる。リズムはトラップ由来の変速するハイハットや、ムーンバートン、ラテン系の跳ねる型など、海外の流行を取り入れた曲も多い。打ち込み主体の楽曲が多いが、バンド編成のグループも存在する。歌唱は、グループ内でメインボーカルやラッパーなどの役割が割り振られることが多い（兼任も多い）。歌詞は韓国語を基調に英語のフックが混ざり、自己肯定、恋愛、若さ、社会への違和感を扱う。振付も重視され、群舞の隊形変化が音楽の構造に対応して設計されており、サビの決めの動作、いわゆるポイント・ダンスが曲の識別子として機能する。音と映像を一体として作る傾向が強い。</p>
<h2>成り立ち</h2><p>1992年を現代的K-POPの起点とする見方が有力で（1980年代にデビューしたソボンチャなどを起点とする見方もある）、ソウルのテレビ番組に出演したソテジワアイドゥル（Seo Taiji and Boys）がその契機とされる。彼らは米国のヒップホップとニュージャックスウィングを韓国語に接続し、審査員から低い評価を受けながら爆発的な人気を得て、トロットやバラードが厚い歌謡界の中で、1980年代から主流化していたダンス音楽の転換点となった。産業としての形は、1989年にSM Studioとして設立され（1995年にSM Entertainmentへ改称）、Lee Soo-manが率いたSM Entertainmentが中心になって作り、1996年設立のYGや1997年設立のJYPなども加わって形づくられた。彼は、日本のアイドル育成のやり方を取り入れて、練習生制度、すなわち10代前半から、人によって長さの違う期間をかけて歌唱、舞踊、語学、演技を訓練し、その中から選抜して集団を編成するという方式を広めた。1996年のH.O.T.がその最初期の大きな成功例である。1997年のアジア通貨危機は海外市場を求める動きを後押しした（海外での人気は1996年ごろから始まっていた）。1999年11月の北京の新聞記事が、韓流という語の確認できる最古の用例とされ（諸説あり）、2008年度にはK-POPの輸出の68%が日本向けで、日本が最大の海外市場だった。2010年前後に第二の転換が起きる。YouTubeとTwitterの普及により、テレビ放送を経由せずに世界へ届く経路が生まれ、2012年のPSYのGangnam Styleが、YouTubeで史上初めて10億回再生を突破した。2010年代に、BIGBANG、EXO、BLACKPINK、そして2013年にデビューしたBTSが、アジアを中心に海外でも成功を収めた。BTSは中小規模の事務所から出発し、SNSでの直接的な発信によりファン共同体を築いた点で、従来の型を変えたと言われている。産業構造には深刻な問題も伴った。長期の専属契約、いわゆる奴隷契約を巡る訴訟、練習生の過酷な生活、外見への圧力、そして所属歌手の自死が繰り返し社会問題となっている。2019年には芸能人による性犯罪と、複数の若い歌手（SulliやGoo Hara）の死が相次ぎ、ネット上の中傷への対策も含めて業界の在り方が議論され、国会でも「Sulli法」と呼ばれる法案が議論される見込みと報じられ、同年10月25日にはネット上の中傷を防ぐための関連法案2本が提出された。政府は文化産業を輸出の柱として支援を続けており、国家戦略と商業が深く結び付いている点も特徴である。</p>
