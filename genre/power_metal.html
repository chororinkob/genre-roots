<h1>Power Metal（パワーメタル）とは</h1>
<p>パワーメタルは、ヘヴィメタルの中でも、高揚感と旋律の明快さを最優先するスタイルだ。 ギターは歪ませつつも、音の輪郭を保つ。3度（ほか4度・5度など）で重ねた二重奏の旋律、いわゆるハーモナイズド・リードを多用する。高速で技巧的なソロ</p>
<p>パワーメタルは、ヘヴィメタルの中でも、高揚感と旋律の明快さを最優先するスタイルだ。

ギターは歪ませつつも、音の輪郭を保つ。3度（ほか4度・5度など）で重ねた二重奏の旋律、いわゆるハーモナイズド・リードを多用する。高速で技巧的なソロが多く、ネオクラシカル系の奏者の影響を受けた例もある。鍵盤楽器が管弦楽風の厚みを加え、時に合唱団や本物のオーケストラが参加する。

和声（コードの響き）は、長調の進行やサークル進行が多い。コード進行はゆっくりしている。

BPMは中速から高速まで幅があり、速い曲が多い。ドラムは、ダブルバスで16分音符を刻むドラマーが多く、行進するような推進力を生む。

歌唱は、高音域を朗々と張り上げるクリーン・ボーカル（叫ばない普通の歌声）が主流だ。荒い声を使う歌手は少数派である。歌詞は、剣と魔法の物語や竜を含む幻想・神話、仲間意識と希望、個人的な苦闘や感情、戦争と死などを扱う。

サビは、観客が合唱しやすい、アンセム的なものが多い。多幸感を共有する場としてのライブが本領である。</p>
<h2>成り立ち</h2><p>パワーメタルには、2つの系統がある。北米の初期型（スピードメタル寄りの硬質な音）と、後発の欧州型（軽く旋律的で、キーボードを多用する）だ。ここで主に扱う欧州型は、1980年代後半のドイツで、スピードメタルとニュー・ウェイヴ・オブ・ブリティッシュ・ヘヴィメタルから生まれた。

中心になったのは、ハンブルクのHelloweenだ。欧州型パワーメタルで『パワーメタルの父』と呼ばれる。1985年のEPとアルバム『Walls of Jericho』に続き、1987年と1988年に発表したKeeper of the Seven Keysの2部作が、スタイルを固めた。歌手Michael Kiskeの高く伸びる声と、Kai HansenとMichael Weikathによる2本のギターの旋律的な絡みが、その後の規範となった。

ただし、バンドは商業的成功の直後に内部対立に陥った。Kai Hansenは1989年に脱退してGamma Rayを結成し、Michael Kiskeも1993年に解雇されている。

ドイツでは、Blind Guardianがトールキンをはじめ文学作品に題材を求め、多重録音による分厚い合唱を特徴とした。北欧では、フィンランドのStratovariusとSonata Arctica、スウェーデンのHammerFallが続いた。それぞれ速度と旋律の配合が異なっていた。イタリアのRhapsody（後のRhapsody of Fire）は、キーボードと合唱を軸にした交響的スタイルで始め、2000年代に本物の管弦楽団を導入した。Christopher Leeが語りで参加するという、異例の企画も実現した。

米国側では、Queensrÿcheらプログレ・メタル勢が米国型に影響を与えた。SavatageやCrimson Gloryは、プログレ的要素を取り入れた。

1990年代前半、グラム・メタルはグランジで後退した。米国パワーメタルも同時期に衰えた。一方で、このスタイルはヨーロッパ大陸、日本、南米で支持を保ち、地理的な住み分けが生じた。日本や南米にも強いファン層がある。一部の聴き手からは陳腐・紋切り型との批判もある。</p>
