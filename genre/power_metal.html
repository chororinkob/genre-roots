<h1>Power Metal（パワーメタル）とは</h1>
<p>ヘヴィメタルの中でも、高揚感と旋律の明快さを最優先する様式。BPMは160〜200と速く、ドラムはバスドラムを8分音符で連続して踏み続けるダブルバス、そして二拍目と四拍目のスネアを機械的に刻む型が基調で、行進するような推進力を生む</p>
<p>ヘヴィメタルの中でも、高揚感と旋律の明快さを最優先する様式。BPMは160〜200と速く、ドラムはバスドラムを8分音符で連続して踏み続けるダブルバス、そして二拍目と四拍目のスネアを機械的に刻む型が基調で、行進するような推進力を生む。ギターは歪ませつつも音の輪郭を保ち、三度や六度で重ねた二重奏の旋律、いわゆるハーモナイズド・リードを多用する。ソロはクラシック音楽由来の音階、とりわけハーモニック・マイナーやフリギア・ドミナントを高速で駆け上がるネオクラシカルな様式で、スウィープ・ピッキングという分散和音を一気に弾く技法が定番。和声は短調で始まりながら長調へ解決する進行が好まれ、悲壮さの後に勝利感が来る構造を持つ。鍵盤楽器が管弦楽風の厚みを加え、時に合唱団や本物のオーケストラが参加する。歌唱は高音域を朗々と張り上げるクリーン・ボーカルで、絶叫や唸りは用いない。歌詞は剣と魔法の物語、竜、戦い、栄光、友情、そして自由を扱い、暗さより希望を語る。サビでは観客が拳を突き上げて合唱することが前提となっており、多幸感を共有する場としてのライブが本領である。</p>
<h2>成り立ち</h2><p>1980年代半ばのドイツで、スラッシュメタルの速度とニュー・ウェイヴ・オブ・ブリティッシュ・ヘヴィメタルの旋律性を結合させる試みとして生まれた。決定的な出発点はハンブルクのHelloweenで、1985年のデビュー作に続き、1987年と1988年に発表したKeeper of the Seven Keysの二部作が様式を確立した。歌手Michael Kiskeの高く伸びる声と、Kai HansenとMichael Weikathによる二本のギターの旋律的な絡みが、その後の規範となった。ただしバンドは商業的成功の直後に内部対立に陥り、Kai Hansenは1988年に脱退してGamma Rayを結成、Michael Kiskeも1993年に解雇されている。ドイツではBlind Guardianが文学作品、とりわけトールキンの中つ国の物語を主題とした作風を確立し、多重録音による分厚い合唱を特徴とした。北欧ではフィンランドのStratovariusとSonata Arctica、スウェーデンのHammerFallが続き、それぞれ速度と旋律の異なる配合を示した。イタリアではRhapsody（後のRhapsody of Fire）が、本物の管弦楽団と合唱団を用いた映画音楽的な大作路線を確立し、Christopher Leeが語りで参加するという異例の企画も実現した。米国側では、1980年代のQueensrÿcheやSavatageがより思索的な系統を作り、ヨーロッパとは異なる展開を見せた。1990年代前半、グランジの台頭により英語圏でメタル全般が商業的に後退した際、この様式はヨーロッパ大陸、日本、南米で支持を保ち、地理的な棲み分けが生じた。とりわけ日本と南米では熱狂的な受容が続き、ヨーロッパのバンドにとって重要な市場となった。批判としては、様式が定型化しやすいこと、歌詞の空想性が現実逃避と見なされることが繰り返し指摘されている。</p>
