<h1>Power Metal（パワーメタル）とは</h1>
<p>ヘヴィメタルの中でも、高揚感と旋律の明快さを最優先する様式。BPMは中くらいの速さから速いものまで幅があり、速い曲が多く、ドラムはバスドラムを16分音符で連続して踏み続けるダブルバスに、スネアのアクセントを乗せる型を使うドラマーが</p>
<p>ヘヴィメタルの中でも、高揚感と旋律の明快さを最優先する様式。BPMは中くらいの速さから速いものまで幅があり、速い曲が多く、ドラムはバスドラムを16分音符で連続して踏み続けるダブルバスに、スネアのアクセントを乗せる型を使うドラマーが多く、行進するような推進力を生む。ギターは歪ませつつも音の輪郭を保ち、3度を中心に、4度や5度なども使って重ねた二重奏の旋律、いわゆるハーモナイズド・リードを多用する。ソロは高速で技巧的なものが多く、ネオクラシカル（クラシック音楽風）な弾き方で知られるギタリストの影響を受けた例もある。和声（コードの響き）は長調の進行やサークル進行（和音が決まった順に輪のようにめぐる進み方）が多く、和音の変わり方がゆっくりしている。鍵盤楽器が管弦楽風の厚みを加え、時に合唱団や本物のオーケストラが参加する。歌唱は高音域を朗々と張り上げるクリーン・ボーカル（叫ばない普通の歌声）が主流で、荒い声を使う歌手は少数派である。歌詞は、剣と魔法の物語や竜を含む幻想・神話、仲間意識と希望、個人的な苦闘や感情、戦争と死などを扱う。サビは観客がいっしょに歌いやすい、みんなで歌える盛り上がる曲調（アンセム的）のものが多く、多幸感を共有する場としてのライブが本領である。</p>
<h2>成り立ち</h2><p>パワーメタルには、北米の初期型（スピードメタル寄りの硬質な音）と、後発の欧州型（軽く旋律的で、キーボードを多用する）の2系統がある。ここで主に扱う欧州型は、1980年代後半のドイツで、スピードメタル（速さを重んじたヘヴィメタル）とニュー・ウェイヴ・オブ・ブリティッシュ・ヘヴィメタルから生まれた。欧州型パワーメタルの形成に大きな影響を与え、「パワーメタルの父」と呼ばれるのが、ハンブルクのHelloweenで、1985年のEPとアルバムWalls of Jericho に続き、1987年と1988年に発表したKeeper of the Seven Keysの2部作が様式を確立した。歌手Michael Kiskeの高く伸びる声と、Kai HansenとMichael Weikathによる2本のギターの旋律的な絡みが、その後の規範となった。ただしバンドは商業的成功の直後に内部対立に陥り、Kai Hansenは1989年に脱退してGamma Rayを結成、Michael Kiskeも1993年に解雇されている。ドイツではBlind Guardianがトールキンの中つ国の物語をはじめ、文学作品に題材を求め、多重録音による分厚い合唱を特徴とした。北欧ではフィンランドのStratovariusとSonata Arctica、スウェーデンのHammerFallが続き、それぞれ速度と旋律の異なる配合を示した。イタリアではRhapsody（後のRhapsody of Fire）が、キーボードと合唱を中心にした映画音楽のような壮大な作風で始め、2000年代に本物の管弦楽団を取り入れ、Christopher Leeが語りで参加するという異例の企画も実現した。米国側では、1980年代にQueensrÿcheなどのプログレッシブ・メタル（凝った曲の作りが特徴のメタル）のバンドが米国型に影響を与え、SavatageやCrimson Gloryもその凝った作りの要素を取り入れた。こうして、ヨーロッパとは異なる展開を見せた。1990年代前半、グランジの人気が出てグラム・メタルなどが後退した。米国のパワーメタル（初期型）も同じころに急速に衰えた。一方、この様式はヨーロッパ大陸、日本、南米で支持を保ち、地理的な住み分けが生じた。日本や南米にも強いファン層がある。批判としては、一部の聴き手から、ありふれている、お決まりの型どおりだ、という声もある。</p>
