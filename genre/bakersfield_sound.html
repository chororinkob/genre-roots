<h1>Bakersfield Sound（ベーカーズフィールドサウンド）とは</h1>
<p>ベーカーズフィールド・サウンドは、1950年代から1960年代にかけて、カリフォルニア州ベーカーズフィールドで発達したカントリーだ。硬く鋭い音が特徴である。 トレードマークの楽器はFender Telecasterだ。高音域を強調</p>
<p>ベーカーズフィールド・サウンドは、1950年代から1960年代にかけて、カリフォルニア州ベーカーズフィールドで発達したカントリーだ。硬く鋭い音が特徴である。

トレードマークの楽器はFender Telecasterだ。高音域を強調した金属的な音色を、ストラムではなくピッキング主体の奏法で鳴らす。この、突き刺すような明るい鳴りが、同じ時代のナッシュヴィルの柔らかく甘い音との、大きな違いとされる。

加えてペダルスティールギターが、時に目立つソロを取り、和音の中の音を滑らかに動かして哀愁を添える。手の込んだ弦楽器の編曲は避けられた。編成はツイン・テレキャスター(ギター2本)、ベース、ドラム、フィドル、そして時にペダルスティールで、酒場のバンドそのものである。

リズムは2拍を強く刻む。列車が進むような均等な刻みか、跳ねたシャッフルが使われ、テンポは中くらいから速めだ。ドラムを前に出したミックスも特徴だ。

歌では、Buck OwensとDon Richの高音2声ハーモニーが要になる。主旋律のすぐ上に別の声が張り付き、鋭い響きを作る。

歌詞は、工場や油田での労働、離婚、酒、刑務所、そして西へ移住した者の孤独を扱う。感傷的になりすぎず、さらりとした口調で語られる。大音量の酒場で、客の話し声に負けないように作られた音とされる。</p>
<h2>成り立ち</h2><p>1930年代以降、アメリカでは大規模な人口の移動が起きていた。オクラホマ州やテキサス州の農地が、砂嵐・旱魃と大恐慌が重なって耕せなくなった。推定20万〜50万人の人々が、生活の糧を求めてカリフォルニアへ移住した。彼らはしばしば蔑称で呼ばれ、移住先では差別と貧しさに直面する。その多くが落ち着いた先のひとつが、石油と農業の町ベーカーズフィールドだった。彼らは故郷の音楽を持ち込み、幹線道路沿いの酒場で鳴らした。

この土地で先駆となったのはWynn Stewartらで、最も成功した一人がBuck Owensである。彼はフィドルとギターを弾いたDon Richを迎えた。2人の声とFender Telecasterの鋭い音を組み合わせて、1963年以降、Billboardのカントリー・チャートで1位を連発した。この成功が重要なのは、ナッシュヴィルではなくハリウッドのCapitol Recordsで録音した西海岸のバンドが、Billboardのカントリー・チャートの頂点に立ったという点である。彼は後に、1969〜1986年にテレビの人気番組『Hee Haw』をRoy Clarkと共同司会し、カントリーを全国の茶の間へ届けた。

しかし1974年、Don Richがオートバイ事故で32歳で亡くなる。Buck Owensは1990年代後半のインタビューで、「自分の音楽人生は彼が死んだときに終わった」と語っている。

もう一人の中心人物がMerle Haggardである。彼は近郊オイルデール(Oildale)の、貨車を改造した家で生まれた。少年期から犯罪を繰り返し、20代でサン・クエンティン刑務所に服役した。Johnny CashのSan Quentin刑務所での公演を見て刺激を受けたと、本人が語っている(見たのは1959年または1960年の公演とされる)。独房での経験も、転機として本人が語っている。出所後、彼は音楽家として大成した。1972年には、当時のカリフォルニア州知事から恩赦を受けている。彼の歌詞は、労働者階級の誇りと屈辱を同時に描くものとされる。その一部は政治的に保守の側から愛唱された一方、本人はより複雑な立場を語り続けたと言われる。

Buck Owensの活動は1974年以降に停滞した。それでも、このスタイルは1970年代以降も影響を持ち続けた。1980年代後半にはDwight Yoakamらがこの音を意識的に復興させた。以後もナッシュヴィルの洗練に対する対抗軸として、繰り返し参照され続けている。</p>
<h2>代表曲</h2><ul><li>Fast as You (Dwight Yoakam)</li><li>Mama Tried（Merle Haggard）</li><li>Streets of Bakersfield（Buck Owens &amp; Dwight Yoakam）</li><li>Act Naturally（Buck Owens）</li><li>I've Got a Tiger by the Tail (Buck Owens)</li><li>Together Again (Buck Owens)</li><li>Love's Gonna Live Here (Buck Owens)</li><li>Branded Man (Merle Haggard)</li><li>The Bottle Let Me Down (Merle Haggard)</li><li>Buenas Noches from a Lonely Room (Dwight Yoakam)</li><li>Workin' Man Blues (Merle Haggard)</li><li>Open Up Your Heart (Buck Owens)</li></ul>
