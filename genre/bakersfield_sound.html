<h1>Bakersfield Sound（ベーカーズフィールドサウンド）とは</h1>
<p>1950年代から1960年代にかけて、カリフォルニア州ベーカーズフィールドで発達した、硬く鋭い音を特徴とするカントリーである。象徴的な楽器はFender Telecasterで、高音域を強調した金属的な音色を、弦を弾いた直後に消音</p>
<p>1950年代から1960年代にかけて、カリフォルニア州ベーカーズフィールドで発達した、硬く鋭い音を特徴とするカントリーである。象徴的な楽器はFender Telecasterで、高音域を強調した金属的な音色を、弦を弾いた直後に消音する歯切れの良い奏法で鳴らす。この、突き刺すような明るい鳴りが、同時代のナッシュヴィルの柔らかく甘い音との決定的な違いである。加えてペダルスティールギターが、和音の内部の音を滑らかに動かして哀感を添える。弦楽合奏や合唱団は一切用いられず、編成はギター、ベース、ドラム、ペダルスティールという酒場のバンドそのものである。リズムは二拍を強く踏み、列車の進行を思わせる均等な刻みか、跳ねたシャッフルが用いられ、テンポは中庸から速めである。ドラムが正面に据えられている点も、当時のカントリーとしては異例だった。歌唱は二声の密集した和声が要で、主旋律のすぐ上に別の声が張り付き、鋭い響きを作る。歌詞は工場や油田での労働、離婚、酒、刑務所、そして西へ移住した者の孤独を扱い、感傷に流れず乾いた口調で語られる。大音量の酒場で客の話し声に負けないことを前提に設計された音である。</p>
<h2>成り立ち</h2><p>背景にあるのは1930年代のアメリカの大規模な人口移動である。オクラホマ州やテキサス州の農地が、砂嵐と旱魃によって耕作不能となり、数十万の人々が生活の糧を求めてカリフォルニアへ移住した。彼らはしばしば蔑称で呼ばれ、移住先では差別と貧困に直面する。その多くが定着した先のひとつが、石油と農業の町ベーカーズフィールドだった。彼らは故郷の音楽を持ち込み、幹線道路沿いの酒場でそれを鳴らした。この土地で音を確立したのがBuck Owensである。彼はギタリストのDon Richを迎え、二人の声とFender Telecasterの鋭い音を組み合わせて、1960年代を通じて全米一位を連発した。この成功が重要なのは、ナッシュヴィルの制作体制を経由せず、西海岸の独立したバンドが全米の頂点に立ったという点である。彼は後にテレビの人気番組の司会も務め、カントリーを全国の茶の間へ届けた。しかし1974年、Don Richがオートバイ事故で31歳で死亡し、Buck Owensは自ら音楽への意欲を失ったと後年語っている。もう一人の中心人物がMerle Haggardである。彼はこの地の貨車を改造した家で生まれ、少年期から犯罪を繰り返し、20代でサン・クエンティン刑務所に服役した。獄中でJohnny Cashの慰問公演を客席から見た経験が転機となったと本人が語っており、出所後に音楽家として大成した。彼は1972年、当時のカリフォルニア州知事によって恩赦を受けている。彼の歌詞は、労働者階級の誇りと屈辱を同時に描くもので、その一部は政治的に保守の側から愛唱された一方、本人はより複雑な立場を語り続けた。この様式は1970年代に一度下火となるが、1980年代にDwight Yoakamがこの音を意識的に復興させ、以後もナッシュヴィルの洗練に対する対抗軸として、繰り返し参照され続けている。</p>
<h2>代表曲</h2><ul><li>Act Naturally（Buck Owens）</li><li>I've Got a Tiger by the Tail (Buck Owens)</li><li>Streets of Bakersfield（Buck Owens &amp; Dwight Yoakam）</li><li>Mama Tried（Merle Haggard）</li><li>Together Again (Buck Owens)</li></ul>
