<h1>Melodic Techno（メロディックテクノ）とは</h1>
<p>メロディック・テクノは、テクノの繰り返す構造に、感情を強くかき立てるメロディーと和音を組み合わせたダンス音楽だ。 テンポはおおむね120から128 BPMだ。キックは正確な四つ打ちを保ち、その音色は深く丸い。 この土台の上に置かれ</p>
<p>メロディック・テクノは、テクノの繰り返す構造に、感情を強くかき立てるメロディーと和音を組み合わせたダンス音楽だ。

テンポはおおむね120から128 BPMだ。キックは正確な四つ打ちを保ち、その音色は深く丸い。

この土台の上に置かれるのが、この分野の主役である分散和音の音型だ。多くの場合、短調の和音を一音ずつ順に鳴らす音型が、遅延効果によって残響を伴いながら繰り返される。フィルターの開き具合も、長い時間をかけて変わっていくことが多い。少しずつ視界が開けていくようなこの感覚が、曲の組み立ての中心である。和音の下地は映画音楽のように厚く、弦楽や合唱をまねた音が長く伸ばされることが多い。

ボーカルは必須ではないが、サンプルや歌入りの曲も珍しくない。

曲の作りはとても劇的だ。静かな導入、要素の積み上げ、リズムを完全に落とす区間、そして最も感情的な頂点という流れが置かれる。この頂点は、展開の頂点にあたる強い盛り上がりとなる。

ミニマルの流れから出て、旋律を前面に出したこの音楽は、感情の盛り上げ方を隠さない。大規模な会場や凝った映像演出と相性がよく、フェスでの存在感が大きい。ただし、クラブでの演奏も一般的である。</p>
<h2>成り立ち</h2><p>2000年代のクラブ音楽では、ミニマル・テクノの禁欲的な簡素さが目立っていた。音を削り、感情を抑え、長い時間、催眠のように続くことを目指す。そんな美意識に対して、2000年代後半に、旋律と感情を取り戻そうとする動きが芽生えた。それは2010年代前半に形になる。舞台はドイツ各地（ベルリン、ブレーメン、ハンブルクなど）で、2016年以降にはイビサで広まった。

ベルリンでは、Âme(Kristian BeyerとFrank Wiedemann)と、Dixonの名で活動するSteffen Berkhahnが、2005年にInnervisionsを設立した。このレーベルが、この方向の初期の形づくりに役立った。ただしAna Ofakは「Innervisionsの音というものはない」と述べており、この言葉はDixonの発言ともされる。レーベルの軸にあるのは、ハウスの考え方である。

ハンブルクで育ったSolomunは、周辺からこの流れに近づいた一人だ。彼は自らのレーベルDiynamic(2006年設立)とイビサでの定期公演を通じて、旋律的で歌心のある音楽を世界の聴衆に届けた。ほかの電子音楽のジャンルと結びつけて語られることも多い。

大きな転機となったのは、イタリアの2人組Tale of Usだ。彼らは2016年にAfterlifeという名の催しを始めた。そしてのちに、音楽だけでなく、巨大な映像装置と照明を一つにまとめて作り込む映像演出を軸に発展させた。この形式は世界各地へ広がる。クラブや大型会場、メキシコ・トゥルムの密林のセノーテなどで、大規模な映像付きの公演が行われるようになった。ドイツのStephan Bodzinは、アナログのシンセサイザーを実際に演奏する形式で、この分野に演奏者としての説得力を与えた。

一方で、一部には、この音楽がテクノ本来の文脈を切り離し、見栄えのする商品にしてしまったという見方がある。その文脈とは、デトロイトの黒人労働者階級の状況や、ベルリンの地下的な自由である。また、決まった位置に決まった感情の頂点を置くという定型化も、一部で指摘されてきた。

それでも、大規模な会場で電子音楽が感情的な体験を届けられることを示し、2010年代後半に急速に広がったスタイルの一つとなった。</p>
