<h1>Melodic Techno（メロディックテクノ）とは</h1>
<p>テクノの反復する構造に、感情を強く喚起する旋律と和声を組み合わせたダンス音楽である。テンポは概ね120から126 BPMで、キックは正確な四つ打ちを保ち、その音色は深く丸い。この土台の上に、この分野の主役である分散和音の音型が置か</p>
<p>テクノの反復する構造に、感情を強く喚起する旋律と和声を組み合わせたダンス音楽である。テンポは概ね120から126 BPMで、キックは正確な四つ打ちを保ち、その音色は深く丸い。この土台の上に、この分野の主役である分散和音の音型が置かれる。短調の和音を一音ずつ順に鳴らす音型が、遅延効果によって残響を伴いながら反復され、フィルターの開き具合が長い時間をかけて変化していく。この、少しずつ視界が開けていく感覚が構成の核心である。和音の敷物は映画音楽のように厚く、弦楽や合唱を模した音が長く伸ばされる。曲の設計は極めて劇的で、7分から9分の中に、静かな導入、要素の積み上げ、リズムを完全に落とす区間、そして最も感情的な頂点という流れが配置される。この頂点では旋律が最大の音量で提示され、聴衆が一斉に手を上げるという反応が想定されている。人の声はほとんど用いられず、用いられる場合も加工された断片か、遠くで囁くような素材に留まる。ミニマル・テクノの禁欲的な簡素さとは対照的に、こちらは感情の設計を隠さない。大規模な会場と精緻な映像演出を前提とした音楽である。</p>
<h2>成り立ち</h2><p>2000年代のクラブ音楽は、ミニマル・テクノの禁欲的な簡素さが支配していた。要素を削り、感情を排し、長時間の催眠的な持続を志向するこの美学に対し、2010年前後から、旋律と感情を取り戻そうとする動きが現れる。舞台となったのはベルリンとイビサ島である。ベルリンでは、Âmeの一員でありDixonの名でも活動するSteffen Berkhahnらが主宰したInnervisionsが、深く情感のあるハウスとテクノを提示して、この方向の先駆けとなった。ハンブルクのSolomunは、自らのレーベルとイビサでの定期公演を通じて、旋律的で歌心のあるテクノを国際的な聴衆に届けた。決定的だったのはイタリアの二人組Tale of Usである。彼らは2016年からAfterlifeという名の催しを立ち上げ、音楽だけでなく巨大な映像装置と照明を一体で設計するという方式を確立した。この形式は世界各地へ輸出され、砂漠や古代の遺跡を会場とする大規模な公演が行われるようになる。ドイツのStephan Bodzinは、アナログのシンセサイザーを実演奏する形式で、この分野に演奏者としての説得力を与えた。この様式には強い批判もある。すなわち、テクノが本来持っていた、デトロイトの黒人労働者階級の状況やベルリンの地下的な自由という文脈を切り離し、映像映えする消費財に変えてしまったという指摘である。実際、公演の入場料は高額で、聴衆の構成も従来のクラブとは大きく異なる。また、決まった位置に決まった感情の頂点を置くという定型化も指摘されてきた。それでも、大規模な会場で電子音楽が感情的な体験を提供しうることを示した点で、2010年代のダンス音楽を代表する現象であることは間違いない。</p>
