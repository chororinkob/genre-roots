<h1>Twee Pop（トゥイーポップ）とは</h1>
<p>甘さと素朴さを意図的に選び取った、簡素で小さなポップス。英語のtweeは、可愛らしすぎて気恥ずかしいという意味の揶揄の語で、それをそのまま名乗った点にこの音楽の姿勢が表れている。演奏は最小限で、歪ませないギターのかき鳴らし、単純な</p>
<p>甘さと素朴さを意図的に選び取った、簡素で小さなポップス。英語のtweeは、可愛らしすぎて気恥ずかしいという意味の揶揄の語で、それをそのまま名乗った点にこの音楽の姿勢が表れている。演奏は最小限で、歪ませないギターのかき鳴らし、単純なベース、床置きの小さな太鼓やタンバリンだけのリズム、そこにグロッケンシュピールや鈴、リコーダー、オルガンといった玩具めいた音色が加わる。ドラムは2拍4拍を叩くだけの素朴な形か、そもそもドラマーがいない編成も多い。テンポは120〜160BPM、曲は2分前後と短い。和声は長調の三つか四つの和音で完結し、転調も凝った進行も避ける。歌唱は訓練された声を嫌い、素人らしい細い声、音程の揺れ、少年少女のような発声が好まれる。男女の二声が重なる形も定番。歌詞は片思い、手紙、お茶、自転車、友達との些細な出来事といった小さな題材を、皮肉なしに扱う。録音は安価な機材で行われ、こもった音や雑音もそのまま残す。当時のロックが前提としていた男性的な力強さ、技巧、性的な誇示を、可愛さと弱さで全否定するという明確な意図を持った音楽である。</p>
<h2>成り立ち</h2><p>1986年、イギリスの音楽誌NMEが無名の自主制作バンドを集めて出したカセット「C86」が、この動きの旗印になった。収録されたThe Pastels、The Shop Assistants、Primal Screamなどのバンドは、パンクのDIYの精神を引き継ぎながら、その攻撃性を完全に捨てていた。同じ1986年にオックスフォードで結成されたTalulah Goshは、この様式を最も純粋な形で体現したバンドとして知られる。前史としては、1980年前後にグラスゴーのPostcard Recordsが出したOrange JuiceやThe Go-Betweensの軽やかな作風があり、さらに1960年代のガールグループやThe Velvet Undergroundの単純な曲が参照点になっている。1987年、ブリストルでMatt HaynesとClare Waddが設立したレーベルSarah Recordsが、この様式の中心地になった。同レーベルは7インチ盤だけを出し、手作りの意匠と地域への愛着を貫き、1995年に100番目の作品をもって予告どおり自ら活動を終えた。音楽誌からは軟弱だ幼稚だと徹底的に嘲笑されたが、そうした男性的な価値観への当てつけこそがこの音楽の主張だった。アメリカでは、ワシントン州オリンピアが拠点になる。Calvin Johnsonが1982年に設立したレーベルK Recordsと、彼のバンドBeat Happeningは、演奏の下手さを恥じない姿勢を極端まで押し進めた。1991年にオリンピアで開かれたInternational Pop Underground Conventionは、この価値観の宣言の場となり、同じ町から生まれたライオット・ガールの運動と人脈を共有している。1996年にスコットランドで結成されたBelle and Sebastianは、この系譜をより成熟した作曲で引き継ぎ、国際的な成功を収めた。日本では1990年代の渋谷系がSarah Recordsの美学を強く参照し、フリッパーズ・ギターやカヒミ・カリィがその流れを作った。2000年代以降もインターネット上の小さな共同体を通じて受け継がれ、cuteness——可愛さ——を弱さではなく抵抗の手段として使う発想は、現在のインディー・ポップの根底に残っている。</p>
