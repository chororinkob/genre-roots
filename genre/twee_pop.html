<h1>Twee Pop（トゥイーポップ）とは</h1>
<p>トゥイー・ポップは、甘さと素朴さをわざと選び取った、簡素で小さなポップスだ。英語のtweeは、過度に可愛らしく感傷的という意味の、揶揄にも使われた語である。一部のバンド(特に北米)がこの呼び名を受け入れた点に、この音楽の姿勢が表れ</p>
<p>トゥイー・ポップは、甘さと素朴さをわざと選び取った、簡素で小さなポップスだ。英語のtweeは、過度に可愛らしく感傷的という意味の、揶揄にも使われた語である。一部のバンド(特に北米)がこの呼び名を受け入れた点に、この音楽の姿勢が表れている。

演奏は最小限だ。歪ませないギターのかき鳴らしと、単純なベースが中心になる。リズムを、床置きの小さな太鼓やタンバリンだけで刻む例もある。グロッケンシュピールや鈴、リコーダー、オルガンといった、おもちゃのような音色が加わる例もある。簡素な編成である。

コード進行は単純で、転調も凝った進行も避ける。

歌い方は、訓練された声を嫌う。素人らしい細い声、音程の揺れ、少年少女のような発声が好まれる。男女の2声が重なる形も定番だ。

歌詞は、片思い、手紙、お茶、自転車、友達との些細な出来事といった小さな題材を、素朴に扱う曲が多い。ただし、暗い主題を扱う例もあり、皮肉の有無はバンドによる。

録音は安価な機材で行われ、こもった音や雑音もそのまま残す。批評家には、当時のロックが前提としていた男性的な力強さ、技巧、性的な誇示を、可愛さと弱さで退けようとする音楽だと解釈されている。一方で、パンクに強く影響された速いテンポや、推進力のあるドラムを持つ曲もある。</p>
<h2>成り立ち</h2><p>1986年、イギリスの音楽誌NMEが、カセット「C86」を出した。英国のインディー・レーベルからライセンスされた新人バンドを集めた作品だ。トゥイー・ポップは、この作品を契機に広まった。

The PastelsやShop Assistantsは、トゥイー・ポップの先駆と評されるバンドだ。どちらもパンクのDIYの精神を引き継いだ。ただし、Pastels自身は、tweeと呼ばれることを避けた。Primal ScreamもC86に参加した。しかし、C86のシーンと結びつけられることを嫌い、後に別の路線へ進んだ。

同じ1986年には、オックスフォードでTalulah Goshが結成された。結成を1985年末とする説もある。トゥイー・ポップを代表するバンドの一つとされる。

さかのぼると、インディー・ポップの前史として、1980年前後にグラスゴーのPostcard Recordsが出したOrange Juiceの軽やかな作風がある。さらに、1960年代のガールグループの曲が参照点になっている。The Velvet Undergroundの単純な曲も、後年そう位置づけられた。

1987年、ブリストルでMatt HaynesとClare Waddがレーベルを設立した。それがSarah Recordsで、中心的なレーベルとされる。ただし、創設者のMatt Haynes本人は、所属バンドがtweeと呼ばれることに反論した。同レーベルは主に7インチ盤で知られ、のちに12インチ・アルバムやCDも出した。手作りのデザインと地域への愛着を貫き、1995年、100作目でパーティーを開いて自ら幕を閉じた。広告では「アンコールはしない」と告げた。

音楽誌の反応は、大半が敵対的で、嘲笑も多かった。一方、Sarahの創設者や批評家は、この音楽を男性的な価値観への異議と捉えた。

舞台はアメリカに移る。拠点になったのは、ワシントン州オリンピアだ。Calvin Johnsonが1982年に設立したレーベルK Recordsと、彼のバンドBeat Happeningは、技巧を気にしない姿勢で知られる。1991年には、オリンピアでInternational Pop Underground Conventionが開かれ、独立性とDIYを掲げた場となった。オリンピアなどを拠点に生まれたライオット・ガールの運動とも、人脈を共有している。

1996年には、スコットランドでBelle and Sebastianが結成された。このバンドは系譜を引き継ぎ、国際的な評価を得た。

日本では、1990年代の渋谷系が、Postcard Recordsやスコットランド・英国のインディー・ポップ(Orange Juice、Pastelsなど)を強く参照した。フリッパーズ・ギターがその土台を作り、カヒミ・カリィらが代表的な存在となった。

近年は、Z世代によるリバイバルも語られている。</p>
