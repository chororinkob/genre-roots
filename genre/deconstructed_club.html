<h1>Deconstructed Club（デコンストラクテッド・クラブ）とは</h1>
<p>クラブ音楽を組み立てる要素を意図的に解体し、破片のまま差し出すスタイルである。土台にはダンス音楽の言葉づかいがある。だが、それを踊れる形に組み立てることを拒んでいる点が、この音楽の核心だ。 具体的には、規則正しい拍が突然消える。低</p>
<p>クラブ音楽を組み立てる要素を意図的に解体し、破片のまま差し出すスタイルである。土台にはダンス音楽の言葉づかいがある。だが、それを踊れる形に組み立てることを拒んでいる点が、この音楽の核心だ。

具体的には、規則正しい拍が突然消える。低音が予告なく途切れる。テンポが曲の途中で何度も切り替わる。こうした操作が積極的に行われる。

使われる音の素材は、極端に幅広い。ハードコアの歪んだ打撃音、レゲトンやジャージー・クラブの拍節、金属がぶつかる音、銃声、そして無音の空白が、横に並べて置かれる。素材同士の接続は、意図的に断ち切られている。聴き手は、接続の無いことそのものを聴くことになる。

音の処理も過激だ。極端な残響、意図的な音割れ、特定の音域だけが極端に強かったり弱かったりする偏りが用いられる。

声は加工されて、性別や人格が判別できない状態にされる例が見られる。これは、体や性別などの属性が固定されたものなのかを問う姿勢と結びついている。

曲の組み立てに起承転結は無く、場面が転換していく。演奏の場は、既存のクラブというより、催しの形そのものを問い直そうとする自主的な集まりだ。映像や身体表現と一体で示されることが多い。</p>
<h2>成り立ち</h2><p>2010年前後、インターネットを通じて、世界中の音楽を同時に手に入れられるようになった。この音楽は、そのことを前提にしている。それまで地域と結びついていたスタイルが、文脈から切り離された素材として、横並びになる状況が生まれた。こうした条件のもとで、スタイルに忠実であることよりも、スタイルそのものをいじって作り替える対象として扱う姿勢が現れる。

起源には諸説ある。最も有力な火付け役とされるのは、2009年にニューヨークで始まったパーティGHE20G0TH1K(DJのVenus Xが始め、友人でデザイナーのシェイン・オリバーが初期から共演した)だ。ロンドンのナイト・スラッグスやロサンゼルスのフェイド・トゥ・マインドといったレーベルも、先駆けとして挙げられる。

ナイト・スラッグスは、2008年にクラブナイトとして始まり、2010年にレーベルとなった集団だ。グライム、ハウス、エレクトロなどを混ぜ合わせた、クラブ向けの最先端の作品を発表した。フェイド・トゥ・マインドは2011年にロサンゼルスで生まれ、ナイト・スラッグスと呼応しながら、同じ種類の実践を進めた。

2012年頃からは、アルカが代表的存在のひとつとなった。彼女はベネズエラ出身で、ニューヨークやロンドンなどを拠点とした。その作品は、拍の骨組みそのものを溶かし、電子音を生々しく身体的な質感で扱う点で際立っていた。

一方ベルリンでは、Dan DeNorchとMichael Ladnerが2012年にクラブナイトのヤヌスを始めた。ヤヌスは、この分野の代表的存在のひとつとなった。地域の音楽を素材に取り込んだ例としては、メキシコのNAAFIがあり、トライバルやレゲトンを組み込んでいる。

この音楽は、音の実験であると同時に、政治的な性格を強く持っている。担い手の少なくない人が、性的少数者、米国外出身者、非西洋出身者だった。既存のクラブ文化は誰のためのものか、という問いが、作品の前提に置かれていた。安全に踊れる場を自分たちで作る実践と、音楽の解体は、切り離せないものだった。

2010年代を通じて、この音の作り方は、主流のポピュラー音楽にも波及したとの評価もある。アルカは、カニエ・ウェストの『Yeezus』(2013年)や、ビョークの『Vulnicura』(2015年)、『Utopia』(2017年)に制作で参加している。SOPHIEを通じたCharli XCXらへの影響も指摘される。</p>
