<h1>Deconstructed Club（デコンストラクテッド・クラブ）とは</h1>
<p>クラブ音楽の構成要素を意図的に解体し、破片のまま提示する様式である。土台にあるのはダンス音楽の語彙だが、それを踊れる形に組み立てることを拒否している点が核心をなす。具体的には、規則正しい拍が突然消える、低音が予告なく途切れる、テン</p>
<p>クラブ音楽の構成要素を意図的に解体し、破片のまま提示する様式である。土台にあるのはダンス音楽の語彙だが、それを踊れる形に組み立てることを拒否している点が核心をなす。具体的には、規則正しい拍が突然消える、低音が予告なく途切れる、テンポが曲の途中で何度も切り替わる、といった操作が積極的に行われる。使われる音の素材は極端に幅広く、ハードコアの歪んだ打撃音、レゲトンやジャージー・クラブの拍節、オペラ的な歌声、金属の衝突音、通知音、銃声、悲鳴、そして無音の空白が並置される。素材どうしの脈絡は意図的に断たれており、聴き手は接続の不在そのものを聴くことになる。音響処理も過激で、極端な残響、意図的な音割れ、周波数帯の極端な偏りが用いられる。声は加工されて性別や人格が判別できない状態にされることが多く、これは身体や属性の固定性を問う姿勢と結びついている。曲の構成は起承転結を持たず、数十秒ごとに場面が転換する。演奏の場は既存のクラブというより、それ自体が催しの形を問い直そうとする自主的な集まりであり、映像や身体表現と一体で提示されることが多い。</p>
<h2>成り立ち</h2><p>2010年前後、インターネットを通じて世界中の音楽が同時に入手できるようになったことが前提にある。それまで地域と結びついていた様式が、文脈から切り離された素材として並列に並ぶ状況が生まれた。この条件のもとで、様式に忠実であることよりも、様式そのものを操作対象として扱う姿勢が現れる。決定的な役割を果たしたのが、2010年にロンドンで設立された集団ナイト・スラッグスと、そこから派生した動きである。彼らはグライムやハウスの要素を用いながら、それらを不安定に組み替える作品を発表した。同時期にニューヨークではフェイド・トゥ・マインドが同種の実践を進め、大西洋を挟んだ二つの拠点が呼応した。2012年頃から中心となったのが、ヴェネズエラ出身でロンドンを拠点としたアルカである。彼の作品は拍の骨格そのものを溶解させ、電子音を生々しい身体的な質感で扱う点で際立っていた。同じ人脈から現れたのがロシア出身のニカ・ロザ・ダンブロシオ、通称エレイシャで、彼女が主宰したヤヌスという催しはベルリンでこの領域の中心地となった。もう一つの重要な拠点がポーランドのワルシャワとリスボンで、それぞれ地域固有の音楽を素材として組み込む方向が探られた。この様式は音楽的な実験であると同時に、政治的な性格を強く持っている。担い手の多くが性的少数者、移民、非西洋出身者であり、既存のクラブ文化が誰のためのものかという問いが作品の前提に置かれていた。安全に踊れる場を自分たちで作るという実践と、音楽の解体は不可分だった。2010年代後半にはこの語法が主流のポピュラー音楽にも波及し、ビョークやカニエ・ウェストといった大物がアルカを制作に招いている。実験的な周縁から始まった手法が、10年で主流の音作りに組み込まれた例といえる。</p>
