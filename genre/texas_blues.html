<h1>Texas Blues（テキサスブルース）とは</h1>
<p>アメリカ南部テキサス州とその周辺で発達したブルースである。同じブルースでも、ミシシッピ・デルタの重く土着的な質感や、シカゴの分厚く歪んだ音とは明確に異なる。最大の特徴は軽やかさと流動性にある。リズムは三連符を感じさせる跳ねた刻みを</p>
<p>アメリカ南部テキサス州とその周辺で発達したブルースである。同じブルースでも、ミシシッピ・デルタの重く土着的な質感や、シカゴの分厚く歪んだ音とは明確に異なる。最大の特徴は軽やかさと流動性にある。リズムは三連符を感じさせる跳ねた刻みを基調とし、しばしばジャズの揺れる感覚が入り込む。編成にはピアノや管楽器が加えられることが多く、ジャンプ・ブルースと呼ばれる、踊るための軽快な形態へも接続する。ギターの奏法が決定的で、和音を掻き鳴らすのではなく、単音の旋律線を長く連ねる。この、管楽器の独奏を模したような単音主体の弾き方は、この地域で確立され、以後のロックとブルースのギター全体の基礎となった。音色は歪ませすぎず、澄んだまま伸びのある響きが好まれ、チョーキングによって音程を滑らかに引き上げる技法が多用される。曲の構造は12小節のブルース形式が中心だが、小節数を厳密に守らず、歌の都合で伸縮させる演奏者もいる。歌唱は力任せに叫ばず、語りに近い自然な発声が選ばれる。歌詞は放浪、労働、女性、酒、そして貧困を扱い、しばしば辛辣な諧謔が混ざる。</p>
<h2>成り立ち</h2><p>テキサス州は綿花の大農園と石油、そして牧畜が交錯する土地であり、黒人労働者は農場から農場へ、都市から都市へと移動しながら生きていた。この流動性が音楽にも反映されている。最初期の重要な人物はBlind Lemon Jeffersonである。生まれつき目が見えなかった彼は、ダラスの街頭で演奏し、1920年代に録音を残して、男性のブルース歌手として初めて商業的な成功を収めた。彼のギターは伴奏に留まらず、歌と対等に応答する独立した声として機能しており、この発想が後続に受け継がれた。彼は1929年、シカゴの路上で凍死したと伝えられている。1930年代から1940年代にかけて、都市化とともに音楽は電気化する。ここで最も重要な人物がT-Bone Walkerである。ダラスで育ち、後にロサンゼルスへ移った彼は、エレクトリックギターを用いて単音の旋律線を弾くという奏法を確立した。1947年に発表した楽曲は、後のB.B. Kingをはじめ、ほぼ全てのブルースとロックのギタリストが直接影響を受けたと語る一曲となっている。彼は演奏中にギターを背後に回して弾くといった舞台上の演出も行い、後年のロックの身振りの原型を作った。ヒューストンではDuke/Peacock Recordsが、黒人が経営する数少ない大規模なレーベルとして機能し、この地域の音楽を全国へ送り出した。Lightnin' Hopkinsは、小節数を数えない自由な形式で歌い続け、極めて多数の録音を残している。Albert Collinsは指で弦を弾く鋭い奏法で氷のような音を作り、Freddie Kingは力強い演奏でイギリスの若者に多大な影響を与えた。1980年代にはオースティンのStevie Ray Vaughanが、この地域の伝統を圧倒的な技量で現代へ蘇らせ、衰退していたブルースの市場を再び活性化させたが、1990年にヘリコプターの事故により35歳で死去している。</p>
<h2>代表曲</h2><ul><li>Matchbox Blues (Blind Lemon Jefferson)</li><li>Stormy Monday (T-Bone Walker)</li><li>T-Bone Shuffle (T-Bone Walker)</li><li>Hide Away (Freddie King)</li><li>Frosty (Albert Collins)</li></ul>
