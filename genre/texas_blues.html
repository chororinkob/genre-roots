<h1>Texas Blues（テキサスブルース）とは</h1>
<p>テキサス・ブルースは、アメリカ南部のテキサス州とその周辺で発達したブルースだ。同じブルースでも、ミシシッピ・デルタの重く土の匂いがする手ざわりや、シカゴの分厚く歪んだ音とは、はっきり違う。いちばんの特徴は、軽やかさと流れるような動</p>
<p>テキサス・ブルースは、アメリカ南部のテキサス州とその周辺で発達したブルースだ。同じブルースでも、ミシシッピ・デルタの重く土の匂いがする手ざわりや、シカゴの分厚く歪んだ音とは、はっきり違う。いちばんの特徴は、軽やかさと流れるような動きにある。

編成にはピアノや管楽器が加わることが多い。踊るための軽快な形である、ジャンプ・ブルースにもつながっている。

決め手はギターの弾き方だ。「テキサス・スタイル」と呼ばれる弾き方は、この地域で土台が築かれた。Blind Lemon Jeffersonは、弦をかき鳴らしたり叩いたりして繰り返すベースの音型と、単弦のアルペジオ風の音の連なりを組み合わせて、その土台を作った。T-Bone Walkerはそれを電気ギターに応用した。ジャンプやスウィングの影響も合わせ、管楽器のような単音のソロによる現代的な音を作り上げた。音色は歪ませすぎず、澄んだまま伸びのある響きが好まれる傾向がある。チョーキングで音程を滑らかに引き上げる技も、多く使われる。

リズムは、三連符を感じさせる跳ねた刻みが基本になる傾向がある。そこに、ジャズの揺れる感じがしばしば入り込む。

曲の形は、12小節のブルース形式が中心だ。ただし、小節数を厳密に守らず、歌の都合で伸び縮みさせる演奏者もいる。

歌は力任せに叫ばず、語りに近い自然な声で歌われる傾向がある。歌詞は放浪、労働、女性、酒、そして貧困を扱う傾向があり、ときに辛辣なユーモアが混ざる。</p>
<h2>成り立ち</h2><p>テキサス州は、綿花の大農園と石油、そして牧畜が入り交じる土地だ。黒人労働者は、農場から農場へ、都市から都市へと移りながら暮らしていた。この動きの多さが、音楽にも表れている。

最初期の重要な人物は、Blind Lemon Jeffersonだ。彼は生まれつき盲目とされる(本人の申告)。ダラスの街頭で演奏し、1920年代に録音を残した。そして、全国的な人気を得た最初期の、あるいは最も成功したカントリー・ブルース歌手の一人となった。彼のギターは伴奏にとどまらず、歌と対等に応え合う独立した声の役割を果たした。この発想は、後に続く演奏者たちに受け継がれた。彼は1929年12月にシカゴで亡くなった。死因には諸説あり、死亡診断書は「おそらく急性心筋炎」としている。

1930年代から1940年代にかけて、都市化とともに音楽は電気の楽器へと移っていく。ここで最も重要な人物が、T-Bone Walkerだ。ダラスで育ち、のちにロサンゼルスへ移った彼は、ブルースで電気ギターを単音のソロ楽器として定着させた先駆者となった(1930年代半ばから後半に電気ギターを使い始めた、最初期のブルース奏者の一人である)。1947年に発表した「Call It Stormy Monday (But Tuesday Is Just as Bad)」は、B.B. Kingをはじめ多くのギタリストに影響を与えた。ブルースだけでなく、ギターの歴史の中でも最も影響力のあるレコードの一つと評される。彼は演奏中にギターを背中に回して弾いたり、歯で弾いたりする舞台上の演出も行った。Jimi Hendrixは、その歯で弾く芸を真似た。Steve Millerは、1952年にWalkerから背中に回して弾く奏法と歯で弾く芸を教わったと、本人が語っている。

一方、ヒューストンではDuke/Peacock Recordsが、黒人が経営する数少ない大規模なレーベルとして働き、ゴスペルやR&amp;Bを中心に、この地域の音楽を全国へ送り出した。Lightnin' Hopkinsは、基本は12小節の形式でありながら、フレージングが自由で緩い歌い方を続け、非常に多くの録音を残している。Albert Collinsは、指で弦を弾く鋭い奏法で氷のような音を作った。Freddie Kingは力強い演奏で、イギリスの若者に大きな影響を与えた。

1980年代には、オースティンを拠点としたStevie Ray Vaughanが現れる。彼はこの地域の伝統を、圧倒的な技量で現代によみがえらせ、1980年代のブルース・リバイバルを引っ張った。しかし1990年、ヘリコプターの事故により35歳で亡くなっている。</p>
