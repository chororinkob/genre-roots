<h1>Underwater Ambient（アンダーウォーターアンビエント）とは</h1>
<p>水中にいる感覚を音で再現することを主題としたアンビエント。物理的に、水中では高音域が急速に減衰し低音域だけが遠くまで届くため、この特性を模倣したフィルタリングが最大の技法になる。ローパスフィルターのカットオフを2kHz以下まで下げ</p>
<p>水中にいる感覚を音で再現することを主題としたアンビエント。物理的に、水中では高音域が急速に減衰し低音域だけが遠くまで届くため、この特性を模倣したフィルタリングが最大の技法になる。ローパスフィルターのカットオフを2kHz以下まで下げ、さらに時間経過とともにゆっくり動かすことで、水面下へ沈んでいく感覚や、水中と水上を行き来する感覚を作る。素材は緩やかなシンセパッド、加工したピアノやハープ、そしてハイドロフォン(水中マイク)による実録音。実際の海洋録音では、ザトウクジラの歌、シャコの弾ける音、氷河の割れる音、船舶のスクリュー音といった素材が使われる。空間処理では、リヴァーブの初期反射を抑えて後部残響だけを長く伸ばし、壁のない広がりを作る。コーラスやフェイザーを非常に遅い周期でかけ、音程を微妙に揺らすことで水の揺らぎを表現する手法も定番になる。リズムは通常存在せず、あっても泡が立ち上る音や、規則的な機械音が遠くで反響する程度で、拍節としては機能しない。和声は解決を持たない持続和音で、時折不安を含む減和音が差し込まれる。曲は長尺で、水深が変化するような一方向の緩やかな進行を持つことが多い。スペースアンビエントと構造が似ているが、無重力ではなく水圧と閉塞、そして生物の存在の気配を含む点で情緒が異なる。</p>
<h2>成り立ち</h2><p>この呼称が独立した分類として使われるようになったのは比較的新しく、1990年代以降のアンビエント細分化とインターネットでの分類文化の産物である。しかし源流は複数ある。一つは海洋生物学で、1970年に生物学者Roger Payneと Scott McVayがザトウクジラの発する音に反復構造があることを科学論文で示し、Payneが録音を編集したレコード「Songs of the Humpback Whale」が1970年に発売され、最終的に数百万枚を売り上げた。この作品は1970年代の反捕鯨運動の象徴となり、1977年にはVoyager探査機に搭載されたゴールデンレコードにもクジラの歌が収録された。音楽としての水中表現は古くからあり、Claude Debussyの1905年「海」や1910年の「沈める寺」は、和声とペダルの残響で水の質感を表現した古典的な例になる。電子音楽の側では、1970年代にドイツのPopol VuhやTangerine Dreamが水を主題にした作品を作り、日本では1980年代の環境音楽の流れで、水族館や公共施設のために吉村弘や芦川聡が作品を制作した。芦川聡は1982年に「Still Way」を発表している。1990年代のチルアウト文化がこの美学を大衆化した。The Orbの1991年「The Orb's Adventures Beyond the Ultraworld」やAphex Twinの初期作品、Global Communicationの1994年「76:14」が、レイヴの休憩室で聴かれる水中的な音響を確立した。ノルウェーのBiosphereは1997年の「Substrata」で氷と極地の情景を音にし、水の音響を寒冷な方向へ拡張した。またドイツのWolfgang Voigtによる GASは、森の情景を扱ったが、フィルターで高域を削って音を霞ませる手法において同じ原理を共有している。実務的な用途としては、水族館の展示音響、スパやフロートタンク(感覚遮断槽)の音楽、そして胎内の音を模した乳児用の睡眠音源が独立した市場を作った。2000年代以降はハイドロフォンの価格低下により、個人の作家が実際に海や川で録音した素材を用いる例が急増し、Chris WatsonやJana Winderenといったフィールド録音作家が、氷河の融解音や深海の生物音を作品として発表している。Winderenは海洋の騒音公害を主題化しており、船舶や資源探査の人工音が海洋生物の生態を破壊している事実を、音そのものを聴かせることで訴えている。2010年代以降は、気候変動を主題とする環境芸術の文脈で、氷の融解や珊瑚礁の衰退を記録した音響作品が国際的な展示で扱われるようになった。</p>
