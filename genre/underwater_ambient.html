<h1>Underwater Ambient（アンダーウォーターアンビエント）とは</h1>
<p>水中にいる感覚を、音で再現することをテーマにした、アンビエントの一表現だ。 物理的に、水中では高音ほど吸収されやすく、低音ほど遠くまで届く。この性質をまねたフィルタリングが、よく使われる手法の一つになる。ローパスフィルター（高い音</p>
<p>水中にいる感覚を、音で再現することをテーマにした、アンビエントの一表現だ。

物理的に、水中では高音ほど吸収されやすく、低音ほど遠くまで届く。この性質をまねたフィルタリングが、よく使われる手法の一つになる。ローパスフィルター（高い音を削る仕組み）のカットオフ（削り始める高さ）を、数kHz以下まで下げる。さらに時間をかけてゆっくり動かすと、水面下へ沈んでいく感覚や、水中と水上を行き来する感覚が生まれる。

素材は、緩やかなシンセパッド、加工したピアノやハープ、そしてハイドロフォン(水中マイク)による実際の録音だ。海で録った音では、ザトウクジラの歌、テッポウエビの弾ける音、氷河の割れる音、船のスクリュー音などが使われる。

響きの処理では、リヴァーブ（残響）の最初の跳ね返りを抑え、後ろの長い余韻だけを伸ばす傾向がある。こうして、壁のない広がりを作る。コーラスを非常に遅い周期でかけて音程をわずかに揺らし、フェイザーで位相のうねりを加える。これで水の揺らぎを表す手法も定番だ。

リズムは普通はない。あっても、泡が立ち上る音や、規則正しい機械音が遠くで響く程度で、拍子を刻む役目は果たさない。和音は、解決しないまま続く持続和音が中心で、時折、不安を含む減和音が差し込まれる傾向もある。

曲は長く、水深が変わっていくような、一方向へ緩やかに進む形が多い。スペースアンビエントと組み立ては似ている。ただし、無重力ではなく、水の圧力と閉じ込められた感じ、そして生き物の気配を含む点で、感触が違う。</p>
<h2>成り立ち</h2><p>この音楽の源流は複数ある。その一つが海洋生物学だ。1971年、Roger Payneと、鯨類保護の活動家Scott McVayが、ザトウクジラの歌に繰り返しの構造があることを科学論文で示した。

レコード「Songs of the Humpback Whale」は、1970年に発売された。Frank Watlingtonらの録音を素材に、Payneが制作したもので、10万枚を超えて売れた。この作品は1970年代の反捕鯨運動を後押しした。1977年には、Voyager探査機に積まれたゴールデンレコードにも、クジラの歌が収められた。

音楽で水の中を表す試みは、古くからある。Claude Debussyの1905年の管弦楽曲「海」や、1909〜10年作曲、1910年出版のピアノ曲「沈める寺」は、水の質感を描いた古典的な例だ。「沈める寺」では、ペダルの残響も生かされている。

電子音楽の側では、ドイツのPopol Vuhがいる。1971年の『In den Gärten Pharaos』のタイトル曲は、流水の録音で始まり、流水の録音で終わるとされる。Tangerine Dreamは1986年に、水を題にした『Underwater Sunlight』を発表した。

日本では1980年代、環境音楽の流れの中で、吉村弘が美術館や駅などの空間のための音楽を作った。芦川聡は1982年に、唯一のフルアルバム「Still Way」を発表している。

1990年代には、チルアウトやアンビエント・ハウスが広まった。The Orbの1991年「The Orb's Adventures Beyond the Ultraworld」、Aphex Twinの初期作品、Global Communicationの1994年「76:14」が、アンビエント・ハウスやチルアウトの音楽を形作った。ノルウェーのBiosphereは、1997年の「Substrata」で、寒さ、山岳、氷河、流水という寒冷な自然の情景をテーマにした。ドイツのWolfgang Voigtによる GASは、森の情景を扱い、サンプリングとループで霞んだ質感を作る。

実用の場では、胎内音を模した乳児用の睡眠音源などもある。

ハイドロフォンによる水中録音は、1950〜60年代から行われてきた。2000年代以降は、Winderenなどがそれを作品の中心に据えた。Chris WatsonやJana Winderenといったフィールド録音作家は、自然や水中の音を作品として発表している。Winderenは、海の騒音公害をテーマにしている。船や資源探査の人工の音が、水中の生き物にストレスを与え、互いの声を聞く、交信する、餌をとる、繁殖する、進路を決める、といった営みを妨げている。そのことを、音そのものを聴かせて訴えている。

2010年代以降は、気候変動をテーマにした環境芸術の流れの中で、氷の融解や珊瑚礁の衰退を記録した音の作品が、国際的な展示で扱われるようになった。</p>
