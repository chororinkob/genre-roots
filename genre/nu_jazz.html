<h1>Nu Jazz（ニュージャズ）とは</h1>
<p>ジャズの即興と和声感覚を、生のドラムではなくサンプラーやドラムマシンで組み立てたビートの上に置く、クラブフロアのためのジャズ。土台はハウスの四つ打ち、ドラムンベースの高速ブレイクビーツ、ブロークンビーツの歪んだ格子、ダウンテンポの</p>
<p>ジャズの即興と和声感覚を、生のドラムではなくサンプラーやドラムマシンで組み立てたビートの上に置く、クラブフロアのためのジャズ。土台はハウスの四つ打ち、ドラムンベースの高速ブレイクビーツ、ブロークンビーツの歪んだ格子、ダウンテンポの重い2ステップなど多様で、その上にフェンダーローズやウーリッツァーの電気ピアノ、ウッドベース、ソプラノサックス、ミュートを付けたトランペットといった生楽器が乗る。和声はモーダルジャズ由来のテンションを多く含む複雑なコードを使いながら、曲の進行そのものは4小節・8小節のループで組まれ、DJがつなぎやすい構成をとる。ソロは長大な掛け合いにはならず、2コーラス程度で切り上げて音色とグルーヴに主役を譲る。トランペットにディレイとリバーブを深くかけて音を空間へ溶かす処理、アコースティックベースの音を意図的に潰して電子音のように鳴らす処理など、ミキシング段階の加工が作曲と同じ重みを持つ。先行するアシッドジャズが1960〜70年代のファンクやレアグルーヴを生バンドで再現する懐古的な方向だったのに対し、ヌージャズは同時代の電子音楽そのものと組み合う点で異なる。テンポは80BPM前後のダウンテンポから170BPM超まで開いている。</p>
<h2>成り立ち</h2><p>1990年代初頭から、ヨーロッパを中心にアメリカや日本など各地で、ジャズとクラブミュージックが結びつくことで成立した。直接の前史は、1980年代末のロンドンでGilles Petersonらが仕掛けたアシッドジャズと、ドイツ・ミュンヘンのレーベルCompost Recordsが、1993年の設立後、1994年初頭から発表していたクラブジャズ系の作品群である。Compostは「Nu Jazz」という呼称の普及に寄与した主要なレーベルの一つで、主宰者のMichael Reinbothはその代表的な担い手だった。ノルウェーのトランペット奏者Nils Petter Molværは『Khmer』(1997年発売とされるが、1998年とする資料もある)をドイツのレーベルECM Recordsから発表し、アンビエントとダブの音響処理をジャズへ持ち込んで評価を決定づけた。同じくノルウェーのピアニストBugge Wesseltoftは1996年に自身のレーベルJazzland Recordingsを設立し、『New Conception of Jazz』でアコースティックとエレクトロニクスの対等な共存を示した。ベルリンの制作集団Jazzanovaは、リミックス仕事とコンピレーションを通じてヨーロッパ全体のシーンを束ねた。商業的な突破口となったのはフランスのLudovic Navarreで、St Germain名義の『Tourist』(2000)は老舗ジャズレーベルBlue Note Recordsから発表され、2018年の時点で世界で400万枚を超える売り上げを記録したとされる。イギリスでは4heroやThe Cinematic Orchestraが、ドラムンベースやサンプリング音楽の側からジャズへ接近した。日本では2000年代初頭にsleep walkerやquasimodeがクラブジャズとして受容され、United Future Organizationも先行例に数えられる。2000年代半ば以降は流行期を過ぎたが、名称は今も使われており、その方法論はブロークンビーツや2010年代以降のロンドンのジャズ復興へ引き継がれている。</p>
<h2>代表曲</h2><ul><li>To Build a Home (The Cinematic Orchestra)</li><li>Koop Island Blues (Koop)</li><li>Rose Rouge (St Germain)</li><li>Waltz for Koop (Koop)</li><li>That Night (Jazzanova)</li><li>Khmer (Nils Petter Molvær)</li><li>Solid Ether (Nils Petter Molvær)</li><li>Man with the Movie Camera (The Cinematic Orchestra)</li><li>Existence (Bugge Wesseltoft)</li><li>In Between (Jazzanova)</li><li>Bending New Corners (Erik Truffaz)</li><li>Change (Bugge Wesseltoft)</li></ul>
