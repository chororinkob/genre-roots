<h1>Nu Jazz（ニュージャズ）とは</h1>
<p>ジャズの即興と和声感覚を、生のドラムではなくサンプラーやドラムマシンで組み立てたビートの上に置く、クラブフロアのためのジャズ。土台はハウスの四つ打ち、ドラムンベースの高速ブレイクビーツ、ブロークンビーツの歪んだ格子、ダウンテンポの</p>
<p>ジャズの即興と和声感覚を、生のドラムではなくサンプラーやドラムマシンで組み立てたビートの上に置く、クラブフロアのためのジャズ。土台はハウスの四つ打ち、ドラムンベースの高速ブレイクビーツ、ブロークンビーツの歪んだ格子、ダウンテンポの重い2ステップなど多様で、その上にフェンダーローズやウーリッツァーの電気ピアノ、ウッドベース、ソプラノサックス、ミュートを付けたトランペットといった生楽器が乗る。和声はモーダルジャズ由来のテンションを多く含む複雑なコードを使いながら、曲の進行そのものは4小節・8小節のループで組まれ、DJがつなぎやすい構成をとる。ソロは長大な掛け合いにはならず、2コーラス程度で切り上げて音色とグルーヴに主役を譲る。トランペットにディレイとリバーブを深くかけて音を空間へ溶かす処理、アコースティックベースの音を意図的に潰して電子音のように鳴らす処理など、ミキシング段階の加工が作曲と同じ重みを持つ。先行するアシッドジャズが1960〜70年代のファンクやレアグルーヴを生バンドで再現する懐古的な方向だったのに対し、ヌージャズは同時代の電子音楽そのものと組み合う点で異なる。テンポは80BPM前後のダウンテンポから170BPM超まで開いている。</p>
<h2>成り立ち</h2><p>1990年代後半のヨーロッパで、ジャズの教育を受けた演奏家とクラブミュージックの制作者が同一人物になり始めたことで成立した。直接の前史は、1980年代末のロンドンでGilles Petersonらが仕掛けたアシッドジャズと、ドイツ・ミュンヘンのレーベルCompost Recordsが1994年から発表していたクラブジャズ系の作品群である。Compostの主宰者Michael Reinboth周辺から「Nu Jazz」という呼称が使われ始め、ジャンル名として定着した。ノルウェーのトランペット奏者Nils Petter Molværは『Khmer』(1997)をドイツのレーベルECM Recordsから発表し、アンビエントとダブの音響処理をジャズへ持ち込んで評価を決定づけた。同じくノルウェーのピアニストBugge Wesseltoftは1996年に自身のレーベルJazzland Recordingsを設立し、『New Conception of Jazz』でアコースティックとエレクトロニクスの対等な共存を示した。ベルリンの制作集団Jazzanovaは、リミックス仕事とコンピレーションを通じてヨーロッパ全体のシーンを束ねた。商業的な突破口となったのはフランスのLudovic Navarreで、St Germain名義の『Tourist』(2000)は老舗ジャズレーベルBlue Note Recordsから発表され、世界で400万枚規模の売り上げを記録した。イギリスでは4heroやThe Cinematic Orchestraが、ドラムンベースやサンプリング音楽の側からジャズへ接近した。日本ではsleep walkerやquasimodeがクラブジャズとして受容され、United Future Organizationも先行例に数えられる。ジャズ純血主義の立場からは「即興の緊張がループに殺されている」という批判が常につきまとい、2000年代半ば以降は名称自体が使われなくなったが、その方法論はブロークンビーツや2010年代以降のロンドンのジャズ復興へ引き継がれている。</p>
<h2>代表曲</h2><ul><li>Tourist (St Germain)</li><li>In Between (Jazzanova)</li><li>Khmer (Nils Petter Molvær)</li></ul>
