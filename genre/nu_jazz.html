<h1>Nu Jazz（ニュージャズ）とは</h1>
<p>ヌージャズは、クラブのフロアで鳴らすためのジャズだ。生楽器の演奏とジャズ・ハウスの組み合わせから、即興のジャズバンドと電子音楽の組み合わせまで、幅が広い。サンプラー（音を録音して取り込む機械）やドラムマシンで組み立てたビートは、そ</p>
<p>ヌージャズは、クラブのフロアで鳴らすためのジャズだ。生楽器の演奏とジャズ・ハウスの組み合わせから、即興のジャズバンドと電子音楽の組み合わせまで、幅が広い。サンプラー（音を録音して取り込む機械）やドラムマシンで組み立てたビートは、その中の一部の手法にすぎない。

土台になるリズムは多様だ。ハウスの四つ打ち、ドラムンベースの高速ブレイクビーツ、ブロークンビーツ（拍を崩したリズム）の歪んだ格子、UKガラージ系の2ステップなどがある。その上に、生楽器が乗る。フェンダーローズやウーリッツァーの電気ピアノ、ウッドベース、ソプラノサックス、ミュートを付けたトランペットなどだ。

和声（コードの響き）は、モーダルジャズ由来のテンション（基本の和音に足した高い音）を多く含む、複雑なコードを使う。そのうえで、ループを軸にした曲が多い。

先行するアシッドジャズは、ファンク、ソウル、ヒップホップの要素を組み合わせていた。編成はホーンとリズムセクション、ボーカル、DJが多かった。これに対し、ヌージャズは同時代の電子音楽そのものと組み合う点で異なる。

テンポは、80BPM前後のダウンテンポから、170BPM超まで開いている。

ミキシング（音を混ぜて整える作業）の段階の加工が、作曲と同じ重みを持つ。トランペットにディレイ（反響）とリバーブ（残響）を深くかけて、音を空間へ溶かす。アコースティックベースの音を意図的に潰して、電子音のように鳴らす。</p>
<h2>成り立ち</h2><p>ヌージャズは、1990年代初頭からの動きを前史に持つ。ヨーロッパを中心に、アメリカや日本など各地で、ジャズとクラブミュージックが結びついて成立した。ヌージャズという用語そのものは、1990年代後半に作られた。

出発点は、複数の流れが合流したことだ。1980年代末のロンドンでは、Gilles Petersonらがアシッドジャズを仕掛けていた。ドイツ・ミュンヘンのレーベルCompost Recordsは、1993年の設立後、1994年初頭から作品を発表した。1995年の「Future Sounds of Jazz」シリーズは、ヌージャズ／フューチャー・ジャズの文脈で影響力を持った。Compostはフューチャー・ジャズ／ヌージャズ系の作品で知られるレーベルで、主宰者はMichael Reinbothである。

ノルウェーでは、トランペット奏者のNils Petter Molværが、『Khmer』(1997年発売とされるが、1998年とする資料もある)をドイツのレーベルECM Recordsから発表した。アンビエントとダブの音響処理をジャズへ持ち込み、評価を確かなものにした。同じノルウェーのピアニスト、Bugge Wesseltoftは、1996年に自身のレーベルJazzland Recordingsを設立した。『New Conception of Jazz』は、1996年12月発売とされる（1997年とする資料もある）。アコースティックとエレクトロニクスの共存を示した。

ベルリンでは、1995年結成のDJ／プロデューサー集団Jazzanovaが、リミックスと制作で国際的に知られた。

商業的な突破口となったのは、フランスのLudovic Navarreだ。St Germain名義の『Tourist』(2000)は、老舗ジャズレーベルBlue Note Recordsから発表された。2018年の時点で、世界で400万枚を超える売り上げを記録したとされる。

イギリスでは、4heroがドラムンベース側から、The Cinematic Orchestraが映画音楽とジャズのサンプリングから、ジャズに接近した。日本では、Sleep Walkerが2000年代初頭に、quasimodeが2000年代半ば(2006年に1stアルバム)に注目された。United Future Organizationも先行例に数えられる。

2000年代半ば以降は、流行期を過ぎたとされる。それでも名称は今も使われている。ブロークンビートとは並行して重なり合う関係にあり、2010年代以降のロンドンのジャズ復興にも、ブロークンビートなどの要素が見られる。</p>
<h2>代表曲</h2><ul><li>To Build a Home (The Cinematic Orchestra)</li><li>Koop Island Blues (Koop)</li><li>Rose Rouge (St Germain)</li><li>Waltz for Koop (Koop)</li><li>That Night (Jazzanova)</li><li>Khmer (Nils Petter Molvær)</li><li>Solid Ether (Nils Petter Molvær)</li><li>Man with the Movie Camera (The Cinematic Orchestra)</li><li>Existence (Bugge Wesseltoft)</li><li>In Between (Jazzanova)</li><li>Bending New Corners (Erik Truffaz)</li><li>Change (Bugge Wesseltoft)</li></ul>
