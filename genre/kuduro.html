<h1>Kuduro（クドゥーロ）とは</h1>
<p>アンゴラの首都ルアンダで生まれた、極めて速い電子舞曲である。テンポは一分間に135から145拍前後で、リズムは四つ打ちではなく、アフリカの伝統的な打楽器の型を電子音で置き換えた不均等な配置を取る。具体的には、アンゴラのセンバに由来</p>
<p>アンゴラの首都ルアンダで生まれた、極めて速い電子舞曲である。テンポは一分間に135から145拍前後で、リズムは四つ打ちではなく、アフリカの伝統的な打楽器の型を電子音で置き換えた不均等な配置を取る。具体的には、アンゴラのセンバに由来する跳ねた拍と、カリブ海のズークやソカの影響が混ざり合っている。低音は短く硬い音で、余韻を持たない。上物には安価な合成音による単純な旋律や、加工された打楽器音が置かれる。制作環境が限られていたため、初期の作品は市販の簡易な音楽ソフトの初期設定に近い音だけで作られており、その粗さがそのまま様式の特徴となった。声の役割が極めて大きく、ポルトガル語とキンブンド語を混ぜた掛け声、叫び、早口の語りが休みなく続く。歌詞は日常の出来事、諧謔、性的な内容、政治的な当てこすりなど幅広い。この音楽は踊りと不可分で、名称自体がポルトガル語で硬い尻を意味する。動きは腰と尻を中心とした激しいもので、路上や集会で即興的に競い合う形で発展した。演奏の場は正規のクラブよりも、街角や結婚式、乗合バスの車内といった日常の空間である。</p>
<h2>成り立ち</h2><p>1980年代後半から90年代前半のアンゴラは、独立後も続く長い内戦の只中にあった。1975年のポルトガルからの独立以降、2002年まで断続的に戦闘が続き、首都ルアンダには地方から避難した人々が流入して巨大な非公式居住区が形成された。この環境で若者たちが作り出したのがクドゥーロである。名称の由来については、俳優ヴァン・ダムの映画での硬い動きを真似た踊りから来たという説が広く語られている。初期の担い手として知られるのがトニー・アメイドで、1990年代半ばに最初期の録音を残した。制作の条件は極めて限られており、多くは中古のパソコンと簡易な音楽ソフト、そして海賊版の音源で作られた。楽器も録音設備も持たない若者が、それでも音楽を作り流通させたという点で、経済的な制約が様式そのものを形作った例といえる。流通は正規の流通網ではなく、乗合バスの運転手や街角の露天商が複製した録音を配ることで広がった。2000年代に入ると、ポルトガルへ渡ったアンゴラ系移民の若者たちが、この音楽をヨーロッパへ持ち込む。リスボン近郊の移民が集まる地区で、現地の電子音楽と混ざり合い、より抽象的で実験的な方向へ変化した。この流れからブラーバ、DJマルフォックス、ニガ・フォックスといった制作者が現れ、リスボンのプリンシペ・ディスコスというレーベルが世界的な注目を集めることになる。同じ頃、この音は主流の商業音楽にも届いた。2011年にはポルトガル系フランス人の集団ブラカ・ソン・システマの曲が世界的にヒットし、この様式の存在を広く知らしめた。現在ではアンゴラ国内の日常音楽であると同時に、欧州の実験的な電子音楽の一角を占めるという二重の位置にある。</p>
