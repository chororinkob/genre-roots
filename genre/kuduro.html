<h1>Kuduro（クドゥーロ）とは</h1>
<p>クドゥーロは、アンゴラの首都ルアンダで生まれた、とても速い電子のダンス音楽である。 テンポは一分間に、初期（第一世代）が128〜135拍、のちの第二世代が140拍前後だ。リズムの土台は、1拍ごとにバスドラムを踏む速い四つ打ちである</p>
<p>クドゥーロは、アンゴラの首都ルアンダで生まれた、とても速い電子のダンス音楽である。

テンポは一分間に、初期（第一世代）が128〜135拍、のちの第二世代が140拍前後だ。リズムの土台は、1拍ごとにバスドラムを踏む速い四つ打ちである。その上で、スネアなどがトレシージョ（3+3+2の不均等な型）の最初の2打を重ねる配置を取る。具体的には、センバに似るとされる拍に、ソカやズーク・ベトン、ハウス／テクノの影響が混ざり合っている。

上物（土台の上に重ねる音）には、プリセット音色による単純な旋律や、加工された打楽器音が置かれる。第一世代の作品は、ヨーロッパ帰りの若者が持ち込んだシーケンサー／サンプラー機材で作られた。2000年代のパソコンと海賊版Fruity Loopsは、第二世代にあたる。

世代が下るにつれ、声（MC）の比重が増した。アンゴラ式ポルトガル語と、ルアンダの俗語（カロン。キンブンド語などからの借用語を含む）による掛け声、叫び、シャウト調の攻撃的なMCが続く。歌詞は日常の出来事、ユーモア、性的な内容などだ。主に非政治的だが、社会批判を含む作品もある。

この音楽は、踊りと切り離せない。名称の由来には、ポルトガル語で「硬い尻」を意味する「cu duro」から来たという説と、ku（キンブンド語の場所を表す接頭辞）＋duroで「厳しい場所で」と解する説がある。踊りの動きは腰と尻を中心とした激しいもので、路上や街角（desafios）で即興的に競い合う形で発展した。演奏の場は、ルアンダのクラブ（第一世代）のほか、街角や乗合バスの車内といった日常の空間である。</p>
<h2>成り立ち</h2><p>1980年代後半から90年代前半のアンゴラは、独立後も続く長い内戦のさなかにあった。

1975年にポルトガルから独立して以降、2002年まで断続的に戦闘が続いた。首都ルアンダには地方から避難した人々が流れ込み、巨大な非公式居住区ができた。この環境で若者たちが作り出したのが、クドゥーロである。

名称には、ポルトガル語のcu duro（硬い尻）説と、キンブンド語のku（場所を表す接頭辞）説がある。トニー・アマドは、1989年の映画『キックボクサー』のジャン＝クロード・ヴァン・ダムの踊りが着想源だと述べている。初期の担い手として知られるのは、自らクドゥーロの創始者を名乗るトニー・アマドだ。踊りが先に広がり、音楽は1980年代末〜1990年代前半（諸説）とされる。

第一世代は、ヨーロッパ帰りの若者が持ち込んだシーケンサー／サンプラー機材で作られた。2000年代のパソコンと海賊版Fruity Loopsは、第二世代にあたる。流通は、正規の流通網に頼らなかった。制作者が複製したCDを乗合タクシー（candongueiro）の運転手に無料で配り、車内で流してもらうことで広がった。

一方、この音楽は1990年代に、アンゴラ系移民を通じてポルトガルに広がった。2000年代には、リスボン育ちの世代が混ぜ合わせた新しいスタイルを作った。リスボン近郊の移民が集まる地区で、現地の電子音楽と混ざり合い、より抽象的で実験的な方向へ変わっていった。この流れからDJマルフォックス、ニガ・フォックスといった制作者が現れ、リスボンのレーベル、プリンシペ・ディスコスが世界的な注目を集めることになる。ただし彼らの音楽は、クドゥーロそのものではなく、バチーダ（バトゥカーダ）と呼ばれる。

同じ頃、この音は主流の商業音楽にも届いた。担い手は、リスボン近郊（アマドーラ）出身のポルトガルの集団、ブラカ・ソン・システマ（アンゴラ系のメンバーを含む。名称はブラカ地区に由来）である。彼らは2008年発表の「Kalemba (Wegue-Wegue)」（スペインのPROMUSICAE Top 20シングルで1位。2009年11〜12月）や2011年の「Hangover (BaBaBa)」で、ブラカ流のクドゥーロ（リスボン版）の存在を欧州に広く知らしめた。

今のクドゥーロは、アンゴラ国内の日常の音楽であると同時に、欧州の実験的な電子音楽の一角も占めている。そうした二重の位置にある。</p>
