<h1>Kuduro（クドゥーロ）とは</h1>
<p>アンゴラの首都ルアンダで生まれた、極めて速い電子舞曲である。テンポは一分間に初期（第一世代）が128〜135拍、のちの第二世代が140拍前後で、リズムは1拍ごとにバスドラムを踏む速い四つ打ちを土台に、スネアなどがトレシージョ（3+</p>
<p>アンゴラの首都ルアンダで生まれた、極めて速い電子舞曲である。テンポは一分間に初期（第一世代）が128〜135拍、のちの第二世代が140拍前後で、リズムは1拍ごとにバスドラムを踏む速い四つ打ちを土台に、スネアなどがトレシージョ（3+3+2の不均等な型）の最初の2打を重ねる配置を取る。具体的には、センバ／キゾンバに近い跳ねた拍と、ソカやズーク・ベトン、ハウス／テクノの影響が混ざり合っている。低音は短く硬い音で、余韻を持たない。上物（土台の上に重ねる音）には安価な合成音による単純な旋律や、加工された打楽器音が置かれる。第一世代の作品は、ヨーロッパ帰りの若者が持ち込んだシーケンサー／サンプラー機材で作られた。2000年代のパソコンと海賊版Fruity Loopsは第二世代にあたる。声の役割が極めて大きく、アンゴラ式ポルトガル語と、キンブンド語とポルトガル語の混成語カロンによる掛け声、叫び、半分の速さで乗る語り（ハーフタイム）が休みなく続く。歌詞は日常の出来事、諧謔、性的な内容、政治的な当てこすりなど幅広い。この音楽は踊りと不可分で、名称は、ポルトガル語で「硬い尻」を意味する「cu duro」に由来するという説と、キンブンド語で「困難な状況で」を意味する言い回しに由来するという説がある。動きは腰と尻を中心とした激しいもので、路上や集会で即興的に競い合う形で発展した。演奏の場はルアンダのクラブ（第一世代）のほか、街角や結婚式、乗合バスの車内といった日常の空間である。</p>
<h2>成り立ち</h2><p>1980年代後半から90年代前半のアンゴラは、独立後も続く長い内戦の只中にあった。1975年のポルトガルからの独立以降、2002年まで断続的に戦闘が続き、首都ルアンダには地方から避難した人々が流入して巨大な非公式居住区が形成された。この環境で若者たちが作り出したのがクドゥーロである。名称はポルトガル語のcu duro（硬い尻）説と、キンブンド語のku（場所を表す接頭辞）説があり、ヴァン・ダムはトニー・アマドが主張する踊りの着想源である。初期の担い手として知られるのは、自らクドゥーロの創始者を名乗るトニー・アマドで、踊りが先行し、音楽は1980年代末〜1990年代前半（諸説）とされる。第一世代はヨーロッパ帰りの若者が持ち込んだシーケンサー／サンプラー機材で作られ、2000年代のパソコンと海賊版Fruity Loopsは第二世代にあたる。流通は正規の流通網ではなく、乗合バスの運転手や街角の露天商が複製した録音を配ることで広がった。2000年代に入ると、ポルトガルへ渡った、サントメ・プリンシペ、ギニアビサウ、カーボヴェルデ、アンゴラなど多様なディアスポラの若者たちが、この音楽をヨーロッパへ持ち込む。リスボン近郊の移民が集まる地区で、現地の電子音楽と混ざり合い、より抽象的で実験的な方向へ変化した。この流れからDJマルフォックス、ニガ・フォックスといった制作者が現れ、リスボンのプリンシペ・ディスコスというレーベルが世界的な注目を集めることになる。彼らの音楽は、クドゥーロそのものではなく、バチーダ（バトゥカーダ）と呼ばれる。同じ頃、この音は主流の商業音楽にも届いた。リスボン近郊のブラカ地区を拠点とするポルトガルの集団ブラカ・ソン・システマ（アンゴラ系のメンバーを含む）は、2008年発表の「Kalemba (Wegue-Wegue)」（スペインで最高1位。2009〜10年のチャート）や2011年の「Hangover (BaBaBa)」で、この様式の存在を欧州に広く知らしめた。現在ではアンゴラ国内の日常音楽であると同時に、欧州の実験的な電子音楽の一角を占めるという二重の位置にある。</p>
