<h1>Dixieland（ディキシーランド）とは</h1>
<p>ニューオーリンズで生まれた、ジャズの最も原初的な形態。1人のソリストが目立つのではなく、トランペット・クラリネット・トロンボーンという複数の管楽器が、それぞれ同時に即興演奏を繰り広げながら絡み合う「集団即興」こそが、このスタイルの</p>
<p>ニューオーリンズで生まれた、ジャズの最も原初的な形態。1人のソリストが目立つのではなく、トランペット・クラリネット・トロンボーンという複数の管楽器が、それぞれ同時に即興演奏を繰り広げながら絡み合う「集団即興」こそが、このスタイルの最大の特徴である。テンポは軽快でBPM 120〜200。マーチングバンド由来の陽気な行進曲的ノリと、ブルースの持つ哀愁が同居し、街を練り歩くパレードや祭りの高揚感を音そのものが持っている。後年の洗練されたジャズと比べると素朴で牧歌的な響きだが、その自由な掛け合いの中にこそ、ジャズという音楽が本来持っていた原点の姿がある。編成は通常、旋律を担うトランペット、その周囲を装飾的に飛び回るクラリネット、低音側で骨格を支えるトロンボーンという3管が中心となり、そこにバンジョー、チューバまたはベース、ドラムが加わる。それぞれの楽器に明確な役割分担があるからこそ、全員が同時に即興しても音が団子にならず、絡み合いとして成立する。</p>
<h2>成り立ち</h2><p>20世紀初頭のアメリカ・ニューオーリンズで、複数の文化が地理的に密集していたことによって生まれた。この街はフランス、スペイン、アメリカと支配者が変わり、カリブ海の島々とも人の行き来があったため、フランス系混血のクレオール、アフリカ系の解放奴隷、イタリア系やドイツ系の移民が同じ街に暮らしていた。南北戦争後、軍楽隊が放出した安価な中古の管楽器が街に出回ったことも決定的だった。葬列で行きは荘重な讃美歌を、帰りは陽気な行進曲を演奏するブラスバンドの習慣、ダンスホールの舞曲、教会の歌、そしてラグタイムのシンコペーションが混ざり合い、複数の管楽器が同時に即興する集団即興の様式が育っていく。伝説的な最初の名手はコルネット奏者のBuddy Boldenだが、彼の演奏は録音されないまま、1907年に精神を病んで施設に収容され、そのまま生涯を終えた。1897年に市が公認した歓楽街ストーリーヴィルは多くの音楽家に演奏の職を与えたが、1917年に海軍の要請で閉鎖され、音楽家たちは職を求めて北へ移動する。同じ1917年、白人5人組のOriginal Dixieland Jass Bandがニューヨークで「Livery Stable Blues」を録音し、これが世界初のジャズのレコードとして大ヒットした。ジャズを生み出したのが黒人であるにもかかわらず、最初に録音され富を得たのが白人バンドだったという事実は、以後のアメリカ音楽産業を貫く構図の始まりでもある。1920年代のシカゴでは、King Oliverが率いたCreole Jazz Bandと、そこから独立したLouis Armstrongが頂点を築き、ArmstrongによるHot FiveとHot Sevenの録音は、集団即興から独奏者の時代への転換を告げた。「ディキシーランド」という呼称は主に白人が演奏する形式を指す言葉として広まったため、黒人音楽家自身はニューオーリンズ・ジャズと呼ぶことを好んだ。1940年代には、ビバップの前衛性への反動としてこの古い様式を復興させるトラッド・ジャズ運動が起こり、Bunk JohnsonやKid Oryが再発見される。この復興は世界へ広がり、イギリスやヨーロッパ、そして日本でも根強く演奏され続けている。</p>
<h2>代表曲</h2><ul><li>Livery Stable Blues (Original Dixieland Jass Band)</li><li>Muskrat Ramble (Louis Armstrong)</li><li>When the Saints Go Marching In (Louis Armstrong)</li><li>Tiger Rag (Original Dixieland Jass Band)</li><li>Basin Street Blues (Louis Armstrong)</li></ul>
