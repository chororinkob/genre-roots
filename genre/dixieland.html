<h1>Dixieland（ディキシーランド）とは</h1>
<p>ディキシーランドは、ニューオーリンズで生まれた、ジャズの初期の形態だ。 編成の中心は3管（3種類の管楽器）である。旋律を担うトランペット、その周囲を装飾的に飛び回るクラリネット、低音側で骨格を支えるトロンボーンだ。ここにギターまた</p>
<p>ディキシーランドは、ニューオーリンズで生まれた、ジャズの初期の形態だ。

編成の中心は3管（3種類の管楽器）である。旋律を担うトランペット、その周囲を装飾的に飛び回るクラリネット、低音側で骨格を支えるトロンボーンだ。ここにギターまたはバンジョー、チューバまたはベース、ピアノ、ドラムのうち、少なくとも2つが加わる。それぞれの楽器に明確な役割分担があるからこそ、全員が同時に即興しても音が団子にならず、絡み合いとして成立する。

このスタイルの最大の特徴は「集団即興」だ。1人のソリストが目立つのではなく、トランペット・クラリネット・トロンボーンという複数の管楽器が、同時にそれぞれの即興演奏を繰り広げ、絡み合う。

テンポは軽快だ。マーチングバンド由来の陽気な行進曲的ノリと、ブルースの持つ哀愁が同居している。街を練り歩くパレードや祭りの高揚感を、音そのものが持っている。後年の洗練されたジャズと比べると、素朴で牧歌的（のどかな）な響きだ。しかし、その自由な掛け合いの中にこそ、ジャズという音楽が本来持っていた原点の姿がある。</p>
<h2>成り立ち</h2><p>舞台は20世紀初頭のアメリカ、ニューオーリンズだ。複数の文化が地理的に密集していたことで、この音楽は生まれた。

この街はフランス、スペイン、アメリカと支配者が変わった。カリブ海の島々とも人の行き来があった。そのため、フランス系混血のクレオール、アフリカ系の解放奴隷、イタリア系やドイツ系の移民が、同じ街に暮らしていた。南北戦争後、軍楽隊が放出した安価な中古の楽器が街に出回ったともよく言われるが、実証は十分でない。

葬列で行きは重々しい讃美歌を、帰りは陽気な行進曲を演奏するブラスバンドの習慣があった。そこに、ダンスホールの舞曲、教会の歌、そしてラグタイムのシンコペーション（拍の位置をずらす乗り）が混ざり合う。複数の管楽器が同時に即興する集団即興のスタイルが、こうして育っていく。

多くの初期ジャズ奏者が最初のジャズ奏者と評価した伝説的な存在は、コルネット奏者のBuddy Boldenだ。しかし、彼の演奏の録音は現存が確認されておらず、1907年に精神を病んで施設に収容され、そのまま生涯を終えた。

1897年に市が公認した歓楽街ストーリーヴィルは、多くの音楽家に演奏の職を与えた。しかし1917年、陸軍と海軍の要請で閉鎖された。閉鎖は音楽家流出の理由の一つだが、唯一の原因ではない。多くの音楽家は、より良い賃金・労働条件・人種的な安全を求めて街を出た。

同じ1917年、白人5人組のOriginal Dixieland Jass Bandが、ニューヨークで「Livery Stable Blues」を録音した。これは最初に発売されたジャズ・レコードとして広く知られる大ヒットとなった。ジャズを生み出したのは黒人であるにもかかわらず、最初に発売されたジャズ・レコードで富を得たのは白人バンドだった。この事実は、19世紀のミンストレル・ショー以来続く構図の、録音産業における典型例でもある。

1920年代のシカゴでは、King Oliverが率いたCreole Jazz Bandと、そこから独立したLouis Armstrongが頂点を築いた。ArmstrongによるHot FiveとHot Sevenの録音は、集団即興から独奏者の時代への転換を告げた。

「ディキシーランド」という呼称は、Original Dixieland Jass Bandにちなんでいる。スウィング期のファンが使い始め、1940年代に広まり、戦後にレコード会社が活用した。ニューオーリンズ系の黒人音楽家には、この語を避けて「ニューオーリンズ・ジャズ」と呼ぶ人も多い。

1940年代には、この古いスタイルを復興させるトラッド・ジャズ（昔ながらのジャズ）運動が起こった。復興運動は、スウィング時代の編曲重視への反動と、ビバップの混沌への反動の両方とされる。Bunk Johnsonの再発見は1938〜39年に始まり、初録音は1942年である。Kid Oryも再発見された。この復興は世界へ広がり、イギリスやヨーロッパ、そして日本でも根強く演奏され続けている。</p>
