<h1>A cappella（ア・カペラ）とは</h1>
<p>アカペラは、楽器を一切使わず人間の声だけで旋律・和声・リズムを構成する演奏様式である。声域ごとに分かれた数人から十数人のアンサンブルが基本で、ソプラノからバスまでの密なコードが同時に鳴るため、1台のオルガンのような音の厚みを持つ。</p>
<p>アカペラは、楽器を一切使わず人間の声だけで旋律・和声・リズムを構成する演奏様式である。声域ごとに分かれた数人から十数人のアンサンブルが基本で、ソプラノからバスまでの密なコードが同時に鳴るため、1台のオルガンのような音の厚みを持つ。和声はバーバーショップ（4声の密集和声で歌う編曲様式。男声・女声・混声のいずれでも歌われる）に特徴的な、ドミナント・セブンス型の和音（バーバーショップ・セブンス）を用いる例があり、ゴスペルやジャズ的なテンションコードで色づけすることもある。リズム面では、現代のポップ系アカペラでは、1人のシンガーがキック・スネア・ハイハットを口と喉で模倣するボイスパーカッションがドラムスの代わりを務め、低音担当が胸声でベースラインを支えることで、バンドに近いグルーヴが生まれることがある。エフェクターを使わない演奏も多く（現代ではマイクによる拡声も一般的）、声そのものの響きが楽器の役割を果たす。歌い方は滑らかなヘッドボイスから力強いベルトボイス、ラップ調の語りまで多様で、現代のポップ系グループでは、ポップスやゴスペルのヒット曲を無伴奏化するカバーが中心となることが多い。現代のポップ系アカペラでは、伴奏付きポップスとの違いはベースとパーカッションを声で代替する点、クラシックの合唱との違いはマイクを用いた個別パートのポップス的表現を狙う点にある。</p>
<h2>成り立ち</h2><p>語源はイタリア語の「礼拝堂風に」を意味する言葉で、もとは「礼拝堂様式」という意味だったが、19世紀に「無伴奏の声楽」の意味に変わった。ルネサンス期の多声音楽（いくつもの旋律が同時に重なる音楽。15〜16世紀、ジョスカンらフランドル楽派）で頂点に達したとされる。ただし当時の教会音楽が実際に無伴奏だったかは疑問視されており、オルガンなどの楽器が声部を重ねて演奏していた証拠もある。16世紀後半には、パレストリーナがカペッラ・ジューリアなどローマの教会で活躍した。グレゴリオ聖歌以来の伴奏を排した聖歌の伝統がその土台である。19世紀後半のアメリカでは、アフリカ系アメリカ人の間で広まった、4声の無伴奏ハーモニーの伝統であるバーバーショップが親しまれた（起源には諸説がある）。1940年代後半から50年代にはニューヨークやフィラデルフィアなどの街灯下で若者が3〜5声のコーラスを重ねるストリートコーナー・ハーモニー、のちにドゥーワップと呼ばれる音楽が花開き（路上では無伴奏で歌われたが、レコード録音では伴奏が加えられた）、「ドゥーワップ」という語は擬音語とされ、1961年に初めて活字になった。1970年にドゥーワップの復興に貢献したDJガス・ゴサートが広めたとされる（本人は命名の功績を認めていない）。1962年にブルックリンで結成されたザ・パースエイジョンズが、1969〜70年に初のLP『Acappella』を発表し、ゴスペル、ソウル、初期ロック、ジャズを混ぜた5声のハーモニーを声だけで歌う様式を示し、スウィングル・シンガーズは1963年のデビューアルバムで、ベースとドラムを伴い、バッハの曲を、歌詞ではなく意味のない音節で歌って成功し、ザ・キングス・シンガーズは合唱の精緻な技法を軽やかな重唱に移した。テイク・シックスは1988年にデビューし、1989年のグラミーでゴスペル部門とジャズ・ボーカル部門を受賞し、ゴスペルの密なコーラスとジャズ和声の融合で知られる。1990年には、映画監督スパイク・リーらによるアメリカのPBS（公共放送）の特別番組『Spike &amp; Co.: Do It a Cappella』が放送された。出演したのは、ロッカペラ、トゥルー・イメージ、ミント・ジュレップス、パースエイジョンズ、テイク・シックス、レディスミス・ブラック・マンバゾである。日本では2001年にフジテレビ系の『力の限りゴーゴゴー!!』のコーナーとして「ハモネプ」が始まり、高校生らの『ハモネプリーグ』がアカペラブームを起こした。ボイパ（ボイスパーカッション）の普及にも貢献した。2011年には米NBCのオーディション番組「The Sing-Off」第3シーズンを制したペンタトニックスが動画サイトを通じて世界的な人気を得た。ポップ系アカペラは1980〜90年代から大学のグループなどを通じて広がっており、その流れの上で成功した例である。南アフリカではズールー系合唱団レディスミス・ブラック・マンバゾが1986年のポール・サイモンのアルバム「グレイスランド」への参加を機に無伴奏合唱イシカタミヤを世界に知らしめている。近年は「アオペラ -aoppella!?-」や「うたごえはミルフィーユ」など高校生のアカペラを題材にしたメディア展開も生まれ、聖歌からネット時代のポップスまで、関心が周期的に高まりながら続いてきた様式である。</p>
