<h1>A cappella（ア・カペラ）とは</h1>
<p>アカペラは、楽器を一切使わず人間の声だけで旋律・和声・リズムを構成する演奏様式である。声域ごとに分かれた数人から十数人のアンサンブルが基本で、ソプラノからバスまでの密なコードが同時に鳴るため、一台のオルガンのような音の厚みを持つ。</p>
<p>アカペラは、楽器を一切使わず人間の声だけで旋律・和声・リズムを構成する演奏様式である。声域ごとに分かれた数人から十数人のアンサンブルが基本で、ソプラノからバスまでの密なコードが同時に鳴るため、一台のオルガンのような音の厚みを持つ。和声はバーバーショップ由来のリーディングトーンセブンスコードの「鳴き」を好み、ゴスペルやジャズ的なテンションコードで色づけすることもある。リズム面では、1人のシンガーがキック・スネア・ハイハットを口と喉で模倣するボイスパーカッションがドラムスの代わりを務め、低音担当が胸声でベースラインを支えるため、バンドと同様のグルーヴが生まれる。エフェクターを通さない生声の残響しかないため、口をすぼめる母音の形や身体の角度まで含めて音色の明暗を作り、身体そのものが楽器になる。曲の構成は、パーカッションとベースラインだけで敷いたイントロにコーラスが一層ずつ重なり、ブリッジで全声部が開いてから無声の余韻で締める型が多い。歌い方は滑らかなヘッドボイスから力強いベルトボイス、ラップ調の語りまで多様で、ポップスやゴスペルのヒット曲を無伴奏化するカバーがレパートリーの中心である。伴奏付きポップスとの違いはベースとパーカッションを声で代替する点、クラシックの合唱との違いはマイクを用いた個別パートのポップス的表現を狙う点にある。</p>
<h2>成り立ち</h2><p>語源はイタリア語の「礼拝堂風に」を意味する言葉であり、伴奏なしで歌う教会音楽の様式を指した。起源は15世紀末の作曲家ジョスカン・デ・プレの時代に遡るとされ、16世紀後半にはパレストリーナがシスティーナ聖歌隊で多声聖歌を書き上げ、対抗宗教改革のローマで明晰な無伴奏声楽の規範が整えられた。グレゴリオ聖歌以来の伴奏を排した聖歌の伝統がその土台である。19世紀末から20世紀初頭のアメリカでは、男性4人が密な和声と短い締めのフレーズを競うバーバーショップが親しまれた。1940〜50年代にはニューヨークやフィラデルフィアの街灯下で若者が3〜5声のコーラスを重ねるストリートコーナー・ハーモニー、のちにドゥーワップと呼ばれる音楽が花開き、ベース声部が「ドゥ・ワップ」と唸る唱法が呼び名の由来になったとされる。この呼称を広めたのは1970年代のDJガス・ゴサートだと言われる。ドゥーワップの無伴奏伝統を継いだザ・パースエイジョンズが1970年代初頭にジャズやソウルを声だけで歌う様式を示し、スウィングル・シンガーズは1963年のデビューアルバムでバッハをスキャット化してクラシックの無伴奏化を開拓、ザ・キングス・シンガーズは合唱の精緻な技法を軽やかな重唱に移した。1988年にはテイク・シックスがデビューアルバムでグラミー賞を獲得し、ゴスペルの密なコーラスとジャズ和声の融合でジャンルの地位を大きく引き上げた。1990年には映画監督スパイク・リーがテレビスペシャル「Do it A cappella」でダグ・E・フレッシュらのヒューマンビートボックスを紹介し、声によるパーカッションが様式に本格的に組み込まれた。日本では2000年前後にフジテレビのバラエティ番組「ハモネプ」が大学アカペラサークル文化を全国に広め、ボイスパーカッションという訳語を定着させた。2011年には米NBCのオーディション番組「The Sing-Off」第3シーズンを制したペンタトニックスが動画サイトを通じて世界的な人気を得て、無伴奏カバーをポップスの一つの形として定着させた。南アフリカではズールー系合唱団レディスミス・ブラック・マンバゾが1986年のポール・サイモンのアルバム「グレイスランド」への参加を機に無伴奏合唱イシカタミヤを世界に知らしめている。近年は「アオペラ -aoppella!?-」や「うたごえはミルフィーユ」など高校生のアカペラを題材にしたメディア展開も生まれ、聖歌からネット時代のポップスまで脈々と続く様式となっている。</p>
