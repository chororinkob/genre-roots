<h1>A cappella（ア・カペラ）とは</h1>
<p>アカペラは、楽器を一切使わず、人間の声だけで旋律・和声・リズムを作る演奏スタイルだ。 声域ごとに分かれた、数人から十数人のアンサンブルが基本になる。ソプラノからバスまでの密なコードが同時に鳴るため、1台のオルガンのような音の厚みを</p>
<p>アカペラは、楽器を一切使わず、人間の声だけで旋律・和声・リズムを作る演奏スタイルだ。

声域ごとに分かれた、数人から十数人のアンサンブルが基本になる。ソプラノからバスまでの密なコードが同時に鳴るため、1台のオルガンのような音の厚みを持つ。

和声では、バーバーショップ（4声の密集和声で歌うa cappellaの編曲スタイルで、男声・女声・混声のいずれでも歌われる）のドミナント7th型和音（バーバーショップ・セブンス）が、曲の時間の35〜60%が目安とされる。ゴスペルやジャズ的なテンションコードで、色づけすることもある。

リズム面では、現代のポップ系a cappellaで、1人のシンガーがキック・スネア・ハイハットを口と喉で模倣するボイスパーカッションがドラムスの代わりを務める。低音担当が胸声でベースラインを支えるため、バンドに近い質感を生むことがある。エフェクターを使わない演奏も多い。

歌い方は、滑らかなヘッドボイスから力強いベルトボイス、ラップ調の語りまで多様だ。現代のポップ系グループでは、ポップスやゴスペルのヒット曲を無伴奏化するカバーが中心となることが多い。

現代のポップ系a cappellaでは、伴奏付きポップスとの違いは、ベースとパーカッションを声で代替する点にある。クラシックの合唱との違いは、マイクを用いた個別パートのポップス的表現を狙う点にある。</p>
<h2>成り立ち</h2><p>語源は、イタリア語の「礼拝堂風に」を意味する言葉だ。もとは「礼拝堂スタイル」という意味だったが、19世紀に「無伴奏の声楽」の意味に変わった。ルネサンス期の教会音楽では、オルガンなどの楽器が声部を倍奏していたという証拠がある。語義が変わった背景も、この倍奏への無知とルネサンス多声音楽への関心の再燃だった。

ルネサンス期の多声音楽（いくつもの旋律が同時に重なる音楽。15〜16世紀、ジョスカンらフランドル楽派）で頂点に達したとされる。16世紀後半には、パレストリーナがカペッラ・ジューリアなどローマの教会で活躍した。グレゴリオ聖歌以来の、伴奏を排した聖歌の伝統が、その土台である。

アメリカでは、バーバーショップが広まった。これは、19世紀後半にアフリカ系アメリカ人の間で広まった、4声の無伴奏ハーモニーの伝統である。起源には諸説ある。

1940年代後半には、ニューヨークやフィラデルフィアのほか、シカゴ、ボルチモア、ロサンゼルスなどの街灯下で、若者が無伴奏で3〜5声のコーラスを重ねた。ストリートコーナー・ハーモニー、のちにドゥーワップと呼ばれる音楽が花開いた。ただしレコード録音では、伴奏が加えられた。語の由来は擬音語とされる。1970年にWCBS-FMでドゥーワップ復興に貢献したDJガス・ゴサートが広めた（命名者ではない）とされる。

ドゥーワップの無伴奏伝統を継いだザ・パースエイジョンズは、1962年にブルックリンで結成。1969〜70年にフランク・ザッパのStraightレーベルから初のLP『Acappella』を発表。ゴスペル、ソウル、初期ロック、ジャズを混ぜた5声のハーモニーで知られる。スウィングル・シンガーズは、1963年のデビューアルバムで成功した。ベースとドラムを伴い、バッハの曲を、歌詞ではなく意味のない音節で歌った。ザ・キングス・シンガーズは、合唱の精緻な技法を軽やかな重唱に移した。

テイク・シックスは1988年にデビューし、1989年のグラミーでゴスペル部門とジャズ・ボーカル部門を受賞した。ゴスペルの密なコーラスとジャズ和声の融合で、ジャンルの地位を大きく引き上げたと見られる。

1990年には、映画監督スパイク・リーらによるアメリカのPBS（公共放送）の特別番組『Spike &amp; Co.: Do It a Cappella』が放送された。出演したのは、ロッカペラ、トゥルー・イメージ、ミント・ジュレップス、パースエイジョンズ、テイク・シックス、レディスミス・ブラック・マンバゾである。

日本では、2001年にフジテレビ系の『力の限りゴーゴゴー!!』のコーナーとして「ハモネプ」が始まった。高校生らの『ハモネプリーグ』が、アカペラブームを起こした。ボイパ（ボイスパーカッション）の普及にも貢献した。

2011年には、米NBCのオーディション番組「The Sing-Off」第3シーズンを制したペンタトニックスが、動画サイトを通じて世界的な人気を得た。南アフリカでは、ズールー系合唱団レディスミス・ブラック・マンバゾが、1986年のポール・サイモンのアルバム「グレイスランド」への参加を機に、無伴奏合唱イシカタミヤを世界に知らしめている。

近年は、「アオペラ -aoppella!?-」や「うたごえはミルフィーユ」など、高校生のアカペラを題材にしたメディア展開も生まれた。聖歌からネット時代のポップスまで、関心が周期的に高まりながら続いてきた。</p>
