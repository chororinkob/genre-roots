<h1>A cappella（ア・カペラ）とは</h1>
<p>アカペラは、楽器を一切使わず人間の声だけで旋律・和声・リズムを構成する演奏様式である。声域ごとに分かれた数人から十数人のアンサンブルが基本で、ソプラノからバスまでの密なコードが同時に鳴るため、1台のオルガンのような音の厚みを持つ。</p>
<p>アカペラは、楽器を一切使わず人間の声だけで旋律・和声・リズムを構成する演奏様式である。声域ごとに分かれた数人から十数人のアンサンブルが基本で、ソプラノからバスまでの密なコードが同時に鳴るため、1台のオルガンのような音の厚みを持つ。和声はバーバーショップ（男性4人組の合唱）由来の、ドミナント・セブンス型の和音（バーバーショップ・セブンス）をよく響かせることを好み、ゴスペルやジャズ的なテンションコードで色づけすることもある。リズム面では、1人のシンガーがキック・スネア・ハイハットを口と喉で模倣するボイスパーカッションがドラムスの代わりを務め、低音担当が胸声でベースラインを支えるため、バンドと同様のグルーヴが生まれる。エフェクターを通さない生声の残響しかないため、口をすぼめる母音の形や身体の角度まで含めて音色の明暗を作り、身体そのものが楽器になる。曲の構成は、パーカッションとベースラインだけで敷いたイントロにコーラスが一層ずつ重なり、ブリッジで全声部が開いてから無声の余韻で締める型が多い。歌い方は滑らかなヘッドボイスから力強いベルトボイス、ラップ調の語りまで多様で、ポップスやゴスペルのヒット曲を無伴奏化するカバーがレパートリーの中心である。伴奏付きポップスとの違いはベースとパーカッションを声で代替する点、クラシックの合唱との違いはマイクを用いた個別パートのポップス的表現を狙う点にある。</p>
<h2>成り立ち</h2><p>語源はイタリア語の「礼拝堂風に」を意味する言葉で、もとは「礼拝堂様式」という意味だったが、19世紀に「無伴奏の声楽」の意味に変わった。ルネサンス期の多声音楽（いくつもの旋律が同時に重なる音楽。14〜16世紀、ジョスカンらフランドル楽派）で頂点に達したとされる。16世紀後半には、パレストリーナがカペッラ・ジューリアなどローマの教会で活躍した。グレゴリオ聖歌以来の伴奏を排した聖歌の伝統がその土台である。19世紀末から20世紀初頭のアメリカでは、男性4人が密な和声と短い締めのフレーズを競うバーバーショップが親しまれた。1940〜50年代にはニューヨークやフィラデルフィアの街灯下で若者が3〜5声のコーラスを重ねるストリートコーナー・ハーモニー、のちにドゥーワップと呼ばれる音楽が花開き、ベース声部が「ドゥ・ワップ」と唸る唱法が呼び名の由来になったとされる。この呼称を広めたのは1970年代のDJガス・ゴサートだと言われる。ドゥーワップの無伴奏伝統を継いだザ・パースエイジョンズが1970年代初頭にジャズやソウルを声だけで歌う様式を示し、スウィングル・シンガーズは1963年のデビューアルバムで、ベースとドラムを伴い、バッハの曲を、歌詞ではなく意味のない音節で歌って成功し、ザ・キングス・シンガーズは合唱の精緻な技法を軽やかな重唱に移した。テイク・シックスは1988年にデビューし、1989年のグラミーでゴスペル部門とジャズ・ボーカル部門を受賞し、ゴスペルの密なコーラスとジャズ和声の融合でジャンルの地位を大きく引き上げた。1990年には、映画監督スパイク・リーらによるアメリカのPBS（公共放送）の特別番組『Spike &amp; Co.: Do It a Cappella』が放送された。出演したのは、ロッカペラ、トゥルー・イメージ、ミント・ジュレップス、パースエイジョンズ、テイク・シックス、レディスミス・ブラック・マンバゾである。日本では2001年にフジテレビ系の『力の限りゴーゴゴー!!』のコーナーとして「ハモネプ」が始まり、高校生らの『ハモネプリーグ』がアカペラブームを起こした。ボイパ（ボイスパーカッション）の普及にも貢献した。2011年には米NBCのオーディション番組「The Sing-Off」第3シーズンを制したペンタトニックスが動画サイトを通じて世界的な人気を得て、無伴奏カバーをポップスの一つの形として定着させた。南アフリカではズールー系合唱団レディスミス・ブラック・マンバゾが1986年のポール・サイモンのアルバム「グレイスランド」への参加を機に無伴奏合唱イシカタミヤを世界に知らしめている。近年は「アオペラ -aoppella!?-」や「うたごえはミルフィーユ」など高校生のアカペラを題材にしたメディア展開も生まれ、聖歌からネット時代のポップスまで脈々と続く様式となっている。</p>
