<h1>Power Pop（パワーポップ）とは</h1>
<p>パワーポップは、1960年代のビートグループが持っていた簡潔な高揚感を、意識的に受け継いで作られるロックだ。 中心にあるのは、歌の覚えやすさだ。3分前後の曲の中に、印象的な導入の音型、口ずさめる旋律、そして戻ってくる合唱部分が、過</p>
<p>パワーポップは、1960年代のビートグループが持っていた簡潔な高揚感を、意識的に受け継いで作られるロックだ。

中心にあるのは、歌の覚えやすさだ。3分前後の曲の中に、印象的な導入の音型、口ずさめる旋律、そして戻ってくる合唱部分が、過不足なく配置される。

和声（コードの響き）は、予想外の和声変化などで切なさを出すことがある。明るいのにどこか切ないという、独特の感触を生む。この寂しさを含んだ明るさこそが、この分野の本質といえる。

楽器では、響きのあるギター（Rickenbackerなど）と、荒めのハードロック的ギターが併存する。手拍子が使われることがある。

テンポはアップテンポの曲が多く、4/4拍子で走る。間奏は短く、ギターソロも歌の旋律をなぞる程度に留められる。

歌は、複数の声で重ねられる傾向がある。ヴォーカル・ハーモニーが特徴である。

歌詞は、恋愛・失恋など個人的な感情を扱うものが多い。明るい演奏との落差が、独特の切なさを作る。

パンクと近い面もあるが、多くのバンドは新waveの皮肉や冷笑を退けた。</p>
<h2>成り立ち</h2><p>パワーポップという言葉は、1967年にThe WhoのPete Townshendが、自分たちの音楽を説明する際に使ったのが最初とされる。しかし、実践としてスタイルが固まったのは1970年代だ。Paul Lesterは&quot;本質的に70年代の発明&quot;と評している。

しかも、Big Starなど一部の重要なバンドが商業的に報われなかった。この点が、この分野の歴史を特異なものにしている。

代表的な例が、テネシー州メンフィスのBig Starだ。Alex ChiltonとChris Bellを中心に、地元のArdent Recordsから1972年に作品を発表した。題名は皮肉にもナンバー・ワン・レコードだった。配給を担っていたStax RecordsがColumbiaと配給契約を結んだが、Columbiaは従来の配給網を使わず、既存在庫も店頭から外したとされる。そのため店頭にほとんど並ばなかった。続く1974年の作品も、StaxとColumbiaの対立で配給されず、売上は限られた。Chris Bellは脱退後の1978年に自動車事故で27歳で死亡している。

イギリスのBadfingerは、The Beatlesが設立したApple Recordsから世に出た。複数のヒットを持ちながら、管理者による金銭面の不正（収入の囲い込みなど）と、契約上の紛争に追い詰められた。中心人物のPete Hamが1975年に、Tom Evansが1983年に、いずれも自ら命を絶つという痛ましい結末を迎えた。

オハイオ州クリーヴランドのThe Raspberriesは、1972年のゴー・オール・ザ・ウェイで全米5位のヒットを出した。だが、一部の批評では「ビートルズの模倣」と揶揄された。創作上の対立もあって、1975年に解散した。

イリノイ州ロックフォードのCheap Trickは、本国より先に日本で熱狂的な人気を得た。1978年の武道館公演を収めた実況録音盤が、逆輸入的（海外で人気になって戻ってくる形）に大ヒットした。こうした珍しい経路で、全米へ広がった。

1979年には、The Knackのマイ・シャローナが全米1位を6週にわたり守った。だが、The Knackが勢いを保てなくなると、レコード会社は概してパワーポップのバンドとの契約をやめた。ジャンルへの反発が起きた。

それでも、1990年代のTeenage FanclubやMatthew Sweet、Weezerといった作家が、繰り返しこのスタイルへ立ち返った。Big Starは、R.E.M.やThe Replacementsなど後続のバンドが敬愛し、熱心なカルト的支持を得た。

Big Starのように商業的に報われなかった重要バンドがいた一方、Cheap Trick、The Knack、Raspberriesのように成功した例もある。1979年以降は、一時的に冷遇された。</p>
