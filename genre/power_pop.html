<h1>Power Pop（パワーポップ）とは</h1>
<p>1960年代のビートグループが持っていた簡潔な高揚感を、意識的に受け継いで作られるロックである。核にあるのは歌の覚えやすさで、3分前後の曲の中に、印象的な導入の音型、口ずさめる旋律、そして必ず戻ってくる合唱部分が過不足なく配置され</p>
<p>1960年代のビートグループが持っていた簡潔な高揚感を、意識的に受け継いで作られるロックである。核にあるのは歌の覚えやすさで、3分前後の曲の中に、印象的な導入の音型、口ずさめる旋律、そして必ず戻ってくる合唱部分が過不足なく配置される。和声はロックにしては豊かで、単純な三和音に加えて長七の和音や、第三音を保留した宙吊りの響きが多用され、明るいのにどこか切ないという独特の感触を生む。この寂しさを含んだ明るさこそが、この分野の本質といえる。楽器では、Rickenbackerの12弦ギターに代表される、金属的で煌めく高音の鳴りが象徴的で、そこにコンプレッサーを深くかけて粒を揃えた録音が重なる。ベースは旋律的に動き回り、ドラムは手数を抑えて手拍子を伴う。歌は必ず複数の声で重ねられ、三度や五度で寄り添う和音が全編にわたって鳴る。テンポは120から160 BPM程度の4/4拍子で走り、間奏は短く、ギターソロも歌の旋律をなぞる程度に留められる。歌詞は片思い、失恋、少年期の記憶、自意識といった内向きの主題が中心で、明るい演奏との落差が独特の切なさを作る。パンクと編成も曲の長さも近いが、攻撃性ではなく甘さを選ぶ点が決定的に異なる。</p>
<h2>成り立ち</h2><p>言葉自体は1967年にThe WhoのPete Townshendが、自分たちの音楽を説明する際に使ったのが最初とされる。しかし実践として様式が固まったのは1970年代前半で、しかもその担い手のほとんどが商業的に報われなかった点が、この分野の歴史を特異なものにしている。象徴的なのはテネシー州メンフィスのBig Starである。Alex ChiltonとChris Bellを中心に、地元のArdent Recordsから1972年に発表した作品は皮肉にもナンバー・ワン・レコードと題されていたが、配給を担っていたStax Recordsの経営混乱によって店頭にほとんど並ばず、続く1974年の作品も同じ運命をたどった。Chris Bellは脱退後の1978年に自動車事故で27歳で死亡している。イギリスのBadfingerはThe Beatlesが設立したApple Recordsから世に出て複数のヒットを持ちながら、管理者による資金の横領と契約上の紛争に追い詰められ、中心人物のPete Hamが1975年に、Tom Evansが1983年に、いずれも自ら命を絶つという痛ましい結末を迎えた。オハイオ州クリーヴランドのThe Raspberriesは1972年のゴー・オール・ザ・ウェイで成功を収めたが、時代遅れと見なされて短命に終わる。イリノイ州ロックフォードのCheap Trickは、本国より先に日本で熱狂的な人気を得て、1978年の武道館公演を収めた実況録音盤が逆輸入的に大ヒットするという珍しい経路で全米へ広がった。1979年にはThe Knackのマイ・シャローナが全米1位を6週にわたり守り、レコード会社は一斉に類似のバンドを契約したが、過剰な売り込みへの反発から短期間で市場が崩壊し、パワーポップという語自体が売れない音楽の代名詞として扱われる時期が長く続いた。それでも1980年代のR.E.M.やThe Replacements、1990年代のTeenage FanclubやMatthew Sweet、Weezerといった作家が繰り返しこの様式へ立ち返り、Big Starは死後になって最も影響力のあるバンドのひとつとして再評価された。売れないまま参照され続けるという構図は、現在に至るまでこの分野の宿命として続いている。</p>
<h2>代表曲</h2><ul><li>My Sharona (The Knack)</li><li>Buddy Holly (Weezer)</li><li>September Gurls (Big Star)</li><li>I Want You to Want Me (Cheap Trick)</li><li>That Thing You Do! (The Wonders)</li></ul>
