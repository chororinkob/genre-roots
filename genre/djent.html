<h1>Djent（ジェント）とは</h1>
<p>極端に低く調弦した多弦ギターによる、リズム主体のメタル。名称は、弦をパーム・ミュートしながら強く弾いたときの、金属的で減衰の速い打撃音の擬音に由来する。使用される楽器は七弦、八弦、時に九弦ギターで、最低音はB、F#、あるいはそれ以</p>
<p>極端に低く調弦した多弦ギターによる、リズム主体のメタル。名称は、弦をパーム・ミュートしながら強く弾いたときの、金属的で減衰の速い打撃音の擬音に由来する。使用される楽器は七弦、八弦、時に九弦ギターで、最低音はB、F#、あるいはそれ以下まで下げられる。音色設計が極めて重要で、低音の輪郭を保つために中低域を大きく削り、高音域の粒立ちを強調した、いわゆるスクープした音が作られる。最大の特徴はリズムで、ポリリズムと呼ばれる複数の周期の重なりが常時用いられる。具体的には、四分の四の拍節が保たれる一方で、ギターのリフは五音、七音、11音といった不均等な単位で反復するため、両者の周期が一致するまで数小節を要する。この、拍の頭が絶えずずれ続ける感覚が中核の快感となる。加えて変拍子が頻繁に用いられる。この激しいリズムと対比して、上物には広がりのあるアンビエント的なパッドやクリーンなアルペジオが重ねられ、和声は九度や11度を含む浮遊した響きが選ばれる。歌唱は絶叫と伸びやかなクリーンの対比が定番である。</p>
<h2>成り立ち</h2><p>起源はスウェーデンのバンドMeshuggahにある。1987年に結成された彼らは、1990年代を通じて、八弦ギターの採用、極端な低音、そして四分の四の拍節の上に不均等な周期のリフを重ねるという手法を確立した。とりわけ1998年のChaosphere と2002年のNothingが決定的な作品とされる。名称そのものは、ギタリストFredrik Thordendalが自らの音を擬音で表現した言葉に由来し、後にインターネット上の掲示板で広まった。ジャンルとしての成立は2000年代後半で、その舞台は物理的な場所ではなくインターネットだった。決定的な人物はイギリスのMisha Mansoorで、彼はPeripheryの名で自室での制作による音源を無料で公開し、音楽掲示板Sevenstring.orgやMeshuggahの掲示板で議論を交わしながら、この様式の共通の語彙を形成した。同様に、スウェーデンのTesseracT、オーストラリアのAnimals as Leadersのギタリスト Tosin Abasi らが加わった。技術的な前提として、コンピュータ上での録音、ギターのアンプの音を模倣するソフトウェア、そして多弦ギターの量産化が同時期に進んだことが挙げられる。これにより、自室で商業水準の音を作ることが可能になった。楽器メーカーもこの需要に応え、Ibanezをはじめ各社が七弦と八弦のギターを標準的な商品として販売するようになった。批判も強く、リズムの複雑さが目的化して音楽的な内容が希薄だという指摘、そして全ての作品が同じ音に聴こえるという同質化の問題が繰り返し議論された。名称そのものをジャンルとして認めない立場も根強い。それでも、この手法はメタル全般に広く浸透し、現在では特別な様式というより一般的な語彙となっている。</p>
