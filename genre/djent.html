<h1>Djent（ジェント）とは</h1>
<p>ジェントは、極端に低く調弦した多弦ギターによる、リズム主体のメタルだ。名称は、弦をパーム・ミュート（手のひらで弦を軽く押さえて音を詰める奏法）しながら強く弾いたときの、金属的で減衰の速い打撃音の擬音に由来する。 使用される楽器は、</p>
<p>ジェントは、極端に低く調弦した多弦ギターによる、リズム主体のメタルだ。名称は、弦をパーム・ミュート（手のひらで弦を軽く押さえて音を詰める奏法）しながら強く弾いたときの、金属的で減衰の速い打撃音の擬音に由来する。

使用される楽器は、7弦、8弦、時に9弦ギターだ。最低音はB、F#、あるいはそれ以下まで下げられる。音色設計が極めて重要で、低域をタイトに保った、歯切れのよい、歪みを強くかけた音色が作られる。

上物（メロディーなど上に重ねる音）には、広がりのあるアンビエント的なパッド（持続する背景の音）やクリーンなアルペジオ（和音を1音ずつ順に弾く奏法）が重ねられることが多い。激しいリズムとの対比になっている。和声（コードの響き）は、浮遊した響きが選ばれることが多い。

最大の特徴はリズムだ。ポリリズム（異なる拍の周期を重ねるリズム）に近い、複数の周期の重なりが中核にある（厳密にはポリメーターと呼ばれる仕組み）。具体的には、4分の4の拍節（拍の区切り）が保たれる一方で、ギターのリフは5音、7音、11音といった不均等な単位で反復する。そのため、両者の周期が一致するまで数小節を要する。拍の頭が絶えずずれ続けるこの感覚が、中核の快感となる。拍子記号の上は、4分の4のままのことも多い。

歌唱は、絶叫と伸びやかなクリーンを併用するバンドが多い。ただし、インストゥルメンタルやラップ主体の例もある。</p>
<h2>成り立ち</h2><p>出発点は、スウェーデンのバンドMeshuggahだ。このバンドが、その演奏技法の源流とされる。

1987年に結成された彼らは、1990年代に7弦ギターの下げ調弦と4/4上の不均等周期リフという手法を固めた。2002年のNothingでは、さらに低いF調弦へ進んだ。8弦ギターを初めて試したのは、2002年のNothingの制作時とされる。ただし、2002年の原盤は7弦で録音され、8弦での録り直しは2006年の再発盤である。Destroy Erase Improve（1995）、Chaosphere（1998）、Nothing（2002）、obZen（2008）などが、重要作として挙げられる。

名称の由来には諸説あり、Thordendalの擬音説、Hagströmの「酔った席での聞き違い」という回想、Mansoor自身の「ギアが&quot;djenty&quot;か」という冗談での使用がある。Meshuggah周辺の擬音を、Mansoor世代がネット上で広めた。

ジャンルとしての成立には、見方が分かれている。文化的起源を1990年代半ばのスウェーデンとする見方と、2000年代後半〜2010年代初頭のイングランドと米国のインターネット上のシーン形成とする見方だ。後者の舞台は物理的な場所ではなくインターネットだった。

初期のネット上の共同体の中心人物の一人が、アメリカのMisha Mansoorだ。彼はBulbの名で、自室での制作による音源を無料で公開した。音楽掲示板Sevenstring.orgやMeshuggahの掲示板で議論を交わしながら、用語の普及にも関わった。同様に、イングランドのTesseracT、米国のAnimals as Leadersのギタリスト Tosin Abasi らが、同時期に同じ環境から登場した。TesseracTのAcle Kahneyは、フォーラムで交流した。

技術的な前提として、コンピュータ上での録音、ギターのアンプの音を模倣するアンプ・シミュレーター（ハード／ソフト）、そして多弦ギターの量産化が、同時期に進んだ。これにより、自室で商業水準の音を作ることが可能になった。楽器メーカーのIbanezは、1990年に量産の7弦ギター（Universe）、2000年代後半に量産の8弦ギターを投入した。のちにジェント系のギタリストに広く使われた。

しかし、批判も強く、一過性の流行にすぎないという見方もあった。名称そのものをジャンルとして認めない立場も根強い。それでも、多弦ギターや低音域リフの手法は、テック系メタルを中心に広まった。</p>
