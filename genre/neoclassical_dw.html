<h1>Neoclassical Darkwave（ネオクラシカルダークウェーブ）とは</h1>
<p>ダークウェイヴの暗鬱な情緒に、西洋古典音楽の編成と作法を接続した音楽。弦楽四重奏やチェロの重奏、ピアノ、ティンパニ、パイプオルガン、そして混声合唱やソプラノ独唱といった要素が、シンセサイザーやサンプラーによる再現も交えて用いられる</p>
<p>ダークウェイヴの暗鬱な情緒に、西洋古典音楽の編成と作法を接続した音楽。弦楽四重奏やチェロの重奏、ピアノ、ティンパニ、パイプオルガン、そして混声合唱やソプラノ独唱といった要素が、シンセサイザーやサンプラーによる再現も交えて用いられる。実際の生演奏と、サンプリングされた管弦楽音源が混在するのが常態で、その質感の差自体が幻想的な非現実感を生む。和声はバロックや後期ロマン派の語法を借り、減七の和音や半音階的な進行、教会旋法を用いて荘厳さと不安を同居させる。拍子は4分の3や4分の6といった舞曲的なものも使われ、テンポは遅く、60〜90BPM程度の葬送行進曲のような歩みが典型。曲の構成はロックの歌もの形式より、序奏から徐々に層を重ねて頂点へ到達し崩壊するという交響詩的な設計が好まれる。ヴォーカルはオペラの発声法を用いた女性ソプラノや、グレゴリオ聖歌を模した男性の斉唱、あるいはラテン語や創作言語による朗誦で、歌詞の意味よりも響きが優先される場合も多い。歌詞の主題は死と葬送、中世の伝承、神話、宗教的な陶酔と絶望。ダークウェイヴ一般と比べてダンスのビートを持たず、より鑑賞のための音楽として設計されている点が最大の相違になる。またシンフォニックメタルと似た素材を扱うが、歪んだギターとドラムセットの推進力を持たない点で異なる。</p>
<h2>成り立ち</h2><p>1980年代末から1990年代前半にかけて、主にドイツとフランス、そして4AD Recordsの周辺で形をとった。直接の出発点はDead Can Danceで、Brendan PerryとLisa Gerrardは1987年の「Within the Realm of a Dying Sun」でアルバムの片面を管弦楽的な葬送音楽に、もう片面を中世風の声楽に割り当てるという構成を採り、ロックの編成から完全に離脱した。ここで示された、暗い情緒を古典音楽の器で表現するという方法論が、後続の直接の設計図になった。同じ4ADからはThis Mortal Coilが1984年の「It'll End in Tears」でチェロとピアノの室内楽的な編曲を提示し、Cocteau Twinsの意味を持たない歌唱も、言葉より音響を優先する態度として影響を残した。ドイツではHyperium Recordsが1989年にニュルンベルクで設立され、Stoa、Chandeen、Love Is Colderといったバンドを擁して、この系統を商品カテゴリとして確立した。同レーベルが1990年代半ばに出した編集盤シリーズ「Heavenly Voices」は、女性ソプラノを前面に出した作品を集めたもので、エセリアル・ウェイヴやネオクラシカル・ダークウェイヴという呼称の普及に大きく寄与した。フランスではElendが1994年の「Leçons de Ténèbres」で、暗黒の合唱とヴァイオリンだけでJohn Miltonの「失楽園」を主題にした作品を作り、極端な例として知られる。同じくフランスのCorpus Delicti、イタリアのAtaraxia、ポルトガルのMoonspell初期作品も同系統に含まれる。ドイツ語圏ではDas IchやLacrimosaがこの美学をより劇場的に展開し、Lacrimosaは1990年代後半にフィンランド放送交響楽団など実際の管弦楽団を起用してゴシックメタルとの中間領域を開いた。ライプツィヒで1992年に始まったWave-Gotik-Treffenが発表の場となり、教会や古い劇場を会場に使うことで音楽の宗教的な意匠を演出上も裏づけた。1990年代後半にはネオフォークやマーシャル・インダストリアルとの境界が曖昧になり、一部のバンドが軍事的・国家主義的な図像を用いたことで政治的論争が起きた。2000年代に入ると市場は縮小したが、映画やゲームの劇伴音楽がこの語彙を大量に吸収し、Two Steps from Hellのような予告編音楽の会社や、ダークファンタジー作品の音楽として実質的に生き延びている。</p>
