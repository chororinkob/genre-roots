<h1>Neoclassical Darkwave（ネオクラシカルダークウェーブ）とは</h1>
<p>ネオクラシカル・ダークウェイヴは、ダークウェイヴの暗く沈んだ気分に、西洋のクラシック音楽の編成と作法を結びつけた音楽だ。 使われる楽器は、弦楽四重奏やチェロの重奏、ピアノ、ティンパニ、パイプオルガンだ。混声合唱やソプラノ独唱も加わ</p>
<p>ネオクラシカル・ダークウェイヴは、ダークウェイヴの暗く沈んだ気分に、西洋のクラシック音楽の編成と作法を結びつけた音楽だ。

使われる楽器は、弦楽四重奏やチェロの重奏、ピアノ、ティンパニ、パイプオルガンだ。混声合唱やソプラノ独唱も加わる。これらは、シンセサイザーやサンプラーで再現されることもある。管弦楽の響きをシンセサイザーやサンプルで再現するのが中心のバンドもあれば、生の楽器を使うバンドもある。

和音は、バロックや後期ロマン派の表現を借りる例がある。減七の和音や半音階的な進行、教会旋法を使い、荘厳さと不安を同じ曲の中に同居させる。

拍子は、4分の3や4分の6といった舞曲風のものも使われる。テンポは遅めのものが多く、葬送行進曲のような歩みの曲もある。ダークウェイヴ一般と比べると、ダンスのビートを持たないことが多く、じっくり聴いて味わうための音楽として作られている。シンフォニックメタルと似た素材を扱うが、歪んだギターを持たない点で異なる。ドラムセット中心の推進力は弱いが、行進曲のような打楽器やスネアを使う例も多い。

歌は、女性ヴォーカルが優勢だ。ソプラノのほか、Gerrardのようなコントラルトもいる。グレゴリオ聖歌をまねた男性の斉唱や、ラテン語や創作言語による朗誦もある。歌詞の意味よりも、響きが優先されることもある。

歌詞の主題には、例えば死と葬送、中世の伝承、神話、宗教的な陶酔と絶望がある。

曲の組み立てでは、ロックの歌ものの形でなく、交響詩のような作りをとる例もある。序奏から少しずつ音の層を重ね、頂点に達したあと崩れていく。</p>
<h2>成り立ち</h2><p>ネオクラシカル・ダークウェイヴは、1980年代後半に英国（Dead Can Dance、In the Nursery）で土台ができた。1990年代には、ドイツ（Hyperium 周辺）、フランス（Elend）、イタリア（Ataraxia）などへ広がった。

先駆けとされるのは、Dead Can Dance（1985年の『Spleen and Ideal』以降）とIn the Nurseryだ。Brendan PerryとLisa Gerrardは、1987年の「Within the Realm of a Dying Sun」で、ギター、ベース、ドラムというロックの編成では足りないと考えた。アルバムの後半では、Gerrardの歌声を前面に出した。暗い感情をクラシック音楽の器で表すという、ここで示されたやり方が、後に続く人たちの直接のお手本になったと言われる。

同じ4ADからは、This Mortal Coilが1984年に「It'll End in Tears」を出した。前半はカヴァー中心、後半はオリジナル曲が中心で、ギターやシンセサイザー、ヴァイオリンなど多様な楽器による幽玄な編曲を示した。Cocteau Twinsの意味を持たない歌い方も、言葉より音の響きを優先する態度として影響を残したと言われる。

ドイツでは、1991年にニュルンベルクでHyperium Recordsが設立された。StoaやLove Is Colder Than Deathといったバンドを抱え、この系統を一つの商品の分類として定着させたとされる。同レーベルが1993年から出した「Heavenly Voices」は、女性ヴォーカルを前面に出した編集盤シリーズだ。ネオクラシカル、ネオフォーク、ワールド、トリップホップ、エセリアルなど、幅広いスタイルを集めた。「Heavenly Voices」という語は、1990年代半ばから後半には、ジャンル名としても使われた。

フランスでは、Elendが1994年に「Leçons de Ténèbres」を作った。サンプラーやシンセサイザーによる分厚い管弦楽のような響きの中に、John Miltonの「失楽園」に由来する歌詞の曲を4曲含む作品で、極端な例として知られる。イタリアのAtaraxiaも、この系統に含まれる。

Das IchやLacrimosaは、ドイツ語圏のゴシック／ダークウェイヴ周辺の存在である。Lacrimosaは、1997年の『Stille』で金属的な方向へ進んだ。そして1999年の『Elodia』では、ロンドン交響楽団などを迎え、クラシカルな要素を広げたゴシックメタル作品を作った。

発表の場となったのは、1992年にライプツィヒで始まったWave-Gotik-Treffenだ。劇場や記念碑の地下聖堂（クリプト）なども会場に使われる。

ネオクラシカル・ダークウェイヴは、マーシャル・インダストリアル（1980年代ヨーロッパ発祥）の源流の一つでもある。マーシャル・インダストリアルの一部には、戦争や全体主義、ナショナリズムの図像を使うものがあり、政治的な議論を呼んだ。

映画やテレビの劇伴音楽などにも、似た表現を使う例が見られる。</p>
