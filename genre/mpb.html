<h1>MPB Música Popular Brasileira（ムジカ・ポプラール・ブラジレイラ）とは</h1>
<p>この名前は、ブラジルの大衆音楽を意味する語の略称だ。1960年代半ば以降の、洗練された和声（コードの響き）と文学的な歌詞を持つ歌ものをまとめて呼ぶ名前である。 決まったリズムに縛られない。サンバ、ボサノヴァ、北東部の踊りの音楽、そ</p>
<p>この名前は、ブラジルの大衆音楽を意味する語の略称だ。1960年代半ば以降の、洗練された和声（コードの響き）と文学的な歌詞を持つ歌ものをまとめて呼ぶ名前である。

決まったリズムに縛られない。サンバ、ボサノヴァ、北東部の踊りの音楽、そして時にはロックやジャズまで、自由に行き来する。

編成は、生ギターと歌が中心だ。そこにピアノ、打楽器、弦楽合奏（弦楽器の合奏）、管楽器が加わる。ブラジルの打楽器は、前に出ることも、後ろに下がることもある。役割は曲によって変わる。

共通するのは、音楽としての水準の高さだ。和声の複雑さと、凝った歌詞が特徴とされる。

歌い方は、言葉をはっきり聞き取らせることを大事にするものが多い。ただし、劇的で力強い歌い方も含まれる。

この分野の中心は歌詞であり、詩としての出来が厳しく問われる。恋愛や日常のほか、社会の不正、貧困、権力への批判も歌われる。検閲のもとでは、比喩を使って批判を織り込んだ例が知られ、Chico Buarqueなどがその例だ。この遠回しな語り方は、後で述べる歴史の事情と切り離せない。</p>
<h2>成り立ち</h2><p>1950年代末、ブラジルでボサノヴァが定着した。1962年のカーネギーホール公演などで、この音楽は国際的に知られるようになった。

しかし1964年、軍事クーデターが起こる。その後、若い音楽家たちは、静かで内向きなボサノヴァだけでは時代に応えられないと感じ始めたとされる。

この時期に決定的な役割を果たしたのが、テレビの歌謡祭典である。1965年から1970年代前半にかけて、いくつもの放送局が競ってこの催しを開いた。新曲を競わせ、審査員が決める形が基本で、回によっては観客審査も併用された。祭典は国民的な関心事となった。

1965年の祭典でElis Reginaが歌った曲は、彼女を一躍国民的な歌手にした。この曲は、この分野の始まりとしばしば結び付けられている。彼女は圧倒的な表現力で、数多くの作家の曲を世に出した。しかし1982年、コカインとアルコールの中毒による心停止で、36歳で亡くなった。

作家として最も重要な存在の一人が、Chico Buarqueである。彼は非常に高度な詩の技術を持っていた。検閲（表現の取り締まり）をくぐり抜けるため、恋愛の歌に見せかけて政治への批判を織り込む手法を磨き上げた。それでも、いくつもの曲が発売を禁じられた。彼自身も1969年、身の危険を感じてイタリアへ一時的に移り住んでいる。

1968年の祭典では、Geraldo Vandréが歌った抵抗の曲が観客を熱狂させた。だがその後、この曲は検閲を受け、本人は1969年初めに国外へ去った(チリや欧州を経て1973年に帰国)。拷問を受けたという説も広まったが、本人は否定している。

一方、ミナスジェライス州では、Milton Nascimentoを中心とする一群が独自の作風を固めた。地元の民謡や教会音楽の名残に、ボサノヴァ・ジャズ・ロック・ビートルズなどの影響が混ざる音楽である。

1978年、AI-5が廃止された(1979年に施行)。続いて1985年の民政移管（軍の政権から民間の政権への交代）と1988年憲法を経て、検閲は制度のうえでなくなった。この分野は、より自由に表現できる場となった。

今日では、この分野は幅広いジャンルを含む総称になっている。質の高いブラジル音楽を表す基準として使われることもある。Djavan、Ivan Lins、Maria Bethâniaといった歌手が、数十年にわたって第一線で活動を続けてきた。2022年に亡くなったGal Costaも、長く活躍した。</p>
