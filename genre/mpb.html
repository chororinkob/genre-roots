<h1>MPB Música Popular Brasileira（ムジカ・ポプラール・ブラジレイラ）とは</h1>
<p>ブラジルの大衆音楽を意味する語の略称で、1960年代半ば以降の、洗練された和声と文学的な歌詞を持つ歌ものの総称である。特定のリズムに限定されず、サンバ、ボサノヴァ、北東部の舞踏音楽、ワルツ、そして時にロックやジャズまでを自在に横断</p>
<p>ブラジルの大衆音楽を意味する語の略称で、1960年代半ば以降の、洗練された和声と文学的な歌詞を持つ歌ものの総称である。特定のリズムに限定されず、サンバ、ボサノヴァ、北東部の舞踏音楽、ワルツ、そして時にロックやジャズまでを自在に横断する。共通するのは音楽的な水準の高さで、和声はボサノヴァから受け継いだ複雑さを持ち、四和音や九の和音、そして予期しない転調が日常的に用いられる。旋律は歌いやすさより言葉との適合が優先され、しばしば長く複雑な線を描く。編成は生ギターと歌を核として、そこにピアノ、打楽器、弦楽合奏、管楽器が加えられる。ブラジルの打楽器は前面に出ることも背景に退くこともあり、曲によって役割が変わる。歌唱は張り上げず、言葉の意味を伝えることを最優先に、繊細な息遣いで歌われる。歌詞こそがこの分野の中心で、詩としての完成度が厳しく問われる。恋愛や日常のほか、社会の不正、貧困、権力への批判が扱われるが、直接的な表現を避け、比喩と暗示によって語られることが多い。この迂回した語法は、後述する歴史的な事情と不可分である。</p>
<h2>成り立ち</h2><p>1958年前後にボサノヴァが確立し、ブラジルの大衆音楽は国際的な評価を得た。しかし1964年の軍事クーデター後、若い音楽家たちは、静謐で内向的なボサノヴァだけでは時代に応えられないと感じ始める。この時期に決定的な役割を果たしたのがテレビの歌謡祭典である。1965年から1970年代前半にかけて、複数の放送局が競って開いたこの催しは、新曲を競わせて視聴者と審査員が優劣を決めるもので、国民的な関心事となった。1965年の祭典でElis Reginaが歌った楽曲は、彼女を一躍国民的な歌手にし、この分野の始まりを告げるものとなる。彼女は圧倒的な表現力で数多くの作家の楽曲を世に出したが、1982年に薬物の過剰摂取により36歳で死去した。作家として最も重要な存在がChico Buarqueである。彼は極めて高度な詩の技術を持ち、検閲を潜り抜けるために、恋愛の歌に見せかけて政治的な批判を織り込むという手法を洗練させた。それでも複数の楽曲が発売を禁じられ、彼自身も1969年に身の危険を感じてイタリアへ一時的に移り住んでいる。1968年の祭典でGeraldo Vandréが歌った抵抗の楽曲は観客の熱狂を呼んだが、その後この曲は禁じられ、本人は拷問を受けたうえで国外へ去った。ミナスジェライス州ではMilton Nascimentoを中心とする一群が、教会音楽と土地の風景を思わせる独自の作風を確立している。1980年代の民政移管後、検閲は解かれ、この分野はより自由な表現の場となった。現在ではブラジルの音楽的な良心を意味する言葉として用いられ、Djavan、Ivan Lins、Maria Bethânia、Gal Costaといった歌手が、数十年にわたり第一線で活動を続けている。</p>
<h2>代表曲</h2><ul><li>Construção (Chico Buarque)</li><li>Travessia (Milton Nascimento)</li><li>O Bêbado e a Equilibrista (Elis Regina)</li></ul>
