<h1>Hi-NRG（ハイエナジー）とは</h1>
<p>1970年代末に生まれた、極端に速く硬いディスコ。BPM（1分間の拍数）はおおむね120〜140で、当時のディスコの標準（110〜130程度）を上回る。骨格は徹底した四つ打ちのバスドラムと、裏拍（拍と拍の間）で開くオープンハイハッ</p>
<p>1970年代末に生まれた、極端に速く硬いディスコ。BPM（1分間の拍数）はおおむね120〜140で、当時のディスコの標準（110〜130程度）を上回る。骨格は徹底した四つ打ちのバスドラムと、裏拍（拍と拍の間）で開くオープンハイハット（シンバルを開いて響かせた音）の往復で、この「ドッ・チッ・ドッ・チッ」が一切崩れないまま曲の最初から最後まで続く。最大の識別点はベースで、8分音符または16分音符でオクターブを行き来する「オクターブ・ベースライン」が休みなく走り、シンセベースの機械的な粒立ちが、曲を前へ進める力を生む。使用機材はシーケンサー（自動演奏装置）とシンセサイザーが中心で、起点とされる『I Feel Love』では借り物のモジュラー・Moog（配線で音を作る大型シンセ）が使われ、キックだけが生ドラムだった。Patrick CowleyはProphet-5やE-mu系のモジュラーなどを使ったとされる。生バンドをほぼ排して打ち込みに置き換えた点が同時代のディスコと決定的に違う。旋律は分かりやすい長調で、歌唱は高音域を張り上げるパワフルな女性ボーカルか、ファルセットを多用する男性ボーカルが定番。歌詞は恋の高揚と誘惑を単純明快に歌い、繰り返しの多いフック（耳に残る部分）で覚えやすくしてある。曲構成は延々と続くイントロと長いブレイク（演奏が一瞬止まる部分）を持ち、DJが繋ぐことを前提とした12インチ・シングル向けの設計。ゲイ・クラブの熱狂的なフロアで、汗と照明の中で鳴らされる音として最適化されている。</p>
<h2>成り立ち</h2><p>1970年代末、ディスコが商業的な飽和を迎え、1979年7月にシカゴの球場で、ディスコのレコードが入った箱を爆破する「ディスコ・デモリッション・ナイト」という反ディスコの催しが開かれ、観客がなだれ込んで暴動になるなど逆風が吹く中、ゲイ・コミュニティのクラブでは逆にテンポを上げた硬派な路線が支持を集めた。技術面の起点は1977年、ミュンヘンのプロデューサーGiorgio Moroder がDonna Summer のI Feel Love で、伴奏のほぼ全てをMoog のシンセサイザーによるシーケンスに置き換えたことである。この曲の反復するシンセベースが、ハイエナジーの原型とされる（1979年のBiddu作品やPatrick Hernandezの「Born to Be Alive」も初期の例に挙げられる）。名称は、Donna Summerが『I Feel Love』を「high-energyな雰囲気がある」と語ったことから、「high energy」が高速ディスコの呼び名として広まったとする説が通説で、1980年代に「Hi-NRG」と表記されるようになった。Patrick Cowley（ニューヨーク州バッファロー生まれで、1971年からサンフランシスコに在住）は、1978年に発表されたSylvester のYou Make Me Feel (Mighty Real) を電子的にリミックス（別の人が作り直した版を作ること）するなど、Sylvester（Sylvester James Jr.、ファルセットで歌う黒人のドラァグ・パフォーマー）との協働で、この音を確立した中心人物である。1980年代半ばにはイギリスに渡り、ロンドンのプロデューサー3人組Stock Aitken Waterman が、Dead or Alive のYou Spin Me Round (Like a Record)（1984年）やHazell Dean、Divine の作品でこの様式を量産し、後にKylie Minogue やRick Astley へと繋がるヒット工場を築いた。イタリアではイタロ・ディスコと相互に影響し合い、ヨーロッパ大陸に広く根を張った。悲劇的なのはエイズ危機で、Patrick Cowley は1982年に32歳で、Sylvester は1988年に41歳で、いずれもエイズ関連の合併症で死去している。この音楽の世界の中心にいた多くの音楽家と観客が失われたことは、このジャンルの歴史から切り離せない。ハイエナジーの反復するシンセベースと硬い四つ打ちは、その後シカゴのハウス、デトロイトのテクノ、そして1990年代のユーロダンスへ直接受け継がれた。</p>
<h2>代表曲</h2><ul><li>You Spin Me Round (Dead or Alive)</li><li>Your Love (Lime)</li><li>You Make Me Feel (Mighty Real) (Sylvester)</li><li>I Feel Love (Donna Summer)</li><li>Do You Wanna Funk (Sylvester &amp; Patrick Cowley)</li><li>Menergy (Patrick Cowley)</li><li>You Think You're a Man (Divine)</li><li>Love Reaction (Divine)</li><li>I'm So Hot for You (Bobby O)</li><li>High Energy (Evelyn Thomas)</li><li>Searchin' (I Gotta Find a Man) (Hazell Dean)</li><li>So Many Men, So Little Time (Miquel Brown)</li></ul>
