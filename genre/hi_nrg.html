<h1>Hi-NRG（ハイエナジー）とは</h1>
<p>1970年代末に生まれた、極端に速く硬いディスコ。BPMは128〜140、時に150に達し、当時のディスコの標準（110〜125）を大きく上回る。骨格は徹底した四つ打ちのバスドラムと、裏拍で開くオープンハイハットの往復で、この「ド</p>
<p>1970年代末に生まれた、極端に速く硬いディスコ。BPMは128〜140、時に150に達し、当時のディスコの標準（110〜125）を大きく上回る。骨格は徹底した四つ打ちのバスドラムと、裏拍で開くオープンハイハットの往復で、この「ドッ・チッ・ドッ・チッ」が一切崩れないまま曲の最初から最後まで続く。最大の識別点はベースで、8分音符または16分音符でオクターブを行き来する「オクターブ・ベースライン」が休みなく走り、シンセベースの機械的な粒立ちが推進力を生む。使用機材はRoland のTR-808やTB-303を含む初期のリズムマシンとシーケンサー、Moog やOberheim の鍵盤シンセで、生バンドをほぼ排して打ち込みに置き換えた点が同時代のディスコと決定的に違う。旋律は分かりやすい長調で、歌唱は高音域を張り上げるパワフルな女性ボーカルか、ファルセットを多用する男性ボーカルが定番。歌詞は恋の高揚と誘惑を単純明快に歌い、繰り返しの多いフックで覚えやすくしてある。曲構成は延々と続くイントロと長いブレイクを持ち、DJが繋ぐことを前提とした12インチ・シングル向けの設計。ゲイ・クラブの熱狂的なフロアで、汗と照明の中で鳴らされる音として最適化されている。</p>
<h2>成り立ち</h2><p>1970年代末、ディスコが商業的な飽和を迎え、1979年にシカゴで「ディスコ・デモリッション・ナイト」という反ディスコの焼き討ち騒動が起きるなど逆風が吹く中、ゲイ・コミュニティのクラブでは逆にテンポを上げた硬派な路線が支持を集めた。技術面の起点は1977年、ミュンヘンのプロデューサーGiorgio Moroder がDonna Summer のI Feel Love で、伴奏のほぼ全てをMoog のシンセサイザーによるシーケンスに置き換えたことである。この曲の反復するシンセベースが、ハイエナジーの原型そのものとなった。名称はニューヨークのプロデューサーPatrick Cowley が手がけ、1978年に発表されたSylvester のYou Make Me Feel (Mighty Real) およびそのアルバム収録曲の勢いを受けて、1979年のシングルの副題やレコード店の分類から広まったとされる。Cowley はサンフランシスコを拠点に、Sylvester（James Lee Hester、ファルセットで歌う黒人のドラァグ・パフォーマー）との協働で、この音を確立した中心人物である。1980年代前半にはイギリスに渡り、ロンドンのプロデューサー三人組Stock Aitken Waterman が、Dead or Alive のYou Spin Me Round (Like a Record)（1984年）やHazell Dean、Divine の作品でこの様式を量産し、後にKylie Minogue やRick Astley へと繋がるヒット工場を築いた。イタリアではイタロ・ディスコと相互に影響し合い、ヨーロッパ大陸に広く根を張った。悲劇的なのはエイズ危機で、Patrick Cowley は1982年に32歳で、Sylvester は1988年に41歳で、いずれもエイズ関連の合併症で死去している。シーンの中心にいた多くの音楽家と観客が失われたことは、このジャンルの歴史から切り離せない。ハイエナジーの反復するシンセベースと硬い四つ打ちは、その後シカゴのハウス、デトロイトのテクノ、そして1990年代のユーロダンスへ直接受け継がれた。</p>
<h2>代表曲</h2><ul><li>You Make Me Feel (Mighty Real) (Sylvester)</li><li>Do You Wanna Funk (Sylvester &amp; Patrick Cowley)</li><li>I Feel Love (Donna Summer)</li><li>Love Reaction (Divine)</li><li>I'm So Hot for You (Bobby O)</li></ul>
