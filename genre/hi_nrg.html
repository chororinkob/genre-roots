<h1>Hi-NRG（ハイエナジー）とは</h1>
<p>ハイエナジーは、1970年代末に生まれた、速く硬いディスコだ。 BPM（1分間の拍数）はおおむね120〜140である。当時のディスコの標準（110〜130程度）より速い傾向がある。 骨格は、4つ打ちのキックに、スタッカートなハイハ</p>
<p>ハイエナジーは、1970年代末に生まれた、速く硬いディスコだ。

BPM（1分間の拍数）はおおむね120〜140である。当時のディスコの標準（110〜130程度）より速い傾向がある。

骨格は、4つ打ちのキックに、スタッカートなハイハットや拍を刻むオクターブ・ベースが乗る形だ。最大の識別点はベースにある。8分音符または16分音符でオクターブを行き来する「オクターブ・ベースライン」が休みなく走る。シンセベースの機械的な粒立ちが、曲を前へ進める力を生む。

使用機材は、シーケンサー（自動演奏装置）とシンセサイザーが中心だ。このジャンルの起点とされる『I Feel Love』では、借り物のモジュラー・Moog（配線で音を作る大型シンセ）が使われ、キックだけが生ドラムだった。Patrick CowleyはE-mu系のモジュラーを使いこなしたとされる。シンセとシーケンサーへの依存度が高い曲が多い。

旋律は分かりやすいものが多い。長調が定番とは言えず、『You Spin Me Round (Like a Record)』はヘ短調である。歌唱は、力強いものが多い。歌詞は恋の高揚と誘惑を単純明快に歌い、繰り返しの多いフック（耳に残る部分）で覚えやすくしてある。

曲構成は、延々と続くイントロと長いブレイク（演奏が一瞬止まる部分）を持つ。DJが繋ぐことを前提とした、12インチ・シングル向けの設計である。ゲイ・クラブの熱狂的なフロアで、汗と照明の中で鳴らされる音として最適化されている。</p>
<h2>成り立ち</h2><p>1970年代末、ディスコは商業的な飽和を迎えた。1979年7月には、シカゴの球場で「ディスコ・デモリッション・ナイト」という反ディスコの催しが開かれた。ディスコのレコードが入った箱を爆破する催しで、観客がなだれ込んで暴動になった。

同じ時期に、ゲイ・コミュニティのクラブではテンポを上げた硬派な路線が支持を集めた。

1977年、ミュンヘンのプロデューサーGiorgio Moroder がDonna Summer のI Feel Love で、伴奏のほぼ全てをMoog のシンセサイザーによるシーケンスに置き換えた。しばしば最初のHi-NRG曲とされる。この曲の反復するシンセベースが、ハイエナジーの原型とされる（Biddu作品の『Voodoo Man』（1979年、130BPM）や、1978年（フランス発売）のPatrick Hernandezの「Born to Be Alive」も初期の例に挙げられる）。

名称は、Donna Summerが『I Feel Love』を「high-energyな雰囲気がある」と語ったことから、「high energy」が高速ディスコの呼び名として広まったとする説がある。Evelyn Thomasの『High Energy』（1984年4月）で名称が定着したともされる。1980年代に「Hi-NRG」と表記されるようになった。

Patrick Cowley（ニューヨーク州バッファロー生まれで、1971年からサンフランシスコに在住）は、1978年に発表されたSylvester のYou Make Me Feel (Mighty Real) を電子的にリミックス（別の人が作り直した版を作ること）した。Sylvester（Sylvester James Jr.、ファルセットと中性的な装いで知られる米国の歌手）との協働で、この音の定着に寄与した主要人物の一人である。

1980年代半ばには、このスタイルが英国に広がった。ロンドンのプロデューサー3人組Stock Aitken Waterman が、Dead or Alive のYou Spin Me Round (Like a Record)（1984年）やHazell Dean、Divine の作品で、このスタイルを量産した。後にKylie Minogue やRick Astley へと繋がるヒット工場を築いた。イタリアでは、イタロ・ディスコの形成に影響を与え、ヨーロッパ大陸に広く根を張った。

悲劇的なのは、エイズ危機である。Patrick Cowley は1982年に32歳で、Sylvester は1988年に41歳で、いずれもエイズ関連の合併症で死去している。この音楽の世界の中心にいた多くの音楽家と観客が失われたことは、このジャンルの歴史から切り離せない。

ハイエナジーの反復するシンセベースと硬い四つ打ちは、その後、ハウスやテクノなどに影響を与えたとされる。</p>
<h2>代表曲</h2><ul><li>You Spin Me Round (Dead or Alive)</li><li>Your Love (Lime)</li><li>You Make Me Feel (Mighty Real) (Sylvester)</li><li>I Feel Love (Donna Summer)</li><li>Do You Wanna Funk (Sylvester &amp; Patrick Cowley)</li><li>Menergy (Patrick Cowley)</li><li>You Think You're a Man (Divine)</li><li>Love Reaction (Divine)</li><li>I'm So Hot for You (Bobby O)</li><li>High Energy (Evelyn Thomas)</li><li>Searchin' (I Gotta Find a Man) (Hazell Dean)</li><li>So Many Men, So Little Time (Miquel Brown)</li></ul>
