<h1>Instrumental Rock（インストゥルメンタル・ロック）とは</h1>
<p>歌を持たず、楽器の演奏だけで構成されるロックである。歌詞による情報が一切ないため、旋律そのものが記憶に残る強度を持たねばならず、その結果、極めて簡潔で口ずさめる音型が書かれる。中心となる楽器はエレクトリックギターで、その音色の設計</p>
<p>歌を持たず、楽器の演奏だけで構成されるロックである。歌詞による情報が一切ないため、旋律そのものが記憶に残る強度を持たねばならず、その結果、極めて簡潔で口ずさめる音型が書かれる。中心となる楽器はエレクトリックギターで、その音色の設計が作品の性格を決める。金属のばねによる残響装置を深くかけて音を伸ばす手法、音量や音程を周期的に揺らす効果、そして低音弦を用いて太く唸らせる奏法が、この分野の主要な語彙である。奏法としては、撥を高速で往復させて一音を刻み続ける技法が多用され、これは中東や東欧の弦楽器の奏法に由来する。編成はギター二本、ベース、ドラムが基本で、そこに電気オルガンやサックスが加わることもある。リズムは四拍子で、二拍目と四拍目を強く打つ素直な刻みか、跳ねた三連の刻みが用いられる。テンポは中庸から速い。和声は単純な三和音の循環が中心だが、短調や、中東的な音階を用いることで異国的な色が加えられる。曲は2分から3分と短く、主題の提示と反復、そして中間部という明快な構造を持つ。踊るための実用と、演奏技術の提示を兼ねている。</p>
<h2>成り立ち</h2><p>1950年代後半、エレクトリックギターの表現力が急速に拡張された時期に、この分野は成立した。象徴的な作品が1958年、Link Wrayが発表した楽曲である。彼はアンプのスピーカーに鉛筆で穴を開けて意図的に音を割れさせるという手法を用い、それまで存在しなかった歪んだ音を作り出した。この曲には歌詞が一切ないにもかかわらず、不良の抗争を煽るという理由で複数のラジオ局が放送を拒否した。歌のない器楽曲が検閲されたという極めて稀な事例である。同時期にDuane Eddyが、低音弦を用いた太く唸る旋律で人気を得た。1960年前後には二つの重要な集団が現れる。イギリスのThe Shadowsは、深い残響をかけた澄んだギターの音色を確立し、1960年に発表した楽曲は後年ヒップホップにおいて最も多く用いられる素材のひとつとなった。アメリカ・ワシントン州のThe Venturesは、簡潔な旋律と正確な演奏によって世界的な人気を得たが、とりわけ日本での影響は絶大だった。1960年代半ば、彼らの来日を契機に、若者がこぞってエレクトリックギターを手にする現象が起き、これは後の日本のロックの直接の出発点となる。カリフォルニアではDick Daleが、中東系の家系の出身であることを反映した音階と、極端に速い撥の往復によってサーフ・ロックを確立した。1962年にはメンフィスのBooker T. &amp; the M.G.'sが、人種混成の編成による簡潔な楽曲で成功を収めている。1960年代半ば以降、歌のあるロックが主流となってこの分野は縮小するが、演奏技術を主題とする音楽として途切れることなく続き、後のプログレッシブ・ロックやポストロック、マスロックの土台となった。</p>
<h2>代表曲</h2><ul><li>Rumble (Link Wray)</li><li>Surfing with the Alien (Joe Satriani)</li><li>Mogwai Fear Satan (Mogwai)</li></ul>
