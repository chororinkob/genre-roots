<h1>Instrumental Rock（インストゥルメンタル・ロック）とは</h1>
<p>インストゥルメンタル・ロックは、歌を持たず、楽器の演奏だけで組み立てるロックである。 歌詞で伝える情報が一切ない。そのため、旋律そのものが記憶に残る強さを持たなければならない。その結果、とても簡潔で、口ずさめる音の形が書かれる。 </p>
<p>インストゥルメンタル・ロックは、歌を持たず、楽器の演奏だけで組み立てるロックである。

歌詞で伝える情報が一切ない。そのため、旋律そのものが記憶に残る強さを持たなければならない。その結果、とても簡潔で、口ずさめる音の形が書かれる。

中心の楽器はエレクトリックギターだ。その音色をどう作るかが、作品の性格を決める。リバーブやエコー（スプリング、エコー室、テープ式など）を深くかけて音を伸ばす手法、音量や音程を周期的に揺らす効果、そして低音弦で太く唸らせる奏法が、この分野の主な「言葉」になっている。

奏法では、ピック（弦をはじく小さな板）を速く往復させて、一つの音を刻み続ける技がよく使われる。サーフ・ミュージックの先駆者Dick Daleの場合、この技はアラブ音楽(レバノン系の叔父から学んだ音楽や、太鼓の奏法)の影響とされる。

編成はギター2本、ベース、ドラムが基本だ。そこに電気オルガンやサックスが加わることもある。

リズムは4拍子だ。多くの曲で、2拍目と4拍目を強く打つ素直な刻みか、跳ねた三連（1拍を三つに分けたリズム）の刻みが使われる。テンポは中くらいから速め。

和声（コードの響き）は、単純な三和音を繰り返し回すのが中心だ。ただし、短調や中東風の音階を使って、異国の色を加えることもある。

多くの曲は2分から3分と短い。主題（中心となる旋律）を示し、それを繰り返し、そして中間部へ進む、という分かりやすい組み立てを持つ。踊るための実用と、演奏の腕前を見せることを兼ねている。</p>
<h2>成り立ち</h2><p>インストゥルメンタル・ロックは、おおむね1950年代半ばに始まった。エレクトリックギターで表現できることが、急速に広がった時期に発展した音楽である。

代表的な作品が、1958年にLink Wrayが発表した曲だ。彼はスタジオ録音でライブの歪みを再現するため、アンプの高音用スピーカーに鉛筆で穴を開けるという手法を用いた。こうして、ロックで歪みとトレモロを使った最初期の例の一つとなる音を作り出した。この曲には歌詞が一切ない。それなのに、不良の抗争をあおるという理由で、複数のラジオ局が放送を見送った。

同じ時期、Duane Eddyが、低音弦を使った太く唸る旋律で人気を得た。

1960年前後には、二つの重要なグループが現れる。イギリスのThe Shadowsは、テープ・エコー（ディレイ）とアームを使った音色を作り上げた。1960年に発表した「Apache」は英国で成功した。そして1973年のIncredible Bongo Bandによるカバーが、後年ヒップホップで繰り返し使われた。

一方、アメリカ・ワシントン州のThe Venturesは、簡潔な旋律と正確な演奏で世界的な人気を得た。とりわけ日本での影響は非常に大きかった。1960年代半ば、彼らの来日はきっかけの一つとなり、若者がこぞってエレクトリックギターを手にする現象が起きた。これが日本のエレキ・ブームを起こし、後の日本のロックに大きな影響を与える。

カリフォルニアでは、Dick Daleが、アラブ音楽の影響を受けた音階と、極端に速いピックの往復によって、サーフ・ミュージックの代表的な先駆者となった。1962年には、メンフィスのBooker T. &amp; the M.G.'sが、人種混成の編成による簡潔な曲で成功を収めている。

しかし1960年代半ば以降、歌のあるロックが主流となり、この分野は縮小する。それでも、演奏技術を主題とする音楽として続いた。歌なしの編成という点では、後のマスロックなど、歌を持たないバンドの多い分野とも共通する流れがある。</p>
