<h1>Progressive Techno（プログレッシブテクノ）とは</h1>
<p>テクノとハウスの反復する構造に、長い時間をかけて情景が移り変わっていく物語を語るような作りを持ち込んだダンス音楽である。テンポは概ね120から135 BPM、キックは四つ打ちを保つ。いちばんの特徴は時間の使い方にある。曲は長く、そ</p>
<p>テクノとハウスの反復する構造に、長い時間をかけて情景が移り変わっていく物語を語るような作りを持ち込んだダンス音楽である。テンポは概ね120から135 BPM、キックは四つ打ちを保つ。いちばんの特徴は時間の使い方にある。曲は長く、その間、要素が一つずつ、とてもゆっくり入ってきて、また取り除かれる。聴き手が変化に気づかないほどの速さで音が入れ替わっていくため、数分前と今とで全く別の場所にいるという感覚が生まれる。この、旅のような作りこそがこの分野の本質である。素材としては、和音を一音ずつ順に鳴らす分散和音の音型が層をなして重ねられ、それぞれが異なる周期で循環することで、複雑な織物のような音ができあがる。低音はダブの影響を受けて深く沈み、残響と遅延を伴う。中盤にはしばしばリズムを完全に落とす区間が置かれ、そこで和音の敷物と音響効果だけが漂う。この静寂の後、リズムが戻る瞬間が最大の聴かせどころとなる。旋律は明示的に提示されず、複数の音型の重なりから浮かび上がる形が好まれる。歌が用いられることもあるが、多くはない。高揚の頂点を短時間で作るのではなく、ずっと続く没入感を目指す点が、他のダンス音楽との違いである。</p>
<h2>成り立ち</h2><p>1990年代前半のイギリスでは、レイヴ文化が行き詰まりに近い状態に達していた。ハードコアは速度を上げすぎ、ハウスは商業化し、聴き手は単純な高揚に飽き始めていた。この状況で、より長い時間をかけて聴かせる音楽への需要が生まれる。「プログレッシブ・ハウス」という呼称は、1992年にイギリスのクラブ音楽誌Mixmagの記者Dom Phillipsが用いたとされる。1990年のLeftfieldの「Not Forgotten」を最初のプログレッシブ・ハウス作品とする説もある。プログレッシブ・ロック由来の要素(長尺や、つなぎ合わせた構成)を持つとされる。中心となったのはDJであり、Sashaと John Digweedの2人は、複数の楽曲を長時間かけて繋ぎ、一晩を通した物語を作るという方式を確立した。彼らが発表した長編の混合録音は、この分野のお手本として使われている。制作者の側では、Leftfieldがダブとレゲエの低音をこの構造に持ち込み、Underworldは1994年の作品で、断片的な言葉の反復と長大な展開を組み合わせて、この分野の芸術的な到達点を示した。彼らが1995年にB面として発表した「Born Slippy .NUXX」は、1996年のイギリス映画『Trainspotting』に用いられて世界的に知られるようになり、同年にシングルとして再発された。Orbitalの兄弟は、生の演奏に近い形で機材を操作する公演によって、電子音楽のライブに即興性を持ち込んだ。この分野には批判もある。すなわち、長すぎて退屈であり、変化が乏しく、薬物の作用に依存しているという指摘である。実際、2000年前後には流行が一巡し、より短く直接的な音へ主流が移った。しかしアルゼンチンのHernán Cattáneoは復興の牽引役と評され、また長い時間をかけて没入させるという設計思想は、現在のメロディック・テクノにも直接受け継がれている。</p>
