<h1>Progressive Techno（プログレッシブテクノ）とは</h1>
<p>テクノとハウスの反復する構造に、長い時間をかけて情景が移り変わっていく叙事的な設計を持ち込んだダンス音楽である。テンポは概ね125から135 BPM、キックは四つ打ちを保つ。決定的な特徴は時間の使い方にある。曲は8分から12分、時</p>
<p>テクノとハウスの反復する構造に、長い時間をかけて情景が移り変わっていく叙事的な設計を持ち込んだダンス音楽である。テンポは概ね125から135 BPM、キックは四つ打ちを保つ。決定的な特徴は時間の使い方にある。曲は8分から12分、時にそれ以上に及び、その間、要素が一つずつ極めて緩やかに導入され、また取り除かれる。聴き手が変化に気づかないほどの速さで音が入れ替わっていくため、数分前と今とで全く別の場所にいるという感覚が生まれる。この、旅のような設計こそがこの分野の本質である。素材としては、和音を一音ずつ順に鳴らす分散和音の音型が層をなして重ねられ、それぞれが異なる周期で循環することで、複雑な織物が作られる。低音はダブの影響を受けて深く沈み、残響と遅延を伴う。中盤には必ずリズムを完全に落とす区間が置かれ、そこで和音の敷物と音響効果だけが漂う。この静寂の後、リズムが戻る瞬間が最大の聴かせどころとなる。旋律は明示的に提示されず、複数の音型の重なりから浮かび上がる形が好まれる。歌はほとんど用いられない。高揚の頂点を短時間で作るのではなく、持続的な没入を目指す点が、他のダンス音楽との違いである。</p>
<h2>成り立ち</h2><p>1990年代前半のイギリスでは、レイヴ文化が飽和状態に達していた。ハードコアは速度を上げすぎ、ハウスは商業化し、聴き手は単純な高揚に飽き始めていた。この状況で、より長い時間をかけて聴かせる音楽への需要が生まれる。呼称そのものは1992年頃、イギリスのクラブ音楽誌の記者が、この新しい傾向を説明するために用いたとされる。プログレッシブという語は、1970年代の同名のロックの潮流を意識したもので、実際に長大な構成と物語性という点で共通している。中心となったのはDJであり、Sashaと John Digweedの二人は、複数の楽曲を長時間かけて繋ぎ、一晩を通した物語を作るという方式を確立した。彼らが発表した長編の混合録音は、この分野の教科書として機能している。制作者の側では、Leftfieldがダブとレゲエの低音をこの構造に持ち込み、Underworldは1994年の作品で、断片的な言葉の反復と長大な展開を組み合わせて、この分野の芸術的な到達点を示した。彼らが1996年に発表した楽曲は、イギリスの映画に用いられたことで世界的に知られるようになる。Orbitalの兄弟は、生の演奏に近い形で機材を操作する公演によって、電子音楽の演奏の在り方そのものを変えた。この分野には批判もある。すなわち、長すぎて退屈であり、変化が乏しく、薬物の作用に依存しているという指摘である。実際、2000年前後には流行が一巡し、より短く直接的な音へ主流が移った。しかし2010年代以降、アルゼンチンのHernán Cattáneoをはじめとする作り手によって復興し、また長い時間をかけて没入させるという設計思想は、現在のメロディック・テクノにも直接受け継がれている。</p>
