<h1>Progressive Techno（プログレッシブテクノ）とは</h1>
<p>テクノやハウスの反復する構造に、長い時間をかけて情景が移り変わる、物語を語るような作りを持ち込んだダンス音楽である。 成立期には、打楽器を何層にも重ね、その上で単純なリフを何度も繰り返す作りが特徴とされた。音を詰め込まず簡素に保ち</p>
<p>テクノやハウスの反復する構造に、長い時間をかけて情景が移り変わる、物語を語るような作りを持ち込んだダンス音楽である。

成立期には、打楽器を何層にも重ね、その上で単純なリフを何度も繰り返す作りが特徴とされた。音を詰め込まず簡素に保ち、余白を最も大切な要素とした。低音はダブの影響を受けて深く沈み、残響と遅延を伴う。

旋律も、成立期にはごく単純なものが欠かせないとされた。

テンポは毎分120から135拍ほどとされるが、見方によって幅がある。キックは四つ打ちを保つ。

歌入りの曲は、多くはないとされる。

最大の特徴は、時間の使い方にある。曲は長く、その間、要素が一つずつ、極めてゆっくり加わっては、また取り除かれる。音は、聴き手が変化に気づかないほどの速さで入れ替わる。そのため、数分前と今とで、全く別の場所にいるような感覚が生まれる。この旅のような作りが、この分野の本質だと評されることがある。

中盤に、リズムを完全に落とす区間が置かれることもある。その区間では、和音の敷物と音響効果だけが漂う。この静寂の後、リズムが戻る瞬間が最大の聴かせどころだ。

高揚の頂点を短時間で作るのではなく、持続する没入感を目指す点が、他のダンス音楽との違いだと評されることがある。</p>
<h2>成り立ち</h2><p>プログレッシブ・テクノという名は、プログレッシブ・ハウスの歴史を、テクノ寄りの語で呼ぶ場合に使われる。1990年代前半のイギリスでは、レイヴ文化が行き詰まりに近い状態にあった。レイヴの「俗悪な派手さ」と、アメリカ系ガラージの「重苦しい退屈さ」への反動が生まれていた。こうした中で、より長い時間をかけて聴かせる音楽が求められるようになる。

「プログレッシブ・ハウス」という呼び名は、1992年6月号のイギリスのクラブ音楽誌Mixmagに載った、Dom Phillipsの記事で使われたとされる。1990年のLeftfieldの「Not Forgotten」を、最初のプログレッシブ・ハウス作品とする説もある。長尺の曲や、つなぎ合わせた構成など、プログレッシブ・ロック由来の要素を持つとされる。

中心にいたのはDJだった。SashaとJohn Digweedの2人は、プログレッシブ・ハウスのサウンドの定着と、ミックスCDの普及に貢献した。彼らの長編の混合録音のうち、1996年の『Northern Exposure』は、プログレッシブ・ハウスの音を定着させ、ミックスCDという形が根づいたことをよく表す作品と評された。

作り手の側では、Leftfieldがダブとレゲエの低音をこの構造に持ち込んだ。Underworldは1994年の『Dubnobasswithmyheadman』で、断片的な言葉と長大な展開を組み合わせ、評価の高い作品を残した。彼らが1995年にB面として発表した「Born Slippy .NUXX」は、1996年のイギリス映画『Trainspotting』に使われて、世界的に知られるようになった。同じ年には、シングルとして再発されている。Orbitalの兄弟は、生の演奏に近い形で機材を操作する公演によって、電子音楽のライブに即興性を持ち込んだ。

一方で、この分野には批判もある。退屈で、もったいぶっているという指摘だ。実際、2000年代初頭には批判が起きた。

アルゼンチンのHernán Cattáneoは、プログレッシブ・ハウスを代表するDJの一人とされる。また、現在のメロディック・テクノは、プログレッシブ・ハウスなどの影響を受けている。</p>
<h2>代表曲</h2><ul><li>The Man with the Red Face (Laurent Garnier)</li><li>Lamur (Guy J)</li><li>Heaven Scent (Bedrock)</li><li>Crispy Bacon (Laurent Garnier)</li><li>Minus Orange (Plastikman)</li><li>RibCage (Dubfire)</li><li>Roadkill (Dubfire)</li><li>Tristesse (Kollektiv Turmstrasse)</li><li>Moments of Clarity (Eelke Kleijn)</li><li>Incident (Joris Voorn)</li><li>Esperanza (Guy J)</li><li>Sea of Sand (Guy Gerber &amp; Shlomi Aber)</li></ul>
