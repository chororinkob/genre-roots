<h1>Lounge（ラウンジ）とは</h1>
<p>ホテルのロビーやカクテルバーで、会話の邪魔をせず、かといって無音でもない、ちょうどよい距離感で流れ続けることを最優先に設計された音楽。ジャズのコード感、ボサノバの涼しげなリズム、イージーリスニング(誰の耳にも心地よく響くよう作られ</p>
<p>ホテルのロビーやカクテルバーで、会話の邪魔をせず、かといって無音でもない、ちょうどよい距離感で流れ続けることを最優先に設計された音楽。ジャズのコード感、ボサノバの涼しげなリズム、イージーリスニング(誰の耳にも心地よく響くよう作られたポピュラー音楽)の親しみやすさを軽やかにブレンドし、ストリングス、ビブラフォン(金属の音板を持つ鍵盤打楽器)、フルート、ソフトなタッチのピアノといった、角の立たない丸い音色の楽器を好んで使う。1950年代当時最新のステレオ録音技術を意識的に見せびらかすような、左右のスピーカーの間を音が飛び交う演出的なミックスもこのジャンルの特徴の一つである。歌詞のあるボーカル曲よりインストゥルメンタル(歌のない演奏曲)が中心で、テンポはゆったりから中速。「おしゃれな空間のBGM」としての機能性を、芸術的な野心よりも優先する、いわば聴かれることより「そこにあること」を目的とした音楽である。</p>
<h2>成り立ち</h2><p>1950年代から60年代前半のアメリカで、戦後の郊外化と消費文化を背景に成立した。第二次世界大戦後、アメリカの中間層は郊外の一戸建てへ移り住み、ステレオ再生装置とカクテルを備えた居間で客をもてなすという生活様式が広まった。1958年にステレオLPが商業化されると、レコード会社は左右のスピーカーの間を音が行き来する効果そのものを売り物にした音源を次々と制作し、これが「スペース・エイジ・ポップ」あるいは「エキゾチカ」と呼ばれる一群を生んだ。ハワイのホテルで演奏していたMartin Dennyは『Exotica』(1957)で鳥の鳴き声や獣の咆哮を楽団員に口真似させ、シングル「Quiet Village」が全米2位まで上昇した。同じくハワイを拠点としたArthur Lymanはヴィブラフォンでこの路線を継ぎ、Les Baxterは『Ritual of the Savage』(1952)で架空の未開世界を管弦楽で描いた。技術面ではEnoch Lightが主宰したレーベルCommand Recordsが極端な左右の定位を売りにし、メキシコのJuan García Esquivelは楽団を2つに分けて別々の場所に配置する実験を行った。Henry ManciniやBurt Bacharachは、この語法を映画音楽とポップスの側から洗練させた。しかし1960年代後半にロックが若者文化の中心になると、この音楽は親世代の趣味として一気に軽蔑の対象となり、20年以上忘れられた。再評価は1990年代、中古レコード店の投げ売り箱からこれらの盤を発掘した若い聴き手によって起き、Capitol Recordsの再発シリーズ『Ultra-Lounge』(1996〜)が火を付けた。アメリカのCombustible Edison、イギリスのStereolab、日本の渋谷系とピチカート・ファイヴが同時多発的にこの美学を引用し、「ラウンジ・リヴァイヴァル」と呼ばれる現象になった。ただし、エキゾチカが描く「南洋」が実在の文化ではなく白人の空想の産物である点は、当時から現在まで批判の対象であり続けている。</p>
<h2>代表曲</h2><ul><li>Exotica (Martin Denny)</li><li>Space Age Bachelor Pad Music (Esquivel!)</li><li>Café del Mar, Vol. 1 (José Padilla)</li></ul>
