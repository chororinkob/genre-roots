<h1>Lounge（ラウンジ）とは</h1>
<p>ホテルのロビーやカクテルバーで、会話の邪魔をせず、かといって無音でもない、ちょうどよい距離感で流れ続けることを最優先に設計された音楽。ジャズの和音の響き、ボサノバの涼しげなリズム、イージーリスニング(誰の耳にも心地よく響くよう作ら</p>
<p>ホテルのロビーやカクテルバーで、会話の邪魔をせず、かといって無音でもない、ちょうどよい距離感で流れ続けることを最優先に設計された音楽。ジャズの和音の響き、ボサノバの涼しげなリズム、イージーリスニング(誰の耳にも心地よく響くよう作られたポピュラー音楽)の親しみやすさを軽やかに混ぜ合わせ、ストリングス（弦楽器の合奏）、ビブラフォン(金属の音板を持つ鍵盤打楽器)、フルート、ソフトなタッチのピアノといった、角の立たない丸い音色の楽器を好んで使う。1950年代当時最新のステレオ録音技術を意識的に見せびらかすような、左右のスピーカーの間を音が飛び交う演出的な音の配置（ミックス）もこのジャンルの特徴の一つである。歌詞のあるボーカル曲よりインストゥルメンタル(歌のない演奏曲)が中心で、テンポはゆったりから中速。「おしゃれな空間のBGM」としての機能性を、芸術的な野心よりも優先する、いわば聴かれることより「そこにあること」を目的とした音楽である。</p>
<h2>成り立ち</h2><p>1950年代から60年代前半のアメリカで、戦後の郊外化と消費文化を背景に成立した。第二次世界大戦後、アメリカの中間層は郊外の一戸建てへ移り住み、ステレオ再生装置とカクテルを備えた居間で客をもてなすという生活様式が広まった。1958年にステレオLPが商業化されると、レコード会社は左右のスピーカーの間を音が行き来する効果そのものを売り物にした音源を次々と制作し、これが「スペース・エイジ・ポップ」と呼ばれる一群を生んだ。「エキゾチカ」はそれより前、1951年のLes Baxter『Ritual of the Savage』などから始まっており、ステレオは後年の発展に影響した。ハワイのホテルで演奏していたMartin Dennyは『Exotica』(1957)で鳥の鳴き声や獣の咆哮を楽団員に口真似させ、「Quiet Village」が全米Billboard Hot 100で最高4位（2位とする資料もある）まで上昇した。同じくハワイを拠点としたArthur Lymanはヴィブラフォンでこの路線を継ぎ、Les Baxterは『Ritual of the Savage』(1951)で架空の未開世界を管弦楽で描いた。技術面ではEnoch Lightが主宰したレーベルCommand Recordsが極端な左右の音の位置（定位）を売りにし、メキシコのJuan García Esquivelは楽団を2つに分けて別々の場所に配置する実験を行った。Henry ManciniやBurt Bacharachは、この手法を映画音楽とポップスの側から磨き上げた。しかし1960年代後半にロックが若者文化の中心になると、この音楽は親世代の趣味として一気に軽蔑の対象となり、一般的な人気を失った。再評価は1980年代末に若い聴き手の間で始まり、1990年代にかけて、中古レコード店の投げ売り箱からこれらの盤を発掘した聴き手によって広がり、Capitol Recordsの再発シリーズ『Ultra-Lounge』(1996〜)がそのブームを拡大・定着させた。アメリカのCombustible Edison、イギリスのStereolab、日本の渋谷系とピチカート・ファイヴが同時多発的にこの雰囲気を取り入れ、「ラウンジ・リヴァイヴァル（復活）」と呼ばれる現象になった。ただし、エキゾチカが描く「南洋」が実在の文化ではなく白人の空想の産物である点は、批判の対象となってきた。</p>
