<h1>Lounge（ラウンジ）とは</h1>
<p>ラウンジは、ホテルのロビーやカクテルバーで、会話の邪魔をせず、かといって無音でもない、ちょうどよい距離感で流れ続けることを最優先に設計された音楽だ。「おしゃれな空間のBGM」としての機能性を、芸術的な野心よりも優先する。いわば、聴</p>
<p>ラウンジは、ホテルのロビーやカクテルバーで、会話の邪魔をせず、かといって無音でもない、ちょうどよい距離感で流れ続けることを最優先に設計された音楽だ。「おしゃれな空間のBGM」としての機能性を、芸術的な野心よりも優先する。いわば、聴かれることより「そこにあること」を目的とした音楽である。

使う楽器は、ストリングス（弦楽器の合奏）、ビブラフォン(金属の音板を持つ鍵盤打楽器)、フルート、ソフトなタッチのピアノなどだ。どれも角の立たない、丸い音色の楽器である。

ジャズの和音の響きと、ボサノバの涼しげなリズムに、イージーリスニング(誰の耳にも心地よく響くよう作られたポピュラー音楽)の親しみやすさを、軽やかに混ぜ合わせる。テンポはゆったりから中速だ。

歌のないインストゥルメンタル(歌のない演奏曲)が多い。一方で、Louis Prima &amp; Keely Smithらヴォーカル中心のラウンジも含まれる。

曲の音の配置にも特徴がある。1950年代当時最新のステレオ録音技術を意識的に見せびらかすような、左右のスピーカーの間を音が飛び交う演出的な音の配置（ミックス）だ。ただしこれは、ラウンジのうち、スペース・エイジ・ポップ系の作品の特徴である。</p>
<h2>成り立ち</h2><p>1950年代から60年代前半のアメリカで、戦後の郊外化と消費文化を背景に、ラウンジは成立した。

第二次世界大戦後、アメリカの中間層は郊外の一戸建てへ移り住んだ。ステレオ再生装置とカクテルを備えた居間で客をもてなすという暮らし方が、広まっていった。1957〜58年に量産ステレオ盤が登場し、1958年に一般販売が本格化すると、レコード会社は、左右のスピーカーの間を音が行き来する効果そのものを売り物にした音源を、次々と制作した。それらは「スペース・エイジ・ポップ」と呼ばれる一群である。ステレオ技術が表現を大きく拡張した。

「エキゾチカ」は、それより前からあった。1951年のLes Baxter『Ritual of the Savage』は「初期の礎石の一つ」であり、ステレオは後年の発展に影響した。Les Baxterは『Ritual of the Savage』(1951)で、架空の未開世界を管弦楽で描いている。ハワイのホテルで演奏していたMartin Dennyは、『Exotica』(1957)で、鳥の鳴き声やカエルの声を、楽団員（主にAugie Colón）の口真似や効果音で加えた。「Quiet Village」は、全米Billboard Hot 100で最高4位（1959年6月）まで上昇した。同じくハワイを拠点としたArthur Lymanは、ヴィブラフォンでこの路線を継いだ。

技術の面では、Enoch Lightが主宰したレーベルCommand Recordsが、極端な左右の音の位置（定位）を売りにした。メキシコのJuan García Esquivelは、楽団を2つに分けて別々の場所に配置する実験を行った。Henry Manciniは、スペース・エイジ・ポップの主要アーティストの一人に挙げられ、イージーリスニングで成功した作曲家である。Burt Bacharachの作品は、サンシャイン・ポップ、チェンバー・ポップ、渋谷系などに影響したと記されている。

しかし、エキゾチカは1959年前後からブームが退潮した。イージーリスニング全般は、1960年代にロックのカウンターカルチャーから「体制(Establishment)」の音楽として敵視され、段階的に衰退した。

再評価は、1980年代末に若い聴き手の間で始まった。1990年代にかけて広がった。Capitol Recordsの再発シリーズ『Ultra-Lounge』(1996〜)が、そのブームを拡大・定着させた。アメリカのCombustible Edison、イギリスのStereolab、日本の渋谷系とピチカート・ファイヴが、同時多発的にこの雰囲気を取り入れた。これが「ラウンジ・リヴァイヴァル（復活）」と呼ばれる現象になった。

ただし、エキゾチカが描く「南洋」が実在の文化ではなく白人の空想の産物である点は、批判の対象となってきた。</p>
