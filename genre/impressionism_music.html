<h1>Impressionismとは</h1>
<p>十九世紀末から二十世紀初頭のフランスを中心に現れた、輪郭よりも色彩と雰囲気を重んじる作曲の潮流。最大の特徴は和音の扱いで、機能和声の規則に縛られず、和音そのものの響きの美しさのために置かれる。属七の和音や九の和音が解決しないまま平</p>
<p>十九世紀末から二十世紀初頭のフランスを中心に現れた、輪郭よりも色彩と雰囲気を重んじる作曲の潮流。最大の特徴は和音の扱いで、機能和声の規則に縛られず、和音そのものの響きの美しさのために置かれる。属七の和音や九の和音が解決しないまま平行移動し、全音音階や五音音階、教会旋法が用いられて調の中心が曖昧になる。旋律も明確な主題として展開されるより、断片が現れては消える形を取る。リズムは拍節感を意図的に希薄にし、三連符と二連符を重ね、テンポも揺らぐ。管弦楽法に真価があり、フルートの低音域、ハープのグリッサンド、弱音器を付けた弦の分割、チェレスタや鐘といった楽器が、混ざり合った色として配置される。ピアノ曲ではペダルを長く踏んで倍音を溜め、音が空間に滲む効果が追求される。強弱は全体に抑えられ、極端な弱音の中に細部が描かれる。標題も特徴的で、雲、水の反射、月の光、沈める寺といった、視覚や自然の情景を示す言葉が付けられる。ドイツ・ロマン派が構造と感情の発展を重んじたのに対し、こちらは瞬間の感覚そのものを定着させることを目的としている。</p>
<h2>成り立ち</h2><p>この呼び名は絵画から借りられたもので、しかも当初は非難の言葉だった。1887年、パリ音楽院のアカデミーが、ローマ賞受賞者だったClaude Debussyの提出作品を評して、曖昧な印象主義に陥る危険があると書いたのが始まりとされる。Debussy自身はこの呼称を生涯嫌い、自分は印象主義者ではないと繰り返し述べている。彼の音を決定づけた出来事のひとつが、1889年のパリ万国博覧会である。この場でジャワ島のガムラン合奏に接した彼は、西洋の機能和声とは無関係に響きが積み重なる音楽に衝撃を受けた。同時に、象徴主義の詩人Stéphane MallarméやPaul Verlaineの詩、そしてRichard Wagnerの半音階的和声への傾倒と反発が、彼の語法を形づくった。1894年の管弦楽曲『牧神の午後への前奏曲』は、Mallarméの詩に基づき、冒頭のフルート独奏が調性を宙吊りにしたまま始まる。この一曲をもって二十世紀音楽が始まったと評されることも多い。続く『海』(1905)と、ピアノのための『映像（イマージュ）』『前奏曲集』が、その語法を完成させた。同時代のMaurice Ravelは、より明晰で古典的な構築を保ちながら似た響きを用い、両者はしばしば比較されたが、Ravel自身は自分を印象主義とは考えていなかった。周辺にはErik Satie、Paul Dukas、そしてスペインのManuel de Falla、イギリスのFrederick Delius、イタリアのOttorino Respighiがいる。ロシアのAlexander Scriabinも近い方向から出発した。この語法は二十世紀を通じて広く浸透し、映画音楽、ジャズの和声、そして日本の作曲家にも深い影響を残している。Debussyは第一次世界大戦さなかの1918年、癌により55歳で亡くなった。</p>
<h2>代表曲</h2><ul><li>牧神の午後への前奏曲 (Claude Debussy)</li><li>月の光 (Claude Debussy)</li><li>ボレロ (Maurice Ravel)</li><li>ジムノペディ (Erik Satie)</li><li>海 (Claude Debussy)</li></ul>
