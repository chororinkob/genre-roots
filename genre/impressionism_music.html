<h1>Impressionismとは</h1>
<p>19世紀末から20世紀初頭のフランスを中心に現れた、輪郭よりも色彩と雰囲気を重んじる作曲の潮流。最大の特徴は和音の扱いで、機能和声（和音ごとの役割で進行を決める仕組み）の規則に縛られず、和音そのものの響きの美しさのために置かれる。</p>
<p>19世紀末から20世紀初頭のフランスを中心に現れた、輪郭よりも色彩と雰囲気を重んじる作曲の潮流。最大の特徴は和音の扱いで、機能和声（和音ごとの役割で進行を決める仕組み）の規則に縛られず、和音そのものの響きの美しさのために置かれる。属七の和音や九の和音が解決（落ち着く和音への移動）しないまま平行移動（同じ形を保って上下にずらすこと）し、全音音階（隣り合う音がすべて全音ずつ離れた音階）や5音音階、教会旋法（中世の教会音楽に由来する音の並び方）が用いられて調の中心が曖昧になる。旋律も明確な主題として展開されるより、断片が現れては消える形を取る。リズムは拍節感（拍の区切りの感じ）を意図的に希薄にし、三連符と二連符を重ね、テンポも揺らぐ。管弦楽法（オーケストラの楽器の組み合わせ方）に真価があり、フルートの低音域、ハープのグリッサンド（音をなめらかにすべらせる奏法）、弱音器（音を弱める小道具）を付けた弦の分割、チェレスタ（鍵盤で鳴らす鐘のような音の楽器）や鐘といった楽器が、混ざり合った色として配置される。ピアノ曲ではペダルを長く踏んで倍音（元の音に重なって響く高い音）を溜め、音が空間に滲む効果が追求される。強弱は全体に抑えられ、極端な弱音の中に細部が描かれる。標題（曲につけられた題名）も特徴的で、雲、水の反射、月の光、沈める寺といった、視覚や自然の情景を示す言葉が付けられる。ドイツ・ロマン派が構造と感情の発展を重んじたのに対し、こちらは瞬間の感覚そのものを定着させることを目的としている。</p>
<h2>成り立ち</h2><p>この呼び名は絵画から借りられたもので、しかも当初は非難の言葉だった。1887年、美術アカデミー(Académie des Beaux-Arts)が、ローマ賞留学中だったClaude Debussyの提出作『Printemps』(春)を評して、この漠然とした印象主義に気をつけるべきだと書いたのが始まりとされる。Debussy自身はこの呼称を生涯嫌い、自分は印象主義者ではないと繰り返し述べている。彼の音を決定づけた出来事のひとつが、1889年のパリ万国博覧会である。この場でジャワ島のガムラン合奏に接した彼は魅了され、『Pagodes』(『Estampes』所収)などにその質感の反映が指摘される。ただしガムランの音階や旋律の直接の引用は確認されていない。同時に、象徴主義の詩人Stéphane MallarméやPaul Verlaineの詩、そしてRichard Wagnerの半音階的和声（半音ずつ動く複雑な和音）への傾倒と反発が、彼の作風を形づくった。1894年の管弦楽曲『牧神の午後への前奏曲』は、Mallarméの詩に基づき、冒頭のフルート独奏が調性（曲の中心になる音）を宙に浮かせたまま始まる。この一曲をもって20世紀音楽が始まったと評されることも多い。続く『海』(1905)と、ピアノのための『映像（イマージュ）』『前奏曲集』が、その作風を完成させた。同時代のMaurice Ravelは、より明晰で古典的な構築を保ちながら似た響きを用い、両者はしばしば比較されたが、Ravel自身は自分を印象主義とは考えていなかった。周辺にはPaul Dukas、そしてスペインのManuel de Falla、イギリスのFrederick Delius、イタリアのOttorino Respighiがいる。ロシアのAlexander Scriabinは後期ロマン派から出発し、のち独自の神秘主義的な和声に進んだ。印象主義と関連づけられることがある。ドビュッシーの友人Erik Satieは「家具の音楽」などで後世に影響した。この作風は20世紀を通じて広く浸透し、映画音楽、ジャズの和声、そして日本の作曲家にも深い影響を残している。Debussyは第一次世界大戦さなかの1918年、癌により55歳で亡くなった。</p>
