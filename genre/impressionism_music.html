<h1>Impressionismとは</h1>
<p>印象主義の音楽は、19世紀末から20世紀初頭のフランスを中心に現れた、輪郭よりも色彩と雰囲気を大切にする作曲の流れだ。 いちばんの特徴は和音の扱いである。機能和声（和音ごとの役割で進行を決める仕組み）の規則に縛られず、和音は、その</p>
<p>印象主義の音楽は、19世紀末から20世紀初頭のフランスを中心に現れた、輪郭よりも色彩と雰囲気を大切にする作曲の流れだ。

いちばんの特徴は和音の扱いである。機能和声（和音ごとの役割で進行を決める仕組み）の規則に縛られず、和音は、その響きの美しさのために置かれる。属七の和音や九の和音は、解決（落ち着く和音への移動）しないまま平行移動（同じ形を保って上下にずらすこと）する。全音音階（隣り合う音がすべて全音ずつ離れた音階）や5音音階、教会旋法（中世の教会音楽に由来する音の並び方）も用いられ、調の中心が曖昧になる。

旋律も、はっきりした主題として展開されるより、断片が現れては消える形を取る。リズムは拍節感（拍の区切りの感じ）をわざと薄くする。三連符と二連符を重ね、テンポも揺らぐ。

この音楽は、管弦楽法（オーケストラの楽器の組み合わせ方）にこそ真価がある。フルートの低音域、ハープのグリッサンド（音をなめらかにすべらせる奏法）、弱音器（音を弱める小道具）を付けた弦の分割、チェレスタ（鍵盤で鳴らす鐘のような音の楽器）や鐘などが、混ざり合った色として配置される。ピアノ曲では、ペダルを長く踏んで倍音（元の音に重なって響く高い音）を溜め、音が空間に滲む効果が追求される。

強弱の面では、弱音やppを多く使い、繊細な変化を重んじる。ただし、『海』のように大きなクライマックスを築く作品もある。

標題（曲につけられた題名）にも特徴がある。雲、水の反射、月の光、沈める寺など、目に見える情景や自然を示す言葉が付けられる。ドイツ・ロマン派が構造と感情の発展を重んじたのに対し、印象主義は、瞬間の感覚そのものを定着させることを目指すとされる。</p>
<h2>成り立ち</h2><p>この呼び名は絵画から借りられたもので、しかも当初は非難の言葉だった。

1887年、美術アカデミー(Académie des Beaux-Arts)は、ローマ賞留学中だったClaude Debussyの提出作『Printemps』(春)を評して、この漠然とした印象主義に気をつけるべきだと書いた。ドビュッシーの音楽に『印象主義』の語が結びつけられた最も早い記録とされる。Debussy自身はこの呼称を嫌い、自分は印象主義者ではないと述べている。

1889年のパリ万国博覧会でのガムランとの出会いが、作風に影響したとされる（影響の程度には異論がある）。この博覧会でジャワ島のガムラン合奏に接した彼は、心を奪われた。『Pagodes』(『Estampes』所収)などに、その質感の反映が指摘される。ガムラン旋律の直接引用の有無は、研究者間で議論がある（Mueller 1986は『幻想曲』に Wani-Wani の借用を主張）。

同時に、シンボリズムの詩人Stéphane MallarméやPaul Verlaineの詩、そしてRichard Wagnerの半音階的和声（半音ずつ動く複雑な和音）への傾倒と反発が、彼の作風を形づくった。

1894年、管弦楽曲『牧神の午後への前奏曲』が生まれた。Mallarméの詩に基づき、冒頭のフルート独奏が、調性（曲の中心になる音）を宙に浮かせたまま始まる。ブーレーズは「近代音楽の始まり」と評した。続く『海』(1905)と、ピアノのための『映像（イマージュ）』『前奏曲集』が、その作風を完成させた。

同時代のMaurice Ravelは、より明晰で古典的な構築を保ちながら、似た響きを用いた。両者はしばしば比較されたが、Ravel自身は自分を印象主義とは考えていなかった。周辺にはPaul Dukasがいる。そしてスペインのManuel de Falla、イギリスのFrederick Delius、イタリアのOttorino Respighiもいる。ロシアのAlexander Scriabinは、後期ロマン派から出発し、のち独自の神秘主義的な和声に進んだ。印象主義と関連づけられることがある。ドビュッシーの友人Erik Satieは、「家具の音楽」などで後世に影響した。

この作風は20世紀を通じて広く浸透し、映画音楽、ジャズの和声、そして日本の作曲家にも深い影響を残したとされる。Debussyは第一次世界大戦さなかの1918年、癌により55歳で亡くなった。</p>
