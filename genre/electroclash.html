<h1>Electroclash（エレクトロクラッシュ）とは</h1>
<p>エレクトロクラッシュは、1980年代前半のニューウェイヴとエレクトロの安価な質感を、パンクの態度とともに2000年前後に再構成したダンス音楽である。 音作りでは、安価なシンセやドラムマシン（808など）の使用、またはその再現が目立</p>
<p>エレクトロクラッシュは、1980年代前半のニューウェイヴとエレクトロの安価な質感を、パンクの態度とともに2000年前後に再構成したダンス音楽である。

音作りでは、安価なシンセやドラムマシン（808など）の使用、またはその再現が目立つ。

BPM 125前後の曲が多く、キックは四つ打ちである。この流れが反発した相手は、「テクノの硬直した型」だった。重視されたのは、作曲、ショーマンシップ、ユーモアである。

特徴的な要素は声の扱いだ。歌わずに平坦な口調で語る、あるいは感情を排して呟くという発声が目立つ。特定の訛りを強調した例もあり、その冷たさ自体が演出となる。

歌詞は、性愛、有名人、薬物、消費社会を、露骨でありながら皮肉を込めて扱う。真面目に受け取るべきかどうかを、聴き手に判断させない。

視覚表現も音と同格である。蛍光色の衣装、意図的に安っぽい映像、美術学校的な自意識が、全体を貫いている。</p>
<h2>成り立ち</h2><p>1990年代末、ダンス音楽の世界には、テクノの型にはまったスタイルへの反発があった。この状況に飽きた一群が、逆に人格と態度と見た目を前面に出す方向へ舵を切る。震源は複数あった。

ドイツのミュンヘンでは、DJ HellがInternational DeeJay Gigolo Recordsを構え、退廃的で華美な美学を掲げた作品を発表する。1998年には、フランスのMiss Kittinと、同じくフランスの制作者The Hackerによる楽曲が出た。クラブの有名人志向を皮肉る歌詞を平坦な口調で歌い、この流れのトレードマークとなる曲になった。Miss KittinとThe Hackerの2人はフランスのグルノーブルの出身で、作品はミュンヘンのレーベルから発表された。同じ1998年に出たI-Fの曲も、先駆的な作品とされる。

デトロイトでは、ADULT.が自らのレーベルErsatz Audioを拠点に、より暗く硬質な方向を追求した。カナダ出身でベルリンを拠点としたPeachesは、性的な内容を極めて直截に歌う作品によって、女性の欲望を主題化する存在となる。イギリスのリヴァプールのLadytronは、この流れに分類されることもある。ただし、当時、エレクトロクラッシュと呼ばれることを拒んだ（のちに態度は軟化）。

この流れの呼称については、考案者はDJ Hell説とLarry Tee説があり、定説はない。Larry Teeは2001年のElectroclash Festivalを主催し、この用語を商標登録した。

2001年末から2002年初頭にかけて、Fischerspoonerが英国のMinistry of Soundと契約を結んだ。報道では、£100万〜$300万規模とされる。その後2002年8月に、米国でCapitolが権利を得た。この出来事は、この分野の商業化のトレードマークとして広く報じられ、同時に地下的な信頼を損なう出来事ともなったと言われる。実際、この流行は短命に終わった。

2000年代初頭、I-Fらは「Anti-Electroclash-Manifest」に署名した。スタイルがメディアに身売りされ、古いものが新品として売られている点を批判する内容である。

それでも、この時期に復活した安価なアナログ機材の質感と、演者の人格を提示するという発想は、Lady Gagaら後続のアーティストへの影響が指摘されている。</p>
<h2>代表曲</h2><ul><li>Destroy Everything You Touch (Ladytron)</li><li>Fuck the Pain Away (Peaches)</li><li>Seventeen (Ladytron)</li><li>Emerge (Fischerspooner)</li><li>Playgirl (Ladytron)</li><li>Frank Sinatra (Miss Kittin &amp; The Hacker)</li><li>1982 (Miss Kittin &amp; The Hacker)</li><li>Warm Leatherette (Chicks on Speed)</li><li>Boys Wanna Be Her (Peaches)</li><li>Silver Screen Shower Scene (Felix da Housecat)</li><li>Madame Hollywood (Felix da Housecat)</li><li>Just Let Go (Fischerspooner)</li></ul>
