<h1>Electroclash（エレクトロクラッシュ）とは</h1>
<p>1980年代前半のニューウェイヴとエレクトロの安価な質感を、パンクの態度とともに2000年前後に再構成したダンス音楽である。用いられる機材は意図的に古く、往年のアナログのリズムマシンや、共振の鋭いフィルターを持つ低音の合成器が、生</p>
<p>1980年代前半のニューウェイヴとエレクトロの安価な質感を、パンクの態度とともに2000年前後に再構成したダンス音楽である。用いられる機材は意図的に古く、往年のアナログのリズムマシンや、共振の鋭いフィルターを持つ低音の合成器が、生々しい音のまま前面に出される。テンポは概ね120から130 BPMで、キックは四つ打ちだが、音圧を競うことはせず、薄く痩せた音が選ばれる。低音は単音の音型を執拗に反復し、和音の敷物はほとんど置かれない。この、贅沢さを拒む簡素な音作りが、当時主流だった滑らかで高価な制作への明確な反発となっている。決定的な要素は声の扱いで、歌わずに平坦な口調で語る、あるいは感情を排して呟くという発声が定型である。しばしばフランス語やドイツ語の訛りが強調され、その冷たさ自体が演出となる。歌詞は性愛、有名人、薬物、消費社会を、露骨でありながら皮肉を込めて扱い、真面目に受け取るべきかどうかを聴き手に判断させない。視覚表現も音と同格で、蛍光色の衣装、意図的に安っぽい映像、美術学校的な自意識が全体を貫いている。</p>
<h2>成り立ち</h2><p>1990年代末のダンス音楽は、テクノとハウスがそれぞれ専門化を極め、演者が匿名の技術者として振る舞うことが規範となっていた。この状況に飽きた一群が、逆に人格と態度と見た目を前面に出す方向へ舵を切る。震源は複数あった。ドイツのミュンヘンでは、DJ HellがInternational DeeJay Gigolo Recordsを構え、退廃的で華美な美学を掲げた作品を発表する。1998年、フランスのMiss Kittinとドイツの制作者The Hackerによる楽曲は、有名人の名を平坦な口調で読み上げるという手法で、この様式の雛形を示した。ベルリンとパリの空気を色濃く帯びたこの冷たさが、以後の基準となる。デトロイトではADULT.が、自らのレーベルErsatz Audioを拠点に、より暗く硬質な方向を追求した。カナダ出身でベルリンを拠点としたPeachesは、性的な内容を極めて直截に歌う作品によって、女性の欲望を主題化する存在となる。イギリスのリヴァプールではLadytronが、無表情な女性二人を前面に出した美学を提示した。この一群を一つの潮流として名づけたのは、ニューヨークの興行主Larry Teeである。彼は2001年に同名の音楽祭をニューヨークで開催し、この呼称を定着させた。同じ年、Fischerspoonerが大手レーベルと巨額の契約を結んだことは、この分野の商業化の象徴として広く報じられ、同時に地下的な信頼を損なう出来事ともなった。実際、この流行は極めて短命だった。2003年頃には呼称そのものが陳腐化し、当事者の多くが使用を拒むようになる。批判は明快で、態度と見た目が先行して音楽的な中身が乏しいという指摘、そして皮肉が過ぎて何も肯定しないという指摘だった。それでも、この時期に復活した安価なアナログ機材の質感と、演者の人格を提示するという発想は、その後のインディー・ダンスやシンセポップの復興に直接受け継がれている。</p>
<h2>代表曲</h2><ul><li>Emerge (Fischerspooner)</li><li>Frank Sinatra (Miss Kittin &amp; The Hacker)</li><li>Fuck the Pain Away (Peaches)</li></ul>
