<h1>Marabi（マラビ）とは</h1>
<p>1920年代から40年代にかけて南アフリカの都市周縁で生まれた、ピアノやペダル式オルガンを軸とする鍵盤中心の音楽。最大の特徴は、主和音から下属和音、その転回形、属和音へと進む4小節の循環を、曲が終わるまで延々と繰り返す構造にある。</p>
<p>1920年代から40年代にかけて南アフリカの都市周縁で生まれた、ピアノやペダル式オルガンを軸とする鍵盤中心の音楽。最大の特徴は、主和音から下属和音、その転回形、属和音へと進む4小節の循環を、曲が終わるまで延々と繰り返す構造にある。この単純な枠が回り続けている限り演奏者は何時間でも弾き続けられ、客は好きなときに踊りに入り、好きなときに抜けられた。左手が跳ねるようなベースと和音を刻み、右手が短い旋律の断片を装飾しながら変奏していく。専用の楽器を買えない現場では、空き缶に小石を詰めて振るものが打楽器の代わりを務め、ときにコンサーティーナ、バンジョー、ギター、後にはサックスやトランペットが加わった。旋律には、ソト人やズールー人の伝統的な歌、宣教師が伝えた讃美歌、アメリカのラグタイムやディキシーランド、船乗りが持ち込んだ流行歌が混ざり合っている。テンポは中庸から速めで、拍は明確に刻まれ、踊りやすさが最優先される。歌が乗る場合は短いフレーズが繰り返され、聴衆が唱和した。譜面も録音も残さないまま夜通し演奏されるのが常態だったため、当時の姿は後年の再現録音と証言からしか辿れない。</p>
<h2>成り立ち</h2><p>1886年のヨハネスブルグ近郊での金鉱発見によって、南アフリカには全土から、さらに周辺諸国からも大量の労働者が流入した。都市の周縁には黒人向けの居住区が急ごしらえで作られたが、そこでは黒人による酒の製造と販売が法律で禁じられていたため、女性たちが自宅で密造酒を出す非合法の酒場「シビーン」を営むようになる。マラビは、この場所の音楽として生まれた。シビーンの経営者は客を長く引き留めるために鍵盤奏者を雇い、奏者たちは同じ和音循環を夜通し繰り返すことで、警察の手入れがあれば即座に中断し、去ればまた再開できる、その場に最適化された演奏法を身につけた。名称の由来には諸説あるが、当時の若者の享楽的な生活そのものを指す俗語だったとされ、教会や中産階級の黒人層からは不道徳なものとして強く軽蔑された。1930年代に入るとレコード会社Gallo Record Companyがこの音楽を録音するようになり、ピアニストのEmily Motsieloaら数少ない名前が記録に残っている。同時期、Solomon Lindaらの合唱と並んで、都市の黒人音楽の二大潮流を形成した。1930年代末から40年代にかけて、マラビの和音循環にアメリカのスウィングの管楽器編成が接続され、Jazz ManiacsやMerry Blackbirdsといったビッグバンドが「アフリカン・ジャズ」を生む。1950年代にはこの流れがクウェラとムバカンガへ発展し、Dolly Rathebeのような歌手が台頭した。しかし1950年代以降のアパルトヘイト政策は、マラビを育てたソフィアタウンなどの混住地区を強制的に取り壊し、その現場そのものを消滅させた。マラビはジャンルとしては残らなかったが、その和音循環は南アフリカのポピュラー音楽の骨格として、ムバカンガから今日のアマピアノに至るまで受け継がれている。</p>
