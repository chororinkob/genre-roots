<h1>Marabi（マラビ）とは</h1>
<p>1920年代から40年代にかけて南アフリカの都市周縁で生まれた、ピアノやペダル式オルガンを軸とする鍵盤中心の音楽。最大の特徴は、主和音(I)、下属和音(IV)、主和音の第二転回形(I6/4)、属和音(V)へと進む、典型的には4小節</p>
<p>1920年代から40年代にかけて南アフリカの都市周縁で生まれた、ピアノやペダル式オルガンを軸とする鍵盤中心の音楽。最大の特徴は、主和音(I)、下属和音(IV)、主和音の第二転回形(I6/4)、属和音(V)へと進む、典型的には4小節の循環を、曲が終わるまで延々と繰り返す構造にある。この単純な枠が回り続けている限り演奏者は何時間でも弾き続けられ、客は好きなときに踊りに入り、好きなときに抜けられた。左手が跳ねるようなベースと和音を刻み、右手が短い旋律の断片を装飾しながら変奏していく。専用の楽器を買えない現場では、空き缶に小石を詰めて振るものが打楽器の代わりを務め、ときにコンサーティーナ、バンジョー、ギター、後にはサックスやトランペットが加わった。旋律には、ソト人やズールー人の伝統的な歌、讃美歌(スピリチュアル)、アメリカのラグタイム、ボーア人のダンス音楽などが混ざり合っている。テンポは中庸から速めで、拍は明確に刻まれ、踊りやすさが最優先される。歌が乗る場合は短いフレーズが繰り返され、聴衆が唱和した。譜面も録音も残さないまま夜通し演奏されるのが常態だったため、当時の姿は後年の再現録音と証言からしか辿れない。</p>
<h2>成り立ち</h2><p>1880年代半ばのヨハネスブルグ近郊での金鉱発見(1886年にヨハネスブルグが設立された)によって、南アフリカには全土から、さらに周辺諸国からも大量の労働者が流入した。都市の周縁には黒人向けの居住区が急ごしらえで作られたが、女性たちが自宅で酒を出す非合法の酒場「シビーン」を営んでいた。シビーンは1800年代からあったが、1927年の酒類法(アフリカ人の免許取得・販売・入店を禁止)で拡大した。マラビは、この場所の音楽として生まれた。シビーンの経営者は客を長く引き留めるために鍵盤奏者を雇い、奏者たちは同じ和音循環を夜通し繰り返すことで、警察の手入れがあれば即座に中断し、去ればまた再開できる、その場に最適化された演奏法を身につけた。名称の由来は確定しておらず、プレトリアの地名Marabastadに由来するという説や、南ソト語に由来するという説がある。教会や中産階級の黒人層からは不道徳なものとして強く軽蔑された。初期のマラビ奏者はふつう録音されず、Gallo Record Companyが残した数少ない本物のマラビのピアノ録音も、約4年間発売が見送られて、1944年ごろにようやく出た。Emily Motsieloaは、Merry Blackbirdsなどで活動したピアニストである。同時期、Solomon Lindaらの合唱も、都市の黒人音楽の流れを形づくった。1930年代末から40年代にかけて、マラビの和音循環にアメリカのスウィングの管楽器編成が接続され、Jazz ManiacsやMerry Blackbirdsといったビッグバンドが「アフリカン・ジャズ」を生む。この流れから、クウェラやムバカンガ（1950年代半ばから形成されたとも、1960年代初頭に現れたとも言われる）が生まれ、Dolly Rathebeのような歌手が台頭した。マラビを育てたのは、1920〜30年代のヨハネスブルグのスラムヤード(中心はDoornfontein)で、1930年代に撤去された。生活の中心が移ったソフィアタウンなども、1955年以降、アパルトヘイトのもとで強制的に取り壊された。マラビは、ムバカンガの母体となり、後の南アフリカのポピュラー音楽に影響したとされる。</p>
<h2>代表曲</h2><ul><li>Skokiaan (Louis Armstrong)</li><li>Skokiaan (The African Dance Band of the Cold Storage Commission of Southern Rhodesia)</li><li>Meadowlands (Nancy Jacobs and Her Sisters)</li><li>Ishumelosheleni (The Manhattan Brothers)</li><li>Marabi Yo! (Mahlathini &amp; The Mahotella Queens)</li><li>Be My Guest (The Manhattan Brothers)</li><li>El Yow (Phata Phata) (Dorothy Masuka)</li><li>Manyeo (The Manhattan Brothers)</li><li>Nozizwe (Dolly Rathebe)</li><li>Yini Madoda (The Skylarks)</li><li>Marie (The Manhattan Brothers)</li><li>Chaka (The Manhattan Brothers)</li><li>Inkoma Zodwa (Miriam Makeba feat. The Skylarks)</li><li>Umbhaqanga (Miriam Makeba feat. The Skylarks)</li></ul>
