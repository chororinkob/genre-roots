<h1>Marabi（マラビ）とは</h1>
<p>マラビは、諸説あるが、1920年代から40年代にかけて、南アフリカの、ヨハネスブルグ中心部に隣接するスラムヤードやその周辺で生まれた音楽だ。ピアノやペダル式オルガン（足で空気を送って鳴らすオルガン）を軸にした、鍵盤中心の音楽である</p>
<p>マラビは、諸説あるが、1920年代から40年代にかけて、南アフリカの、ヨハネスブルグ中心部に隣接するスラムヤードやその周辺で生まれた音楽だ。ピアノやペダル式オルガン（足で空気を送って鳴らすオルガン）を軸にした、鍵盤中心の音楽である。

専用の楽器を買えない現場では、空き缶に小石を詰めて振るものが、打楽器の代わりを務めた。ときにバンジョーやギターが加わり、後にはサックスやトランペットも加わった。

最大の特徴は、和音の循環を、曲が終わるまで延々と繰り返す組み立てにある。和音は、主和音(I)、下属和音(IV)、主和音の第二転回形(I6/4)、属和音(V)へと進む。この循環は、典型的には4小節だ。この単純な枠が回り続けている限り、演奏者は何時間でも弾き続けられた。

左手は、4小節の同じ型でベースと和音を刻み続ける。右手は、旋律を装飾しながら変奏していく。旋律には、ソト人やズールー人の伝統的な歌、キリスト教のスピリチュアル、アメリカのラグタイム、ボーア人のダンス音楽などが混ざり合っている。

テンポは、速いクウェラのビートより遅いリズムとされた。拍ははっきり刻まれ、踊りやすさが何より優先される。

歌が乗る場合は短いフレーズが繰り返された。歌詞は緩く、旋律に合わせて即興で付けられ、はっきりした歌詞がないことも多かった。

演奏は、譜面も録音も残さないまま夜通し続くのがふつうだった。そのため当時の姿は、ごく少数の同時代録音と、当時の新聞・奏者の証言から辿られる。</p>
<h2>成り立ち</h2><p>1880年代半ば、ヨハネスブルグ近郊で金鉱が見つかった(1886年にヨハネスブルグが設立された)。これをきっかけに、南アフリカ全土から、さらに周辺の国々からも、大量の労働者が流れ込んだ。

ヨハネスブルグ中心部に隣接するスラムヤードやその周辺には、黒人向けの居住区が急ごしらえで作られた。そこでは女性たちが、自宅で酒を出す非合法の酒場「シビーン」を営んでいた。シビーンは1800年代からあったが、1927年または1928年の酒類法(アフリカ人の免許取得・販売・入店を禁止)で広がった。マラビは、この場所の音楽として生まれた。

シビーンの経営者は、客を長く引き留めるために鍵盤奏者を雇った。奏者たちは同じ和音循環を夜通し繰り返した。この繰り返しは、警察の手入れがあればすぐに止め、去ればまた再開できる、その場に合った演奏法として身についた、と解釈されることもある。

名称は、プレトリアの地名Marabastadに由来するとする説が有力だが、確定していない。語自体は南ソト語系とされる。マラビは、教会や中産階級の黒人層からは、不道徳なものとして強く軽蔑された。

初期のマラビ奏者は、ふつう録音されなかった。のちのGallo Record Companyが残した数少ない本物のマラビのピアノ録音も、約4年間発売が見送られ、1944年ごろにようやく世に出たとされる。Emily Motsieloaは、Merry Blackbirdsなどで活動したピアニストである。同じ時期、Solomon Lindaらの合唱も、都市の黒人音楽の流れを形づくった。

Merry Blackbirdsは1930年または1931年に、Jazz Maniacsは1934年または1935年に結成された。1930年代初頭には黒人のダンスバンドが現れ、スウィングの曲と、マラビを土台にした自作曲を演奏した。そのスタイルは、1940年代後半までに「アフリカン・ジャズ」または「ムバカンガ」と呼ばれるようになった。マラビを積極的に取り込んだのはJazz Maniacsで、Merry Blackbirdsは「より西洋的なアレンジ」を選んだとされる。Jazz ManiacsやMerry Blackbirdsなどが女性歌手を前面に出す中で、Dolly Rathebeは1949年に映画「Jim Comes to Jo'burg」で名を上げた。

この流れから、クウェラやムバカンガ（1950年代後半に芽生え、1960年代に人気が出たとも、1960年代初頭に登場したとも言われる）が生まれた。

一方、マラビを育てたのは、1920〜30年代のヨハネスブルグのスラムヤード(中心はDoornfontein)だった。そこは1930年代に撤去された。生活の中心が移ったソフィアタウンなども、1955年以降、アパルトヘイトのもとで強制的に取り壊された。それでもマラビは、ムバカンガの母体となり、後の南アフリカのポピュラー音楽に影響したとされる。</p>
