<h1>Bass House（ベースハウス）とは</h1>
<p>ハウスの四つ打ちの土台に、ダブステップやイギリスのベース音楽が発達させた低音の加工技術を接合したダンス音楽である。テンポは概ね125から130 BPMで、キックは正確に四つを刻む。この分野の全ては低音の設計に集約される。複数の波形</p>
<p>ハウスの四つ打ちの土台に、ダブステップやイギリスのベース音楽が発達させた低音の加工技術を接合したダンス音楽である。テンポは概ね125から130 BPMで、キックは正確に四つを刻む。この分野の全ては低音の設計に集約される。複数の波形をわずかに音程をずらして重ね、そこに共振の鋭いフィルターをかけ、そのフィルターの開き具合を低周波の発振器で高速に揺らすことで、獣が唸るような、あるいは金属が軋むような音が作られる。この揺れの速度を拍に同期させることで、低音そのものがリズムを刻む楽器となる。曲の構造は明快で、導入と積み上げの区間で緊張を高め、最も密度の高い部分で低音が解放されるという型が徹底されている。この解放の瞬間のために、直前の数小節では意図的に低音を完全に抜き、聴き手の耳を空白にするという処理が施される。上物は最小限で、人の声を数語だけ切り取って音程をずらした断片や、鋭い効果音が置かれる程度である。旋律も和声もほとんど存在せず、音色の獰猛さと落差の設計だけで成立している。大音量の会場で身体を揺らすための、極めて実用的な設計の音楽である。</p>
<h2>成り立ち</h2><p>この様式には二つの源流が合流している。ひとつはイギリス北部、とりわけシェフィールドで2000年代半ばに発達したベースラインと呼ばれる音楽である。UKガラージの速度を保ちながら、跳ねる低音を主役に据えたこの音楽は、地元のクラブを拠点に独自の熱狂を生み、2007年にはT2の楽曲が全英チャートの上位に達した。しかし会場での暴力事件を理由に主要なクラブが閉鎖され、シーンは地下へ潜ることになる。もうひとつの源流は2010年前後に世界的な流行となったダブステップで、そこで開発された、低音を高速で揺らす加工技術がここで用いられる。両者が結びついたのは2014年前後のアメリカとイギリスである。アメリカのJauzは、この折衷を最も明快な形で提示し、短期間で巨大な祭典の主要な時間帯を任される存在となった。ロサンゼルスではAC SlaterがNight Bassというレーベルとパーティーを立ち上げ、この音の拠点を作る。イギリス側ではChris Lorenzoが、ベースラインの伝統を直接受け継ぐ形で参加した。フランスからはMalaaやHabstraktが加わり、覆面によって素性を隠す演出も定着する。この分野の急速な普及を支えたのは、音源配信サイトの分類と、動画共有サイトにおける制作技術の解説である。低音の作り方が手順として公開されたことで、若い制作者が短期間で同じ音を再現できるようになった。その結果、量産された楽曲が互いに区別できないという批判が早期から出ている。実際、2010年代後半には流行として一巡し、より地下的な方向と、より商業的な方向へ分裂した。それでも、イギリスの地方都市で生まれた低音の文化が、世界的な祭典の中心で鳴っているという構図は、この分野の特異な達成である。</p>
