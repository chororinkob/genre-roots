<h1>Bass House（ベースハウス）とは</h1>
<p>ベース・ハウスは、ハウスの四つ打ちを土台に、ダブステップやイギリスのベース音楽が育てた低音の加工技術をつないだダンス音楽である。 テンポはおおむね124から130 BPMで、キックは正確に四つを刻む。低音の音作りが中心的な要素だが</p>
<p>ベース・ハウスは、ハウスの四つ打ちを土台に、ダブステップやイギリスのベース音楽が育てた低音の加工技術をつないだダンス音楽である。

テンポはおおむね124から130 BPMで、キックは正確に四つを刻む。低音の音作りが中心的な要素だが、ハウス由来のドラムや短いボーカル・フックも備える。作風は地域やアーティストで幅がある。

低音はこう作られる。いくつかの音の波形を、少しだけ音の高さをずらして重ねる。そこにクセの強いフィルターをかけ、その開き具合を低周波発振器(LFO)で速く揺らす。すると、獣が唸るような、あるいは金属が軋むような音が生まれる。この揺れの速さを拍に合わせると、低音そのものがリズムを刻む楽器になる。

上物は最小限だ。人の声を数語だけ切り取って音程をずらした断片や、鋭い効果音が置かれる程度である。音色の荒々しさと、静と動の落差の作り込みで成り立っている。

曲の組み立てははっきりしている。導入と盛り上げの部分で緊張を高め、いちばん音が詰まった部分で低音を一気に放つ。この型が守られている。解放の瞬間のために、直前の数小節では、わざと低音を完全に抜き、聴き手の耳をいったん静けさに置く工夫がされる。大音量の会場で体を揺らすための、とても実用的な作りの音楽である。</p>
<h2>成り立ち</h2><p>このスタイルは、UKガラージ、ダブステップ、ベースラインなど、さまざまな音楽が混ざり合う中から生まれた。ここでは、特に二つの流れを追う。

ひとつ目は、ベースラインと呼ばれる音楽だ。イギリスのシェフィールドを中心とするサウス・ヨークシャーで、2000年代初頭に固まったとされる。1990年代後半のクラブNicheにさかのぼる見方もある。バーミンガムが始まりだとするChris Lorenzoの主張や、リーズにも並行するシーンがあったとする説もある。この音楽は、UKガラージより速い135〜142BPM前後で、重い低音を前面に出した。地元のクラブを舞台に独特の盛り上がりを生み、リーズ出身のT2の「Heartbroken」が2007年に全英2位に達した。

一方、中心的なクラブだったNicheは、2005年に警察の急襲を受けて閉鎖されていた。その後、2010年7月18日に、Charter Rowの再開した店で事件が起きる。5人が刺されたとされる事件で、場所は店の外とされたが、警察は店内だった可能性を指摘した。これを受けて、警察が免許の見直しを申請した。その結果、免許委員会が会員制などの条件を付けて、営業を続けることを認めた。

ふたつ目の源流は、2010年前後に世界的に流行したダブステップだ。そこで広く使われた、低音を速く揺らす加工技術が、ここでも使われる。この技術(LFO)そのものは、1960年代のモジュラー・シンセサイザーで取り入れられたもので、ドラムンベースもよく使う。

両者がいつ、どこで結びついたかは、当事者の証言が食い違う。Chris Lorenzoは、2008年ごろにベースラインとハウスを合わせたと語る。AC Slaterは、2016年ごろの取材で、2000年代半ばのSwitchとSindenが、ハウスに太いベースを入れた主な火付け役だったと述べる。このジャンルは、Jauzの2014年のヒット「Feel the Volume」などのヒット曲に続いて、注目を集めたとされる。アメリカのJauzは、アメリカ側のダブステップ寄りの作風を代表する一人である。

ロサンゼルスでは、AC SlaterがNight Bassというレーベルとパーティーを立ち上げ、この音の拠点を作る。開始時期には説が分かれる。2014年1月に月例パーティーを始めたとする説と、2014年後半にイベントとして始まり、半年後の2015年半ばにレーベルになったとする説がある。イギリス側ではChris Lorenzoが参加した。本人の話では、ベースラインの伝統を直接受け継ぐ形だったという。フランスからはMalaaやHabstraktが加わった。Malaaはバラクラバ(覆面)を着けて人前に出る。

2019年3月、音源配信サイトのBeatportは、このジャンルの人気を認めて専用の部門を新しく設けた。当時は、ブームは去ったかもしれないが、DJセットには残っていると評された。この音楽は、イギリスのベース文化を土台に、アメリカやフランスの制作者が加わって広がった。</p>
