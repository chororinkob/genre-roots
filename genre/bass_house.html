<h1>Bass House（ベースハウス）とは</h1>
<p>ハウスの四つ打ちの土台に、ダブステップやイギリスのベース音楽が発達させた低音の加工技術を接合したダンス音楽である。テンポは概ね124から130 BPMで、キックは正確に四つを刻む。この分野のすべては、低音の作り方に集まっている。い</p>
<p>ハウスの四つ打ちの土台に、ダブステップやイギリスのベース音楽が発達させた低音の加工技術を接合したダンス音楽である。テンポは概ね124から130 BPMで、キックは正確に四つを刻む。この分野のすべては、低音の作り方に集まっている。いくつかの音の波形を、少しだけ音の高さをずらして重ね、そこにクセの強いフィルターをかけ、そのフィルターの開き具合を低周波発振器(LFO)で高速に揺らすことで、獣が唸るような、あるいは金属が軋むような音が作られる。この揺れの速度を拍に同期させることで、低音そのものがリズムを刻む楽器となる。曲の組み立てははっきりしていて、導入と盛り上げの部分で緊張を高め、いちばん音が詰まった部分で低音が一気に放たれる、という型が守られている。この解放の瞬間のために、直前の数小節では意図的に低音を完全に抜き、聴き手の耳をいったん静けさに置くという工夫がされる。上物は最小限で、人の声を数語だけ切り取って音程をずらした断片や、鋭い効果音が置かれる程度である。旋律も和声もほとんど存在せず、音色の荒々しさと、静と動の落差の作り込みだけで成り立っている。大音量の会場で身体を揺らすための、極めて実用的な設計の音楽である。</p>
<h2>成り立ち</h2><p>この様式は、UKガラージ、ダブステップ、ベースラインなど、さまざまな音楽が混ざり合った中から生まれた。ここでは特に二つの流れを見ていく。ひとつは、イギリスのシェフィールドを中心とするサウス・ヨークシャーで2000年代初頭に成立したとされるベースラインと呼ばれる音楽である(1990年代後半のクラブNicheに遡る見方や、バーミンガムが始まりだとする主張、リーズにも並行するシーンがあったとする説もある)。UKガラージの速度を保ちながら、跳ねる低音を主役に据えたこの音楽は、地元のクラブを舞台に独特の盛り上がりを生み、2007年にはT2の楽曲が全英チャートの上位に達した。一方、主要なクラブのNicheは、2005年に警察の急襲を受けて閉鎖されており、2010年に店の外で刺傷事件が起きた後には、裁判所の命令で会員証の提示が義務づけられた。もうひとつの源流は2010年前後に世界的な流行となったダブステップで、そこで広く使われた、低音を高速で揺らす加工技術がここで用いられる。この技術(LFO)そのものは1960年代のモジュラー・シンセサイザーで導入されたもので、ドラムンベースも多用する。両者がいつ、どこで結びついたかについては、当事者の証言が食い違う。Chris Lorenzoは2008年にベースラインとハウスを合流させたと語り、AC SlaterはSwitchとSindenを10〜12年前の主な火付け役としている。この語が広まった契機としては、Jauzの2014年のヒット「Feel the Volume」が挙げられる。アメリカのJauzは、この折衷を最も明快な形で提示した。ロサンゼルスではAC SlaterがNight Bassというレーベルとパーティーを立ち上げ、この音の拠点を作る(開始時期は、2014年1月に月例パーティーを始めたとする記述と、2014年後半にイベント、半年後の2015年半ばにレーベルになったとする記述があり、資料によって異なる)。イギリス側ではChris Lorenzoが、ベースラインの伝統を直接受け継ぐ形で参加した。フランスからはMalaaやHabstraktが加わった。Malaaはバラクラバ(覆面)を着けて人前に出る。音源配信サイトのBeatportは、このジャンルの人気を認めて専用の部門を設けた。ブームは去ったかもしれないとも言われるが、この音は今も多くのDJのセットに入っている。それでも、イギリスの地方都市で生まれた低音の文化が、世界的な祭典の中心で鳴っているという構図は、この分野の特異な達成である。</p>
