<h1>Lo-fi（ローファイロック）とは</h1>
<p>録音の質の低さを、欠点ではなく作品の一部として示す音楽である。名称は忠実度の低さを意味する語に由来する。具体的には、テープが回るときに出続ける雑音、音量が大きすぎて生じる歪み、録音機の限界による高い音の抜け落ち、マイクから離れて録</p>
<p>録音の質の低さを、欠点ではなく作品の一部として示す音楽である。名称は忠実度の低さを意味する語に由来する。具体的には、テープが回るときに出続ける雑音、音量が大きすぎて生じる歪み、録音機の限界による高い音の抜け落ち、マイクから離れて録られた不明瞭な声、そして機材の不調による音の途切れが、修正されないまま残される。これらは通常の制作では取り除かれるべきものだが、ここではそれこそが親密さと誠実さの証と見なされる。演奏も同様で、音程の揺れ、拍のずれ、弦の擦れる音、演奏中の咳や物音が残される。編成は簡素で、一人で全ての楽器を重ねて録音する場合が多い。楽曲そのものは意外にも整っていることが多く、旋律は美しく、和声（コードの響き）も工夫されている。この、丁寧に書かれた歌が粗い録音で示されるという落差が、この分野の情緒を作る。曲は短く、2分程度のものも珍しくない。歌詞は日常のささいな出来事、内面の混乱、自意識、そして孤独を扱い、比喩を凝らさず日記のように書かれる。聴き手は、完成された商品ではなく、誰かの部屋の中を覗いているような感覚を得る。</p>
<h2>成り立ち</h2><p>「ローファイ」という語は少なくとも1950年代からあり、1980年代にこの語と、その考え方が定着したとされる。技術的な前提は1979年にある。この年、日本の企業がカセットテープに四つの音を別々に記録できる小型の機材を発売した。家庭用のオープンリール式の4トラック録音機は1970年代半ばからあったが、カセット式のこの機材によって、宅録は一気に安価で身近になった。これは音楽制作の民主化（誰でも作れるようになること）として、後のパソコンによる制作に匹敵する意味を持っていた。この可能性を早くから形にした一人がR. Stevie Mooreである。彼は1960年代後半から自宅で膨大な数の作品を録音し続け、1982年にはカセットの通信販売を始めた。宅録の過程そのものを作品の魅力にした先駆者と評される。テキサス州のDaniel Johnstonは、精神の病を抱えながら、安価なテープ録音機に歌を吹き込み、自ら複製して手渡しで配った。その素朴で痛ましい歌は、後に多くの音楽家に愛され、彼は2019年に死去するまで独自の位置を占め続けた。1980年代のワシントン州オリンピアでは、Calvin JohnsonがK Recordsを設立し、演奏技術を持たないことを積極的に肯定する文化を作る。1990年代前半、この考え方は主流の近くまで広がった。オハイオ州のGuided by Voicesは、ポータスタジオ（カセット式の小型録音機）で録音した膨大な断片的な楽曲を発表し、カリフォルニアのPavementは、低予算の自宅スタジオ録音による粗い音で注目され、批評家の高い評価を得る。Eric GaffneyとともにSebadohを結成したLou Barlowは、内省的な歌をテープの雑音とともに聞かせた。1994年、Beckが発表した作品は、この考え方を主流の市場へ持ち込んでいる。2000年代以降、パソコンによる録音が普及して、粗い音は技術的な必然ではなくなった。それにもかかわらず、この質感は選択として残り続けた。「ローファイ」という語や質感は、後のローファイ・ヒップホップなど現代の音楽にも共有されている。</p>
<h2>代表曲</h2><ul><li>True Love Will Find You in the End (Daniel Johnston)</li><li>Cut Your Hair (Pavement)</li><li>Gold Soundz (Pavement)</li><li>Game of Pricks (Guided by Voices)</li><li>The Sun Was High (So Was I) (Best Coast)</li><li>Rebound (Sebadoh)</li><li>Summer Babe (Pavement)</li><li>Indian Summer (Beat Happening)</li><li>I Am a Tree (Guided by Voices)</li><li>Speeding Motorcycle (Daniel Johnston)</li><li>Where Do You Run To (Vivian Girls)</li><li>King of the Beach (Wavves)</li></ul>
