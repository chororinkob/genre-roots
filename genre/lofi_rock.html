<h1>Lo-fi（ローファイロック）とは</h1>
<p>録音の質の低さを、欠点ではなく作品の一部として提示する音楽である。名称は忠実度の低さを意味する語に由来する。具体的には、テープの走行によって生じる持続的な雑音、音量が過大なために生じる歪み、録音機の限界による高音域の欠落、マイクか</p>
<p>録音の質の低さを、欠点ではなく作品の一部として提示する音楽である。名称は忠実度の低さを意味する語に由来する。具体的には、テープの走行によって生じる持続的な雑音、音量が過大なために生じる歪み、録音機の限界による高音域の欠落、マイクから離れて録られた不明瞭な声、そして機材の不調による音の途切れが、修正されないまま残される。これらは通常の制作では取り除かれるべきものだが、ここではそれこそが親密さと誠実さの証と見なされる。演奏も同様で、音程の揺れ、拍のずれ、弦の擦れる音、演奏中の咳や物音が残される。編成は簡素で、一人で全ての楽器を重ねて録音する場合が多い。楽曲そのものは意外にも整っていることが多く、旋律は美しく、和声も工夫されている。この、丁寧に書かれた歌が粗い録音で提示されるという落差が、この分野の情緒を作る。曲は短く、二分程度のものも珍しくない。歌詞は日常の些細な出来事、内面の混乱、自意識、そして孤独を扱い、比喩を凝らさず日記のように書かれる。聴き手は、完成された商品ではなく、誰かの部屋の中を覗いているような感覚を得る。</p>
<h2>成り立ち</h2><p>技術的な前提は1979年にある。この年、日本の企業がカセットテープに四つの音を別々に記録できる小型の機材を発売した。それまで多重録音は専門のスタジオでしか行えず、一日の使用料は一般人には支払えない額だった。この機材の登場によって、寝室で一人が全てのパートを重ねて作品を作ることが初めて可能になったのである。これは音楽制作の民主化として、後のパソコンによる制作に匹敵する意味を持っていた。この可能性を最も早く体現したのがR. Stevie Mooreである。彼は1970年代から自宅で膨大な数の作品を録音し続け、通信販売で頒布するという方法を確立した。テキサス州のDaniel Johnstonは、精神の病を抱えながら、安価なテープ録音機に歌を吹き込み、自ら複製して手渡しで配った。その素朴で痛ましい歌は、後に多くの音楽家に愛され、彼は2019年に死去するまで独自の位置を占め続けた。1980年代のワシントン州オリンピアでは、Calvin JohnsonがK Recordsを設立し、演奏技術を持たないことを積極的に肯定する文化を作る。1990年代前半、この美学は主流の近くまで達した。オハイオ州のGuided by Voicesは、地下室で録音した膨大な断片的な楽曲を発表し、カリフォルニアのPavementは、緻密な楽曲を意図的に粗く録ることで批評家の絶賛を得る。Sebadohを率いたLou Barlowは、内省的な歌をテープの雑音とともに提示した。1994年、Beckが発表した作品は、この美学を主流の市場へ持ち込んでいる。2000年代以降、パソコンによる録音が普及して、粗い音は技術的な必然ではなくなった。それにもかかわらず、この質感は選択として残り続け、寝室で作られる音楽全般、そして休憩のための背景音として作られる現代の音楽にまで、はっきりと受け継がれている。</p>
<h2>代表曲</h2><ul><li>Game of Pricks (Guided by Voices)</li><li>Cut Your Hair (Pavement)</li><li>Rebound (Sebadoh)</li><li>True Love Will Find You in the End (Daniel Johnston)</li><li>The Sun Was High (So Was I) (Best Coast)</li></ul>
