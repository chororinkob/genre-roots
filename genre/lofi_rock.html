<h1>Lo-fi（ローファイロック）とは</h1>
<p>ローファイは、録音の質の低さを欠点とせず、作品の一部として聴かせる音楽だ。名前は「忠実度が低い」という意味の言葉から来ている。 具体的には、次のような音が直されないまま残る。テープが回る間ずっと鳴る雑音。音量が大きすぎて生じる歪み</p>
<p>ローファイは、録音の質の低さを欠点とせず、作品の一部として聴かせる音楽だ。名前は「忠実度が低い」という意味の言葉から来ている。

具体的には、次のような音が直されないまま残る。テープが回る間ずっと鳴る雑音。音量が大きすぎて生じる歪み。録音機の限界で抜け落ちた高い音。マイクから離れて録った、聞き取りにくい声。機材の不調による音の途切れ。

普通の制作なら取り除くべき音だが、ここではそれこそが親密さと誠実さの証と見なされる。

演奏も同じだ。音程の揺れ、拍のずれ、弦の擦れる音、演奏中の咳や物音が、そのまま残される。

編成は簡素である。一人で全パートを録音する宅録の例（R. Stevie Mooreなど）もあるが、バンド編成の作品も多い。

親しみやすい旋律を持つ曲も多い（Guided by Voicesなど）。丁寧に書かれた歌が、粗い録音で差し出される。この落差が、この音楽ならではの情緒を生む。

曲は短く、2分程度のものも珍しくない。

歌詞は、日常のささいな出来事、心の中の混乱、自意識、孤独を扱う内省的なものも多い。一方で、Pavementのように意味の通らない言葉遊びのような歌詞や、Guided by Voicesのように超現実的な歌詞もあり、一様ではない。

聴き手は、完成された商品ではなく、誰かの部屋の中をのぞいているような感覚を味わう。</p>
<h2>成り立ち</h2><p>「ローファイ」という言葉は、少なくとも1950年代からあった。1980年代後半に広まり、1990年代前半には「ローファイ運動」として語られるようになった。

技術の面での出発点は1979年だ。この年、日本の企業が、カセットテープに四つの音を別々に記録できる小型の機材を発売した。家庭用のオープンリール式の4トラック録音機は、1970年代前半(1972年ごろ)からあった。しかし、カセット式のこの機材によって、宅録は一気に安く、身近になった。この機材は、良質な4トラック録音を一般消費者に初めて可能にした。

この可能性を早くから形にした一人が、R. Stevie Mooreである。彼は1960年代後半から、自宅で膨大な数の作品を録音し続けた。1982年には、カセットの通信販売を始めた。宅録の過程そのものを作品の魅力にした先駆者と評される。

Daniel Johnstonは、カリフォルニア州生まれでウェストバージニア州育ち、のちにテキサス州オースティンを拠点にした。彼は精神の病を抱えながら、安いテープ録音機に歌を吹き込み、自分で複製して手渡しで配った。その素朴で痛ましい歌は、後に多くの音楽家に愛された。彼は2019年に亡くなるまで、独自の位置を占め続けた。

1980年代のワシントン州オリンピアでは、Calvin Johnsonが動いた。Beat Happening（1982年結成）での活動とK Records（1982年設立）を通じて、技術の巧拙にこだわらない姿勢を広めた中心人物の一人となる。

1990年代前半、この考え方は主流のすぐそばまで広がった。オハイオ州のGuided by Voicesは、ポータスタジオ（カセット式の小型録音機）で録音した、膨大な数の断片的な曲を発表した。カリフォルニアのPavementは、低予算の自宅スタジオ録音による粗い音で注目され、批評家から高い評価を得る。Eric GaffneyとともにSebadohを結成したLou Barlowは、内省的な歌をテープの雑音ごと聴かせた。

そして1994年、Beckの『Mellow Gold』と『Loser』が、この考え方を主流の市場へ持ち込んだ。

2000年代以降は、パソコンによる録音が広まり、粗い音は技術的に避けられないものではなくなった。それでも、この質感は自ら選ぶものとして残り続けた。「ローファイ」という言葉や質感は、後のローファイ・ヒップホップなど、今の音楽にも受け継がれている。</p>
<h2>代表曲</h2><ul><li>True Love Will Find You in the End (Daniel Johnston)</li><li>Cut Your Hair (Pavement)</li><li>Gold Soundz (Pavement)</li><li>Game of Pricks (Guided by Voices)</li><li>The Sun Was High (So Was I) (Best Coast)</li><li>Rebound (Sebadoh)</li><li>Summer Babe (Pavement)</li><li>Indian Summer (Beat Happening)</li><li>I Am a Tree (Guided by Voices)</li><li>Speeding Motorcycle (Daniel Johnston)</li><li>Where Do You Run To (Vivian Girls)</li><li>King of the Beach (Wavves)</li></ul>
