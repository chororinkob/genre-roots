<h1>Freak Folk（フリークフォーク）とは</h1>
<p>2000年代前半に現れた、生楽器を用いながら幻覚のような、いびつで不思議な感覚を追い求める音楽である。編成の中心は生ギターだが、そこにハープ、ダルシマー、リコーダー、鐘、ハルモニウム、正体の分からない自作の楽器などが加えられ、決ま</p>
<p>2000年代前半に現れた、生楽器を用いながら幻覚のような、いびつで不思議な感覚を追い求める音楽である。編成の中心は生ギターだが、そこにハープ、ダルシマー、リコーダー、鐘、ハルモニウム、正体の分からない自作の楽器などが加えられ、決まった編成という考え方が、わざと崩される。演奏は素朴でありながら、しばしば拍の区切りがあいまいで、途中で曲の調がずるずると変わっていく。伸び続ける低音の上にメロディーが漂う作りが好まれ、1960年代末のイギリスの実験的なフォークや、非西洋の音楽の影響が明瞭である。いちばん大事な要素は歌声で、ふつうの歌い方の決まりごとから大きく外れた、震える声、極端な裏声、子どものような発声、動物の鳴き声に近い音が用いられる。この、生身の体のクセをそのまま差し出す声が、この分野の感情表現の中心にある。録音は温かく、テープの質感が残されることが多い。歌詞は自然、動物、植物、夢、神話、身体、そして無垢と不気味さが同居する情景を扱い、意味の通る物語よりも、言葉のつながりが生む感触のほうが大切にされる。都会的な洗練を拒み、森や田舎の生活を志向する仲間と暮らすような姿勢を伴うことも多い。</p>
<h2>成り立ち</h2><p>この流れの呼び名は、2003年8月にイギリスの音楽誌The Wireで、David Keenanが「New Weird America(アメリカの新しい奇妙さ)」の名で用いた語から移り変わってきた。Keenanが取り上げたのは、バーモント州ブラトルボロのフェスティバル周辺の「free folk」と呼ばれる動きだった。ほぼ同じ時期に現れた、Devendra BanhartやJoanna Newsomらの、より知名度が高く商業的にも成功した波は、それとはほとんど無関係な別系統とされる。のちに報道が両者をまとめて同じ名で呼び、「New Weird America」から「free folk」、そして「freak folk」へと呼び名が移っていった。「freak folk」という語自体は、1998年の音楽誌にも用例がある。彼らはアメリカ各地に散在していた、既存の枠に収まらない生楽器の作り手たちだった。彼らに共通していたのは、1960年代末から1970年代前半に存在した、異様に独創的なフォークの作品群(その一部は商業的に振るわなかった)への傾倒である。とりわけ、スコットランドのThe Incredible String Bandが実践した、世界中の楽器を無節操に取り込む折衷や、イギリスのVashti Bunyanが1970年に残した、当時ほとんど売れなかった一枚が重要だった。この作品は2000年に再発され、彼女は30年ぶりに音楽の世界へ呼び戻されるという劇的な復活を遂げている。中心的な存在となったのがDevendra Banhartである。彼はテキサスで生まれ、ベネズエラとカリフォルニアで育った。震える声と素朴なギターによる自主制作の録音のあと、2002年10月にMichael GiraのYoung God Recordsから発売した『Oh Me Oh My…』で注目を集め、この分野の象徴となった。カリフォルニアのJoanna Newsomは、ロックやフォークの文脈でハープの弾き語りを前面に出し、2006年には管弦楽の編曲を伴う長大な作品を発表して、この分野が高度な音楽性を持ちうることを示した。Animal Collectiveは、フォークの素材を電子的な処理と結合させる方向へ進み、後に全く別の領域へ展開する。CocoRosieは姉妹による奇怪な音響と歌声で独自の位置を占めた。この分野への批判もある。担い手が白人中心であることや、時代がかった装い(農民風の衣装など)が疎外感を与えるといった指摘である。実際、流行としては2005年から2008年ごろに飽和し、インディー・フォークへ拡散していった。しかし、生楽器の音を実験の場として再び開いたこと、そして歌声の規範を大きく緩めたことは、その後のインディー音楽に確実な影響を残している。</p>
<h2>代表曲</h2><ul><li>Lemonade (CocoRosie)</li><li>Peach, Plum, Pear（Joanna Newsom）</li><li>Sprout and the Bean (Joanna Newsom)</li><li>Noah's Ark（CocoRosie）</li><li>Train Song (Vashti Bunyan)</li><li>Cripple Crow（Devendra Banhart）</li><li>Leaf House（Animal Collective）</li><li>Carmensita (Devendra Banhart)</li><li>Cosmia (Joanna Newsom)</li><li>Beautiful Boyz (CocoRosie)</li><li>Diamond Day (Vashti Bunyan)</li><li>Rats (Devendra Banhart)</li></ul>
