<h1>Freak Folk（フリークフォーク）とは</h1>
<p>2000年代前半に現れた、生楽器を用いながら幻覚的で異形の感覚を追求する音楽である。編成の中心は生ギターだが、そこにハープ、ダルシマー、リコーダー、鐘、ハルモニウム、正体の分からない自作の楽器などが加えられ、標準的な編成という概念</p>
<p>2000年代前半に現れた、生楽器を用いながら幻覚的で異形の感覚を追求する音楽である。編成の中心は生ギターだが、そこにハープ、ダルシマー、リコーダー、鐘、ハルモニウム、正体の分からない自作の楽器などが加えられ、標準的な編成という概念が意図的に崩される。演奏は素朴でありながら、しばしば拍節が曖昧で、途中で調性が滑り落ちるように変化する。持続する低音の上に旋律が漂う構成が好まれ、1960年代末のイギリスの実験的なフォークや、非西洋の音楽の影響が明瞭である。決定的な要素は歌声で、通常の歌唱の規範から大きく外れた、震える声、極端な裏声、子どものような発声、動物の鳴き声に近い音が用いられる。この、生身の身体の癖をそのまま提示する声が、この分野の情緒の中心にある。録音は温かく、テープの質感が残されることが多い。歌詞は自然、動物、植物、夢、神話、身体、そして無垢と不気味さが同居する情景を扱い、意味の通る物語よりも、言葉の連なりとしての手触りが優先される。都会的な洗練を拒み、森や田舎の生活を志向する共同体的な姿勢を伴うことも多い。</p>
<h2>成り立ち</h2><p>この一群を最初に束ねたのは、2003年にイギリスの音楽誌でDavid Keenanが用いた、アメリカの新しい奇妙さという意味の呼称である。彼はアメリカ各地に散在していた、既存の枠に収まらない生楽器の作り手たちを一つの潮流として提示した。彼らに共通していたのは、1960年代末から1970年代前半に存在した、商業的には失敗したが異様に独創的なフォークの作品群への傾倒である。とりわけ、スコットランドのThe Incredible String Bandが実践した、世界中の楽器を無節操に取り込む折衷や、イギリスのVashti Bunyanが1970年に残した、当時ほとんど売れなかった一枚が重要だった。この作品は2000年に再発され、彼女は30年ぶりに音楽の世界へ呼び戻されるという劇的な復活を遂げている。中心的な存在となったのがDevendra Banhartである。彼はテキサスで生まれベネズエラで育ち、震える声と素朴なギターによる録音を自主的に発表し、この分野の象徴となった。カリフォルニアのJoanna Newsomは、ハープを弾きながら独特の癖のある声で歌うという前例のない形式を持ち込み、2006年には管弦楽の編曲を伴う長大な作品を発表して、この分野が高度な音楽性を持ちうることを示した。Animal Collectiveは、フォークの素材を電子的な処理と結合させる方向へ進み、後に全く別の領域へ展開する。CocoRosieは姉妹による奇怪な音響と歌声で独自の位置を占めた。この分野への批判もある。無垢さや素朴さを演出として消費している、中産階級の若者による田舎生活の空想だという指摘である。実際、流行としては2000年代後半に収束した。しかし、生楽器の音を実験の場として再び開いたこと、そして歌声の規範を大きく緩めたことは、その後のインディー音楽に確実な影響を残している。</p>
<h2>代表曲</h2><ul><li>Cripple Crow（Devendra Banhart）</li><li>Peach, Plum, Pear（Joanna Newsom）</li><li>Noah's Ark（CocoRosie）</li><li>Leaf House（Animal Collective）</li><li>Tindersticks（Vetiver）</li></ul>
