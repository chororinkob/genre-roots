<h1>Freak Folk（フリークフォーク）とは</h1>
<p>フリークフォークは、生楽器を使いながら、幻覚のような、いびつで不思議な感覚を追い求める音楽だ。2000年代前半に現れた。 編成の中心は生ギターだ。そこにハープ、ハルモニウム、正体の分からない自作の楽器などが加わる。決まった編成とい</p>
<p>フリークフォークは、生楽器を使いながら、幻覚のような、いびつで不思議な感覚を追い求める音楽だ。2000年代前半に現れた。

編成の中心は生ギターだ。そこにハープ、ハルモニウム、正体の分からない自作の楽器などが加わる。決まった編成という考え方は、わざと崩される。

演奏は素朴だ。free folkの側では、ドローンや即興が重視された。1960年代末のイギリスの実験的なフォークや、非西洋の音楽の影響もうかがえる。

いちばん大事な要素は歌声だ。ふつうの歌い方の決まりごとから大きく外れた、震える声や子どものような発声が使われる。生身の体のクセをそのまま差し出すこの声が、この分野の感情表現の中心にある。録音は温かく、テープの質感が残されることが多い。

歌詞は、自然、動物、植物、夢、神話、身体、そして無垢と不気味さが同居する情景を扱う。意味の通る物語よりも、言葉のつながりが生む感触のほうが大切にされる。都会的な洗練を拒み、森や田舎の生活を目指す姿勢を伴うこともある。</p>
<h2>成り立ち</h2><p>2003年8月、イギリスの音楽誌The Wireに載ったDavid Keenanの記事が、ある動きを「New Weird America(アメリカの新しい奇妙さ)」と呼んで広めた。Keenanが取り上げたのは、バーモント州ブラトルボロのフェスティバル周辺で「free folk」と呼ばれていた動きだった。

ほぼ同じ時期には、Devendra BanhartやJoanna Newsomらの波も現れた。こちらは知名度が高く、商業的にも成功した。ただ、その動きとはほとんど無関係な別系統だという見方がある。一方で、free folkが知られるようになったのは、Devendra Banhartらの人気によるところが大きい、という見方もある。

「free folk」は、2003年5月のフェスティバルでMatt Valentineが使った語である。のちに、より売れた波も含めて「freak folk」と呼ばれるようになった。Jeanette Leechは、今の「freak folk」は「free folk」が変形した語だろうと述べている。2006年には、「free folk」はもう主流の用語ではなくなっていた。なお、「freak folk」という語そのものは、1998年の音楽誌にも用例がある。

彼らは、アメリカ各地に散らばっていた、既存の枠に収まらない生楽器の作り手たちだった。共通していたのは、1960年代末から1970年代前半の、異様に独創的なフォークの作品群(その一部は商業的に振るわなかった)に深く惹かれていたことだ。とりわけ重要だったのが、スコットランドのThe Incredible String Bandが実践した、世界中の楽器を無節操に取り込む折衷だ。そして、イギリスのVashti Bunyanが1970年に残した、当時ほとんど売れなかった一枚である。この作品は2000年に再発され、彼女は30年ぶりに音楽の世界へ呼び戻されるという劇的な復活を遂げた。

中心的な存在となったのがDevendra Banhartだ。彼はテキサスで生まれ、ベネズエラとカリフォルニアで育った。2002年10月、自宅で録った震える声と素朴なギターの録音を、Michael Giraと一緒に一枚にまとめた『Oh Me Oh My…』を、GiraのYoung God Recordsから発売した。これで注目を集め、彼はこの分野の代名詞となった。

カリフォルニアのJoanna Newsomは、ロックやフォークの文脈で、ハープの弾き語りを前面に出した。2006年には管弦楽の編曲を伴う長大な作品を発表し、この分野が高度な音楽性を持ちうることを示した。Animal Collectiveは、フォークの素材を電子的な処理と結びつける方向へ進み、より実験的なポップスへ展開した。CocoRosieは、姉妹による奇怪な音響と歌声で、独自の位置を占めた。

一方で、この分野への批判もある。批評家のKandia Crazy Horseは、担い手が白人中心であることや、時代がかった装い(農民風の衣装など)が疎外感を与える、と指摘した。実際、流行としては2005年までに飽和していたとされる。2006年のJoanna Newsom『Ys』を頂点として燃え尽き、2000年代半ばには、より広いインディー・フォークに吸収されたとされる。

それでも、生楽器の音を実験の場として再び開いたこと、そして歌声の決まりごとを大きく緩めたことは、その後のインディー音楽に確実な影響を残している。</p>
