<h1>Jersey Club（ジャージークラブ）とは</h1>
<p>アメリカ・ニュージャージー州ニューアークで生まれた、極めて速く断片的なダンス音楽である。テンポは概ね130から140 BPM。最大の特徴はキックの配置にあり、四つ打ちではなく、五つの打点を一組として、三連続で打った後に一拍休み、ま</p>
<p>アメリカ・ニュージャージー州ニューアークで生まれた、極めて速く断片的なダンス音楽である。テンポは概ね130から140 BPM。最大の特徴はキックの配置にあり、四つ打ちではなく、五つの打点を一組として、三連続で打った後に一拍休み、また二連続で打つという独特の型が用いられる。この不均等な塊が延々と反復されることで、つんのめるような、あるいは息を切らすような独特の推進力が生まれる。もうひとつの核が声の扱いである。既存のポップスやリズム・アンド・ブルースの歌の一節が、極めて短い断片に切り刻まれ、吃音のように連続して繰り返される。同じ音節が10回以上連打されることも珍しくなく、言葉は意味を失って打楽器と化す。この、機械的な連打によって元の曲の記憶を呼び起こしながら破壊するという手法が快感の核心である。加えて、寝台の軋む音や銃の撃鉄を起こす音といった、特定の効果音が定型として共有されている。上物は最小限で、和声の動きはほとんどない。曲は2分から3分と短く、構成は反復のみである。特定の踊りと不可分に結びついており、現場での機能が全てを規定している。</p>
<h2>成り立ち</h2><p>直接の母体は、1990年代のメリーランド州ボルティモアで発達したクラブ音楽である。この街では、ハウスの速度に既存の楽曲の断片を大量に貼り付ける独特の様式が確立していた。2000年前後、ニューアークのDJ Tameilがこの音楽を持ち帰り、地元の若者に伝えたことが起点となる。彼を中心とする集団が形成され、ボルティモアの型を土台にしながら、より速く、より細かく刻む方向へ独自に発展させた。この音楽が根づいたのは、ニューアークという都市の条件と不可分である。ニューヨークに隣接しながら経済的に取り残され、若者の娯楽の場が限られていたこの街で、この音楽は高校のダンスパーティーと地域の集まりを支える実用的な音楽として機能した。流通は正規の経路をほとんど経ず、自作の音源を直接手渡しし、あるいは初期の交流サイトを通じて共有するという形で広まっている。演者はほぼ全員が10代から20代前半で、多くは制作を独学で覚えた。2010年前後、この音楽は外部の注目を集め始める。DJ Sliinkらが国際的に演奏するようになり、アメリカの大手のダンス音楽のレーベルがこの様式を取り込んだ。この過程では、地元の作り手に利益が還元されないという不満も生じている。女性の作り手としてUNIIQU3が重要な存在となり、彼女はこの分野の女王と称されつつ、その起源が黒人の共同体にあることを繰り返し主張してきた。2020年前後、短編動画の共有サービスにおいて、この様式の楽曲が踊りの伴奏として爆発的に使われるようになり、無名だった作り手の楽曲が世界的なヒットとなる事例が続出した。20年にわたり地元に留まっていた音楽が、動画の流行によって突然世界へ届いたという経緯は、現代の音楽の流通のあり方を象徴している。</p>
