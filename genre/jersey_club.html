<h1>Jersey Club（ジャージークラブ）とは</h1>
<p>ジャージー・クラブは、アメリカ・ニュージャージー州ニューアークで生まれた、非常に速く、細切れのダンス音楽だ。 上物（メロディーなど上に重ねる音）は最小限で、和声（コードの響き）の動きはほとんどない。 テンポはおおむね130から14</p>
<p>ジャージー・クラブは、アメリカ・ニュージャージー州ニューアークで生まれた、非常に速く、細切れのダンス音楽だ。

上物（メロディーなど上に重ねる音）は最小限で、和声（コードの響き）の動きはほとんどない。

テンポはおおむね130から140 BPM。最大の特徴はキックの配置にある。四つ打ちではなく、1小節に5つのキックを置く独特の型を使う。最初の2発は1拍分（4分音符）、続く2発は1拍の4分の3（付点8分音符）、最後の1発は半拍（8分音符）の間隔で並ぶ。この不均等な塊が延々と繰り返されることで、つんのめるような、あるいは息を切らすような、前へ進む独特の勢いが生まれる。

もうひとつの柱が、声の扱いだ。既存のヒップホップやR&amp;B（時にポップス）の歌の一節が、ごく短い断片に切り刻まれ、吃音のように連続して繰り返される。1〜2音節の短い断片が短く繰り返され、ボーカル断片がリズムとフックの両方を担う。機械的な連打で元の曲の記憶を呼び起こしながら、同時に壊していく。この手法こそが、快感の中心である。

さらに、寝台の軋む音のような特定の効果音が、定型として共有されている。銃の撃鉄を起こす音が使われることもある。

2分前後の短い曲が目立ち、反復が中心だが、ドロップやブレイクを持つ曲もある。特定の踊りと切り離せないほど強く結びついており、現場での役割がすべてを決めている。</p>
<h2>成り立ち</h2><p>ジャージー・クラブは、1990年代のメリーランド州ボルティモアで発達したクラブ音楽から強い影響を受け、ニューアーク地元のハウス文化（Jersey Sound）ともつながっている。ボルティモアでは、ハウスの速さに既存の曲の断片を大量に貼り付ける、独特のスタイルが定着していた。

1999〜2000年ごろ、DJ Tameil（とTim Dolla）が、ボルティモアのレコードをニューアークに持ち込んでかけ始めた。2001年ごろにはTameilが自作を発表し、同じころTim Dolla、Mike V（Brick Bandits）も自作を始めた。両者は当初は競い合ったが、のちにTameilが合流した。2002年には&quot;Brick City club&quot;という呼び名が生まれた。彼らを中心に集団ができ、ボルティモアの荒々しさを滑らかにする方向へ、独自に発展させていった。

この音楽が根づいたのは、ニューアークという街の条件と切り離せない。ニューヨークのすぐ隣にありながら経済的に取り残され、若者の娯楽の選択肢が少ない地域もあった。この街で、この音楽は、高校のダンスパーティーや地域の集まりを支える実用的な音楽として働いた。流通は正規のルートをほとんど通らなかった。自作の音源を直接手渡ししたり、初期の交流サイトで共有したりする形で広まった。演者には若者が多かった。

2010年までに、Cashmere CatやLidoなど、他のシーンの制作者が影響を受けた。DJ Sliinkの国際的な活動とMad Decentでの出演は2013年ごろ、Skrillex／OWSLAの支援は2016年以降である。女性の作り手としては、UNIIQU3が重要な存在となった。彼女はこの分野の女王と呼ばれ、黒人音楽のルーツと黒人コミュニティによる所有を強調している。

2020年前後には、短編動画の共有サービスで、このスタイルの曲が踊りの伴奏として爆発的に使われるようになった。Cookiee Kawaii『Vibe』（2019年発表、2020年にTikTokで拡散）は、全国的なヒットとなった。海外に広がっていた音楽が、動画の流行で再び世界に広がった。この経緯は、現代の音楽の流通のあり方をよく表している。</p>
