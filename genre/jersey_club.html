<h1>Jersey Club（ジャージークラブ）とは</h1>
<p>アメリカ・ニュージャージー州ニューアークで生まれた、非常に速く、細切れのダンス音楽である。テンポは概ね130から140 BPM。最大の特徴はキックの配置にあり、四つ打ちではなく、1小節に5つのキックを置く独特の型が用いられ、最初の</p>
<p>アメリカ・ニュージャージー州ニューアークで生まれた、非常に速く、細切れのダンス音楽である。テンポは概ね130から140 BPM。最大の特徴はキックの配置にあり、四つ打ちではなく、1小節に5つのキックを置く独特の型が用いられ、最初の2発は1拍分（4分音符）、続く2発は1拍の4分の3（付点8分音符）、最後の1発は半拍（8分音符）の間隔で並ぶ。この不均等な塊が延々と反復されることで、つんのめるような、あるいは息を切らすような独特の前へ進む勢いが生まれる。もうひとつの核が声の扱いである。既存のポップスやリズム・アンド・ブルースの歌の一節が、極めて短い断片に切り刻まれ、吃音のように連続して繰り返される。1〜2音節の短い断片が短く繰り返され、言葉は意味を失って打楽器と化す。この、機械的な連打によって元の曲の記憶を呼び起こしながら破壊するという手法が快感の核心である。加えて、寝台の軋む音や銃の撃鉄を起こす音といった、特定の効果音が定型として共有されている。上物（メロディーなど上に重ねる音）は最小限で、和声（コードの響き）の動きはほとんどない。曲は多くが1〜2分台と短く、反復が中心だが、ドロップやブレイクを持つ曲もある。特定の踊りと切り離せないほど結びついており、現場での役割が全てを決めている。</p>
<h2>成り立ち</h2><p>直接の母体は、1990年代のメリーランド州ボルティモアで発達したクラブ音楽である。この街では、ハウスの速度に既存の楽曲の断片を大量に貼り付ける独特の様式が確立していた。1999年から2000年ごろ、ニューアークのDJ Tameilらブリック・バンディッツの面々が、ボルティモアのレコードを持ち込んで始めたことが起点となる。彼らを中心とする集団が形成され、ボルティモアの荒々しさを滑らかにする方向へ独自に発展させた。この音楽が根づいたのは、ニューアークという都市の条件と切り離せない。ニューヨークに隣接しながら経済的に取り残され、若者の娯楽の場が限られていたこの街で、この音楽は高校のダンスパーティーと地域の集まりを支える実用的な音楽として機能した。流通は正規の経路をほとんど経ず、自作の音源を直接手渡しし、あるいは初期の交流サイトを通じて共有するという形で広まっている。若い演者が多かった。2010年前後、この音楽は外部の注目を集め始める。DJ Sliinkらが国際的に演奏するようになり、Cashmere CatやLidoといった他の場の制作者がこの音に影響を受け、Mad DecentやSkrillexが支援した。女性の作り手としてUNIIQU3が重要な存在となり、彼女はこの分野の女王と称されつつ、その起源が黒人の共同体にあることを繰り返し主張してきた。2020年前後、短編動画の共有サービスにおいて、この様式の楽曲が踊りの伴奏として爆発的に使われるようになり、無名だった作り手の楽曲が世界的なヒットとなる例が相次いだ。2010年前後から海外に広がっていた音楽が、動画の流行によって再び世界的に広がったという経緯は、現代の音楽の流通のあり方を象徴している。</p>
