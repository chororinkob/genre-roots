<h1>Marrabenta（マラベンタ）とは</h1>
<p>マラベンタは、モザンビークの首都マプトを中心に発展した、都市のダンス音楽だ。 初期は、生ギターや自作のギターが中心だった。1970〜80年代以降は、エレキギター、ベース、ドラム、ホーンをそろえたバンド編成が一般的になった。 軽快で</p>
<p>マラベンタは、モザンビークの首都マプトを中心に発展した、都市のダンス音楽だ。

初期は、生ギターや自作のギターが中心だった。1970〜80年代以降は、エレキギター、ベース、ドラム、ホーンをそろえたバンド編成が一般的になった。

軽快で、シンコペーションの効いたギターのパターンが特徴とされる。これは、ポルトガル民謡や現地の踊りのリズムなどを、後から入ってきたギターに移し替えたものとされる。ギター同士の掛け合いも指摘される。

リズムの土台は、ロンガ人やシャンガーナ人など、南部モザンビークの民族の踊りのリズムだ。速く、前へ押し出すような躍動感が特徴である。速めの4拍子で演奏されることが多く、踊るための音楽として作られている。

歌われる言葉は、シャンガーナ語やロンガ語といった現地の言語が中心で、ポルトガル語が混ざることもある。歌詞は、恋愛や日常の出来事、社会批判を扱う。

独立後、FRELIMO政権は「Operation Production」(1983年〜)の一環として、マプトの多くのナイトクラブを閉鎖した。マラベンタは都市の娯楽音楽として、「本物のモザンビーク音楽」の枠から外された。</p>
<h2>成り立ち</h2><p>マラベンタは、1930〜40年代に生まれ、1950年代に近代的なダンス音楽として定着したとされる。舞台は、当時ロレンソ・マルケスと呼ばれていた植民地の都市である。

郊外に暮らすアフリカ人労働者の間で、ポルトガルのファドや教会音楽が、現地の伝統的な踊りの拍と混ざり合った。南アフリカのクェラは、出稼ぎを通じて後から加わった影響である。アンゴラのメレンゲなどとの似た点も指摘される。

名前の由来には諸説ある。ポルトガル語で「壊す」を意味する語からきている、という説がある。当時は正規の楽器を買えず、油の空き缶で自作したギターを使う演奏者がいた。演奏に熱が入ると楽器が壊れることから、この名が付いたと語られている。自作の楽器で演奏した、初期のこうした事情が語られる。

ファニー・ムプフモ（Fany Mpfumo）は、初期を代表する歌手だ。1940〜50年代にヨハネスブルグで活動したが、活動を始めた時期には諸説がある。1960年代にモザンビーク国内のラジオで認められ、1964年にはラジオの「King of Radio」に選ばれた。マラベンタのリズムとジャズの要素、南アフリカのクェラの影響を融合させた作風で知られる。

1975年の独立後、この音楽への評価は一様ではなかったが、のちに国民的な音楽として位置づけられた。ムプフモは独立後、生活に苦労し、1987年に亡くなった。

しかし、独立後まもない1977年に内戦が始まり、1992年まで続いた。内戦下の1979年には、ラジオ局の専属楽団としてオルケストラ・マラベンタ・スター・デ・モザンビークが結成された。独立後のFRELIMO政権は「Operation Production」(1983年〜)の一環として、マプトの多くのナイトクラブを閉鎖し、音楽活動は大きく制限された。マラベンタは都市の娯楽音楽として、「本物のモザンビーク音楽」の枠から外された。

内戦期には、電子楽器やディストーションの導入が進んだ。戦後は音楽産業の再建が難航した。それでも2000年前後からは、ヒップホップ世代との融合が見られる。

現在では、モザンビークを代表する国民的な音楽とされる。</p>
