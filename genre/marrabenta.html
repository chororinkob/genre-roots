<h1>Marrabenta（マラベンタ）とは</h1>
<p>モザンビークの首都マプトを中心に発展した、都市的なダンス音楽である。編成はエレキギターを中心に、ベース、打楽器、そして管楽器が加わることもある。最大の特徴はギターの弾き方で、和音を押さえながら旋律を同時に紡ぐ独特の奏法が用いられる</p>
<p>モザンビークの首都マプトを中心に発展した、都市的なダンス音楽である。編成はエレキギターを中心に、ベース、打楽器、そして管楽器が加わることもある。最大の特徴はギターの弾き方で、和音を押さえながら旋律を同時に紡ぐ独特の奏法が用いられる。これは、伝統的な弦楽器や親指ピアノの奏法を、後から入ってきたギターに移し替えたものである。リズムは南部モザンビークのシャンガーナ系の民族に伝わる踊りの型を土台とし、六拍を二つと三つに分けるような不均等な区切りを持つ。この拍の癖が、西洋のポピュラー音楽の四拍子とは異なる歩みを生む。テンポは中庸から速めで、踊るための音楽として設計されている。歌唱は複数人による掛け合いが基本で、一人が歌い出し、他が応答するという構造を取る。使われる言語はシャンガーナ語やロンガ語といった現地の言語が中心で、ポルトガル語が混ざることもある。歌詞は恋愛や日常の出来事を扱う一方、植民地時代には検閲を避けるために比喩や隠語を用いて社会批判を織り込む技法が発達した。表面上は他愛のない歌に聞こえるものが、実際には支配への当てこすりであるという二重構造を持つ曲が数多く残されている。</p>
<h2>成り立ち</h2><p>成立は1930年代から50年代にかけての、当時ロレンソ・マルケスと呼ばれていた植民地都市である。この時期、周辺の農村から労働者が流入し、また多くの男性が隣接する南アフリカの鉱山へ出稼ぎに出ていた。彼らが持ち帰った南アフリカの都市音楽、そして無線を通じて届いていたキューバやポルトガルの音楽が、現地の伝統的な踊りの拍と混ざり合った。名称の由来については、ポルトガル語で壊すことを意味する語からきているという説がある。当時の演奏者は正規の楽器を買えず、油の空き缶と釣り糸で自作したギターを使っていた。演奏に熱が入ると楽器が壊れることから、この名が付いたと語られている。楽器を自作するところから始まったという出自が、この音楽の性格を決めている。植民地当局はこの音楽を警戒した。人々が集まって踊り歌う場は、政治的な集会に転じうると見なされたためである。実際、歌詞には検閲をかいくぐるための暗号的な表現が発達した。1960年代から70年代にかけては、独立闘争と結びついて抵抗の歌としての性格を強める。1975年の独立後、新政権はこの音楽を国民文化の象徴として位置づけた。この時期の中心人物がファニー・ムパフォで、粗削りな歌声と即興的な語りで最も知られた存在となった。またオルケストラ・マラベンタ・スター・デ・モザンビークが結成され、国外での演奏も行われた。しかし独立後まもなく始まった内戦は1992年まで続き、音楽活動は大きく制限される。多くの演奏者が国外へ去り、録音の多くも失われた。1990年代以降は復興が進み、若い世代が電子音を取り入れた解釈を行っている。現在ではモザンビークを代表する音楽として、国の文化的な象徴の位置を占めている。</p>
