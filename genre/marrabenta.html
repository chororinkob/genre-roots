<h1>Marrabenta（マラベンタ）とは</h1>
<p>モザンビークの首都マプトを中心に発展した、都市的なダンス音楽である。編成はエレキギターを中心に、ベース、打楽器、そして管楽器が加わることもある。最大の特徴はギターの弾き方で、和音を押さえながら旋律を同時に紡ぐ独特の奏法が用いられる</p>
<p>モザンビークの首都マプトを中心に発展した、都市的なダンス音楽である。編成はエレキギターを中心に、ベース、打楽器、そして管楽器が加わることもある。最大の特徴はギターの弾き方で、和音を押さえながら旋律を同時に紡ぐ独特の奏法が用いられる。これは、ポルトガル民謡や現地の踊りのリズムなどを、後から入ってきたギターに移し替えたものとされる。リズムは南部モザンビークのシャンガーナ系の民族に伝わる踊りの型を土台とする。速く、前へ押し出すような躍動感が特徴で、4拍子で捉えられることが多い。テンポは中庸から速めで、踊るための音楽として設計されている。歌唱は複数人による掛け合いが基本で、一人が歌い出し、他が応答するという構造を取る。使われる言語はシャンガーナ語やロンガ語といった現地の言語が中心で、ポルトガル語が混ざることもある。歌詞は恋愛や日常の出来事を扱う。独立後の内戦期(1977年〜)には、政府がこの音楽を反対意見の表現の場とみなして、多くの会場を閉鎖した。</p>
<h2>成り立ち</h2><p>1930〜40年代に成立し、1950年代に近代的なダンス音楽として定着した。舞台は、当時ロレンソ・マルケスと呼ばれていた植民地都市である。この時期、周辺の農村から労働者が流入した。ポルトガルのファドや教会音楽、南アフリカのクェラ、アンゴラのメレンゲなどが、現地の伝統的な踊りの拍と混ざり合った。名称の由来については、ポルトガル語で壊すことを意味する語からきているという説がある。当時の演奏者は正規の楽器を買えず、油の空き缶で自作したギターを使っていた。演奏に熱が入ると楽器が壊れることから、この名が付いたと語られている。楽器を自作するところから始まったという出自が、この音楽の性格を決めている。ファニー・ムパフォは、1950年代にヨハネスブルグで活動を始め、1960年代に人気を得た初期を代表する歌手で、1964年にはラジオの「King of Radio」に選ばれた。マラベンタのリズムとジャズの要素、南アフリカのクェラの影響を融合させた作風で知られる。1975年の独立後の評価は一様でなく、のちに国民的な音楽として位置づけられた。ムパフォは独立後、生活に苦労し、1987年に没した。また1979年には、ラジオ局の専属楽団としてオルケストラ・マラベンタ・スター・デ・モザンビークが結成された。しかし独立後まもなく(1977年)始まった内戦は1992年まで続き、政府が反対意見の表現の場とみなして多くの会場を閉鎖するなど、音楽活動は大きく制限される。1990年代以降は復興が進み、若い世代が電子音を取り入れた解釈を行っている。現在ではモザンビークを代表する音楽として、国の文化的な象徴の位置を占めている。</p>
