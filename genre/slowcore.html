<h1>Slowcore（スローコア）とは</h1>
<p>スローコアは、テンポを極限まで落とし、音の数を減らし、沈黙そのものを曲の要素として扱うロックだ。 テンポは非常にゆっくりで、一つの和音が鳴ってから次の和音へ移るまでに、数秒の間が空くこともあるとされる。この空白の時間に、聴き手は音</p>
<p>スローコアは、テンポを極限まで落とし、音の数を減らし、沈黙そのものを曲の要素として扱うロックだ。

テンポは非常にゆっくりで、一つの和音が鳴ってから次の和音へ移るまでに、数秒の間が空くこともあるとされる。この空白の時間に、聴き手は音の余韻が消えていく様子や、演奏者の呼吸、機材の雑音までを聴き取れるとされる。

ギターは、静かで遅い曲が多い。ただし、歪みやファズを併用するバンドも多い。ベースは、低音を一音ずつ丁寧に置く。ドラムでは、Lowのドラマーが、スネア、フロアタム、シンバル各1つの最小限のキットを、ほぼブラシで叩いた。マレットも使った。

音量が極端に小さく保たれるのは、Low初期など一部の特徴に限られる。そのため、わずかな音量の増加が劇的な効果を持つ。

歌い方は、囁くように、あるいは平坦に歌われる。男女の声を重ねる場合は、近い音程で寄り添わせることが多い。

歌詞は、喪失、病、信仰、日常の閉塞といった主題を、説明を省いた断片として示す。曲は5分から10分に及ぶこともあり、展開はほとんどない。

聴き手に忍耐を求めるこの遅さについて、グランジへの対抗姿勢を語るバンド（CodeineのImmerwahr、Lowなど）もいた。ただし、これは全体に共通する理念ではない。</p>
<h2>成り立ち</h2><p>舞台は、1980年代末から1990年代前半のアメリカだ。

この音楽は、1980年代後半から90年代にかけて、グランジなど大音量のロックが勢いを増すなか、その対極として各地で現れた。

ニューヨークのCodeineは、1990〜91年（欧州先行、米Sub Popは1991年5月）に発表したFrigid Stars LPで、演奏を極限まで遅くし、音と音の間に長い空白を置く方法を示した。Stephen Immerwahrは、2012年のインタビューで、この呼称を「おかしなラベル」と述べている。嫌悪を示す発言は確認できないが、この作品は後に続く者たちに大きな影響を与えた。

ボストンでは、Galaxie 500が、制作者Kramerとの共同作業により、単純な演奏に深い残響をかけた、浮遊感のある作品を残した。

ジャンルの典型的な音を確立した代表的存在の一つが、ミネソタ州ダルースのLowである。1993年、Alan SparhawkとJohn Nicholsが冗談半分に思いついた「静かで遅い」バンドに、Sparhawkの妻Mimi Parkerがドラムで加わって結成された。2人はモルモン教徒(末日聖徒イエス・キリスト教会の会員)である。彼らは30年近く活動を続け、後年には電子的な歪みを大胆に取り入れて作風を新しくした。しかし2022年にMimi Parkerが癌で亡くなり、活動は終わった。

テキサス州ダラスのBedhead、アトランタで結成されのちサンフランシスコへ移ったRed House Painters、カリフォルニア州サンノゼのDusterらが、それぞれの土地で似た方向を追い求めている。

スローコア、あるいは悲しみのコアといった呼称の由来には諸説あり、記者の命名説のほか、友人の冗談とするSparhawk証言もある。当事者には不評だったとされる(Bedheadの Matt Kadaneは「侮辱だった」と述べている)。多くのバンドは、一部の熱心なファンに支えられる人気にとどまった(Codeineは最後の1年半は収入で生活費をまかなえたと述べている)。

しかし2010年代以降、インターネット上でこれらの作品が再発見された。とりわけ、無名に近かったDusterのようなバンドが、若い世代の間で熱狂的な支持を得るという逆転が起きている。静けさと余白を武器にするという発想は、現代のインディー系の音楽に、その影響が見られるとされる。</p>
