<h1>Slowcore（スローコア）とは</h1>
<p>テンポを極限まで落とし、音の数を減らし、沈黙そのものを構成要素として扱うロックである。テンポは概ね40から70 BPMと、通常のポップスの半分以下であり、一つの和音が鳴ってから次の和音へ移るまでに数秒の間が空く。この空白の時間に、</p>
<p>テンポを極限まで落とし、音の数を減らし、沈黙そのものを構成要素として扱うロックである。テンポは概ね40から70 BPMと、通常のポップスの半分以下であり、一つの和音が鳴ってから次の和音へ移るまでに数秒の間が空く。この空白の時間に、聴き手は音の減衰や、演奏者の呼吸、機材の雑音までを聴き取ることになる。ドラムは通常の叩き方をせず、ブラシや柔らかい撥を用い、大太鼓と小太鼓を一打ずつ置くだけということも多い。シンバルはほとんど使われない。ギターは歪ませず、澄んだ単音か、簡素な和音を長く伸ばして鳴らす。ベースは低音を一音ずつ丁寧に置く。編成全体の音量が極端に小さく保たれるため、わずかな音量の増加が劇的な効果を持つ。歌唱は囁くように、あるいは平坦に歌われ、男女の声を重ねる場合は近い音程で寄り添わせることが多い。歌詞は喪失、病、信仰、日常の閉塞といった主題を、説明を省いた断片として提示する。曲は5分から10分に及ぶこともあり、展開はほとんどない。聴き手に忍耐を要求するこの遅さは、当時主流だった大音量の音楽への意識的な反対物として選ばれたものである。</p>
<h2>成り立ち</h2><p>1980年代末から1990年代前半のアメリカが舞台である。当時、シアトルを中心とするグランジが世界的な流行となり、ロックといえば歪んだギターの大音量を意味していた。この状況に対して、正反対の方向を選ぶ作り手が複数の場所でほぼ同時に現れた。ニューヨークのCodeineは1990年に発表した作品で、演奏を極限まで遅くし、音と音の間に長い空白を置くという方法を提示した。彼らは自分たちの音楽をこう呼ばれることを嫌ったが、この作品は後続の直接の教科書となる。ボストンではGalaxie 500が、制作者Kramerとの共同作業により、単純な演奏に深い残響をかけた浮遊感のある作品を残した。最も長く影響を持ち続けたのはミネソタ州ダルースのLowである。1993年、Alan SparhawkとMimi Parkerの夫婦が、周囲の大音量への反発から、意図的に極端に静かで遅い音楽を演奏するバンドを結成した。二人はモルモン教徒であり、その信仰と、寒冷な地方都市の生活が音楽の質感に反映されていると繰り返し指摘されている。彼らは30年近く活動を続け、後年には電子的な歪みを大胆に導入して作風を刷新したが、2022年にMimi Parkerが癌により死去し、活動は終わった。テキサス州ダラスのBedhead、サンフランシスコのRed House Painters、ニュージャージーのDusterらが、それぞれの土地で似た方向を追求している。スローコア、あるいは悲しみのコアといった呼称は、いずれも音楽誌が便宜的に付けたもので、当事者に受け入れられたことはほとんどない。商業的な成功とは無縁で、多くのバンドは数百人規模の会場で活動を終えた。しかし2010年代以降、インターネット上でこれらの作品が再発見され、とりわけDusterのような無名に近かったバンドが、若い世代の間で熱狂的な支持を得るという逆転が起きている。静けさと余白を武器にするという発想は、現在のインディーロックやアンビエントに広く浸透している。</p>
