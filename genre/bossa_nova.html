<h1>Bossa Nova（ボサノバ）とは</h1>
<p>ボサノヴァは、ブラジルのサンバのリズムを、極端に抑制された室内楽的（小さな編成の落ち着いた）な響きへ翻訳した音楽だ。 編成は小規模だ。ナイロン弦のクラシック・ギター、歌、ピアノ、控えめなドラムとベース、そして時にフルートやサックス</p>
<p>ボサノヴァは、ブラジルのサンバのリズムを、極端に抑制された室内楽的（小さな編成の落ち着いた）な響きへ翻訳した音楽だ。

編成は小規模だ。ナイロン弦のクラシック・ギター、歌、ピアノ、控えめなドラムとベース、そして時にフルートやサックスが加わる。

最大の特徴は、ギターの奏法にある。親指が低音を1拍目・2拍目に置き、他の指が和音を1拍目の2つの8分音符と、2拍目の2つ目の16分音符で弾く。2小節単位では、シンコペーション（拍の位置をずらす）が入る。サンバのアンサンブルを一人で模したという（Oscar Castro-Nevesの証言）。

和声（コードの響き）が、最も高度な要素だ。7度、9度、11度、13度を含む拡張和音、減和音（不安定な響きの和音）の経過的な使用、そして半音で下降するベースの動きが多用される。ジャズ和声と共通する洗練を持つ（ジャズ由来とする見方には異論があり、サンバの伝統との並行進化とする説もある）。旋律は音域が狭い。同じ音を反復しながら、和声だけが変化していくような作り方の曲もある。

テンポは中庸だが、和声の動きは細かい。歌い方が落ち着いているため、穏やかに聞こえる。代表曲のChega de Saudadeは約87〜88BPM（自動解析による。拍の取り方により倍速とも解釈できる）。

歌唱は囁くように小さく、ビブラート（声を細かく震わせること）をかけず、マイクに近づいて歌うとも言われる。この新しい歌唱法は、当初「音程が外れている」と受け取られることもあった。しかし実際の音程は正確だった。

歌詞は、海、太陽、恋、そして愁いを、日常的な言葉で簡潔に描く。</p>
<h2>成り立ち</h2><p>1958年前後、ブラジル・リオデジャネイロの南部（コパカバーナなど）で、中産階級の若者を中心にボサノヴァは生まれた。

しばしば最初のボサノヴァ録音とみなされるのは、1958年に歌手João Gilbertoが録音したChega de Saudadeだ。この曲は、Elizeth Cardosoが先に録音している。Elizeth版の録音は1958年4月とされる（1957年とする資料もある）。Gilbertoはギターで参加した。作曲はAntônio Carlos Jobim、作詞はVinícius de Moraesだった。

João Gilbertoが固めたギターの奏法と囁くような歌唱が、この音楽の技術的な核をなす。彼はこの奏法を完成させるまで、ミナスジェライス州ディアマンティーナの姉夫妻の家に滞在した。時期は1955〜56年ごろ（資料により異なる）で、7〜8か月とする資料が多い。浴室の音響を利用したと伝えられる。

Antônio Carlos Jobimは、ドイツ生まれの作曲家Hans-Joachim Koellreutterに、1941年ごろからピアノや作曲などを学んだ。Villa-Lobosらブラジル近代音楽の伝統も背景に持ち、洗練された和声を大衆音楽に持ち込んだ。詩人であり外交官でもあったVinícius de Moraesは、1956年の戯曲Orfeu da Conceiçãoを通じて、この動きに文学的な格を与えた。その戯曲は、1959年の映画『黒いオルフェ』（Marcel Camus監督）の原作となった。映画の音楽を通じて、ボサノヴァが海外に知られた。

1962年に作られたGarota de Ipanema、すなわちイパネマの娘は、1963年3月に録音された。João Gilberto、Antônio Carlos Jobim、そして米国のサックス奏者Stan Getzによるアルバムで、英語詞とともに録音され、1964年に発売された。この曲は、世界的な大流行を引き起こした。アルバム版では、Joãoがポルトガル語、João Gilbertoの妻Astrud Gilbertoが英語を歌った。1964年のシングル版は、Joãoのパートが削られた。プロの歌手ではなかった彼女は、英語で歌える唯一の人物として、録音の場で起用された。経緯は、当事者の証言が割れている。

しかし、この国際的な成功と裏腹に、ブラジル国内では1964年の軍事クーデターで政治状況が一変した。音楽家たちは、より直接的な社会批判を求められるようになる。階級意識や政治性に乏しいという批判があり、国内ではMPBやトロピカリアに押された。

João Gilbertoは晩年、極端に人前に出ることを避けた。2019年に88歳で亡くなった。</p>
