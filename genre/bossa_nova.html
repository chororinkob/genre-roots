<h1>Bossa Nova（ボサノバ）とは</h1>
<p>ブラジルのサンバのリズムを、極端に抑制された室内楽的な響きへ翻訳した音楽。編成はナイロン弦のクラシック・ギター、歌、ピアノ、控えめなドラムとベース、そして時にフルートやサックスという小規模なもの。最大の特徴はギターの奏法にあり、親</p>
<p>ブラジルのサンバのリズムを、極端に抑制された室内楽的な響きへ翻訳した音楽。編成はナイロン弦のクラシック・ギター、歌、ピアノ、控えめなドラムとベース、そして時にフルートやサックスという小規模なもの。最大の特徴はギターの奏法にあり、親指が低音弦で二拍のパターンを刻む一方、他の指が和音をシンコペーションのずれた位置で弾く。この右手だけでリズムと和声を同時に担う様式は、サンバの打楽器隊の複雑な絡みを一人で圧縮したものである。和声が最も高度な要素で、七度、九度、11度、13度を含む拡張和音、減和音の経過的な使用、そして半音で下降するベースの動きが多用され、ジャズの語彙に匹敵する洗練を持つ。BPMは100〜140程度だが、体感は穏やかで、決して急がない。旋律は音域が狭く、同じ音を反復しながら和声だけが変化していく書法が好まれる。歌唱は囁くように小さく、ビブラートをかけず、マイクに近づいて歌う。この感情を抑えた歌い方が、当時のブラジルでは歌えていないと批判されもした。歌詞は海、太陽、恋、そして愁いを、日常的な言葉で簡潔に描く。</p>
<h2>成り立ち</h2><p>1958年前後、ブラジル・リオデジャネイロの南部、コパカバーナやイパネマといった中産階級の海辺の地区で生まれた。決定的な出発点は1958年、歌手João Gilbertoが録音したChega de Saudadeで、作曲はAntônio Carlos Jobim、作詞はVinícius de Moraesだった。João Gilbertoが確立したギターの奏法と囁くような歌唱が、この音楽の技術的な核をなす。彼はこの奏法を完成させるまで、バイーアの兄の家の浴室にこもって数か月間練習を続けたという逸話が伝えられている。Antônio Carlos Jobimは、ドイツ生まれの作曲家Hans-Joachim Koellreutterに学んだ和声の知識と、Villa-Lobosらブラジル近代音楽の伝統を背景に持ち、洗練された和声を大衆音楽に持ち込んだ。詩人であり外交官でもあったVinícius de Moraesは、1956年の劇作Orfeu da Conceição、そしてその映画版である1959年の黒いオルフェを通じて、この動きに文学的な威信を与えた。1962年、リオのクラブで生まれたGarota de Ipanema、すなわちイパネマの娘は、1964年にJoão Gilberto、Antônio Carlos Jobim、そして米国のサックス奏者Stan Getzによるアルバムで英語詞とともに録音され、世界的な大流行を引き起こした。歌ったのはJoão Gilbertoの妻Astrud Gilbertoで、プロの歌手ではなかった彼女が英語部分を歌ったことが、偶然この曲の性格を決めた。しかしこの国際的な成功と裏腹に、ブラジル国内では1964年の軍事クーデターにより政治状況が一変し、音楽家たちはより直接的な社会批判を求められるようになった。ボサノヴァの洗練は中産階級の現実逃避だという批判が起こり、シーンはトロピカリアやMPBへ移行していく。João Gilbertoは晩年、極端に人前に出ることを避け、2019年に88歳で亡くなった。</p>
<h2>代表曲</h2><ul><li>Chega de Saudade（João Gilberto）</li><li>The Girl from Ipanema（Antonio Carlos Jobim, João Gilberto, Astrud Gilberto）</li><li>Desafinado（João Gilberto）</li><li>Corcovado（Antonio Carlos Jobim）</li><li>Águas de Março（Elis Regina &amp; Tom Jobim）</li></ul>
