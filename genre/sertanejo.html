<h1>Sertanejo（セルタネージョ）とは</h1>
<p>ブラジルの内陸農村部に由来し、現在は同国最大の市場を持つ大衆音楽である。原型となる古い様式では、2人組(多くは兄弟)による歌唱が中心である。2人の歌手が主に3度(場合により6度)の音程で平行に歌うという書法で、この寄り添う2声の響</p>
<p>ブラジルの内陸農村部に由来し、現在は同国最大の市場を持つ大衆音楽である。原型となる古い様式では、2人組(多くは兄弟)による歌唱が中心である。2人の歌手が主に3度(場合により6度)の音程で平行に歌うという書法で、この寄り添う2声の響きがこの音楽の特徴である。伴奏の中心は10弦のビオラ・カイピラという撥弦楽器で、五組の複弦を張り、地域ごとに異なる調弦が用いられる。この楽器が刻む、和音を一音ずつ順に弾く伴奏（分散和音）の上に、2声の歌が乗る。拍子は3拍子や2拍子のものがある。歌詞は農村の生活、牛追い、干ばつ、故郷を離れる哀しみ、そして素朴な恋愛を扱う。20世紀後半以降の現代的な形態は大きく異なる。編成に手風琴、ドラム、エレクトリックギター、シンセサイザーが加わり、アメリカのカントリー・ロックに近い制作が施される。2声の平行という原則は保たれることが多いが、旋律はより広い音域を使い、感情の頂点で転調する曲もある。歌詞も都市の恋愛と失恋へ移り、苦しみを大げさに歌い上げる作風も目立つ。</p>
<h2>成り立ち</h2><p>起源は、植民地期のサンパウロ地域の内陸農村に伝わるカイピラ音楽にさかのぼる。2人組が3度で歌い、撥弦楽器で伴奏するというこの形式は、1920年代に普及した。商業的な録音として記録されたのは1929年、Cornélio Piresという人物が自費で農村の演者を録音し、レコード会社を説得して発売させたことに始まる。これは厳密にはカイピラ音楽の録音で、セルタネージョとの区別には用語上の論争があるが、産業としての出発点とされる。20世紀半ばにはTonico e Tinocoといった2人組が国民的な人気を得た。1950年代には、知識人から商業化への批判もあった。1980年代に大きな転換が起きる。Chitãozinho &amp; Xororóをはじめとする2人組が、伴奏を大幅に近代化し、歌詞を都市の恋愛へ移すことで、農村の外の広い聴衆を獲得したのである。この路線はセルタネージョ・ロマンティコと呼ばれ、大きな人気を集めるに至った。Zezé Di Camargo &amp; Lucianoは、貧しい農家から成功へ至る自らの物語が映画化されるほどの国民的な存在となる。2000年代後半には、大学生の間で流行したことに由来する新しい系統が現れ、Michel Telóが2011年に発表した版の楽曲は、サッカー選手の得点後の仕草を通じて世界的な現象となった。この分野の経済的な基盤は特異である。ロデオや農畜産のフェスティバルへの出演がキャリア上不可欠で、これらは農業関連産業の資金に支えられている。この産業との結びつきが、土地や労働をめぐる批判を招くこともある。近年の重要な変化は女性の台頭である。とりわけMarília Mendonçaは、女性の視点から失恋の痛みを率直に歌う作風で圧倒的な支持を得たが、2021年、公演へ向かう小型機の墜落により26歳で死去した。</p>
<h2>代表曲</h2><ul><li>Ai Se Eu Te Pego (Michel Teló)</li><li>Camaro Amarelo (Munhoz &amp; Mariano)</li><li>Pássaro de Fogo (Paula Fernandes)</li><li>Você Vai Ver (Zezé Di Camargo &amp; Luciano)</li><li>Dois Corações e Uma História (Zezé Di Camargo &amp; Luciano)</li><li>Borboletas (Victor &amp; Leo)</li><li>Amo Noite e Dia (Jorge &amp; Mateus)</li><li>Meteoro (Luan Santana)</li><li>Evidências (Chitãozinho &amp; Xororó)</li><li>No Dia em Que Eu Saí de Casa (Zezé Di Camargo &amp; Luciano)</li><li>Fio de Cabelo (Chitãozinho &amp; Xororó)</li><li>Apenas Mais Uma de Amor (Luan Santana)</li></ul>
