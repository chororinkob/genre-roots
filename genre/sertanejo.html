<h1>Sertanejo（セルタネージョ）とは</h1>
<p>セルタネージョは、ブラジルの内陸の農村部に由来する大衆音楽だ。現在は、同国で最大の市場を持つ。 原型となる古いスタイルでは、2人組（兄弟のこともある）の歌が中心である。2人の歌手は、主に3度(場合により6度)離れた音程で、平行に歌</p>
<p>セルタネージョは、ブラジルの内陸の農村部に由来する大衆音楽だ。現在は、同国で最大の市場を持つ。

原型となる古いスタイルでは、2人組（兄弟のこともある）の歌が中心である。2人の歌手は、主に3度(場合により6度)離れた音程で、平行に歌う。この寄り添う2声の響きが、この音楽の特徴だ。

伴奏の中心は、10弦のビオラ・カイピラという、弦をはじいて鳴らす楽器である。五組の複弦を張り、調弦は地域ごとに異なる。伴奏は、リズミカルなラスケアード（かき鳴らし）と、歌の旋律に寄り添って弾くポンテイオ（ソロ的な単音奏法）が中心となる。

拍子は、3拍子のものも2拍子のものもある。

歌詞の主題は3本柱だ。牛追い（boiadeiro）や農民の物語、カイピラの笑い話、そして愛と死の悲劇の物語である。故郷への郷愁を歌った曲の例も、数多くある。

20世紀後半以降の現代的な形は、これとは大きく異なる。ロックやアメリカのカントリーの影響を受け、電気ギター、ドラム、キーボードなどを加えた編成になる。2声の平行という原則は保たれることが多い。ただし旋律はより広い音域を使い、感情が最も高まる所で転調する曲もある。歌詞も都市の恋愛と失恋へ移り、苦しみを大げさに歌い上げる作風も目立つ。</p>
<h2>成り立ち</h2><p>始まりは、植民地時代のサンパウロ地域にさかのぼる。内陸の農村に伝わるカイピラ音楽が、その起源だ。

2人組が3度で歌い、弦をはじく楽器で伴奏する。この民俗的な形式は古くからあり、1920年代に、Cornélio Piresらの舞台や録音を通じて広く知られるようになった。

1929年、Cornélio Piresは、プレスの費用を自分で負担して、Columbiaに録音と発売をさせた。これは、カイピラ音楽として最初期の商業録音である（ただし、1913年に南部のビオラ奏者が録音した例が、先に指摘されている）。厳密にはカイピラ音楽の録音で、セルタネージョとの区別には言葉の上での論争がある。それでも、産業としての出発点とされる。

20世紀半ばには、Tonico e Tinocoのような2人組が、国民的な人気を得た。

一方、1950年代半ばには、カイピラ音楽を守ろうとする知識人が、セルタネージョを批判した。ロマンティックな主題や、アメリカの西部劇風の美学を取り入れたことが、その理由だった。産業や商業化という点からの批判は、1970年代の研究で目立つようになる。

近代化は1960年代末に始まり、1980年代には全国的な大衆音楽になった。Chitãozinho &amp; Xororóをはじめとする2人組が、伴奏を大きく近代化し、歌詞を都市の恋愛へ移した。こうして、農村の外の広い聴衆をつかんだのである。この路線はセルタネージョ・ロマンティコと呼ばれ、大きな人気を集めた。Zezé Di Camargo &amp; Lucianoは、貧しい農家から成功するまでの自分たちの物語が映画になるほど、国民的な存在となる。

2000年代後半には、大学生の間で流行したことに由来する、新しい系統が現れた。Michel Telóが2011年に発表した版の曲は、サッカー選手の得点後の仕草を通じて、世界的な現象となった。

ロデオや農業・畜産の祭りへの出演が、キャリアに欠かせないとされる。そして、これらの催しは、農業関連の産業の資金に支えられている。この産業との結びつきが、土地や労働をめぐる批判を招くこともある。

近年の大きな変化は、女性が人気を集めたことである。とりわけMarília Mendonçaは、女性の目から見た失恋の痛みを率直に歌う作風で、圧倒的な支持を得た。しかし2021年、公演へ向かう小型機の墜落により、26歳で亡くなった。</p>
