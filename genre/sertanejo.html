<h1>Sertanejo（セルタネージョ）とは</h1>
<p>ブラジルの内陸農村部に由来し、現在は同国最大の市場を持つ大衆音楽である。原型となる古い様式では、二人組による歌唱が絶対的な条件とされる。二人の歌手が終始三度の音程で平行に歌い続けるという書法で、この寄り添う二声の響きがこの音楽の刻</p>
<p>ブラジルの内陸農村部に由来し、現在は同国最大の市場を持つ大衆音楽である。原型となる古い様式では、二人組による歌唱が絶対的な条件とされる。二人の歌手が終始三度の音程で平行に歌い続けるという書法で、この寄り添う二声の響きがこの音楽の刻印である。伴奏の中心は10弦のビオラ・カイピラという小型の撥弦楽器で、五組の複弦を張り、地域ごとに異なる調弦が用いられる。この楽器が刻む分散和音の上に、二声の歌が乗る。拍子は緩やかな三拍子か二拍子で、テンポは中庸である。歌詞は農村の生活、牛追い、干ばつ、故郷を離れる哀しみ、そして素朴な恋愛を扱う。20世紀後半以降の現代的な形態は大きく異なる。編成に手風琴、ドラム、エレクトリックギター、シンセサイザーが加わり、アメリカのカントリー・ロックに近い制作が施される。二声の平行という原則は保たれることが多いが、旋律はより広い音域を使い、感情の頂点で転調する定型が導入された。歌詞も都市の恋愛と失恋へ移り、とりわけ苦しみを大げさに歌い上げる作風が近年の主流となっている。</p>
<h2>成り立ち</h2><p>起源はサンパウロ州やミナスジェライス州の内陸農村に伝わる音楽である。二人組が三度で歌い、撥弦楽器で伴奏するというこの形式は、19世紀までにこれらの地域で定着していた。商業的な録音として記録されたのは1929年、Cornélio Piresという人物が自費で農村の演者を録音し、レコード会社を説得して発売させたことに始まる。大手は売れないと判断していたが、結果は大成功であり、これが産業としての出発点となった。20世紀半ばにはTonico e Tinocoといった二人組が国民的な人気を得たが、都市の知識層からは田舎臭い音楽として長く見下されていた。1980年代に決定的な転換が起きる。Chitãozinho &amp; Xororóをはじめとする二人組が、伴奏を大幅に近代化し、歌詞を都市の恋愛へ移すことで、農村の外の広い聴衆を獲得したのである。この路線はロマンティックな系統と呼ばれ、1990年代には国内の売り上げの首位を占めるに至った。Zezé Di Camargo &amp; Lucianoは、貧しい農家から成功へ至る自らの物語が映画化されるほどの国民的な存在となる。2000年代後半には、大学生の間で流行したことに由来する新しい系統が現れ、Michel Telóが2011年に発表した楽曲は、サッカー選手の得点後の仕草を通じて世界的な現象となった。この分野の経済的な基盤は特異である。ブラジル内陸の農業関連産業が主催する牛追い競技の巡回興行が、最大の演奏の場であり、この産業との結びつきが、環境保護や土地問題をめぐる批判を招くこともある。近年の重要な変化は女性の台頭である。とりわけMarília Mendonçaは、女性の視点から失恋の痛みを率直に歌う作風で圧倒的な支持を得たが、2021年、公演へ向かう小型機の墜落により26歳で死去した。</p>
