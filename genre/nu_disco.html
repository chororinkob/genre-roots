<h1>Nu-Disco（ニューディスコ）とは</h1>
<p>2000年代以降に、1970年代後半から1980年代前半のディスコとブギの質感を、現代の制作技術で再構成した音楽である。単なる懐古ではなく、当時の機材や奏法を用いながら、曲の構造はクラブでの使用に最適化されている点が特徴である。テ</p>
<p>2000年代以降に、1970年代後半から1980年代前半のディスコとブギの質感を、現代の制作技術で再構成した音楽である。単なる懐古ではなく、当時の機材や奏法を用いながら、曲の構造はクラブでの使用に最適化されている点が特徴である。テンポは概ね110から125 BPMで、キックは四つ打ちを保つが、その音色は分厚く潰したものではなく、乾いた生ドラムに近い質感が選ばれる。決定的に重要なのはベースで、打ち込みではなく人が指で弾いた音、あるいはそれを精密に模した音型が用いられ、拍の隙間を細かく縫うように動く。この人力の揺らぎが、機械的なハウスとの最大の違いを生む。上物にはアナログのシンセサイザーによる分散和音、弦楽合奏を模した和音の刺し込み、歯切れの良いギターの刻み、電気ピアノが重ねられる。和音はジャズやソウル由来の豊かな響きを持つ。曲の構成は長く、8分から12分に及ぶものも多く、要素を一つずつ足しながらゆっくり高揚させ、後半に長い演奏の区間を置く。歌が入る場合は控えめに扱われ、器楽だけの作品も多い。全体として、暖かく、贅沢で、急がない音の質感が一貫して追求されている。</p>
<h2>成り立ち</h2><p>2000年前後のダンス音楽は、ミニマル・テクノやエレクトロクラッシュのように、硬質で冷たい方向へ進んでいた。その反動として、人間味と暖かさを取り戻そうとする動きが複数の場所で同時に起こる。ニューヨークではMorgan GeistとDarshan JesraniによるMetro Areaが、2002年に発表した作品で、生演奏に近いベースと弦の響きを用いた精緻なディスコの再構成を提示し、この方向の出発点を作った。同時期、ノルウェーのオスロでは全く別の道筋が生まれる。LindstrømやPrins Thomasといった作り手が、1970年代のイタリアの宇宙的なディスコと、クラウトロックの反復を組み合わせた、極めて長く浮遊した作品を作り始め、これは宇宙ディスコとも呼ばれた。彼らが運営したFull Puppなどの小規模なレーベルが拠点となる。ニューヨークではJames Murphyが2001年に設立したDFA Recordsが、パンクの感性とディスコを結合させ、この潮流に批評的な後ろ盾を与えた。ヨーロッパではドイツのPermanent Vacationやベルギーの作り手が続き、ノルウェーのTodd Terjeが2012年に発表した楽曲は、この分野で最も広く知られる一曲となった。ニュー・ディスコという呼称自体は、音源配信サイトの分類として広まった側面が強く、当事者の多くは自分たちの音楽をこの名で呼ばない。決定的な出来事は2013年で、Daft Punkが1970年代の職業演奏家を大量に起用して録音した作品が世界的な大成功を収め、生演奏によるディスコの質感が主流の市場でも通用することを証明した。同時に、この分野には批判もある。過去の音を再現することに終始し、新しい発明が乏しいという指摘であり、実際に流行の後半には、決まった要素を並べただけの作品が量産された。それでも、機械化が進んだダンス音楽の中で人の演奏の揺らぎを保持し続けたという功績は大きく、現在も世界中のクラブで、夜の始まりと終わりを担う音楽として機能している。</p>
<h2>代表曲</h2><ul><li>Inspector Norse（Todd Terje）</li><li>Jealous（Chromeo）</li><li>Sing It Back（Roisin Murphy）</li></ul>
