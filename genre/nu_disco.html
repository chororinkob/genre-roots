<h1>Nu-Disco（ニューディスコ）とは</h1>
<p>ニュー・ディスコは、1990年代半ばのハウスの現場から出てきた21世紀のジャンルで、2000年代以降に、1970年代後半から1980年代前半のディスコとブギの質感を、現代の制作技術で作り直した音楽である。単なる懐古ではない。当時の</p>
<p>ニュー・ディスコは、1990年代半ばのハウスの現場から出てきた21世紀のジャンルで、2000年代以降に、1970年代後半から1980年代前半のディスコとブギの質感を、現代の制作技術で作り直した音楽である。単なる懐古ではない。当時の機材や奏法を使いながら、曲の組み立ては、クラブで使いやすいように整えられている。これが大きな特徴である。

上物には、アナログやデジタルのシンセサイザーによる分散和音（和音の音を1音ずつ順に鳴らす弾き方）が使われる。弦楽合奏のまねをした和音の刺し込み、歯切れの良いギターの刻み、電気ピアノも重ねられる。和音は、ジャズやソウルに由来する、豊かな響きを持つ。

ベースは、生演奏か、それに近い質感が好まれる傾向がある。拍の隙間を細かく縫うように動く。テンポは概ね110から125 BPMである。キックは四つ打ちを保つが、音色は分厚く潰したものではない。乾いた生ドラムに近い質感が選ばれる傾向がある。

歌ものは、このジャンルの主要な流れである。Hercules &amp; Love Affair、Metronomy、Dua Lipaなどが例に挙げられる。器楽のspace discoは、影響源の一つである。

曲の構成は長めで、ゆっくり展開する傾向がある。代表例の長さは5〜7分台が中心である。要素を一つずつ足しながらゆっくり高揚させ、後半に長い演奏の区間を置く。全体として、暖かく、贅沢で、急がない音の質感が、一貫して追求されている。</p>
<h2>成り立ち</h2><p>舞台は、ニューヨークのクラブだ。当時のNYのクラブを支配していたのは、tribal系とprogressive系である。これに対し、人間味と暖かさを取り戻そうとする動きが起こる。

ニューヨークでは、Morgan GeistとDarshan JesraniによるMetro Areaが、2002年に作品を発表した。シーケンスされたドラムとベースラインに、生の弦楽などを重ねた作品である。精緻なディスコの作り直しを示し、影響力の大きい初期作品の一つとなった(1990年代半ばのNuphonic Records周辺もこの分野の先駆とされる)。

同時期、ノルウェーでは全く別の道筋が生まれる。北部のトロムソの若者たちが源流とされ、ハーマルなど地方都市にも広がりがあった。LindstrømやPrins Thomasといった作り手は、Italo discoやcosmic disco、electro、プログレ、クラウトロックの影響を組み合わせた。そして、極めて長く浮遊した作品を作り始めた。これは宇宙ディスコとも呼ばれた。Prins Thomasが運営するFull Puppや、Lindstrømが運営するFeedelityなどの小さなレーベルが拠点となる。

ニューヨークでは、James MurphyがTim Goldsworthy、Jonathan Galkinとともに、2001年にDFA Recordsを設立した。このレーベルは、パンクの感性とディスコを結びつけ、この流れに批評の面での後ろ盾を与えた。ヨーロッパでは、ドイツのPermanent Vacationやベルギーの作り手が続いた。ノルウェーのTodd Terjeが2012年に発表した楽曲は、この分野の代表曲の一つとなった。

ニュー・ディスコという呼び名は、1996年のXLR8R誌のCajmereインタビューに、すでに「new disco (anyone for nu-disco?)」という一文がある。ただしジャンル名として使ったものではなく、軽い言及である。2008年には、Beatportが「Nu Disco / Indie Dance」という合同のジャンルページを作った。

商業的に最大の成功例は2013年である。Daft Punkが、1970年代後半〜1980年代前半のアメリカ音楽へのオマージュとされ、多数のセッション奏者やオーケストラが参加して録音した作品が、世界的な大成功を収めた。

同時に、この分野には批判もある。過去の音を再現することに終始し、新しい発明が乏しいという指摘だ。実際に流行の後半には、決まった要素を並べただけの作品が量産された。それでも、機械化が進んだダンス音楽の中で、人の演奏の揺らぎを保持し続けたことを功績と評価する見方もある。</p>
