<h1>Yukar（ユーカラ）とは</h1>
<p>アイヌ民族に口承で伝えられてきた叙事詩の歌い語りである。代表曲10曲を動画で聴け、ルーツと影響のつながりを地図でたどれる。</p>
<p>アイヌ民族に口承で伝えられてきた叙事詩の歌い語りである。語り手が節（メロディ）をつけて長い物語を歌い続ける、歌と語りの間の音楽だ。

英雄叙事詩で中心になる「楽器」は、拍子棒（レㇷ゚ニ）という木の棒である。語り手は炉端にすわり、この棒で炉の縁を叩いて拍子をとる。伴奏の楽器は原則ない。聞き手が語りの間合いに掛け声を入れるのも、演奏の一部だ。

神謡は物語ごとに旋律が決まっている。英雄叙事詩は語り手ごとの旋律で語る。同じ節をくり返しながら本文が進む。和音や進行という発想はなく、神謡での聞かせどころは、サケヘと呼ぶ折り返しの句である。サケヘは折り返し（リフレイン）を指し、折り返しと節を合わせた全体を指すこともある。元はカムイの鳴き声や様子などの擬音だったと考えられ、意味が分からなくなったものも多い（例：雷のカムイのサケヘは雷鳴の擬音である）。

節回しは、拍子棒を叩くタイミングに詞句が収まる唱え方である。炉縁を叩く規則的な音が下支えし、よく通る声で語りが運ばれる。声の質は語り手ごとに違う。

歌い手はカムイ（神）や英雄になりきる。カムイユーカラでは、神が一人称で自らの物語を歌うのが特徴の一つだ。

歌詞の主題は、フクロウや狐などの動物の神と人間の交流、ポンヤウンペという少年英雄の冒険、狩りや漁での恵み、神への礼である。

神謡の組み立ては、サケヘを折り返しに本文を挟む形式である。短く終わる話から、何日もかけて語る長大なものまで幅がある。

散文の昔話ウエペケレが「語る」のに対し、ユーカラは「節で歌う」点が決定的に違う。歌謡と民話の中間に位置する音楽と言える。</p>
<h2>成り立ち</h2><p>ユーカラは、文字を持たなかったアイヌの人々が、北海道から樺太にかけての集落で、神や英雄の話を節につけて語り継いできたことから始まる。土地ごとに呼び名が違い、日高西部・胆振・石狩ではユーカㇻ、十勝や釧路ではサコㇿペ、日高東部ではヤイラㇷ゚と呼ばれた。樺太アイヌのあいだでは、単に歌をユーカラ、叙事詩をハウキと呼び分ける。語り手はユカㇻクㇽと呼ばれ、語りは伝統的に幾晩にもわたった。

江戸時代にはすでに和人の耳に届いている。1779年から1820年頃に成立した大田南畝の随筆『一話一言』には「蝦夷人唄（ユウカラ）」の記述があり、現存が確認できる最古級の記録のひとつと見られる。上原熊次郎の『藻汐草』には「ユーガリ 浄瑠璃の事」と表記した一編が残る。江戸時代には「蝦夷浄瑠璃」という呼び名も使われた。

しかし明治以降、アイヌ語とアイヌ文化の衰退とともに語り手は減っていき、神謡（カムイユカㇻ）は、主に女性が語り手となった。アイヌ自身がアイヌ語で物語を文字にした最初期の例が知里幸恵である。1903年生まれの彼女は、祖母モナシノウクと叔母（養母）の金成マツの両方から聞き覚えた13篇の神謡をローマ字で音を起こし、日本語訳を添えて『アイヌ神謡集』としてまとめた。東京で、1922年9月18日に金田一宅で校正を終え、その夜に19歳で死去し、刊行は1923年となった。冒頭の「銀の滴降る降るまわりに」は、アイヌ自身の手で初めて文字になって世に出た文学作品のひとつである。

一方、金田一京助は金成マツ（イメカヌ）と協力して大規模な採集を進めた。マツはローマ字で92篇のユーカラを書き取り（金成マツノート）、マツが書き取り金田一が訳注をつけた7巻と、金田一自身が書き取り訳注をつけた2巻からなる『アイヌ叙事詩・ユーカラ集』全9巻が、三省堂から1959〜1975年にかけて刊行された。金田一の『アイヌ叙事詩ユーカラの研究』（1931年）は英雄詞曲の代表「虎杖丸の曲」を訳し、ユーカラの全容を初めて明らかにした。

戦後は萱野茂が二風谷で半世紀にわたり記録を続け、1996年12月に録音したCD『アイヌのユカラ 蘇る英雄』、1998年に『萱野茂のアイヌ神話集成』（1999年に第14回文化庁芸術作品賞を受賞）という形にまとめた。海外ではドナルド・L・フィリピが33篇を英訳し（1979年）、サラ・M・ストロングが『アイヌ神謡集』を英訳し（2011年）、1999年に始まったプロジェクト・ウエペケレも英訳を続けている。

語り手の減少という痛手を抱えながらも、復興運動の中で新しい語り手が育っている。伝統的な古式舞踊と現代舞踊・デジタルアートを融合させた舞台「阿寒ユーカラ ロストカムイ」のように、現代に向けた展開も続いている。</p>
