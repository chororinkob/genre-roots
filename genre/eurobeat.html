<h1>Eurobeat（ユーロビート）とは</h1>
<p>イタリアで制作され、主に日本で消費された高速ダンス音楽。BPMは150〜160に固定され、四つ打ちのキックが一切揺らがず突進する。骨格はハイエナジーとイタロ・ディスコの直系だが、それらより明確に速く、音数も多い。特徴的なのは16分</p>
<p>イタリアで制作され、主に日本で消費された高速ダンス音楽。BPMは150〜160に固定され、四つ打ちのキックが一切揺らがず突進する。骨格はハイエナジーとイタロ・ディスコの直系だが、それらより明確に速く、音数も多い。特徴的なのは16分音符で駆け上がるシンセベースと、鋸波の派手なリード音による短い動機の反復、そしてサビ直前に必ず挿入される上昇音型（ライザー）とドラムのフィルインである。曲構成は完全に定型化しており、イントロ16小節、Aメロ、Bメロで一度音を薄くして緊張を作り、そこから最も派手なサビへ雪崩れ込むという型を全曲が共有する。和声は短調の循環進行に長調の解決を挟む「泣きのメロディー」が基本で、切迫感と高揚感が同時に来る。歌唱はイタリア人歌手による英語で、発音の癖は残るがハイトーンで押し切る。歌詞は恋の情熱、スピード、夜、炎といった単純な語の組み合わせが多く、意味より語感が優先される。原曲は12インチや編集盤に収録され、DJがノンストップで繋ぐ形で流通した。日本のディスコ、ゲームセンター、そして走り屋文化と結び付いた点が、他のヨーロッパ産ダンス音楽と決定的に異なる。</p>
<h2>成り立ち</h2><p>1980年代半ば、イタロ・ディスコとイギリスのハイエナジーが交わるところで生まれた。名称は本来イギリスでイタリア産のハイエナジーを指す語として使われていたが、日本の輸入業者と制作会社がこれを独自の商品名として引き取ったことで意味が変質した。決定的な役割を果たしたのが、1980年代半ばに設立された日本のレーベル、アルファレコード系の企画と、その後を継いだエイベックス（当初は輸入レコードの卸売業者として1988年に設立）である。エイベックスは1990年からコンピレーション・シリーズSuper Eurobeat を開始し、これが2000年代まで200巻を超えて続く長寿シリーズとなった。イタリア側の供給元はミラノとボローニャの小規模プロダクションで、とりわけAlberto Contini とGiancarlo Pasquini（Dave Rodgers 名義でも歌う）が率いたA-Beat C、Time Records、Delta Records などが中核を担った。歌手はDave Rodgers、Domino、Niko、Annerley Gordon（Ann Lee）など、多くがイタリア在住のシンガーで、複数の変名を掛け持ちした。日本国内では1990年代前半にディスコのジュリアナ東京などで流れ、さらに1990年代後半、しげの秀一の漫画『頭文字D』のアニメ化（1998年）で峠の走行シーンの音楽として大量に使用されたことにより、若年層への浸透が決定的になった。同時期、ダンスゲームのダンスダンスレボリューションなどアーケード音楽ゲームにも多数採用され、さらにパラパラという振り付けダンスの流行が加わって、1990年代末に最盛期を迎えた。特筆すべきは、本国イタリアではこの音楽がほとんど流通せず、生産はイタリア、消費は日本という完全な輸出専用産業として成立していた点である。2000年代半ば以降は市場の縮小で制作量が激減したが、Super Eurobeat シリーズは継続し、近年はインターネット・ミームとして『頭文字D』の曲が世界的に再拡散され、思わぬ形で新規の聴き手を獲得している。</p>
<h2>代表曲</h2><ul><li>Deja Vu (Dave Rodgers)</li><li>Running in the 90's (Mega NRG Man)</li><li>Night of Fire (Niko)</li><li>Gas Gas Gas (Manuel)</li><li>Space Boy (Dave Rodgers)</li></ul>
