<h1>Eurobeat（ユーロビート）とは</h1>
<p>1990年前後から、イタリアで制作され、主に日本で消費された高速ダンス音楽。BPMは平均約155で、おおむね150〜160の間で推移し（初期と近年はやや遅めで、資料によっては120〜160前後と広く見るものもある）、四つ打ちのキッ</p>
<p>1990年前後から、イタリアで制作され、主に日本で消費された高速ダンス音楽。BPMは平均約155で、おおむね150〜160の間で推移し（初期と近年はやや遅めで、資料によっては120〜160前後と広く見るものもある）、四つ打ちのキックが一切揺らがず突進する。骨格はハイエナジーとイタロ・ディスコの直系だが、それらより明確に速く、音数も多い。特徴的なのは8分音符でオクターヴ（同じ音名で高さが違う音）を弾くシンセベースと、シンセサイザーの短い旋律（シンセリフ）を何度も使うこと、そしてブラス（金管楽器）やハープのような音色を使うことである。曲構成は多くの曲で決まった型があり、イントロ（16〜24小節前後）、シンセリフ（8小節）、Aメロ（8小節）、Bメロ（8小節）、サビ（8または16小節）、シンセリフ…と進む。ただし、型は曲によって違うこともある。和声は、歌の出だしの部分（ヴァース）が短調中心の「泣きのメロディー」で、切迫感と高揚感が同時に来る。歌唱は、多くはイタリア在住（Annerley Gordon（Ann Lee）のように英国人もいる）の歌手による英語で、発音の癖は残るがハイトーンで押し切る。歌詞は恋の情熱、スピード、夜、炎といった単純な語の組み合わせが多く、意味より語感が優先される。原曲は12インチや編集盤に収録され、DJがノンストップで繋ぐ形で流通した。日本ではパラパラ、『頭文字D』などを通じて独自に定着した。</p>
<h2>成り立ち</h2><p>1980年代の英国や欧州のダンスポップと、日本に入ってきた輸入盤をまとめて「ユーロビート」と呼んだのが始まりで、今のような独立したジャンルになったのは、1990年前後にエイベックスとイタリアのレーベルが直接契約を結んでからである。名称はイギリスで、Stock Aitken Watermanが制作したDead or AliveやBananarama、Kylie Minogueなどの英国産ダンスポップに使われ、1980年代半ばの日本では欧州大陸産のダンス音楽の輸入盤（主にイタロ・ディスコ）全般に使われた。決定的な役割を果たしたのが、日本のエイベックス（1988年にエイベックス・ディー・ディーとして設立。当初は輸入レコードの卸売業）である。Super Eurobeat は1990年1月にBeat Freakが始めたコンピレーション（寄せ集めの編集盤）・シリーズ（Vol.1はTime Recordsがイタリアで制作し、Vol.2からはASIA・FLEA・DISCOMAGICの作品も収録された。Vol.1〜8）で、Vol.9（1990年11月25日）からAvex Traxが引き継ぎ、Vol.100が1999年、Vol.110が2000年と続いて、約250巻に達した長寿シリーズとなった。イタリア側の供給元は北イタリアのロンバルディア地方を中心とする各地（ルガニャーノ、ブレシア、マントヴァなど）の小規模プロダクションで、とりわけAlberto Contini とGiancarlo Pasquini（Dave Rodgers 名義でも歌う）が率いたA-Beat Cのほか、Time Records、Delta（正式名はDelta Music Industryで、Delta Recordsとも呼ばれる）などが中核を担った。歌手の名義にはDave Rodgers、Domino、Nikoなどがあり、いずれも本名ではなく芸名で、多くはイタリア在住のシンガーが複数の名義を掛け持ちした。英国人のAnnerley Gordonは本名で、Ann Leeの名でも歌った。日本国内では1990年代前半から、横浜マハラジャなどのディスコで流れ、さらに1990年代後半、しげの秀一の漫画『頭文字D』のアニメ化（1998年）で峠の走行シーンの音楽として大量に使用されたことが、人気を保つ大きな理由の一つになった。2000年代前半にかけて、ダンスゲームのダンスダンスレボリューションなどの音楽ゲームでもユーロビートが採用され、さらにパラパラという振り付けダンスの流行が加わって、1990年代末から2000年代初めに最盛期を迎えた。特筆すべきは、本国イタリアではこの音楽がほとんど流通せず、制作はイタリア、リリースは日本という説明が一般的な点である（日本向けに限られない制作や、日本市場に入らない曲もあったとする研究もある）。2000年代半ば以降は市場が縮小して一般的には古いジャンルと見なされるようになったが、Super Eurobeat シリーズは毎月の刊行を続け、2013年のVol.221から隔月になりつつ継続し、近年はインターネット・ミーム（ネットで広まる流行）として『頭文字D』の曲が世界的に再拡散され、思わぬ形で新規の聴き手を獲得している。</p>
<h2>代表曲</h2><ul><li>Gas Gas Gas (Manuel)</li><li>Night of Fire (Niko)</li><li>Deja Vu (Dave Rodgers)</li><li>Space Boy (Dave Rodgers)</li><li>Beat of the Rising Sun (Dave Rodgers)</li><li>Get Me Power (Mega NRG Man)</li><li>Break In2 The Nite (Dave Rodgers Remix)</li><li>Boom Boom Japan (Dave Rodgers)</li><li>Burning Desire (Mega NRG Man)</li><li>Tora Tora Tora (Domino)</li><li>AE86 (Dave Rodgers)</li><li>Fire (Dave Rodgers)</li><li>Gold Night (Dave Rodgers feat. Eurobeat Union)</li><li>Take Me Higher 2020 (Dave Rodgers)</li><li>Grand Prix (Mega NRG Man)</li><li>Adrenaline (Manuel)</li><li>Nightrain (Manuel)</li><li>Sun In The Rain (Manuel)</li><li>Heartbeat (Nathalie)</li><li>Speedy Speed Boy (Marko Polo)</li></ul>
