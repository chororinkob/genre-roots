<h1>Eurobeat（ユーロビート）とは</h1>
<p>ユーロビートは、イタリアで作られ、主に日本で聴かれた高速のダンス音楽だ。 土台になるのはシンセベースの8分音符でのオクターヴ奏法だ。曲の速さを示すBPMは平均約155で、資料により異なるが、おおむね150〜160の間で動く（初期と</p>
<p>ユーロビートは、イタリアで作られ、主に日本で聴かれた高速のダンス音楽だ。

土台になるのはシンセベースの8分音符でのオクターヴ奏法だ。曲の速さを示すBPMは平均約155で、資料により異なるが、おおむね150〜160の間で動く（初期と近年はやや遅め）。四つ打ちのキックが一切揺らがず、まっすぐに突き進む。骨格はハイエナジーとイタロ・ディスコの直系だが、それらよりはっきり速く、音数も多い傾向がある。

リード音は、シンセのリフが多く使われ、短い動機（旋律の断片）を繰り返す。

和声は、短調中心のヴァースが多い。

歌は、多くがイタリア在住の歌手による英語だ。Annerley Gordon（Ann Lee）のように英国人もいる。発音の癖は残るが、ハイトーンで押し切ることが多い。歌詞は、恋の情熱、スピード、夜、炎といった単純な語の組み合わせが多い。意味より語感が優先されがちだ。

曲構成は、「イントロ（16〜24小節前後）→シンセリフ（8小節）→Aメロ（8小節）→Bメロ（8小節）→サビ（8または16小節）→シンセリフ…」という型が「多くの曲で」見られる。

原曲は12インチや編集盤に収録され、DJがノンストップでつなぐ形で流通した。日本ではパラパラ、『頭文字D』などを通じて独自に定着した。</p>
<h2>成り立ち</h2><p>1980年代の英国／欧州のダンスポップ、日本での輸入盤の総称。それが、このジャンルの出発点だ。

1990年前後から、エイベックスとイタリアのレーベルの直接契約で、独立ジャンルとして成立した。

名称は、まずイギリスで使われた。Stock Aitken Watermanが制作したDead or AliveやBananarama、Kylie Minogueなどの、英国産ダンスポップを指した。1980年代半ばの日本では、欧州大陸産のダンス音楽の輸入盤（主にイタロ・ディスコ）全般に使われた。

決定的な役割を果たしたのが、日本のエイベックスだ。1988年4月11日にエイベックス・ディー・ディーとして設立され、当初は輸入レコード（盤）の卸販売業だった。

Super Eurobeat は、1990年1月にBeat Freakが始めたコンピレーション（寄せ集めの編集盤）・シリーズだ。Vol.1はTime Recordsがイタリアで制作した。Vol.2からは、ASIA・FLEA・DISCOMAGICの作品も収録された（Vol.1〜8）。Vol.9（1990年11月25日）からはAvex Traxが引き継いだ。Vol.100が1999年、Vol.110が2000年と続き、約250巻に達した長寿シリーズとなった。

イタリア側の供給元は、ロンバルディアを中心とする北イタリア（ルガニャーノ、ブレシア、マントヴァなど）の小規模プロダクションだ。とりわけ、Alberto Contini とGiancarlo Pasquini（Dave Rodgers 名義でも歌う）が率いたA-Beat Cが中心だった。ほかに、Time Records、Delta Records などが中核を担った。歌手の名義には、Dave Rodgers、Domino、Nikoなどがある。Annerley Gordonは本名で、Ann Leeは名義だ。多くがイタリア在住のシンガーで、複数の変名（別名）を掛け持ちした。

日本国内では、1990年代前半にディスコの横浜マハラジャなどで流れた。さらに1990年代後半には、しげの秀一の漫画『頭文字D』がアニメ化された（1998年）。峠の走行シーンの音楽として大量に使われたことで、若年層に広まる大きな理由の一つになった。

2000年代前半にかけて、DDRなどの音楽ゲームでもユーロビートが採用された。さらに、パラパラという振り付けダンスの流行が加わり、1990年代末〜2000年代初頭に最盛期を迎えた。

特筆すべきは、本国イタリアではこの音楽がほとんど流通しなかった点だ。制作はイタリア、リリースは日本という説明が一般的である（日本向けに限られない制作や、日本市場に入らない曲もあったとする研究もある）。

2000年代半ば以降は、市場が縮小して一般的には古いジャンルと見なされるようになった。それでも、Super Eurobeat シリーズは毎月刊行を続け、2013年のVol.221から隔月になった。近年は、インターネット・ミーム（ネットで広まる流行）として『頭文字D』の曲が世界的に再拡散された。思わぬ形で、新規の聴き手を獲得している。</p>
