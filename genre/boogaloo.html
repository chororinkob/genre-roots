<h1>Boogaloo（ブーガルー）とは</h1>
<p>ブーガルーは、1960年代半ばのニューヨークで生まれた踊りの音楽だ。キューバ音楽と、アメリカのリズム・アンド・ブルースを混ぜ合わせている。 編成は楽団ごとに異なる。たとえばPete Rodríguez楽団は、トランペット2本、ティ</p>
<p>ブーガルーは、1960年代半ばのニューヨークで生まれた踊りの音楽だ。キューバ音楽と、アメリカのリズム・アンド・ブルースを混ぜ合わせている。

編成は楽団ごとに異なる。たとえばPete Rodríguez楽団は、トランペット2本、ティンバレス、コンガ、ベース、ピアノという顔ぶれだった。Joe Cubaの楽団のように、ヴィブラフォンとピアノが旋律を担う例もある。耳に残るピアノのモントゥーノやリフと、フックの組み合わせが特徴である。

土台にあるのは、キューバのソンやマンボのリズムだ。クラーベと呼ばれる、2小節にまたがる非対称の拍の型が、全体を取りまとめる。そこに、リズム・アンド・ブルースの跳ねたバックビートと、ソウルやドゥーワップの要素が重なる。テンポは中くらいの速さだ。

いちばんの特徴は歌にある。スペイン語と英語が混ざり、英語の歌詞やコーラスが入る曲が多い。録音には、手拍子や掛け声、子供たちのコーラスなどが入る。パーティーを模したスタジオ録音という性格を持つ。

歌詞は、踊りへの誘い、恋、街の日常が中心で、政治的な色は薄い。

この音楽は、ニューヨークで生まれた、あるいは育った若いプエルトリコ系の人たちなどが、自分たちの二つの文化を、英語とスペイン語を混ぜることで表したものだった。</p>
<h2>成り立ち</h2><p>ブーガルーの背景には、1950年代以降、プエルトリコから大勢の人々がニューヨークへ移り住んだことがある。イースト・ハーレム、通称エル・バリオやサウス・ブロンクスには、スペイン語圏出身の家庭が集まって住んだ。その子供たちは、家ではスペイン語の音楽を聴き、学校や街ではモータウンやソウルを聴いて育った。

1966年には、ピアニストのRicardo Rayが活躍した。決定的だったのは、Joe Cubaの『Bang Bang』(1966)だ。この曲は1966年秋に全米Hot 100で63位、R&amp;Bチャートで21位となり、100万枚を超えて売れたとされる。

1967年には、Pete Rodríguezの『I Like It Like That』が出た。英語とスペイン語が混ざったこの曲は、全米のBillboardチャートに入った。1966〜67年ごろには、Johnny Colónの『Boogaloo Blues』も登場し、このスタイルは一気に大流行した。

担い手の多くは10代から20代前半だった。年長のラテン音楽家の一部からは、程度が低い、純粋でないと見られた。

実際、この流行はごく短命に終わる。ブーガルーの流行は1969〜1970年ごろに終わったが、その理由はよく分かっていない。年長のラテン音楽家が、レコード会社(とくにFania Records)やラジオDJ、興行主と組んで、ブーガルーのバンドを締め出したという説がある。一方で、単に流行が燃え尽きたという説もある。Joe Bataanのように活動を続けた者もいたが、多くは表舞台から消えた。

それでも、この音楽は忘れられなかった。2000年代には、ラテン・ブーガルーが再び人気を集めた。2018年には、Cardi BがBad Bunny、J Balvinと共演した『I Like It』が、Pete Rodríguezの曲を引用(サンプリング)して、全米で首位を獲得した。</p>
<h2>代表曲</h2><ul><li>I Like It Like That (Pete Rodriguez)</li><li>Bang Bang (Joe Cuba Sextet)</li><li>Richie's Jala Jala (Ricardo Ray)</li><li>El Watusi (Ray Barretto)</li><li>Boogaloo Blues (Johnny Colon)</li><li>Micaela (Pete Rodriguez)</li><li>Young, Gifted and Brown (Joe Bataan)</li><li>Wabble-Cha (Joe Cuba)</li><li>Watermelon Man (Mongo Santamaría)</li><li>Subway Joe (Joe Bataan)</li><li>Under the Street Lamp (Joe Bataan)</li><li>Ordinary Guy (Joe Bataan)</li></ul>
