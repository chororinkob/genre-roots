<h1>Boogaloo（ブーガルー）とは</h1>
<p>1960年代半ばのニューヨークで生まれた、キューバ音楽とアメリカのリズム・アンド・ブルースを混ぜ合わせた踊りの音楽。土台はキューバのソンやマンボのリズムで、クラーベと呼ばれる二小節にまたがる非対称の拍の型が全体を統率する。しかしそ</p>
<p>1960年代半ばのニューヨークで生まれた、キューバ音楽とアメリカのリズム・アンド・ブルースを混ぜ合わせた踊りの音楽。土台はキューバのソンやマンボのリズムで、クラーベと呼ばれる二小節にまたがる非対称の拍の型が全体を統率する。しかしそこに、リズム・アンド・ブルースの跳ねたバックビートと、ゴスペル由来のピアノの三連符が重なる。テンポは毎分100から120拍程度。編成はサルサと同じくティンバレス、コンガ、ボンゴの打楽器群に、トランペットとトロンボーンのホーンセクション、ピアノ、ベースが加わるが、大きな違いは電気オルガンやエレキギターが入ることがある点である。ピアノは複雑なモントゥーノよりも、単純で強い和音の刻みを弾く。決定的な特徴は歌にあり、スペイン語と英語が混在し、多くの場合サビは英語で歌われる。さらに、演奏者と観客の掛け合い、手拍子、指笛、歓声がそのまま録音に入っており、パーティーの記録という性格を持つ。歌詞は踊りへの誘い、恋、街の日常で、深刻な主題は扱われない。この音楽は、スペイン語を10分に話せないニューヨーク生まれの世代が、自分たちの二重の帰属をそのまま音にしたものだった。</p>
<h2>成り立ち</h2><p>背景にあるのは1950年代以降のプエルトリコからの大量移民である。ニューヨークのイースト・ハーレム、通称エル・バリオやサウス・ブロンクスには、スペイン語圏出身の家庭が集住した。その子供たちは家ではスペイン語の音楽を聴き、学校や街ではモータウンやソウルを聴いて育った。1966年、ピアニストのRicardo Rayや、Pete Rodríguezの『I Like It Like That』、そして決定的だったのがJoe Cubaの『Bang Bang』である。この曲は英語とスペイン語が混ざり、単純な掛け声の反復と手拍子だけで進み、全米でも売れた。同じ年、Johnny Colónの『Boogaloo Blues』が続き、この様式は爆発的な流行となった。担い手の多くは10代から20代前半で、既存のサルサの大家からは幼稚だと軽視された。実際、この流行はごく短命に終わる。1960年代末には、Fania Recordsを率いたJerry MasucciとJohnny Pachecoが、より本格的でスペイン語中心のサルサを商業戦略として推し進め、ブーガルーの演奏家はレコード会社と興行主から締め出されたとされる。当事者の証言によれば、テレビ出演やクラブ出演の機会が組織的に奪われたという。Joe Bataanのように活動を続けた者もいるが、多くは表舞台から消えた。しかしこの音楽は忘れられなかった。1990年代以降、レア・グルーヴを掘るDJたちに再発見され、原盤が高値で取引されるようになり、2018年にはCardi Bの『I Like It』が、Pete Rodríguezの曲をそのまま下敷きにして全米一位を獲得した。半世紀前に葬られた音楽が、こうして最大の商業的成功にたどり着いたことになる。</p>
<h2>代表曲</h2><ul><li>I Like It Like That (Pete Rodriguez)</li><li>Boogaloo Blues (Johnny Colon)</li><li>El Watusi (Ray Barretto)</li><li>Richie's Jala Jala (Ricardo Ray)</li><li>Micaela (Pete Rodriguez)</li></ul>
