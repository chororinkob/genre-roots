<h1>Boogaloo（ブーガルー）とは</h1>
<p>1960年代半ばのニューヨークで生まれた、キューバ音楽とアメリカのリズム・アンド・ブルースを混ぜ合わせた踊りの音楽。土台はキューバのソンやマンボのリズムで、クラーベと呼ばれる2小節にまたがる非対称の拍の型が全体を取りまとめる。しか</p>
<p>1960年代半ばのニューヨークで生まれた、キューバ音楽とアメリカのリズム・アンド・ブルースを混ぜ合わせた踊りの音楽。土台はキューバのソンやマンボのリズムで、クラーベと呼ばれる2小節にまたがる非対称の拍の型が全体を取りまとめる。しかしそこに、リズム・アンド・ブルースの跳ねたバックビートと、ソウルやドゥーワップの要素が重なる。テンポは毎分100から120拍程度。編成はサルサと同じくティンバレス、コンガ、ボンゴの打楽器群に、トランペットとトロンボーンのホーンセクション、ピアノ、ベースが加わるが、大きな違いは電気オルガンやエレキギターが入ることがある点である。ピアノは複雑なモントゥーノよりも、単純で強い和音の刻みを弾く。いちばんの特徴は歌にあり、スペイン語と英語が混在し、多くの場合サビは英語で歌われる。さらに、演奏者と観客の掛け合い、手拍子、指笛、歓声がそのまま録音に入っており、パーティーの記録という性格を持つ。歌詞は踊りへの誘い、恋、街の日常で、深刻な主題は扱われない。この音楽は、スペイン語を十分に話せないニューヨーク生まれの世代が、自分たちが二つの文化に属していることを、そのまま音にしたものだった。</p>
<h2>成り立ち</h2><p>背景にあるのは1950年代以降のプエルトリコからの大勢の移民である。ニューヨークのイースト・ハーレム、通称エル・バリオやサウス・ブロンクスには、スペイン語圏出身の家庭が集まって住んだ。その子供たちは家ではスペイン語の音楽を聴き、学校や街ではモータウンやソウルを聴いて育った。1966年にはピアニストのRicardo Rayが活躍し、決定的だったのがJoe Cubaの『Bang Bang』(1966)である。1967年にはPete Rodríguezの『I Like It Like That』が出た。この曲は英語とスペイン語が混ざり、全米Hot 100で63位、R&amp;Bチャートで21位となり、1966年に100万枚以上売れたとされる。同じ年、Johnny Colónの『Boogaloo Blues』が続き、この様式は一気に大流行した。担い手の多くは10代から20代前半で、既存のサルサの大家からは幼稚だと軽く見られた。実際、この流行はごく短命に終わる。ブーガルーの流行は1969〜1970年ごろに終わったが、その理由はよく分かっていない。年長のラテン音楽家がレコード会社(とくにFania Records)やラジオDJ、興行主と組んでブーガルーのバンドを締め出したという説と、単に流行が燃え尽きたという説がある。Joe Bataanのように活動を続けた者もいるが、多くは表舞台から消えた。しかしこの音楽は忘れられなかった。2000年代にはラテン・ブーガルーが再び人気を集め、2018年にはCardi Bの『I Like It』が、Pete Rodríguezの曲を引用(サンプリング)して全米一位を獲得した。</p>
<h2>代表曲</h2><ul><li>I Like It Like That (Pete Rodriguez)</li><li>Bang Bang (Joe Cuba Sextet)</li><li>Richie's Jala Jala (Ricardo Ray)</li><li>El Watusi (Ray Barretto)</li><li>Boogaloo Blues (Johnny Colon)</li><li>Micaela (Pete Rodriguez)</li><li>Young, Gifted and Brown (Joe Bataan)</li><li>Wabble-Cha (Joe Cuba)</li><li>Watermelon Man (Mongo Santamaría)</li><li>Subway Joe (Joe Bataan)</li><li>Under the Street Lamp (Joe Bataan)</li><li>Ordinary Guy (Joe Bataan)</li></ul>
