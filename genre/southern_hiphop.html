<h1>Southern Hip Hop（サザンヒップホップ）とは</h1>
<p>アメリカ南部の各都市で独自に発達したヒップホップの総称であり、東西の海岸部とは異なる時間感覚と低音の設計を持つ。最も明確な違いは低音で、車の音響装置で鳴らすことを前提に、極端に低い帯域が長く伸びるよう作られる。Roland TR-</p>
<p>アメリカ南部の各都市で独自に発達したヒップホップの総称であり、東西の海岸部とは異なる時間感覚と低音の設計を持つ。最も明確な違いは低音で、車の音響装置で鳴らすことを前提に、極端に低い帯域が長く伸びるよう作られる。Roland TR-808由来の、音程を持ったまま数秒にわたって減衰していく低音が土台となり、それ自体が旋律的な役割を担う。リズムは拍を三つに分割する三連符の感覚が強く、細かく刻まれるハイハットが、二連、三連、四連と分割を変えながら疾走感を作る。テンポは表記上は70から80 BPMと遅いが、細分化によって体感の密度は高い。上物は簡素で、短調の不吉なシンセの旋律、鐘や弦楽を模した音が置かれる程度である。ラップは地域ごとに大きく異なり、極めて速い早口、拍にゆったり寄りかかる語り、歌に近い旋律的な発声などが併存する。歌詞は地元の地名、貧困からの脱出、街頭の現実、そして踊りへの誘いを扱い、南部の訛りが隠されずに強調される。踊りと直結した楽曲が多く、特定の動作を指示する歌詞も定型のひとつである。</p>
<h2>成り立ち</h2><p>1980年代、ヒップホップはニューヨークの音楽であり、南部は文化的な後進地として軽んじられていた。この構図を最初に揺るがしたのがフロリダ州マイアミである。1980年代半ば、Luther Campbell率いる2 Live Crewが、極端に速いテンポと重低音による猥雑な音楽を作り、1990年にはその歌詞が裁判で猥褻と判断されるという事態に至った。この判決は後に覆され、表現の自由をめぐる重要な判例となっている。テキサス州ヒューストンでは、Rap-A-Lot Recordsを拠点にGeto Boysが、暴力と精神の錯乱を扱う作品で全国的な評価を得た。同市ではDJ Screwが、テンポを極端に落として音程を下げる独自の加工を編み出し、これは咳止め薬の乱用と結びついた文化とともに広まる。彼は2000年に薬物により29歳で死去した。ルイジアナ州ニューオーリンズではCash Money RecordsとNo Limit Recordsが、独立系でありながら莫大な売り上げを記録し、南部の経済的な自立を証明した。決定的だったのはジョージア州アトランタである。1990年代半ば、OutKastとGoodie Mobを擁するDungeon Familyが、南部の音楽的な遺産を前面に出した作品を発表した。1995年、OutKastが東海岸中心の授賞式で新人賞を受けた際、会場から野次を浴びたAndré 3000が、南部にも言うべきことがあると叫んだ場面は、この地域の転換点として繰り返し語られる。以後、アトランタは世界のヒップホップの中心地となり、2000年代のクランク、2010年代のトラップを生み出して、現在の主流の音そのものを規定するに至った。かつて田舎者として嘲笑された地域が、四半世紀を経て産業の中心を占めたという逆転は、アメリカの大衆音楽史における最も大きな転換のひとつである。</p>
