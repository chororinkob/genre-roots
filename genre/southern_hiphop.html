<h1>Southern Hip Hop（サザンヒップホップ）とは</h1>
<p>アメリカ南部の各都市で独自に発達したヒップホップの総称だ。東西の海岸部とは異なる時間感覚と、低音の設計を持つ。 最も明確な違いは低音である。とくにマイアミ・ベースではカーオーディオ文化と結び付き、車の音響装置で鳴らすことを前提に、</p>
<p>アメリカ南部の各都市で独自に発達したヒップホップの総称だ。東西の海岸部とは異なる時間感覚と、低音の設計を持つ。

最も明確な違いは低音である。とくにマイアミ・ベースではカーオーディオ文化と結び付き、車の音響装置で鳴らすことを前提に、極端に低い音域が長く伸びるよう作られる。Roland TR-808由来のバスドラムを長く伸ばし、音程を付けて低音(サブベース)として使うことが土台となり、それ自体が旋律的な役割を担う。メロディーを受け持つ上の音は、トラップでは暗いシンセや弦楽的な音が使われる。

リズムは、トラップや一部のグループでは三連符・細分ハイハットが特徴的だ。拍を三つに分割する三連符の感覚が強く、細かく刻まれるハイハットが、1拍を2つ、3つ、4つと分ける数を変えながら疾走感を作る。テンポは曲によって幅が広い。マイアミ・ベースでは資料により100から140 BPM、典型的には125から130 BPM前後とされる。一方、トラップ的な曲では半分の速さで数えて遅く表記されることもあり、細分化によって体感の密度は高い。

ラップは地域ごとに大きく異なる。極めて速い早口、拍にゆったり寄りかかる語り、歌に近い旋律的な発声などが併存する。

歌詞は地元の地名、貧困からの脱出、街頭の現実、そして踊りへの誘いを扱い、南部の訛りが隠されずに強調される。踊りと直結した楽曲が多く、特定の動作を指示する歌詞も定型のひとつである。</p>
<h2>成り立ち</h2><p>1980年代、ヒップホップはニューヨークの音楽であり、南部は文化的な後進地として軽んじられていた。この構図を揺るがした都市の一つが、フロリダ州マイアミである。

1980年代半ば、Luther Campbellがマネージャーとして関わった。のちに加わった2 Live Crewは、当時のヒップホップとしては速い、ダンス向けのテンポと重低音による猥雑な音楽を作った。1990年にはその歌詞が裁判で猥褻と判断された。この判決は後に覆され、表現の自由をめぐる重要な判例となっている。

テキサス州ヒューストンでは、Rap-A-Lot Recordsを拠点にGeto Boysが、暴力と精神の錯乱を扱う作品で全国的な評価を得た。同市ではDJ Screwが、テンポを極端に落として音程を下げる独自の加工を編み出した。これは咳止め薬の乱用と結びついた文化とともに広まる。彼は2000年に薬物により29歳で死去した。

ルイジアナ州ではCash Money RecordsとNo Limit Recordsが、それぞれUniversalやPriority Recordsの配給を受けながら莫大な売り上げを記録した。

決定的だったのはジョージア州アトランタである。1990年代半ば、Dungeon Familyの制作陣と共に、OutKastやGoodie Mobがそれぞれ南部の音楽的な遺産を前面に出した作品を発表した。1995年、OutKastが東海岸中心の授賞式であるThe Source Awardsの新人グループ部門で受賞した際、会場から野次を浴びたAndré 3000が、「The South got something to say」と述べた。この場面は、この地域の転換点として繰り返し語られる。

2000年代以降、アトランタはヒップホップ革新の重心の一つとなった。起源には諸説あり、メンフィスのクラブ文化とThree 6 Mafiaの役割が重視されるクランクは、アトランタではLil Jonが普及させた。1990年代のアトランタのラップに主題が現れ、2000年代に定着したトラップは、2010年代に主流化した。</p>
