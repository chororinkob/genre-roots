<h1>City Funk（シティファンク）とは</h1>
<p>1970年代後半から1980年代の日本で作られた、ファンクとソウルの語法を都会的な感覚で消化したポップスである。リズムの基本は16分音符を細かく刻む形で、ドラムはハイハットを絶えず細分し、スネアの位置をわずかに後ろへずらすことで、</p>
<p>1970年代後半から1980年代の日本で作られた、ファンクとソウルの語法を都会的な感覚で消化したポップスである。リズムの基本は16分音符を細かく刻む形で、ドラムはハイハットを絶えず細分し、スネアの位置をわずかに後ろへずらすことで、前へ突っ込まない粘りのある躍動を作る。テンポは概ね100から120 BPMと、走らず落ち着いた速度に置かれる。ギターは歪ませず、弦を押さえた瞬間に消音する歯切れの良い刻みを担当し、この乾いた粒立ちがリズムの網目を細かくする。ベースは指弾きで動き回るか、弦を叩いて弾く奏法で打楽器的な役割を担う。鍵盤ではFender Rhodesの丸い和音とクラビネットの引っかかる音が使われ、そこへ実際の金管楽器による斉奏が加わる。この生の管楽器の厚みが、この分野の贅沢さを象徴している。和声はジャズ由来の四和音や、次々に色の変わる進行が用いられ、単純な三和音はほとんど現れない。歌唱は張り上げず、日本語の言葉をリズムに滑らかに乗せることが重視される。歌詞は夜の街、海辺、車での移動、都会での恋愛といった情景を扱い、生活の苦労や社会の問題はほとんど描かれない。</p>
<h2>成り立ち</h2><p>背景にあるのは高度経済成長を経た日本の都市の変貌である。1970年代半ば、東京は生活水準が上がり、輸入レコードが容易に手に入り、若い音楽家が海外の最新のソウルやファンクを実時間で追える環境が整った。それ以前の日本のポップスが、フォークの叙情か歌謡曲の情念を軸としていたのに対し、この世代は生活の苦しさを歌う必然性を持たず、代わりに洗練された都市生活そのものを題材とした。中心となったのは、はっぴいえんど解散後の面々である。細野晴臣らが結成したティン・パン・アレーは、演奏者の集団として無数の録音を支え、日本語をアメリカのリズムに乗せる技術を確立した。山下達郎は、多重録音による緻密な合唱と、演奏の精度への異様な執着によって、この分野の水準を決定づける。彼が1982年に発表した楽曲群に見られる、16分の刻みと分厚い管楽器の組み合わせは、後年に至るまで模倣され続けた。吉田美奈子は歌手として、また作詞家として力強い存在感を示し、大貫妙子はより繊細で欧州的な方向を追求した。1980年代に入ると角松敏生が、より直接的にアメリカのブラックミュージックを志向した作品を発表し、この系譜を若い世代へ引き継いだ。この音楽を支えたのは、極めて高い技量を持つ職業演奏家の層である。当時の東京には、複数の録音を一日に掛け持ちする一流の奏者が存在し、彼らの精度がこの分野の音の質を保証していた。同時に、制作費を潤沢にかけられたのは、レコードが確実に売れ、企業の広告と結びついた時代だったからでもある。1990年代のバブル経済の崩壊とともに、この贅沢な制作環境は失われた。しかし2010年代以降、当時の作品が海外の若い聴き手によってインターネット上で発見され、シティポップという呼称のもとで世界的な再評価を受けている。この現象は、原盤権を持つ日本のレコード会社が国外での配信に消極的だった時期に、非公式な動画共有を通じて広まったという皮肉な経緯も含んでいる。</p>
