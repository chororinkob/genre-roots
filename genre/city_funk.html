<h1>City Funk（シティファンク）とは</h1>
<p>1970年代後半から1980年代の日本で作られたポップスだ。ファンクとソウルの表現を、都会的な感覚で自分たちのものにしている。「シティ・ポップ」のうち、ファンクやソウルの影響が強い作品を、便宜的に「City Funk」と呼ぶことが</p>
<p>1970年代後半から1980年代の日本で作られたポップスだ。ファンクとソウルの表現を、都会的な感覚で自分たちのものにしている。「シティ・ポップ」のうち、ファンクやソウルの影響が強い作品を、便宜的に「City Funk」と呼ぶことがある。

鍵盤では、Fender Rhodesの丸い和音が使われる。そこへ、トランペット、トロンボーン、サックスなどのホーン・セクションが加わる。この生の管楽器の厚みが、この分野のぜいたくさを表している。ギターでは、山下達郎「SPARKLE」のカッティングが知られる。

リズムの基本は、16分音符を細かく刻む形だ。テンポは走らず、落ち着いた速さに置かれることが多い。

歌は張り上げず、日本語の言葉をリズムに滑らかに乗せることが大切にされる。

歌詞は、夜の街、海辺、車での移動、都会での恋愛といった情景を扱う。生活の苦労や社会の問題は、中心的な主題ではない。</p>
<h2>成り立ち</h2><p>舞台は、高度経済成長を経て大きく変わった日本の都市だ。1970年代半ば、東京では生活水準が上がった。当時の音楽は、洋楽、特にアメリカ音楽の日本独自なアレンジという側面を持つ。

この音楽は、ニューミュージックを母体とし、洋楽志向の都会的な作風を持つ。洗練された都市生活そのものを題材にした。中心になったのは、はっぴいえんどやシュガー・ベイブ周辺の音楽家たちだ。ただし、起源には諸説ある。

細野晴臣らは、1973年に「キャラメル・ママ」を結成し、1974年にティン・パン・アレーと改名した。この集団は演奏者として多くの録音を支え、日本語をアメリカのリズムに乗せる試みを重ねた。

山下達郎は「音の職人」と呼ばれ、多重録音による緻密なコーラスで知られる。彼が1982年1月に発表した『FOR YOU』には、ホーンが参加している。ギター・カッティングが特徴の『SPARKLE』も、このアルバムに入っている。

吉田美奈子は、歌手として、また作詞家として力強い存在感を示した。大貫妙子は、より繊細でヨーロッパ的な方向を追い求めた。1980年代に入ると、角松敏生が、より直接的にアメリカのブラックミュージックを目指した作品を発表した。こうして彼が、この流れを若い世代へ引き継いだ。

この音楽を支えたのは、極めて高い技術を持つプロの演奏家たちである。また、企業の広告とのタイアップからヒット曲が多く生まれた時代だった。

しかし、1980年代後半に流行は下火になる。バブル崩壊後は、社会の停滞感や好みの変化から、シティ・ポップと呼べる曲が激減し、J-POPの中に埋もれていった。

それでも2010年代前半、ヴェイパーウェイヴやフューチャー・ファンクでのサンプリングに始まり、当時の作品は、海外の若い聴き手によってインターネット上で発見されていった。そして、シティポップという呼び名のもとで、世界的な再評価を受けている。2018年には、無許可でアップロードされた竹内まりやの「プラスティック・ラヴ」が、YouTubeのおすすめを通じて世界的に広まった。この現象には、海外向けの公式配信が限られていた中で、非公式な動画共有を通じて広まったという皮肉な経緯もある。</p>
