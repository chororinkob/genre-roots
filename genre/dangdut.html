<h1>Dangdut（ダンドゥット）とは</h1>
<p>ダンドゥットは、インドネシアで最も人気のあるポピュラー音楽の一つだ（しばしば「最も人気」と評される）。インドのボリウッド映画音楽の情熱的なメロディー、スマトラ（メダン周辺）にも根を持つマレー系音楽（オルケス・ムラユ）、そしてアラブ</p>
<p>ダンドゥットは、インドネシアで最も人気のあるポピュラー音楽の一つだ（しばしば「最も人気」と評される）。インドのボリウッド映画音楽の情熱的なメロディー、スマトラ（メダン周辺）にも根を持つマレー系音楽（オルケス・ムラユ）、そしてアラブ・中東の要素に、1970年代にロックが加わって形成された独特のサウンドを持つ。

伴奏には、タブラ／グンダン、フルート（スリン）、マンドリン、ギター、シンセサイザー、ドラムマシンなどが用いられる。旋律楽器にはインド・中東風の奏法が見られる。1950〜60年代にインドネシア（メダン、ジャカルタ、スラバヤ）で栄えた、マレー語の歌と主に西洋楽器による合奏「オルケス・ムラユ」の楽器編成の名残も見られる。

メロディーは、うねるように装飾が多い。テンポは、ゆったりした古典的な形式から、速いコプロまで幅がある。

リズムの中心は、タブラ（インドの手で叩く太鼓）に似た太鼓だ。

歌い手は、情感豊かに歌い上げる。腰を大きく揺らして踊る官能的なダンス(ゴヤン)も欠かせず、歌とダンスが一体となって楽曲を作り上げる。

この音楽は、屋台の並ぶ夜市や地方の祭りの喧騒とともにある。約2億7千万人（2020年国勢調査）の人口を抱える国の生活に、深く根ざしている。

「ダンドゥット」という名称の由来には諸説ある。擬音語が由来とされ、Rhoma Iramaは、富裕層が貧しい人々の音楽を見下して呼んだ言葉だったと述べている。音楽誌Aktuilが造語したとの説もある。</p>
<h2>成り立ち</h2><p>ダンドゥットは、1960年代末から1970年代初頭にかけて形づくられた。起源の時期には諸説ある。1970年代にはRhoma Iramaらが、この音楽を盛んにした。

Rhoma Iramaは「ダンドゥットの王」と呼ばれ、型を固めるうえで大きな役割を果たした中心人物である。彼は自身のバンドSoneta Groupを率いた。歌詞には宗教的・政治的なメッセージも込め、庶民から熱い支持を集めた。後年は、国民協議会（MPR）議員（1990年代前半〜1997年）、国民代表評議会（DPR）議員（1997〜99年）としても活動した。Rhoma Irama自身は、Soneta Groupを率いるかたわら、数多くの映画にも主演した。音楽と映像の両面で、ダンドゥットを国民的な娯楽として定着させた。

同じ黎明期の重要人物が、歌手Elvy Sukaesihである。「ダンドゥットの女王」と称され、Rhoma Iramaと並び立つ存在だった。

2003年、Inul Daratistaが全国的な知名度を得た。彼女は、過激な腰の動きを見せるダンス「ゴヤン・ンゲボル（goyang ngebor）」で、賛否両論を巻き起こした。それでもテレビ出演や、海賊版のVCDを通じた広がりによって、国民的な大スターとなった。この論争は、インドネシア社会における芸能表現の自由をめぐる議論にまで発展した。

同じ流れのなかで、テンポを大幅に上げた「コプロ(Dangdut Koplo)」と呼ばれるスタイルが広まった。東ジャワで1990年代半ば〜2000年代初頭に形成されたもので、形成時期・起源には諸説ある。ドラムのパターンは西ジャワのジャイポンガンに由来するという、Weintraubが紹介する奏者の説もある。2003年のInul Daratistaの成功で、コプロは全国へ広まった。

2010年代半ばからは、Via VallenやNella Kharismaらによるポップ・コプロが、YouTubeを通じて新しい聴衆（若い世代）にも広がった（2017年に年間人気動画上位）。Via VallenとNella Kharismaは、現代のダンドゥットシーンを代表するスターである。

テレビの歌唱番組「D'Academy」は、Indosiarが2014年2月3日に開始したダンドゥットのタレント番組である。</p>
