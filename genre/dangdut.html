<h1>Dangdut（ダンドゥット）とは</h1>
<p>インドネシアで圧倒的な国民的人気を誇るポピュラー音楽。インドのボリウッド映画音楽の情熱的なメロディー、マレー半島の民俗音楽、そしてアラブ由来の旋律感覚が融合してできた独特のサウンドを持つ。タブラに似た太鼓が刻む「ダン」「グッ」とい</p>
<p>インドネシアで圧倒的な国民的人気を誇るポピュラー音楽。インドのボリウッド映画音楽の情熱的なメロディー、マレー半島の民俗音楽、そしてアラブ由来の旋律感覚が融合してできた独特のサウンドを持つ。タブラに似た太鼓が刻む「ダン」「グッ」という2つの音が、そのままジャンル名の由来になったとされる。うねるように装飾の多いメロディー、情感豊かに歌い上げるボーカル、そして腰を大きく揺らして踊る官能的なダンス(ゴヤン)が一体となって楽曲を作り上げる。テンポは中速が中心。屋台の並ぶ夜市や地方の祭りの喧騒とともにある、2億7千万人を超える人口を抱える国の生活に深く根ざした音楽である。「ダンドゥット」という名称自体、当初はこの太鼓の音を揶揄する形で他ジャンルの支持者から使われ始めた俗称だったが、後にそのままジャンル名として定着した経緯がある。伴奏には、インド映画音楽の影響を感じさせるシタール風のシンセ音や、マレー半島由来の合奏「オルケス・ムラユ」の楽器編成の名残も見られる。</p>
<h2>成り立ち</h2><p>1970年代、Rhoma Iramaが「ダンドゥットの王」と呼ばれる地位を確立し、インド映画音楽とマレー音楽の要素を融合させて現在のダンドゥットの型を作り上げた。彼は自身のバンドSoneta Groupを率い、歌詞に宗教的・政治的なメッセージも込め、庶民からの熱い支持を集めるとともに、後年は国会議員としても活動した。2003年頃に登場したInul Daratistaは、過激な腰の動きを見せるダンス「ゴヤン・ンゴボール」で賛否両論を巻き起こしながらも、テレビ出演やレコード売上で国民的な大スターとなり、この論争はインドネシア社会における芸能表現の自由をめぐる議論にまで発展した。Via VallenやNella Kharismaは、現代のダンドゥットシーンを代表するスターである。2010年代には、テンポを大幅に上げ、東ジャワの伝統打楽器のリズムを取り入れた「コプロ(Dangdut Koplo)」と呼ばれるスタイルが登場し、露天のライブイベントを中心に若い世代の間で爆発的な人気を博した。近年ではYouTubeを通じて、ダンドゥットの弾き語りカバー動画が国外のリスナーの間でも話題になることがある。歌手Elvy Sukaesihは、その卓越した歌唱力から「ダンドゥットの女王」と称され、Rhoma Iramaと並ぶ黎明期の重要人物である。Rhoma Irama自身は、自らのバンドSoneta Groupを率いる傍ら数多くの映画にも主演し、音楽と映像の両面でダンドゥットを国民的な娯楽として定着させた。テレビの歌唱オーディション番組「D'Academy」は、2014年の放送開始以降、地方出身の新人歌手たちの登竜門として機能し、ダンドゥットの人気を若い世代にまで広げ続けている。</p>
<h2>代表曲</h2><ul><li>Begadang (Rhoma Irama)</li><li>Goyang Inul (Inul Daratista)</li><li>Sayang (Via Vallen)</li><li>Jaran Goyang (Nella Kharisma)</li><li>Kopi Dangdut (Fahmi Shahab)</li></ul>
