<h1>Honky Tonk（ホンキートンク）とは</h1>
<p>酒場で酔客の話し声を突き抜けて聞かせるために組み立てられたカントリーの様式である。編成はエレキギター、スティール・ギター、フィドル、ウッドベース、ドラムが基本で、酒場の騒音に対抗するため、ドラムも取り入れられた。決定的な音色を担う</p>
<p>酒場で酔客の話し声を突き抜けて聞かせるために組み立てられたカントリーの様式である。編成はエレキギター、スティール・ギター、フィドル、ウッドベース、ドラムが基本で、酒場の騒音に対抗するため、ドラムも取り入れられた。決定的な音色を担うのがスティール・ギターで、金属の棒を弦の上で滑らせて音程を連続的に変化させる。ペダルと膝レバーで演奏中に弦の張力を変えるペダル式が一般化したのは1950年代以降である。ペダル式では、和音を押さえたまま内声だけが滑り上がるという、他の楽器では出せない動きも生まれる。この泣くような音が歌詞の悲哀を代弁する役割を負っている。リズムは2拍目と4拍目を強く踏むシャッフルか、低音を1拍おきに往復させるツービート。テンポは中庸で、踊れる速さに保たれる。歌唱は鼻にかかった南部の訛りを強調し、語尾を裏声へ跳ね上げるヨーデル的な崩し(使わない歌手もいる)や、泣き声を模した震えを混ぜる。歌詞の主題は徹底して限定されており、酒、浮気、離婚、罪悪感、孤独、そして日曜の朝の後悔で占められる。信仰と堕落の間で揺れる人間を、装飾せずに一人称で歌うのが型である。都会的な洗練を意図的に拒み、粗さそのものを様式にしている。</p>
<h2>成り立ち</h2><p>名称の由来である「ホンキー・トンク」は、19世紀後半から使われた俗語(最古の印刷用例は1874年)で、テキサスやオクラホマなどにあった安酒場を指す。1930年代の油田景気で、南西部の労働者が集まる酒場が盛んになった。テキサスでは1933年に3.2%ビールが解禁され、州の禁酒法の廃止は1935〜36年、オクラホマの禁酒は1959年まで続いた。こうした店は騒がしく喧嘩が絶えず、演奏者は生楽器では対抗できなかった。これが電気楽器やドラムを取り入れる理由の一つになった。ドラムは西部劇スウィングのBob Willsが1935年から録音に使っていたが、当時のカントリー界ではドラムは下品な楽器と見なされ、ナッシュビルの由緒あるラジオ番組グランド・オール・オプリでは長く舞台に上げることが禁じられ、1944年のWills一座の出演でようやく条件付きで認められた。様式を広めた中心人物の一人がアーネスト・タブで、1941年の『ウォーキング・ザ・フロア・オーヴァー・ユー』でエレキギターを取り入れた。Al DexterやTed Daffan、Floyd Tillmanらと共に形成された。決定的な存在となったのがハンク・ウィリアムズで、1922年の曲をカバーして1949年にヒットさせた『ラヴシック・ブルース』から1953年の死までのわずか数年で、この様式の歌詞の様式を確立した中心人物の一人となった。彼は短い言葉で心情を言い切る書き方を持ち込み、『アイム・ソー・ロンサム・アイ・クッド・クライ』のような作品を残す一方、鎮痛剤と酒への依存が進み、1953年の元日に移動中の車内で29歳で死んでいる。同じ時期にレフティ・フリゼルが独特の語尾を伸ばす歌い方を、ウェブ・ピアースが甲高い声を、ジョージ・ジョーンズが精密な音程の崩しを持ち込んだ。1950年代後半になるとナッシュビルの制作者たちは、この粗い音を弦楽器と合唱で覆う洗練路線へ舵を切り、ホンキー・トンクは一度主流から外れる。これに反発したのが西海岸のベーカーズフィールドに集まった演奏者たちで、バック・オウエンズとマール・ハガードが金属的なテレキャスターの音でこの様式を蘇らせた。1970年代のアウトロー・カントリー、1980年代のドワイト・ヨーカム、そして現在の土着的なカントリーに至るまで、ナッシュビルの洗練に対する対抗軸として何度も呼び出され続けている。</p>
<h2>代表曲</h2><ul><li>Guitars, Cadillacs (Dwight Yoakam)</li><li>Hey, Good Lookin' (Hank Williams)</li><li>Lost Highway (Hank Williams)</li><li>Your Cheatin' Heart (Hank Williams)</li><li>Heartaches by the Number (Ray Price)</li><li>He Stopped Loving Her Today (George Jones)</li><li>Lovesick Blues (Hank Williams)</li><li>Walking the Floor Over You (Ernest Tubb)</li><li>Crazy Arms (Ray Price)</li><li>Honky Tonk Man (Johnny Horton)</li><li>It Wasn't God Who Made Honky Tonk Angels (Kitty Wells)</li><li>The Wild Side of Life (Hank Thompson)</li></ul>
