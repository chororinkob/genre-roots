<h1>Honky Tonk（ホンキートンク）とは</h1>
<p>酒場で酔客の話し声を突き抜けて聞かせるために組み立てられたカントリーの様式である。編成はエレキギター、スティール・ギター、フィドル、ウッドベース、ドラムが基本で、カントリーにドラムを持ち込んだ初期の形にあたる。決定的な音色を担うの</p>
<p>酒場で酔客の話し声を突き抜けて聞かせるために組み立てられたカントリーの様式である。編成はエレキギター、スティール・ギター、フィドル、ウッドベース、ドラムが基本で、カントリーにドラムを持ち込んだ初期の形にあたる。決定的な音色を担うのがスティール・ギターで、金属の棒を弦の上で滑らせて音程を連続的に変化させ、ペダルと膝レバーで演奏中に個々の弦の張力を変える。この結果、和音を押さえたまま内声だけが滑り上がるという、他の楽器では出せない動きが生まれる。この泣くような音が歌詞の悲哀を代弁する役割を負っている。リズムは二拍目と四拍目を強く踏むシャッフルか、低音を一拍おきに往復させるツービート。テンポは中庸で、踊れる速さに保たれる。歌唱は鼻にかかった南部の訛りを強調し、語尾を裏声へ跳ね上げるヨーデル的な崩しや、泣き声を模した震えを混ぜる。歌詞の主題は徹底して限定されており、酒、浮気、離婚、罪悪感、孤独、そして日曜の朝の後悔で占められる。信仰と堕落の間で揺れる人間を、装飾せずに一人称で歌うのが型である。都会的な洗練を意図的に拒み、粗さそのものを様式にしている。</p>
<h2>成り立ち</h2><p>名称の由来である「ホンキー・トンク」は、二十世紀初頭のテキサスやオクラホマにあった安酒場を指す俗語である。禁酒法時代を経て、1933年の禁酒法廃止と油田景気が重なり、南西部の労働者が集まる酒場が急増した。こうした店は騒がしく喧嘩が絶えず、演奏者は生楽器では対抗できなかった。これがカントリーの電化とドラム導入の直接の理由になっている。当時のカントリー界ではドラムは下品な楽器と見なされ、ナッシュビルの由緒あるラジオ番組グランド・オール・オプリでは長く舞台に上げることが禁じられていた。様式を確立したのはアーネスト・タブで、1941年の『ウォーキング・ザ・フロア・オーヴァー・ユー』でエレキギターを前面に出した。決定的な存在となったのがハンク・ウィリアムズで、1949年の『ラヴシック・ブルース』から1953年の死までのわずか数年で、この様式の歌詞の型をほぼ一人で完成させた。彼は短い言葉で心情を言い切る書き方を持ち込み、『アイム・ソー・ロンサム・アイ・クッド・クライ』のような作品を残す一方、鎮痛剤と酒への依存が進み、1953年の元日に移動中の車内で29歳で死んでいる。同じ時期にレフティ・フリゼルが独特の語尾を伸ばす歌い方を、ウェブ・ピアースが甲高い声を、ジョージ・ジョーンズが精密な音程の崩しを持ち込んだ。1950年代後半になるとナッシュビルの制作者たちは、この粗い音を弦楽器と合唱で覆う洗練路線へ舵を切り、ホンキー・トンクは一度主流から外れる。これに反発したのが西海岸のベーカーズフィールドに集まった演奏者たちで、バック・オウエンズとマール・ハガードが金属的なテレキャスターの音でこの様式を蘇らせた。1970年代のアウトロー・カントリー、1980年代のドワイト・ヨーカム、そして現在の土着的なカントリーに至るまで、ナッシュビルの洗練に対する対抗軸として何度も呼び出され続けている。</p>
