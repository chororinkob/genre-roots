<h1>Honky Tonk（ホンキートンク）とは</h1>
<p>ホンキー・トンクは、酒場で酔った客の話し声を突き抜けて聞かせるために組み立てられた、カントリーのスタイルだ。 編成はギター、フィドル、ベース、スティール・ギターが基本である。ドラムは後から、酒場の騒音に対抗するために加わった。音色</p>
<p>ホンキー・トンクは、酒場で酔った客の話し声を突き抜けて聞かせるために組み立てられた、カントリーのスタイルだ。

編成はギター、フィドル、ベース、スティール・ギターが基本である。ドラムは後から、酒場の騒音に対抗するために加わった。音色を決めるのがスティール・ギターで、金属の棒を弦の上で滑らせて、音程を途切れなく変化させる。ペダルと膝レバーで演奏中に弦の張力を変えるペダル式は、1950年代以降に一般化した。ペダル式では、和音を押さえたまま内声（和音の中ほどの音）だけが滑り上がる。他の楽器では出せない動きだ。この泣くような音が、歌詞の悲しみを代わりに語る役割を負っている。

リズムは、2拍目と4拍目を強く踏むシャッフル（跳ねるリズム）か、低音を1拍おきに往復させるツービート（2拍子で刻むリズム）である。テンポは中くらいで、踊れる速さに保たれる。

歌い方は、鼻にかかった南部の訛りをはっきり出す。語尾を裏声へ跳ね上げ、ヨーデル（裏声と地声を素早く切り替える歌い方）のように崩すこともある(使わない歌手もいる)。泣き声をまねた震えも混ぜる。

歌詞は、労働者階級の生活を軸に、失恋、不倫、孤独、アルコール依存、自己憐憫といった悲劇的な主題がよく扱われる。

都会的な洗練を、あえて拒む。粗さそのものが、このスタイルの持ち味になっている。</p>
<h2>成り立ち</h2><p>名称の元になった「ホンキー・トンク」は、19世紀後半から使われた俗語で、起源は不明だ。印刷物での最古の用例は1874年(Peoria Journal、イリノイ州)とされる。辞書(Merriam-Webster)の初出は1889年だ。初めは、売春宿・寄席・劇場・安酒場など、幅広い場所を指した。

1930年代には油田景気が起こり、南西部の労働者が集まる酒場が盛んになった。テキサスでは1933年に3.2%ビールが解禁された。州の禁酒法の廃止は1935〜36年で、オクラホマの禁酒は1959年まで続いた。こうした店は騒がしく、喧嘩が絶えなかった。演奏者は生の楽器では太刀打ちできず、これが電気楽器やドラムを取り入れる理由の一つになった。

ドラムは、ウェスタン・スウィング（カントリーとジャズを混ぜた音楽）のBob Willsが、1935年から録音に使っていた。しかし当時のカントリー界では、ドラムはポップ(流行歌)の楽器で、カントリーにふさわしくないと見なされた。ナッシュビルの由緒あるラジオ番組グランド・オール・オプリでも、長く舞台に上げることが禁じられていた。1944年12月30日、Willsは規則を無視してドラマーを舞台中央に置き、前例を破った。Opryでドラムが一般化したのは、その後何年も経ってからだ。

スタイルを広めた中心人物の一人が、アーネスト・タブである。1941年の『ウォーキング・ザ・フロア・オーヴァー・ユー』で、Smithのエレキギターを前面に出し、スタイルの転換を示した。Al DexterやTed Daffan、Floyd Tillmanらも、このスタイルの形成に加わった。

決定的な存在となったのが、ハンク・ウィリアムズだ。1922年の曲を、Rex Griffin版の編曲を踏まえてカバー（他の人の曲を歌うこと）し、1949年にヒットさせた。それが『ラヴシック・ブルース』である。そこから1953年の死までのわずか数年で、彼はこのスタイルの歌詞の書き方を定着させた中心人物の一人となった。短い言葉で心情を言い切る書き方を持ち込み、『アイム・ソー・ロンサム・アイ・クッド・クライ』のような作品を残した。一方で、鎮痛剤と酒への依存が進み、1953年の元日、移動中の車内で29歳で死んだ。

同じ時期に、レフティ・フリゼルは独特の語尾を伸ばす歌い方を、ウェブ・ピアースは甲高い声を、ジョージ・ジョーンズは精密な音程の崩しを持ち込んだ。

1950年代後半になると、ナッシュビルの制作者たちは、この粗い音を弦楽器と合唱で覆う洗練路線へ舵を切った。ホンキー・トンクは、一度主流から外れる。

これに反発したのが、西海岸のベーカーズフィールドに集まった演奏者たちだ。Wynn Stewartらが先駆けとなり、バック・オウエンズとマール・ハガードが、金属的なテレキャスターの音でこのスタイルを成功させた。1970年代のアウトロー・カントリー、1980年代のドワイト・ヨーカム、そして現在の土地に根ざしたカントリーに至るまで、ホンキー・トンクはナッシュビルの洗練に対する対抗軸として、何度も呼び出され続けている。</p>
