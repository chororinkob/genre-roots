<h1>Blackgaze（ブラックゲイズ）とは</h1>
<p>ブラックゲイズは、ブラックメタルの演奏の形と、シューゲイザーの霞んだ音響を重ね合わせた音楽だ。 中心になるのはギターである。同じ音を高速で弾き返すトレモロ奏法を基本とする。そこにディレイとリバーブを極端に深くかけるため、音符の輪郭</p>
<p>ブラックゲイズは、ブラックメタルの演奏の形と、シューゲイザーの霞んだ音響を重ね合わせた音楽だ。

中心になるのはギターである。同じ音を高速で弾き返すトレモロ奏法を基本とする。そこにディレイとリバーブを極端に深くかけるため、音符の輪郭が溶けて、一枚の面のような響きになる。

和音は、決定的に違う点だ。伝統的なブラックメタルは、不協和音と短調の絶望を選ぶことが多い。これに対し、この分野は長調や、切なさを含む明るい響きを進んで使う。激烈な演奏で美しい和音を鳴らすという矛盾こそが、本質である。

ドラムでは、面になった音の上にブラストビートが敷かれる。激しく叩かれているのに、全体としては静かで浮遊した感覚が生まれる。

歌い方は、叫ぶ歌唱が多い。ただし、Alcestのように澄んだ歌声の例も多い。歌詞は聴き取りにくいことがある。内容は、幼年期の記憶、喪失、自然、死後の世界といった内省的な主題を扱う。憎悪や冒涜を掲げないことも、原理的なブラックメタルとの違いである。

曲は、6〜8分程度から10分超の長尺のものが多い。一方で、短い間奏曲も挟まれる。静かなアルペジオから始まり、長い時間をかけて轟音へ至り、また引いていく。そんな波の構造を持つ。</p>
<h2>成り立ち</h2><p>背景には、二つの流れがある。

ひとつは、一般にノルウェーのシーンが起点とされるブラックメタルだ。1990年代前半に固まり、粗い録音と、トレモロによる音がぎっしり詰まった壁のような手法が、ここで完成したとされる。1991年4月のSamael『Worship Him』を起点とする説もある。もうひとつは、1980年代後半に英国（ロンドンやテムズ・バレー周辺）で生まれ、1990年代初頭に最盛期を迎えたシューゲイザーである。My Bloody Valentineが1991年に発表したラヴレスに代表される、メロディーを歪みと残響の霞の中へ沈める、音の考え方だ。

アメリカ西海岸のWeaklingが2000年に発表した作品は、長大な構成と情感を伴うブラックメタルとして、後に繰り返し参照された。Deafheavenが影響を公言するほどである。

先駆者の一人が、フランスのStéphane Pautだ。Neigeという名で活動する彼は、当初は粗いブラックメタルを作っていた。しかし、自身が幼少期に見たという幻視的な世界を描くため、2005年のEP『Le Secret』を経て、2007年の1stフルアルバム『Souvenirs d'un autre monde』で咆哮をほとんど排した。澄んだ歌声と煌めくギターによる作品を、作り上げたのである。本人の弁によれば、シューゲイザーを知らずに作曲したというが、批評家が類似を指摘し、その文脈で語られるようになった。発売当初は戸惑いの声が多く、2枚目の頃から、保守的なブラックメタルのファンの反発が強まった。

2013年、サンフランシスコのDeafheavenが発表したサンベイザーが、状況を一変させる。ピンクとオレンジの抽象的なジャケットが目を引いた。歌手George Clarkeは、コープスペイントを使わずに演じ、ブラックメタルの定番の装いとは異なっていた。この作品はMetacriticの集計で2013年の最高評価作となった。すると、伝統的な愛好家からは、流行に迎合した偽物だという猛烈な反発が起きた。

少なくとも2015年頃まで、純粋主義者からの批判が残った。本物とは何かという議論が、この分野全体に突きつけられたのである。呼称としてのブラックゲイズは外部からのラベルであり、Neigeのように、ジャンル名やラベル全般に否定的な当事者もいる。

各国にも作り手が現れた。ドイツのLantlôs(2005年〜)は、Neigeが参加した2010〜2013年の作品がブラックゲイズとされる。デンマークのMøl(2013年結成)、アゼルバイジャンのViolet Cold(2013年〜)なども現れた。ポストロックやドリームポップとの境界は、さらに曖昧になった。攻撃性をトレードマークとする音楽が、内省と美しさを扱えることを証明した点で、この分野はメタルの表現の幅を確実に広げている。</p>
