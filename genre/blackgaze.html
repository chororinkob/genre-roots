<h1>Blackgaze（ブラックゲイズ）とは</h1>
<p>ブラックメタルの演奏の形と、シューゲイザーの霞んだ音響を重ね合わせた音楽である。ギターは同じ音を高速で弾き返すトレモロ奏法を基本とするが、そこにディレイとリバーブを極端に深くかけることで、音符の輪郭が溶けて、一枚の面のような響きに</p>
<p>ブラックメタルの演奏の形と、シューゲイザーの霞んだ音響を重ね合わせた音楽である。ギターは同じ音を高速で弾き返すトレモロ奏法を基本とするが、そこにディレイとリバーブを極端に深くかけることで、音符の輪郭が溶けて、一枚の面のような響きになる。この面としての音の上に、ブラストビートが敷かれるため、激しく叩かれているのに全体としては静かで浮遊した知覚が生まれる。決定的に違うのは和音で、伝統的なブラックメタルが不協和音と短調の絶望を選ぶのに対し、この分野は長調や、切なさを含む明るい響きを進んで使う。この、激烈な演奏で美しい和音を鳴らすという矛盾こそが本質である。ヴォーカルは叫ぶ歌唱が多いが、Alcestのように澄んだ歌声の例も多い。歌詞は聴き取りにくいことがある。曲は6分台から14分台まで幅のある長尺のものが多く、静かなアルペジオから始まり、長い時間をかけて轟音へ至り、また引いていく波の構造を持つ。歌詞は幼年期の記憶、喪失、自然、死後の世界といった内省的な主題を扱い、憎悪や冒涜を掲げないことも、原理的なブラックメタルとの違いである。</p>
<h2>成り立ち</h2><p>背景には二つの流れがある。ひとつは1990年代前半のノルウェーで確立したブラックメタルで、粗い録音とトレモロによる音がぎっしり詰まった壁のような手法がここで完成した。もうひとつは1980年代後半にイギリスとアイルランドで生まれ、1990年代初頭に最盛期を迎えたシューゲイザーで、My Bloody Valentineが1991年に発表したラヴレスに代表される、メロディーを歪みと残響の霞の中へ沈める、音の考え方である。アメリカ西海岸のWeaklingが2000年に発表した作品は、長大な構成と情感を伴うブラックメタルとして、Deafheavenが影響を公言するなど後に繰り返し参照された。先駆者の一人がフランスのStéphane Pautで、Neigeという名で活動する彼は、当初は粗いブラックメタルを作っていたが、自身が幼少期に見たという幻視的な世界を描くため、2005年のEP『Le Secret』を経て、2007年にAlcestとして発表した作品で咆哮をほとんど排し、澄んだ歌声と煌めくギターによる作品を作り上げた。本人はシューゲイザーを知らずに作曲したと述べており、批評家が類似を指摘して、その文脈で語られるようになった。ブラックメタルの側から見れば裏切りと受け取られ、発売当初は戸惑いが中心だったが、後に保守的なファンの反発が強まった。2013年、サンフランシスコのDeafheavenが発表したサンベイザーが状況を一変させる。ピンクとオレンジの抽象的なジャケットと、コープスペイントを使わず私服的な装いで演じる歌手George Clarkeの姿は、ブラックメタルの黒い衣装と対極にあり、この作品が音楽メディアで年間最高の評価を集めたことにより、伝統的な愛好家からは流行に迎合した偽物だという猛烈な反発が起きた。この論争は数年にわたって続き、本物とは何かという議論をこの分野全体に突きつけた。呼称としてのブラックゲイズも、当事者の多くが嫌う外部からのラベルである。ドイツのLantlôs(2005年〜)、デンマークのMøl(2013年結成)、アゼルバイジャンのViolet Cold(2013年〜)など各国にも作家が現れ、ポストロックやドリームポップとの境界はさらに曖昧になった。攻撃性を象徴とする音楽が、内省と美しさを扱えることを証明した点で、この分野はメタルの表現の幅を確実に広げている。</p>
