<h1>Blackgaze（ブラックゲイズ）とは</h1>
<p>ブラックメタルの演奏形式と、シューゲイザーの霞んだ音響を重ね合わせた音楽である。ギターは全ての弦を高速で往復して弾くトレモロ奏法を基本とするが、そこにディレイとリバーブを極端に深くかけることで、音符の輪郭が溶けて一枚の面のような響</p>
<p>ブラックメタルの演奏形式と、シューゲイザーの霞んだ音響を重ね合わせた音楽である。ギターは全ての弦を高速で往復して弾くトレモロ奏法を基本とするが、そこにディレイとリバーブを極端に深くかけることで、音符の輪郭が溶けて一枚の面のような響きになる。この面としての音の上に、毎分200打を超えるブラストビートが敷かれるため、激しく叩かれているのに全体としては静かで浮遊した知覚が生まれる。決定的に異なるのは和声で、伝統的なブラックメタルが不協和音と短調の絶望を選ぶのに対し、この分野は長調や、切なさを含む明るい響きを積極的に用いる。この、激烈な演奏で美しい和音を鳴らすという矛盾こそが本質である。ヴォーカルは遠くで叫んでいるように音量を絞って埋め込まれ、歌詞は聴き取れないことが前提とされている。低音域はベースがほとんど聞こえないほど霞ませる一方、中高域の倍音を厚く積み上げるという、通常のミックスとは逆の設計が採られる。曲は8分から12分と長く、静かなアルペジオから始まり、長い時間をかけて轟音へ至り、また引いていく波の構造を持つ。歌詞は幼年期の記憶、喪失、自然、死後の世界といった内省的な主題を扱い、憎悪や冒涜を掲げないことも、原理的なブラックメタルとの違いである。</p>
<h2>成り立ち</h2><p>背景には二つの流れがある。ひとつは1990年代前半のノルウェーで確立したブラックメタルで、粗い録音とトレモロによる密度の高い音の壁という手法がここで完成した。もうひとつは同時期のイギリスで生まれたシューゲイザーで、My Bloody Valentineが1991年に発表したラヴレスに代表される、旋律を歪みとリバーブの霞の中へ沈める音響の思想である。両者が交わる兆しは2000年前後にあり、アメリカ西海岸のWeaklingが2000年に発表した作品は、長大な構成と情感を伴うブラックメタルとして後に繰り返し参照された。決定的な役割を果たしたのはフランスのStéphane Pautで、Neigeという名で活動する彼は、当初は粗いブラックメタルを作っていたが、自身が幼少期に見たという幻視的な世界を描くため、2007年にAlcestとして発表した作品で咆哮をほとんど排し、澄んだ歌声と煌めくギターによる作品を作り上げた。これはブラックメタルの側から見れば裏切りであり、当時は激しい非難を浴びたが、同時に新しい聴き手を大量に呼び込んだ。2013年、サンフランシスコのDeafheavenが発表したサンベイザーが状況を一変させる。淡い桃色の抽象的なジャケットと、白いシャツを着て演じる歌手George Clarkeの姿は、ブラックメタルの黒い衣装と対極にあり、この作品が音楽メディアで年間最高の評価を集めたことにより、伝統的な愛好家からは流行に迎合した偽物だという猛烈な反発が起きた。この論争は数年にわたって続き、真正さとは何かという議論をこの分野全体に突きつけた。呼称としてのブラックゲイズも、当事者の多くが嫌う外部からのラベルである。以後、ドイツのLantlôs、デンマークのMøl、アゼルバイジャンのViolet Coldなど各国に作家が現れ、ポストロックやドリームポップとの境界はさらに曖昧になった。攻撃性を象徴とする音楽が、内省と美しさを扱えることを証明した点で、この分野はメタルの表現の幅を確実に広げている。</p>
