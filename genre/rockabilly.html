<h1>Rockabilly（ロカビリー）とは</h1>
<p>1950年代半ばのアメリカ南部で、白人の若者がカントリーと黒人のリズム・アンド・ブルースを衝突させて生んだ最初期のロックンロールの一形態である。編成は極めて簡素で、電気ギター、コントラバス（大型の弦楽器）、簡素なドラムセットが古典</p>
<p>1950年代半ばのアメリカ南部で、白人の若者がカントリーと黒人のリズム・アンド・ブルースを衝突させて生んだ最初期のロックンロールの一形態である。編成は極めて簡素で、電気ギター、コントラバス（大型の弦楽器）、簡素なドラムセットが古典的な編成で、初期にはドラムを置かない3人組もあった。低音を担うコントラバスは弓を使わず、弦を指で引っ張って指板（弦を押さえる板）に叩きつけるスラップ奏法で演奏され、この打楽器のような弾き方が、簡素なドラムを補いながら独特の跳ねる推進力を生む。ギターは歪みを深くかけないのが一般的で（例外もある）、代わりにテープの遅延装置（音を少し遅らせて重ねる機械）によって短いエコー（こだま）を付けることが多く、この処理によって音は前へ突き抜けながら空間の広がりを持つ。リズムは1・3拍を刻むカントリーのツービートに、ブギ由来の跳ねるシャッフル感（三連符＝1拍を3等分したリズムを感じさせる）が加わる。テンポはカントリーより速く、快活である。形式やコード進行はカントリーより簡素で、力強い。歌唱がこの分野の華で、しゃっくりのように声を裏返す発声、ファルセットへの急転、そして短いエコー（スラップバック）が重ねられ、反抗・性・自由といった態度が剥き出しになる。</p>
<h2>成り立ち</h2><p>中心地の一つはテネシー州メンフィスである。1950年、Sam Phillipsがこの街に小さな録音所を開き、当初は地元の黒人音楽家を録音していた。彼は「黒人の音とフィーリングを持つ白人がいれば10億ドル稼げる」と語ったと、助手のMarion Keiskerの回想として伝わるが、Phillipsは後年これを否定した。この発言はこの時代の人種と商業の力学を示すとも言われる。1954年7月、Phillipsのスタジオで録音していた19歳のElvis Presleyが、休憩中の遊びとして黒人歌手Arthur Crudupの楽曲を跳ねたテンポで歌い始め、それが録音されてデビュー・シングル（A面がCrudup作「That's All Right」、B面が「Blue Moon of Kentucky」）となった。発祥は1950年代初頭で、この録音を決定的な起点とする見方が有力である。カントリー歌手のようでもリズム・アンド・ブルースの歌手のようでもあるこの音は、地元メンフィスのDJが1954年7月7日にこの曲を14回かけ、40件超の電話があるなど、即座に反響を呼んだ。Sam Phillipsのもとにはその後、Carl Perkins、Johnny Cash、Jerry Lee Lewis、Roy Orbisonが集まり、この小さな録音所から一時代が生まれる。1956〜57年はこの音楽の頂点で、Elvis Presleyが全国的な人気を得て、Carl Perkinsが自作の楽曲で成功を収めた。テキサスではBuddy Hollyが自作曲を書き、Rock and Roll Hall of Fameは、今日標準となった2本のギター・ベース・ドラム編成を開拓・普及させたと評価している。ただしこの熱狂は驚くほど短命だった。1957年12月にJerry Lee Lewisが13歳の従妹と結婚し、1958年5月の英国ツアーで報じられて騒動になり、放送局のボイコットなどで人気が急落し（のち1960年代後半にカントリーで復活）、1958年にElvis Presleyは徴兵され、1959年2月にはBuddy Hollyが飛行機事故で22歳で死亡した。加えて、音楽的な嗜好の変化や、1959年のペイオラ（放送局に金を渡して曲を流してもらうこと）の追及によるロックンロール全般への逆風も重なり、米国でのラジオ放送は1960年以降に減っていった（英国では1960年代半ばまで熱狂的な支持が続いた）。しかしイギリスでこの録音を聴いて育った少年たちが、1960年代にビートグループとして世界を席巻することになる。1970年代のニューヨーク（The Cramps）のパンクの現場に始まるとも言われ（本人たちはサイコビリーの一員とは認めていない）、1980年代初頭に英国で広がった、ホラー映画の趣味と結びついたサイコビリーが生まれ、1950年代末に衰退したのち、1970年代後半〜80年代初頭に（欧州から始まり、英国で盛んに）復興し、現在も世界各地で、当時の機材と服装を忠実に再現する愛好家のサブカルチャーとして続いている。</p>
