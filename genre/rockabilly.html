<h1>Rockabilly（ロカビリー）とは</h1>
<p>ロカビリーは、1950年代初頭のアメリカ南部で、白人の若者がカントリーと黒人のリズム・アンド・ブルースを衝突させて生んだ音楽だ。最初期のロックンロールの一形態である。 編成は極めて簡素で、電気ギター、コントラバス（大型の弦楽器）、</p>
<p>ロカビリーは、1950年代初頭のアメリカ南部で、白人の若者がカントリーと黒人のリズム・アンド・ブルースを衝突させて生んだ音楽だ。最初期のロックンロールの一形態である。

編成は極めて簡素で、電気ギター、コントラバス（大型の弦楽器）、簡素なドラムセットが古典的な形である。初期には、ドラムを置かない3人組もあった。低音を担うコントラバスは、弓を使わない。弦を指で引っ張り、指板（弦を押さえる板）に叩きつけるスラップ奏法で演奏される。この打楽器のような弾き方が、簡素なドラムを補いながら、独特の跳ねる推進力を生む。

ギターの歪みは控えめなのが一般的だ（例外もある）。かわりに、テープの遅延装置（音を少し遅らせて重ねる機械）で、短いエコー（こだま）を付けるのが定番である。この処理によって、音は前へ突き抜けながら、空間の広がりを持つ。

リズムは、1・3拍を刻むカントリーのツービートに、ブギの跳ねが加わる。三連符（1拍を3等分したリズム）を感じさせる跳ね方だ。テンポはカントリーより速く、快活である。形式やコード進行はカントリーより簡素で、力強い。

この分野の華は歌唱だ。しゃっくりのように声を裏返す発声や、語尾を震わせる技法が使われることが多い。そこに短いエコー（スラップバック）が重ねられ、若さと性的な衝動が剥き出しになる。

歌詞は、恋愛、車、踊り、そして何者かになりたいという焦燥などを扱うことが多い。</p>
<h2>成り立ち</h2><p>中心地の一つは、テネシー州メンフィスのSun Recordsである。

1950年、Sam Phillipsがこの街に小さな録音所を開いた。当初は、地元の黒人音楽家を録音していた。彼は「黒人の音とフィーリングを持つ白人がいれば10億ドル稼げる」と語ったという。これは助手のMarion Keiskerの回想として伝わるが、Phillipsは後年これを否定した。この発言は、この時代の人種と商業の力学を露骨に示している。

発祥は1950年代初頭で、1954年7月のElvisのSun録音を決定的な起点とする見方が有力である。その1954年7月、Phillipsのスタジオで録音していた19歳のElvis Presleyが、休憩中の遊びとして、黒人歌手Arthur Crudupの楽曲を跳ねたテンポで歌い始めた。それが録音され、デビュー・シングル（A面がCrudup作『That's All Right』、B面が『Blue Moon of Kentucky』）となった。カントリー歌手のようでも、リズム・アンド・ブルースの歌手のようでもある音だった。この音は、地元メンフィスで即座に反響を呼んだ。

Sam Phillipsのもとには、その後、Carl Perkins、Johnny Cash、Jerry Lee Lewis、Roy Orbisonが集まった。この小さな録音所から、一時代が生まれる。1956〜57年は、この音楽の頂点だった。Elvis Presleyが全国的な人気を得て、Carl Perkinsが自作の楽曲で成功を収めた。テキサスではBuddy Hollyが、眼鏡をかけた平凡な外見のまま、自作曲を書いた。Rock and Roll Hall of Fameは、今日標準となった2本のギター・ベース・ドラム編成を開拓・普及させたと評価している。

しかし、この熱狂は驚くほど短命だった。1957年12月、Jerry Lee Lewisが13歳の従妹と結婚した。1958年5月の英国ツアーで報じられて騒動になり、放送局のボイコットなどで人気が急落した（のち1960年代後半にカントリーで復活）。1958年にはElvis Presleyが徴兵された。1959年2月には、Buddy Hollyが飛行機事故で22歳で死亡した。加えて、1959年のペイオラ（放送局に金を渡して曲を流してもらうこと）追及も、ロックンロール全般への逆風となった。米国でのラジオ放送は、1960年以降に減っていった（英国では1960年代半ばまで熱狂的な支持が続いた）。

それでも、イギリスでこの録音を聴いて育った少年たちが、1960年代にビートグループとして世界を席巻することになる。

その後、1970年代のニューヨークのパンクの現場（The Cramps）に始まるとも言われ（本人たちはサイコビリーの一員とは認めていない）、1980年代初頭に英国で広がった、ホラー映画の趣味と結びついたサイコビリーが生まれた。ロカビリー自体は、1950年代末に衰退したのち、1970年代後半〜80年代初頭に復興した。現在も世界各地で、当時の機材と服装を忠実に再現する愛好家のサブカルチャーとして続いている。</p>
