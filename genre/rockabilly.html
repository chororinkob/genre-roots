<h1>Rockabilly（ロカビリー）とは</h1>
<p>1950年代半ばのアメリカ南部で、白人の若者がカントリーと黒人のリズム・アンド・ブルースを衝突させて生んだ最初期のロックンロールである。編成は極めて簡素で、電気ギター、コントラバス、そしてしばしばドラムすら置かない三人組が基本とな</p>
<p>1950年代半ばのアメリカ南部で、白人の若者がカントリーと黒人のリズム・アンド・ブルースを衝突させて生んだ最初期のロックンロールである。編成は極めて簡素で、電気ギター、コントラバス、そしてしばしばドラムすら置かない三人組が基本となる。低音を担うコントラバスは弓を使わず、弦を指で引っ張って指板に叩きつけるスラップ奏法で演奏され、この打楽器のような弾き方が、ドラム不在を補いながら独特の跳ねる推進力を生む。ギターは歪みを深くかけず、代わりにテープの遅延装置によって短い山びこを付けるのが定番で、この処理によって音は前へ突き抜けながら空間の広がりを持つ。リズムは二拍を強く踏むカントリー由来の型に、三連符を感じさせるブギの跳ねが加わる。テンポは概ね140から190 BPMと快活である。和声はブルースの12小節形式が中心で、単純だが力強い。歌唱がこの分野の華で、しゃっくりのように声を裏返す発声、語尾を震わせる技法、そして短い山びこによる残響が組み合わさり、若さと性的な衝動が剥き出しになる。歌詞は恋愛、車、踊り、そして何者かになりたいという焦燥を扱う。</p>
<h2>成り立ち</h2><p>舞台はテネシー州メンフィスである。1950年、Sam Phillipsがこの街に小さな録音所を開き、当初は地元の黒人音楽家を録音していた。彼は白人の聴衆に売れる黒人音楽の歌い手がいれば富を築けると語ったと伝えられており、この発言はこの時代の人種と商業の力学を露骨に示している。1954年7月、彼のもとで働いていた19歳のトラック運転手Elvis Presleyが、休憩中の遊びとして黒人歌手Arthur Crudupの楽曲を跳ねたテンポで歌い始め、それが録音されて最初の一枚となった。カントリー歌手のようでもリズム・アンド・ブルースの歌手のようでもあるこの音は、ラジオ局を戸惑わせたが、若い聴き手には即座に受け入れられた。Sam Phillipsのもとにはその後、Carl Perkins、Johnny Cash、Jerry Lee Lewis、Roy Orbisonが集まり、この小さな録音所から一時代が生まれる。1956年はこの音楽の頂点で、Elvis Presleyが全国的な人気を得て、Carl Perkinsが自作の楽曲で成功を収めた。テキサスではBuddy Hollyが、眼鏡をかけた平凡な外見のまま作詞作曲と演奏の全てを自分で行うという、後のロックバンドの原型を示した。ただしこの熱狂は驚くほど短命だった。1957年にJerry Lee Lewisが13歳の従妹と結婚していたことが報じられて社会的に葬られ、1958年にElvis Presleyは徴兵され、1959年2月にはBuddy Hollyが飛行機事故で22歳で死亡した。加えて、白人の若者が黒人の音楽を歌うことへの保守層の反発、レコード会社による買収的な放送工作の摘発が重なり、1960年前後にはこの音楽は市場から姿を消す。しかしイギリスでこの録音を聴いて育った少年たちが、1960年代にビートグループとして世界を席巻することになる。1970年代末には、イギリスを中心にホラー映画の趣味と結びついたサイコビリーが生まれ、以後も世界各地で、当時の機材と服装を忠実に再現する愛好家の文化として途切れることなく受け継がれている。</p>
<h2>代表曲</h2><ul><li>That's All Right (Elvis Presley)</li><li>Blue Suede Shoes (Carl Perkins)</li><li>Be-Bop-A-Lula (Gene Vincent)</li></ul>
