<h1>Asian Underground（アジアンアンダーグラウンド）とは</h1>
<p>アジアン・アンダーグラウンドは、南アジアの伝統楽器の音色と、イギリスのクラブで受け継がれていた手法を、同じ立場で組み合わせた音楽だ。 使われる伝統楽器は、タブラ、ドール(肩から下げて両面を叩く太鼓)、シタール、バーンスリー(竹製の</p>
<p>アジアン・アンダーグラウンドは、南アジアの伝統楽器の音色と、イギリスのクラブで受け継がれていた手法を、同じ立場で組み合わせた音楽だ。

使われる伝統楽器は、タブラ、ドール(肩から下げて両面を叩く太鼓)、シタール、バーンスリー(竹製の横笛)、サーランギー(擦弦楽器)などである。そこに、ドラムンベースの170BPM前後の速いブレイクビーツ、ダブの深いエコーとディレイ、ヒップホップのサンプリング、トリップホップの重い低音といった手法が合わさる。

メロディーは、ラーガ(インド古典音楽の旋法体系)由来の音階を使うことが多い。長く伸び続けるドローンの音が全体に薄く敷かれ、打ち込みのビートの上に独特の浮遊感が生まれる。

リズムでは、タブラのボル(打奏を口で唱える暗記法)で表される複雑なリズムの分割と、シーケンサーの機械的な正確さが、同じ小節の中でぶつかり合う。テンポは、チルアウト向けのゆったりしたものから、ドラムンベースの170BPM前後の速いものまで幅広い。

歌は、ヒンディー語・パンジャーブ語・ウルドゥー語のこともある。メリスマ(一音節に複数の音をのせる歌い回し)が乗ることもある。カッワーリーの録音をリミックスした曲もあり、歌のない器楽曲も多い。

同じ南アジア系の音楽では、バングラーと重なる面もある。こちらは、ロンドンのクラブ・シーンに根ざしている。</p>
<h2>成り立ち</h2><p>1990年代前半から、英国(とくにロンドン)を中心とする南アジア系の若い世代の間で、複数の動きがあった。両親の世代の伝統音楽と、自分たちが実際にロンドンのクラブで浴びてきたブレイクビーツ・ダブ・ヒップホップを、恥じることなく1つの曲の中で共存させる動きである。

中心にいたのは、Talvin Singhだ。彼はタブラ奏者として活動しながら、DJ・プロデューサーとしても活動していた。そして、Sweety Kapoorらとクラブナイト「Anokha(ヒンディー語で「ユニークな」の意)」を運営した。この催しは1995年ごろ、日曜の催しとして始まった。1996年ごろからは、ロンドン東部ホクストン・スクエアのクラブ「Blue Note」で、毎週月曜に開かれた。始まった年には諸説ある。

この催しは、シーンの中心的な発信の場となった。そのコンピレーション盤『Anokha: Soundz of the Asian Underground』(1997)が、ジャンル名が広く知られるきっかけになった。

Talvin Singh自身のアルバム『OK』(1998年秋発表)は、翌1999年に、イギリスで最も権威ある音楽賞のひとつであるマーキュリー賞を受賞した。この受賞が、シーンを一躍、主流の注目の的へと押し上げた。

一方、Asian Dub Foundationは、より政治的でパンク的な攻撃性を持つバンド編成で、この音楽性を形にした。Nitin Sawhneyは『Beyond Skin』(1999)で、核兵器(インドとパキスタンの核情勢を含む)というテーマを扱うなど、アイデンティティと政治を鋭く音楽に織り込んだ。

流れは、ポップスの世界にも届いた。パンジャーブ系のTjinder Singh率いるバンドCornershopは、1997年に「Brimful of Asha」を放った。翌年には、Norman Cookによるリミックスが、イギリスのシングルチャート1位を獲得した。この曲は、文化の交わりをポップスの領域にまで届けた楽曲として知られる。

スリランカ系イギリス人のM.I.A.も、このシーン出身とされることがある。M.I.A.は2000年代に登場し、より大衆的な形で、世界的なスターの座をつかんだ。</p>
