<h1>Asian Underground（アジアンアンダーグラウンド）とは</h1>
<p>タブラ、ドール(肩から下げて両面を叩く太鼓)、シタール、バーンスリー(竹製の横笛)、サーランギー(擦弦楽器)といった南アジアの伝統楽器の音色を、ドラムンベースの170BPM前後の高速ブレイクビーツ、ダブの深いエコーとディレイ、ヒッ</p>
<p>タブラ、ドール(肩から下げて両面を叩く太鼓)、シタール、バーンスリー(竹製の横笛)、サーランギー(擦弦楽器)といった南アジアの伝統楽器の音色を、ドラムンベースの170BPM前後の高速ブレイクビーツ、ダブの深いエコーとディレイ、ヒップホップのサンプリング、トリップホップの重い低音といったイギリスのクラブミュージックの手法と対等に組み合わせた音楽。旋律はラーガ(インド古典音楽の旋法体系)由来の音階を用いることが多く、タンプーラの持続音が全体に薄く敷かれることで、打ち込みのビートの上に独特の浮遊感が生まれる。リズム面では、タブラのボル(打奏を口で唱える暗記法)が刻む複雑な分割と、シーケンサーの機械的な正確さが同じ小節の中でぶつかり合う。歌はヒンディー語・パンジャーブ語・ウルドゥー語のこともあれば、カッワーリー由来のメリスマ(一音節を細かく揺らす歌い回し)が乗ることもあり、完全な器楽曲も多い。テンポはチルアウト向けの90BPM前後からフロアを煽る170BPM超まで幅広い。同じ南アジア系でも、バングラーが結婚式やパーティーの祝祭的な機能音楽であるのに対し、こちらはクラブの暗がりと内省を舞台にし、移民二世としての引き裂かれた自意識そのものを主題にする点が決定的に異なる。</p>
<h2>成り立ち</h2><p>1990年代、ロンドンで生まれ育ったインド・パキスタン系などの南アジア系移民2世たちが、両親の世代の伝統音楽と、自分たちが実際にロンドンのクラブで浴びてきたブレイクビーツ・ダブ・ヒップホップを、恥じることなく1つの曲の中で共存させ始めたことがこのジャンルの出発点となった。タブラ奏者としての活動と並行してDJ・プロデューサーとしても活動していたTalvin Singhが、ロンドンのジャズクラブ「Blue Note」で主宰したクラブナイト「Anokha(ヒンディー語で「ユニークな」の意)」は、このシーンの中心的な発信地となり、そのコンピレーション盤『Anokha: Soundz of the Asian Underground』(1997)がジャンル名の由来ともなった。Talvin Singh自身のアルバム『OK』(1998)は、その年のイギリスで最も権威ある音楽賞であるマーキュリー賞を受賞し、シーンを一躍メインストリームの注目へと押し上げた。Asian Dub Foundationは、より政治的でパンク的な攻撃性を持つバンド編成でこの音楽性を体現し、Nitin Sawhneyは『Beyond Skin』(1999)でインドの核実験というテーマを扱うなど、アイデンティティと政治を鋭く音楽に織り込んだ。パンジャーブ系のTjinder Singh率いるバンドCornershopが放った「Brimful of Asha」(1997、Norman Cookによるリミックスが翌年イギリスのシングルチャート1位を獲得)は、この文化的交差をポップスの領域にまで届けた楽曲として知られる。スリランカ系イギリス人のM.I.A.は、2000年代にこうした土壌の延長線上から登場し、より大衆的な形でグローバルなスターダムを掴んだ。</p>
<h2>代表曲</h2><ul><li>OK (Talvin Singh)</li><li>Brimful of Asha (Cornershop)</li><li>Beyond Skin (Nitin Sawhney)</li></ul>
