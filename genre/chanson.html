<h1>Chanson（シャンソン）とは</h1>
<p>シャンソンは、フランス語圏における、歌詞（詩）の比重が大きいことで知られる歌の伝統だ。音楽のスタイルとしての統一性は乏しく、定義はむしろ言葉の側にある。 歌詞は、詩として自立した完成度を求められる。実際に、文学として書籍化された作</p>
<p>シャンソンは、フランス語圏における、歌詞（詩）の比重が大きいことで知られる歌の伝統だ。音楽のスタイルとしての統一性は乏しく、定義はむしろ言葉の側にある。

歌詞は、詩として自立した完成度を求められる。実際に、文学として書籍化された作品も多い。そのため旋律は言葉に従い、フランス語の抑揚と音節の長短に合わせて、自由に伸び縮みする。拍節（拍の区切り）は厳密に守られない場合があり、歌手が語る速度に伴奏が合わせる場面も多い。

歌唱は、美声を誇示しない。語りと歌の中間の発声が用いられ、子音を強く立て、言葉の一つ一つを聞き取らせることが優先される。

伴奏の中心は、手風琴（アコーディオン）、ピアノ、生ギターだ。そこに弦楽合奏が加えられる。手風琴の音色は、この分野のトレードマークとされるが、必須ではない。

テンポは、緩やかなものが多い。3拍子のワルツが、伝統的に好まれることが多い。和声（コードの響き）は、単純な進行から複雑なものまで幅広い。曲の構造は物語の展開に従うため、繰り返し部分を持たない作品も珍しくない。

歌詞の主題は、恋愛が中心だ。ただし、貧困、戦争、死、社会への批判、そして哲学的な省察までを含む。下層社会の生活を、わざと悪い面までさらけ出して描く伝統も強い。</p>
<h2>成り立ち</h2><p>中世のトルバドゥール／トルヴェールの歌曲にシャンソンという語の源流がある。chanson réalisteは、1880年代にモンマルトルで興隆し、第二次大戦ごろまで続いた。

1881年11月にRodolphe Salisがモンマルトルに開いたキャバレー「Le Chat Noir」を皮切りに、歌と詩と風刺を提供する小規模な演芸場が、次々に生まれた。ここでは、客と演者の距離が近かった。政治への皮肉や、下層社会の生活を歌うことが許されていた。

20世紀に入ると、この伝統を最もよく表していたのがÉdith Piafだった。1935年、パリの街頭で歌っていたところをナイトクラブ経営者Louis Leplée に見出され、身長142センチの小柄な体から発せられる圧倒的な声によって、国民的な存在となった。彼女の人生自体が物語のようだった。恋人であったボクサーが1949年に飛行機事故で死亡した後も歌い続け、1963年に47歳で死去している。

1950年代から1960年代が、この分野の黄金期とされる。

Georges Brassensは、無政府主義的な思想を持っていた。ステージでは自身のギターとPierre Nicolasのコントラバス（大型の弦楽器）のみ、録音では第2ギターが加わる簡素な伴奏で、権威と偽善を辛辣に嘲笑する詩を歌った。

ベルギー出身のJacques Brelは、演劇的な表現によって、愛と死を極限まで激しく歌い上げた。1966年8月21日（ヴィッテル）に楽団員へ引退の決意を伝え、10月6日からのオランピア公演で「公式の」告別をした。実際の最終公演は1967年5月16日だった。

Léo Ferréは、詩人の作品に曲を付けた。Barbaraは、自らの過去の傷を歌に変えた。

最も物議を醸したのが、Serge Gainsbourgだ。彼は挑発を方法として用いた。1969年に発表した官能的な楽曲は、バチカンから非難され、複数の国で放送を禁じられた。1984年にはテレビ番組で高額紙幣を燃やし、税制への抗議を示した。その行動は、常に論争を呼んだ。

最後に、法律の話がある。1994年2月1日の法律(94-88号)により、民間ラジオの音楽番組部分について、聴取の多い時間帯に仏語楽曲40%以上(うち半分は新人・新作)とする義務が課されており(局種別の例外あり)(施行は1996年)、対象はシャンソンというジャンルではなく、フランス語の楽曲全般(ポップやラップを含む)である。この立法趣旨は、フランス語楽曲の保護・促進（文化的例外論）とされる。</p>
