<h1>Chanson（シャンソン）とは</h1>
<p>フランス語圏における、歌詞を最も重視する歌の伝統である。音楽的な様式としての統一性は乏しく、定義はむしろ言葉の側にある。歌詞は詩として自立した完成度を要求され、実際に多くの作品が文学として書籍化されてきた。したがって旋律は言葉に従</p>
<p>フランス語圏における、歌詞を最も重視する歌の伝統である。音楽的な様式としての統一性は乏しく、定義はむしろ言葉の側にある。歌詞は詩として自立した完成度を要求され、実際に多くの作品が文学として書籍化されてきた。したがって旋律は言葉に従属し、フランス語の抑揚と音節の長短に合わせて自由に伸縮する。拍節は厳密に守られず、歌手が語る速度に伴奏が合わせるという場面も多い。歌唱は美声を誇示せず、語りと歌の中間の発声が用いられ、子音を強く立て、言葉の一つ一つを聞き取らせることが優先される。伴奏の中心は手風琴、ピアノ、生ギターで、そこに弦楽合奏が加えられる。手風琴の音色はこの分野の象徴とされるが、必須ではない。テンポは緩やかなものが多く、三拍子のワルツが伝統的に好まれる。和声は単純な進行から複雑なものまで幅広い。曲の構造は物語の展開に従うため、繰り返し部分を持たない作品も珍しくない。歌詞の主題は恋愛が中心だが、貧困、戦争、死、社会への批判、そして哲学的な省察までを含み、下層社会の生活を露悪的に描く伝統も強い。</p>
<h2>成り立ち</h2><p>起源を辿れば中世の吟遊詩人にまで遡るが、現在の形の直接の母体は19世紀後半のパリである。1881年にモンマルトルに開かれた酒場を皮切りに、歌と詩と風刺を提供する小規模な演芸場が次々に生まれた。ここでは客と演者の距離が近く、政治への皮肉や下層社会の生活を歌うことが許されていた。20世紀に入り、この伝統を体現したのがÉdith Piafである。彼女はパリの街頭で歌う少女として発見され、身長142センチの小柄な体から発せられる圧倒的な声によって国民的な存在となった。彼女の人生自体が物語のようで、恋人であったボクサーが1949年に飛行機事故で死亡した後も歌い続け、1963年に47歳で死去している。1950年代から1960年代がこの分野の黄金期である。Georges Brassensは無政府主義的な思想を持ち、ギターとコントラバスだけの簡素な伴奏で、権威と偽善を辛辣に嘲笑する詩を歌った。ベルギー出身のJacques Brelは、演劇的な表現によって愛と死を極限まで激しく歌い上げ、人気の絶頂にあった1966年に舞台からの引退を宣言するという選択をした。Léo Ferréは詩人の作品に曲を付け、Barbaraは自らの過去の傷を歌に変えた。最も物議を醸したのがSerge Gainsbourgである。彼は挑発を方法として用い、1969年に発表した官能的な楽曲はバチカンから非難され、複数の国で放送を禁じられた。1984年にはテレビ番組で高額紙幣を燃やして税制への抗議を示すなど、その行動は常に論争を呼んだ。この分野は現在も国家的に保護されている。1994年に成立した法律により、ラジオ放送における一定の比率をフランス語の楽曲に割り当てることが義務づけられており、これは英語圏の音楽の支配に対する文化的な防衛策である。</p>
<h2>代表曲</h2><ul><li>La Vie en rose (Édith Piaf)</li><li>Ne me quitte pas (Jacques Brel)</li><li>La Bohème (Charles Aznavour)</li></ul>
