<h1>Free Jazz（フリージャズ）とは</h1>
<p>フリージャズは、固定されたコード進行や拍子を前提とせず、構成の要素は作品ごとに最小限から流動的な、きわめて自由度の高い即興音楽だ。調性(特定の音階・和音への従属関係)、決まったテンポ、あらかじめ用意されたコード進行、曲の構成。ジャ</p>
<p>フリージャズは、固定されたコード進行や拍子を前提とせず、構成の要素は作品ごとに最小限から流動的な、きわめて自由度の高い即興音楽だ。調性(特定の音階・和音への従属関係)、決まったテンポ、あらかじめ用意されたコード進行、曲の構成。ジャズがそれまで前提としてきた、こうした多くのルールを手放している。

中心になるのは、サックス、ドラム、ベースの激しい演奏だ。叫ぶように吹かれるサックス、暴れ回るドラム、うめくようなベースが、混沌の中から独自の美を生み出す。奏法の面でも、サックスの通常の音域を超えた高音を絞り出す「フラジオ」や、複数の音を同時に鳴らす「重音奏法」など、楽器の限界を押し広げる技術が積極的に用いられる。

和音やテンポも、あらかじめ決められてはいない。演奏によっては、テンポという概念そのものが存在しないことすらある。

複数の演奏者がそれぞれの判断で自由に音を出し合い、その瞬間瞬間に生まれる音同士の衝突や偶然の共鳴が、そのまま作品として成立する。ただし「自由」とは無秩序ではない。演奏者同士が互いの音を極度に注意深く聴き合い、瞬間ごとに反応し合うという、極めて集中力を要する対話でもある。

一聴して理解を拒むような激しさを持つ音楽だが、既成概念を根本から破壊していくその過程にこそ、独特の知的な快感がある。</p>
<h2>成り立ち</h2><p>1950年代末のアメリカで、ビバップ以来の和声（コードの響き）とテンポの約束事に対する全面的な問い直しとして、この音楽は現れた。

最初期の開拓者の一人が、ピアニストのCecil Taylorだ。1956年録音(1957年発売)の『Jazz Advance』で、ポスト・バップの枠組みを残しつつ、のちの自由を予告した。先行例として、1940年代のLennie Tristanoなども挙げられる。

決定的だったのは、テキサス出身のアルトサックス奏者Ornette Colemanである。彼はロサンゼルスでエレベーター係などをしながら独学で音楽を身につけた。プラスチック製の白いアルトサックスを吹き、既存のコード進行に従わない演奏で、多くの共演者から拒絶されていた。1959年、彼はアルバム『The Shape of Jazz to Come』を発表し、その直後にニューヨークのクラブFive Spot Caféに出演する。ピアノを編成から外して和音の枠そのものを取り払ったこの音楽は、ジャズ界を賛否に二分した。

翌1960年に録音された『Free Jazz: A Collective Improvisation』は、ジャンル名の由来となった。2つのカルテット（4人組）を左右のチャンネルに分け、約37分続く自由即興を行う作品だ。管楽器、ベース、ドラムが順にソロを取り、その合間に短い作曲部分（ファンファーレ風の合奏）が挟まる。

その後1960年代にかけて、Eric Dolphy、Albert Ayler、Archie Shepp、Pharoah Sandersらが続いた。John Coltraneも『Ascension』(1965年録音、1966年発売)で、大編成の作品を残している。短いモチーフ（旋律の断片）を核に、合奏部とソロが交替する作品だ。

この動きは、公民権運動などの社会状況と結びつけて論じられることが多い。演奏機会の乏しさや人種隔離的な音楽産業を背景に、自分たちで制作・興行を担うため、シカゴでは1965年にMuhal Richard Abramsらが自主組織AACMを設立した。そこからArt Ensemble of Chicagoが生まれる。セントルイスではBAGが結成された。ニューヨークでは1964年にオクトーバー・レヴォリューション・イン・ジャズが開かれ、1970年代には音楽家が自宅や倉庫で行うロフト・ジャズが本格化した。

しかし、批評家の反発は激しかった。1961年、Down Beat誌のJohn TynanがJohn ColtraneとEric Dolphyの演奏を「anti-jazz」と評し、出演機会やレコード契約を得にくくなった演奏者もいた。Albert Aylerは1970年11月25日、ニューヨークのイースト川で遺体が発見された。自殺と推定されているが、確証はない。

一部の音楽家はヨーロッパへ渡り、そこで独自のシーンが育った。ドイツのPeter Brötzmann、イギリスのDerek BaileyやEvan Parkerらは、ジャズからさらに離れた即興音楽を発展させた。その動きは、現在の実験音楽へつながる流れを作っている。</p>
