<h1>Free Jazz（フリージャズ）とは</h1>
<p>調性(特定の音階・和音への従属関係)、決まったテンポ、あらかじめ用意されたコード進行、曲の構成——ジャズがそれまで前提としてきた多くのルールを解き放った、きわめて自由度の高い即興音楽。複数の演奏者がそれぞれ自分自身の判断だけで自由</p>
<p>調性(特定の音階・和音への従属関係)、決まったテンポ、あらかじめ用意されたコード進行、曲の構成——ジャズがそれまで前提としてきた多くのルールを解き放った、きわめて自由度の高い即興音楽。複数の演奏者がそれぞれ自分自身の判断だけで自由に音を出し合い、その瞬間瞬間に生まれる音同士の衝突や偶然の共鳴が、そのまま作品として成立する。演奏によってはテンポという概念そのものが存在しないことすらある。叫ぶように吹かれるサックス、暴れ回るドラム、うめくようなベースが、混沌の中から独自の美を生み出す。一聴して理解を拒むような激しさを持つ音楽だが、既成概念を根本から破壊していくその過程にこそ、独特の知的な快感がある。ただし「自由」とは無秩序ではなく、演奏者同士が互いの音を極度に注意深く聴き合い、瞬間ごとに反応し合うという、極めて集中力を要する対話でもある。奏法の面でも、サックスの通常の音域を超えた高音を絞り出す「フラジオ」や、複数の音を同時に鳴らす「重音奏法」など、楽器の限界を押し広げる技術が積極的に用いられる。</p>
<h2>成り立ち</h2><p>1950年代末のアメリカで、ビバップ以来の和声（コードの響き）とテンポの約束事に対する全面的な問い直しとして現れた。最初期の開拓者の一人がピアニストのCecil Taylorで、1956年録音(1957年発売)の『Jazz Advance』で従来の和声構造から離れ始めた。先行例として、1940年代のLennie Tristanoなども挙げられる。決定的だったのはテキサス出身のアルトサックス奏者Ornette Colemanである。彼はロサンゼルスでエレベーター係などをしながら独学で音楽を身につけ、プラスチック製の白いアルトサックスを吹き、既存のコード進行に従わない演奏で多くの共演者から拒絶されていた。1959年、彼はアルバム『The Shape of Jazz to Come』を発表し、その直後にニューヨークのクラブFive Spot Caféに出演する。ピアノを編成から外して和音の枠そのものを取り払ったこの音楽は、ジャズ界を賛否に二分した。翌1960年に録音された『Free Jazz: A Collective Improvisation』は、2つのカルテット（4人組）を左右のチャンネルに分け、約37分の継続する自由即興の中で、管楽器と低音楽器が順にソロを取り、短い作曲部分が挟まる作品であり、ジャンル名の由来となった。同時期にEric Dolphy、Albert Ayler、Archie Shepp、Pharoah Sandersらが続き、John Coltraneも『Ascension』(1965年録音、1966年発売)で、短いモチーフ（旋律の断片）を核に合奏部とソロが交替する大編成の作品を残した。この動きは、公民権運動などの社会状況と結びつけて論じられることが多い。演奏者たちは白人が支配する興行と批評の構造から自立するため、シカゴでは1965年にMuhal Richard Abramsらが自主組織AACMを設立し、そこからArt Ensemble of Chicagoが生まれる。セントルイスではBAGが結成され、ニューヨークでは1964年のオクトーバー・レヴォリューション・イン・ジャズが開かれ、1970年代には音楽家が自宅や倉庫で行うロフト・ジャズが本格化した。批評家の反発は激しく、Down Beat誌上ではJohn Coltraneらの演奏が反ジャズと断じられ、多くの演奏者が出演機会やレコード契約を得にくくなった。Albert Aylerは1970年にニューヨークのイースト川で遺体となって発見された。公式には溺死で、自殺と推定されるが、経緯は未解明である。多くの音楽家がヨーロッパへ渡り、そこで独自のシーンが育った。ドイツのPeter Brötzmann、イギリスのDerek BaileyやEvan Parkerらは、ジャズからさらに離れた即興音楽を発展させ、現在の実験音楽へつながる流れを作っている。</p>
<h2>代表曲</h2><ul><li>Free Jazz (Ornette Coleman)</li><li>Spiritual Unity (Albert Ayler)</li><li>Ascension (John Coltrane)</li><li>Lonely Woman (Ornette Coleman)</li><li>Hat and Beard (Eric Dolphy)</li><li>Out to Lunch (Eric Dolphy)</li><li>Unit Structures (Cecil Taylor)</li><li>Ghosts (Albert Ayler)</li><li>Peace (Ornette Coleman)</li><li>Machine Gun (Peter Brötzmann)</li><li>Bells (Albert Ayler)</li><li>Spirits Rejoice (Albert Ayler)</li></ul>
