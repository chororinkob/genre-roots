<h1>Tech House（テックハウス）とは</h1>
<p>テック・ハウスは、テクノの機能的で硬質な音作りと、ハウスの人間的な躍動を混ぜ合わせたクラブ音楽である。 中心になるのはリズムの組み立てだ。テンポは概ね120〜130 BPMで、キックは正確な四つ打ちを保つ。その周りに置かれる打楽器</p>
<p>テック・ハウスは、テクノの機能的で硬質な音作りと、ハウスの人間的な躍動を混ぜ合わせたクラブ音楽である。

中心になるのはリズムの組み立てだ。テンポは概ね120〜130 BPMで、キックは正確な四つ打ちを保つ。その周りに置かれる打楽器の配置も特徴のひとつである。ハイハット、シェイカー、クラップ、木を打つような短い音が、拍を細かく分割しながら少しずつずれた位置に置かれ、全体として転がり続ける感触を作る。

ベースは低い音域で短く切られたフレーズをくり返し、キックの隙間へ正確に滑り込む。キックとベースが互いを避けながら噛み合う作りが、長時間踊っても疲れない推進力を生む。

上物は簡素な傾向があり、旋律は控えめである。代わりに、人の声を数語だけ切り取って加工した断片や、短いシンセの刺し込みが置かれる。

展開は緩やかだ。要素を一つずつ足し引きしながら、時間をかけて頂点へ向かい、また分解していく。この構造はDJが2曲を重ねてつなぐことを前提としており、曲の冒頭と末尾には打楽器だけの区間が用意されている。聴き込むための音楽というより、現場で機能することを最優先に設計された道具としての音楽である。</p>
<h2>成り立ち</h2><p>舞台は、1990年代前半から半ばにかけてのロンドンである。この街を中心に、テクノとハウスの混ぜ合わせが育まれた。米国の要素も混ざった。他地域でも同様の混合があった可能性がある。

当時の英国のクラブシーンは主流化し、地下的なパーティーが少なかった。そうした中で、テクノとハウスの中間を求めたDJたちが、テクノの簡素さとハウスの躍動を混ぜた選曲を行った。

「テック・ハウス」という語の由来は、説明が分かれる。Terry Francisは、クロイドンのレコード店Swag Recordsから出た名前だと述べている。一方、Mr. CがEddie Richardsにカセットを送り、片面に「tech」、もう片面に「house」と書かれていたという話もある。Nathan Colesは、仲間内で名前が必要だという話になった中で生まれたと語っている。

ロンドンでは、Terry FrancisやNathan Colesが1994年に始めたWiggleをはじめ、The Drop、Heart &amp; Soul、Releaseなど複数のパーティーでこの音が育まれた。1995年にMr. Cらが開いたクラブThe Endが、その拠点となった。当初のこの音楽は、レイヴ的な過剰な高揚や商業的なハウスを避けた、削ぎ落とされた音だった。低音が太く、デトロイト的な音楽性を併せ持つものもあった。

2000年代に入ると、ミニマル・テクノとの境界が曖昧になる。ミニマル・テクノは、1990年代初頭にデトロイトのRobert HoodやDaniel Bellらが発展させたとされ、2000年代にドイツ(Kompakt、Perlon、Hawtinのm-nusなど)で広まった。Richie HawtinやRicardo Villalobosの実践は、より少ない要素で長時間を持たせる方向を推し進めた。

2010年前後には、スペインのイビサ島を舞台に大きな変化が起きる。Jamie JonesのHot Creationsを含む複数のレーベルやDJが、ミニマルな構造に歌（ボーカル）を戻した。これがイビサのフロアに広まった。

以後このスタイルは爆発的に商業化した。音源配信サイトのBeatportでは、2014年ごろから2016年第2四半期まで首位だった。その後はテクノが首位で、テック・ハウスは2位だったが、2021年に再び首位となり、2025年のレポートでも首位を維持している。

同時に、この成功は深刻な批判も招いた。量産された曲が互いに区別できないほど似通っており、決まった位置に決まった音を置くだけの工業製品になっているという指摘である。2000年代前半には、トライバル打楽器や1〜2音のベースなど定型化が進んだ。批判は2010年代（2013年ごろの量産ブーム以降、2018年にも）に目立った。それでも、クラブの現場における実用性という一点において、このスタイルは磨き上げられており、世界中の週末の夜を支え続けている。</p>
