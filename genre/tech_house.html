<h1>Tech House（テックハウス）とは</h1>
<p>テクノの機能的で硬質な音作りと、ハウスの人間的な躍動を折衷したクラブ音楽である。テンポは概ね122から128 BPMで、キックは正確な四つ打ちを保つが、この分野の核心はその周囲に置かれる打楽器の配置にある。ハイハット、シェイカー、</p>
<p>テクノの機能的で硬質な音作りと、ハウスの人間的な躍動を折衷したクラブ音楽である。テンポは概ね122から128 BPMで、キックは正確な四つ打ちを保つが、この分野の核心はその周囲に置かれる打楽器の配置にある。ハイハット、シェイカー、クラップ、木を打つような短い音が、拍を細かく分割しながら少しずつずれた位置に置かれ、全体として転がり続ける感触を作る。ベースは低い音域で短く切られた音型を反復し、キックの隙間へ正確に滑り込む。この、キックとベースが互いを避けながら噛み合う設計が、長時間踊っても疲れない推進力を生む。上物は徹底して簡素で、旋律と呼べるものはほとんど置かれず、代わりに人の声を数語だけ切り取って加工した断片や、短いシンセの刺し込みが、数十小節に一度だけ現れる。展開は緩やかで、8小節または16小節ごとに要素を一つずつ足し引きしながら、6分から8分をかけて頂点へ向かい、また分解していく。この構造はDJが二曲を重ねてつなぐことを前提としており、曲の冒頭と末尾には打楽器だけの区間が用意されている。聴き込むための音楽というより、現場で機能することを最優先に設計された道具としての音楽である。</p>
<h2>成り立ち</h2><p>1990年代半ばのロンドンで、この折衷は自覚的に始まった。当時のクラブでは、デトロイト由来の硬質なテクノと、シカゴやニューヨーク由来の歌のあるハウスが、別々のフロアで別々の客に向けて流されていた。両者の中間を求めた一群の DJ が、テクノの簡素さとハウスの躍動を混ぜた選曲を始め、これがジャンルの名として定着していく。Terry FrancisやNathan Colesが主催したWiggleというパーティーがその中心で、1995年にMr. Cらが開いたクラブThe Endが拠点となった。当初のこの音楽は極めて地下的で、大きな旋律も分かりやすい盛り上がりも持たず、あくまで踊り続けるための機能に徹していた。2000年代に入ると、ドイツとルーマニアを中心に発達したミニマル・テクノとの境界が曖昧になり、Richie HawtinやRicardo Villalobosの実践が、より少ない要素で長時間を持たせる方向を推し進めた。2010年前後には、スペインのイビサ島を舞台に大きな変化が起きる。Jamie Jonesを中心とする一群が、ミニマルな構造にディスコやファンクの色彩と歌の断片を戻し、これがイビサの巨大なクラブで熱狂的に受け入れられた。以後この様式は爆発的に商業化し、音源配信サイトの売上上位を長年にわたって占め続けることになる。同時にこの成功は深刻な批判も招いた。すなわち、量産された曲が互いに区別できないほど似通っており、決まった位置に決まった音を置くだけの工業製品になっているという指摘である。実際、2010年代後半には、大きな会場での使いやすさを優先した単純な楽曲が主流となり、地下的な出自は事実上失われた。それでもクラブの現場における実用性という一点において、この様式は他のどのジャンルよりも磨き上げられており、世界中の週末の夜を支え続けている。</p>
