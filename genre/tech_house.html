<h1>Tech House（テックハウス）とは</h1>
<p>テクノの機能的で硬質な音作りと、ハウスの人間的な躍動を混ぜ合わせたクラブ音楽である。テンポは概ね122から128 BPMで、キックは正確な四つ打ちを保つが、この分野の中心は、その周りに置かれる打楽器の並べ方にある。ハイハット、シェ</p>
<p>テクノの機能的で硬質な音作りと、ハウスの人間的な躍動を混ぜ合わせたクラブ音楽である。テンポは概ね122から128 BPMで、キックは正確な四つ打ちを保つが、この分野の中心は、その周りに置かれる打楽器の並べ方にある。ハイハット、シェイカー、クラップ、木を打つような短い音が、拍を細かく分割しながら少しずつずれた位置に置かれ、全体として転がり続ける感触を作る。ベースは低い音域で短く切られたフレーズをくり返し、キックの隙間へ正確に滑り込む。この、キックとベースが互いを避けながら噛み合う作りが、長時間踊っても疲れない推進力を生む。上物は簡素な傾向があり、旋律は控えめで、代わりに人の声を数語だけ切り取って加工した断片や、短いシンセの刺し込みが置かれる。展開は緩やかで、要素を一つずつ足し引きしながら、時間をかけて頂点へ向かい、また分解していく。この構造はDJが2曲を重ねてつなぐことを前提としており、曲の冒頭と末尾には打楽器だけの区間が用意されている。聴き込むための音楽というより、現場で機能することを最優先に設計された道具としての音楽である。</p>
<h2>成り立ち</h2><p>1990年代前半から半ばにかけてのロンドンを中心に、この混ぜ合わせが育まれた。当時のクラブでは、デトロイト由来の硬質なテクノと、シカゴやニューヨーク由来の歌のあるハウスが、別々のフロアで別々の客に向けて流されていた。両者の中間を求めた DJ たちが、テクノの簡素さとハウスの躍動を混ぜた選曲を行った。「テック・ハウス」という語は、クロイドンのレコード店Swag Recordsの店内用語が起点だとする証言が有力だが、当事者間でも説明が分かれる。ロンドンでは、Terry FrancisやNathan Colesが1994年に始めたWiggleをはじめ、The Drop、Heart &amp; Soul、Releaseなど複数のパーティーでこの音が育まれ、1995年にMr. Cらが開いたクラブThe Endが拠点となった。当初のこの音楽は極めて地下的で、大きな旋律も分かりやすい盛り上がりも持たず、あくまで踊り続けるための役割に徹していた。2000年代に入ると、1990年代初頭にデトロイトのRobert HoodやDaniel Bellらが発展させたとされ、2000年代にドイツ(Kompakt、Perlon、Hawtinのm-nusなど)で広まったミニマル・テクノとの境界が曖昧になり、Richie HawtinやRicardo Villalobosの実践が、より少ない要素で長時間を持たせる方向を推し進めた。2010年前後には、スペインのイビサ島を舞台に大きな変化が起きる。Jamie JonesのHot Creationsを含む複数のレーベルやDJが、ミニマルな構造にディスコやファンクの色彩と歌の断片を戻し、これがイビサの巨大なクラブで熱狂的に受け入れられた。以後この様式は爆発的に商業化し、音源配信サイトのBeatportでは2015年に売上首位となり、その後はテクノに首位を譲って2位の時期が続いたが、2021年から再び首位に立っている。同時にこの成功は深刻な批判も招いた。すなわち、量産された曲が互いに区別できないほど似通っており、決まった位置に決まった音を置くだけの工業製品になっているという指摘である。実際、2000年代前半から型にはまった音への指摘があり、2010年代半ばに批判が強まった。それでもクラブの現場における実用性という一点において、この様式は磨き上げられており、世界中の週末の夜を支え続けている。</p>
