<h1>Kayo Rokyoku（カヨウロウキョク）とは</h1>
<p>歌謡浪曲は、浪曲の物語語りを、歌謡曲の形式で歌う日本の大衆音楽だ。代表曲22曲を動画で聴け、ルーツと影響のつながりを地図でたどれる。</p>
<p>歌謡浪曲は、浪曲の物語語りを、歌謡曲の形式で歌う日本の大衆音楽だ。

もとになった浪曲との大きな違いは、伴奏にある。三味線ではなく、ギター・ベース・ドラム・ストリングスといった洋楽器を主体とする伴奏を使い、歌と語りを交互に進める。

メロディは演歌と共通の土台を持つ。ヨナ抜き音階や短調のコード進行の上に、こぶしと呼ぶ音の揺らしをからめて作る。

語りの部分は拍にとらわれず、浪曲の語りと同じく、自由な間合いで進む。

歌い方は、マイクロフォンを持ち、直立した姿勢で歌う。声は浪曲の語りの技法を残しながら、歌謡曲の歌手のように、メロディを丁寧に歌い上げる。歌の合間には、タンカ（啖呵）と呼ばれるセリフが入る。啖呵は登場人物の台詞で、場面や心情は主に節で歌う。

歌詞の主題は、赤穂浪士や新選組といった日本史の人物と事件、庶民の涙を誘う母子の情だ。1曲で一人の人物の一生や、一つの事件の始末を描き切る。

曲の組み立ては、導入の語りで場面を説明し、歌で感情を盛り上げ、語りで展開を描く、長編の物語形式だ。通常の歌謡曲は3〜4分だが、長編歌謡浪曲は1曲が10分前後に及ぶこともある。物語の聴かせどころでは、語りと歌が急に切り替わる。</p>
<h2>成り立ち</h2><p>歌謡浪曲の始まりは、三味線の伴奏で軍記や世話物を語る浪曲を、時代とともに歌の形式に近づけていった流れにある。

戦前、宮川松安らがピアノ伴奏の楽浪曲を試みた。初代筑波武蔵は、ヴァイオリンなどの洋楽器の伴奏によるオーケストラ浪曲で演じた。いずれも歌謡浪曲の先駆とされる。戦時中には、木村若衛が和田肇と組んで「歌謡浪曲」と名づけ、放送局で企画放送されるまでに開拓した。軍歌を織り込んだ浪曲も現れた。

本格的に形になったのは戦後だ。マイクロフォンが発達し、声を張り上げなくても客席に届くようになると、浪曲師の声の使い方は大きく自由になった。戦後の浪曲師たちは、各自の「歌謡節」を作った。1955年には、民謡と浪曲を混ぜた芙蓉軒麗花の「ろうきょく炭坑節」が、「テケレッツのパ」のあいの手で大ヒットした。

一方、若手浪曲師の三波春夫は、1957年に歌手へ転向した。浪曲界の先輩たちが作り上げた物語とメロディを後世へ残したいという思いから、北村桃児のペンネームで自ら作詞・構成する道を選ぶ。1964年4月に発表した代表作「長編歌謡浪曲 元禄名槍譜 俵星玄蕃」は、累計150万枚（250万枚とされる資料もある）を超えるヒットとなり、同年の紅白歌合戦では白組の大トリを歌った。これを境に「長編歌謡浪曲」の名は三波の代名詞となり、1966年の「豪商一代 紀伊國屋文左衛門」をはじめ、生涯に40作以上を作った。

同世代の村田英雄も、浪曲師から演歌界へ転じた一人だ。「無法松の一生」（1958年）や「王将」（1961年）で、この流れを大きくした。女流では、天津羽衣、二葉百合子、二代目春野百合子、冨士月の栄、三代目日吉川秋水らが、歌謡浪曲の流れの中で活動した女流浪曲師である。二葉百合子は、菊池章子の原曲（1954年）をセリフ入りでカバーした「岸壁の母」（1972年）で、250万枚（LP・シングル・テープ合計）とされる大ヒットとなった。300万枚を超えるとする資料もある。関西の真山一郎は、曲師を置かず、オペレータと組んで音源を送り出す独自のやり方で、浪曲界の中で歌謡浪曲、のちには全編オーケストラの「演歌浪曲」を演じた。

こうして、歌謡浪曲は演歌の一分野として定着する。歌謡浪曲は、歌の合間にセリフを入れる形で、セリフ入り歌謡曲につながった。二代目木村友衛の「浪花節だよ人生は」も、広い意味では同じ枠組みにつながる。ただし、セリフがないため、歌謡浪曲の範疇には入れないことが多い。

三波春夫の死後は、長女の三波美夕紀が若手歌手へ長編歌謡浪曲を伝えている。三山ひろしは、三波を「歌の父」と呼んで慕い、コンサートでは必ず長編歌謡浪曲を歌う。三波春夫作の「長編歌謡浪曲 戦国塩物語」も歌い継いでいる。辰巳ゆうとは、2022年にシングル「雪月花」のカップリングで、「長編歌謡浪曲 沖田総司」を発表した。ほかにも山内惠介、市川由紀乃らへ歌い手が続き、歌謡浪曲は現代の演歌の中で歌い継がれている。</p>
