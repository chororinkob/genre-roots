<h1>Kayo Rokyoku（カヨウロウキョク）とは</h1>
<p>歌謡浪曲は、浪曲の物語語りを歌謡曲の形式で歌う日本の大衆音楽である。代表曲22曲を動画で聴け、ルーツと影響のつながりを地図でたどれる。</p>
<p>歌謡浪曲は、浪曲の物語語りを歌謡曲の形式で歌う日本の大衆音楽である。三味線ではなくギター・ベース・ドラム・ストリングスといった洋楽器の伴奏を用い、歌と語りを交互にすすめる点が、もとになった浪曲との決定的な違いである。

メロディは演歌と共通の土台を持ち、ヨナ抜き音階や短調のコード進行の上に、こぶしと呼ぶ音程の揺らしをからめて作られる。語りの間は伴奏が旋律を控えめにして声を引き立て、歌が始まると弦楽器とドラムが一体になって押し上げる。

リズムは4拍子を中心に、ドラムが静かなビートを刻む。テンポは場面ごとに緩急がつけられ、悲しみの場面はゆったりと、斬り合いや決闘の場面では速く動く。語りの部分は拍に縛られず、浪曲の語りと同じく自由な間合いで進む。

歌い方は、マイクロフォンを持ち、直立した姿勢で歌う。声は浪曲の語りの技法を残しつつ、歌謡曲の歌手のようにメロディを丁寧に歌い上げる。歌の合間にはタンカと呼ばれるセリフが入り、ここで場面の説明や人物の心情の語りが行われる。

歌詞の主題は、赤穂浪士や新選組といった日本史の人物と事件、庶民の涙を誘う母子の情や身河内の義理人情である。1曲で一人の人物の一生や、一つの事件の始末を描き切る。

曲の組み立ては、導入の語りで場面を説明し、歌で感情を盛り上げ、語りで展開を描き、最後のサビで結末を歌う長編の物語形式である。通常の歌謡曲が3〜4分なのに対し、長編歌謡浪曲では1曲が10分前後に及ぶこともあり、物語の聴かせどころでは語りと歌が急に切り替わる。</p>
<h2>成り立ち</h2><p>歌謡浪曲の始まりは、三味線の伴奏で軍記や世話物語を語る浪曲を、時代とともに歌の形式へ近づけていった流れの中にある。昭和の初めには、宮川松安や初代筑波武蔵が洋楽器の伴奏で演じる「楽浪曲」を試みた。戦時中には木村若衛が「歌謡浪曲」と銘打った作品を作り、軍歌を織り込んだ浪曲も現れた。

しかし本格的に形になったのは戦後である。マイクロフォンの発達により、声を張り上げなくても客席へ届くようになり、浪曲師の声の使い方は大きく自由になった。戦後の浪曲師たちは各自の「歌謡節」を作り、1955年には芙蓉軒麗花の「ろうきょく炭坑節」が「テケレッツのパ」の掛け声で大ヒットした。ここで歌と語りを混ぜる新しい型が世間に知れわたる。

一方、若手浪曲師の三波春夫は1957年に歌手へ転向した。浪曲界の先輩たちが作り上げた物語とメロディを後世へ残したいという思いから、北村桃児のペンネームで自ら作詞・構成する道を選ぶ。1964年4月、第一作「長編歌謡浪曲 元禄名槍譜 俵星玄蕃」を発表すると、累計150万枚を超えるヒットになり、同年の紅白歌合戦では白組の大トリを歌った。これを境に「長編歌謡浪曲」の名は三波の代名詞となり、1966年の「豪商一代 紀伊國屋文左衛門」をはじめ生涯に40作以上が作られた。

同世代の村田英雄もまた浪曲師から演歌界へ転じ、「無法松の一生」（1958年）や「王将」（1961年）でこの流れを大きくした。女流では天津羽衣、二葉百合子、二代目春野百合子、冨士月の栄、三代目日吉川秋水らの活動がほぼ歌謡浪曲そのものであり、二葉百合子が歌詞の合間に台詞を入れた「岸壁の母」（1972年）は300万枚を超える大ヒットとなった。関西の真山一郎は曲師を置かず、オペレータと組んで音源を送り出す独自のやり方で、浪曲界の中で歌謡浪曲を演じ続けた。

そして歌謡浪曲は演歌の一分野として定着する。セリフ入りの歌謡曲という形はここから生まれ、二代目木村友衛の「浪花節だよ人生は」も広義では同じ枠組みにつながる。ただしセリフがないため、歌謡浪曲の範疇に入れないことが多い。

三波春夫の死後、長女の三波美夕紀が若手歌手へ長編歌謡浪曲を伝えている。三山ひろしは三波を「歌の父」と呼んで慕い、コンサートでは必ず長編歌謡浪曲を歌い、「長編歌謡浪曲 戦国塩物語」も残した。辰巳ゆうとは2022年にシングル「雪月花」のカップリングで「長編歌謡浪曲 沖田総司」を発表した。ほかにも山内惠介、市川由紀乃らへ歌い手が続き、歌謡浪曲は現代の演歌の中で歌い継がれている。</p>
