<h1>Acid House（アシッドハウス）とは</h1>
<p>アシッドハウスは、Roland TB-303というベース用機材の誤用から生まれた、特異な音色を中心に据えたハウスの一系統だ。 TB-303は、もともとベースギターの代用品として作られた。ところが、カットオフ周波数（音をどこから削る</p>
<p>アシッドハウスは、Roland TB-303というベース用機材の誤用から生まれた、特異な音色を中心に据えたハウスの一系統だ。

TB-303は、もともとベースギターの代用品として作られた。ところが、カットオフ周波数（音をどこから削るか）とレゾナンス（その境目を強調する度合い）のつまみを演奏中に動かすと、うねりながら唸る液状の音が出る。この音がアシッドと呼ばれ、ジャンルの最大の特徴になっている。

作り方は単純だ。16ステップのシーケンサー（音の並びを自動で繰り返す装置）に短いフレーズを打ち込み、そこにスライド(音程を滑らかに繋ぐ)とアクセント(その音だけ強調する)を散らす。あとは延々とつまみを操作し続ける。

土台は四つ打ちだ。Roland TR-808や909、707などのドラムマシンのバスドラムを1拍ごとに置く。裏拍にオープンハイハット（シンバルを開いて響かせた音）、2拍4拍にクラップ（手拍子の音）を重ねる。テンポはおおむね120〜130BPMである。

和声（コードの響き）的な要素は控えめな曲が多い。インスト中心の曲が多いが、ヴォーカル曲もある。構成は長尺（10分超も珍しくない）で、フィルター操作が展開の中心になる。

英国のレイヴ期には、MDMAなどの薬物文化と強く結びついた。テクノやハウスの一部として扱われるが、TB-303の音色を最大の特徴とするハウスの一系統である。</p>
<h2>成り立ち</h2><p>舞台は、1985年から1987年のシカゴだ。アシッドハウスは、事故のような形で誕生した。中心となるのはPhutureで、DJ Pierre(Nathaniel Pierre Jones)、Spanky(Earl Smith Jr.)、Herb Jが結成した。

彼らは、中古で買ったRoland TB-303の使い方が分からなかった。操作を知らないままつまみをいじっているうちに、予期しない唸る音が出た。これを面白がって長時間録音したのが、「In Your Mind」と題されたテープだ。これをRon Hardyが、クラブ The Music Boxでかけた。最初はフロアが空になった。だが、同じ夜に計4回かけ直すうちに反応が変わり、4回目に観客が熱狂したという言い伝えが残る。この曲は1987年にTrax Recordsから「Acid Tracks」として発表された。

「acid」という名前の由来には諸説ある（曲名説、ドラッグ説、「acid burning」という俗語説など）。同時期にSleezy Dが1986年に「I've Lost Control」を、Adonisが1986年に「No Way Back」を発表しており、TB-303の使用は複数人が並行して行っていた。

TB-303自体は1981年に発売されたが、生ベースに似ない音のため商業的に失敗し、1984年に生産終了となった。その後、安価な中古品が出回っていた（約40〜200ドルという証言がある）。安価な中古機の流通が、実験の前提条件のひとつになった。

決定的な展開はイギリスで起きる。1987年、イビサ島でDanny Rampling、Paul Oakenfold、Nicky Holloway、Johnny Walkerらが、Amnesiaというクラブで衝撃を受けた（4人とする資料のほか、5人とする資料もある）。このDJたちは、DJ Alfredoの選曲とMDMAの体験に圧倒されたのだ。帰国後、彼らはロンドンでShoom(Rampling)、Spectrum(Oakenfold)、The Trip(Holloway)といったクラブを開いた。

1988年から1989年にかけて、これが爆発的に広がり、セカンド・サマー・オブ・ラヴと呼ばれる社会現象になった。M25環状道路沿いの倉庫、野原、飛行場などで、無許可の大規模野外パーティーが開かれた。参加者は当日まで場所を知らされず、電話の伝言サービスで誘導された。スマイリーマークの黄色いTシャツが、トレードマークになった。

しかし1988年夏から大衆紙の攻撃が始まり、同年10月のJanet Mayesの死でさらに過熱した。政府は1990年のEntertainments (Increased Penalties) Actと、1994年のCriminal Justice and Public Order Actで対抗した。後者は、野外の集会で流す「音楽」の定義に「反復するビートを特徴とする音」を含めるという異例の条文を含み、大きな抗議運動を引き起こした。この弾圧により、地下パーティーは衰退し、規制されたクラブ営業へ移行したと語られる（定説とまでは言えない）。

音楽的には、アシッドはハードコアやテクノへ分岐した。Josh Wink の1995年「Higher State of Consciousness」やHardfloorが、それを受け継いだ。TB-303は現在では高騰し、多数の複製機やソフトウェアが作られている。</p>
