<h1>Acid House（アシッドハウス）とは</h1>
<p>Roland TB-303というベース用機材の誤用から生まれた、特異な音色を中心に据えたハウスの一系統。TB-303は本来ベースギターの代用品として作られたが、カットオフ周波数とレゾナンスのつまみを演奏中に動かすと、うねりながら唸</p>
<p>Roland TB-303というベース用機材の誤用から生まれた、特異な音色を中心に据えたハウスの一系統。TB-303は本来ベースギターの代用品として作られたが、カットオフ周波数とレゾナンスのつまみを演奏中に動かすと、うねりながら唸る液状の音が出る。この音がアシッドと呼ばれ、ジャンルの唯一にして絶対の識別点になっている。制作手法は単純で、16ステップのシーケンサーに短いフレーズを打ち込み、そこにスライド(音程を滑らかに繋ぐ)とアクセント(その音だけ強調する)を散らし、あとは延々とつまみを操作し続ける。土台は四つ打ちで、Roland TR-808か909のバスドラムを1拍ごとに置き、裏拍にオープンハイハット、2拍4拍にクラップを重ねる。テンポは118〜130BPM。和声の概念はほぼなく、単音のシーケンスがひとつの調の中を這い回るだけで、コード進行を持たない曲も多い。上物は極端に少なく、時折ディレイをかけたヴォーカルの断片や、シンセの持続音が差し込まれる程度。構成は8分から10分に及ぶことも多く、フィルターの開閉そのものが唯一の展開になる。この音は化学的な陶酔感と結びつけられ、実際に薬物文化と不可分な歴史を持つ。テクノやハウスの一部として扱われるが、音色の一点で定義される極めて珍しいジャンルである。</p>
<h2>成り立ち</h2><p>1985年から1987年にかけてシカゴで、事故のような形で誕生した。中心となるのはPhutureで、DJ Pierre(Nathaniel Pierre Jones)、Spanky(Earl Smith Jr.)、Herb Jが結成した。彼らは中古で買ったRoland TB-303の使い方が分からず、前の持ち主が残したパターンをそのままにつまみを回したところ、予期しない唸る音が出た。これを面白がって長時間録音したのが「In Your Mind」と題されたテープで、これをRon Hardyがクラブ The Music Boxでかけた。最初の3回は客が困惑して踊らなかったが、4回目でフロアが爆発したという逸話が残る。この曲は1987年にTrax Recordsから「Acid Tracks」として発表され、ジャンル名の由来になった。同時期にSleezy Dが1986年に「I've Lost Control」を、Adonisが「No Way Back」を発表しており、TB-303の使用は複数人が並行して行っていた。TB-303自体は1981年に発売されたが、生ベースに似ない音のため商業的に失敗し、1984年に生産終了、中古市場で二束三文で投げ売りされていた。この価格崩壊がなければアシッドハウスは生まれなかったと言ってよい。決定的な展開はイギリスで起きる。1987年にイビサ島でDanny Rampling、Paul Oakenfold、Nicky Holloway、Johnny Walkerの4人のDJがAmnesiaというクラブでDJ Alfredoの選曲とMDMAの体験に衝撃を受け、帰国後にロンドンでShoom(Rampling)、Spectrum(Oakenfold)、The Trip(Holloway)といったクラブを開いた。1988年から1989年にかけてこれが爆発的に広がり、セカンド・サマー・オブ・ラヴと呼ばれる社会現象になった。M25環状道路沿いの倉庫や農場で無許可の大規模野外パーティーが開かれ、参加者は当日まで場所を知らされず、電話の伝言サービスで誘導された。スマイリーマークの黄色いTシャツが象徴になった。しかしMDMAの死者が出たことで大衆紙が激しい攻撃キャンペーンを展開し、政府は1990年のEntertainments (Increased Penalties) Actと、1994年のCriminal Justice and Public Order Actで対抗した。後者は「反復するビートを特徴とする音楽」という文言で法的にレイヴを定義するという異例の条文を含み、大きな抗議運動を引き起こした。この弾圧により地下パーティーは衰退し、規制されたクラブ営業へ移行する。音楽的にはアシッドはハードコアやテクノへ分岐し、Josh Wink の1995年「Higher State of Consciousness」やHardfloorが継承した。TB-303は現在では高騰し、多数の複製機やソフトウェアが作られている。</p>
<h2>代表曲</h2><ul><li>Acid Tracks (Phuture)</li><li>Voodoo Ray (A Guy Called Gerald)</li><li>Phuture Jacks (Phuture)</li></ul>
