<h1>Roots Rock（ルーツロック）とは</h1>
<p>1960年代末に、それ以前のロックが到達した過剰な実験と技巧から意識的に後退し、アメリカの古い音楽の素朴さへ回帰した様式である。編成はギター、ベース、ドラム、そしてピアノかオルガンという標準的なもので、大人数の管弦楽や複雑な電子的</p>
<p>1960年代末に、それ以前のロックが到達した過剰な実験と技巧から意識的に後退し、アメリカの古い音楽の素朴さへ回帰した様式である。編成はギター、ベース、ドラム、そしてピアノかオルガンという標準的なもので、大人数の管弦楽や複雑な電子的な処理は用いられない。録音の方針が決定的で、演奏者が同じ部屋で同時に演奏し、それをほぼそのまま記録するという方法が採られる。したがって細部の不揃いや息遣いが残り、音は乾いて温かい。ギターは歪ませすぎず、旋律を弾くより和音を的確に置くことが重んじられ、長い独奏はほとんど置かれない。リズムは四拍子を素直に刻み、テンポは中庸である。和声はブルース、カントリー、そしてゴスペルに由来する単純な進行が中心で、そこに教会音楽由来の複数の声による和音が重ねられる。この合唱がこの様式の情感を担う。歌唱は技巧を誇示せず、しゃがれた声や不完全な音程が肯定される。歌詞は都市の疎外や幻覚の体験ではなく、農村の風景、労働、家族、そして聖書に由来する物語や人物を扱い、古いアメリカの記憶を呼び起こす方向へ向かう。</p>
<h2>成り立ち</h2><p>1967年前後、ロックは技術的にも思想的にも頂点に達していた。多重録音による複雑な作品、20分に及ぶ即興、幻覚剤の体験を音にする試みが競われ、演奏はますます巨大な会場で行われるようになっていた。しかしまさにその時期に、正反対の方向へ向かう動きが同時に起きる。契機のひとつはBob Dylanである。彼は1966年にオートバイ事故を起こして活動を中断し、ニューヨーク州の田舎で静養しながら、伴奏を務めていた演奏者たちと膨大な数の古い歌を録音していた。この非公式な録音を経て、彼は1967年、極端に簡素な編成による作品を発表する。当時の流行に真っ向から逆らうこの選択は、多くの音楽家に衝撃を与えた。彼と共に演奏していた集団は、後にThe Bandとして1968年に自らの作品を発表する。カナダ人四人とアメリカ人一人から成る彼らは、19世紀の南北戦争や農民の生活を歌い、三人の歌手が交代で歌うという古風な形式を採った。この作品は、ロックが最新である必要はないという可能性を提示した。同じ1968年、The Rolling Stonesも幻覚的な実験を放棄し、ブルースとカントリーへ回帰した作品を発表している。カリフォルニアのCreedence Clearwater Revivalは、この様式を最も簡潔な形で大衆へ届けた。彼らは三分程度の曲を短期間に大量に発表し、当時の複雑化した音楽への明確な対抗となった。この回帰には批判もある。すなわち、都市の若者が農村の生活を理想化するのは一種の空想であり、実際の困窮を知らないという指摘である。それでも、演奏の一体感と楽曲の簡潔さを重んじるという価値観は、後のパンク、オルタナティヴ・カントリー、そしてアメリカーナに受け継がれた。</p>
<h2>代表曲</h2><ul><li>The Weight (The Band)</li><li>Proud Mary (Creedence Clearwater Revival)</li><li>American Girl (Tom Petty and the Heartbreakers)</li></ul>
