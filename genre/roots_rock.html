<h1>Roots Rock（ルーツロック）とは</h1>
<p>ルーツ・ロックは、1960年代末に生まれたロックのスタイルだ。それまでのロックが行き着いた行き過ぎた実験や技巧から、わざと一歩引き、アメリカの古い音楽の素朴さへ立ち返った。 編成は、ギター、ベース、ドラム、そしてピアノかオルガンが</p>
<p>ルーツ・ロックは、1960年代末に生まれたロックのスタイルだ。それまでのロックが行き着いた行き過ぎた実験や技巧から、わざと一歩引き、アメリカの古い音楽の素朴さへ立ち返った。

編成は、ギター、ベース、ドラム、そしてピアノかオルガンが基本になることが多い。大人数のオーケストラや、複雑な電子的な加工は、あまり使われない。ただし、スライド・ギターやペダル・スティールを使う例もある。The Bandは全員が複数の楽器を演奏し、アコーディオン、サックス、フィドル、マンドリンも使った。

ギターは音を歪ませすぎないことが多い。メロディーを弾くより、和音を的確に置くことが大切にされ、長いソロは多くない。和音の流れは、ブルース、カントリー、そしてゴスペルから来たとされる単純な進行が中心だ。The Bandなど一部のバンドでは、そこに教会音楽から来た複数の声によるハーモニーが重なり、この合唱が情感を担う。

リズムは4拍子を素直に刻むことが多いが、6拍子の曲もある。テンポは速すぎず遅すぎずだ。

歌い方は技巧を見せつけない。しゃがれた声や、少し外れた音程も、良いものとして受け入れられる。

歌詞は、The Bandなど初期の一部では、農村の風景、労働、家族、そして聖書から来た物語や人物を扱い、古いアメリカの記憶を呼び起こす方向へ向かう。

録音のやり方にも特徴がある。一部の代表作では、演奏者が同じ部屋で同時に演奏し、それをほぼそのまま記録する方法が採られた。そのため、細かな不揃いや息づかいが残り、音は乾いていて温かい。</p>
<h2>成り立ち</h2><p>1967年前後、ロックは技術の面でも考え方の面でも頂点に達していたとも言われる。多重録音による複雑な作品、幻覚剤の体験を音にする試みが、競い合うように生まれていた。

しかし、まさにその時期に、正反対の方向へ向かう動きが同時に起きる。きっかけのひとつはBob Dylanだ。彼は1966年にオートバイ事故を起こして活動を休み、ニューヨーク州の田舎で静養していた。その間に、伴奏を務めていた演奏者たちと、伝承曲やカバー曲のほか、約30曲の新曲を録音している。

同じ時期の1967年、彼はきわめて簡素な編成の作品を発表する。この作品は、サイケデリック全盛の年に、時代に逆行すると受け取られた。批評家は、流行に応じようとしない姿勢を評した。

彼と一緒に演奏していた仲間は、のちにThe Bandとして、1968年に自分たちの作品を発表する。メンバーはカナダ人4人とアメリカ人一人だ。3人の歌い手が交代で歌うという古風な形を採り、1969年の2作目では、19世紀の南北戦争や農民の暮らしを歌った。この作品は、ロックが最新である必要はない、という可能性を示した。

同じ1968年、The Rolling Stonesもサイケデリック・ポップから離れ、ブルースとカントリーに立ち返った作品を発表している。ただし、楽器の面での実験は続いた。

カリフォルニアのCreedence Clearwater Revivalは、このスタイルを簡潔な形で多くの人に届けた。彼らはシングル向けの短い曲を中心に、短い期間に大量の曲を発表した(長い曲もあった)。それは、当時の複雑になった音楽へのはっきりした対抗となった。CCRは、実際の南部を知らないまま、南部の情景を描いた。南部を神話化したとも評される。

それでも、演奏の一体感と曲の簡潔さを大切にするという考え方は、後のアメリカーナの源流の一つになったとも言われる。

一方、パンクはオルタナティヴ・カントリーにエネルギーとDIY精神を与えた。また、パンク出身者がルーツ・ロックを取り込んだ例（カウパンク、ハートランド・ロック）もある。</p>
<h2>代表曲</h2><ul><li>One Headlight (The Wallflowers)</li><li>Copperhead Road (Steve Earle)</li><li>Proud Mary (Creedence Clearwater Revival)</li><li>Hold My Hand (Hootie &amp; The Blowfish)</li><li>6th Avenue Heartache (The Wallflowers)</li><li>Hard to Handle (The Black Crowes)</li><li>American Girl (Tom Petty and the Heartbreakers)</li><li>The Weight (The Band)</li><li>Sugar Magnolia (Grateful Dead)</li><li>Will the Wolf Survive? (Los Lobos)</li><li>Still Be Around (Uncle Tupelo)</li><li>Have a Little Faith in Me (John Hiatt)</li></ul>
