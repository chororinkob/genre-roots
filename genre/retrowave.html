<h1>Retrowave（レトロウェーブ）とは</h1>
<p>シンセウェイヴとほぼ同義に使われる呼称だが、とりわけ1980年代の視覚文化と音の記号を意識的に再現する側面を強調する。BPMは90〜120前後、リズムはLinnDrumやRoland TR-707といった当時のドラムマシンの音色、</p>
<p>シンセウェイヴとほぼ同義に使われる呼称だが、とりわけ1980年代の視覚文化と音の記号を意識的に再現する側面を強調する。BPMは90〜120前後、リズムはLinnDrumやRoland TR-707といった当時のドラムマシンの音色、あるいはそれを模したサンプルで組まれ、スネアには必ずと言っていいほどゲート・リバーブがかかる。ベースは単音のアナログ・シンセが8分音符を刻み、その上にFM音源特有の金属的なベルやエレクトリック・ピアノの音色が乗る。旋律は明快で口ずさめる範囲に収められ、鋸波を重ねたリード音が主題を高らかに歌う。和声は短調の四和音循環が中心だが、シンセウェイヴ全般より長調寄りの明るい響きを選ぶ傾向があり、切なさよりも爽快感が前に出る。構成は器楽曲として起承転結を持ち、中間部で一度音を薄くしてから最終部で全楽器が復帰する型が定番。歌ものの場合は男女どちらもリバーブを深くかけた優しい歌唱が選ばれる。ジャケットには夕陽、格子状の地平線、ヤシの木、スポーツカーといった図像が用いられ、音と絵が一体で一つの世界観を構成する点が、単なる音楽ジャンルを超えた特徴である。</p>
<h2>成り立ち</h2><p>2000年代末から2010年代初頭にかけて、シンセウェイヴと同じ土壌から、より視覚文化と結び付いた呼称として広まった。起点はフランスのレーベルValerie Collectiveで、2000年代後半にCollege（David Grellier）、Anoraak、Minitel Roseといった作家を集め、1980年代の映画音楽とイタロ・ディスコを混ぜた音を提示した。2009年前後にはこの音がインターネット上のブログを通じて拡散し、当初はネオ・エイティーズ、フューチャー・エイティーズなど複数の名称で呼ばれた。決定的な出来事は2011年の映画Driveで、Collegeの楽曲A Real HeroがElectric Youthの歌とともに使われ、この美学が映画館という大舞台で提示された。同時期、スウェーデンのMitch Murder、米国のPower Glove、フランスのCarpenter Brutらが登場し、それぞれ明るい系統と暗い系統に分岐していく。図像面では、デザイナーによる格子状の地平線と夕陽を組み合わせたジャケットが定型となり、この視覚言語がジャンルの識別子として音楽以上に強く機能した。2013年のゲームHotline Miamiは、Perturbator、M.O.O.N.、Jasper Byrneらの楽曲を用いて、暴力的な映像とこの音の相性を示し、若い世代への浸透を決定づけた。2016年のテレビドラマStranger Thingsは、Kyle DixonとMichael Steinによる音楽を通じて、この美学を完全に主流の娯楽へ持ち込んだ。産業構造としては、Bandcampでの直販、YouTubeの長時間ミックス動画、そして少部数のアナログ盤という三本柱で成り立ち、大手レコード会社をほぼ介さずに国際的な市場が形成された点が特筆される。批判としては、1980年代の記号を消費するだけで新しさがないという指摘、そして実際には多くの作家が1980年代を体験していない世代であるという皮肉が繰り返し語られている。</p>
