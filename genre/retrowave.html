<h1>Retrowave（レトロウェーブ）とは</h1>
<p>レトロウェイヴは、シンセウェイヴの別称、または広い意味でまとめて呼ぶ総称として使われる呼び名だ。ただ、とくに1980年代の見た目の文化と音の目印を、わざと再現する面を強く打ち出す。 ベースでは、単音のアナログ・シンセが8分音符を刻</p>
<p>レトロウェイヴは、シンセウェイヴの別称、または広い意味でまとめて呼ぶ総称として使われる呼び名だ。ただ、とくに1980年代の見た目の文化と音の目印を、わざと再現する面を強く打ち出す。

ベースでは、単音のアナログ・シンセが8分音符を刻むことが多い。その上に、FM音源ならではの金属的なベルや、エレクトリック・ピアノの音色が乗ることが多い。

メロディーは分かりやすく、口ずさめる範囲に収められる。主題を高らかに歌うのは、鋸波を重ねたリード音だ。

和音は、短調の四つの音を重ねた和音のくり返しが中心だ。

一般的なテンポは80〜118 BPMで、より上げ調子の曲は128〜140 BPMになる。リズムの典型例は、LinnDrumやRoland TR-707といった当時のドラムマシンの音色か、それをまねたサンプルで組むものだ。スネアには、しばしばゲート・リバーブがかかる。

歌ものの場合は、男女どちらも、リバーブを深くかけた優しい歌い方が選ばれることが多い。

曲の組み立ては、楽器だけの曲として起承転結を持つ。中間部でいったん音を薄くし、最終部で全部の楽器が戻ってくる型がよく見られる。

ジャケットには、夕陽、格子状の地平線、ヤシの木、スポーツカーといった絵柄が使われることが多い。音と絵が一体となって一つの世界観を作る点が、単なる音楽ジャンルを超えた特徴だとも言われる。</p>
<h2>成り立ち</h2><p>2000年代末から2010年代初めにかけて、レトロウェイヴは、シンセウェイヴと同じ土壌から、より視覚文化と結び付いた呼び名として広まった。

最初期の中心の一つは、フランスのValerie Collectiveだ。2007年にナントで始まったブログ兼アーティストのネットワークで、のちにレーベルになった。ここにはCollege（David Grellier）、Anoraak、Minitel Roseといった作り手が集まり、1980年代の映画音楽とイタロ・ディスコを混ぜたとされる音を示した。

この音は、インターネット上のブログを通じて広まった。初期の音楽報道は、Kavinskyらを「retro electro」と呼んでいた。「outrun」「futuresynth」「retrowave」を別称として挙げたのは、Julia Neumanの2015年の記事である。Retrowaveという呼び名が広まったのは、2011年11月に設立されたNewRetroWave以降が中心だとも言われる。

2011年の映画Driveでは、Collegeの曲A Real Heroが、Electric Youthの歌とともに使われた。この美学が、映画館という大舞台で示されたのである。この音楽は、Driveなどを通じてより広い人気を得た。

スウェーデンのMitch Murderの初EP『After Hours』は、2009年に出た。オーストラリアのPower Gloveは、初作が2010年5月にSoundCloudで公開され、EP 1の公式リリースは2012年1月だった。フランスのCarpenter BrutのEP Iは、2012年に出た。その後、この音楽は明るい系統と暗い系統に分かれていく。

見た目の面では、デザイナーによる格子状の地平線と夕陽を組み合わせたジャケットが定番になった。この絵の言葉は、音楽以上に、ジャンルを見分ける目印として強く働いた。

2012年のゲームHotline Miamiは、Perturbator、M.O.O.N.、Jasper Byrneらの曲を使い、暴力的な映像とこの音の相性を示した。この音楽は、さらに広い人気を得た。2016年のテレビドラマStranger Thingsは、Kyle DixonとMichael Steinによる音楽を通じて、この美学を主流の娯楽へ持ち込んだ。

作品の届け方では、BandcampやYouTubeの長時間ミックス動画といった独立系の流通が目立つ。しかし、例えばDriveのサウンドトラックは、2011年9月に独立系の商業レーベルLakeshoreからCDで発売された。Stranger Things第1シーズンのサウンドトラックは、2016年8月にLakeshoreとInvadaから配信された。このように、関連作品には商業レーベルを通して流通しているものもある。

1980年代の記号を消費するだけで新しさがないという指摘や、1980年代を体験していない世代の作家もいるという皮肉など、そうした批判もある。</p>
