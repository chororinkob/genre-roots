<h1>Medievalとは</h1>
<p>中世音楽は、おおよそ6世紀から15世紀にかけて、ヨーロッパで作られた音楽の総称だ。 中心にあるのは、ローマ・カトリック教会の典礼（儀式）で歌われた単旋律（1本の旋律だけ）の聖歌である。伴奏はない。現代の演奏では拍や規則的な拍節アク</p>
<p>中世音楽は、おおよそ6世紀から15世紀にかけて、ヨーロッパで作られた音楽の総称だ。

中心にあるのは、ローマ・カトリック教会の典礼（儀式）で歌われた単旋律（1本の旋律だけ）の聖歌である。伴奏はない。現代の演奏では拍や規則的な拍節アクセントを置かないのが一般的で、中世のリズムは学説が分かれる。また、旋律はラテン語の言葉の抑揚に従って動く。

音の組織は、長調と短調の二分法ではない。ドリア、フリギア、リディア、ミクソリディアといった教会旋法（中世の教会音楽の音の並び方）によって決まる。

9世紀末の理論書に、この単旋律に平行する別の声部を加えるオルガヌム（聖歌に別の声部を重ねた初期の多声音楽）の記述がある。これが記録に残る最古の多声音楽である。9世紀末の並行オルガヌムは4度・5度・8度が中心だった。11世紀には3度も許容され、英国では3度が好まれた。13世紀の理論家(Garlandiaなど)が3度を不完全協和音（やわらかく響き合う音程）に分類し、15世紀に向けて、協和音として多用されていった。

13世紀以降は、複数の声部がそれぞれ異なる歌詞を同時に歌うモテットが発達した。音の長さを記号で表す記譜法（楽譜の書き方）が整備されたことで、複雑なリズムの重ね合わせも可能になる。

世俗の音楽では、南フランスのトルバドゥール、北フランスのトルヴェール、ドイツのミンネゼンガーが、恋愛と騎士道を歌った。擦弦楽器（弓で弾く楽器）のヴィエール、リコーダー、オーボエの前身であるショーム、ハーディガーディ（ハンドルを回して弦を鳴らす楽器）、携帯用の小型オルガン、そして各種の太鼓は、当時の楽器として図像や記録に現れる。舞曲では、エスタンピーのような反復構造を持つ形式が記録されている。</p>
<h2>成り立ち</h2><p>西ローマ帝国が崩壊したあと、ヨーロッパでは、音楽の記録と理論化で教会(修道院)が中心的な役割を果たした。各地でばらばらに歌われていた聖歌を統一しようとする動きは、8世紀から9世紀のカロリング朝で本格化する。

伝説では、ローマ教皇グレゴリウス1世が聖霊の導きで旋律を口述したとされる。しかし実際には、8世紀半ば〜9世紀(死後およそ1.5〜3世紀)に、カロリング朝のもとでローマ聖歌とガリア聖歌が融合して成立したものである。

9世紀頃、旋律の上下を示す簡単な記号であるネウマが、写本の歌詞の上に書き込まれ始めた。11世紀には、イタリアの修道士Guido d'Arezzoが、線を用いた記譜法と、ut-re-mi-fa-sol-laの階名唱(ドレミの原型)を整備したとされる。ネウマは9世紀から存在したが、音の高さが不明確だった。Guidoの線譜が音高の関係を明確にし、旋律の習得を大幅に短縮した。この整備が、以後の西洋音楽が作曲された作品を蓄積していく前提を作ったと言われる。

12世紀後半から13世紀にかけて、パリのノートルダム大聖堂を拠点とするLéoninとPérotinが、複数の声部を精密に組み合わせるノートルダム楽派を築いた。多声音楽は、新しい段階へ進む。

14世紀には、Johannes de Murisの論考(1320年頃)や、Philippe de Vitryに帰される著作(1322年頃、Vitryの著者性には異論がある)から、「アルス・ノヴァ」（「新しい技法」の意味）の名が広まった。Guillaume de Machautは、詩人でありながら作曲家でもあった。彼は、作曲者が特定できる単独の作曲家によるミサ通常文（ミサで毎回歌う決まった祈りの文）全体の、現存最古の例を残した(作者不詳のトゥルネーのミサが先行する)。同時代のイタリアでは、Francesco Landiniが活躍している。

この時期は、黒死病(約3分の1とされる)や戦争によって、ヨーロッパの人口が激減した時代でもあった。黒死病の流行期には、苦行者の歌(Geisslerlied、特にドイツ)が記録された。

世俗音楽の担い手であるトルバドゥールの文化は、南フランスのオック語圏で栄えた。しかし、13世紀のアルビジョワ十字軍(1209〜1229)で南仏の宮廷が打撃を受けたことが、衰退の一因とされる。生き残った詩人は、イタリア、スペイン、ポルトガル、北フランスなどに移った。

この時代の音楽は、18〜19世紀から関心が高まった。1950年代以降には、中世・ルネサンス音楽の古楽復興運動（昔の音楽を当時の方法で演奏し直す運動）が本格化し、1970年代までに定着した。The Hilliard EnsembleやAnonymous 4といった団体の録音を通じて、現在では広く聴かれるようになった。</p>
