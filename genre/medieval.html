<h1>Medievalとは</h1>
<p>おおよそ6世紀から15世紀にかけて、ヨーロッパで作られた音楽の総称。中心にあるのはローマ・カトリック教会の典礼で歌われた単旋律の聖歌で、伴奏を持たず、拍節の枠にも縛られず、ラテン語の言葉の抑揚に従って旋律が動く。音の組織は長調と短</p>
<p>おおよそ6世紀から15世紀にかけて、ヨーロッパで作られた音楽の総称。中心にあるのはローマ・カトリック教会の典礼で歌われた単旋律の聖歌で、伴奏を持たず、拍節の枠にも縛られず、ラテン語の言葉の抑揚に従って旋律が動く。音の組織は長調と短調の二分法ではなく、ドリア、フリギア、リディア、ミクソリディアといった教会旋法によって規定される。9世紀頃から、この単旋律に平行する別の声部を加えるオルガヌムが現れ、多声音楽が始まった。初期は4度・5度が中心で3度は避けられ、13世紀の理論で不完全協和音に位置づけられ、15世紀に向けて協和として多用されていった。13世紀以降は、複数の声部がそれぞれ異なる歌詞を同時に歌うモテットが発達し、音の長さを記号で表す記譜法が整備されたことで、複雑なリズムの重ね合わせが可能になる。世俗の側では、南フランスのトルバドゥール、北フランスのトルヴェール、ドイツのミンネゼンガーが恋愛と騎士道を歌い、擦弦楽器のヴィエール、リコーダー、オーボエの前身であるショーム、ハーディガーディ、携帯用の小型オルガン、そして各種の太鼓が伴奏に用いられた。舞曲では、エスタンピーのような反復構造を持つ形式が記録されている。</p>
<h2>成り立ち</h2><p>西ローマ帝国の崩壊後、ヨーロッパで音楽を記録し理論化する仕事は、ほぼ全面的にキリスト教会が担った。各地でばらばらに歌われていた聖歌を統一しようとする動きは8世紀から9世紀のカロリング朝で本格化する。伝説では、ローマ教皇グレゴリウス1世が聖霊の導きで旋律を口述したとされるが、実際には8世紀半ば〜9世紀(死後およそ1.5〜3世紀)に、カロリング朝のもとでローマ聖歌とガリア聖歌が融合して成立したものである。9世紀頃、旋律の上下を示す簡単な記号であるネウマが写本の歌詞の上に書き込まれ始め、11世紀にはイタリアの修道士Guido d'Arezzoが線を用いた記譜法と、音名を階名で歌う方法を体系化した。これによって、口伝えでしか伝わらなかった旋律を、聴いたことのない人が譜面だけで再現できるようになる。この発明が、以後の西洋音楽が作曲された作品を蓄積していく前提を作った。12世紀後半から13世紀にかけては、パリのノートルダム大聖堂を拠点とするLéoninとPérotinが複数の声部を精密に組み合わせるノートルダム楽派を築き、多声音楽を新しい段階へ進める。14世紀には、Johannes de Murisの論考(1320年頃)やPhilippe de Vitryに帰される著作(1322年頃、Vitryの著者性には異論がある)から「アルス・ノヴァ」の名が広まり、Guillaume de Machautは詩人でありながら作曲家として、作曲者が特定できる単独の作曲家によるミサ通常文全体の、現存最古の例を残した(作者不詳のトゥルネーのミサが先行する)。同時代のイタリアではFrancesco Landiniが活躍している。この時期は100年戦争と黒死病によってヨーロッパの人口が激減した時代でもあり、黒死病の流行期には、苦行者の歌(Geisslerlied、特にドイツ)が記録された。世俗音楽の担い手であるトルバドゥールの文化は南フランスのオック語圏で栄えたが、13世紀のアルビジョワ十字軍(1209〜1229)とその余波で保護者だった宮廷が失われ、伝統は徐々に衰退し、詩人の多くはイタリア・スペイン・ハンガリーなど他国の宮廷へ移った。この時代の音楽は長く忘れられていたものの、20世紀に入って古楽復興運動が起こり、The Hilliard EnsembleやAnonymous 4といった団体の録音を通じて、現在では広く聴かれるようになった。</p>
