<h1>Medievalとは</h1>
<p>おおよそ5世紀から15世紀にかけて、ヨーロッパで作られた音楽の総称。中心にあるのはローマ・カトリック教会の典礼で歌われた単旋律の聖歌で、伴奏を持たず、拍節の枠にも縛られず、ラテン語の言葉の抑揚に従って旋律が動く。音の組織は長調と短</p>
<p>おおよそ5世紀から15世紀にかけて、ヨーロッパで作られた音楽の総称。中心にあるのはローマ・カトリック教会の典礼で歌われた単旋律の聖歌で、伴奏を持たず、拍節の枠にも縛られず、ラテン語の言葉の抑揚に従って旋律が動く。音の組織は長調と短調の二分法ではなく、ドリア、フリギア、リディア、ミクソリディアといった教会旋法によって規定される。9世紀頃から、この単旋律に平行する別の声部を加えるオルガヌムが現れ、多声音楽が始まった。当初は完全五度と完全四度による硬質な響きが中心で、現代の耳に心地よい三度は不完全な響きとして扱われていた。13世紀以降は、複数の声部がそれぞれ異なる歌詞を同時に歌うモテットが発達し、音の長さを記号で表す記譜法が整備されたことで、複雑なリズムの重ね合わせが可能になる。世俗の側では、南フランスのトルバドゥール、北フランスのトルヴェール、ドイツのミンネゼンガーが恋愛と騎士道を歌い、リュートの前身にあたる撥弦楽器、擦弦楽器のヴィエール、リコーダー、オーボエの前身であるショーム、ハーディガーディ、携帯用の小型オルガン、そして各種の太鼓が伴奏に用いられた。舞曲では、エスタンピーのような反復構造を持つ形式が記録されている。</p>
<h2>成り立ち</h2><p>西ローマ帝国の崩壊後、ヨーロッパで音楽を記録し理論化する仕事は、ほぼ全面的にキリスト教会が担った。各地でばらばらに歌われていた聖歌を統一しようとする動きは8世紀から9世紀のカロリング朝で本格化する。伝説では、ローマ教皇グレゴリウス1世が聖霊の導きで旋律を口述したとされるが、実際にはその死後2世紀以上たってから、フランク王国の政治的な統合政策の一環として編纂されたものである。9世紀頃、旋律の上下を示す簡単な記号であるネウマが写本の歌詞の上に書き込まれ始め、11世紀にはイタリアの修道士Guido d'Arezzoが線を用いた記譜法と、音名を階名で歌う方法を体系化した。これによって、口伝えでしか伝わらなかった旋律を、聴いたことのない人が譜面だけで再現できるようになる。この発明が、以後の西洋音楽が作曲された作品を蓄積していく前提を作った。12世紀後半から13世紀にかけては、パリのノートルダム大聖堂を拠点とするLéoninとPérotinが複数の声部を精密に組み合わせるノートルダム楽派を築き、多声音楽を新しい段階へ進める。14世紀にはフランスのPhilippe de Vitryが著した理論書の題名から「アルス・ノヴァ」と呼ばれる潮流が生まれ、Guillaume de Machautは詩人でありながら作曲家として、一人の作者による完結したミサ曲を初めて残した。同時代のイタリアではFrancesco Landiniが活躍している。この時期は100年戦争と黒死病によってヨーロッパの人口が激減した時代でもあり、音楽の主題にも死と無常が色濃く現れた。世俗音楽の担い手であるトルバドゥールの文化は南フランスのオック語圏で栄えたが、13世紀のアルビジョワ十字軍による弾圧で壊滅している。この時代の音楽は長く忘れられていたものの、20世紀に入って古楽復興運動が起こり、The Hilliard EnsembleやAnonymous 4といった団体の録音を通じて、現在では広く聴かれるようになった。</p>
<h2>代表曲</h2><ul><li>O Euchari (Hildegard von Bingen)</li><li>Viderunt Omnes (Perotin)</li><li>Douce Dame Jolie (Guillaume de Machaut)</li><li>Sumer Is Icumen In (Anonymous)</li><li>Cantigas de Santa Maria (Alfonso X)</li></ul>
