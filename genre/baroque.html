<h1>Baroque（バロック）とは</h1>
<p>おおよそ1600年から1750年までの西洋芸術音楽。最大の構造的特徴は通奏低音で、チェンバロやオルガンなどの鍵盤楽器と、チェロやヴィオラ・ダ・ガンバなどの低音楽器が組になり、書かれた低音の音符とその下の数字を見ながら和音を即興的に</p>
<p>おおよそ1600年から1750年までの西洋芸術音楽。最大の構造的特徴は通奏低音で、チェンバロやオルガンなどの鍵盤楽器と、チェロやヴィオラ・ダ・ガンバなどの低音楽器が組になり、書かれた低音の音符とその下の数字を見ながら和音を即興的に補って伴奏する。この即興的な和声の充填が、あらゆる編成の土台をなす。和声の面では、それまでの旋法から長調と短調の二元的な調性へ移行し、和音がどこへ進むかが規則化された機能和声が確立した。リズムは規則的な拍節が明確で、一つの楽章は最初から最後まで同じ音型と同じ情緒を保持するという原則を持つ。旋律は装飾音、すなわちトリルやモルデントなどを演奏者が加えることが前提とされ、楽譜は骨格の指示にすぎない。書法の中心は対位法で、複数の独立した旋律が同時に進行し、その最も厳格な形がフーガである。フーガでは一つの主題が各声部に順次現れ、追いかけ合いながら展開する。形式としては協奏曲、組曲、オペラ、オラトリオ、カンタータが確立した。楽器は現代のものより弦の張力が低く、音量も小さく、音程の基準も低かった。</p>
<h2>成り立ち</h2><p>始まりは1600年前後のイタリアである。フィレンツェで、貴族Giovanni de' Bardiの周囲に集まった知識人と音楽家の集団カメラータが、古代ギリシャ悲劇の再現を目指し、言葉が明瞭に伝わる単旋律と伴奏という形式を模索した。この試みからオペラが生まれ、1600年のJacopo PeriのEuridiceが現存する最古の作品となる。決定的なのはClaudio Monteverdiで、1607年のL'Orfeoで劇的な表現力を確立し、旧来の対位法的な書法と新しい表現重視の書法を二つの実践として並立させると宣言した。17世紀を通じて、この様式はイタリアからヨーロッパ全域へ広がる。ヴェネツィアではAntonio Vivaldiが、孤児の女子のための施設で教えながら、協奏曲の形式を確立し、500曲を超える作品を残した。1725年の四季は、詩に基づいて情景を描写する試みとして画期的だった。フランスではルイ14世の宮廷でJean-Baptiste Lullyが独自の様式を築いたが、指揮に用いた杖で自らの足を突き、その傷が悪化して1687年に死去している。ドイツではJohann Sebastian Bachが、ライプツィヒの教会の音楽監督として毎週のカンタータを作曲しながら、対位法の可能性を極限まで追求した。ただし彼は生前、作曲家としてよりオルガン奏者として知られ、その音楽は死後ほとんど忘れられた。同年生まれのGeorge Frideric Handelはイギリスに渡り、オペラの興行で成功と破産を繰り返した後、オラトリオへ転じ、1741年に約三週間でメサイアを書き上げた。Bachが没した1750年が、慣例的にこの時代の終わりとされる。19世紀に入り、1829年にFelix MendelssohnがBachのマタイ受難曲を蘇演したことが、その再評価の出発点となった。</p>
<h2>代表曲</h2><ul><li>Brandenburg Concerto No. 3 (J.S. Bach)</li><li>Zadok the Priest (G.F. Handel)</li><li>Messiah: Hallelujah Chorus (G.F. Handel)</li><li>Canon in D (Johann Pachelbel)</li><li>Toccata and Fugue in D minor (J.S. Bach)</li></ul>
