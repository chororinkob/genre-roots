<h1>Baroque（バロック）とは</h1>
<p>バロックは、おおよそ1600年から1750年までの西洋芸術音楽だ。 最大の構造的特徴は通奏低音である。チェンバロやオルガンなどの鍵盤楽器のほか、リュート・テオルボ等と、チェロやヴィオラ・ダ・ガンバなどの低音楽器が組になる。奏者は、</p>
<p>バロックは、おおよそ1600年から1750年までの西洋芸術音楽だ。

最大の構造的特徴は通奏低音である。チェンバロやオルガンなどの鍵盤楽器のほか、リュート・テオルボ等と、チェロやヴィオラ・ダ・ガンバなどの低音楽器が組になる。奏者は、書かれた低音の音符とその下の数字を見ながら、和音を即興的に補って伴奏する。この即興的な和声の充填が、ほぼあらゆる編成の土台をなす。

和声の面では、それまでの旋法から、長調と短調の二元的な調性へ移行した。和音がどこへ進むかが規則化され、調性による和声が形成・定式化された（機能和声の理論化は後代）。

リズムは、規則的な拍節が明確だ。一つの楽章で単一の情緒を保つ傾向が強かったとされる（例外もある）。

旋律では、トリルやモルデントなどの装飾音を、演奏者が加えることが多かった。楽譜は骨格のみを示す場合が多く、装飾を書き込む作曲家もいた。

書法の中心は対位法で、複数の独立した旋律が同時に進行する。その中でも、模倣対位法の最も発達した形がフーガである。フーガでは、一つの主題が各声部に順次現れ、追いかけ合いながら展開する。

形式としては、協奏曲、組曲、オペラ、オラトリオ、カンタータが定着した。

楽器は、現代のものより弦の張力が低かったとされるが、異論もある。音量も小さかった。音高の基準は、地域や用途で幅があり、現代より低い場合も高い場合もあった（現代の古楽団体は415Hzを採ることが多い）。</p>
<h2>成り立ち</h2><p>舞台は、1600年前後のイタリアだ。

フィレンツェでは、貴族Giovanni de' Bardiの周囲に、知識人と音楽家が集まっていた。この集団がカメラータである。彼らは古代ギリシャ悲劇の再現を目指し、言葉が明瞭に伝わる単旋律と伴奏という形式を模索した。

Bardiのカメラータは、1580年代にモノディ（独唱と簡素な和音伴奏）の実験を行った。それが1600年前後に通奏低音へ発展する。この流れの上で、Jacopo Corsiの周辺に集まったPeriと詩人Rinucciniが、Dafneを作った。1597〜98年頃の作品で、楽譜の大部分が失われ、断片のみ現存する。続いて1600年に、Euridiceを作った。現存する最古のオペラとされることが多いが、Cavalieriの『魂と肉体の劇』を挙げる説もある。

決定的な存在がClaudio Monteverdiだ。1607年のL'Orfeoで、劇的な表現力を固めた。また1605年の序文で、旧来の対位法的な書法と、新しい表現重視の書法を「二つの実践」として並立させる考えを予告した。のちに弟のGiulio Cesareが、その意味を解説している。

17世紀を通じて、この流れはイタリアからヨーロッパ全域へ広がる。

ヴェネツィアでは、Antonio Vivaldiが活躍した。孤児の女子のための施設で教えながら、協奏曲のスタイルを定着させ、500曲を超える協奏曲を書いた。『四季』（1718〜23年頃作曲、1725年出版）は、標題音楽の最も早く詳細な例の一つである。

フランスでは、ルイ14世の宮廷でJean-Baptiste Lullyが独自のスタイルを築いた。ところが、指揮に用いた杖で自らの足を突き、その傷が悪化して、1687年に死去している。

ドイツでは、Johann Sebastian Bachが、ライプツィヒの教会の音楽監督を務めた。着任後の最初の数年間は、ほぼ毎週カンタータを用意した(一部は旧作の改作)。そのかたわら、対位法の可能性を極限まで追求した。ただし彼は生前、作曲家としてよりオルガン奏者として知られていた。作曲家としての評価は死後に下がり、愛好家たちによる収集や筆写、私的な演奏を通じて受け継がれた。

同年生まれのGeorge Frideric Handelは、イギリスに渡った。しかし、オペラ会社の経営難が続く。1730年代にオラトリオへ軸足を移し始め、1737年の破産・体調不良を経て、1741年を最後にオペラから離れた。そして約24日間(1741年8月22日〜9月14日)で、メサイアを書き上げた。

Bachが没した1750年が、慣例的にこの時代の終わりとされる。

19世紀に入り、1829年にFelix MendelssohnがBachのマタイ受難曲を蘇演した。これが、それ以前から続いていた再評価の動きを広げる、決定的な画期となった。</p>
