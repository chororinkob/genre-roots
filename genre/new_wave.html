<h1>New Wave（ニューウェーブ）とは</h1>
<p>パンク以後の1970年代末から1980年代半ばに、覚えやすい旋律と新しい音色を積極的に取り込んだロックの総称。パンクの簡潔さと速度は引き継ぎつつ、歪んだギターの壁を薄くし、代わりにRoland Juno-60、Sequential</p>
<p>パンク以後の1970年代末から1980年代半ばに、覚えやすい旋律と新しい音色を積極的に取り込んだロックの総称。パンクの簡潔さと速度は引き継ぎつつ、歪んだギターの壁を薄くし、代わりにRoland Juno-60、Sequential Circuits Prophet-5、Yamaha DX7といったシンセサイザー、リズムボックス、跳ねるベースライン、歪ませないクリーントーンで鋭く刻むギターを前面に出す。リズムはレゲエやスカ、ディスコの裏拍を借りたものが多く、テンポは120〜160BPM。和声は短調と長調を行き来し、パンクより複雑なコードと明確なサビを持つ。歌唱は感情を抑えた平坦な発声、わざと神経質に震わせる声、演劇的な誇張などが好まれる。歌詞は都市生活の疎外感、消費社会への皮肉、SF的な未来像、そして恋愛を、皮肉な距離を置いて描く。角ばったスーツや原色のメイク、幾何学的なジャケット意匠を含めた総合的な様式であり、MTVの開局が普及を強く後押しした。同時期のポストパンクと重なるが、ポストパンクが暗く実験的な方向へ向かったのに対し、ニューウェーヴはヒットチャートを狙う明るさと軽さを持つ点で区別される。</p>
<h2>成り立ち</h2><p>「ニューウェーヴ」という呼称は、1976年から1977年頃、パンクという語が暴力的すぎてラジオでかけてもらえないという商業上の事情から使われ始めた。Sire Recordsの経営者Seymour Steinが、自社のRamonesやTalking Headsを売り込む際にフランス映画の潮流ヌーヴェル・ヴァーグから借りて広めたと語られる。実態としては、ニューヨークのCBGB周辺にいたBlondie、Talking Heads、オハイオ州アクロンから出てきたDevoのように、パンクと同じ場所にいながら音楽的な語彙がより広いバンド群を指した。イギリスでは1977年以降、Elvis Costello、The Police、XTC、Squeeze、Ian Duryといった、演奏力と作曲の技巧を持つ書き手が主役になる。並行してコヴェントリーのレーベル2 Toneが人種混成のバンドでスカを復活させ、The SpecialsやMadnessが失業と人種対立の時代を歌った。決定的な転機は1979年、Gary Numanが率いたTubeway Armyの「Are Friends Electric?」が全英1位となり、シンセサイザーが主役でも売れると証明したことである。同じ頃ロンドンのクラブBlitzに集まったSteve Strange周辺の若者たちが、着飾ることを主張とするニュー・ロマンティックを起こし、Duran Duran、Spandau Ballet、Visageが登場した。1981年8月1日にアメリカで開局したMTVは、最初の放送でThe Bugglesの「Video Killed the Radio Star」を流した。当時のアメリカのバンドは映像作品を用意していなかったのに対し、イギリス勢はすでに映像で見せる習慣を持っており、その差から1983年に「第二次ブリティッシュ・インヴェイジョン」と呼ばれる現象が起きる。日本ではYellow Magic Orchestraが同じ潮流と共振し、Japanのような英国のバンドが東洋的な意匠を取り入れた。1980年代半ばには様式が定型化して勢いを失い、より硬派な層はカレッジ・ラジオを通じてオルタナティヴ・ロックへ、大衆的な層はシンセポップやダンス・ポップへ吸収されていった。2000年代初頭にはThe Strokes、Interpol、Franz Ferdinandらによる再評価が起き、当時の音色と衣装が再び広く聴かれるようになっている。</p>
<h2>代表曲</h2><ul><li>Once in a Lifetime (Talking Heads)</li><li>Heart of Glass (Blondie)</li><li>Our Lips Are Sealed (The Go-Go's)</li><li>Hungry Like the Wolf (Duran Duran)</li><li>Whip It (Devo)</li></ul>
