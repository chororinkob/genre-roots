<h1>New Wave（ニューウェーブ）とは</h1>
<p>パンク以後の1970年代末から1980年代半ばに、覚えやすい旋律と新しい音色を積極的に取り込んだロックの総称。パンクの簡潔さと速度は引き継ぎつつ、歪んだギターの厚い音の壁を薄くし、歯切れのよいリズムギター、角ばったリフ、速いテンポ</p>
<p>パンク以後の1970年代末から1980年代半ばに、覚えやすい旋律と新しい音色を積極的に取り込んだロックの総称。パンクの簡潔さと速度は引き継ぎつつ、歪んだギターの厚い音の壁を薄くし、歯切れのよいリズムギター、角ばったリフ、速いテンポ、跳ねるベースライン、そしてRoland Juno-60、Sequential Circuits Prophet-5、Yamaha DX7といったシンセサイザーやリズムボックス（リズムを自動で鳴らす機械）が使われることが多かった。リズムはレゲエやスカ、ディスコの裏拍（拍と拍の間）を借りたものが多く、速めのテンポの曲が多い。和声（コードの響き）は短調と長調を行き来し、パンクより複雑なコードと明確なサビを持つ。歌唱は感情を抑えた平坦な発声、わざと神経質に震わせる声、演劇的な誇張などが好まれる。歌詞は都市生活の中での孤立感（疎外感）、消費社会への皮肉、SF的な未来像、そして恋愛を、皮肉な距離を置いて描く。角ばったスーツや原色のメイク、幾何学的なジャケットのデザインを含めた総合的な様式であり、MTVの開局が普及を強く後押しした。同時期のポストパンクと重なるが、ポストパンクが暗く実験的な方向へ向かったのに対し、ニューウェーヴはヒットチャートを狙う明るさと軽さを持つ点で区別される。</p>
<h2>成り立ち</h2><p>「ニューウェーヴ」という呼称は、1970年代前半から批評家に使われていた。1977年10月、Sire Recordsの経営者Seymour Steinが、パンクという語では売り上げが落ちると考え、自社のバンドのために「Don't Call It Punk」というキャンペーンを行い、パンクの代わりの言葉として広まった。この呼び名は、フランス映画の潮流ヌーヴェル・ヴァーグ（新しい波）を連想させる語でもあった。Steinは、自社のRamonesやTalking Headsを売り込む際にこの言葉を使った。実態としては、ニューヨークのCBGB周辺にいたBlondie、Talking Heads、オハイオ州アクロンから出てきたDevoのように、パンクと同じ場所にいながら音楽的な語彙がより広いバンド群を指した。イギリスでは1977年以降、Elvis Costello、The Police、XTC、Squeeze、Ian Duryといった、演奏力と作曲の技巧を持つ書き手が主役になる。並行してコヴェントリーのレーベル2 Toneが人種混成のバンドでスカを復活させ、The Specialsが失業や人種問題の時代を歌い、Madnessは2 Toneから最初のシングルを出したあと、ユーモアのあるポップな路線で人気を得た。象徴的な出来事の一つが1979年で、Gary Numanが率いたTubeway Armyの「Are 'Friends' Electric?」が全英1位となり、シンセサイザー中心の曲がチャートの頂点に立った。同じ頃ロンドンのクラブBlitzに集まったSteve Strange周辺の若者たちが、着飾ることを主張とするニュー・ロマンティックを起こし、Spandau BalletやVisageが登場し、同じ頃バーミンガムのクラブRum RunnerからはDuran Duranが出てきた。1981年8月1日にアメリカで開局したMTVは、最初の放送でThe Bugglesの「Video Killed the Radio Star」を流した。開局当初のMTVは流せるビデオが少なく、プロモーション映像を制作済みだった英国のニューウェーヴ勢のビデオを多く流した。その流れの中で、1982年夏に始まり1983年にピークを迎えた「第二次ブリティッシュ・インヴェイジョン」と呼ばれる現象が起きる。日本ではYellow Magic Orchestraが同じ潮流と響き合い、Japanのような英国のバンドが東洋的なデザインを取り入れた。アメリカでは1980年代半ばまで続き、1980年代後半にグラムメタル、ダンス音楽、オルタナティヴ・ロックに押されて衰退した。インディーの精神は、カレッジ・ラジオ（大学のラジオ局）を通じたオルタナティヴ・ロックの発展に重要だった。2000年代初頭には、The Strokes、Interpol、Franz Ferdinandらに代表されるポストパンク／ガレージロック・リバイバルの流れの中で、1980年前後の音色や意匠が再び注目された。</p>
