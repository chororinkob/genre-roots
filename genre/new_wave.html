<h1>New Wave（ニューウェーブ）とは</h1>
<p>ニューウェーヴは、パンク以後の1970年代末から1980年代半ばに、覚えやすい旋律と新しい音色を積極的に取り込んだロックの総称だ。 パンクの簡潔さと速度は引き継いでいる。そのうえで、チョッピーなリズムギター、角ばったリフ、速いテン</p>
<p>ニューウェーヴは、パンク以後の1970年代末から1980年代半ばに、覚えやすい旋律と新しい音色を積極的に取り込んだロックの総称だ。

パンクの簡潔さと速度は引き継いでいる。そのうえで、チョッピーなリズムギター、角ばったリフ、速いテンポ、キーボードやシンセサイザーを用いることが多かった。

リズムは、レゲエやスカ、ディスコの裏拍（拍と拍の間）を借りる傾向があった。速めのテンポの曲が多いのも特徴だ。和声（コードの響き）は、短調と長調を行き来する傾向があった。パンクより複雑なコードと、明確なサビを持つ。

歌い方は、感情を抑えた平坦な発声、わざと神経質に震わせる声、演劇的な誇張などが好まれる傾向があった。

歌詞は、都市生活の中での孤立感（疎外感）、消費社会への皮肉、SF的な未来像、そして恋愛を、皮肉な距離を置いて描く傾向があった。

見た目も含めた総合的なスタイルでもあった。角ばったスーツ、原色のメイク、幾何学的なジャケットのデザインがその例で、MTVの開局が普及を強く後押しした。同時期のポストパンクとは重なるが、ポストパンクが暗く実験的な方向へ向かったのに対し、ニューウェーヴはヒットチャートを狙う明るさと軽さを持つ点で区別される。</p>
<h2>成り立ち</h2><p>「ニューウェーヴ」という呼称は、1970年代前半から批評家に使われていた。

1977年10月、Sire Recordsの経営者Seymour Steinは、パンクという語では売り上げが落ちると考えた。そこで自社のバンドのために「Don't Call It Punk」というキャンペーンを行い、ニューウェーヴはパンクの代わりの言葉として広まった。この呼び名は、フランスのヌーヴェル・ヴァーグ（新しい波）を連想させる語でもあった。Steinは、自社のRamonesやTalking Headsを売り込む際にこの言葉を使った。実態としては、ニューヨークのCBGB周辺にいたBlondie、Talking Heads、オハイオ州アクロンから出てきたDevoのように、パンクと同じ場所にいながら、音楽的な語彙がより広いバンド群を指した。

イギリスでは、1977年以降、Elvis Costello、The Police、XTC、Squeeze、Ian Duryといった、演奏力と作曲の技巧を持つ書き手が主役になる。並行して、コヴェントリーのレーベル2 Toneが、人種混成のバンドでスカを復活させた。The Specialsは失業・不況や人種問題を扱い、Madnessは2 Toneから最初のシングルを出した後、ユーモアのあるポップな路線で人気を得た。

1979年、Gary Numanが率いたTubeway Armyの「Are 'Friends' Electric?」が全英1位となった。これは、シンセ中心の曲がチャート頂点に立つことを示した、代表的な出来事の1つである。

同じ頃、ロンドンのクラブBlitzに、Steve Strange周辺の若者たちが集まった。彼らは、着飾ることを主張とするニュー・ロマンティックを起こし、Spandau BalletやVisageが登場する。また同じ頃、バーミンガムのクラブRum Runnerからは、Duran Duranが出てきた。

1981年8月1日、アメリカでMTVが開局した。最初の放送で流れたのは、The Bugglesの「Video Killed the Radio Star」である。開局当初のMTVは、流せるビデオが少なかった。そこで、プロモーション映像を制作済みだった英国のニューウェーヴ勢のビデオを多く流した。この流れの中で、1982年夏に始まり1983年にピークを迎えた「第二次ブリティッシュ・インヴェイジョン」と呼ばれる現象が起きる。

日本では、Yellow Magic Orchestraが同じ流れと響き合った。Japanのような英国のバンドは、東洋的なデザインを取り入れた。

しかし、米国では1980年代半ばまで続いたものの、1980年代後半にはグラムメタル、ダンス音楽、オルタナティヴ・ロックに押されて衰退した。インディー精神は、カレッジ・ロックやオルタナティヴ・ロックの発展に重要だった。

2000年代初頭には、The Strokes、Interpol、Franz Ferdinandらに代表されるポストパンク／ガレージロック・リバイバルの流れの中で、1980年前後の音色や意匠が再び注目された。</p>
