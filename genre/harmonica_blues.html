<h1>Harmonica Blues（ハーモニカブルース）とは</h1>
<p>手のひらに収まる小さな金属の楽器一つで、旋律も和音もリズムも同時に受け持つ音楽のスタイルだ。 使われるのは、10穴のダイアトニック・ハーモニカ（ドレミの7音だけが並んだ基本型）だ。本来は、一つの長音階しか出せない作りになっている。</p>
<p>手のひらに収まる小さな金属の楽器一つで、旋律も和音もリズムも同時に受け持つ音楽のスタイルだ。

使われるのは、10穴のダイアトニック・ハーモニカ（ドレミの7音だけが並んだ基本型）だ。本来は、一つの長音階しか出せない作りになっている。ここで決め手になるのが、クロスハープと呼ばれる持ち替えだ。たとえば、ハ長調用の楽器をト長調の曲で使う。すると、吹く音より吸う音が主役になる。さらに、吸いながら音程を下げるベンドという技法で、楽器に刻まれていないはずのブルーノートが出せるようになる。設計から外れた使い方をすることで、表現力を得る。この逆転が、このスタイルの核心にある。

音色は両手で操る。楽器を包む手のひらを開け閉めして響きを変え、ワウのような揺れや、遠ざかる汽笛のような効果を作る。舌で複数の穴をふさぐタングブロック奏法を使えば、旋律の下に和音の塊を敷いたり、拍ごとに低音を打ち込んだりできる。

都市のスタイルでは、さらに小型マイクごと楽器を握り込み、真空管アンプに大きすぎる音を入れて歪ませる。こうなると、音響機器までが楽器の一部になる。手の隙間の開き具合が、そのままハウリングを操る手段になる。

奏者は歌手を兼ねることが多い。歌のフレーズと楽器のフレーズが、問いと答えのように交互に現れる。</p>
<h2>成り立ち</h2><p>ハーモニカそのものは、1820年代前半に中欧のドイツ語圏で生まれた。発明者は、1821年頃にベルリンにいたBuschmannとされることが多い。ただ、同じ時期にウィーンにも製作者がおり、諸説ある。その後、1857年創業のホーナー社が大量生産で普及を引っ張り、世界中に広まった。

安く、頑丈で、服の隙間に入るほど小さい。この性質が、財産をほとんど持たずに移動する南部の労働者にとって決め手になった。20世紀初頭には黒人の間で広く演奏され、汽車の音や動物の鳴き声をまねる芸として親しまれた。

ナッシュビルのラジオ局WSMには、デフォード・ベイリーが出演するようになる。記録に残る最初の出演は1926年だ。1927年12月10日の放送で、番組名「グランド・オール・オプリ」が生まれたとされる。ベイリーはこの番組で最初の黒人スターになった。しかし人種隔離の時代で、宿泊や食事にも苦労した。1941年には、WSMを解雇された。アメリカ作曲家作詞家出版者協会と放送業界の対立で、同協会が管理する曲を放送できなくなったことが主な原因とされる。ただし、ほかにも複数の要因が挙げられている。

一方、ジョン・リー・ウィリアムソンは、ハーモニカを主役の楽器として都市のブルースの場に広めた先駆者だ。1937年には『グッド・モーニング、スクール・ガール』を録音した。彼は1948年、強盗に襲われて死んだ。

アーカンソー州ヘレナのラジオ局では、ライス・ミラーが『キング・ビスケット・タイム』に出演していた。彼も1941年から、サニー・ボーイ・ウィリアムソンの名で宣伝された。初代と同じ名前だったため混同が生まれ、後に、主に1960年代のヨーロッパ公演などで「II」を付けて区別されるようになった。

決定的な変化は、1950年代のシカゴで起きる。リトル・ウォルターが手持ちのマイクとアンプで音を歪ませて演奏し、1952年の器楽曲『ジューク』を全米リズム・アンド・ブルース・チャートの一位に送り込んだ。楽器の生の音ではなく、増幅されて崩れた音そのものを表現の対象にしたのだ。エレキギターの歪みとほぼ同時期に、ハーモニカで歪みを表現の手段にしたとされる。

ビッグ・ウォルター・ホートンは同時代の名手で、リトル・ウォルターらに教えた先輩の奏者だ。ジェイムズ・コットンやジュニア・ウェルズが、この演奏法を受け継いだ。1960年代にはポール・バターフィールドやチャーリー・マッセルホワイトら白人の奏者が加わり、この音楽はロックの聴衆にまで届いた。</p>
