<h1>Harmonica Blues（ハーモニカブルース）とは</h1>
<p>手のひらに収まる小さな金属の楽器一つで、旋律も和音もリズムも同時に受け持つ様式である。使われるのは10穴のダイアトニック・ハーモニカで、本来は一つの長音階しか出せない構造をしている。ここで決定的なのがクロスハープと呼ばれる持ち替え</p>
<p>手のひらに収まる小さな金属の楽器一つで、旋律も和音もリズムも同時に受け持つ様式である。使われるのは10穴のダイアトニック・ハーモニカで、本来は一つの長音階しか出せない構造をしている。ここで決定的なのがクロスハープと呼ばれる持ち替えで、たとえばハ長調用の楽器をト長調の曲で使う。すると吹く音より吸う音が主役になり、吸いながら音程を下げるベンドという技法で、楽器に刻まれていないはずのブルーノートが出せるようになる。この、設計から外れた使い方をすることで表現力を得るという逆転が、この様式の核心にある。音色の操作は両手で行い、楽器を包む手のひらを開閉して共鳴を変え、ワウのような揺れや、遠ざかる汽笛のような効果を作る。舌で複数の穴をふさぐタングブロック奏法を使えば、旋律の下に和音の塊を敷いたり、拍ごとに低音を打ち込んだりできる。都市の様式ではさらに小型マイクごと楽器を握り込み、真空管アンプに過大入力して歪ませる。この場合は音響機器までが楽器の一部となり、手の隙間の開き具合がハウリングの制御そのものになる。奏者は歌手を兼ねることが多く、歌のフレーズと楽器のフレーズが問いと答えのように交互に現れる。</p>
<h2>成り立ち</h2><p>ハーモニカ自体は1820年代のドイツで生まれ、1857年創業のホーナー社が大量生産を始めたことで世界中に広まった。安価で頑丈、そして衣服の隙間に入るほど小さいという性質が、財産をほとんど持たずに移動する南部の労働者にとって決定的だった。二十世紀初頭には黒人の間で広く演奏され、汽車の音や動物の鳴き声を模す芸として親しまれた。1927年にはデフォード・ベイリーがナッシュビルのラジオ番組グランド・オール・オプリに出演し、この番組で最初の黒人スターとなる。人種隔離の時代にあって、彼は宿泊も食事も他の出演者と別に扱われ、1941年には著作権を巡る事情で一方的に降板させられた。演奏の型を作ったのはジョン・リー・ウィリアムソンで、1937年の『グッド・モーニング、スクール・ガール』で、伴奏楽器だったハーモニカに歌と対等の役割を与えた。彼が1948年に強盗に襲われて死んだあと、アーカンソー州ヘレナのラジオ局で『キング・ビスケット・タイム』に出演していたライス・ミラーが、同じサニー・ボーイ・ウィリアムソンの名を名乗って活動を続け、二代目として知られるようになった。決定的な革新は1950年代のシカゴで起きる。リトル・ウォルターが手持ちのマイクとアンプを歪ませて演奏し、1952年の器楽曲『ジューク』を全米リズム・アンド・ブルース・チャートの一位に送り込んだ。楽器の生の音ではなく、増幅され破綻した音そのものを表現の対象にした点で、後のエレキギターの歪みと同じ発想を先取りしている。ビッグ・ウォルター・ホートン、ジェイムズ・コットン、ジュニア・ウェルズがこの語法を継ぎ、1960年代にはポール・バターフィールドやチャーリー・マッセルホワイトら白人の奏者が加わって、ロックの聴衆にまで届いた。</p>
