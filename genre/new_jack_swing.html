<h1>New Jack Swing（ニュージャックスウィング）とは</h1>
<p>1980年代末に確立した、ヒップホップのリズムとR&amp;Bの歌唱を融合させた様式。核となるのはドラムの打ち込みで、Roland TR-808やE-mu SP-1200、Akai MPCといった機材を使い、16分音符を均等に並べず跳ねさ</p>
<p>1980年代末に確立した、ヒップホップのリズムとR&amp;Bの歌唱を融合させた様式。核となるのはドラムの打ち込みで、Roland TR-808やE-mu SP-1200、Akai MPCといった機材を使い、16分音符を均等に並べず跳ねさせるスウィングをかける。この揺れが名称の由来である。キックは重く、スネアは強く圧縮され、そこにハンドクラップとタンバリンが重なる。テンポは毎分105から120拍程度で、明確に踊れる速さに置かれる。ベースはシンセの太い低音で、和音は短調のマイナーセブンスを多用したファンク由来の進行が中心になる。上物にはシンセのブラス、ゴスペル調のオルガン、そしてサンプリングされたホーンの刺しが並ぶ。歌唱はゴスペルで鍛えられた技巧的なもので、細かい装飾音を連ねるメリスマと、曲の終盤での即興的な歌い上げが定型になっている。ここにラップの客演が加わる構成も多い。歌詞は恋愛が中心だが、社会問題を扱う曲も少なくない。視覚表現も不可分で、揃った衣装と精密に振り付けられた集団の踊りが必須の要素であり、これが後のボーイズグループの原型を作った。</p>
<h2>成り立ち</h2><p>様式を作ったのはTeddy Rileyである。ニューヨーク・ハーレムの公営団地に育った彼は、五歳で教会のオルガンを弾き、10代でスタジオに出入りしていた。1987年、Keith Sweatの『I Want Her』を制作し、そこでヒップホップの重いドラムとR&amp;Bの歌唱を組み合わせる手法を確立した。名称を与えたのは音楽記者のBarry Michael Cooperで、彼はヴィレッジ・ヴォイス誌の記事でこの音をニュー・ジャック・スウィングと呼んだ。同じ言葉は当時の街の状況を指してもいた。クラック・コカインの流行によって、若い売人が急速に富を得る現象が起きており、そうした新参者を指す俗語がニュー・ジャックだったのである。Rileyは自身のグループGuyを結成し、1988年のデビュー作でこの様式を提示した。決定的だったのは1988年から89年で、Bobby Brownの『Don't Be Cruel』が全米で700万枚以上を売り、Janet Jacksonの『Rhythm Nation 1814』(1989)は、Jimmy Jam and Terry Lewisの制作で社会的な主題とこの音を結びつけた。1991年、Michael Jacksonが『Dangerous』の制作にRileyを起用し、この様式が世界最大の舞台に立った。Boyz II Men、Bell Biv DeVoe、Jodeci、TLC、SWVが続き、日本にも大きな影響を与えている。しかし1993年頃から急速に退潮した。理由のひとつは、より生々しく暗いヒップホップの台頭であり、もうひとつは、Jodeciらが打ち出した遅く官能的なR&amp;Bへの移行である。Teddy Rileyはその後Blackstreetを結成し、1996年の『No Diggity』で再び全米一位を獲得した。この様式の遺産は、ボーイズグループの構造とR&amp;Bの制作手法として、現在も生き続けている。</p>
<h2>代表曲</h2><ul><li>My Prerogative（Bobby Brown）</li><li>Poison（Bell Biv DeVoe）</li><li>I Want Her（Keith Sweat）</li><li>Remember the Time（Michael Jackson）</li><li>Right Here/Human Nature（SWV）</li></ul>
