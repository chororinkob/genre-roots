<h1>New Jack Swing（ニュージャックスウィング）とは</h1>
<p>1980年代後半に確立した（起点を1985年とする見方もある）、ヒップホップのリズムとR&amp;Bの歌唱を融合させた様式。核となるのはドラムの打ち込みで、Roland TR-808やE-mu SP-1200、Akai製サンプラー（録音を</p>
<p>1980年代後半に確立した（起点を1985年とする見方もある）、ヒップホップのリズムとR&amp;Bの歌唱を融合させた様式。核となるのはドラムの打ち込みで、Roland TR-808やE-mu SP-1200、Akai製サンプラー（録音を素材として取り込む機械）といった機材を使い、16分音符を均等に並べず跳ねさせるスウィングをかける。名称は、ジャーナリストBarry Michael Cooperが1987年10月18日の記事で付けたもので、「new jack」は新参者を指す俗語、「swing」は禁酒法時代のスピークイージー（非合法酒場）のジャズとの類比である。キックは重く、スネアは強く圧縮され、そこにハンドクラップ（手拍子の音）とタンバリンが重なる。テンポはおおむね毎分100前後から110台で（資料により幅がある）、明確に踊れる速さに置かれる。ベースはシンセの太い低音で、和音は短調のマイナーセブンスを使ったファンク由来の進行が見られることが多い。上物（メロディーなど上に重ねる音）にはシンセのブラス、ゴスペル調のオルガン、そしてシンセやサンプルによるホーンの刺しが並ぶことがある。歌唱はゴスペルで鍛えられた技巧的なもので、細かい装飾音を連ねるメリスマと、曲の終盤での即興的な歌い上げが定型になっている。ここにラップの客演（ゲスト参加）が加わる構成も多い。歌詞は恋愛が中心だが、社会問題を扱う曲も少なくない。視覚表現も切り離せないほど重要で、踊りと結びついている。</p>
<h2>成り立ち</h2><p>様式はTeddy Rileyを中心に形成された。ニューヨーク・ハーレムの公営団地に育った彼は、5歳から教会で楽器を弾き、9歳で教会のオルガニストを務め、10代でスタジオに出入りしていた。1987年、Keith Sweatの『I Want Her』を制作し（全米5位。最初の公式なニュー・ジャック・スウィングのヒットとみなされるが、Teddy RileyらはJunior Giscombeの1985年の『Oh Louise』を出発点としている）、そこでヒップホップの重いドラムとR&amp;Bの歌唱を組み合わせる手法を確立した。名称を与えたのは音楽記者のBarry Michael Cooperで、彼はヴィレッジ・ヴォイス誌の記事でこの音をニュー・ジャック・スウィングと呼んだ。同じ言葉は当時の街の状況を指してもいた。クラック・コカインの流行によって、若い売人が急速に富を得る現象が起きており、そうした新参者を指す俗語がニュー・ジャックだったのである。Rileyは自身のグループGuyを結成し、1988年のデビュー作でこの様式を提示した。決定的だったのは1988年から89年で、Bobby Brownの『Don't Be Cruel』が全米で700万枚以上を売り、Janet Jacksonの『Rhythm Nation 1814』(1989)は、Jimmy Jam and Terry Lewisの制作で社会的な主題とこの音を結びつけた。1991年、Michael Jacksonが『Dangerous』の制作にRileyを起用し、この様式が世界最大の舞台に立った。Boyz II Men、Bell Biv DeVoe、Jodeci、TLC、SWVが続き、日本にも大きな影響を与えている。しかし1990年代半ば（Montell Jordanの『This Is How We Do It』が出た1995年ごろ）から退潮した。背景には、ヒップホップの浸透と、ポップ寄りのアプローチが人工的に見られたことがある。Teddy Rileyは1991年にBlackstreetを結成し、1996年の『No Diggity』で再び全米一位を獲得した。この様式の遺産は、ボーイズグループの構造とR&amp;Bの制作手法として、現在も生き続けている。</p>
