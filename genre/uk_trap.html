<h1>UK Trapとは</h1>
<p>アメリカ南部で生まれたトラップの骨格を、イギリスの音響感覚と言葉で作り直したもの。低音は808のベースが担うが、アメリカ流の伸びやかな長い音ではなく、ダブステップやグライムを経由した歪みと圧縮が加わり、短く切って刻む使い方が多い。</p>
<p>アメリカ南部で生まれたトラップの骨格を、イギリスの音響感覚と言葉で作り直したもの。低音は808のベースが担うが、アメリカ流の伸びやかな長い音ではなく、ダブステップやグライムを経由した歪みと圧縮が加わり、短く切って刻む使い方が多い。ハイハットは三連符や32分音符で転がるが、音量を抑えて背景に沈める設計が好まれる。テンポは記譜上は毎分130から150拍前後で、拍を半分に感じて進む。上物は暗く簡素で、短調の短い音型をピアノ、シンセのベル、加工した弦、あるいは中東やカリブ由来の旋律断片が数音だけ鳴らす。空間の作り方に特徴があり、残響とディレイを深くかけて曇らせ、隙間を大きく残す。ラップは最大の違いで、ロンドンやバーミンガム、マンチェスターの多民族地区の訛りが強く出て、ジャマイカ英語の語彙とロードと呼ばれる街の隠語が混ざる。歌唱寄りの節回しとピッチ補正も多用される。歌詞は金、地元、警察との緊張、移民としての来歴、成り上がりの過程が中心である。同じイギリス発でも、グライムが毎分140拍の速い言葉数で押すのに対し、こちらは間を空けて重く沈む点が対照的である。</p>
<h2>成り立ち</h2><p>土壌は2010年前後のロンドンにあった。当時イギリスでは、グライムが商業的に行き詰まり、多くのMCがポップスやEDMに転向していた。同時にアメリカのアトランタで生まれたトラップが、YouTubeやSoundCloudを通じて英国の若者に直接届くようになっていた。この二つが交差した場所から生まれたのが、当地のトラップである。同じ流れの先駆者がロンドン南東部出身のGiggsで、2008年の『Walk in da Park』などで、極端に低く遅い語りと暗いビートによる独自の位置を築いた。本人は、自分の音楽はグライムではなくUKラップだと述べている。彼は服役歴があり、ロンドン警視庁が公演を繰り返し中止に追い込んだと報じられ、音楽活動が妨げられた時期が長く続いたとされる。ロード・ラップはこれより早く、2000年代半ばのロンドン南部で成立し、2007年頃のGiggsの台頭で広く知られた。2010年代初頭には、UKドリル(150、67、Section Boyzなど)が現れた。Krept and Konan、Nines、67、Section Boyz、Fredoといった作り手が、街の現実を淡々と語る作品を発表した。制作面ではSteel Banglez、Nyge、Zdotが音の共通語を作り、とりわけSteel Banglezはパンジャーブ系の制作者で、MISTやNot3sらのイギリスのラップを手がけた。2016年、Skeptaがマーキュリー賞を取った同じ年にDrakeが英国の作り手を大々的に支持し、国際的な注目が集まった。2010年代半ばには、J HusやTimboらが先駆者とされるアフロスウィング(アフロビーツを混ぜた様式。名称はKojo Fundsが考案したとされる)が成立し、2017〜18年にはその商業的な拡大期を迎え、Daveが2019年の『Psychodrama』でマーキュリー賞を受賞して、この語法が芸術的にも認められた。一方で警察との緊張は続いており、ドリルと同様に歌詞や映像を理由とした裁判所命令が出され、表現の自由をめぐる議論が絶えない。2020年代には、UKドリルのメロディックな作風とされるCentral Ceeが世界的な成功を収め、英国発の音が輸出品となった。</p>
