<h1>UK Trapとは</h1>
<p>アメリカ南部で生まれたトラップの土台を、イギリスの音の感覚と言葉づかいで作り直した音楽だ。 低音は808のベースが受け持つ。ただし、アメリカ流のように伸びやかに長く鳴らすのではない。短く切って刻む使い方が多い。 上に乗る音は暗く、</p>
<p>アメリカ南部で生まれたトラップの土台を、イギリスの音の感覚と言葉づかいで作り直した音楽だ。

低音は808のベースが受け持つ。ただし、アメリカ流のように伸びやかに長く鳴らすのではない。短く切って刻む使い方が多い。

上に乗る音は暗く、簡素だ。短調の短い音の並びを、ピアノ、シンセのベル、加工した弦が、数音だけ鳴らす。音の空間の作り方にも特徴がある。残響とディレイを深くかけて音を曇らせ、すき間を大きく残す。

ハイハットは三連符や32分音符で転がる。テンポはトラップ全般の範囲に収まり、楽譜の上では毎分130から150拍前後で、拍を半分に感じながら進む。

最大の違いはラップにある。ロンドンやバーミンガム、マンチェスターの多民族地区の訛りが強く出る。歌に近い節回しと、ピッチ補正も多く使われる。

歌詞は、金、地元、警察との緊張、成り上がりまでの道のりが中心である。

同じイギリス生まれでも、グライムは毎分140拍の速さで言葉を詰め込んで押していく。それに対してこちらは、間を空けて重く沈む。この点が対照的である。</p>
<h2>成り立ち</h2><p>下地ができたのは、2010年前後のロンドンである。

イギリスでは2000年代後半、グライムが商業的に行き詰まった。Tinchy Stryder、Chip、Wileyらは、商業的でエレクトロハウス寄りのラップへ移った。

イギリスのトラップの起源には諸説あるが、ロード・ラップやグライムの後の流れの中で、トラップの影響を受けた作り手が現れた。

ロード・ラップの代表格で、後のUKトラップに影響を与えたのが、ロンドン南東部出身のGiggsだ。彼は2008年の『Walk in da Park』などで、極端に低く遅い語りと暗いビートによって、独自の立場を築いた。本人は、自分の音楽はグライムではなくUKラップだと述べている。一方で彼には服役歴があり、ロンドン警視庁が公演を繰り返し中止に追い込んだと報じられた。音楽活動が妨げられた時期も、長く続いたとされる。ロード・ラップ自体はこれより早く、2000年代半ばのロンドン南部で生まれ、2007年頃にGiggsが注目を集めたことで広く知られた。

2012〜13年ごろには、UKドリルが現れた。ブリクストンの150(現GBG)などが先駆けとされ、67やHarlem Spartansらが続いた。Section Boyzはトラップを中心にしつつ、ドリルの要素も取り入れた。2010年代前半にはKrept and KonanやSection Boyzなどが、2010年代半ば以降にはFredo(2016年〜)やNinesが、街の現実を淡々と語る作品を発表した。

制作の面では、Steel Banglez、Nyge、そしてグライム系の制作者として知られるZdotらが、この時期の英国ラップを手がけた。Steel Banglezはパンジャーブ系の制作者で、MISTの2016年の作品『M I S T to the T』を制作し、Not3sらとも共演した。

2016年2月、DrakeがBoy Better Knowとの契約を発表し、Section Boyzのライブにも出演した。同じ年の9月にはSkeptaがマーキュリー賞を受賞し、国際的な注目が集まった。

2010年代半ばには、アフロスウィング(ダンスホール、アフロビーツ、トラップなどを融合した英国のジャンル。名称はKojo Fundsが考案したとされる)が生まれた。その先駆者とされるのは、J HusやTimboらだ。2017〜18年には、商業的に大きく広がる時期を迎えた。そして2019年、Daveが『Psychodrama』でマーキュリー賞を受賞し、英国ラップ全体が芸術的に評価された。

一方で、警察との緊張は続いている。ドリルでは歌詞や映像を理由に裁判所命令が出され、表現の自由をめぐる議論が絶えない。

2020年代には、UKドリルのメロディックな作風とされるCentral Ceeが世界的な成功を収め、UKラップ全体の国際的な評価を押し上げた。</p>
