<h1>Trance（トランス）とは</h1>
<p>トランスは、反復と上昇によって聴き手を恍惚状態へ導くことを目的とした電子ダンス音楽だ。名称は、1990年代に音楽が模倣しようとしたトランス状態に由来するとされる（のちに焦点は変化）。 中心になるのは、16分音符で刻まれるアルペジオ</p>
<p>トランスは、反復と上昇によって聴き手を恍惚状態へ導くことを目的とした電子ダンス音楽だ。名称は、1990年代に音楽が模倣しようとしたトランス状態に由来するとされる（のちに焦点は変化）。

中心になるのは、16分音符で刻まれるアルペジオ（和音を1音ずつ順に弾く奏法）だ。シンセのシーケンスが延々と回り続け、その間にフィルター（音色を変える装置）が少しずつ開いていく。和声は短調がほぼ普遍的で、切迫感のある進行が好まれる。旋律は明確で、歌えるほど分かりやすいものが多い。テクノと比べて旋律性が強い傾向があり、ハウスと比べて速く劇的である点で区別される。

テンポは典型的には130〜140台で、一般には120〜150BPMの幅がある。キックは四つ打ち。その裏に短い8分音符のベースを置くのが典型的なパターンだ。トランスではキックを抑えて、ベースの余地を作ることも多い。

ヴォーカルが入る場合は、女声（メゾソプラノ〜ソプラノ）が典型的だ。ただし、男性歌手も起用される。

曲の組み立ては、モダンなトランスでは明確に定型化されている。序盤は打楽器とベースだけの導入で、そこにアルペジオが加わる。中盤で全ての打楽器が抜け、ブレイクダウン（静かな見せ場）へ入る。ブレイクダウンでは、長いパッド（持続する背景の音）と壮大な旋律が現れ、1〜3分程度に及ぶことがある。その後、白色雑音（ザーッという雑音）のライザー（だんだん高まる効果音）とスネアの連打によって、緊張が最大になる。キックが戻る瞬間に、最も感情的な頂点が置かれる。この「ブレイクダウンから復帰へ」の設計が、ジャンルの情緒的な中核をなす。</p>
<h2>成り立ち</h2><p>1980年代末から1990年代初頭にかけて、ドイツのフランクフルトを中心に、トランスは成立したとされる。フランクフルトのテクノとEBMのシーンから生まれたとされる。1970年代のベルリン・スクールの電子音楽(Tangerine Dream、Klaus Schulze)の反復するシーケンスと、アシッドハウスは、影響源とされることがある。Dance 2 Trance の1990年「We Came in Peace」は、初期の代表的トラックの一つである。

同じ時期のフランクフルトでは、Sven Väthがクラブ Omenを1988年（資料により1989年）に開いた。続いて、1990〜91年（資料により異なる）にレーベルEye Qを、1992年にそのサブレーベルとしてHarthouseを設立する。Harthouseからは、1992年にHardfloorのEP『Hardtrance Acperience』（収録曲「Acperience 1」など）が発表され、英国チャートに入った。同レーベルからはSven Väth自身のほか、Oliver Liebが作品を出した。Cygnus XはEye Q Recordsから作品を出している。

並行して、ベルリンでは1991年にPaul van Dykが活動を始めた。彼は東ドイツ出身で、1991年3月にTresorでDJとして初めて出演した（1990年はベルリンに戻った年）。同時期のDance 2 Trance作品やvan Dykのリミックス（1993年〜）は、旋律的な路線の代表例とされる。

もう一つの重要な流れが、ゴア・トランスだ。舞台はインドのゴア州(1960年代後半から1970年代初頭にかけてヒッピーの聖地として栄えた)だ。ここで1960年代末〜70年代のヒッピー文化を土壌に、1980年代に欧州から持ち込まれたEBM・テクノ等と結びつき、1990年代初頭にスタイルとして成立した。これは後に、サイケデリック・トランスへ発展する。

トランスは、1990年代後半〜2000年代初頭に商業的な頂点を迎えたとされる。オランダからは、Armin van Buuren、Ferry Corsten、Tiëstoが登場した。イギリスでは、Paul OakenfoldがGoa Mixなどを通じてトランス的な音を英国の主流へ広め、Creamでは専属DJを務めた。Tiëstoは2004年のアテネ五輪開会式でDJとして演奏し、この音楽は国際的な式典（五輪開会式）に採用されるまでになった。ATB「9 PM (Till I Come)」は1998年に発売され、1999年にトランス曲として初めて全英1位になった。Robert Miles「Children」は1996年にヨーロッパ全域で大ヒットした。このように、チャート音楽としての成功も相次いだ。

しかし、商業的な成功は激しい批判も招いた。世紀の変わり目前後から、定型的なブレイクダウンなどを、批評家やアンダーグラウンド側が嘲笑した。2000年代後半以降も、主流の担い手（A State of Trance等）は人気を保った。一方で、多くのDJは他の音へ移った。2017年頃からは、アンダーグラウンドのDJがトランスを取り入れ始めた。2010年代のEDMの盛り上がりの中で、EDM寄りのトランスが生まれた。

近年は、A State of Trance(Armin van Buurenが2001年に始めたラジオ番組)を軸とする共同体が、世界規模で維持されている。若い世代による再評価も進んでいる。</p>
