<h1>Trance（トランス）とは</h1>
<p>反復と上昇によって聴き手を恍惚状態へ導くことを目的とした電子ダンス音楽。名称の通り、変性意識(トランス)への到達が設計目標に組み込まれている。核となるのは16分音符で刻まれるアルペジオで、シンセのシーケンスが延々と回りながら、フィ</p>
<p>反復と上昇によって聴き手を恍惚状態へ導くことを目的とした電子ダンス音楽。名称の通り、変性意識(トランス)への到達が設計目標に組み込まれている。核となるのは16分音符で刻まれるアルペジオで、シンセのシーケンスが延々と回りながら、フィルターが少しずつ開いていく。テンポは130〜145BPM。キックは四つ打ちで硬く短く、その裏にオフビートのベースが8分音符で置かれる。このオフビート・ベースがトランス特有の推進感を生む最大の要素になる。構造は明確に定型化されており、序盤に打楽器とベースだけの導入、そこにアルペジオが加わり、中盤で全ての打楽器が抜けるブレイクダウンへ入る。ブレイクダウンでは長いパッドと壮大な旋律が現れ、しばしば数分にわたって引き伸ばされる。その後、白色雑音のライザーとスネアの連打によって緊張が最大化され、キックが戻る瞬間に最も感情的な頂点が置かれる。この「ブレイクダウンから復帰へ」の設計が、ジャンルの情緒的な中核をなす。和声は自然短音階かハーモニックマイナーで、切迫感のある進行が好まれる。旋律は明確で歌えるほど分かりやすいものが多い。ヴォーカルは入る場合、女性の伸びやかな歌声で、希望、飛翔、別れといった抽象的で感情的な主題を歌う。テクノと比べて旋律と和声が圧倒的に濃く、ハウスと比べて速く劇的である点で区別される。</p>
<h2>成り立ち</h2><p>1990年前後のドイツ、とりわけフランクフルトで成立した。土壌となったのは1980年代のベルリン・スクールの電子音楽(Tangerine Dream、Klaus Schulze)の反復するシーケンスと、アシッドハウスの熱狂だった。ジャンルの起点とされる作品の一つがDance 2 Trance の1990年「We Came in Peace」で、この曲名がジャンル名の普及に寄与したとされる。同時期にフランクフルトではSven Vathがクラブ Omenを1988年に開き、1991年にレーベルEye QとHarthouseを設立した。Harthouseからは1992年にHardfloorの「Hardtrance Acperience」が発表され、TB-303を用いた長い上昇の構成が、トランスの様式を決定づけた。同レーベルからはSven Vath自身のほか、Oliver Lieb、Cygnus X らが作品を出した。並行してベルリンでは1991年にPaul van Dykが活動を開始し、彼は東ドイツ出身で、壁の崩壊がなければ音楽家になれなかったと語っている。1993年のDance 2 Trance「Power of American Natives」やvan Dykによるリミックス群が、より旋律的な方向を確立した。もう一つの重要な系統がゴア・トランスで、インドのゴア州でヒッピーの共同体が1980年代から開いていた野外パーティーが、電子音楽と結びついて独自に発展したものだった。これは後にサイケデリック・トランスへ発展する。1997年から2001年にかけてトランスは商業的な頂点を迎える。オランダのArmin van Buuren、Ferry Corsten、Tiestoが登場し、イギリスではPaul Oakenfoldがクラブ Cream やGatecrasherを通じて大衆化した。Tiestoは2004年のアテネ五輪開会式でDJとして演奏し、この音楽が国家的な式典に採用されるまでに至った。ATB「9 PM (Till I Come)」が1998年に全英1位、Robert Miles「Children」が1996年にヨーロッパ全域で大ヒットするなど、チャート音楽としての成功も相次いだ。しかし商業的成功は激しい批判も招いた。定型的な構成、感傷的すぎる旋律、大量生産される類似作品への軽蔑が、テクノやハウスの側から向けられ、2000年代半ばには「トランス」という語自体が嘲笑の対象になった時期もある。2005年前後に市場は縮小したが、その後プログレッシブ・トランスやサイケデリック・トランスとして地下で存続し、2010年代のEDMの隆盛の中で構造の語彙が全面的に再利用された。近年はA State of Trance(Armin van Buurenが2001年に始めたラジオ番組)を軸とする共同体が世界規模で維持され、若い世代による再評価も進んでいる。</p>
