<h1>Third Stream（サードストリーム）とは</h1>
<p>サードストリームは、当初は、ジャズの即興演奏と現代クラシック音楽の作曲技法を、意図して融合させた音楽スタイルを指した。名前のとおり、クラシック音楽とジャズという二つの流れを合流させた「第3の流れ」として定義される。どちらかを脇役に</p>
<p>サードストリームは、当初は、ジャズの即興演奏と現代クラシック音楽の作曲技法を、意図して融合させた音楽スタイルを指した。名前のとおり、クラシック音楽とジャズという二つの流れを合流させた「第3の流れ」として定義される。どちらかを脇役にするのではなく、両者が対等に並び立つことが、この音楽の考え方の中心だ。

使われる楽器は幅広い。弦楽四重奏やオーボエ、クラリネット、ホルンといったクラシックの合奏の編成に、ジャズのピアノ、コントラバス、ドラムセット、トランペット、テナーサックスが組み合わさる。ピアノには、クラシックらしい明確な打鍵と、ジャズのヴォイシング（和音の積み方）の両方が求められる。

和音の面では、作品ごとに手法は異なる。シュラー自身は、クラシックの十二音技法（12の音を偏りなく使う作曲法）を用いた。ポリトーナリティ（複数の調が同時に鳴る状態）、クラスター和音（隣接する音を束ねた不協和音）が用いられる作品もある一方、ジャズ特有のブルーノートや変化和音も随所に現れる。旋律は厳格な対位法の扱いを受けながらも、ジャズらしいフレーズの感じを保っている。

リズムは複雑だ。クラシックの変拍子（5拍子・7拍子など）と、ジャズのスウィングするグルーヴが混ざり合う。テンポは作品ごとに大きく異なる。

演奏の面では、ジャズのソリストが即興の部分を受け持ち、合奏の部分は楽譜に厳密に書き込まれる。ジャズ奏者が、細かく楽譜に書かれた一節を演奏することもある。書き込まれた合奏と、ジャズのソリストによる即興が、交互に現れる。この「書かれた音楽」と「即興の音楽」の境目を、わざと曖昧にする点が、最大の特徴だ。

音の響きでは、コンサートホールや録音スタジオの自然な残響が重んじられる。生楽器の響きの中で、弦をこする音と金管の倍音が複雑に絡み合う。

曲の組み立ては、クラシックの作曲の形式と、ジャズのコーラス構造（テーマ→即興→テーマ）を組み合わせる作品が見られる。聴きどころは、楽譜に書かれた部分から即興の部分へ、切れ目なく移る瞬間だ。</p>
<h2>成り立ち</h2><p>サードストリームという考え方に、公式に名前が付いたのは1957年のことだ。作曲家で指揮者のガンサー・シュラーが、ブランダイス大学での講演でこの言葉を初めて使い、ジャズとクラシックの本当の融合を目指す、新しい音楽の方向を宣言した。シュラーは、ジャズの即興性と現代クラシックの作曲技術を、対等に扱うことを大切にしたとされる。

ジャズの側では、1940年代前半〜半ばにビバップ革命が起こり、1940年代〜1950年代にかけて広がった。チャーリー・パーカーやディジー・ガレスピーが切り開いた複雑な和音と速い演奏は、ジャズを「踊るための音楽」から「聴くための音楽」へと大きく変えた。一方で、ジャズとクラシックの接近は1930〜40年代から途切れ途切れにあり、1957年に名前が与えられた。

先駆けとなった試みには、1949年から1950年にかけてマイルス・デイヴィスが録音した「クールの誕生（Birth of the Cool）」がある。アレンジャーのギル・エヴァンスや、ガンサー・シュラー自身も加わったこの録音では、Claude Thornhill楽団の編成を受け継ぎ、フレンチホルンやチューバを含む九重奏団が組まれた。クラシックらしい音色とジャズのリズムを溶け合わせた点で、クール・ジャズの源流とされ、ジャズとクラシックが近づいた先例のひとつと見られている。

シュラー自身の代表作には、「Transformation」（1957年初演、ジャズ・アンサンブルのための作品）がある。ブランダイス大学フェスティバルで初演され、ジャズの名手たちが、12音的な難しい楽譜も読みこなして演奏した。Modern Jazz Quartetとオーケストラの共演は、のちの「Concertino for Jazz Quartet and Orchestra」（1959年作曲、1960年初演、録音は1960年）で実現した。

同じ時期には、ジョン・ルイスが率いるModern Jazz Quartetも、バロック風の対位法をジャズに持ち込み、サードストリームの担い手として広く知られた。ルイスは「Fontessa」（1956年）や「Django」（1954年作曲、1956年のLP『Django』、初出は1955年の10インチ盤）などの作品で、クラシックの形式の美しさとジャズの即興を結びつけた。

チャールズ・ミンガスは、1957年のブランダイス大学フェスティバルに「Revelations」で参加した。ただし、ジャンル分けのラベルは拒んだ。彼は「The Black Saint and the Sinner Lady」（1963年）などで、大規模なアンサンブルと即興の融合を追い求めた。また、ジミー・ジュフリーはクラリネット奏者として、室内楽的な取り組み方をした。1957年のブランダイス大学フェスティバルに参加した作曲家の一人でもある。

この音楽を支えた組織としては、ニューイングランド音楽院（ガンサー・シュラーが1967年から院長を務めた）が重要だ。ニューイングランド音楽院は、サードストリームを正式な学科として設け、この音楽を学問として広めることに貢献した。

しかし、サードストリームは、批評家や聴衆から厳しい評価を受けることも多かった。シュラー自身は、ジャズ側からも、クラシック側からも、二つの偉大な音楽を損なうものだという批判を受けたと振り返っている。ダウンビート誌などのジャズ専門誌でも、賛否の論争が繰り広げられ、ジャズ側からは、ジャズの魂を奪うものだという批判があった。

名前を掲げた動きは、1960年代前半までに下火になった。今では、マリア・シュナイダー・オーケストラのような大編成のジャズアンサンブルや、現代クラシックとジャズの境目を探る作曲家たちが、両方の要素を融合する例として挙げられる。サードストリームという言葉そのものは使われなくなりつつあるが、その考え方は、今のクラシックやジャズのさまざまな試みの中で生き続けている。</p>
