<h1>Third Stream（サードストリーム）とは</h1>
<p>サードストリームは、ジャズの即興演奏と現代クラシック音楽の作曲技法を意図的に融合させた音楽スタイルだ。その名が示す通り、「第1の流れ」であるクラシック音楽と「第2の流れ」であるジャズを合流させた「第3の流れ」として定義される。どち</p>
<p>サードストリームは、ジャズの即興演奏と現代クラシック音楽の作曲技法を意図的に融合させた音楽スタイルだ。その名が示す通り、「第1の流れ」であるクラシック音楽と「第2の流れ」であるジャズを合流させた「第3の流れ」として定義される。どちらかの要素が従属的に扱われるのではなく、両者が対等に共存することが理念の核心だ。

和声面では、クラシックの十二音技法やポリトーナリティ（複数の調が同時に鳴る状態）、クラスター和音（隣接する音を束ねた不協和音）が用いられる一方、ジャズ特有のブルーノートや変化和音も随所に現れる。旋律は厳格な対位法的処理を受けながらも、ジャズのフレーズ感を保持している。

使用楽器は多岐にわたる。弦楽四重奏やオーボエ、クラリネット、ホルンといったクラシックのアンサンブル編成に、ジャズのピアノ、コントラバス、ドラムセット、トランペット、テナーサックスが組み合わさる。ピアノはクラシック的な打鍵の明確さとジャズのヴォイシング（和音の積み方）を同時に要求される。

演奏技法の面では、クラシック奏者が即興演奏のセクションを担当したり、ジャズ奏者が厳密に記譜されたパッセージを演奏したりする場面が交互に現れる。この「書かれた音楽」と「即興の音楽」の境界線を意図的に曖昧にする点が最大の特徴だ。

リズムは複雑で、クラシックの変拍子（5拍子・7拍子など）とジャズのスウィングするグルーヴが混在する。テンポは曲によって大きく異なり、緩やかな室内楽的テンポから、毎分160拍を超えるビバップ的な速度まで幅広い。

音響的には、コンサートホールや録音スタジオでの自然な残響が重視され、電子的なエフェクトはほとんど用いられない。アコースティックな音場の中で、弦の擦奏音と金管の倍音が複雑に絡み合う。

曲の構成は、クラシックのソナタ形式やロンド形式を骨格としながら、その中にジャズのコーラス構造（テーマ→即興→テーマ）を埋め込む二重構造を取ることが多い。聴かせどころは、記譜された部分と即興部分が切れ目なく移行する瞬間だ。ボーカルが入る場合は少なく、基本的にインストゥルメンタル作品が主流である。</p>
<h2>成り立ち</h2><p>サードストリームという概念が公式に命名されたのは1957年のことだ。作曲家・指揮者のガンサー・シュラーがブランダイス大学での講演においてこの言葉を初めて用い、ジャズとクラシックの真の融合を目指す新しい音楽の方向性を宣言した。シュラーはジャズの即興性と現代クラシックの作曲技術を対等に扱うことを強調し、どちらかがどちらかの「装飾」に留まることを明確に否定した。

この動きの背景には、1940年代後半から1950年代にかけてのビバップ革命がある。チャーリー・パーカーやディジー・ガレスピーが切り開いた複雑な和声と高速演奏は、ジャズを「踊るための音楽」から「聴くための音楽」へと変貌させた。この流れの中で、クラシック音楽の訓練を受けたジャズミュージシャンたちが、さらなる構造的複雑さを求めて現代音楽の語法に接近し始めた。

先駆的な試みとしては、1949年から1950年にかけてマイルス・デイヴィスが録音した「クールの誕生（Birth of the Cool）」が挙げられる。アレンジャーのギル・エヴァンスやガンサー・シュラー自身も参加したこのセッションは、フレンチホルンやチューバをジャズアンサンブルに導入し、クラシック的な音色とジャズのリズムを融合させた点でサードストリームの直接的な前身とみなされる。

シュラー自身の代表作としては、1957年に発表した「Transformation for Jazz Ensemble」がある。この作品ではジャズのコンボとシンフォニーオーケストラが同じ舞台に立ち、即興と作曲が有機的に絡み合う構造を実現した。同年代には、ジョン・ルイスが率いるモダン・ジャズ・カルテット（MJQ）もバッハ的な対位法をジャズに持ち込み、サードストリームの実践者として広く認知された。ルイスは「Fontessa」（1956年）や「Django」（1956年）などの作品でクラシックの形式美とジャズの即興を結びつけた。

チャールズ・明奈ス（チャールズ・ミンガス）もこの潮流と深く関わり、「The Black Saint and the Sinner Lady」（1963年）などで大規模なアンサンブルと即興の融合を追求した。また、ジミー・ジュフリーはクラリネット奏者として室内楽的なアプローチを取り、サードストリームの室内楽的側面を担った。

シーンを支えた組織としては、1964年に設立されたジャズ・コンポーザーズ・ギルドや、ニューイングランド音楽院（ガンサー・シュラーが1967年から院長を務めた）が重要だ。ニューイングランド音楽院はサードストリームを正式な学科として設置し、この音楽の学術的な普及に貢献した。

しかし、サードストリームは批評家や聴衆から厳しい評価を受けることも多かった。ジャズ側からは「クラシックに媚びた音楽だ」という批判が、クラシック側からは「即興という不確定要素が芸術的厳密さを損なう」という反発があった。ダウンビート誌などのジャズ専門誌でも賛否両論の論争が繰り広げられ、ジャズの純粋主義者たちはこの融合を「ジャズの本質の喪失」と見なした。

1960年代以降、フリージャズの台頭とロックの爆発的普及により、サードストリームは大衆的な注目を失っていった。しかし1980年代以降、ウィントン・マルサリスらによるジャズ復興運動の中で再評価が進み、現代においてはマリア・シュナイダー・オーケストラのような大編成ジャズアンサンブルや、現代クラシックとジャズの境界を探る作曲家たちがその精神を継承している。サードストリームという言葉自体は使われなくなりつつあるが、その理念はコンテンポラリー・クラシカルやニュー・ジャズの文脈で生き続けている。</p>
