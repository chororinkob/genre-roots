<h1>Technical Death Metal（テクニカルデスメタル）とは</h1>
<p>デスメタルの重さと咆哮を保ちながら、演奏技術と作曲の複雑さを極限まで追求した音楽である。ギターは隣り合う弦を一方向の一振りで連続して弾くスウィープ奏法、高速の交互撥弦、両手を指板に置くタッピングを駆使し、毎秒十数音に及ぶ走句を正確</p>
<p>デスメタルの重さと咆哮を保ちながら、演奏技術と作曲の複雑さを極限まで追求した音楽である。ギターは隣り合う弦を一方向の一振りで連続して弾くスウィープ奏法、高速の交互撥弦、両手を指板に置くタッピングを駆使し、毎秒十数音に及ぶ走句を正確に弾き切ることが要求される。用いられる音の材料もブルース由来のペンタトニックを完全に離れ、減七の音階、全音音階、そして特定の調性に属さない半音階的な動きが選ばれる。和音も三和音ではなく、短二度や増四度を含む濁った積み方が意図的に用いられ、聴き手に居心地の悪さを与える。拍子は絶えず変化し、7/8、5/4、11/16といった変拍子が数小節ごとに切り替わるうえ、ギターとドラムが異なる周期で循環するポリリズムも組まれる。ベースは低音を支える役割を離れ、指板に仕切りのない楽器を用いて滑らかに音程を移動しながら、独立した旋律を弾くことが多い。ドラムは毎分250打を超えるブラストビートと複雑な足の動きを両立させる。曲は3分から6分程度だが、同じ部分がほとんど繰り返されず、次々に別の場面へ進む。歌詞は宇宙、科学、死、精神の探求といった抽象的な主題を扱う。</p>
<h2>成り立ち</h2><p>出発点は1990年前後のアメリカ・フロリダ州である。デスメタルを事実上創始したChuck Schuldinerは、率いていたDeathの音楽を、単なる過激さの追求から音楽的な深化へと転じさせた。1991年の作品ヒューマンでは、ジャズフュージョンの素養を持つ演奏者を迎え、複雑な構成と洗練された演奏を導入している。彼は生涯にわたって作品ごとに難度を上げ続けたが、2001年、脳腫瘍のため34歳で死去した。同じフロリダのAtheistも1991年に、ジャズの語法とデスメタルを結合させた作品を発表している。ただしこのバンドは、録音の直前にベーシストのRoger Pattersonを自動車事故で失うという悲劇に見舞われており、彼が書き残した譜面を代役が演奏して作品が完成された。同じ流れからCynicが現れ、合成した声と滑らかな和音を導入するという、当時としては異端の方向を提示した。1998年、カナダ・ケベック州のGorgutsが発表したオブスキュラは、この分野の性格を決定的に変えた作品である。旋律も安定した拍子もほとんど存在せず、不協和な和音と不規則な構造だけで構成されたこの作品は、発表当時ほとんど理解されなかったが、後年には最も影響力のある一枚として評価された。2000年代に入るとドイツのNecrophagistが、古典音楽的な整った速弾きを持ち込み、演奏技術の水準を一段階引き上げる。以後、アメリカのOrigin、ドイツのObscura、カナダのArchspireといったバンドが、人間の限界を試すような速度と精度を競うようになった。この分野には常に同じ批判がつきまとう。すなわち、技術の誇示に終始して感情が欠落しており、聴くというより採点する対象になっているという指摘である。実際、演奏動画の投稿と、それを分析する文化がこの分野を支えている面は否定できない。一方で、その厳しい要求が音楽の可能性を押し広げてきたことも確かであり、現在では音楽大学出身の演奏者が多数参入する領域となっている。</p>
