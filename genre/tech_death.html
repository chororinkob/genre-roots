<h1>Technical Death Metal（テクニカルデスメタル）とは</h1>
<p>デスメタルの重さと咆哮を保ちながら、演奏技術と作曲の複雑さを極限まで追求した音楽である。 中心になるのはギターだ。隣り合う弦を一方向の一振りで連続して弾くスウィープ奏法、高速の交互撥弦、両手を指板に置くタッピングを駆使する。非常に</p>
<p>デスメタルの重さと咆哮を保ちながら、演奏技術と作曲の複雑さを極限まで追求した音楽である。

中心になるのはギターだ。隣り合う弦を一方向の一振りで連続して弾くスウィープ奏法、高速の交互撥弦、両手を指板に置くタッピングを駆使する。非常に速い走句を、正確に弾き切ることが求められる。ベースは、フレット（指板の仕切り）のないフレットレス・ベースの名手も多く、ベースが旋律的に動く例がある。

使われる音の材料には、ディミニッシュ・コードとアルペジオ（和音を一音ずつ順に弾く奏法）が多い。特定の調性に属さない半音階的な動きも多い。和音は三和音ではなく、短2度や増4度を含む濁った積み方が、意図的に用いられる。聴き手には居心地の悪さを与える。

拍子は絶えず変化する。7/8、5/4、11/16といった変拍子が、数小節ごとに切り替わる。さらに、ギターとドラムが異なる周期で繰り返し、リズムが何重にも重なる構造も組まれる。ドラムは、ブラストビート（極端に速い連打）と複雑な足の動きを両立させる。

歌詞は、哲学的・科学的・抽象的な主題が増えた。曲は、展開の多い構成が目立つ。</p>
<h2>成り立ち</h2><p>出発点は、1980年代末〜1990年代初頭である。フロリダ勢を中心に、オランダのPestilenceなども含まれる。

デスメタルの起源は定説化しておらず、『Father of Death Metal』と呼ばれるChuck Schuldinerは、率いていたDeathの音楽を、単なる過激さの追求から音楽的な深化へと転じさせた。1991年の作品ヒューマンでは、ジャズフュージョンの素養を持つ演奏者を迎え、複雑な構成と洗練された演奏を導入している。彼はヒューマンで技術的・プログレッシブな方向へ転じ、以後も発展させたが、『Symbolic』ではやや親しみやすい作風になった。2001年、脳腫瘍のため34歳で死去した。

同じフロリダのAtheistは、1989年に英Active Recordsが欧州で発売し、1990年11月に米国でMetal Bladeが発売した『Piece of Time』から、ジャズ・フュージョンの影響を示した。1991年の作品では、さらにそれを発展させた。ただしこのバンドは、録音の直前にベーシストのRoger Pattersonを自動車事故で失うという悲劇に見舞われた。彼が書いたベース・ラインを代役のTony Choyが演奏して、作品が完成された(バンド側の公式見解)。

同じ流れからCynicが現れ、合成した声と滑らかな和音を導入した。当時としては異端の方向である。

1998年、カナダ・ケベック州のGorgutsが発表したオブスキュラは、後年、先駆的な作品として高く評価され、影響を与えた作品である。旋律は無調的で奇妙だが存在し、拍子記号は頻繁に変化する。不協和な和音と不規則な構造が特徴だ。この作品は、発表当時は聴き手が限られ、戸惑う声も多かったが、後に再評価された。

ドイツのNecrophagistは、1999年のデビュー作と2004年の『Epitaph』で、バロック／ネオクラシカルの影響を受けた整った速弾きを持ち込み、演奏技術の水準を一段階引き上げたとされる。アメリカのOrigin(2000年デビュー)、ドイツのObscura、カナダのArchspireといったバンドが、人間の限界を試すような速度と精度を競うようになった。

この分野には、一部のリスナーから『技巧偏重』との批判がある。一方で、その厳しい要求が音楽の可能性を押し広げてきたことも確かである。現在では、高い技術を持つ演奏者が多く参入する領域となっている。</p>
