<h1>K-Hip Hopとは</h1>
<p>韓国語を主体とするヒップホップである。 音そのものは、アメリカの流れを素早く取り入れて作られる。そのため、ブンバップからトラップ、ドリルまで、幅広い形をとる。それでもこの分野を独自のものにしているのは、言葉の仕組みである。 韓国語</p>
<p>韓国語を主体とするヒップホップである。

音そのものは、アメリカの流れを素早く取り入れて作られる。そのため、ブンバップからトラップ、ドリルまで、幅広い形をとる。それでもこの分野を独自のものにしているのは、言葉の仕組みである。

韓国語は音節の切れ目が明確で、文末に述語が来る。そのため、韻を踏む位置が英語とは根本から違う。この制約に対し、語尾を揃える手法が使われる。音節がぎっしり詰まり、たたみかけるような発声になることもある。

メロディーをつけて歌う部分も重視される。ラップと歌唱の境界は緩やかだとされる。ヒップホップとアイドル音楽の間には接点もある。

放送では、歌詞の過激な表現が審議機関の制裁や局の編集の対象になることがある。Drunken Tigerのように、歌詞の過激さが論争になった例もある。</p>
<h2>成り立ち</h2><p>韓国のヒップホップは、1980年代末から90年代初頭にかけて形作られた。1989年のHong Seo-beomの曲「Kim Sat-gat」は、ラップを含む最初の韓国ポップ曲とされる。1990年(1989年とする説もある)にデビューしたHyun Jin-youngは、最初の韓国ヒップホップのアーティストとされる。

広く浸透する転機は、1992年に訪れた。Seo Taiji and Boysが発表した曲は、韓国語のラップとダンス音楽を、主流の歌謡番組へ持ち込んだ。当時の審査員は低い点を付けたが、それにもかかわらず爆発的に売れるという事件が起きた。これにより、韓国の大衆音楽の仕組みが大きく変えられた。その後のアイドル産業とヒップホップは、どちらもここから枝分かれしていく。

1990年代後半、ソウル生まれで12歳から米国で育ったTiger JKが、1998年にDJ ShineとDrunken Tigerを結成した。1999年には、韓国でデビュー作『Year of the Tiger』を発表した。2000年の2作目『The Great Rebirth』では、ソウルのクラブ経営者から「最初の商業的に成功した本格的ヒップホップ・グループ」と評された。

押韻については、末尾韻などの押韻がすでに存在した。Verbal Jintは2001年のミニアルバム『Modern Rhymes』で、韓国語の押韻を大きく発展させたと評価される。

2000年代半ばには、Epik High(2001年結成、2002年とする説もある。2003年デビュー)が韓国で人気を得て、日本でもヒット曲が出た。Dynamic Duoの2004年のアルバム『Taxi Driver』は、発売から約1か月で5万枚超を売り上げた。当時、韓国で最も売れたヒップホップ・アルバムとされる。

2010年代に入ると、流れが加速する。2011年1月に、The QuiettとDok2がIllionaire Records(2020年に解散)を設立した。続いて2013年にJay ParkがAOMGを、2017年にJay ParkとCha Cha MaloneがH1GHR MUSICを設立した。

大きな転機となったのは、2012年6月にMnetで始まった競技番組『Show Me the Money』だ。新人とベテランが混じる参加者が勝ち抜いていく形式が人気を得て、シーズンを重ねて、2014〜15年ごろに人気が頂点に達した。この番組は、「悪魔の編集」と呼ばれる演出や、過激で女性蔑視的な歌詞、商業化で市場の多様性が失われたことをめぐって、批判も浴びている。

2015年には、Keith Apeの「It G Ma」が公開された(2015年1月1日)。この曲は、韓国のヒップホップの海外の聴衆を広げた。

ただし、独自の困難もある。男性に課される兵役は、活動の中断を強いる。放送での言葉遣いの規制は、表現の幅を狭めてきた。さらに、黒人音楽のスタイルを借りることの意味をめぐる議論や、過去の発言をめぐる糾弾も繰り返されている。それでも今も、ヒップホップは韓国で作られ続けている。</p>
