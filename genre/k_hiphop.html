<h1>K-Hip Hopとは</h1>
<p>韓国語を主体とするヒップホップである。音そのものはアメリカの各潮流を素早く吸収して作られるため、ブンバップからトラップ、ドリルまで幅広い形態を取るが、この分野を独自のものにしているのは言語の構造にある。韓国語は音節の切れ目が明瞭で</p>
<p>韓国語を主体とするヒップホップである。音そのものはアメリカの各潮流を素早く吸収して作られるため、ブンバップからトラップ、ドリルまで幅広い形態を取るが、この分野を独自のものにしているのは言語の構造にある。韓国語は音節の切れ目が明瞭で、文末に述語が来るため、韻を踏む位置が英語と根本的に異なる。この制約に対し、語尾を揃える手法、日常会話の助詞を切り詰めて拍に合わせる手法、そして英語の単語を混ぜて母音を確保する手法が発達した。結果として、一小節に詰め込まれる音節の密度が高く、機関銃のように畳みかける発声が生まれやすい。旋律をつけて歌う部分も重視され、ラップと歌唱の境界が緩やかである点は、隣接するアイドル音楽との相互影響の結果でもある。制作面では低音の設計に力が入れられ、大音量で鳴らすことを想定した分厚い低域と、明瞭な高域が両立するよう整えられる。歌詞は成功への渇望、競争、家族への感謝、地元への言及といった主題が中心で、アメリカのように直接的な暴力の描写は少ない。これは放送規制と社会的な受容の条件が異なるためでもある。</p>
<h2>成り立ち</h2><p>起点は1992年である。Seo Taiji and Boysが発表した楽曲は、韓国語のラップとダンス音楽を主流の歌謡番組へ持ち込み、当時の審査員が低い評点を付けたにもかかわらず爆発的に売れるという事件を起こした。これにより韓国の大衆音楽の構造そのものが書き換えられ、その後のアイドル産業とヒップホップの双方がここから枝分かれする。1990年代末には、アメリカで育った韓国系のTiger JKがDrunken Tigerとして帰国し、本場の発声と態度を直接持ち込んだ。1999年の作品は韓国語のラップの水準を大きく引き上げ、以後の世代が共通して参照する基準となる。2000年代前半にはEpik Highが、文学的な歌詞と旋律的な構成によってラップを広い層へ届け、Dynamic Duoが親しみやすい語り口で市場を広げた。2010年代に入ると流れが加速する。2011年に設立されたIllionaire Recordsは、大手事務所に属さずに富を築いた作り手の象徴となり、AOMGやH1GHR MUSICといった独立系の共同体が続いた。決定的だったのは2012年に始まったテレビの競技番組で、無名の参加者が勝ち抜いていく形式が国民的な人気を得たことにより、ヒップホップが一気に大衆化した。この番組は多くの才能を発掘した一方、演出された対立や、放送を前提とした表現の自主規制、そして落選者への苛烈な扱いをめぐって強い批判も浴びている。2015年にはKeith Apeの楽曲が国境を越えて拡散し、韓国のヒップホップが初めて世界的な注目を集めた。ただし、独自の困難も存在する。男性に課される兵役は活動の中断を強い、放送における言葉遣いの規制は表現の幅を狭め、また女性の演者に対する市場の冷淡さは長く問題視されてきた。加えて、黒人音楽の様式を借りることの意味をめぐる議論や、過去の発言をめぐる糾弾も繰り返されている。それでも現在では、アジアで最も層の厚いヒップホップの生産地のひとつとして確立している。</p>
