<h1>K-Hip Hopとは</h1>
<p>韓国語を主体とするヒップホップである。音そのものはアメリカの各潮流を素早く吸収して作られるため、ブンバップからトラップ、ドリルまで幅広い形態を取るが、この分野を独自のものにしているのは言語の構造にある。韓国語は音節の切れ目が明瞭で</p>
<p>韓国語を主体とするヒップホップである。音そのものはアメリカの各潮流を素早く吸収して作られるため、ブンバップからトラップ、ドリルまで幅広い形態を取るが、この分野を独自のものにしているのは言語の構造にある。韓国語は音節の切れ目が明瞭で、文末に述語が来るため、韻を踏む位置が英語と根本的に異なる。この制約に対し、語尾を揃える手法や、英語の単語を混ぜる手法が使われると言われる。音節の密度が高く、畳みかけるような発声になることもある。旋律をつけて歌う部分も重視され、ラップと歌唱の境界が緩やかである点は、隣接するアイドル音楽との相互影響の結果でもある。制作面では低音の設計に力が入れられ、大音量で鳴らすことを想定した分厚い低域と、明瞭な高域が両立するよう整えられる。歌詞は成功への渇望、競争、家族への感謝、地元への言及といった主題が中心で、放送向けには過激な表現が自主規制や編集の対象になることがあり、Drunken Tigerのように歌詞の過激さが論争になった例もある。</p>
<h2>成り立ち</h2><p>韓国のヒップホップは1980年代末から90年代初頭に形成された。1989年のHong Seo-beomの曲は、ラップを含む最初の韓国ポップ曲とされ、1990年にデビューしたHyun Jin-youngは最初の韓国ヒップホップのアーティストとされる。大衆化の転機は1992年で、Seo Taiji and Boysが発表した楽曲は、韓国語のラップとダンス音楽を主流の歌謡番組へ持ち込み、当時の審査員が低い評点を付けたにもかかわらず爆発的に売れるという事件を起こした。これにより韓国の大衆音楽の構造そのものが書き換えられ、その後のアイドル産業とヒップホップの双方がここから枝分かれする。1990年代後半には、ソウル生まれで12歳から米国で育ったTiger JKが、1998年にDJ ShineとDrunken Tigerを結成し、1999年に韓国でデビュー作『Year of the Tiger』を発表して、商業的に成功した初の本格的なヒップホップ・グループとなった。韓国語ラップに押韻を持ち込んだのは、2001年のミニアルバム『Modern Rhymes』を出したVerbal Jintとされる。2000年代前半にはEpik High(2001年結成、2003年デビュー)が韓国と日本のチャートで首位を取り、Dynamic Duoの2004年のアルバム『Taxi Driver』は50万枚以上売れた。2010年代に入ると流れが加速する。2011年1月にThe QuiettとDok2が設立したIllionaire Records(2020年に解散)に続き、2013年にJay ParkがAOMGを、2017年にJay ParkとCha Cha MaloneがH1GHR MUSICを設立した。決定的だったのは2012年6月にMnetで始まった競技番組『Show Me the Money』で、新人とベテランが混じる参加者が勝ち抜いていく形式が人気を得て、ヒップホップが一気に大衆化した。この番組は、「悪魔の編集」と呼ばれる演出、過激で女性蔑視的な歌詞、商業化による市場の多様性の喪失をめぐって批判も浴びている。2015年にはKeith Apeの「It G Ma」が公開され(2015年1月1日)、韓国のヒップホップの海外の聴衆を広げた。ただし、独自の困難も存在する。男性に課される兵役は活動の中断を強い、放送における言葉遣いの規制は表現の幅を狭めてきた。加えて、黒人音楽の様式を借りることの意味をめぐる議論や、過去の発言をめぐる糾弾も繰り返されている。それでも現在も、ヒップホップは韓国で作られ続けている。</p>
