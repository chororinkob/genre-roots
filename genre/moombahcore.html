<h1>Moombahcore（ムンバーコア）とは</h1>
<p>ムーンバーコアは、ムーンバートンの遅い拍の取り方に、ダブステップ、ブレイクコア、ニュースタイル・ハードコアなどの歪んだ音を持ち込んだスタイルだ。カリブ海の踊りの拍の取り方はそのまま使う。その上に乗る音だけを、欧州の攻撃的な電子音楽</p>
<p>ムーンバーコアは、ムーンバートンの遅い拍の取り方に、ダブステップ、ブレイクコア、ニュースタイル・ハードコアなどの歪んだ音を持ち込んだスタイルだ。カリブ海の踊りの拍の取り方はそのまま使う。その上に乗る音だけを、欧州の攻撃的な電子音楽から借りてきた作りになっている。

具体的には、音の高さを急に上げ下げして唸らせた低音、金属的に割れた合成音、そして複雑な打楽器のパターンが使われる。多くの曲で、メロディーの要素は少なく、加工された声の断片や短い決まったフレーズがくり返される。

テンポは100から115 BPMほどだ。108 BPMという数字は、このスタイルが生まれるきっかけになった減速の値から来ている。リズムの土台は、レゲトンのデンボウと呼ばれる型だ。1小節を三つと三つと二つに区切るような、跳ねた並びを取る。

曲の組み立ては、緊張と解放の対比を強めた作りだ。静かに溜める部分から一気に爆発する落差が、いちばんの聴かせどころになる。多くの曲で、落差の部分ではリズムが一時的に倍の細かさになったり、逆に完全に止まったりする。

ムーンバートンの陽気で色っぽい性格に対し、こちらは攻撃性と重さを前面に出している。同じ拍の型を使いながら、受ける印象は大きく違う。</p>
<h2>成り立ち</h2><p>発端は2009年11月のことだ。ワシントンD.C.周辺で活動するデュオNadastromのディージェイ、デイヴ・ナダが、従兄弟の頼みで高校生のパーティーに呼ばれた。その現場で、彼はその場の思いつきで、ある操作をした。

彼は、Silvio EcomoとChuckieの曲『Moombah!』の、アフロジャックによるリミックスをかけた。その再生速度を、128 BPM前後から約108 BPMまで大きく落としたのだ。当時のダッチ・ハウスは130 BPM前後が標準だったので、これは劇的な減速だった。その場にいた聴き手は、レゲトンに近い感覚で踊りはじめた。そこで彼は、この効果を意識して再現するようになる。

ムーンバートンという名は、元になった曲名にレゲトンを掛け合わせたものだ。2010年に彼が発表した作品集が無料で配られると、この手法は制作者の間で一気に広まった。彼は、ダッチ・ハウスの減速を出発点に、レゲトン系のリズムの要素や曲の構成を加えて、ひとつのスタイルにした。

同じ2010年には、ムンチなどの制作者が同じ種類の曲を発表した。2011年には、ディプロのレーベルMad Decentがムーンバートンのコンピレーションを出し、ひとつのスタイルとして知られるようになった。

ここから流れはいくつかに分かれ、moombahcore、moombahstepなどの名が挙がった。一方は、原型に近い、陽気で色っぽい性格を保つ流れだ。もう一方は、当時同じく勢いを増していたダブステップの唸る低音と歪みを大量に持ち込んだ流れで、これがムーンバーコアと呼ばれるようになった。

オランダのムンチが、最初のムーンバーコアの曲を作ったとされる。本人もそう語っている。ムンチは2010年に、Datsikの『Firepower』のムーンバーコア・リミックスを作っている。一方、アメリカのディロン・フランシスは、2010年にDJデビューした。ムーンバートンの流行で知られたあと、より激しい派生であるムーンバーコアを推し進めた人物である。

流行の最盛期は2010年代初頭で、その後は次の流行に移っていった。2013年には、ムンチのレーベルSelegna Recordsが、Various Artists の『Moombahton Is Dead』を出している。それでもムーンバートンについては、のちの「Sorry」のようなレゲトンやダンスホール調のポップとの関連が、論者によって指摘されている。</p>
