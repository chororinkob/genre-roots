<h1>Moombahcore（ムンバーコア）とは</h1>
<p>ムーンバートンの遅い拍節に、ダブステップやハードダンスの歪んだ音を持ち込んだ様式である。テンポは一分間に108から110拍前後に固定されるのが特徴で、この数値は偶然ではなく、成立の経緯そのものに由来する。リズムの土台はレゲトンのデ</p>
<p>ムーンバートンの遅い拍節に、ダブステップやハードダンスの歪んだ音を持ち込んだ様式である。テンポは一分間に108から110拍前後に固定されるのが特徴で、この数値は偶然ではなく、成立の経緯そのものに由来する。リズムの土台はレゲトンのデンボウと呼ばれる型で、一小節を三つと三つと二つに区切るような跳ねた配置を取る。カリブ海の踊りの拍節をそのまま使いながら、その上に乗る音だけを欧州の攻撃的な電子音楽から借りてきた構造になっている。具体的には、音程を急激に上下させて唸らせた低音、金属的に割れた合成音、そして極端に圧縮された打撃音が使われる。曲の構成は緊張と解放の対比を強調した作りで、静かに溜める区間から一気に爆発する落差が最大の聞かせどころになる。落差の部分ではリズムが一時的に倍の細かさになったり、逆に完全に止まったりする。旋律の要素は少なく、加工された声の断片や短い決め文句が反復される。ムーンバートンの陽気で色っぽい性格に対し、こちらは攻撃性と重さを前面に出しており、同じ拍節を使いながら受ける印象は大きく異なる。</p>
<h2>成り立ち</h2><p>発端は2009年、アメリカの制作者ディプロの周辺で活動していたディージェイのデイヴ・ナダが、パーティーの現場で行った即興的な操作である。彼はアフロジャックによるダッチ・ハウスの曲『ムーンバー』の再生速度を、一分間に約108拍まで大きく落とした。当時のダッチ・ハウスは130拍前後が標準だったため、これは劇的な減速だった。その場に居合わせた聴き手がレゲトンに近い感覚で踊りはじめたことから、彼はこの効果を意識的に再現しはじめる。ムーンバートンという名は、元になった曲名にレゲトンを掛け合わせたものである。2010年に彼が発表した作品集が無料で配布されると、この手法は制作者の間で急速に広まった。減速という単純な操作だけで新しい様式が生まれたという経緯が、当時の制作環境の特徴をよく表している。同じ年、ディプロやムンチといった制作者が次々と同種の曲を発表し、一つの様式として認知された。ここから二方向へ分岐する。一方は原型に近い、陽気で色っぽい性格を保つ流れである。もう一方が、当時同時に勢いを増していたダブステップの唸る低音と歪みを大量に持ち込んだ流れで、これがムーンバーコアと呼ばれるようになった。中心となったのはアメリカのディロン・フランシスで、2011年から2012年にかけての一連の作品でこの方向を決定づけた。彼はこの様式の代名詞的な存在となり、その後の長い経歴もここから始まっている。2012年前後には北米の大規模な音楽祭で盛んに演奏され、当時急拡大していた電子舞曲市場の一角を占めた。しかし流行としては短命で、2014年頃には勢いを失った。制作の手順が単純すぎて差別化が難しかったこと、そして固定されたテンポが構成の自由度を狭めたことが理由として挙げられる。ただしカリブ海の拍節を欧米の電子舞曲へ本格的に導入したという点で果たした役割は大きく、後のトロピカル・ハウスや、ラテン系の要素を持つ主流のポップスに至る流れの、初期の一段として位置づけられている。</p>
