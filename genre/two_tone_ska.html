<h1>2 Tone Ska（ツートーンスカ）とは</h1>
<p>1970年代末のイギリスで、ジャマイカのスカを、パンクの速さと怒りとともに演奏した音楽だ。リズムの土台はジャマイカのスカやロックステディにあり、そこにパンクやニューウェーブの要素を混ぜ合わせている。 ギターまたは鍵盤が、拍の裏で鋭</p>
<p>1970年代末のイギリスで、ジャマイカのスカを、パンクの速さと怒りとともに演奏した音楽だ。リズムの土台はジャマイカのスカやロックステディにあり、そこにパンクやニューウェーブの要素を混ぜ合わせている。

ギターまたは鍵盤が、拍の裏で鋭く和音を刻む。低音は歩くように動き回り、メロディーのような存在感を持つ。編成には管楽器が加わる(The Specialsでは当初はゲストで、2作目から正式メンバーとなったとされる)。管の編成はバンドにより異なるが（Specialsはトランペット系とトロンボーン、The Beatはサックスなど）、覚えやすい短いメロディーを吹く。

和音は、基本的な3音の和音の繰り返しが中心だ。ただし、短調の暗さを持つ曲も多い。

テンポは本場のジャマイカのスカより明らかに速く、ドラムの叩き方はパンクに近い硬さを持つ。跳ねる骨組みを、せき立てるような速さで演奏する。この組み合わせが、独特の差し迫った勢いを生む。

歌は美しく歌い上げない。怒鳴る、語る、ジャマイカ由来の掛け声を交える、といった歌い方をし、複数の歌い手が交代する。

歌詞が扱うのは、失業、都市の荒廃、暴力、人種差別、そして若者の行き場のなさだ。それを抽象的なたとえではなく、具体的な場面として描く。

曲の多くは3分前後と短いが、Ghost Townのように3分半を超える曲もある。見た目の面では、白と黒の市松模様が使われた。当初はレトロなデザインだったが、のちに人種的な団結のシンボルとして受け取られた。</p>
<h2>成り立ち</h2><p>この音楽の舞台は、イングランド中部の工業都市コヴェントリーだ。この街は自動車産業に頼っており、1970年代末から1981年にかけて、大規模な失業に見舞われていた。

同じころのイギリスでは、極右政党の国民戦線(NF)が、選挙では1977年ごろをピークに勢いを失い、街頭での直接行動に傾いていった。人種差別的な暴力が起きていた。こうした状況では、白人と黒人が同じ舞台に立ち、同じ音楽を演奏すること自体が、はっきりとした政治的なメッセージになった。

1979年、The Specialsの中心人物Jerry Dammersが、2 Toneというレーベルを立ち上げた。名称の由来には、二色織りのTonikスーツ説と、人種混成の理念を重ねる解釈がある。デザインには白黒の市松模様が使われた。

彼らは意識して人種混成の編成を組んだ。カリブ海出身の移民（第一世代、または幼少期に渡英した世代）と、地元の白人の若者が、対等に演奏した。The Selecterでは、ナイジェリア人の父とアングロ・ユダヤ系の母のもとに生まれ、白人の養父母に育てられた混血のPauline Blackが歌手を務めた。The Beatには、ジャマイカ出身の年配のサックス奏者が加わり、世代を超えた受け継ぎも実現した。Madnessは、このレーベルから最初の作品を出した後、独自の道を進み、国民的な人気を得た。

しかし、ナチス式の敬礼や極右の妨害が、Madnessなど2 Tone系バンドの公演で起きた。The Specialsについては、極右の妨害は事実だが、敬礼の件数は誇張されているとされる。反人種差別を掲げた音楽が、まさにその標的になるという構図が、そこにあった。

1981年6月、The Specialsがある曲を発表した。閉鎖されたクラブと失われた仕事、そして街の廃墟を歌った曲だ。発売は同年4月のブリクストンの暴動の後で、7月にトクステスなどで暴動が相次ぐ中、全英1位(3週間)になった。Terry Hallは1981年に「録音時は前年のブリストルとブリクストンの暴動を話題にしていた。ヒットした時期は偶然だ」と述べた。作曲者のDammersは、Glasgowなどで見た光景や、バンドの状態を、曲の発想のもとに挙げている。この曲が1位にあった期間と暴動の時期が重なったことは、音楽が時代の空気を正確にとらえた、めったにない例と評されている。

皮肉なことに、その頂点で、バンドは内部の対立から分裂した。レーベルも1985〜86年ごろに活動を終える(資料により異なる)。それでも、その姿勢は今も参照され続けている。</p>
