<h1>2 Tone Ska（ツートーンスカ）とは</h1>
<p>1970年代末のイギリスで、ジャマイカのスカを、パンクの速度と怒りとともに演奏した音楽である。リズムの土台は完全にジャマイカのもので、ギターまたは鍵盤が二拍目と四拍目に鋭く和音を叩きつける裏拍の刻みが用いられる。しかしテンポは本場</p>
<p>1970年代末のイギリスで、ジャマイカのスカを、パンクの速度と怒りとともに演奏した音楽である。リズムの土台は完全にジャマイカのもので、ギターまたは鍵盤が二拍目と四拍目に鋭く和音を叩きつける裏拍の刻みが用いられる。しかしテンポは本場より明らかに速く、ドラムの叩き方はパンクに近い硬さを持つ。この、跳ねる骨格を性急な速度で演奏するという組み合わせが、独特の切迫した躍動を生む。低音は歩くように動き回り、旋律的な存在感を持つ。編成には管楽器が正式に加えられ、トランペット、トロンボーン、サックスが斉奏で覚えやすい音型を吹く。テンポは概ね140から180 BPM、曲は2分から3分と短い。和声は単純な三和音の循環が中心だが、短調の陰りを持つ楽曲も多い。歌唱は美しく歌い上げず、怒鳴る、語る、そしてジャマイカ由来の掛け声を交えるといった形が用いられ、複数の演者が交代する。歌詞は失業、都市の荒廃、暴力、人種差別、そして若者の行き場のなさを、抽象的な比喩ではなく具体的な情景として描く。視覚面では白と黒の市松模様が象徴として用いられ、これは音楽の姿勢そのものの表明でもあった。</p>
<h2>成り立ち</h2><p>舞台はイングランド中部の工業都市コヴェントリーである。この街は自動車産業に依存しており、1970年代末には大規模な失業に見舞われていた。同時期のイギリスでは、極右政党が移民排斥を掲げて勢力を伸ばし、街頭での人種差別的な暴力が日常的に起きていた。この状況において、白人と黒人が同じ舞台に立ち、同じ音楽を演奏するという事実そのものが、明確な政治的表明となる。1979年、The Specialsの中心人物Jerry Dammersが2 Toneというレーベルを設立した。名称は白と黒の二つの色を意味し、その意匠として白黒の市松模様が採用される。彼らは意識的に人種混成の編成を組み、ジャマイカ移民の第二世代と、地元の白人の若者が対等に演奏した。The Selecterでは黒人女性のPauline Blackが歌手を務め、The Beatにはジャマイカ出身の年配のサックス奏者が加わって、世代を超えた継承も実現している。Madnessはこのレーベルから最初の作品を出した後、独自の道を歩んで国民的な人気を得た。しかし彼らの公演は繰り返し妨害された。極右の思想を持つ集団が会場に押しかけ、ナチス式の敬礼をし、乱闘を起こしたのである。反人種差別を掲げた音楽が、まさにその標的となるという構図がそこにあった。1981年、The Specialsが発表した楽曲は、閉鎖された店と失われた仕事、そして街の廃墟を歌ったもので、発表と同時期にブリクストンやトクステスで大規模な暴動が発生した。この曲が全英一位にあった期間と暴動の時期が重なったことは、音楽が時代の空気を正確に捉えた稀有な例として記憶されている。皮肉なことに、その頂点においてバンドは内部の対立から分裂した。レーベルも1985年に活動を終えるが、その姿勢は現在まで参照され続けている。</p>
<h2>代表曲</h2><ul><li>Gangsters (The Specials)</li><li>One Step Beyond (Madness)</li><li>Mirror in the Bathroom (The Beat)</li></ul>
