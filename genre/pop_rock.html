<h1>Pop Rock（ポップロック）とは</h1>
<p>ロックの編成と音色を用いながら、専門的な作曲と録音の技巧を重視し、ロックの態度の強調は少ない音楽である。編成はギター、ベース、ドラムを基本とし、鍵盤が加わることも多く、ギターには適度な歪みがかけられる。しかし主にシングル（1曲単位</p>
<p>ロックの編成と音色を用いながら、専門的な作曲と録音の技巧を重視し、ロックの態度の強調は少ない音楽である。編成はギター、ベース、ドラムを基本とし、鍵盤が加わることも多く、ギターには適度な歪みがかけられる。しかし主にシングル（1曲単位で売られる形）の音楽として作られる。歌作りとスタジオ制作の両方で専門的な職人技が重んじられ、ロックの鋭さや態度とはあまり関係がない、と説明されることがある。ポップスにもロックにも共通して、歌の部分と繰り返し部分を持つ曲が大半である。和声は長調が中心だが、時に一時的な短調への傾きによって陰りが加えられる。リズムは複雑さを避けた素直な4拍子が多い。録音は聴きやすさを重んじて磨かれる。</p>
<h2>成り立ち</h2><p>この分野は1950年代後半に、通常のロックンロールの代替として登場したとされる。英国勢の進出（ブリティッシュ・インヴェイジョン）後の1967年ごろから、「pop」が「rock」と対立する語として次第に使われるようになった。ロックンロール以前、ポップスの楽曲は専業の作曲家が書き、歌手がそれを歌うという分業によって作られていた。その典型が、1885年ごろに始まったとされるニューヨークのTin Pan Alley（音楽出版社が集まった街）である。一方、Buddy Hollyは自作曲を書いた革新者とされ、1986年にロックの殿堂入りしている。ブリル・ビルディング方式は、1950年代後半から1960年代にかけて、ロックンロール第一波の後に業界が主導権を取り戻す動きだった。The Beatlesは重要な存在である。彼らは自ら作曲し、自ら演奏し、しかも専業の作家に匹敵する完成度の楽曲を書いた。この事実は、以後の大衆音楽に大きな影響を与えたとされる。1960年代後半から1970年代にかけて、この形式は広く用いられるようになった。Fleetwood MacやElton Johnが洗練された形を示し、1970年代末にはThe Policeが、レゲエの要素を取り込みながら簡潔な楽曲を書いた。1980年代にはU2が、大空間で機能する情感の豊かさを持ち込み（ポップロック的と評されることもある）、Bryan Adamsがその典型例の一つとされる。1990年代以降もこの様式は絶えず更新され、2000年代のColdplay。ポップスとロックの境界は流動的であり、Johan Fornäsが1995年に「ひとつの連続したジャンルの場」と捉えた説がある。この分野をめぐっては、長く続いた批評上の対立がある。すなわち、ロックの価値は誠実さと逸脱にあり、売れることを目指した楽曲は劣ったものだという見方が、1960〜70年代に基礎が築かれたロック批評に根づいており、2000年代以前の批評は圧倒的にロック主義的だったと一般に見なされている（異論もある）。この立場からは、この分野は妥協の産物として軽んじられる。しかしrockismという語は1981年にPete Wylieが造語したとされ、反ロック主義の批評は1980年代からあった。2004年のKelefa Sannehの記事が反ロック主義の議論を広く知らせ、その後Carl Wilsonの著書（2007年）なども経てpoptimismと呼ばれる潮流が育ち、この見方そのものが、白人男性のギターバンドを不当に特別扱いしてきたのではないかという批判にさらされた。作曲の技術と大衆に届く力を正当に評価すべきだという主張は批評の主流となったが、批判もあり、この分野の再評価はその文脈の中で進んでいる。</p>
