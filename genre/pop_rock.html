<h1>Pop Rock（ポップロック）とは</h1>
<p>ロックの編成と音色を用いながら、楽曲の作りをポップスの原則に従わせた音楽である。編成はギター、ベース、ドラム、鍵盤という標準的なロックバンドの形を取り、ギターには適度な歪みがかけられる。しかし構造の設計はポップスのもので、導入、歌</p>
<p>ロックの編成と音色を用いながら、楽曲の作りをポップスの原則に従わせた音楽である。編成はギター、ベース、ドラム、鍵盤という標準的なロックバンドの形を取り、ギターには適度な歪みがかけられる。しかし構造の設計はポップスのもので、導入、歌の部分、繰り返し部分、そして一度だけ現れる転換部という流れが厳密に配置され、曲の長さは3分から4分に収められる。最も重要なのは、繰り返し部分に置かれる印象的な旋律で、これが曲の存在理由となる。和声は長調が中心で、四つの和音を循環させる進行が多用されるが、時に一時的な短調への傾きによって陰りが加えられる。テンポは概ね110から140 BPM、リズムは複雑さを避けた素直な四拍子である。演奏面では、各奏者が技巧を誇示することは避けられ、全体が歌を支えることに徹する。ギターソロが置かれる場合も、歌の旋律をなぞる程度の短いものが多い。録音は聴きやすさを最優先に磨かれ、あらゆる音が明瞭に分離するよう整えられる。歌詞は恋愛、青春、日常の感慨を扱い、難解な比喩は避けられる。ロックの持つ身体性とポップスの持つ普遍性を両立させることが、一貫した目的である。</p>
<h2>成り立ち</h2><p>この分野の起点は1960年代のイギリスとアメリカにある。それ以前、ポップスの楽曲は専業の作曲家が書き、歌手がそれを歌うという分業によって作られていた。ニューヨークのビルの一室に作曲家が集まり、量産していた体制がその典型である。一方、ロックンロールのバンドは自分たちで演奏する代わりに、楽曲の完成度では専業の作家に及ばなかった。この二つを統合したのがThe Beatlesである。彼らは自ら作曲し、自ら演奏し、しかも専業の作家に匹敵する完成度の楽曲を書いた。この事実が、以後の大衆音楽の在り方を根本から変える。1960年代後半から1970年代にかけて、この形式は標準となった。Fleetwood MacやElton Johnが洗練された形を示し、1970年代末にはThe Policeが、レゲエの要素を取り込みながら簡潔な楽曲を書いた。1980年代にはU2が、大空間で機能する叙情性を持ち込み、Bryan Adamsが最も分かりやすい形を提示している。1990年代以降もこの様式は絶えず更新され、2000年代のColdplay、2010年代以降のポップスの多くが、この枠組みの中にある。この分野をめぐっては、長く続いた批評上の対立がある。すなわち、ロックの価値は誠実さと逸脱にあり、売れることを目指した楽曲は劣ったものだという見方が、1970年代以降の音楽批評を支配していた。この立場からは、この分野は妥協の産物として軽んじられる。しかし2000年代以降、この見方そのものが、白人男性のギターバンドを不当に特権化してきたのではないかという批判にさらされた。作曲の技術と大衆に届く力を正当に評価すべきだという主張は現在では広く共有されており、この分野の再評価はその文脈の中で進んでいる。</p>
