<h1>Pop Rock（ポップロック）とは</h1>
<p>ポップ・ロックは、ロックの編成と音色を用いながら、楽曲の作りをポップスの原則に従わせた音楽だ。 編成は、ギター、ベース、ドラムを基本とし、鍵盤が加わることも多い。ギターには適度な歪みがかけられる。 和声は長調が中心だ。四つの和音を</p>
<p>ポップ・ロックは、ロックの編成と音色を用いながら、楽曲の作りをポップスの原則に従わせた音楽だ。

編成は、ギター、ベース、ドラムを基本とし、鍵盤が加わることも多い。ギターには適度な歪みがかけられる。

和声は長調が中心だ。四つの和音を循環させる進行がよく使われるが、時に一時的な短調への傾きによって陰りが加えられる。リズムは、複雑さを避けた素直な4拍子が多い。

演奏面では、各奏者が技巧を誇示することは少なく、全体が歌を支える傾向が強い。ギターソロが置かれる場合も、歌の旋律をなぞる程度の短いものが多い。録音は聴きやすさを重んじて磨かれ、音が明瞭に分離するよう整えられることが多い。

歌詞は恋愛、青春、日常の感慨を扱うことが多く、難解な比喩は避けられる傾向がある。

構造は、ポップスにもロックにもほぼ共通する形をとる。導入、歌の部分、繰り返し部分、そして一度だけ現れる転換部（雰囲気を変える部分）という流れが配置されることが多く、曲の長さは短めにまとめられることが多い。重要な要素の一つは、繰り返し部分に置かれる印象的な旋律で、これが曲の核になることが多い。ロックの持つ体で感じる力とポップスの持つ普遍性を両立させることが、目指されることが多い。</p>
<h2>成り立ち</h2><p>この分野は1950年代後半に、通常のロックンロールの代替として登場したとされる。英国勢の進出（ブリティッシュ・インヴェイジョン）後の1967年ごろから、「pop」が「rock」と対立する語として次第に使われるようになった。

それ以前、ポップスの楽曲は専業の作曲家が書き、歌手がそれを歌うという分業によって作られていた。ロックンロール以前の専業作家制の典型は、Tin Pan Alley（1885年ごろから）である。ブリル・ビルディング方式は、ロックンロール第一波の後に業界が主導権を取り戻す動き（1950年代後半から1960年代）だった。一方、Buddy Hollyは自作曲を書いた革新者として、1986年にロックの殿堂入りしている。

The Beatlesは重要な存在である。彼らは自ら作曲し、自ら演奏し、しかも専業の作家に匹敵する完成度の楽曲を書いた。この事実は、以後の大衆音楽に大きな影響を与えたとされる。

1960年代後半から1970年代にかけて、この形式は広く用いられるようになった。Fleetwood MacやElton Johnが洗練された形を示し、1970年代末にはThe Policeが、レゲエの要素を取り込みながら簡潔な楽曲を書いた。1980年代のU2は、ポップロック的と評されることもあり、大空間で機能する情感の豊かさを持ち込んだ。Bryan Adamsが典型例の一つとされる。1990年代以降もこのスタイルは絶えず更新され、2000年代のColdplay。

ポップスとロックの境界は流動的だ。Johan Fornäsはrock/popを「ひとつの連続したジャンルの場」と捉える(1995年)。

この分野をめぐっては、長く続いた批評上の対立がある。すなわち、ロックの価値は誠実さと逸脱にあり、売れることを目指した楽曲は劣ったものだという見方がある。この見方は、1960〜70年代に基礎が築かれたロック批評では、2000年代以前には圧倒的だったと一般に見なされている(異論もある)。この立場からは、この分野は妥協の産物として軽んじられる。

しかしrockismという語は1981年にPete Wylieが造語したとされ、反ロック主義の批評は1980年代からあった。2004年のKelefa Sannehの記事(NYT)が反ロック主義の議論を一般に広く知らせ、その後Carl Wilsonの著書(2007年)なども経てpoptimismと呼ばれる流れが育った。この見方そのものが、白人男性のギターバンドを不当に特別扱いしてきたのではないかという批判にさらされた。作曲の技術と大衆に届く力を正当に評価すべきだという主張は、現在では批評の主流となったが、批判もある。この分野の再評価は、その文脈の中で進んでいる。</p>
