<h1>Post-Punk Revival（ポストパンクリバイバル）とは</h1>
<p>2000年前後に現れた、1970年代末から1980年代前半のポストパンクの語彙を意識的に再構成したロックである。編成はギター、ベース、ドラムという最小限が多いが、2人組(The White Stripes)や鍵盤を加えるバンド(I</p>
<p>2000年前後に現れた、1970年代末から1980年代前半のポストパンクの語彙を意識的に再構成したロックである。編成はギター、ベース、ドラムという最小限が多いが、2人組(The White Stripes)や鍵盤を加えるバンド(Interpol)もある。ギターは分厚い和音を掻き鳴らすことを避け、単音や2音だけの角張った短い音型を刻み、2本が別々の線を弾いて絡み合う。歪みは浅く、代わりに高音域を強調した硬く痩せた音色が選ばれる。この、脂肪を落とした音の質感が、1990年代のMTV系のニューメタルなどの商業的な音への反動とされる。ベースは8分音符で執拗に同じ音を刻むか、旋律的に大きく動き、しばしばギター以上に目立つ。ドラムは装飾を排し、直線的で硬い刻みを保つ。曲は短めで、間奏やギターソロは最小限に留められる。歌唱は感情を込めて絶叫せず、冷めた、あるいは投げやりな態度で歌われ、都会的な倦怠が演出される。歌詞は恋愛、夜遊び、孤立感、若者のやる気のなさを扱い、政治的な主張は前面に出ない。録音も過度に磨かず、生の演奏に近い粗さが意図的に残される。</p>
<h2>成り立ち</h2><p>この潮流は1990年代後半〜2000年代初頭に米国・欧州・豪州で始まり、2001年のニューヨークとデトロイトが商業的な突破口になった。同年、The Strokesが発表したイズ・ディス・イット(豪州盤は7月30日、英国盤は8月28日、米国CD盤は10月9日に延期)は、裕福な家庭の出身という背景を批判されながらも、その簡潔で隙のない楽曲によって、当時の音楽の潮流を一変させた。注目はテロ前から高まっており(2001年3月にRCAと契約)、9月の同時多発テロは米国盤の曲目と発売日に影響した。翌2002年、同じくニューヨークのInterpolが発表した作品は、1980年前後のイギリスのバンドを強く想起させる暗い響きを持ち、模倣だという批判と絶賛の双方を浴びた。Yeah Yeah Yeahsは、Karen Oの奔放な表現によってこの潮流に別の色を加える。並行してデトロイトのThe White Stripesが、ギターとドラムだけの2人組という極限まで削ぎ落とした編成で成功を収め、ガレージロックの再興と重なり合った。イギリス側の反応は速かった。音楽週刊誌が新しい熱狂を煽り、2004年にはグラスゴーのFranz Ferdinandが踊れるギターロックで成功を収め、ロンドンのBloc Partyは2005年のデビュー作『Silent Alarm』で緊張感のある音を示す。2006年にはシェフィールドのArctic Monkeysが、インターネット上で発売前の音源が広まった末に、デビュー作として英国史上最速でアルバムを売り上げるという事件を起こした(独立系レーベルDominoから発売)。これは音楽の宣伝の仕組みが変わりつつあることを示す象徴的な出来事だった。この潮流はしばしば批判される。過去の様式をなぞるだけで新しい発明がないという指摘、そして担い手の多くが中産階級以上の白人男性に偏っていたという指摘である。実際、2008年前後には流行としての勢いを失い、Arcade FireやDeath Cab for Cutieのような、より音楽的・感情的に複雑なインディーロックに追い抜かれた。それでも、簡潔なギターバンドという形式を21世紀に生き延びさせた功績は大きく、その後のインディーロックの基本形を用意した。</p>
