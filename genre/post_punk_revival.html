<h1>Post-Punk Revival（ポストパンクリバイバル）とは</h1>
<p>2000年前後に現れた、1970年代末から1980年代前半のポストパンクの語彙を意識的に再構成したロックである。編成はギター二本、ベース、ドラムという最小限に絞られ、鍵盤や管楽器はほとんど加えられない。ギターは分厚い和音を掻き鳴ら</p>
<p>2000年前後に現れた、1970年代末から1980年代前半のポストパンクの語彙を意識的に再構成したロックである。編成はギター二本、ベース、ドラムという最小限に絞られ、鍵盤や管楽器はほとんど加えられない。ギターは分厚い和音を掻き鳴らすことを避け、単音や二音だけの角ばった音型を刻み、二本が別々の線を弾いて絡み合う。歪みは浅く、代わりに高音域を強調した硬く痩せた音色が選ばれる。この、脂肪を落とした音の質感が、1990年代のグランジやニューメタルの分厚さへの明確な反動となっている。ベースは8分音符で執拗に同じ音を刻むか、旋律的に大きく動き、しばしばギター以上に目立つ。ドラムは装飾を排し、直線的で硬い刻みを保つ。テンポは概ね130から160 BPM、曲は2分半から3分半と短く、間奏やギターソロは最小限に留められる。歌唱は感情を込めて絶叫せず、冷めた、あるいは投げやりな態度で歌われ、都会的な倦怠が演出される。歌詞は恋愛、夜遊び、疎外、若者の無為を扱い、政治的な主張は前面に出ない。録音も過度に磨かず、生の演奏に近い粗さが意図的に残される。</p>
<h2>成り立ち</h2><p>2001年のニューヨークが震源である。同年7月、The Strokesが発表したイズ・ディス・イットは、裕福な家庭の出身という背景を批判されながらも、その簡潔で隙のない楽曲によって、当時の音楽の潮流を一変させた。同年9月の同時多発テロの後、ニューヨークという街そのものが物語性を帯び、この街のバンドへの国際的な注目が急激に高まったという事情も重なっている。翌2002年、同じくニューヨークのInterpolが発表した作品は、1980年前後のイギリスのバンドを強く想起させる暗い響きを持ち、模倣だという批判と絶賛の双方を浴びた。Yeah Yeah Yeahsは、Karen Oの奔放な表現によってこの潮流に別の色を加える。並行してデトロイトのThe White Stripesが、ギターとドラムだけの二人組という極限まで削ぎ落とした編成で成功を収め、ガレージロックの再興と重なり合った。イギリス側の反応は速かった。音楽週刊誌が新しい熱狂を煽り、2004年にはグラスゴーのFranz Ferdinandが踊れるギターロックで、ロンドンのBloc Partyが緊張感のある音で、それぞれ成功を収める。2006年にはシェフィールドのArctic Monkeysが、レコード会社を介さずインターネット上で音源が広まった末に、当時の史上最速でアルバムを売り上げるという事件を起こした。これは音楽の宣伝の仕組みが変わりつつあることを示す象徴的な出来事だった。この潮流はしばしば批判される。過去の様式をなぞるだけで新しい発明がないという指摘、そして担い手の多くが中産階級以上の白人男性に偏っていたという指摘である。実際、2008年前後には流行としての勢いを失い、シンセサイザーを用いる音楽へ主導権が移った。それでも、簡潔なギターバンドという形式を21世紀に生き延びさせた功績は大きく、その後のインディーロックの基本形を用意した。</p>
<h2>代表曲</h2><ul><li>Obstacle 1 (Interpol)</li><li>Munich (Editors)</li><li>Tear You Apart (She Wants Revenge)</li></ul>
