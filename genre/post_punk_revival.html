<h1>Post-Punk Revival（ポストパンクリバイバル）とは</h1>
<p>ポスト・パンク・リバイバルは、ガレージロックやニューウェーブ、ポストパンクの要素を取り入れて、2000年前後に現れたロックだ。 編成は、ギター、ベース、ドラムという最小限の形が多い。ただ、2人組(The White Stripes</p>
<p>ポスト・パンク・リバイバルは、ガレージロックやニューウェーブ、ポストパンクの要素を取り入れて、2000年前後に現れたロックだ。

編成は、ギター、ベース、ドラムという最小限の形が多い。ただ、2人組(The White Stripes)や、鍵盤を加えるバンド(Interpol)もある。

ギターは、分厚い和音を掻き鳴らすことを避ける。単音や2音だけの角張った短い音型を刻み、2本のギターが別々の線を弾いて絡み合う。歪みは浅く、代わりに高音域を強調した硬く痩せた音色が選ばれる。この、脂肪を落とした音の質感は、1990年代のMTV系のニューメタルなどの商業的な音への反動とされる。

ベースは、8分音符で執拗に同じ音を刻むか、旋律的に大きく動く。しばしばギター以上に目立つ。ドラムは装飾を排し、直線的で硬い刻みを保つ。

歌唱は、感情を込めて絶叫しない。冷めた、あるいは投げやりな態度で歌われ、都会的な倦怠が演出される。

歌詞は、恋愛、夜遊び、孤立感、若者のやる気のなさを扱う。政治色が薄い作品も多い。

曲は短めで、間奏やギターソロは最小限に留められる。録音も過度に磨かず、生の演奏に近い粗さが意図的に残される。</p>
<h2>成り立ち</h2><p>1990年代後半から2000年代初頭にかけて、この流れは米国・欧州・豪州で始まった。2001年には、ニューヨークとデトロイトが商業的な突破口になる。

その年、The Strokesがイズ・ディス・イットを発表した。豪州盤は7月30日、英国盤は8月27日の発売で、米国CD盤は10月9日に延期された。彼らは富裕層の子弟だと批判されながらも、簡潔で隙のない楽曲によって、一部の批評家が『転換点』と評価した。注目はテロ前から高まっており(2001年春にRCAと契約)、9月の同時多発テロは米国盤の曲目と発売日に影響した。

翌2002年には、同じくニューヨークのInterpolが作品を発表する。1980年前後のイギリスのバンドを強く想起させる暗い響きを持ち、Joy Divisionなどと比較された。Yeah Yeah Yeahsは、Karen Oの奔放な表現によって、この流れに別の色を加える。並行して、デトロイトのThe White Stripesが、ギター（とキーボード）、ドラムの2人組という極限まで削ぎ落とした編成で成功を収めた。ガレージロックの再興と重なり合う動きだった。

イギリス側の反応は速かった。音楽週刊誌が新しい熱狂を煽り、2004年にはグラスゴーのFranz Ferdinandが、踊れるギターロックで成功を収める。ロンドンのBloc Partyは、2005年のデビュー作『Silent Alarm』で、緊張感のある音を示した。

2006年には、シェフィールドのArctic Monkeysが現れる。インターネット上で発売前の音源が広まった末に、そのデビュー作は発売当時、英国史上最速のデビュー作となった(現在もバンドのデビュー作としては最速)。独立系レーベルDominoから発売された。これは音楽の宣伝の仕組みが変わりつつあることを示す代表的な出来事だった。

この流れは、しばしば批判される。過去のスタイルをなぞるだけで新しい発明がないという指摘、そして新味がない、似た音が多いという批判である。実際、当時の論評では、2008年前後には流行としての勢いを失い、Arcade FireやDeath Cab for Cutieのような、より音楽的・感情的に複雑なインディーロックに追い抜かれたと言われた。それでも、後続のギターバンドが商業的に成功する土壌を作ったと評価される。</p>
