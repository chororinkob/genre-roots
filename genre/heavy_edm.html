<h1>Heavy EDMとは</h1>
<p>EDMの中でも、音の重さと物理的な圧力を何よりも優先して作られた系統を指す、便宜的・総称的な呼び方だ。BPMは140前後(体感70前後)で、テンポよりも低音の重みが主題になる。 中心はベースの音づくりだ。複数の発振器を重ね、歪み、</p>
<p>EDMの中でも、音の重さと物理的な圧力を何よりも優先して作られた系統を指す、便宜的・総称的な呼び方だ。BPMは140前後(体感70前後)で、テンポよりも低音の重みが主題になる。

中心はベースの音づくりだ。複数の発振器を重ね、歪み、ビットクラッシャー、フォルマント・フィルターを段階的にかけていく。こうして、単なる低音ではなく、金属がきしむような、あるいは獣がうなるような、複雑な倍音を持つ音の塊を作る。

この音を8分音符や三連符で刻み、刻むたびに音色そのものを変える。そうすることで、ベースにリズムとメロディーの役割を同時に受け持たせる。和音はほぼ役割を持たず、反復的・ミニマルな構成が多い。

キックは短く鋭い。サブベースとぶつからないよう、音の帯域を切り分けて配置される。

歌が入る場合は、加工された叫びか、映画のような台詞の断片だ。

曲の上に重ねる音はほとんどない。ドロップでは、低音と打撃音以外のすべてが消えることも珍しくない。ビルドアップは長く重く、ライザーやスネアロール、フィルターで緊張を高める。

屋外フェスの大型サブウーファーの前で、胸や内臓が振動する体験そのものを目的として作られており、大型システムで聴いたときの身体的な体験を重視する。</p>
<h2>成り立ち</h2><p>北米で、ダブステップがアメリカ流に激しくなった「ブロステップ」の延長線上に生まれた。

重要な作品は、2010年10月にロサンゼルスのSkrillexが発表した、9曲入り、約44分のEP、Scary Monsters and Nice Spritesだ。米国でのダブステップ/ブロステップ人気を後押しした作品の一つである。ただし、Rusko、Excision、Datsikなどは、それ以前からブロステップ系の音を出していた。

この音を、音圧と規模の方向へ押し進めたのが、カナダのExcision（Jeff Abel）だ。彼はブリティッシュコロンビア州ケロウナを拠点に、PK Soundの大型システムを使ったツアーを行い、低音を体験させることを興行の中心に置いた。そのワット数は、2012年に10万ワット(X Tour)、2013年も10万ワット超(Execution Tour)、2014年に15万ワット、2019年に最大22.5万ワットだった。

2017年にオハイオ州で始まったフェスLost Landsは、この系統の年に一度の総会のような位置を占めている。同じ時期、Datsik、Downlink、そして後にはSvdden Death、Subtronicsといった作り手が、それぞれ異なるスタイルで活動した。

一方イギリスでは、2009年設立のレーベルNever Say Die Recordsが、ダブステップやトラップなど幅広いベース系を2010年代に多く発表した(2022年に新曲リリース停止を発表、2026年に再始動)。

2014年以降、制作の裾野を広げた主な道具の一つに、ソフトシンセSerum（Xfer Records、2014年発売）がある。Serumは波形を直接描く・編集する機能と、作り込みやすい操作画面で、複雑なベース音の制作を容易にした。

Lost Landsでは耳栓が配布されている。今も北米のフェス文化に深く根を張り、ヘッドライナー級の動員力を持つ。</p>
