<h1>Heavy EDMとは</h1>
<p>EDMの中でも、音の重さと物理的な圧力を最優先に設計された系統。BPMは表記上128前後のこともあれば、ハーフタイムで70前後に体感されることもあり、テンポより低音の質量が主題になる。中核はベース・デザインで、複数の発振器を重ね、</p>
<p>EDMの中でも、音の重さと物理的な圧力を最優先に設計された系統。BPMは表記上128前後のこともあれば、ハーフタイムで70前後に体感されることもあり、テンポより低音の質量が主題になる。中核はベース・デザインで、複数の発振器を重ね、歪み、ビットクラッシャー、フォルマント・フィルターを段階的にかけることで、単なる低音ではなく金属が軋むような、あるいは獣が唸るような複雑な倍音を持つ音塊を作る。この音を8分音符や三連符で刻み、そのたびに音色そのものを変化させることでリズムと旋律の役割を同時に担わせる。キックは短く鋭く、サブベースとぶつからないよう帯域を切り分けて配置される。上物はほとんど存在せず、ドロップでは低音と打撃音以外のすべてが消えることも珍しくない。ビルドアップは長く重く、下降するピッチと歪んだ金属音で圧を高める。和声はほぼ機能せず、単一の主音とその周辺の半音だけで構成されることが多い。歌が入る場合は加工された叫びか、映画的な台詞の断片。屋外フェスの大型サブウーファーの前で、胸と内臓が振動する体験そのものを目的として作られており、家庭用のスピーカーでは意図した効果がほとんど再現されない点が特徴である。</p>
<h2>成り立ち</h2><p>2010年代前半の北米で、ダブステップが米国流に過激化した「ブロステップ」の延長線上に成立した。決定的な起点は2010年、ロサンゼルスのSkrillex が発表したEPのScary Monsters and Nice Sprites で、ここで示された「ベース音そのものを一打ごとに変形させる」という発想が、その後のあらゆる重い系統の出発点となった。これを音圧と規模の方向へ推し進めたのがカナダのExcision（Jeff Abel）で、彼はブリティッシュコロンビア州ケロウナを拠点に、2010年代を通じて世界最大級の可搬型サウンドシステムを自ら設計・運用し、低音を体験させることを興行の中心に据えた。2017年にオハイオ州で開始したフェスLost Lands は、この系統の年次の総会のような位置を占めている。同時期、Datsik、Downlink、そして後にはSvdden Death、Subtronics といった作家が、それぞれ異なるベース設計の流儀を持ち込んだ。イギリス側ではNever Say Die Records が同種の音を継続的に発表し、大西洋を挟んだ交流が続いた。技術的な前提として、ソフトシンセSerum（Xfer Records、2014年発売）が波形を直接描いて音を作る操作性を提供したことが決定的で、これにより一打ごとに異なる音色を持つ複雑なベース列を、専門的な音響知識なしに構築できるようになった。制作者向けのプリセット販売とチュートリアル動画が産業として成立し、技法の共有速度が飛躍的に上がった。批判としては、音圧の追求が聴覚障害の危険を高めること、楽曲としての構造が単純化しすぎることが繰り返し指摘され、演奏会場では耳栓の配布が一般化した。現在も北米のフェス文化に深く根を張り、ヘッドライナー級の動員力を持つ独立した市場を形成している。</p>
