<h1>Hard Trap（ハードトラップ）とは</h1>
<p>ハード・トラップは、トラップのリズムの組み立てに、ハードダンス系の音圧と歪みを組み合わせたスタイルだ。 土台は、70から80 BPMという遅い拍の取り方だ。ただし、体感の速さはその倍で受け取られる。この二重の時間の感じ方が、トラッ</p>
<p>ハード・トラップは、トラップのリズムの組み立てに、ハードダンス系の音圧と歪みを組み合わせたスタイルだ。

土台は、70から80 BPMという遅い拍の取り方だ。ただし、体感の速さはその倍で受け取られる。この二重の時間の感じ方が、トラップ系の特徴である。低音は半分の速さで動く。一方でハイハットは、32分音符や六連符まで細かく刻まれ、高速に走る。このハイハットの細かい刻みはロールと呼ばれる。速さを段階的に変えて緊張を作る、主な手段になっている。

バスドラムは、808と呼ばれる機材の低音を極端に伸ばしたものだ。音程を持ったまま、数拍にわたって鳴り続ける。

ここに、このスタイルを独り立ちさせている要素が加わる。歪ませた合成音だ。ハードスタイルやダブステップから持ち込まれた、金属的に割れた音や、音程を急に上下させる唸る低音が、曲の山場に置かれる。全体の音量は極限まで圧縮され、いつも歪んだ状態に保たれる。

メロディーの要素は少ない。短い決まったフレーズのような音と、加工された声の切れ端が繰り返される。

曲は、緊張と解放の対比を強めた作りだ。静かな部分から一気に爆発する落差が、いちばんの聞かせどころになる。演奏の場は、大音量を前提とした屋内外の催しである。</p>
<h2>成り立ち</h2><p>始まりは1990年代のアトランタだ。トラップはこの街で生まれ、2012年頃にその要素がEDM(電子舞曲)へ流れ込んでいった。トラップは、もともと麻薬取引の場所を指す俗語だった。それが、アトランタの制作者たちが作り上げた、重い低音と細かいハイハットの型を指す言葉になった。

この型を広く知らしめたのが、レックス・ルーガーだ(先駆者にはDJ Toomp、Shawty Redd、Zaytovenらがいる)。彼が2010年にワカ・フロッカ・フレイムのために作った一連の曲は、FL Studioなどの制作ソフトで作られ、圧倒的な迫力があった。作る側のハードルが低かったことが、その後の急速な広がりにつながったとも言われる。

転機は2012年だ。ニューヨークの制作者バウアーが『ハーレム・シェイク』を発表した。この曲は翌年、動画共有サイトの流行と結びついて爆発的に広まり、全米チャートの一位に達した。2013年2月、BillboardはHot 100の計算にYouTubeの再生数を加えた。この変更のもとで、『ハーレム・シェイク』は初登場1位になった(YouTubeとの2年間の協議を経た変更だが、Billboard側は同曲の成功が実施を早めたと説明している)。この曲は、ヒップホップ色の薄いEDM寄りのトラップが広く知られるきっかけになった。同じころ、ディプロが主宰するマッド・ディーセントも、トラップ系の作品を多く手がけた(バウアー、イエロー・クロウ など)。

ここから、音圧と歪みを強めた方向がハード・トラップになった。一方、旋律と浮遊感を強めたフューチャー・ベースは、ほぼ同じ時期に、トラップやダブステップの影響を受けて生まれた別の系統である。ハードスタイルの影響をトラップに持ち込んだイエロー・クロウは、ハードスタイルの要素を取り入れた先行例の一つだ。

ハード・トラップは、ハードスタイルやハードコアの歪んだキックや荒い高音のリードを、トラップの構成に入れたサブジャンルだ。SAYMYNAME、Lit Lords、Skellismらが広めたとされる。ただし、成立の経緯に定説はない。ハード・トラップは、2012年頃に広がったEDMトラップの派生として語られる(呼び名が定着したのは2010年代半ばとされる)。

アトランタのトラップで定着した、遅い拍と高速のハイハットの組み合わせは、その後の主流のポピュラー音楽の広い範囲へ広がった。今では、特定のスタイルというより、共通の表現として扱われている。</p>
