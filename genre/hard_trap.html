<h1>Hard Trap（ハードトラップ）とは</h1>
<p>トラップのリズム構造に、ハードダンス系の音圧と歪みを組み合わせた様式である。土台となるのは一分間に70から80拍の遅い拍節だが、実際の体感速度はその倍で処理される。この二重の時間感覚がトラップ系の特徴で、低音が半分の速さで動く一方</p>
<p>トラップのリズム構造に、ハードダンス系の音圧と歪みを組み合わせた様式である。土台となるのは一分間に70から80拍の遅い拍節だが、実際の体感速度はその倍で処理される。この二重の時間感覚がトラップ系の特徴で、低音が半分の速さで動く一方、ハイハットは32分音符や六連符まで細分化されて高速に走る。このハイハットの細分化はロールと呼ばれ、速度を段階的に変えることで緊張を作る主要な手段となっている。バスドラムは八〇八と通称される機材の低音を極端に伸ばしたもので、音程を持ちながら数拍にわたって鳴り続ける。ここに加わるのが、この様式を独立させている要素、すなわち歪ませた合成音である。ハードスタイルやダブステップから持ち込まれた、金属的に割れた音や、音程を急激に上下させる唸る低音が、曲の山場に配置される。全体の音量は極限まで圧縮され、常時歪んだ状態に保たれる。構成は緊張と解放の対比を強調した作りで、静かな区間から一気に爆発する落差が最大の聞かせどころになる。旋律の要素は少なく、短い決め文句のような音型と、加工された声の断片が反復される。演奏の場は大音量を前提とした屋内外の催しである。</p>
<h2>成り立ち</h2><p>2010年前後、アメリカ南部で発展したトラップのリズムが、ヒップホップの外へ流出しはじめた。もともとは麻薬取引の場所を指す俗語であり、アトランタの制作者たちが作り上げた重い低音と細かいハイハットの型を指す言葉だった。この型を決定的な形にしたのがレックス・ルーガーで、彼が2010年にワカ・フロッカ・フレイムのために作った一連の曲は、安価な音楽制作ソフトの初期設定に近い音だけで組まれていたにもかかわらず、圧倒的な迫力を持っていた。制作の敷居が低かったことが、その後の急速な拡散の前提となる。転機は2012年である。ニューヨークの制作者バウアーが発表した『ハーレム・シェイク』が、翌年に動画共有サイトの流行と結びついて爆発的に広まり、全米チャートの一位に達した。この時、集計方法が再生回数を反映していなかったため、業界側が急遽ルールを変更するという事態も起きている。ヒップホップの文脈を完全に離れたトラップが、ここで一気に可視化された。同時期にはディプロが主宰するマッド・ディーセントが、この方向の作品を集中的に発表している。ここから複数の方向へ分岐した。旋律と浮遊感を強めた方向はフューチャー・ベースへ進み、音圧と歪みを強めた方向がハード・トラップになった。後者を推し進めたのは、既にハードスタイルやダブステップの語法を身につけていた欧州とアメリカの制作者たちで、カーネイジ、イエロー・クロウ、RLグライムらが中心となった。彼らはトラップの遅い拍節に、使い慣れた割れた合成音と極端な圧縮を持ち込み、既存のどちらとも違う音像を作った。2014年前後にはこの呼称が定着し、屋外の大規模な音楽祭において、ハードスタイルの区画と主流の電子舞曲の区画をつなぐ位置づけの音として機能するようになる。普及を後押ししたのが、無料または安価な音源集の大量流通である。誰もが同じ素材を同じ手順で使えるようになった結果、短期間に膨大な類似作が生まれ、様式としては早い段階で飽和したという評価も根強い。一方で、この時期に確立された遅い拍節と高速のハイハットの組み合わせは、その後の主流のポピュラー音楽の広い範囲へ浸透し、現在では特定の様式というより共通の語法として扱われている。</p>
