<h1>Hard Trap（ハードトラップ）とは</h1>
<p>トラップのリズムの組み立てに、ハードダンス系の音圧と歪みを組み合わせた様式である。土台となるのは一分間に70から80拍の遅い拍の取り方だが、実際の体感の速さはその倍で受け取られる。この二重の時間の感じ方がトラップ系の特徴で、低音が</p>
<p>トラップのリズムの組み立てに、ハードダンス系の音圧と歪みを組み合わせた様式である。土台となるのは一分間に70から80拍の遅い拍の取り方だが、実際の体感の速さはその倍で受け取られる。この二重の時間の感じ方がトラップ系の特徴で、低音が半分の速さで動く一方、ハイハットは32分音符や六連符まで細かく刻まれて高速に走る。このハイハットの細分化はロールと呼ばれ、速度を段階的に変えることで緊張を作る主な手段となっている。バスドラムは808と通称される機材の低音を極端に伸ばしたもので、音程を持ちながら数拍にわたって鳴り続ける。ここに加わるのが、この様式を独立させている要素、すなわち歪ませた合成音である。ハードスタイルやダブステップから持ち込まれた、金属的に割れた音や、音程を急激に上下させる唸る低音が、曲の山場に配置される。全体の音量は極限まで圧縮され、常時歪んだ状態に保たれる。構成は緊張と解放の対比を強調した作りで、静かな区間から一気に爆発する落差が最大の聞かせどころになる。メロディーの要素は少なく、短い決まったフレーズのような音と、加工された声の断片が反復される。演奏の場は大音量を前提とした屋内外の催しである。</p>
<h2>成り立ち</h2><p>トラップは1990年代にアトランタで生まれ、2012年前後にその要素がEDM(電子舞曲)へ流れ込んでいった。もともとは麻薬取引の場所を指す俗語であり、アトランタの制作者たちが作り上げた重い低音と細かいハイハットの型を指す言葉だった。この型を広く知らしめたのがレックス・ルーガー(先駆者にはDJ Toomp、Shawty Redd、Zaytovenらがいる)で、彼が2010年にワカ・フロッカ・フレイムのために作った一連の曲は、FL Studioなどの制作ソフトで作られ、圧倒的な迫力があった。作る側のハードルが低かったことが、その後の急速な広がりの前提となる。転機は2012年である。ニューヨークの制作者バウアーが発表した『ハーレム・シェイク』が、翌年に動画共有サイトの流行と結びついて爆発的に広まり、全米チャートの一位に達した。2013年2月、BillboardがHot 100の算出にYouTubeの再生数を加え、この変更のもとで『ハーレム・シェイク』が初登場1位になった(YouTubeとの2年間の協議を経た変更で、同曲の成功が後押ししたかどうかは証言が分かれる)。ヒップホップの文脈を完全に離れたトラップが、ここで一気に可視化された。同時期にはディプロが主宰するマッド・ディーセントが、この方向の作品を集中的に発表している。ここから複数の方向へ分岐した。旋律と浮遊感を強めた方向はフューチャー・ベースへ進み、音圧と歪みを強めた方向がハード・トラップになった。後者を推し進めたのは、ハードスタイルの影響をトラップに持ち込んだイエロー・クロウなどで、後のハード・トラップの土台となったとされる。ハード・トラップは、ハードスタイルやハードコアの歪んだキックや荒い高音のリードをトラップの構成に入れた下位ジャンルで、SAYMYNAME、Lit Lords、Skellismらが広めたとされる。ただし成立の経緯に定説はない。ハード・トラップは、2012〜2013年に広がったEDMトラップの派生として語られる(呼称の確立時期は確認できない)。普及を後押ししたのが、無料または安価な音源集の大量流通である。誰もが同じ素材を同じ手順で使えるようになった結果、短期間に膨大な類似作が生まれ、様式としては早い段階で飽和したという評価も根強い。一方で、この時期に確立された遅い拍節と高速のハイハットの組み合わせは、その後の主流のポピュラー音楽の広い範囲へ浸透し、現在では特定の様式というより共通の表現として扱われている。</p>
