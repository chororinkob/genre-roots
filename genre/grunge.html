<h1>Grunge（グランジ）とは</h1>
<p>1980年代末の米国北西部で生まれた、ヘヴィメタルの重さとパンクの単純さを混ぜたロック。BPMは90〜140と中庸で、ドラムは装飾を排した重い直線的な叩き方をする。ギターの音色が最大の識別点で、Big MuffやProCo RAT</p>
<p>1980年代末の米国北西部で生まれた、ヘヴィメタルの重さとパンクの単純さを混ぜたロック。BPMは90〜140と中庸で、ドラムは装飾を排した重い直線的な叩き方をする。ギターの音色が最大の識別点で、Big MuffやProCo RATといったファズ系のエフェクターを通した、輪郭のぼやけた砂のような歪みが用いられる。メタルのように高音域を切り詰めた鋭い音ではなく、中音域が団子状に膨らんだ、意図的に洗練を欠いた音である。奏法はパワー・コードの繰り返しが中心で、速弾きのソロはほぼ排され、ソロを弾く場合も旋律的というより騒音に近い。和声は短調のペンタトニックに加え、増四度や短二度など不安定な音程をリフに組み込むことが多い。構成はPixiesから受け継いだ、静かなヴァースから爆発的なコーラスへ落差をつける型が定番。歌唱は喉を潰すような濁った発声で、絶叫と呟きの落差が激しい。歌詞は自己嫌悪、疎外、依存、無力感を扱い、勝利や誇示を語らない。衣服は古着のフランネルシャツと破れたジーンズで、これは貧しさとロック産業の華美への拒否を同時に示していた。</p>
<h2>成り立ち</h2><p>1980年代半ば、米国ワシントン州シアトルとその周辺で形成された。決定的な役割を果たしたのが1986年にBruce PavittとJonathan Ponemanが設立した独立系レーベルSub Popで、彼らはGreen River、Soundgarden、Mudhoney、そしてNirvanaを世に出した。Sub Popは資金難の中で、地域の音楽を一つの様式として売り込む戦略を採り、写真家Charles Petersonによる粒子の粗いライブ写真と、限定盤のシングルを毎月配送する会員制度によって、シーンそのものを商品として提示した。音の原型はGreen Riverが1984年から1987年にかけて作ったもので、このバンドの解散後、Mark ArmはMudhoneyを、Stone GossardとJeff AmentはMother Love Bone、次いでPearl Jamを結成した。Mother Love Boneの歌手Andrew Woodは1990年にヘロインの過剰摂取で死去しており、この出来事はシーンの薬物問題を早くから象徴していた。爆発的な転機は1991年で、NirvanaがアルバムNevermindを発表、シングルSmells Like Teen Spiritがミュージック・ビデオを通じて爆発的に広まり、翌1992年1月にはMichael JacksonのDangerousを全米チャートの首位から引きずり下ろした。同時期にPearl JamのTen、SoundgardenのBadmotorfinger、Alice in ChainsのDirtが続き、シアトルは一夜にして音楽産業の中心地となった。しかしこの成功は当事者を追い詰めた。Kurt Cobainは商業的成功と自らの理念の矛盾、慢性的な胃痛、ヘロイン依存に苦しみ、1994年4月にシアトルの自宅で27歳で自ら命を絶った。その後もAlice in ChainsのLayne Staleyが2002年に、Soundgardenのボーカル Chris Cornellが2017年に亡くなっている。ジャンルとしては1990年代半ばに急速に商業化して形骸化し、後続の模倣的なバンド群はポスト・グランジと呼ばれて区別されることになった。</p>
<h2>代表曲</h2><ul><li>Lithium (Nirvana)</li><li>Black Hole Sun（Soundgarden）</li><li>Alive（Pearl Jam）</li><li>Man in the Box（Alice in Chains）</li><li>Touch Me I'm Sick（Mudhoney）</li></ul>
