<h1>Grunge（グランジ）とは</h1>
<p>1980年代半ばの米国北西部で生まれた、ヘヴィメタルの重さとパンクの単純さを混ぜたロック。テンポはパンクより遅く、泥くさい速度で、ドラムセットは、1980年代のポップ・メタルの巨大なセットに比べて小さめだった。ギターの音色は主要な</p>
<p>1980年代半ばの米国北西部で生まれた、ヘヴィメタルの重さとパンクの単純さを混ぜたロック。テンポはパンクより遅く、泥くさい速度で、ドラムセットは、1980年代のポップ・メタルの巨大なセットに比べて小さめだった。ギターの音色は主要な特徴の一つで、Big Muff（ファズ＝音を強く歪ませる）やBoss DS-1・DS-2（ディストーション＝音の歪み）といったエフェクターを通した、輪郭のぼやけた砂のような歪みが用いられる。中音域が厚く高音域を抑えた、意図的に洗練を欠いた濁った歪みである。メタルがアンプの歪みとペダルを併用するのに対し、歪みの大部分をペダルで作る点が異なる。奏法はパワー・コード（二つの音だけの力強い和音）の繰り返しが中心で、速弾きのソロはほぼ排され、ソロを弾く場合も、旋律的でブルース由来のものが多い。和声（コードの響き）はパワー・コード中心で、パンクよりも不協和な響きが使われる。旋律や即興にはブルース系の音階も使われる。構成では、NirvanaがPixiesの静と動の落差（静かなヴァース（歌の節）から爆発的なコーラス（繰り返しの部分）へ）を取り入れた。歌唱は喉を潰すような濁った発声で、絶叫と呟きの落差が激しい。歌詞は自己嫌悪、孤立感、依存、無力感を扱い、勝利や誇示を語らない。衣服は古着のフランネルシャツと破れたジーンズで、安価で丈夫な実用品が、そのまま1980年代の派手な美意識とは逆の考え方になった。</p>
<h2>成り立ち</h2><p>1980年代半ば、米国ワシントン州シアトルとその周辺で形成された。決定的な役割を果たしたのが1986年にBruce Pavittが創設し、1988年にJonathan Ponemanとともに法人化した独立系レーベルSub Popで、彼らはMudhoneyとNirvanaを世に出し、Green RiverとSoundgardenも早い時期に作品を出した。Sub Popは資金難の中で、地域の音楽を一つの様式として売り込む戦略を採り、写真家Charles Petersonによる粒子の粗いライブ写真と、限定盤のシングルを毎月配送する会員制度によって、この音楽の世界そのものを商品として示した。Green Riverは最初期のグランジ・バンドの一つで、1985年のEP『Come on Down』が最初のグランジ作品とされることが多く（Melvinsなども原型に大きく寄与した）、このバンドの解散後、Mark ArmはMudhoneyを、Stone GossardとJeff AmentはMother Love Bone、次いでPearl Jamを結成した。Mother Love Boneの歌手Andrew Woodは1990年にヘロインの過剰摂取で死去しており、この出来事はシーンの薬物問題を早くから象徴していた。爆発的な転機は1991年で、NirvanaがアルバムNevermindを発表、シングルSmells Like Teen Spiritがミュージック・ビデオを通じて爆発的に広まり、翌1992年1月にはMichael JacksonのDangerousを全米チャートの首位から引きずり下ろした。同じ1991年にPearl JamのTen（8月）とSoundgardenのBadmotorfinger（10月）も発売され、翌1992年にはAlice in ChainsのDirtが加わり、シアトルの音楽が全米と世界の主流の注目を集めた。しかしこの成功は当事者を追い詰めた。Kurt Cobainは商業的成功と自らの理念の矛盾、慢性的な胃痛、ヘロイン依存に苦しみ、1994年4月にシアトルの自宅で27歳で自ら命を絶った。その後もAlice in ChainsのLayne Staleyが2002年に、Soundgardenのボーカル Chris Cornellが2017年に亡くなっている。ジャンルとしては1990年代半ばに急速に商業化して中身を失い、後続の模倣的なバンド群はポスト・グランジと呼ばれて区別されることになった。</p>
