<h1>Grunge（グランジ）とは</h1>
<p>グランジは、1980年代半ばの米国北西部で生まれたロックだ。ヘヴィメタルの重さと、パンクの単純さを混ぜ合わせた音楽である。 主役はギターの音色で、これは主要な特徴の一つだ。Big Muff（ファズ＝音を強く歪ませる）や、Cobai</p>
<p>グランジは、1980年代半ばの米国北西部で生まれたロックだ。ヘヴィメタルの重さと、パンクの単純さを混ぜ合わせた音楽である。

主役はギターの音色で、これは主要な特徴の一つだ。Big Muff（ファズ＝音を強く歪ませる）や、Cobainが特に使ったBoss DS-1/DS-2（ディストーション＝音の歪み）といったエフェクターを通して、輪郭のぼやけた砂のような歪みが作られる。中音域が厚く、高音域は抑えられている。意図的に洗練を欠いた、濁った歪みである。メタルはアンプの歪みとペダルを併用するが、グランジは歪みの大部分をペダルで作る点が異なる。

奏法の中心は、パワー・コード（二つの音だけの力強い和音）の繰り返しだ。和声（コードの響き）はパワーコード中心で、より不協和。旋律や即興にはブルース系の音階も使われる。速弾きのソロはほぼ排される。ソロを弾く場合も、比較的短く旋律的でブルース由来のものが多い。

テンポはパンクより遅く、泥くさい速度だ。ドラムは、1980年代ポップ・メタルの巨大なセットに比べて比較的小さいセットを使う。Soundgardenは6/4、15/8、7/8と4/4の交替など、変則拍子を多用した。

歌唱は喉を潰すような濁った発声が多く、絶叫と呟きの落差が激しい。歌詞は自己嫌悪、孤立感、依存、無力感を扱うことが多く、勝利や誇示はあまり語らない。

曲の組み立てでは、NirvanaがPixiesの静と動の落差を取り入れた。静かなヴァース（歌の節）から、爆発的なコーラス（繰り返しの部分）へ移る形である。

衣服は、古着のフランネルシャツと破れたジーンズだ。安価で丈夫な実用品が、そのまま1980年代の派手な美意識とは逆の考え方になった。</p>
<h2>成り立ち</h2><p>舞台は、1980年代半ばの米国ワシントン州のシアトルと、オリンピアなど周辺の都市だ。

決定的な役割を果たしたのが、独立系レーベルSub Popである。1986年にBruce Pavittが始め、1987年にJonathan Ponemanが出資し、1988年4月に法人化した。彼らはMudhoneyとNirvanaを世に出し、Green RiverとSoundgardenも早い時期に作品を出した。Sub Popは資金難の中で、地域の音楽を一つのスタイルとして売り込む戦略を採った。写真家Charles Petersonによる粒子の粗いライブ写真と、限定盤のシングルを毎月配送する会員制度によって、この音楽の世界そのものを商品として示した。

音楽の側では、Green Riverは最初期のグランジ・バンドの一つだ。1985年のEP『Come on Down』が、最初のグランジ作品とされることが多い。Melvinsなども、原型に大きく寄与した。Green Riverの解散後、Mark ArmはMudhoneyを結成した。Stone GossardとJeff Amentは、Mother Love Bone、次いでPearl Jamを結成した。Mother Love Boneの歌手Andrew Woodは、1990年にヘロインの過剰摂取で死去した。この出来事は、シーンの薬物問題を早くから示していたと見られる。

爆発的な転機は1991年だった。NirvanaがアルバムNevermindを発表し、シングルSmells Like Teen Spiritがミュージック・ビデオを通じて爆発的に広まった。翌1992年1月には、Michael JacksonのDangerousを全米チャートの首位から引きずり下ろした。同じ1991年に、Pearl JamのTen（8月）とSoundgardenのBadmotorfinger（10月）も発売された。翌1992年には、Alice in ChainsのDirtが加わった。こうして、シアトルの音楽は、1991年のNevermindの成功で、全米・世界の主流の注目を集めた。

しかし、この成功は当事者を追い詰めた。Kurt Cobainは、商業的成功と自らの理念の矛盾、慢性的な胃痛、ヘロイン依存に苦しんだ。1994年4月、シアトルの自宅で27歳で自ら命を絶った。その後も、Alice in ChainsのLayne Staleyが2002年に、Soundgardenのボーカル Chris Cornellが2017年に亡くなっている。

ジャンルとしては、1993年末から1994年にかけて勢いが不安定になり、1990年代後半にはポスト・グランジに取って代わられた。ポスト・グランジは、もとは1990年代半ばの模倣的なバンドへの蔑称だった。のちに、より商業的で穏やかな音を指す名前になった。</p>
