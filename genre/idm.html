<h1>Intelligent Dance Music（アイディーエム）とは</h1>
<p>踊るよりも家で聴くのに向くとされる、個性的な実験を特徴とする電子音楽だ。共通の音楽的特徴は特定しにくいが、代表的な作品には次のような傾向が見られる。 土台にはテクノやブレイクビーツの手法がある。そのうえで、ポピュラー音楽の馴染みの</p>
<p>踊るよりも家で聴くのに向くとされる、個性的な実験を特徴とする電子音楽だ。共通の音楽的特徴は特定しにくいが、代表的な作品には次のような傾向が見られる。

土台にはテクノやブレイクビーツの手法がある。そのうえで、ポピュラー音楽の馴染みのある構造（主に2拍子系のリズム、反復、従来的な形式）に、リズムと音色の複雑さを組み合わせている。

リズムは最も特徴的な部分だ。サンプリングした素材（ブレイクなど）やドラムマシンの音を、スライス等で細かく加工し、プログラミングで並べ直す。作品によっては、変拍子（定型から外れた拍子）や、拍の感覚を失わせる配置も使われる。

音色では、機械の内部で起きる誤作動を思わせる途切れ途切れの雑音、粒のように細かく分解された音、ごく短い断片が高速で連なる質感が好まれる。

しかし、この分野を単なる実験と分けているのは、旋律と和声（コードの響き）の情感である。初期の作品では、複雑で冷たいリズムの上に、しばしばとても美しく、郷愁（懐かしさ）を帯びた旋律が置かれる。この落差が、独特の感情を生む。調（または和音の性格）は、長調・短調（長三和音・短三和音）の間で揺れる。作品によっては、意図的に音程をずらして、不安定にされることもある。

曲は作品によっては、はっきりした起承転結を持たず、要素が変わり続ける。テンポが曲の途中で変わる作品もある。低音の役割は作品ごとに違い、クラブ向けの低音を持つ作品もある。</p>
<h2>成り立ち</h2><p>1990年代前半のイギリスでは、ハードコア系レイヴ音楽が市場にあふれていた。しかし同じころ、その音楽を作っていた制作者の一部は、踊る場での役割から離れた作品を作り始めていた。

1989年にシェフィールドで設立されたWarpは、当初、シェフィールド発のブリープ・テクノ（Forgemasters、LFO、Sweet Exorcistなど）を出していた。レイヴ音楽は、あえてリリースしなかった。そして1992年、家庭で聴くための電子音楽とうたった編集盤を発表する。この作品の題名が、後の呼び名の由来になった可能性が高いとされる。

1993年には、この種の音楽を語り合うためのインターネット上のメーリングリスト（電子メールで議論する集まり）が作られた。その名前にインテリジェント・ダンス・ミュージックという語が使われたことで、呼び名が定着する。

ただし、この語は最初から大きな問題を抱えていた。知的なダンス音楽という言い方は、どうしても、それ以外のダンス音楽は知的でない、という意味を含んでしまう。ハウスが黒人・ラテン系・ゲイのクラブ文化から、テクノがデトロイトの黒人音楽家たちから生まれた歴史がある。IDMの担い手が白人男性に偏っていたこともあり、この名称は批判されている。

実際、Aphex TwinやAutechreのSean Boothは、この呼び名に否定的な発言をした。Paradinasは「主に北米で使われる語」と述べた。Richard D. Jamesは、1997年に、この呼び名を笑い、自分はジャンル名を使わず、好きか嫌いかを言うだけだと述べている。

作り手の顔ぶれは多彩だった。Aphex Twinは、非常に多くの名義で作品を発表した。Autechreは、作品を重ねるごとに構造を抽象的にしていった。後年はMaxなどを用いたソフトウェア／生成的手法を取り入れた（特に『Confield』期）。ただし、作品ごとに手法は異なる。Squarepusherは、生のベース演奏と、極端に細かく刻んだドラムンベースを結び付けた。Boards of Canadaは、劣化したテープの質感と不穏な旋律で、記憶と郷愁をテーマにした独自の世界を築いた。RephlexやSkam、Planet Muといった小さなレーベルが、この領域を支えた。

呼び名そのものは嫌われながらも、使われ続けている。一方で、ジャングル／ハードコアの手法を取り込んで発展させた、リズムを素材として自由に加工するという発想は、後に続く電子音楽に影響を与えたとされる。</p>
<h2>代表曲</h2><ul><li>Windowlicker (Aphex Twin)</li><li>Roygbiv (Boards of Canada)</li><li>Beep Street (Squarepusher)</li><li>Alberto Balsalm (Aphex Twin)</li><li>Flim (Aphex Twin)</li><li>Bike (Autechre)</li><li>Telephasic Workshop (Boards of Canada)</li><li>Flutter (Autechre)</li><li>Gyroscope (Boards of Canada)</li><li>Polynomial-C (Aphex Twin)</li><li>Brace Yourself Jason (µ-Ziq)</li><li>Vordhosbn (Aphex Twin)</li></ul>
