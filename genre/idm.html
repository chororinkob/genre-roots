<h1>Intelligent Dance Music（アイディーエム）とは</h1>
<p>踊るための機能を持たない、聴取に特化した実験的な電子音楽である。土台にはテクノやブレイクビーツの語法があるが、その全ての要素が意図的に不安定にされている。リズムは最も特徴的な部分で、生ドラムの録音を極めて細かく切り刻み、通常ではあ</p>
<p>踊るための機能を持たない、聴取に特化した実験的な電子音楽である。土台にはテクノやブレイクビーツの語法があるが、その全ての要素が意図的に不安定にされている。リズムは最も特徴的な部分で、生ドラムの録音を極めて細かく切り刻み、通常ではありえない位置へ再配置することで、人間には演奏不可能な複雑さが作られる。拍子も4/4に留まらず、変拍子や、拍節の感覚を失わせる配置が用いられる。音色の面では、機械の内部で起きる誤動作を思わせる断続的な雑音、粒子状に分解された音、そして極めて短い断片が高速で連なる質感が好まれる。しかしこの分野を単なる実験と区別するのが、旋律と和声の情感である。複雑で冷たいリズムの上に、しばしば極めて美しく郷愁を帯びた旋律が置かれ、この落差が独特の感情を生む。和音は長調と短調の間で揺れ、意図的に音程をずらして不安定にされることも多い。曲は5分から10分程度で、明確な起承転結を持たず、要素が変質し続ける。テンポは一定せず、曲中で変化する。低音は身体を揺らすためではなく、音響的な広がりのために配置される。</p>
<h2>成り立ち</h2><p>1990年代前半のイギリスでは、レイヴ文化が最盛期を迎えていた。しかし同時に、その音楽を作っていた制作者の一部は、踊り場での機能から離れた作品を作り始めていた。1989年にシェフィールドで設立されたWarpは、当初はレイヴ向けの作品を出していたが、1992年、家庭で聴くための電子音楽と銘打った編集盤を発表する。この作品の題名が、後の呼称の由来となった。1993年、この種の音楽を議論するための電子的な通信の集まりが作られ、その名称としてインテリジェント・ダンス・ミュージックという語が用いられたことで、呼称が定着する。ただしこの語は当初から大きな問題を抱えていた。知的なダンス音楽という表現は、必然的に、それ以外のダンス音楽が知的でないという含意を持つ。この含意は、ハウスやテクノが黒人と性的少数者の共同体から生まれたという歴史を踏まえれば、極めて無神経なものである。実際、この分野の作り手のほぼ全員がこの呼称を拒絶してきた。Richard D. Jamesは公然とこれを嘲笑し、自らは単にテクノを作っていると述べている。作り手の顔ぶれは多彩だった。Aphex Twinは膨大な数の名義で作品を発表し、Autechreは作品を重ねるごとに構造を抽象化させ、後年には作曲を機械の生成過程に委ねる方向へ進んだ。Squarepusherは生のベース演奏と極端に細分化されたドラムンベースを結合させ、Boards of Canadaは劣化したテープの質感と不穏な旋律によって、記憶と郷愁を主題とする独自の世界を築いた。RephlexやSkam、Planet Muといった小規模なレーベルがこの領域を支えた。呼称そのものは2000年代以降ほとんど使われなくなったが、そこで開発された、リズムを素材として自由に加工するという発想は、現在の電子音楽とポップスの全域に浸透している。</p>
<h2>代表曲</h2><ul><li>Windowlicker (Aphex Twin)</li><li>Roygbiv (Boards of Canada)</li><li>Flutter (Autechre)</li></ul>
