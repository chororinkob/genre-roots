<h1>Trot（トロット）とは</h1>
<p>トロットは韓国の大衆歌謡ジャンルであり、独特の「ドン・タン」リズムと哀愁を帯びたメロディーが最大の特徴だ。拍子は基本的に4拍子で、テンポはおよそ60〜90BPMの中庸なものが多く、2拍目と4拍目に強いアクセントが置かれる二拍子的な</p>
<p>トロットは韓国の大衆歌謡ジャンルであり、独特の「ドン・タン」リズムと哀愁を帯びたメロディーが最大の特徴だ。拍子は基本的に4拍子で、テンポはおよそ60〜90BPMの中庸なものが多く、2拍目と4拍目に強いアクセントが置かれる二拍子的なグルーヴが骨格を形成する。このリズムパターンは「ドン・タン」と呼ばれ、韓国語でそのまま擬音語として定着している。

メロディーは短調を基調とし、日本の演歌と共通するヨナ抜き音階（4度と7度を省いた5音音階）が多用される一方、韓国固有の民謡音階も混在する。和声進行はシンプルなⅠ-Ⅳ-Ⅴ-Ⅰが中心で、転調よりも同一調内での情感の積み重ねを重視する。

使用楽器は時代によって変化してきた。初期はアコーディオン、バイオリン、ギター、ドラムセットによる小編成バンドが主流だった。1970〜80年代にはエレキギター、エレクトリックベース、シンセサイザーが加わり、音が厚くなった。現代のトロットではオーケストラ編成のストリングスアレンジが施されることも多く、ヴァイオリンやチェロが甘く切ない旋律を彩る。

ボーカルスタイルは「コルリム（꺾기）」と呼ばれる音の折り返し技法が核心だ。これは音程を一瞬上に跳ね上げてから下に折り返す装飾音であり、演歌のこぶしに相当する。また「ビブラート」も深くかけられ、感情の揺れを声で表現する。歌詞の主題は失恋、離別、望郷、貧困からの立ち上がりなど、庶民の哀感と生命力を描くものが圧倒的に多い。

演歌と比較すると、トロットはよりリズムが軽快でダンサブルな側面を持ち、特に近年の「ニュートロット」ではEDM的なビートやラップパートを取り入れた楽曲も登場している。トロットが実際に鳴っている場所としては、韓国の中高年向けのナイトクラブ「カラオケバー」、地方の祭り、テレビのオーディション番組、そして家族が集まる名節（チュソクや旧正月）の宴席などが挙げられる。</p>
<h2>成り立ち</h2><p>トロットの歴史は1920年代の日本統治期の朝鮮半島にさかのぼる。当時、日本のレコード会社が朝鮮に進出し、日本の流行歌（はやりうた）のスタイルを持ち込んだ。1926年に尹心悳（ユン・シムドク）が吹き込んだ「死の礼讃（사의 찬미）」は、朝鮮で初めて商業的に成功したレコードとして記録されており、この時期の大衆音楽の出発点として位置づけられる。

1930年代になると、李愛利秀（イ・エリス）や南仁樹（ナム・インス）といった歌手が登場し、「목포의 눈물（木浦の涙）」（1935年、李蘭影〔イ・ナニョン〕歌唱）が空前の大ヒットを記録した。この曲は植民地支配下の朝鮮民衆の悲哀を歌ったものとして解釈され、単なる流行歌を超えた民族的感情の受け皿となった。コロムビアレコード朝鮮支社やビクターレコード朝鮮支社がこの時期の主要なレーベルであり、日本資本のインフラが朝鮮の大衆音楽産業を形成した。

解放後の1945年以降、トロットは「倭色歌謡（왜색가요）」として批判にさらされた。日本的な音楽様式を引き継いでいるとして、韓国政府や民族主義者から排除の対象とされたのだ。しかし民衆の間での人気は衰えず、朝鮮戦争（1950〜53年）の混乱期にも慰問公演などを通じて広く歌われ続けた。この時期に活躍したキム・ジョング（金貞九）は「눈물 젖은 두만강（涙に濡れた豆満江）」（1938年）で戦争と離散の悲劇を歌い、国民的歌手としての地位を確立した。

1960〜70年代はトロットの黄金期だ。李美子（イ・ミジャ）は「동백 아가씨（椿の娘）」（1964年）で圧倒的な人気を博したが、同曲は1965年に複数の放送局が倭色を理由に出演禁止決議を行い、その後1968年2月に正式な全面放送禁止処分を受けた。この禁止は1987年まで続き、韓国の文化検閲の象徴的事件として語り継がれている。一方、羅勲兒（ナ・フナ）は1970年代から80年代にかけて「무시로（いつでも）」「사랑（愛）」などのヒットを連発し、「トロットの皇帝」と呼ばれるようになった。彼の低音の魅力と圧倒的な舞台存在感は、後続世代の男性歌手の規範となった。

1990年代以降、Kポップの台頭とともにトロットは「おじさん・おばさんの音楽」として若者から敬遠されるようになり、メインストリームから後退した。しかし2000年代後半から「ニュートロット（뉴트로트）」と呼ばれる復興の波が起きる。林英雄（イム・ヨンウン）が2020年のオーディション番組「미스터트롯（ミスタートロット）」で優勝し、若い世代を含む幅広い層に支持されたことで、トロットは再びメインストリームに返り咲いた。同番組の決勝戦は視聴率35%を超え、総合編成チャンネル（종편）史上最高記録を樹立した。

トロットは演歌との関係において常に論争の的であり続けている。両者が共通の音楽的語法を持つことは否定できないが、韓国の研究者の多くは「トロットは朝鮮の民謡的要素と西洋音楽が融合した独自の産物であり、演歌の模倣ではない」と主張する。この議論は音楽学的な問題にとどまらず、植民地主義と文化的アイデンティティをめぐる政治的問題と深く絡み合っている。現在もトロットは韓国の大衆文化において重要な位置を占め、Kポップとの融合を模索しながら進化を続けている。</p>
