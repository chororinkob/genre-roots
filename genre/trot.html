<h1>Trot（トロット）とは</h1>
<p>トロットは、韓国の大衆歌謡のジャンルだ。独特の2拍子のリズムと、哀愁を帯びたメロディーが最大の特徴である。 使う楽器は、時代とともに変わってきた。1960年代には、ビッグバンドやコンボによる管弦楽の伴奏が定着していた。1980年代</p>
<p>トロットは、韓国の大衆歌謡のジャンルだ。独特の2拍子のリズムと、哀愁を帯びたメロディーが最大の特徴である。

使う楽器は、時代とともに変わってきた。1960年代には、ビッグバンドやコンボによる管弦楽の伴奏が定着していた。1980年代には、電子楽器で伴奏する「ポンチャク・メドレー」が流行した。現代のトロットでは、オーケストラ編成のストリングスアレンジがよく加えられる。ヴァイオリンやチェロが、甘く切ない旋律を彩る。

メロディーは短調が土台だ。日本の演歌と共通するヨナ抜き音階（4度と7度を省いた5音音階）は、主に戦前から1970年代頃までよく使われた。

拍子は基本的に4分の2拍子(2拍子系)だ。テンポは中くらいのものが多いが、ジャンルの中でも幅がある。この2拍子のリズムは「クンチャク(쿵짝)」といった擬音で呼ばれる。トロットそのものの別名としても「ポンチャク(뽕짝)」が使われる。

歌い方では、「ッコッキ（꺾기）」と呼ばれる、音を折り返す技法が代表的な特徴の1つだ。音程を一瞬上に跳ね上げてから、下に折り返す飾りの音で、演歌のこぶしに当たる。「ビブラート」も深くかけ、感情の揺れを声で表す。

歌詞のテーマは、叶わぬ恋、境遇への悲観、故郷を離れた旅人の苦しみなどが典型だ。

演歌と比べると、トロットはリズムがより軽快で、踊れる面を持つ。とくに近年の「ニュートロット」では、EDM的なビートやラップのパートを取り入れた曲も出てきている。</p>
<h2>成り立ち</h2><p>韓国の大衆歌謡の歴史は、1920年代、日本統治期の朝鮮半島にさかのぼる。トロットのスタイルは、1930年代に形づくられた。当時、日本のレコード会社が朝鮮に進出し、日本の流行歌（はやりうた）のスタイルを持ち込んだ。

1926年8月、尹心悳（ユン・シムドク）が「死の賛美（사의 찬미）」を吹き込んだ。ルーマニアの作曲家イヴァノヴィチのワルツ「ドナウ川のさざなみ」に、歌詞を付けた曲だ。歌手の死後に売れ行きが伸び、韓国の大衆歌謡のはじまりとみる人が多い。

1930年代になると、李愛利秀（イ・エリス）や南仁樹（ナム・インス）といった歌手が登場した。「목포의 눈물（木浦の涙）」（1935年、李蘭影〔イ・ナニョン〕歌唱）は、空前の大ヒットとなった。この曲は、植民地支配下の朝鮮民衆の悲しみを歌ったものと解釈された。単なる流行歌を超えて、民族の感情の受け皿になったのである。この時期の主要なレーベルには、コロムビアレコード朝鮮支社やビクターレコード朝鮮支社のほか、ポリドール、シエロン、タイヘイ、オーケーなどがあった。

しかし、1945年の解放のあと、トロットは「倭色歌謡（왜색가요）」として批判を浴びた。日本的な音楽のスタイルを引き継いでいるとして、非難の対象となったのだ。それでも民衆の間での人気は衰えなかった。朝鮮戦争（1950〜53年）の混乱期にも、慰問公演などを通じて広く歌われ続けた。この時期に活躍したキム・ジョング（金貞九）の「눈물 젖은 두만강（涙に濡れた豆満江）」（1938年）は、独立闘士への思慕を表す歌として解釈されることが多いが、諸説ある。1964年のラジオドラマの主題歌になったことで、広く知られるようになった。

トロットの盛期は、1960年代後半〜1970年代初頭が中心だ。李美子（イ・ミジャ）は「동백아가씨（椿の娘）」（1964年）で圧倒的な人気を集めた。ところが同曲は、1965年に放送上の規制を受け、1968年にはそれがさらに強化された。この禁止は1987年まで続き、韓国の文化検閲を代表する事件として語り継がれている。一方、羅勲兒（ナ・フナ）は、1970年代から80年代にかけて「무시로（いつでも）」「사랑（愛）」などのヒットを次々に出した。やがて「トロットの皇帝」と呼ばれるようになる。彼の低音の魅力と圧倒的な舞台での存在感は、後に続く世代の男性歌手のお手本となった。

1990年代以降、Kポップが人気を集めるにつれて、トロットは「おじさん・おばさんの音楽」として若者から敬遠されるようになった。そしてメインストリームから後退した。しかし2000年代半ば（2004年頃）から、「ニュートロット（뉴트로트）」と呼ばれる復活の波が起きる。2020年、林英雄（イム・ヨンウン）がオーディション番組「미스터트롯（ミスタートロット）」で優勝した。彼が若い世代を含む幅広い層に支持されたことで、トロットは再びメインストリームに返り咲いた。同番組の3月12日放送の決勝戦は視聴率35%を超え、当時の総合編成チャンネル（종편）史上最高の記録を打ち立てた。

トロットは演歌との関係をめぐって、いつも論争の的になってきた。両者が共通の音楽の語法を持つことは否定できない。だが、日本の影響で成立したと認めつつ、音階を根拠とする「倭色」論に異を唱える研究者もいる。この議論は、音楽学の問題にとどまらない。植民地主義や、文化的なアイデンティティをめぐる政治の問題と、深く絡み合っている。今もトロットは韓国の大衆文化で大切な位置を占め、Kポップとの融合を探りながら進化を続けている。</p>
<h2>代表曲</h2><ul><li>아모르 파티 (김연자)</li><li>내 나이가 어때서 (오승근)</li><li>어머나 (장윤정)</li><li>목포의 눈물 (이난영)</li><li>무조건 (박상철)</li><li>동백 아가씨 (이미자)</li><li>해뜰날 (송대관)</li><li>돌아와요 부산항에 (조용필)</li><li>사랑은 눈물의 씨앗 (나훈아)</li><li>님과 함께 (남진)</li><li>네 박자 (송대관)</li></ul>
