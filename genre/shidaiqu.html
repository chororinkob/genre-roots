<h1>Shidaiquとは</h1>
<p>1920年代から1940年代の上海で栄えた、中国語による最初期のポピュラー音楽。中国の伝統的な五声音階による旋律を、西洋のジャズバンドの伴奏に乗せる折衷が最大の特徴になる。伴奏編成はサックス、トランペット、クラリネット、ピアノ、ド</p>
<p>1920年代から1940年代の上海で栄えた、中国語による最初期のポピュラー音楽。中国の伝統的な五声音階による旋律を、西洋のジャズバンドの伴奏に乗せる折衷が最大の特徴になる。伴奏編成はサックス、トランペット、クラリネット、ピアノ、ドラムセット、コントラバスといったダンスバンドの楽器に、二胡や琵琶といった民族楽器を混ぜることも多い。リズムはフォックストロット、タンゴ、ルンバ、ワルツなど当時の社交ダンスの型をそのまま用い、テンポは踊りやすい100〜130BPM程度。歌唱は西洋的な発声ではなく、鼻にかかった細く高い声で、語尾を軽く揺らす独特の歌い方が用いられた。これは京劇や地方劇の女形の発声法を引き継いだもので、当時は軟らかく甘い声として好まれた。歌詞は北京語（国語）で書かれ、恋愛、別離、夜の街、月といった情景を扱う。踊る場としてのキャバレーやダンスホール、そして映画の劇中歌という二つの経路で流通し、多くの歌手が同時に映画女優でもあった点も、この音楽の性格を決めている。</p>
<h2>成り立ち</h2><p>1927年、音楽家で教育者でもあった黎錦暉が発表した「毛毛雨」（小ぬか雨）が、中国最初のポピュラー・ソングとされる。黎はもともと子ども向けの歌劇を書いていたが、明月歌舞団という一座を率いて上海の劇場や舞台で歌を売り、西洋の楽器編成と中国語の旋律を結び付けた。当時の上海は租界を抱えた国際都市で、外国人経営のダンスホールやキャバレーが並び、フィリピン人やロシア人の楽団が生演奏を行っていた。フランス系のレコード会社Pathéの上海支社（百代唱片）がこれらを録音して大量に売り、ラジオと映画がさらに広めた。1930年代半ばには周璇が最大の人気を集める。彼女は孤児として育ち、映画女優と歌手を兼ね、1937年の映画「馬路天使」の劇中歌「四季歌」「天涯歌女」で「金嗓子」（黄金の喉）と称された。ほかに白光、姚莉、龔秋霞、そして日本人でありながら中国人歌手として売り出された李香蘭（山口淑子）が並び、彼女たちは「七大歌星」と呼ばれた。だがこの音楽は激しい政治的攻撃にさらされる。左翼の音楽家からは、抗日の時代にふさわしくない退廃として「黄色歌曲」（みだらな歌）と非難され、1949年に中華人民共和国が成立すると全面的に禁止された。黎錦暉は文化大革命中の1967年に迫害を受けて死去している。制作の担い手と歌手の多くは香港へ移り、そこで国語時代曲として存続した。1950年代から1960年代の香港では葛蘭や靜婷が活動し、この系譜が1970年代以降の台湾・香港の中国語ポップス、すなわちマンドポップの直接の母体となる。1970年代に鄧麗君（テレサ・テン）が当時の名曲を次々に歌い直したことで、時代曲は懐かしい古典として中国語圏全体に定着した。中国本土でも1980年代以降に解禁され、いまでは近代上海の象徴として広く聴かれている。</p>
