<h1>Shidaiquとは</h1>
<p>時代曲は、1920年代から1940年代の上海で栄えた、中国語による最初期のポピュラー音楽だ。 初期には、民謡調（5声音階的）の旋律に、ジャズ風の伴奏を付ける形が目立った。のちには、西洋の音階や和声へ寄っていく傾向が強まった。 伴奏</p>
<p>時代曲は、1920年代から1940年代の上海で栄えた、中国語による最初期のポピュラー音楽だ。

初期には、民謡調（5声音階的）の旋律に、ジャズ風の伴奏を付ける形が目立った。のちには、西洋の音階や和声へ寄っていく傾向が強まった。

伴奏には、サックス、トランペット、クラリネット、ピアノ、ドラムセット、コントラバスといったダンスバンドの楽器が使われた。管楽器のバンドが中心だったが、弦楽団や小編成など、編成はさまざまだった。民族楽器を加えた例もある。

リズムは、フォックストロット、タンゴ、ルンバ、ワルツなど、当時の社交ダンスの型をそのまま使った。リズムの型は曲ごとに違う。2/4拍子や4/4拍子が多く、一部は3/4拍子のワルツだ。周璇の「晩安曲」のように、ゆっくりしたワルツもある。曲ごとの差が大きく、テンポを一律の範囲で示すことはできない。

歌い方は、初期には高く細い「小妹妹」調が目立った。ただし、深い声やベルカント風の歌い方も同時にあった。京劇の音色の影響も指摘されるが、声の質は歌手によってさまざまだった。低音の白光は「低音歌后」、鼻にかかった声の吳鶯音は「鼻音歌后」とも呼ばれた。当時、こうした声を軟らかく甘い声として好んだ聴き手がいた一方で、批判もあった。

歌詞は北京語（国語）で書かれ、恋愛、別れ、夜の街、月といった情景を描く。

広まった道は、主に5つあった。レコード会社と小売店、ラジオ局、映画会社、ダンスホールやキャバレー、そして楽譜の出版だ。多くの歌手が映画女優を兼ねていたことも、この音楽の性格を決めている。</p>
<h2>成り立ち</h2><p>始まりは、音楽家で教育者でもあった黎錦暉の「毛毛雨」（小ぬか雨）だ。1927年頃の作とされ、最初の中国語ポップソングと広く見なされている。

黎はもともと、子ども向けの歌劇を書いていた。1927年に中華歌舞学校を作り、1928年には中華歌舞団として東南アジアを回って公演した。こうして、西洋の楽器編成と中国語の旋律を結びつけた。明月歌舞団は、そのあと1929〜30年に上海へ戻ってから組織した団体で、1931年に聯華影業へ合流した。

当時の上海は、租界を抱えた国際都市だった。ダンスホールやキャバレーが並び、フィリピン人やロシア人の楽団が生演奏をしていた。経営者が外国人のホールもあれば、中国人や日本人のホールもあった。こうした歌を録音して大量に売ったのが、レコード会社Pathéの上海支社（百代唱片）だ。フランス資本で創業し、のちにEMI傘下となった会社である。ラジオと映画が、さらに歌を広めた。

1930年代後半には、周璇が最大の人気を集める。彼女は幼いころに実の両親と生き別れ、6歳で上海の周家の養女となった。1934年（14歳）の上海の歌唱コンテストで2位になり、「金嗓子」（黄金の喉）と呼ばれた。映画女優と歌手を兼ね、1937年の映画「馬路天使」の劇中歌「四季歌」「天涯歌女」で、全国的なスターとなった。ほかに白虹、龔秋霞、姚莉、白光、吳鶯音、そして日本人でありながら中国人歌手として売り出された李香蘭（山口淑子）が並び、この7人は「七大歌星」と呼ばれた。

しかし、この音楽は激しい政治的な攻撃を受ける。左翼の音楽家からは、抗日の時代にふさわしくない退廃だとして、「黄色歌曲」（みだらな歌）と非難された。1949年に中華人民共和国が成立すると非難は強まり、上海から香港へ移る動きが進んだ。1952年には、ナイトクラブと流行音楽の制作が禁じられた。黎錦暉は、文化大革命中の1967年に迫害を受けて亡くなっている。

制作の担い手と歌手の多くは香港へ移り、そこで国語時代曲として生き残った。1950年代から1960年代の香港では、葛蘭や靜婷が活動した。時代曲は中国語ポップスの原型（源流）であり、現代のマンドポップは、1970年代の台湾のキャンパス・フォークなども経て形づくられた。

1970年代後半からは、鄧麗君（テレサ・テン）が「何日君再来」などを歌い直し、時代曲の再評価につながった。ただし中国本土では、1980年代前半に批判され、禁止された。それでも中国本土では1980年代に再評価が進み、いまでは近代上海の代名詞として広く聴かれているとも言われる。</p>
