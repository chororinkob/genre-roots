<h1>Afroswing（アフロスウィング）とは</h1>
<p>アフロスウィングは、2010年代のイギリスで、西アフリカやカリブ海の音楽とトラップやR&amp;Bを混ぜ合わせて生まれた音楽だ。 低音は808のベースだ。ただし、ドリルのように冷たくは鳴らさず、丸く温かい音色が選ばれる。上物には、木琴に似</p>
<p>アフロスウィングは、2010年代のイギリスで、西アフリカやカリブ海の音楽とトラップやR&amp;Bを混ぜ合わせて生まれた音楽だ。

低音は808のベースだ。ただし、ドリルのように冷たくは鳴らさず、丸く温かい音色が選ばれる。上物には、木琴に似た音色や、マリンバ、カリンバ風の音、ベルのようなシンセの音が並ぶ。

旋律は明るいものが特徴だが、和音には明るいものも暗いものもある。

リズムの中心は、アフロビーツ由来の打楽器のくり返しと、ダンスホールの弾んだ拍だ。四つ打ちではない。制作者Steel Banglezは「スネアが3拍目に来る。ヒップホップでは4拍目」と述べており、4/4の枠内で3音のパターンが繰り返されると説明される。全体は、軽く前のめりに転がる。テンポは特定の数値では定まらず、メロディーで特徴づけられるジャンルである。

歌い方が特徴の一つだ。ラップと歌の境界がなく、ロンドンの多民族地区の訛りに、ジャマイカのパトワとナイジェリアのピジン英語が自在に混ざる。

歌詞は、恋愛や夜遊びが目立つ。その一方で、ロード・ラップの影響を受けた荒い題材(車、金、本物らしさ、タフさ)も含まれる。

同じ英国の音でも、ドリルが緊張と暴力を描くのに対し、こちらは踊りと楽しさに重きを置く。この点がはっきり違う。</p>
<h2>成り立ち</h2><p>アフロスウィングの背景には、ロンドンの人口構成がある。

ガーナからの移民は1990年代に、ナイジェリアからの移民は2000年代に大きく増えた。ロンドンには、西アフリカ系の家庭が集まった。そこに、以前からのカリブ海系の住民が重なる。家庭では両方の音楽を聴き、学校ではグライムとイギリスのラップを聴く世代が育った。

2010年代前半、この世代が音楽を作り始める。前史には、2010年のSneakboの『Touch Ah Button』や、2014年のTimbo &amp; Moverの『Ringtone』がある。最初の注目曲とする見方があるのが、『Dem Boy Paigon』だ。2015年に、東ロンドン出身でガンビアにルーツを持つJ Husが発表した。『Friendly』は初出が2015年で、2016年に広まった。同じ年、ナイジェリア系のNot3sが『Addison Lee』を出した(ネット公開は2016年11月、公式リリースは2017年)。2017年には、J HusがMoStackとMISTを迎えた『Fisherman』を発表した。

制作面では、Jae5、Blairy Hendrix、Joshua Beatzが音を定着させたとされる。TSBも、『Common Sense』と『Big Conspiracy』の制作に加わった。とりわけJae5は、J Husの『Common Sense』や『Big Conspiracy』の中心的な制作者である。

ほかに、Yxng Bane、Kojo Funds、Hardy Caprio、Ramzが続いた。Ramzの『Barking』は、2017年9月にネットで話題になり、12月に公式発売された。そして2018年1月、全英チャートで最高二位に達した。

名称は、アフロスウィングやアフロバッシュメント、アフロトラップなど、複数が並び立った。当事者たちの中には、特定の呼び名を嫌う人もいた。

一方、J Husは2018年、ナイフ所持で八か月の実刑を受けた。2019年4月に釈放され、2020年1月にアルバム『Big Conspiracy』を出した。

この語法は、ナイジェリア本国のアフロビーツとも結びついていく。J Husは2023年12月、ラゴスの大型音楽祭Afro Nation Nigeriaに、主役として出演する予定だった。しかし、主催者が中止を発表し、出演はしていない。その後、2025年12月20日にラゴスのオレンジ・アイランドで開かれるMusic City Central Festivalが、J Husがラゴスで初めて単独で主役を務める公演として告知された。

2020年代には、この明るい語法とドリルの暗い語法が、同じ作り手の中で共存するようになった。独立したジャンルとしての境目は、あいまいになっている。</p>
