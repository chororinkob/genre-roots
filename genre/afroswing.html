<h1>Afroswing（アフロスウィング）とは</h1>
<p>2010年代のイギリスで、西アフリカやカリブ海の音楽とトラップやR&amp;Bを混ぜ合わせて生まれた音楽。リズムの核はアフロビーツ由来の打楽器の反復とダンスホールの跳ねた拍で、四つ打ちではなく、三拍のまとまりを二拍の枠に押し込む感覚が全体</p>
<p>2010年代のイギリスで、西アフリカやカリブ海の音楽とトラップやR&amp;Bを混ぜ合わせて生まれた音楽。リズムの核はアフロビーツ由来の打楽器の反復とダンスホールの跳ねた拍で、四つ打ちではなく、三拍のまとまりを二拍の枠に押し込む感覚が全体を支配し、常に軽く前のめりに転がる。テンポは毎分100から115拍程度。低音は八〇八のベースだが、ドリルのように冷たくは鳴らさず、丸く温かい音色が選ばれる。上物にはナイロン弦やクリーントーンのギターによる短いアルペジオ、木琴に似た減衰の速い音色、シンセのフルート音が並び、和音は長調寄りの循環進行で明るく開ける。歌唱は最大の特徴で、ラップと歌の境界がなく、ロンドンの多民族地区の訛りに、ジャマイカのパトワとナイジェリアのピジン英語、ヨルバ語やトゥイ語の単語が自在に混ざる。ピッチ補正を柔らかくかけた節回しが多い。歌詞は恋愛と夜遊びが中心で、街の現実に触れつつも重く沈まず、祝祭的な明るさを保つ。同じ英国の音でも、ドリルが緊張と暴力を描くのに対し、こちらは踊りと快楽に軸足を置く点が決定的に違う。</p>
<h2>成り立ち</h2><p>背景にあるのはロンドンの人口構成である。1990年代以降、ナイジェリアとガーナからの移民が大幅に増え、東ロンドンや南ロンドンには西アフリカ系の家庭が集住した。そこに以前からのカリブ海系の住民が重なり、両方の音楽を家庭で聴きながら、学校ではグライムとイギリスのラップを聴く世代が育った。2010年代前半、この世代が音楽を作り始める。最初の突破口は2015年で、東ロンドン出身でガンビアにルーツを持つJ Husが『Dem Boy Paigon』を発表し、翌2016年の『Friendly』が広く知られた。同じ年、ナイジェリア系のNot3sが『Addison Lee』を出し、2017年に二人が組んだ『Fisherman』がこの様式を決定づけた。制作面ではJae5、Steel Banglez、Team Salut、TSBが音の共通語を作り、とりわけJae5はJ Husの全作品を手がけた人物である。ほかにYxng Bane、Kojo Funds、Hardy Caprio、Mist、Ramzが続き、2017年のRamzの『Barking』は全英チャート二位に達した。名称はアフロスウィングやアフロバッシュメント、アフロトラップなど複数が並立し、当事者たちは特定の呼び名を嫌うことも多かった。J Husは2018年、ナイフ所持で八か月の実刑を受け、活動を中断している。2010年代末には、この語法がナイジェリア本国のアフロビーツと合流し、Burna Boyがロンドンで支持を得たり、逆にJ Husがラゴスで歓迎されたりする双方向の往来が生まれた。2020年代には、この明るい語法とドリルの暗い語法が同じ作り手の中で共存するようになり、独立したジャンルとしての境界は曖昧になっている。</p>
<h2>代表曲</h2><ul><li>Did You See（J Hus）</li><li>Addison Lee（Not3s）</li><li>Fine Wine（Yxng Bane, Kojo Funds &amp; Not3s）</li></ul>
