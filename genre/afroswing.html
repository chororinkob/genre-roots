<h1>Afroswing（アフロスウィング）とは</h1>
<p>2010年代のイギリスで、西アフリカやカリブ海の音楽とトラップやR&amp;Bを混ぜ合わせて生まれた音楽。リズムの中心はアフロビーツ由来の打楽器のくり返しと、ダンスホールの弾んだ拍で、四つ打ちではなく、スネアが3拍目に来る(ヒップホップで</p>
<p>2010年代のイギリスで、西アフリカやカリブ海の音楽とトラップやR&amp;Bを混ぜ合わせて生まれた音楽。リズムの中心はアフロビーツ由来の打楽器のくり返しと、ダンスホールの弾んだ拍で、四つ打ちではなく、スネアが3拍目に来る(ヒップホップでは4拍目に来る)のが特徴とされ、4/4の枠内で3音のパターンが繰り返されると説明される。全体は軽く前のめりに転がる。テンポは特定の数値では定まらず、毎分100〜120拍前後が多いとされ、メロディーで特徴づけられるジャンルである。低音は808のベースだが、ドリルのように冷たくは鳴らさず、丸く温かい音色が選ばれる。上物にはナイロン弦やクリーントーンのギターによる短いアルペジオ、木琴に似た減衰の速い音色、シンセのフルート音が並び、旋律は明るいものが特徴だが、和音には明るいものも暗いものもある。歌い方が最大の特徴で、ラップと歌の境界がなく、ロンドンの多民族地区の訛りに、ジャマイカのパトワとナイジェリアのピジン英語、ヨルバ語やトゥイ語の単語が自在に混ざる。音程補正をやわらかくかけた節回しが多い。歌詞は恋愛や夜遊びが目立つ一方、ロード・ラップ由来の荒い題材(車、金、本物らしさ、タフさ)も含まれる。同じ英国の音でも、ドリルが緊張と暴力を描くのに対し、こちらは踊りと楽しさに重きを置く点がはっきり違う。</p>
<h2>成り立ち</h2><p>背景にあるのはロンドンの人口構成である。ガーナからの移民は1990年代に、ナイジェリアからの移民は2000年代に大きく増え、ロンドンには西アフリカ系の家庭が集まった。そこに以前からのカリブ海系の住民が重なり、両方の音楽を家庭で聴きながら、学校ではグライムとイギリスのラップを聴く世代が育った。2010年代前半、この世代が音楽を作り始める。前史には2010年のSneakboや2014年のTimbo &amp; Moverの『Ringtone』があり、最初の注目曲とされるのは、2015年に東ロンドン出身でガンビアにルーツを持つJ Husが発表した『Dem Boy Paigon』である。翌2016年の『Friendly』が広く知られた。同じ年、ナイジェリア系のNot3sが『Addison Lee』を出した(ネット公開は2016年11月、公式リリースは2017年)。2017年にはJ Husが、MoStackとMISTを迎えた『Fisherman』を発表した。制作面ではJae5、Steel Banglez、Team Salut、TSBが音の共通のスタイルを作り、とりわけJae5は、J Husの『Common Sense』や『Big Conspiracy』の中心的な制作者である。ほかにYxng Bane、Kojo Funds、Hardy Caprio、Ramzが続き、Ramzの『Barking』は2017年末に発売され、2018年1月に全英チャートで最高二位に達した。名称はアフロスウィングやアフロバッシュメント、アフロトラップなど複数が並立し、当事者たちは特定の呼び名を嫌うことも多かった。J Husは2018年、ナイフ所持で八か月の実刑を受け、活動を中断している。この語法はナイジェリア本国のアフロビーツとも結びつき、J Husは2023年12月、ラゴスで開かれた大型音楽祭Afro Nation Nigeriaに出演し、初のラゴス公演と報じられた。2020年代には、この明るい語法とドリルの暗い語法が同じ作り手の中で共存するようになり、独立したジャンルとしての境目はあいまいになっている。</p>
