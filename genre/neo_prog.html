<h1>Neo-Prog（ネオプログレ）とは</h1>
<p>1980年代に現れたプログレッシブ・ロックの再興形。1970年代のGenesisやPink Floydが持っていた要素、すなわち10分前後の長尺曲、組曲形式、変拍子、物語性のある歌詞、間奏での長い器楽展開を引き継ぎながら、当時のポ</p>
<p>1980年代に現れたプログレッシブ・ロックの再興形。1970年代のGenesisやPink Floydが持っていた要素、すなわち10分前後の長尺曲、組曲形式、変拍子、物語性のある歌詞、間奏での長い器楽展開を引き継ぎながら、当時のポップスの録音技術と、より直接的な感情表現を持ち込んだ点が特徴である。鍵盤はメロトロンやハモンドオルガンよりも、Roland JupiterやYamaha DX7といった同時代のポリフォニックシンセを主役に据え、パッド系の厚い持続音で曲全体を包む。ギターは歪ませた上に深いディレイとコーラスをかけ、速弾きよりも1音を長く伸ばして泣かせるサステインの効いたソロを好む。ベースはRickenbackerの硬い音でコードの根音を外して動き回り、ドラムはゲートリバーブのかかった80年代的な質感を持つ。7/8や5/4といった変拍子も使うが、1970年代のプログレほど理詰めではなく、あくまで歌のドラマを盛り上げる手段として置かれる。歌詞は宇宙や神話ではなく、失恋、依存症、孤独、戦争といった個人的で生々しい主題を扱い、ヴォーカルは語りと歌を演劇的に行き来する。同時期のプログレッシブ・メタルが技巧と重さを競ったのに対し、こちらは叙情性と歌の訴求力に軸足を置く。</p>
<h2>成り立ち</h2><p>1970年代末、パンクの登場によってプログレッシブ・ロックは肥大した恐竜として徹底的に否定され、GenesisやYesは商業的なポップス路線へ舵を切った。その空白の中で、1980年前後のイギリスに、あえて長尺で叙情的な曲を演奏する若いバンドが現れる。ロンドンのライブハウスThe Marqueeを拠点にしたTwelfth Night、Pallas、IQ、そして1979年にアリズベリーで結成されたMarillionが中心となり、音楽誌からは「ネオ・プログ」あるいは揶揄を込めて「プログ・リヴァイヴァル」と呼ばれた。Marillionは、スコットランド出身の歌手Fish(本名Derek William Dick)の演劇的な立ち居振る舞いと、Peter Gabrielを思わせる語り口で注目を集め、『Script for a Jester's Tear』(1983)、『Fugazi』(1984)で足場を固めた。1985年の『Misplaced Childhood』は、少年時代の記憶とアルコール依存を主題にした切れ目のないコンセプト作でありながら、シングル「Kayleigh」が全英2位のヒットとなり、アルバム自体も全英1位を獲得した。この成功はネオプログの商業的な頂点であると同時に、シーンの限界も露呈させた。批評家は一貫して「模倣にすぎない」と冷淡で、Fishは1988年にMarillionを脱退し、バンドはSteve Hogarthを迎えてより内省的な方向へ移行する。1990年代に入ると、オランダのArena、スウェーデンのThe Flower Kings、アメリカのSpock's Beard、ポーランドのRiversideなど各国にシーンが広がり、これらはやがてプログレッシブ・ロック全体の第三世代へと合流した。イギリスの専門誌『Prog』の創刊(2009)や、専門レーベルGiant Electric Peaが、この系譜を現在まで支えている。</p>
<h2>代表曲</h2><ul><li>Script for a Jester's Tear（Marillion）</li><li>The Last Man on Earth（Pendragon）</li><li>The Wake（IQ）</li></ul>
