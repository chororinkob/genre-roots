<h1>Neo-Prog（ネオプログレ）とは</h1>
<p>ネオ・プログは、1980年代に現れた、プログレッシブ・ロックを再び盛り上げた形だ。主な影響源は初期のGenesisやCamelで、Van der Graaf GeneratorとPink Floydは副次的な影響である。 いくつも</p>
<p>ネオ・プログは、1980年代に現れた、プログレッシブ・ロックを再び盛り上げた形だ。主な影響源は初期のGenesisやCamelで、Van der Graaf GeneratorとPink Floydは副次的な影響である。

いくつもの部分からなる組曲の形、拍子の変化、物語性のある歌詞、間奏での楽器の見せ場。こうした要素を引き継いだ。そのうえで、曲は全体の傾向としては以前より短く、複雑さも抑えられ、ラジオ向きに見えるものになった。当時のポップスの録音技術と、より直接的な感情表現を持ち込んだ点が特徴である。

鍵盤では、デジタルシンセやポリフォニックシンセが、メロトロンやハモンドオルガンといった従来の鍵盤の役割の多くを担った。例えば、Marillionでの使用機材は、Roland Jupiter-8、PPG Wave 2.2、のちにYamaha DX7である。

ギターは歪ませすぎない澄んだ音で、メロディアスで感情的なソロを弾く。Marillionのギターでは、ディレイやコーラスが使われた。

ドラムは、当時のポップ作品と共通する80年代的な録音の質感を持つ。Marillionなどでは、7/8や5/4といった変拍子も使われる。ただし、1970年代のプログレッシブ・ロックほど理詰めではなく、歌のドラマを盛り上げる手段として置かれることが多い。

ヴォーカルは、語りと歌を演劇的に行き来する。歌詞では、前の時代より、失恋、依存症、孤独、戦争といった個人的で生々しい主題が増えた。ただし、神話や幻想的な題材も残った。

コンセプト作は作られ続けたが、頻度も規模も小さくなった。一方で、Marillionなどには長尺曲やアルバム単位の組曲もある。80年代半ば以降に注目を集めたプログレッシブ・メタルが、技巧と重さを競ったのに対し、こちらは感情豊かな味わいと、歌の訴える力に重きを置く。</p>
<h2>成り立ち</h2><p>1970年代後半、パンクが勢いを増したことなどを背景に、プログレッシブ・ロックは巨大化した恐竜のようだと言われ、批判の的になった。Genesisは1970年代末からポップ路線を強めた。Yesは、1983年の再結成作『90125』で商業的な成功を収めた。

こうした中で、1980年代初頭のイギリスに、叙情的な曲を演奏する若いバンドが現れる。シーンの中心会場となったのは、ロンドンのライブハウスThe Marqueeだ。ここに頻繁に出演したTwelfth Night、Pallas、IQ、そして1979年にアイルズベリーで結成されたMarillionが、中心となった。彼らは「ネオ・プログ」と呼ばれた。後年には、「プログレッシブ・ロックの思いがけない復活」とも説明される。

Marillionは、スコットランド出身の歌手Fish(本名Derek William Dick)の、Peter Gabrielに比較される歌唱と演劇的なステージで注目を集めた。当初は「Genesisのクローン」との批判もあった。それでも、『Script for a Jester's Tear』(1983)、『Fugazi』(1984)で土台を固めた。

1985年の『Misplaced Childhood』は、失恋、突然の成功、受容、失われた子供時代を主題にしたコンセプト作だ。LPの各面が、連続した組曲として構成されている。それでいて、シングル「Kayleigh」は全英2位のヒットとなり、アルバム自体も全英1位を獲得した。

この成功は、ネオ・プログの商業的な頂点だった。同時に、シーンの限界もはっきり見せた。主流の音楽メディアの一部では、人気がなく流行遅れの扱いが続いた。Fishは1988年にMarillionを脱退し、バンドはSteve Hogarthを迎えて、より内省的な方向へ移っていく。

1990年代の第三波、ネオ・プログの第二世代とも呼ばれる流れとして、イギリスのArena、スウェーデンのThe Flower Kings、アメリカのSpock's Beardなどが登場した。2001年結成のポーランドのRiversideは、ネオ・プログの文脈ではなく、2000年代のプログレッシブ・ロックやプログレッシブ・メタルのバンドとして語られることが多い。イギリスの専門誌『Prog』の創刊(2009)や、専門レーベルGiant Electric Peaが、この系譜を現在まで支えている。</p>
