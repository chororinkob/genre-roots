<h1>Neo-Prog（ネオプログレ）とは</h1>
<p>1980年代に現れたプログレッシブ・ロックを再び盛り上げた形。初期のGenesisやCamelを主な影響源とし(Van der Graaf GeneratorとPink Floydは副次的な影響)、いくつもの部分からなる組曲の形、</p>
<p>1980年代に現れたプログレッシブ・ロックを再び盛り上げた形。初期のGenesisやCamelを主な影響源とし(Van der Graaf GeneratorとPink Floydは副次的な影響)、いくつもの部分からなる組曲の形、拍子の変化、物語性のある歌詞、間奏での楽器の見せ場といった要素を引き継ぎながら、曲は以前より短く複雑さを抑えたラジオ向きのものになり、当時のポップスの録音技術と、より直接的な感情表現を持ち込んだ点が特徴である。コンセプト作は作られ続けたが、頻度も規模も小さくなった。鍵盤はメロトロンやハモンドオルガンよりも、Roland JupiterやYamaha DX7といった同時代のポリフォニックシンセを主役に据え、パッド系と呼ばれる厚い伸びる音で曲全体を包む。ギターは歪ませすぎない澄んだ音に、深いディレイとコーラスをかけ、速弾きよりも、1音を長く伸ばして泣かせるようなソロを好む。ベースはコードの根音を外して動き回り、ドラムはゲートリバーブのかかった80年代的な質感を持つ。7/8や5/4といった変拍子も使うが、1970年代のプログレほど理詰めではなく、あくまで歌のドラマを盛り上げる手段として置かれる。歌詞は宇宙や神話ではなく、失恋、依存症、孤独、戦争といった個人的で生々しい主題を扱い、ヴォーカルは語りと歌を演劇的に行き来する。同時期のプログレッシブ・メタルが技巧と重さを競ったのに対し、こちらは感情豊かな味わいと、歌の訴える力に重きを置く。</p>
<h2>成り立ち</h2><p>1970年代末、パンクの登場によってプログレッシブ・ロックは巨大化した恐竜のようだと厳しく否定され、GenesisやYesは商業的なポップス路線へ舵を切った。その空白の中で、1980年代初頭のイギリスに、あえて長尺で叙情的な曲を演奏する若いバンドが現れる。ロンドンのライブハウスThe Marqueeを拠点にしたTwelfth Night、Pallas、IQ、そして1979年にアリズベリーで結成されたMarillionが中心となり、「ネオ・プログ」と呼ばれ、当時の評では「プログレッシブ・ロックの思いがけない復活」とも評された。Marillionは、スコットランド出身の歌手Fish(本名Derek William Dick)の演劇的な立ち居振る舞いと、Peter Gabrielを思わせる語り口で注目を集め、『Script for a Jester's Tear』(1983)、『Fugazi』(1984)で基盤を固めた。1985年の『Misplaced Childhood』は、失恋、突然の成功、受容、失われた子供時代を主題にした切れ目のないコンセプト作でありながら、シングル「Kayleigh」が全英2位のヒットとなり、アルバム自体も全英1位を獲得した。この成功はネオプログの商業的な頂点であると同時に、シーンの限界もはっきり見せた。主流の音楽メディアでは人気がなく、イギリスの音楽業界では流行遅れの扱いが続いた。Fishは1988年にMarillionを脱退し、バンドはSteve Hogarthを迎えてより内省的な方向へ移行する。1990年代に入ると、イギリスのArena、スウェーデンのThe Flower Kings、アメリカのSpock's Beardなど各国にシーンが広がり、これらはやがてプログレッシブ・ロック全体の第三世代へと合流した。2001年結成のポーランドのRiversideは、それより新しい世代のバンドとして扱われる。イギリスの専門誌『Prog』の創刊(2009)や、専門レーベルGiant Electric Peaが、この系譜を現在まで支えている。</p>
<h2>代表曲</h2><ul><li>Script for a Jester's Tear（Marillion）</li><li>Kayleigh (Marillion)</li><li>Lavender (Marillion)</li><li>Easter (Marillion)</li><li>The Last Man on Earth（Pendragon）</li><li>Garden Party (Marillion)</li><li>Subterranea (IQ)</li><li>Market Square Heroes (Marillion)</li><li>The Wake（IQ）</li><li>The Other Side (IQ)</li><li>Sacred Sound (IQ)</li><li>Cut and Run (Pallas)</li></ul>
