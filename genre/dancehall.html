<h1>Dancehall（ダンスホール）とは</h1>
<p>ジャマイカのレゲエから発展した、打ち込みの伴奏とMCの語りを核とする音楽。最大の構造的特徴はリディムという仕組みにある。リディムとは伴奏トラックのことで、一つのリディムに対して複数の歌手がそれぞれ別の歌詞を乗せ、同じ伴奏の曲が何十</p>
<p>ジャマイカのレゲエから発展した、打ち込みの伴奏とMCの語りを核とする音楽。最大の構造的特徴はリディムという仕組みにある。リディムとは伴奏トラックのことで、一つのリディムに対して複数の歌手がそれぞれ別の歌詞を乗せ、同じ伴奏の曲が何十曲も同時に流通する。聴き手はリディムの名前を認識しており、これが共通の土俵として機能する。BPMは90〜110、リズムは打ち込みのドラムで、キックとスネアの位置が伝統的なレゲエのワンドロップから変化し、より前へ押す形になる。低音はシンセ・ベースが短い音型を反復し、上物は最小限の刺しと効果音のみ。和声はしばしば存在せず、単一の低音の反復だけで曲が成立する。歌唱はディージェイイングと呼ばれるジャマイカ独自の語りで、パトワ、すなわちジャマイカ・クレオール語による高速の言葉の連射と、シンギング・ジェイと呼ばれる歌に近い発声が併存する。歌詞は性的な内容、地区への忠誠、貧困、暴力、そして踊りの指示を扱い、特定の踊りを流行させる曲も多い。サウンドシステムと呼ばれる移動式の巨大な音響装置を屋外に設置し、複数の陣営が音を競うサウンドクラッシュの文化と不可分である。</p>
<h2>成り立ち</h2><p>1970年代末のジャマイカで、ルーツ・レゲエが持っていた宗教的で政治的な性格から離れる形で生まれた。背景には1980年の総選挙をめぐる暴力があり、数百人が政治抗争で死亡する中、ラスタファリの理想を掲げる音楽への信頼が揺らいだ。音楽的には、1979年前後にプロデューサーHenry Junjo Lawesと、Roots Radicsという演奏集団が、テンポを落とし低音を強調した硬い伴奏を確立したことが起点となる。歌手ではYellowmanが、アルビノであることを逆手に取った自己主張と露骨な性的表現で一時代を築いた。決定的な技術的転換は1985年、プロデューサーKing Jammyが、日本のCasio製の安価な鍵盤楽器を用いて制作したWayne SmithのUnder Mi Sleng Tengである。この曲の完全に電子的な伴奏は、生バンドによる録音を過去のものとし、以後のジャマイカ音楽の全てを打ち込みへ転換させた。1990年代にはShabba Ranks、Buju Banton、Beenie Man、Bounty Killerらが活躍し、米国のヒップホップとの相互影響が深まった。深刻な問題として、1990年代から2000年代にかけて、同性愛者への暴力を扇動する歌詞が国際的な非難を浴び、欧米での公演中止や不買運動が相次いだ。これに対し2007年、複数の歌手が扇動的な歌詞を作らないという合意に署名したが、その実効性は議論が続いている。2000年代以降、Sean PaulやShaggyが英語圏の主流市場で成功し、リディムの構造やパトワの歌い回しは、レゲトン、アフロビーツ、そして欧米のポップスへ広く流れ込んだ。現在もジャマイカ国内では、サウンドシステムの夜が地域社会の中心的な娯楽であり続けている。</p>
<h2>代表曲</h2><ul><li>Get Busy（Sean Paul）</li><li>Zungguzungguguzungguzeng（Yellowman）</li><li>Murder She Wrote（Chaka Demus &amp; Pliers）</li><li>Sleng Teng（Wayne Smith）</li><li>Bam Bam（Sister Nancy）</li></ul>
