<h1>Dancehall（ダンスホール）とは</h1>
<p>ダンスホールは、ジャマイカのレゲエから発展した音楽だ。MC（ラップのように語る人）の語りと、1985年以降は打ち込みの伴奏を核とする。 重要な特徴の一つは「リディム」という仕組みだ。リディムとは伴奏トラックのことをいう。一つのリデ</p>
<p>ダンスホールは、ジャマイカのレゲエから発展した音楽だ。MC（ラップのように語る人）の語りと、1985年以降は打ち込みの伴奏を核とする。

重要な特徴の一つは「リディム」という仕組みだ。リディムとは伴奏トラックのことをいう。一つのリディムに対して、複数の歌手がそれぞれ別の歌詞を乗せる。そのため、同じ伴奏の曲が何十曲も同時に流通する。聴き手はリディムの名前を認識しており、これが共通の土俵として機能する。

低音は、シンセ・ベースが短い音型を反復する。全体としてミニマルで、低音とドラムが中心のものが多い。ピアノ、キーボードのリフ、効果音などを加える例も多い。

BPMはおおむね90〜110前後が典型だ。リズムは打ち込みのドラムで作られる。ワンドロップ型だけでなく、Dem Bow系の『boom-ch-boom-chick』（3+3+2のクロスリズム）など、より前進感のあるパターンが広まった。

歌唱は「ディージェイイング」と呼ばれる、ジャマイカ独自の語りだ。パトワ、すなわちジャマイカ・クレオール語による高速の言葉の連射がある。これと並んで、「シンギング・ジェイ」と呼ばれる、歌に近い発声も併存する。

歌詞は、性的な内容、地区への忠誠、貧困、暴力、そして踊りの指示を扱う。特定の踊りを流行させる曲も多い。

また、サウンドシステムと呼ばれる移動式の巨大な音響装置を屋外に設置し、複数の陣営が音を競う。この「サウンドクラッシュ」の文化と、切り離せない音楽である。</p>
<h2>成り立ち</h2><p>1970年代末のジャマイカで、ダンスホールは生まれた。ルーツ・レゲエが持っていた宗教的で政治的な性格から離れる形での誕生だった。

背景には、1970年代後半から1980年にかけての政治暴力がある。1980年の選挙戦では、警察統計で844人（実際はより多い可能性）が死亡した。そうした中で、歌詞の主題が精神性から性・暴力へ移ったと指摘される。

音楽的には、プロデューサーHenry Junjo LawesとRoots Radicsが、初期ダンスホール（デジタル化以前）の中心的な担い手の一組だった。歌手ではYellowmanが、アルビノであることを逆手に取った自己主張と、露骨な性的表現で一時代を築いた。

決定的な技術的転換は、Wayne SmithのUnder Mi Sleng Tengである。1984年末、Wayne SmithとNoel DaveyがCasiotone MT-40のプリセットでリズムを作った。それをプロデューサーのKing Jammyが調整し、1985年にリリースした。この曲は、きわめてデジタル色の強い伴奏を持つ。Jammyがテンポを調整し、ピアノ等を重ねたものだ。ジャマイカ初期のデジタル制作の代表例として、デジタル・リディムの先駆けと広く評価されている。1980年代半ば以降の主流は、これによって電子化した。

1990年代には、Shabba Ranks、Buju Banton、Beenie Man、Bounty Killerらが活躍した。米国のヒップホップとの相互影響も深まった。

一方で、深刻な問題も起きた。1990年代から2000年代にかけて、同性愛者への暴力を扇動する歌詞が国際的な非難を浴びたのだ。欧米での公演中止や不買運動が相次いだ。これに対し2007年、Beenie Man、Capleton、Buju Banton、Sizzlaの4人が、扇動的な歌詞を作らないという合意に署名した。ただし、その実効性は議論が続いている。

その後、英語圏の主流市場でも成功する人が現れた。1990年代のShaggy（出世作は1993年のOh Carolina）や、2000年代のSean Paulである。Shaggyは、2000年発売のHot Shotで、2001年2月にBillboard 200の1位を獲得した。リディムの構造やパトワの歌い回しは、レゲトン、アフロビーツ、そして欧米のポップスへ影響を与えたとされる。

現在もジャマイカ国内では、サウンドシステムの夜が、地域社会の重要な娯楽・文化として根付いている。</p>
