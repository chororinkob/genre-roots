<h1>Dancehall（ダンスホール）とは</h1>
<p>ジャマイカのレゲエから発展した、MC（ラップのように語る人）の語りと、1985年以降は打ち込みの伴奏を核とする音楽。重要な特徴の一つは、リディムという仕組みである。リディムとは伴奏トラックのことで、一つのリディムに対して複数の歌手</p>
<p>ジャマイカのレゲエから発展した、MC（ラップのように語る人）の語りと、1985年以降は打ち込みの伴奏を核とする音楽。重要な特徴の一つは、リディムという仕組みである。リディムとは伴奏トラックのことで、一つのリディムに対して複数の歌手がそれぞれ別の歌詞を乗せ、同じ伴奏の曲が何十曲も同時に流通する。聴き手はリディムの名前を認識しており、これが共通の土俵として機能する。BPMはおおむね90〜110前後が典型で、リズムは打ち込みのドラムで、伝統的なレゲエのワンドロップ（1拍目を抜く独特のドラム）だけでなく、Dem Bow系の「boom-ch-boom-chick」（拍を3つ・3つ・2つの順に区切る、ずらした感じのリズム）など、前へ進む感じの強いパターンも広まった。低音はシンセ・ベースが短い音型を反復し、全体にミニマル（音数が少ない）で、低音とドラムが中心の曲が多い。上物（メロディーなど上に重ねる音）として、ピアノやキーボードの短い旋律、効果音などを加える例も多い。歌唱はディージェイイングと呼ばれるジャマイカ独自の語りで、パトワ、すなわちジャマイカ・クレオール語による高速の言葉の連射と、シンギング・ジェイと呼ばれる歌に近い発声が併存する。歌詞は性的な内容、地区への忠誠、貧困、暴力、そして踊りの指示を扱い、特定の踊りを流行させる曲も多い。サウンドシステムと呼ばれる移動式の巨大な音響装置を屋外に設置し、複数の陣営が音を競うサウンドクラッシュの文化と切り離せない。</p>
<h2>成り立ち</h2><p>1970年代末のジャマイカで、ルーツ・レゲエが持っていた宗教的で政治的な性格から離れる形で生まれた。背景には1970年代後半から1980年にかけての政治暴力があり、1980年の選挙の年には、警察の統計で844人が殺され（実際はもっと多いとみる分析もある）、歌詞の中心は、ラスタファリの理想を掲げた、信仰や心の大切さを歌うものから、性や暴力を歌うものへ移っていったと言われる。音楽的には、プロデューサーHenry Junjo Lawesと、Roots Radicsという演奏集団が、テンポを落とし低音を強調した硬い伴奏で、打ち込みが入る前の初期のダンスホールを引っ張った中心的な一組とされる。歌手ではYellowmanが、アルビノであることを逆手に取った自己主張と露骨な性的表現で一時代を築いた。大きな転機は1985年に出たWayne SmithのUnder Mi Sleng Tengである。日本のCasio製の安価な鍵盤楽器Casiotone MT-40にもともと入っているリズム（プリセット）を使い、1984年末にWayne SmithとNoel Daveyが伴奏の原型を作り、プロデューサーのKing Jammyが調整して1985年に出した。Jammyはテンポを整え、ピアノなども重ねている。電子音の色合いがとても強い伴奏で、ジャマイカで初期のデジタル制作の代表例とされ、デジタル・リディムの先駆けと言われる。1980年代半ば以降の主流を電子化した。1990年代にはShabba Ranks、Buju Banton、Beenie Man、Bounty Killerらが活躍し、米国のヒップホップとの相互影響が深まった。深刻な問題として、1990年代から2000年代にかけて、同性愛者への暴力を扇動する歌詞が国際的な非難を浴び、欧米での公演中止や不買運動が相次いだ。これに対し2007年、Beenie Man、Capleton、Buju Banton、Sizzlaの4人の歌手が、人をあおるような歌詞を作らないという合意に署名したが、その実効性は議論が続いている。1990年代のShaggy（出世作は1993年のOh Carolina）や2000年代のSean Paulが英語圏の主流市場で成功し（Shaggyは、2000年発売のアルバムHot Shotで、2001年2月にアメリカのアルバムランキング（Billboard 200）の1位になった）、リディムの構造やパトワの歌い回しは、レゲトン、アフロビーツ、そして欧米のポップスに影響を与えたとされる。現在もジャマイカ国内では、サウンドシステムの夜が、地域社会の大切な娯楽・文化として根づいている。</p>
