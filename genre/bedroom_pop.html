<h1>Bedroom Pop（ベッドルームポップ）とは</h1>
<p>ベッドルーム・ポップは、ジャンルとしては2010年代半ば〜後半に定着したポップスだ。自室で、多くの場合は一人で制作を完結させる環境から生まれた。「ベッドルーム・ポップ」という語自体は、2006年にはすでに使われていた。起源には諸説</p>
<p>ベッドルーム・ポップは、ジャンルとしては2010年代半ば〜後半に定着したポップスだ。自室で、多くの場合は一人で制作を完結させる環境から生まれた。「ベッドルーム・ポップ」という語自体は、2006年にはすでに使われていた。起源には諸説ある。名前は、そのまま制作の場所を指している。

この音楽を決めるのは、主に制作環境だ。中身は、自宅録音、簡素な作り、ローファイ志向である。音そのものは多様だ。よく挙げられる特徴は、自宅制作、簡素な編成である。

Billie EilishやClairoなど一部の典型例では、歌い手がマイクに極めて近づき、囁くように、息の音が聞こえるほどの小さな音量で歌う。この物理的な近さが、親密さを生む。

歌詞は、片思い、自意識、退屈な日常、そして曖昧な不安を扱う。日記のような具体性を持つのが特徴だ。</p>
<h2>成り立ち</h2><p>2004年、AppleがMac向けのGarageBandを公開した。ただ、宅録はそれ以前から広がっていた。こうした制作ソフトがあれば、専門的な知識がなくても多重録音（音を一つずつ重ねて録ること）ができるようになったのである。この音楽は、ローファイと近いもの、あるいは同じものとして語られることが一般的で、「磨かれた音」とは言い切れない。

流通の条件も変わった。作品を音楽投稿サイトや動画共有サイトに置けば、レコード会社の選別を経ずに、世界中の聴き手へ届くようになった。

決定的な例は2017年だ。アメリカのClairoが、インディー・レーベルのテープ用に、自室でパソコンの内蔵カメラに向かって歌う様子を約30分で撮影した。その簡素な動画を投稿したところ、のちに1億回を超えて再生された（2024年時点で1億回超、同年7月の時点で約1億300万回）。簡素な動画から国際的な人気が生まれたという事実は、産業の仕組みそのものへの問いを含んでいた。

一方で彼女の場合、父親が靴ブランドConverseの最高マーケティング責任者（2007〜2016年）を務め、のちに広告代理店の社長になっていたことが知られている。そのため、これは自然に起きたことではなく、仕組まれたものではないかという疑惑が持ち上がった。本人は「仕込み」論を否定している。ただ、父の人脈が契約に役立ったとされ、本人も特権を認めている。この論争は、無名の若者が自然に見いだされるという物語が、どこまで本当なのかという問題を、はっきり浮かび上がらせた。

この分野の作り手は国際的だ。ノルウェー・ベルゲン生まれ・育ちでチリ出身の両親を持つBoy Pablo、メキシコ系アメリカ人のCuco、フィリピンのイロイロ市に生まれ3歳で英国に移住したBeabadoobee、ノルウェーのGirl in Redなど、出身や背景の異なる例が多い。

2020年前後には、短編動画の流行がこの流れを後押しした例がある。Beabadoobeeの2017年の曲「Coffee」をサンプリングした、Powfuの「Death Bed (Coffee for Your Head)」が、2020年初頭にTikTokで大ヒットした。制作の民主化という点での意義は大きい。</p>
