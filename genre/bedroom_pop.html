<h1>Bedroom Pop（ベッドルームポップ）とは</h1>
<p>2010年代に、自室で一人が完結させる制作環境から生まれたポップスである。名称はそのまま制作の場所を指す。音の質感が最大の特徴で、全体が柔らかく、輪郭が丸められている。ギターにはコーラスやフェイザーといった揺れを与える効果と、深い</p>
<p>2010年代に、自室で一人が完結させる制作環境から生まれたポップスである。名称はそのまま制作の場所を指す。音の質感が最大の特徴で、全体が柔らかく、輪郭が丸められている。ギターにはコーラスやフェイザーといった揺れを与える効果と、深い残響が常時かけられ、単音の分散和音がきらめくように鳴らされる。和声はロックの単純な三和音を離れ、長七の和音や、第九音を加えた響き、そして次々に色を変える進行が用いられる。これはジャズやシティポップからの影響であり、簡素な編成でありながら響きが豊かになる理由でもある。低音は打ち込みか、素朴に弾かれたベースで、旋律的に動く。ドラムは生演奏ではなく、簡素な打ち込みか、短い録音の繰り返しが用いられ、音量は控えめに保たれる。テンポは概ね80から110 BPMと穏やかである。歌唱が決定的で、マイクに極めて近づいて、囁くように、息の音が聞こえるほどの小さな音量で歌われる。この物理的な近さが親密さを生む。歌詞は片思い、自意識、退屈な日常、そして曖昧な不安を扱い、日記のような具体性を持つ。</p>
<h2>成り立ち</h2><p>技術的な前提は2000年代後半に整った。パソコンに標準で付属する制作ソフトと、数千円の接続機器があれば、専門的な知識がなくても多重録音が可能になったのである。1980年代のカセットによる宅録と決定的に違うのは、出来上がる音の質が必ずしも粗くない点だった。したがってこの分野は、ローファイの美学を継承しながらも、意図的に磨かれた温かい音を作ることができた。流通の条件も変わった。作品を音楽投稿サイトや動画共有サイトへ置けば、レコード会社の選別を経ずに世界中の聴き手へ届く。決定的な事例は2017年である。アメリカのClairoが、自室でパソコンの内蔵カメラに向かって歌う様子を撮った簡素な動画を投稿したところ、数千万回再生されるという事態が起きた。制作費はほぼ零であり、それでも国際的な人気が生まれるという事実は、産業の構造そのものへの問いを含んでいた。同時に彼女の場合、父親が広告の分野で働いていたことが判明し、これは自然発生ではなく仕組まれたものではないかという疑惑が持ち上がる。この論争は、無名の若者が自然に発見されるという物語が、どこまで本当なのかという問題を可視化した。この分野の作り手は国際的である。フィリピンのBoy Pablo、メキシコ系アメリカ人のCuco、イギリスのBeabadoobee、ノルウェーのGirl in Redなど、英語圏の中心以外から現れた例が多い。これは自室で作って直接発表できるという条件が、地理的な不利を無効化したことを示している。2020年前後には短編動画の流行がこの傾向をさらに加速させた。批判としては、音の質感が均質で互いに区別しにくいという指摘があるが、制作の民主化という点での意義は大きい。</p>
