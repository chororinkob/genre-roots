<h1>Banda（バンダ）とは</h1>
<p>金管と木管、そして打楽器だけで編成される、メキシコ北西部の大音量の吹奏楽。弦楽器を一切使わない点が最大の特徴で、通常12人から20人程度が、クラリネット、トランペット、トロンボーン、スーザフォンに似た低音金管のトゥーバ、そして打楽</p>
<p>金管と木管、そして打楽器だけで編成される、メキシコ北西部の大音量の吹奏楽。弦楽器を一切使わない点が最大の特徴で、通常12人から20人程度が、クラリネット、トランペット、トロンボーン、スーザフォンに似た低音金管のトゥーバ、そして打楽器で構成される。旋律はクラリネットとトランペットが高い音域で重ね、トゥーバが2拍子の低音を短く踏み鳴らして刻み、その間をトロンボーンが和音で埋める。打楽器はタンボーラという両面を撥で叩く大太鼓、タロラという小太鼓、シンバルの三点で、タンボーラの重い一撃が全体の推進力になる。テンポは曲種によって幅があり、ゆったりしたバラードから、150BPMを超える速いクンビアやランチェラまで扱う。歌唱は伴奏の音量に負けないよう、喉を開いて張り上げる力強い発声が求められる。歌詞は恋愛と失恋、故郷や母への思い、そして麻薬密輸業者の武勇伝を語るナルコ・コリードまで幅広い。屋外の広場、結婚式、闘牛場、そして路上での流しといった、拡声装置のない場で鳴ることを前提に、生の音量だけで数百人に届く設計になっている。</p>
<h2>成り立ち</h2><p>19世紀後半、メキシコ北西部のシナロア州で形をなした。直接の契機は、19世紀にヨーロッパから持ち込まれた軍楽隊の編成である。とくにドイツ系移民が伝えた金管楽器と、ポルカやマズルカ、ワルツといった舞曲が、地元の民謡や祝祭の音楽と混ざり合った。同時期にドイツ移民の影響を受けた北部のノルテーニョがアコーディオンを選んだのに対し、シナロアでは金管が選ばれ、以後この二つはメキシコ北部の二大様式として並び立つ。決定的な存在が、1938年にCruz Lizárragaがシナロア州エル・レコドの村で結成したBanda El Recodoである。同団はレコード録音と全国巡業を通じてバンダを地方の音楽から全国区の商品へ押し上げ、80年以上にわたって世代交代しながら活動を続けている。1990年代前半には大きな転機が訪れた。トゥーバを電気ベースに、生の管をシンセサイザーに置き換えたテクノバンダが登場し、これに合わせてケブラディータという曲芸的な男女のダンスが大流行する。Banda Machos、Banda Maguey、Banda El Limónらがこの波を作り、火が付いたのはメキシコ本国ではなくロサンゼルスのスペイン語ラジオ局だった。アメリカに暮らすメキシコ系移民が、故郷とのつながりを確認する音楽としてバンダを選んだのである。2000年代にはBanda MSやLa Arrolladora Banda El Limónがロマンチックな歌詞で市場を広げ、Julio PreciadoやEl Recodoが正統派として並んだ。だが影の部分も濃い。麻薬組織の首領を称えるナルコ・コリードを演奏する楽団は、抗争に巻き込まれて演奏者が殺害される事件が繰り返し起きており、一部の州では公共の場での演奏が条例で禁止された。それでもバンダはメキシコで最も売れる音楽の一つであり続け、近年はPeso Plumaらによる新しい世代がヒップホップの語法と結び付けて、世界的な聴衆を獲得している。</p>
