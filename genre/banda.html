<h1>Banda（バンダ）とは</h1>
<p>バンダは、メキシコ北西部で生まれた、大音量の吹奏楽だ。伝統的なバンダ・シナロエンセは、金管楽器と木管楽器、そして打楽器だけで編成される。弦楽器を使わない（伝統的なバンダ・シナロエンセの）点が最大の特徴である。 通常、10人から20</p>
<p>バンダは、メキシコ北西部で生まれた、大音量の吹奏楽だ。伝統的なバンダ・シナロエンセは、金管楽器と木管楽器、そして打楽器だけで編成される。弦楽器を使わない（伝統的なバンダ・シナロエンセの）点が最大の特徴である。

通常、10人から20人程度で演奏する。使う楽器は、クラリネット、トランペット、トロンボーン、スーザフォン（メキシコでは『トゥーバ』と呼ぶ）、そして打楽器だ。

旋律は、クラリネットとトランペットが高い音域で重ねる。トゥーバは、2拍子の低音を短く踏み鳴らして刻む。その間を、アルトホルンなどが和音で埋める。

打楽器は、タンボーラ（シンバルを取り付けた両面太鼓）、タロラという小太鼓、カウベル、シンバルなどだ。なかでもタンボーラの重い一撃が、全体を前へ進める力になる。

テンポは曲種によって幅があり、ランチェラ、クンビア、バラードなどを扱う。

歌詞は幅広く、恋愛と失恋、故郷や母への思いを歌う。麻薬密輸業者の武勇伝を語るナルコ・コリード（麻薬組織を題材にした物語歌）まで扱う。

かつては、屋外の広場、結婚式、闘牛場、そして路上での流しなどで、音響設備なしで演奏された。</p>
<h2>成り立ち</h2><p>19世紀（一般に1880年代とされる）に、メキシコ北西部のシナロア州で、バンダが定着した。

背景には、金管楽器（ピストン式）の普及と、軍楽隊への憧れがある。ただし村の楽団は、住民が楽器と曲目を自分たちで決める、独立した団体だった。ドイツ系商人が輸入楽器を販売して、普及を助けた。金管楽器と、ポルカやワルツといった舞曲が、地元の民謡や祝祭の音楽と混ざり合った。

一方、ノルテーニョは、19世紀後半の北東部で成立した。ドイツ、ポーランド、チェコ系移民の舞曲とアコーディオンが、メキシコの伝統と混ざったのである。バンダは北西部の吹奏楽だ。両者は別個に発達した音楽である。

決定的な存在が、Banda El Recodoである。1938年に、Cruz Lizárragaがシナロア州エル・レコドの村で結成した。同団は録音と巡業で知名度を全国に広げ、80年以上にわたって世代交代しながら活動を続けている。

その後、テクノバンダが登場する。時期は、1970年代後半（ナヤリット州）とも、1980年代半ばとも言われる。トゥーバを電気ベースに、サクソルンをキーボードに置き換えるなど、編成を単純にした形だ。1990年代前半にブームを迎えた。

これに合わせて、ケブラディータという曲芸的な（体をそらせる）男女のダンスが大流行する。Banda MachosやBanda Magueyらがこの波を作った。ロサンゼルスのスペイン語ラジオ局も、ブームの広がりに大きな役割を果たした。アメリカに暮らすメキシコ系移民が、故郷とのつながりを確認する音楽としてバンダを選んだとされる。

2000年代にはLa Arrolladora Banda El Limónが、2010年代にはBanda MSが、ロマンチックな曲調で人気を得た。Julio Preciadoは、1990年代にBanda El Recodoのボーカルを務めたのち、ソロ（Banda Perla del Pacífico）で活動するバンダ歌手である。ノルテーニョ曲の影響が強い。

だが、影の部分も濃い。2000年代後半以降、バンダなど北部系ジャンルの音楽家の殺害が相次いだ。麻薬組織の関与が疑われるが、多くは動機や犯人が未解明である。ナルコ・コリードの公共の場での演奏は、複数の州や市で禁止または制限された（シナロア州の禁止は最高裁が無効とした）。

それでもバンダは、近年、Banda MSなど、バンダの楽団がビルボードのラテン・チャートの上位に入るなど、再び人気を集めている。一方、バンダとは別の流れであるコリード・トゥンバードでは、Peso Plumaらの新しい世代が、ヒップホップの手法と結び付けて、世界的な聴衆を獲得している。</p>
