<h1>Taarab（タアラブ）とは</h1>
<p>タアラブは、アラブとインドとアフリカの要素が溶け合った歌謡だ。東アフリカのスワヒリ海岸、とりわけザンジバル島を中心に発展した。 初期は4〜5人ほどの小さな編成だったが、のちに大編成になった。古典的な形では、ヴァイオリンの群、アラブ</p>
<p>タアラブは、アラブとインドとアフリカの要素が溶け合った歌謡だ。東アフリカのスワヒリ海岸、とりわけザンジバル島を中心に発展した。

初期は4〜5人ほどの小さな編成だったが、のちに大編成になった。古典的な形では、ヴァイオリンの群、アラブの撥弦楽器であるウード、箱型の撥弦楽器であるカーヌーン、手風琴、そしてさまざまな打楽器で組まれる。

メロディーの土台は、アラブ音楽の旋法の仕組みであるマカームだ。西洋の平均律には無い微分音が使われる。ただし後年のザンジバルの曲では、四分音を含まないマカームが好まれる傾向がある。ヴァイオリンの群はこの旋法を斉奏し、歌のメロディーをなぞって厚みを出すとされる。

リズムの出どころは、形式ごとに違う。ワルツやルンバなど、エジプト系の歌謡形式の流れを引く形式がある。在来の歌舞であるンゴマ、女性の成女儀礼の踊りであるウニャゴ、モンバサ系の要素を取り込んだ形式もある。テンポも形式によって異なる。古典的なタアラブは座って聴く音楽だが、女性のタアラブや現代のタアラブは踊りを伴う。

歌い方は細かい飾りを多く使う。旋律はスライドやトリルなどの装飾で飾られ、歌い手の即興も重んじられる。歌われる言葉は、今はスワヒリ語が中心だ。ただし初期や一部では、アラビア語で歌われた。

歌詞はこの音楽の核心とされ、詩としての出来が厳しく問われるという。恋愛を主題にしながら、たとえと掛け言葉を何重にも重ね、表の意味と裏の意味を持たせる。婚礼の場で歌うときには、特定の相手への当てこすりを詩に忍ばせる習わしがある。聴き手は、それを読み解くことを楽しむ。</p>
<h2>成り立ち</h2><p>ザンジバルは長いあいだ、インド洋交易の要所だった。アラビア半島、ペルシア、インド、そしてアフリカ内陸を結ぶ結び目である。19世紀にはオマーンのスルタンが首都をこの島に移し、島は丁子の栽培と奴隷交易で栄える。こうした幾重にも重なる文化の環境が、この音楽の土台になっている。

19世紀後半、スルタン・バルガシュ・ビン・サイード(在位1870〜1888年)の時代に、宮廷で定着したと伝えられる。伝承では、バルガシュが青年Mohamed Ibrahimをカイロに送ってカーヌーンを学ばせ、帰国後に宮廷の楽団を作らせた。エジプトの楽団も招いたとされる。ただし、これは唯一の起源説ではない。名前は、アラビア語で音楽による喜びや陶酔を意味する語に由来する。

20世紀初頭に決定的な役割を果たしたのが、シティ・ビンティ・サアドだ。奴隷の家系に生まれた彼女は、この音楽で最初の有名な女性歌手となった。さらにスワヒリ語で歌い、録音を広く流通させて大衆化した。彼女の歌は、この音楽を宮廷の外へ出した。ただし、宮廷の外で最初の公開タアラブ・クラブであるNadi Ikhwani Safaaは、すでに1905年にできていた。彼女は1928年にインドのボンベイで録音を行い、東アフリカで最初期の商業録音を残した人物となった。

女性たちのタアラブ・クラブは、1930年代にシティ・ビンティ・サアドに触発され、女性の互助組織であるレレママを土台にして広がった。歌い手や聴き手の中心は女性で、伴奏は雇われた男性の楽士が務めた。婚礼の場で歌われる、辛辣で直接的な内容の詩は「mipasho」と呼ばれる。女性たちによるタアラブはタアラブ・ヤ・ワナワケと呼ばれ、女性たちが公然と不満や皮肉を表す場になった。

しかし独立後の1964年、ザンジバル革命によってアラブ系の支配層が倒され、多くのアラブ系住民が殺されたり追放されたりする。この激変は音楽にも影響を与えたが、スタイルそのものは生き残った。

1990年代以降は、電子楽器を使った派生が生まれた。伝統的なスタイルは今も、婚礼や祝祭の場で演奏されている。</p>
