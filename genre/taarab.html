<h1>Taarab（タアラブ）とは</h1>
<p>東アフリカのスワヒリ海岸、とりわけザンジバル島を中心に発展した、アラブとインドとアフリカの要素が融合した歌謡である。編成は大規模で、ヴァイオリンの群、アラブの撥弦楽器であるウード、箱型の撥弦楽器であるカーヌーン、手風琴、そして各種</p>
<p>東アフリカのスワヒリ海岸、とりわけザンジバル島を中心に発展した、アラブとインドとアフリカの要素が融合した歌謡である。編成は大規模で、ヴァイオリンの群、アラブの撥弦楽器であるウード、箱型の撥弦楽器であるカーヌーン、手風琴、そして各種の打楽器で構成される。数十人規模の楽団が組まれることもある。旋律の骨格はアラブ音楽の旋法体系であるマカームに基づいており、西洋の平均律には存在しない微分音が用いられる。ヴァイオリンの群がこの旋法を斉奏し、歌の旋律をなぞって厚みを作る。リズムはアラブ由来の打楽器の型を土台としつつ、スワヒリ海岸の拍の感覚が加わって独自の揺れを持つ。テンポは中庸で、踊るというより聴かせるための音楽として機能する。歌唱は装飾を多用し、長い音を細かく揺らす技法が重視される。使われる言語はスワヒリ語である。歌詞がこの音楽の核心をなし、詩としての完成度が厳しく問われる。恋愛を主題としながら、比喩と掛け言葉を幾重にも重ね、表面上の意味と裏の意味を持たせる。婚礼の場で歌われる際には、特定の相手への当てこすりを詩に忍ばせる慣習があり、聴衆はそれを読み解くことを楽しむ。</p>
<h2>成り立ち</h2><p>ザンジバルは長くインド洋交易の要衝であり、アラビア半島、ペルシア、インド、そしてアフリカ内陸を結ぶ結節点だった。十九世紀にはオマーンのスルタンが首都をこの島に移し、丁子の栽培と奴隷交易によって繁栄する。この多層的な文化環境が音楽の土壌をなしている。成立の契機とされるのが1870年代である。当時のスルタン、バルガシュ・ビン・サイードがエジプトのカイロへ音楽家を派遣し、アラブの宮廷音楽を学ばせたと伝えられる。帰国した彼らが宮廷で演奏したものが、次第に一般へ広がっていった。名称はアラビア語で音楽による喜びや陶酔を意味する語に由来する。二十世紀初頭に決定的な役割を果たしたのがシティ・ビンティ・サアドである。奴隷の家系に生まれた彼女は、それまで男性のものだったこの音楽に女性として参入し、さらに従来のアラビア語ではなくスワヒリ語で歌うという転換を行った。これによって音楽は宮廷の教養から民衆のものへ変わる。彼女は1928年にインドのボンベイで録音を行い、東アフリカで最初期の商業録音を残した人物となった。独立後の1964年、ザンジバル革命によってアラブ系支配層が打倒され、多数のアラブ系住民が殺害または追放される。この激変は音楽にも影響を与えたが、様式そのものは生き残った。二十世紀後半には女性の楽団が数多く結成され、婚礼の場で歌われる直接的な内容の詩が発達する。これはタアラブ・ヤ・ワナワケと呼ばれ、女性たちが公然と不満や皮肉を表明する場として機能した。1990年代以降は電子楽器を用いた高速の派生が生まれ、若い世代に受け入れられている。伝統的な様式は現在も婚礼と祝祭に不可欠なものとして続いている。</p>
