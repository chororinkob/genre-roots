<h1>Kaguraとは</h1>
<p>神楽は、神社の祭礼で神に捧げるために奏でられる日本の歌舞だ。代表曲22曲を動画で聴け、ルーツと影響のつながりを地図でたどれる。</p>
<p>神楽は、神社の祭礼で神に捧げるために奏でられる日本の歌舞だ。神を迎える場を、音と動きで作り出す音楽である。

編成は神楽の種類によって違う。御神楽は神楽笛・篳篥・和琴・笏拍子、石見神楽は大太鼓・締太鼓・手打鉦・横笛、江戸の里神楽は笛・大拍子・長胴太鼓を使う。

音の中心になるのは神楽笛という竹の横笛だ。篳篥が加わると、太いリードの音が旋律を担う。宮中の御神楽では、和琴という6本の弦の琴を、琴軋という撥を右手に持ってかき鳴らす。笏拍子という2枚の板が拍を刻む。石見神楽では太鼓と銅拍子が主役になり、巫女は鈴と榊の枝を手に舞う。

旋律は雅楽の調子を土台にした単旋律である。同じ節を笛と声が付奏の形でなぞり、篳篥は息の圧で音の高さを細かく揺らす。

笏拍子には、決まったリズムで打つ場合と、曲中の決まった箇所で打つ場合がある。役目は音楽全体の調子を整えることだ。テンポは、静かな舞から、石見神楽の大蛇のように打楽器が走る速い場面まで幅がある。太鼓は縁を打つ鋭い音と胴を打つ低い音を打ち分け、舞手の踏み込みに合わせてアクセントが落ちる。

宮中の御神楽で歌われる歌は神楽歌と呼ばれ、地声のみで神の名や土地の名を長く引き伸ばす。阿知女作法では「あ〜ち〜め」「お〜お〜お」「お〜け」と唱え、神を呼び寄せる呪文として扱う。この言葉の意味は判明していない。安曇磯良を指すとする説や、「うずめ」の転訛とする説がある。本方と末方が交互に唱え、笏拍子と和琴が伴う。巫女の声は細く、太夫の声は太く、同じ旋律でも発声がまるで違う。

歌詞は神話の場面、五穀豊穣の願い、氏子の家の繁栄を並べる。石見神楽では歌よりも台詞と見得が重くなり、基本的に神楽面を着けた舞手が、神話の登場人物を演じきる。

曲は一続きの組曲として組み立てられる。御神楽は人長の所作に始まり、神楽音取、庭火、阿知女作法、榊、韓神、早韓神と続く。出雲流の佐陀神能は、交互ではなく3部構成だ。直面で舞う七座の採物舞、式三番、面を着けた神話劇の神能という順で並ぶ。境内の神楽殿や、夜を徹して続く祭りの庭が、この音楽の実際に鳴る場所だ。

雅楽の管絃とは違い、里神楽は神と参拝者に向けて奏でられる祈りの音楽であり、民謡のように日常で口ずさむ歌ではない。能や歌舞伎とも違い、舞手と観客が同じ地面に立って同じ夜を過ごす。</p>
<h2>成り立ち</h2><p>神楽の始まりは、神話の中にある。古事記と日本書紀は、天照大神が天岩戸に隠れて世が暗くなったとき、天鈿女命が桶の上で舞い、周りの神々が笑い転げたと伝える。天鈿女命の子孫とされる猿女君は、宮中で鎮魂の儀を担った。そこから、神楽の原型は招魂や鎮魂のための神遊びだったと考えられている。「かぐら」という名は神座（かむくら）が転じたものとされ、神が降りる場所そのものを指した。

御神楽の伴奏は、和琴・神楽笛・篳篥・笏拍子である。平安時代中期にはスタイルが固まり、神楽歌は伝本におよそ90首が残る。内侍所御神楽は長保4年（1002年）または寛弘2年（1005年）から隔年で行われ、後に毎年の行事になった。毎年12月の年中行事になったのは長暦2年（1038年）で、後朱雀天皇の勅命によるとされる。源流には、大嘗祭の清暑堂で行われた琴歌神宴、賀茂臨時祭の還立の神楽、石清水八幡宮臨時祭の神楽がある。宮中の賢所では、今も12月に宮内庁式部職楽部が簡略化した御神楽を奏でる。

しかし宮中だけで終わらなかった。御神楽の型が各地の村に下り、里神楽として土地の信仰と混ざって育つ。ただし里神楽の源流は、系統ごとに別々に示されており、諸説ある。出雲の佐太神社では御座替神事に採物舞と神能が組み込まれ、これが佐陀神能になった。佐陀神能の成立は1608年（慶長13年）で、江戸時代の初めにあたる。石見神楽は、室町時代後期にはすでに演じられていたとされ、出雲流・能・狂言・歌舞伎の影響で演劇性を増した。備中神楽は、神職だけが行う荒神神楽が元だ。西林国橋（1764〜1828）が神話をもとに「神代神楽」を編成したのは、江戸中期から末期とされる。一方、伊勢外宮の神楽役が各地を回って湯立の儀を伝えたとされ、霜月神楽や花祭と呼ばれる湯立神楽になった。東北では山伏が舞う早池峰神楽が受け継がれ、伊勢の太神楽は獅子頭を神体として町を巡った。

江戸の町では、神事舞太夫と呼ばれる専門職が神社の祭礼を請け負った。浅草蔵前の若山家は元締めとして里神楽を束ねたと伝え、稲城の山本家は応安6年（1373年）の創始を伝える。明治になると風向きが変わる。明治政府の敬神思想により、明治3年（1870年）と4年（1871年）に「神職演舞禁止令」が出た。出雲では、松江藩が1870年に神能の上演を禁止し、島根県は1872年に素人神楽の禁止令を出した。禁止の結果、氏子が舞い手になった。それでも氏子の保存団体が演目を守り続け、芸は途切れなかった。

1908年の皇室祭祀令は御神楽を小祭と定めたが、戦後の1947年に祭祀令は廃止された。宮中の楽師たちは職を失わず、御神楽は12月の行事として残った。

1970年の大阪万博では、石見神楽の大蛇が「お祭り広場」の「日本のまつり」で上演され、全国に知られるようになった。浜田の植田菊市は、明治30年代ごろに提灯をヒントに蛇胴を考案した人物で、この演目の見せ場を作った。竹と石州和紙で作る現行品は約17〜18メートルである。各地の神楽は保存会と神楽団によって支えられ、島根や広島では今も舞台の太鼓が響く。国の重要無形民俗文化財に指定された神楽は40件（2022年10月時点）にのぼる。2022年10月11日には、29神楽・71団体が全国神楽継承・振興協議会を立ち上げた。早池峰神楽は2009年、佐陀神能は2011年にユネスコ無形文化遺産に登録された。2025年11月28日には、文化審議会無形文化遺産部会が、神楽を2028年の審議を目指す提案候補に選んだ。

神楽は祭りのたびに作り直される生きた音楽であり、楽譜より身体と口伝えで受け渡されてきた。神を招く笛の音と、夜明けまで続く太鼓の連打が、このジャンルの現在形だ。</p>
