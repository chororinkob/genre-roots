<h1>Kaguraとは</h1>
<p>神楽は、神社の祭礼で神に捧げるために奏でられる日本の歌舞で、神を迎える場を音と動きで作り出す音楽だ。代表曲22曲を動画で聴け、ルーツと影響のつながりを地図でたどれる。</p>
<p>神楽は、神社の祭礼で神に捧げるために奏でられる日本の歌舞で、神を迎える場を音と動きで作り出す音楽だ。笛と太鼓と声だけで、訪れた神と人が同じ場所に居合わせる時間を組み立てる。

音の中心になるのは神楽笛という竹の横笛だ。篳篥が加わると、太いリードの音が旋律を低く支える。宮中の御神楽では和琴という6本の弦の琴が爪でかき鳴らされ、笏拍子という2枚の板が拍を刻む。里神楽では太鼓と銅拍子が主役になり、巫女は鈴と榊の枝を手に舞う。

旋律は雅楽の調子を土台にした単旋律で、三味線や箏のような和音はほとんど鳴らない。同じ節を笛と声がユニゾンでなぞり、篳篥は息の圧で音の高さを細かく揺らす。長く伸ばした音の末尾がわずかに下がり、その微妙な移ろいが神の気配を表す。

拍子は八拍子を基本にし、笏拍子が強拍を打つ。テンポはおおよそ60〜70 BPM の静かな舞から、石見神楽の大蛇のように打楽器が走る速い場面まで幅がある。太鼓は縁を打つ鋭い音と胴を打つ低い音を打ち分け、舞手の踏み込みに合わせてアクセントが落ちる。

歌は神楽歌と呼ばれ、甲高い裏声で神の名や土地の名を長く引き伸ばす。阿知女作法では「あぢめ」という意味を持たない音だけを唱え、神を呼び寄せる呪文として扱う。巫女の声は細く、太夫の声は太く、同じ旋律でも発声がまるで違う。

歌詞は神話の場面、五穀豊穣の願い、氏子の家の繁栄を並べる。石見神楽では歌よりも台詞と見得が重くなり、素面の舞手が神話の登場人物を演じきる。

曲は一続きの組曲として組み立てられる。御神楽は人長の所作に始まり、神楽音取、庭火、阿知女作法、榊、韓神、早韓神と続く。採物舞と神能が交互に置かれる里神楽では、静かな舞のあとに面をつけた激しい舞が来る。境内の神楽殿や、夜を徹して続く祭りの庭が、この音楽の実際に鳴る場所だ。

雅楽の管絃とは違い、神楽は神と参拝者に向けて奏でられる祈りの音楽であり、民謡のように日常で口ずさむ歌ではない。能や歌舞伎とも違い、舞手と観客が同じ地面に立って同じ夜を過ごす。</p>
<h2>成り立ち</h2><p>神楽の始まりは神話の中にある。古事記と日本書紀は、天照大神が天岩戸に隠れて世が暗くなったとき、天鈿女命が桶の上で舞い、周りの神々が笑い転げたと伝える。天鈿女命の子孫とされる猿女君が宮中で鎮魂の儀を担ったことから、神楽の原型は招魂や鎮魂のための神遊びだったと考えられている。「かぐら」という名は神座（かむくら）が転じたものとされ、神が降りる場所そのものを指した。

大和の朝廷はこの舞を儀式に取り込み、笛と琴と拍子木を添えて整えた。平安時代中期には様式が固まり、神楽歌はおよそ90首が残る。内侍所御神楽は長保4年（1002年）に制度化され、後に毎年の行事になった。源流には大嘗祭の清暑堂で行われた琴歌神宴、賀茂臨時祭の還立の神楽、石清水八幡宮臨時祭の神楽がある。宮中の賢所では今も12月に宮内庁式部職楽部が簡略化した御神楽を奏でる。

しかし宮中だけで終わらなかった。御神楽の型が各地の村に下り、里神楽として土地の信仰と混ざって育つ。出雲の佐太神社では御座替神事に採物舞と神能が組み込まれ、これが佐陀神能になった。江戸時代初期にはこの流れが中国地方へ広がり、演劇性を強めた石見神楽や備中神楽が生まれる。一方、伊勢外宮の神楽役が各地を回って湯立の儀を伝え、霜月神楽や花祭と呼ばれる湯立神楽になった。東北では山伏が舞う早池峰神楽が受け継がれ、伊勢の太神楽は獅子頭を神体として町を巡った。

江戸の町では神事舞太夫と呼ばれる専門職が神社の祭礼を請け負った。浅草蔵前の若山家は元締めとして里神楽を束ね、稲城の山本家は応安6年（1373年）の創始を伝える。明治になると風向きが変わる。1871年、石見の神職たちは芝居がかった神楽は神の威厳を損なうとして上演を禁じた。それでも氏子の保存団体が演目を守り続け、芸は途切れなかった。

1908年の皇室祭祀令は御神楽を小祭と定めたが、戦後の1947年に祭祀令は廃止された。宮中の楽師たちは職を失わず、御神楽は12月の行事として残った。

1970年の大阪万博では石見神楽の大蛇がメインステージで上演され、全国に知られるようになった。浜田の植田菊市が竹と石州和紙で作った長さ約17メートルの蛇胴が、この演目の見せ場を作った。各地の神楽は保存会と神楽団によって支えられ、島根や広島では今も舞台の太鼓が響く。国の重要無形民俗文化財に指定された神楽は40件（2022年10月時点）にのぼり、2022年10月11日には29神楽・71団体が全国神楽継承・振興協議会を立ち上げた。早池峰神楽は2009年、佐陀神能は2011年にユネスコ無形文化遺産に登録され、2025年11月28日には文化庁が神楽を2028年提案の候補に選んだ。

神楽は祭りのたびに作り直される生きた音楽であり、楽譜より身体と口伝えで受け渡されてきた。神を招く笛の音と、夜明けまで続く太鼓の連打が、このジャンルの現在形だ。</p>
