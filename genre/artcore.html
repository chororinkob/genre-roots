<h1>Artcore（アートコア）とは</h1>
<p>ドラムンベースの速いブレイクビーツに、ピアノの美しいメロディを重ねた、日本発の電子音楽だ。代表曲22曲を動画で聴け、ルーツと影響のつながりを地図でたどれる。</p>
<p>ドラムンベースの速いブレイクビーツに、ピアノの美しいメロディを重ねた、日本発の電子音楽だ。一言でいえば「感傷的なピアノが鳴るドラムンベース」である。中心になる楽器はアコースティックなピアノで、16分音符のアルペジオや、抒情的な主旋律を弾き続ける。

ストリングスも多く使われ、オーケストラのような弦の音が、曲の緊張と高揚を支える。和音はクラシック音楽のような劇的な進行が好まれ、短調の感傷的なメロディが多い。

リズムはドラムンベースの土台そのものだ。重いスネアが落ちるブレイクビーツが、170から200を超えるまで幅のある速いテンポで刻まれ、テンポを落としたハーフテンポの曲もある。細かい刻みと、重い低音のベースが対比になる。

ボーカルは少ないが、例外もある。使う場合もソプラノのサンプリングやコーラス程度で、歌詞による物語よりも、楽器による情景の描写が中心だ。

曲の組み立ては、静かなピアノのイントロから始まり、ドラムが入って畳みかけ、サビで主旋律が再登場して情感を決める展開が定番だ。曲ごとの展開がドラマチックで、聴かせどころがはっきりしている。変拍子やトランス、ハードコアの要素を混ぜる例もあり、作り手ごとにスタイルが大きく違う「何でもアリ」な自由さがある。ドラムンベースのほかの派生との違いは、ダンスの高揚感より、旋律の美しさと情感に比重を置く作品が多い点にある。音ゲーや同人イベントの会場、ニコニコ動画やYouTubeの投稿で聴かれることが多い。</p>
<h2>成り立ち</h2><p>アートコアという名前は、1994年9月に批評家Simon Reynoldsが、ambient jungleの別名として使ったのが始まりだ。1995年には、レーベルReactが同じ名前のコンピレーションを出した。1990年代半ばに流行したドラムンベースの派生ジャンル「インテリジェント」は、同じ音を指す、もう一つの呼び名である。この浮遊感のある音はアートコアやアンビエントドラムンベースという名前でも呼ばれ、LTJ BukemやFabio、Omni Trioらが代表的な存在で、Good Looking Recordsが作品群を出した。速いブレイクビーツにアンビエントやジャズの要素を混ぜた音は、4heroなど同じ時代の多くのアーティストにも影響を与えたが、インテリジェントという排他的な印象の名前が敬遠され、シーンから薄れていった。

一方、日本では別の流れが育った。1998年冬にドラムンベースを初めて聴いて刺激を受けたMoongateは、1999年から2001年にかけて、BMSという無料の音楽ゲーム用データ形式で作品を発表した。1999年9月のARMYTOM『EDENS』と、同じ年の11月のDJ FenLile（現：Xacla）『chaotic city 2125』が、BMS界隈にジャンル名アートコアを持ち込んだ。2000年11月11日に公開された『Only in Silence...』は、配布データで「アートコア系のドラムンベースです」と自分で名乗り、BMSまとめ@wikiでは音ゲーアートコアの元祖と位置づけられている（異説あり）。しかしMoongateは2001年にBMS制作をやめた。作曲活動自体は2003年まで続け、2005年にはサイトが閉鎖された。

その後、2002年にOnokenが同人として発表した『felys』が、型を定着させた。幻想的なピアノの旋律を高速なブレイクビーツに重ねる組み立てが、以後のアートコアの土台になった。曲は当初ドラムンベース名義だったが、遅くとも2005年までに、リミックス作者SHiNKAのreadmeでアートコアとも呼べると書かれた。2020年には、リメイク版（final remix）を『felys Artcore Collection』に収録して発表した。dj TAKAがD.J.Amuro名義でbeatmania IIDX 7th styleに提供した『A』は、ジャンル名ルネッサンスで収録され、このジャンルの形成に影響を与えたとされる。そして2004年のbeatmania IIDX 10th styleでは、Ryu☆の『Narcissus At Oasis』が、アーケード音ゲーで最初期のArtcoreというジャンル名を冠したとされる。

その後、ジャンルは同人音楽シーンと音ゲーの両輪で広がった。Onokenが作品を発表してきたDiverse Systemが同人側の集まる場となり、xiの『Halcyon』『ANiMA』、Siromaruとcrankyの『conflict』、Sakuzyoの『Altale』『Fracture Ray』、Feryquitousの『Dstorv』、Laurの『PRAGMATISM』などが、アートコアとして語られることがある。音ゲー側の代表曲としては、TJ.hangneilの『神威』（韓国のアーケード音ゲーEZ2DJ収録）などがある。DJ TOTTOはアーケード音ゲーで『Valanga』『Adularia』を、ARTCOREというジャンル名で発表した。現在はニコニコ動画やYouTubeに投稿が集まり、同人音楽イベントBOF（THE BMS OF FIGHTERS）で毎年新作が発表されている（2024年はBOF:TT）。日本の同人音楽発祥の電子音楽で、広義にはJ-coreに含められることがある一方、海外のリスナーにも愛好者ができている。</p>
