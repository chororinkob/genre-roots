<h1>Artcore（アートコア）とは</h1>
<p>ドラムンベースの高速なブレイクビーツに、ピアノの美しいメロディを重ねた日本発の電子音楽である。代表曲22曲を動画で聴け、ルーツと影響のつながりを地図でたどれる。</p>
<p>ドラムンベースの高速なブレイクビーツに、ピアノの美しいメロディを重ねた日本発の電子音楽である。一言でいえば「感傷的なピアノが鳴るドラムンベース」だ。中心になる楽器はアコースティックなピアノで、16分音符のアルペジオや抒情的な主旋律を弾き続ける。ストリングスも多用され、オーケストラ風の弦の音が曲の緊張と高揚を支える。和音はクラシック音楽風の劇的な進行が好まれ、短調の感傷的なメロディが多い。リズムはドラムンベースの土台そのもので、重いスネアが落ちるブレイクビーツが170前後の高速テンポで刻まれ、細かい刻みと重低音のベースが対比になる。ボーカルはほとんど入らず、使う場合もソプラノのサンプリングやコーラス程度で、歌詞による物語よりも器楽の情景描写が中心である。曲の組み立ては、静かなピアノのイントロから始まり、ドラムが入って畳みかけ、サビで主旋律が再登場して情感を決める展開が定番だ。曲ごとの展開がドラマチックで、聴かせどころがはっきりしている。変拍子やトランス、ハードコアの要素を混ぜる例もあり、作り手ごとにスタイルが大きく違う「何でもアリ」な自由さがある。ドラムンベースのほかの派生との違いは、ダンスフロア向けの高揚感ではなく美しさと情感を曲の目的に置く点にある。音ゲーや同人イベントの会場、ニコニコ動画やYouTubeの投稿で聴かれることが多い。</p>
<h2>成り立ち</h2><p>アートコアという名前の源流は、1990年代半ばに流行したドラムンベースの派生ジャンル「インテリジェント」にある。この浮遊感のある音はアートコアやアンビエントドラムンベースという名前でも呼ばれ、LTJ BukemやFabio、Omni Trioらが代表で、Good Looking Recordsが作品群をリリースした。速いブレイクビーツにクラシックやジャズの要素を混ぜた音は4heroら後進に影響を与えたが、インテリジェントという排他的な印象の名前が敬遠され、シーンから薄れていった。

一方、日本では別の流れが育った。1998年冬にドラムンベースを初めて聴いてインスピレーションを受けたMoongateは、1999年から2001年にかけてBMSという無料の音楽ゲーム用データ形式で作品を発表した。1999年のARMTOMではなくARMTOM『EDENS』とDJ FenLile（現：Xacla）『chaotic city 2125』がBMS界隈にジャンル名アートコアを持ち込み、2000年11月11日に公開された『Only in Silence...』は配布データで「アートコア系のドラムンベースです」と自分で名乗り、音ゲーアートコアの元祖とされる。しかしMoongateは2001年にBMS制作をやめ、2005年にはサイトが閉鎖されて消息が途絶えた。

これを受けてOnokenが2002年に同人として発表した『felys』が型を定着させた。幻想的なピアノの旋律を高速なブレイクビーツに重ねる構成は、以後のアートコアの土台になった。曲は当初ドラムンベース名義だったが、2005年ごろのリミックス版のreadmeでアートコアとも呼べると書かれ、2020年には『felys Artcore Collection』として再発表された。アーケード音ゲーBEMANIにも源流があり、dj TAKAがD.J.Amuro名義でbeatmania IIDX 7th styleに提供した『A』はジャンル名ルネッサンスで収録され、このジャンルの形成に影響を与えたとされる。そして2004年のbeatmania IIDX 10th styleでは、Ryu☆『Narcissus At Oasis』がアーケード音ゲーで最初期のArtcoreジャンル名を冠したとされる。

その後、ジャンルは同人音楽シーンと音ゲーの両輪で広がった。Onokenが作品を発表してきたDiverse Systemが同人側の集積の場となり、xi『Halcyon』『ANiMA』、Siromaruとcrankyの『conflict』、Sakuzyo『Altale』『Fracture Ray』、Feryquitous『Dstorv』、Laur『PRAGMATISM』、TJ.hangnail『神威』などが代表作として知られる。DJ TOTTOはアーケード音ゲーで『Valanga』『Adularia』をARTCOREのジャンル名で発表した。現在はニコニコ動画やYouTubeに投稿が集まり、同人音楽イベントBOF:TTでも新作が発表され続けている。日本の同人音楽発祥の電子音楽という広義のJ-coreに含められる一方、海外のリスナーにも愛好者ができている。</p>
