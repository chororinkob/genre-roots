<h1>Group Sounds（グループサウンズ）とは</h1>
<p>グループ・サウンズは、1960年代後半の日本で流行した、エレクトリックギターを中心とするバンド編成の大衆音楽だ。 編成は、リードヴォーカル、複数のギター、ベース、ドラムスが基本で、オルガンを加えるグループもあった。いわゆるビートグ</p>
<p>グループ・サウンズは、1960年代後半の日本で流行した、エレクトリックギターを中心とするバンド編成の大衆音楽だ。

編成は、リードヴォーカル、複数のギター、ベース、ドラムスが基本で、オルガンを加えるグループもあった。いわゆるビートグループの形を、そのまま取り入れている。音の土台は、イギリスの1960年代前半のビートグループの表現だ。歯切れの良いギターの刻み、簡素な和音の流れ、複数の声による合唱が使われる。

しかしメロディーは、はっきりと日本の歌謡曲のものだ。短調の、哀愁を帯びた音の運びがよく使われる。西洋の編成で、日本の旋律を演奏する。この混ぜ合わせが、この分野の本質である。

さらに、楽曲の多くは演奏者自身ではなく、歌謡曲の分野で活動していた職業作曲家と作詞家が書いた。そのため編曲に弦楽合奏や管楽器が加えられる例も見られ、バンドの自作自演という理念とは距離がある。

バラード調の曲も多かった。

見た目も重要だった。揃いの衣装、長髪、そして少女たちの熱狂を前提にした売り出し方が、音楽と一体で仕立てられていた。</p>
<h2>成り立ち</h2><p>1966年、The Beatlesが日本にやって来た。これが大きなきっかけである。6月29日に来日し、6月30日から7月2日にかけて日本武道館で公演を行った。ただし1965年5月には、ザ・スパイダースが最初のグループ・サウンズのレコードとされる「フリフリ」を出しており、起点は1965〜66年とされる。もっとも黒沢進は、当時はグループ・サウンズの概念が完成しておらず、インストゥルメンタル中心のエレキバンドの時代だったとしている。

武道館は、本来は武道のための施設だ。そこで外国のロックバンドが演奏することへの反発は大きく、右翼団体の抗議があり、厳戒態勢の警備が敷かれた。

一方、日本では1965年1月のザ・ベンチャーズの来日以降に、エレキブームが起きていた。ビートルズ来日以降は、エレキギターを弾きながら歌うグループが、次々とデビューするようになった。彼らの多くは、それ以前にエレキギターの器楽演奏の流行を経験していた。そこへ、歌を伴うバンドという形が加わったのである。

1967年から1968年にかけて、この流行はピークに達した。ザ・スパイダースは、音楽と喜劇的な演出を両立させた。ザ・タイガースは、沢田研二の甘い容貌で圧倒的な人気を得る。ザ・テンプターズの萩原健一は荒々しい魅力で対抗し、横浜のザ・ゴールデン・カップスは演奏技術の高さで一目置かれた。ジャッキー吉川とブルー・コメッツが1967年に発表した楽曲は、日本レコード大賞の大賞を受けた。大賞を受けたグループ・サウンズは、ジャッキー吉川とブルー・コメッツだけとされる。

しかし、この流行は社会との摩擦を生んだ。長髪と派手な衣装は、不良のしるしとされた。学校は、観客側の生徒がコンサートに参加することを禁じた。NHKも、1967年11月の事故の後、長髪系グループ・サウンズの出演を禁じた。

1969年春には、主要メンバーの脱退が相次いだ。1970年頃にブームは終わりを迎え、1971年に入ると、ほとんどのグループが解散したり、自然に消えたりした。原因には諸説ある。代表曲の多くが職業作家の提供曲で、自作自演を目指すバンドとの間に摩擦があったこと。そして、自作自演を掲げるフォークや、より本格的なロックを目指す新しい世代が現れたこと。こうした点などが指摘されている。

解散したメンバーの一部は、俳優やタレントなどの道へ進み、一部は音楽家として活動を続けた。

この分野は、長く軽く見られてきた。しかし、1980年代半ば以降、黒沢進らの研究や近田春夫の再検証などを経て、再評価が進んだ。日本のロックが出来上がる過程で欠かせない段階だった、という見方もある。</p>
