<h1>Group Sounds（グループサウンズ）とは</h1>
<p>1960年代後半の日本で流行した、エレクトリックギターを中心とするバンド編成の大衆音楽である。編成はギター二本、ベース、ドラムに、しばしば小型の電子オルガンが加わる、いわゆるビートグループの形をそのまま採用している。音の面では、イ</p>
<p>1960年代後半の日本で流行した、エレクトリックギターを中心とするバンド編成の大衆音楽である。編成はギター二本、ベース、ドラムに、しばしば小型の電子オルガンが加わる、いわゆるビートグループの形をそのまま採用している。音の面では、イギリスの1960年代前半のビートグループの語法が土台となっており、歯切れの良いギターの刻み、簡素な和音進行、複数の声による合唱が用いられる。しかし旋律は明確に日本の歌謡曲のもので、短調の哀愁を帯びた音の運びと、ヨナ抜き音階に近い旋律が多用される。この、西洋の編成で日本の旋律を演奏するという折衷が、この分野の本質である。加えて、楽曲の多くは演奏者自身ではなく、歌謡曲の分野で活動していた職業作曲家と作詞家によって書かれた。したがって編曲には弦楽合奏や管楽器が加えられることも多く、バンドの自作自演という理念とは距離がある。テンポは中庸から速く、曲は3分前後。歌詞は恋愛が中心で、感傷的で叙情的な言葉が選ばれる。視覚面も重要で、揃いの衣装、長髪、そして少女たちの熱狂を前提とした売り出し方が、音楽と一体で設計されていた。</p>
<h2>成り立ち</h2><p>直接の引き金は1966年6月である。この月、The Beatlesが来日し、日本武道館で公演を行った。武道館は本来武道のための施設であり、そこで外国のロックバンドが演奏することへの反発は大きく、右翼団体の抗議や厳戒態勢の警備が敷かれた。しかしこの公演を境に、日本各地で無数の若者がエレクトリックギターを手にする。彼らの多くは、それ以前にエレキギターの器楽演奏の流行を経験しており、そこへ歌を伴うバンドという形式が加わったのである。1967年から1968年にかけて、この流行は頂点に達した。ザ・スパイダースは音楽と喜劇的な演出を両立させ、ザ・タイガースは沢田研二の甘い容貌によって圧倒的な人気を得る。ザ・テンプターズの萩原健一は荒々しい魅力で対抗し、横浜のザ・ゴールデン・カップスは演奏技術の高さで一目置かれた。ブルー・コメッツが1967年に発表した楽曲は、この分野で唯一の大きな賞を受けている。しかしこの流行は社会的な軋轢を伴った。長髪と派手な衣装は不良の象徴とされ、学校が公演への参加を禁じ、一部の放送局が特定のバンドの出演を認めないという事態も起きている。終焉は急速だった。1969年から1970年にかけて、聴き手の関心が急激に離れ、多くのバンドが解散する。原因としては、ほぼ全てが職業作家の楽曲に依存していたため独自性が乏しかったこと、そして自作自演を掲げるフォークや、より本格的なロックを志向する新しい世代が現れたことが挙げられる。解散した構成員の一部は喜劇や司会の分野へ移り、一部は音楽家として活動を続けた。この分野は長らく軽んじられてきたが、日本のロックの成立過程における不可欠な段階として、近年は再評価が進んでいる。</p>
