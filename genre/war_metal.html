<h1>War Metal（ウォーメタル）とは</h1>
<p>ウォーメタルは、第一波ブラックメタルを主な源とし、デスメタルとグラインドコアの要素を取り込んだエクストリームメタルだ。構造や旋律を意図的に壊した、混沌とした形である。特徴の一つは、ローファイな録音である。意図してノイズや歪みを加え</p>
<p>ウォーメタルは、第一波ブラックメタルを主な源とし、デスメタルとグラインドコアの要素を取り込んだエクストリームメタルだ。構造や旋律を意図的に壊した、混沌とした形である。特徴の一つは、ローファイな録音である。意図してノイズや歪みを加えたとされる作品もあるが、その作り手は、録音できる環境が貧しかったとも語っている。

ドラムはブラストビートで、極端な速さで叩かれる。音が割れたシンバルが、全体を覆い尽くす。

ギターはトレモロ・ピッキングで、和音とも雑音ともつかない歪みの塊を鳴らし続ける。リフの輪郭は、聴き取れないことが前提とされている。ベースは強く歪まされ、低い音は塊になって押し寄せる。

ヴォーカルは、獣の唸りに近いグロウルやスクリームで、言葉は聴き取りにくい。

曲は短く、展開らしい展開もない。そして、断ち切られるように終わる。旋律や和音はほとんど前に出ず、聴き手が受け取るのは主に密度と圧力である。

見た目の面では、実弾を模した装飾帯、鋲の付いた腕当て、防毒面、コープスペイント、サングラスといった装いが組み合わされる。同じ極端さでも、テクニカルなデスメタルが組み立てを目指すのに対し、こちらは徹底して破壊と退行を目指す。</p>
<h2>成り立ち</h2><p>ウォーメタルは、1980年代前半の第一波ブラックメタル（Venom、Hellhammer、Bathoryなど）から派生した。

この流れを押し進めたのが、1980年代後半のブラジルだ。当時のブラジルは独裁政権から民主化への移行期で、経済も不安定だった。機材や資金も乏しかった。そうした環境の中で、SarcófagoのI.N.R.I.(1987)は、ウォーメタルの形成に大きな影響を与えた。

一方、中心的な存在となったのは、1984年にカナダ西岸のバンクーバーで活動を始めたBlasphemyである（現名義への改称は1986〜87年）。彼らは1990年に発表した作品で、旋律を後ろに下げ、すべてを轟音に沈めるやり方を押し進めた。「Winds of the Black Godz」のように、テープ操作や、逆回転・減速したドイツ語オペラを使った曲もある。リード・ギタリストのCaller of the Stormsは黒人で、これは「異例」と評された。バンドとつながりのあるバンクーバー島の集団Ross Bay Cultは、ビクトリアにあるRoss Bay墓地にちなんで知られ、同名のレーベルとしても紹介される。

ほかの地域でも動きが続いた。フィンランドでは、Beheritが儀式的・オカルト的な要素、Archgoatが反キリスト教的な主題と原始的な演奏の作品を残した。オーストラリアのBestial Warlust、シンガポールのImpietyといった各地の集団も、これに呼応した。

ウォーメタルという呼び名は、オーストラリアのBestial Warlustのメンバーが名づけたとする説が一般的だ。ただし、Holocausto(1987)の裏面の表記を最初とする説もある。別名は「war black metal」「bestial black metal」である。

Blasphemyのデモは1,000〜2,000本超とされ、フルアルバムはWild Rags(米)やOsmose(仏)といった正規のレーベルから出た。1991年創設のフランスのオズモーズ・プロダクションズは、1993年にBlasphemyの『Gods of War』を原盤で発売した。再発を担ったのは、2001年に設立されたアメリカのNuclear War Now! Productionsだ。『Gods of War』も、Nuclear War Now! Productionsがオズモーズ・プロダクションズから権利を取得して再発した。

ブラックメタル界隈では国家社会主義ブラックメタルをめぐる論争があり、ウォーメタル周辺でも個別の批判や論争がある。批判を受けたバンドや主催者の側が、非難を否定した例もある。</p>
