<h1>War Metal（ウォーメタル）とは</h1>
<p>ブラックメタルとデスメタルの原初的な部分だけを抽出し、構造や旋律を意図的に破壊した、最も混沌とした形のエクストリームメタルである。最大の特徴は、演奏の精度も録音の明瞭さも積極的に放棄している点にある。ドラムは毎分250打を超える速</p>
<p>ブラックメタルとデスメタルの原初的な部分だけを抽出し、構造や旋律を意図的に破壊した、最も混沌とした形のエクストリームメタルである。最大の特徴は、演奏の精度も録音の明瞭さも積極的に放棄している点にある。ドラムは毎分250打を超える速度で叩かれるが、拍が揃うことはなく、シンバルの飽和した音が全体を覆い尽くす。ギターは調弦が正確に合っていないまま、和音とも雑音ともつかない歪みの塊を鳴らし続け、リフの輪郭は聴き取れないことが前提とされている。ベースは音程を失うほど歪まされ、低域は塊として押し寄せる。ヴォーカルは言語としての明瞭さを完全に捨てた、獣の唸りに近い咆哮で、歌詞カードなしでは一語も判別できない。曲は2分前後と短く、展開らしい展開を持たず、始まった時点で最大の混沌に達しており、そのまま断ち切られるように終わる。旋律も和声も存在せず、聴き手に与えられるのは密度と圧力だけである。視覚面では、実弾を模した装飾帯、覆面、防毒面、逆さの十字といった軍事と冒涜の記号が組み合わされる。同じ極端さでもテクニカルなデスメタルが構築を志向するのに対し、こちらは徹底して破壊と退行を志向する。</p>
<h2>成り立ち</h2><p>直接の祖先は1980年代前半の第一波ブラックメタルにある。スイスのHellhammerとスウェーデンのBathoryが残した、演奏技術も録音環境も貧弱なまま作られた作品は、その未熟さゆえの禍々しさによって、後に洗練を拒む価値観の原点となった。この方向を極限まで押し進めたのが、1980年代半ばのブラジルである。政治的に不安定で輸入盤も機材も手に入りにくい環境の中、Sarcófagoが1987年に発表した作品は、暴力的な速度と統制の欠如によって、南米独自の獰猛な系統を打ち立てた。決定的な存在となったのはカナダ西岸のバンクーバーで1984年に結成されたBlasphemyである。彼らは1990年に発表した作品で、旋律を完全に排し、全てを轟音に沈める手法を確立した。構成員の一部は黒人であり、白人至上主義的な思想が入り込みがちなこの領域において、彼らの存在は例外的な意味を持った。地元の墓地の名を冠した集団を名乗り、後にこの周辺の音楽全体を指す通称にもなっている。フィンランドではBeheritとArchgoatが、儀式的で呪術的な側面を強調した作品を残し、オーストラリアのBestial Warlust、シンガポールのImpietyといった各地の集団が呼応した。ウォーメタルという呼称自体は1990年代を通じて自然に広まったもので、戦争の記号を多用する視覚表現と、音楽そのものの暴力性の双方に由来する。流通は当初から極めて限定的で、カセットの手渡しと郵便による交換が主な手段であり、数百枚単位のプレスが常態だった。2000年代以降はアメリカのNuclear War Now! Productionsやフランスのオズモーズ・プロダクションズといったレーベルが再発と発掘を進め、世界的な小規模の共同体が形成される。ただしこの分野は深刻な問題も抱えている。反キリスト教と戦争の記号を掲げる性質上、実際に極右思想を公然と表明する集団と近接しやすく、公演の中止や出演拒否をめぐる論争が繰り返されてきた。多くの参加者は政治的な含みを否定するが、記号の危うさは今も解消されていない。</p>
