<h1>Baile Funk（バイレファンキ）とは</h1>
<p>ブラジル・リオデジャネイロの貧民街ファヴェーラで生まれ、屋外の大音量パーティーで鳴らされるダンス音楽。BPMは125〜135前後で、最大の特徴はタンボルザォンと呼ばれるリズム・パターンにある。これは1980年代のマイアミ・ベースの</p>
<p>ブラジル・リオデジャネイロの貧民街ファヴェーラで生まれ、屋外の大音量パーティーで鳴らされるダンス音楽。BPMは125〜135前後で、最大の特徴はタンボルザォンと呼ばれるリズム・パターンにある。これは1980年代のマイアミ・ベースの一曲に由来する打楽器のループで、三連符的に跳ねる不均等な刻みが、四つ打ちとは全く違うよろけるような推進力を生む。低音はTR-808系の深いキックが担い、屋外のスピーカーの壁で鳴らすことを前提に極端に強調される。上物は極めて少なく、短いシンセの刺し、サイレン、銃声や爆発音のサンプル、そして観客の掛け声が使われる。ラップと歌の中間のような発声で、ポルトガル語による掛け合いが延々と続き、聴衆が応答することで曲が完成する。歌詞は性的な誘惑、地区への誇り、警察との緊張、経済的な困窮など、生活に直結する題材を極めて直截に扱う。曲の長さは短く、二分前後で切り上げるものも多い。近年はよりテンポを落として重心を下げたファンキ・ブルーチ、細かく刻むファンキ・パウリスタなど地域ごとの派生が生まれ、それぞれ異なる身体の動かし方を要求する。</p>
<h2>成り立ち</h2><p>1970年代のリオデジャネイロでは、米国のソウルやファンクをかけるダンスパーティーが盛んに開かれており、これがバイレという呼称の起源である。1980年代に入るとマイアミ・ベースやエレクトロのレコードが流入し、地元のDJがこれをポルトガル語の掛け合いと組み合わせ始めた。決定的だったのは1989年、マイアミのプロデューサーHassanが発表したUm Bom Baianoに含まれる打楽器のループで、これがブラジルで抜き出され、無数の曲の土台として繰り返し使われた結果、タンボルザォンという共通のリズム基盤が成立した。1990年代を通じてファヴェーラの屋外パーティーが最大の発表の場となり、DJ MarlboroことFernando Luís Mattosがラジオとレコードを通じてこの音を都市全体に広げた。同時期、パーティーが麻薬取引組織の資金源および勢力誇示の場として機能したことから、警察による摘発と規制が繰り返され、音楽そのものが犯罪と結び付けて語られる時期が長く続いた。とりわけ、対立する組織の抗争を煽る内容のプロイビダォンと呼ばれる楽曲群は法的に禁じられ、地下でのみ流通した。2000年代にはDiploら国外のDJがこの音を紹介し、2004年前後から欧米のクラブで注目を集めたが、これはしばしば貧困を消費する視線として現地から批判された。2010年代以降、MC Fioti、Anitta、Ludmillaといった作家がブラジル国内の主流の音楽産業へ進出し、リオ五輪前後には国を代表する文化として扱われるまでになった。同時に、YouTubeとWhatsAppを通じた自主流通が確立し、レコード会社を介さずに数千万回再生される曲が生まれる構造ができた。現在は世界のダンス音楽に広く引用される一方、発祥地の社会的な状況は改善されておらず、その落差が繰り返し議論の的となっている。</p>
