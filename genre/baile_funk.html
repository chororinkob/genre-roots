<h1>Baile Funk（バイレファンキ）とは</h1>
<p>ブラジル・リオデジャネイロの貧民街ファヴェーラで生まれ、屋外の大音量パーティーで鳴らされるダンス音楽。BPM（1分間の拍数）は伝統的には130前後が標準的で、最大の特徴はタンボルザォンと呼ばれるリズム・パターンにある。これは198</p>
<p>ブラジル・リオデジャネイロの貧民街ファヴェーラで生まれ、屋外の大音量パーティーで鳴らされるダンス音楽。BPM（1分間の拍数）は伝統的には130前後が標準的で、最大の特徴はタンボルザォンと呼ばれるリズム・パターンにある。これは1980年代のロサンゼルスのエレクトロやマイアミのエレクトロ／フリースタイルなどの曲の打楽器のループ（繰り返し）を土台に1990年代以降に形づくられたもので、アタバキ（ブラジルの太鼓）の節回しと同じ調子の刻みが、四つ打ちとは全く違うよろけるような前へ進む勢いを生む。低音はTR-808系の深いキックが担い、屋外のスピーカーの壁で鳴らすことを前提に極端に強調される。上物（メロディーなど上に重ねる音）は極めて少なく、短いシンセの刺しやサンプル、そして観客の掛け声が使われる。ラップと歌の中間のような発声で、ポルトガル語による掛け合いが延々と続き、聴衆が応答することで曲が完成する。歌詞は性的な誘惑、地区への誇り、警察との緊張、経済的な困窮など、生活に直結する題材を非常に率直に扱う。ライブでの1回の出演は短い。派生も多く、2018年には150BPMのファンク、2020年代にはサンパウロ南部で生まれた攻撃的でホラー調のファンキ・ブルシャリアが現れ、ほかにリオ発のよりテンポの遅いラスタリーニャ（約96BPM）や、サンパウロのファンキ・パウリスタ（130BPM前後）など地域ごとの派生があり、それぞれ異なる身体の動かし方を要求する。</p>
<h2>成り立ち</h2><p>1970年代のリオデジャネイロでは、米国のソウルやファンクをかけるダンスパーティーが盛んに開かれており、これがこの音楽の前史にあたる。「バイレ」はポルトガル語で舞踏会（ダンスパーティー）の意味で、ブラジルでは「baile funk」はパーティーそのものも指す。1980年代に入るとマイアミ・ベースやエレクトロのレコードが流入し、地元のDJがこれをポルトガル語の掛け合いと組み合わせ始めた。初期には、1988年発売のシングル「8 Volt Mix」（Techno Hop Records）に収録されたDJ Battery Brainの「808 Volt Mix」や、Hassan名義の「Pump Up the Party」（1987/88年）の打楽器のループが使われ、そこから1990年代以降にタンボルザォンという共通のリズム基盤が生まれた。タンボルザォンは、1997年にDJ Luciano OliveiraとDJ Cabideが作ったとする説が流布しているが、1999年とする当事者の資料もあり、発明者・年とも定説はない。支配的なリズムになったのは2000年代とされる。1990年代中盤以降、バイレの重心がファヴェーラ内へ移り、DJ MarlboroことFernando Luís Mattos da Mattaがラジオとレコードを通じてこの音を都市全体に広げた。同時期、麻薬取引組織が資金を出す「コミュニティのバイレ」があり、勢力誇示の場にもなり、90年代には暴力沙汰も重なって、警察による取り締まりと規制が繰り返され、音楽そのものが犯罪と結び付けて語られる時期が長く続いた。とりわけ、麻薬取引や犯罪組織の称賛、敵対組織への挑発を歌うプロイビダォンと呼ばれる楽曲群は、主にコミュニティ内のパーティーで演奏され、一部のコミュニティ・ラジオでも流れた。「犯罪の擁護」罪での個別の起訴や法案の動きはあったが、ジャンル全体が法的に禁じられたとまでは言えない。2000年代にはDiploら国外のDJがこの音を紹介し、2004年前後から欧米のクラブで注目を集めた。2010年代以降、MC Fioti、Anitta、Ludmillaといった作家がブラジル国内の主流の音楽産業へ進出し、リオ五輪では公式曲や開会式で採用された一方、現場では取り締まりが続いた。同時に、YouTubeを軸にした独立系制作会社（KondZillaなど）による配信が広がり、数千万回再生される曲が生まれる構造ができた。現在は世界のダンス音楽に広く引用される一方、規制や警察の取り締まりが続いており、発祥地の社会的な状況との落差が繰り返し議論の的となっている。</p>
