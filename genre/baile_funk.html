<h1>Baile Funk（バイレファンキ）とは</h1>
<p>バイレ・ファンキは、ブラジル・リオデジャネイロの貧民街ファヴェーラで生まれたダンス音楽だ。屋外の大音量パーティーで鳴らされる。 最大の特徴は、タンボルザォンと呼ばれるリズム・パターンにある。これは1980年代のロサンゼルスのエレク</p>
<p>バイレ・ファンキは、ブラジル・リオデジャネイロの貧民街ファヴェーラで生まれたダンス音楽だ。屋外の大音量パーティーで鳴らされる。

最大の特徴は、タンボルザォンと呼ばれるリズム・パターンにある。これは1980年代のロサンゼルスのエレクトロやマイアミのエレクトロ/フリースタイル等の曲の、打楽器のループ（繰り返し）を土台に、1990年代に生まれた。アタバキ（ブラジルの太鼓）の節回しと同じ調子の刻みが、四つ打ちとは全く違う、よろけるような前へ進む勢いを生む。

BPM（1分間の拍数）は、130BPM前後が標準的だ。低音は、TR-808系の深いキックが担う。屋外のスピーカーの壁で鳴らすことを前提に、極端に強調される。

上物（メロディーなど上に重ねる音）は極めて少ない。短いシンセの刺し、サイレン、銃声や爆発音のサンプル、そして観客の掛け声が使われる。

歌は、ラップと歌の中間のような発声だ。ポルトガル語による掛け合いが延々と続き、聴衆が応答することで曲が完成する。歌詞は、性的な誘惑、地区への誇り、警察との緊張、経済的な困窮など、生活に直結する題材を非常に率直に扱う。

ライブ出演は短い。

近年は、地域や時期ごとに派生が生まれた。2018年には150BPMのファンク（DJ Polyvox、Rennan da Penha）が現れた。2020年代にはサンパウロ南部で、攻撃的でホラー調のファンキ・ブルシャリア（約130〜150BPM）が生まれた。ほかに、リオ発のラスタリーニャ（約96BPM）や、サンパウロのパウリスタ系（130BPM前後）がある。それぞれ異なる身体の動かし方を要求する。</p>
<h2>成り立ち</h2><p>1970年代のリオデジャネイロでは、米国のソウルやファンクをかけるダンスパーティーが盛んに開かれていた。これが、この音楽の前史にあたる。「バイレ」はポルトガル語で舞踏会（ダンスパーティー）の意味だ。ブラジルでは「baile funk」は、パーティーそのものも指す。

1980年代に入ると、マイアミ・ベースやエレクトロのレコードが流入した。地元のDJは、これをポルトガル語の掛け合いと組み合わせ始めた。

初期には、DJ Battery Brainの、1988年発売のシングル「8 Volt Mix」（Techno Hop Records）収録曲や、Hassan名義の「Pump Up the Party」（1987/88年）の、打楽器のループが使われた。そこからタンボルザォンが生まれ、支配的なリズムになったのは2000年代である。タンボルザォンは1997年説（Vice）が流布しているが、1999年とする当事者資料もあり、発明者・年とも定説はない。

90年代中盤以降、バイレの重心がファヴェーラ内へ移った。DJ MarlboroことFernando Luís（Luiz表記もある）Mattos da Mattaが、ラジオとレコードを通じて、この音を都市全体に広げた。

同時期、麻薬組織が資金を出す「コミュニティのバイレ」があり、勢力誇示の場にもなった。90年代には暴力沙汰も重なって規制が繰り返され、音楽そのものが犯罪と結び付けて語られる時期が長く続いた。

とりわけ、麻薬取引や犯罪組織の称賛、敵対組織への挑発を歌うプロイビダォンと呼ばれる楽曲群は、主にコミュニティ内のパーティーで演奏された。一部のコミュニティ・ラジオでも流れた。「犯罪の擁護」罪での個別の起訴や法案の動きはあったが、ジャンル全体が法的に禁じられたとまでは言えない。

2000年代には、Diploら国外のDJがこの音を紹介した。2004年前後から欧米のクラブで注目を集めた。

2010年代以降、MC Fioti、Anitta、Ludmillaといった作家が、ブラジル国内の主流の音楽産業へ進出した。リオ五輪では、公式曲や開会式で採用された一方、現場では取り締まりが続いた。同時に、YouTubeを軸にした独立系制作会社（KondZilla等）による配信が広がった。

現在は、世界のダンス音楽に広く引用される。一方で、規制や警察の取り締まりが続いており、その落差が繰り返し議論の的となっている。</p>
