<h1>Latin Pop（ラテンポップ）とは</h1>
<p>ラテン・ポップは、米国式のポップの作り方とラテン音楽を融合させたジャンルだ。歌はスペイン語が中心で、ポルトガル語なども含む。地域で見ると、メキシコからカリブ海、南米、スペイン、そしてアメリカのラテン系の共同体までが含まれ、スタイル</p>
<p>ラテン・ポップは、米国式のポップの作り方とラテン音楽を融合させたジャンルだ。歌はスペイン語が中心で、ポルトガル語なども含む。地域で見ると、メキシコからカリブ海、南米、スペイン、そしてアメリカのラテン系の共同体までが含まれ、スタイルは一定しない。それでも、共通する特徴がある。

編成には管楽器の斉奏（全員が同じ旋律を一斉に吹くこと）や生ギターが入ることもある。近年は打ち込みと電子音が主体となったとされる。

まず、メロディーが重視される。覚えやすく、感情の起伏が大きいメロディーが書かれる。和声（コードの響き）は基本的な進行を使いながら、短調と長調の間の陰影を丁寧に扱う。

アップテンポの曲には、ラテンアメリカのダンス音楽の要素が織り込まれることが多い。キューバ由来の非対称なリズム型（クラーベ／トレシージョ。拍子は2/4や4/4）、コロンビアのクンビアの跳ね、ドミニカのメレンゲの速い2拍子、カリブ海の跳ねた4拍子などが使われる。コンガ、ティンバレス、ボンゴ、ギロといった、ラテン系の打楽器やリズムが取り入れられることがある。テンポは、ゆったりした恋愛歌から踊るための速い曲まで幅広い。

歌い方は抑えず、伸びやかに歌い上げる。

歌詞は恋愛を扱う曲が多い（特にバラード）。情熱と喪失が率直に語られる。言葉はスペイン語が中心だが、ポルトガル語や英語との併用や、それらを混ぜる手法も一般的である。</p>
<h2>成り立ち</h2><p>スペイン語圏では、1960年代から1970年代にかけて、感傷的な恋愛歌のスタイルが広く流行した。これがラテン・ポップの土台である。

担い手は、スペインのCamilo Sesto、メキシコのJosé Joséのほか、1970年代に恋愛歌手として評価され、スペイン語盤も制作したブラジルのRoberto Carlosといった歌手だ。彼らは大編成の弦楽合奏（弦楽器の合奏）を伴う劇的な曲で、国境を越えた市場を作り上げた。この時期に、スペイン語という共通の言葉による広い市場ができていたことが、後の展開の前提となる。

1980年代、マイアミ発のクロスオーバーが始まった。キューバ革命の後にマイアミへ移り住んだキューバ系の共同体が、この街を制作の拠点に変えたのである。Emilio Estefanは、妻のGloria Estefanがリードを務めるMiami Sound Machineを擁し、キューバのリズムと英語圏のポップスを組み合わせた曲をプロデュースした。そして『Primitive Love』（1985）と『Conga』で、アメリカの主流市場へ食い込んだ。マイアミは主要な拠点の一つとなり、1990年代には大手各社がラテン部門を置いた。

1990年代には、Luis Miguelが古典的な恋愛歌を洗練された形で復活させた。コロンビアのShakiraは、ロックの手法を持ち込んだ。テキサスではSelenaが、メキシコ系アメリカ人の音楽を若い世代へ届けた。しかし1995年、ファンクラブの責任者に射殺されるという衝撃的な最期を迎えた。

1999年、Ricky Martinがアメリカのグラミー賞の授賞式で、前年の曲を、英語とスペイン語が混ざったバイリンガル版で演奏した。これをきっかけに、いわゆるラテンの爆発と呼ばれる現象が起こる。ただし、この時期の成功は、主に英語作品で達成されたものだった。

スペイン語曲の存在感が大きく高まったのは、2010年代後半である。2017年、Luis Fonsi&amp;Daddy Yankeeの『Despacito』は、Justin Bieber参加のリミックス（別の人が作り直した版）との合算で、当時、史上最も再生された曲となった。ほぼスペイン語の曲としては、1996年のMacarena以来となるアメリカのHot 100首位も獲得した。ただしその首位は、冒頭に英語の歌詞が加わったリミックスの投入後に、合算で達成されたものだった。

その後、Bad BunnyやKarol Gといった、ラテン・ポップと隣接するレゲトン、都市型ラテン音楽の担い手が、スペイン語のまま国際的な頂点に立っている。Rosalíaは、スペイン語を軸にしつつ、多言語・ジャンル横断で評価されている。</p>
