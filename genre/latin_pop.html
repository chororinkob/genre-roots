<h1>Latin Pop（ラテンポップ）とは</h1>
<p>スペイン語圏のポップスの総称である。地理的にはメキシコからカリブ海、南米、スペイン、そしてアメリカのラテン系共同体までを含み、様式は一定しない。それでも共通する特徴がある。まず旋律の重視で、覚えやすく感情の起伏の大きい線が書かれ、</p>
<p>スペイン語圏のポップスの総称である。地理的にはメキシコからカリブ海、南米、スペイン、そしてアメリカのラテン系共同体までを含み、様式は一定しない。それでも共通する特徴がある。まず旋律の重視で、覚えやすく感情の起伏の大きい線が書かれ、歌唱は抑制せず伸びやかに歌い上げる。和声は基本的な進行を用いつつ、短調と長調の間の陰影が丁寧に扱われる。リズムには必ずラテンアメリカの舞踏音楽の要素が織り込まれ、キューバ由来の非対称な拍節、コロンビアのクンビアの跳ね、ドミニカのメレンゲの速い二拍子、あるいはカリブ海の跳ねた四拍子が用いられる。打楽器はコンガ、ティンバレス、ボンゴ、ギロといった生の楽器が加えられ、これが同時代の英語圏のポップスとの最も明確な違いとなる。編成には管楽器の斉奏や生ギターも入り、近年は打ち込みと電子音が主体となった。テンポは緩やかな恋愛歌から踊るための速い曲まで幅広い。歌詞は恋愛が圧倒的に中心で、情熱と喪失が直截に語られる。言語はスペイン語だが、英語との併用や、両者を混ぜる手法も一般的である。</p>
<h2>成り立ち</h2><p>土台にあるのは1960年代から1970年代にスペイン語圏全域で流行した、感傷的な恋愛歌の様式である。ブラジルのRoberto Carlos、スペインのCamilo Sesto、メキシコのJosé Joséといった歌手が、大編成の弦楽合奏を伴う劇的な楽曲によって、国境を越えた市場を作り上げた。この時期に、スペイン語という共通言語による広域の市場が成立していたことが、後の展開の前提となる。1980年代、産業の中心が移動する。キューバ革命後にマイアミへ移住したキューバ系の共同体が、この都市を制作の拠点へ変えたのである。Emilio Estefanは、妻のGloria Estefanを擁して、キューバのリズムと英語圏のポップスを結合させた楽曲を作り、1985年の作品でアメリカの主流市場へ食い込んだ。以後マイアミはラテン音楽の産業的な中心地であり続けている。1990年代にはLuis Miguelが古典的な恋愛歌を洗練された形で復活させ、コロンビアのShakiraがロックの語法を持ち込んだ。テキサスではSelenaが、メキシコ系アメリカ人の音楽を若い層へ届けたが、1995年、ファンクラブの責任者に射殺されるという衝撃的な最期を迎えた。1999年、Ricky Martinがアメリカの授賞式で演奏した楽曲を機に、いわゆるラテンの爆発と呼ばれる現象が起こる。ただしこの時期の成功は、英語で歌うことによって達成されたものだった。状況が根本から変わったのは2010年代後半である。2017年、Luis Fonsiの楽曲が、スペイン語のまま世界中で最も再生された曲となった。配信の普及によって、英語へ翻訳しなくとも世界市場へ届くという事実が証明されたのである。以後、Bad BunnyやRosalía、Karol Gといった作り手が、スペイン語のまま国際的な頂点に立っている。</p>
<h2>代表曲</h2><ul><li>Livin' la Vida Loca (Ricky Martin)</li><li>Hips Don't Lie (Shakira)</li><li>Bailando (Enrique Iglesias)</li></ul>
