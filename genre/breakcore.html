<h1>Breakcore（ブレイクコア）とは</h1>
<p>ブレイクビーツを極端に細かく切り刻み、意図的に破綻させて組み直す電子音楽。中心になるのはアーメン・ブレイクと呼ばれる4小節のドラム・ループで、これを16分音符や32分音符、さらには不規則な長さで刻み、順序を入れ替え、音程を上下させ</p>
<p>ブレイクビーツを極端に細かく切り刻み、意図的に破綻させて組み直す電子音楽。中心になるのはアーメン・ブレイクと呼ばれる4小節のドラム・ループで、これを16分音符や32分音符、さらには不規則な長さで刻み、順序を入れ替え、音程を上下させ、逆再生し、聴き手が拍を数えられなくなるまで解体する。テンポは160〜220BPM程度だが、途中で半分になったり倍になったり、拍子が5拍子や7拍子へ突然変わることも珍しくない。低音はガバ由来の歪んだバスドラムやサブベースが担い、上物にはアニメの台詞、演歌や歌謡曲、クラシック、ジャズの断片など、脈絡を無視した素材が貼り込まれる。この文脈の衝突そのものが表現であり、笑いと暴力が同居する。和声はほとんど顧みられず、代わりに音の密度と情報量の飽和が快楽の源になる。曲の構成に定型はなく、数十秒ごとに別の曲へ変わったように聴こえるものも多い。踊ることは前提にされておらず、聴取と、混沌に耐える体力そのものが試される。制作はパソコン上の音楽制作ソフトで一人で完結し、少部数のレコードやインターネットで配布されてきた。</p>
<h2>成り立ち</h2><p>1990年代半ば、ジャングルとガバとインダストリアルの接点で生まれた。直接の起点はロンドンで、1995年頃にDJ ScudとAphasicが設立したレーベルAmbushや、Christoph Fringeliが運営したPraxisが、ジャングルのブレイクビーツにハードコア・テクノの歪んだバスドラムと騒音を混ぜた作品を発表した。同時期のベルリンでは、Atari Teenage Riotを率いたAlec Empireが1994年にDigital Hardcore Recordingsを設立し、パンクの政治性と電子音の暴力を結び付けている。同レーベルのChristoph de Babalonが1997年に発表した「If You're Into It, I'm Out of It」は、暗いアンビエントと切り刻まれたブレイクビーツを組み合わせた重要作とされる。呼称としてのブレイクコアが定着したのは1990年代末で、インターネットの掲示板やファイル共有の普及が、地理的に散らばった作り手を一つのシーンにまとめた。2000年代に入ると、カナダのVenetian Snaresこと Aaron Funkが中心的な存在になる。彼は変拍子と極端に精緻な編集を持ち込み、2005年の「Rossz Csillag Alatt Született」ではハンガリーの管弦楽の録音とブレイクビーツを組み合わせて、この分野の代表作となった。オランダのBong-Ra、イギリスのShitmat、アメリカのOtto von Schirach、フランスのRuby My Dearらが各国で活動し、日本でもM1dyらのスピードコアと交差した。制作環境の側では、パソコン用の音楽制作ソフトが安価に手に入るようになったことが決定的で、一人で完結する制作と、ネットを通じた無料または少額での配布が前提となった。娯楽性と実験性、悪ふざけと真剣さの区別を意図的に壊す態度が一貫しており、2010年代以降もオンライン上の小さな共同体を通じて作品が作られ続けている。</p>
