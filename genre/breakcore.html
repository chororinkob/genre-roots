<h1>Breakcore（ブレイクコア）とは</h1>
<p>ブレイクコアは、ブレイクビーツ（切り刻んだドラムの音）を極端に細かく切り刻み、意図的に破綻させて組み直す電子音楽だ。 しばしば中心になるのは、アーメン・ブレイクと呼ばれる4小節のドラム・ループである。これを16分音符や32分音符、</p>
<p>ブレイクコアは、ブレイクビーツ（切り刻んだドラムの音）を極端に細かく切り刻み、意図的に破綻させて組み直す電子音楽だ。

しばしば中心になるのは、アーメン・ブレイクと呼ばれる4小節のドラム・ループである。これを16分音符や32分音符、さらには不規則な長さで刻む。順序を入れ替え、音程を上下させ、逆再生し、聴き手が拍を数えられなくなるまで解体する。

テンポは、おおむね160BPM前後から200BPM超（1分間の拍数）で、さらに高速の例も多い。途中で半分になったり倍になったりする。拍子が5拍子や7拍子（変則的な拍子）へ突然変わることも珍しくない。

低音は、ガバ由来の歪んだバスドラムや、サブベース（体に響く極低音）が担う。上物（メロディーなど上に重ねる音）には、クラシックの断片など、脈絡を無視した幅広い素材が貼り込まれる。この文脈の衝突そのものが表現であり、笑いと暴力が同居する。

和声（コードの響き）を重視しない作品も多い。ただし、旋律や和声を作り込む流れも定着している。音の密度と情報量の飽和が、快楽の源になる。

曲の構成に定型はない。数十秒ごとに別の曲へ変わったように聴こえるものも多い。ダンスフロアやレイヴ文化と結びついた音楽だが、踊りにくい／踊らない聴き方も成立する。

制作は、パソコン上の音楽制作ソフトで一人で完結する。少部数のレコードやインターネットで配布されてきた。</p>
<h2>成り立ち</h2><p>1990年代半ばから後半に、ジャングルやハードコア（ガバ含む）、ドラムンベースの流れから生まれた。起点は一か所に絞れない。米ミルウォーキー、仏レンヌ、伊ボローニャ、ロンドン、ベルリンなどの各地で、並行して形づくられた。

ロンドンでは、1996年後半にDJ ScudとAphasicが設立したレーベルAmbushが生まれた。Christoph Fringeliが運営した、ロンドンで設立されたPraxisもあった。これらは、ジャングルのブレイクビーツにハードコア・テクノの歪んだバスドラムと騒音を混ぜた作品を発表した。

やや先行して、Atari Teenage Riotを率いたAlec Empireらが、ロンドンを拠点に1994年にDigital Hardcore Recordings（録音は主にベルリン）を設立した。パンクの政治性と電子音の暴力を結び付けている。同レーベルのChristoph de Babalonが1997年に発表した「If You're Into It, I'm Out of It」は、暗いアンビエントと切り刻まれたブレイクビーツを組み合わせた重要作とされる。

インターネットの掲示板やファイル共有（ネット上でファイルを交換すること）の普及が、地理的に散らばった作り手を一つの音楽の世界にまとめたとされる。ジャンルの定義そのものにも議論がある。

2000年代に入ると、カナダのVenetian Snaresこと Aaron Funkが中心的な存在になる。彼は変拍子と極端に細かく丁寧な編集を特徴とした。2005年の「Rossz Csillag Alatt Született」では、Bartók、Elgar、Stravinsky、Mahler、Paganiniなど各国のクラシックの録音とブレイクビーツを組み合わせた。この分野の代表作となった。

オランダのBong-Ra、イギリスのShitmat、アメリカのOtto von Schirach、フランスのRuby My Dearらが、各国で活動した。日本のブレイクコアの例は、DJ Scotch Eggらである。

制作環境の側では、パソコン用の音楽制作ソフトが安価に手に入るようになったことが、大きな要因の一つだった。一人で完結する制作と、ネットを通じた無料または少額での配布が前提となった。

娯楽性と実験性、悪ふざけと真剣さの区別を意図的に壊す態度が、一貫している。2010年代以降も、オンライン上の小さな共同体を通じて、作品が作られ続けている。</p>
