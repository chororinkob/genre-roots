<h1>Acid Trance（アシッドトランス）とは</h1>
<p>トランスの構造にRoland TB-303の唸る音色を組み込んだ系統。アシッドハウスと機材を共有しながら、テンポを上げ、トランス特有のブレイクダウンと上昇の構成に組み込む点で分かれる。テンポは135〜145BPM。土台は四つ打ちの</p>
<p>トランスの構造にRoland TB-303の唸る音色を組み込んだ系統。アシッドハウスと機材を共有しながら、テンポを上げ、トランス特有のブレイクダウンと上昇の構成に組み込む点で分かれる。テンポは135〜145BPM。土台は四つ打ちのキックと、その裏に置かれる8分音符のオフビート・ベース。その上でTB-303が16ステップのシーケンスを回し、カットオフとレゾナンスのつまみが曲全体を通してゆっくり動かされる。この操作が唯一の旋律的展開を担う。多くの場合303は複数台が重ねられ、それぞれ異なるフィルター設定と歪み量で層をなす。アシッドテクノと異なり、こちらには明確な和声と情緒があり、ブレイクダウンでは長いパッドと壮大な旋律が現れる。ブレイクダウン後の復帰では、白色雑音のライザーとスネアの加速する連打によって緊張が最大化され、そこにキックと303が同時に戻る瞬間が最大の見せ場になる。和声はハーモニックマイナーが多く、切迫した情感を作る。曲の長さは7分から9分。ヴォーカルはほとんどなく、あっても加工された短い叫び。全体として、アシッドの機械的な音色と、トランスの人間的な高揚が同居する点がこの系統の魅力になっている。</p>
<h2>成り立ち</h2><p>1992年から1993年頃のドイツとイギリスで成立した。直接の出発点はドイツのフランクフルトで、Sven Vathらが1992年に設立したレーベルHarthouseから同年に発表されたHardfloorの「Hardtrance Acperience」がある。Hardfloorはラモン・ツェンカーとオリヴァー・ボンドツィオのデュオで、複数のTB-303を同時に鳴らして層を作るという手法を確立した。この曲は10分を超える長さで、303のフィルターが徐々に開いていく過程だけで構成されており、後続の設計図になった。同じHarthouseからはSven Vath自身の作品やOliver Liebの各種名義が出され、1993年前後のドイツのクラブでこの音が支配的になった。イギリスでは、1988年のアシッドハウス以降TB-303の音が既に馴染んでおり、レイヴのテンポ上昇と結びついて独自に発展した。Union Jack、Emmanuel Top(フランス)、Yves Deruyterやベルギーのシーンも重要な役割を果たした。とりわけEmmanuel Topの1994年「Turkish Bazar」や1995年「Acid Phase」は、303の音を極限まで引き伸ばした構成で知られる。オランダではJoey Belrado、イタリアではUMEKといった作家が加わった。この時期の背景として、TB-303が1984年に生産終了して中古価格が暴落していたことが挙げられる。1990年代前半には比較的安価に入手できたため、多数の制作者が同時にこの音を扱えた。しかし1990年代半ばから後半にかけて、この機材の価値が認識されて価格が高騰し、また流行としてのアシッド・トランスも定型化して飽きられた。1996年以降、トランスの主流はより旋律的で歌もの寄りの方向(ユーロ・トランスやアップリフティング・トランス)へ移り、アシッド・トランスは急速に周縁化した。同時期にアシッドの語彙はテクノ側のアシッドテクノや、ハードハウス、ハードトランスへ分散していく。2000年代を通じてこの系統はほぼ休眠状態だったが、2010年代後半から復興が起きる。ハードウェアの複製機やソフトウェアによる303の再現が容易になったこと、そしてレイヴ文化の再評価が重なった結果で、若い制作者が1990年代前半の音を意識的に引用するようになった。近年ではハードグルーヴやハードトランスの復興の中で、303の音が再びヨーロッパのクラブの中心に戻っている。</p>
