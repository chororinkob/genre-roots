<h1>Acid Trance（アシッドトランス）とは</h1>
<p>アシッド・トランスは、トランスの曲の組み立てに、Roland TB-303の唸るような音色を組み込んだ音楽だ。アシッドハウスと同じ機材を使いながら、テンポを上げ、トランスならではのブレイクダウンと盛り上がりの構成に組み込む点で、ア</p>
<p>アシッド・トランスは、トランスの曲の組み立てに、Roland TB-303の唸るような音色を組み込んだ音楽だ。アシッドハウスと同じ機材を使いながら、テンポを上げ、トランスならではのブレイクダウンと盛り上がりの構成に組み込む点で、アシッドハウスとは分かれる。

四つ打ちのキックの上で、303の16ステップ・シーケンスがベース／リードを担う。カットオフとレゾナンスのつまみは、曲全体を通してゆっくり動かされる。この303のフィルター操作が、展開の中心的な役割を担う。303は複数台が重ねられることもあり、それぞれ違うフィルター設定と歪みの量で、層になって重なる。

アシッドテクノと比べると、こちらにははっきりした和音と感情の表現があることが多い。和音は短調が多く、切迫した情感を生む。ブレイクダウンでは、長いパッドと壮大なメロディーが現れる。

テンポはおおむね125〜150BPM前後。ブレイクダウンのあとの復帰では、スネアの加速する連打で緊張が最大まで高められ、白色雑音のライザーが重ねられることもある。そこにキックと303が同時に戻る瞬間が、最大の見せ場になる。

ヴォーカルはほとんどなく、あっても加工された短い叫びや朗読のサンプルだ。曲の長さは4分台後半〜9分程度。

全体として、アシッドの機械的な音色と、トランスの人間的な高揚が同居している点が、この音楽の魅力になっている。</p>
<h2>成り立ち</h2><p>アシッド・トランスは、1980年代末〜1990年代初頭にヨーロッパで生まれたとされる。ベルギーでは、アシッド・トランスがトランスの中で最も知られた形態とされている。

起源を1曲に決めるような定説はない。ただ、初期の重要作の一つとされるのが、Hardfloorの「Hardtrance Acperience」だ。ドイツのフランクフルトで、Sven Väthらが1992年に設立したレーベルHarthouseから、同じ年に発表された。Hardfloorはラモン・ツェンカーとオリヴァー・ボンドツィオのデュオで、複数のTB-303（最大6台とされる）を同時に使うことで知られる。この作品は4曲入りのEP(1992年、独盤。7月発売とされる)だ。代表曲「Acperience 1」は約9分あり、複数の303を使った構成が、後に続く作り手に影響を与えたとされる。

同じHarthouseからは、Sven Väth自身の作品や、Oliver Liebのさまざまな名義の作品も出された。1993年前後には、ドイツのクラブでこの音が聴かれた。

一方、イギリスでは、1988年のアシッドハウス以降、TB-303の音がすでになじみのあるものだった。それがレイヴのテンポの上昇と結びつき、独自に発展したとも言われる。Union Jack、Emmanuel Top(フランス。主にアシッドテクノの制作者)、そしてベルギーのシーンも重要な役割を果たした。ベルギーのハードトランスの代表格であるYves Deruyterとの関連も指摘される。とりわけEmmanuel Topの1994年の「Turkish Bazar」や、同じ年の11月に発売された「Acid Phase」は、アシッドテクノの古典として知られる。スロベニアのUMEKといった作り手も、関連が指摘される。

この時期の背景には、TB-303が1984年に生産終了となり、中古の値段が暴落していたことがある。1990年代前半には比較的安く手に入ったため、多くの作り手が同時にこの音を扱えた。

しかし、のちにアシッド人気で値段が高騰した。また、流行としてのアシッド・トランスも型にはまり、飽きられた。1990年代後半にはアップリフティング・トランスが人気を集め、ユーロ・トランスは1998〜2000年頃に人気を得た。こうしてアシッド・トランスは、隅へ追いやられていった。アシッドの音づかいは、1990年代前半から、テクノ側のアシッドテクノやハードトランスと並行して展開した。

2000年代には、この系統は主流から退いた。それでもHardfloorは作品を出し続けるなど、活動は続いた。

2010年代後半からは、復興が起きたとも言われる。若い作り手が、1990年代前半の音を意識して引用するようになった。近年では、複製機やソフトの普及で、303を使う作り手が増えた。</p>
