<h1>Post-Hardcore（ポストハードコア）とは</h1>
<p>ポストハードコアは、ハードコア・パンクの速度と怒りを出発点にしながら、その定型に飽き足らず、構造と音色の実験へ踏み出した音楽だ。この分野は、ハードコア・パンクから発展し、より複雑な楽器編成と表現を取り入れたジャンルである。 ギター</p>
<p>ポストハードコアは、ハードコア・パンクの速度と怒りを出発点にしながら、その定型に飽き足らず、構造と音色の実験へ踏み出した音楽だ。この分野は、ハードコア・パンクから発展し、より複雑な楽器編成と表現を取り入れたジャンルである。

ギターは、分厚い和音を掻き鳴らすより、2本が別々の音型を弾いて絡み合う手法が好まれる。コードを押さえずに開放弦（指で押さえずに鳴らす弦）を混ぜた、不協和な響きが多く使われる。歪みは常時ではなく、必要な場面でだけ解放される。ベースは、低音を支えるだけでなく、ダブ（レゲエを加工した音楽）の影響を受けた動きをするものもある。

最も分かりやすい特徴は、緩急の設計だ。極端に静かで緊張した部分と、爆発的に激しい部分が、予告なく切り替わる。この落差によって、単に速く叫び続けるだけでは得られない、不安と解放が生まれる。

拍子も4/4にとどまらない。変拍子（定型から外れた拍子）や、拍の数え方を意図的に見失わせる構成が用いられる。ドラムは、拍の重心をずらしながら、細かく手数を入れる。複雑なコード進行や不協和な響き、緩急、掛け合いのボーカルなどが特徴的な例として挙げられる（Fugazi、Drive Like Jehuなど）。

ヴォーカルは、絶叫と語りと歌唱を、場面ごとに使い分ける。時に2人以上が、異なる言葉を同時に発する。

歌詞は、政治的な主張だけでなく、自己嫌悪、人間関係の破綻、抽象的な詩へと広がる。</p>
<h2>成り立ち</h2><p>1980年代前半のアメリカのハードコア・パンクは、極めて速く短い曲と、暴力的な現場によって、独自の共同体を築いていた。しかし数年のうちに、その定型は硬直する。現場は、喧嘩ばかりが目的化していった。

この閉塞に対して、ワシントンD.C.は重要な拠点の一つとなった。（Hüsker DüやMinutemenらが挙げられる。Naked RaygunとThe Effigiesは先駆とされるが、当事者はハードコアの影響を否定しており、1984年にはHüsker Düの『Zen Arcade』も出ている。）

1984〜86年ごろ（とくに1985年）、DCのハードコア・シーンで、暴力とマッチョ主義を改めようとした動きが起こり、革命の夏と呼ばれた。

その拠点となったのが、Ian MacKayeとJeff Nelsonが1980年に共同で設立したDischord Recordsだ。MacKaye自身は、1986年にFugaziを結成する（1987年とする資料もある。初ライブは1987年9月3日）。このバンドは、2人の歌手による対比、跳ねるベース、そして極端な音量差を武器にした。さらに、入場料を安価（目標は5ドル）に抑え、大手との契約を拒み続けるという、徹底した姿勢でも知られた。

各地にも動きは広がった。シカゴでは、Steve AlbiniのBig BlackやShellacのようにドラムマシンや硬質な音で知られるバンドが現れた。サンディエゴでは、Gravity Recordsを中心に、より感情的で混沌とした一群が現れた。

1990年代前半から半ばにかけては、ワシントン州のUnwound、ニューヨークのQuicksand、カリフォルニアのDrive Like Jehuが、それぞれ異なる方向でこの領域を広げた。とりわけDrive Like Jehuの、2本のギターが入り組んで絡み合う複雑な曲の書き方は、後続のバンドに影響を与えた。

Naked RaygunとThe Effigiesの当事者は、自分たちはハードコアではないと主張した。MacKayeとPicciottoは、「エモ」という語に反対した。

2000年代に入ると、この語は、より商業的な文脈で使われるようになる。叫びと歌を交互に配置する分かりやすい形式が主流の市場で流行し、2000年代に主流化し、商業的に売りやすい形式にまとめられた（AllMusicのJohnny Loftus, 2004）。

それでも、Fugaziが示した姿勢は、今も参照され続けている。音楽の内容と経済的な自立を一体のものとして考える姿勢だ。それは、独立系音楽の倫理的な基準になっている。</p>
