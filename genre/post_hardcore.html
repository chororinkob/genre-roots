<h1>Post-Hardcore（ポストハードコア）とは</h1>
<p>ハードコア・パンクの速度と怒りを出発点としながら、その定型に飽き足らず、構造と音色の実験へ踏み出した音楽である。最も分かりやすい特徴は緩急の設計にあり、極端に静かで緊張した部分と、爆発的に激しい部分が、予告なく切り替わる。この落差</p>
<p>ハードコア・パンクの速度と怒りを出発点としながら、その定型に飽き足らず、構造と音色の実験へ踏み出した音楽である。最も分かりやすい特徴は緩急の設計にあり、極端に静かで緊張した部分と、爆発的に激しい部分が、予告なく切り替わる。この落差によって、単に速く叫び続けるだけでは得られない不安と解放が生まれる。拍子も4/4に留まらず、変拍子（定型から外れた拍子）や、拍の数え方を意図的に見失わせる構成が用いられる。ギターは分厚い和音を掻き鳴らすより、2本が別々の音型を弾いて絡み合う手法が好まれ、複雑なコード進行や不協和な響きが特徴的な例として挙げられる（Fugazi、Drive Like Jehuなど）。歪みは常時ではなく、必要な場面でだけ解放される。ベースは低音を支えるだけでなく、ダブ（レゲエを加工した音楽）の影響を受けた動きをするものもあり、ドラムは拍の重心をずらしながら細かく手数を入れる。ヴォーカルは絶叫と語りと歌唱を場面ごとに使い分け、Fugaziのように2人の歌手が掛け合いで歌う例もある。歌詞は政治的な主張だけでなく、自己嫌悪、人間関係の破綻、抽象的な詩へと広がる。テンポは遅いものから金属並みに速いものまで幅がある。ハードコア・パンクから発展し、より複雑な楽器編成と表現を取り入れたジャンルである。</p>
<h2>成り立ち</h2><p>1980年代前半のアメリカのハードコア・パンクは、極めて速く短い曲と、暴力的な現場によって独自の共同体を築いていた。しかし数年のうちに、その定型は硬直し、現場は喧嘩ばかりが目的化していく。この閉塞に対して、ワシントンD.C.は重要な拠点の一つとなった（起源に定説はなく、Hüsker DüやMinutemenらが始まりの例に挙げられる。Naked RaygunとThe Effigiesは先駆とされるが、当事者はハードコアの影響を否定している。1984年にはHüsker Düの『Zen Arcade』も出ている）。1984〜86年ごろ（とくに1985年）、この街のハードコア・シーンで、革命の夏と呼ばれる、暴力とマッチョ主義を改めようとした動きが起こった。Ian MacKayeとJeff Nelsonが1980年に共同で設立したDischord Recordsがその拠点となり、MacKaye自身が1986年にFugaziを結成する（1987年とする資料もある。初ライブは1987年9月3日）。このバンドは、2人の歌手による対比、跳ねるベース、そして極端な音量差を武器としながら、入場料を安価（目標は5ドル）に抑え、大手との契約を拒み続けるという徹底した姿勢でも知られた。シカゴではSteve AlbiniのBig BlackやShellacが、ドラムマシンや硬質な音で知られ、サンディエゴではGravity Recordsを中心に、より感情的で混沌とした一群が現れた。1990年代前半から半ばにかけては、ワシントン州のUnwound、ニューヨークのQuicksand、そしてカリフォルニアのDrive Like Jehuが、それぞれ異なる方向でこの領域を広げる。とりわけDrive Like Jehuの、2本のギターが入り組んで絡み合う複雑な曲の書き方は、後続のバンドに影響を与えた。Naked RaygunとThe Effigiesの当事者は「ハードコアではない」と主張し、MacKayeとPicciottoは「エモ」という語に反対するなど、自分たちへの分類に異議を唱えてきた。2000年代に入ると、この語はより商業的な文脈で用いられるようになる。叫びと歌を交互に配置する分かりやすい形式が主流の市場で流行し、商業的に売りやすい形式にまとめられた。それでもFugaziが示した、音楽の内容と経済的な自立を一体のものとして考える姿勢は、独立系音楽の倫理的な基準として現在も参照され続けている。</p>
