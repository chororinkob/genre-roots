<h1>Post-Hardcore（ポストハードコア）とは</h1>
<p>ハードコア・パンクの速度と怒りを出発点としながら、その定型に飽き足らず、構造と音色の実験へ踏み出した音楽である。最も分かりやすい特徴は緩急の設計にあり、極端に静かで緊張した部分と、爆発的に激しい部分が、予告なく切り替わる。この落差</p>
<p>ハードコア・パンクの速度と怒りを出発点としながら、その定型に飽き足らず、構造と音色の実験へ踏み出した音楽である。最も分かりやすい特徴は緩急の設計にあり、極端に静かで緊張した部分と、爆発的に激しい部分が、予告なく切り替わる。この落差によって、単に速く叫び続けるだけでは得られない不安と解放が生まれる。拍子も4/4に留まらず、変拍子や、拍の数え方を意図的に見失わせる構成が用いられる。ギターは分厚い和音を掻き鳴らすより、二本が別々の音型を弾いて絡み合う書法が好まれ、コードを押さえずに開放弦を混ぜた不協和な響きが多用される。歪みは常時ではなく、必要な場面でだけ解放される。ベースは低音を支えるだけでなく主旋律を担うことが多く、ドラムは拍の重心をずらしながら細かく手数を入れる。ヴォーカルは絶叫と語りと歌唱を場面ごとに使い分け、時に二人以上が異なる言葉を同時に発する。歌詞は政治的な主張だけでなく、自己嫌悪、人間関係の破綻、抽象的な詩へと広がる。テンポは一定せず、一曲の中で何度も変わる。ハードコアの倫理を保ちながら、その音楽的な貧しさから抜け出そうとする試みがこの分野の本質である。</p>
<h2>成り立ち</h2><p>1980年代前半のアメリカのハードコア・パンクは、極めて速く短い曲と、暴力的な現場によって独自の共同体を築いていた。しかし数年のうちに、その定型は硬直し、現場は喧嘩ばかりが目的化していく。この閉塞に対して最初に道を示したのがワシントンD.C.である。1985年、この街では革命の夏と呼ばれる運動が起こり、暴力に依存する現場のあり方を批判して、音楽そのものをより繊細で個人的なものへ変えようという意識が共有された。Ian MacKayeが設立したDischord Recordsがその拠点となり、彼自身がFugaziを1987年に結成する。このバンドは、二人の歌手による対比、跳ねるベース、そして極端な音量差を武器としながら、入場料を安価に固定し、大手との契約を拒み続けるという徹底した姿勢でも知られた。シカゴではSteve Albiniの一派が金属的な即物性を持ち込み、サンディエゴではGravity Recordsを中心に、より情動的で混沌とした一群が現れた。1990年代半ばにはワシントン州のUnwound、ニューヨークのQuicksand、そしてカリフォルニアのDrive Like Jehuが、それぞれ異なる方向でこの領域を広げる。とりわけDrive Like Jehuの、二本のギターが延々と絡み合う長尺の構成は、後の無数のバンドに引用された。この分野の名称は、ハードコアの後に来たものという以上の意味を持たない曖昧なもので、当事者の多くは使用を嫌ってきた。2000年代に入ると、この語はより商業的な文脈で用いられるようになる。叫びと歌を交互に配置する分かりやすい形式が主流の市場で流行し、大手レコード会社が同種のバンドを大量に契約したため、本来の実験的な含意は薄れた。それでもFugaziが示した、音楽の内容と経済的な自立を一体のものとして考える姿勢は、独立系音楽の倫理的な基準として現在も参照され続けている。</p>
