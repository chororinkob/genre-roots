<h1>Nu Metal（ニューメタル）とは</h1>
<p>ニュー・メタルは、ヘヴィメタルの重さに、ヒップホップのリズムとファンクの跳ねる感覚をつなげたスタイルだ。 主役はギターで、特徴の一つが調弦（弦の音の合わせ方）にある。7弦ギターのダウンチューニング（通常より低く合わせること）を用い</p>
<p>ニュー・メタルは、ヘヴィメタルの重さに、ヒップホップのリズムとファンクの跳ねる感覚をつなげたスタイルだ。

主役はギターで、特徴の一つが調弦（弦の音の合わせ方）にある。7弦ギターのダウンチューニング（通常より低く合わせること）を用いるバンドが多い。Kornは最低音をAに合わせたADGCFADの調弦を使う。ドロップC系（一番低い弦をさらに低く下げた）の調弦も使われる。これにより、低音の刻みが打楽器に近い性格を持つ。

奏法では、ギター・ソロをほぼ排除する。代わりに、短く切ったリフの反復を軸にする。ピック・スクラッチなどのノイズや効果音的な奏法も使われる（例：KornのMunky）。ベースは前に出て歪み、時にスラップ奏法（弦を叩いたりはじいたりする奏法）で跳ねる。

ドラムは、ヒップホップの影響を受けたリズム重視の型が多い。ブラスト・ビートやツーバスは少ない。BPM（1分間の拍数）はおおむね90〜120前後の中速の曲が多いとされ、メタルとしては遅めだが、曲によって幅がある。

編成には、ターンテーブル（レコードプレーヤー）を操作するDJや、サンプラー（音を録音して取り込む機械）の担当が加わるバンドもある。その場合も、擦り音や効果音が上物（メロディーなど上に重ねる音）を担う。

歌唱は、歌、ラップ、そして絶叫を曲中で切り替えるのが定番だ。歌詞は、いじめ、孤立感、見捨てられ感、裏切り、怒りなどの個人的な苦痛を率直に扱う。政治的な主張や幻想的な題材は少ない。ただし、政治的な歌詞のSystem of a Downや、希望を歌うP.O.D.のような例外もある。</p>
<h2>成り立ち</h2><p>舞台は、1990年代中盤の米国だ（Kornの1993年デモ／1994年デビュー作が起点とされることが多い）。複数の流れが合流して、このスタイルが形づくられた。

前史として、1980年代末のFaith No More、Living Colour、そしてRed Hot Chili Peppersが、ロックとファンクの融合を示した。さらに1986年には、Run-D.M.C.とAerosmithがWalk This Wayで共演した。これが、メタルとヒップホップをつなぐ先例となった。

しばしば出発点とされるのは、カリフォルニア州ベイカーズフィールドのKornだ。彼らは1994年のデビュー作で、Fieldyの歪んだベース、7弦ギターの低い刻み、そしてJonathan Davisによる幼少期の性的虐待を歌った歌詞を組み合わせて示した。この個人的な苦痛の露出が、それまでのメタルとの大きな違いの一つだったとされる。制作を手がけたRoss Robinsonは、以後この分野の音を作る中心人物となった。

次に注目を集めたのが、Limp Bizkitだ。1994年に結成され、1997年にデビューした。1999年の第2作『Significant Other』（全米1位、初週643,874枚）で、大衆的な成功を収めた。

1999年から2001年にかけて、最盛期を迎える。Linkin Parkは2000年のHybrid Theoryで、より旋律的で内省的な方向を示した。このアルバムは、少なくとも2700万枚以上を売り上げた。Slipknotは、覆面と9人編成という異様な形態で、より極端な攻撃性を持ち込んだ。

よく挙げられる事件のひとつが、1999年のウッドストック・フェスティバルだ。Limp Bizkitの演奏中に、観客が合板を剥がして施設を壊した。フェスでは、性的暴行も報告された。本格的な暴動（放火など）は翌日だった。この事件を機に、暴力性が結び付けて語られがちになったと指摘される。

しかし、ジャンルの商業的な絶頂期は、その後の2001年に訪れている(Hybrid Theoryが米国で最も売れたアルバムになった年)。人気の下降は、2002年ごろから見られた。やがて批評家やメタル・ファンからの反発が強まり、2000年代半ばには、飽和と不振作で衰退し、主流の座を失った。

それでも、2010年代にはニュー・メタルの要素を他のジャンルに取り込む動きがあった。2020年代初頭には、当時を知らないZ世代の間で再燃した。Linkin ParkのChester Benningtonが2017年に亡くなった後には、Linkin Parkの米国での売上が大きく伸びた。現在は、影響源として広く言及されている。</p>
