<h1>Nu Metal（ニューメタル）とは</h1>
<p>ヘヴィメタルの重さに、ヒップホップのリズムとファンクの跳ねる感覚を接続した様式。特徴の一つはギターの調弦（弦の音の合わせ方）で、7弦ギターのダウンチューニング（通常より低く合わせること）(Kornは最低音をAに合わせたADGCFA</p>
<p>ヘヴィメタルの重さに、ヒップホップのリズムとファンクの跳ねる感覚を接続した様式。特徴の一つはギターの調弦（弦の音の合わせ方）で、7弦ギターのダウンチューニング（通常より低く合わせること）(Kornは最低音をAに合わせたADGCFADの調弦)を使うバンドが多く、ドロップC系（一番低い弦をさらに低く下げた）の調弦も使われ、これにより低音の刻みが打楽器に近い性格を持つ。奏法はギター・ソロをほぼ排除し、代わりに短く切ったリフの反復と、ピックで弦をこすって出すノイズ（ピック・スクラッチ）のような、効果音的な弾き方も使われる（例：KornのMunky）。ベースは前に出て歪み、時にスラップ奏法（弦を叩いたりはじいたりする奏法）で跳ねる。ドラムはヒップホップの影響を受けたリズム重視の型が多く、ブラスト・ビート（とても速く連打する叩き方）やツーバス（バスドラムを2つ使う奏法）は少ない。BPM（1分間の拍数）はおおむね90〜120前後の中速が多く、メタルとしては遅めだが、曲によって幅がある。編成にはターンテーブル（レコードプレーヤー）を操作するDJやサンプラー（音を録音して取り込む機械）の担当が加わるバンドもあり、擦り音や効果音が上物（メロディーなど上に重ねる音）を担う。歌唱は歌、ラップ、そして絶叫を曲中で切り替えるのが定番。歌詞はいじめ、孤立感、見捨てられた気持ち、裏切り、怒りといった個人的な苦痛を率直に扱い、政治的な主張や幻想的な題材は少ないが、政治的な歌詞のSystem of a Downや、希望を歌うP.O.D.のような例外もある。</p>
<h2>成り立ち</h2><p>1990年代なかばの米国で、複数の流れが合流して形成された（起こりには諸説ある）。前史として、1980年代末のFaith No More、Living Colour、そしてRed Hot Chili Peppersが示したロックとファンクの融合、さらに1986年のRun-D.M.C.とAerosmithによるWalk This Wayの共演が、メタルとヒップホップの接続の先例となった。しばしば出発点とされるのは、カリフォルニア州ベイカーズフィールドのKornで（1993年のデモ録音を起点とする見方もある）、彼らは1994年のデビュー作で、Fieldyの歪んだベース、7弦ギターの低い刻み、そしてJonathan Davisによる幼少期の性的虐待を歌った歌詞という組み合わせを示した。この個人的な苦痛の露出が、それまでのメタルとの大きな違いだったとされる。制作を手がけたRoss Robinsonは、以後この分野の音を作る中心人物となった。Limp Bizkitは1994年に結成され、1997年にデビューした。Fred Durstによるラップと商業的な戦略もあり、1999年の第2作『Significant Other』が全米1位になって、最初の1週間で643,874枚売れ、広く人気を得た。1999年から2001年にかけて最盛期を迎え、Linkin Parkが2000年のHybrid Theoryで、より旋律的で内省的な方向を示して少なくとも2700万枚以上を売り上げた。Slipknotは覆面と9人編成という異様な形態で、より極端な攻撃性を持ち込んだ。象徴的な事件のひとつが1999年のウッドストック・フェスティバルで、Limp Bizkitの演奏中に観客が合板（板を重ねて作った建材）を剥がして施設を壊した。フェスでは性的暴行も報告され、放火などの本格的な暴動は翌日に起きた。この事件をきっかけに、この音楽は暴力と結び付けて語られがちになったと言われるが、ジャンルの商業的な絶頂期はその後の2001年(Hybrid Theoryが米国で最も売れたアルバムになった年)に訪れており、人気の下降は2002年ごろから見られた。批評家やメタルファンからの反発が強まり、二番煎じのバンドが大量に生まれたことで飽きられ、2000年代半ばには衰退が定着して主流の座を失った。しかし2010年代にはニュー・メタルの要素を他のジャンルに取り込む動きがあり、2020年代初頭には当時を知らないZ世代の間で再燃した。Linkin ParkのChester Benningtonが2017年に亡くなった後には、Linkin Parkの米国での売上が大きく伸びた。現在は影響源として広く言及されている。</p>
