<h1>Nu Metal（ニューメタル）とは</h1>
<p>ヘヴィメタルの重さに、ヒップホップのリズムとファンクの跳ねる感覚を接続した様式。最大の技術的特徴はギターの調弦で、七弦ギターの採用、あるいは六弦を極端に低く落とすドロップDやドロップCが標準となり、これにより低音の刻みが打楽器に近</p>
<p>ヘヴィメタルの重さに、ヒップホップのリズムとファンクの跳ねる感覚を接続した様式。最大の技術的特徴はギターの調弦で、七弦ギターの採用、あるいは六弦を極端に低く落とすドロップDやドロップCが標準となり、これにより低音の刻みが打楽器に近い性格を持つ。奏法はギター・ソロをほぼ排除し、代わりに短く切ったリフの反復と、弦を掻いて音程を持たない打撃音を出す技法が多用される。ベースは前に出て歪み、時にスラップ奏法で跳ねる。ドラムは8分音符の直線的な刻みではなく、ヒップホップ的にずらしたバスドラムの配置と、シンコペーションの効いた跳ねる型を用いる。BPMは80〜120と、メタルとしては遅い。編成にはターンテーブルを操作するDJやサンプラー担当が加わることが多く、擦り音や効果音が上物を担う。歌唱は歌、ラップ、そして絶叫を曲中で切り替えるのが定番。歌詞は父親との対立、いじめ、疎外、怒り、自己嫌悪といった個人的な苦痛を直截に扱い、政治的な主張や幻想的な題材はほとんど含まれない。</p>
<h2>成り立ち</h2><p>1990年代前半の米国で、複数の潮流が合流して形成された。前史として、1980年代末のFaith No More、Living Colour、そしてRed Hot Chili Peppersが示したロックとファンクの融合、さらに1986年のRun-D.M.C.とAerosmithによるWalk This Wayの共演が、メタルとヒップホップの接続の先例となった。決定的な出発点は、カリフォルニア州ベイカーズフィールドのKornで、彼らは1994年のデビュー作で、Fieldyの歪んだベース、七弦ギターの低い刻み、そしてJonathan Davisによる幼少期の性的虐待を歌った歌詞という組み合わせを提示した。この個人的な苦痛の露出こそが、それまでのメタルとの決定的な違いだった。制作を手がけたRoss Robinsonは、以後この分野の音を作る中心人物となった。1997年、Limp Bizkitが登場し、Fred Durstによるラップと商業的な戦略により、この様式を大衆化した。1999年から2000年にかけて最盛期を迎え、Linkin Parkが2000年のHybrid Theoryで、より旋律的で内省的な方向を示して2000万枚以上を売り上げた。Slipknotは覆面と九人編成という異様な形態で、より極端な攻撃性を持ち込んだ。決定的な転落点は1999年のウッドストック・フェスティバルで、Limp Bizkitの演奏中に暴徒化した観客が施設を破壊し、複数の性的暴行が報告された。この事件により、この音楽は暴力と結び付けて語られるようになった。2000年代前半には批評的な評価が急落し、二番煎じのバンドが大量に生まれたことで飽きられ、2003年頃には主流の座を失った。しかし2010年代後半以降、当時を知らない世代による再評価が進み、Linkin ParkのChester Benningtonの2017年の自死をきっかけとした再注目もあって、現在は影響源として広く言及されている。</p>
