<h1>Manele（マネレ）とは</h1>
<p>マネレは、ルーマニアで生まれたポピュラー音楽だ。バルカン半島のフォーク音楽、オリエンタルな旋律、電子音楽を混ぜ合わせた、独特のサウンドを持つ。 楽器の編成は、電子化が大きく進んでいる。シンセサイザーやドラムマシンが、演奏の中心を担</p>
<p>マネレは、ルーマニアで生まれたポピュラー音楽だ。バルカン半島のフォーク音楽、オリエンタルな旋律、電子音楽を混ぜ合わせた、独特のサウンドを持つ。

楽器の編成は、電子化が大きく進んでいる。シンセサイザーやドラムマシンが、演奏の中心を担う。とくにシンセサイザーやアレンジャーキーボードが中心で、オリエンタルな音色プリセット（あらかじめ用意された音色）で弾くリードメロディーが、曲の顔になる。アコーディオンやクラリネットが、生楽器として加わることもある。これらがシンセの電子音と混ざり合い、独特の質感を生む。

旋律はトルコ・アラブ系の音階（ヒジャーズなど）や増2度音程（短3度に近い跳躍）を使い、半音階的に動く。和声は、主に調性的でダイアトニックである。

打楽器には、ダルブッカ（中東の壺型太鼓）のリズムパターンをサンプリング（既存の録音の取り込み）したものや、打ち込んだものが使われる。拍子は4/4（および2/4）系が基本だが、細かいシンコペーション（拍をずらして強調するリズム）が施される。リズムは、2拍目を半拍先取りするシンコペーションが特徴だ。ダルブッカ特有の「ドゥム・テク」パターンが、全体のノリを支配する。テンポは曲によって異なるが、ダンスに向いた軽快さを持つ。

音の加工では、一般的な傾向として、リバーブ（残響）が深くかけられることが多い。ボーカルには、オートチューン（音程を自動で補正する効果）やピッチ補正が使われることが多い。エコーやディレイもよく使われ、音が空間に広がる感じが出る。

歌い方は感情的で、飾りが多い。メリスマ（1音節に複数の音符を当てる技法）のような細かい音の揺らしや、ビブラート（音を細かく揺らす歌い方）を多く使った歌い回しが特徴だ。

歌詞の主題は、愛、敵、金銭、パーティー、自己顕示が中心である。そこには、ロマ文化の価値観や、街頭の暮らしの現実が映し出されている。

チャルガ（ブルガリアの類似ジャンル）やトゥルボフォーク（セルビア）とマネレは、3ジャンルとも、バルカンのフォークと東方・ロマ音楽の影響を受けた、似たジャンルである。実際に鳴っている場所は、ルーマニアの結婚式、洗礼式、路上のバー、ナイトクラブだ。そしてYouTubeやTikTokなどのSNSも、主な舞台になっている。</p>
<h2>成り立ち</h2><p>「manea／manele」という語は、18世紀末から19世紀初頭のルーマニア語の文献に現れるとされる。当時は、ロマの楽師がイスタンブールから持ち込んだ器楽の舞曲を指したとも言われるが、諸説ある。

ジャンルの名前「manele」の語源については、諸説ある。トルコ語の「mâni」（四行詩形の民謡）由来が最有力とされる。ほかに aman（慈悲）由来説もあり、合意はない。mâniを『トルコの物売りの声』と解する文献もある。

1970〜80年代には、この音楽は「セルビア音楽」「トルコ音楽」などと呼ばれた。政権により検閲・禁止されたとされ、地下で流通した。

電子サウンドを取り入れた現代マネレは、1980年代初頭〜前半に形成され始めた。ロマ楽師の都市音楽に、1980年代の『東方音楽』（トルコ・アラブ・ギリシャ・セルビア系ポップス）の模倣が加わり、シンセサイザー等の電子楽器で今の形になった。Azurは1977年にブライラで結成された。1980年代半ばには名が知られ、録音も出した。Genericは1987年にトゥルゴヴィシュテで結成された。マネレは1980年代に各地のバンドや結婚式の場で形成され、1989年以降に大衆化した。

1989年、チャウシェスクの独裁政権が崩壊する。その後ルーマニア社会は、急速な市場開放と文化的な混乱の時代に入った。1990年代は、マネレが大衆に広まった時期にあたる。共産主義体制の下で抑えつけられていたロマ文化が表舞台に出てきたのも、この時期だ。1990年代には、ロマ歌手が主導する新しいマネレが前面に出た。

1990年代には、ギタリストのDan Armeancaが「ジャンルの導師」とされ、「ゴッドファーザー」「創始者的存在」とも言われた。Vali Vijelieらも、ヒットを重ねた。アドリアン・ミヌネ（Adrian Minune、旧芸名Adrian Copilul Minune）は、1990年代にデビューして人気を得て、2000年代初頭に全盛期を迎えた。彼の甘いボーカルと感情的な歌詞は、大衆の心をつかんだ。ニコラエ・グタ（Nicolae Guță）は1992年にデビューし、1998年ごろからマネレに関わった。力強いボーカルで、ジャンルの普及に貢献した。グタは2004年に、自ら『Regele manelelor』を名乗った。

1990年代後半から活動していたフロリン・サラム（Florin Salam）は、2000年代初頭に人気を集め、マネレを新たな高みへと引き上げた。サラム自身もロマ出身である。サラムも、同じ異名で知られる。彼の曲「Saint Tropez」（2013年）などは、YouTubeを通じて広まった。

しかし、マネレは常に激しい社会的論争の的だった。ルーマニアの教育を受けたエリート層や専門職層は、このジャンルを粗野で下品、国民性に合わないと見なした。一部の都市では、公共交通機関やタクシー、祭りなどでのマネレが禁止された。Timișoaraでは2019年11月、市長の内部通達で、屋外の公共空間での演奏や放送が禁止された。のちにCNCDが、これを差別行為と認定した。タクシーでの禁止は、クルージュの例である。テレビでは、2014年1月30日、CNA（国家視聴覚審議会）が、Taraf TVで放映された15本のクリップを、23時前は放映禁止とした。批判の根っこには、ロマ文化への差別意識も絡んでいた。マネレをめぐる論争は、ルーマニア社会の階級・民族問題を映し出す鏡となった。

民間で使われる呼び分けとして、「マネレ・デ・ジャーレ（manele de jale）」（悲しみのマネレ）と「マネレ・デ・ペトレチェレ（manele de petrecere）」（パーティーのマネレ）が区別されることがある。前者はゆったりとしてもの悲しく、後者はアップテンポで祝祭的だ。

2020年代初頭には、トラップ系の例として、Alex Veleaの「trapanele」やLinia 1のFormația Aburițiiが現れた。バビ・ミニュネ（Babi Minune）は、新世代のマネレ歌手である。近年は、TikTokやYouTubeで特定の曲が拡散している。

マネレは今もルーマニアで広く聴かれている。主流メディアからは締め出されながら、大衆には人気があるという、矛盾した立場を保っている。そして、ルーマニア文化の切り離せない一部として存在している。</p>
