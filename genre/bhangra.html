<h1>Bhangra（バングラ）とは</h1>
<p>バングラーは、インドとパキスタンにまたがるパンジャーブ地方の収穫の踊りに由来する音楽だ。現代の大衆音楽として再構成された。結婚式と祝祭の場で鳴らされる、身体を大きく動かすための音楽である。 中心になる楽器は、ドール（肩から下げて両</p>
<p>バングラーは、インドとパキスタンにまたがるパンジャーブ地方の収穫の踊りに由来する音楽だ。現代の大衆音楽として再構成された。結婚式と祝祭の場で鳴らされる、身体を大きく動かすための音楽である。

中心になる楽器は、ドール（肩から下げて両手の撥で打つ両面太鼓）だ。片面を細い撥で高く鋭く、もう片面を曲がった太い撥で低く打つ。この二つの音を組み合わせ、チャール（chaal）という型を刻む。速く跳ねる三連的な揺れが、膝を高く上げ腕を突き上げる踊りを誘う。

加えて、トゥンビという1弦の撥弦楽器（弦をはじく楽器）が、高く鋭い単音を反復して、旋律の輪郭を作る。アルゴザという2本組の笛と、チムタという火箸型の打楽器（金属の輪がついた鉄の挟み）が、彩りを添える。現代の編成では、これらに打ち込みのドラム、シンセベース、サンプラー（音を録音して取り込む機械）が加わる。そしてヒップホップやハウスの構造と接続されることもある。

BPM（1分間の拍数）は速めで安定していることが多く、4拍子が基本とされる。和声（コードの響き）は、単純な二和音の往復か、和声を持たない旋法的（音の並び方の型にもとづく）な構造であることが多い。

歌唱は、喉を開いた大きな声で、装飾音を効かせながら高音域で押し切る。歌詞は主にパンジャーブ語（英国では英語との混用も多い）だ。収穫、恋、故郷の村、そして移民先での成功と郷愁を扱う。</p>
<h2>成り立ち</h2><p>本来のバングラーは、パンジャーブ地方の農民の踊りだった。小麦の収穫を祝う春の祭バイサキで踊られた。

1947年のインド・パキスタン分離独立により、パンジャーブは国境で二分された。推定1,200万〜2,000万人が移動し（パンジャーブだけで約1,200万人）、死者は20万〜200万人と諸説ある。この分断のあと、バングラーは西パンジャーブからの移住者によって、インド側で普及して栄えた。一方、パキスタン側では抑制されたとされる。

英国側のスタイルは、1970年代に形を成した。1979年のAlaapのアルバム『Teri Chunni De Sitare』が転機となったとされる。1950年代以降、労働力として英国へ渡ったパンジャーブ系の移民が、バーミンガム、サウソールといった都市に集住した。渡英した若い移民世代と、英国で育った世代が、ディスコなどの西洋音楽と結び付けた。

決定的な人物は、サウソールのAlaap（1977年結成）を率いたChanni Singh と、Heera（1979年結成、初アルバムは1983年）だ。そして、バーミンガム近郊のBhujhangy（1960年代後半から活動し、1970年頃の録音が伝統音楽と西洋楽器を結合した初期例とされる）といった楽団もあった。Alaapらは1970年代後半から1980年代にかけて、ドールの上に電気ベースやシンセサイザーを重ねた音を定着させた。

もう一つ重要なのが、昼間の公演という現象だ。親に夜の外出を許されない若者や、人種差別でナイトクラブに入れなかった若者のために、平日の昼にクラブやパブを借りて行われる催しが、英国各地で流行した。

1990年代には、制作者Bally Sagooが、バングラーにヒップホップやファンクを混ぜたリミックス（別の人が作り直した版）を手がけた。1994年にはメジャー・レーベルと契約した。パンジャーブ側では、Gurdas Maanが、伝統と現代・西洋の要素を組み合わせた洗練された電子的な音楽で、パンジャーブ音楽を南アジア全域に広げた。Kuldeep Manakは、パンジャーブ民謡のカリー（kali）などで知られた。

1998年、Panjabi MCが、Busta Rhymes『Fire It Up』（Knight Rider 主題歌を下敷きにした曲）の低音とビートを用いた。そこにバングラーの要素を組み合わせたMundian To Bach Keを、アルバム曲として発表した。2002年のシングルで、欧州を中心に世界的なヒットとなった。2003年に米国のJay-Zが加わった版で、北米にも波及した。

バングラー系のリズムは、1950年代（1957年『Naya Daur』など）から映画に登場した。以後ボリウッドに欠かせない要素の一つになり、結婚式の音楽としても不可欠な存在となっている。</p>
