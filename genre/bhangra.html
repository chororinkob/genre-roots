<h1>Bhangra（バングラ）とは</h1>
<p>インドとパキスタンにまたがるパンジャーブ地方の収穫の踊りに由来し、現代の大衆音楽として再構成された様式。中核をなす楽器はドール、すなわち肩から下げて両手の撥で打つ両面太鼓で、片面を細い撥で高く鋭く、もう片面を曲がった太い撥で低く打</p>
<p>インドとパキスタンにまたがるパンジャーブ地方の収穫の踊りに由来し、現代の大衆音楽として再構成された様式。中核をなす楽器はドール、すなわち肩から下げて両手の撥で打つ両面太鼓で、片面を細い撥で高く鋭く、もう片面を曲がった太い撥で低く打つ。この二つの音を組み合わせ、八拍の周期を持つチャール・タールという型を刻む。速く跳ねる三連的な揺れが、膝を高く上げ腕を突き上げる踊りを誘発する。加えてトゥンビという一弦の撥弦楽器が、高く鋭い単音を反復して旋律の輪郭を作り、アルゴザという二本組の笛、そしてチムタという火箸型の打楽器が彩りを添える。現代の編成ではこれらに打ち込みのドラム、シンセベース、サンプラーが加わり、ヒップホップやハウスの構造と接続される。BPMは100〜140、和声は単純な二和音の往復か、和声を持たない旋法的な構造。歌唱は喉を開いた大きな声で、装飾音を効かせながら高音域で押し切る。歌詞はパンジャーブ語で、収穫、恋、故郷の村、そして移民先での成功と郷愁を扱う。結婚式と祝祭の場で鳴らされる、身体を大きく動かすための音楽である。</p>
<h2>成り立ち</h2><p>本来のバングラーは、パンジャーブ地方で小麦の収穫を祝う春の祭バイサキで踊られる農民の踊りだった。1947年のインド・パキスタン分離独立により、パンジャーブは国境で二分され、数百万人が移動と虐殺を経験した。この断絶の後、バングラーは失われた故郷の象徴として、両側で意識的に保存されるようになった。現代の音楽としての転換は1970年代から1980年代のイギリスで起きた。1950年代以降、労働力として英国へ渡ったパンジャーブ系の移民が、バーミンガム、サウソール、レスターといった都市に集住し、その二世たちが、親の世代の音楽と、自分たちが街で聴いていたレゲエ、ディスコ、ソウルを結び付けた。決定的な人物はサウソールのAlaap を率いたChanni Singh と、Heera、そしてBhujhangyといった楽団で、彼らは1980年代前半に、ドールの上に電気ベースとシンセサイザーを重ねた音を確立した。もう一つ重要なのが昼間の公演という現象で、親に夜の外出を許されない若者のために、平日の昼にクラブを借りて行われる催しが英国各地で流行した。1990年代には制作者Bally Sagooがバングラーとヒップホップ、R&amp;Bを混ぜたリミックスを手がけ、1994年にはメジャー・レーベルと契約した。パンジャーブ側では、Gurdas Maanが伝統的な歌唱の系譜を守り、Kuldeep Manakが民謡の語りの形式を継承した。1998年、Panjabi MCがKnight Riderのテレビ主題歌をドールと組み合わせたMundian To Bach Keを発表し、2003年に米国のJay-Zが加わった版が世界的なヒットとなった。以後バングラーは、インドの映画音楽の標準的な語彙となり、結婚式の音楽としても不可欠な存在となっている。</p>
