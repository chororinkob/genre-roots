<h1>Bhangra（バングラ）とは</h1>
<p>インドとパキスタンにまたがるパンジャーブ地方の収穫の踊りに由来し、現代の大衆音楽として再構成された様式。中核をなす楽器はドール（肩から下げて両手の撥で打つ両面太鼓）で、片面を細い撥で高く鋭く、もう片面を曲がった太い撥で低く打つ。こ</p>
<p>インドとパキスタンにまたがるパンジャーブ地方の収穫の踊りに由来し、現代の大衆音楽として再構成された様式。中核をなす楽器はドール（肩から下げて両手の撥で打つ両面太鼓）で、片面を細い撥で高く鋭く、もう片面を曲がった太い撥で低く打つ。この二つの音を組み合わせ、チャール（chaal）という型を刻む。速く跳ねる三連的な揺れが、膝を高く上げ腕を突き上げる踊りを誘発する。加えてトゥンビという1弦の撥弦楽器（弦をはじく楽器）が、高く鋭い単音を反復して旋律の輪郭を作り、アルゴザという2本組の笛、そしてチムタという火箸型の打楽器（金属の輪がついた鉄の挟み）が彩りを添える。現代の編成ではこれらに打ち込みのドラム、シンセベース、サンプラー（音を録音して取り込む機械）が加わり、ヒップホップなどの構造と接続されることがある。BPM（1分間の拍数）は曲により幅があり（4拍子が基本）、和声（コードの響き）は、同じ和音を反復する単純なものから、ダイアトニックな和音進行を使うものまである。歌唱は喉を開いた大きな声で、装飾音を効かせながら高音域で押し切る。歌詞は主にパンジャーブ語（英国では英語との混用も多い）で、収穫、恋、故郷の村、そして移民先での成功と郷愁を扱う。結婚式と祝祭の場で鳴らされる、身体を大きく動かすための音楽である。</p>
<h2>成り立ち</h2><p>本来のバングラーは、パンジャーブ地方で小麦の収穫を祝う春の祭バイサキで踊られる農民の踊りだった。1947年のインド・パキスタン分離独立により、パンジャーブは国境で二分され、推定1,200万〜2,000万人が移動し（パンジャーブだけで約1,200万人）、死者は20万〜200万人と諸説ある。この分断のあと、バングラーは西パンジャーブからの移住者によってインド側で普及して栄えた一方、パキスタン側では抑制されたとされる。現代的なバングラー音楽のルーツはパンジャーブの1960年代にあるとされ、英国側の様式は1970年代に形を成し、1979年のAlaapのアルバム『Teri Chunni De Sitare』が転機となった。1950年代以降、労働力として英国へ渡ったパンジャーブ系の移民が、バーミンガム、サウソール、ウルヴァーハンプトン、ブラッドフォードなどの都市に集住し、渡英した若い移民世代と英国で育った世代が、親の世代の音楽を、ディスコなどの西洋音楽と結び付けた。決定的な人物はサウソールのAlaap（1977年結成）を率いたChanni Singh と、Heera（1979年結成、初アルバムは1983年）、そしてバーミンガム近郊のBhujhangy（1960年代後半から活動し、1970年頃の録音が伝統音楽と西洋楽器を結合した初期例とされる）といった楽団で、このうちAlaapらは、1970年代後半から1980年代にかけて、ドールの上に電気ベースやシンセサイザーを重ねた音を確立した。もう一つ重要なのが昼間の公演という現象で、親に夜の外出を許されない若者や、ナイトクラブでの人種差別で入場できなかった若者のために、平日の昼に行われる催し（初期はサウソールのパブの小ホール）が英国各地で流行した。1990年代には制作者Bally Sagooがバングラーにヒップホップやファンクを混ぜたリミックス（別の人が作り直した版）を手がけ、1994年にはメジャー・レーベルと契約した。パンジャーブ側では、Gurdas Maanが伝統と現代・西洋の要素を組み合わせた洗練された電子的な音楽でパンジャーブ音楽を南アジア全域に広げ、Kuldeep Manakはパンジャーブ民謡のカリー（kali）などで知られた。1998年、Panjabi MCが、Knight Riderの主題歌を下敷きにしたBusta Rhymesの「Fire It Up」の低音とビートの一部を使い、ドールなどと組み合わせたMundian To Bach Keをアルバム曲として発表し、2002年のシングルで欧州を中心に世界的なヒットとなり、2003年に米国のJay-Zが加わった版で北米にも波及した。バングラー系のリズムは1950年代（1957年の映画『Naya Daur』など）から映画音楽に取り入れられ、以後ボリウッドに欠かせない要素の一つとなり、結婚式の音楽としても不可欠な存在となっている。</p>
