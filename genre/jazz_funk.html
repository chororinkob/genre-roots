<h1>Jazz Funk（ジャズ・ファンク）とは</h1>
<p>ジャズ・ファンクは、ジャズの即興演奏と複雑な和声構造に、ファンクの強烈なグルーヴとシンコペーションを融合させたジャンルだ。その音響的な核心は「グルーヴ」にある。4拍子を基本としながら、2拍目と4拍目に強いバックビートを置き、さらに</p>
<p>ジャズ・ファンクは、ジャズの即興演奏と複雑な和声構造に、ファンクの強烈なグルーヴとシンコペーションを融合させたジャンルだ。その音響的な核心は「グルーヴ」にある。4拍子を基本としながら、2拍目と4拍目に強いバックビートを置き、さらに16分音符を細かく刻むリズムパターンが特徴的だ。テンポはおおむね90〜120BPMの範囲に収まることが多く、踊れるが重厚感も失わないバランスを保っている。

リズムセクションでは、エレクトリック・ベースが「スラップ奏法（サムピング＆プラッキング）」を多用する。親指で弦を叩き、人差し指で引っ張ることで生まれるパーカッシブな音色は、ジャズ・ファンクの最も識別しやすい音響要素のひとつだ。ドラムはハイハットを16分音符で刻みながら、スネアとバスドラムで複雑なポリリズムを構築する。コンガやカウベルなどのパーカッションが加わることも多く、アフリカ的なリズムの層が生まれる。

和声面では、ドミナント7thコードを長時間保持する「ヴァンプ」と呼ばれる手法が多用される。マイナー・ペンタトニックやドリアン・スケールが旋律の基盤となり、ブルーノートが随所に挿入されることで、ブルースとジャズの両方の香りを持つ独特の緊張感が生まれる。

使用楽器はエレクトリック・ピアノ（フェンダー・ローズやウーリッツァー）、ハモンドB3オルガン、ワウワウ・ペダルを踏んだエレクトリック・ギター、ブラスセクション（トランペット・テナーサックス・トロンボーン）が中心だ。フェンダー・ローズの柔らかく揺れる音色は、ジャズ・ファンクの「温かみ」を象徴する音響だ。ワウワウ・ペダルはギターの音色を母音のように変化させ、ファンキーな語感を生み出す。

ボーカルが入る場合、コール・アンド・レスポンス形式が多く、ゴスペル的な発声と即興的なスキャットが組み合わさる。インストゥルメンタル曲も非常に多く、その場合はサックスやトランペットがメロディーを担い、長尺のアドリブ・ソロが展開される。曲構成はテーマ提示→ソロ回し→テーマ回帰という形が基本だが、ファンクのヴァンプ部分が長く引き伸ばされることで、ライブでは20分を超えることも珍しくない。

スムース・ジャズとの違いは明確で、スムース・ジャズが商業的な聴きやすさを優先し即興を抑制するのに対し、ジャズ・ファンクは演奏者の即興性と身体的なグルーヴを同等に重視する。フュージョンとも近いが、フュージョンがロックやラテンの要素を広く取り込むのに対し、ジャズ・ファンクはファンクのリズム構造に特化している点が異なる。クラブのダンスフロア、野外フェスティバル、ジャズ・バーのライブステージなど、身体を動かせる空間で最も輝くジャンルだ。</p>
<h2>成り立ち</h2><p>ジャズ・ファンクの誕生は1960年代後半のアメリカに求められる。当時のジャズ界は、ビバップやハード・バップが知的な方向へ進化を続ける一方、若い黒人聴衆はジェームス・ブラウンやスライ・アンド・ザ・ファミリー・ストーンが牽引するファンクの身体的なグルーヴに熱狂していた。この二つの流れを橋渡しした最大の功労者がマイルス・デイヴィスだ。1969年発表の『ビッチェズ・ブリュー』は、エレクトリック楽器とロック・ファンクのリズムをジャズの即興演奏に持ち込んだ歴史的作品であり、ジャズ・ファンクを含むエレクトリック・ジャズ全体の出発点となった。

しかし、ジャズ・ファンクをより直接的に形成したのはハービー・ハンコックだ。1973年のアルバム『ヘッド・ハンターズ』は、ジャズ・ファンクの金字塔として今なお語り継がれる。収録曲「チェメロン」では、クラヴィネットのカッティングとシンセサイザーのベースラインが絡み合い、ファンクの肉体性とジャズの知性が完璧に融合している。このアルバムはジャズ史上最大のセールスを記録し、ジャンルの商業的可能性を証明した。ハンコックはブルーノート・レーベルからコロンビア・レーベルへ移籍してこの作品を発表しており、レーベルの変化自体がジャズの商業戦略の転換を象徴していた。

グラント・グリーンはギタリストとして重要な役割を果たした。ブルーノート・レーベルに残した1970年代初頭の作品群、特に『ライヴ・アット・ザ・ライトハウス』（1972年）では、ワウワウ・ペダルを踏んだギターとオルガンが絡む濃密なグルーヴが記録されている。同じくブルーノートのルー・ドナルドソンも、1967年の『アリゲーター・ボガルー』でファンキーなアルト・サックスを披露し、ジャズとファンクの接点を早期に示した。

ロニー・ロウズ、ドナルド・バード、ボビー・ハンフリーらも1970年代前半にブルーノートからジャズ・ファンク色の強い作品を発表し続けた。特にドナルド・バードの『ブラック・バード』（1973年）はヒップホップ時代にサンプリング素材として再発見され、ジャンルの影響力が世代を超えて持続することを示した。

イギリスでは独自のジャズ・ファンク・シーンが形成された。1970年代後半から1980年代にかけて、ロンドンのクラブ・シーンでジャズ・ファンクはダンス・ミュージックとして機能した。ガルフォード・ファンク・バンドやレベル42などのグループが登場し、アメリカのジャズ・ファンクをよりポップかつダンサブルに解釈した「ブリット・ファンク」と呼ばれる派生形が生まれた。DJのクリス・ヒルやボブ・ジョーンズがロンドンのクラブでジャズ・ファンクをかけ続け、後のアシッド・ジャズ・シーンへの土台を作った。

1980年代に入るとシンセサイザーとドラムマシンの普及がジャズ・ファンクの音響を変化させた。マーカス・ミラーはエレクトリック・ベースのスラップ奏法を極限まで洗練させ、マイルス・デイヴィスの後期作品のプロデュースも手がけた。この時期のジャズ・ファンクはスムース・ジャズへの分岐点でもあり、商業性を高める方向と即興性を維持する方向に分裂していった。

1990年代にはアシッド・ジャズ・レーベル（ロンドン）がジャズ・ファンクを現代的に再解釈し、インコグニートやブランド・ニュー・ヘヴィーズが新世代のリスナーを獲得した。ヒップホップのサンプリング文化もジャズ・ファンクの再評価を促し、ア・トライブ・コールド・クエストやギャング・スターがジャズ・ファンクのループを多用したことで、若い世代がオリジナル音源を掘り起こすきっかけとなった。

現在もロバート・グラスパーやカマシ・ワシントンらがジャズ・ファンクの精神を継承しながら、ネオソウルやヒップホップとの融合を進めている。ジャズ・ファンクは「古典」として博物館に収まることなく、常に現代の音楽と対話し続けるジャンルだ。</p>
