<h1>Jazz Funk（ジャズ・ファンク）とは</h1>
<p>ジャズ・ファンクは、ジャズの即興演奏の自由さに、ファンクのリフ中心の反復的なグルーヴとシンコペーションを組み合わせたジャンルだ。音の中心にあるのは「グルーヴ」、つまり体が自然に動き出すようなノリである。 楽器の中心は、エレクトリッ</p>
<p>ジャズ・ファンクは、ジャズの即興演奏の自由さに、ファンクのリフ中心の反復的なグルーヴとシンコペーションを組み合わせたジャンルだ。音の中心にあるのは「グルーヴ」、つまり体が自然に動き出すようなノリである。

楽器の中心は、エレクトリック・ピアノ（フェンダー・ローズやウーリッツァー）、ハモンドB3オルガン、ワウワウ・ペダルを踏んだエレクトリック・ギター、そしてブラスセクション（トランペット・テナーサックス・トロンボーン）だ。フェンダー・ローズの柔らかく揺れる音色は、ジャズ・ファンクの「温かみ」の代名詞といえる音だ。ワウワウ・ペダルはギターの音色を母音のように変化させ、ファンキーな語感を生む。

リズム隊では、エレクトリック・ベースで「スラップ奏法（サムピング＆プラッキング）」を用いるベーシストもいる（例：マーカス・ミラー）。親指で弦を叩き、人差し指で引っ張ることで、パーカッシブな音色が生まれる。

和音の面では、1〜2コードを反復する「ヴァンプ」という手法がよく使われる。旋律の土台はマイナー・ペンタトニックやドリアン・スケールだ。そこにブルーノートがあちこちで差し込まれ、ブルースとジャズの両方の香りを持つ独特の緊張感が生まれる。

リズムは4拍子が基本だ。2拍目と4拍目を強く打つ「バックビート」を置き、さらに16分音符（1拍を4つに分けた短い音）を細かく刻む。ドラムはハイハットを16分音符で刻みながら、スネアとバスドラムで複数のリズムを重ね、複雑な響きを作る。コンガやカウベルなどのパーカッションが加わることも多く、アフリカ的なリズムの層が生まれる。テンポは中くらいで、踊れるのに重みも失わないバランスを保っている。

歌が入る場合は、コール・アンド・レスポンスの形が多い。ゴスペル的な発声と、即興的なスキャットが組み合わさる。インストゥルメンタル曲も非常に多い。その場合はサックスやトランペットがメロディーを担い、長いアドリブ・ソロが展開される。

曲の組み立ては、テーマ提示→ソロ回し→テーマに戻る、という形が基本だ。ただ、ファンクのヴァンプ部分が長く引き伸ばされるため、曲が長くなることがある。ハービー・ハンコックの「カメレオン」のスタジオ版は、約15分44秒ある。

スムース・ジャズとの違いは、はっきりしている。スムース・ジャズは商業的な聴きやすさを優先し、即興を抑える。一方ジャズ・ファンクは、演奏者の即興性と、体で感じるグルーヴを同じくらい大切にする。ジャズ・ファンクは、フュージョンの一系統とされる。その中でも、ファンクのリズム構造を特に重んじる。クラブのダンスフロア、野外フェスティバル、ジャズ・バーのライブステージなど、体を動かせる場所で最も輝くジャンルだ。</p>
<h2>成り立ち</h2><p>ジャズ・ファンクの誕生は、1960年代後半のアメリカにさかのぼる。当時のジャズ界では、ビバップやハード・バップが成熟していった。その一方で、若い黒人の聴き手は、ジェームス・ブラウンやスライ・アンド・ザ・ファミリー・ストーンが引っぱるファンクの、体で感じるグルーヴに熱狂していた。

この二つの流れを橋渡しした一人が、マイルス・デイヴィスだ。マイルスは1970年発売の『ビッチェズ・ブリュー』（録音は1969年）や『On the Corner』（1972年）で、エレクトリックとロック／ファンクの要素をジャズの即興演奏に持ち込んだ。『ビッチェズ・ブリュー』は、ジャズ・ロックの先駆、そしてフュージョンを定義し広めた作品と評されている。

一方、ハービー・ハンコックは1973年のアルバム『ヘッド・ハンターズ』で、商業的な成功とともにジャズ・ファンクを広めた。このアルバムは、ジャズ・ファンクの金字塔として今も語り継がれている。収録曲「カメレオン」では、シンセサイザーの低音の旋律が響く。そこに、クラヴィネット（鍵盤楽器）の鋭く刻む演奏が絡むとも言われる。ファンクの体に響く力と、ジャズの知的な面白さが見事に溶け合っている。

このアルバムは100万枚を超えるヒットとなった。1976年にジョージ・ベンソンの『Breezin'』に抜かれるまで、最も売れたジャズ・アルバムだった。プラチナ認定は1986年である。このアルバムは、ジャンルが商売としても成り立つことを証明した。ハンコックは1969年にブルーノート・レーベルを離れ、ワーナー・ブラザースと契約した。そして1973年には、コロンビア・レーベルからこの作品を出した。このレーベルの移り変わりそのものが、ジャズの商業戦略の転換を表していた、という見方もある。

グラント・グリーンは、ギタリストとして重要な役割を果たした。1970年代初めにブルーノート・レーベルに残した作品群、とくに『ライヴ・アット・ザ・ライトハウス』（1972年録音、1973年発売）には、ギターとオルガンなどが絡む濃いグルーヴが記録されている。同じブルーノート・レーベルのルー・ドナルドソンも、1967年の『アリゲーター・ボガルー』でファンキーなアルト・サックスを聴かせ、ハード・バップとソウル・ジャズを融合させた音を示した。

ドナルド・バードとボビー・ハンフリーは1970年代前半に、ロニー・ロウズは1975年からの数年間に、ブルーノート・レーベルからジャズ・ファンク色の強い作品を出した。とくにドナルド・バードの『ブラック・バード』（1973年）は、ヒップホップの時代に、他の曲に切り貼りして使う素材（サンプリング）として再発見された。ジャンルの影響力が、世代を超えて続くことを示した例である。

イギリスでは、独自のジャズ・ファンク・シーンが生まれた。1970年代後半から1980年代にかけて、イギリスのクラブ・シーンで、ジャズ・ファンクはダンス・ミュージックとして親しまれた。Light of the WorldやFreeez、レベル42などのグループが登場し、ファンク、ジャズ、ソウル、ポップを混ぜたイギリス独自の「ブリット・ファンク」が生まれた。DJのクリス・ヒルやボブ・ジョーンズは、エセックスのクラブを中心にジャズ・ファンクをかけ続け、後のアシッド・ジャズ・シーンに影響を与えた。

1980年代に入ると、シンセサイザーとドラムマシンの普及が、ジャズ・ファンクの音を変えた。マーカス・ミラーは、エレクトリック・ベースのスラップ奏法の第一人者として知られ、マイルス・デイヴィスの『Tutu』などをプロデュースした。スムース・ジャズは、主にフュージョンから生まれた商業志向のジャンルとされる。この時期のジャズ・ファンクは、商業性を高める方向と、即興性を保つ方向に分かれていった。

1990年代には、アシッド・ジャズ・レーベル（ロンドン）が、ジャズ・ファンクを今の感覚で解釈し直した。同レーベルのブランド・ニュー・ヘヴィーズと、Talkin' Loudなどから作品を出した1979年結成のインコグニートが、アシッド・ジャズ・シーンで新しい世代の聴き手をつかんだ。ヒップホップのサンプリング文化も、ジャズ・ファンクの再評価を後押しした。ア・トライブ・コールド・クエストやギャング・スターがジャズやソウル・ジャズ、ジャズ・ファンクなどのレコードをサンプリングしたことで、若い世代が元の音源を掘り起こすきっかけになった。

現在も、ロバート・グラスパーらが、ジャズとネオソウルやヒップホップとの融合を進めている。ジャズ・ファンクは「古典」として博物館に収まることなく、いつも今の音楽と対話し続けるジャンルだ。</p>
