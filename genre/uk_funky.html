<h1>UK Funkyとは</h1>
<p>2000年代末のロンドンで生まれた、打楽器の躍動を前面に出したダンス音楽である。テンポは概ね128から132 BPMで、キックは四つ打ちか、シンコペーション(拍の強弱をずらすこと)を効かせた型で、この音楽を特徴づけるのはその上に敷</p>
<p>2000年代末のロンドンで生まれた、打楽器の躍動を前面に出したダンス音楽である。テンポは概ね128から132 BPMで、キックは四つ打ちか、シンコペーション(拍の強弱をずらすこと)を効かせた型で、この音楽を特徴づけるのはその上に敷かれる打楽器の層である。コンガ、ボンゴ、ティンバレス、シェイカーといったラテンおよびアフリカ由来の打楽器が、複雑に絡み合う音型を刻み、拍の隙間を細かく埋めていく。この音型には、カリブ海のトリニダードで発達したソカのリズムを含む複数の影響が指摘されており、ロンドンに根を下ろしたカリブ系とアフリカ系の移民の文化が、そのまま音の構造に現れている。低音は短く切ったベース音が跳ねる形で置かれ、持続せずに空間を残す。上物は簡素なことが多く、シンセの一撃や鍵盤の短い和音が置かれる。この余白の多さが、打楽器の絡み合いを際立たせる仕掛けである。ソウルフルな女性ボーカルの曲、MC主導の掛け声の曲、インストの曲が併存した。曲は明確な起伏を持たず、同じ躍動が保たれる。都会の夜に、汗をかいて踊るための実用的な音楽として設計されている。</p>
<h2>成り立ち</h2><p>2000年代半ばのロンドンでは、UKガラージが規制と暴力の問題で衰退し、そこから派生したグライムが男性中心の攻撃的な音楽として発展していた。クラブの現場では、グライムより男臭くない、踊れて歌のある音楽への需要があった。UKファンキーは2000年代半ば(2005〜06年ごろ)に生まれ、2008年には最盛期に入ってロンドンのクラブで主流の音になった。担い手はロンドンのカリブ系およびアフリカ系の若者たちで、彼らにとってソカやアフリカの打楽器音楽は、家庭や地域の祝祭で聴いて育った身近な素材だった。それをハウスの四つ打ちと組み合わせるという発想は、必然的なものだった。Crazy Cousinzが歌手Kylaを迎えた「Do You Mind」(2008年録音、2009年1月に英国で発売)は、この様式を代表する一曲となり、2009年にはDonae'oの楽曲が広く支持を集める。RoskaやLil Silva、女性制作者として貴重な存在だったCooly Gらが独自の解釈を加え、Championは2010年にRinse FMの編集盤に曲が収録され、2011年のMotherboard EPで注目を集めた。流通を支えたのは海賊放送局のRinse FMである。1994年に無許可の放送として始まったこの局は、若い制作者が自分の音を即座に街へ届ける回路として機能し、2010年6月に放送免許が与えられ、合法の放送は2011年2月に始まった。ただし流行の期間は極めて短く、2010年を過ぎると勢いは急速に失われた。理由としては、大手レコード会社が拾い上げる仕組みが未熟だったこと、そして中心にいた作り手たちが別の方向へ分散したことが挙げられる。しかしこの音楽が残したものは大きい。2016年、Drakeが世界的な大ヒットとなった楽曲で、前述のKylaの「Do You Mind」(Crazy Cousinz Remix)を引用したことにより、ロンドンの小さなクラブで生まれた音が、数年後に世界中のラジオから流れるという結果になった。このスタイルは、アフロビーツの流行の下地を作ったとされる。</p>
<h2>代表曲</h2><ul><li>The Cure &amp; The Cause（Fish Go Deep）</li><li>Do You Mind（Crazy Cousinz ft. Kyla）</li><li>In the Morning（Egypt）</li><li>Bongo Jam (Bongo Song) (Crazy Cousinz)</li><li>Daydreaming (Crazy Cousinz feat. Calista)</li><li>Funky Anthem (Crazy Cousinz)</li><li>Squark（Roska）</li><li>For U (Funkystepz)</li><li>Move (Roska)</li><li>Pirate Material (Funkystepz)</li><li>In the Name of the Devil (Roska)</li><li>Muses (Roska)</li></ul>
