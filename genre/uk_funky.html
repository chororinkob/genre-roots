<h1>UK Funkyとは</h1>
<p>2000年代半ば（2005年ごろ）のロンドンで生まれた、打楽器の弾むような勢いを前面に出したダンス音楽である。 テンポは約130 BPM前後で、125〜130とする見方もある。キックは四つ打ちか、シンコペーション(拍の強弱をずらす</p>
<p>2000年代半ば（2005年ごろ）のロンドンで生まれた、打楽器の弾むような勢いを前面に出したダンス音楽である。

テンポは約130 BPM前後で、125〜130とする見方もある。キックは四つ打ちか、シンコペーション(拍の強弱をずらすこと)を効かせた型をとる。

この音楽を特徴づけるのは、その上に敷かれる打楽器の層だ。ラテンやアフリカ風の打楽器音（サンプルを含む）が複雑に絡み合ってリズムを刻み、拍の隙間を細かく埋めていく。このリズムの形には、カリブ海のトリニダードで発達したソカのリズムを含む、複数の影響が指摘されている。ソカや西アフリカ音楽の要素が、ハウスやUKガラージなどと混ざり合っているのだ。

低音は、短く切ったベース音が跳ねるように置かれる。音は伸ばさず、空間を残す。上に重ねる音は簡素なことが多く、シンセの一撃や鍵盤の短い和音が置かれる程度だ。この音の少なさが、打楽器の絡み合いを際立たせる仕掛けになっている。

曲には、ソウルフルな女性ボーカルの曲、MCが主導する掛け声の曲、インストの曲が並んでいた。都会の夜に、汗をかいて踊るための実用的な音楽として作られている。</p>
<h2>成り立ち</h2><p>2000年代半ばのロンドンでは、UKガラージが規制と暴力の問題で衰えていた。そこから派生したグライムは、男性中心の攻撃的な音楽として発展していた。クラブの現場には、グライムほど男臭くない、踊れて歌のある音楽を求める声があった。

UKファンキーは、2000年代半ば(2005〜06年ごろ)に生まれた。2008年ごろには、ロンドンのクラブ・シーンで最有力の音になりつつあった。担い手は、黒人系ブリティッシュの制作者が中心だ。この音楽は、ソカや西アフリカ音楽で育った層も含む、多様な層の寄り合いから生まれた。

Palefaceは2007年に、Kylaが参加したベースラインの曲「Do You Mind」を発表した。Crazy Cousinzは2008年にこれをUKファンキー調にリミックスし、2009年1月に英国で発売した。この版が、このスタイルを代表する一曲となった。2009年には、Donae'oの楽曲が広く支持を集める。

RoskaやLil Silva、女性制作者として貴重な存在だったCooly Gらも、独自の解釈を加えた。Championは、2010年にRinse Recordingsの編集盤『I Love Funky』に「Motherboard」が収録され、2011年のMotherboard EPで注目を集めた。

流通を支えたのは、Rinse FMやDJ Vu FMなどの海賊放送局である。Rinse FMは1994年に、無許可の放送として始まった。若い制作者が、自分の音をすぐに街へ届ける手段として働いた局だ。2010年6月に放送免許が与えられ、合法の放送は2011年2月に始まった。

しかし、流行の期間はとても短かった。2010年を過ぎると、勢いは急速に失われた。理由としては、シーンの中で曲を流通させる土台の不足、便乗したヒット曲の乱発、品質管理の欠如、結束の弱さなどが指摘される。

それでも、この音楽が残したものは大きい。2016年、Drakeは世界的な大ヒット曲で、前述のKylaの「Do You Mind」(Crazy Cousinz Remix)を引用した。こうして、ロンドンの小さなクラブで生まれた音が、約8年後に世界中のラジオから流れることになった。このスタイルは、アフロビーツの流行の下地を作った、という見方もある。</p>
