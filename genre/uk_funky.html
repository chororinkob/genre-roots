<h1>UK Funkyとは</h1>
<p>2000年代末のロンドンで生まれた、打楽器の躍動を前面に出したダンス音楽である。テンポは概ね128から132 BPMで、キックは四つ打ちを基本とするが、この音楽を特徴づけるのはその上に敷かれる打楽器の層である。コンガ、ボンゴ、ティ</p>
<p>2000年代末のロンドンで生まれた、打楽器の躍動を前面に出したダンス音楽である。テンポは概ね128から132 BPMで、キックは四つ打ちを基本とするが、この音楽を特徴づけるのはその上に敷かれる打楽器の層である。コンガ、ボンゴ、ティンバレス、シェイカーといったラテンおよびアフリカ由来の打楽器が、複雑に絡み合う音型を刻み、拍の隙間を細かく埋めていく。この音型の多くはカリブ海のトリニダードで発達したソカのリズムから借りられており、ロンドンに根を下ろしたカリブ系とアフリカ系の移民の文化が、そのまま音の構造に現れている。低音は短く切ったベース音が跳ねる形で置かれ、持続せずに空間を残す。上物は極端に簡素で、シンセの一撃、鍵盤の短い和音、そして女性の歌が乗る程度に留められる。この余白の多さが、打楽器の絡み合いを際立たせる仕掛けである。歌が入る場合はソウルフルな歌唱が正面に据えられ、ハウスに近い聴きやすさを持つ一方、歌のない曲では打楽器だけが延々と続く。曲は明確な起伏を持たず、同じ躍動が保たれる。都会の夜に、汗をかいて踊るための実用的な音楽として設計されている。</p>
<h2>成り立ち</h2><p>2000年代半ばのロンドンでは、UKガラージが規制と暴力の問題で衰退し、そこから派生したグライムが男性中心の攻撃的な音楽として発展していた。しかしグライムの荒々しさは、踊りに来た女性の客を遠ざけるという問題を抱えており、クラブの現場では、踊れて、歌があり、暴力的でない音楽への需要が高まっていた。この空白を埋める形で、2008年前後にUKファンキーが立ち上がる。担い手はロンドンのカリブ系およびアフリカ系の若者たちで、彼らにとってソカやアフリカの打楽器音楽は、家庭や地域の祝祭で聴いて育った身近な素材だった。それをハウスの四つ打ちと組み合わせるという発想は、必然的なものだった。2008年、Crazy Cousinzが歌手Kylaを迎えて発表した楽曲は、この様式を代表する一曲となり、翌2009年にはDonae'oの楽曲が広く支持を集める。RoskaやLil Silva、女性制作者として貴重な存在だったCooly Gらが独自の解釈を加え、2010年にはChampionの楽曲が広く知られるようになった。流通を支えたのは海賊放送局のRinse FMである。1994年に無許可の放送として始まったこの局は、若い制作者が自分の音を即座に街へ届ける回路として機能し、2010年に正式な放送免許を取得するに至った。ただし流行の期間は極めて短く、2010年を過ぎると勢いは急速に失われた。理由としては、大手レコード会社が拾い上げる仕組みが未熟だったこと、そして中心にいた作り手たちが別の方向へ分散したことが挙げられる。しかしこの音楽が残したものは大きい。2016年、Drakeが世界的な大ヒットとなった楽曲で、前述のKylaの2008年の歌声をそのまま引用したことにより、ロンドンの小さなクラブで生まれた音が、8年後に世界中のラジオから流れるという結果になった。打楽器の躍動を軸に据えるという発想は、その後のアフロビーツの世界的な流行や、現在のイギリスのベースミュージックに直接つながっている。</p>
