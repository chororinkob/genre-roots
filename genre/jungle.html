<h1>Jungle（ジャングル）とは</h1>
<p>高速のブレイクビーツ（切り刻んだドラムの音）と、極端に低いベースを組み合わせたイギリス発のダンス音楽。テンポはおおむね160〜170BPM（1分間の拍数。初期は150〜160程度）。しかし体感される速度は二重構造になっており、ドラ</p>
<p>高速のブレイクビーツ（切り刻んだドラムの音）と、極端に低いベースを組み合わせたイギリス発のダンス音楽。テンポはおおむね160〜170BPM（1分間の拍数。初期は150〜160程度）。しかし体感される速度は二重構造になっており、ドラムは高速で刻まれる一方、ベースラインはドラムの半分の速度で動くため、聴き手は速さと遅さを同時に感じることになる。この二重性がジャンルの大きな特徴になっている。ドラムはAmen Breakをはじめとするブレイクを、細かく切り刻み、順序を入れ替えて再構成する。一つのブレイクから多くのパターンを作り出す編集技術が、制作者の技量そのものになる。ベースはレゲエのサウンドシステム（巨大な移動式の音響設備）文化を土台にしたサブベース（体に響く極低音）で、数十Hz（音の高さの単位）台の低い帯域を長く持続させ、身体で感じる圧力として鳴らされる。上物（メロディーなど上に重ねる音）にはレゲエやダンスホールのヴォーカルの断片、暗い作風ではホラー映画の効果音も使われ、シンセの暗い和音が置かれることもある。MCがパトワ(ジャマイカの言葉)で煽ることも多い。和声（コードの響き）は、メロディーやピアノ、レイヴ・スタブなどが使われ、ダークなパッドを使う曲もある。ブレイク（演奏が一瞬止まる部分）で全てを抜いてから低音が戻る瞬間が最大の見せ場になる。ドラムンベースの直接の前身だが、ジャングルの方がドラムの編集が荒々しく、レゲエとの結びつきが強い点で区別される。</p>
<h2>成り立ち</h2><p>1992年ごろ（1991年説もある）から1994年頃のロンドンで、ハードコア・レイヴが分裂する過程で生まれた。当時のレイヴでは、明るいピアノと甲高い歌を求める層（ハッピーハードコア）、暗いサンプルを使う路線（ダークコア）、低音とブレイクビーツを重視する層などに分かれていき、最後の層がジャングルへ進んだ。この分裂には人種的な要素があった。ジャングルはロンドンの黒人、とりわけカリブ系の若者の文化と強く結びつき、ジャマイカのサウンドシステム（巨大な移動式の音響設備）の習わし(MCの煽り、リワインド、低音重視)を土台に、UKのレイヴ文化と融合した。名称の由来には諸説あり、キングストンのTivoli Gardensという地区の通称jungleに由来するという説や、同じキングストンの「Concrete Jungle」と呼ばれたArnett Gardensとする説や、レコードのサンプルに含まれる語からという説がある。この語には人種差別的な含みがあるとして当初から議論があり、後にドラムンベースという呼称が広まった背景の一つにもなった。中心となった作家はGoldie、4 Hero、A Guy Called Gerald、Rebel MC(Congo Natty)、Shy FX、Remarc、Dillinja。Roni Sizeはジャングルからドラムンベースへの移行を担った一人である。レーベルではMoving Shadow、Reinforced Records、Suburban Base、Congo Natty、Metalheadzが機能した。海賊放送のKool FMが1991年に開局し、ジャングルで最も重要な海賊放送局とされる。1994年にM-Beatの「Incredible」(General Levyの歌唱)が全英チャート上位に入り、ジャングルが一般に知られる。同年にGoldieが先行シングル「Inner City Life」を発売し、翌1995年のアルバム「Timeless」は、この音楽が長尺で構成的なアルバムとしても成立することを示した。しかし商業的成功と同時に、大衆紙による犯罪や薬物と結びつけた報道が過熱した。実際にクラブでの暴力事件も報じられ、一部のクラブで黒人客の入場拒否や出演の締め出しがあった。1995〜96年ごろから、シーンはドラムンベースという呼称へ移行し、より洗練された方向へ進んだ。一部のDJ・制作者は呼称を変える必要を語っており、この移行は自然な変化でもあった。2000年代を通じてジャングルは中心から外れた存在になったが、共同体は存続し、Congo Nattyらが原点の精神を維持した。2010年代半ば以降、ネット上のコミュニティ（フォーラムやFacebookグループなど）を介して、ジャングルの復興が世界的に起きている。新しい制作者も現れている。</p>
