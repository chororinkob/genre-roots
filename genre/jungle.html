<h1>Jungle（ジャングル）とは</h1>
<p>ジャングルは、イギリス発のダンス音楽だ。高速のブレイクビーツ（切り刻んだドラムの音）と、極端に低いベースを組み合わせる。 テンポはおおむね160〜170BPM（1分間の拍数。初期は150〜160程度）である。ただし、体感される速度</p>
<p>ジャングルは、イギリス発のダンス音楽だ。高速のブレイクビーツ（切り刻んだドラムの音）と、極端に低いベースを組み合わせる。

テンポはおおむね160〜170BPM（1分間の拍数。初期は150〜160程度）である。ただし、体感される速度は二重構造になっている。ドラムは高速で刻まれる。一方、ベースラインはドラムの半分の速度で動く。そのため、聴き手は速さと遅さを同時に感じることになる。この二重性が、ジャンルの根本的な仕掛けである。

ドラムは、Amen Breakをはじめとするブレイクを、16分音符ほどの細かさにまで切り刻むことが多い。そして、順序を入れ替えて再構成する。一つのブレイクから何十通りかのパターンを作り出す編集技術が、制作者の技量そのものになる。

ベースは、レゲエのサウンドシステム（巨大な移動式の音響設備）文化を土台にしたサブベース（体に響く極低音）だ。40Hz（音の高さの単位）前後とされる低い帯域を長く持続させる。身体で感じる圧力として鳴らされる。

上物（メロディーなど上に重ねる音）には、レゲエやダンスホールのヴォーカルの断片、シンセの暗い和音が置かれる。ダークな作風では、ホラー映画のサンプルも使われた。MCがパトワ(ジャマイカの言葉)で煽ることも多い。和声（コードの響き）は、ダークなパッドを使う曲もある。

曲は5分から7分ほどのものが多い。ブレイク（演奏が一瞬止まる部分）で全てを抜いてから、低音が戻る瞬間が最大の見せ場になる。

ドラムンベースの直接の前身だが、区別される点がある。ジャングルの方が、ドラムの編集が荒々しく、レゲエとの結びつきが強い。</p>
<h2>成り立ち</h2><p>舞台は、1992年ごろ(1991年説もある)から1994年頃のロンドンだ。ハードコア・レイヴが分裂する過程で、ジャングルは生まれた。

当時のレイヴでは、嗜好が分かれつつあった。明るいピアノと甲高い歌を求める層と、低音とブレイクビーツを重視する層である。これが、ハッピーハードコア、ダークコア、ジャングルなどに分岐した。この分裂には、人種的な要素があった。ジャングルは、ロンドンの黒人、とりわけカリブ系の若者の文化と強く結びついた。ジャマイカのサウンドシステム（巨大な移動式の音響設備）の習わし(MCの煽り、リワインド、低音重視)を土台に、UKのレイヴ文化と融合したのである。

名称の由来には諸説ある。キングストンのTivoli Gardensという地区の通称jungleに由来するという説がある。同じキングストンの「Concrete Jungle」と呼ばれたArnett Gardensとする説もある。レコードのサンプルに含まれる語からという説もある。この語には人種差別的な含みがあるとして、当初から議論があった。後にドラムンベースという呼称が広まった背景の一つにもなった。

中心となった作家は、Goldie、4hero、A Guy Called Gerald、Rebel MC(Congo Natty)、Shy FX、Remarc、Dillinjaだ。Roni Sizeは、ジャングルからドラムンベースへの移行を担った一人である。レーベルでは、Moving Shadow、Reinforced Records、Suburban Base、Congo Natty、Metalheadzが機能した。海賊放送のKool FMは1991年に開局した。Martin Jamesは、これを『ジャングルで最も重要な海賊放送局』と評している。

1994年、M-Beatの「Incredible」(General Levyの歌唱)が全英チャート上位に入った。ジャングルが一般に知られるきっかけだった。同年にGoldieが先行シングル『Inner City Life』を発売し、アルバム「Timeless」は1995年に発表された。この音楽が、長尺で構成的なアルバムとしても成立することを示した。

しかし、商業的成功と同時に、大衆紙による犯罪や薬物と結びつけた報道が過熱した。実際にクラブでの暴力事件も報じられた。一部のクラブで、黒人客の入場拒否や出演締め出しがあった。

1995〜96年ごろから、一部のDJ・制作者は、呼称を変える必要を語った。移行は自然な変化でもあり、より洗練されジャズ的な方向(Roni SizeやLTJ Bukem)へ進んだ。この転換には、ジャングルという語に付着した否定的な印象から距離を取るという意図があったと、当事者が証言している。

2000年代を通じて、ジャングルは中心から外れた存在になった。しかし共同体は存続し、Congo Nattyらが原点の精神を維持した。2010年代後半以降、当時の音が若い世代に再発見され、ジャングルの復興が世界的に起きている。2010年代半ば以降は、ネット上のコミュニティ(フォーラム、Facebookグループなど)を介して世界的に復興し、新しい制作者が絶えず現れている。</p>
