<h1>Jungle（ジャングル）とは</h1>
<p>高速のブレイクビーツと、極端に低いベースを組み合わせたイギリス発のダンス音楽。テンポは160〜175BPM。しかし体感される速度は二重構造になっており、ドラムは高速で刻まれる一方、ベースとハーモニーは半分の速度で進行するため、聴き</p>
<p>高速のブレイクビーツと、極端に低いベースを組み合わせたイギリス発のダンス音楽。テンポは160〜175BPM。しかし体感される速度は二重構造になっており、ドラムは高速で刻まれる一方、ベースとハーモニーは半分の速度で進行するため、聴き手は速さと遅さを同時に感じることになる。この二重性がジャンルの根本的な仕掛けである。ドラムはAmen Breakをはじめとするブレイクを、16分音符あるいはそれ以下の単位まで切り刻み、順序を入れ替えて再構成する。一つのブレイクから何十通りものパターンを作り出す編集技術が、制作者の技量そのものになる。ベースはレゲエのサウンドシステム文化を直接受け継いだサブベースで、40Hz付近の帯域を長く持続させ、身体で感じる圧力として鳴らされる。上物にはレゲエやダンスホールのヴォーカルの断片、ホラー映画の効果音、シンセの暗い和音が置かれる。MCがパトワ(ジャマイカの言葉)で煽ることも多い。和声は薄く、マイナー調の単純な持続音が中心。曲は5分から7分で、ブレイクで全てを抜いてから低音が戻る瞬間が最大の見せ場になる。ドラムンベースの直接の前身だが、ジャングルの方がドラムの編集が荒々しく、レゲエとの結びつきが強く、雰囲気が暗い点で区別される。</p>
<h2>成り立ち</h2><p>1992年から1994年頃のロンドンで、ハードコア・レイヴが分裂する過程で生まれた。当時のレイヴでは、明るいピアノと甲高い歌を求める層と、低音とブレイクビーツを重視する層に嗜好が分かれつつあり、後者がジャングルへ進んだ。この分裂には人種的な要素があった。ジャングルはロンドンの黒人、とりわけカリブ系の若者の文化と強く結びつき、ジャマイカのサウンドシステムの慣習(MCの煽り、リワインド、低音重視)をそのまま引き継いだ。名称の由来には諸説あり、キングストンのTivoli Gardensという地区の通称jungleに由来するという説や、レコードのサンプルに含まれる語からという説がある。この語には人種差別的な含みがあるとして当初から議論があり、後にドラムンベースという呼称が広まった背景の一つにもなった。中心となった作家はGoldie、4 Hero、A Guy Called Gerald、Rebel MC(Congo Natty)、Shy FX、Remarc、Dillinja、Roni Size。レーベルではMoving Shadow、Reinforced Records、Suburban Base、Congo Natty、Metalheadzが機能した。海賊放送のKool FMが1991年に開局し、この音楽の最も重要な伝播経路になった。1994年にM-Beatの「Incredible」(General Levyの歌唱)が全英チャート上位に入り、ジャングルが一般に知られる。同年にGoldieの「Timeless」(1995年発表)が制作され、この音楽が長尺で構成的なアルバムとしても成立することを示した。しかし商業的成功と同時に、大衆紙による犯罪や薬物と結びつけた報道が過熱した。実際にクラブでの暴力事件も報じられ、多くの会場がジャングルのイベント開催を拒否するようになる。この排除がシーンに深刻な打撃を与えた。1995年前後から、シーンは意識的にドラムンベースという呼称へ移行し、より洗練されジャズ的な方向(Roni SizeやLTJ Bukem)へ進んだ。この転換には、ジャングルという語に付着した否定的な印象から距離を取るという意図があったと当事者が証言している。2000年代を通じてジャングルは周縁化したが、共同体は存続し、Congo Nattyらが原点の精神を維持した。2010年代後半以降、当時の音が若い世代に再発見され、ジャングルの復興が世界的に起きている。とりわけ2020年代にはSNSを通じて急速に広まり、新しい制作者が絶えず現れている。</p>
<h2>代表曲</h2><ul><li>Timeless（Goldie）</li><li>Inner City Life（Goldie）</li><li>Brown Paper Bag（Roni Size &amp; Reprazent）</li><li>Atlantis（LTJ Bukem）</li></ul>
