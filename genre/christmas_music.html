<h1>Christmas music（クリスマスミュージック）とは</h1>
<p>クリスマス・ミュージックは、12月前後に集中して演奏・聴取される音楽の総体で、固有の音階やビートを持つのではなく「その季節に鳴る音」という機能と文脈によって括られる点が最大の特徴だ。旋律は長調が多く、和声はトニック・サブドミナント</p>
<p>クリスマス・ミュージックは、12月前後に集中して演奏・聴取される音楽の総体で、固有の音階やビートを持つのではなく「その季節に鳴る音」という機能と文脈によって括られる点が最大の特徴だ。旋律は長調が多く、和声はトニック・サブドミナント・ドミナント（和音の基本の三つの役割）を軸にした素直な循環か、I–vi–IV–Vのいわゆる50年代進行を用いる例もあり、サビで転調や借用和音（別の調から借りてきた和音）を使って持ち上げる。合唱曲には中世由来の平行5度・オクターブの和音や旋法（音の並び方の型）的な響きが残ることがある。楽器は教会オルガン、ピアノ、ハープ、弦楽器、金管、鐘、グロッケンシュピール（金属板を叩く鉄琴）、シンセサイザー、スレイベルが定番で、スレイベルやタンバリンを8分裏拍で鳴らす鈴の音は季節の目印として機能する。拍子は4分の4拍子のほか、3拍子のワルツ系キャロルも多く、テンポはバラードから軽快なスウィングまで幅広い。構成はAABAやコーラス・サビ型が多く、最後のサビを半音上げる常套手段で盛り上げる。歌唱はクローニング（ささやくように低く歌う唱法）の低音で語りかける男性バリトン、息を多めに含ませたベルベットボイス（ビロードのようになめらかな声）、児童合唱、ゴスペル由来のコール・アンド・レスポンスと幅がある。フィル・スペクター流の壁のような音像や、教会を思わせる長いリバーブ（残響効果）も頻用される。歌詞の主題は降誕、雪、家路、贈り物、恋人との再会で、隣接するポップスやロックと素材は同じだが、聴取の時期が年に数週間に限られる点で決定的に異なる。</p>
<h2>成り立ち</h2><p>クリスマス音楽の起源は、4世紀のローマ帝国(ミラノ)で作られたラテン語賛美歌にさかのぼると考えられている。アンブロシウスが作ったとされる「Veni redemptor gentium」は、アリウス派に対抗して受肉の教義（神が人となったという教え）をうたう簡素な聖歌だった。9〜10世紀には北ヨーロッパの修道院でクリスマスのセクエンツィア（続唱）が導入され、13世紀にはアッシジのフランチェスコの影響で、フランス・ドイツ・とくにイタリアで各地の日常語による民衆的な降誕歌が広まった。英語のキャロルは1426年に聖職者ジョン・アウドレイが25曲の「caroles of Cristemas」を書き留めたものが最初期の例とされ(14世紀半ばまでさかのぼる説もある)、戸別に歌って回るワッセイラー（家々を回って歌う人々）たちが歌ったと考えられている。1582年刊のラテン語歌曲集「Piae Cantiones」からは多くの有名曲が後世に伝わった。宗教改革ではマルティン・ルターが会衆が母語で歌える讃美歌を推し進め、キャロルが民衆の手に渡る契機を作ったが、17世紀のイングランドではピューリタンの影響で一時衰退した。18〜19世紀に復興が進み、1818年にヨーゼフ・モールの詞とフランツ・クサーヴァー・グルーバーの曲による「きよしこの夜（Silent Night）」が初演され、これは今日もっとも多く録音されたクリスマス曲のひとつとされる。ヴィクトリア朝の直前の1833年にウィリアム・サンディスが「Christmas Carols, Ancient and Modern」を、ヘンリー・ラムズデン・ブラムリーとジョン・ステイナーが1871年に「Christmas Carols, New and Old」を編み、1928年にはマーティン・ショー、レイフ・ヴォーン・ウィリアムズ、パーシー・ディアマー編の「The Oxford Book of Carols」がオックスフォード大学出版局から出た。20世紀初頭の録音技術とラジオの普及で、クリスマス音楽は家庭と商業の音へと変わっていく。1930年代の大恐慌期のアメリカでは降誕の教義を直接語らない世俗的なクリスマス曲が大量に生まれ、ティン・パン・アレーの作詞作曲家たちが「Santa Claus Is Comin' to Town」などを書いた。1942年にはアーヴィング・バーリンが映画「Holiday Inn」のために書いた「White Christmas」をビング・クロスビーがデッカ・レコードに録音し、これは世界でもっとも売れたシングルとされる。1950年代以降はロックンロール、ドゥーワップ、ソウルが参入し、1963年にはフィル・スペクターが「A Christmas Gift for You from Phil Spector」をフィレス・レコードから発表してウォール・オブ・サウンドをクリスマス曲に適用したが、発売当日にケネディ大統領暗殺事件が起きて当初は振るわなかった。1970〜80年代にはスレイドやウィザードの英国のホリデー・ヒット、バンド・エイドの「Do They Know It's Christmas?」、ワム!の「Last Christmas」が生まれ、1994年にはマライア・キャリーの「All I Want for Christmas Is You」が発表され、2019年には25年越しにビルボード・ホット100で1位となり、ギネス世界記録の「ソロ歌手によるホリデー曲のホット100最高位」としてThe Chipmunksと並んだ。日本では、1980年の松任谷由実「恋人がサンタクロース」や1983年の山下達郎「クリスマス・イブ」が土台となり、1980年代後半のJR東海のCMなどで定番になった。一方で、感謝祭より前に開始される「クリスマス・クリープ」や小売店での過剰な反復再生への批判も続いている。</p>
