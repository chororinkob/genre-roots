<h1>Christmas music（クリスマスミュージック）とは</h1>
<p>クリスマス・ミュージックは、12月前後に集中して演奏・聴取される音楽の総体だ。固有の音階やビートを持つのではなく、「その季節に鳴る音」という機能と文脈によって括られる。この点が最大の特徴である。 楽器は、教会オルガン、ピアノ、ハー</p>
<p>クリスマス・ミュージックは、12月前後に集中して演奏・聴取される音楽の総体だ。固有の音階やビートを持つのではなく、「その季節に鳴る音」という機能と文脈によって括られる。この点が最大の特徴である。

楽器は、教会オルガン、ピアノ、ハープ、弦楽器、金管、鐘、グロッケンシュピール（金属板を叩く鉄琴）、シンセサイザーが定番だ。スレイベルも定番である。スレイベルを8分音符で刻む（1小節に8つ）パターンは、人気クリスマス曲78曲の49%に入っていた。この鈴の音は、季節の目印として機能する。

旋律は長調が多い。和声は、トニック・サブドミナント・ドミナント（和音の基本の三つの役割）を軸にした、素直な循環の例が多い。I–vi–IV–Vのいわゆる50年代進行を用いる例もある。サビでは、転調や借用和音（別の調から借りてきた和音）を使って持ち上げる。合唱曲には、中世由来の平行5度・オクターブの和音や、旋法（音の並び方の型）的な響きが残ることがある。

拍子は大半が4/4で、3拍子系（3/4・6/8・12/8）は少数派だ。テンポは、バラードから軽快なスウィングまで幅広い。

歌唱は幅がある。クローニング（マイクの発達を背景にした、なめらかで親密な歌唱）の低音で語りかける男性バリトン、息を多めに含ませたベルベットボイス（ビロードのようになめらかな声）、児童合唱、ゴスペル由来のコール・アンド・レスポンスなどだ。フィル・スペクター流の壁のような音像や、教会を思わせる長いリバーブ（残響効果）も頻用される。

歌詞の主題は、降誕、雪、家路、贈り物、恋人との再会だ。隣接するポップスやロックと素材は同じだが、聴取の時期が年に数週間に限られる点で決定的に異なる。

構成は、AABAやコーラス・サビ型の例が多い。最後のサビを半音または全音上げる常套手段で盛り上げる。</p>
<h2>成り立ち</h2><p>クリスマス音楽は、4世紀ローマ圏(ミラノ)のラテン語賛美歌に起源をもつと考えられている。アンブロシウスが作ったとされる「Veni redemptor gentium」は、アリウス派に対抗して、受肉の教義（神が人となったという教え）をうたう簡素な聖歌だった。

9〜10世紀には、北ヨーロッパの修道院で、クリスマスのセクエンツィア（続唱）が導入された。13世紀には、アッシジのフランチェスコの影響で、フランス・ドイツ・とくにイタリアで、各地の日常語による民衆的な降誕歌が広まった。

英語のクリスマス・キャロルが文献に初めて現れるのは、1426年だ。聖職者ジョン・アウドレイが、25曲の「caroles of Cristemas」を書き留めた著作とされる。ただし現存最古は14世紀半ばとする説もある。これらは、戸別に歌って回るワッセイラー（家々を回って歌う人々）たちが歌ったと考えられている。1582年刊のラテン語歌曲集「Piae Cantiones」からは、多くの有名曲が後世に伝わった。

宗教改革では、マルティン・ルターが、会衆が母語で歌える讃美歌を推し進めた。これが、キャロルが民衆の手に渡る契機となった。しかし17世紀のイングランドでは、ピューリタンによるクリスマス禁止令で公的には抑えられた。それでも、私的には歌い継がれた。

19世紀に復興が進んだ。1818年には、ヨーゼフ・モールの詞とフランツ・クサーヴァー・グルーバーの曲による「きよしこの夜（Silent Night）」が初演された。これは今日もっとも多く録音されたクリスマス曲のひとつとされる。ヴィクトリア朝の直前の1833年に、ウィリアム・サンディスが「Christmas Carols, Ancient and Modern」を編んだ。ヘンリー・ラムズデン・ブラムリーとジョン・ステイナーは、1871年に「Christmas Carols, New and Old」を編んだ。1928年には、マーティン・ショー、レイフ・ヴォーン・ウィリアムズ、パーシー・ディアマー編の「The Oxford Book of Carols」が、オックスフォード大学出版局から出た。

20世紀初頭の録音技術とラジオの普及で、クリスマス音楽は家庭と商業の音へと変わっていく。1930年代の大恐慌期のアメリカでは、降誕の教義を直接語らない世俗的なクリスマス曲が大量に生まれた。ティン・パン・アレーの作詞作曲家たちが、「Santa Claus Is Comin' to Town」などを書いた。1942年には、アーヴィング・バーリンが映画「Holiday Inn」のために書いた「White Christmas」を、ビング・クロスビーがデッカ・レコードに録音した。これは物理メディアでは世界最多販売のシングルとされる。

1950年代以降は、ロックンロール、ドゥーワップ、ソウルが参入した。1963年には、フィレス・レコードから発売された、フィル・スペクター制作のクリスマス・コンピレーション「A Christmas Gift for You from Phil Spector」（原題は「A Christmas Gift for You from Philles Records」）で、ウォール・オブ・サウンドをクリスマス曲に適用した。しかし発売当日にケネディ大統領暗殺事件が起きて、当初は振るわなかった。

1970〜80年代には、スレイドやウィザードの英国のホリデー・ヒット、バンド・エイドの「Do They Know It's Christmas?」、ワム!の「Last Christmas」が生まれた。1994年には、マライア・キャリーの「All I Want for Christmas Is You」が発表された。2019年には25年越しにビルボード・ホット100で1位となり、ギネス世界記録の「ソロ歌手によるホリデー曲のホット100最高位」として、2019年時点でThe Chipmunks and David Sevilleと記録を共有した。その後、2023年にBrenda Leeの曲も1位になり、ホリデー曲の1位は3曲目となった。

日本では、1980年の松任谷由実「恋人がサンタクロース」や1983年の山下達郎「クリスマス・イブ」が土台となった。1980年代後半のJR東海のCMなどで、定番になった。一方で、感謝祭より前に開始される「クリスマス・クリープ」と呼ばれる前倒し販売への批判も続いている。</p>
