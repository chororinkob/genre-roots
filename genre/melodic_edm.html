<h1>Melodic EDMとは</h1>
<p>EDMの中でも、ドロップの破壊力より、メロディーと和音の起伏で感情を動かすことを大事にした音楽だ。旋律重視のEDMを指して、近年使われる通称である（定義は流動的）。 四つ打ちのキックと、サイドチェインによる呼吸感という土台は共通し</p>
<p>EDMの中でも、ドロップの破壊力より、メロディーと和音の起伏で感情を動かすことを大事にした音楽だ。旋律重視のEDMを指して、近年使われる通称である（定義は流動的）。

四つ打ちのキックと、サイドチェインによる呼吸感という土台は共通している。大きく違うのは、ドロップの主役が歪んだ低音ではなく、歌えるほどはっきりした主なメロディーである点だ。

音色は、鋸波を重ねた分厚いリードに加え、プラック（減衰の速い弾いたような音）、パッド（背後に敷く持続音）、ピアノ、弦楽のサンプルがよく使われる。全体に、開けた明るさと湿り気をあわせ持つ。

和音は、短調基調の4コード循環（i–III–VII–VI など）が目立つ。長調のvi–IV–I–V(短調に聞こえる4コード循環)のように、切なさと解放感が同居する進行も好まれる。

BPMは、Aviciiやプログレッシヴ・ハウス寄りの系統では120〜128前後だ。Illenium系のベース寄りの系統では、130〜175BPM台が中心になる。

歌は、フックだけの断片ではなく、ヴァースとサビを備えた完全な歌ものであることが多い。歌詞は、喪失、再生、旅立ちといったテーマを扱う。

曲の組み立ては、ブレイクダウンで一度音を薄くし、ピアノと歌だけにしてから、感情の頂点でドロップへ入る流れが定型だ。

トランスの上昇する多幸感、プログレッシヴ・ハウスの長い展開、そしてポップスの歌の力を一つに束ねた作りで、フェスで泣かせる場面を担う音楽になっている。</p>
<h2>成り立ち</h2><p>2012年前後、米国はEDMブームの中にあった。そこで、Aviciiらの歌もの路線が注目を集めた。

前史はトランスにある。とりわけ、オランダのArmin van Buuren や、英国(ロンドン)のAbove &amp; Beyond が2000年代に築いた、長い上昇と感情的な旋律を核とするスタイルだ。

大きな橋渡し役になったのは、スウェーデンのAvicii（Tim Bergling）である。2011年のLevels、そして2013年のアルバムTrue に収められたWake Me Up が、その代名詞だった。

Wake Me Up は、ソウル系の歌手Aloe Blacc の歌とアコースティック・ギターに、四つ打ちを組み合わせた。当時としては異例の組み合わせだった。2013年、マイアミのUltra Music Festival で初披露されたときは、観客の一部から否定的な反応を受けた。それでも結果的に、世界22カ国のチャートで首位を獲得したとされ、EDMとカントリー／フォークの混合を広く普及させるきっかけの一つになった。

同じころ、ノルウェーのKygo は、2013年のリミックスと2014年12月の「Firestone」を通じて、トロピカル・ハウスを国際的に普及させた一人となった。トロピカル・ハウスは、Melodic EDMの周辺で並行して広まった別系統（ディープ・ハウス系）である。さらに、スウェーデンのAlesso、米国のThe Chainsmokers、Illenium らが、それぞれの角度から旋律重視の路線を広げた。レーベルでは、スウェーデンのAxtone、オランダのArmada Music、そしてSpinnin' Records が受け皿になった。

一方で、影の部分もある。Avicii は過酷なツアー日程と健康問題を抱え、2016年にライブ活動からの引退を表明した。そして2018年、オマーンのマスカットで28歳で自ら命を絶った。この出来事は、ダンス音楽産業の労働環境と心の健康の問題を、公の議論に押し上げた。

現在、この音楽は多くのフェスで、感情的な山場を担う音楽として広く演奏されている。近縁の別系統としては、「メロディック・ベース」や、2018年にBeatportがカテゴリを作ったメロディック・ハウス／テクノがある。</p>
