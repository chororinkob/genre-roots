<h1>Melodic EDMとは</h1>
<p>EDMの中でも、ドロップの破壊力より旋律と和声の起伏で感情を動かすことに重心を置いた様式。BPMは120〜128前後、四つ打ちのキックとサイドチェインによる呼吸感という土台は共通するが、ドロップの主役が歪んだ低音ではなく、歌えるほ</p>
<p>EDMの中でも、ドロップの破壊力より旋律と和声の起伏で感情を動かすことに重心を置いた様式。BPMは120〜128前後、四つ打ちのキックとサイドチェインによる呼吸感という土台は共通するが、ドロップの主役が歪んだ低音ではなく、歌えるほど明確な主旋律である点が決定的に違う。音色は鋸波を重ねた分厚いリードに加え、プラック（減衰の速い弾いたような音）、パッド（背後に敷く持続音）、ピアノ、弦楽のサンプルが多用され、全体に開けた明るさと湿り気を併せ持つ。和声は長調と短調を行き来する四和音の循環が中心で、とりわけ短調のvi–IV–I–V型のように切なさと解放感が同居する進行が好まれる。構成はブレイクダウンで一度音を薄くし、ピアノと歌だけにしてから、感情の頂点でドロップへ入るという流れが定型。歌はフックだけの断片ではなく、ヴァースとサビを備えた完全な歌ものであることが多く、歌詞は喪失、再生、旅立ちといった主題を扱う。トランスの上昇する多幸感、プログレッシヴ・ハウスの長い展開、そしてポップスの歌の力を一つに束ねた設計で、フェスで泣かせる区間を担う音楽として機能している。</p>
<h2>成り立ち</h2><p>2012年から2016年頃、EDMが攻撃性一辺倒の飽和状態に達したことへの反動として、産業内部から自然に生まれた。前史はオランダのトランス、とりわけArmin van Buuren やAbove &amp; Beyond が2000年代に築いた、長い上昇と感情的な旋律を核とする様式にある。決定的な橋渡し役となったのはスウェーデンのAvicii（Tim Bergling）で、2011年のLevels、そして2013年のアルバムTrue に収録されたWake Me Up が象徴的だった。Wake Me Up はソウル系の歌手Aloe Blacc の歌とアコースティック・ギターに四つ打ちを組み合わせるという当時としては異例の折衷で、2013年のマイアミのUltra Music Festival で初披露された際は観客とメディアから強い反発を受けたが、結果的に世界10カ国以上で首位を獲得し、EDMに歌と生楽器を持ち込む流れを決定づけた。並行して、ノルウェーのKygo が2014年前後にトロピカル・ハウスと呼ばれる柔らかい派生を確立し、スウェーデンのAlesso、米国のThe Chainsmokers、Illenium らがそれぞれの角度から旋律重視の路線を広げた。レーベル面ではスウェーデンのAxtone、オランダのArmada Music、そしてSpinnin' Records が受け皿となり、配信ではSpotify のプレイリスト文化が旋律的な曲を優遇したことも普及を後押しした。影の部分としては、Avicii が過酷なツアー日程と健康問題を抱えた末に2016年にライブ活動からの引退を表明し、2018年にオマーンのマスカットで28歳で自ら命を絶ったことが挙げられる。この出来事はダンス音楽産業における労働環境と精神的健康の問題を公の議論に押し上げた。現在、この様式は「メロディック・ベース」「メロディック・ハウス／テクノ」といった細分化した名称でも呼ばれ、フェスの構成において高揚と情緒を担う不可欠な要素として定着している。</p>
<h2>代表曲</h2><ul><li>Levels (Avicii)</li><li>Wake Me Up (Avicii)</li><li>Scars to Your Beautiful (Alessia Cara)</li><li>Good Things Fall Apart (Illenium &amp; Jon Bellion)</li><li>First Time (Seven Lions &amp; SLANDER ft. Dabin)</li></ul>
