<h1>Electronic music（エレクトロニック・ミュージック）とは</h1>
<p>電子音楽は、電子楽器やコンピュータ、テープ録音、ソフトウェアによって音を生成・加工する音楽の総体だ。現代音楽とポピュラー音楽の両方を含む、広大な領域である。 音のもとになるのは、発振器やノイズ、録音素材だ。発振器（音のもとになる波</p>
<p>電子音楽は、電子楽器やコンピュータ、テープ録音、ソフトウェアによって音を生成・加工する音楽の総体だ。現代音楽とポピュラー音楽の両方を含む、広大な領域である。

音のもとになるのは、発振器やノイズ、録音素材だ。発振器（音のもとになる波を出す回路）で、正弦波・のこぎり波・矩形波（それぞれ滑らか、ギザギザ、角ばった波形）を作る。そのうえでフィルターを使い、高音域や低音域を削り落として音色を彫っていく。

アナログ・シンセサイザーでは、音の立ち上がりと減衰（消えていく様子）をエンベロープ（音量の時間変化の設計）で制御する。レゾナンスを強めたフィルターを、つまみ操作で動かすと、うねるような音が生まれる。この音がアシッド系サウンドの核となる。

ベースには、正弦波やのこぎり波を使った太い低音が敷かれる。クラブの大音量の音響システムでは、超低域が体に響く。

リズムは、ドラムマシンやサンプラーで組み立てられる。毎分120拍から140拍前後の4つ打ち、シンコペーションを多用したブレイクビーツがある。毎分150拍を超える高速なスタイルまで、幅は広い。

空間の加工も欠かせない。リバーブ（広い部屋のような響きを付ける効果）で広い残響を付け、ディレイ（音を遅らせて繰り返す効果）で反復する尾を引かせる。テープ由来の揺れやノイズが、温かみを加える。

曲の組み立てでは、重ねたパートを剥がして静める展開が使われる。フィルターを開けていくクライマックスや、爆発的なドロップ（最も派手に盛り上がる部分）も、場面ごとに用いられる。

声は多様だ。クリーンなポップ歌唱もあれば、ボコーダーや音程補正で機械化した声もある。歌声を排したインストゥルメンタルもある。主題は、愛や孤独から、宇宙・機械・都市のイメージ、ダンスフロアの共同体感覚にまで及ぶ。

同じ電子的な音源でも、作り方は多彩だ。テープ編集による具体音の音楽、鍵盤で旋律を弾くシンセポップ、即興的なジャム、徹底的に計算された構成主義的な作曲などがある。制作法の幅が広く、その違いが音の違いに表れやすい。</p>
<h2>成り立ち</h2><p>源流は、19世紀末にまで遡る。1897年、米国の発明家サディウス・ケイヒルが特許を取得し、1906年に一般公開した。これがテルハーモニウムで、トーンホイールで音を作る、最初の電気機械式の楽器とされる（真空管などを使った電子楽器の先駆にはオーディオン・ピアノ（1915年）などがあり、テルミン（1920年）は最初期かつ広く知られた電子楽器の一つ）。

1920年には、ロシアのレフ・テルミンがテルミンを完成させた。1928年には、フランスのモーリス・マルトノがオンド・マルトノを発明した。1930年には、ドイツのフリードリヒ・トラウトヴァインがトラウトニウムを設計した。トラウトニウムは、テレフンケン社が1933〜35年に市販した（約200台）。オンド・マルトノは受注生産だった。ポール・ヒンデミットは、トラウトニウムのための協奏的作品を発表した。

現代的な電子音楽の出発点の一つは、1948年のパリにある。ピエール・シェフェールが、列車の音など現実から録音した具体音を、おもにレコード（のちにテープが主流に）で編集して作った。これがミュージック・コンクレートである。その4年前の1944年には、ハリム・エル・ダブがワイヤーレコーダーで街頭の音を録音した。作品『The Expression of Zaar』（完成版は磁気テープとする記述もある）が先例とされる。

舞台は、ドイツのケルンに移る。西ドイツ放送の電子音楽スタジオは、1951年10月に創設され、1953年5月に公式に開設された。当時はNWDR（のちのWDR）のスタジオだった。スタジオの主な創設メンバーは、Herbert Eimert（初代所長）、Robert Beyer、Werner Meyer-Eppler、Fritz Enkelである。Meyer-Epplerの1949年の著書が、理論的な土台だった。

カールハインツ・シュトックハウゼンは、1953年3月に加わり、Studie I・II（1953・54）を制作した。ゴットフリート・ミヒャエル・ケーニッヒは、1954年からスタジオで働き、技術助手を務めた。ここでは、電子発振音だけを用いる狭義の電子音楽（エレクトロニッシュ・ムジーク）が追求された。

やがて、流れは変わっていく。シュトックハウゼンの『少年の歌』（録音された少年の声と電子音を統合した作品）や『コンタクテ』（電子音のみの版と、電子音にピアノと打楽器の生演奏を加えた版がある）は、その変化を示す作品である。狭義の電子音楽から、具体音や生演奏を取り込む方向へ、展開したのだ。

同じころ、米国でも動きがあった。1952年に、ウラジーミル・ウサチェフスキーとオットー・ルーニングがテープ音楽の演奏会を開いた。1957年にはコロンビア大学にRCAマークII・シンセサイザーが設置された。これを擁するコロンビア・プリンストン電子音楽センターは、1958〜59年に整備された（設立年は資料で割れている）。

ロンドンでは、1958年にBBCラジオフォニック・ワークショップが設立された。デリア・ダービーシャーは、1963年にロナルド・グレイナー作曲の『ドクター・フー』のテーマを制作した。

日本でも、1954年（資料により1955年）にNHK電子音楽スタジオが設立された。黛敏郎が初期の主要作品を制作し、諸井誠、武満徹、湯浅譲二、松平頼暁らがここで活動した。1966年には、シュトックハウゼンが来日し、NHKのスタジオで『テレムジーク』を制作した。

電子音が前衛の外へ広く出て行ったのは、1968年のことだ。ウォルター・カーロスが、モーグ・シンセサイザーでバッハを演奏した『Switched-On Bach』を発表した。1974年には、冨田勲がモーグでドビュッシーを演奏した『Snowflakes Are Dancing』を米国で発表した。

一方、西ドイツでは、クラウトロックと呼ばれる流れが生まれていた。カン、ノイ!、タンジェリン・ドリーム、ファウストらが、電子音と反復するリズムを実験した。クラフトヴェルクは、『Trans-Europe Express』『The Man-Machine』『Computer World』といった作品で、機械的なサウンドを定着させた。

1978年に結成されたイエロー・マジック・オーケストラは、テクノポップを日本国内に普及させた。1979年にはゲイリー・ニューマンやOMDが、1981年にはデペッシュ・モードが、シンセポップの先駆的作品を発表した。

機材も、この時期に大きく進んだ。1980年にローランドのリズムマシンTR-808が発売されると、ヒップホップやエレクトロで定着した。その影響は、デトロイト・テクノなどにも及んだ。1981年発売のベース用シンセサイザーTB-303は、1987年にPhutureが『Acid Tracks』を発表したことで、アシッドハウスの音色源となった。1983年にはMIDI規格1.0が確定した。これにより、機材同士を接続して一つの環境で制作できるようになった。

1980年代以降、シカゴ・ハウス、デトロイト・テクノ、トランス、ドラムンベース、ダブステップ、IDMといった派生が、枝を広げた。1990年代にはレイブ文化を経た。デジタル・オーディオ・ワークステーション（DAW）は、Pro Toolsが1991年に登場するなど、1990年代にパソコン上で広まった。そして2010年代には、ポピュラー音楽、映像音楽、ゲーム音楽で、電子音楽の手法が広く使われるようになった。</p>
