<h1>Electronic music（エレクトロニック・ミュージック）とは</h1>
<p>電子音楽は、電子楽器やコンピュータ、テープ録音、ソフトウェアによって音を生成・加工する音楽の総体で、現代音楽とポピュラー音楽の双方を含む広大な領域である。音源は発振器やノイズ、録音素材から出発し、発振器（音のもとになる波を出す回路</p>
<p>電子音楽は、電子楽器やコンピュータ、テープ録音、ソフトウェアによって音を生成・加工する音楽の総体で、現代音楽とポピュラー音楽の双方を含む広大な領域である。音源は発振器やノイズ、録音素材から出発し、発振器（音のもとになる波を出す回路）で正弦波・のこぎり波・矩形波（それぞれ滑らか、ギザギザ、角ばった波形）を作り、フィルターで高音域や低音域を削り落として音色を彫る。アナログ・シンセサイザーでは、音の立ち上がりと減衰（消えていく様子）をエンベロープ（音量の時間変化の設計）で制御し、レゾナンス（特定の高さの音が強調される現象）を強めたフィルターをつまみで動かして生まれる、うねるような音がアシッド系サウンドの核となる。ベースには正弦波やのこぎり波を使った太い低音が敷かれ、クラブの大音量の音響システムでは超低域が体に響く。リズムはドラムマシンやサンプラーで構築され、毎分120拍から140拍前後の4つ打ち、シンコペーションを多用したブレイクビーツ、毎分150拍を超える高速な系譜まで幅広い。空間加工ではリバーブ（広い部屋のような響きを付ける効果）で広い残響を付け、ディレイ（音を遅らせて繰り返す効果）で反復する尾を引き、テープ由来の揺れやノイズが温かみを加える。構成では重ねたパートを剥がして静める展開、フィルターを開けていくクライマックス、爆発的なドロップ（最も派手に盛り上がる部分）が場面ごとに使われる。声はクリーンなポップ歌唱から、ボコーダーや音程補正で機械化した声、歌声を排したインストゥルメンタルまで多様で、主題も愛や孤独から宇宙・機械・都市のイメージ、ダンスフロアの共同体感覚にまで及ぶ。同じ電子的な音源でも、テープ編集による具体音の音楽、鍵盤で旋律を弾くシンセポップ、即興的なジャム、徹底的に計算された構成主義的な作曲など、制作法の幅が広く、その違いが音の違いに表れやすい点が大きな特徴である。</p>
<h2>成り立ち</h2><p>電子音楽の源流は19世紀末にまで遡る。1897年に米国の発明家サディウス・ケイヒルが特許を取得し、1906年に一般公開したテルハーモニウムは、トーンホイールで音を作る、最初の電気機械式の楽器とされる（真空管を使った電子楽器の先駆にはオーディオン・ピアノ（1915年）などがあり、1920年のテルミンは最初期の広く知られた電子楽器の一つである）。1920年にはロシアのレフ・テルミンがテルミンを完成させ、1928年にはフランスのモーリス・マルトノがオンド・マルトノを発明し、1930年にはドイツのフリードリヒ・トラウトヴァインがトラウトニウムを設計した。トラウトニウムはテレフンケン社が1933〜35年に市販され（約200台）、オンド・マルトノは受注生産だった。ポール・ヒンデミットがトラウトニウムのための協奏的作品を発表した。現代的な電子音楽の出発点の一つは、1948年にパリでピエール・シェフェールが、列車の音など現実から録音した具体音をレコードやテープで編集して作ったミュージック・コンクレートである。その4年前の1944年、ハリム・エル・ダブがワイヤーレコーダーで街頭の音を録音した作品『The Expression of Zaar』（完成版は磁気テープとする記述もある）が先例とされる。ドイツのケルンでは、1951年10月に創設され、1953年5月に公式に開設された西ドイツ放送（WDR）の電子音楽スタジオで、スタジオの創設者は、Herbert Eimert（初代所長）、Robert Beyer、Werner Meyer-Epplerで、Meyer-Epplerの1949年の著書が理論的基盤だった。カールハインツ・シュトックハウゼンは1953年3月に加わってStudie I・II（1953・54）を制作し、ゴットフリート・ミヒャエル・ケーニッヒは1954年からスタジオで働いて技術助手を務めた。そこでは電子発振音だけを用いる狭義の電子音楽（エレクトロニッシュ・ムジーク）が追求された。シュトックハウゼンの『少年の歌』（録音された少年の声と電子音を統合した作品）や『コンタクテ』（電子音のみの版と、電子音にピアノと打楽器の生演奏を加えた版がある）は、狭義の電子音楽から、具体音や生演奏を取り込む方向への展開を示す作品である。米国では1952年にウラジーミル・ウサチェフスキーとオットー・ルーニングがテープ音楽の演奏会を開き、1957年にコロンビア大学に設置されたRCAマークII・シンセサイザーを擁するコロンビア・プリンストン電子音楽センターが、1958〜59年に整備された（設立年は資料で割れている）。ロンドンでは1958年にBBCラジオフォニック・ワークショップが設立され、デリア・ダービーシャーが1963年にロナルド・グレイナー作曲の『ドクター・フー』のテーマを制作した。日本でも1954年（資料により1955年）にNHK電子音楽スタジオが設立され、黛敏郎が初期の主要作品を制作し、諸井誠、武満徹、湯浅譲二、松平頼暁らがここで活動した。1966年にはシュトックハウゼンが来日し、NHKのスタジオで『テレムジーク』を制作した。1968年にウォルター・カーロスがモーグ・シンセサイザーでバッハを演奏した『Switched-On Bach』が発表されると、電子音は前衛の外へ広く出て行った。1974年には冨田勲がモーグでドビュッシーを演奏した『Snowflakes Are Dancing』を米国で発表した。西ドイツではクラウトロックと呼ばれる潮流の中で、カン、ノイ!、タンジェリン・ドリーム、ファウストらが電子音と反復するリズムを実験し、クラフトヴェルクが『Trans-Europe Express』『The Man-Machine』『Computer World』といった作品で機械的なサウンドを確立した。1978年に結成されたイエロー・マジック・オーケストラはテクノポップを日本国内に普及させ、1979年にはゲイリー・ニューマンやOMD、1981年にはデペッシュ・モードがシンセポップの先駆的作品を発表した。1980年にローランドのリズムマシンTR-808が発売されるとヒップホップやエレクトロで定着し、その影響がデトロイト・テクノなどにも及び、1981年発売のベース用シンセサイザーTB-303は、1987年にPhutureが『Acid Tracks』を発表したことでアシッドハウスの音色源となった。1983年にはMIDI規格1.0が確定し、機材同士を接続して一つの環境で制作できるようになった。1980年代以降、シカゴ・ハウス、デトロイト・テクノ、トランス、ドラムンベース、ダブステップ、IDMといった派生が枝を広げ、1990年代のレイブ文化を経て、デジタル・オーディオ・ワークステーション（DAW）は、Pro Toolsが1991年に登場するなど1990年代にパソコン上で広まり、2010年代にはポピュラー音楽、映像音楽、ゲーム音楽に広く電子音楽の手法が使われるようになっている。</p>
