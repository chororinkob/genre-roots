<h1>Shinkyoku（シンニホンオンガク）とは</h1>
<p>新日本音楽は、洋楽の作曲の書き方を取り入れて作られた、新しい日本音楽だ。代表曲22曲を動画で聴け、ルーツと影響のつながりを地図でたどれる。</p>
<p>新日本音楽は、洋楽の作曲の書き方を取り入れて作られた、新しい日本音楽だ。箏・三絃・尺八といった和楽器を使い、どの流派にも属さない。五線譜を使った例もある。

中心になる楽器は箏で、そこに三絃と尺八が加わる。合奏では、宮城道雄が考案した十七絃が低音を支える。80本の弦を持つ大型の箏・八十絃のような新楽器も試みられた。ピアノやヴァイオリンなど洋楽器が加わる編成もあり、管弦合奏曲や協奏曲と呼ばれる形式も作られた。

和声や旋律の面では、箏の新しい奏法（トレモロやハーモニックスなど）と西洋の形式を取り入れた。代表曲《春の海》では、波の音や舟唄風の旋律を織り込んでいる。

リズムは明瞭で、曲の形式がはっきりしている作品が多い。

歌をともなう曲では、箏と三絃の伴奏に合わせて歌う。歌詞は季節や自然の情景を詠んだものが多く、童曲など子ども向けの作品も多い。

曲の組み立ては、導入で楽器の音色を見せ、中盤で旋律が絡み合い、終盤は静かに収まる流れが多い。箏の教室や邦楽の演奏会で演奏され、正月の放送でもよく流れる。</p>
<h2>成り立ち</h2><p>中心に立ったのは宮城道雄だ。1894年に神戸で生まれ、7歳ごろ（8歳とする資料もある）に失明した。8歳で生田流箏曲の師匠に弟子入りし、11歳で免許皆伝を得て、14歳で処女作《水の変態》を作曲した。1917年に東京へ出て、1919年には童謡詩人・葛原しげるらの支援を受け、本郷の中央会堂で第1回作品発表会を開いて作曲家としてデビューした。

しかし、当時の邦楽界は流派の型を守ることが重んじられ、洋楽を取り込む動きは保守的な邦楽界からあまり歓迎されなかった。大阪を中心とした明治新曲の創作が先行していたが、宮城らの動きは、それとは一線を画するとされる。1920年11月27日、宮城は洋楽系の本居長世と東京の有楽座で合同作品発表会を開いた。尺八を担当した吉田晴風がこの演奏会を〈新日本音楽大演奏会〉と名づけ、ここで《秋の調》《十五夜お月さん》などが発表された。この名前が、宮城・本居・吉田らの新作活動の通称になった。

その後、音楽学者の田辺尚雄・町田嘉章、尺八家の初世中尾都山、箏曲家の中島雅楽之都らが加わった。1923年以来、宮城は中尾都山と各地を巡演し、都山流の組織を通じて宮城の曲は全国に広まった。1927年には成和音楽会が組織され、1928年以降はこの名で作品発表演奏会を開き、全国演奏旅行も行った。町田の伶明音楽会も、これに吸収された。

一方、宮城は楽器の改良にも力を注いだ。低音を得るために十七絃を作り、1929年には80本の弦を持つ八十絃を開発して、発表会でバッハのプレリュードを弾いた。同じ年の末に《春の海》を作曲し、1932年には来日したフランスのヴァイオリニスト、ルネ・シュメーが尺八のパートをヴァイオリン用に編曲して共演した。この録音は日本・アメリカ・フランスでレコード化され、《春の海》は国外でも知られる曲になった。

始まったばかりのラジオ放送とレコード録音も、この動きを全国に広めた。東京盲学校の久本玄智ら山田流の箏曲家や、長唄界の四世杵屋佐吉も影響を受けた。中能島欣一のような独自の作風の箏曲家、清水脩のような洋楽系の作曲家も参入し、ここから「新邦楽」という言葉が生まれた。

1956年、宮城は大阪公演に向かう夜行列車から転落して亡くなった。戦後は新作邦楽の総称として「新邦楽」の名が広く使われ、新日本音楽はその中に含まれるようになった。昭和30年代の後半には「現代邦楽」という呼び方も生まれ、新日本音楽は歴史上の一時期の所産として扱われるようになった。それでも《春の海》などの作品は、準古典として今も演奏され続けている。</p>
