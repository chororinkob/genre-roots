<h1>Shinkyoku（シンニホンオンガク）とは</h1>
<p>洋楽の作曲の書き方を取り入れ、箏・三絃・尺八などの和楽器で新しく作られた日本音楽である。代表曲22曲を動画で聴け、ルーツと影響のつながりを地図でたどれる。</p>
<p>洋楽の作曲の書き方を取り入れ、箏・三絃・尺八などの和楽器で新しく作られた日本音楽である。従来の流派の型を土台にしつつ、五線譜で書かれた新作邦楽の流れを指す。

音の中心は箏である。そこへ三絃と尺八が加わる。合奏には宮城道雄が考案した十七絃が低音を支え、80本の弦を持つ大型の箏・八十絃といった新楽器も試された。ピアノやヴァイオリンなど洋楽器が加わる編成もあり、管弦合奏曲や協奏曲と呼ばれる形式も作られた。

和声は西洋の長調・短調の考えと、伝統的な音階の使い方が混ざり合う。三度の和音がにじむ部分と、邦楽らしい調子の重なりが同居する。《春の海》では箏の分散和音が波の動きを描き、尺八の長い旋律がその上を泳ぐ。

リズムは穏やかで、拍のよりどころを強調しない。舞曲風の軽快な部分もあるが、多くは句の切り目で奏者が息を合わせる自由な拍節を取る。

歌いものでは、箏と三絃の伴奏に合わせて、唄ごねと呼ばれる装飾の多い発声で歌う。歌詞は季節や自然の情景、子どもの心を詠んだ童謡的なものが多い。

曲の組み立ては、導入で楽器の音色を見せ、中盤で旋律が絡み合い、終段で静かに収まる流れが多い。箏の教室や邦楽の演奏会で鳴り、正月の放送でもよく流れる。</p>
<h2>成り立ち</h2><p>この流れの中心に立ったのが宮城道雄である。1894年に神戸に生まれ、7歳ごろに失明し、8歳で生田流箏曲の師匠に弟子入りした。11歳で免許皆伝を得て、14歳で処女作《水の変態》を作曲した。1917年に東京へ出て、1919年には童謡詩人・葛原しげるらの支援を受けて本郷の中央会堂で第1回作品発表会を開き、作曲家としてデビューした。

しかし、当時の邦楽界は流派の型を守ることが重んじられ、洋楽を取り込む動きには保守的な層から強い反発があった。大阪を中心とした明治新曲の創作も先行していたが、宮城らの動きはさらに踏み込んだものだった。1920年11月27日、宮城は洋楽系の本居長世と東京の有楽座で合同作品発表会を開いた。尺八を担当した吉田晴風がこの演奏会を〈新日本音楽大演奏会〉と命名し、ここで《秋の調》《十五夜お月さん》などが発表された。この名が、宮城・本居・吉田らの新作活動の通称になった。

その後、音楽学者の田辺尚雄・町田嘉章、尺八家の初世中尾都山、箏曲家の中島雅楽之都らが加わる。1923年以来、宮城は中尾都山と各地を巡演し、都山流の組織を通じて宮城の曲は全国に広まった。1927年には成和音楽会が組織され、1928年以降はその名で作品発表演奏会を開き、全国演奏旅行も行った。町田の伶明音楽会もこれに吸収された。

一方、宮城は楽器の改良にも力を注いだ。低音を得るための十七絃を作り、1929年には80本の弦を持つ八十絃を開発して、発表会でバッハのプレリュードを弾いた。同年末には《春の海》を作曲し、1932年には来日したフランスのヴァイオリニスト、ルネ・シュメーが尺八のパートをヴァイオリンに編曲して共演した。この録音は日本・アメリカ・フランスでレコード化され、《春の海》は国外でも知られる曲になった。

開始されてまもないラジオ放送とレコード録音も、この動きを全国へ運んだ。東京盲学校の久本玄智ら山田流の箏曲家や、長唄界の四世杵屋佐吉も影響を受け、中能島欣一のような独自の作風の箏曲家、清水脩のような洋楽系の作曲家も参入した。ここから「新邦楽」という言葉が生まれた。

1956年、宮城は大阪公演に向かう夜行列車から転落して亡くなった。戦後は新作邦楽の総称として「新邦楽」の名が広く使われ、新日本音楽はその中に含められた。昭和30年代の後半には「現代邦楽」という呼び方が生まれ、新日本音楽は歴史上の一時期の所産として扱われるようになった。それでも《春の海》などの作品は準古典として今も演奏され続けている。</p>
