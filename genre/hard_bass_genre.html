<h1>Hard Bass（ハードベース）とは</h1>
<p>ハードバスは、ロシアおよび東欧圏で独自に発展した、極端に硬く歪んだ低音を主役とする電子舞曲だ。音楽の源流はポンピング・ハウスで、もともとは大音量のクラブやレイブ向けだった。 いちばんの特徴は低音の作り方だ。「ドンク」と呼ばれる、金</p>
<p>ハードバスは、ロシアおよび東欧圏で独自に発展した、極端に硬く歪んだ低音を主役とする電子舞曲だ。音楽の源流はポンピング・ハウスで、もともとは大音量のクラブやレイブ向けだった。

いちばんの特徴は低音の作り方だ。「ドンク」と呼ばれる、金属的に跳ねる低音を主役にしている。この裏拍のドンク・ベースと四つ打ちキックに、90年代風のシンセ(パイプ状のリード音など)や掛け声が重なる。

リズムは、四つ打ちのバスドラムが基本になる。テンポはおおむね150から175 BPM(標準は160)だ。

歌の面では、ロシア語のMC・掛け声が時折入る。内容は「ハードベースだ」という単純な掛け声のほか、健康的な生活のパロディ的主張などがある。

音楽そのものと同じくらい、それが鳴らされる場所と集団の振る舞いが、スタイルの一部をなしている。この点に、この音楽の独特なところがある。</p>
<h2>成り立ち</h2><p>ハードバスの起源は、1990年代後半〜2000年代前半のロシアのサンクトペテルブルクとされる。源流はポンピング・ハウスで、バウンシー・テクノやハードスタイル、UKハードハウスなどに影響を受けた。

ただし、年代には説の違いがある。日本語版では、サウンドの基礎は2000年頃にオランダのKlubbheadsらが固めたとされる。英語版は、ポンピング・ハウスの金属的ベース音をKlubbheadsが1997年に発明したとする。2003年のDJ Snatの『Choose Your Power』は代表曲の一つだ。日本語版は同曲をロシア製ハードベースの最初としているが、定説ではない。

2000年代後半〜2010年ごろ、旧ソ連圏の若者の間で、フラッシュモブ(hardbass attack)が広まった。教室、ショッピングモール、公共交通機関、サッカー場などの公共の場に、数人から数十人規模の集団で集まって、一斉に踊るものだ。中心となった制作者にはDJ Snatやハードバス・スクールがおり、インディー・レーベル(Jutonishなど)やネット経由で大量の楽曲が流通した。

この文化は、音楽以上に、見た目の要素で世界的に知られることになる。トラックスーツ(アディダスがトレードマーク的)姿の参加者が目立ったためである。かかとを地面につけたまましゃがむ姿勢は、ハードバスの踊り(ポンプ・ダンス)ではなく、ゴプニク(不良)のステレオタイプだ。これはスラヴ・スクワットと呼ばれ、2012年頃から2017年にかけて、インターネット上で膨大な模倣画像が作られた。

ジャージ・スクワット・ハードバスは一組のしるしとして扱われ、東欧の若者を戯画化した題材として消費される面が強くなる。一方で、この過程を通じて、本来は地域限定だった音楽が世界中に知られたことも事実である。2022年以降のロシアとウクライナの情勢によって、この文化圏を横断していた交流は大きく分断されたとされる。</p>
