<h1>Hard Bass（ハードベース）とは</h1>
<p>ロシアおよび東欧圏で独自に発展した、極端に硬く歪んだ低音を主役とする電子舞曲である。テンポは一分間に140から160拍前後で、四つ打ちのバスドラムが基本になる。決定的な特徴は低音の作り方で、ハードスタイル系の手法を用いてバスドラム</p>
<p>ロシアおよび東欧圏で独自に発展した、極端に硬く歪んだ低音を主役とする電子舞曲である。テンポは一分間に140から160拍前後で、四つ打ちのバスドラムが基本になる。決定的な特徴は低音の作り方で、ハードスタイル系の手法を用いてバスドラムの余韻部分に音程を持たせ、それを歪ませたうえで極端に持ち上げる。結果として、低音が単なる打撃ではなく、唸りながら音程を移動する主旋律のような役割を担う。上物の要素は最小限に絞られ、短く反復する電子音や、加工された声の断片が置かれる程度である。旋律の展開や和音の変化はほとんど設けられず、音圧と反復だけで押し切る構成が主流である。この単純さは意図的なもので、屋外や地下鉄の構内といった、まともな音響設備のない場所で携帯型の再生装置から鳴らしても成立するように作られている。歌が入る場合はロシア語やウクライナ語の掛け声が用いられ、内容は挑発や仲間内の合図といった単純なものが多い。音楽そのものと同じくらい、それが鳴らされる場所と集団の振る舞いが様式の一部をなしている点に、この音楽の特異性がある。</p>
<h2>成り立ち</h2><p>起源は2000年代後半のロシアである。この時期、旧ソ連圏の若者の間で、公共の場に大人数で集まって一斉に踊るという遊びが広まった。地下鉄の駅構内、広場、団地の中庭といった場所に集合し、携帯型の音響機器で大音量の音楽を流して跳ねるという行動で、ハードバス・ギャザリングと呼ばれた。多くは無許可で行われ、警察が到着する前に解散するという形式を取っていた。この現場で必要とされたのが、貧弱な再生装置でも迫力を保てる音、すなわち低音と歪みに全てを賭けた音楽だった。音の直接の手本になったのはオランダのハードスタイルとジャンプスタイルで、これらが東欧圏に輸入される過程で、旋律や高揚感といった要素が削ぎ落とされ、低音の圧力だけが残された。この単純化が独自性を生んでいる。中心となった制作者にはDJスナットやハードバス・スクールがおり、正規のレコード会社をほとんど介さない形で大量の楽曲が流通した。この文化は音楽以上に、視覚的な要素で世界的に知られることになる。参加者の多くがアディダスの三本線のジャージを着用し、かかとを地面につけたまましゃがむ独特の姿勢を取っていたためである。この姿勢はスラヴ・スクワットと呼ばれ、2010年代半ばにインターネット上で膨大な模倣画像が作られた。ジャージと姿勢と音楽が一組の記号として扱われ、東欧の若者を戯画化した題材として消費される面が強くなる。当事者からは、自分たちの文化が笑いものにされているという反発も出た。一方でこの過程を通じて、本来は地域限定だった音楽が世界中に知られたことも事実である。2010年代後半以降、この様式の音そのものは、欧米の実験的な電子音楽の作り手に素材として取り込まれ、意図的に粗野で安価な音を使う表現の一つとして参照されるようになった。2022年以降のロシアとウクライナの情勢によって、この文化圏を横断していた交流は大きく分断されている。</p>
