<h1>Hard Bass（ハードベース）とは</h1>
<p>ロシアおよび東欧圏で独自に発展した、極端に硬く歪んだ低音を主役とする電子舞曲である。テンポは一分間に150から170拍(標準は160)で、四つ打ちのバスドラムが基本になる。決定的な特徴は低音の作り方で、「ドンク」と呼ばれる金属的に</p>
<p>ロシアおよび東欧圏で独自に発展した、極端に硬く歪んだ低音を主役とする電子舞曲である。テンポは一分間に150から170拍(標準は160)で、四つ打ちのバスドラムが基本になる。決定的な特徴は低音の作り方で、「ドンク」と呼ばれる金属的に跳ねる低音を主役にしている。低音が単なる打撃ではなく、メロディラインを構成する主旋律のような役割を担う。上物の要素は最小限に絞られ、短く反復する電子音や、加工された声の断片が置かれる程度である。旋律の展開や和音の変化はほとんど設けられず、音圧と反復だけで押し切る構成が主流である。音楽の源流はポンピング・ハウスで、もともとは大音量のクラブやレイブ向けだった。歌が入る場合はロシア語の掛け声が用いられ、内容は挑発や仲間内の合図といった単純なものが多い。音楽そのものと同じくらい、それが鳴らされる場所と集団の振る舞いが様式の一部をなしている点に、この音楽の特異性がある。</p>
<h2>成り立ち</h2><p>起源は、1990年代後半〜2000年代前半のロシアのサンクトペテルブルクとされる(日本語版では2000年にオランダのKlubbheadsが確立し、2003年のDJ Snatがロシア人による最初の制作とする)。源流はポンピング・ハウスで、バウンシー・テクノやハードスタイル、UKハードハウスなどに影響を受けた。2000年代後半〜2010年ごろ、旧ソ連圏の若者の間で、教室、ショッピングモール、公共交通機関、サッカー場などの公共の場に大人数で集まって一斉に踊るフラッシュモブ(hardbass attack)が広まった。中心となった制作者にはDJ Snatやハードバス・スクールがおり、インディー・レーベル(Jutonishなど)やネット経由で大量の楽曲が流通した。この文化は音楽以上に、視覚的な要素で世界的に知られることになる。参加者の多くがアディダスの3本線のジャージを着用していたためである。かかとを地面につけたまましゃがむ姿勢は、ハードバスの踊り(ポンプ・ダンス)ではなくゴプニク(不良)のステレオタイプで、スラヴ・スクワットと呼ばれ、2012年頃から2017年にかけてインターネット上で膨大な模倣画像が作られた。ジャージ・スクワット・ハードバスが一組の記号として扱われ、東欧の若者を戯画化した題材として消費される面が強くなる。一方でこの過程を通じて、本来は地域限定だった音楽が世界中に知られたことも事実である。2010年代後半以降、この様式の音そのものは、欧米の実験的な電子音楽の作り手に素材として取り込まれ、意図的に粗野で安価な音を使う表現の一つとして参照されるようになった。2022年以降のロシアとウクライナの情勢によって、この文化圏を横断していた交流は大きく分断されている。</p>
