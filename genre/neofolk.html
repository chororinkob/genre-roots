<h1>Neofolk（ネオフォーク）とは</h1>
<p>ネオフォークは、フォーク・ミュージックにインスパイアされた、ポスト・インダストリアルの実験音楽である。 中心になる楽器はアコースティック・ギターだ。反復的な伴奏パターンが、雰囲気を重んじて用いられる。そこに、軍隊調の太鼓やストリン</p>
<p>ネオフォークは、フォーク・ミュージックにインスパイアされた、ポスト・インダストリアルの実験音楽である。

中心になる楽器はアコースティック・ギターだ。反復的な伴奏パターンが、雰囲気を重んじて用いられる。そこに、軍隊調の太鼓やストリングスなどを加える例がある。

打楽器の使い方も特徴的だ。行進を思わせる規則的な大太鼓が使われることがある。この軍楽的な質感が、民謡の素朴さとぶつかり、独特の緊張を生む。

歌唱は、バリトン（低めの男声）的な低い声や、語りに近い歌い方が目立つ。

曲の構成は、サビを持つ大衆音楽の型ではない。反復的な伴奏の上で詩が進むものが多い。

歌詞と美術は、ヨーロッパの前近代、異教信仰、神話、戦争の記憶、近代文明への懐疑といった主題を扱う。この主題を選ぶために、しばしば極右との関連が指摘されてきた。ただし異論もある。一部の作品では、参照が意図的に曖昧にされている。</p>
<h2>成り立ち</h2><p>出発点は、1980年代前半の英国の実験音楽の周辺だ。ネオフォークは、英国のポスト・パンクおよびインダストリアルのシーンから、1980年代に生まれた活動である。のちにネオフォークと呼ばれるようになった。

1981年、パンク・バンドCrisisにいたダグラス・ピアースとトニー・ウェイクフォードが、パトリック・レアガスと共にデス・イン・ジューンを結成した。当初はポスト・パンクと電子音、軍隊調の太鼓を組み合わせていた。しかし1984年の『Burial』でアコースティック・ギターを増やし、ヨーロッパの民俗的な音へ移った。ピアースの影響が決定的だったという評価はある。ただし、起点には諸説ある。

ピアースの主題は、ナチ関連のシンボル、ルーン（古代ゲルマン人の文字）、北欧神話、中世のシンボル学、紋章学などである。1987年の『ブラウン・ブック』は、題名が1965年に東ドイツが刊行した『Braunbuch』（西ドイツ側のナチ関与者名簿）に由来する。この盤は、ホルスト・ヴェッセル・リートのアカペラ（歌唱）版を含む。そのため、ドイツでは2006年にBPjMのListe B（刑法上問題のある内容とされる区分）に指定された。

一方、ウェイクフォードは、1984年初めに「右翼的な傾向を持ち込んだ」として解雇された。後にAbove the Ruinsを経て、1987年にソル・インヴィクタスを結成した。この音楽企画は、ポスト・パンク的な音で、アコースティック・ギターと「neo-classical instrumentation」を併用する。

インダストリアル界隈のPsychic TVにいたデイヴィッド・チベットは、1982年にカレント93を始めた。1983年にはPsychic TVを離れている。英国の神秘主義や幻視文学を主題にして、1992年の『サンダー・パーフェクト・マインド』を発表した。この盤は、ナグ・ハマディ文書（古代の宗教文書）に由来する題名で、同名の詩に基づく曲を2曲含む。アポカリプティック・フォーク（終末的な雰囲気のフォーク）に分類される。

ドイツ語圏では、Forseti（1997年にイェーナで結成）、Sonne Hagal（1992年にラーテノウで結成）、Orplid（1996年にハレで結成）などが同種の活動を進めた。北欧では、ネオフォークと隣接する北欧フォークとして、ノルウェーのWardruna(2003年結成)が、古い北欧の歴史的・伝統的な楽器を用いた解釈を展開した。

このジャンルが抱え続けてきた問題が、政治的な含みである。前近代のヨーロッパや異教信仰、軍事的な図像（絵やシンボル）を扱うため、極右思想との近さを指摘され続けた。実際に一部の演奏者は、関係を否定しないまま活動してきた。ピアースは公然とゲイである。ナチ関連のシンボルを使うことで論争を招いたが、政治的な意図は否定している。

2000年代以降は、そうした政治的な文脈から距離を置く演奏者もいる。純粋に音の質感として受け継ぐ人たちだ。ダーク・フォークという呼び名で、より広い領域へ拡散している。</p>
