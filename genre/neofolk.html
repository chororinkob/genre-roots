<h1>Neofolk（ネオフォーク）とは</h1>
<p>ヨーロッパの伝統的な民謡の楽器と旋律を、実験音楽の側から再構成した様式である。中心となる楽器はアコースティック・ギターで、指で弦をつま弾く奏法によって、装飾を排した素朴な音型が反復される。そこに軍隊調の太鼓、金属を打つ音、管楽器、</p>
<p>ヨーロッパの伝統的な民謡の楽器と旋律を、実験音楽の側から再構成した様式である。中心となる楽器はアコースティック・ギターで、指で弦をつま弾く奏法によって、装飾を排した素朴な音型が反復される。そこに軍隊調の太鼓、金属を打つ音、管楽器、そして合唱が層として重ねられる。特徴的なのが打楽器の使い方で、行進を思わせる規則的な大太鼓が曲を支配することが多く、この軍楽的な質感が民謡の素朴さと衝突して独特の緊張を生む。旋律には古い旋法が用いられ、長調短調の枠から外れた響きが好まれる。歌唱は朗読に近く、詩を語り聞かせる形式を取る。曲の構成はサビを持つ大衆音楽の型ではなく、同じ音型の上で詩が進行していく組曲的なものが多い。録音では意図的に古い音質を模倣し、遠くから聞こえるような処理が施される。歌詞と美術は、ヨーロッパの前近代、異教信仰、神話、戦争の記憶、近代文明への懐疑といった主題を扱う。この主題選択のために、政治的な立場をめぐる論争が常につきまとってきた様式でもあり、演奏者の側もその曖昧さを意図的に残してきた経緯がある。</p>
<h2>成り立ち</h2><p>出発点は1980年代前半の英国の実験音楽の周辺である。インダストリアル音楽の草分けであるスロッビング・グリッスルが1981年に解散したのち、そのメンバーだったジェネシス・P・オリッジ周辺の人脈から複数の分派が生まれた。そのうちトニー・ウェイクフォードとダグラス・ピアースが結成したデス・イン・ジューンが、1983年頃から電子音とノイズを減らし、アコースティック・ギターと軍隊調の太鼓による編成へ移行した。これが様式の直接の起点とされる。ピアースは同時期に、英国の田園と第一次世界大戦の記憶を主題に据え、1987年の『ブラウン・ブック』でその形式を確立した。ウェイクフォードは分かれてソル・インヴィクタスを結成し、より合唱と管弦楽的な色彩を強めた。同じ人脈からはカレント93のデイヴィッド・チベットが出ており、彼は英国の神秘主義や幻視文学を主題にして、1992年の『サンダー・パーフェクト・マインド』で詩の朗読と民謡的な伴奏を組み合わせた形を完成させた。ドイツ語圏ではフォルカー・ザストレンらが同種の実践を進め、北欧ではノルウェーの実験的な音楽家たちが古い北欧の伝統楽器を用いた解釈を発展させた。この様式が抱え続けてきた問題が、政治的な含みである。前近代のヨーロッパや異教信仰、軍事的な図像を扱うため、極右思想との近さを指摘され続け、実際に一部の演奏者は関係を否定しないまま活動してきた。ピアースは自身が同性愛者であることを公にしつつ、右翼的な図像を使い続けるという矛盾した立場を取り、論争を招いた。2000年代以降は、そうした政治的な文脈から距離を置き、純粋に音の質感として受け継ぐ演奏者が増え、ダーク・フォークやアポカリプティック・フォークといった呼び名で、より広い領域へ拡散している。</p>
