<h1>Neofolk（ネオフォーク）とは</h1>
<p>ヨーロッパの伝統的な民謡の楽器と旋律を、実験音楽の側から再構成した様式である。中心となる楽器はアコースティック・ギターで、指で弦をつま弾く奏法によって、装飾を排した素朴な音型が反復される。そこに軍隊調の太鼓、金属を打つ音、管楽器、</p>
<p>ヨーロッパの伝統的な民謡の楽器と旋律を、実験音楽の側から再構成した様式である。中心となる楽器はアコースティック・ギターで、指で弦をつま弾く奏法によって、装飾を排した素朴な音型が反復される。そこに軍隊調の太鼓、金属を打つ音、管楽器、そして合唱が層として重ねられる。特徴的なのが打楽器の使い方で、行進を思わせる規則的な大太鼓が使われることがあり、この軍楽的な質感が民謡の素朴さと衝突して独特の緊張を生む。旋律には古い旋法が用いられ、長調短調の枠から外れた響きが好まれる。歌唱は、バリトンの声や詠唱に近いものが多い。曲の構成はサビを持つ大衆音楽の型ではなく、同じ音型の上で詩が進行していく組曲的なものが多い。歌詞と美術は、ヨーロッパの前近代、異教信仰、神話、戦争の記憶、近代文明への懐疑といった主題を扱う。この主題選択のために、政治的な立場をめぐる論争が常につきまとってきた様式でもあり、演奏者の側もその曖昧さを意図的に残してきた経緯がある。</p>
<h2>成り立ち</h2><p>出発点は1980年代前半の英国の実験音楽の周辺である。ネオフォークは、パンク・ロック界隈とインダストリアル界隈から1980年代に生まれたとされる。1981年、パンク・バンドCrisisにいたダグラス・ピアースとトニー・ウェイクフォードが、パトリック・レアガスと共にデス・イン・ジューンを結成した。当初はポスト・パンクと電子音、軍隊調の太鼓を組み合わせていたが、1984年の『Burial』でアコースティック・ギターを増やし、ヨーロッパの民俗的な音へ移った。これが様式の直接の起点とされる。ピアースの主題は、ナチ関連の象徴、ルーン、北欧神話、中世の象徴学、紋章学などで、1987年の『ブラウン・ブック』は、題名が東ドイツ当局の「褐色の書」に由来し、ホルスト・ヴェッセル・リートのサンプルを含むためドイツでは2005年から販売が禁止されている。ウェイクフォードは1984年初めに「右翼的な傾向を持ち込んだ」として解雇され、後にAbove the Ruinsを経て1987年にソル・インヴィクタスを結成し、より合唱と管弦楽的な色彩を強めた。インダストリアル界隈のPsychic TVにいたデイヴィッド・チベットは、1983年に離れてカレント93を始め、英国の神秘主義や幻視文学を主題にして、1992年の『サンダー・パーフェクト・マインド』を発表した。この盤は、ナグ・ハマディ文書に由来する題名で、同名の詩に基づく曲を2曲含み、アポカリプティック・フォークに分類される。ドイツ語圏ではForseti、Sonne Hagal、Orplidなどが同種の実践を進め、北欧ではノルウェーのWardruna(2003年結成)が古い北欧の歴史的・伝統的な楽器を用いた解釈を展開した。この様式が抱え続けてきた問題が、政治的な含みである。前近代のヨーロッパや異教信仰、軍事的な図像を扱うため、極右思想との近さを指摘され続け、実際に一部の演奏者は関係を否定しないまま活動してきた。ピアースは公然とゲイであり、ナチ関連の象徴を使うことで論争を招いたが、政治的な意図は否定している。2000年代以降は、そうした政治的な文脈から距離を置き、純粋に音の質感として受け継ぐ演奏者もおり、ダーク・フォークやアポカリプティック・フォークといった呼び名で、より広い領域へ拡散している。</p>
