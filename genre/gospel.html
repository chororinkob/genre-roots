<h1>Gospel（ゴスペル）とは</h1>
<p>アメリカの黒人教会で発達した宗教音楽である。演奏の場が礼拝であるという条件が、全ての音楽的な特徴を規定している。第一に、呼びかけと応答の構造が基本となる。独唱者が一節を歌い、合唱団あるいは会衆が応答するという往復が、曲の全体を貫く</p>
<p>アメリカの黒人教会で発達した宗教音楽である。演奏の場が礼拝であるという条件が、全ての音楽的な特徴を規定している。第一に、呼びかけと応答の構造が基本となる。独唱者が一節を歌い、合唱団あるいは会衆が応答するという往復が、曲の全体を貫く。第二に、歌唱は書かれた通りに歌うことを目的とせず、その場での即興的な装飾が奨励される。一つの音節を複数の音程にわたって装飾する技法が極限まで発達し、また高揚の頂点では、歌唱が叫びや絶叫、そして言葉にならない声へ移行する。第三に、和声はブルースの影響を強く受け、長調の中に短三度や短七度が混ざる。第四に、リズムは二拍目と四拍目に手拍子を打つのが定型で、そこにタンバリンが加わる。楽器としてはピアノと電気オルガンが中心で、後者は回転式のスピーカーを通した独特のうねりを持つ。加えてドラム、ベース、時に金管が加わる。曲の構造は固定されず、その場の熱気に応じて同じ部分が何度も繰り返され、演奏時間は10分を超えることもある。聴衆は鑑賞者ではなく参加者であり、涙、叫び、立ち上がっての踊りが期待される反応である。</p>
<h2>成り立ち</h2><p>土台には、奴隷制の時代に生まれた霊歌と、19世紀末以降のブルースがある。この二つを意図的に結合させたのがThomas A. Dorseyである。彼はもともと世俗のブルースの伴奏者として活動していたが、1932年、妻が出産で死亡し、続いて生まれた子も亡くなるという悲劇に見舞われた。その直後に書かれた楽曲は、絶望の底から神に手を引かれることを願う内容であり、以後、この分野で最も歌われる一曲となった。彼はブルースの語法を宗教音楽へ持ち込んだため、当初は教会から悪魔の音楽だと激しく非難されている。この非難を跳ね返したのがMahalia Jacksonである。彼女は生涯にわたり世俗の歌を歌うことを拒み続け、その圧倒的な歌唱によってこの分野を全国的なものにした。1963年、ワシントンでの大行進において、演説していたMartin Luther King Jr.に対し、彼女が夢について語るよう促したことが、あの歴史的な演説を生んだと伝えられている。もう一人の重要な人物がSister Rosetta Tharpeである。彼女は1930年代からエレクトリックギターを弾きながら宗教歌を歌い、その歪んだ音と力強い演奏は、後のロックンロールの直接の源流となった。長らく忘れられていた彼女の功績は、近年になって正当に評価されている。この分野には常に緊張があった。すなわち、教会の外で歌うことを許すのかという問題である。1950年代にThe Soul Stirrersの歌手だったSam Cookeが世俗のポップスへ転向した際、教会からは裏切りと見なされたが、彼が切り開いた道をその後の無数の歌手が歩んだ。実際、ソウル、リズム・アンド・ブルース、そして現代のポップスの歌唱技術の大半は、この分野で培われたものである。1960年代末にはEdwin Hawkinsの楽曲が世俗の順位表で成功を収め、1990年代にはKirk Franklinがヒップホップの語法を導入して、この音楽を若い世代へ届けた。</p>
<h2>代表曲</h2><ul><li>Oh Happy Day (Edwin Hawkins Singers)</li><li>Amazing Grace (Mahalia Jackson)</li><li>Take My Hand, Precious Lord (Thomas A. Dorsey)</li></ul>
