<h1>Gospel（ゴスペル）とは</h1>
<p>ゴスペルは、アメリカの黒人教会で発達した宗教音楽だ。礼拝での役割が、音楽的な特徴を大きく形づくってきた。 第一に、呼びかけと応答の構造が基本になる。独唱者が一節を歌い、合唱団あるいは会衆（礼拝に集まった人々）が応答する。この往復が</p>
<p>ゴスペルは、アメリカの黒人教会で発達した宗教音楽だ。礼拝での役割が、音楽的な特徴を大きく形づくってきた。

第一に、呼びかけと応答の構造が基本になる。独唱者が一節を歌い、合唱団あるいは会衆（礼拝に集まった人々）が応答する。この往復が、曲の全体を貫く。

第二に、歌い方だ。書かれた通りに歌うことを目的とせず、その場での即興的な装飾が奨励される。メリスマ的な歌唱（一音節に複数の音高を当てる）が特徴である。盛り上がりの頂点では、歌唱が叫びや絶叫、そして言葉にならない声へ移行することが多い。

第三に、和声（コードの響き）だ。ブルースの影響を強く受け、ブルーノート（3度・7度などの音が下がる）が現れる。

第四に、リズムだ。手拍子（多くは2拍目と4拍目）が使われ、そこにタンバリンが加わる。楽器の中心は、ピアノと電気オルガンだ。後者は、回転式のスピーカーを通した独特のうねりを持つ（発祥後、1930年代末以降にハモンドオルガンが広まった）。加えて、ドラム、ベース、時には金管が入る。

曲の構造は固定されない。その場の熱気に応じて同じ部分が何度も繰り返され、演奏時間は10分を超えることもある。聴衆は鑑賞者ではなく参加者だ。涙、叫び、立ち上がっての踊りが、期待される反応であることが多い。</p>
<h2>成り立ち</h2><p>土台には、奴隷制の時代に生まれた霊歌と、19世紀後半以降のブルースがある。教会の讃美歌の系譜（Charles A. Tindleyなど）も加わった。この中で、ブルースとゴスペルを結び付けた中心人物が、Thomas A. Dorseyである。

彼はもともと、世俗（教会の外）のブルースの伴奏者として活動していた。しかし1932年8月、妻が出産で亡くなり、同じ出産で生まれた男児も翌日に亡くなるという悲劇に見舞われたと伝えられる。その直後に書かれた楽曲は、絶望の底から神に手を引かれることを願う内容だった。Dorsey自身の作品で、最も有名な曲となった。彼はブルースの手法を宗教音楽へ持ち込んだため、当初は多くの牧師から『悪魔の音楽』と見なされ、抵抗にあった。

Dorseyが育てた歌手の一人が、Mahalia Jacksonである。彼女は世俗曲の録音や出演の誘いの大半を断り、この分野の全国的な普及に貢献した。1963年、ワシントンでの大行進で、演説していたMartin Luther King Jr.は、用意した原稿を離れた。以前の演説でも使っていた『I have a dream』のくだりを、語り始めたのである。直前にJacksonが『Tell 'em about the dream, Martin!』と声をかけたと伝えられる。

もう一人の重要な人物が、Sister Rosetta Tharpeだ。彼女の初録音は1938年(Decca)で、電気ギターでの録音の開始時期は資料により異なる。初期ロックンローラーに影響を与え、「ロックンロールのゴッドマザー（Godmother of Rock and Roll）」と呼ばれた。1944年の『Strange Things Happening Every Day』を、最初のロックンロール曲の有力候補とみる説がある（異論も多い）。2018年にロックの殿堂入りするなど、近年再評価が進んでいる。

この分野には、常に緊張があった。教会の外で歌うことを許すのか、という問題である。1950年代、The Soul Stirrersの歌手だったSam Cookeが、世俗のポップスへ転向した。教会からは裏切りと見なされたが、彼が切り開いた道を、その後の無数の歌手が歩んだ。実際、ゴスペルはソウルの重要な源流である。

1960年代末には、Edwin Hawkinsの楽曲が、世俗の順位表で成功を収めた。1990年代には、Kirk Franklinがヒップホップの手法を導入して、この音楽を若い世代へ届けた。</p>
