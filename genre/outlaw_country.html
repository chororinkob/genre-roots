<h1>Outlaw Country（アウトローカントリー）とは</h1>
<p>1970年代のアメリカで、業界が定めた作り方に従うことを拒んだ音楽家たちによるカントリーである。音の面での特徴は、引き算にある。当時の主流が弦楽合奏と合唱団を厚く重ねてなめらかに仕上げていたのに対し、こちらは楽器を減らし、余白を残</p>
<p>1970年代のアメリカで、業界が定めた作り方に従うことを拒んだ音楽家たちによるカントリーである。音の面での特徴は、引き算にある。当時の主流が弦楽合奏と合唱団を厚く重ねてなめらかに仕上げていたのに対し、こちらは楽器を減らし、余白を残し、ギター、ベース、ドラム、そして必要に応じてハーモニカやペダルスティールという簡素な編成で演奏される。この簡素さは、実際にツアーを共にしている自分のバンドをそのまま録音に使うという方針から生まれたもので、演奏には現場の呼吸と粗さが残る。テンポは中庸で、2拍を強く踏むホンキートンクの型や、ゆったりとした3拍子が用いられる。歌唱は美しく整えられず、しゃがれた声、音程の揺れ、語りに近い発声がそのまま提示される。和音は単純な三つの音の和音が中心である。歌詞の主題は放浪、酒、刑務所、失敗した結婚、法の外側で生きる者の孤独であり、道徳的な結論を与えないまま終わることが多い。田舎の善良な暮らしを称揚する当時のカントリーの決まりごとに対して、正面から異議を唱える内容が選ばれている点が肝心なところである。</p>
<h2>成り立ち</h2><p>ナッシュヴィルでは、1950年代に始まり1960年代に全盛を迎えた、Chet Atkinsらが主導したナッシュヴィル・サウンドと呼ばれる方式が出来上がっていた。これはカントリーから土臭さを取り除き、弦楽器と合唱を加えて都会の聴き手にも売れる形へ整えるもので、商業的には大成功を収めた。しかしその代償として、音楽家は自分の曲を選ぶことも、自分のバンドで録音することもできず、レコード会社が用意した職業演奏家と編曲に従うほかなかった。この体制に反旗を翻したのがWaylon Jenningsである。彼は所属会社と粘り強く交渉し、Bobby Bareらに続いて、制作の主導権を握る契約を勝ち取った。1973年に発表したホンキートンク・ヒーローズは、ほぼ全曲を無名の作曲家Billy Joe Shaverの作品で固めるという賭けに出た作品で、簡素な編成と生々しい歌によって新しい基準を示した。もう一人の中心はWillie Nelsonである。作曲家として成功しながら歌手としては評価されなかった彼は、1969〜70年の自宅火災の後、1971年にテキサスへ戻り、1972年にオースティンへ移る。この街では、長髪の若者と保守的な労働者という本来相容れない客層が、Armadillo World Headquartersという会場で同じ音楽を聴くという奇妙な融合が起きていた。彼が1975年に発表したレッド・ヘッデッド・ストレンジャーは、ギターと姉Bobbie Nelsonのピアノを中心にした簡素な編成の録音で、レコード会社は未完成品だと難色を示したが、結果は空前の成功だった。アウトローという呼び名は、1973年頃にスタジオの宣伝担当だったHazel Smithが使ったとされる(Lee Claytonの曲名『Ladies Love Outlaws』(1972年)や、1974年のDave Hickeyの記事を由来とする説もある)。1976年には彼らを集めた編集盤が、カントリーのアルバムとして初めて100万枚を突破した。しかし成功はそのまま様式の商品化を招き、髭を生やして酒を歌えばアウトローだという安易な模倣が氾濫した結果、1980年代初頭には言葉そのものが空洞化する。それでも、音楽家が自分の作品を管理するという原則を業界に認めさせた功績は大きく、その影響はカントリーに留まらず、後のオルタナティヴ・カントリーやアメリカーナの精神的な支柱となっている。</p>
