<h1>Outlaw Country（アウトローカントリー）とは</h1>
<p>アウトロー・カントリーは、1970年代のアメリカで、業界が定めた作り方に従うことを拒んだ音楽家たちによるカントリーである。音の面での特徴は、引き算にある。 当時の主流は、弦楽合奏と合唱団を厚く重ねて、なめらかに仕上げていた。これに</p>
<p>アウトロー・カントリーは、1970年代のアメリカで、業界が定めた作り方に従うことを拒んだ音楽家たちによるカントリーである。音の面での特徴は、引き算にある。

当時の主流は、弦楽合奏と合唱団を厚く重ねて、なめらかに仕上げていた。これに対し、こちらは楽器を減らし、余白を残す。ギター、ベース、ドラム、そして必要に応じてハーモニカやペダルスティールという、簡素な編成で演奏される。この簡素さは、豪華なオーケストレーションを捨てて、カントリーの核に戻り、ロックの感覚を加えた結果である。背景には、制作者や奏者を自分で選ぶ権利を得たことがある。演奏には、現場の呼吸と粗さが残る。

ホンキートンク由来で、フォークの内省的な歌詞、ロックのリズム、カントリーの楽器編成を混ぜたスタイルである。和音は、少数のコード(スリーコード)を基本とする素朴な和声である。

歌唱は、美しく整えられないと評される。しゃがれた声、音程の揺れ、語りに近い発声が、そのまま提示されるという。

歌詞の特徴は、内省的な語り口、反体制的な姿勢、放浪者や無法者のイメージである。道徳的な結論を与えないまま終わることが多いと評される。田舎の善良な暮らしを称賛する当時のカントリーの決まりごとに対して、正面から異議を唱える内容が選ばれている。この点が肝心なところである。</p>
<h2>成り立ち</h2><p>舞台は、ナッシュヴィルである。1950年代に始まり、1960年代に全盛を迎えた方式が、すでに出来上がっていた。Chet Atkinsらが主導した、ナッシュヴィル・サウンドである。

これは、カントリーから土臭さを取り除き、弦楽器と合唱を加えて、都会の聴き手にも売れる形へ整えるものだった。商業的には大成功を収めた。しかし、その代償は大きかった。音楽家は、自分の曲を選ぶことも、自分のバンドで録音することもできない。レコード会社が用意した職業演奏家と編曲に、従うほかなかった。

この体制に反旗を翻したのが、Waylon Jenningsである。彼は所属会社と粘り強く交渉し、1972年に、制作の主導権を握る契約を勝ち取った。Bobby Bareも、同時期に(または先んじて)同様の権利を得ていた。1973年に発表したホンキートンク・ヒーローズは、ほぼ全曲を無名の作曲家Billy Joe Shaverの作品で固めるという賭けに出た作品だった。簡素な編成と生々しい歌によって、新しい基準を示した。

もう一人の中心が、Willie Nelsonである。作曲家としては成功しながら、歌手としては評価されなかった。1969〜70年に自宅が火災に遭い、その後の1971年にテキサスへ戻る。1972年には、オースティンへ移った。

この街では、奇妙な融合が起きていた。長髪の若者と保守的な労働者という、本来は相容れない客層が、Armadillo World Headquartersという会場で、同じ音楽を聴いていた。

1975年、彼はレッド・ヘッデッド・ストレンジャーを発表する。ギターと、姉Bobbie Nelsonのピアノを中心にした、簡素な編成の録音だった。レコード会社は未完成品だと難色を示した。しかし、結果は大ヒットとなり、のちにダブル・プラチナに認定された。

アウトローという呼び名の由来は、諸説ある。Lee Claytonの曲名・アルバム名『Ladies Love Outlaws』(1972年)説が広く挙げられている。Hazel Smith(1973年頃)説や、Dave Hickey(1974年)説もある。

1976年には、彼らを集めた編集盤が、カントリーのアルバムとして初めて100万枚を突破した。しかし、成功はそのままスタイルの商品化を招いた。髭を生やして酒を歌えばアウトローだという、安易な模倣があふれる。その結果、1980年代初頭には、言葉そのものが空洞化した。

それでも、音楽家が自分の作品を管理するという原則を、業界に認めさせた功績は大きい。その影響はカントリーにとどまらず、後のオルタナティヴ・カントリーやアメリカーナの精神的な支柱となっている。</p>
