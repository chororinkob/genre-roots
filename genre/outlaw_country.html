<h1>Outlaw Country（アウトローカントリー）とは</h1>
<p>1970年代のアメリカで、業界が定めた作り方に従うことを拒んだ音楽家たちによるカントリーである。音の面での特徴は引き算にある。当時の主流が弦楽合奏と合唱団を厚く重ねて滑らかに仕上げていたのに対し、こちらは楽器を減らし、余白を残し、</p>
<p>1970年代のアメリカで、業界が定めた作り方に従うことを拒んだ音楽家たちによるカントリーである。音の面での特徴は引き算にある。当時の主流が弦楽合奏と合唱団を厚く重ねて滑らかに仕上げていたのに対し、こちらは楽器を減らし、余白を残し、ギター、ベース、ドラム、そして必要に応じてハーモニカやペダルスティールという簡素な編成で演奏される。この簡素さは、実際にツアーを共にしている自分のバンドをそのまま録音に使うという方針から生まれたもので、演奏には現場の呼吸と粗さが残る。テンポは中庸で、二拍を強く踏むホンキートンクの型や、ゆったりとした三拍子が用いられる。歌唱は美しく整えられず、しゃがれた声、音程の揺れ、語りに近い発声がそのまま提示される。和声は単純な三和音が中心だが、曲の長さは商業的な制約を無視して伸び、物語を語り切るまで終わらない。歌詞の主題は放浪、酒、刑務所、失敗した結婚、法の外側で生きる者の孤独であり、道徳的な結論を与えないまま終わることが多い。田舎の善良な暮らしを称揚する当時のカントリーの規範に対して、正面から異議を唱える内容が選ばれている点が本質である。</p>
<h2>成り立ち</h2><p>1960年代のナッシュヴィルでは、Chet Atkinsらが主導したナッシュヴィル・サウンドと呼ばれる方式が確立していた。これはカントリーから土臭さを取り除き、弦楽器と合唱を加えて都会の聴き手にも売れる形へ整えるもので、商業的には大成功を収めた。しかしその代償として、音楽家は自分の曲を選ぶことも、自分のバンドで録音することもできず、レコード会社が用意した職業演奏家と編曲に従うほかなかった。この体制に反旗を翻したのがWaylon Jenningsである。彼は所属会社と粘り強く交渉し、1972年に制作の全権を自ら握る契約を勝ち取った。これは当時のカントリー界では前例のない出来事だった。1973年に発表したホンキートンク・ヒーローズは、ほぼ全曲を無名の作曲家Billy Joe Shaverの作品で固めるという賭けに出た作品で、簡素な編成と生々しい歌によって新しい基準を示した。もう一人の中心はWillie Nelsonである。作曲家として成功しながら歌手としては評価されなかった彼は、1970年に自宅が焼失したことを機にナッシュヴィルを離れ、テキサス州オースティンへ移る。この街では、長髪の若者と保守的な労働者という本来相容れない客層が、Armadillo World Headquartersという会場で同じ音楽を聴くという奇妙な融合が起きていた。彼が1975年に発表したレッド・ヘッデッド・ストレンジャーは、ほとんど伴奏を排したギター一本に近い簡素な録音で、レコード会社は未完成品だと難色を示したが、結果は空前の成功だった。アウトローという呼び名は、1973年頃に音楽記者のHazel Smithが、この一群を説明するために使ったのが広まったものとされる。1976年には彼らを集めた編集盤が、カントリーのアルバムとして初めて100万枚を突破した。しかし成功はそのまま様式の商品化を招き、髭を生やして酒を歌えばアウトローだという安易な模倣が氾濫した結果、1980年代初頭には言葉そのものが空洞化する。それでも、音楽家が自分の作品を管理するという原則を業界に認めさせた功績は決定的であり、その影響はカントリーに留まらず、後のオルタナティヴ・カントリーやアメリカーナの精神的な支柱となっている。</p>
