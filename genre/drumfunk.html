<h1>Drumfunk（ドラムファンク）とは</h1>
<p>ドラムファンクは、ドラムンベースの一派だ。主役は、細かく切り刻んで組み直したブレイクビーツである。打ち込みのループをそのまま貼るのではない。既存のレコードにあるドラムのブレイク（ファンクやジャズ、フュージョンなどの音源）を、元の音</p>
<p>ドラムファンクは、ドラムンベースの一派だ。主役は、細かく切り刻んで組み直したブレイクビーツである。打ち込みのループをそのまま貼るのではない。既存のレコードにあるドラムのブレイク（ファンクやジャズ、フュージョンなどの音源）を、元の音源から再サンプリングして使う。

速さはBPMで160〜180前後（1996年頃以降は主に170〜180）と、ドラムンベースの標準域にある。ただし、キックとスネアが規則正しく行き来する骨組みを、あえて壊す。ゴーストノート（弱く叩かれた装飾的な打音）やフラム（二打をごくわずかにずらす奏法）、シンバルが消えていく尻尾までを含めて、並べ直す。そのため、人間のドラマーが延々と即興を続けているように聴こえる。

素材は、定番のファンク／ソウルの、Amen Breakのドラム独奏やThink Breakなどのドラム・ブレイクだ。それに加えて、ジャズ・フュージョン期の込み入ったフィルインも好んで使われる。

ベースは、前に出て唸るというより、サブベースの帯域で低く支える役に徹する。曲調は、雰囲気重視のものから攻撃的なものまで幅がある。上物の素材も、それに合わせて選ばれる。

曲の組み立ても、ドロップ（山場で低音が一気に出る部分）で一気に落とす型ではない。リズムの模様が少しずつ変わっていく、織物のような展開が主流だ。聴かせどころは、16小節ごとの爆発ではない。絶えず変化する、スネアの粒立ちそのものにある。

同じ高速のBPMでも、ニューロファンクは複雑なベースラインや変化する音色で押す。これに対し、ドラムファンクはドラムの打ち込みを前面に出す。</p>
<h2>成り立ち</h2><p>ドラムファンクは、1990年代末から2000年代初頭のイギリスで形になった。当時、ドラムンベースの主流は、テックステップやニューロファンク、ジャンプアップなどへ進んでいた。その中で、それらとの対比で新鮮に響く音として生まれた。

中心人物のひとりが、Dev Pandya、つまりParadoxである。彼は1989〜90年頃に、DJ TraxとMixraceを結成した。1992年には、Moving Shadowから最初の作品を出していた。ParadoxとAlaskaの名義が登場したのは1996年だ。Alaskaは同じDev Pandyaの別名義で、アンビエント寄りの作品をGood Lookingなどから出した。

2003年、彼はレーベルParadox Musicを始動した。既存のブレイクを再サンプリング（録音済みの音を素材として取り込み直すこと）し、細かく切って組み直す。その手法を、ひたすら突き詰めた。「ドラムファンク」という名前の由来には、2002年のアルバム収録曲名説と、Paradoxの作風を指す呼び名説がある。定説はまだ固まっていない。彼は、一つのブレイクを複数のパターンに組み替える手法を使った。

1997年創設のロンドンのInperspective Records（Chris Inperspectiveが運営）は、2000年代初頭にこのスタイルの拠点の一つになった。Inperspective Recordsは、Technicality（クラブナイト）の拠点にもなった。フィンランドのFanu（Janne Hatula）は、2003年にデビューした。2000年代初頭から初期のシーンの担い手の一人で、ブレイクビーツ中心の作風で知られる。

Paradox本人が源流として語るのは、ヒップホップのブレイク文化だ。Ultimate Breaks and Beats、Tim Westwood、Gang Starr、Public Enemyなどである。

シーンは、クラブナイト、12インチ、ネットラジオ、フォーラムを軸にした、比較的小さなものだった。自主レーベルの比重が大きく、通販や、後にはBandcampを通じた直販にも支えられてきた。

それでも、打ち込みの正確さが当たり前になった時代に、人間のドラマーのような揺らぎ・グルーヴを重視するジャンルとして、独自の位置を保っている。</p>
