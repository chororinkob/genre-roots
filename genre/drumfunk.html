<h1>Drumfunk（ドラムファンク）とは</h1>
<p>ドラムンベースの一派で、打ち込みのループをそのまま貼るのではなく、既存のレコードのドラムのブレイク（ファンクやジャズ、フュージョンなどの音源）を元の音源から再サンプリングし、細かく切り刻んで組み直したブレイクビーツを主役に据えるス</p>
<p>ドラムンベースの一派で、打ち込みのループをそのまま貼るのではなく、既存のレコードのドラムのブレイク（ファンクやジャズ、フュージョンなどの音源）を元の音源から再サンプリングし、細かく切り刻んで組み直したブレイクビーツを主役に据えるスタイル。BPMは160〜175前後とドラムンベースの標準域だが、キックとスネアが規則正しく往復する骨格をあえて壊し、ゴーストノート（弱く叩かれた装飾的な打音）やフラム（二打をごくわずかにずらす奏法）、シンバルの減衰の尻尾までを含めて配置し直すため、人間のドラマーが延々と即興を続けているように聴こえる。素材はAmen BreakやThink Breakといった定番のファンク／ソウルのドラムソロに加え、ジャズ・フュージョン期の込み入ったフィルインも好んで使われる。ベースは前に出て唸るというより、サブベース帯域で低く支える役割に徹し、曲調は雰囲気重視のものから攻撃的なものまで幅があり、上物の素材もそれに応じて選ばれる。構成もドロップで一気に落とす型ではなく、リズムの模様が少しずつ変化していく織物のような展開が主流で、聴かせどころは16小節ごとの爆発ではなく、二度と同じ形にならないスネアの粒立ちそのものにある。同じ高速BPMでもニューロファンクが金属質な合成音で押すのに対し、ドラムファンクは木と皮の質感で押す点が決定的に異なる。</p>
<h2>成り立ち</h2><p>1990年代末から2000年代初頭のイギリスで、ドラムンベースの主流がテックステップやニューロファンク、ジャンプアップなどに進む中で、それとの対比で新鮮に響く音として形を取った。中心人物のひとりが、Dev Pandya、すなわちParadoxである。彼は1990年にMixraceをDJ Traxと結成し、1992年にMoving Shadowから最初の作品を出していた。ParadoxとAlaskaの名義が出てきたのは1996年で、Alaskaは同じDev Pandyaの別名義として、アンビエント寄りの作品をGood Lookingなどから出した。2003年にはレーベルParadox Musicを始動し、既存のブレイクを再サンプリングして細断し、組み直す手法をひたすら突き詰めた。「ドラムファンク」という名称は、Paradoxのミニマルなドラムンベースの作風を指す言葉に由来するとされる。彼にとってブレイクビーツは「速く鳴らすための素材」ではなく「作曲の対象」であり、1小節のドラムから何十小節分もの異なる表情を引き出すことが目的だった。同時期、ロンドンのInperspective Records（Chris Inperspectiveが運営。創設は1997年とする資料が多い）がこの美学の拠点となった。Chris Inperspectiveは1997年にドラムファンク（choppage）に火をつけた人物として紹介される。フィンランドのFanu（Janne Hatula）は2003年にデビューし、2000年代初頭から初期のシーンの担い手の一人として、生演奏と細断されたブレイクを混ぜた作風で知名度を広げた。影響源の一つと言われるのが、SquarepusherやPhotekが1990年代半ばに示した「ブレイクビーツの編集それ自体が音楽になる」という発想で、ドラムファンクはそこから踊れる機能性をあえて薄め、聴くための音楽へと寄せた。商業的な後ろ盾は大きくなく、クラブでの需要も限られたため、シーンは自主レーベルの比重が大きく、通販や、後にはBandcampを通じた直販にも支えられてきた。それでも、打ち込みの正確さが当たり前になった時代に「機械で人間の揺らぎを再現する」という命題を最も執拗に追い続けたジャンルとして、独自の位置を保っている。</p>
