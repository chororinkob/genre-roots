<h1>Drumfunk（ドラムファンク）とは</h1>
<p>ドラムンベースの一派で、打ち込みのループをそのまま貼るのではなく、生ドラムの録音を一打ずつ切り刻んで並べ替えたブレイクビーツを主役に据えるスタイル。BPMは160〜175前後とドラムンベースの標準域だが、キックとスネアが規則正しく</p>
<p>ドラムンベースの一派で、打ち込みのループをそのまま貼るのではなく、生ドラムの録音を一打ずつ切り刻んで並べ替えたブレイクビーツを主役に据えるスタイル。BPMは160〜175前後とドラムンベースの標準域だが、キックとスネアが規則正しく往復する骨格をあえて壊し、ゴーストノート（弱く叩かれた装飾的な打音）やフラム（二打をごくわずかにずらす奏法）、シンバルの減衰の尻尾までを含めて配置し直すため、人間のドラマーが延々と即興を続けているように聴こえる。素材はAmen BreakやThink Breakといった定番のファンク／ソウルのドラムソロに加え、ジャズ・フュージョン期の込み入ったフィルインも好んで使われる。ベースは前に出て唸るというより、サブベース帯域で低く支える役割に徹し、上物にはローズ・ピアノやコントラバス、雨音や街の環境音といった落ち着いた素材が選ばれる。構成もドロップで一気に落とす型ではなく、リズムの模様が少しずつ変化していく織物のような展開が主流で、聴かせどころは16小節ごとの爆発ではなく、二度と同じ形にならないスネアの粒立ちそのものにある。同じ高速BPMでもニューロファンクが金属質な合成音で押すのに対し、ドラムファンクは木と皮の質感で押す点が決定的に異なる。</p>
<h2>成り立ち</h2><p>1990年代末から2000年代初頭のイギリスで、ドラムンベースがテックステップやニューロファンクへ進み、シンセベースの重量と機械的な正確さを競う方向に傾いたことへの反動として形を取った。中心にいたのはロンドンのDev Pandya、すなわちParadoxである。彼は1990年代半ばからMoving Shadowやその周辺で作品を出していたが、1990年代末に自身のレーベルParadox Musicを立ち上げ、生ドラムのサンプルを一打単位で解体して組み直す手法をひたすら突き詰めた。彼にとってブレイクビーツは「速く鳴らすための素材」ではなく「作曲の対象」であり、1小節のドラムから何十小節分もの異なる表情を引き出すことが目的だった。同時期、ロンドンのInperspective Recordsがこの美学の拠点となり、Alaskaらが硬質でジャズ寄りの作品を発表した。フィンランドのFanu（Janne Hatula）は2000年代半ばに国外からこの流儀に加わり、生演奏と細断されたブレイクを混ぜた作風で知名度を広げた。土台となったのはSquarepusherやPhotekが1990年代半ばに示した「ブレイクビーツの編集それ自体が音楽になる」という発想で、ドラムファンクはそこから踊れる機能性をあえて薄め、聴くための音楽へと寄せた。商業的な後ろ盾はほとんどなく、クラブでの需要も限られたため、シーンは終始小さな自主レーベルと通販、後にはBandcampを通じた直販に支えられてきた。DJがミックスしづらいという実務上の弱点も普及を阻んだ。それでも、打ち込みの正確さが当たり前になった時代に「機械で人間の揺らぎを再現する」という命題を最も執拗に追い続けたジャンルとして、後のフットワークやIDM系プロデューサーのドラム処理に確かな影響を残している。</p>
<h2>代表曲</h2><ul><li>A Certain Sound (Paradox)</li><li>Siren Song (Fanu)</li><li>Arctic Foundations (Alaska)</li><li>The Bell Tolls (Mikal)</li></ul>
