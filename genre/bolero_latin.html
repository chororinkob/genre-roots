<h1>Bolero（ボレロ）とは</h1>
<p>ボレロは、ゆったりとしたテンポで恋愛の歓喜と苦悩を切々と歌い上げる、ラテンアメリカの歌謡形式だ。 スペインの舞曲ボレロと名前は同じだが、3拍子のスペイン舞曲とは別物である。こちらはキューバでは2拍子系(2/4)、ほかの地域では4拍</p>
<p>ボレロは、ゆったりとしたテンポで恋愛の歓喜と苦悩を切々と歌い上げる、ラテンアメリカの歌謡形式だ。

スペインの舞曲ボレロと名前は同じだが、3拍子のスペイン舞曲とは別物である。こちらはキューバでは2拍子系(2/4)、ほかの地域では4拍子(4/4)で書かれることが多い。

リズムは、シンキーヨ（キューバ音楽に多い、5つの音からなるリズムの型）系の型で説明されることもある。ギターの低音やボンゴなどで刻まれることが多い。歌ものの多くは60〜90bpm程度だ。ダンス用はもう少し速く、96〜120bpmである。歌ものはテンポが遅いので、拍と拍の間に大きな余白ができる。歌手はそこで語尾を伸ばし、息を漏らし、ためを作ることができる。

伴奏の中心はナイロン弦のギターであることが多い。和音を1音ずつ順に鳴らすアルペジオと、間奏で高音弦を3度で重ねて奏でる装飾的な旋律が組み合わされることがある。この装飾は、小ぶりで高音域を担当するレキント・ギターが受け持つことが多い。和声は短調と長調を行き来し、セブンス（少し緊張感のある和音）やディミニッシュ（不安定な響きの和音）を織り込むことがある。当時としては洗練された進行が用いられるとされる。

歌唱は、代表的なスタイルとして、男性ソロの朗唱型と、トリオによるコーラス型がある。

歌詞は詩的で比喩に富む。失恋、別離、届かない想い、時を越えた愛が扱われる。</p>
<h2>成り立ち</h2><p>1880年代、キューバ東部のサンティアゴ・デ・クーバで、この音楽は成立した。最初のボレロとされるのは、この街のギター奏者José Pepe Sánchezが1883年に作った「Tristezas」である。

当時のサンティアゴには、ギターを手に恋歌を歌って回る、トローバと呼ばれる吟遊詩人（歌い歩く詩人）の伝統があった。この伝統の中から、スペインやラテンの音楽、アフリカの要素を取り込みながら、ボレロが生まれた。同名のスペイン舞曲とは無関係に生まれたとされる。

20世紀初頭、ボレロはメキシコへ伝わり、そこで爆発的に発展する。メキシコの作曲家Agustín Laraは、ピアノを弾きながら退廃と官能を歌う独自の詩世界を築いた。「Solamente una vez」「Mujer」などの名曲を残し、ボレロを大衆音楽の中心へ据えた。1930年代から40年代にかけては、ラジオと映画が普及の原動力となった。メキシコ映画の黄金期を彩った歌手たちが、ボレロを大陸全体へ届ける。

Consuelo Velázquezの「Bésame Mucho」は、1932年に作曲(10代で書いたとされる)された。最初の録音は1941年(Emilio Tuero)だ。1940年を出版年とする資料もある。この曲は、後に世界で最も多く録音されたスペイン語の曲の一つとなった。

1944年、ニューヨークでメキシコ人2人とプエルトリコ人1人が、Trío Los Panchosを結成した。レキント・ギターによる甘い装飾と3声のコーラスという編成で知られ、この形はトリオ・ロマンティコとして中南米全域に模倣者を生む。キューバではBeny MoréやIbrahim Ferrerがボレロの名手として活動した。プエルトリコのDaniel SantosやRafael Hernándezも、重要な担い手となった。

ボレロは1950年代に最盛期を迎えた。だが1950年代以降、ランチェーラやロックンロールなどに押され、人気の中心から退いた。それでも歌としての強さは失われなかった。メキシコのLuis Miguelがボレロ・アルバム4部作の第1作『Romance』(1991)で往年のボレロを現代的な録音で歌い直し、大規模な再ブームが起きた。ボレロはいまも多くの歌手に歌い継がれている。</p>
