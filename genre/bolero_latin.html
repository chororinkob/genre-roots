<h1>Bolero（ボレロ）とは</h1>
<p>ゆったりとしたテンポの中で、恋愛の歓喜と苦悩を切々と歌い上げるラテンアメリカの歌謡形式。スペインの舞曲ボレロと名前を共有するが、3拍子のスペイン舞曲とは別物で、こちらは4拍子である。リズムの土台はシンキーヨと呼ばれる付点を含む定型</p>
<p>ゆったりとしたテンポの中で、恋愛の歓喜と苦悩を切々と歌い上げるラテンアメリカの歌謡形式。スペインの舞曲ボレロと名前を共有するが、3拍子のスペイン舞曲とは別物で、こちらは4拍子である。リズムの土台はシンキーヨと呼ばれる付点を含む定型句で、これがギターの低音やボンゴ、クラーベによって刻まれる。テンポは1分あたり60〜90拍程度と遅く、拍と拍の間に大きな余白があるため、歌手はそこで語尾を伸ばし、息を漏らし、ためを作ることができる。伴奏の中心はナイロン弦のギターで、和音を1音ずつ順に鳴らすアルペジオと、間奏で高音弦を三度で重ねて奏でる装飾的な旋律が組み合わされる。この装飾の役割は、小ぶりで高音域を担当するレキント・ギターが受け持つことが多い。和声は短調と長調を行き来し、セブンスやディミニッシュを織り込んだ、当時としては洗練された進行が用いられる。歌唱は、男性の中低音による朗々としたものと、三人組が三度と六度で和音を重ねるコーラス様式が二大様式である。歌詞は詩的で比喩に富み、失恋、別離、届かない想い、時を越えた愛を扱う。</p>
<h2>成り立ち</h2><p>1880年代のキューバ東部、サンティアゴ・デ・クーバで成立した。最初のボレロとされるのは、この街のギター奏者José Pepe Sánchezが1885年頃に作った「Tristezas」である。当時のサンティアゴには、ギターを手に恋歌を歌って回るトローバと呼ばれる吟遊詩人の伝統があり、彼らがスペイン由来の歌謡形式に、アフリカ系キューバのリズムであるシンキーヨを組み合わせたことで、この様式が生まれた。20世紀初頭にはメキシコへ伝わり、そこで爆発的に発展する。メキシコの作曲家Agustín Laraは、ピアノを弾きながら退廃と官能を歌う独自の詩世界を築き、「Solamente una vez」「Mujer」などの名曲を残して、ボレロを大衆音楽の中心へ据えた。1930年代から40年代にかけてはラジオと映画が普及の原動力となり、メキシコ映画の黄金期を彩った歌手たちがボレロを大陸全体へ届ける。1941年にConsuelo Velázquezが書いた「Bésame Mucho」は、後に世界で最も多く録音されたスペイン語の曲の一つとなった。1944年にメキシコシティで結成されたTrío Los Panchosは、レキント・ギターによる甘い装飾と三声のコーラスという編成を確立し、この形はトリオ・ロマンティコとして中南米全域に模倣者を生む。キューバではBeny MoréやIbrahim Ferrerがボレロの名手として活動し、プエルトリコのDaniel SantosやRafael Hernándezも重要な担い手となった。ボレロは1950年代に最盛期を迎えたが、1960年代のロックとポップスの台頭により、若者からは親世代の音楽と見なされて後退する。それでも歌としての強さは失われず、メキシコのLuis Miguelがアルバムシリーズ『Romance』(1991〜)で往年のボレロを現代的な録音で歌い直したことにより、大規模な再ブームが起きた。現在もラテンアメリカの歌手にとって、ボレロを歌えることは歌唱力の証明として扱われている。</p>
<h2>代表曲</h2><ul><li>Solamente una vez (Agustín Lara)</li><li>Bésame Mucho (Consuelo Velázquez)</li><li>Sabor a Mí (Trío Los Panchos)</li><li>Contigo en la Distancia (Luis Miguel)</li><li>Historia de un Amor (Luis Miguel)</li></ul>
