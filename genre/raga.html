<h1>Raga（ラーガ）とは</h1>
<p>インド古典音楽における旋法の体系、およびそれに基づく演奏の様式。ラーガとは単なる音階ではなく、上行と下行で用いる音が異なること、特定の音を強調すること、決まった装飾の型を持つことなど、旋律の振る舞いの規則をひとまとめにした概念であ</p>
<p>インド古典音楽における旋法の体系、およびそれに基づく演奏の様式。ラーガとは単なる音階ではなく、上行と下行で用いる音が異なること、特定の音を強調すること、決まった装飾の型を持つことなど、旋律の振る舞いの規則をひとまとめにした概念である。数百種類が存在し、それぞれに演奏すべき時刻や季節、そして喚起すべき情緒が定められている。音程は十二平均律ではなく、シュルティと呼ばれる微細な音程差を用い、一オクターブを理論上22に分割する。演奏は必ずドローン、すなわち持続する主音と五度をタンプーラという楽器が鳴らし続ける上で行われ、この不変の基準に対して旋律がどう動くかで全ての意味が生じる。構成は段階的で、まず拍のないアーラープでラーガの音を一つずつ提示し、次にジョールで脈拍が生まれ、ジャーラーで加速し、最後に打楽器が加わってガットまたはバンディーシュという作曲された旋律に入る。ここからは旋律楽器とタブラの掛け合いによる即興が展開され、ターラと呼ばれる周期的な拍節構造の上で、両者が周期の頭に同時に着地する瞬間が最大の聴かせどころとなる。</p>
<h2>成り立ち</h2><p>起源は紀元前後に遡り、ヴェーダの朗唱に用いられた音の体系がその源とされる。理論書としては紀元前二世紀から紀元後二世紀頃に成立したとされるBharataのNatya Shastraが最古で、ここに音階の理論と情緒の理論が記されている。13世紀のSharngadevaによるSangita Ratnakaraは、南北の伝統がまだ分かれる前の集大成として重要である。分岐が起きたのはイスラーム勢力の北インド支配以降で、北部ではペルシャ音楽の影響を受けたヒンドゥスターニー音楽が、南部ではより古い形を保つカルナータカ音楽が発展した。伝承は完全に口伝で、グル・シシャ・パランパラと呼ばれる師弟関係を通じて行われ、弟子は師の家に住み込んで数十年をかけて学ぶ。この師弟の系譜がガラーナーと呼ばれる流派を形成し、それぞれが独自の解釈と技法を守る。近代における転換点は20世紀初頭で、Vishnu Narayan BhatkhandeとVishnu Digambar Paluskarが、それまで秘伝とされていた理論を体系化して出版し、音楽学校を設立した。これにより宮廷の庇護を失った音楽家が生き延びる道が開かれた一方、伝統の変質を招いたという批判もある。1947年の独立後は国営放送All India Radioが主要な雇用先となった。国際的な認知の契機は1960年代で、シタール奏者Ravi Shankarが西洋で演奏を行い、とりわけThe BeatlesのGeorge Harrisonが弟子となったことで爆発的な注目を集めた。1967年のモントレー・ポップ・フェスティバル、1969年のウッドストックへの出演もあった。ただしRavi Shankar自身は、聴衆が音楽を薬物体験の背景として扱うことに強い不快感を示している。</p>
