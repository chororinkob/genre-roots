<h1>Raga（ラーガ）とは</h1>
<p>インド古典音楽における旋法（音の並び方の型）の体系、およびそれに基づく演奏の様式。ラーガとは単なる音階ではなく、上行と下行で用いる音が異なること、特定の音を強調すること、決まった装飾の型を持つことなど、旋律の振る舞いの規則をひとま</p>
<p>インド古典音楽における旋法（音の並び方の型）の体系、およびそれに基づく演奏の様式。ラーガとは単なる音階ではなく、上行と下行で用いる音が異なること、特定の音を強調すること、決まった装飾の型を持つことなど、旋律の振る舞いの規則をひとまとめにした概念である。数百種類が存在し、それぞれに喚起すべき情緒がある。北インドでは伝統的に演奏の時刻や季節とも結び付けられてきたが、南インドでは時刻・季節の比重が小さく、北インドでも現代の演奏会では厳密には守られないことが多い。音程は十二平均律（1オクターブを等しく十二に分けた音程）ではなく、シュルティと呼ばれる微細な音程差を用い、一オクターブを理論上22のシュルティ（大きさは不均等）に分ける。演奏はドローン（持続する音）をタンプーラという楽器が鳴らし続ける上で行われ（標準の調弦は5度と主音だが、5度を欠くラーガでは4度に、ラーガによっては6度や7度に合わせる）、この不変の基準に対して旋律がどう動くかで全ての意味が生じる。ヒンドゥスターニー器楽の典型的な構成は段階的で、まず拍のないアーラープでラーガの音を一つずつ示し、次にジョールで脈拍が生まれ、ジャーラーで加速し、最後に打楽器が加わってガットまたはバンディーシュという作曲された旋律に入る。ここからは旋律楽器とタブラの掛け合いによる即興が展開され、ターラと呼ばれる周期的な拍の構造の上で、両者が周期の頭に同時に着地する瞬間が最大の聴かせどころとなる。</p>
<h2>成り立ち</h2><p>ラーガという概念の明確な定義は、6〜10世紀頃（諸説）のBrihaddeshi（Matanga）に遡り、それ以前の旋律の枠組みはjati（旋法）などの概念で扱われた。ヴェーダの朗唱からの流れは一説とされる。現存する最古の舞台芸術論書であるBharataのNatya Shastra（成立は紀元前500年から紀元後500年のあいだと幅があり、最初の完全版は紀元前200年から紀元後200年頃とされる）には、音階（grama・murchana・jati）と情緒（rasa）の理論が含まれ、旋律概念の中心はjatiである。現代的な意味での「ラーガ」を詳しく論じた最初の文献はBrihaddeshiとされるが、Natya Shastraにも複合語としてのragaの用例があるとする見解がある。13世紀のSharngadevaによるSangita Ratnakaraは、南北の両伝統が共通に参照する最後期の文献として重要である。分岐の時期は12世紀から14〜16世紀まで諸説あり確定していないが、徐々に進んだとされ、北部ではペルシャ音楽の影響を受けたヒンドゥスターニー音楽が、南部ではイスラーム文化の影響が小さい形でカルナータカ音楽が独自に発展した。19世紀後半までの伝承は師から弟子への一対一の口伝が中心で、グル・シシャ・パランパラと呼ばれる師弟関係を通じて行われ、弟子は師の家に住み込んで学ぶのが主流だった。この師弟の系譜がガラーナーと呼ばれる流派を形成し、それぞれが独自の解釈と技法を守り続ける。近代における転換点は20世紀初頭で、Vishnu Digambar Paluskarが音楽学校を設立し、Vishnu Narayan Bhatkhandeは理論の体系化と出版、学校の設立への関与で貢献した。これにより宮廷の後ろ盾を失った音楽家が生き延びる道が開かれたとされる一方、伝統が変わってしまったという批判もある。1947年の独立後は国営放送All India Radioが、後援制の衰退を補い、芸術家を世に出す役割を果たした。国際的な認知は、1955年にAli Akbar KhanがニューヨークのMoMAで演奏したのが米国での先駆けで、シタール奏者Ravi Shankarが1956年に欧米で本格的なソロ巡演を始めて普及の中心になり、1960年代に入り、The BeatlesのGeorge Harrisonが1966年に弟子となったことで大きな注目を集めた。1967年のモントレー・ポップ・フェスティバル、1969年のウッドストックへの出演もあった。ただしRavi Shankar自身は、聴衆が音楽を薬物体験の背景として扱うことに強い不快感を示している。</p>
