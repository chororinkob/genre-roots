<h1>Chamber Music（チェンバーミュージック）とは</h1>
<p>室内楽は、1つの声部を1人の奏者が担う少人数の器楽アンサンブルで、ふつう2人から10人程度の編成を指す。中心となるのは2本のヴァイオリン、ヴィオラ、チェロによる弦楽四重奏で、これにピアノが加わればピアノ五重奏、コントラバスが加われ</p>
<p>室内楽は、1つの声部を1人の奏者が担う少人数の器楽アンサンブルで、ふつう2人から10人程度の編成を指す。中心となるのは2本のヴァイオリン、ヴィオラ、チェロによる弦楽四重奏で、これにピアノが加わればピアノ五重奏、コントラバスが加われば「鱒」型の五重奏、弦楽器が8本集まれば弦楽八重奏となる。旋律は各楽器に均等に分配され、第1ヴァイオリンが主題を歌う背後でチェロが対旋律を、ヴィオラが内声を埋めるという対話的な書法が基本になる。和声は調性音楽の機能和声を土台とし、四重奏では4声体の書法が厳格に守られるため、転調や掛留音、倚音の処理がそのまま響きの緊張と弛緩になる。弦楽器の奏法は多彩で、弓を弦に密着させるレガート、弓を跳ねさせるスピッカート、弦を指で弾くピッツィカート、2本の弦を同時に鳴らす重音奏法、弱音器を付けたコン・ソルディーノなどが楽器間で会話のように受け渡される。テンポはアダージョの毎分60拍前後からプレストの毎分180拍前後まで大きく振れ、拍子は4分の4拍子や4分の3拍子が中心で、舞曲風の3拍子では2拍目に軽いアクセントが置かれる。曲はふつうソナタ形式の速い楽章、緩徐楽章、メヌエットまたはスケルツォ、ロンド形式の終楽章という4楽章構成をとり、協奏曲的な華やかさと交響曲的な厚みを両立させる例もある。大ホールを埋める轟音ではなく、残響の短いサロンや小さなホールで、楽器同士の呼吸が直接届く距離で鳴る音楽だ。</p>
<h2>成り立ち</h2><p>室内楽という語はイタリア語の musica da camera に由来し、もともと宮廷や貴族の広間（カメラ）で演奏する世俗音楽を指した。バロック期にはトリオ・ソナタやソナタ・ダ・カメラ、あるいはヨハン・ゼバスティアン・バッハのブランデンブルク協奏曲のような合奏形態が母体となり、鍵盤楽器を含む通奏低音付きの少人数編成が主流だった。18世紀中ごろ、フランツ・ヨーゼフ・ハイドンが1750年代後半から1760年代にかけて初期の弦楽四重奏曲を書き、1781年には作品33の「ロシア四重奏曲」を完成させた。この6曲でハイドンは4楽章構成と各楽器の対等な対話という弦楽四重奏の型を確立し、多くの音楽史家がここを「弦楽四重奏の父」の出発点とみなす。ヴォルフガング・アマデウス・モーツァルトはハイドンに献呈した6曲の「ハイドン・セット」（1782〜1785年）でその書法を受け継ぎ、1789年にはクラリネット五重奏曲 K.581 を書いて単一楽器の音色を室内楽に持ち込んだ。ルートヴィヒ・ヴァン・ベートーヴェンは作品18の6曲からラズモフスキー四重奏曲を経て、1820年代の後期四重奏曲（作品127、130、131、132、135など）で複雑なフーガ、7楽章構成、大規模な変奏形式を織り込み、このジャンルを哲学的な高みへ押し上げた。フランツ・シューベルトは1819年に歌曲「鱒」を主題にしたピアノ五重奏曲 D667 を、1828年には弦楽五重奏曲 D956 を書き、後者の第2楽章は彼の遺作的な美しさで知られる。ロマン派ではフェリックス・メンデルスゾーンが1825年、16歳で弦楽八重奏曲 作品20 を完成させ、ヨハネス・ブラームスが1864年にピアノ五重奏曲 作品34、1891年にクラリネット五重奏曲 作品115 を残した。19世紀末から20世紀には、クロード・ドビュッシーが1893年に弦楽四重奏曲 作品10 で全楽章を循環主題で結び、モーリス・ラヴェルが1903年に弦楽四重奏曲 ヘ長調 を書いてフランス近代の響きを刻んだ。東欧ではレオシュ・ヤナーチェクが「クレイツェロワ・ソナタ」を、ベラ・バルトークが1908年から1939年にかけて6曲の弦楽四重奏曲を、ドミートリイ・ショスタコーヴィチが1960年に弦楽四重奏曲第8番 作品110 を書いた。第二次世界大戦中、オリヴィエ・メシアンは捕虜収容所で「世の終わりのための四重奏曲」を作曲し、1941年1月15日に初演した。戦後はスティーヴ・ライヒ「18人の音楽家のための音楽」やフィリップ・グラスの弦楽四重奏曲など、ミニマリズムの作曲家もこの編成を多用し、クロノス・カルテットやアルディッティ・カルテットのような弦楽四重奏団が現代作品を積極的に取り上げるようになった。かつて貴族の私的な楽しみだった室内楽は、名手集団による公開演奏と録音を通じて、いまやホールで聴く主要なレパートリーの一つになっている。</p>
