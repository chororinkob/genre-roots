<h1>Chamber Music（チェンバーミュージック）とは</h1>
<p>室内楽は、1つの声部を1人の奏者が担う少人数の器楽アンサンブルだ。ふつう2人から9人くらいの編成を指す。 中心となるのは、2本のヴァイオリン、ヴィオラ、チェロによる弦楽四重奏だ。これにピアノが加わればピアノ五重奏（5人編成）となる</p>
<p>室内楽は、1つの声部を1人の奏者が担う少人数の器楽アンサンブルだ。ふつう2人から9人くらいの編成を指す。

中心となるのは、2本のヴァイオリン、ヴィオラ、チェロによる弦楽四重奏だ。これにピアノが加わればピアノ五重奏（5人編成）となる。「鱒」型の五重奏（シューベルトの「鱒」と同じ編成）は、ピアノ、ヴァイオリン、ヴィオラ、チェロ、コントラバスだ。弦楽器が8本集まれば弦楽八重奏（8人編成）となる。

旋律は各楽器におおむね対等に分配される。第1ヴァイオリンが主題を歌う背後で、チェロが対旋律を、ヴィオラが内声を埋める。こうした対話的な書き方が基本になる。

和声は、調性音楽の機能和声を土台とする。四重奏では基本的に4つの声部で書かれるため、転調や掛留音、倚音の処理がそのまま響きの緊張と弛緩になる。

弦楽器の奏法は多彩だ。弓を弦に密着させるレガート、弓を跳ねさせるスピッカート、弦を指で弾くピッツィカート、2本の弦を同時に鳴らす重音奏法、弱音器を付けたコン・ソルディーノなどがある。これらが楽器間で、会話のように受け渡される。

テンポはおおよそ、アダージョの60 BPM前後からプレストの180 BPM前後まで大きく振れる。拍子は4分の4拍子や4分の3拍子が中心だ。メヌエット・スケルツォは1拍目が強調され、サラバンドは2拍目に軽い強調を置く。

曲はふつう、ソナタ形式の速い楽章、緩徐楽章、メヌエットまたはスケルツォ、ロンド形式（またはソナタ・ロンド形式）が多い終楽章という4楽章構成をとる。

大ホールを埋める轟音ではない。残響の短いサロンや小さなホールで、楽器同士の呼吸が直接届く距離で鳴る音楽だ。</p>
<h2>成り立ち</h2><p>室内楽という語は、イタリア語の musica da camera に由来する。この語は16世紀中葉のイタリアで使われ始め、もともとは、宮廷や貴族の広間（カメラ）で演奏する世俗音楽を指した。家庭向けの器楽は15世紀中ごろから存在し、弦楽四重奏などの近代の室内楽は古典派の時代（18世紀中ごろ以降）に成立した。起源には諸説がある。

バロック期には、トリオ・ソナタ、ソナタ・ダ・カメラ/ダ・キエーザが母体となった。鍵盤楽器を含む通奏低音付きの少人数編成が主流だった。

18世紀中ごろ、フランツ・ヨーゼフ・ハイドンが、推定では1750年代後半から1760年代にかけて、初期の弦楽四重奏曲を書いた。1781年には、作品33の「ロシア四重奏曲」を完成させた。作品33は、スケルツォ（軽快で速い楽章）を取り入れた重要な作品である。弦楽四重奏の型が固まったのは作品9、17、20の頃だ。中でも作品20（1772年）が最初の大きな到達点とされ、出発点は1750年代の初期作品に置かれる。

ヴォルフガング・アマデウス・モーツァルトは、ハイドンに献呈した6曲の「ハイドン・セット」（1782〜1785年）で、その書き方を受け継いだ。1789年にはクラリネット五重奏曲 K.581 を書いた。弦楽四重奏にクラリネットを加えた編成の、最も早く、最も有名な作品の一つとなった。

ルートヴィヒ・ヴァン・ベートーヴェンは、作品18の6曲からラズモフスキー四重奏曲を経て、1820年代の後期四重奏曲（作品127、130、131、132、135など）に至った。複雑なフーガ、7楽章構成、大規模な変奏形式を織り込み、このジャンルを哲学的な高みへ押し上げた。フランツ・シューベルトは、1819年に歌曲「鱒」を主題にしたピアノ五重奏曲 D667 を書いた。1828年には弦楽五重奏曲 D956 を書き、後者の第2楽章は彼の遺作的な美しさで知られる。

ロマン派では、フェリックス・メンデルスゾーンが1825年、16歳で弦楽八重奏曲 作品20 を完成させた。ヨハネス・ブラームスは、1864年にピアノ五重奏曲 作品34、1891年にクラリネット五重奏曲 作品115 を残した。

19世紀末から20世紀には、クロード・ドビュッシーが、1893年に弦楽四重奏曲 作品10 で全楽章を循環主題で結んだ。モーリス・ラヴェルは、1903年に弦楽四重奏曲 ヘ長調 を書いて、フランス近代の響きを刻んだ。東欧では、レオシュ・ヤナーチェクが「クロイツェル・ソナタ」(弦楽四重奏曲第1番ホ短調、1923年作曲、1924年初演)を書いた。ベラ・バルトークは、1908年から1939年にかけて6曲の弦楽四重奏曲を書いた。ドミートリイ・ショスタコーヴィチは、1960年に弦楽四重奏曲第8番 作品110 を書いた。

第二次世界大戦中、オリヴィエ・メシアンは捕虜収容所で「世の終わりのための四重奏曲」を作曲し、1941年1月15日に初演した。

戦後は、ミニマリズムの作曲家もこの編成を多用した。スティーヴ・ライヒの「Different Trains」（1988年。弦楽四重奏と録音テープのための曲で、クロノス・カルテットが初演）や、弦楽四重奏曲を9曲書いたフィリップ・グラスなどがいる。クロノス・カルテットやアルディッティ・カルテットのような弦楽四重奏団も、現代作品を積極的に取り上げるようになった。

かつて貴族の私的な楽しみだった室内楽は、名手集団による公開演奏と録音を通じて、いまやホールで聴く主要なレパートリーの一つになっている。</p>
