<h1>Soft Rock（ソフトロック）とは</h1>
<p>ソフトロックは、ロックの編成を使いながら、攻撃性と音量を抑え、旋律と歌の美しさを前面に出したスタイルだ。単純で旋律的な曲を、大きく豊かな制作で聴かせるのが特徴である。 ギターはアコースティックが中心になることが多い。電気ギターを使</p>
<p>ソフトロックは、ロックの編成を使いながら、攻撃性と音量を抑え、旋律と歌の美しさを前面に出したスタイルだ。単純で旋律的な曲を、大きく豊かな制作で聴かせるのが特徴である。

ギターはアコースティックが中心になることが多い。電気ギターを使う場合も、音は歪ませないことが多い。コーラスやリヴァーブ（揺らしと残響の効果）をかけた、澄んだ音を選ぶ。編成にはピアノ、エレクトリック・ピアノ、そして弦楽合奏や木管が加えられ、豊かな響きを作る。

旋律は音域が広いものもあり、歌いやすさと意外性を両立させる傾向がある。重要なのは声の重ね方で、ハーモニーを重視した多声のコーラスが、しばしば主旋律と同等の役割を担う。

テンポは比較的穏やかなものが多い。ドラムは装飾を抑え、音量も控えめに録音されることが多い。録音技術の面では、各楽器を分離して録り、残響を丁寧に設計した、滑らかな音像が追求される傾向がある。

歌詞は恋愛の機微、別離、日常の風景、内省を扱う。政治的な主張は比較的少ない（Crosby, Stills, Nash &amp; Youngの「Ohio」のように抗議を歌った例外もある）。</p>
<h2>成り立ち</h2><p>1960年代末〜1970年代初頭の米国と英国で、ソフトロックは生まれた。ロックが政治的な激しさと大音量へ向かう一方、その反対方向を選ぶ流れとして形成されたのだ。1969年のオルタモントでの事件や、1970年前後の相次ぐ音楽家の死により、対抗文化の理想が破れた。その疲弊が背景にあったと説明されることがある。

起点の一つとして、1970年のJames TaylorのSweet Baby James、1971年のCarole KingのTapestryが挙げられることがある。とりわけTapestryは、Carole Kingがソロ2作目で、歌う作曲家としての地位を固めた作品だ。彼女は、Brill Buildingおよびその近隣のビル（Aldon Musicのあった1650 Broadway）で職業作曲家として、無数のヒット曲を書いてきた。1970年の『Writer』に続くこの作品は、推定2,500万〜3,000万枚超を売り上げる大成功を収めた。

同じ時期、カリフォルニアのローレル・キャニオン地区に音楽家が集まって住んだ。Joni Mitchell、Crosby, Stills &amp; Nash、Eaglesらローレル・キャニオンのフォーク／ロック系の音楽家たちの音が、ソフトロックと隣接・重複した。多声のコーラスを特徴とするのは、Crosby, Stills &amp; NashとEaglesに限る。

1970年代後半には、Fleetwood Macが1977年のRumoursで、構成員同士の離婚と破局を歌詞にしながら、極めて洗練された音で史上屈指の売上を記録した。Carpentersは、Richard Carpenterの緻密な編曲とKaren Carpenterの低く温かい声により、このスタイルを最もよく表した存在の一つとされる。Karen Carpenterは摂食障害により1983年に32歳で死去し、この病が広く社会に認識される契機となった。

放送の面では、1970年代末にチャート名がアダルト・コンテンポラリー（大人向けの穏やかなポップスの放送区分）となった。80年代にかけて、ソフトロックの流れはそこに吸収された。

批判としては、商業的で無害と評された。人種面の批判は、ヨットロックについて、近年、白人音楽の復興という観点から批判されている。ロック批評の世界では長く軽んじられてきた。だが、2000年代以降、ソフトロックの一部と重なる西海岸系の洗練された音楽が、ヨットロック（洗練された西海岸風ロック。1970年代半ば〜80年代半ばのウェストコースト系が中心）の名で再評価された。</p>
