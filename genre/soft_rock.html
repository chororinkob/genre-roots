<h1>Soft Rock（ソフトロック）とは</h1>
<p>ロックの編成を用いながら、攻撃性と音量を抑え、旋律と歌の美しさを前面に出した様式。BPMは70〜110と穏やかで、ドラムは装飾を排し、音量も控えめに録音される。ギターはアコースティックが中心で、電気ギターを用いる場合も歪ませず、コ</p>
<p>ロックの編成を用いながら、攻撃性と音量を抑え、旋律と歌の美しさを前面に出した様式。BPMは70〜110と穏やかで、ドラムは装飾を排し、音量も控えめに録音される。ギターはアコースティックが中心で、電気ギターを用いる場合も歪ませず、コーラスやリヴァーブをかけた澄んだ音を選ぶ。編成にはピアノ、エレクトリック・ピアノ、そして弦楽合奏や木管が加えられ、豊かな響きを作る。この様式の最大の特徴は和声にあり、ジャズの影響を受けた七度や九度を含む和音、そして予想外の借用和音が用いられ、単純なロックより格段に洗練された響きを持つ。旋律は音域が広く、歌いやすさと意外性を両立させる。決定的に重要なのは声の重ね方で、三度や五度で重ねた多声のコーラスが、しばしば主旋律と同等の役割を担う。録音技術の面では、各楽器を分離して録り、残響を丁寧に設計した滑らかな音像が追求される。歌詞は恋愛の機微、別離、日常の風景、内省を扱い、政治的な主張や反抗はほとんど含まれない。自動車のラジオと家庭のステレオで聴かれることを前提とした、居心地のよさを目的とする音楽である。</p>
<h2>成り立ち</h2><p>1960年代末から1970年代前半の米国で、ロックが政治的な激しさと大音量へ向かう一方、その反対方向を選ぶ流れとして形成された。背景には、1969年のオルタモントでの事件や、1970年前後の相次ぐ音楽家の死により、対抗文化の理想が破れたことへの疲弊がある。直接の起点として、1970年のJames TaylorのSweet Baby James、1971年のCarole KingのTapestryが挙げられる。とりわけTapestryは、Brill Buildingで職業作曲家として無数のヒット曲を書いてきたCarole Kingが、自ら歌い手として立った作品であり、二千数百万枚を売り上げる大成功を収めた。同時期、カリフォルニアのローレル・キャニオン地区に音楽家が集住し、Joni Mitchell、Crosby, Stills &amp; Nash、The Eaglesらが、複雑な和声と多声のコーラスを特徴とする音を作った。1970年代半ばには、Fleetwood Macが1977年のRumoursで、構成員同士の離婚と破局を歌詞にしながら、極めて洗練された音で史上屈指の売上を記録した。Carpentersは、Richard Carpenterの緻密な編曲とKaren Carpenterの低く温かい声により、この様式の完成形を示した。Karen Carpenterは摂食障害により1983年に32歳で死去し、この病が広く社会に認識される契機となった。放送形式としては、米国のラジオでアダルト・コンテンポラリーという区分が確立し、この音楽の受け皿となった。批判としては、この様式が中産階級の白人の趣味に閉じており、無害で退屈だという指摘が当時から繰り返された。ロック批評の世界では長く軽んじられてきたが、2000年代以降、その和声と録音の巧みさが再評価され、ヨットロックという名で愛好されるようになっている。</p>
<h2>代表曲</h2><ul><li>Hotel California (Eagles)</li><li>Dreams (Fleetwood Mac)</li><li>Make It with You (Bread)</li><li>A Horse with No Name (America)</li><li>Summer Breeze (Seals &amp; Crofts)</li></ul>
