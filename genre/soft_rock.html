<h1>Soft Rock（ソフトロック）とは</h1>
<p>ロックの編成を用いながら、攻撃性と音量を抑え、旋律と歌の美しさを前面に出した様式。テンポは比較的穏やかなものが多く、ドラムは装飾を排し、音量も控えめに録音されることが多い。ギターはアコースティックが中心のことが多く、電気ギターを用</p>
<p>ロックの編成を用いながら、攻撃性と音量を抑え、旋律と歌の美しさを前面に出した様式。テンポは比較的穏やかなものが多く、ドラムは装飾を排し、音量も控えめに録音されることが多い。ギターはアコースティックが中心のことが多く、電気ギターを用いる場合も歪ませないことが多く、コーラスやリヴァーブ（揺らしと残響の効果）をかけた澄んだ音を選ぶ。編成にはピアノ、エレクトリック・ピアノ、そして弦楽合奏や木管が加えられ、豊かな響きを作る。この様式は、単純で旋律的な曲を、大きく豊かな制作で聴かせるのが特徴である。ジャズやR&amp;Bの影響は、ヨットロックや一部のアーティストに見られる。旋律は音域が広く、歌いやすさと意外性を両立させることが多い。重要なのは声の重ね方で、ハーモニーを重視した多声のコーラスが、しばしば主旋律と同等の役割を担う。録音技術の面では、各楽器を分離して録り、残響を丁寧に設計した滑らかな音像が追求されることが多い。歌詞は恋愛の機微、別離、日常の風景、内省を扱い、政治的な主張は比較的少ない（Crosby, Stills, Nash &amp; Youngの「Ohio」のように抗議を歌った例外もある）。</p>
<h2>成り立ち</h2><p>1960年代末から1970年代前半の米国と英国で、ロックが政治的な激しさと大音量へ向かう一方、その反対方向を選ぶ流れとして形成された。背景には、1969年のオルタモントでの事件や、1970年前後の相次ぐ音楽家の死により、対抗文化の理想が破れたことへの疲弊があったと説明されることがある。シンガーソングライター系の起点として1970年のJames TaylorのSweet Baby Jamesが、ソフトロックの作品として1971年のCarole KingのTapestryが挙げられることがある。とりわけTapestryは、Brill Buildingおよびその近隣のビル（Aldon Musicのあった1650 Broadway）で職業作曲家として無数のヒット曲を書いてきたCarole Kingが、1970年の『Writer』に続くソロ2作目で、歌う作曲家としての地位を確立した作品であり、推定2500万〜3000万枚超を売り上げる大成功を収めた。同時期、カリフォルニアのローレル・キャニオン地区にフォーク／ロック系の音楽家が集住し、Joni Mitchell、Crosby, Stills &amp; Nash、Eaglesらの音が、ソフトロックと隣接・重複した。多声のコーラスはCrosby, Stills &amp; NashやEaglesの特徴である。1970年代後半には、Fleetwood Macが1977年のRumoursで、構成員同士の離婚と破局を歌詞にしながら、極めて洗練された音で史上屈指の売上を記録した。Carpentersは、Richard Carpenterの緻密な編曲とKaren Carpenterの低く温かい声により、この様式を最もよく体現した存在の一つとされる。Karen Carpenterは摂食障害により1983年に32歳で死去し、この病が広く社会に認識される契機となった。放送形式としては、米国のラジオでアダルト・コンテンポラリー（大人向けの穏やかなポップスの放送区分）という区分が確立し、この音楽の受け皿となった（チャート名がアダルト・コンテンポラリーとなったのは1979年で、ソフトロックの流れがこの区分に吸収されたのは80年代にかけて）。批判としては、商業的で無害だと評された。人種面では、ヨットロックについて、近年、白人音楽の復興という観点から批判されている。ロック批評の世界では長く軽んじられてきたが、2000年代以降、その和声と録音の巧みさが再評価された。ソフトロックの一部と重なる西海岸系の洗練された音楽は、ヨットロック（洗練された西海岸風ロック。1970年代半ば〜80年代半ばのウェストコースト系が中心）という名で愛好されるようになっている。</p>
<h2>代表曲</h2><ul><li>Everything I Do (I Do It for You) (Bryan Adams)</li><li>Hotel California (Eagles)</li><li>Dreams (Fleetwood Mac)</li><li>Make It with You (Bread)</li><li>A Horse with No Name (America)</li><li>Summer Breeze (Seals &amp; Crofts)</li><li>Right Here Waiting (Richard Marx)</li><li>Time in a Bottle (Jim Croce)</li><li>How Deep Is Your Love (Bee Gees)</li><li>(They Long to Be) Close to You (Carpenters)</li><li>Rainy Days and Mondays (Carpenters)</li><li>You're So Vain (Carly Simon)</li><li>It's Too Late (Carole King)</li><li>Lady (Kenny Rogers)</li><li>Year of the Cat (Al Stewart)</li><li>If You Leave Me Now (Chicago)</li><li>Babe (Styx)</li><li>Still the One (Orleans)</li><li>I Can't Tell You Why (Eagles)</li><li>Afternoon Delight (Starland Vocal Band)</li><li>Lonely Boy (Andrew Gold)</li></ul>
