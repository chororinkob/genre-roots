<h1>Musique Concrète（ミュジック・コンクレート）とは</h1>
<p>楽器の演奏ではなく、現実世界で録音された音そのものを素材として構成する音楽。汽車、扉の軋み、水滴、人の声、金属の打撃といった録音物を、テープを切って貼り替える編集、逆回転、速度変更による音程の移動、同じ断片を輪にして繰り返すテープ</p>
<p>楽器の演奏ではなく、現実世界で録音された音そのものを素材として構成する音楽。汽車、扉の軋み、水滴、人の声、金属の打撃といった録音物を、テープを切って貼り替える編集、逆回転、速度変更による音程の移動、同じ断片を輪にして繰り返すテープループ、残響の付加、音量の増減による輪郭の作り替えなどで加工し、元が何の音か分からなくなるまで抽象化していく。この「音源から切り離された聴取」をPierre Schaefferはアクースマティックと呼び、素材となる一片の音を音楽の最小単位として「音響オブジェ」と名づけた。五線譜には書かれず、作品はテープそのもの、のちにはデジタル音声ファイルとして存在する。上演では演奏者が舞台にいない代わりに、客席を取り囲む多数のスピーカー群（アクースモニウム）へ音を配分するディフュージョンという操作が行われ、音が空間を移動する体験自体が作品になる。拍節も調性も持たず、強弱と密度と音色の変化だけで時間を構成する。発振器の電子音から出発したドイツの電子音楽とは出発点が正反対で、こちらはあくまで録音された現実音から始める点が決定的な違いである。</p>
<h2>成り立ち</h2><p>1948年、パリのフランス国営放送（RTF）で、技師であり作曲家でもあったPierre Schaefferが始めた。彼は当時の放送局が持っていた効果音のレコード盤と、溝の一部を輪にして同じ音を繰り返せる閉溝盤を使い、汽車の走行音を素材にした「Étude aux chemins de fer」（鉄道のエチュード）を制作、同年10月5日にラジオで放送した。これが最初のミュジック・コンクレート作品とされる。彼は具体的な音から出発して抽象的な構成へ向かうという方向を、譜面という抽象から出発する従来の作曲と対比させ、コンクレート（具体的）と名づけた。1949年に作曲家Pierre Henryが加わり、二人は1950年に打楽器と加工された人声による長編「Symphonie pour un homme seul」（孤独な人間のための交響曲）を発表する。1951年には正式な研究組織Groupe de Recherche de Musique ConcrèteがRTF内に設立され、世界初の電子音楽スタジオの一つとなった。同年に磁気テープが導入されると、切り貼り編集・逆回転・速度変更が自在になり、技法は一気に洗練される。1958年、組織はGroupe de Recherches Musicales（GRM）として再編され、Luc Ferrari、Bernard Parmegiani、François Bayleらが所属した。1966年にSchaefferが著した『Traité des objets musicaux』（音楽的オブジェ論）は、音を発生源から切り離して聴く態度と、音響オブジェの分類法を体系化した理論書である。同じ頃、ケルンの西ドイツ放送局では発振器による純粋な電子音を志向するElektronische Musikが起こり、パリとケルンは方法論をめぐって激しく対立した。だがKarlheinz Stockhausenは1956年の「Gesang der Jünglinge」（少年の歌）で少年の声の録音と電子音を混ぜ合わせ、両者の境界を無効にしてしまう。1958年のブリュッセル万博では、Le CorbusierとIannis Xenakisが設計したフィリップス館で、Edgard Varèseの「Poème électronique」が425個のスピーカーを使って上演された。その後この方法は現代音楽の枠を越え、The Beatlesの「Revolution 9」、Pink Floydの効果音、インダストリアル、ヒップホップのサンプリング、アンビエントやノイズにまで浸透し、録音物を素材として扱うという発想そのものが二十世紀後半の音楽の共通基盤になっている。</p>
<h2>代表曲</h2><ul><li>Étude aux chemins de fer (Pierre Schaeffer)</li><li>Symphonie pour un homme seul (Pierre Schaeffer &amp; Pierre Henry)</li><li>Gesang der Jünglinge (Karlheinz Stockhausen)</li></ul>
