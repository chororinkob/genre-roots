<h1>Musique Concrète（ミュジック・コンクレート）とは</h1>
<p>楽器の演奏ではなく、現実世界で録音された音そのものを素材として構成する音楽。汽車、扉のきしむ音、水滴、人の声、金属の打撃といった録音物を、テープを切って貼り替える編集、逆回転、速度変更による音程の移動、同じ断片を輪にして繰り返すテ</p>
<p>楽器の演奏ではなく、現実世界で録音された音そのものを素材として構成する音楽。汽車、扉のきしむ音、水滴、人の声、金属の打撃といった録音物を、テープを切って貼り替える編集、逆回転、速度変更による音程の移動、同じ断片を輪にして繰り返すテープループ、残響（響きの尾）の付加、音量の増減による輪郭の作り替えなどで加工し、元が何の音か分からなくなるまで抽象化していく。この「音源から切り離された聴取」を、Jérôme Peignotが1955年の放送などでアクースマティック（音の出どころを見せずに聴くこと）という語で呼び（文章としては1960年に発表）、Schaefferが1966年の『Traité』で採用して理論化した。Schaefferは、素材となる一片の音を、注意によって切り出される知覚の単位として「音響オブジェ」と名づけた。五線譜には書かれず、作品はテープそのもの、のちにはデジタル音声ファイルとして存在する。上演では演奏者が舞台にいない代わりに、客席を取り囲む多数のスピーカー群（アクースモニウム）へ音を配分するディフュージョン（音を各スピーカーへ配分すること）という操作が行われ、音が空間を移動する体験自体が作品になる。旋律・和声・拍の通常の規則に縛られず、音色やスペクトル(音の成分の分布)を重視して、強弱と密度と音色の変化で時間を構成する。発振器（電子音を作る装置）の電子音から出発したドイツの電子音楽とは出発点が正反対で、こちらはあくまで録音された現実音から始める点が当時の決定的な違いとされたが、のちに境界は曖昧になった。</p>
<h2>成り立ち</h2><p>1948年、パリのフランス国営放送（Radiodiffusion Française、略称RDF。翌1949年にRTFへ改組）のスタジオで、技師であり作曲家でもあったPierre Schaefferが始めた。彼はバティニョル駅の機関区で録音した機関車の音を素材に、レコード盤の上で編集して「Étude aux chemins de fer」（鉄道のエチュード）を制作、同年10月5日に、5曲からなる「Cinq études de bruits」の一曲としてラジオで放送した。これが一般に最初のミュジック・コンクレート作品とされる。彼は具体的な音から出発して抽象的な構成へ向かうという方向を、譜面という抽象から出発する従来の作曲と対比させ、コンクレート（具体的）と名づけた。1949年に作曲家Pierre Henryが加わり、2人は1950年に、人声や息、足音などの身体音と日常の物音を素材にターンテーブルで制作した長編「Symphonie pour un homme seul」（孤独な人間のための交響曲）を発表する。1951年には正式な研究組織Groupe de Recherche de Musique ConcrèteがRTF内に設立された（のちにエレクトロアコースティック音楽の拠点となる）。テープレコーダーは1949年に届いていたが、1951年の新スタジオで本格的に使われ始めると、切り貼り編集・逆回転・速度変更が自在になり、技法は一気に洗練される。1958年、組織はGroupe de Recherches Musicales（GRM）として再編され、Luc Ferrari、Bernard Parmegiani、François Bayleらが所属した。1966年にSchaefferが著した『Traité des objets musicaux』（音楽的オブジェ論）は、音を発生源から切り離して聴く態度と、音響オブジェの分類法を体系化した理論書である。1950年代初頭（1951年）には、ケルンの北西ドイツ放送では発振器（電子音を作る装置）による純粋な電子音を志向するElektronische Musikが起こり、パリとケルンは方法論をめぐって対照的な立場にあった。だがKarlheinz Stockhausenは1956年の「Gesang der Jünglinge」（少年の歌）で少年の声の録音と電子音を混ぜ合わせ、パリ（具体音）とケルン（電子音）の二つの方法を初めて統合した。1958年のブリュッセル万博では、Le Corbusierの事務所（実務の中心はIannis Xenakis）が設計したフィリップス館で、Edgard Varèseの「Poème électronique」が資料により325〜450個（約350個とする推定が妥当とされる）のスピーカーを使って上演された。その後この方法は現代音楽の枠を越え、The Beatlesの「Revolution 9」やPink Floydの効果音に影響を与え、インダストリアルなどの先駆の一つとされる。サンプリングに似た手法の起源の一つも、ミュジック・コンクレートにあるとされる（ヒップホップのサンプリングは、一般にジャマイカのダブ系の技法の導入とされる）。</p>
<h2>代表曲</h2><ul><li>Étude aux chemins de fer (Pierre Schaeffer)</li><li>Song of the Second Moon (Kid Baltan)</li><li>De natura sonorum (Bernard Parmegiani)</li><li>Dripsody (Hugh Le Caine)</li><li>Gesang der Jünglinge (Karlheinz Stockhausen)</li><li>Symphonie pour un homme seul (Pierre Schaeffer &amp; Pierre Henry)</li><li>Psyché Rock (Pierre Henry)</li><li>Kontakte (Karlheinz Stockhausen)</li><li>Concret PH (Iannis Xenakis)</li><li>Strette (Pierre Schaeffer)</li><li>Poème électronique (Edgard Varèse)</li><li>Williams Mix (John Cage)</li></ul>
