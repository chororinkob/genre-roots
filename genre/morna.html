<h1>Morna（モルナ）とは</h1>
<p>西アフリカ沖の島国カーボヴェルデに伝わる、憂いを帯びた歌の様式である。テンポは遅く、四拍子でゆったりと進む。編成はアコースティック・ギター、10弦の小型弦楽器であるカヴァキーニョ、ヴァイオリン、クラリネット、そして低音を支えるチェ</p>
<p>西アフリカ沖の島国カーボヴェルデに伝わる、憂いを帯びた歌の様式である。テンポは遅く、四拍子でゆったりと進む。編成はアコースティック・ギター、10弦の小型弦楽器であるカヴァキーニョ、ヴァイオリン、クラリネット、そして低音を支えるチェロやベースで構成される。伴奏は和音を分散させて静かに刻み、歌を邪魔しない位置に留まる。和声はポルトガルの音楽を経由した西洋的なもので、短調が中心となり、そこに切ない響きを生む借用和音が挟まれる。この和声の作りが、アフリカの他の音楽とは大きく異なる性格を与えている。旋律は流麗で、大きく上下する跳躍と、長く伸ばす音が交互に現れる。歌唱は装飾を抑え、感情を抑制して歌うのが良しとされる。使われる言語はカーボヴェルデ・クレオール語で、ポルトガル語とアフリカ諸言語が混ざり合って成立した現地の言葉である。歌詞の主題はほぼ一貫しており、離別、望郷、そしてソダーヂと呼ばれる感情を扱う。これは失われたものへの甘く苦い憧れを指す言葉で、ポルトガル語のサウダーデに対応する。移民として島を離れた者と、残された者の双方の視点から歌われる。</p>
<h2>成り立ち</h2><p>カーボヴェルデは十五世紀にポルトガル人が到達するまで無人島であり、その後、大西洋奴隷貿易の中継地として開発された。すなわちこの国の住民は、ヨーロッパ人とアフリカ大陸から連れてこられた人々の混交によって形成されている。この出自が音楽の性格を決めており、アフリカのリズムとヨーロッパの和声が、対立ではなく最初から一体のものとして存在している。モルナの成立は十八世紀から十九世紀にかけてとされ、当初はボア・ヴィスタ島で生まれた比較的軽快な音楽だったという説が有力である。それが十九世紀を通じて南のブラヴァ島やサン・ヴィセンテ島へ広がる過程で、現在知られる遅く憂いのある形へ変化した。決定的な役割を果たしたのがエウジェニオ・タヴァレスで、十九世紀末から二十世紀初頭にかけて、クレオール語による詩を数多く書き、この様式に文学的な深みを与えた。二十世紀に入ると港町ミンデロが中心となる。この港には各国の船が寄港し、船員を通じてブラジルやアメリカの音楽が持ち込まれた。ここで活動したB・レザが、和声をより洗練させ、現在の型を完成させたとされる。この国の歴史は移民と切り離せない。乾燥した気候による飢饉が繰り返し起き、二十世紀を通じて多くの住民がアメリカやポルトガル、オランダへ渡った。現在、国外に住むカーボヴェルデ系の人口は国内人口を上回っている。離別と望郷が歌の主題であり続けるのは、この現実の反映である。この音楽を世界に知らしめたのがセザリア・エヴォラで、裸足で舞台に立つ姿から裸足の歌姫と呼ばれた。彼女は50代になってから国際的に見出され、2011年に亡くなるまで各国で歌い続けた。2019年、モルナは国際連合教育科学文化機関の無形文化遺産に登録されている。</p>
