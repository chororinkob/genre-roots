<h1>Morna（モルナ）とは</h1>
<p>西アフリカ沖の島国カーボヴェルデに伝わる、憂いを帯びた歌の様式である。テンポは遅く、2拍子または4拍子で記譜されることが多い。編成はアコースティック・ギター、4弦の小型弦楽器であるカヴァキーニョ、10〜12弦の弦楽器ヴィオラ、ヴァ</p>
<p>西アフリカ沖の島国カーボヴェルデに伝わる、憂いを帯びた歌の様式である。テンポは遅く、2拍子または4拍子で記譜されることが多い。編成はアコースティック・ギター、4弦の小型弦楽器であるカヴァキーニョ、10〜12弦の弦楽器ヴィオラ、ヴァイオリン、クラリネット、そして低音を支えるチェロやベースで構成される。伴奏は和音を分散させて静かに刻み、歌を邪魔しない位置に留まる。和声はポルトガルの音楽を経由した西洋的なもので、短調が中心となり、そこに切ない響きを生む7thの経過和音が挟まれる。この和声の作りが、アフリカの他の音楽とは大きく異なる性格を与えている。旋律は流麗で、大きく上下する跳躍と、長く伸ばす音が交互に現れる。歌唱は装飾を抑え、感情を抑制して歌うのが良しとされる。使われる言語はカーボヴェルデ・クレオール語で、ポルトガル語とアフリカ諸言語が混ざり合って成立した現地の言葉である。歌詞の主題は愛、離別、再会、望郷、海、祖国などで、ソダーヂと呼ばれる感情を扱う。これは失われたものへの甘く苦い憧れを指す言葉で、ポルトガル語のサウダーデに対応する。移民として島を離れた者と、残された者の双方の視点から歌われる。</p>
<h2>成り立ち</h2><p>カーボヴェルデは15世紀にポルトガル人が到達するまで無人島であり、その後、大西洋奴隷貿易の中継地として開発された。すなわちこの国の住民は、ヨーロッパ人とアフリカ大陸から連れてこられた人々の混交によって形成されている。この出自が音楽の性格を決めており、モルナはヨーロッパ的な要素が強いとされ、その位置づけ自体が植民地期の政策とも結びついていた。口承では、モルナは18世紀にボア・ヴィスタ島で生まれたとされるが、音楽学的な裏付けはなく、起源は不確実である。当初は速いテンポでユーモラスな歌詞の音楽だったとされる。それがブラヴァ島(南部)や北部のサン・ヴィセンテ島へ広がる過程で、20世紀初頭から1940年代にかけて、現在知られる遅く憂いのある形になった。決定的な役割を果たしたのがエウジェニオ・タヴァレスで、19世紀末から20世紀初頭にかけて、クレオール語による詩を数多く書き、この様式に文学的な深みを与えた。20世紀に入ると港町ミンデロが中心となる。この港は石炭補給港として19世紀に発展し、各国の船が寄港して、ブラジルの音楽の影響が入った。ここで活動したB・レザが、経過和音の使い方を革新し、独自の様式を築いた。この国の歴史は移民と切り離せない。乾燥した気候による飢饉が繰り返し起き、20世紀を通じて多くの住民がアメリカやポルトガル、オランダへ渡った。現在、国外に住むカーボヴェルデ系の人口は国内人口を上回っている。離別と望郷が歌の主題であり続けるのは、この現実の反映である。この音楽を世界に知らしめたのがセザリア・エヴォラで、裸足で舞台に立つ姿から裸足の歌姫と呼ばれた。彼女は40代後半で見出され、50代で世界的に成功した。2010年5月の公演を最後に舞台を退き、2011年に亡くなった。2019年、モルナは国際連合教育科学文化機関の無形文化遺産に登録されている。</p>
