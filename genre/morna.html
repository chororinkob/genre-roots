<h1>Morna（モルナ）とは</h1>
<p>モルナは、西アフリカ沖の島国カーボヴェルデに伝わる、憂いを帯びた歌のスタイルである。 編成は、ギターを中心に、4弦の小型弦楽器であるカヴァキーニョ、10〜12弦の弦楽器ヴィオラ、ヴァイオリン、クラリネット、ピアノ、ベースなどを加え</p>
<p>モルナは、西アフリカ沖の島国カーボヴェルデに伝わる、憂いを帯びた歌のスタイルである。

編成は、ギターを中心に、4弦の小型弦楽器であるカヴァキーニョ、10〜12弦の弦楽器ヴィオラ、ヴァイオリン、クラリネット、ピアノ、ベースなどを加える。低音はアコースティック・ベースなどが受け持つ。ギターは親指で低音を、ほかの指で和音を弾く。和音の弾き方は、アルペジオ、リズムの刻み、その両方を合わせたもののいずれもある。

和声（コードの響き）は、西洋的（ヨーロッパ的）な機能和声に基づいている。短調が中心だ。基本になるのは、主・下属・属七の和音を巡る循環進行である。後に、B・レザが経過和音を取り入れ、和声を豊かにした。モルナの起源には諸説ある。

旋律はなめらかで美しい。上がっていく音の並びと下がっていく音の並びを繰り返し、小節の終わりの音を次の小節の強い拍まで延ばすシンコペーションが特徴である。テンポは遅い。楽譜では2拍子が基本で、ときに4拍子で書かれる。

歌は装飾を控えめにし、抑えた歌い方が特徴とされる。

使われる言語は、主にカーボヴェルデ・クレオール語だ。ポルトガル語とアフリカ諸言語が混ざり合ってできた、現地の言葉である。歌詞の主題は、愛、離別、再会、望郷、海、祖国など。ソダーヂと呼ばれる感情を扱う。失われたものへの甘く苦い憧れを指す言葉で、ポルトガル語のサウダーデに当たる。歌は、移民として島を離れた者と、残された者の、両方の視点から歌われる。</p>
<h2>成り立ち</h2><p>カーボヴェルデは、15世紀にポルトガル人がたどり着くまで無人島だった。その後、大西洋奴隷貿易の中継地として開発された。そのため、この国の住民は、ヨーロッパ人と、アフリカ大陸から連れてこられた人々が混ざり合って形づくられている。

モルナには、ヨーロッパ的な要素とアフリカ的な要素の両方が指摘されており、起源に定説はない。クラリダーデ世代の文化政治の中で、モルナは混血的な民衆の伝統として位置づけられた。

口伝えでは、モルナは18世紀にボア・ヴィスタ島で生まれたとされる。ただし音楽学的な裏付けはなく、起源ははっきりしない。初めは速いテンポで、ユーモラスな歌詞の音楽だったとされる。

それがブラヴァ島(南部)や北部のサン・ヴィセンテ島へ広がっていく中で、20世紀初頭から1940年代にかけて、今知られている遅く憂いのある形になった。エウジェニオ・タヴァレスは、20世紀初頭にモルナにロマン主義的な叙情性をもたらした主な人物の一人である。彼は詩を、ブラヴァ島のクレオール語を中心に、ポルトガル語でも書いた。

20世紀に入ると、港町ミンデロが中心になる。この港は19世紀に石炭の補給港として発展し、各国の船が立ち寄った。そこからブラジルの音楽の影響が入ってきた。ここで活動したB・レザが、経過和音の使い方を新しくし、独自のスタイルを築いた。

一方、この国の歴史は移民と切り離せない。乾燥した気候のせいで飢饉（食べ物が極端に不足すること）が何度も起き、20世紀を通じて多くの住民がアメリカやポルトガル、オランダへ渡った。今では、国外に住むカーボヴェルデ系の人口が、国内の人口を上回っている。離別と望郷が歌の主題であり続けるのは、この現実を映している。

この音楽を世界に広めたのが、セザリア・エヴォラだ。裸足で舞台に立つ姿から、裸足の歌姫と呼ばれた。ただし、その由来には諸説ある。彼女は40代半ばから後半で見出され、50代で世界的な成功を収めた。2010年5月8日のリスボン公演の後、心臓発作で手術を受けたが、同じ年の10月に公演を再開した。2011年3月から7月にも公演を行っている。そして2011年9月23日に引退を表明し、同じ年の12月17日に亡くなった。

2019年、モルナは国際連合教育科学文化機関の無形文化遺産に登録された。</p>
