<h1>Mathcore（マスコア）とは</h1>
<p>ハードコア・パンクとメタルを土台に、拍子と構成を極限まで複雑にした音楽。最大の特徴は拍節の扱いで、不規則な拍子や、複数の拍子を重ねるポリメーターが用いられ、聴き手が拍を数えることを放棄せざるをえない状態が作られる。しかも変拍子は装</p>
<p>ハードコア・パンクとメタルを土台に、拍子と構成を極限まで複雑にした音楽。最大の特徴は拍節の扱いで、不規則な拍子や、複数の拍子を重ねるポリメーターが用いられ、聴き手が拍を数えることを放棄せざるをえない状態が作られる。しかも変拍子は装飾ではなく主目的で、リフそのものが不規則な長さで書かれている。ギターは不協和音を積極的に用い、半音や増4度を含む和音を歪ませて鳴らし、指板の上を跳躍する。ドラムは高度な技術を要求され、超高速の連打から突然の停止、拍の頭を意図的に外した叩き方まで、曲の中で何度も奏法が切り替わる。テンポも一曲の中で変化する。曲の構成は反復を避け、次々に別の場面へ移る。歌唱は絶叫と悲鳴が中心である。歌詞は、悲観的、反抗的、怨恨的、あるいは皮肉な視点で書かれたものが多く、哲学的・詩的な表現も見られる。演奏の場は小さなライブハウスが中心である。</p>
<h2>成り立ち</h2><p>1990年代に発展した。1980年代のポストハードコアに先行例があり、1990年代半ばにかけて複数の土地で先駆バンドが現れた。ニュージャージー州のDeadguyや、ニューヨークのCandiriaが不規則な構造を持ち込んだが、決定的だったのはマサチューセッツ州セイラムで1990年に結成されたConverge、そしてニュージャージーのThe Dillinger Escape Planである。Dillingerが1999年に発表した『Calculating Infinity』は、極めて技術的で速い演奏で、この様式の基準を打ち立てた。名称のマスコアは主に音楽ジャーナリストが使った呼び名で、以前は「カオティック・ハードコア」や「ノイズコア」と呼ばれていた。ミュージシャン自身は使わない傾向があり、Bannonも「マスコアが何なのかよく分からない」と述べている。Convergeは2001年の『Jane Doe』で、複雑さと感情の激しさを両立させ、ハードコアの歴史に残る作品とされた。この作品は歌手Jacob Bannon自身の恋愛関係の解消を主題として生まれており、Kurt Ballouが1998年に設立したGodCityスタジオでは、Converge自身の作品を含め、のちに多くの重量級作品が録音された。レーベルではRelapse Records、Hydra Head Records、Deathwish Inc.が受け皿となった。Dillingerの音は、Cynic、Meshuggah、Death、King Crimsonといったバンドやジャズフュージョンから着想を得ている。Dillingerは2002年、Mike Pattonを迎えた作品でさらに実験を進めた。1990年代にはBotch（1993年結成）やCoalesce（1994年結成）が並び立ち、2000年代にはDaughters、Genghis Tron、イギリスのRolo Tomassiが続いた。日本ではEnvyやHeaven in Her Armsが、同時代の隣接するシーンにいた。Dillingerは2016年に解散を発表し、バンドとして一つの主題的な結論に達したことを理由に、2017年12月29日の最終公演で活動を終えたが、2023年には創設ボーカルのDimitri Minakakisを迎え、結成周年の公演で再結成した。</p>
<h2>代表曲</h2><ul><li>Milk Lizard (The Dillinger Escape Plan)</li><li>Map Change (Every Time I Die)</li><li>Black Bubblegum（The Dillinger Escape Plan）</li><li>43% Burnt（The Dillinger Escape Plan）</li><li>Dissect Yourself (Car Bomb)</li><li>Concubine（Converge）</li><li>Panasonic Youth (The Dillinger Escape Plan)</li><li>The Surge (Ion Dissonance)</li><li>Giraffes? Giraffes!（I Am S/H(im)e[r] as You Am S/H(im)e[r] as You Are Me and We Am I and I Are All Our Together）</li><li>To Our Friends in the Great White North（Botch）</li><li>Jealous Again (Coalesce)</li></ul>
