<h1>Mathcore（マスコア）とは</h1>
<p>ハードコア・パンクとメタルを土台に、拍子と構成を極限まで複雑にした音楽。最大の特徴は拍節の扱いで、五拍子、七拍子、11拍子、13拍子が数小節ごとに入れ替わり、聴き手が拍を数えることを放棄せざるをえない状態が作られる。しかも変拍子は</p>
<p>ハードコア・パンクとメタルを土台に、拍子と構成を極限まで複雑にした音楽。最大の特徴は拍節の扱いで、五拍子、七拍子、11拍子、13拍子が数小節ごとに入れ替わり、聴き手が拍を数えることを放棄せざるをえない状態が作られる。しかも変拍子は装飾ではなく主目的で、リフそのものが不規則な長さで書かれている。ギターは不協和音を積極的に用い、半音や増四度を含む和音を歪ませて鳴らし、指板の上を跳躍する。ドラムは高度な技術を要求され、超高速の連打から突然の停止、拍の頭を意図的に外した叩き方まで、曲の中で何度も奏法が切り替わる。テンポも一曲の中で二倍三倍と変動する。曲の構成は反復を避け、提示された音型が二度と戻らないまま次々に別の場面へ移り、一分半で終わる曲も珍しくない。歌唱は絶叫と悲鳴が中心で、旋律は基本的に存在しない。ただし突然、静かなジャズやアンビエントの断片が挿入されることがあり、この落差も様式の一部である。歌詞は難解で抽象的、あるいは自己破壊的な内容が多い。演奏の場は小さなライブハウスで、観客は拍を取れないため、規則的に跳ねるのではなく痙攣的に動くことになる。</p>
<h2>成り立ち</h2><p>起点は1990年代前半のアメリカ東海岸である。ニュージャージー州のDeadguyや、ニューヨークのCandiriaが不規則な構造を持ち込んだが、決定的だったのはマサチューセッツ州セイラムで1997年に結成されたConverge、そしてニュージャージーのThe Dillinger Escape Planである。Dillingerが1999年に発表した『Calculating Infinity』は、ほぼ全曲が変拍子で書かれ、演奏の精度が異常に高く、この様式の基準を打ち立てた。名称のマスコアは、当時の音楽誌が数学のように複雑だと評したところから広まった呼び名で、当事者の多くは嫌っている。Convergeは2001年の『Jane Doe』で、複雑さと感情の激しさを両立させ、ハードコアの歴史に残る作品とされた。この作品はギタリストKurt Ballouと歌手Jacob Bannonの個人的な破局から生まれており、Ballouが運営するGodCityスタジオはその後、この界隈の録音の拠点となった。レーベルではRelapse Records、Hydra Head Records、Deathwish Inc.が受け皿となった。背景には、1990年代のハードコアが単純化し商業化したことへの反発と、同時期のプログレッシブ・ロックやジャズの再評価がある。Dillingerは2002年、Mike Pattonを迎えた作品でさらに実験を進めた。2000年代にはBotch、Coalesce、Daughters、Genghis Tron、イギリスのRolo Tomassiが続き、日本ではEnvyやHeaven in Herが近い位置にいた。ただし演奏の難度が極端に高く、聴き手も限られるため、商業的に成立させることは常に困難だった。Dillingerは2017年、ドラマーの事故と長年の消耗を経て解散している。</p>
<h2>代表曲</h2><ul><li>Black Bubblegum（The Dillinger Escape Plan）</li><li>43% Burnt（The Dillinger Escape Plan）</li><li>Concubine（Converge）</li><li>To Our Friends in the Great White North（Botch）</li><li>Giraffes? Giraffes!（I Am S/H(im)e[r] as You Am S/H(im)e[r] as You Are Me and We Am I and I Are All Our Together）</li></ul>
