<h1>Mathcore（マスコア）とは</h1>
<p>マスコアは、ハードコア・パンクとメタルを土台に、拍子と構成を極限まで複雑にした音楽だ。 特徴は拍の扱いにある。不規則な拍子や、複数の拍子を重ねるポリメーターが用いられ、聴き手が拍を数えるのが難しい状態が作られる。テンポも一曲の中で</p>
<p>マスコアは、ハードコア・パンクとメタルを土台に、拍子と構成を極限まで複雑にした音楽だ。

特徴は拍の扱いにある。不規則な拍子や、複数の拍子を重ねるポリメーターが用いられ、聴き手が拍を数えるのが難しい状態が作られる。テンポも一曲の中で変化する。

ギターは不協和音を積極的に用いる。初期のバンドはほぼ無調で、ポリフォニックな不協和を奏でた。タッピングやスウィープも使う。ギターのリフは絶えず変化し、1つの部分の後はほとんど繰り返されない。

ドラムは高度な技術を要求され、シンコペーションやテンポチェンジを多用する。曲の構成は反復を避け、次々に別の場面へ移る。

歌唱は絶叫と悲鳴が中心だが、メロディックな歌唱も時に含まれる。初期のマスコアの歌詞は、悲観的、反抗的、恨みを込めた、あるいは皮肉な視点で書かれたものが多く、哲学的・詩的な表現も見られる。

演奏の場では、同期した照明や、乱闘・怪我を伴う混沌とした演奏が特徴として挙げられる。</p>
<h2>成り立ち</h2><p>マスコアは、1990年代に発展した。1980年代のポストハードコアに先行例があり、1990年代半ばにかけて、複数の土地で先駆けとなるバンドが現れた。

ニュージャージー州のDeadguyや、ニューヨークのCandiriaが、不規則な構造を持ち込んだ。このスタイルを固めた存在としては、Converge、Botch、Coalesce、The Dillinger Escape Planが同列に挙げられる。先行者としては、Dazzling Killmen、Craw、Rorschachが挙げられる。Convergeは1990年にマサチューセッツ州セイラムで結成されたが、後に自分たちが「relevant」と考える音楽を書き始めたのは1994年である。

Dillingerが1999年に発表した『Calculating Infinity』は、非常に技術的で速い演奏で、このスタイルの基準を打ち立てた。名称のマスコアは、主に音楽ジャーナリストが使った呼び名で、以前は「カオティック・ハードコア」や「ノイズコア」と呼ばれていた。ミュージシャン自身は使わない傾向があり、Bannonも「マスコアが何なのかよく分からない」と述べている。

Convergeは2001年の『Jane Doe』で、複雑さと感情の激しさを両立させた。この作品は、メタルコアの名盤リストに入っているという評価を受けた。作品は歌手Jacob Bannon自身の恋愛関係の解消を主題として生まれた。Kurt Ballouが1990年代半ばから複数の拠点で運営してきたGodCityスタジオは、現在のセイラムの拠点が2003年に設立されたものだ。ここでは、Converge自身の作品を含め、のちに多くの重量級作品が録音された。レーベルではRelapse Records、Hydra Head Records、Deathwish Inc.が受け皿となった。

Dillingerの音は、Cynic、Meshuggah、Death、King Crimsonといったバンドやジャズフュージョンから着想を得ている。Dillingerは2002年、Mike Pattonを迎えた作品で、さらに実験を進めた。

1990年代にはBotch（1993年結成）やCoalesce（1994年結成）が並び立った。2000年代には、Daughters、Genghis Tron、イギリスのRolo Tomassiが続いた。日本ではEnvyやHeaven in Her Armsが、同時代の隣り合う音楽の世界にいた。

Dillingerは2016年に活動終了を発表した。バンドとして一つの主題的な結論に達したことを理由に、2017年12月29日の最終公演で活動を終えた。しかし、2023年12月12日に創設ボーカルのDimitri Minakakisを迎えた再結成を発表し、2024年6月21日の初公演は、『Calculating Infinity』の発表25周年を記念する公演だった。</p>
<h2>代表曲</h2><ul><li>Milk Lizard (The Dillinger Escape Plan)</li><li>Map Change (Every Time I Die)</li><li>Black Bubblegum（The Dillinger Escape Plan）</li><li>43% Burnt（The Dillinger Escape Plan）</li><li>Dissect Yourself (Car Bomb)</li><li>Concubine（Converge）</li><li>Panasonic Youth (The Dillinger Escape Plan)</li><li>The Surge (Ion Dissonance)</li><li>Giraffes? Giraffes!（I Am S/H(im)e[r] as You Am S/H(im)e[r] as You Are Me and We Am I and I Are All Our Together）</li><li>To Our Friends in the Great White North（Botch）</li><li>Jealous Again (Coalesce)</li></ul>
