<h1>Zouk（ズーク）とは</h1>
<p>ズークは、カリブ海のフランス領アンティル諸島にあるグアドループとマルティニークで生まれたダンス音楽だ。 土台には、両島に伝わる打楽器の音楽(グアドループ固有のグウォカ太鼓など)、ハイチのコンパ、19世紀から続く踊りの音楽ビギンなど</p>
<p>ズークは、カリブ海のフランス領アンティル諸島にあるグアドループとマルティニークで生まれたダンス音楽だ。

土台には、両島に伝わる打楽器の音楽(グアドループ固有のグウォカ太鼓など)、ハイチのコンパ、19世紀から続く踊りの音楽ビギンなどがある。それを1980年代の最新の電子機材で現代化した点が、革新だった。初期のズークには強力なホーン・セクションがあり、シンセサイザーやドラムマシンも一緒に使われた。

テンポは、初期には120から145 BPMほどと速い(のちのズーク・ラヴは約95〜100 BPMまで遅くなった)。リズムは、トレシージョ系の3＋3＋2型のパターンと4つ打ちが重なる(数え方には諸説ある)。速いズークは謝肉祭と結びついている。いくつもの打楽器のパターンが重なる。

歌は、複数の声を重ねた分厚い合唱が特徴だ。

大切なのは言葉だ。初期のKassav'は、フランス語ではなく、アンティル諸島のクレオール語で歌った。クレオール語で歌うこと自体が、一つの文化的な声明と受け止められた。のちにズークが国際化するにつれ、歌詞はフランス語に移っていった。とくにズーク・ラヴは、主にフランス語で歌われる。歌詞は恋愛、祝祭、島の日常を扱う。同時に、初期には、自分たちの言葉で歌うこと自体が政治的な行為と受け止められることもあった。

より遅く、官能的な形も生まれている。</p>
<h2>成り立ち</h2><p>グアドループとマルティニークは、17世紀からフランスの植民地だった。1946年には海外県（フランス本国と同じ県の扱い）として、フランスに統合された。この統合は、島の人々に市民権をもたらした。その一方で、クレオール語を劣った方言として扱い、フランス本国の文化への同化を強いるものでもあった。

この状況を変えたのが、1979年に結成されたKassav'である。結成のきっかけは、Pierre-Édouard DécimusとFreddy Marshallにさかのぼるとされる。ギタリストのJacob Desvarieuxがパリの録音技術を持ち込み、Georges Décimusが低音を受け持った。1980年代前半には、Jocelyne BéroardやJean-Philippe Marthélyらが歌手として加わり、編成が整っていく。彼らが目指したのは、島の伝統音楽を現代的な要素と融合して、革新することだった。

1984年に発表された楽曲は、この音楽こそが我々の唯一の薬だという意味の題名を持っていた。この曲は、島の外へ爆発的に広まった。パリに暮らす膨大な数のアンティル系移民が、この音楽を故郷との絆として受け入れたことも、広まるのを後押しした。

1980年代半ばからは、彼らはアフリカ大陸でも絶大な人気を得る。アンゴラでは、センバとズークの融合からキゾンバが生まれた(時期は1980年代前後とされ、Kassav'の波及が直接の原因かどうかは議論がある)。カーボベルデ起源を主張する声もあるが、一般にはアンゴラ(ルアンダ)発祥とされる。ブラジルでは、1990年代初めにランバダから発展した踊りが、ブラジリアン・ズークとして定着した。

2021年、Jacob Desvarieuxが新型の感染症で亡くなった。これは、この音楽の歴史にとって大きな喪失となった。それでも、クレオール語で歌うことが誇りになったという転換の意義は、音楽の枠を超えている。</p>
