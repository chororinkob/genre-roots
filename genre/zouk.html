<h1>Zouk（ズーク）とは</h1>
<p>カリブ海のフランス領アンティル諸島、グアドループとマルティニークで生まれたダンス音楽である。土台には両島の伝統的な打楽器音楽と、19世紀からの舞踏音楽ビギンがあるが、それを1980年代の最新の電子機材で全面的に作り直した点が革新だ</p>
<p>カリブ海のフランス領アンティル諸島、グアドループとマルティニークで生まれたダンス音楽である。土台には両島の伝統的な打楽器音楽と、19世紀からの舞踏音楽ビギンがあるが、それを1980年代の最新の電子機材で全面的に作り直した点が革新だった。テンポは概ね120から130 BPMと速く、リズムは謝肉祭の行進に由来する跳ねた二拍子を基調とする。打点は極めて細かく分割され、複数の打楽器の音型が互いにずれながら噛み合う。低音は太く短い音を裏拍に置き、そこへシンセサイザーによる金管を模した鋭い刺し込みが重なる。ギターは高音域で歯切れよく刻み、和音はメジャーセブンスなど明るく開かれた響きが好まれる。歌唱は複数の声を重ねた分厚い合唱が特徴で、男女の掛け合いも多用される。決定的に重要なのは言語で、フランス語ではなくアンティル諸島のクレオール語が用いられる。これは単なる選択ではなく、宗主国への同化圧力に対する明確な文化的主張である。歌詞は恋愛、祝祭、島の日常を扱うが、同時に自分たちの言葉で歌うこと自体が政治的な行為となっている。より遅く官能的な形態も派生している。</p>
<h2>成り立ち</h2><p>グアドループとマルティニークは、17世紀以来フランスの植民地であり、1946年には海外県としてフランスに統合された。この統合は市民権をもたらす一方、クレオール語を劣った方言として扱い、フランス本国の文化への同化を強いるものでもあった。1970年代、島の若者たちは、自分たちの音楽が本国の流行歌の劣化版として扱われることに強い不満を抱いていた。この状況を変えたのが、1979年に結成されたKassav'である。中心となったPierre-Édouard Décimusは、島の謝肉祭で用いられる打楽器のリズムを、当時最新のシンセサイザーとリズムマシンで再構築するという構想を持っていた。ギタリストのJacob Desvarieuxがパリの録音技術を持ち込み、Georges Décimusが低音を担い、後にJocelyne BéroardとJean-Philippe Marthélyが歌手として加わって、編成が完成する。彼らの方針は明確だった。すなわち、国際的な水準の録音と演奏によって、クレオール語の音楽が二流ではないことを証明することである。1984年に発表された楽曲は、この音楽こそが我々の唯一の薬だという意味の題名を持ち、島の外へ爆発的に広まった。パリに暮らす膨大な数のアンティル系移民が、この音楽を故郷との絆として受け入れたことも普及を後押しした。1980年代後半には、彼らはアフリカ大陸でも絶大な人気を得る。この波及は思わぬ結果を生んだ。ポルトガル語圏のカーボベルデやアンゴラでは、この音楽の遅く官能的な形態が独自に発展し、キゾンバと呼ばれる新しい様式が生まれる。ブラジルでは、それに合わせた密着型の踊りが独立した文化として定着した。2021年、Jacob Desvarieuxが新型の感染症により死去したことは、この音楽の歴史における大きな喪失となった。それでも、クレオール語で歌うことが誇りとなるという転換は不可逆であり、その意義は音楽の枠を超えている。</p>
