<h1>Afrobeat（アフロビート）とは</h1>
<p>西アフリカのリズムに、ジャズとファンクの要素を接続した大編成の音楽。楽団は大人数で、ドラムセット、コンガ、シェケレ（網をかけた瓢箪の振り物）、木片を打つクラベス（木の棒を打ち合わせる楽器）などの打楽器群、電気ギター2本以上、ベース</p>
<p>西アフリカのリズムに、ジャズとファンクの要素を接続した大編成の音楽。楽団は大人数で、ドラムセット、コンガ、シェケレ（網をかけた瓢箪の振り物）、木片を打つクラベス（木の棒を打ち合わせる楽器）などの打楽器群、電気ギター2本以上、ベース、そしてサックス（バリトンやテナー）とトランペットからなるホーンセクション（管楽器の組）で構成され、Fela本人の鍵盤と女性コーラスも加わる。曲は極めて長く、10分から30分に及び、多くの曲は、前半に器楽の長い展開があり（録音によってはPart 1とPart 2に分かれる）、少数の和音（単一、または二つの和音の往復が多い）の上に、各楽器が異なる周期の反復音型を重ねていく。この多層的な絡み合いが、単純な繰り返しに聴こえながら、複雑に交差するリズムの緻密な織物を作る。多くの曲は長い器楽の導入のあとに歌が入り、リード歌手と合唱の掛け合いになる。歌唱は主にナイジェリア・ピジン英語で、一部ヨルバ語の曲もあり、内容は多くの曲で、軍事政権への批判、汚職の告発、警察の暴力、そしてアフリカ人としての誇りという、極めて政治的な主題を扱う。</p>
<h2>成り立ち</h2><p>1960年代後半のナイジェリアで（確立と全盛は1970年代）、Fela Anikulapo Kuti（1938年から1997年）が、ドラマーのTony Allenとともに作り上げた。彼は中産階級の家庭に生まれ、母Funmilayo Ransome-Kutiは女性参政権運動の指導者だった。ロンドンのトリニティ音楽院でトランペットを学び、帰国後はハイライフ（ガーナ発祥の大衆音楽）とジャズを混ぜた音楽を演奏していたが、決定的な転機は1969年の米国滞在である。ロサンゼルスでブラックパンサー党の活動家Sandra Smithと出会い、Malcolm Xの著作やブラック・パワー運動に触れたことで、音楽を政治の武器として用いる方向へ舵を切った。帰国後、楽団名をNigeria 70と改め、のちにAfrica '70（Afrika '70）と呼ぶようになり、ラゴスに自らの共同体カラクタ共和国と、演奏の場アフリカ・シュラインを設立した。1970年代を通じて、Zombie（1976年）で軍隊を思考しない死者と呼ぶなど、直接的な政権批判を続けた。報復は激しく、1977年2月、1000人規模の兵士がカラクタを襲撃し、建物を焼き払い、Felaは重傷を負い、76歳の母は二階から投げ落とされ、翌年に死亡した。Felaはその後、母の棺を軍の兵舎の門前に置くという行動で応じている。彼は生涯に何度も逮捕され（100回を大きく超えるという推計があり、200回超とする説もある）、1984年には通貨密輸の罪で五年の刑を受けたが、国際的な抗議（Amnestyなど）もあり、約20か月後に、政権交代後のBabangida将軍により釈放された。ドラマーのTony Allenは、Felaとともにアフロビートを共同で創り上げたドラマー兼音楽監督で、Fela自身がTony Allenなくしてアフロビートはないと述べたと伝えられる。Felaは1997年に58歳で死去した。兄のOlikoye Ransome-Kutiは死因を心不全(エイズの合併症による)と発表したが、Fela自身はエイズの存在自体を否定していたことでも知られ、未亡人は死因がエイズではないと主張している。その死は大きな衝撃を与えた。以後、息子のSeun Kutiが父の楽団Egypt 80を引き継ぎ、兄のFemi Kutiも1986年に自身のバンドを結成して活動を続け、また米国のAntibalas をはじめ世界各地に演奏団体が生まれている。</p>
