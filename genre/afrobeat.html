<h1>Afrobeat（アフロビート）とは</h1>
<p>アフロビートは、西アフリカのリズムに、ジャズとファンクの要素を接続した、大編成の音楽だ。 楽団は大人数で、打楽器群、電気ギター2本以上、ベース、ホーンセクション（管楽器の組）、Fela本人の鍵盤（電子ピアノやオルガン）、女性コーラ</p>
<p>アフロビートは、西アフリカのリズムに、ジャズとファンクの要素を接続した、大編成の音楽だ。

楽団は大人数で、打楽器群、電気ギター2本以上、ベース、ホーンセクション（管楽器の組）、Fela本人の鍵盤（電子ピアノやオルガン）、女性コーラスなどで構成される。打楽器群は、ドラムセット、コンガ、シェケレ（網をかけた瓢箪の振り物）、クラベス（木の棒を打ち合わせる楽器）などだ。ホーンセクションは、サックス（バリトン／テナー）とトランペット（2本）からなる。

和音進行は少数で静的で、単一〜数個の和音と、ドリアン調が中心だ。その上に、各楽器が異なる周期の反復音型を重ねていく。ギターは高音域で短い音型を刻み、ベースは低音で別の周期を保ち、打楽器はさらに別の周期で動くことが多い。この多層的な絡み合いが、単純な繰り返しに聴こえながらほとんど同じにならない緻密な織物を作る。

多くの曲は、長い器楽の導入のあとに歌が入り、リード歌手と合唱の掛け合いになる。歌唱は主にナイジェリア・ピジン英語で、一部ヨルバ語の曲もある。

多くの曲は、軍事政権への批判、汚職の告発、警察の暴力、そしてアフリカ人としての誇りという、極めて政治的な主題を扱う。

曲は長く、10分から30分に及ぶことが多い。多くの曲は、前半に器楽の長い展開がある（録音によってはPart 1とPart 2に分かれる）。</p>
<h2>成り立ち</h2><p>舞台は、1960年代後半のナイジェリアだ。Fela Anikulapo Kuti（1938年から1997年）が、ドラマーのTony Allenとともに、この音楽を作り上げた。定着して全盛を迎えたのは、1970年代である。

彼は中産階級の家庭に生まれ、母Funmilayo Ransome-Kutiは女性参政権運動の指導者だった。ロンドンのトリニティ音楽院でトランペットを学び、帰国後はハイライフ（ガーナ発祥の大衆音楽）とジャズを混ぜた音楽を演奏していた。

決定的な転機は、1969年の米国滞在である。ロサンゼルスでブラックパンサー党の支持者とされるSandra Smithと出会い、Malcolm Xの著作などブラック・パワー運動の思想に触れた。これをきっかけに、音楽を政治の武器として用いる方向へ舵を切った。

帰国後に楽団名をNigeria 70と改称し、のちAfrica '70（Afrika '70）となり、さらに後にEgypt 80となった。彼はラゴスに、自らの共同体カラクタ共和国と、演奏の場アフリカ・シュラインを設立した。1970年代を通じて、Zombie（1976年）で軍隊を思考しない死者と呼ぶなど、直接的な政権批判を続けた。

しかし、報復は激しかった。1977年2月、1000人規模の兵士がカラクタを襲撃し、建物を焼き払った。Felaは重傷を負い、76歳の母は二階から投げ落とされ、翌年に死亡した。Felaはその後、母の棺を軍の兵舎の門前に置くという行動で応じている。

彼は生涯に、100回を大きく超えて（推計。200回超とする説もある）逮捕された。1984年には通貨密輸の罪で五年の刑を受けたが、国際的な抗議（Amnestyなど）もあり、約20か月後に、政権交代後のBabangida将軍により釈放された。

Tony Allenは、Felaとともにアフロビートを共同で創り上げたドラマー／音楽監督である。Felaは「Tony Allenなくしてアフロビートはない」と述べたと伝えられる。

Felaは1997年に58歳で死去した。兄のOlikoye Ransome-Kutiは、死因を心不全(エイズの合併症による)と発表した。しかしFela自身はエイズの存在自体を否定していたことでも知られ、未亡人は死因がエイズではないと主張している。その死は大きな衝撃を与えた。

以後、息子のSeun Kutiが父の楽団Egypt 80を引き継いだ。兄のFemi Kutiも1986年に自身のバンドを結成して活動を続けた。また米国のAntibalasをはじめ、世界各地に演奏団体が生まれている。</p>
