<h1>Rock（ロック）とは</h1>
<p>エレクトリック・ギター、ベース、ドラムを基本編成とし、増幅された音の力で押し出す大衆音楽の総称。拍子はほぼ4分の4で、ドラムのバスドラムが1拍目と3拍目、スネアが2拍目と4拍目に置かれる、いわゆるバックビートが骨格をなす。この2拍</p>
<p>エレクトリック・ギター、ベース、ドラムを基本編成とし、増幅された音の力で押し出す大衆音楽の総称。拍子はほぼ4分の4で、ドラムのバスドラムが1拍目と3拍目、スネアが2拍目と4拍目に置かれる、いわゆるバックビートが骨格をなす。この2拍目と4拍目の強調は、ブルース、R&amp;B、ジャズ、カントリーなど複数の系統に由来するとされる。ギターは真空管アンプを歪ませたディストーションを基本音色とし、パワー・コードと呼ばれる根音と5度だけの和音を用いることで、歪んでも濁らない厚みを得る。この5度和音は3度を含まないため長調とも短調とも決まらず、その曖昧さが攻撃性と結び付く。ベースは根音を刻んで低音を支え、ドラムとの一体感、いわゆるグルーヴを作る。曲構成はヴァース、コーラス、ブリッジという歌ものの型を基本とし、間奏にギター・ソロを置くことが多い。歌詞は反抗、恋愛、社会批判、自己の内面など幅広い。パンクなど一部の流れは、演奏の技術より態度と衝動を重んじたが、プログレッシヴ・ロックのように技術を重んじる流れも同時にある。</p>
<h2>成り立ち</h2><p>ロックンロールは1940年代後半〜50年代初頭に米国で形成され、1960年代半ば以降に「ロック」として多様化した。黒人音楽であるリズム・アンド・ブルースを中心に、ブギウギ、ゴスペル、ジャンプ・ブルース、白人音楽であるカントリーなど、いくつもの音楽が、南部や南西部のほか、シカゴなど各地で混ざり合って生まれた。大きな役割を果たしたとされるのがメンフィスのSun Recordsで、経営者Sam Phillipsは黒人音楽を白人の歌手に歌わせることを構想したと伝えられ、1954年7月にElvis PresleyのThat's All Right（Arthur Crudupの曲）を録音した。これを最初のロックンロールの盤とみなすかどうかには議論があり、Sam Phillipsが1951年にMemphis Recording Serviceで録音し、Chess Recordsから発売されたRocket 88（Sun Recordsの設立は1952年）も有力な候補とされる。同時期、Chuck BerryはシカゴのChess Recordsと契約して1955年5月21日に録音したMaybelleneを7月に発売し、R&amp;Bにカントリー風のギターを結びつけて、ロックンロールのギター語法を広めた。Bo Diddleyは同じ1955年の3月に、Chuck Berryより先にChessからレコードを出していた。Little Richardは1955年の後半、Jerry Lee Lewisは1956年の終わりから録音を始め、1950年代後半にロックンロールは米国の若者文化の中心となった。1960年代前半、イギリスの若者たちは、アメリカのロックンロールやブルースの影響を受けた。なかでもThe Rolling StonesやThe Animalsはブルースを見直させる役目を担い、1964年のThe Beatlesの米国到着が、ブリティッシュ・インヴェイジョンと呼ばれる流れのはじまりとなった。The Beatlesの1965年12月のRubber Soulに刺激されたBeach Boysが、1966年5月にPet Soundsを出し、それがまた1967年のSgt. Pepper's Lonely Hearts Club Bandに影響を与えたといわれる。1966年のRevolverから1967年にかけて、スタジオ主導の制作が押し広げられ、ロックは踊るための音楽から聴くための芸術としても受け止められるようになったと評される。並行して、Bob Dylanが1965年のニューポート・フォーク・フェスティバルで電気楽器を使い、Pete Seegerは主に音響の問題（歪み）に不満を述べたとされ、観客の反応は証言が割れている。この一件は、フォークが電気楽器を使うようになったことをめぐる大きな論争を象徴する出来事となった。歌詞の変化は、これより前の1965年4月のアルバム『Bringing It All Back Home』などで先に起きていた。1969年のウッドストック・フェスティバルは、この音楽が世代的な運動と一体であることを示した頂点と評されることが多く、同年末のオルタモントの無料コンサートで観客が刺殺された事件は、その理想の終わりを表す出来事とされることも多い。1960年代後半から、ハードロック、プログレッシヴ・ロックなどに分岐し、1970年代にはパンクやヘヴィメタルが、1980年代以降にはオルタナティヴが現れた。パンクは、当時の主流のロックが大げさになりすぎたことへの反動だった。ヘヴィメタルはブルース・ロックやサイケデリック・ロックから発展し、オルタナティヴはパンクの流れを引いている。</p>
