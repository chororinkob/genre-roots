<h1>Rock（ロック）とは</h1>
<p>ロックは、エレクトリック・ギター、ベース、ドラムを基本の編成とし、増幅された音の力で押し出す大衆音楽の総称だ。 主役はギター。真空管アンプを歪ませたディストーションが基本の音色になる。和音には、パワー・コードと呼ばれる、根音と5度</p>
<p>ロックは、エレクトリック・ギター、ベース、ドラムを基本の編成とし、増幅された音の力で押し出す大衆音楽の総称だ。

主役はギター。真空管アンプを歪ませたディストーションが基本の音色になる。和音には、パワー・コードと呼ばれる、根音と5度だけの和音をよく使う。歪んでも濁らない厚みが出るからだ。この5度の和音は3度を含まない。そのため長調とも短調とも決まらず、その曖昧さが攻撃性と結び付く。ベースは根音を刻んで低音を支える。

拍子はほぼ4分の4だ。ドラムのバスドラムは1拍目と3拍目に、スネアは2拍目と4拍目に置かれる。これがいわゆるバックビートで、ロックのリズムの骨格をなす。2拍目と4拍目を強調するやり方は、ブルース、R&amp;B、ジャズ、カントリーなど、複数の系統に由来するとされる。ベースとドラムの一体感は、いわゆるグルーヴを作る。

歌詞は、反抗、恋愛、社会批判、自己の内面など幅広い。

曲の構成は、ヴァース、コーラス、ブリッジという、歌ものの型が基本だ。間奏にはギター・ソロを置くことが多い。

価値観の面では、パンクなど一部の流れは、技巧より態度を重んじた。だが、プログレなど、技巧を重視する流れも併存する。</p>
<h2>成り立ち</h2><p>ロックンロールは、1940年代後半から50年代初頭にかけて、米国で形成された。それが1960年代半ば以降に「ロック」として多様化していく。

土台になったのは、リズム・アンド・ブルースだ。これを中核に、ブギウギ、ゴスペル、ジャンプ・ブルース、カントリーなど複数の要素が、南部・南西部に加えシカゴなど各地で混ざって生まれた。

決定的な役割を果たしたのが、メンフィスのSun Recordsだ。経営者のSam Phillipsは、黒人音楽を白人の歌手に歌わせることを構想したと伝えられる。1954年7月、彼はElvis PresleyのThat's All Rightを録音した。Arthur Crudupの曲だ。これを最初のロックンロールの盤とみなすかどうかには、議論がある。Phillipsが1951年にMemphis Recording Serviceで録音し、Chessから発売されたRocket 88も、有力な候補とされる。Sun設立は1952年である。

同じ時期、Chuck BerryはシカゴのChess Recordsと契約した。1955年5月21日にMaybelleneを録音し、7月に発売する。R&amp;Bにカントリー風のギターを結びつけ、ロックンロールのギター語法を広めた。Bo Diddleyは同じ1955年にChessから先行して3月に出し、Little Richardは1955年後半、Jerry Lee Lewisは1956年末から登場した。そして1950年代後半、ロックンロールは米国の若者文化の中心となった。

1960年代前半には、舞台が英国に移る。英国のバンドは、米国のロックンロールやブルースの影響を受けた。そのうちRolling StonesやAnimalsが、ブルース系の再評価を担った。1964年にBeatlesが米国に到着したことが、侵攻の端緒となった。

The Beatlesは、1965年12月のRubber Soul、Beach BoysのPet Sounds、Sgt. Pepperという影響関係のなかにいた。1966年のRevolverから1967年のSgt. Pepper's Lonely Hearts Club Bandにかけて、スタジオ主導の制作を押し広げる。ロックは、踊るための音楽から、聴くための芸術へ押し上げられた。

並行して、Bob Dylanは1965年のニューポート・フォーク・フェスティバルで、電気楽器を使った。Pete Seegerは、主に音響の問題である歪みに不満を述べたとされる。観客の反応は、証言が割れている。Newportは、フォークの電化をめぐる論争を代表する出来事だった。歌詞の変化は、『Bringing It All Back Home』（1965年4月）などのアルバムで、先に起きていた。

1969年のウッドストック・フェスティバルは、この音楽が世代的な運動と一体であることを示した頂点と評されることが多い。同年末のオルタモントの無料コンサートでは、観客が刺殺された。この事件も、その理想の終わりを表したと評されることが多い。

その後、1960年代後半から、ハードロック、プログレッシヴ・ロックなどに分岐した。1970年代にはパンクやヘヴィメタルが、1980年代以降にはオルタナティヴが現れる。パンクは主流ロックの肥大化への反動だった。ヘヴィメタルは、ブルース・ロックやサイケデリック・ロックからの発展だった。オルタナティヴは、パンクの系譜を引く。</p>
