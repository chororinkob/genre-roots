<h1>Rock（ロック）とは</h1>
<p>エレクトリック・ギター、ベース、ドラムを基本編成とし、増幅された音の力で押し出す大衆音楽の総称。拍子はほぼ4分の4で、ドラムのバスドラムが1拍目と3拍目、スネアが2拍目と4拍目に置かれる、いわゆるバックビートが骨格をなす。この2拍</p>
<p>エレクトリック・ギター、ベース、ドラムを基本編成とし、増幅された音の力で押し出す大衆音楽の総称。拍子はほぼ4分の4で、ドラムのバスドラムが1拍目と3拍目、スネアが2拍目と4拍目に置かれる、いわゆるバックビートが骨格をなす。この2拍目と4拍目の強調は、ブルース、R&amp;B、ジャズ、カントリーなど複数の系統に由来するとされる。ギターは真空管アンプを歪ませたディストーションを基本音色とし、パワー・コードと呼ばれる根音と5度だけの和音を用いることで、歪んでも濁らない厚みを得る。この5度和音は3度を含まないため長調とも短調とも決まらず、その曖昧さが攻撃性と結び付く。ベースは根音を刻んで低音を支え、ドラムとの一体感、いわゆるグルーヴを作る。曲構成はヴァース、コーラス、ブリッジという歌ものの型を基本とし、間奏にギター・ソロを置くことが多い。歌詞は反抗、恋愛、社会批判、自己の内面など幅広い。パンクなど一部の潮流は技巧より態度と衝動を重んじたが、プログレッシヴ・ロックのように技巧を重視する潮流も併存する。大音量を浴びるという身体的な体験も、この音楽の大きな魅力である。</p>
<h2>成り立ち</h2><p>ロックンロールは1940年代後半〜50年代初頭に米国で形成され、1960年代半ば以降に「ロック」として多様化した。リズム・アンド・ブルースを中核に、ブギウギ、ゴスペル、ジャンプ・ブルース、白人音楽であるカントリーなど複数の要素が、南部・南西部に加えシカゴなど各地で混ざって生まれた。決定的な役割を果たしたのがメンフィスのSun Recordsで、経営者Sam Phillipsは黒人音楽を白人の歌手に歌わせることを構想し、1954年7月にElvis PresleyのThat's All Right（Arthur Crudupの曲）を録音した。これを最初のロックンロールの盤とみなすかどうかには議論があり、1951年に録音されたRocket 88も有力な候補とされる。同時期、Chuck BerryはシカゴのChess Recordsと契約して1955年5月21日に録音したMaybelleneを7月に発売し、R&amp;Bにカントリー風のギターを結びつけて、ロックンロールのギター語法を広めた。Bo Diddleyも同じ1955年に先行し、Little Richardは1955年後半、Jerry Lee Lewisは1956年末から加わり、1950年代後半にロックンロールは米国の若者文化の中心となった。1960年代前半、イギリスの若者たちがこの音楽やブルースのレコードに影響を受け、The BeatlesとThe Rolling Stonesを筆頭とする、いわゆるブリティッシュ・インヴェイジョンとして米国へ逆輸出した（ブルースの再評価を担ったのは主にThe Rolling StonesやThe Animals）。The BeatlesはBeach BoysのPet Soundsと相互に刺激し合いながら、1966年のRevolverから1967年のSgt. Pepper's Lonely Hearts Club Bandにかけて、スタジオ主導の制作を押し広げ、ロックを踊るための音楽から聴くための芸術へ押し上げた。並行して、Bob Dylanが1965年のニューポート・フォーク・フェスティバルで電気楽器を使い、Pete Seegerは主に音響の問題（歪み）に不満を述べたとされ、観客の反応は証言が割れている。この一件は、フォークの電化をめぐる論争の象徴的な出来事となった。歌詞の変化は、同年4月のアルバム『Bringing It All Back Home』などで先に起きていた。1969年のウッドストック・フェスティバルは、この音楽が世代的な運動と一体であることを示した頂点であり、同年末のオルタモントの無料コンサートで観客が刺殺された事件は、その理想の終焉を象徴した。1960年代後半から、ハードロック、プログレッシヴ・ロックなどに分岐し、1970年代にはパンクが主流ロックの肥大化への反動として現れ、ヘヴィメタルはブルース・ロックやサイケデリック・ロックから発展し、1980年代以降のオルタナティヴはパンクの系譜を引いて現れた。</p>
