<h1>Rock（ロック）とは</h1>
<p>エレクトリック・ギター、ベース、ドラムを基本編成とし、増幅された音の力で押し出す大衆音楽の総称。拍子はほぼ四分の四で、ドラムのバスドラムが一拍目と三拍目、スネアが二拍目と四拍目に置かれる、いわゆるバックビートが骨格をなす。この二拍</p>
<p>エレクトリック・ギター、ベース、ドラムを基本編成とし、増幅された音の力で押し出す大衆音楽の総称。拍子はほぼ四分の四で、ドラムのバスドラムが一拍目と三拍目、スネアが二拍目と四拍目に置かれる、いわゆるバックビートが骨格をなす。この二拍目と四拍目の強調が、ブルースやゴスペルから受け継いだ最大の遺伝子であり、クラシック音楽の強拍とは正反対の重心を作る。ギターは真空管アンプを歪ませたディストーションを基本音色とし、パワー・コードと呼ばれる根音と五度だけの和音を用いることで、歪んでも濁らない厚みを得る。この五度和音は三度を含まないため長調とも短調とも決まらず、その曖昧さが攻撃性と結び付く。ベースは根音を刻んで低音を支え、ドラムとの一体感、いわゆるグルーヴを作る。曲構成はヴァース、コーラス、ブリッジという歌ものの型を基本とし、間奏にギター・ソロを置くことが多い。歌詞は反抗、恋愛、社会批判、自己の内面など幅広い。演奏の技巧より態度と衝動を重んじる価値観、そして大音量を浴びるという身体的な体験そのものが、ジャンルの本質をなしている。</p>
<h2>成り立ち</h2><p>1950年代半ばの米国で、黒人音楽であるリズム・アンド・ブルースと、白人音楽であるカントリーが、南部の都市で交わったところから生まれた。決定的な役割を果たしたのがメンフィスのSun Recordsで、経営者Sam Phillipsは黒人音楽を白人の歌手に歌わせることを構想し、1954年にElvis PresleyのThat's All Right を録音した。同時期、Chuck BerryはシカゴのChess Recordsで1955年にMaybelleneを発表し、ギターのリフを主役に据えるという発想を確立した。Little Richard、Bo Diddley、Jerry Lee Lewisらが続き、1950年代後半にロックンロールは米国の若者文化の中心となった。1960年代前半、イギリスの若者たちがこの音楽と、その源流であるブルースのレコードを研究し、The BeatlesとThe Rolling Stonesを筆頭とする、いわゆるブリティッシュ・インヴェイジョンとして米国へ逆輸出した。The Beatlesは1966年のRevolverから1967年のSgt. Pepper's Lonely Hearts Club Bandにかけて、スタジオを作曲の道具として使うという転換を成し遂げ、ロックを踊るための音楽から聴くための芸術へ押し上げた。並行して、Bob Dylanが1965年のニューポート・フォーク・フェスティバルで電気楽器を使い、聴衆から激しい非難を浴びた一件は、歌詞の文学性がロックに持ち込まれる転換点となった。1969年のウッドストック・フェスティバルは、この音楽が世代的な運動と一体であることを示した頂点であり、同年末のオルタモントの無料コンサートで観客が刺殺された事件は、その理想の終焉を象徴した。1970年代以降、ハードロック、プログレッシヴ・ロック、パンク、ヘヴィメタル、オルタナティヴと際限なく分岐し続け、それぞれが前の世代への反発として自らを定義してきた。この自己否定による更新の反復こそが、ロックという枠組みの推進力だった。</p>
