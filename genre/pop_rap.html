<h1>Pop Rap（ポップラップ）とは</h1>
<p>ラップの語り口を、明快な旋律と反復するサビを備えたポップスの構造に組み込んだ音楽。曲の骨格は徹底して聴きやすさに最適化されており、冒頭数秒でサビの旋律が提示され、ヴァースでラップ、サビで歌という交互の構成が繰り返される。サビは専門</p>
<p>ラップの語り口を、明快な旋律と反復するサビを備えたポップスの構造に組み込んだ音楽。曲の骨格は徹底して聴きやすさに最適化されており、冒頭数秒でサビの旋律が提示され、ヴァースでラップ、サビで歌という交互の構成が繰り返される。サビは専門の歌手が担当することも多い。テンポは毎分90から120拍程度、和音は三つか四つの単純な進行で、長調寄りの明るい響きが選ばれる。編成は打ち込みが中心だが、時代によってディスコの弦、シンセのリフ、ロックのギター、EDMの上昇音まで、その時々の流行の音が積極的に取り込まれる。ラップは技巧の誇示よりも、言葉が聞き取りやすく覚えやすいことが優先され、押韻は素直で、譜割りも拍に沿う。歌詞は恋愛、パーティー、成功、自己肯定といった、誰にでも当てはまる主題が選ばれ、暴力や薬物、露骨な性描写、地域固有の隠語は意図的に避けられる。ミュージックビデオと踊りが不可分で、視覚的な記号が音楽と同等の重みを持つ。ヒップホップの内部では、商業的に妥協した軽い音楽だという批判を常に受け続けてきたが、同時にこの分野の存在がラップという表現を世界中に広げたことも事実である。</p>
<h2>成り立ち</h2><p>最初期の例は1979年の『Rapper's Delight』にまで遡る。ディスコの演奏の上に陽気なラップを乗せたこの曲は、そもそも踊れるポップスとして作られていた。1980年代半ば、Run-D.M.C.がAerosmithと組んだ『Walk This Way』(1986)と、Beastie Boysの『Fight for Your Right』(1986)が、ロックの聴き手にラップを届けた。決定的な商業的成功は1990年前後に訪れる。MC Hammerの『U Can't Touch This』(1990)はRick Jamesの曲を下敷きにし、アルバム『Please Hammer Don't Hurt 'Em』は全米で1000万枚以上を売った。同じ頃、白人ラッパーのVanilla Iceが『Ice Ice Baby』(1990)でヒップホップとして初の全米一位を獲得したが、Queenの曲を無断で使ったことと、経歴を偽っていたことが発覚し、猛烈な批判を浴びた。この二人は商業的成功と同時に、本物ではないという烙印を押され、以後この分野の宿命となる。1990年代半ばには、Puff Daddyが率いたBad Boy Recordsが、往年のヒット曲をそのまま下敷きにする手法で市場を席巻し、Will Smithは暴力的な表現を一切使わないラップで1998年にグラミー賞を受けた。2000年代にはNelly、Ludacris、Flo Rida、Pitbullが続き、2010年代にはEDMとの融合が進み、さらにストリーミングの普及によってヒップホップ自体が全米で最も聴かれる音楽になったため、ポップ・ラップという区分そのものが意味を失いつつある。Drake、Post Malone、Cardi Bらの作品は、この分類の内側と外側の区別がもはや成立しないことを示している。</p>
