<h1>Pop Rap（ポップラップ）とは</h1>
<p>ラップの語り口を、明快な旋律と反復するサビを備えたポップスの構造に組み込んだ音楽。曲の骨格は徹底して聴きやすさに最適化されており、冒頭数秒でサビの旋律が提示され、ヴァース（歌の本編部分）でラップ、サビで歌という交互の構成が繰り返さ</p>
<p>ラップの語り口を、明快な旋律と反復するサビを備えたポップスの構造に組み込んだ音楽。曲の骨格は徹底して聴きやすさに最適化されており、冒頭数秒でサビの旋律が提示され、ヴァース（歌の本編部分）でラップ、サビで歌という交互の構成が繰り返される。サビは専門の歌手が担当することも多い。テンポは中速から速めのものが多く、和音は三つか四つの単純な進行で、明るい曲が目立つ。編成は打ち込みが中心だが、時代によってディスコの弦、シンセのリフ、ロックのギター、EDMの上昇音まで、その時々の流行の音が積極的に取り込まれる。ラップは技巧の誇示よりも、言葉が聞き取りやすく覚えやすいことが優先され、押韻は素直で、譜割り（言葉を拍に当てはめる配置）も拍に沿う。歌詞は恋愛、パーティー、成功、自己肯定といった、誰にでも当てはまる主題が選ばれ、路上系（街の暮らしを題材にする系統）のラップに比べて攻撃性が低く、前向きで親しみやすい歌詞が多い。ミュージックビデオと踊りが切り離せず、視覚的な記号が音楽と同等の重みを持つ。ヒップホップの内部では、商業的に妥協した軽い音楽だという批判を常に受け続けてきたが、同時にこの分野の存在がラップという表現を世界中に広げたことも事実である。</p>
<h2>成り立ち</h2><p>1979年の『Rapper's Delight』は、ヒップホップを広い聴衆に届けた先駆的な商業的成功例である。ディスコの演奏の上に陽気なラップを乗せたこの曲は、そもそも踊れるポップスとして作られていた。ポップ・ラップの成立は1980年代後半とされ、LL Cool Jが最初のポップ・ラッパーと呼ばれ、1987年の『I Need Love』が最初期のクロスオーバーヒット（ほかの分野の聴き手にも届いた大ヒット）とされる。1980年代半ば、Run-D.M.C.がAerosmithと組んだ『Walk This Way』(1986)と、Beastie Boysの『Fight for Your Right』(1986)が、ロックの聴き手にラップを届けた。決定的な商業的成功は1990年前後に訪れる。MC Hammerの『U Can't Touch This』(1990)はRick Jamesの曲を土台にし、アルバム『Please Hammer Don't Hurt 'Em』は全米で1000万枚以上を売った。同じ頃、白人ラッパーのVanilla Iceが『Ice Ice Baby』(1990)でヒップホップとして初の全米一位を獲得したが、QueenとDavid Bowieの『Under Pressure』を無断で使ったことと、経歴の偽装（本人は後に細部を創作したと認めた）が発覚し、猛烈な批判を浴びた。この2人は商業的成功と同時に、本物ではないという否定的な評価を受け、以後この分野に付きまとう問題となる。1990年代後半には、Puff Daddyが率いたBad Boy Recordsが、往年のヒット曲をそのまま土台に使う手法で市場を席巻し、Will Smithは罵り言葉を使わないラップで1998年（第40回）にグラミー賞のBest Rap Solo Performanceを受けた。2000年代にはNelly、Ludacris、Flo Rida、Pitbullが続き、2010年代にはEDMとの融合が進み、さらにストリーミングの普及によって2017年にR&amp;B／ヒップホップが全米で最も消費されるジャンルになったため、ポップ・ラップという区分そのものが意味を失いつつある。Drake、Post Malone、Cardi Bらの作品は、この分類の内側と外側の区別がもはや成立しないことを示している。</p>
