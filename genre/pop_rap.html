<h1>Pop Rap（ポップラップ）とは</h1>
<p>ポップ・ラップは、ラップの語り口を、明快な旋律と反復するサビを備えたポップスの構造に組み込んだ音楽だ。曲の骨格は徹底して聴きやすさに最適化されている。 ヴァース（歌の本編部分）ではラップ、サビでは歌も入ることがある。 編成は打ち込</p>
<p>ポップ・ラップは、ラップの語り口を、明快な旋律と反復するサビを備えたポップスの構造に組み込んだ音楽だ。曲の骨格は徹底して聴きやすさに最適化されている。

ヴァース（歌の本編部分）ではラップ、サビでは歌も入ることがある。

編成は打ち込みが中心だが、時代によって、ディスコの弦、シンセのリフ、ロックのギター、EDMの上昇音まで、その時々の流行の音が積極的に取り込まれる。

ラップは技巧の誇示よりも、言葉が聞き取りやすく覚えやすいことが優先される。押韻は素直で、譜割り（言葉を拍に当てはめる配置）も拍に沿う。

歌詞は恋愛や人間関係など、ポップに近い題材が選ばれる。路上系（街の暮らしを題材にする系統）のラップに比べて攻撃性が低い。

ヒップホップの内部では、商業的に妥協した軽い音楽だとしばしば批判されてきた。だが同時に、この分野はヒップホップの大衆化に貢献したと評価される。</p>
<h2>成り立ち</h2><p>1979年、『Rapper's Delight』が出た。ヒップホップを広い聴衆に届けた、先駆的な商業的成功例である。ディスコの曲を再演した演奏の上にラップを乗せた曲だった。

ポップ・ラップの成立は1980年代後半とされる。LL Cool Jが最初のポップ・ラッパーと呼ばれ、MTVは1987年の『I Need Love』を「最初期のポップ・ラップのクロスオーバーヒットの一つ」と評している。1980年代半ばには、Run-D.M.C.がAerosmithと組んだ『Walk This Way』(1986)と、Beastie Boysの『Fight for Your Right』(1986)が、ロックの聴き手にラップを届けた。

決定的な商業的成功は、1990年前後に訪れる。MC Hammerの『U Can't Touch This』(1990)はRick Jamesの曲を土台にした。アルバム『Please Hammer Don't Hurt 'Em』は全米で1000万枚以上を売った。同じ頃、白人ラッパーのVanilla Iceが『Ice Ice Baby』(1990)で、ヒップホップのシングルとして初めて全米Hot 100で首位になった。

しかし、QueenとDavid Bowieの『Under Pressure』を無断で使ったことと、経歴の偽装が発覚し、猛烈な批判を浴びた。本人は後に細部を創作したと認めている。この2人は商業的成功と同時に、本物ではないという否定的な評価を受けた。それは以後、この分野に付きまとう問題となる。

1990年代後半には、Puff Daddyが率いたBad Boy Recordsで、往年のヒット曲を土台にした曲が目立った。Will Smithは罵り言葉を使わないラップで、1998年（第40回）にグラミー賞のBest Rap Solo Performanceを受けた。

2000年代にはNelly、Ludacrisも数えられることがあり、2000年代後半〜2010年代初頭にはFlo Rida、Pitbullが続いた。2010年代にはEDMとの融合が進んだ。さらにストリーミングの普及によって、2017年にR&amp;B／ヒップホップが全米で最も消費されるジャンルになった。ポップ・ラップという区分そのものが意味を失いつつあると論じる向きもある。Drake、Post Malone、Cardi Bらの作品は、この分類の内側と外側の区別がもはや成立しないことを示しているという見方もある。</p>
