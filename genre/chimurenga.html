<h1>Chimurenga（チムレンガ）とは</h1>
<p>チムレンガは、ジンバブエで生まれた音楽だ。伝統的な親指ピアノの音楽を、電気楽器へ移し替えている。名前は、ショナ語で「闘争」を意味する。 このスタイルの中心にあるのは、ムビラという楽器の音の動きを、エレクトリックギターで再現するとい</p>
<p>チムレンガは、ジンバブエで生まれた音楽だ。伝統的な親指ピアノの音楽を、電気楽器へ移し替えている。名前は、ショナ語で「闘争」を意味する。

このスタイルの中心にあるのは、ムビラという楽器の音の動きを、エレクトリックギターで再現するという発想だ。ショナのムビラ(mbira dzavadzimu)は、22〜28本の金属片を並べた楽器である(種類により15本のものもある)。右手は親指と人差し指、左手は親指で弾く。演奏の時は瓢箪の共鳴体に入れて、響きを大きくする。

ムビラの音楽では、複数のパートが入れ子のように絡み合い、ぐるぐると回り続ける。そのため聴き手には、複数のメロディーが同時に聞こえる。ギターは、このムビラの音型を写し取る。ギターは複数の場合も1本の場合もあり、編成はバンドや時期によって異なる。

そこに、瓢箪に種を入れた振り楽器が加わる。この楽器が三連の刻みを絶え間なく続け、独特の揺れを生む。拍子は12/8の枠の中にあり、4拍子的な感じと3拍子的な感じが重なるリズムが基本だ。低音は、循環する短い音型をくり返す。ドラムがそれを支える。

和音については、ショナのムビラの代表的な曲の多くが、12個の和音(各4拍、計48拍)の周期をもつ。短い周期の曲もある。

歌は、独唱と合唱の掛け合いの形をとることが多い。言葉はショナ語である。歌詞には諺と比喩がたくさん使われる。その二重の意味が、この音楽の歴史で決定的な役割を果たした。</p>
<h2>成り立ち</h2><p>1965年、当時ローデシアと呼ばれていたこの国で、人口の数パーセントに過ぎない白人が、一方的に独立を宣言した。彼らは議席と選挙権を制限し、白人少数派が支配を続ける体制を作った。

これに対して、武装闘争が起こる。1966年4月の衝突を戦争の始まりとする見方があり、戦いは1972年12月に本格化した。戦争は十数年にわたって続く。この闘争は、19世紀末の最初の抵抗運動を受け継ぐものとして、ショナ語で「闘争」を意味する言葉で呼ばれた。

この状況で決定的な役割を果たしたのが、Thomas Mapfumoである。彼はもともと、英語でアメリカのロックやソウルを歌う演奏者だった。しかし1970年代に入ると、彼は歌を英語中心からショナ語中心へ移した。そして、西洋の音楽ではなく、祖先の音楽であるムビラの音型をギターへ移すことを選ぶ。これは音楽の選択であると同時に、はっきりした政治的な意思表示だった。

彼の歌詞は、表向きは農村の日常や動物の寓話を語っていた。だが聴き手は、そこに込められたものを正確に読み取った。闘争を続ける者たちへの励ましと、体制への呪いの言葉である。当局もそれに気づいた。彼の曲は放送禁止になり、1977年とも1979年ともされるが、彼自身も罪状を告げられないまま約3か月間拘禁された。

1980年の独立後、彼は国民的な英雄になった。しかし、その後の歴史は単純ではない。独立を導いたRobert Mugabeの政権が長く続き、腐敗と経済の破綻、そして政敵への暴力が明らかになる。すると彼は、再び批判の歌を歌い始めた。

その結果、彼は身の危険から、2000年ごろアメリカのオレゴン州に移った。2004年を最後に、国内で公演できなくなった。2018年4月には、ハラレで帰国公演を行った。抑圧に逆らって歌った人物が、解放後の政権によって再び追われる。そういう構図がここにある。

同じころ、Oliver Mtukudziは、より穏やかで内省的な作風で国民的な支持を得ていた。また、Stella Chiwesheは、女性が演奏することが禁忌とされていたムビラの名手として、道を切り開いた。</p>
