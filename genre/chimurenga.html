<h1>Chimurenga（チムレンガ）とは</h1>
<p>ジンバブエで生まれた、伝統的な親指ピアノの音楽を電気楽器へ移し替えた音楽である。名称はショナ語で闘争を意味する。この様式の核心は、ムビラという楽器の音型をエレクトリックギターで再現するという発想にある。ムビラは瓢箪の共鳴体の中に2</p>
<p>ジンバブエで生まれた、伝統的な親指ピアノの音楽を電気楽器へ移し替えた音楽である。名称はショナ語で闘争を意味する。この様式の核心は、ムビラという楽器の音型をエレクトリックギターで再現するという発想にある。ムビラは瓢箪の共鳴体の中に20本以上の金属片を並べた楽器で、両手の親指と人差し指で弾く。その音楽は、複数の声部が入れ子状に絡み合いながら循環する構造を持ち、聴き手には常に複数の旋律が同時に聞こえる。この構造を、二本から三本のギターがそれぞれ別の音型を弾くことで再現するのである。加えて、瓢箪に種を入れた振り楽器が絶え間なく三連の刻みを保ち、これが独特の揺れを生む。拍子は12/8または6/8で、二拍子と三拍子が同時に感じられる交錯したリズムが基本となる。低音は循環する短い音型を反復し、ドラムがこれを支える。和声は進行せず、同じ循環が延々と続く。歌唱は独唱と合唱の掛け合いで、言語はショナ語である。歌詞には諺と比喩が多用され、その両義性がこの音楽の歴史において決定的な役割を果たした。</p>
<h2>成り立ち</h2><p>1965年、当時ローデシアと呼ばれたこの国では、人口の数パーセントに過ぎない白人が一方的に独立を宣言し、黒人多数派を政治から完全に排除する体制を敷いた。これに対する武装闘争が1966年から本格化し、十数年にわたる戦争が続く。この闘争は、19世紀末の最初の抵抗運動を継ぐものとして、ショナ語で闘争を意味する語で呼ばれた。この状況で決定的な役割を果たしたのがThomas Mapfumoである。彼は当初、英語でアメリカのロックやソウルを歌う演奏者だった。しかし1970年代に入り、彼は英語を捨ててショナ語で歌い、西洋の音楽ではなく祖先の音楽であるムビラの音型をギターへ移すという選択をする。これは音楽的な選択であると同時に、明確な政治的な表明だった。彼の歌詞は表面上は農村の日常や動物の寓話を語っていたが、聴き手はそこに込められた、闘争を続ける者たちへの励ましと、体制への呪詛を正確に読み取った。当局もそれを察知し、彼の楽曲は放送禁止となり、1979年には彼自身が罪状も告げられぬまま数か月間拘禁されている。1980年の独立後、彼は国民的な英雄となった。しかしその後の歴史は単純ではない。独立を導いたRobert Mugabeの政権が長期化し、腐敗と経済の破綻、そして政敵への暴力が明らかになると、彼は再び批判の歌を歌い始める。その結果、彼は身の危険から2000年前後にアメリカへ移住し、長く帰国できなかった。抑圧に抗して歌った人物が、解放後の政権によって再び追われるという構図がそこにある。並行してOliver Mtukudziが、より穏やかで内省的な作風で国民的な支持を得ており、Stella Chiwesheは、女性が演奏することが禁忌とされていたムビラの名手として道を切り開いた。</p>
