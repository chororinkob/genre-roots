<h1>Chopped &amp; Screwed（チョップドアンドスクリュード）とは</h1>
<p>既存の曲を大幅に遅く再生し、そこに独特の編集を加えることで作られる、ヒューストン発の音の様式。中心となる操作は二つある。ひとつは速度を落とすことで、レコードプレーヤーやテープの回転数を下げ、元のテンポを毎分60から70拍程度まで落</p>
<p>既存の曲を大幅に遅く再生し、そこに独特の編集を加えることで作られる、ヒューストン発の音の様式。中心となる操作は二つある。ひとつは速度を落とすことで、レコードプレーヤーやテープの回転数を下げ、元のテンポを毎分60から70拍程度まで落とす。これに伴って音程も下がり、歌声は男女を問わず低く歪んだ響きになり、シンバルは金属的に伸び、低音は膨張して部屋を満たす。もうひとつが刻みで、同じレコードを二枚使い、直前の一拍や半拍を素早く戻して繰り返す。これにより言葉の一部が吃るように反復され、聴き手は同じ瞬間に二度連れ戻される。この二つの操作以外に音は加えられず、あくまで既存の録音を作り変えることが本質である。結果として生まれるのは、時間の流れが引き延ばされたような感覚で、これは実際に、咳止めシロップに含まれる成分による酩酊状態と結びついて発展した。作品は一曲単位ではなく、60分から90分のミックステープという形で作られ、間にDJの肉声による友人への呼びかけが挟まれる。聴かれる場は主に自動車の車内で、大型の低音用スピーカーを積んで、夜の街をゆっくり走りながら鳴らされた。</p>
<h2>成り立ち</h2><p>考案者はヒューストンのRobert Earl Davis Jr.、通称DJ Screwである。1990年代初頭、彼は自室でレコードのピッチを下げて遊んでいたところ、その音を気に入った友人が金を払ってテープを求めたことから、この手法を本格的に始めたと語っている。1993年頃から、彼は自宅で個人の注文に応じたミックステープを作り始め、依頼者の名前や友人への挨拶を吹き込んだ。この個別性が熱狂を生み、彼の家の前には毎晩、テープを買う車の列ができるようになった。彼を中心に集まった若者たちはScrewed Up Clickと呼ばれ、Big Moe、Fat Pat、Lil Keke、E.S.G.、Z-Roらが所属した。彼らはテープの中で即興のラップを披露し、そこから独立した経歴を築いた者も多い。1998年、DJ Screwは実店舗Screwed Up Recordsを開き、ようやく合法的な販売の形を整えた。しかしこの文化は薬物と不可分だった。処方薬のプロメタジンとコデインを含む咳止めシロップを炭酸飲料で割ったものが常用され、これは地元でリーンと呼ばれた。2000年11月16日、DJ Screwはスタジオの浴室でコデインの過剰摂取により死亡した。29歳だった。Fat Patは1998年に射殺され、Big Moeは2007年に心臓発作で亡くなっている。それでもこの手法は広がり続けた。2000年代にはPaul WallやMike Jones、Chamillionaireがヒューストンから全米に出て、2010年代にはASAP RockyやDrake、そしてフォンクを通じて世界中の若い制作者が、この遅く歪んだ質感を標準的な語彙として使うようになった。現在ではソフトウェアで簡単に再現でき、原型を知らないまま模倣されることも多い。</p>
<h2>代表曲</h2><ul><li>June 27th（DJ Screw）</li><li>Still Tippin'（Mike Jones ft. Slim Thug &amp; Paul Wall）</li><li>Sippin' Codeine（DJ Screw）</li><li>November 18th（Drake）</li><li>My Mind Went Blank（DJ Screw）</li></ul>
