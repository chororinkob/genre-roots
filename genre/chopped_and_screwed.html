<h1>Chopped &amp; Screwed（チョップドアンドスクリュード）とは</h1>
<p>既存の曲を大幅に遅く再生し、そこに独特の編集を加えて作る、ヒューストン発の音のスタイルだ。中心となる操作は二つある。 ひとつは速度を落とすことだ。レコードプレーヤーやテープの回転数を下げ、元のテンポを毎分60から70拍程度まで落と</p>
<p>既存の曲を大幅に遅く再生し、そこに独特の編集を加えて作る、ヒューストン発の音のスタイルだ。中心となる操作は二つある。

ひとつは速度を落とすことだ。レコードプレーヤーやテープの回転数を下げ、元のテンポを毎分60から70拍程度まで落とす。これに伴って音程も下がり、歌声は男女を問わず低く歪んだ響きになる。シンバルは金属的に伸び、低音は膨張して部屋を満たす。

もうひとつが刻みだ。拍の飛ばし、スクラッチ、断片の再配列などでチョップ（細切れ・反復）を作る。これにより、言葉の一部がつかえるように繰り返され、聴き手は同じ瞬間に2度連れ戻される。

基本は既存の録音の加工だが、声の加工やDJ自身の呼びかけ、客演（ゲストとして参加すること）のラップも加わる。結果として生まれるのは、時間の流れが引き延ばされたような感覚だ。この感覚はリーンとの結びつきが指摘されるが、Screw本人は否定していた。

作品は一曲ずつではなく、主に100分のカセットに収めたミックステープ（曲を自由につないだ作品集）という形で作られる。間には、DJの肉声による友人への呼びかけが挟まれる。聴かれる場は主に自動車の車内だ。大型の低音用スピーカーを積み、夜の街をゆっくり走りながら鳴らされた。</p>
<h2>成り立ち</h2><p>ヒューストンで、この音楽を開拓し、普及させたのは、Robert Earl Davis Jr.、通称DJ Screwである。Screwは考案者として広く認められている。ただ、先行者としてDarryl ScottとMichael Priceがおり、起源には異説もある。Screwは、スロー化とチョップ（曲を細かく切って繰り返す編集）の組み合わせを、ひとつのスタイルにした。

1989〜1990年頃（資料により異なる）、彼は自室でレコードを混ぜていた。関係者の証言では、偶然ピッチを下げたことがきっかけになった。その音を気に入った友人が金を払ってテープを求め、彼はこの手法を本格的に始める。1989〜1991年頃からは、自宅で個人の注文に応じたミックステープを作り、依頼者の名前や友人への挨拶を吹き込んだ。この個別性が熱狂を生んだ。販売時間を夜に決めて売るようになり、とくに新作が出る水曜の夜には、車が長い列を作った。

彼を中心に集まった若者たちは、Screwed Up Clickと呼ばれた。Big Moe、Fat Pat、Lil Keke、E.S.G.、Z-Roらが所属した。彼らはテープの中で即興のラップを披露し、そこから独立した経歴を築いた者も多い。1998年（1996年とする資料もある）、DJ Screwは自宅での販売をやめ、実店舗Screwed Up Records and Tapesを開いた。

しかしこの文化は、薬物（リーン）と強く結びついて語られる。ただしScrew本人は、薬物は不可欠ではないと述べていた。処方薬のプロメタジンとコデインを含む咳止めシロップを炭酸飲料で割ったものが常用され、リーン（lean）、シロップ、ドランクなどと呼ばれた。2000年11月16日、DJ Screwはスタジオのトイレ（洗面所）で、コデインなどによる複合薬物中毒により死亡した。29歳だった。Fat Patは1998年に射殺され、Big Moeは2007年に心臓発作で亡くなっている。

それでも、この手法は広がり続けた。2000年代には、Paul WallやMike Jones、Chamillionaireがヒューストンから全米に出た。2010年代には、ASAP RockyやDrakeらが影響を公言し、フォンクなど後続のジャンルにも技法が受け継がれた。現在ではソフトウェアで簡単に再現でき、スローダウンやリバーブをかけた派生形も広がっている。</p>
