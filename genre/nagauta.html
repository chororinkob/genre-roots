<h1>Nagautaとは</h1>
<p>三味線の弾き語りに唄を重ね、囃子で彩る日本の伝統音楽である。代表曲22曲を動画で聴け、ルーツと影響のつながりを地図でたどれる。</p>
<p>三味線の弾き語りに唄を重ね、囃子で彩る日本の伝統音楽である。一言でいうと、歌舞伎の舞台を支える三味線音楽の中核をなす歌い物だ。語りで筋を進める義太夫節とは違い、うたの旋律そのものが主役になる。基本の編成は唄方と三味線方で、それぞれ数人が向かい合って座り、一曲を分担して歌い弾く。曲目によっては小鼓、大鼓、太鼓、笛からなる囃子が加わり、大曲では十数人による合奏になる。三味線は細い棹の細棹を使い、大きな撥で弦を叩くように鳴らす。派手な打撃音と、指先で音色を整える繊細な響きが同居するのが音の核だ。使われる音階は明るく伸びやかな陽音階が中心で、場面によって哀感のある陰音階も使い分ける。和音の積み重ねではなく、唄と三味線、囃子がそれぞれの線を絡ませて進む音楽である。リズムは囃子方の小鼓と大鼓が拍節を支え、能楽で培われた間の取り方が緊張感を生む。通常の三味線パートのほかに、装飾を担う上調子と呼ばれる別パートが加わる曲もある。唄は数人が受け渡しや斉唱で歌い分け、腹の底から張り上げる力強い発声が特色だ。歌詞は舞台の情景や登場人物の心情を描き、祝儀のめでたい句を並べる曲もある。一曲は短い小品から数十分の大曲まであり、唄と三味線の手、囃子だけで見せる合方を織り交ぜながら長く展開する。歌舞伎の下座で鳴り響くほか、民謡の素朴な節回しとは違う洗練された響きで、舞踊の伴奏としても座敷の鑑賞音楽としても聴かれる。</p>
<h2>成り立ち</h2><p>三味線が歌舞伎に取り入れられたのは17世紀のことで、1650年より前とみる説が有力である。やがて元禄の頃、浅利検校や佐山検校らによって三味線伴奏の長い歌が作られ始めたとされる。元禄期の上方では、歌舞伎の劇中で演出として歌われる芝居歌が発達し、これが長唄の源流になった。上方の長歌は地歌の楽式として整えられ、一曲を通して筋を通す構成が特色とされた。しかし現在の長唄の直接の祖は、江戸で育った。享保期以降、上方の芝居歌が短い形式になって江戸歌舞伎に伝わり、メリヤスと呼ばれた。下座で一人か二人の唄方が歌う、しんみりとした寂しい曲である。宝暦期以降は歌舞伎の舞台演出で流行し、新曲がいくつも作曲された。1753年には藤本斗文の作詞、初代杵屋弥三郎の作曲で「京鹿子娘道成寺」が江戸中村座で初演され、初代中村富十郎が踊った。白拍子が道成寺の鐘のもとで化けてあらわれる大曲は、舞踊音楽としての長唄の地位を決定的に高めた。文化期には劇場の外で聴くお座敷の曲が注目を集めた。1811年、九代目杵屋六左衛門が旅芸人の角兵衛獅子を題材に「越後獅子」を作曲し、おけさなど民謡風の節回しを舞台音楽に取り込んだ。天保から幕末、明治へかけては作曲の名手が続出する。1840年、四世杵屋六三郎、のちの初代杵屋六翁が歌舞伎十八番の「勧進帳」を作曲し、長唄中興の祖と呼ばれた。二代目杵屋勝三郎は「鞍馬山」（1856年）や「勝三郎連獅子」（1861年）など大きな曲を残した。1848年には二代目杵屋勝三郎が杵勝会の元を結成し、現代まで続く大流派の土台ができた。明治末の1902年には、四世吉住小三郎、のちの吉住慈恭と、三世杵屋六四郎、のちの二代目稀音家浄観が長唄研精会を設立し、歌舞伎から独立した鑑賞音楽としての長唄を進めた。20世紀には西洋音楽との交流も現れ、1934年には山田耕筰が長唄交響曲「鶴亀」を発表した。現在も杵勝会などの団体が演奏と伝承を続け、歌舞伎と離れた単独の演奏会でも長唄は鳴らされている。</p>
