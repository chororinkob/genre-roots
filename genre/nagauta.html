<h1>Nagauta（メリヤス）とは</h1>
<p>長唄は、唄方と三味線方が分担し、そこに囃子が加わる三味線音楽だ。代表曲22曲を動画で聴け、ルーツと影響のつながりを地図でたどれる。</p>
<p>長唄は、唄方と三味線方が分担し、そこに囃子が加わる三味線音楽だ。歌舞伎の舞台を支える三味線音楽の中核をなす歌い物である。語りで筋を進める義太夫節とは違い、うたの旋律そのものが主役になる。

基本の編成は唄方と三味線方で、横一列に並んで客席に向かって座り、一曲を分担して歌い弾く。最少編成は唄1人・三味線2人で、曲目によっては小鼓・大鼓・太鼓・笛からなる囃子が加わる。大曲になると唄・三味線が各十人ほどになり、それに囃子が加わって数十人の大合奏になる。

三味線は細い棹の細棹を使う。撥先が皮を打つ音を生かした明快な音色と、繊細なメロディーに向く細棹の高い音色が、音の核だ。

使われる音階は、哀感のある陰音階(都節音階)が基本だ。陽音階(田舎節音階)は、民謡など地方の音楽に結びつけて説明される。和音を積み重ねるのではなく、唄と三味線、囃子がそれぞれの線を絡ませて進む音楽である。

リズムは囃子方の小鼓と大鼓が拍節を支え、能の囃子の楽器や手法を取り入れている。通常の三味線パートのほかに、装飾を担う上調子と呼ばれる別パートが加わる曲もある。

唄は数人が受け渡しや斉唱で歌い分ける。張りのある声で、広い空間でもよく聴こえるよう明るく華やかにうたわれる。

歌詞は舞台の情景や登場人物の心情を描き、祝儀のめでたい句を並べる曲もある。

一曲は短い小品から数十分の大曲まであり、唄の入らない三味線の長い器楽部分（合方）を織り交ぜながら長く展開する。歌舞伎の下座で鳴り響くほか、民謡の素朴な節回しとは違う洗練された響きを持ち、舞踊の伴奏としても座敷の鑑賞音楽としても聴かれる。</p>
<h2>成り立ち</h2><p>三味線が歌舞伎に取り入れられたのは、江戸時代初期の遊女歌舞伎の時期とされるが、詳細は不明だ。やがて元禄の頃、江戸の浅利検校や佐山検校らによって、三味線伴奏の長い歌が作られ始めたとされる。元禄期の上方では、歌舞伎の劇中で演出のために歌われる芝居歌が発達し、これが長唄の源流の一つとされる。上方の長歌は、地歌の曲種の一つで、組歌と異なり1曲が統一的な主題で一貫する。

しかし、現在の長唄の直接の祖は江戸で育った。享保期以降、上方の芝居歌が短い形式になって江戸歌舞伎に伝わり、メリヤスと呼ばれるようになる。下座で一人か二人の唄方が歌う、しんみりとした寂しい曲である。

宝暦期以降は歌舞伎の舞台演出で流行し、新曲がいくつも作曲された。1753年には藤本斗文の作詞、初代杵屋弥三郎の作曲で「京鹿子娘道成寺」が江戸中村座で初演され、初代中村富十郎が踊った。白拍子花子（実は清姫の霊）が鐘供養に訪れ、のち蛇体となって現れる大曲は、長唄舞踊の代表作として知られる。

文化期には、劇場の外で聴くお座敷の曲が注目を集めた。1811年、九代目杵屋六左衛門が旅芸人の角兵衛獅子を題材に「越後獅子」を作曲し、浜唄や当時の流行歌謡、地歌を取り入れた。

天保から幕末、明治にかけては作曲の名手が続出する。1840年、四世杵屋六三郎、のちの初代杵屋六翁が歌舞伎十八番の「勧進帳」を作曲し、長唄中興の祖と呼ばれた。二代目杵屋勝三郎は「鞍馬山」（1856年）や「勝三郎連獅子」（1861年）など、大きな曲を残している。1848年には二代目杵屋勝三郎が杵勝会の元を結成し、現代まで続く大流派の土台ができた。

明治後期の1902年(明治35年)には、四世吉住小三郎、のちの吉住慈恭と、三世杵屋六四郎、のちの二代目稀音家浄観が長唄研精会を設立し、歌舞伎から独立した鑑賞音楽としての長唄を進めた。20世紀には西洋音楽との交流も現れ、1934年には山田耕筰が長唄交響曲「鶴亀」を作曲した。現在も杵勝会などの団体が演奏と伝承を続け、歌舞伎と離れた単独の演奏会でも長唄は鳴らされている。</p>
