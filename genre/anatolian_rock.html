<h1>Anatolian Rock（アナトリアンロック）とは</h1>
<p>トルコの民衆音楽と、欧米のロックの編成を結合させた音楽である。最も象徴的なのは弦楽器の扱いで、バーラマあるいはサズと呼ばれる長い棹を持つ撥弦楽器が、電気的に増幅されて用いられる。この楽器はフレットの位置が西洋の半音階と異なり、四分</p>
<p>トルコの民衆音楽と、欧米のロックの編成を結合させた音楽である。最も象徴的なのは弦楽器の扱いで、バーラマあるいはサズと呼ばれる長い棹を持つ撥弦楽器が、電気的に増幅されて用いられる。この楽器はフレットの位置が西洋の半音階と異なり、四分音に近い微細な音程を出せるため、増幅して歪ませたときに、エレクトリックギターとは全く違う独特の唸りを生む。実際に電気化されたサズを自作した演奏者も存在した。加えて通常のエレクトリックギターが、ファズやワウといった効果装置を通して用いられ、両者が旋律を掛け合う。リズムには不均等な拍節が持ち込まれ、9/8拍子を二・二・二・三と数える型など、西洋のロックにはない足取りが現れる。旋律はトルコの旋法体系に基づき、増二度を含む音階が哀愁を帯びた響きを作る。低音は動き回り、ドラムはロックの直線的な刻みを保つ。歌唱は民謡の歌い回しを継承し、装飾を凝らして絞り出すように歌われる。歌詞には、数百年前から伝わる吟遊詩人の詩が用いられることが多く、その内容は貧しさ、不正への怒り、神秘的な思索であり、これが同時代の政治状況と重ねて受け取られた。</p>
<h2>成り立ち</h2><p>1960年代のトルコでは、欧米のロックが若者に浸透していたが、その多くは英語の楽曲をそのまま模倣するものだった。この状況を変える契機となったのが、1965年に大手の新聞社が始めた音楽の競技会である。その趣旨は明確で、トルコの民謡の旋律に西洋の楽器で編曲を施した作品を募るというものだった。国家的な近代化と土着の文化をどう両立させるかという、この国の根本的な問いが、音楽の分野で具体化されたのである。この競技会から多くの才能が現れた。Erkin Korayは最も早くから電気楽器を用いた人物のひとりで、電気サズを自作するなど機材の面でも先駆的だった。Cem Karacaはアルメニア系とアゼルバイジャン系の血を引く歌手で、劇的な歌唱と社会批判の歌詞によって、若い世代の象徴となる。Barış Mançoは民謡と幻覚的なロックを結合させ、後に国民的な人気を獲得した。集団としてはMoğollarが、伝統楽器を大胆に導入した演奏でフランスでも評価を得ている。女性の側ではSelda Bağcanが、抑圧された者の視点から歌う楽曲によって強い支持を集めた。この黄金期は暴力的に終わる。1970年代を通じてトルコでは左右の政治勢力の衝突が激化し、1980年9月の軍事クーデターによって国は軍の管理下に置かれた。数十万人が拘束され、拷問と処刑が行われる。Cem Karacaは国外にいたところ市民権を剥奪され、7年以上帰国できなかった。Selda Bağcanは複数回投獄され、旅券を没収されている。この弾圧によってシーンは壊滅した。しかし2010年代以降、当時の録音が世界中の収集家と制作者に発見され、オランダを拠点とするAltın Günのような新しい世代が現れて、この音楽は国際的な再評価を受けている。</p>
