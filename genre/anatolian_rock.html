<h1>Anatolian Rock（アナトリアンロック）とは</h1>
<p>トルコの民衆音楽と、欧米のロックの編成を結合させた音楽である。最も象徴的なのは弦楽器の扱いで、バーラマあるいはサズと呼ばれる長い棹を持つ撥弦楽器が、電気的に増幅されて用いられる。この楽器はフレットの位置が西洋の十二平均律(半音を最</p>
<p>トルコの民衆音楽と、欧米のロックの編成を結合させた音楽である。最も象徴的なのは弦楽器の扱いで、バーラマあるいはサズと呼ばれる長い棹を持つ撥弦楽器が、電気的に増幅されて用いられる。この楽器はフレットの位置が西洋の十二平均律(半音を最小の単位とする音の並び)と異なり、四分音に近い微細な音程を出せるため、増幅して歪ませたときに、エレクトリックギターとは全く違う独特の唸りを生む。電気化したサズ(電気バーラマ)は、1960年代末にErkin KorayとOrhan Gencebayが共同で開発したとされる。加えて通常のエレクトリックギターが、ファズやワウといった効果装置を通して用いられ、両者が旋律を掛け合う。リズムには不均等な拍節が持ち込まれ、9/8拍子を二・二・二・三と数える型など、西洋のロックにはない足取りが現れる。旋律はトルコの旋法体系に基づき、増2度を含む音階が哀愁を帯びた響きを作る。低音は動き回り、ドラムはロックの直線的な刻みを保つ。歌唱は民謡の歌い回しを継承し、装飾を凝らして絞り出すように歌われる。歌詞には、数百年前から伝わる吟遊詩人の詩が用いられることが多く、その内容は貧しさ、不正への怒り、神秘的な思索であり、これが同時代の政治状況と重ねて受け取られた。</p>
<h2>成り立ち</h2><p>1960年代のトルコでは、欧米のロックが若者に浸透していたが、その多くは、ShadowsやVenturesのようなインストゥルメンタルや英語のカバー、外国曲にトルコ語の歌詞を付けたものなど、欧米の曲を手本にしたものだった。この状況を変える契機となったのが、1965年に大手の新聞社が始めた音楽の競技会である。その趣旨は、西洋音楽の技法や楽器を用いてトルコ音楽に新しい方向を与えることで、民謡の編曲はその手法の一つだった。国家的な近代化と土着の文化をどう両立させるかという、この国の根本的な問いが、音楽の分野で具体化されたのである。この時代には、競技会に参加した者を含め、多くの才能が現れた。Erkin Korayは最も早くから電気楽器を用いた人物のひとりで、Orhan Gencebayとともに電気バーラマ(電気化したサズ)を開発するなど、機材の面でも先駆的だった。Cem Karacaはアルメニア系とアゼルバイジャン系の血を引く歌手で、劇的な歌唱と社会批判の歌詞によって、若い世代の象徴となる。Barış Mançoは、1950年代の学生バンドから活動を始め、民謡と幻覚的なロックを結合させ、後に国民的な人気を獲得した。集団としてはMoğollarが、伝統楽器を大胆に導入した演奏でフランスでも評価を得ている。女性の側では、1971年に大学在学中に音楽活動を始めたSelda Bağcanが、抑圧された者の視点から歌う楽曲によって強い支持を集めた。この黄金期は暴力的に終わる。1970年代を通じてトルコでは左右の政治勢力の衝突が激化し、1980年9月の軍事クーデターによって国は軍の管理下に置かれた。数十万人が拘束され、拷問と処刑が行われる。Cem Karacaは1979年に国外へ出た後、1983年に市民権を剥奪され、1987年6月に帰国した。Selda Bağcanは複数回投獄され、旅券を没収されている。この弾圧によってシーンは壊滅した。しかし2000年代の再発盤(2006年のSelda Bağcanの再発など)を端緒に、当時の録音が世界中の収集家と制作者に再発見され、2010年代後半にはオランダを拠点とするAltın Gün(2016年結成)のような新しい世代が現れて、この音楽は国際的な再評価を受けている。</p>
