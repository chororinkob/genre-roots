<h1>Anatolian Rock（アナトリアンロック）とは</h1>
<p>アナトリアン・ロックは、トルコの民衆音楽と、欧米のロックの編成を組み合わせた音楽である。 いちばんのトレードマークは弦楽器の使い方だ。バーラマ、あるいはサズと呼ばれる、長い棹を持つ撥弦楽器（弦をはじく楽器）を、電気で増幅して使う。</p>
<p>アナトリアン・ロックは、トルコの民衆音楽と、欧米のロックの編成を組み合わせた音楽である。

いちばんのトレードマークは弦楽器の使い方だ。バーラマ、あるいはサズと呼ばれる、長い棹を持つ撥弦楽器（弦をはじく楽器）を、電気で増幅して使う。この楽器はフレットの位置が西洋の十二平均律(半音を最小の単位とする音の並び)と違い、四分音（半音のさらに半分）に近い細かな音程を出せる。そのため、増幅して歪ませると、エレクトリックギターとはまったく違う独特の唸りが生まれる。電気化したサズ(電気バーラマ)は、1960年代末にErkin KorayとOrhan Gencebayが共同で開発したとされるが、諸説ある。これに加えて、ふつうのエレクトリックギターも、ファズ（音を強く歪ませる）やワウ（音色をうねらせる）といった効果装置を通して使われる。両者が旋律を掛け合う。

リズムには、不均等な拍節（拍の長さが揃わない拍子）が持ち込まれる。9/8拍子を二・二・二・三と数える型など、西洋のポピュラー音楽では一般的でない足取りが現れる。

旋律はトルコの旋法体系（音の並び方の決まり）に基づく。増2度（半音3つ分の跳躍）を含む音階が、哀愁を帯びた響きを作る。低音は動き回り、ドラムはロックのまっすぐな刻みを保つ。

歌い方は民謡の歌い回しを受け継ぎ、飾りを凝らして絞り出すように歌われる。

歌詞は、複数の出どころから来ている。民間伝承、作者不詳の詩、民衆詩人の作品、社会の現実から直接取られたものなどである。その内容は貧しさや不正への怒りで、これが同じ時代の政治の状況と重ねて受け取られた。</p>
<h2>成り立ち</h2><p>1960年代のトルコでは、欧米のロックが都市部、とくにイスタンブールの若者に広まっていた。ただ、その多くは欧米の曲を手本にしたものだった。ShadowsやVenturesのようなインストゥルメンタルや英語のカバー、外国曲にトルコ語の歌詞を付けたものなどである。

この状況を変えるきっかけの1つとなったのが、1965年に大手の新聞社が始めた音楽の競技会だ。その目的は、西洋音楽の技法や楽器を使って、トルコ音楽に新しい方向を与えることだった。民謡の編曲は、その手法の一つだった。国としての近代化と、土地に根づいた文化をどう両立させるか。この国の根本的な問いが、音楽の分野で形になった、という見方もある。

この時代には、競技会に参加した者を含め、多くの才能が現れた。Erkin Korayは、最も早くから電気楽器を使った人物のひとりだ。Orhan Gencebayと電気バーラマ(電気化したサズ)を共同で発明したとされるなど、機材の面でも先駆けだった。Cem Karacaは、アルメニア系とアゼルバイジャン系の血を引く歌手である。劇的な歌い方と社会批判の歌詞で、若い世代の代名詞となる。Barış Mançoは、1950年代の学生バンドから活動を始めた。民謡と幻覚的なロックを組み合わせ、のちに国民的な人気を得た。グループとしては、Moğollarが伝統楽器を大胆に取り入れた演奏で、フランスでも評価を得ている。女性では、Selda Bağcanが1971年、大学在学中にプロとしての音楽活動を始めた。抑圧された者の視点から歌う曲で、強い支持を集めた。

しかし、この黄金期は暴力的に終わる。1970年代を通じて、トルコでは左右の政治勢力の衝突が激しくなった。1980年9月の軍事クーデターで、国は軍の管理下に置かれた。数十万人が拘束され、拷問と処刑が行われる。Cem Karacaは1979年に国外へ出たあと、1983年に市民権を取り上げられ、1987年6月に帰国した。Selda Bağcanは複数回投獄され、旅券（パスポート）を没収されている。この弾圧で、この音楽の活動の場は大きく失われ、主流としての勢いは終わった。

それでも、1990年代後半から再発盤(過去の作品を出し直したもの)が出始めた。2006年のSelda Bağcanの再発がその代名詞となり、当時の録音が世界中の収集家と制作者に再発見された。2010年代後半には、オランダを拠点とするAltın Gün(2016年結成)のような新しい世代が現れた。こうしてこの音楽は、国際的な再評価を受けている。</p>
