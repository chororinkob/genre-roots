<h1>City Pop Modern（モダンシティポップ）とは</h1>
<p>1980年代の日本のシティポップの語法を、2010年代以降の機材と感覚で作り直した音楽。和声にも特徴があり、メジャーセブンス、テンションを重ねたナインスやイレブンス、分数コードが連続し、機能和声から少し外れた浮遊した進行が続く。特</p>
<p>1980年代の日本のシティポップの語法を、2010年代以降の機材と感覚で作り直した音楽。和声にも特徴があり、メジャーセブンス、テンションを重ねたナインスやイレブンス、分数コードが連続し、機能和声から少し外れた浮遊した進行が続く。特に4度から5度を経て3度の短和音へ進み、6度へ落ちる進行や、半音で下がる内声の動きが多用される。テンポは毎分100から120拍程度、リズムは16分音符を細かく刻むファンクとディスコの折衷で、ベースはスラップや細かい経過音を含む動くラインを弾く。音色の選択が意識的で、フェンダー・ローズの電気ピアノ、ヤマハDX7の澄んだ鐘のようなベル音とエレクトリックピアノ、アナログシンセのパッド、コーラスをかけたクリーントーンのギター、ゲートリバーブのかかったスネアが並ぶ。歌唱は張り上げず、都会的に抑制された発声で歌われ、厚いコーラスが重なる。歌詞は夜のドライブ、海、都市の景色、恋の余韻といった主題を、具体的な地名や物の名前を交えて描く。オリジナルの時代と違うのは制作環境で、宅録とインターネットでの発表が中心であり、往年の質感を意図的に模した懐かしさそのものが商品になっている点である。</p>
<h2>成り立ち</h2><p>元になったシティポップは、1970年代後半から80年代の日本で、経済的な豊かさと都市生活を背景に生まれた。山下達郎、大貫妙子、竹内まりや、角松敏生、大瀧詠一らが担い手で、1990年代に入ると（バブル崩壊は1990年3月の総量規制から始まった）、シティポップと呼べる曲は激減し、一度は時代遅れの音として忘れられた。再評価の起点は2010年代前半を中心に、インターネット上にあった。ヴェイパーウェイヴは、James Ferraro、Daniel Lopatin、Ramona Langleyら米国の制作者を先駆者とし、1980〜90年代のスムースジャズやR&amp;Bなどの素材を加工する運動で、その中からフューチャー・ファンクという、シティポップを速めて切り貼りする流れが生まれた。2013年、Macross 82-99（メキシコシティ出身で大阪を拠点とする制作者）の『ネオ東京』『SAILORWAVE』や、Saint Pepsi（米国の制作者）の『Hit Vibes』がインターネット上で広まり、フューチャー・ファンクの起点とされる。日本の80年代の音が海外の若者に発見される。決定的だったのは2017年以降で、YouTubeの推薦機能が竹内まりやの『プラスティック・ラヴ』(1984)を大量に表示し、この曲が数千万回再生される事態が起きた。松原みきの『真夜中のドア』(1979)は2020年、インドネシアの歌手による歌唱動画をきっかけにストリーミングの世界チャートに入り、40年前の曲が突然世界的なヒットとなった。これらの海外での再評価より前の2015〜16年に、日本国内でも音楽誌とツタヤ主導でシティポップの再ブランド化が起きており、新しい作り手が括られていた。Suchmos、Nulbarich、Yogee New Waves、Awesome City Club、そしてより直接に80年代の語法を用いるSTUTSや藤井風、iri、Ginger Rootといった内外の作り手が続いた。シティポップという言葉自体は、1976〜77年ごろから日本のレコード会社や音楽誌が使っていた（当時は「シティ・ポップス」の形が多かった）。後付けの販促用語として使うには注意が必要だという指摘もある。何をこの名で呼ぶかについては、当時の関係者と現在の聴き手の間で認識のずれが残っている。</p>
