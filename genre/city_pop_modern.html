<h1>City Pop Modern（モダンシティポップ）とは</h1>
<p>1980年代の日本のシティポップの表現を、2010年代以降の機材と感覚で作り直した音楽である。 音色の選び方には、はっきりした意識がある。フェンダー・ローズの電気ピアノ、ヤマハDX7の澄んだ鐘のようなベル音とエレクトリックピアノ、</p>
<p>1980年代の日本のシティポップの表現を、2010年代以降の機材と感覚で作り直した音楽である。

音色の選び方には、はっきりした意識がある。フェンダー・ローズの電気ピアノ、ヤマハDX7の澄んだ鐘のようなベル音とエレクトリックピアノ、アナログシンセのパッドが並ぶ。コーラスをかけたクリーントーンのギター、ゲートリバーブのかかったスネアも、そこに加わる。

和音にも特徴がある。メジャーセブンス、テンションを重ねたナインスやイレブンス、分数コードが使われる。和音の決まりごとから少し外れた、ふわふわした流れが続く。4度から5度を経て3度の短和音へ進み、6度へ落ちる、J-POPでも一般的な進行も用いられる。半音で下がる内声の動きが使われることもある。

テンポは毎分100から120拍前後の曲が多い。リズムは、16分音符を細かく刻むファンクとディスコの折衷だ。ベースは、スラップや細かい経過音を含む、動くラインを弾く例が多い。

歌は張り上げず、都会的に抑えた声で歌われる例が多い。そこに厚いコーラスが重なることも多い。

歌詞は、夜のドライブ、海、都市の景色、恋の余韻といったテーマを描く。具体的な地名や物の名前を交える例が多い。

元の時代と違うのは、制作の環境だ。宅録で作り、インターネットで発表する作り手も多い。往年の質感をわざと真似た懐かしさそのものが、商品になっている。</p>
<h2>成り立ち</h2><p>土台になったシティポップは、1970年代後半から80年代の日本で生まれた。背景には、経済的な豊かさと都市生活があった。担い手は、山下達郎、大貫妙子、竹内まりや、角松敏生、大瀧詠一らである。

しかし1990年代に入ると、シティポップと呼べる曲は激減した（バブル崩壊は1990年3月27日の総量規制の通達が引き金とされる）。一度は、時代遅れの音として忘れられた。

再評価のきっかけは、2010年代前半を中心に、インターネット上にあった。ヴェイパーウェイヴは、James Ferraro、Daniel Lopatin、Ramona Langley（Vektroid）ら米国の制作者を先駆者とする。1980〜90年代のスムースジャズやR&amp;Bなどの素材を加工する動きだ。その中から、シティポップを速めて切り貼りするフューチャー・ファンクという流れが生まれた。

2013年、Macross 82-99（メキシコシティ出身で大阪を拠点とする制作者）の『ネオ東京』『SAILORWAVE』や、Saint Pepsi（米国の制作者）の『Hit Vibes』がインターネット上で広まった。これらはフューチャー・ファンクの起点とされる。日本の80年代の音が、海外の若者に発見されていく。

決め手となったのは2017年以降だ。YouTubeの推薦機能が、竹内まりやの1984年のアルバム『Variety』収録曲『プラスティック・ラヴ』を大量に表示した。この曲は、数千万回も再生されるまでになった。松原みきの『真夜中のドア』(1979)は2020年、インドネシアの歌手による歌唱動画をきっかけに、ストリーミングの世界チャートに入った。40年前の曲が、突然世界的なヒットになったのである。

一方、日本国内では2015〜16年に、音楽誌とツタヤ主導でシティポップの再ブランド化が起き、新しい作り手が括られていた。これは2013年のインターネット上の動きより後で、2017年以降のYouTubeでの広まりより前のことである。Suchmos、Nulbarich、Yogee New Waves、Awesome City Clubは、2015〜16年の国内の再ブランド化の中で括られた。さらに、STUTSや藤井風、iri、Ginger Rootといった内外の作り手が続いた。このうち、80年代の語法をより直接に用いる例としては、Ginger Rootが挙げられる。

シティポップという言葉そのものは、1976〜77年ごろから日本のレコード会社や音楽誌が使っていた（当時は「シティ・ポップス」の形が多かった）。後から付けた宣伝用の言葉として使うには注意が必要だ、という見方もある。何をこの名で呼ぶかについては、当時の関係者と今の聴き手の間で、認識のずれが残っている。</p>
