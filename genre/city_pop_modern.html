<h1>City Pop Modern（モダンシティポップ）とは</h1>
<p>1980年代の日本のシティポップの語法を、2010年代以降の機材と感覚で作り直した音楽。和声が最大の特徴で、メジャーセブンス、テンションを重ねたナインスやイレブンス、分数コードが連続し、機能和声から少し外れた浮遊した進行が続く。特</p>
<p>1980年代の日本のシティポップの語法を、2010年代以降の機材と感覚で作り直した音楽。和声が最大の特徴で、メジャーセブンス、テンションを重ねたナインスやイレブンス、分数コードが連続し、機能和声から少し外れた浮遊した進行が続く。特に四度から五度を経て三度の短和音へ進み、六度へ落ちる進行や、半音で下がる内声の動きが多用される。テンポは毎分100から120拍程度、リズムは16分音符を細かく刻むファンクとディスコの折衷で、ベースはスラップや細かい経過音を含む動くラインを弾く。音色の選択が意識的で、フェンダー・ローズの電気ピアノ、ヤマハDX7の澄んだ鐘のようなベル音とエレクトリックピアノ、アナログシンセのパッド、コーラスをかけたクリーントーンのギター、ゲートリバーブのかかったスネアが並ぶ。歌唱は張り上げず、都会的に抑制された発声で歌われ、厚いコーラスが重なる。歌詞は夜のドライブ、海、都市の景色、恋の余韻といった主題を、具体的な地名や物の名前を交えて描く。オリジナルの時代と違うのは制作環境で、宅録とインターネットでの発表が中心であり、往年の質感を意図的に模した懐かしさそのものが商品になっている点である。</p>
<h2>成り立ち</h2><p>元になったシティポップは、1970年代後半から80年代の日本で、経済的な豊かさと都市生活を背景に生まれた。山下達郎、大貫妙子、竹内まりや、角松敏生、大瀧詠一らが担い手で、1980年代末のバブル崩壊とともに一度は時代遅れの音として忘れられた。再評価の起点は2010年前後、インターネット上にあった。アメリカやカナダの若い制作者が、日本の中古レコードを掘り、その一部を極端に遅くして加工するヴェイパーウェイヴという運動を起こし、その中からフューチャー・ファンクという、シティポップを速めて切り貼りする流れが生まれた。2014年頃、Saint Pepsiやカナダの制作者Macrossの作品がインターネット上で広まり、日本の80年代の音が海外の若者に発見される。決定的だったのは2017年以降で、YouTubeの推薦機能が竹内まりやの『プラスティック・ラヴ』(1984)を大量に表示し、この曲が数千万回再生される事態が起きた。松原みきの『真夜中のドア』(1979)は2020年、インドネシアの歌手による歌唱動画をきっかけにストリーミングの世界チャートに入り、40年前の曲が突然世界的なヒットとなった。この逆輸入の現象を受け、日本国内でも新しい作り手が現れる。Suchmos、Nulbarich、Yogee New Waves、Awesome City Club、そしてより直接に80年代の語法を用いるSTUTSや藤井風、iri、Ginger Rootといった内外の作り手が続いた。ただしシティポップという言葉自体、当時の日本ではほとんど使われておらず、後から海外経由で逆輸入された呼称である。何をこの名で呼ぶかについては、当時の関係者と現在の聴き手の間で認識のずれが残っている。</p>
