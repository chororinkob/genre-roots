<h1>Euphoric Hardstyle（ユーフォリックハードスタイル）とは</h1>
<p>ハードスタイルの骨格を保ちながら、旋律と高揚感をいちばん前に押し出したスタイルだ。 土台は、一分間に150拍前後の四つ打ちである。1拍ごとにキックを踏み、各拍に置かれるキックが決定的な役割を果たす。このキックは、ただの打撃音ではな</p>
<p>ハードスタイルの骨格を保ちながら、旋律と高揚感をいちばん前に押し出したスタイルだ。

土台は、一分間に150拍前後の四つ打ちである。1拍ごとにキックを踏み、各拍に置かれるキックが決定的な役割を果たす。このキックは、ただの打撃音ではない。頭の短い破裂音と、そこに続く、音程を持った長い胴体（音が伸びて消えていく部分）でできている。胴体の音程を下げていくことで、独特の圧迫感が生まれる。キックの尾部に音程を付けて、低音として使う。拍の裏には、リバースベースを置くのが一般的だ。

旋律は長調・短調の双方があるとされ、感情的で歌いやすいのが特徴だ。ピアノや弦楽器をまねた音色で鳴らされることが多い。ここが、同じ系統の他のスタイルとの最大の違いである。攻撃性よりも、感情の高ぶりと多幸感が目的に据えられている。

歌には、しばしば女性の歌声が使われる。歌の内容は、しばしば喪失、再起、仲間との結束といった主題を扱う。

曲の組み立ては、はっきりと演出されている。盛り上がりに向けて音を足しながら緊張を高める区間、キックやドラムが止まり、旋律（ピアノ・ボーカルなど）が前面に出る区間（ブレイクダウン）、そして全部の要素が戻る解放の区間が、多くの曲で決まった順序で並ぶ。

演奏の場は、数万人規模の屋外フェスや大型の屋内イベントだ。音そのものが、照明と花火を伴う演出の一部として設計されている。</p>
<h2>成り立ち</h2><p>ハードスタイルは、1990年代後半にオランダ・ベルギー・イタリアで形づくられたとされる。ハードトランスに由来する特徴を持ち、ハードコアの影響を受けたとされる。初期は毎分140拍前後で、トランス寄りの旋律も含まれていた。2000年代前半には、硬く攻撃的な音楽として定着したとされる。

転機は2010年前後である。この時期、屋外の大規模な音楽祭が拡大した。旋律を重視する動きは2000年代後半に芽生え、2010年前後からユーフォリックがジャンルとして定着していった。

中心となったのは、オランダを中心とする作り手たちだ。HeadhunterzとWildstylezは、2008年に先駆けのアルバム『Project One』を発表した。スウェーデン出身のウェイステッド・ペンギンズ（Wasted Penguinz）や、ノイズコントローラーズらが、これに続いたとされる。ピアノや女性ボーカルが多く使われる傾向があり、この方向性は一つのスタイルとして定着していった。

ユーフォリックが演奏された代表的な場の例は、大規模な祭典である。オランダのビッディングハウゼンのWalibi Holland隣接地で2011年から開かれるディフェクォンワン（以前はアルメールで開催）や、ベルギーのトゥモローランドがそうだ。これらの催しは、花火、映像、照明を含めた総合的な演出を前提としている。

一方で、暗い音を求める作り手や聴き手もいた。2010年前後には、ロー・ハードスタイルが生まれた。その時期には諸説ある。以後、旋律重視と硬派の二つの流れが並んで走る構図が続いている。</p>
