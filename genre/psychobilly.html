<h1>Psychobilly（サイコビリー）とは</h1>
<p>1950年代のロカビリーに、パンクの速度と攻撃性、そしてホラー映画の題材を接続した様式。編成の核となるのはウッドベース、すなわち大型の弦楽器を立てて演奏するもので、弦を指で強く引いて指板に叩きつけるスラップ奏法により、音程と同時に</p>
<p>1950年代のロカビリーに、パンクの速度と攻撃性、そしてホラー映画の題材を接続した様式。編成の核となるのはウッドベース、すなわち大型の弦楽器を立てて演奏するもので、弦を指で強く引いて指板に叩きつけるスラップ奏法により、音程と同時に打楽器的な破裂音を出す。この音がリズムの骨格を担い、ドラムのバスドラムの役割を兼ねる。ドラムは最小構成で、スネアとバスドラム、そしてシンバル一枚という編成も多く、立って叩かれることもある。ギターはグレッチやフェンダーの中空胴の楽器を用い、深いスプリング・リバーブとテープ・エコーをかけた1950年代的な音色に、パンク由来の歪みを加える。BPMは160〜220と速く、リズムは8分音符を跳ねさせるシャッフル、あるいは二拍を強調するアップライト的な刻み。和声はブルース進行と短調の単純な循環が中心。歌唱はしゃっくりのような発声、いわゆるヒカップや、巻き舌、そして叫びを多用する。歌詞はゾンビ、吸血鬼、宇宙人、殺人鬼、改造車といった主題を、深刻ぶらずに滑稽に扱う。外見も特徴的で、前髪を高く立てたクアッフと呼ばれる髪型が定番である。</p>
<h2>成り立ち</h2><p>1970年代末から1980年代初頭のロンドンで生まれた。名称そのものは1976年、カントリー歌手Johnny Cashの曲One Piece at a Timeの歌詞に登場したのが早い例とされるが、音楽の呼称として定着させたのはThe Crampsである。1976年にニューヨークで結成された彼らは、1950年代のB級ホラー映画と初期ロカビリーへの偏愛を、パンクの粗さで表現し、自らの音楽を宣伝する際にサイコビリーという語を用いた。ただし彼ら自身はこの分類を否定している。ジャンルとして確立したのはイギリスで、1980年に結成されたThe Meteorsが決定的な役割を果たした。中心人物P. Paul Fenechは、政治的な主張を一切持ち込まないという方針を掲げ、これがシーンの規範となった。決定的な場所となったのが、1982年にロンドンのハマースミスで始まったクラブKlub Foot で、ここでThe Meteors、Guana Batz、Demented Are Go、King Kurtらが演奏し、シーンが形成された。この会場での演奏を収めた編集盤が各国に流通し、国際的な広がりを生んだ。ドイツと日本には特に強く根付き、ドイツではMad Sinが、日本では1980年代末からバトル・ロッカーズや、後にザ・クロマニヨンズへ至る流れの周辺で受容された。米国では1990年代にNekromantixやTiger Army が、より旋律的な系統を作った。2000年代以降は、スペインのバルセロナで毎年開かれるPsychobilly Meetingが最大の国際的な集会となっている。シーンは常に小規模だが、独自の服装、髪型、踊り方を含む完結した文化として、40年以上にわたり途切れずに続いている。</p>
