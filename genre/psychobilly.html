<h1>Psychobilly（サイコビリー）とは</h1>
<p>1950年代のロカビリーに、パンクの速度と攻撃性、そしてホラー映画の題材を接続した様式。編成の核となるのはウッドベース、すなわち大型の弦楽器を立てて演奏するもので、弦を指で強く引いて指板に叩きつけるスラップ奏法により、音程と同時に</p>
<p>1950年代のロカビリーに、パンクの速度と攻撃性、そしてホラー映画の題材を接続した様式。編成の核となるのはウッドベース、すなわち大型の弦楽器を立てて演奏するもので、弦を指で強く引いて指板に叩きつけるスラップ奏法により、音程と同時に打楽器的な破裂音を出す。この音がリズムの骨格を担う。エレキギター、ウッドベース、ドラムの3人組の編成が多い。ギターはグレッチなどの中空胴（セミアコ）の楽器（後にソリッドギターも増えた）を用い、深いスプリング・リバーブとテープ・エコーをかけた1950年代的な音色に、真空管アンプのオーバードライブによる歪みを加える。BPMは160〜220と速く、リズムは8分音符を跳ねさせるシャッフル、あるいは2拍を強調するアップライト的な刻み。和声はブルース進行と短調の単純な循環が中心。歌唱はしゃっくりのような発声、いわゆるヒカップや、巻き舌、そして叫びを多用する。歌詞はゾンビ、吸血鬼、宇宙人、殺人鬼、改造車といった主題を、深刻ぶらずに滑稽に扱う。外見も特徴的で、前髪を高く立てたクアッフと呼ばれる髪型が定番である。</p>
<h2>成り立ち</h2><p>起源にはニューヨークの1970年代のパンクの地下シーン（The Crampsが先駆者）とする説があり、ジャンルとして確立したのは、1980年に結成されたThe Meteorsなどのイギリスとされる。名称そのものは1976年、カントリー歌手Johnny Cashが録音した曲One Piece at a Time（作者はWayne Kemp）の歌詞に登場したのが早い例とされる。The Crampsは先駆者・原型とされるが、サイコビリーという語を音楽の説明に最初に使ったのはThe Meteorsとされる。1976年にニューヨークで結成された彼らは、1950年代のB級ホラー映画と初期ロカビリーへの偏愛を、パンクの粗さで表現し、ライブのチラシに「psychobilly」と載せたが、それは様式名のつもりではなく、興行用の言葉だったと本人たちは説明している。ジャンルとして確立したのはイギリスで、1980年に結成されたThe Meteorsが決定的な役割を果たした。中心人物P. Paul Fenechが率いるThe Meteorsは、非政治的な姿勢を示し、これがシーンの規範となった。決定的な場所となったのが、1982年にロンドンのハマースミスで始まったクラブKlub Foot で、ここでThe Meteors、Guana Batz、Demented Are Go、King Kurtらが演奏し、シーンが形成された。この会場での演奏を収めた編集盤が各国に流通し、国際的な広がりを生んだ。英国のほか、ドイツ、デンマーク、米国、日本、ブラジル、カナダなどにも広がり、ドイツではMad Sinが活動し、日本でもノイロウゼやMad Mongolsなどのバンドが活動した。デンマークで1989年に結成されたNekromantixは2000年代初頭に米国（南カリフォルニア）へ移り、1996年にバークレーで結成されたTiger Armyは1999年のデビュー作以降、米国を代表する存在になった。1992年にスペインのPineda de Mar（カレリャとする記述もある）で始まったPsychobilly Meetingは、世界最大級のサイコビリーの祭典とされ、現在はバルセロナ県のSanta Susannaで毎年開かれている。シーンは規模や勢いに波があったが、独自の服装、髪型、踊り方を含む完結した文化として、40年以上にわたり続いている。</p>
