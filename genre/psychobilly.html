<h1>Psychobilly（サイコビリー）とは</h1>
<p>サイコビリーは、1950年代のロカビリーに、パンクの速度と攻撃性、そしてホラー映画の題材を接続した音楽だ。 編成の核は、ウッドベース（大型の弦楽器を立てて演奏するもの）である。弦を指で強く引いて指板に叩きつけるスラップ奏法（弦を叩</p>
<p>サイコビリーは、1950年代のロカビリーに、パンクの速度と攻撃性、そしてホラー映画の題材を接続した音楽だ。

編成の核は、ウッドベース（大型の弦楽器を立てて演奏するもの）である。弦を指で強く引いて指板に叩きつけるスラップ奏法（弦を叩きつけるように弾く奏法）で、音程と同時に打楽器的な破裂音を出す。この音がリズムの骨格を担う。エレキギター、ウッドベース、ドラムの3人組の編成が多い。

ギターは、グレッチなどの中空胴（セミアコ）の楽器を用いる（後にソリッドギターも増えた）。深いスプリング・リバーブ（ばねで作る残響）とテープ・エコー（録音テープで作る反響）をかけた、1950年代的な音色になることが多い。そこに、真空管アンプのオーバードライブ（音が自然に歪む現象）による歪みを加えることが多い。

BPM（1分間の拍数）は非常に速いテンポである。リズムは、8分音符を跳ねさせるシャッフルか、2拍を強調するアップライト的な刻みであることが多い。和声（コードの響き）は、ブルース進行と短調の単純な循環が中心になることが多い。

歌唱は、しゃっくりのような発声、いわゆるヒカップを多用する。巻き舌や叫びも多い。

歌詞は、ゾンビ、吸血鬼、宇宙人、殺人鬼、改造車といった主題を扱う。深刻ぶらずに、滑稽に描く。

外見も特徴的だ。男性は、高いウェッジ型のポンパドール／クアッフ、軍隊風の刈り込み、モヒカンなどである。</p>
<h2>成り立ち</h2><p>起源には、ニューヨークの1970年代のパンクの地下の音楽の世界（The Crampsが先駆者）とする説がある。ジャンルとして定着したのは、1980年に結成されたThe Meteorsなどのイギリスとされる。

名称そのものは、1976年、カントリー歌手Johnny Cashが録音した曲One Piece at a Time（作者はWayne Kemp）の歌詞に登場したのが早い例とされる。The Crampsは先駆者・原型とされる。サイコビリーという語を音楽の説明に最初に使ったのは、The Meteorsとする資料がある。ただし、The Crampsは1970年代に、すでにチラシでこの語を使っていた。諸説ある。

1976年結成でチラシに「psychobilly」と載せたのは、The Crampsである。The Crampsは、1950年代のB級ホラー映画と初期ロカビリーへの偏愛を、パンクの粗さで表現した。ライブのチラシに「psychobilly」と載せたが、それは音楽のスタイルの名前のつもりではなく、興行用の言葉だったと本人たちは説明している。

ジャンルとして定着したのはイギリスで、1980年に結成されたThe Meteorsが決定的な役割を果たした。中心人物P. Paul Fenechが率いるThe Meteorsは、非政治的な姿勢を示した。これが、この音楽の世界の決まりとなった。

決定的な場所となったのが、1982年にロンドンのハマースミスで始まったクラブKlub Footである。ここでの常連は、Demented Are Go(24回)、Guana Batz、The Meteors、Frenzy、Restlessなどだった。King Kurtは出演歴はあるが1回のみである。こうして、この音楽の世界が形成された。この会場での演奏を収めた編集盤「Stomping at the Klub Foot」は、1984年に最初の盤が出た。ABC Recordsから、6巻がLP・CDで出ている。Guana BatzのJohnny Bowlerは、Klub Footを「focal point for the whole psychobilly scene」と語っている。

英国のほか、ドイツ、デンマーク、米国、日本、ブラジル、カナダなどにも広がった。ドイツではMad Sinが活動し、日本でもノイロウゼやMad Mongolsなどのバンドが活動した。デンマークで1989年に結成されたNekromantixは、2000年代初頭に米国（南カリフォルニア）へ移った。1996年にバークレーで結成されたTiger Armyは、1999年のデビュー作以降、米国を代表する存在になった。

1992年には、スペインのCalella(バルセロナ県)で、ドイツ発の非公式な「サイコ休暇」の集まりとして、Psychobilly Meetingが始まった。世界最大級のサイコビリーの祭典とされる。Santa Susannaでの開催は2024年からで、それ以前はPineda de Marで開かれていた。2020〜2021年は開かれず、2022年は「28.2回」として再開した。

この世界は、規模や勢いに波があった。それでも、独自の服装、髪型、踊り方を含む完結した文化として、40年以上にわたり続いている。</p>
