<h1>Film Score（サントラ）とは</h1>
<p>映像作品のために書かれ、映像と同期（映像と音を合わせること）して鳴らされる音楽である。他の音楽と大きく異なるのは、それ単独で完結せず、映像の進行に強く規定される点にある。場面の転換と音の変化を精密に合わせる必要があるため、通常は完</p>
<p>映像作品のために書かれ、映像と同期（映像と音を合わせること）して鳴らされる音楽である。他の音楽と大きく異なるのは、それ単独で完結せず、映像の進行に強く規定される点にある。場面の転換と音の変化を精密に合わせる必要があるため、通常は完成映像に合わせて、時間の目盛りを見ながら作曲されるが、脚本と監督との対話に基づき、映像をほとんど見ずに書いた例もある(ジマー本人の談話によれば『インセプション』)。演奏の際には、指揮者と奏者が耳に一定の刻みを聞きながら演奏することで同期が保たれる。代表的な技法の一つが示導動機の手法で、登場人物や概念ごとに短い音型を割り当て、場面に応じてそれを変形させる。この手法は19世紀の楽劇（物語と音楽を一体にしたオペラ）から受け継がれたものである。編成は大人数の管弦楽が伝統的だが、電子楽器のみ、独奏楽器のみ、あるいは加工された物音のみで構成される場合もある。和声（コードの響き）は聴き手の情動を直接操作するために選ばれ、不安を示す不協和音、解決しない持続音、高揚を導く上行の進行といった定型が確立している。音量と密度の設計も重要で、台詞のある場面では周波数帯域（音の高さの範囲）を空けて声を通し、台詞のない場面で音楽が前へ出る。作品の一部でありながら、意識されないことが理想とされる場合も多い、逆説的な音楽である。</p>
<h2>成り立ち</h2><p>無声映画の時代から、上映には生演奏が伴っていた。しかし音を映像に同期させて記録する技術が確立したことで、音楽は作品の一部として設計されるようになる。転機のひとつは1933年、Max Steinerが巨大な怪獣を描いた『キング・コング』のために書いた音楽で、映像との同期における画期的出来事、ファンタジー・冒険映画の作曲法の転換点と位置づけられている。著名な作曲家による本格的な映画用の音楽の早い例には、サン＝サーンスの1908年の作品があり、「最初」の映画音楽には諸説ある。1930年代のハリウッドには、もう一つの大きな事情があった。ナチスの台頭を背景に、Korngold、Waxman、Rózsaらヨーロッパ出身の作曲家が相次いでハリウッドに加わったのである。ただし基礎は、それ以前に渡米していたSteinerらとの合流で形づくられた。ウィーンで神童と称されたErich Wolfgang Korngoldはその代表で、Steiner、Newmanらとともに、ハリウッドの交響楽的な音楽の創始者の一人とされる。Bernard Herrmannは『市民ケーン』（1941年）で映画音楽に進出し、1930年代ハリウッドの説明的な書き方を離れた心理的な書法を示した。不安と緊張を作る書法はHitchcock作品（1950年代後半〜1960年）で広く知られる。1960年の作品において、彼が弦楽器だけで書いた鋭い音は、映画音楽の歴史における最も有名な数秒のひとつとなった。劇伴（場面を彩る音楽）としてのジャズは1950年代から本格化し(1951年『欲望という名の電車』、1959年『或る殺人』)、電子楽器のテルミンは1940年代半ば（1945年のMiklós Rózsaの作品）から映画音楽に入っていて、1950年代に採用が増え、1956年『禁断の惑星』は商業長編映画として初の全編電子音の映画音楽である。1960年代にはイタリアのEnnio Morriconeが、西部劇の伝統的な管弦楽の書き方に代えて、口笛、鞭の音、人の声、電気ギターといった非正統的な素材を用い、西部劇の音を刷新する。1970年代半ば、管弦楽の伝統は思わぬ形で復活した。John Williamsが1975年の『ジョーズ』と1977年の『スター・ウォーズ』で手掛けた音楽が大きな成功を収め、古典的なハリウッド音楽の様式が復活したと論じられ、大作映画に大編成の管弦楽が再び用いられるようになったのである。1980年代以降は電子楽器が普及し、Vangelisのように、シンセサイザーを中心に、ピアノや打楽器なども組み合わせて詩的な世界を作る例も現れた。Vangelisは1981年公開の映画「炎のランナー」の音楽で、1982年にアカデミー作曲賞を受賞している。近年ではHans Zimmerが、電子音と管弦楽を融合させる作風で知られ、質感やリズム、低音を重視すると評される。Remote Control Productionsを通じた共同制作体制を持ち、彼の曲は仮音楽（編集中に仮に貼る既存の音楽）として使われやすいとされ、『シン・レッド・ライン』の「The Journey to the Line」はその例として知られる。同時に、映像編集の段階で仮に貼られた既存の音楽に作曲家が縛られるという構造的な問題も、繰り返し指摘されている。</p>
