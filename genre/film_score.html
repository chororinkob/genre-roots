<h1>Film Score（サントラ）とは</h1>
<p>映像作品のために書かれ、映像と同期（映像と音を合わせること）して鳴らされる音楽である。他の音楽と決定的に異なるのは、それ単独で完結せず、映像の時間に厳密に従属する点にある。1秒未満の精度で場面の転換と音の変化を合わせる必要があるた</p>
<p>映像作品のために書かれ、映像と同期（映像と音を合わせること）して鳴らされる音楽である。他の音楽と決定的に異なるのは、それ単独で完結せず、映像の時間に厳密に従属する点にある。1秒未満の精度で場面の転換と音の変化を合わせる必要があるため、通常は完成映像に合わせて、時間の目盛りを見ながら作曲されるが、脚本と監督との対話に基づき、編集期には完成映像を見ずに書いた例もある(ジマーの『インセプション』)。演奏の際には、指揮者と奏者が耳に一定の刻みを聞きながら演奏することで同期が保たれる。代表的な技法の一つが示導動機の手法で、登場人物や概念ごとに短い音型を割り当て、場面に応じてそれを変形させる。この手法は19世紀の楽劇（物語と音楽を一体にしたオペラ）から受け継がれたものである。編成は大人数の管弦楽が伝統的だが、電子楽器のみ、独奏楽器のみ、あるいは加工された物音のみで構成される場合もある。和声（コードの響き）は聴き手の情動を直接操作するために選ばれ、不安を示す不協和音、解決しない持続音、高揚を導く上行の進行といった定型が確立している。音量と密度の設計も重要で、台詞のある場面では周波数帯域（音の高さの範囲）を空けて声を通し、台詞のない場面で音楽が前へ出る。作品の一部でありながら、意識されないことが理想とされる場合も多い、逆説的な音楽である。</p>
<h2>成り立ち</h2><p>無声映画の時代から、上映には生演奏が伴っていた。しかし音を映像に同期させて記録する技術が確立したことで、音楽は作品の一部として設計されるようになる。転機のひとつは1933年、Max Steinerが巨大な怪獣を描いた『キング・コング』のために書いた音楽で、映像との同期における画期的出来事、ファンタジー・冒険映画の作曲法の転換点と位置づけられている。独自作曲の映画音楽は、サン＝サーンスの1908年の作品などが先行する。1930年代のハリウッドには、もう一つの決定的な事情があった。ナチスの台頭により、ヨーロッパの一流の作曲家が大量に亡命してきたのである。ウィーンで神童と称されたErich Wolfgang Korngoldはその代表で、彼が持ち込んだ後期ロマン派の豊麗な手法が、ハリウッドの標準的な音の基盤となった。1940年代にはBernard Herrmannが、従来の甘美な様式を拒み、不安と緊張を作る手法を確立する。1960年の作品において、彼が弦楽器だけで書いた鋭い音は、映画音楽の歴史における最も有名な数秒となった。ジャズは1950年代から導入され(1951年『欲望という名の電車』、1959年『或る殺人』)、電子要素も1950年代から入り、1956年『禁断の惑星』は史上初の全編電子音の映画音楽である。1960年代にはイタリアのEnnio Morriconeは、口笛、鞭の音、人の声、電気ギターといった従来の映画音楽にはなかった素材によって、西部劇の音を一変させる。1970年代半ば、管弦楽の伝統は思わぬ形で復活した。John Williamsが1975年と1977年に手掛けた2本の作品が空前の成功を収め、古典的なハリウッド音楽の様式が復活し、大作映画に大編成の管弦楽が再び用いられるようになったのである。1980年代以降は電子楽器が普及し、Vangelisのように、シンセサイザーを中心に、ピアノや打楽器なども組み合わせて詩的な世界を作る例も現れた。近年ではHans Zimmerが、質感やリズム、低音を重視する作風で知られ、Remote Control Productionsを通じた共同制作体制を持ち、彼の曲は仮音楽（編集中に仮に貼る既存の音楽）として多用される。同時に、映像編集の段階で仮に貼られた既存の音楽に作曲家が縛られるという構造的な問題も、繰り返し指摘されている。</p>
