<h1>Film Score（サントラ）とは</h1>
<p>映像作品のために書かれ、映像と同期して鳴らされる音楽である。他の音楽と決定的に異なるのは、それ単独で完結せず、映像の時間に厳密に従属する点にある。一秒未満の精度で場面の転換と音の変化を合わせる必要があるため、作曲は映像の完成後に、</p>
<p>映像作品のために書かれ、映像と同期して鳴らされる音楽である。他の音楽と決定的に異なるのは、それ単独で完結せず、映像の時間に厳密に従属する点にある。一秒未満の精度で場面の転換と音の変化を合わせる必要があるため、作曲は映像の完成後に、時間の目盛りを見ながら行われる。演奏の際には、指揮者と奏者が耳に一定の刻みを聞きながら演奏することで同期が保たれる。技法の中核をなすのが示導動機の手法で、登場人物や概念ごとに短い音型を割り当て、場面に応じてそれを変形させる。この手法は19世紀の楽劇から受け継がれたものである。編成は大人数の管弦楽が伝統的だが、電子楽器のみ、独奏楽器のみ、あるいは加工された物音のみで構成される場合もある。和声は聴き手の情動を直接操作するために選ばれ、不安を示す不協和音、解決しない持続音、高揚を導く上行の進行といった定型が確立している。音量と密度の設計も重要で、台詞のある場面では周波数帯域を空けて声を通し、台詞のない場面で音楽が前へ出る。作品の一部でありながら、意識されないことが理想とされる場合も多い、逆説的な音楽である。</p>
<h2>成り立ち</h2><p>無声映画の時代から、上映には生演奏が伴っていた。しかし音を映像に同期させて記録する技術が確立したことで、音楽は作品の一部として設計されるようになる。転機は1933年、Max Steinerが巨大な怪獣を描いた作品のために、全編にわたる管弦楽の音楽を書いたことである。それまで映画音楽は場面の合間を埋める程度のものだったが、彼は音楽が感情の推進力になりうることを示した。1930年代のハリウッドには、もう一つの決定的な事情があった。ナチスの台頭により、ヨーロッパの一流の作曲家が大量に亡命してきたのである。ウィーンで神童と称されたErich Wolfgang Korngoldはその代表で、彼が持ち込んだ後期ロマン派の豊麗な語法が、ハリウッドの標準的な音の基盤となった。1940年代にはBernard Herrmannが、従来の甘美な様式を拒み、不安と緊張を作る書法を確立する。1960年の作品において、彼が弦楽器だけで書いた鋭い音は、映画音楽の歴史における最も有名な数秒となった。1960年代にはジャズや電子音が導入され、イタリアのEnnio Morriconeは、口笛、鞭の音、人の声、電気ギターといった非正統的な素材によって、西部劇の音を一変させる。1970年代半ば、管弦楽の伝統は思わぬ形で復活した。John Williamsが1975年と1977年に手掛けた二本の作品が空前の成功を収め、以後、大作映画には大編成の管弦楽という図式が定着したのである。1980年代以降は電子楽器が普及し、Vangelisのように電子音のみで詩的な世界を作る例も現れた。近年ではHans Zimmerが、音楽的な旋律より音の質感と低音の圧力を重んじる手法を確立し、その影響下にある作曲家が業界の多くを占めるに至っている。同時に、映像編集の段階で仮に貼られた既存の音楽に作曲家が縛られるという構造的な問題も、繰り返し指摘されている。</p>
<h2>代表曲</h2><ul><li>Star Wars Main Theme (John Williams)</li><li>The Good, the Bad and the Ugly (Ennio Morricone)</li><li>Inception (Hans Zimmer)</li><li>Merry Christmas Mr. Lawrence (Ryuichi Sakamoto)</li><li>Spirited Away (Joe Hisaishi)</li></ul>
