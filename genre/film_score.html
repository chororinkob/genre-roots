<h1>Film Score（サントラ）とは</h1>
<p>映画音楽は、映像作品のために書かれ、映像と同期（映像と音を合わせること）して鳴らされる音楽である。 他の音楽と決定的に異なるのは、それ単独で完結せず、映像の進行に強く規定される点にある。1秒未満の精度で場面の転換と音の変化を合わせ</p>
<p>映画音楽は、映像作品のために書かれ、映像と同期（映像と音を合わせること）して鳴らされる音楽である。

他の音楽と決定的に異なるのは、それ単独で完結せず、映像の進行に強く規定される点にある。1秒未満の精度で場面の転換と音の変化を合わせる必要がある。そのため通常は、完成映像に合わせて、時間の目盛りを見ながら作曲される。ただし、Zimmer本人の談話によれば、脚本と監督との対話に基づき、編集期には完成映像を見ずに書いた例もある(ジマーの『インセプション』)。演奏の際には、指揮者と奏者が耳に一定の刻みを聞きながら演奏することで、同期が保たれる。

編成は、大人数の管弦楽が伝統的だ。ただし、電子楽器のみ、独奏楽器のみ、あるいは加工された物音のみで構成される場合もある。

和声（コードの響き）は、聴き手の情動を直接操作するために選ばれる。不安を示す不協和音、解決しない持続音、高揚を導く上行の進行といった定型が固まっている。

代表的な技法の一つが、示導動機の手法だ。登場人物や概念ごとに短い音型を割り当て、場面に応じてそれを変形させる。この手法は、19世紀の楽劇（物語と音楽を一体にしたオペラ）から受け継がれたものである。

音量と密度の設計も重要だ。台詞のある場面では、周波数帯域（音の高さの範囲）を空けて声を通す。台詞のない場面では、音楽が前へ出る。

作品の一部でありながら、意識されないことが理想とされる場合も多い。逆説的な音楽である。</p>
<h2>成り立ち</h2><p>無声映画の時代から、上映には生演奏が伴っていた。しかし音を映像に同期させて記録する技術が定着したことで、音楽は作品の一部として設計されるようになる。

転機のひとつは1933年、Max Steinerが巨大な怪獣を描いた『キング・コング』のために書いた音楽だ。映像との同期における画期的出来事で、ファンタジー・冒険映画の作曲法の転換点と位置づけられている。サン＝サーンスの1908年の作品は、著名な作曲家による本格的な映画用スコアの早い例である。「最初」には諸説ある。

1930年代のハリウッドには、ナチスが勢力を伸ばした時代を背景に、Korngold、Waxman、Rózsaら欧州出身の作曲家が相次いで加わった。ただし基礎は、それ以前に来ていたSteinerらとの合流で形づくられた。ウィーンで神童と称されたErich Wolfgang Korngoldはその代表で、Steiner、Newmanらとともに、ハリウッドの交響楽的スコアの創始者の一人とされる。

Bernard Herrmannは『市民ケーン』（1941）で映画音楽に進出し、説明的な書法を離れた心理的な書法を示した。不安・緊張の書法は、Hitchcock作品（1950年代後半〜1960年）で広く知られた。1960年の作品において、彼が弦楽器だけで書いた鋭い音は、映画音楽の歴史における最も有名なものの一つとなった。

劇伴としてのジャズは1950年代から本格化した(1951年『欲望という名の電車』、1959年『或る殺人』)。電子楽器の映画音楽への導入は1940年代半ば（1945年）で、1950年代は採用が増えた。1956年『禁断の惑星』は、商業長編映画として初の全編電子音スコアである。1960年代にはイタリアのEnnio Morriconeが、西部劇の伝統的なオーケストラ書法に代えて、口笛・鞭・声・電気ギターなど非正統的な素材を用い、西部劇の音を刷新した。

1970年代半ば、管弦楽の伝統は思わぬ形で復活した。John Williamsが1975年と1977年に手掛けた2本の作品が空前の成功を収めた。古典的なハリウッド音楽のスタイルが復活し、大作映画に大編成の管弦楽が再び用いられるようになったのである。

1980年代以降は電子楽器が普及した。Vangelisのように、シンセサイザーを中心に、ピアノや打楽器なども組み合わせて詩的な世界を作る例も現れた。Vangelisは1981年公開の映画「炎のランナー」の音楽で、1982年にアカデミー作曲賞を受賞している。

近年ではHans Zimmerが、質感やリズム、低音を重視する作風と評されることが多い。Remote Control Productionsを通じた共同制作体制を持ち、彼の曲は仮音楽（編集中に仮に貼る既存の音楽）として使われることも多い。同時に、映像編集の段階で仮に貼られた既存の音楽に作曲家が縛られるという構造的な問題も、繰り返し指摘されている。</p>
