<h1>Post-Disco（ポストディスコ）とは</h1>
<p>ポストディスコは、ディスコが商業的に排斥された直後のアメリカで生まれたダンス音楽だ。ディスコの語法を引き継ぎながら、要素を大幅に削ぎ落とした形で作られた。 最大の変化は編成にある。ディスコは大人数の弦楽合奏と管楽器を抱えていた。こ</p>
<p>ポストディスコは、ディスコが商業的に排斥された直後のアメリカで生まれたダンス音楽だ。ディスコの語法を引き継ぎながら、要素を大幅に削ぎ落とした形で作られた。

最大の変化は編成にある。ディスコは大人数の弦楽合奏と管楽器を抱えていた。これに対し、ポストディスコは少人数へ縮小する傾向がある。電子楽器は年を追って増え、1980年代半ばに支配的になった。楽器数は減ったが、シンセのリフやキーボードのレイヤーは多く、メロディアスな曲も多い。

リズムはドラムマシン、あるいは生ドラムが担い、曲ごとに機種は異なる。Linn LM-1やRoland TR-808などの機種名は、あくまで例である。低音はしばしばMinimoogなどのシンセ・ベースで演奏された。特に1980年代半ば以降は、シンセ・ベースが主流になった。テンポは約100〜116（資料により〜120）と、ディスコより遅いものが多い。

歌は主役であり続ける。ゴスペルやソウル由来の力強い歌唱が、簡素な伴奏の上で際立つ。

曲の構造は繰り返しを基調とする。12インチで長尺化する曲が多く、ブレイクダウンを設ける曲もある。踊り場での実用性が最も重視された基準の一つとなっている点は、ディスコから受け継がれている。ハウスはディスコの流れ（フィリー・ディスコやSalsoul）、エレクトロ・ファンク、イタロ・ディスコなど複数の源流から生まれた。ポストディスコは、それを橋渡しした。</p>
<h2>成り立ち</h2><p>1979年7月12日、シカゴの野球場で、ある出来事が起きた。これがポストディスコの契機の一つとされる。

ラジオ司会者Steve Dahlがホワイトソックスと共同で企画した催しは、ディスコのレコードを持参した観客を安価で入場させ、それを爆破するというものだった。群衆は制御を失って暴徒化し、第2試合はいったん延期された。翌日にはホワイトソックスの没収試合となる騒動に発展した。

この事件は、表向きは音楽の趣味の問題とされた。しかし当時のディスコは、黒人、ラテン系、そして同性愛者の文化と強く結びついていた。そのため、そこに人種差別と同性愛嫌悪が含まれていたという有力な指摘があり、議論されている(Dahl本人は否定している)。

この時期、米国の音楽産業は約25年続いた成長が止まった。不況が重なる中でディスコ離れが進み、破綻するレーベルが出たほか、ラジオは編成を戻した。大手は契約アーティストを絞った。

それでも、踊る人々が消えたわけではなかった。ニューヨークでは、PreludeやWest End、Salsoulといった独立系レーベルが制作を続けた。1981年にWest Endから出たTaana Gardnerの楽曲は、100 BPMと当時のディスコより遅いテンポで、重い低音を響かせた。この曲は踊り場でヒットした。Preludeから出たD Trainの作品は、シンセサイザーによる低音と力強い歌唱を組み合わせ、このスタイルの典型を示した。制作の現場では、Kashifがシンセ技術とMIDIの導入で都市型ポップの先駆者とされた。Leroy Burgessは、Patrick Adamsとともにユニバーサル・ロボット・バンドで活動した制作者である。

重要な場所となったのは、ニューヨークのParadise Garageというクラブだ。そこで選曲を担ったLarry Levanは、既存の楽曲を大胆に加工して流した。こうしてリミックス文化を発展させた主要な一人となった。彼が制作に関わったPeech Boysの1982年の楽曲は、残響と間を大胆に用いた。ダブの手法をダンス音楽に持ち込んだものとして重要である。

同時期、Arthur Russellは現代音楽の訓練を背景に、この分野に前衛的な感覚を注ぎ込んだ。ZE Recordsを中心とする一群は、ノー・ウェイヴ／ミュータント・ディスコと呼ばれる風変わりな作品を作り、後年高く評価されている。

この数年間に磨かれた、機械のリズムと簡素な構成という方法は、シカゴのハウスに影響を与えた。デトロイト・テクノはParliament-Funkadelic、Kraftwerk、electro、シカゴ・ハウスなどの影響が重なって生まれた。</p>
