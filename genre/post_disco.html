<h1>Post-Disco（ポストディスコ）とは</h1>
<p>ディスコが商業的に排斥された直後のアメリカで、その語法を引き継ぎながら要素を大幅に削ぎ落とした形で作られたダンス音楽である。最大の変化は編成にある。ディスコが大人数の弦楽合奏と管楽器を擁していたのに対し、こちらは経済的な事情もあっ</p>
<p>ディスコが商業的に排斥された直後のアメリカで、その語法を引き継ぎながら要素を大幅に削ぎ落とした形で作られたダンス音楽である。最大の変化は編成にある。ディスコが大人数の弦楽合奏と管楽器を擁していたのに対し、こちらは経済的な事情もあって少人数へ縮小し、代わりに電子楽器が前面に出た。リズムはLinn LM-1やRoland TR-808といった初期のドラムマシンが担い、その硬く均質な打点が音楽の骨格となる。低音はシンセサイザーによる太く丸い音型が跳ねるように動き、この電子的なベースラインこそが聴かせどころとなる。テンポは概ね110から120 BPMと、ディスコよりやや落ち着いている。上物は極端に少なく、電気ピアノの和音、短く刺し込むシンセ、そして深い残響をかけた打楽器が置かれる程度で、隙間が多い。この余白の多さが、後のハウスへ直結する感覚を用意した。歌は主役であり続け、ゴスペルやソウル由来の力強い歌唱が、簡素な伴奏の上で際立つ。曲の構造は繰り返しを基調とし、12インチ盤で6分から8分に引き伸ばされ、途中で歌が完全に消えて演奏だけになる区間が設けられる。踊り場での実用性が全ての判断基準となっている点は、ディスコから受け継がれている。</p>
<h2>成り立ち</h2><p>直接の契機は1979年7月12日にシカゴの野球場で行われた出来事である。ラジオ司会者Steve Dahlが企画した、ディスコのレコードを持参した観客を安価で入場させ、それを爆破するという催しは、群衆が制御を失って暴徒化し、試合が中止となる騒動に発展した。この事件は表向きは音楽の趣味の問題とされたが、当時のディスコが黒人、ラテン系、そして同性愛者の文化と強く結びついていたことから、そこに人種差別と同性愛嫌悪が含まれていたという指摘は現在では広く共有されている。この出来事の後、大手レコード会社は一斉にディスコから手を引き、専門のレーベルは倒産し、ラジオは編成を変えた。しかし踊る人々が消えたわけではなかった。ニューヨークでは、PreludeやWest End、Salsoulといった独立系レーベルが、規模を縮小しながら制作を続ける。1981年にWest Endから出たTaana Gardnerの楽曲は、極端に遅く重い低音によって、当時としては異様な作品でありながら踊り場を席巻した。Preludeから出たD Trainの作品は、シンセサイザーによる低音と力強い歌唱を組み合わせ、この様式の典型を示した。制作の現場ではLeroy BurgessやKashifといった作り手が、少ない要素で最大の効果を出す技術を磨いた。決定的な場所となったのはニューヨークのParadise Garageというクラブで、そこで選曲を担ったLarry Levanは、既存の楽曲を大胆に加工して流すことで、後のリミックス文化の原型を作った。彼が制作に関わったPeech Boysの1982年の楽曲は、残響と間を大胆に用いた点でダブの手法をダンス音楽に持ち込んだものとして重要である。同時期、Arthur Russellは現代音楽の訓練を背景に、この分野に前衛的な感覚を注ぎ込んだ。ZE Recordsを中心とする一群は、パンクの感性とディスコを混ぜた奇形的な作品を作り、後年高く評価されている。この数年間に磨かれた、機械のリズムと簡素な構成という方法は、そのままシカゴのハウスとデトロイトのテクノへ受け継がれた。</p>
