<h1>Hardvapour（ハードヴェイパー）とは</h1>
<p>ハードヴェイパーは、音そのものを攻撃的で硬い方向へ反転させたスタイルだ。 ヴェイパーウェイヴと美意識や思想を共有する面はある。しかし、制作者のHong Kong ExpressやWolfenstein OS Xは「対極」だと述べた</p>
<p>ハードヴェイパーは、音そのものを攻撃的で硬い方向へ反転させたスタイルだ。

ヴェイパーウェイヴと美意識や思想を共有する面はある。しかし、制作者のHong Kong ExpressやWolfenstein OS Xは「対極」だと述べた。ヴェイパーウェイヴは、1980年代から90年代の商業音楽を遅くして、消費社会への郷愁と虚無を表した。これに対してこちらは、速く歪んだ音を鳴らす。Wolfenstein OS Xは、ヴェイパーウェイヴ内のアジア文化への対抗として、スラヴ文化の図像を使うと述べた。

音作りの中心は「厚いシンセ」と「プログラムされた（打ち込みの）ドラム」だ。安価なツールを使うのは、ヴェイパーウェイヴと同じく、最も安価で入手しやすいからだという見方がある。

テンポは速く（ガバ／ハードコア系）、打ち込みのドラムと、ガバ系の歪んだキックが多い。

作品群は多様で、「暗く洗練され、ときに旋律的」と評されたこともある。

作品の見せ方も、音と同じくらい重要だ。一部の作品のジャケットには、東欧的な図像、サイバーパンク（『マトリックス』風）、監視カメラ映像が使われ、キリル文字入りの曲名・アルバム名も見られる。たとえば、Wolfenstein OS Xが別名義Flash Kostivichで出した『Hacking for Freedom』は『マトリックス』風、Chinese Hackersの『Visions』は監視映像風である。この見た目の設定について、一部の制作者は意図的に出身を偽り、役を演じた。一方、少数は実際に東欧在住と見られる。</p>
<h2>成り立ち</h2><p>2015年、ハードヴェイパーの制作者らは、ヴェイパーウェイヴが使い古されたと批判した。この状況への内部からの反発として、同じ年の末に登場したのがハードヴェイパーだった。

初期の中心となった制作者のひとりは、カナダのWolfenstein OS Xである。2015年11月に発表されたそのアルバム『End of World Rave』（レーベルDream Catalogueから発売）と、続いて同年12月に出たSandtimer（Hong Kong Express）の『Vaporwave Is Dead』が、出発点になったとされる。ただし、どれを起点と見るかは捉え方が分かれる。

その姿勢ははっきりしていた。ヴェイパーウェイヴが陥った心地よい懐古趣味を否定し、音を暴力的な方向へ振り切るというものだ。ヴェイパーウェイヴと美意識・思想を共有すると見る論者もいる。しかし、制作者のHong Kong ExpressやWolfenstein OS X自身は「対極」と位置づけた。

発表の場は、Bandcampなどのインターネット上の音楽配信サービスと、ネット上の小さな共同体だった。Dream Catalogue、Antifur、H.V.R.F.など、小さなレーベルや集団が複数あった。Antifurは29作品を4.20ドルのまとめ売りで配布した例がある。制作者のうち複数は、本名も所在も明かさず、複数の別名義を使い分けた。

見た目の面では、東欧やロシアを思わせる図像が集中的に使われた。一部の制作者は意図的に出身を偽り、役を演じた。一方、少数は実際に東欧に住んでいると見られる。ただしWolfenstein OS X自身は、東欧に限らない世界各地の過酷な文化を示すことと、「グローバル化」をテーマに挙げていた。また、一部の制作者はウクライナ人やロシア人を偽って名乗ってもいた。</p>
