<h1>Hardvapour（ハードヴェイパー）とは</h1>
<p>ヴェイパーウェイヴの美意識を保ちながら、音そのものを攻撃的で硬質な側へ反転させた様式である。ヴェイパーウェイヴが1980年代から90年代の商業音楽を減速させ、消費社会への郷愁と虚無を表現したのに対し、こちらは同じ図像や語彙を使いな</p>
<p>ヴェイパーウェイヴの美意識を保ちながら、音そのものを攻撃的で硬質な側へ反転させた様式である。ヴェイパーウェイヴが1980年代から90年代の商業音楽を減速させ、消費社会への郷愁と虚無を表現したのに対し、こちらは同じ図像や語彙を使いながら、速く歪んだ音を鳴らす。テンポは一分間に140から180拍程度で、四つ打ちや、ハードコア系の歪んだバスドラムが用いられる。音色は意図的に安価で粗いものが選ばれ、古い機材を模した合成音や、圧縮によって劣化した音が好まれる。旋律には短調の単純な音型が使われ、そこに不穏な持続音や金属的な打撃音が重ねられる。曲の構成は展開に乏しく、同じ音型の反復が中心である。作品の見せ方が音と同じくらい重要で、装丁には東欧やロシアを思わせる図像、軍事的なモチーフ、荒廃した都市の写真、キリル文字が用いられる。曲名にも同種の語彙が並ぶ。この視覚的な設定は実在の地域を描いたものではなく、インターネット上で流通する断片的な印象を組み合わせて作られた架空の世界であり、そのことを制作者自身が前提としている点に、この様式の批評的な性格が現れている。</p>
<h2>成り立ち</h2><p>2015年、ヴェイパーウェイヴという様式は成立から数年で行き詰まりを見せていた。減速した商業音楽と、消費社会への皮肉という枠組みが定型化し、大量の類似作が生まれて飽和していたのである。この状況に対する内部からの反発として、同年に登場したのがハードヴェイパーだった。中心となったのはドリームキャッチャーの名で活動する制作者で、彼が発表した一連の作品と、それに付された宣言的な文章が出発点になっている。その主張は明快で、ヴェイパーウェイヴが陥った心地よい懐古趣味を否定し、同じ美意識を保ったまま音を暴力的な方向へ振り切るというものだった。名称もこの対比を意識して付けられている。発表の場となったのはインターネット上の音楽配信サービスと、匿名掲示板を中心とする小さな共同体である。実体としてのレーベルはほとんど存在せず、作品は無料か極めて安価で配布された。制作者の多くは本名も所在も明かさず、複数の別名義を使い分けた。この匿名性は単なる趣味ではなく、作品が個人の表現ではなく共有される素材であるという立場の表明だった。視覚面では、東欧やロシアを想起させる図像が集中的に用いられた。これは実際の地域への関心というより、西側のインターネット文化における東欧の紋切り型を、意図的に誇張して提示する試みだったとされる。同時期に流行していたハードバスの映像文化とも呼応している。2016年から2017年頃に活動が最も盛んになり、その後は他の実験的な電子音楽と混ざり合いながら拡散した。短命だったが、既存の様式に対して同じ美意識のまま音を反転させるという手法自体が、後続の細分化された様式の作られ方に影響を与えている。</p>
