<h1>Hardvapour（ハードヴェイパー）とは</h1>
<p>音そのものを攻撃的で硬質な側へ反転させた様式である。ヴェイパーウェイヴと美意識や思想を共有する面はあるが、制作者本人は「対極」と位置づけている。ヴェイパーウェイヴが1980年代から90年代の商業音楽を減速させ、消費社会への郷愁と虚</p>
<p>音そのものを攻撃的で硬質な側へ反転させた様式である。ヴェイパーウェイヴと美意識や思想を共有する面はあるが、制作者本人は「対極」と位置づけている。ヴェイパーウェイヴが1980年代から90年代の商業音楽を減速させ、消費社会への郷愁と虚無を表現したのに対し、こちらはヴェイパーウェイヴ内のアジア文化への対抗としてのスラヴ文化の図像を使いながら、速く歪んだ音を鳴らす。テンポは速く（ガバ／ハードコア系）、四つ打ちや、ハードコア系の歪んだバスドラムが用いられる。安価なツールを使うのは、嗜好ではなく実用上の理由とされる。音作りは「厚いシンセ」「プログラムされたドラム」で、作品群は多様であり、「暗く洗練され、ときに旋律的」とも評される。作品の見せ方が音と同じくらい重要で、装丁には東欧的な図像、サイバーパンク（『マトリックス』風）、監視カメラ映像が用いられ、キリル文字入りの曲名・盤題が並ぶ。この視覚的な設定について、一部の制作者は誇張やロールプレイを意図していたが、全員が「架空と承知」していたとは言えない。</p>
<h2>成り立ち</h2><p>2015年、ヴェイパーウェイヴという様式は成立から数年で行き詰まりを見せていた。減速した商業音楽と、消費社会への皮肉という枠組みが定型化し、大量の類似作が生まれて飽和していたのである。この状況に対する内部からの反発として、同年に登場したのがハードヴェイパーだった。初期の中心となった制作者のひとりは、カナダのWolfenstein OS Xで、2015年11月に発表したアルバム『End of World Rave』（レーベルDream Catalogueから発売）と、続いて同年12月に出たSandtimer（Hong Kong Express）の『Vaporwave Is Dead』が、出発点になったとされる。その姿勢は明快で、ヴェイパーウェイヴが陥った心地よい懐古趣味を否定し、同じ美意識を保ったまま音を暴力的な方向へ振り切るというものだった。発表の場となったのは、Bandcampなどのインターネット上の音楽配信サービスと、ネット上の小さな共同体である。Dream Catalogue、Antifur、H.V.R.F.など、小さなレーベルや集団が複数あり、作品は無料か極めて安価で配布された。制作者の多くは本名も所在も明かさず、複数の別名義を使い分けた。視覚面では、東欧やロシアを想起させる図像が集中的に用いられた。一部の制作者は誇張やロールプレイを意図していたが、全員が「架空と承知」していたとは言えない（ただしWolfenstein OS X自身は、東欧に限らない世界各地の過酷な文化の提示と「グローバル化」を主題に挙げ、一部の制作者はウクライナ人やロシア人を偽って名乗ってもいた）。ハードバス（1990年代末のサンクトペテルブルク発祥で、2010年代半ばにネットミーム化した音楽）は、音楽面の影響源として確認できる。2015年から2017年にかけて、この様式はネット上のアンダーグラウンドでピークを迎えたとされる。</p>
