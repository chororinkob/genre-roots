<h1>Spiritual Jazz（スピリチュアルジャズ）とは</h1>
<p>1960年代から1970年代にかけて、宗教的、霊的な探求を目的として演奏されたジャズである。単一の様式ではなく志向を指す言葉だが、音の面には共通点が多い。基礎にあるのは旋法的な手法で、和音の進行をほとんど持たず、低音が同じ音を保ち</p>
<p>1960年代から1970年代にかけて、宗教的、霊的な探求を目的として演奏されたジャズである。単一の様式ではなく志向を指す言葉だが、音の面には共通点が多い。基礎にあるのは旋法的な手法で、和音の進行をほとんど持たず、低音が同じ音を保ち続ける上で、旋律が長時間にわたって展開される。この持続によって、聴き手を日常的な時間感覚から引き離すことが意図されている。編成は通常のジャズの楽器に加えて、非西洋の楽器が積極的に導入される。ハープ、インドの持続音楽器タンブーラー、中東の撥弦楽器ウード、各種の鐘や小型の打楽器、木製の笛などが用いられ、音の色彩は大きく広がった。打楽器奏者が複数在籍し、複雑な多層のリズムを刻むことも多い。管楽器の演奏は、旋律を美しく吹くことより、限界まで息を吹き込んで倍音や割れた音を出す奏法が重んじられ、しばしば絶叫に近い響きに達する。声も用いられるが、歌詞のある歌よりも、祈りの言葉の反復や、意味を持たない詠唱が選ばれる。曲は20分を超えることも珍しくなく、組曲として構成される場合も多い。</p>
<h2>成り立ち</h2><p>背景にあるのは1960年代アメリカの黒人の状況である。公民権運動の高揚と、それに伴う暴力、指導者の暗殺、そして根本的な社会構造が変わらないことへの絶望が重なる中で、多くの音楽家がキリスト教の主流派の外側に精神的な拠り所を求めた。イスラームへの改宗、東洋の宗教への傾倒、アフリカへの回帰といった選択が広く行われ、それが音楽に直接反映されたのである。決定的な作品は1965年、John Coltraneが発表したア・ラヴ・シュプリームである。四部から成るこの組曲は、彼自身の薬物依存からの回復と、それを可能にした神への感謝を明示した作品であり、装丁には彼自身による祈りの言葉が掲載された。ジャズの作品が宗教的な献辞を伴うことは前例がなく、この作品は以後の方向を決定づける。彼は1967年に40歳で死去するが、その探求は妻のAlice Coltraneに引き継がれた。彼女はハープと電子オルガンを用い、インドの精神的伝統に深く帰依して、後年は宗教的指導者としてカリフォルニアで共同体を運営した。Pharoah Sandersは、荒々しい咆哮と穏やかな旋律を往復する演奏によって、1969年の楽曲で広い聴衆を得ている。Sun Raは、自らを土星から来た存在と称し、大人数の楽団を率いて、宇宙的な神話と黒人の解放を結びつけるという独自の思想を提示した。制作面では、Impulse!が主要な受け皿となる一方、1971年には演奏者自身が運営するStrata-Eastが設立され、黒人が自らの音楽の権利を持つという実践も始まった。この分野は1970年代後半に一度忘れられるが、1990年代以降、ヒップホップの制作者が素材として発掘し、2010年代にはロンドンやロサンゼルスの若い演奏者が直接の後継を名乗るようになっている。</p>
<h2>代表曲</h2><ul><li>Journey in Satchidananda (Alice Coltrane)</li><li>Astral Traveling (Pharoah Sanders)</li><li>The Creator Has a Master Plan (Pharoah Sanders)</li><li>Space Is the Place (Sun Ra)</li><li>Thembi (Pharoah Sanders)</li></ul>
