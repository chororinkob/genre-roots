<h1>Spiritual Jazz（スピリチュアルジャズ）とは</h1>
<p>スピリチュアル・ジャズは、1960年代から1970年代にかけて、宗教的・霊的な探求を目的に演奏されたジャズだ。単一のスタイルではなく、目指す方向を指す言葉だが、音の面には共通点が多い。 編成は、ふつうのジャズの楽器に加えて、西洋以</p>
<p>スピリチュアル・ジャズは、1960年代から1970年代にかけて、宗教的・霊的な探求を目的に演奏されたジャズだ。単一のスタイルではなく、目指す方向を指す言葉だが、音の面には共通点が多い。

編成は、ふつうのジャズの楽器に加えて、西洋以外の楽器を積極的に取り入れる。ハープ、ウード、タンブーラなどインド・中東系の楽器、各種の鐘や小型の打楽器、木製の笛などが使われ、音の色合いは大きく広がった。

土台にあるのは、旋法という手法を軸にしたモード・ジャズだ。フリー・ジャズ的な要素も含む。和音の流れはほとんど無く、低音が同じ音を鳴らし続ける上で、メロディーが長い時間をかけて展開していく。音が伸び続けるこの効果で、聴き手を日常の時間の感覚から引き離すことが狙われている。

リズムの面では、打楽器奏者が複数いて、複雑に重なり合うリズムを刻むことも多い。

管楽器は、旋律を美しく吹くことより、限界まで息を吹き込んで倍音や割れた音を出す奏法が大切にされる。その響きは、しばしば絶叫に近いところまで達する。

声も使われる。祈りや詠唱、独特の発声(Leon Thomasの、アフリカのピグミーの歌唱に通じると評されるヨーデル風の発声など)が多い。

曲は20分を超えることも珍しくなく、組曲として組み立てられることも多い。</p>
<h2>成り立ち</h2><p>背景にあるのは、1960年代アメリカの黒人の状況だ。公民権運動が高まる一方で、それに伴う暴力や指導者の暗殺が続いた。社会の仕組みの根本が変わらないことへの絶望も重なった。そうした中で、多くの音楽家が、キリスト教の主流派の外側に心のよりどころを求めた。1940年代後半から一部の音楽家がイスラームに改宗しており、1960年代には東洋思想やアフリカへの関心とともに、その影響が音楽にも現れた。

代表的な作品のひとつが、1965年にJohn Coltraneが発表したア・ラヴ・シュプリームである。四部から成るこの組曲は、彼が1957年に経験した霊的な目覚め(伝記上は薬物依存の克服と結びつけて語られる)を受けて、神への感謝を表した作品だ。ライナーノーツには、自筆の祈りの詩が載せられた。

宗教的なテーマを前面に掲げたジャズの先駆けは、1940年代にもある。Duke Ellingtonの『Black, Brown and Beige』(1943年初演)の中の『Come Sunday』などだ。Mary Lou Williamsも、1962年に賛歌を作曲し、1964年にアルバム『Mary Lou Williams Presents Black Christ of the Andes』として発表している。ア・ラヴ・シュプリームは、それを個人の信仰告白として突き詰めた、代表的な例である。

彼は1967年に40歳で亡くなるが、その探求は妻のAlice Coltraneに引き継がれた。彼女はハープと電子オルガンを使い、インドの精神的な伝統に深く帰依した。後年は宗教的指導者として、カリフォルニアで共同体を運営した。

Pharoah Sandersの、荒々しい咆哮と穏やかな旋律を行き来する演奏は、1969年の楽曲「The Creator Has a Master Plan」でFMラジオに流れ、ジャズの外の聴き手にも届いた。Sun Raは、自分を土星から来た存在と名乗り、大人数の楽団を率いた。そして初期には、宇宙的な神話と黒人の解放を結びつけるという、独自の思想を示した。

作品を世に出す面では、Impulse!が主な受け皿となった。一方、1971年には演奏者自身が運営するStrata-Eastが設立され、黒人が自分たちの音楽の権利を持つという実践も始まった。

この分野は1990年代以降、サンプリング文化やDJ・再発の動きを通じて再評価が進んだ。2010年代には、Kamasi WashingtonやShabaka &amp; The Ancestorsなど、影響を受けた若い演奏者が現れている。</p>
<h2>代表曲</h2><ul><li>Turiya &amp; Ramakrishna (Alice Coltrane)</li><li>Journey in Satchidananda (Alice Coltrane)</li><li>Love Is Everywhere (Pharoah Sanders)</li><li>Blue Nile (Alice Coltrane)</li><li>The Creator Has a Master Plan (Pharoah Sanders)</li><li>Space Is the Place (Sun Ra)</li><li>Truth (Kamasi Washington)</li><li>Astral Traveling (Pharoah Sanders)</li><li>Thembi (Pharoah Sanders)</li><li>Harvest Time (Pharoah Sanders)</li><li>Soul Eyes (Pharoah Sanders)</li><li>Enlightenment (Sun Ra)</li></ul>
