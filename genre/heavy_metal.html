<h1>Heavy Metal（ヘビーメタル）とは</h1>
<p>ロックの中でも、音の重量と迫力を最優先する設計をとる様式。ギターは高出力のピックアップと真空管アンプの歪みを組み合わせ、ピッキングする手の側面をブリッジ付近の弦に当てて音を抑えるパーム・ミュートによって、輪郭の鋭い刻みを作る。基本</p>
<p>ロックの中でも、音の重量と迫力を最優先する設計をとる様式。ギターは高出力のピックアップと真空管アンプの歪みを組み合わせ、ピッキングする手の側面をブリッジ付近の弦に当てて音を抑えるパーム・ミュートによって、輪郭の鋭い刻みを作る。基本となる和音はパワー・コード、すなわち根音と5度のみの2音で、3度を含まないため歪ませても濁らず、長調とも短調とも定まらない攻撃的な響きを持つ。ギターが2本編成であることが多く、3度や5度で重ねたハーモナイズド・リードという二重奏の旋律が定番の聴かせどころとなる。様式によっては、ドラムはバスドラム（足で踏む大太鼓）を二つ並べるか、ツインペダル（ペダルを二つ付けた装置）を使って、足で高速に連打する。これはブラックメタル、デスメタル、スラッシュメタルなど一部の様式で土台になっている。ベースはギターと同じ動きをなぞって厚みを増す。音階は短調のエオリア旋法に加え、ハーモニック・マイナー由来の増2度、そして減5度（別名・三全音）が多用される。この音程は中世から「不安定な音程」とされ、のちに「悪魔の音程」と呼ばれるようになった（「悪魔の音程」という呼び名は、中世に使われた例が確認されておらず、記録で確かめられる最も古い例は18世紀初頭である）。この響きが様式の象徴となった。歌唱は高音域を張り上げる劇的なものと、低く唸るものに大別される。歌詞は戦争、神話、宗教、権力への抵抗、そして死を扱い、日常から離れた大きな主題を好む。曲構成は器楽的な間奏を長く取り、演奏技術の披露が明確に組み込まれている。</p>
<h2>成り立ち</h2><p>1960年代末から1970年代初頭にかけて、主にイギリスとアメリカで発展した。とりわけ工業都市バーミンガムの環境が、Black Sabbathの音を育てたとされる。出発点としてよく挙げられるのは、1970年のBlack Sabbathのデビュー・アルバムである（同じ年のDeep Purple『In Rock』も同じくらい重く見る人もいる）。ギタリストTony Iommiは、工場での作業中に右手の指先を切断し、軽い弦と義指（人工の指先）を使うようになり、のちにライブでギターの音の高さ（調弦）を低くしていった。デビュー作は通常の音の高さで録音されたが、1971年の『Master of Reality』など後の作品では低くした音の高さで録音され、重く沈んだ音を生んだ。Iommi自身は、音の高さを下げた主な目的を「より大きく重い音」を得ることだと述べている。デビュー作『Black Sabbath』（1970年）の冒頭曲では三全音の音程が遅いテンポで繰り返され、不吉さを音そのもので表現する、ヘヴィメタルの初期の例の一つとなった。同時期、Led ZeppelinがブルースをJimmy Pageの重厚な録音手法で拡大し、Deep Purpleがクラシック音楽の様式と高速の演奏技巧を持ち込んだ。この三組が原型を作ったとされる。1970年代半ばから1980年代初頭にかけて、イギリスでニュー・ウェイヴ・オブ・ブリティッシュ・ヘヴィメタルと呼ばれる運動が起こり（この名称は1979年5月、Sounds誌の編集者Alan Lewisが、Geoff Bartonの記事の見出しとして考案した）、Iron Maiden、Def Leppard、Diamond Headらが登場した。この運動は全体として、パンクの強度やDIYの精神の影響を受けたとされる（個々のバンドの影響源は異なる）。Judas Priestは同時期に、ブルースの影響の多くを捨てた2本のギターの演奏スタイルと、革とスタッド（金属びょう）の衣装（1978年ごろに採用）で後のバンドに大きな影響を与え、見た目の手本も作った。1980年代半ばには米国でグラム・メタルが商業的に大成功する一方、地下ではスラッシュメタルが分岐した。社会との軋轢も大きく、1985年に米国で結成された保護者団体PMRCがレコードへの警告表示を求めた運動、そして1980年代から1990年にかけて相次いだ、歌詞や録音に含まれていたとされるメッセージが自殺をそそのかしたとして起こされた訴訟は、この音楽が道徳的な非難の的であり続けたことを示している。Ozzy Osbourneを相手取った訴訟は、表現の自由（米国憲法修正第1条）を理由に退けられた。一方、Judas Priestへの訴訟（1986年に提訴、1990年に判決）では、判事は審理前の判断で、人の意識に上らない形で潜ませたメッセージ（サブリミナル・メッセージ）は表現の自由の保護の対象外だと述べた。しかし原告は、メッセージが意図的に入れられたことも、それが原因で事件が起きたことも証明できなかったとして、訴えを退けた。1990年代にはグランジの台頭で商業的な人気が落ちた（落ち込みが特に大きかったのはグラム・メタル）。その一方で、スラッシュ、デス、ブラック、ドゥーム、パワーといった枝分かれした様式は1980年代に次々に生まれており、これらを軸に、世界各地にその土地のシーン（演奏者と聴き手の集まり）を持つ、国際的に広がった音楽ジャンルとして認識されている。</p>
