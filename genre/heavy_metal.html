<h1>Heavy Metal（ヘビーメタル）とは</h1>
<p>ヘヴィメタルは、ロックの中でも「重くて迫力のある音」をいちばん大事にした音楽だ。 音の中心はギター。パワーの大きいピックアップと真空管アンプで、音を思いきり歪ませる。そこに、右手の側面を弦の根もと近くにそっと当てて音を押さえる「パ</p>
<p>ヘヴィメタルは、ロックの中でも「重くて迫力のある音」をいちばん大事にした音楽だ。

音の中心はギター。パワーの大きいピックアップと真空管アンプで、音を思いきり歪ませる。そこに、右手の側面を弦の根もと近くにそっと当てて音を押さえる「パーム・ミュート」を使うと、輪郭のするどい、ザクザクした刻みが生まれる。

和音の基本は「パワー・コード」だ。土台の音と、そこから5度上の音の、2音だけでつくる。ふつうの和音にある3度の音が入っていないので、歪ませても濁らない。そのかわり、長調とも短調とも決まらない、攻撃的な響きになる。

ギターは2本のことが多く、同じ旋律を3度や5度ずらして重ねて弾く「ハーモナイズド・リード」は、聴かせどころの定番だ。

ドラムは、一部のスタイル（ブラック、デス、スラッシュなど）では、ツーバスやツインペダルを使った高速の連打が土台になっている。ベースは、ギターと同じ動きをなぞって、音に厚みを足す。

メロディの音の並びは、短調のエオリア旋法に加えて、ハーモニック・マイナー由来の増2度と、減5度（別名・三全音）がよく使われる。この音程は、中世から「不安定な音程」とされ、のちに「悪魔の音程」と呼ばれるようになった。ただ、中世にその呼び名が使われた例は確認されておらず、記録の上では18世紀の初めまでさかのぼる。この響きが、ヘヴィメタルのトレードマークになった。

歌い方は、高い声を張り上げて劇的に歌うタイプと、低くうなるタイプに大きく分かれる。歌詞が扱うのは、戦争、神話、宗教、権力への抵抗、そして死。日常から遠い、大きなテーマが好まれる。

曲の組み立てでは、楽器だけで演奏する間奏を長めにとる。演奏のうまさを見せる場面が、はっきり組み込まれている。</p>
<h2>成り立ち</h2><p>物語のはじまりは、1960年代の終わりから1970年代のはじめ。舞台は、主にイギリスとアメリカだ。なかでも、工場の多い街イギリスのバーミンガムの環境が、Black Sabbathの音を育てたとされる。

「ここからヘヴィメタルが始まった」とよく言われるのが、1970年のBlack Sabbathのデビュー・アルバムだ（同じ年のDeep Purpleの『In Rock』も、同じくらい重いと見る人もいる）。

このバンドのギタリスト、Tony Iommiには、こんな出来事があった。工場で働いているときに、右手の指先を切ってしまったのだ。それで彼は、軽い弦と、人工の指先（義指）を使ってギターを弾くようになった。そして、のちにライブで、ギターの音の高さ（調弦）を低くしていった。デビュー作は、ふつうの高さで録音された。でも、1971年の『Master of Reality』など、あとの作品は低くした高さで録音されて、重く沈んだ音になった。Iommi自身は、音の高さを下げたいちばんの目的を「より大きく重い音」を出すことだと話している。

デビュー作『Black Sabbath』（1970年）の最初の曲『Black Sabbath』では、三全音が、遅いテンポでくり返される。

同じころ、Led Zeppelinは、ブルースをJimmy Pageのずっしりした録音の工夫で大きく広げた。Deep Purpleは、クラシック音楽のスタイルと、高速の演奏テクニックを持ち込んだ。この三組が、ヘヴィメタルの原型をつくったとされる。

1970年代の半ばから1980年代のはじめには、イギリスで「ニュー・ウェイヴ・オブ・ブリティッシュ・ヘヴィメタル」と呼ばれる動きが起こった。この名前は、1979年5月に、Sounds誌の編集者Alan Lewisが、Geoff Bartonの記事の見出しとして考えたものだ。この動きから、Iron Maiden、Def Leppard、Diamond Headらが登場した。全体としては、パンクの激しさやDIYの精神に影響を受けたとされる（バンドごとの影響の元は、それぞれ違う）。Judas Priestも同じころ、ブルースの影響の多くを捨てた、2本のギターの演奏スタイルを打ち出した。革とスタッド（金属びょう）の衣装（1978年ごろから）でも、あとに続くバンドに大きな影響を与え、見た目の手本もつくった。

1980年代の半ばには、アメリカでグラム・メタルが商業的に大成功した。その一方で、地下ではスラッシュメタルが枝分かれしていった。

でも、世間からの風当たりも強かった。1985年にアメリカでつくられた保護者団体PMRCは、レコードに警告表示をつけるよう求める運動をした。さらに、1980年代から1990年にかけて、歌詞や録音にふくまれていたとされるメッセージが自殺をそそのかした、として、訴訟が相次いだ。これらは、この音楽が道徳的な非難の的であり続けたことを示している。

Ozzy Osbourneを相手にした訴訟は、表現の自由（アメリカ憲法修正第1条）を理由に退けられた。一方、Judas Priestへの訴訟は、1986年に起こされ、1990年8月にネバダ州リノの判事が判決を下した。判事は、事前の判断では、サブリミナルは表現の自由で守られない、という立場を示した。でも判決では、原告は、メッセージが意図的に入れられたことも、それが原因で事件が起きたことも、証明できなかったとして、訴えを退けた。

1990年代には、グランジが人気を集めて、ヘヴィメタルの商業的な人気は落ちた（落ち込みがとくに大きかったのはグラム・メタル）。それでも、スラッシュ、デス、ブラック、ドゥーム、パワーといった枝分かれしたスタイルは、1980年代につぎつぎに生まれていた。これらを軸に、いまでは、世界各地に地域のシーンがある、国際的に広がった音楽ジャンルとして認識されている。</p>
