<h1>Heavy Metal（ヘビーメタル）とは</h1>
<p>ロックの中でも、音の重量と迫力を最優先する設計をとる様式。ギターは高出力のピックアップと真空管アンプの歪みを組み合わせ、低音弦を強く抑えて弾くパーム・ミュートによって、輪郭の鋭い刻みを作る。基本となる和音はパワー・コード、すなわち</p>
<p>ロックの中でも、音の重量と迫力を最優先する設計をとる様式。ギターは高出力のピックアップと真空管アンプの歪みを組み合わせ、低音弦を強く抑えて弾くパーム・ミュートによって、輪郭の鋭い刻みを作る。基本となる和音はパワー・コード、すなわち根音と五度のみの二音で、三度を含まないため歪ませても濁らず、長調とも短調とも定まらない攻撃的な響きを持つ。ギターが二本編成であることが多く、三度や六度で重ねたハーモナイズド・リードという二重奏の旋律が定番の聴かせどころとなる。ドラムはバスドラムを二つ、あるいはツインペダルで踏み、高速の連打で土台を作る。ベースはギターと同じ動きをなぞって厚みを増す。音階は短調のエオリア旋法に加え、ハーモニック・マイナー由来の増二度、そして減五度、いわゆる三全音が多用され、中世に悪魔の音程と呼ばれたこの不安定な響きが様式の象徴となった。歌唱は高音域を張り上げる劇的なものと、低く唸るものに大別される。歌詞は戦争、神話、宗教、権力への抵抗、そして死を扱い、日常から離れた大きな主題を好む。曲構成は器楽的な間奏を長く取り、演奏技術の披露が明確に組み込まれている。</p>
<h2>成り立ち</h2><p>1960年代末のイギリス、とりわけ工業都市バーミンガムで生まれた。決定的な出発点は1970年、Black Sabbathのデビュー・アルバムで、ギタリストTony Iommiが工場での作業中に右手の指先を切断し、その痛みを避けるため弦の張力を下げて調弦を低くしたことが、結果として重く沈んだ音を生んだ。同アルバムの冒頭曲では三全音の音程が繰り返され、不吉さを音そのもので表現するという発想が確立された。同時期、Led ZeppelinがブルースをJimmy Pageの重厚な録音手法で拡大し、Deep Purpleがクラシック音楽の様式と高速の演奏技巧を持ち込んだ。この三組が原型を作ったとされる。1979年から1982年にかけて、イギリスでニュー・ウェイヴ・オブ・ブリティッシュ・ヘヴィメタルと呼ばれる運動が起こり、Iron Maiden、Def Leppard、Diamond Headらが、パンクの速度と簡潔さをメタルに導入した。Judas Priestは同時期に、ブルースの名残を完全に排した二本のギターの様式と、革とスタッドの衣装を確立し、視覚的な規範も作った。1980年代半ばには米国でグラム・メタルが商業的に大成功する一方、地下ではスラッシュメタルが分岐した。社会との軋轢も大きく、1985年に米国で結成された保護者団体PMRCがレコードへの警告表示を求めた運動、そして1980年代に相次いだ、歌詞が自殺を教唆したとする訴訟は、この音楽が道徳的な非難の的であり続けたことを示している。いずれの訴訟も表現の自由を理由に退けられた。1990年代にはグランジの台頭で商業的に後退したが、その後デスメタル、ブラックメタル、ドゥーム、パワーメタルなど無数の下位様式へ分岐し、世界中に地域ごとのシーンを持つ、最も国際的に根を張った音楽の一つとなっている。</p>
<h2>代表曲</h2><ul><li>Paranoid（Black Sabbath）</li><li>Ace of Spades (Motörhead)</li><li>Rainbow in the Dark (Dio)</li><li>Breaking the Law（Judas Priest）</li><li>The Trooper（Iron Maiden）</li></ul>
