<h1>Heavy Metal（ヘビーメタル）とは</h1>
<p>ロックの中でも、音の重量と迫力を最優先する設計をとる様式。ギターは高出力のピックアップと真空管アンプの歪みを組み合わせ、ピッキングする手の側面をブリッジ付近の弦に当てて音を抑えるパーム・ミュートによって、輪郭の鋭い刻みを作る。基本</p>
<p>ロックの中でも、音の重量と迫力を最優先する設計をとる様式。ギターは高出力のピックアップと真空管アンプの歪みを組み合わせ、ピッキングする手の側面をブリッジ付近の弦に当てて音を抑えるパーム・ミュートによって、輪郭の鋭い刻みを作る。基本となる和音はパワー・コード、すなわち根音と五度のみの二音で、三度を含まないため歪ませても濁らず、長調とも短調とも定まらない攻撃的な響きを持つ。ギターが二本編成であることが多く、三度や六度で重ねたハーモナイズド・リードという二重奏の旋律が定番の聴かせどころとなる。ドラムは、バスドラムを二つ、あるいはツインペダルで踏む高速の連打を、ブラックメタルやデスメタルなど一部の様式が土台にする。ベースはギターと同じ動きをなぞって厚みを増す。音階は短調のエオリア旋法に加え、ハーモニック・マイナー由来の増二度、そして減五度、いわゆる三全音が多用され、中世以来「不安定な音程」とされ、後世に「悪魔の音程」と呼ばれた（呼称の起源は中世とは確定していない）この響きが様式の象徴となった。歌唱は高音域を張り上げる劇的なものと、低く唸るものに大別される。歌詞は戦争、神話、宗教、権力への抵抗、そして死を扱い、日常から離れた大きな主題を好む。曲構成は器楽的な間奏を長く取り、演奏技術の披露が明確に組み込まれている。</p>
<h2>成り立ち</h2><p>1960年代末から1970年代初頭にかけて、主にイギリスとアメリカで発展した。とりわけ工業都市バーミンガムの環境が、Black Sabbathの音を育てたとされる。しばしば出発点とされるのは1970年のBlack Sabbathのデビュー・アルバムである（同年のDeep Purple『In Rock』などを同等に挙げる評者もいる）。ギタリストTony Iommiは、工場での作業中に右手の指先を切断し、軽い弦と義指を使うようになり、のちにライブから調弦を低くしていった。デビュー作は標準の調弦で録音されたが、1971年の『Master of Reality』など後の作品で低い調弦が録音に反映され、重く沈んだ音を生んだ。Iommi自身は、調弦を下げた主な目的を「より大きく重い音」を得ることだと述べている。同アルバムの冒頭曲では三全音の音程が繰り返され、不吉さを音そのもので表現するという発想が確立された。同時期、Led ZeppelinがブルースをJimmy Pageの重厚な録音手法で拡大し、Deep Purpleがクラシック音楽の様式と高速の演奏技巧を持ち込んだ。この三組が原型を作ったとされる。1970年代半ばから1980年代初頭にかけて、イギリスでニュー・ウェイヴ・オブ・ブリティッシュ・ヘヴィメタルと呼ばれる運動が起こり（この名称は1979年にSounds誌のGeoff Bartonが使った）、Iron Maiden、Def Leppard、Diamond Headらが登場した。この運動は全体として、パンクの強度やDIYの精神の影響を受けたとされる（個々のバンドの影響源は異なる）。Judas Priestは同時期に、ブルースの影響の多くを捨てた二本のギターの様式と、革とスタッドの衣装（1978年ごろに採用）で後続に大きな影響を与え、視覚的な規範も作った。1980年代半ばには米国でグラム・メタルが商業的に大成功する一方、地下ではスラッシュメタルが分岐した。社会との軋轢も大きく、1985年に米国で結成された保護者団体PMRCがレコードへの警告表示を求めた運動、そして1980年代から1990年にかけて相次いだ、歌詞や録音に含まれるとされたメッセージが自殺を教唆したとする訴訟は、この音楽が道徳的な非難の的であり続けたことを示している。Ozzy Osbourneを相手取った訴訟は、表現の自由（米国憲法修正第1条）を理由に退けられた。一方、Judas Priestへの訴訟（1990年）では、判事はサブリミナル・メッセージは表現の自由の保護の対象外としつつ、原告が意図的な挿入と因果関係を立証できなかったとして請求を棄却した。1990年代にはグランジの台頭で商業的に後退した（衰退が特に顕著だったのはグラム・メタル）。その一方で、スラッシュ、デス、ブラック、ドゥーム、パワーなどの下位様式は1980年代に相次いで分岐しており、それらを軸に、世界中に地域ごとのシーンを持つ、最も国際的に根を張った音楽の一つとなっている。</p>
