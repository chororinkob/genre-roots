<h1>Heavy Metal（ヘビーメタル）とは</h1>
<p>ヘヴィメタルは、ロックの中でも「音の重さと迫力」を最優先にした音楽だ。 主役はギター。出力の大きいピックアップと真空管アンプで音を激しく歪ませ、さらに、右手の側面をブリッジ付近の弦に当てて音を押さえる「パーム・ミュート」を使うこと</p>
<p>ヘヴィメタルは、ロックの中でも「音の重さと迫力」を最優先にした音楽だ。

主役はギター。出力の大きいピックアップと真空管アンプで音を激しく歪ませ、さらに、右手の側面をブリッジ付近の弦に当てて音を押さえる「パーム・ミュート」を使うことで、輪郭の鋭い刻みを作る。

和音の基本は「パワー・コード」。土台の音と5度上の音、2音だけでできた和音だ。3度の音を含まないため、歪ませても濁らず、長調とも短調とも定まらない攻撃的な響きになる。

ギターは2本編成が多く、同じ旋律を3度や5度ずらして重ねる「ハーモナイズド・リード」は、聴かせどころの定番となっている。

ドラムは、ブラック、デス、スラッシュなど一部のスタイルで、ツーバスやツインペダルによる高速の連打が土台になっている。ベースはギターと同じ動きをなぞり、音に厚みを加える。

音階は、短調のエオリア旋法に加え、ハーモニック・マイナー由来の増2度や、減5度（別名・三全音）が多用される。この音程は中世から「不安定な音程」とされ、のちに「悪魔の音程」と呼ばれるようになった。ただし、中世にその呼び名が使われた例は確認されておらず、記録の上では18世紀初頭までさかのぼる。この響きは、ヘヴィメタルのトレードマークとなった。

歌唱は、高音を張り上げる劇的なものと、低くうなるものに大きく分かれる。歌詞は、戦争、神話、宗教、権力への抵抗、そして死を扱い、日常から離れた大きな主題を好む。

曲の構成は、楽器だけの間奏を長くとり、演奏技術を披露する場面がはっきりと組み込まれている。</p>
<h2>成り立ち</h2><p>ヘヴィメタルは、1960年代の終わりから1970年代の初めにかけて、主にイギリスとアメリカで発展した。なかでも、工業都市バーミンガムの環境が、Black Sabbathの音を育てたとされる。

出発点としてよく挙げられるのは、1970年のBlack Sabbathのデビュー・アルバムだ（同じ年のDeep Purple『In Rock』を、同じくらい重いと見る人もいる）。

このバンドのギタリスト、Tony Iommiには、こんな出来事があった。工場での作業中に、右手の指先を切断してしまったのだ。彼は軽い弦と義指（人工の指先）を使うようになり、のちにライブで、ギターの音の高さ（調弦）を低くしていった。デビュー作は通常の高さで録音されたが、1971年の『Master of Reality』など後の作品は、低くした高さで録音され、重く沈んだ音を生んだ。Iommi自身は、音の高さを下げた主な目的を「より大きく重い音」を得ることだと述べている。

デビュー作『Black Sabbath』（1970年）の冒頭曲『Black Sabbath』では、三全音が遅いテンポで繰り返される。

同じ時期、Led ZeppelinはブルースをJimmy Pageの重厚な録音手法で拡大し、Deep Purpleはクラシック音楽のスタイルと高速の演奏技巧を持ち込んだ。この三組が原型を作ったとされる。

1970年代半ばから1980年代初頭には、イギリスで「ニュー・ウェイヴ・オブ・ブリティッシュ・ヘヴィメタル」と呼ばれる動きが起こった。この名称は、1979年5月に、Sounds誌の編集者Alan Lewisが、Geoff Bartonの記事の見出しとして考案したものだ。Iron Maiden、Def Leppard、Diamond Headらが登場し、全体としてパンクの激しさやDIYの精神に影響を受けたとされる（バンドごとの影響源は異なる）。Judas Priestもこの時期に、ブルースの影響の多くを捨てた2本のギターの演奏スタイルと、革とスタッド（金属びょう）の衣装（1978年ごろに採用）で、後に続くバンドに大きな影響を与え、見た目の手本も作った。

1980年代半ばには、アメリカでグラム・メタルが商業的に大成功した。一方、地下ではスラッシュメタルが分岐していった。

しかし、社会との摩擦も大きかった。1985年にアメリカで結成された保護者団体PMRCは、レコードへの警告表示を求める運動を起こした。さらに、1980年代から1990年にかけて、歌詞や録音に含まれていたとされるメッセージが自殺をそそのかしたとして、訴訟が相次いだ。これらは、この音楽が道徳的な非難の的であり続けたことを示している。

Ozzy Osbourneを相手取った訴訟は、表現の自由（アメリカ憲法修正第1条）を理由に退けられた。一方、Judas Priestへの訴訟は、1986年に提訴され、1990年8月にネバダ州リノの判事が判決を下した。判事は事前の判断で、サブリミナルは表現の自由の保護の対象外だという立場を示した。だが判決では、原告は、メッセージが意図的に入れられたことも、それが原因で事件が起きたことも、立証できなかったとして、訴えを退けた。

1990年代には、グランジが人気を集め、ヘヴィメタルの商業的な人気は落ちた（落ち込みが特に大きかったのはグラム・メタル）。それでも、スラッシュ、デス、ブラック、ドゥーム、パワーといった枝分かれしたスタイルは、1980年代に次々と生まれていた。これらを軸に、いまでは世界各地に地域のシーンがある、国際的に広がった音楽ジャンルとして認識されている。</p>
