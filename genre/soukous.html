<h1>Soukous（スークス）とは</h1>
<p>コンゴ民主共和国とコンゴ共和国を中心に発達した、エレクトリックギターの絡み合いを主役とするダンス音楽である。 編成では、複数のギターが明確に役割を分担する。大編成の場合の三層構造が基本である。最も高い音域で速い分散和音（和音を一音</p>
<p>コンゴ民主共和国とコンゴ共和国を中心に発達した、エレクトリックギターの絡み合いを主役とするダンス音楽である。

編成では、複数のギターが明確に役割を分担する。大編成の場合の三層構造が基本である。最も高い音域で速い分散和音（和音を一音ずつ順に弾く奏法）を弾く主導ギター、その内側で対旋律（主旋律に寄り添う別の旋律）を弾く中間のギター、そして和音を刻む伴奏ギターだ。これらが互いに噛み合いながら、網目のような音の織物を作る。ギターの音色は、クリーンで明るい音色が典型とされる。低音は動き回るベースが担う。

曲は二部構成を取る。前半では、旋律的で穏やかな歌が歌われる。後半では、セベネと呼ばれる高速の器楽部分へ移る。テンポは前半は中速、後半は大幅に速い。この後半こそが本領だ。テンポが上がり、ギターが延々と反復し、打楽器が密度を増す。ドラムはスネアの連打で、場面の切り替わりを示す。

あおり役が短い掛け声を叫び、踊り手を煽る。この掛け声の担当者は、Zaiko Langa Langaが専任の役職として導入し、その後ほとんどの楽団が採用した。

歌詞はリンガラ語を中心に、フランス語なども用いられる。恋愛、称賛、日常が歌われる。支援者の名前を（有料で）呼ぶmabangaの慣行がある。

OK Jazz系の曲は10分超が多い。パリ期は短い。</p>
<h2>成り立ち</h2><p>起点は、コンゴの現地のマリンガと呼ばれる舞踊音楽に、キューバ音楽の影響が重なったものとされる。

1930年代から1940年代にかけて、ヨーロッパのレコード会社が、アフリカ市場向けにキューバ音楽の78回転盤を輸出していた(EMIのG.V.シリーズは1933年開始)。これが重要な影響源になった。キューバ盤が「ルンバ」と誤って表記されたことが一因とする説がある（経緯は不明確）。1948年にWendo Kolosoyが録音した楽曲は、コンゴ・ルンバの初期の代表例とされる。

1950年代には、Joseph KabaseleがAfrican Jazzを率いて、洗練された編成を固めた。1960年、ベルギーからの独立交渉が行われたブリュッセルの会議に合わせて、楽曲が録音された。録音された楽曲「Indépendance Cha Cha」は、アフリカ各地（特に仏語圏）で独立の旗印として親しまれた。同時期、Franco Luambo MakiadiがOK Jazzを率い、より土着的で力強い方向を追求する。彼は数十年にわたり国民的な存在であり続けたが、1989年に死去した。

Docteur Nicoは、コンゴの指弾きギターのスタイルの創始者とする見方がある。叙情的なソロとルバ系の旋律を取り入れたfiesta styleで、後続に大きな影響を与えた。一方、ソウクース的な速い高音域の奏法は、Francoやブラザヴィルに広めたJacques Kimbembeなど、複数の奏者の貢献とされる。

1969年12月、キンシャサでZaiko Langa Langaが結成された。1970年代に人気を集め、管楽器を廃して、ギター2〜3本、ベース、ドラム、打楽器、歌手陣の編成にした。これにより、後半の高速部分をより長く激しくするという変革を行った。この時期はMobutu政権による、西洋的な名を捨てて土着の名を用いることを強制する政策の時代でもあった。音楽もまた、国家の威信と結びついていた。

1980年代、経済の崩壊と政治的抑圧を逃れて、多くの音楽家がブリュッセル、パリ、ロンドンなど欧州へ移住する。この亡命の街のスタジオで、シンセサイザーやドラムマシンを使った、短く速いダンス向けの形が広まった。国際市場では、soukousの名で知られるようになった。Kanda Bongo Manらがこの形式を広めた。Papa Wembaは、音楽と同時に、高級服を着こなすことを美学とする独特の文化を身をもって示した。そして、アフリカ的な洒落者の代名詞となった。

1990年代以降、コンゴは長期の内戦に苦しみ、音楽産業も打撃を受けたとされる。それでも、Koffi Olomideらによって、音楽の流れは途切れずに保たれた。この音楽は、アフリカ各地で最も支配的なダンス音楽の一つとなり、benga、muziki wa dansi、Kidandali、Igbo highlife、palm-wine music、taarab などの発展に強い影響を与えた。</p>
<h2>代表曲</h2><ul><li>Mario（Franco）</li><li>Loi (Koffi Olomidé)</li><li>Independence Cha Cha（Le Grand Kallé et l'African Jazz）</li><li>Kassongo (Orchestra Super Mazembe)</li><li>Papa Bonheur (Koffi Olomidé)</li><li>Sai（Koffi Olomidé）</li><li>Shauri Yako (Orchestra Super Mazembe)</li><li>Marie Jose (Ry-Co Jazz)</li><li>Sala Keba (Papa Wemba)</li><li>Zing Zong (Kanda Bongo Man)</li><li>Ya Jean (Madilu System)</li></ul>
