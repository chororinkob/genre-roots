<h1>Soukous（スークス）とは</h1>
<p>コンゴ民主共和国とコンゴ共和国を中心に発達した、エレクトリックギターの絡み合いを主役とするダンス音楽である。編成では複数のギターが明確に役割を分担する。最も高い音域で速い分散和音を弾く主導ギター、その内側で対旋律を弾く中間のギター</p>
<p>コンゴ民主共和国とコンゴ共和国を中心に発達した、エレクトリックギターの絡み合いを主役とするダンス音楽である。編成では複数のギターが明確に役割を分担する。最も高い音域で速い分散和音を弾く主導ギター、その内側で対旋律を弾く中間のギター、そして和音を刻む伴奏ギターという三層構造が基本で、これらが互いに噛み合いながら網目のような音の織物を作る。ギターの音色は歪ませず、高音を強調した細く輝く設定が好まれる。曲は二部構成を取り、前半では旋律的で穏やかな歌が歌われ、後半でセベネと呼ばれる高速の器楽部分へ移行する。この後半こそが本領で、テンポが上がり、ギターが延々と反復し、打楽器が密度を増し、扇動役が短い掛け声を叫んで踊り手を煽る。この掛け声の担当者は独立した役職として扱われ、集団に不可欠な存在である。低音は動き回るベースが担い、ドラムはスネアの連打で場面転換を示す。歌詞はリンガラ語が用いられ、恋愛、称賛、日常、そして支援者への謝辞が歌われる。テンポは前半で100前後、後半では140を超えることもある。楽曲は10分を超えることも珍しくない。</p>
<h2>成り立ち</h2><p>起点は意外なことにキューバである。1930年代から1940年代にかけて、ヨーロッパのレコード会社がアフリカ市場向けにキューバ音楽の78回転盤を輸出しており、コンゴの人々はそこに自らの祖先が奴隷として運ばれた先で生まれた音楽を聴き取った。この輸入されたソンを現地の言語と感覚で作り替えたものが、コンゴのルンバである。1948年にWendo Kolosoyが録音した楽曲が初期の代表例とされる。1950年代にはJoseph KabaseleがAfrican Jazzを率いて洗練された編成を確立し、1960年、ベルギーからの独立交渉が行われたブリュッセルの会議に合わせて録音された楽曲は、アフリカ全土で独立の象徴として歌われた。同時期、Franco Luambo MakiadiがOK Jazzを率い、より土着的で力強い方向を追求する。彼は数十年にわたり国民的な存在であり続けたが、1989年に死去した。ギターの奏法を革新したのはDocteur Nicoで、彼が確立した高音域の速い分散和音が、この音楽の音色を決定づけた。1970年代にはZaiko Langa Langaが登場し、管楽器を廃してギターと打楽器だけの編成にすることで、後半の高速部分をより長く激しくするという変革を行った。この時期はMobutu政権による、西洋的な名を捨てて土着の名を用いることを強制する政策の時代でもあり、音楽もまた国家の威信と結びついていた。1980年代、経済の崩壊と政治的抑圧を逃れて、多くの音楽家がパリへ移住する。この亡命の街で、ヨーロッパの聴衆向けに歌の部分を削り、速いダンス部分だけを強調した形が作られ、これが国際的にスークースと呼ばれるようになった。Kanda Bongo Manらがこの形式を広め、Papa Wembaは音楽と同時に、高級服を着こなすことを美学とする独特の文化を体現して、アフリカ的な洒落者の象徴となった。1990年代以降、コンゴは長期の内戦に苦しみ、音楽産業も打撃を受けたが、Koffi Olomideらによって命脈は保たれた。この音楽が西アフリカや東アフリカのポップスに与えた影響は絶大で、アフリカ大陸で最も広く模倣された様式のひとつである。</p>
