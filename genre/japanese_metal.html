<h1>Japanese Metal（ジャパニーズ・メタル）とは</h1>
<p>日本のバンドが演奏するヘヴィメタルをまとめて呼ぶ名である。代表曲22曲を動画で聴け、ルーツと影響のつながりを地図でたどれる。</p>
<p>日本のバンドが演奏するヘヴィメタルをまとめて呼ぶ名である。一定の音の型を持つスタイルというより、国で区切った呼び方であり、日本語の歌詞と日本独自の売り方を備えたヘヴィメタル全般を指す。

中心の楽器は、ディストーションを強くかけたエレキギター2本とベース、ドラムスだ。ギターはトレモロ・ピッキングで重く速いリフを刻み、曲の途中に技巧的なソロを置く。ツーバスのドラムが用いられることも多い。

和音はパワーコードを基本とし、短調系のコード進行で緊張感を作る。メロディは欧米のメタルに比べ、歌謡曲のように歌い上げられる部分が大きく、叙情的なサビを聴かせる。

リズムは4分の4拍子が中心で、高速のツーバス連打や8分音符の刻みで疾走感を出す。曲の中盤で転調を挟む展開もよく使われる。

歌い方は、裏返さない高音のシャウトが伝統だ。ハイトーンの歌手を主力に置くバンドが多く、近年はデスボイスやアイドル風の発声も混ざる。

歌詞は孤独、反逆、幻想、怪奇などを主題にする。リフ主導でサビが盛り上がる構成が基本で、インストゥルメンタルのソロ部分が聴かせどころになる。欧米のメタルとの違いは音より、歌詞の言語、歌唱のニュアンス、国内シーンでの広がり方にある。</p>
<h2>成り立ち</h2><p>日本にヘヴィメタルが芽生えたのは1970年代である。フラワー・トラベリン・バンドが1971年のアルバム『Satori』などで重いロックを演奏し、ヘヴィメタルの先駆のひとつとされる。1970年代後半には、1975年結成のBOW WOW、1977年の44MAGNUM、1978年のEARTHSHAKERが最初期のヘヴィメタルバンドとして活動を始めた。

しかし決定的な出発点になったのは1980年である。アイドル的な人気を得ていたLAZYが「ヘヴィ・メタル宣言」を行い、アルバム『宇宙船地球号』を発表した。LAZYは方向性の対立から1981年5月に解散するが、ギターの高崎晃とドラムの樋口宗孝は同年にLOUDNESSを結成し、11月にデビューアルバム『誕生前夜』を出した。デビューコンサートのチケットは完売し、「日本のハードロックは売れない」とされていた業界の常識が崩れた。

一方、1983年から1984年にかけて、関西からEARTHSHAKER、44MAGNUM、MARINO、MAKE-UPなどが、東京からはBLIZARDなどが次々とメジャーデビューし、ブームが本格化した。浜田麻里や本城未沙子といった女性メタル歌手も、大物バンドメンバーのプロデュースで登場した。1984年にはインディーズのバンドを集めたオムニバス盤『HEAVY METAL FORCE Vol.1』が出て、1985年10月には日比谷野外音楽堂で「JAPAN HEAVY METAL FESTIVAL」が開かれた。同年、聖飢魔IIがデビューして10万枚を売った初の日本のメタルバンドとなり、LOUDNESSは米国のアトコと契約して日本人メタルバンドで初めて米メジャーと組み、アルバム『THUNDER IN THE EAST』は米ビルボードで74位まで上がった。

1982年に結成されたXは、1988年のインディーズ盤『Vanishing Vision』でメジャーのチャートに入る記録的な売れ行きを見せ、1989年の『BLUE BLOOD』が71万枚以上、1991年の『Jealousy』は100万枚を超えた。国内メタルの商業的な頂点は1980年代後半から1990年代前半にかけてである。

しかし1990年代に入ると、E・Z・O、VOW WOW、DEAD END、ANTHEM、EARTHSHAKERと、1980年代を支えたバンドが相次いで解散し、シーンは冬の時代を迎えた。その間も地下ではSighが1993年にノルウェーのユーロニモスのレーベルから1stアルバムを出すなど、デスメタルやドゥームが育った。1996年末のアニメタルの登場が冬の時代の終わりのきっかけとなり、90年代末以降、LAZY、LOUDNESS、ANTHEM、Xなどが相次いで再結成した。2008年11月には樋口宗孝が49歳で亡くなった。

2000年代にはXが先駆けだったヴィジュアル系のバンドたちが欧米ツアーを広げた。2010年代には女性メンバーだけのバンドが多数結成される「ガールズ・メタル・バンド・ブーム」が起き、BABYMETALは2014年の「ギミチョコ！！」で海外の注目を集め、2016年に日本人アーティストとして初めてロンドンのウェンブリー・アリーナでヘッドライン公演を行った。LOVEBITESやBAND-MAIDも世界で活動し、2020年代には日本のバンドがヴァッケンのコンテストを制する例も出た。</p>
