<h1>Japanese Metal（ジャパニーズ・メタル）とは</h1>
<p>日本のバンドが演奏するヘヴィメタルを、まとめて呼ぶ名前だ。代表曲22曲を動画で聴け、ルーツと影響のつながりを地図でたどれる。</p>
<p>日本のバンドが演奏するヘヴィメタルを、まとめて呼ぶ名前だ。一定の音の型を持つスタイルというより、国で区切った呼び方であり、日本語の歌詞は条件ではなく、よくある特徴のひとつにすぎない。

中心となる楽器は、ディストーションを強くかけたエレキギター2本と、ベース、ドラムスだ。ギターはトレモロ・ピッキングで重く速いリフを刻み、曲の途中には技巧的なソロを置く。ツーバスのドラムが使われることも多い。

和音はパワーコードが基本で、短調系のコード進行で緊張感を作る。メロディは欧米のメタルに比べ、歌謡曲のように歌い上げる例が多く、叙情的なサビを聴かせる。

リズムは4分の4拍子が中心で、速いツーバスの連打や8分音符の刻みで疾走感を出す。曲の中盤に転調を挟む例が多い。

歌い方は、裏返さない高音のシャウトを使う、ハイトーン・ボーカルのバンドが目立つ。近年はデスボイスや、アイドル風の発声も混ざる。

歌詞は、孤独、反逆、幻想、怪奇などを主題にすることが多い。リフが引っぱり、サビで盛り上がる構成が基本で、インストゥルメンタルのソロ部分が聴かせどころになる。欧米のメタルとの違いは、音そのものより、歌詞の言語、歌い方のニュアンス、国内シーンでの広がり方にある。</p>
<h2>成り立ち</h2><p>日本にヘヴィメタルが芽生えたのは、1970年代である。フラワー・トラベリン・バンドが1971年のアルバム『Satori』などで重いロックを演奏し、ヘヴィメタルの先駆的な要素を持つとされる。1975年結成のハードロックバンドBOW WOW（1984年にVOW WOWへ改名）に続き、44MAGNUM（1977年結成、1983年メジャーデビュー）とEARTHSHAKER（1978年結成、1983年メジャーデビュー）が、ともにヘヴィメタルバンドとして結成された。

しかし、LAZYのヘヴィ・メタル宣言（1980年）を転機とする見方が一般的である。アイドル的な人気を得ていたLAZYが「ヘヴィ・メタル宣言」を行い、アルバム『宇宙船地球号』を発表した。LAZYは方向性の対立から、1981年5月に解散する。ギターの高崎晃とドラムの樋口宗孝は、同年にLOUDNESSを結成し、11月にデビューアルバム『誕生前夜』を出した。デビューコンサートのチケットは完売し、「日本のハードロックは売れない」とされていた業界の常識が崩れた。

一方、1983年から1984年にかけて、関西からEARTHSHAKER、44MAGNUM、MARINO、MAKE-UPなどが、東京からはBLIZARDなどが、次々とメジャーデビューし、ブームが本格化した。本城未沙子は1982年に、浜田麻里は1983年に、大物バンドメンバーのプロデュースで登場した。1984年には、インディーズのバンドを集めたオムニバス盤『HEAVY METAL FORCE Vol.1』が出て、1985年10月には日比谷野外音楽堂で「JAPAN HEAVY METAL FESTIVAL」が開かれた。同年、聖飢魔IIはデビュー作が、日本のヘヴィメタル作品として初めて10万枚を超えたとされる。LOUDNESSは1984〜85年に米国のアトコと契約し、米メジャー（アトランティック系列）と契約した日本のメタルバンドの先駆けとなった。アルバム『THUNDER IN THE EAST』は、米ビルボードで74位まで上がった。

1982年に結成されたXは、1988年のインディーズ盤『Vanishing Vision』で、メジャーのチャートに入る記録的な売れ行きを見せた。1989年の『BLUE BLOOD』はオリコン集計で累計約71万枚、1991年の『Jealousy』は100万枚を超えた。メタルのブームは1983〜85年ごろに本格化し、1987年ごろから失速した。1990年代は冬の時代である。Xの記録は、ヴィジュアル系を含む商業的成功と切り分けるべきである。

しかし1990年代に入ると、E・Z・O、VOW WOW、DEAD END、ANTHEM、EARTHSHAKERと、1980年代を支えたバンドが相次いで解散し、シーンは冬の時代を迎えた。それでも地下では、ブラックメタルのSighが1993年に、ユーロニモスのレーベル（デスライク・サイレンス）から1stアルバム『Scorn Defeat』を出すなど、エクストリームメタルが育った。1996年末のアニメタルの登場が、冬の時代の終わりのきっかけとなった。90年代末以降、LAZY、LOUDNESS、ANTHEM、Xなどが相次いで再結成した。2008年11月には、樋口宗孝が49歳で亡くなった。

Xなどを源流のひとつとするヴィジュアル系のうち、DIR EN GREYやMUCCらが、2000年代に海外でツアーを行った。2010年代にはAldious、Cyntia、LOVEBITESなど、ガールズメタルバンドの活躍が目立った。BABYMETALは2014年の「ギミチョコ！！」で海外の注目を集め、2016年には日本人アーティストとして初めて、ロンドンのウェンブリー・アリーナでヘッドライン公演を行った。LOVEBITESやBAND-MAIDも世界で活動し、2020年代には日本のバンドが、ヴァッケンのコンテストを制する例も出た。</p>
