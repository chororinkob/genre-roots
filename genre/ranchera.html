<h1>Ranchera（ランチェラ）とは</h1>
<p>メキシコの国民的な歌の様式である。名称は農場を意味する語に由来し、都市化以前の農村の生活と感情を歌うという性格を最初から持っている。拍子は三種類が中心で、三拍子のワルツ、二拍子のポルカ、そして四拍子の緩やかな恋愛歌の型が用いられる</p>
<p>メキシコの国民的な歌の様式である。名称は農場を意味する語に由来し、都市化以前の農村の生活と感情を歌うという性格を最初から持っている。拍子は三種類が中心で、三拍子のワルツ、二拍子のポルカ、そして四拍子の緩やかな恋愛歌の型が用いられる。伴奏の編成は固定されておらず、マリアッチによる大編成、北部の手風琴の楽団、吹奏楽の楽団、あるいはギター一本と、状況に応じて自在に変わる。したがってこの様式を定義するのは編成ではなく、旋律と歌詞と歌唱の在り方である。旋律は単純で覚えやすく、音域は歌手が力いっぱい張り上げられる範囲に設定される。和声は基本的な三和音の循環が中心で、複雑さは求められない。歌唱こそが核心である。喉を開いて全力で歌い上げ、語尾を長く伸ばし、感情の頂点では言葉ではない鋭い叫びを発する。この叫びは様式の必須の要素であり、聴き手も一緒に発することがある。歌詞は失恋、裏切り、酒に溺れる夜、故郷への愛、そして誇りと男らしさを扱う。感情を抑制せず、恥じらいなく吐き出すことが美徳とされ、この率直さがメキシコ人の自己像そのものと結びついてきた。</p>
<h2>成り立ち</h2><p>この様式が形を得たのは、1910年から続いたメキシコ革命の後である。革命は数十万から100万を超える死者を出し、国家の再建にあたって、何をメキシコらしさとするかという問いが政治的な課題となった。この文脈で、農村の素朴な生活と情感を歌う歌が、国民の心情を代表するものとして位置づけられていく。1930年代から1950年代のメキシコ映画の黄金期が、この過程を決定づけた。Jorge Negreteは訓練を受けた声楽の技術を持ちながら、騎馬民の装いで力強く歌い、Pedro Infanteは庶民的な魅力によって国民的な人気を得た。後者は1957年に飛行機事故で死亡し、その葬儀には数十万人が集まったと伝えられる。作曲の面で最も重要なのがJosé Alfredo Jiménezである。彼は正規の音楽教育を受けておらず、楽譜を読むことも書くこともできなかったが、口ずさんだ旋律を他者に書き取らせる方法で1000曲を超える作品を残した。その歌詞は、酒場で酔い、失恋を嘆き、それでも自分は王だと言い張るという、痛ましくも滑稽な人間像を描き、メキシコ人の情感の教科書となった。彼自身が重度の飲酒により47歳で死去している。歌手の側では、女性のLola Beltránが力強い歌唱で頂点に立った。特異な存在がChavela Vargasである。彼女はコスタリカ生まれで、男性の衣装をまとい、拳銃を携え、伴奏を最小限に削って囁くように歌った。同性愛者であることを晩年に公言し、画家Frida Kahloとの親交でも知られる。彼女の存在は、男らしさと結びついたこの様式の内側から、その規範を静かに揺さぶるものだった。20世紀後半にはVicente Fernándezが国民的な歌手として君臨し、Juan Gabrielは作曲家としても歌手としても圧倒的な足跡を残している。</p>
<h2>代表曲</h2><ul><li>Cien Años (Pedro Infante)</li><li>La Llorona (Chavela Vargas)</li><li>Volver, Volver (Vicente Fernández)</li></ul>
