<h1>Ranchera（ランチェラ）とは</h1>
<p>ランチェラは、メキシコの国民的な歌のスタイルだ。名前は「農場」を意味する語から来ている。農村の民謡を素材にし、都市化が進む前の農村の暮らしと感情を歌うのが、この音楽の性格である。 伴奏の編成は決まっていない。マリアッチによる大編成</p>
<p>ランチェラは、メキシコの国民的な歌のスタイルだ。名前は「農場」を意味する語から来ている。農村の民謡を素材にし、都市化が進む前の農村の暮らしと感情を歌うのが、この音楽の性格である。

伴奏の編成は決まっていない。マリアッチによる大編成、北部のアコーディオンの楽団、吹奏楽の楽団、あるいはギター1本と、状況に合わせて自在に変わる。だから、このスタイルを決めるのは編成ではない。旋律と歌詞と歌い方の在り方である。

旋律は単純で覚えやすいことが多い。音域は、歌手が力いっぱい張り上げられる範囲に設定されることが多い。和声は基本的な3音の和音の繰り返しが中心とされ、複雑さは求められない。

拍子は、2拍子(速い行進曲風（marcha）の型と遅い型（lenta）)、3拍子のワルツ、そして4拍子のゆったりした恋愛歌の型が中心だ。

何より大切なのは歌い方だ。喉を開いて全力で歌い上げ、語尾を長く伸ばす。間奏などでは、言葉ではない鋭い叫びを上げる。この叫びはスタイルの特徴的な要素で、演奏者や聴き手が一緒に上げることがある。

歌詞は、失恋、裏切り、酒に溺れる夜、故郷への愛、そして誇りと男らしさを扱う。感情を抑えず、恥ずかしがらずに吐き出すことが美徳とされる。この率直さが、メキシコ人の自己像そのものと結びついてきたとも言われる。</p>
<h2>成り立ち</h2><p>ランチェラの素材は、革命より前の農村の民謡にさかのぼる。ただ、今の形になったのは、1910年から続いたメキシコ革命の後とされる(起源には諸説ある)。

革命の死者は、推計で約100万〜200万人超と幅がある。国を立て直すにあたって、何をメキシコらしさとするかという問いが、政治の課題になった。こうした流れの中で、農村の素朴な暮らしと情感を歌う歌が、国民の心を代表するものとして位置づけられていく。

1930年代から1950年代のメキシコ映画の黄金期は、この過程で、こうした歌を広める役割を果たした。Jorge Negreteは、訓練を受けた声楽の技術を持ちながら、チャロ（騎馬牧童）の装いで力強く歌った。Pedro Infanteは、庶民的な魅力で国民的な人気を得た。彼は1957年に飛行機事故で亡くなった。その葬儀には約7万〜50万人が集まったと伝えられるが、人数には諸説ある。

作曲の面で最も重要なのが、José Alfredo Jiménezだ。彼は正規の音楽教育を受けておらず、楽譜を読むことも書くこともできなかった。それでも、口ずさんだ旋律を人に書き取らせる方法で、多くの作品を残した。作曲の数は約300〜1000曲超と資料により異なる(録音は約300曲)。その歌詞は、酒場で酔い、失恋を嘆き、それでも自分は王だと言い張る、痛ましくも滑稽な人間を描いた。それはメキシコ人の情感の教科書となった。彼自身も、重い飲酒がもとで47歳で亡くなっている。

歌手では、女性のLola Beltránが力強い歌声で頂点に立った。

一方、ひときわ変わった存在がChavela Vargasだ。彼女はコスタリカ生まれで、男性の服をまとい、拳銃を携えた。そして、ギター1本など最小限の伴奏で、荒く深みのある声で感情をむき出しに歌った。同性愛者であることを晩年に公言し、画家Frida Kahloとの親交でも知られる。彼女の存在は、男らしさと結びついたこのスタイルの内側から、その決まりごとを揺さぶるものだった。

20世紀後半には、Vicente Fernándezが国民的な歌手として君臨した。Juan Gabrielは、作曲家としても歌手としても、圧倒的な足跡を残している。</p>
<h2>代表曲</h2><ul><li>Volver, Volver (Vicente Fernández)</li><li>Estos Celos (Vicente Fernández)</li><li>Rata de Dos Patas (Paquita la del Barrio)</li><li>Paloma Negra (Lila Downs)</li><li>Cien Años (Pedro Infante)</li><li>No Vale la Pena (Juan Gabriel)</li><li>El Rey (José Alfredo Jiménez)</li><li>La Llorona (Chavela Vargas)</li><li>Camino de Guanajuato (José Alfredo Jiménez)</li><li>Por Tu Maldito Amor (Vicente Fernández)</li><li>Mujeres Divinas (Vicente Fernández)</li><li>La Cama de Piedra (Pedro Infante)</li></ul>
