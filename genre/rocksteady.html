<h1>Rocksteady（ロックステディ）とは</h1>
<p>スカのテンポを大幅に落とし、主役を管楽器からベースと歌に移した様式である。速度はスカの半分近くまで下がり、一分間に80拍前後で演奏される。この減速によって音と音の間に空白が生まれ、そこにベースが入り込んだ。ベースは単に和音の根音を</p>
<p>スカのテンポを大幅に落とし、主役を管楽器からベースと歌に移した様式である。速度はスカの半分近くまで下がり、一分間に80拍前後で演奏される。この減速によって音と音の間に空白が生まれ、そこにベースが入り込んだ。ベースは単に和音の根音を追うのではなく、記憶に残る短い音型を作曲して反復する役割を得ており、曲によってはベースの音型そのものが主旋律より有名になる。このベースが曲の顔になるという構造は、後のレゲエとダブに丸ごと受け継がれた。ギターは裏拍を短く切って刻み、その刻みは減速したぶん一つ一つが明確に聞き取れる。ドラムは装飾を減らし、リムショットの乾いた音を要所に置く。管楽器は完全に消えたわけではないが、曲全体を引っ張る役から、要所に彩りを添える役へ後退した。代わって前に出たのが三人組の男声ボーカル・グループで、アメリカのソウル・グループの和声を手本にした滑らかな重唱を聞かせる。歌詞は恋愛が中心だが、都市の若い無法者を指すルード・ボーイを題材にした曲も多く、彼らを称える曲と諫める曲が同時に流通していた。</p>
<h2>成り立ち</h2><p>1966年の夏、ジャマイカは記録的な猛暑に見舞われた。速いスカのテンポでは踊り続けられないという極めて実際的な理由から、ダンスホールの演奏速度が落とされたというのが、当事者たちの語る発端である。最初期の録音とされるのがホープトン・ルイスの『テイク・イット・イージー』で、様式の名前そのものはオルトン・エリスが同年に発表した『ロック・ステディ』に由来する。もう一つの要因は人材の流出だった。スカを支えていた管楽器奏者の多くは、キングストンの孤児院系の職業学校アルファ・ボーイズ・スクールで音楽教育を受けた者たちだったが、彼らの相当数が英語圏の客船楽団や海外の職を求めて島を離れた。管楽器を並べる編成が維持できなくなったことが、ベースとギターを前面に出す編成への移行を後押しした。ちょうどこの時期にエレキベースが普及し、太く持続する低音が録音で捉えられるようになったことも重なっている。制作の中心はデューク・リードのトレジャー・アイル・スタジオで、ザ・テクニクスやザ・パラゴンズを擁して黄金期を作った。ザ・パラゴンズが1967年に吹き込んだ『ザ・タイド・イズ・ハイ』は、1980年にブロンディが取り上げて世界的なヒットになっている。もう一方の拠点であるスタジオ・ワンでは、鍵盤奏者のジャッキー・ミットゥが編曲を統括し、ザ・ヘプトーンズのベーシスト兼歌手であるレロイ・シブルスが、後年まで無数に引用され続けるベースの音型を量産した。デズモンド・デッカーの1967年の『007 シャンティ・タウン』は、ルード・ボーイの暴力と裁判を描いて英国でも売れ、ジャマイカ音楽が英国の労働者階級の若者、とりわけスキンヘッドの間で受容される道を開いた。この様式が続いたのは1966年から1968年までのわずか二年ほどで、その後さらにテンポを落とし裏拍を強めたレゲエへ移行するが、この短期間に作られたベースの音型と歌のレパートリーは、その後半世紀にわたって再利用され続けている。</p>
