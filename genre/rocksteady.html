<h1>Rocksteady（ロックステディ）とは</h1>
<p>ロックステディは、スカのテンポを大幅に落とし、主役を管楽器からベースと歌に移したスタイルである。 速度はスカより明らかに下がり、おおむね75〜105BPM前後(曲により幅がある)で演奏される。この減速によって音と音の間に空白が生ま</p>
<p>ロックステディは、スカのテンポを大幅に落とし、主役を管楽器からベースと歌に移したスタイルである。

速度はスカより明らかに下がり、おおむね75〜105BPM前後(曲により幅がある)で演奏される。この減速によって音と音の間に空白が生まれ、そこにベースが入り込んだ。

ベースは、和音の根音（いちばん低い土台の音）を追うだけではない。記憶に残る短い音型を作曲して反復する役割を得ており、曲によってはベースの音型そのものが主旋律より有名になることがある。このベースが曲の顔になるという構造は、後のレゲエに受け継がれた。

ギターは裏拍を短く切って刻む。その刻みは、減速したぶん一つ一つがはっきり聞き取れる。管楽器は完全に消えたわけではないが、曲全体を引っ張る役から、要所に彩りを添える役へ後退した。

ドラムは装飾を減らし、ワン・ドロップ（1拍目を抜く独特のドラム）が特徴とされる。ただし、その考案者には諸説ある。

代わって前に出たのが、3人編成が多い男声ボーカル・グループである。アメリカのソウル・グループの和声を手本にした、滑らかな重唱（複数人で声を重ねて歌うこと）を聞かせる。

歌詞は恋愛が中心だ。ただ、都市の若い無法者を指すルード・ボーイを題材にした曲も多く、彼らを称える曲とたしなめる曲が同時に流通していた。</p>
<h2>成り立ち</h2><p>発端には諸説ある。ホープトン・ルイスが歌えなかったとする説や、リン・テイトらがテンポを落としたとする説などが伝わる。1966年の猛暑が理由だったとする説は、俗説とされる。

最初の録音も諸説あり、ホープトン・ルイスの『テイク・イット・イージー』が最有力とされることが多い。スタイルの名前は、アルトン・エリスの『ロック・ステディ』(1966〜67年。発売年は資料により異なる)に由来するとされる。

ほかにも要因があった。スカを支えていた管楽器奏者の多くは、キングストンのカトリック系の職業学校アルファ・ボーイズ・スクールで音楽教育を受けた者たちだった。しかし1965年8月にスカタライツが解散し、主要奏者は二つの楽団とスタジオ付きのアレンジャー業に分かれた。スタジオの楽団は小編成になり、管楽器は背景に回った。これがベースとギターを前面に出す編成への移行を後押しした。ミットゥとテイトのカナダ移住が知られるが、これはレゲエへの移行期の話である。ちょうどこの時期にエレキベースが普及し、太く持続する低音を録音で捉えられるようになったことも重なっている。

制作の中心は、デューク・リードのトレジャー・アイル・スタジオだった。ザ・テクニクスやザ・パラゴンズを擁して、黄金期を作った。ザ・パラゴンズが1967年に吹き込んだ『ザ・タイド・イズ・ハイ』は、1980年にブロンディが取り上げて、世界的なヒットになっている。

もう一方の拠点が、スタジオ・ワンである。鍵盤奏者のジャッキー・ミットゥが、編曲（曲の楽器編成や構成を作ること）を取りまとめていた。そこには、ザ・ヘプトーンズのリード歌手で、スタジオ・ワンではセッション・ベーシスト兼アレンジャーとしても活動したレロイ・シブルス(ミットゥ退任後は編曲も担当)がいた。

デズモンド・デッカーの1967年の『007 シャンティ・タウン』は、ルード・ボーイの暴力と裁判を描いて、英国でも売れた。ジャマイカ音楽が英国で通用することを示した曲の一つとなり、スキンヘッドを含む英国の若者の間でジャマイカ音楽が受け入れられた流れの中に位置づけられる。

このスタイルが続いたのは、1966年から1968年までのわずか2年ほどである。その後、1968年ごろに初期レゲエへ移行した。初期レゲエはいったんテンポが上がり、裏拍の強調、オルガンの導入、ベースの複雑化が進み、レゲエ全体の定着期には再び遅くなる。それでも、この短期間に作られたベースの音型と歌のレパートリー（持ち曲）は、その後半世紀にわたって再利用され続けている。</p>
<h2>代表曲</h2><ul><li>The Tide Is High (The Paragons)</li><li>007 (Shanty Town) (Desmond Dekker)</li><li>Perfidia (Phyllis Dillon)</li><li>Rudy, A Message to You (Dandy Livingstone)</li><li>Rock Steady (Alton Ellis)</li><li>Train to Skaville (The Ethiopians)</li><li>Take It Easy (Hopeton Lewis)</li><li>The Loser (Derrick Harriott)</li><li>Baby I Love You (The Heptones)</li><li>Stop That Train (Keith &amp; Tex)</li><li>On the Beach (The Paragons)</li><li>Ba Ba Boom (The Jamaicans)</li></ul>
