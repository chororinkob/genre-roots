<h1>Rocksteady（ロックステディ）とは</h1>
<p>スカのテンポを大幅に落とし、主役を管楽器からベースと歌に移した様式である。速度はスカより明らかに下がり、おおむね90〜100BPM台(曲により幅がある)で演奏される。この減速によって音と音の間に空白が生まれ、そこにベースが入り込ん</p>
<p>スカのテンポを大幅に落とし、主役を管楽器からベースと歌に移した様式である。速度はスカより明らかに下がり、おおむね90〜100BPM台(曲により幅がある)で演奏される。この減速によって音と音の間に空白が生まれ、そこにベースが入り込んだ。ベースは単に和音の根音を追うのではなく、記憶に残る短い音型を作曲して反復する役割を得ており、曲によってはベースの音型そのものが主旋律より有名になる。このベースが曲の顔になるという構造は、後のレゲエに受け継がれた。ギターは裏拍を短く切って刻み、その刻みは減速したぶん一つ一つが明確に聞き取れる。ドラムは装飾を減らし、ワン・ドロップが特徴とされる。管楽器は完全に消えたわけではないが、曲全体を引っ張る役から、要所に彩りを添える役へ後退した。代わって前に出たのが、3人編成が多い男声ボーカル・グループで、アメリカのソウル・グループの和声を手本にした滑らかな重唱を聞かせる。歌詞は恋愛が中心だが、都市の若い無法者を指すルード・ボーイを題材にした曲も多く、彼らを称える曲と諫める曲が同時に流通していた。</p>
<h2>成り立ち</h2><p>発端には諸説ある。ホープトン・ルイスが速いテンポで歌えず、リン・テイトらがテンポを落とした、という説が有力で、1966年の猛暑が理由だったとする説は俗説とされる。最初の録音は諸説あり、ホープトン・ルイスの『テイク・イット・イージー』が最有力とされることが多い。様式の名前は、オルトン・エリスの『ロック・ステディ』(1966〜67年。発売年は資料により異なる)に由来するとされる。もう一つの要因は人材の流出だった。スカを支えていた管楽器奏者の多くは、キングストンのカトリック系の職業学校アルファ・ボーイズ・スクールで音楽教育を受けた者たちだったが、1965年にスカタライツが解散するなどして、スタジオの楽団が小編成化し、管楽器は背景に回った。これがベースとギターを前面に出す編成への移行を後押しした。ミットゥとテイトのカナダ移住が知られるが、これはレゲエへの移行期の話である。ちょうどこの時期にエレキベースが普及し、太く持続する低音が録音で捉えられるようになったことも重なっている。制作の中心はデューク・リードのトレジャー・アイル・スタジオで、ザ・テクニクスやザ・パラゴンズを擁して黄金期を作った。ザ・パラゴンズが1967年に吹き込んだ『ザ・タイド・イズ・ハイ』は、1980年にブロンディが取り上げて世界的なヒットになっている。もう一方の拠点であるスタジオ・ワンでは、鍵盤奏者のジャッキー・ミットゥが編曲を統括し、ザ・ヘプトーンズのベーシスト兼歌手であるレロイ・シブルスが、後年まで無数に引用され続けるベースの音型を量産した。デズモンド・デッカーの1967年の『007 シャンティ・タウン』は、ルード・ボーイの暴力と裁判を描いて英国でも売れ、ジャマイカ音楽が英国で通用することを示した曲の一つとなり、スキンヘッドを含む英国の若者の間でジャマイカ音楽が受け入れられた流れの中に位置づけられる。この様式が続いたのは1966年から1968年までのわずか2年ほどで、その後さらにテンポを落とし裏拍を強めたレゲエへ移行するが、この短期間に作られたベースの音型と歌のレパートリーは、その後半世紀にわたって再利用され続けている。</p>
<h2>代表曲</h2><ul><li>The Tide Is High (The Paragons)</li><li>007 (Shanty Town) (Desmond Dekker)</li><li>Perfidia (Phyllis Dillon)</li><li>Rudy, A Message to You (Dandy Livingstone)</li><li>Rock Steady (Alton Ellis)</li><li>Train to Skaville (The Ethiopians)</li><li>Take It Easy (Hopeton Lewis)</li><li>The Loser (Derrick Harriott)</li><li>Baby I Love You (The Heptones)</li><li>Stop That Train (Keith &amp; Tex)</li><li>On the Beach (The Paragons)</li><li>Ba Ba Boom (The Jamaicans)</li></ul>
