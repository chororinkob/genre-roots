<h1>Norteño（ノルテーニョ）とは</h1>
<p>メキシコ北部とアメリカとの国境地帯で発達した、手風琴を中心とする音楽である。編成の核は二つの楽器の組み合わせにある。ひとつはボタン式の全音階手風琴で、旋律と装飾を担い、速い分散和音による華やかな走句が聴かせどころとなる。もうひとつ</p>
<p>メキシコ北部とアメリカとの国境地帯で発達した、手風琴を中心とする音楽である。編成の核は二つの楽器の組み合わせにある。ひとつはボタン式の全音階手風琴で、旋律と装飾を担い、速い分散和音による華やかな走句が聴かせどころとなる。もうひとつはバホ・セスト、あるいはバホ・キントと呼ばれる大型の複弦ギターで、六組または五組の弦を二本ずつ張り、低音の刻みと和音の伴奏を同時に担当する。この二つが噛み合うことで、少人数でも厚い音が成立する。これに低音楽器とドラムが加わるのが現代の標準的な形である。リズムはヨーロッパ由来のものが多く、二拍子のポルカ、三拍子のワルツ、そしてレドバやショティスといった舞踏音楽の型が用いられる。テンポは中庸から速く、跳ねた躍動を持つ。和声は三和音を中心とした単純なもので、転調はほとんどない。歌唱は二声の和音が基本で、主旋律の上に三度で寄り添う声が張り付き、高い音域で力強く歌われる。歌詞は物語形式が多く、国境を越える者の苦難、移民の郷愁、労働、恋愛、そして犯罪組織をめぐる出来事が語られる。</p>
<h2>成り立ち</h2><p>この音楽の成立には、意外な移民の歴史が関わっている。19世紀後半、メキシコ北部とテキサス南部には、ドイツ、チェコ、ポーランドからの移民が入植し、彼らはビール醸造の技術とともに、ポルカやワルツといった舞踏音楽と、ボタン式の手風琴を持ち込んだ。これを現地のメキシコ系住民が採り入れ、自分たちの弦楽器と歌の伝統に接ぎ木したものが、この音楽の原型である。つまり中欧の農村の舞踏音楽が、国境地帯で生まれ変わったといえる。20世紀前半、テキサスのNarciso Martínezが手風琴の奏法を確立し、1930年代から録音を残して、この地域の音の基準を作った。彼はバホ・セストの奏者と組むことで、後の標準的な編成を定めている。1950年代にはLos Alegres de Teránが、二声の歌と手風琴による形を完成させた。この音楽の担い手と聴き手の中心は、常に国境を往復する労働者たちだった。彼らはアメリカの農場や工場で働き、故郷へ送金し、その両方の場所でこの音楽を聴いた。1968年、カリフォルニア州サンノゼで、メキシコから移住してきた少年たちがLos Tigres del Norteを結成する。彼らは1972年、麻薬の密輸をめぐる物語を歌った楽曲で大きな成功を収め、以後、移民の権利、不法労働、家族の離散といった社会的な主題を正面から扱い続けた。彼らの楽曲は、メキシコでもアメリカでも報道されない現実を伝える役割を果たしてきた。1990年代以降、Ramón AyalaやIntocableといった演者が、より洗練された演奏で人気を保っている。現在この音楽は、アメリカ国内で最も大きな市場を持つスペイン語の音楽のひとつであり、国境の両側で生きる数千万の人々の生活の音として鳴り続けている。</p>
