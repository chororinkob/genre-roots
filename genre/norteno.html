<h1>Norteño（ノルテーニョ）とは</h1>
<p>ノルテーニョは、メキシコ北部とアメリカとの国境地帯で発達した、手風琴を中心とする音楽だ。 編成の核は、二つの楽器の組み合わせにある。ひとつは、ボタン式で全音階（ドレミの基本の音階）の手風琴だ。旋律と飾りの音を受け持ち、速い分散和音</p>
<p>ノルテーニョは、メキシコ北部とアメリカとの国境地帯で発達した、手風琴を中心とする音楽だ。

編成の核は、二つの楽器の組み合わせにある。ひとつは、ボタン式で全音階（ドレミの基本の音階）の手風琴だ。旋律と飾りの音を受け持ち、速い分散和音（和音の音を順に弾く奏法）による華やかな走句（速く駆け抜けるフレーズ）が聴かせどころになる。もうひとつは、バホ・セスト(6組12弦)、またはそこから派生したバホ・キント(5組10弦)と呼ばれる大型の複弦ギターだ。低音の刻みと和音の伴奏を、同時に受け持つ。この二つがかみ合うことで、少ない人数でも厚い音が生まれる。現代の標準的な形は、これに低音楽器とドラムが加わったものだ。地域によっては、サックスなども加わる。

和声（コードの響き）は、基本的な和音が中心である。

リズムの土台は、ヨーロッパから来た舞踏音楽の型だ。2拍子のポルカ、3拍子のワルツ、レドバやショティスなどである。そこに、メキシコ由来のランチェーラやウアパンゴなどが加わる。また、コロンビア起源のクンビアも、メキシコで定着して取り入れられた。テンポは中くらいから速めで、跳ねるような勢いがある。

歌は2声の和音が基本だ。主旋律の上に、3度（ドに対するミのような近い高さ）で寄り添う声が重なり、高い音域で力強く歌われる。

歌詞は物語の形が多い。国境を越える者の苦しみ、移民の故郷への思い、労働、恋愛、そして犯罪組織をめぐる出来事が語られる。</p>
<h2>成り立ち</h2><p>この音楽の成り立ちには、意外な移民の歴史が関わっている。19世紀半ばから、ドイツ・ボヘミア系の移民が、中部テキサスとメキシコ北部(モンテレー周辺など)に入ってきた。彼らはのちに、南テキサスへも広がった。

こうした移民と、マクシミリアン帝政期に入った中欧の音楽が、ポルカやワルツなどの舞踏音楽を北部にもたらした。ボタン式の手風琴も北部に伝わったが、誰が最初に持ち込んだかには諸説ある。地元のメキシコ系の人々はこれを取り入れ、自分たちの弦楽器と歌の伝統につなぎ合わせた。これが、この音楽の原型である。中欧の農村の舞踏音楽が、国境地帯で生まれ変わったといえる。

20世紀前半、テキサスのNarciso Martínezが手風琴の奏法を固めた。彼は1930年代から録音を残し、この地域の音の基準を作った。また、手風琴とバホ・セストのデュオで、テキサスのコンフント（小編成のバンド）スタイルの土台を築いた。

Los Alegres de Teránは、1948年に結成された(初録音は1948年とも1949年とも記される)。彼らは、2声の歌と手風琴によるノルテーニョのスタイルの先駆者となった。

この音楽の担い手と聴き手の中心は、国境地帯と各地の移民・労働者階級だった(とくに20世紀半ば)。彼らはアメリカの農場や工場で働き、故郷へお金を送り、その両方の場所でこの音楽を聴いた。

1968年(資料により1965年とも)、シナロア州ロサ・モラダの兄弟と従兄たちが、Los Tigres del Norteを結成した。同じ年にアメリカへ渡り、カリフォルニア州サンノゼを拠点にする。1970年代前半、彼らは麻薬の密輸をめぐる物語を歌った曲で大きな成功を収めた。並行して、移民の権利、不法労働、家族の離散といった社会的なテーマを正面から扱う曲でも評価を得た。彼らの曲は、報道されにくい現実を伝えるものとして受け止められてきた、という評価がある。

Ramón Ayalaは、1963年または1964年のデビュー以来、第一線で活動してきた。1990年代に人気を集めたIntocableとともに、より磨かれた演奏で人気を保っている。

現在、ノルテーニョを含む、メキシコ各地の音楽をまとめた「リージョナル・メキシカン」は、2024年上半期の配信量で見ると、アメリカで最大のラテン音楽の分野である。それは、国境の両側で生きる人々の生活の音として、鳴り続けている。</p>
