<h1>Norteño（ノルテーニョ）とは</h1>
<p>メキシコ北部とアメリカとの国境地帯で発達した、手風琴を中心とする音楽である。編成の核は二つの楽器の組み合わせにある。ひとつはボタン式の全音階（ドレミの基本の音階）の手風琴で、旋律と装飾を担い、速い分散和音（和音の音を順に弾く奏法）</p>
<p>メキシコ北部とアメリカとの国境地帯で発達した、手風琴を中心とする音楽である。編成の核は二つの楽器の組み合わせにある。ひとつはボタン式の全音階（ドレミの基本の音階）の手風琴で、旋律と装飾を担い、速い分散和音（和音の音を順に弾く奏法）による華やかな走句（速く駆け抜けるフレーズ）が聴かせどころとなる。もうひとつはバホ・セスト、あるいはバホ・キントと呼ばれる大型の複弦ギターで、六組または五組の弦を2本ずつ張り、低音の刻みと和音の伴奏を同時に担当する。この二つが噛み合うことで、少人数でも厚い音が成立する。これに低音楽器とドラムが加わるのが現代の標準的な形である。リズムは、ヨーロッパ由来の2拍子のポルカ、3拍子のワルツ、レドバやショティスといった舞踏音楽の型に、メキシコ由来のランチェーラ、クンビア、ウアパンゴなどが加わる。テンポは中庸から速く、跳ねた躍動を持つ。和声（コードの響き）は三和音（三つの音を重ねた基本の和音）を中心とした単純なもので、転調（調が変わること）はほとんどない。歌唱は2声の和音が基本で、主旋律の上に、3度（ドに対するミのような近い高さ）で寄り添う声が重なり、高い音域で力強く歌われる。歌詞は物語形式が多く、国境を越える者の苦難、移民の郷愁、労働、恋愛、そして犯罪組織をめぐる出来事が語られる。</p>
<h2>成り立ち</h2><p>この音楽の成立には、意外な移民の歴史が関わっている。19世紀後半、メキシコ北部とテキサス南部には、ドイツ、チェコ、ポーランドからの移民が入植した。こうした移民と、マクシミリアン帝政期に入った中欧の音楽が、ポルカやワルツといった舞踏音楽と、ボタン式の手風琴を北部にもたらした。これを現地のメキシコ系住民が採り入れ、自分たちの弦楽器と歌の伝統につなぎ合わせたものが、この音楽の原型である。つまり中欧の農村の舞踏音楽が、国境地帯で生まれ変わったといえる。20世紀前半、テキサスのNarciso Martínezが手風琴の奏法を確立し、1930年代から録音を残して、この地域の音の基準を作った。彼は手風琴とバホ・セストのデュオで、テキサスのコンフント（小編成のバンド）様式の基礎を築いた。Los Alegres de Teránは、1948年の初録音以来、2声の歌と手風琴によるノルテーニョ様式の先駆者となった。この音楽の担い手と聴き手の中心は、常に国境を往復する労働者たちだった。彼らはアメリカの農場や工場で働き、故郷へ送金し、その両方の場所でこの音楽を聴いた。1968年(資料により1965年とも)、シナロア州ロサ・モラダの兄弟と従兄たちがLos Tigres del Norteを結成し、同年にアメリカへ渡ってカリフォルニア州サンノゼを拠点にする。彼らは1970年代前半、麻薬の密輸をめぐる物語を歌った楽曲(1972年作詞、アルバムは1974年)で大きな成功を収め、以後、移民の権利、不法労働、家族の離散といった社会的な主題を正面から扱い続けた。彼らの楽曲は、報道されにくい現実を伝えるものとして受け止められてきた、という評価がある。Ramón Ayalaは1964年のデビュー以来、第一線で活動し、1990年代に台頭したIntocableとともに、より磨かれた演奏で人気を保っている。現在、ノルテーニョを含む、メキシコ各地の音楽をまとめた「リージョナル・メキシカン」は、アメリカで最大のラテン音楽の分野であり、国境の両側で生きる人々の生活の音として鳴り続けている。</p>
<h2>代表曲</h2><ul><li>Ni Parientes Somos (Los Tigres del Norte)</li><li>Tres Veces Mojado (Los Tigres del Norte)</li><li>Pedro y Pablo (Los Tigres del Norte)</li><li>La Jaula de Oro (Los Tigres del Norte)</li><li>Golpes en el Corazón (Los Tigres del Norte)</li><li>Un Rinconcito en el Cielo (Ramón Ayala)</li><li>Un Puño de Tierra (Ramón Ayala)</li><li>Mi Piquito de Oro (Ramón Ayala)</li><li>Contrabando y Traición (Los Tigres del Norte)</li><li>Dame un Besito (Intocable)</li><li>¿Y Todo Para Qué? (Intocable)</li></ul>
