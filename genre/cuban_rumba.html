<h1>Cuban Rumba（ルンバ）とは</h1>
<p>ルンバはキューバ島北部の都市部で鍛えられた、歌・太鼓・踊りが一体になった世俗の音楽である。骨格を担うのは2本の硬い木の棒を打ち合わせるクラーベが刻む5打の目安となるパターン、いわゆるルンバ・クラーベで、この2小節単位のパターンが全</p>
<p>ルンバはキューバ島北部の都市部で鍛えられた、歌・太鼓・踊りが一体になった世俗の音楽である。骨格を担うのは2本の硬い木の棒を打ち合わせるクラーベが刻む5打の目安となるパターン、いわゆるルンバ・クラーベで、この2小節単位のパターンが全体の緊張と解放を支配する。その上に、低音のトゥンバ（サリドール）、中音のトレス・ドス、高音のキントという3本のトゥンバドーラ（コンガの一種）が交錯し、キントは即興で応酬して、オープン・トーン（開いた音）とスラップ（平手で打つ鋭い音）を交互に叩く旋律型（ロス・ムニェキートスが先駆けたとされるスタイル）を用い、太鼓同士が会話しているような掛け合いを生む。原型の編成ではコンガの代わりに引き出しや木箱を叩くカホンが用いられ、乾いた木の打音が特徴的だ。拍子は2/4や4/4の2拍子が基調で、テンポは型によって変わる。最古の型ヤンブーは最も遅く、最も人気のあるグアグアンコーはヤンブーより速いテンポ、男性の独舞をともなうコルンビアは6/8や12/8の三連符系で、速く力強い。歌はまず独唱者が意味のない音節の旋律で歌い出す導入部のディアーナに始まり、コーラスがクラーベに重なる掛け声で応えるコール・アンド・レスポンスで進行する。声は太鼓の音色に溶け込むよう地声で張り上げ、歌詞は路地裏の噂話や男女の駆け引き、日々の暮らしの機微をユーモアと皮肉を込めて歌う。電子的なエフェクトは一切なく、チェケレのシャカシャカという乾いた振動音と、空間の残響そのものが音響の質感を形作る。曲は歌の導入、太鼓の会話、ダンサーの独壇場へと段階的に熱を上げ、最高潮で一瞬の休止が入り、再び疾走する構成が常套だ。隣接するソン・クバーノがギターやトランペットの旋律を主体とする合奏であるのに対し、ルンバはトゥンバドーラ、キント、クラベス、グアグア、パリート（木の棒）、チェケレ、カホンなどの打楽器と声で成り立つ打楽器中心の音楽である点が最大の違いであり、路上の祭りやパーティーで観客が輪になり手拍子を打つ生きた音楽として今も鳴り続けている。</p>
<h2>成り立ち</h2><p>ルンバの物語は19世紀後半、キューバ島北部のハバナと港湾都市マタンサスのスラム街から始まる。1886年の奴隷制廃止後、解放されたアフリカ系の人々は「ソラール」と呼ばれる中庭付き長屋の密集地帯に流入し、日曜の午後、路上の祝祭の中で歌と踊りが生まれた。タラの輸送箱や引き出しなどから作った箱太鼓＝カホンを打ち鳴らすのが最初期の形で、後にコンガ（トゥンバドーラ）が使われるようになった。ルンバの伝統的な主要3様式は、植民地時代にさかのぼる最古で最も遅いヤンブー、男女の駆け引きを踊るグアグアンコー、農村に由来するとされ男性の独舞をともなうコルンビアである。1920年代のソラールでは、のちに名手と呼ばれる打楽器奏者たちが腕を磨いていた。モンゴ・サンタマリーア（1917年生まれ）は1930年代の後半に活動を始め、1940年代に頭角を現した。ルンバ最初期の伝説として語り継がれるのは、打楽器奏者ではなくコルンビアの名踊り手マランガことホセ・ロサリオ・オビエド（1885年〜1927年）であり、その死を悼むグアグアンコー「マランガ・ムリオ」はのちに広く歌われた。1947年、ニューヨークの録音スタジオでカルロス・ビダル・ボラードとチャノ・ポソがルンバの最初の商業録音とされるものを残し、同年にチャノ・ポソはディジー・ガレスピーの楽団に加わり、アフロ・キューバンのリズムと楽器をジャズ界に持ち込んだ。1940年代、ソン・クバーノの側では、1927年にセクステートとして結成されたセプテート・ナシオナルが打楽器・歌・弦楽器にトランペットを加え、アルセニオ・ロドリゲスのコンジュントが拡大編成の形を確立した。ルンバは現在も純粋にフォークロア的なジャンルとされ、20世紀半ば以降の革新は打楽器の内部で進んだ。1952年10月9日、マタンサスのラ・マリーナ地区の居酒屋エル・ガジョで、労働者グループがその場のカウンターや瓶を叩いて演奏したことがきっかけとなり「コンジュント・グアグアンコー・マタンセーロ」が結成された。1953年に発表した曲「ロス・ムニェキートス」が大ヒットし、グループはロス・ムニェキートス・デ・マタンサスと改名、1956年にはプチート・レコードから初LPを出した。一方ハバナでは、1963年に結成されたロス・パピネスが、ロス・ムニェキートスと並んで、国内外でルンバを広めた最初期のバンドの一つとなった。1959年のキューバ革命後、ルンバは「民衆の文化」として国営レーベルEGREMの下で記録・奨励され、1970年代初頭にロス・ムニェキートスの「オイェロス・デ・ヌエボ」「ラ・チスモサ・デル・ソラール」などの金字塔が生まれた。1980年代、マタンサスのヘスス・アルフォンソが書いたグアグアンコー「コンゴ・ヤンブンバ」（1984）はエディ・パルミエリの録音（1987）やヴォーカル・サンプリングの演奏（1992）に取り上げられた。1970年代にハバナのロス・チニートスが考案したとされる「グアラパチャンゲオ」（カホンとトゥンバドーラを併用する新様式）は1980年代後半に広まり、ルンバは今も進化を続けている。1992年からアメリカのレーベルQbadiscがCDリリースと全米ツアーを展開し、2001年にはロス・ムニェキートスがグラミー賞候補にノミネートされた。2016年、「Rumba in Cuba」としてユネスコ無形文化遺産の代表一覧表に登録された。なお、1930年にDon Azpiazúの「エル・マニセーロ」が米国で大ヒットした際、それは本来ソンだったが、ラベルには「ルンバ・フォックストロット」と書かれ、英語圏の耳には覚えやすい「ルンバ（Rhumba）」という語がキューバ音楽の総称になったとされ、欧米では社交ダンスのルンバが独自に発展した。</p>
