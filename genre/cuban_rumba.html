<h1>Cuban Rumba（ルンバ）とは</h1>
<p>ルンバは、キューバ島北部の都市部で鍛えられた、歌と太鼓と踊りが一体になった世俗の音楽である。 骨格を担うのは、クラーベだ。2本の硬い木の棒を打ち合わせ、5打の目安となるパターンを刻む。これがいわゆるルンバ・クラーベで、この2小節単</p>
<p>ルンバは、キューバ島北部の都市部で鍛えられた、歌と太鼓と踊りが一体になった世俗の音楽である。

骨格を担うのは、クラーベだ。2本の硬い木の棒を打ち合わせ、5打の目安となるパターンを刻む。これがいわゆるルンバ・クラーベで、この2小節単位のパターンが、全体の緊張と解放を支配する。

その上で、3本のトゥンバドーラ（コンガの一種）が交錯する。低音のトゥンバ（サリドール）、中音のトレス・ドス、高音のキントである。キントは即興で応酬し、オープン・トーン（開いた音）とスラップ（平手で打つ鋭い音）を交互に叩く旋律型（ロス・ムニェキートスが1980年代に広げたとされるスタイル）を使う。こうして、太鼓同士が会話しているような掛け合いが生まれる。原型の編成では、コンガの代わりに、引き出しや木箱を叩くカホンが使われた。乾いた木の打音が特徴だ。

拍子は2/4や4/4（2分割の拍節）が基調で、テンポは型によって変わる。最古の型ヤンブーは最も遅い。最も人気のあるグアグアンコーは、ヤンブーより速いテンポだ。男性の独舞をともなうコルンビアは、6/8や12/8の三連符系で、速く力強い。

ヤンブーとグアグアンコーでは、歌はまず独唱者が意味のない音節の旋律で歌い出す導入部、ディアーナに始まる。続いてコーラスが、クラーベに重なる掛け声で応え、コール・アンド・レスポンスで進んでいく。歌詞は、路地裏の噂話や男女の駆け引き、日々の暮らしの細かな機微を、ユーモアと皮肉を込めて歌う。

演奏は基本的に生の打楽器と声で行われる。チェケレのシャカシャカという乾いた振動音と、空間の残響そのものが、音の手触りを形作る。

ヤンブーとグアグアンコーでは、曲は、ディアーナ→カント→モントゥーノ（掛け合い）と進む。

隣のソン・クバーノは、ギターやトランペットの旋律が主役の合奏だ。これに対してルンバは、トゥンバドーラ、キント、クラベス、グアグア、パリート（木の棒）、チェケレ、カホンなどの打楽器と声で成り立つ。打楽器が中心である点が、最大の違いだ。路上の祭りやパーティーで、観客が輪になって手拍子を打つ。そんな生きた音楽として、ルンバは今も鳴り続けている。</p>
<h2>成り立ち</h2><p>19世紀後半、キューバ島北部のハバナと港湾都市マタンサスの貧しい地区から、ルンバは始まった。

ルンバは、ハバナとマタンサスの港湾地区の貧しい地区（「ソラール」と呼ばれる中庭付き長屋）で、アフリカ系労働者によって形作られた。奴隷制廃止（1886年）の前後には、自由黒人が増えた。最初期の形は、タラの輸送箱や引き出しなどから作った箱太鼓、カホンを打ち鳴らすものだった。後に、コンガ（トゥンバドーラ）が使われるようになった。

ルンバの伝統的な主要な3つのスタイルは、次のとおりである。植民地時代にさかのぼる、最古で最も遅いヤンブー。男女の駆け引きを踊るグアグアンコー。農村に由来するとされ、男性の独舞をともなうコルンビアである。

1920年代のソラールでは、のちに名手と呼ばれる打楽器奏者たちが腕を磨いていた。モンゴ・サンタマリーア（1917年生まれ）は、1930年代の後半に活動を始め、1940年代に頭角を現した。それでも、ルンバ最初期の伝説として語り継がれるのは、打楽器奏者ではない。コルンビアの名踊り手マランガ、本名ホセ・ロサリオ・オビエド（1885年〜1927年）である。その死を悼むグアグアンコー「マランガ・ムリオ」は、のちに広く歌われた。

1947年、ニューヨークの録音スタジオで、カルロス・ビダル・ボラードとチャノ・ポソが、ルンバの最初の商業録音とされるものを残した。同じ年、チャノ・ポソはディジー・ガレスピーの楽団に加わり、アフロ・キューバンのリズムと楽器をジャズ界に持ち込んだ。

一方、ソン・クバーノの側では、セプテート・ナシオナルが1927年にセクステートとして結成された。まもなく打楽器・歌・弦楽器にトランペットを加えて、セプテートとなった。1940年代には、アルセニオ・ロドリゲスのコンジュントが拡大編成を定着させた。ルンバは今も純粋にフォークロア的なジャンルとされるが、20世紀半ば以降には革新も見られる。

1952年10月9日、マタンサスのラ・マリーナ地区の居酒屋エル・ガジョ。労働者グループがその場のカウンターや瓶を叩いて演奏したことをきっかけに、「コンジュント・グアグアンコー・マタンセーロ」が結成された。1950年代前半（1953年とする説がある）に発表した曲「ロス・ムニェキートス」が大ヒットする。グループはロス・ムニェキートス・デ・マタンサスと改名し、1956年にはプチート・レコードから初LPを出した。一方ハバナでは、1960年代前半に結成された（1962年・1963年の両説がある）ロス・パピネスが、ロス・ムニェキートスと並んで、国内外でルンバを広めた代表的なバンドの一つとなった。

1959年のキューバ革命の後、ルンバは「民衆の文化」として、国営レーベルEGREMの下で記録され、後押しされた。1970年代初頭には、ロス・ムニェキートスの「オイェロス・デ・ヌエボ」「ラ・チスモサ・デル・ソラール」などの金字塔が生まれた。1980年代には、マタンサスのヘスス・アルフォンソがグアグアンコー「コンゴ・ヤンブンバ」（1984）を書いた。この曲は、エディ・パルミエリの録音（1987）や、ヴォーカル・サンプリングの演奏（1992）に取り上げられた。ハバナのロス・チニートスが考案したとされる「グアラパチャンゲオ」（カホンとトゥンバドーラを併用する新しいスタイル）は、1980年代後半に広まった。考案は1970年代とされるが、年代には諸説がある。ルンバは今も進化を続けている。

1992年からは、アメリカのレーベルQbadiscがCDの発売と全米ツアーを手がけた。2001年には、ロス・ムニェキートスが、ラテン・グラミー受賞作『La Rumba Soy Yo』に関わったとされる。そして2016年、「Rumba in Cuba」としてユネスコ無形文化遺産の代表一覧表に登録された。

なお、1930年にDon Azpiazúの「エル・マニセーロ」が米国で大ヒットした。この曲は本来ソンだったが、ラベルには「ルンバ・フォックストロット」と書かれていた。そのため、英語圏の耳に覚えやすい「ルンバ（Rhumba）」という語が、キューバ音楽の総称になったとされる。欧米では、社交ダンスのルンバが独自に発展した。</p>
