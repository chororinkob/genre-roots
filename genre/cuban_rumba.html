<h1>Cuban Rumba（ルンバ）とは</h1>
<p>ルンバはキューバ島北部の都市部で鍛えられた、歌・太鼓・踊りが一体になった世俗の音楽である。骨格を担うのは2本の硬い木の棒を打ち合わせるクラーベが刻む5打のガイド・パターン、いわゆるルンバ・クラーベで、この2小節単位のパターンが全体</p>
<p>ルンバはキューバ島北部の都市部で鍛えられた、歌・太鼓・踊りが一体になった世俗の音楽である。骨格を担うのは2本の硬い木の棒を打ち合わせるクラーベが刻む5打のガイド・パターン、いわゆるルンバ・クラーベで、この2小節単位のパターンが全体の緊張と解放を支配する。その上に、低音のトゥンバ（サリドール）、中音のトレス・ドス、高音のキントという3本のタンボラが交錯し、キントは常に即興で応酬して、オープン・トーンとスラップを交互に叩く旋律型を編み出し、太鼓同士が会話しているような掛け合いを生む。原型の編成ではコンガの代わりに引き出しや木箱を叩くカホンが用いられ、乾いた木の打音が特徴的だ。拍子は2/4や4/4の二拍子が基調で、テンポは型によって変わる。最古の型ヤンブーは最も遅く、最も人気のあるグアグアンコーは先頭打点にアクセントが来るミディアム・テンポ、男性の独舞をともなうコルンビアは6/8や12/8の三連符系で最速となり、毎分140拍を超えることもある。歌はまず独唱者が自由なリズムで歌い出すディアーナに始まり、コーラスがクラーベに重なる掛け声で応えるコール・アンド・レスポンスで進行する。声は太鼓の音色に溶け込むよう地声で張り上げ、歌詞は路地裏の噂話や男女の駆け引き、日々の暮らしの機微をユーモアと皮肉を込めて歌う。電子的なエフェクトは一切なく、チェケレのシャカシャカという乾いた振動音と、空間の残響そのものが音響の質感を形作る。曲は歌の導入、太鼓の会話、ダンサーの独壇場へと段階的に熱を上げ、最高潮で一瞬の休止が入り、再び疾走する構成が常套だ。隣接するソン・クバーノがギターやトランペットの旋律を主体とする合奏であるのに対し、ルンバは太鼓と声だけで成立する打楽器中心の音楽である点が最大の違いであり、路上の祭りやパーティーで観客が輪になり手拍子を打つ生きた音楽として今も鳴り続けている。</p>
<h2>成り立ち</h2><p>ルンバの物語は19世紀後半、キューバ島北部のハバナと港湾都市マタンサスのスラム街から始まる。1886年の奴隷制廃止後、解放されたアフリカ系の人々は「ソラール」と呼ばれる中庭付き長屋の密集地帯に流入し、日曜の午後、路上の祝祭の中で歌と踊りが生まれた。客船や倉庫から転用した魚箱・木箱＝カホンを打ち鳴らすのが最初期の形で、後にコンガ（タンボラ）の発明によって編成が固定化した。この頃に成立した3つの型——最古で最も遅いヤンブー、男女の駆け引きを踊るグアグアンコー、男性の独舞をともなうコルンビア——は今日まで揺るがない。1920年代のソラールでは、のちに名手と呼ばれる打楽器奏者たちが腕を磨いていた。モンゴ・サンタマリーア（1917年生まれ）は1930年代の後半に活動を始め、1940年代に頭角を現した。ルンバ最初期の伝説として語り継がれるのは、打楽器奏者ではなくコルンビアの名踊り手マランガことホセ・ロサリオ・オビエド（1885年〜1927年）であり、その死を悼むグアグアンコー「マランガ・ムリオ」はのちに広く歌われた。1947年、ニューヨークの録音スタジオでカルロス・ビダル・ボラードとチャノ・ポソがルンバの最初の商業録音を残し、同年にチャノ・ポソはディジー・ガレスピーの楽団に加わってアフロ・キューバン・ジャズの扉を開けた。1940年代、ルンバはソン・クバーノと相互に影響し合い、イグナシオ・ピニェイロのセプテート・ナシオナルやアルセニオ・ロドリゲスのコンジュントがトレス、コントラバス、トランペット、ピアノを取り込み、ルンバ側は木打楽器を縮小して旋律楽器編成と和声を取り入れた。1952年10月9日、マタンサスのラ・マリーナ地区の居酒屋エル・ガジョで、労働者グループがその場のカウンターや瓶を叩いて演奏したことがきっかけとなり「コンジュント・グアグアンコー・マタンセーロ」が結成された。1953年に発表した曲「ロス・ムニェキートス」が大ヒットし、グループはロス・ムニェキートス・デ・マタンサスと改名、1956年にはプチート・レコードから初LPを出した。一方ハバナではロス・パピネスが「ルンバの王」と呼ばれ、国内外でルンバを普及させた。1959年のキューバ革命後、ルンバは「民衆の文化」として国営レーベルEGREMの下で記録・奨励され、1970年代初頭に「オジェロス・デ・ヌエボ」「ラ・チスモサ・デル・ソラール」などの金字塔が生まれた。1980年代、マタンサスのヘスス・アルフォンソが書いたグアグアンコー「コンゴ・ヤンブンバ」（1984）はエディ・パルミエリの録音（1987）やヴォーカル・サンプリングの演奏（1992）に取り上げられ、ルンバの世界流通を決定的にした。1980年代後半以降、ハバナの前衛グループはカホンを複数使って従来のコンガ編成を解体する「グアラパチャンゲオ」という新様式を生み出し、ルンバは今も進化を続けている。1992年からアメリカのレーベルQbadiscがCDリリースと全米ツアーを展開し、2001年にはロス・ムニェキートスがグラミー賞候補にノミネートされた。2016年、ユネスコ無形文化遺産への登録が実現し、世界中で「ルンバ・クバーナ」の名が定着した。なお、1930年代に米国で「エル・マニセーロ」などが大ヒットした際、それは本来ソンであり、レコード会社が「ソング」と混同されないよう「ルンバ（Rhumba）」と表記したことから、欧米では社交ダンスのルンバが独自に発展し、現在も両者の混同が続いている。</p>
