<h1>Liquid DnB（リキッドドラムアンドベース）とは</h1>
<p>ドラムンベースの中で、旋律と和声の美しさを前面に出した系統。テンポは172〜176BPMで、ドラムンベース標準の速度を保つ。骨格は同じく高速のブレイクビーツと半分の速度で進む低音だが、音色と情緒の設計が根本的に異なる。ドラムは切り</p>
<p>ドラムンベースの中で、旋律と和声の美しさを前面に出した系統。テンポは172〜176BPMで、ドラムンベース標準の速度を保つ。骨格は同じく高速のブレイクビーツと半分の速度で進む低音だが、音色と情緒の設計が根本的に異なる。ドラムは切り刻まれた質感より、なめらかで流れるような繋がりが重視され、シンバルとハイハットの細かい刻みが水面のような連続感を作る。名称のliquidはこの流動的な質感に由来する。ベースは歪みのない丸い正弦波に近い音で、低域を柔らかく支え、旋律的に動く。上物が最大の特徴で、Fender Rhodesのエレクトリックピアノ、弦楽器の持続音、ジャズの和音、そしてソウルの歌唱が重ねられる。和声はメジャーセブンス、マイナーナインス、11thといった付加音を含む豊かな響きが用いられ、これがこの系統の温かさを生む。ヴォーカルはソウルやR&amp;Bの伸びやかな歌唱で、しばしば楽曲の中心に据えられる。歌詞は愛、希望、自省といった穏やかな主題。曲の構成は起伏が緩やかで、ブレイクダウンでの落差より、要素の緩やかな出入りによって進む。ニューロファンクの機械的な暴力性や、ジャングルの荒々しさとは対極に位置し、同じテンポでありながら情緒がまったく異なる点が、このジャンルの面白さになっている。</p>
<h2>成り立ち</h2><p>1990年代後半のイギリスで、ドラムンベースが暗く攻撃的な方向(テックステップ)へ進む中、その反動として生まれた。直接の先行者はLTJ Bukem(本名Danny Williamson)で、彼は1993年前後から、ジャングルの荒々しさとは対照的な、アンビエントとジャズを取り込んだ滑らかな音を発表していた。1992年の「Demon's Theme」と1995年の「Horizons」がその代表作で、彼が1991年に設立したレーベルGood Lookingと、1996年から始まった編集盤シリーズ「Logical Progression」が、この方向を体系化した。ロンドンのクラブSpeedが1994年にBukemとFabio によって始められ、ドラムンベースを座って聴くことも可能な音楽として提示する場になった。この時期の呼称はインテリジェント・ドラムンベースやアトモスフェリック・ドラムンベースで、liquid funkという語が定着するのは2000年代前半である。この語を広めたのはFabioで、彼が2000年に発表した編集盤「Liquid Funk」がその起点とされる。Fabioはハウスやディスコの要素をドラムンベースに取り込むことを意識的に推進した。2000年代に入るとこの系統は大きく成長する。中心となった作家はHigh Contrast(ウェールズのLincoln Barrett)、Calibre(北アイルランドのDominick Martin)、Netsky(ベルギー)、London Elektricity、Logistics、Nu:Tone。レーベルではHospital Records(1996年設立)が決定的な役割を果たし、この分野の商業的な中心となった。同レーベルはHospitalityというイベントを世界各地で開催し、聴衆を大きく広げた。批判もある。ドラムンベースの本来の攻撃性と地下性を失い、聴きやすさに寄りすぎているという指摘が、より硬派な系統の側から繰り返し向けられてきた。とりわけ2010年代には、ラジオ向けの歌ものが増えたことで、商業化への非難が強まった。一方でこの系統は、ドラムンベースを世界的に広める役割を果たした。ヨーロッパ大陸、とりわけドイツ、オランダ、チェコ、そしてニュージーランドやブラジルで大きな支持を得ている。2010年代以降はさらに細分化が進み、より歌もの寄りのものと、ジャズやソウルの生演奏を取り入れたものに分かれた。近年はドラムンベース全体の世界的な復興の中で、この系統が入り口として機能している。</p>
