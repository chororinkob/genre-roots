<h1>Liquid DnB（リキッドドラムアンドベース）とは</h1>
<p>リキッド・ドラムンベースは、ドラムンベースの中で、メロディーと和音の美しさを前面に出した系統だ。 名前のliquidについて、命名者のFabioは、Calibreの音の「流れ(flow)」が液体のように思えたと説明している。ヒップ</p>
<p>リキッド・ドラムンベースは、ドラムンベースの中で、メロディーと和音の美しさを前面に出した系統だ。

名前のliquidについて、命名者のFabioは、Calibreの音の「流れ(flow)」が液体のように思えたと説明している。ヒップホップグループTha Alkaholiksの「Likwit」から取ったと報じる記事もある。

いちばんの特徴は、上に重ねる音だ。Fender Rhodesのエレクトリックピアノ、弦楽器の持続音、ジャズの和音、そしてソウルの歌唱が重ねられる。和音には、メジャーセブンス、マイナーナインス、11thといった音を足した豊かな響きが使われる。これが、この系統の温かさを生む。

ベースは歪みの少ない丸い正弦波に近い音で、低い音域を柔らかく支え、メロディーのように動く。

テンポは170〜174BPM前後で、ドラムンベースの標準の速さを保つ。土台も同じく、高速のブレイクビーツと、半分の速さで進む低音だ。ただし、音色と感情の作り方が根本から違う。ドラムは、切り刻んだ感じより、なめらかに流れるつながりが大切にされる。シンバルとハイハットの細かい刻みが、水面のような途切れない感じを作る。

ヴォーカルは、ソウルやR&amp;Bの伸びやかな歌い方で、曲の中心に置かれることも多い。歌詞は、愛、希望、自分を見つめ直すことといった穏やかなテーマが多い。

曲の組み立ては起伏がゆるやかだ。ブレイクダウンで大きく落とすより、音の要素がゆるやかに出たり入ったりして進む。ニューロファンクの機械的な激しさや、ジャングルの荒々しさとは正反対にある。同じテンポなのに気分がまったく違う点が、このジャンルの面白さになっている。</p>
<h2>成り立ち</h2><p>リキッド・ドラムンベースは、1990年代後半のイギリスで、当時の硬質なドラムンベースへの自然な反動として生まれた。

先駆者はLTJ Bukem(本名Danny Williamson)らだ。彼は1991〜93年ごろから、ジャングルの荒々しさとは対照的な、アンビエントとジャズを取り込んだ滑らかな音を発表していた。1992年の「Demon's Theme」は、荒いブレイクと滑らかな要素が同居する曲で、アトモスフェリック系の原点とされる(作曲は1990〜91年に遡るという記述もある)。1995年の「Horizons」とともに、彼の代表作である。彼が1991年に作ったレーベルGood Lookingと、1996年に始まった編集盤シリーズ「Logical Progression」が、この方向をきちんと形にした。

1994年には、ロンドンのMars BarでBukemとFabioがクラブナイトSpeedを始めた。ここは、ジャズの影響を受けた穏やかな面を扱う、洗練された雰囲気の場になった。

この時期の呼び名は、インテリジェント・ドラムンベースやアトモスフェリック・ドラムンベースだった。liquid funkという言葉が定着するのは、2000年代前半である。この言葉は、Fabioが1990年代末にラジオ番組で使い、2000年の編集盤「Liquid Funk」(Creative Source)で広く知られるようになった。使い始めた年は1998〜2000年と幅がある。「Liquid Funk」は、ジャズやソウルの影響を受けた、なめらかで歌ものを含むドラムンベースの編集盤だった。

2000年代に入ると、この系統は大きく伸びる。中心となった作り手は、High Contrast(ウェールズのLincoln Barrett)、Calibre(北アイルランドのDominick Martin)、London Elektricity、Logistics、Nu:Toneだ。Netsky(ベルギー)は、2000年代後半〜2010年代の担い手である。

レーベルでは、Hospital Records(1996年設立)が大きな役割を果たし、リキッドを代表する主要レーベルの一つとなった。2000年代半ばには、最も知られたレーベルの一つになった。同レーベルはHospitalityというイベントを世界各地で開き、聴き手を大きく広げた。

しかし、批判もある。Fabio自身も、この系統が「liquid-by-numbers」(型どおり)になり、刺激を失ったと述べている。

それでもこの系統は、2000年代半ばに最も売れた系統の一つになった。ヨーロッパではオランダ(Liquicity)・ベルギー(Netsky)などで、また南米のブラジル(MarkyやPatife)でも支持を得ている。

2010年代以降は、さらに細かく分かれていき、より歌もの寄りのものと、ジャズやソウルの生演奏を取り入れたものに分かれたとされる。近年は、ドラムンベース全体の世界的な復活の中で、この系統が入り口の役目を果たしているとされる。</p>
