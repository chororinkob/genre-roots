<h1>Amapiano（アマピアノ）とは</h1>
<p>南アフリカの都市郊外に広がる黒人居住区「タウンシップ」発の、ゆったりしたテンポのエレクトロニック・ダンスミュージック。ジャンル名は現地の言葉で「ピアノたち」を意味し、その名の通りジャジーで物憂げなピアノの旋律が音の中心に据えられる</p>
<p>南アフリカの都市郊外に広がる黒人居住区「タウンシップ」発の、ゆったりしたテンポのエレクトロニック・ダンスミュージック。ジャンル名は現地の言葉で「ピアノたち」を意味し、その名の通りジャジーで物憂げなピアノの旋律が音の中心に据えられる。伝統的な丸太太鼓（スリットドラム）の響きを模した低音のシンセ音「ログドラム」のメロディックなベースライン、深く沈み込む低音、シャッフル（跳ねるリズム）するようなパーカッションが折り重なり、テンポはBPM 110〜115前後で、Afrobeatsなどと同程度か、わずかに速い。曲の構成も特徴的で、曲が長く、忍耐強く展開するものが多く、DJがクラブでシームレスに何時間もミックスし続けられるよう作られていることが多い。激しく踊るための音楽というより、じわじわと体を揺らしながら長く浸っていられる音楽であり、アフリカの太陽の下の開放感と、都市的で洗練されたクールさが同居する2020年代を象徴する世界的トレンドとなった。歌詞はズールー語、コーサ語、ソト語、英語が入り混じることが多く、南アフリカの多言語的な都市生活の感覚をそのまま反映している。ジャンル内でも、よりジャズ的なピアノを前面に出す「プライベートスクール・アマピアノ」と呼ばれる洗練された派生系や、S'gija、Quantum Soundなど、細分化が進んでいる。</p>
<h2>成り立ち</h2><p>2010年代半ば、南アフリカのヨハネスブルクのタウンシップ説やプレトリア説があり、起源は定まっていない中で、国際的なディープハウスの美学と、南アフリカ独自のダンスミュージックであるカワイト(kwaito)のグルーヴ（ノリ）感、そしてジャズピアノの和声（コードの響き）感覚が融合する形で誕生したとされる。当初はローカルなタウンシップのパーティーやミニバスタクシー(南アフリカの乗合バス)のスピーカーから流れる、地元だけの音楽に過ぎなかった。プロデューサーのKabza De Smallは、2020年前後に発表した膨大な楽曲群を通じて「アマピアノの王」と称されるほどの地位を確立し、DJ Maphorisaとのコンビでも数多くのヒットを生み出した。ラッパーのFocalisticは、アマピアノにラップの要素を持ち込んだ「Pitori Maradona」や「President ya Straata」の別名で知られる。ナイジェリアのWizkidの「Essence」(2020)には、公式リミックスとしてJustin Bieber参加版（2021年）があり、アマピアノ・リミックスは非公式のものが多数ある。TikTokを通じてこのジャンルは世界中に急速に拡散していった。Beyoncéのアルバム『Renaissance』(2022)は、1970年代以降の黒人ダンス音楽（ディスコ、ハウス、ファンク）を扱った作品と説明される。「ログドラム」という特徴的な音色を最初に広めた人物としては、プロデューサーのMDU aka TRPの名が挙げられる（Kabza De Small自身は、ログドラムの音を考え出したのはMDU aka TRPだと述べている）。ダンサー兼シンガーのKamo Mphela（「アマピアノの女王」と呼ばれる）は、独自のダンスムーブとともにアマピアノを視覚的な文化としても広める役割を果たした。南アフリカ出身で米国のEpic Recordsと契約し、2024年時点でニューヨークに在住するシンガーTylaが2023年に発表した「Water」は、アマピアノのグルーヴ感をポップスの文脈に落とし込みグラミー賞を受賞するなど、この音楽性のさらなる国際化を象徴する出来事となった。</p>
<h2>代表曲</h2><ul><li>Tshwala Bam (Tito M &amp; Yuppe)</li><li>Mnike (Tyler ICU &amp; Tumelo.za)</li><li>Banyana (DJ Maphorisa &amp; Tyler ICU)</li><li>Ke Star (Focalistic ft. Davido)</li><li>Asibe Happy (Kabza De Small)</li><li>John Wick (De Mthuda ft. Sir Trill, Da Muziqal Chef)</li><li>Tanzania (Uncle Waffles)</li><li>Selema (Po Po) (Musa Keys &amp; Loui)</li><li>Amantombazane (Kabza De Small ft. Samthing Soweto &amp; MFR Souls)</li><li>Nana Thula (Kabza De Small &amp; DJ Maphorisa)</li><li>Sponono (Kabza De Small, DJ Maphorisa ft. Wizkid, Burna Boy)</li><li>Idlozi (Amu Classic &amp; Kappie)</li><li>Selimathunzi (Nkosazana Daughter)</li><li>Ghost (Sir Trill)</li><li>Umsebenzi Wethu (Busta 929)</li><li>Phoyisa (Kabza De Small &amp; DJ Maphorisa)</li></ul>
