<h1>Amapiano（アマピアノ）とは</h1>
<p>南アフリカの都市郊外に広がる黒人居住区「タウンシップ」発の、ゆったりしたテンポのエレクトロニック・ダンスミュージック。ジャンル名は現地の言葉で「ピアノたち」を意味し、その名の通りジャジーで物憂げなピアノの旋律が音の中心に据えられる</p>
<p>南アフリカの都市郊外に広がる黒人居住区「タウンシップ」発の、ゆったりしたテンポのエレクトロニック・ダンスミュージック。ジャンル名は現地の言葉で「ピアノたち」を意味し、その名の通りジャジーで物憂げなピアノの旋律が音の中心に据えられる。丸太を叩くマリンバのような木琴的な音色を電子的に再現した「ログドラム」のメロディックなベースライン、深く沈み込む低音、シャッフルするようなパーカッションが折り重なり、テンポはBPM 110〜120程度と他のアフリカ発ダンスミュージックに比べてかなりゆったりしている。曲の構成も特徴的で、ボーカルが入るパートと、パーカッションとログドラムだけが延々と続く長いブレイクダウンとが交互に現れ、DJがクラブでシームレスに何時間もミックスし続けられるよう作られていることが多い。激しく踊るための音楽というより、じわじわと体を揺らしながら長く浸っていられる音楽であり、アフリカの太陽の下の開放感と、都市的で洗練されたクールさが同居する2020年代を象徴する世界的トレンドとなった。歌詞はズールー語、コーサ語、ソト語、英語が入り混じることが多く、南アフリカの多言語的な都市生活の感覚をそのまま反映している。制作には安価なキーボード(ヤマハのPSRシリーズなど)がよく使われ、必ずしも高価な機材がなくても作れるという点も、タウンシップの若者たちの間で急速に広まった一因とされる。ジャンル内でも、よりジャズ的なピアノを前面に出す「プライベートスクール・アマピアノ」と呼ばれる洗練された派生系や、よりミニマルでダークな「アサカ」と呼ばれるスタイルなど、細分化が進んでいる。</p>
<h2>成り立ち</h2><p>2012年頃、南アフリカの首都プレトリアと最大都市ヨハネスブルクの周辺で、国際的なディープハウスの美学と、南アフリカ独自のダンスミュージックであるカワイト(kwaito)のグルーヴ感、そしてジャズピアノの和声感覚が融合する形で誕生したとされる。当初はローカルなタウンシップのパーティーやミニバスタクシー(南アフリカの乗合バス)のスピーカーから流れる、地元だけの音楽に過ぎなかった。プロデューサーのKabza De Smallは、2020年前後に発表した膨大な楽曲群を通じて「アマピアノの王」と称されるほどの地位を確立し、DJ Maphorisaとのコンビでも数多くのヒットを生み出した。ラッパーのFocalisticは、アマピアノにラップの要素を持ち込んだ「プレトリア・ボーイ」として知られる。ナイジェリアのWizkidが発表した「Essence」(2020)のアマピアノリミックスが国際的なヒットとなったことをきっかけに、TikTokを通じてこのジャンルは世界中に急速に拡散していった。Beyoncéのアルバム『Renaissance』(2022)にも、このアマピアノの音響的な影響が随所に見られ、南アフリカ発の音楽が世界のポップスの主流に食い込んだ象徴的な事例となっている。「ログドラム」という特徴的な音色を最初に広めた人物としては、プロデューサーのMDU aka TRPやJosiah De Discipleの名がしばしば挙げられる。ダンサー兼DJのKamo Mphelaは、独自のダンスムーブとともにアマピアノを視覚的な文化としても広める役割を果たした。南アフリカ出身でイギリスを拠点に活動するシンガーTylaが2023年に発表した「Water」は、アマピアノのグルーヴ感をポップスの文脈に落とし込みグラミー賞を受賞するなど、この音楽性のさらなる国際化を象徴する出来事となった。</p>
<h2>代表曲</h2><ul><li>Piano Hub (Kabza De Small)</li><li>Ke Star (Focalistic ft. Davido)</li><li>Sponono (Kabza De Small, DJ Maphorisa ft. Wizkid, Burna Boy)</li><li>John Wick (De Mthuda ft. Sir Trill, Da Muziqal Chef)</li></ul>
