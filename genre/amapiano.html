<h1>Amapiano（アマピアノ）とは</h1>
<p>アマピアノは、南アフリカの都市郊外に広がる黒人居住区「タウンシップ」発の、ゆったりしたテンポのエレクトロニック・ダンスミュージックだ。ジャンル名は、現地の言葉で「ピアノたち」を意味する。 その名の通り、ジャジーで物憂げなピアノの旋</p>
<p>アマピアノは、南アフリカの都市郊外に広がる黒人居住区「タウンシップ」発の、ゆったりしたテンポのエレクトロニック・ダンスミュージックだ。ジャンル名は、現地の言葉で「ピアノたち」を意味する。

その名の通り、ジャジーで物憂げなピアノの旋律が、音の中心に据えられる。伝統的な丸太太鼓（スリットドラム）の響きを模した低音のシンセ音「ログドラム」が、メロディックなベースラインを作る。深く沈み込む低音も、この音楽の特徴だ。

テンポは108〜115 BPM程度で、Afrobeatsなどと同程度か、わずかに速い。跳ねるようなパーカッションが折り重なる。

曲の構成も特徴的だ。長尺の曲が多く（特にPrivate School系）、DJがクラブでシームレスに何時間もミックスし続けられるよう作られていることが多い。激しく踊るための音楽というより、じわじわと体を揺らしながら、長く浸っていられる音楽だ。アフリカの太陽の下の開放感と、都市的で洗練されたクールさが同居する。2020年代を代表する世界的なトレンドとなった。

歌詞は、ズールー語、コーサ語、ソト語、英語が入り混じることが多い。南アフリカの多言語的な都市生活の感覚を、そのまま反映している。

ジャンル内でも細分化が進んでいる。よりジャズ的なピアノを前面に出す「プライベートスクール・アマピアノ」と呼ばれる洗練された派生系や、S'gija、Quantum Soundなどがある。</p>
<h2>成り立ち</h2><p>アマピアノが生まれたのは、2010年代半ばの南アフリカだ。ヨハネスブルクのタウンシップ説やプレトリア説があり、起源は定まっていない。国際的なディープハウスの美学と、南アフリカ独自のダンスミュージックであるクワイト(kwaito)のグルーヴ（ノリ）感、そしてジャズピアノの和声（コードの響き）感覚が融合する形で誕生したとされる。

当初は、ローカルなタウンシップのパーティーや、ミニバスタクシー(南アフリカの乗合バス)のスピーカーから流れる、地元だけの音楽に過ぎなかった。

しかし、プロデューサーのKabza De Smallが、2020年前後に発表した膨大な楽曲群を通じて、「アマピアノの王」と称されるほどの地位を固めた。DJ Maphorisaとのコンビでも、数多くのヒットを生み出した。ラッパーのFocalisticは、ヒップホップ（特にPretoria方言のセピトリ語のラップ）とアマピアノを結びつけて広めた代表的存在の一人で、「Pitori Maradona」や「President ya Straata」の別名で知られる。

アマピアノにログドラムの音を持ち込み定着させた人物として、Kabza De SmallらがMDU aka TRPの名を挙げる（Kabza De Small自身は、ログドラムの音を考え出したのはMDU aka TRPだと述べている）。ダンサー兼シンガーのKamo Mphela（「アマピアノの女王」と呼ばれる）は、独自のダンスムーブとともに、アマピアノを視覚的な文化としても広める役割を果たした。

その後、世界へ広がった。ナイジェリアのWizkidの「Essence」(Wizkid feat. Tems名義、2020)には、公式リミックスとしてJustin Bieber参加版（2021年）がある。アマピアノ・リミックスは、非公式のものが多数ある。TikTokを通じて、このジャンルは世界中に急速に拡散していった。Beyoncéのアルバム『Renaissance』(2022)は、1970年代以降の黒人ダンス音楽（ディスコ、ハウス、ファンク）を扱った作品と説明される。

南アフリカ出身で米国のEpic Recordsと契約し、2024年時点でニューヨークに在住するシンガーTylaは、2023年に「Water」を発表した。この曲は、アマピアノのグルーヴ感をポップスの文脈に落とし込み、第66回グラミー賞の最優秀アフリカン・ミュージック・パフォーマンス賞（新設部門）を受賞した。この音楽性がさらに国際化したことを示す出来事となった。</p>
