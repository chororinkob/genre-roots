<h1>Philadelphia Soul（フィリーソウル）とは</h1>
<p>1960年代後半に芽生え、1971年のレーベル設立以降に最盛期を迎えた、フィラデルフィアの極めて豪奢で洗練されたソウルである。最大の特徴は編曲の厚みにある。大人数の弦楽合奏が、主旋律に寄り添う別の旋律（対旋律）や厚みを担い、そこへ</p>
<p>1960年代後半に芽生え、1971年のレーベル設立以降に最盛期を迎えた、フィラデルフィアの極めて豪奢で洗練されたソウルである。最大の特徴は編曲の厚みにある。大人数の弦楽合奏が、主旋律に寄り添う別の旋律（対旋律）や厚みを担い、そこへホルンやヴィブラフォン、鉄琴のほか、チェレスタやハープシコードといった珍しい楽器が加えられる。この、映画音楽のような広がりを持つ響きが、この様式を一瞬で識別させる。しかしその華やかな上の音の下には、極めて引き締まったリズム隊がある。ドラムは8分音符のハイハットをオープンも交えて刻み、2拍目と4拍目にスネアを落とし、バスドラムは4拍すべてを踏む。この組み合わせは、後のディスコの躍動を直接準備したものであり、実際にこの地の専属ドラマーEarl Youngが、ディスコ的な四つ打ちのドラミングを普及させたと評価されている。低音は指弾きで滑らかに動き回り、ギターは高音域で歯切れよく刻む。和声はジャズに近い豊かな響きを持ち、次々に色を変える進行が用いられる。歌唱は複数の声を重ねた甘い合唱と、朗々と歌い上げる独唱が組み合わされる。歌詞は恋愛が中心だが、世界平和や団結といった社会的な主題を扱う楽曲もある。</p>
<h2>成り立ち</h2><p>1960年代のフィラデルフィアには、地元のレーベルと録音所、そして高い技量の演奏者が既に蓄積されていた。この土壌の上に、1971年、作曲家であり制作者であるKenny GambleとLeon Huffが、自らのレーベルを設立する。彼らの構想は明確で、デトロイトのMotownが確立した工場的な制作体制を引き継ぎつつ、より大人向けで洗練された音を作るというものだった。大きかったのは編曲家の存在である。Thom Bellは、管弦楽の書法とポップスの構造を高度に統合した、この様式の主要な創り手の一人であり、Bobby Martinも同じレーベルの音の設計者と評される。演奏を担ったのはMFSBという専属の楽団で、30人を超える規模を誇り、彼ら自身の名義でも作品を発表している。1974年、彼らが黒人向けの音楽番組の主題歌として録音した楽曲は全米一位となり、この街の音そのものが商品名として認知された。録音はSigma Sound Studiosで行われ、技師Joe Tarsiaの音作りがこの様式の質感を決定づけている。作品の内容は多岐にわたった。The O'Jaysは、1972年に裏切る友人を主題とする楽曲が全米3位となり、世界平和を訴える楽曲(1972年末発売)が1973年に全米1位となるなど、成功を収めている。Harold Melvin &amp; the Blue Notesでは、Teddy Pendergrassの圧倒的な歌唱が注目され、彼は後に単独名義で大きな成功を収めるが、1982年の自動車事故で脊髄を損傷し、胸から下が麻痺した。Billy Paulが1972年に歌った不倫を主題とする楽曲は、当時としては大胆な内容ながら全米一位を獲得している。この様式の歴史的な意義は、直後に世界を席巻するディスコの母体となった点にある。細かく刻むリズムと分厚い弦楽合奏という組み合わせは、そのままディスコの標準となった。皮肉なことに、その成功によってこの様式自体は独自性を失い、1970年代後半には吸収される形で終息した。</p>
<h2>代表曲</h2><ul><li>Me and Mrs. Jones (Billy Paul)</li><li>If You Don't Know Me by Now (Harold Melvin &amp; the Blue Notes)</li><li>La-La (Means I Love You) (The Delfonics)</li><li>Love Train (The O'Jays)</li><li>When Will I See You Again (The Three Degrees)</li><li>Wake Up Everybody (Harold Melvin &amp; the Blue Notes)</li><li>Didn't I (Blow Your Mind This Time) (The Delfonics)</li><li>Betcha by Golly, Wow (The Stylistics)</li><li>The Love I Lost (Harold Melvin &amp; the Blue Notes)</li><li>Love Is the Message (MFSB)</li><li>Back Stabbers (The O'Jays)</li></ul>
