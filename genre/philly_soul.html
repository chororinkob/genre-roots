<h1>Philadelphia Soul（フィリーソウル）とは</h1>

<p>フィラデルフィア・ソウルは、1960年代後半に芽生え、1971年のレーベル設立以降に最盛期を迎えた、フィラデルフィアのとても豪華で洗練されたソウルだ。

最大の特徴は、編曲の厚みにある。大人数の弦楽合奏が、主旋律に寄り添う別の旋律（対旋律）や、音の厚みを受け持つ。そこへホルンやヴィブラフォン、鉄琴のほか、チェレスタやハープシコードといった珍しい楽器が加わる。映画音楽のような広がりを持つこの響きで、このスタイルだと一瞬で分かる。

和声はジャズに近い豊かな響きを持ち、次々に色を変える進行が使われる。

しかし、華やかな上の音の下には、とても引き締まったリズム隊がいる。1970年代前半以降の特徴として、1973年にHarold Melvin &amp; the Blue Notes『The Love I Lost』のセッションでEarl Youngが固めた奏法がある。ドラムは8分音符のハイハットをオープンも交えて刻み、2拍目と4拍目にスネアを入れ、バスドラムは4拍すべてを踏む。この組み合わせは、後のディスコの土台を築いた。実際に、この地の専属ドラマーEarl Youngが、ディスコ風の四つ打ちのドラミングを広めたと評価されている。低音は滑らかに動き回り、ギターは歯切れよく刻む。

歌は、複数の声を重ねた甘いコーラスと、朗々と歌い上げるソロの組み合わせだ。歌詞は恋愛が中心だが、世界平和や団結といった社会的なテーマを扱う曲もある。</p>
<h2>成り立ち</h2><p>1960年代のフィラデルフィアには、地元のレーベルと録音スタジオ、そして腕の立つ演奏者が、すでにそろっていた。この土台の上で、1971年、作曲家でありプロデューサーでもあるKenny GambleとLeon Huffが、自分たちのレーベルを設立する。彼らの狙いははっきりしていた。デトロイトのMotownを手本に、ストリングスとホーンを使った洗練された音を目指すことだ。

大きかったのは、編曲家の存在である。Thom Bellは、オーケストラの書き方とポップスの組み立てを高いレベルで一つにした、このスタイルの主な作り手の一人だ。Bobby Martinも、同じレーベルの音の設計者と評される。

演奏を受け持ったのは、MFSBという専属の楽団だ。30人を超える大所帯で、自分たちの名義でも作品を出している。彼らは黒人向けの音楽番組の主題歌を1973年に録音し、1974年に発売した。この曲は同年に全米1位となり、この街の音そのものが商品名として知られるようになった。録音は大半がSigma Sound Studiosで行われ、主任技師Joe Tarsiaが多くのセッションを担当した。

作品の中身はさまざまだった。The O'Jaysは、1972年に裏切る友人をテーマにした曲が全米3位となった。さらに、国際的な団結・調和を歌った曲(1972年末発売)が1973年に全米1位となるなど、成功を収めた。Harold Melvin &amp; the Blue Notesでは、Teddy Pendergrassの圧倒的な歌声が注目された。彼は後にソロでも大きな成功を収める。しかし1982年の自動車事故で脊髄を損傷し、四肢麻痺となった。Billy Paulが1972年に歌った不倫をテーマにした曲は、当時としては大胆な内容ながら全米1位を獲得している。

このスタイルの歴史的な意味は、直後に世界を席巻するディスコの成立に大きく寄与した、源流の1つとなった点にある。細かく刻むリズムと分厚い弦楽合奏という組み合わせは、ディスコの土台を築いた。それでも1970年代後半には、ディスコへの反発、R&amp;Bがバラードへ戻る動き、ロックの復調の中で人気が下がっていった。そしてレーベルは、1980年代初頭に衰退した。</p>
<h2>代表曲</h2><ul><li>Me and Mrs. Jones (Billy Paul)</li><li>If You Don't Know Me by Now (Harold Melvin &amp; the Blue Notes)</li><li>La-La (Means I Love You) (The Delfonics)</li><li>Love Train (The O'Jays)</li><li>When Will I See You Again (The Three Degrees)</li><li>Wake Up Everybody (Harold Melvin &amp; the Blue Notes)</li><li>Didn't I (Blow Your Mind This Time) (The Delfonics)</li><li>Betcha by Golly, Wow (The Stylistics)</li><li>The Love I Lost (Harold Melvin &amp; the Blue Notes)</li><li>Love Is the Message (MFSB)</li><li>Back Stabbers (The O'Jays)</li></ul>
