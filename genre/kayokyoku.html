<h1>Kayōkyokuとは</h1>
<p>1920年代から1980年代にかけて日本で作られた、大衆的な歌謡曲の総称である。音楽的な骨格は西洋の和声と楽曲構造に基づくが、旋律には日本固有の音感覚が深く入り込んでいる。とりわけ、七音音階から第四音と第七音を抜いたヨナ抜き音階が</p>
<p>1920年代から1980年代にかけて日本で作られた、大衆的な歌謡曲の総称である。音楽的な骨格は西洋の和声と楽曲構造に基づくが、旋律には日本固有の音感覚が深く入り込んでいる。とりわけ、七音音階から第四音と第七音を抜いたヨナ抜き音階が多用され、これによって西洋の楽曲形式でありながら日本的に響く旋律が生まれた。編曲は時代によって大きく変わり、戦前は小編成の楽団、戦後は大人数の管弦楽、1970年代以降は電気楽器と打ち込みが加わるが、一貫して弦楽合奏による情感の演出が重んじられた。曲の構造は明快で、導入、歌の部分、そして最も強く印象づける繰り返し部分という流れを持ち、最後の繰り返しの前に転調して感情の頂点を作る手法が定型となっている。テンポは中庸で、三連符を感じさせる跳ねた刻みや、行進曲風の二拍子も多い。歌唱は感情を込めて朗々と歌い上げる形が基本で、音を細かく震わせる技法が重視される。歌詞は恋愛、別れ、望郷、酒、そして時代の空気を映す社会的な情景を扱い、七五調に近い日本語の韻律が意識される。作詞家、作曲家、編曲家、歌手が分業する制作体制が確立していた点も特徴である。</p>
<h2>成り立ち</h2><p>起点は1910年代である。1914年に舞台女優の松井須磨子が歌った楽曲が広く流行し、続いて1920年代後半、レコードという媒体が普及したことで、歌が全国規模で共有される時代が始まった。1930年代には欧米のレコード会社の日本法人が設立され、専属の作曲家と歌手を抱える体制が整う。この時期に古賀政男が確立した、短調で哀愁を帯びた旋律の様式は、以後長くこの分野の一つの規範となった。一方、服部良一はジャズやラテン音楽の語法を積極的に導入し、より軽快で都会的な方向を切り開く。戦時中は歌の内容が国家によって統制され、戦意高揚のための楽曲が量産された。戦後の転換は劇的だった。1947年、服部良一が書き笠置シヅ子が歌った楽曲は、跳ねるリズムと解放的な歌唱によって、焼け跡の空気を一変させたと語られる。1949年に12歳で登場した美空ひばりは、以後40年にわたり国民的な歌手であり続け、この分野の象徴となった。1951年に始まった年末の歌合戦の放送は、この音楽を国民的な行事へと組み込む。1961年に発表された坂本九の楽曲は、1963年にアメリカで一位を獲得するという前例のない成果を挙げ、これは現在も日本語の楽曲としては唯一の記録である。1960年代後半からは筒美京平が膨大な数の楽曲を書き、作詞家の阿久悠とともに、洗練された歌謡曲の全盛期を作った。1970年代から1980年代にかけては、テレビの歌謡番組が視聴率を競い、順位を発表する形式の番組が国民的な関心を集める。しかし1980年代末以降、この呼称は急速に使われなくなった。放送局が用い始めた新しい呼称が定着し、若い世代が自分たちの音楽を別の名で呼ぶようになったためである。呼称の交代は、制作体制の変化とも重なっていた。</p>
