<h1>Kayōkyokuとは</h1>
<p>1920年代から1980年代にかけて日本で作られた、大衆的な歌謡曲の総称である。 編曲は時代によって大きく変わった。戦前は、和楽器やギターを中心にした伴奏が多かった。1970年代後半には、シンセサイザーが導入された。 音楽の土台は</p>
<p>1920年代から1980年代にかけて日本で作られた、大衆的な歌謡曲の総称である。

編曲は時代によって大きく変わった。戦前は、和楽器やギターを中心にした伴奏が多かった。1970年代後半には、シンセサイザーが導入された。

音楽の土台は、西洋の和音と曲の形にある。一方で、メロディーには日本ならではの音の感覚が深く入り込んでいる。とりわけ、7音音階から第四音と第七音を抜いたヨナ抜き音階が、戦前〜昭和30年代に特に多く使われた。これによって、西洋の曲の形でありながら日本的に響くメロディーが生まれた。1970年代には、二六抜き音階への移行も指摘された。

テンポは中くらいで、三連符を感じさせる跳ねた刻みや、行進曲風の2拍子も多いとされる。

歌は、感情を込めてのびやかに歌い上げるのが基本だ。音を細かく震わせる技法が大事にされる。

歌詞は、恋愛、別れ、望郷、酒、そして時代の空気を映す社会の情景を扱う。七五調に近い日本語のリズムが意識されるとも言われる。

曲の組み立てははっきりしている。導入、歌の部分、そして最も強く印象に残る繰り返し部分という流れを持つ。最後の繰り返しの前に転調して、感情の頂点を作るのも、よく見られる手法の一つだ。作詞家、作曲家、編曲家、歌手が分業する制作の仕組みが定着していた点も特徴である。</p>
<h2>成り立ち</h2><p>1914年、舞台女優の松井須磨子が歌った「カチューシャの唄」が大流行した。これを、流行歌が全国規模で広まった画期とする見方が有力である。

続いて1920年代後半、レコードが普及した。歌が全国規模で共有される時代の始まりである。1927年には、外資系レコード会社の日本法人が相次いで設立・提携した。1930年代には、各社が段階的に、専属の作曲家と歌手を抱える体制を整えていった。

この時期の古賀政男の旋律は、哀愁を帯びた曲調で知られ、以後長くこの分野のお手本の一つとなった。一方、服部良一はジャズやラテン音楽の表現を積極的に取り入れ、より軽快で都会的な方向を切り開いた。

戦時中は、歌の内容が国家によって統制された。戦意を高めるための曲が数多く作られたとされる。

戦後の転換は劇的だった。服部良一が書き、笠置シヅ子が歌った「東京ブギウギ」は、1947年に発表された。レコードの発売は1948年1月である。跳ねるリズムと解き放たれた歌声が、焼け跡の空気を一変させたと語られる。1949年、12歳の美空ひばりが「悲しき口笛」を大ヒットさせた。彼女はその後40年にわたって国民的な歌手であり続け、この分野の代名詞となった。

1951年にはNHK紅白歌合戦が始まった。最初は正月の放送で、1953年末から大晦日の放送になった。この番組は、この音楽を国民的な行事に組み込んだ。

1961年には、坂本九の「上を向いて歩こう」が発表された。この曲は1963年6月15日付のBillboard Hot 100で1位になり、日本語の曲として初めての成果を挙げた。2025年1月の時点で、日本語の曲では唯一の記録である。

1960年代後半からは、筒美京平が膨大な数の曲を書いた。作詞家の阿久悠らとともに、洗練された歌謡曲の全盛期を作った。1970年代から1980年代にかけては、テレビの歌謡番組が視聴率を競い、順位を発表する形式の番組が国民の関心を集めたとされる。

しかし1988年末、J-WAVEが「J-POP」という呼び名を提唱した。この呼び名は1990年代前半〜半ばに定着し、歌謡曲に代わって使われるようになった。背景には、制作・流通・放送の環境の変化もあった。呼び名の交代は、制作の仕組みの変化とも重なっていた。</p>
<h2>代表曲</h2><ul><li>いい日旅立ち (山口百恵)</li><li>上を向いて歩こう (坂本九)</li><li>赤いスイートピー (松田聖子)</li><li>アカシアの雨がやむとき (西田佐知子)</li><li>人形の家 (弘田三枝子)</li><li>UFO (ピンク・レディー)</li><li>伊勢佐木町ブルース (青江三奈)</li><li>悲しき口笛 (美空ひばり)</li><li>嵐を呼ぶ男 (石原裕次郎)</li><li>ウナ・セラ・ディ東京 (ザ・ピーナッツ)</li></ul>
