<h1>Piep Kicks（ピープキックス）とは</h1>
<p>オランダ語で甲高い音を指すpiepという語に由来する、キックドラムそのものを笛のように鳴らす技法と、それを主役にしたアップテンポ・ハードコアの一群である。テンポは概ね190から220 BPMで、一発ごとのキックが極端に長い減衰部を</p>
<p>オランダ語で甲高い音を指すpiepという語に由来する、キックドラムそのものを笛のように鳴らす技法と、それを主役にしたアップテンポ・ハードコアの一群である。テンポは概ね190から220 BPMで、一発ごとのキックが極端に長い減衰部を持つため、隣の打点と重なり合って途切れない持続音を作る。作る上での要点はキックの尾の部分の作り込みにあり、まずサイン波を短時間で急激にピッチダウンさせて土台を作り、それをディストーションやサチュレーターで何段も潰して倍音を増やしたうえで、クセの強いフィルターを特定の周波数に固定してかけることで、鳴らすたびに同じ高さの笛のような音が乗る。この笛の音程を音階に合わせて並べれば、キックだけでメロディーを弾くことができ、ドロップなどの主要な部分をキックの音程変化だけで組み立てる曲もある。上に重ねる音は必要最小限で、絶叫や短い語りのサンプル、鋭いシンセの一撃、そして完全に音を止める間が使われる。低音は倍音を稼ぐために意図的に薄く、大型のサウンドシステムで鳴らしたときに胸ではなく耳を突き刺すよう調整されている。同じ速度帯のテラーコアが恐怖と混沌を演出するのに対し、こちらは音程を持ったキックによる遊び心と、鳴った瞬間に誰の曲か分かる音色の個性を競う点に重きがある。</p>
<h2>成り立ち</h2><p>土台はロッテルダムを中心に1990年代前半から続くオランダのガバとハードコアテクノであり、この地では当初からキックドラムを歪ませて音色として作り込む文化があった。2000年代にはハードコアの主流が音圧と重量を求める方向へ進んだが、2010年代半ばになると、テンポを180を超える領域へ引き上げるアップテンポ・ハードコアが若い世代の支持を集め始める。この流れの中で、キックの減衰部を長く伸ばし、共振で高い音を乗せる処理が実験され、それが鳴らしたときの甲高い響きからpiep、すなわちピー音と呼ばれるようになった。もともとは冗談として使われ始めたとされるが、経緯の詳細は分かっていない。広まりを支えたのは、Gearbox Digital(スコットランド)の姉妹レーベルGearbox Overdriveや、Triple Six Records(ベルギー説がある)といったレーベルと、Dominator、Masters of Hardcoreといった大規模イベントのアップテンポ枠である。制作にはFL Studioが若い制作者に広く使われ、キック作りの手順を解説する動画がYouTubeに上がっており、同じ音を再現しやすくなっている。キックを音程のある楽器として扱う手法は、ハードスタイルで確立した「ピッチング」で、2010年代半ば以降にハードコア系にも広がり、フレンチコアも同様に取り入れた。</p>
