<h1>Piep Kicks（ピープキックス）とは</h1>
<p>オランダ語で「ピー」という短い音（ビープ音）を指すpiepという語に由来する名前で、アップテンポ・ハードコアで使われるキックの種類、およびそれを多用する曲を指す。 その音色は、共振した高い音がキックに乗るものだ。耳に刺さる高音が特</p>
<p>オランダ語で「ピー」という短い音（ビープ音）を指すpiepという語に由来する名前で、アップテンポ・ハードコアで使われるキックの種類、およびそれを多用する曲を指す。

その音色は、共振した高い音がキックに乗るものだ。耳に刺さる高音が特徴である。ピー音がキックの尾から出るのか、頭から出るのかは、説明が異なる。

作り方の一例を挙げる。まずサイン波の音の高さを短時間で急激に下げて、土台を作る。それをディストーションやサチュレーターで何段も潰して、倍音を増やす。そのうえで、フィルターの共振でピー音を作る。

キックの音の高さを変えてメロディーを奏でる技法は、これとは別にある。ドロップの直前の部分などで、キックの音程の変化によるごく短いメロディーを使う例もある。

アップテンポ全般は、上に重ねる音が簡素で、キックが中心である。テンポは概ね185〜220 BPM前後だ。

速度帯が近く、一部重なるテラーコアは、恐怖と混沌を演出する。これに対しこちらは、音程を持ったキックによる遊び心と、鳴った瞬間に誰の曲か分かる音色の個性を競う点に重きがある。</p>
<h2>成り立ち</h2><p>土台になったのは、ロッテルダムを中心に1990年代前半から続くオランダのガバとハードコアテクノだ。この地では当初から、キックドラムを歪ませて音色として作り込む文化があった。

2000年代になると、ハードコアの主流はテンポを落とし、深く硬いキックを重視する方向へ進んだ。しかし2010年代半ばには、テンポを180を超える領域へ引き上げるアップテンポ・ハードコアが、若い世代の支持を集め始める。

この流れの中で、共振で高い音を乗せる処理が、鳴らしたときの甲高い響きから、piep、つまりピー音と呼ばれるようになった。piep kickという呼び名とその流行が目立つようになったのは、2018〜2019年前後である。もともとは冗談として使われ始めたとされるが、経緯の詳しいことは分かっていない。

アップテンポの受け皿となったのは、まずレーベルだ。Gearbox Digital(スコットランド)のサブレーベルであるGearbox Overdriveは、現在はOverdrive Digitalの名義でも活動している。ほかに、Triple Six Records(ベルギー説がある)などがある。さらに、Dominator、Masters of Hardcoreといった大規模イベントのアップテンポ枠も受け皿になった。

制作にはFL Studioなどが使われる。キック作りの手順を解説する動画もYouTubeに上がっており、同じ音を再現しやすくなっている。

キックを音程のある楽器として扱う手法は「ピッチング」と呼ばれる。ハードスタイルは、このキックのピッチングで知られる。一方、ハードコアでも2000年代からキックの音程の変化は使われてきた。フレンチコアは2010年代半ば以降に、音程を付けたキックを取り入れた。</p>
