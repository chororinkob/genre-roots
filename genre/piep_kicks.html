<h1>Piep Kicks（ピープキックス）とは</h1>
<p>オランダ語で甲高い音を指すpiepという語に由来する、キックドラムそのものを笛のように鳴らす技法と、それを主役に据えたアップテンポ・ハードコアの一群である。テンポは概ね190から220 BPMで、一発ごとのキックが極端に長い減衰部</p>
<p>オランダ語で甲高い音を指すpiepという語に由来する、キックドラムそのものを笛のように鳴らす技法と、それを主役に据えたアップテンポ・ハードコアの一群である。テンポは概ね190から220 BPMで、一発ごとのキックが極端に長い減衰部を持つため、隣の打点と重なり合って途切れない持続音を作る。制作上の要点はキックの尾の設計にあり、まずサイン波を短時間で急激にピッチダウンさせて土台を作り、それをディストーションやサチュレーターで何段も潰して倍音を増やしたうえで、共振の鋭いフィルターを特定の周波数に固定してかけることで、鳴らすたびに同じ高さの笛のような音が乗る。この笛の音程を音階に合わせて並べれば、キックだけで旋律を弾くことができ、実際にサビの部分をキックの音程変化だけで組み立てる曲が多い。上物は必要最小限で、絶叫や短い語りのサンプル、鋭いシンセの一撃、そして完全に音を止める間が使われる。低音は倍音を稼ぐために意図的に薄く、大型のサウンドシステムで鳴らしたときに胸ではなく耳を突き刺すよう調整されている。同じ速度帯のテラーコアが恐怖と混沌を演出するのに対し、こちらは音程を持ったキックによる遊戯性と、鳴った瞬間に誰の曲かわかる音色の個性を競う点に主眼がある。</p>
<h2>成り立ち</h2><p>土壌はロッテルダムを中心に1990年代前半から続くオランダのガバとハードコアテクノであり、この地では当初からキックドラムを歪ませて音色として作り込む文化があった。2000年代にはハードコアの主流が音圧と重量を求める方向へ進んだが、2010年代半ばになると、テンポを180を超える領域へ引き上げるアップテンポ・ハードコアが若い世代の支持を集め始める。この流れの中で、キックの減衰部を長く伸ばし、共振で高い音を乗せる処理が実験され、それが鳴らしたときの甲高い響きからpiep、すなわちピー音と呼ばれるようになった。名称はレーベルや評論から出たものではなく、フェスティバルの客とオンラインの掲示板が自然に付けたあだ名であり、当初はやや馬鹿にした調子で使われていた。普及を支えたのは、Gearbox DigitalやSpoontech Records、Triple Six Recordsといったオランダの配信中心のレーベルと、Dominator、Masters of Hardcoreといった大規模イベントのアップテンポ枠である。制作環境としてはFL Studioが圧倒的に使われ、キック作りの手順を解説する動画がYouTubeに大量に上がったことで、10代の制作者が短期間で同じ音を再現できるようになり、参入障壁が一気に下がった。結果として似た音の作品が氾濫し、シーン内部からは技法だけが独り歩きして曲としての中身がないという批判が繰り返し出ている。とはいえ、キックの音程で旋律を作るという発想はハードコアテクノの歴史の中でも比較的新しい発明であり、フレンチコアやアップテンポの各派に広く吸収され、現在ではハードダンス全般の共通語彙のひとつになっている。</p>
