<h1>Schlager（シュラーガー）とは</h1>
<p>ドイツ語圏で作られる、明るく分かりやすい大衆歌謡である。名称は動詞schlagen（打つ）に由来し、ウィーン方言で「稲妻のように打つ大成功」にたとえた語とされる。音楽的な設計は徹底して単純さを志向する。音楽的には単純で覚えやすい旋</p>
<p>ドイツ語圏で作られる、明るく分かりやすい大衆歌謡である。名称は動詞schlagen（打つ）に由来し、ウィーン方言で「稲妻のように打つ大成功」にたとえた語とされる。音楽的な設計は徹底して単純さを志向する。音楽的には単純で覚えやすい旋律とリズムが特徴で、時代の流行に合わせて変化した。1980年代以降はシンセサイザー（電子楽器）と打ち込み（機械による演奏）が加わった。歌唱は感情を込めて朗々と歌い上げる形が基本で、技巧より親しみやすさが重んじられる。歌詞は愛、幸福、故郷、休暇で訪れる南国の情景、そして過ぎ去った日々への郷愁を扱う。逃避的・異国趣味的な傾向が確認できる。ただし「徹底して」避けられたとは言えず、Udo Jürgensの『Griechischer Wein』（1974年）はギリシャ人労働者の郷愁を扱った。この意識的な軽さこそが、この分野の存在理由である。</p>
<h2>成り立ち</h2><p>この様式は、語もジャンルも19世紀後半のウィーンに遡る。1870年頃にはオペレッタの曲がすでにSchlagerと呼ばれ、ナチ期にもSchlagerは存在した。1950年代は戦後の全盛期であって、発祥期ではない。「Schlager」という語の、作品名を伴う確認できる初出例のひとつは、1867年2月17日のウィーンの新聞『Wiener Fremden-Blatt』が、ヨハン・シュトラウス2世の『美しく青きドナウ』を評した記事（「ein entschiedener Schlager」）である。国土は破壊され、数百万人が死に、国家は自らが犯した罪と向き合わねばならなかった。この状況において、人々が求めたのは現実の直視ではなく、そこからの一時的な離脱だった。1950年代、経済の復興が進む中で、遠い南国の情景や無邪気な恋愛を歌う楽曲が爆発的に売れる。Freddy Quinnは船乗りと放浪を主題とする歌で、Peter Alexanderは軽妙な語り口で人気を得た。この時期の作品が意図的に過去に触れないことは、しばしば批判の対象となってきた。この分野を制度として支えたのが、1956年に始まった欧州の歌謡祭典である。国別に代表を送り出すこの催しは、ドイツ語圏にとって重要な発表の場となり、1966年にはオーストリアのUdo Jürgensが優勝を果たした。彼は単なる娯楽に留まらない作曲家としての力量を持ち、この分野の水準を引き上げた人物として評価されている。1982年には当時17歳のNicoleが、平和を主題とする楽曲で優勝し、東西対立の緊張が高まっていた時期の空気を象徴した。国内では1969年から2000年まで続いたテレビの順位発表番組が、この分野の中枢として機能していた。1970年代以降、この分野は若い世代と知識層から徹底して軽んじられた。同時期のドイツには、社会を批判する歌の作り手や、実験的なロックの潮流が存在し、彼らにとってこの分野は現実逃避の象徴だったのである。しかし大衆的な支持は途切れなかった。2013年に発表され、2014年に大ヒットしたHelene Fischerの楽曲は、社会現象と呼ぶべき規模の成功を収めた。</p>
<h2>代表曲</h2><ul><li>Atemlos durch die Nacht (Helene Fischer)</li><li>Ein Stern (DJ Ötzi &amp; Nik P.)</li><li>Du (Peter Maffay)</li><li>Junge, komm bald wieder (Freddy Quinn)</li><li>Ein Bett im Kornfeld (Jürgen Drews)</li><li>Ti Amo (Howard Carpendale)</li><li>Verdammt, ich lieb dich (Matthias Reim)</li><li>Merci, Chérie (Udo Jürgens)</li><li>Heimweh (Freddy Quinn)</li><li>Marmor, Stein und Eisen bricht (Drafi Deutscher)</li><li>Phänomen (Helene Fischer)</li><li>Anita (Costa Cordalis)</li><li>Mit 66 Jahren (Udo Jürgens)</li><li>Capri-Fischer (Rudi Schuricke)</li><li>Griechischer Wein (Udo Jürgens)</li><li>Aber bitte mit Sahne (Udo Jürgens)</li><li>Siebzehn Jahr, blondes Haar (Udo Jürgens)</li><li>Ich war noch niemals in New York (Udo Jürgens)</li></ul>
