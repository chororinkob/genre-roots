<h1>Schlager（シュラーガー）とは</h1>
<p>シュラーガーは、ドイツ語圏で作られる、明るく分かりやすい大衆歌謡だ。 名称は、動詞schlagen（打つ）に由来する。ウィーン方言で「稲妻のように打つ大成功」にたとえた語と推定されている。 音楽の特徴は、比較的単純で覚えやすい旋律</p>
<p>シュラーガーは、ドイツ語圏で作られる、明るく分かりやすい大衆歌謡だ。

名称は、動詞schlagen（打つ）に由来する。ウィーン方言で「稲妻のように打つ大成功」にたとえた語と推定されている。

音楽の特徴は、比較的単純で覚えやすい旋律だ。時代の流行に合わせて、変化してきた。1970年代後半のディスコ化を経て、1980年代に電子楽器が広がった。

歌唱は、感情を込めて朗々と歌い上げる形が多いとされる。技巧より親しみやすさが重んじられることが多い。

歌詞は、愛、郷愁(Heimweh)、遠い土地への憧れ(Fernweh)、幸福願望を扱う。逃避的・異国趣味的な傾向が確認できる。ただし「徹底して」避けられたとは言えない。Udo Jürgensの『Griechischer Wein』（1974年）は、ギリシャ人労働者の郷愁を扱った。

軽さや娯楽性は、批判・評価の論点になってきた。</p>
<h2>成り立ち</h2><p>語の音楽的用法は、ウィーンの19世紀後半に遡る。ジャンルの起源には諸説ある。1870年頃には、オペレッタの曲がすでにSchlagerと呼ばれていた。ナチ期にもSchlagerは存在した。1950年代は戦後の全盛期であって、発祥期ではない。

「Schlager」という語の、作品名を伴う確認できる初出例のひとつは、1867年2月17日の記事だ。ウィーンの新聞『Fremden-Blatt』(『Neues Fremden-Blatt』と表記する資料もある)が、ヨハン・シュトラウス2世の『美しく青きドナウ』を評した。その言葉が「ein entschiedener Schlager」である。

ドイツの国土は破壊され、数百万人が死んだ。国家は自らが犯した罪と向き合わねばならなかった。この状況で、人々が求めたのは現実の直視ではなく、そこからの一時的な離脱だった。

1950年代、経済の復興が進む中で、遠い南国の情景や無邪気な恋愛を歌う楽曲が、大きな人気を得る。Freddy Quinnは船乗りと放浪を主題とする歌で、Peter Alexanderは歌手・俳優・司会者として、それぞれ人気を得た。この時期の作品は、現実逃避的だとして批判された。

1956年に始まった欧州の歌謡祭典は、Schlager歌手の重要な発表の場の一つだった。国別に代表を送り出すこの催しは、ドイツ語圏にとって重要な発表の場となった。1966年には、オーストリアのUdo Jürgensが優勝を果たした。彼は、単なる娯楽に留まらない作曲家としての力量を持つ。一部の作品(『Das ehrenwerte Haus』など)は、ジャンルの水準を押し上げ得たと評される。

1982年には、当時17歳のNicoleが優勝した。フォークランド紛争や軍備増強論争を背景に、平和への願いを歌った楽曲だった。

国内では、1969年から2000年まで続いたテレビの順位発表番組(ZDF-Hitparade)が、Schlagerの主要な露出の場だった。

1960年代後半以降は、若い世代の離反と『Schnulze』批判が強まった。ただし1970年代には、テレビを通じて世代を超えた人気もあった。同時期のドイツには、社会を批判する歌の作り手や、実験的なロックの流れが存在した。彼らにとって、この分野は現実逃避の代名詞だったと見られる。しかし、大衆的な支持は途切れなかった。2013年に発表され、2014年に大ヒットしたHelene Fischerの楽曲は、社会現象と呼ぶべき規模の成功を収めた。</p>
<h2>代表曲</h2><ul><li>Atemlos durch die Nacht (Helene Fischer)</li><li>Ein Stern (DJ Ötzi &amp; Nik P.)</li><li>Du (Peter Maffay)</li><li>Junge, komm bald wieder (Freddy Quinn)</li><li>Ti Amo (Howard Carpendale)</li><li>Verdammt, ich lieb dich (Matthias Reim)</li><li>Merci, Chérie (Udo Jürgens)</li><li>Heimweh (Freddy Quinn)</li><li>Marmor, Stein und Eisen bricht (Drafi Deutscher)</li><li>Phänomen (Helene Fischer)</li><li>Anita (Costa Cordalis)</li><li>Mit 66 Jahren (Udo Jürgens)</li><li>Capri-Fischer (Rudi Schuricke)</li><li>Griechischer Wein (Udo Jürgens)</li><li>Aber bitte mit Sahne (Udo Jürgens)</li><li>Siebzehn Jahr, blondes Haar (Udo Jürgens)</li><li>Ich war noch niemals in New York (Udo Jürgens)</li></ul>
