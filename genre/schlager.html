<h1>Schlager（シュラーガー）とは</h1>
<p>ドイツ語圏で作られる、明るく分かりやすい大衆歌謡である。名称はドイツ語でヒットを意味する語に由来する。音楽的な設計は徹底して単純さを志向する。旋律は長調で、跳躍が少なく、一度聴けば口ずさめる範囲に収められる。和声は三つか四つの基本</p>
<p>ドイツ語圏で作られる、明るく分かりやすい大衆歌謡である。名称はドイツ語でヒットを意味する語に由来する。音楽的な設計は徹底して単純さを志向する。旋律は長調で、跳躍が少なく、一度聴けば口ずさめる範囲に収められる。和声は三つか四つの基本的な和音の循環が中心で、複雑な進行は避けられる。リズムは四拍子で、二拍目と四拍目を軽く踏む素直な刻みか、行進曲風の二拍子が用いられ、テンポは中庸である。編曲には管楽器の斉奏、手風琴、弦楽合奏が伝統的に用いられ、1980年代以降はシンセサイザーと打ち込みが加わった。構成上の定型として、最後の繰り返し部分の直前で半音または全音上へ転調し、感情を押し上げる手法がほぼ必ず用いられる。歌唱は感情を込めて朗々と歌い上げる形が基本で、技巧より親しみやすさが重んじられる。歌詞は愛、幸福、故郷、休暇で訪れる南国の情景、そして過ぎ去った日々への郷愁を扱う。政治的な主題や社会への批判は徹底して避けられ、聴き手を不安にさせないことが最優先される。この意識的な軽さこそが、この分野の存在理由である。</p>
<h2>成り立ち</h2><p>この様式の直接の土壌は、第二次世界大戦後の西ドイツにある。国土は破壊され、数百万人が死に、国家は自らが犯した罪と向き合わねばならなかった。この状況において、人々が求めたのは現実の直視ではなく、そこからの一時的な離脱だった。1950年代、経済の復興が進む中で、遠い南国の情景や無邪気な恋愛を歌う楽曲が爆発的に売れる。Freddy Quinnは船乗りと放浪を主題とする歌で、Peter Alexanderは軽妙な語り口で人気を得た。この時期の作品が意図的に過去に触れないことは、しばしば批判の対象となってきた。この分野を制度として支えたのが、1956年に始まった欧州の歌謡祭典である。国別に代表を送り出すこの催しは、ドイツ語圏にとって重要な発表の場となり、1966年にはオーストリアのUdo Jürgensが優勝を果たした。彼は単なる娯楽に留まらない作曲家としての力量を持ち、この分野の水準を引き上げた人物として評価されている。1982年には当時17歳のNicoleが、平和を主題とする楽曲で優勝し、東西対立の緊張が高まっていた時期の空気を象徴した。国内では1969年から2000年まで続いたテレビの順位発表番組が、この分野の中枢として機能している。1970年代以降、この分野は若い世代と知識層から徹底して軽んじられた。同時期のドイツには、社会を批判する歌の作り手や、実験的なロックの潮流が存在し、彼らにとってこの分野は現実逃避の象徴だったのである。しかし大衆的な支持は途切れなかった。2013年にHelene Fischerが発表した楽曲は、社会現象と呼ぶべき規模の成功を収め、この分野が依然としてドイツ語圏で最大の市場を持つことを証明している。</p>
