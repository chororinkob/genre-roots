<h1>Schlager（シュラーガー）とは</h1>
<p>ドイツ語圏で作られる、明るく分かりやすい大衆歌謡である。名称は動詞schlagen（打つ）に由来し、ウィーン方言で「稲妻のように打つ大成功」にたとえた語と推定されている。音楽的には比較的単純で覚えやすい旋律とリズムが特徴で、時代の</p>
<p>ドイツ語圏で作られる、明るく分かりやすい大衆歌謡である。名称は動詞schlagen（打つ）に由来し、ウィーン方言で「稲妻のように打つ大成功」にたとえた語と推定されている。音楽的には比較的単純で覚えやすい旋律とリズムが特徴で、時代の流行に合わせて変化した。1970年代後半のディスコ化を経て、1980年代に電子楽器（シンセサイザー）が広がった。歌詞は愛、郷愁（Heimweh）、遠い土地への憧れ（Fernweh）、幸福願望を主に扱い、南国の情景も多く歌われる。逃避的・異国趣味的な傾向が確認できる。ただし「徹底して」避けられたとは言えず、Udo Jürgensの『Griechischer Wein』（1974年）はギリシャ人労働者の郷愁を扱った。軽さや娯楽性は、この分野への批判や評価の論点になってきた。</p>
<h2>成り立ち</h2><p>語の音楽的な用法は19世紀後半のウィーンに遡るとされる（ジャンルの起源には諸説ある）。1870年頃にはオペレッタの曲がすでにSchlagerと呼ばれ、ナチ期にもSchlagerは存在した。1950年代は戦後の全盛期であって、発祥期ではない。「Schlager」という語の、作品名を伴う確認できる初出例のひとつは、1867年2月17日のウィーンの新聞『Fremden-Blatt』(『Neues Fremden-Blatt』と表記する資料もある)が、ヨハン・シュトラウス2世の『美しく青きドナウ』を評した記事（「ein entschiedener Schlager」）である。戦後のドイツでは、国土は破壊され、数百万人が死に、国家は自らが犯した罪と向き合わねばならなかった。この状況において、人々が求めたのは現実の直視ではなく、そこからの一時的な離脱だった。1950年代、経済の復興が進む中で、遠い南国の情景や無邪気な恋愛を歌う楽曲が大きな人気を得る。Freddy Quinnは船乗りと放浪を主題とする歌で、Peter Alexanderは歌手・俳優・司会者として人気を得た。この時期の作品は、現実逃避的だとして批判されてきた。Schlager歌手の重要な発表の場の一つだったのが、1956年に始まった欧州の歌謡祭典である。国別に代表を送り出すこの催しは、ドイツ語圏にとって重要な発表の場となり、1966年にはオーストリアのUdo Jürgensが優勝を果たした。彼は作曲家としての力量を持ち、『Das ehrenwerte Haus』のように、ジャンルの水準を押し上げ得たと評される作品もある。1982年には当時17歳のNicoleが、フォークランド紛争や軍備増強論争を背景に、平和への願いを歌った楽曲で優勝した。国内では1969年から2000年まで続いたテレビの順位発表番組（ZDF-Hitparade）が、Schlagerの主要な露出の場だった。1960年代後半以降、若い世代の離反と「Schnulze」（感傷的な安っぽい歌）という批判が強まったが、1970年代にはテレビを通じて世代を超えた人気もあった。同時期のドイツには、社会を批判する歌の作り手や、実験的なロックの潮流が存在し、Schlagerは非政治的な内容が中心だった。しかし大衆的な支持は途切れなかった。2013年に発表され、2014年に大ヒットしたHelene Fischerの楽曲「Atemlos durch die Nacht」は、2014年の年間チャートで1位となり、ドイツ史上5番目に成功した曲とされる（2022年12月時点）。</p>
<h2>代表曲</h2><ul><li>Atemlos durch die Nacht (Helene Fischer)</li><li>Ein Stern (DJ Ötzi &amp; Nik P.)</li><li>Du (Peter Maffay)</li><li>Junge, komm bald wieder (Freddy Quinn)</li><li>Ti Amo (Howard Carpendale)</li><li>Verdammt, ich lieb dich (Matthias Reim)</li><li>Merci, Chérie (Udo Jürgens)</li><li>Heimweh (Freddy Quinn)</li><li>Marmor, Stein und Eisen bricht (Drafi Deutscher)</li><li>Phänomen (Helene Fischer)</li><li>Anita (Costa Cordalis)</li><li>Mit 66 Jahren (Udo Jürgens)</li><li>Capri-Fischer (Rudi Schuricke)</li><li>Griechischer Wein (Udo Jürgens)</li><li>Aber bitte mit Sahne (Udo Jürgens)</li><li>Siebzehn Jahr, blondes Haar (Udo Jürgens)</li><li>Ich war noch niemals in New York (Udo Jürgens)</li></ul>
