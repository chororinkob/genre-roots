<h1>Gunka（グンカ）とは</h1>
<p>軍歌は、兵士が行軍しながら歌う歌だ。代表曲17曲を動画で聴け、ルーツと影響のつながりを地図でたどれる。</p>
<p>軍歌は、兵士が行軍しながら歌う歌だ。日本では明治以降、士気を高めるために作られ、戦友の死を悼む歌も軍歌に含まれる。行進の最中は、一般に伴奏なしで歌うことが多い。

伴奏が付くときは、軍楽隊の吹奏楽の編成で演奏される例が多い。トランペット、コルネット、トロンボーン、ホルンの金管楽器に、クラリネットとフルート、スネアドラム、大太鼓、シンバルが加わる例が多い。

明治の軍歌には、ファとシを抜いた5音階、つまりヨナ抜き長音階の曲が多い。『雪の進軍』も、今はこの音階で歌われることが多いが、明治期の原曲はファを含んでいた。この音階に、付点8分音符と16分音符を組んだはねるリズム（ピョンコ節）を組み合わせ、行進曲風に仕上げる型がよく見られる。音の動きは、順次進行が中心の曲が多い。一方、『抜刀隊』をもとにした陸軍分列行進曲のように、短調で始まる曲もある。

行進曲風の曲は2拍子系か4拍子系が多く、テンポは曲によって異なる。昭和の軍歌には、ゆったりしたテンポの曲もある。伴奏付きの演奏では、スネアドラムの連打と大太鼓の打点が、歩く足の運びを支える。

歌は男声の合唱や独唱が中心だが、女声の歌手が歌った曲もある。多くの場合、腹から声を出し、語尾を長く伸ばす。号令に近い張りがあり、こぶしのような装飾はほとんど付けない。

明治期の曲は歌詞が文語調で、漢語を多く使う。昭和期には『麦と兵隊』のように話し言葉に近い曲も多い。題材は、明治期は戦意昂揚（忠君愛国・進軍）、兵士称賛・武勇談、戦勝記念・凱旋歌、詠史歌が中心だ。昭和期は戦意昂揚のほか、国民（国民生活・国民運動）、女性（母・花嫁など）、政治・体制が主な題材になる。

曲は有節形式で、同じ旋律を詞の節ごとに繰り返す。『戦友』は14番まである。軍歌は歩く速さを優先する。民謡のように拍が揺れることはない。</p>
<h2>成り立ち</h2><p>日本の軍楽は1869年、薩摩藩の青年たちがイギリスの軍楽隊長フェントンに学んだことに始まる。1871年に軍楽隊が発足したあとも、海軍はしばらくフェントンの指導を受けていた。1879年に来日したドイツ人のフランツ・エッケルトは、まず海軍の軍楽隊を指導し、1880年に『君が代』に和声を付けた。一方、1884年にはフランス人のルルーが招かれて軍楽隊は改められ、1890年にルルーが帰国すると、翌1891年にはエッケルトが陸軍にも招かれた。

日本で最初の軍歌がどれかには、いくつもの説がある。幕末の「ヤッパンマルス」や、東征軍の進軍歌「トンヤレ節」を挙げる見方があり、海軍の儀礼の曲として東儀季芳が作った『海行かば』もある。西洋式の旋律による日本語の軍歌の代表例とされるのが『抜刀隊』で、こうした軍歌の形が整ったのは1880年代とされる。

1882年、東京大学の教授だった外山正一が、西南戦争で刀を手に戦った部隊をうたった詩を『新体詩抄』に発表した。1885年、フランス人の軍楽教師シャルル・ルルーがこれに曲を付け、鹿鳴館の演奏会で発表する。明治前期の代表的な軍歌とされる曲だ。ルルーはこの曲を自分で行進曲に編曲し、陸軍分列行進曲のもとになった。旋律は街にも広がり、西洋のメロディーによる日本で最初の流行歌になったとされる。

1891年には、山田美妙の詞に小山作之助が曲を付けた『敵は幾万』が発表された。1892年には永井建子が詞と曲を書いた『元寇』が出る。日清戦争（1894〜1895年）が始まると軍歌は一気に増え、この2年間で1300曲、軍歌集140冊が出たとされる。『敵は幾万』もこの時期に広く歌われた。

1895年、威海衛の戦いに従軍した永井建子が『雪の進軍』を書く。雪と寒さ、粗末な食事を描いた詞は、勇敢さより兵士の本音に近い。同じ年、佐佐木信綱と奥好義の『勇敢なる水兵』が作られた。日清戦争の黄海海戦で三浦虎次郎三等水兵が死んだ逸話が新聞で報じられ、「国民的な感動を呼び起こした」ことが曲の生まれた背景で、発表は1895年の『大捷軍歌』（第三編）だった。1900年には、瀬戸口藤吉が作曲した軍艦行進曲が成立し、のちに海軍の公式の行進曲になった。

日露戦争（1904〜1905年）のころの軍歌は、娯楽として量産され、完成した作品から小出しに販売される形で売り出された。ただし、堀内敬三は日清戦争のころと比べて「軍歌の不振期」と位置づけている。1905年には真下飛泉の詞、三善和気の曲で『戦友』が作られた。旅順で乃木希典とステッセリが会見した場面は、5年後の1910年に『水師営の会見』として文部省の唱歌の教科書に収められ、学校で歌われた。

日露戦争のあと、日本は1914年8月23日に第一次世界大戦に参戦した。1918年から1922年にはシベリア出兵があったが、日清・日露ほどの総力戦はなかった。都市の音楽は流行歌とジャズへ向かい、軍隊の歌は兵営の中に残る。満州事変が起きた1931年からは、軍歌と流行歌の結びつきが進んだ。1932年には関東軍が依嘱した『討匪行』が、藤原義江の歌でヒットしている。1937年の日中戦争で、この流れは本格的になる。

1937年、古関裕而が曲を付けた『露営の歌』は、新聞社が募った詞から作られ、半年で60万枚売れたとされる。翌年の『麦と兵隊』は大村能章、1940年の『暁に祈る』は古関の曲だ。ただしこの3曲は、民間のレコード会社が発売した流行歌だが、軍や官の関与が強い曲もあり、軍歌との線引きは曖昧だ。『麦と兵隊』を歌った東海林太郎も、戦後にこの曲は軍歌ではないと述べている。

1937年に信時潔が日本放送協会の依頼で作曲した『海行かば』は、万葉集にある大伴家持の長歌に曲を付けたもので、儀礼の場で演奏された。玉砕を伝える放送の冒頭に流れたことでも知られ、軍歌として聴くか鎮魂歌として聴くかで受け止め方が分かれる。東儀季芳の同じ題名の曲とは別の曲だ。

『同期の桜』のもとは、西條八十が1938年に雑誌に載せた詩に、大村能章が曲を付けた「戦友の唄（二輪の桜）」だ。これが替え歌として広まり、同期の兵士の死を桜に重ねた歌になった。替え歌の作詞者には諸説ある。

戦争中は、軍歌と戦時歌謡の境目はあいまいになった。レコード会社は軍国調の流行歌を量産し、軍が作った歌と民間の歌が同じ棚に並ぶ。『愛国行進曲』や『紀元二千六百年』のような国民歌も作られた。

1945年の敗戦後、歌詞のある軍歌は連合国軍総司令部（GHQ）によって禁止され、禁止は1952年のサンフランシスコ講和条約まで続いた。それでも旋律は残った。1954年に自衛隊が発足し、軍艦行進曲は海上自衛隊の儀礼の曲として今も演奏されている。現在、軍歌は自衛隊の式典やインターネットの投稿で聴ける。歌詞の政治的な意味をめぐる議論は続いている。</p>
