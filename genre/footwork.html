<h1>Footwork / Juke（フットワーク）とは</h1>
<p>アメリカのシカゴで生まれた、踊りの競技と不可分に結びついた極めて速い電子音楽である。テンポは160 BPM前後だが、四つ打ちではなく、キックとベースが三連符を基調とした不規則な塊として配置される。特徴的なのは、同じ低音を三つあるい</p>
<p>アメリカのシカゴで生まれた、踊りの競技と不可分に結びついた極めて速い電子音楽である。テンポは160 BPM前後だが、四つ打ちではなく、キックとベースが三連符を基調とした不規則な塊として配置される。特徴的なのは、同じ低音を三つあるいは五つ連続で素早く打ち込み、次の数拍は完全に沈黙するという極端な粗密で、この空白と連打の落差が踊り手の足の動きを直接誘導する。上物は極端に簡素で、多くの場合、短い言葉を切り取った音声の断片が一つだけ用いられ、それを音程を変えながら、あるいは同じ位置で執拗に繰り返すことで曲全体が構成される。人の声が意味を失い、打楽器のように機能する状態が作られる。ソウルやジャズ、時にはアニメや映画の音声まで素材として使われ、その選択には脈絡がない。和声はほとんど存在せず、曲は4分程度、展開らしい展開を持たないまま、密度だけを変化させて進む。この構造は、二人あるいは二組が向かい合って足技を競う踊りの形式に対応しており、DJは踊り手の様子を見ながら曲を切り替える。つまり音楽と踊りは一体であり、録音だけを聴くと不可解に感じられるほど、現場に依存した音楽である。</p>
<h2>成り立ち</h2><p>母体は1980年代のシカゴで生まれたハウスである。この街ではハウスが誕生した後も独自の変化を続け、1990年代には、より速く、より下品で、より簡素なゲットー・ハウスと呼ばれる形が生まれた。Dance Maniaというレーベルを中心に、DJ FunkやDJ Deeonといった作り手が、性的な言葉を反復させる極端に単純な楽曲を大量に供給し、それがジュークと呼ばれる踊りとともに黒人地区のパーティーに根づいた。テンポが徐々に上がり、160 BPM前後に達した2000年前後、踊りの側が変質する。それまでの腰を使う踊りから、足を高速で細かく動かして技術を競う形式へ移り、これに合わせて音楽も、踊り手の足を追い立てるための空白と連打の構造へ変化した。RP Booが1990年代末に作った楽曲は、この転換を最初に体現したものとして繰り返し言及される。踊りは組ごとの対戦形式となり、体育館や地下の会場で夜通し行われた。この文化は当初、シカゴの黒人地区の外にはほとんど知られていなかった。転機は2010年である。イギリスのレーベルPlanet Muが、現地の作り手の音源を集めた編集盤を国際的に流通させ、その異様なリズム構造がヨーロッパの電子音楽の聴き手に衝撃を与えた。中心にいたのはDJ Rashadで、彼はTeklifeという共同体を率い、ジュークの粗さを保ちながらジャズやドラムンベースの語法を取り込み、2013年の作品ダブル・カップで、この音楽が国際的な鑑賞に堪えることを証明した。しかし翌2014年4月、彼は34歳で薬物により急死する。この喪失は共同体に深い打撃を与えたが、DJ SpinnやTraxmanをはじめとする仲間たちが活動を継続し、現在では日本を含む世界各地に制作者と踊り手が存在する。踊りの現場から生まれ、踊りのために機能し続けるという原則は、国際化した後も揺らいでいない。</p>
<h2>代表曲</h2><ul><li>Double Cup (DJ Rashad)</li><li>Baby Come On (RP Boo)</li><li>I'm a Freak (DJ Spinn)</li><li>Teklife (DJ Manny)</li><li>Black Ballet (Jlin)</li></ul>
