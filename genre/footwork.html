<h1>Footwork / Juke（フットワーク）とは</h1>
<p>アメリカのシカゴで生まれた、踊りの競技と不可分に結びついた極めて速い電子音楽である。テンポは150〜165 BPM前後で、四つ打ちではなく、拍を飛ばすようなキックが、シンコペーション（拍をずらして強調するリズム）で素早く連打され、</p>
<p>アメリカのシカゴで生まれた、踊りの競技と不可分に結びついた極めて速い電子音楽である。テンポは150〜165 BPM前後で、四つ打ちではなく、拍を飛ばすようなキックが、シンコペーション（拍をずらして強調するリズム）で素早く連打され、ときに極めてまばらになる。特徴的なのは、その極端な粗密で、この空白と連打の落差が踊り手の足の動きを直接誘導する。上物は簡素で、ラップやポップ、R&amp;Bなどのボーカルの断片（チョップ）がよく使われ、それを音程を変えながら、あるいは同じ位置で執拗に繰り返すことで曲全体が構成される。人の声が意味を失い、打楽器のように機能する状態が作られる。ソウルやファンクなどの音声が素材として使われることもある。和声（コードの響き）はほとんど存在せず、曲は展開らしい展開を持たないまま、密度だけを変化させて進む。この構造は、2人あるいは二組が向かい合って足技を競う踊りの形式に対応しており、DJは踊り手の様子を見ながら曲を切り替える。つまり音楽と踊りは一体であり、録音だけを聴くと不可解に感じられるほど、現場に依存した音楽である。</p>
<h2>成り立ち</h2><p>母体は1980年代のシカゴで生まれたハウスである。この街ではハウスが誕生した後も独自の変化を続け、1990年代には、より速く、より下品で、より簡素なゲットー・ハウスと呼ばれる形が生まれた。Dance Maniaというレーベルを中心に、DJ FunkやDJ Deeonといった作り手が、性的な言葉を反復させる極端に単純な楽曲を大量に供給し、それがジュークと呼ばれる音楽とともに黒人地区のパーティーに根づき、そこでフットワークの踊りが生まれた。フットワークの踊りは、1980年代末から1990年代にかけて形づくられたとされ、1988〜89年にHouse-O-Maticsが「Dance Group Footwork」を作り、1990年代初頭にAnt Brownが基本のステップを作った。音楽はこの踊りに引っ張られる形で、1990年代半ばのジュークから発展し、約160 BPM前後(145 BPMとする資料もある)になり、踊り手の足を追い立てるための空白と連打の構造へ変化した。RP Booは、フットワークの最初期の曲を作った人物として一般に挙げられ、多くのDJが彼を発明者と見なすが、DJ Clentの「Hail Mary」(1996)やDJ Rashadの「Child Abuse」(1998)なども先駆とされる。踊りは組ごとの対戦形式となり、体育館や地下の会場で夜通し行われた。音楽が国際的に流通したのは2010年以降だが、ダンスは2005年にMissy Elliottの「Lose Control」のビデオやBET Awardsに出演し、2007年にはDude 'n Nemの「Watch My Feet」がヒットするなど、すでに一定の知名度があった。転機は2010年である。イギリスのレーベルPlanet Muが、現地の作り手の音源を集めた編集盤を国際的に流通させ、その異様なリズム構造がヨーロッパの電子音楽の聴き手に衝撃を与えた。中心にいたのはDJ Rashadで、彼はTeklifeという共同体を率い、ジュークの粗さを保ちながらジャングルやUKベース、R&amp;Bのサンプルを取り込み、2013年の作品ダブル・カップで、この音楽が国際的な鑑賞に堪えることを証明した。しかし翌2014年4月、彼は34歳で薬物により急死する。この喪失は共同体に深い打撃を与えたが、DJ SpinnやTraxmanをはじめとする仲間たちが活動を継続し、現在では日本を含む世界各地に制作者と踊り手が存在する。踊りの現場から生まれ、踊りのために機能し続けるという原則は、国際化した後も揺らいでいない。</p>
