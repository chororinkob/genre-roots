<h1>Footwork / Juke（フットワーク）とは</h1>
<p>アメリカのシカゴで生まれた、極めて速い電子音楽だ。踊りの競技と、切り離せない形で結びついている。 上物は簡素だ。ラップやポップ、R&amp;Bなどのボーカルの断片（チョップ）がよく使われる。その断片を、音程を変えながら、あるいは同じ位置で</p>
<p>アメリカのシカゴで生まれた、極めて速い電子音楽だ。踊りの競技と、切り離せない形で結びついている。

上物は簡素だ。ラップやポップ、R&amp;Bなどのボーカルの断片（チョップ）がよく使われる。その断片を、音程を変えながら、あるいは同じ位置で執拗に繰り返すことで、曲全体が組み立てられる。人の声は意味を失い、打楽器のように働く。ソウルやファンクなどの音声が、素材として使われることもある。

テンポは150〜165 BPM前後だ。ジューク（狭義）は四つ打ちの高速ゲットー・ハウスで、フットワークの前段階にあたる。一方、フットワーク（狭義）は四つ打ちではない。拍を飛ばすようなキックが、シンコペーション（拍をずらして強調するリズム）で素早く連打され、ときに極めてまばらになる。特徴は、その極端な粗密だ。この空白と連打の落差が、踊り手の足の動きを直接導く。

ミニマルで反復的な作品が多い。この作りは、踊りの形式に対応している。踊り手は円を作り、個人またはクルーが交代で円に入って競う。RP Booは、踊り手を見ながら曲を作ったと語っている。つまり音楽と踊りは一体だ。録音だけを聴くと分かりにくく感じられるほど、現場に依存した音楽である。</p>
<h2>成り立ち</h2><p>土台になったのは、1980年代のシカゴで生まれたハウスだ。この街では、ハウスが生まれた後も独自の変化が続いた。1990年代には、より速く、より下品で、より簡素なゲットー・ハウスと呼ばれる形が生まれる。Dance Maniaというレーベルを中心に、DJ FunkやDJ Deeonといった作り手が、性的な言葉を繰り返す極端に単純な曲を大量に送り出した。それが黒人地区のパーティーに根づいた。

フットワークの踊りは、1980年代半ば〜後半に、街の西側でハウスに合わせて始まったとされる。1988〜89年には、House-O-MaticsのメンバーのCalvin、Goose、Michael Stampsらが「Dance Group Footwork」を作った。1990年代初頭には、U-PHI-U所属のAnt Brownが、基礎となる代表的なステップ「Erk N Jerkz」を考え出した。

時期には諸説あるが、音楽はこの踊りに引っ張られる形で、1990年代後半にゲットー・ハウスの高速版として現れた。テンポは約160 BPM前後になった（1997年のRP Booの曲は145 BPMで、まだゲットー・ハウスとみなされていた）。そして、踊り手の足を追い立てるための、空白と連打の作りへと変わっていった。「ジューク」という呼び名は、1997年ごろ、DJ PunchoとGant-Manの「Juke It」から広まった。ジュークはゲットー・ハウスの新しい呼び名にすぎない、という見方もある。

RP Booは、1997年の「Baby Come On」など、フットワークの最初期の曲を作った人物として一般に挙げられる。多くの場で発明者と呼ばれるが、DJ Clentの「Hail Mary」(1996)やDJ Rashadの「Child Abuse」(1998)なども先駆けとされる。踊りは組ごとの対戦の形になり、高校の体育館、公園管理局のダンス、ボーイズ＆ガールズクラブ、Dolton Expo Centerなどで行われた。

音楽が国際的に流通したのは、主に2010年以降とされる。しかしダンスは、それより前から一定の知名度があった。2005年にはMissy Elliottの「Lose Control」のビデオやBET Awardsに出演した。2007年にはDude 'n Nemの「Watch My Feet」がBillboardのBubbling Underで20位に入り、MTVでも短期間放送された。

転機は2010年だ。イギリスのレーベルPlanet Muが、地元の作り手の音源を集めた編集盤を国際的に流通させた。DJ Rashadはこの編集盤に「Itz Not Rite」で参加し、後にTeklifeの中心人物となった。彼はジュークの粗さを保ちながら、ジャングルやUKベース、R&amp;Bのサンプルを取り込んだ。そして2013年の作品ダブル・カップで、この音楽が国際的な鑑賞に堪えることを証明した。

しかし翌2014年4月、彼は34歳で薬物により急死する。この喪失は共同体に深い打撃を与えた。それでも、DJ SpinnやTraxmanをはじめとする仲間たちが活動を続け、今では日本を含む世界各地に作り手と踊り手がいる。踊りの現場から生まれ、踊りのために働き続けるという原則は、国際化した後も揺らいでいない。</p>
