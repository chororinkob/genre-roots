<h1>Ndombolo（ンドンボロ）とは</h1>
<p>ンドンボロは、スークースを受け継ぐ、テンポの速いダンス音楽だ。1990年代に、当時ザイールと呼ばれていた後のコンゴ民主共和国で形が固まった。 セベネと呼ばれる楽器だけの部分を大事にするのは、スークースのころから続く曲の組み立てであ</p>
<p>ンドンボロは、スークースを受け継ぐ、テンポの速いダンス音楽だ。1990年代に、当時ザイールと呼ばれていた後のコンゴ民主共和国で形が固まった。

セベネと呼ばれる楽器だけの部分を大事にするのは、スークースのころから続く曲の組み立てである。前身との違いは、踊りの露骨さ、呼び上げ役が前に出ること、シンセなどのデジタルの音を取り入れたことにある。

セベネのテンポは速い。複数のエレキギターが、それぞれ別の短いフレーズを繰り返し、重なり合う。ギターの音色は高音を強く出した細く鋭いもので、歪みの少ない明るい音が一般的だ。

リズムの面では、シンコペーションするベースが入り、ドラムとシンセ・デジタル音が硬く速い刻みを保つ。

欠かせないのが、客をあおる役の存在だ。この役の人は、歌手とは別に立つ。演奏中に短い掛け声を速いペースで次々と飛ばし、踊りの動きを名指しで指示し、支援者の名を呼び上げる。この声の連続そのものが打楽器のような役目を果たし、聴き手を駆り立てる。

言葉は主にリンガラ語（スラングや他言語も混ざる）だ。曲は長く、後半はずっと同じ繰り返しが続く。踊りは腰を激しく動かすもので、音楽と切り離せない形で発達してきた。</p>
<h2>成り立ち</h2><p>1990年代、当時ザイールと呼ばれていた後のコンゴ民主共和国は、きわめて深刻な状況にあった。1997年、30年以上続いたMobutu政権が崩れた。その前後から、東部を中心に大規模な戦争が始まる。この一連の紛争は近隣の国々を巻き込み、飢えと病気を含めて、1998年8月〜2007年4月の死者は540万人と推計されている。第二次世界大戦以後で最も多くの命が失われた危機とされる。ただし、約86万人に修正すべきだとする反論もある。

首都キンシャサでは経済が崩れ、公務員の給料も払われない状況が続いた。この極限の状況の中で、この音楽は爆発的に流行した。人々にとっては現実から逃れる手段であり、演奏者にとっては数少ない収入の道でもあった。

名前の由来には諸説ある。戦争中に逃げる兵士のぎこちない歩き方をからかったものとも、「壊れた脚の小人」と風刺されたカビラ(Laurent-Désiré Kabila)の歩き方を指すとも言われる。スラングで強い大麻を指す言葉からという説もあるが、これは個人の証言1件による説である。ほかに、キコンゴ語の「求める」から来たとする説、ゴリラ・チンパンジーを指すとする説、キンシャサ動物園の霊長類「Old Marcel」説もある。

ンドンボロの起源にも諸説がある。楽団Promise Musicaの団員による共同創作とする説や、1995年ごろの振付師Radja Kulaの功績とする説がある。

広めるうえで大きな役割を果たしたのは、Wenge Musicaという集団だ。そこから分かれたWerrasonとJB Mpianaの2人は、キンシャサを二分する激しい対立を繰り広げた。この対立は音楽の競争であると同時に、支援者を巻き込む社会現象でもあった。Koffi Olomideは前の世代から続く大物として君臨し、Awilo Longombaはアフリカ各地と欧州のアフリカ系コミュニティで高い人気を得た。

演奏者の大事な収入源のひとつは、裕福な支援者の名を歌の中で呼び上げることへの謝礼である。これはコンゴ音楽に広くある慣行で、ンドンボロでは金額が高くなった。

また、踊りの露骨さを理由に、2005年にはコンゴ国内でミュージックビデオ（クリップ）の放送が制限される措置が取られている。Koffi Olomideは2021年、フランスのヴェルサイユ控訴院で、元ダンサー4人を監禁した罪で有罪となった。性的暴行については無罪となった。この件で、この分野の労働環境の問題も明らかになった。

現在は、Fally IpupaやFerre Golaらが、ルンバとンドンボロを行き来しながら、西・東アフリカや欧州のアフリカ系コミュニティで聴かれている。</p>
