<h1>Ndombolo（ンドンボロ）とは</h1>
<p>コンゴ民主共和国で1990年代に確立した、スークースを継ぐ高速のダンス音楽である。前身との最大の違いは構成の比重にある。スークースが歌の部分と器楽の部分をほぼ均等に持つのに対し、こちらは歌の部分を導入程度に切り詰め、セベネと呼ばれ</p>
<p>コンゴ民主共和国で1990年代に確立した、スークースを継ぐ高速のダンス音楽である。前身との最大の違いは構成の比重にある。スークースが歌の部分と器楽の部分をほぼ均等に持つのに対し、こちらは歌の部分を導入程度に切り詰め、セベネと呼ばれる高速の器楽部分が曲の大半を占める。この部分ではテンポが140 BPMを超え、複数のエレクトリックギターがそれぞれ別の短い音型を反復し、周期のずれによって目まぐるしい織物を作る。ギターの音色は高音を極端に強調した細く鋭いもので、歪みはかけられない。低音は短く切られた音を裏拍に置き、ドラムは打ち込みと生演奏を併用して硬く速い刻みを保つ。決定的に重要なのが煽り役の存在である。この役を担う者は歌手とは別に立ち、演奏中に短い掛け声を高速で連射し、踊りの動作を名指しで指示し、支援者の名を呼び上げる。この声の連射自体が打楽器的な役割を果たし、聴衆を追い立てる。曲は10分から20分に及び、後半は延々と同じ循環が続く。言語はリンガラ語である。踊りは腰を激しく動かす形式で、音楽と不可分に発達している。</p>
<h2>成り立ち</h2><p>1990年代のコンゴ民主共和国は、破局的な状況にあった。1997年に30年以上続いたMobutu政権が崩壊し、その前後から東部を中心に大規模な戦争が始まる。この一連の紛争は近隣諸国を巻き込み、飢餓と疾病を含めて数百万の死者を出したと推計されており、第二次世界大戦以後で最も多くの人命が失われた戦争のひとつとされる。首都キンシャサでは、経済が崩壊し公務員の給与も支払われない状況が続いた。この極限の状況で、この音楽は爆発的に流行した。人々が現実から逃れる手段であったと同時に、演奏者にとっては数少ない収入の道でもある。名称の由来には諸説あり、踊りの動作を指す現地の語からとも、当時の政治指導者の歩き方を揶揄したものとも言われる。中心となったのはWenge Musicaという集団で、そこから分裂したWerrasonとJB Mpianaの二人が、キンシャサを二分する激しい対立を繰り広げた。この対立は音楽的な競争であると同時に、支援者を巻き込む社会現象でもあった。Koffi Olomideは前の世代から続く大物として君臨し、Awilo Longombaは国外での人気を確立する。この分野の経済構造は特異である。演奏者の主要な収入は、裕福な支援者の名を歌の中で呼び上げることへの謝礼であり、そのため曲の後半は名前の羅列となることも多い。この慣行は、音楽が富の誇示の装置となっているという批判を招いてきた。また踊りの露骨さを理由に、2005年にはコンゴ国内で放送が制限される措置が取られている。Koffi Olomideは後年、踊り手の処遇をめぐってフランスで有罪判決を受けており、この分野の労働環境の問題も明らかになった。現在はFally IpupaやFerre Golaが中心となり、アフリカ全域で聴かれ続けている。</p>
