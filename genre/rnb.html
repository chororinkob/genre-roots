<h1>R&amp;B（リズムアンドブルース）とは</h1>
<p>「リズム・アンド・ブルース」の略称だ。ジャンプ・ブルース、ビッグバンド・スウィング、ゴスペル、ブギ、ブルースが混ざり合ったスタイルで、当初は「ジャズを土台にした、強く執拗なビートの音楽」と形容された。後のソウルやファンクの源流にあ</p>
<p>「リズム・アンド・ブルース」の略称だ。ジャンプ・ブルース、ビッグバンド・スウィング、ゴスペル、ブギ、ブルースが混ざり合ったスタイルで、当初は「ジャズを土台にした、強く執拗なビートの音楽」と形容された。後のソウルやファンクの源流にあたる。

ただし、現代の文脈で「R&amp;B」と言う場合は、この歴史的な意味だけを指さない。ソウル、ファンク、ヒップホップの影響を吸収し続けてきた、都市的で洗練された黒人ポピュラー音楽全般を指す。時代とともに、意味の幅が広がり続けている呼び名として使われている。

初期には、サックスを中心とした管楽器のリフが重要な役割を果たしていた。しかし、時代とともに、電子的な音作りへと比重が移っていった。

一貫しているのは、メロディアスで感情豊かなボーカル表現を核に置くという点だ。歌唱面では、1つの音節を複数の音程にわたって装飾的に伸ばして歌う「メリスマ」という技法が、R&amp;Bで多用される代表的な技法となっている。</p>
<h2>成り立ち</h2><p>1940年代のアメリカで、都市に移り住んだ黒人の聴衆へ向けたダンス音楽として形をとった。

第二次世界大戦の前後、南部の農村から数百万人が、シカゴ、デトロイト、ロサンゼルスといった北部・西部の工業都市へ移動した。この大移動により、都市部に黒人労働者階級の市場が生まれる。そうした市場に向けて、ドラムや管楽器を備えた小編成のダンス音楽が好まれた。

当時のレコード業界は、この市場向けの商品を「レイス・レコード」という呼称でひとくくりにしていた。のちに差別的とされる呼び名だが、当時の黒人向け新聞は「the Race」を、誇りをこめて自称にも使っていた。その後、Billboardは1949年6月、Jerry Wexlerの提案で、チャート名をRace RecordsからRhythm &amp; Bluesへ変更した。

1940年代には、Louis Jordanが率いる小編成のバンドが、軽快なジャンプ・ブルース（跳ねるリズムの速いブルース）で大衆的な人気を得た。1950年代には、Ruth Brown、Big Joe Turner、LaVern Bakerらを擁するAtlantic Recordsが中心となる。Ray Charlesは、1954年の「I Got a Woman」で、ゴスペルの歌唱と世俗的（宗教的でない）な歌詞を結合させ、ソウルへの扉を開いた。

同じ時期に、この音楽（当時の「race music」）が、ブギウギと熱狂的なゴスペル、またはカントリーと結びついて生まれたものがあった。これがロックンロールと呼ばれ、Chuck BerryやLittle Richardが、両方の市場を横断した。

1960年代には、MotownとStax Recordsが、R&amp;B／ソウルを国民的な音楽へ押し上げた。Sam Cookeの「A Change Is Gonna Come」(1964)は、公民権運動と結びついた代表格の一曲となる。ファンク（1960年代半ばに成立）やフィラデルフィア・ソウル（1960年代後半から1970年代）といった流れが生まれ、1980年代中盤から後半にかけては、ドラムマシンを前面に出したニュー・ジャック・スウィングが登場した。

1990年代には、Mary J. BligeやTLCらのヒップホップ・ソウルが主流になった。すでに成立していたコンテンポラリーR&amp;Bに、ヒップホップを深く結び付けたのだ。Babyfaceは、ニュー・ジャック・スウィングの担い手で、TLCなどの楽曲を手がけた。Destiny's Childを経て、BeyoncéやUsherが2000年代の中心となる。

2000年代半ばに始まったオルタナティブR&amp;Bと呼ばれる流れは、2010年代前半にFrank OceanとThe Weekndが、2010年代後半にSZAが、広く知られるようになった。彼らは、内省的な歌詞と、空間の広い電子的な音づくりを持ち込んだ。

なお、「urban」など黒人音楽を括る区分語とともに、R&amp;Bという区分も批判されることがある。</p>
