<h1>R&amp;B（リズムアンドブルース）とは</h1>
<p>「リズム・アンド・ブルース」の略称。ブルースの持つ哀愁のあるコード進行やボーカル表現に、ドラムとベースによるはっきりしたリズムセクションを加え、踊れる音楽へと変貌させたスタイルで、後のソウルやファンクの直接の前身にあたる。ただし現</p>
<p>「リズム・アンド・ブルース」の略称。ブルースの持つ哀愁のあるコード進行やボーカル表現に、ドラムとベースによるはっきりしたリズムセクションを加え、踊れる音楽へと変貌させたスタイルで、後のソウルやファンクの直接の前身にあたる。ただし現代の文脈で「R&amp;B」と言う場合、この歴史的な意味に限定されず、ソウル・ファンク・ヒップホップの影響を吸収し続けてきた、都市的で洗練された黒人ポピュラー音楽全般を指す、時代とともに意味の幅が広がり続けている呼び名として使われている。一貫しているのは、メロディアスで感情豊かなボーカル表現を核に置くという点である。歌唱面では、1つの音節を複数の音程にわたって装飾的に伸ばして歌う「メリスマ」という技法が多用され、これがR&amp;B特有の艶やかで技巧的な歌い回しを形作っている。初期にはサックスを中心とした管楽器のリフが重要な役割を果たしていたが、時代とともに電子的なプロダクションへと比重が移っていった。</p>
<h2>成り立ち</h2><p>1940年代のアメリカで、都市に移り住んだ黒人の聴衆へ向けたダンス音楽として形をとった。第二次世界大戦の前後、南部の農村から数百万人がシカゴ、デトロイト、ロサンゼルスといった北部・西部の工業都市へ移動した大移動により、都市部に黒人労働者階級の市場が生まれる。彼らが求めたのは農村のカントリー・ブルースではなく、電気楽器とドラム、管楽器を伴う、酒場で踊れる音楽だった。当時のレコード業界はこの市場向けの商品を「レイス・レコード」という差別的な呼称で括っていたが、1949年、業界誌Billboardの若手記者だったJerry Wexlerの提案によって、この呼び名は「リズム・アンド・ブルース」へ改められる。1940年代にはLouis Jordanが率いる小編成のバンドが、軽快なジャンプ・ブルースで大衆的な人気を得た。1950年代にはRuth Brown、Big Joe Turner、LaVern Bakerらを擁するAtlantic Recordsが中心となり、Ray Charlesが1954年の「I Got a Woman」でゴスペルの歌唱と世俗的な歌詞を結合させ、ソウルへの扉を開いた。同じ時期、この音楽が白人の若者層へ届いた部分がロックンロールと呼ばれ、Chuck BerryやLittle Richardが両方の市場を横断した。1960年代にはMotownとStax Recordsが R&amp;Bを国民的な音楽へ押し上げ、Sam Cookeの「A Change Is Gonna Come」(1964)は公民権運動と結びついた象徴的な一曲となる。1970年代にはファンクとフィラデルフィア・ソウルへ分岐し、1980年代末にはドラムマシンを前面に出したニュー・ジャック・スウィングが登場した。1990年代には、Mary J. Blige、TLC、Babyfaceらがヒップホップと完全に地続きになったコンテンポラリーR&amp;Bを確立し、Destiny's Childを経てBeyoncéやUsherが2000年代の中心となる。2010年代以降はFrank Ocean、The Weeknd、SZAらが、内省的な歌詞と空間の広い電子的な音づくりを持ち込み、オルタナティブR&amp;Bと呼ばれる流れを作った。なおR&amp;Bという言葉は、もともと黒人向け市場という区分に由来する経緯から、人種による分類の残滓として現在も批判されることがある。</p>
<h2>代表曲</h2><ul><li>I Got a Woman (Ray Charles)</li><li>A Change Is Gonna Come (Sam Cooke)</li><li>Crazy in Love (Beyoncé)</li><li>I'll Make Love to You (Boyz II Men)</li><li>The Weekend (SZA)</li></ul>
