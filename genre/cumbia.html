<h1>Cumbia（クンビア）とは</h1>
<p>コロンビアのカリブ海沿岸で生まれ、ラテンアメリカ全域に広がった舞踏音楽。最大の識別点はリズムで、四分の四拍子の中で、二拍目と四拍目にアクセントを置きながら、一拍を二等分ではなく不均等に扱う独特の揺れを持つ。この揺れは打楽器群によっ</p>
<p>コロンビアのカリブ海沿岸で生まれ、ラテンアメリカ全域に広がった舞踏音楽。最大の識別点はリズムで、四分の四拍子の中で、二拍目と四拍目にアクセントを置きながら、一拍を二等分ではなく不均等に扱う独特の揺れを持つ。この揺れは打楽器群によって作られ、伝統的な編成ではタンボール・アレグレ（高音の太鼓）、タンボーラ（両面太鼓）、ジャマドール（低音の太鼓）、そしてグアチェやマラカスといった振り物が層をなす。旋律を担うのはガイタと呼ばれる縦笛、あるいはカーニャ・デ・ミジョという葦の笛で、いずれも先住民由来の楽器である。つまりこの音楽は、アフリカ由来の打楽器、先住民由来の笛、そしてヨーロッパ由来の歌と和声という三つの源が合流した形をとる。BPMは90〜110とゆったりしており、踊りは片足を引きずるような小さな歩みで進む。都市化した編成ではアコーディオン、電気ギター、シンセサイザー、ホーンセクションが加わり、地域ごとに全く異なる音色をとる。和声は二和音または三和音の反復が中心で、長時間の反復による陶酔が目的となる。歌詞は恋、川、祭り、労働、そして地方の風景を扱う。</p>
<h2>成り立ち</h2><p>起源はコロンビア北部、マグダレナ川の河口周辺の地域にあり、植民地時代にアフリカから連れてこられた人々と、先住民、そしてスペイン系入植者の文化が混ざり合う中で形成された。踊りの形、すなわち男性が女性の周りを回り、女性が小さく足を引きずるように動く形式は、鎖につながれた奴隷の歩みに由来するという説が広く語られているが、確たる史料はない。19世紀を通じて農村の祭礼音楽として存在し、20世紀前半に都市化した。決定的な時期は1940年代から1960年代で、コロンビアのメデジンに設立されたレコード会社Discos FuentesとCodiscosが、この音楽を録音して全国に流通させた。Lucho BermúdezとPacho Galánが管楽器を加えた洗練された編成を確立し、都市の中産階級と国外にまで届けた。1960年代から1970年代にかけて、この音楽は驚くべき速度でラテンアメリカ全域に広がり、各地で独自の変種を生んだ。メキシコではモンテレイを中心にアコーディオンを軸とするクンビア・ノルテーニャが、ペルーではアマゾン地域の電気ギターを主役とするチチャ、あるいはクンビア・アマゾニカが生まれ、後者はロックのファズを用いた極彩色の音でLos Mirlos やJuaneco y su Combo によって代表される。アルゼンチンではブエノスアイレスの貧困層の間でクンビア・ビジェーラが生まれ、その直截な歌詞は社会問題として議論された。チリではソノーラ・パルマヤ、ボリビアでも独自の発展があった。この拡散の過程で、原型の打楽器編成はほとんど残らず、地域ごとに全く異なる楽器と質感を持つ音楽が同じ名前で呼ばれるという状態が生じている。2000年代以降は電子音楽と結び付いたヌエバ・クンビアやデジタル・クンビアが登場し、欧米のクラブでも演奏されるようになった。</p>
