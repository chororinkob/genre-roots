<h1>Cumbia（クンビア）とは</h1>
<p>コロンビアのカリブ海沿岸で生まれ、ラテンアメリカ全域に広がった舞踏音楽。最大の見分けどころはリズムで、2拍子系（2/4または2/2）、または4拍子に数えられる拍子の中で、ジャマドールが弱拍（2・4拍目）を一定に刻む独特の揺れを持つ</p>
<p>コロンビアのカリブ海沿岸で生まれ、ラテンアメリカ全域に広がった舞踏音楽。最大の見分けどころはリズムで、2拍子系（2/4または2/2）、または4拍子に数えられる拍子の中で、ジャマドールが弱拍（2・4拍目）を一定に刻む独特の揺れを持つ。この揺れは打楽器群によって作られ、伝統的な編成ではタンボール・アレグレ（複雑でシンコペートしたリズムを叩き、即興も担うリード太鼓）、タンボーラ（低音を担う両面太鼓）、ジャマドール（拍を保つ小型の片面太鼓）、そしてグアチェやマラカスといった振り物が層をなす。旋律を担うのはガイタと呼ばれる縦笛、あるいはカーニャ・デ・ミジョという葦の管楽器（構造上は単リードの管で、笛は俗称）である。ガイタは先住民起源とされ、カーニャ・デ・ミジョは先住民由来とされることが多いが、アフリカ起源説もあり未解決である。通説では、この音楽は、アフリカ由来の打楽器、先住民由来の笛、そしてヨーロッパ由来の歌（詩形）と衣装という三つの源が合流した形になっている。BPM（1分間の拍数）は約85〜110とよく言われるが様式により大きく異なり、ゆったりしており、踊りは片足を引きずるような小さな歩みで進む。都市化した編成ではアコーディオン、電気ギター、シンセサイザー、ホーンセクションが加わり、地域ごとに全く異なる音色をとる。和声（コードの響き）の数は少なく、反復的な伴奏が中心となる。伝統的なコロンビアのクンビアの歌詞は、恋、川、祭り、労働、そして地方の風景を扱うことが多い。</p>
<h2>成り立ち</h2><p>通説では、起源はコロンビア北部カリブ海沿岸の、マグダレナ川下流域のモンポックス低地（エル・バンコ周辺）が中心で、モンテス・デ・マリア地方にもあるとされ、植民地時代にアフリカから連れてこられた人々と、先住民、そしてスペイン系入植者の文化が混ざり合う中で作られた。踊りの形、すなわち男性が女性の周りを回り、女性が小さく足を引きずるように動く形式は、鎖につながれた奴隷の歩みに由来するという説が広く語られているが、確たる史料はなく、先住民の葬送の円舞に由来するという説もあるなど、諸説ある。19世紀を通じて農村の祭りの音楽として存在し、20世紀前半に都市化した。決定的な時期は1940年代から1960年代で、1934年にカルタヘナで設立され、のちにメデジンへ移ったレコード会社Discos Fuentesが、のちにクンビアを含むこの国の音楽を録音して全国に流通させた。1950年設立のCodiscosも、のちにレコード産業に加わった。Lucho Bermúdezが管楽器を加えた洗練された編成を確立し、Pacho Galánらが追随し、都市の中産階級と国外にまで届けた。1940年代から広がり始め、1960年代から1970年代にかけて各地で独自の変種が定着し、ラテンアメリカ全域に広がった。メキシコでは北東部（モンテレイなど）でアコーディオンを軸とするクンビア・ノルテーニャが、ペルーでは、アンデスの5音音階を土台にしたチチャ（クンビアとワイノ、ロックなどの融合で、1960年代にアマゾンの油田都市で始まり、リマの移民層に広まった）と、アマゾンの密林地帯のスタイルであるクンビア・アマゾニカが生まれ、後者はロックのファズ（音を強く歪ませる効果）を用いた極彩色の音でLos Mirlos やJuaneco y su Combo によって代表される。アルゼンチンではブエノスアイレスの貧困層の間でクンビア・ビジェーラが生まれ、その率直な歌詞は社会問題として議論された。チリではSonora Palacios（1962年に創設され、チリ出身のバンドとして初めてクンビアを録音したとされる）、ボリビアでも独自の発展があった。この拡散の過程で、原型の編成は変形・置換され、地域ごとに異なる楽器と質感を持つ音楽が同じ名前で呼ばれるという状態が生じている。2000年代以降は電子音楽と結び付いたヌエバ・クンビアやデジタル・クンビアが登場し、欧米のクラブでも演奏されるようになった。</p>
