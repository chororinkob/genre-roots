<h1>Cumbia（クンビア）とは</h1>
<p>クンビアは、コロンビアのカリブ海沿岸で生まれ、ラテンアメリカ全域に広がった舞踏音楽だ。 最大の見分けどころは、リズムにある。2拍子系（2/4または2/2）、または4拍子に数えられる拍子の中で、ジャマドールが弱拍（2・4拍目）を一定</p>
<p>クンビアは、コロンビアのカリブ海沿岸で生まれ、ラテンアメリカ全域に広がった舞踏音楽だ。

最大の見分けどころは、リズムにある。2拍子系（2/4または2/2）、または4拍子に数えられる拍子の中で、ジャマドールが弱拍（2・4拍目）を一定に刻む。これが独特の揺れを生む。この揺れは打楽器群によって作られる。伝統的な編成では、次の楽器が層をなす。タンボール・アレグレ（複雑でシンコペートしたリズムを叩き、即興も担うリード太鼓）、タンボーラ（低音を担う両面太鼓）、ジャマドール（拍を保つ小型の片面太鼓）、そしてグアチェやマラカスといった振り物だ。

旋律を担うのは、ガイタと呼ばれる縦笛、あるいはカーニャ・デ・ミジョという葦の管楽器（構造上は単リードの管で、笛は俗称）である。ガイタは先住民起源とされる。カーニャ・デ・ミジョは先住民由来とされることが多いが、アフリカ起源説もあり、未解決である。通説では、この音楽は三つの源が合流した形になっている。アフリカ由来の打楽器、先住民由来の笛、そしてヨーロッパ由来の歌（詩形）と衣装だ。

BPM（1分間の拍数）は約85〜110（種類により大きく異なる）で、ゆったりしている。踊りは、片足を引きずるような小さな歩みで進む。都市化した編成ではアコーディオン、電気ギター、シンセサイザー、ホーンセクションが加わり、地域ごとに全く異なる音色をとる。

和声（コードの響き）は、和音の数は少なく、反復的な伴奏が中心である。伝統的なコロンビアのクンビアでは、歌詞は恋、川、祭り、労働、そして地方の風景を扱う。</p>
<h2>成り立ち</h2><p>通説では、起源はコロンビア北部カリブ海沿岸の、マグダレナ川下流域のモンポックス低地（エル・バンコ周辺）とモンテス・デ・マリア地方にあるとされる。植民地時代にアフリカから連れてこられた人々と、先住民、そしてスペイン系入植者の文化が混ざり合う中で、作られた。

踊りの形は、男性が女性の周りを回り、女性が小さく足を引きずるように動く形式だ。鎖につながれた奴隷の歩みに由来するという説が広く語られているが、確たる史料はない。諸説あり。

19世紀を通じて、農村の祭りの音楽として存在した。20世紀前半に都市化した。決定的な時期は、1940年代から1960年代である。1934年にカルタヘナで設立され、のちにメデジンへ移ったレコード会社Discos Fuentesが、1934年の創業以来、のちにクンビアを含む同国の音楽を録音して全国に流通させた。1950年設立のCodiscosも、のちにレコード産業に加わった。Lucho Bermúdezが管楽器を加えた洗練された編成を定着させ、Pacho Galánらが追随し、都市の中産階級と国外にまで届けた。

クンビアは1940年代から広がり始めた。1960年代から1970年代にかけて、各地で独自の変種が定着し、ラテンアメリカ全域に広がった。メキシコでは、北東部（モンテレイなど）を中心に、アコーディオンを軸とするクンビア・ノルテーニャが生まれた。ペルーでは、アンデスの5音音階を土台にしたチチャ（クンビアとワイノ、ロックなどの融合で、5音音階を土台とし、リマの移民層に広まった）が生まれた。アマゾンの密林地帯のスタイルであるクンビア・アマゾニカも生まれ、後者はロックのファズ（音を強く歪ませる効果）を用いた極彩色の音で、Los Mirlos やJuaneco y su Combo によって代表される。

アルゼンチンでは、ブエノスアイレスの貧困層の間でクンビア・ビジェーラが生まれた。その率直な歌詞は、社会問題として議論された。チリでは、Sonora Palacios（1962年に創設され、チリ人（チリ出身）のバンドとして初めてクンビアを録音したとされる）が現れた。ボリビアでも、独自の発展があった。

この拡散の過程で、原型の編成は変形・置換された。地域ごとに全く異なる楽器と質感を持つ音楽が、同じ名前で呼ばれるという状態が生じている。2000年代以降は、電子音楽と結び付いたヌエバ・クンビアやデジタル・クンビアが登場し、欧米のクラブでも演奏されるようになった。</p>
