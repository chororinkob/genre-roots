<h1>Psychedelic Rap（サイケデリックラップ）とは</h1>
<p>サイケデリック・ロックの音響感覚をヒップホップの構造に持ち込んだ音楽。核になるのは音像の加工で、フェイザーやフランジャー、テープの揺れ、逆再生、極端に深いリバーブが全体にかけられ、音が渦を巻いて左右に移動する。サンプリングの素材も</p>
<p>サイケデリック・ロックの音響感覚をヒップホップの構造に持ち込んだ音楽。核になるのは音像の加工で、フェイザーやフランジャー、テープの揺れ、逆再生、極端に深いリバーブが全体にかけられ、音が渦を巻いて左右に移動する。サンプリングの素材も1960年代後半から70年代のサイケデリック・ロックやプログレ、ソウルの実験的な楽曲から採られ、ファズのかかったギターやメロトロン、シタール、シンセサイザーの持続音が敷かれる。ドラムは重く沈み、拍の隙間を大きく空けて余白を作る。テンポは毎分70から90拍前後と遅めで、曲の途中でテンポ感が崩れたり、拍子が入れ替わったりする展開も珍しくない。和音は解決を避け、同じ響きを長く伸ばして時間の感覚を曖昧にする。ラップは声そのものを加工の対象とし、ピッチをずらした声、無数に重ねた声、囁きと絶叫の切り替えが多用される。歌詞は現実の街の描写よりも、意識の変容、幻覚、宇宙、宗教、時間の歪みといった主題に向かい、脈絡のない映像が並ぶ。曲の構成も定型的なサビの反復から離れ、後半でまったく別の曲に変わる二部構成がしばしば使われる。</p>
<h2>成り立ち</h2><p>最初期の例は1990年前後にさかのぼる。ロサンゼルスのFreestyle FellowshipやThe Pharcydeは、既存のラップの型を崩した歪んだ音づくりを試み、ニューヨークではThe Ultramagnetic MC'sのKool Keithが、正気を疑わせる支離滅裂な歌詞と加工された声で独自の世界を作った。彼は1996年、Dr. Octagon名義の『Dr. Octagonecologyst』を発表し、制作を担当したDan the Automatorとの組み合わせで、この方向の代表作となった。1990年代半ばにはCypress Hillが『Black Sunday』(1993)以降、大麻文化と結びついた濁った音を打ち出し、アトランタではOutKastが『ATLiens』(1996)、『Aquemini』(1998)で、南部の音にシタールや宇宙的な意匠を持ち込んだ。この流れは2006年の『The Cool Kids』世代を経て、2010年代に大きく開花する。ロサンゼルスのFlying Lotusが主宰したレーベルBrainfeederと、彼が開いた実験的なイベントLow Endは、ラップと電子音楽の実験を接続する場となり、ここからCaptain Murphy名義の作品が生まれた。2012年、Flatbush ZOMBiEsやThe Underachieversがニューヨークで幻覚剤を主題にした作品を発表し、2015年にはKendrick Lamarの『To Pimp a Butterfly』が、ジャズと歪んだ声の加工を大規模に用いて主流に持ち込んだ。2016年のDanny Brown『Atrocity Exhibition』は、Joy Divisionの曲名を借りた題名のとおり、薬物依存と不安をノイズ混じりの音で描いた極点とされる。背景には、2010年代のアメリカで幻覚剤の治療利用をめぐる議論が復活したことや、インターネット上で古い実験的音源が容易に聴けるようになったことがある。</p>
