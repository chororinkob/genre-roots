<h1>Psychedelic Rap（サイケデリックラップ）とは</h1>
<p>サイケデリック・ロックの音響感覚を、ヒップホップの形に持ち込んだ音楽だ。 核になるのは、音の加工である。フェイザーやフランジャー（どちらも音をうねらせる効果）、テープの揺れ、逆再生、極端に深いリバーブ（残響）が全体にかけられる。音</p>
<p>サイケデリック・ロックの音響感覚を、ヒップホップの形に持ち込んだ音楽だ。

核になるのは、音の加工である。フェイザーやフランジャー（どちらも音をうねらせる効果）、テープの揺れ、逆再生、極端に深いリバーブ（残響）が全体にかけられる。音は渦を巻いて、左右に移動する。サンプリング（既存の録音の取り込み）の素材は、1960年代後半から70年代のサイケデリック・ロック、ソウル、ファンク、ジャズなどの楽曲から採られる。ジャズのレコードから採ったくすんだドラムブレイクなども使われる。そこに、ファズ（音を強く歪ませる効果）のかかったギターやメロトロン（録音テープを鍵盤で鳴らす楽器）、シタール、シンセサイザーの持続音が敷かれる。

和音は解決を避ける。同じ響きを長く伸ばして、時間の感覚を曖昧にする。

ドラムは重く沈み、拍の隙間を大きく空けて余白を作る。テンポが遅めの作品もある。作品によっては、曲の途中でテンポ感が崩れたり、拍子が入れ替わったりする展開もある。

ラップは、作品によっては声そのものを加工の対象とする。ピッチをずらした声、無数に重ねた声、囁きと絶叫の切り替えが使われることもある。

歌詞は、現実の街の描写よりも、意識の変化、幻覚、宇宙、宗教、時間の歪みといった主題に向かう。脈絡のない映像が並ぶ。

曲の構成も、定型的なサビの反復から離れる。後半でまったく別の曲に変わる二部構成が使われる作品もある。</p>
<h2>成り立ち</h2><p>このジャンルの起源は、1980年代後半のニューヨークで形になったとする見方が一般的だ。サイケデリック・ロックやファンクにまで遡る見方もある。具体例として、ニューヨークのグループBeastie Boysがロサンゼルスで作った『Paul's Boutique』（1989年）やNative Tongues、西海岸（オークランド）のDigital UndergroundのShock Gなどが先駆として挙げられる。

ロサンゼルスでは、同時代のオルタナティブやジャズ寄りの流れとして、ジャズ寄りの即興的なライムで知られるFreestyle Fellowshipや、1991年結成のThe Pharcydeが活動していた。ニューヨークでは、The Ultramagnetic MC'sのKool Keithが、正気を疑わせる支離滅裂な歌詞と、奇抜な別人格（ペルソナ）と荒唐無稽な物語で、独自の世界を作った。彼は1996年、Dr. Octagon名義の『Dr. Octagonecologyst』を発表する。主にDan the Automatorが制作し、一部の曲はKutMasta Kurtが手がけた。この作品は、この方向の代表作となった。

1990年代前半には、Cypress Hillが1991年のデビュー作『Cypress Hill』から、大麻文化と結びついた濁った音を打ち出した。『Black Sunday』(1993)では、その路線が大ヒットした。1990年代後半には、アトランタでOutKastが『ATLiens』(1996)、『Aquemini』(1998)で、南部の音に宇宙的なデザインを持ち込んだ。

この流れは、2010年代に大きく開花する。ロサンゼルスのFlying Lotusが主宰したレーベルBrainfeederと、Daddy KevとNocandoが2006年に始めた実験的なイベントLow End Theoryは、ラップと電子音楽の実験を結びつける場となった。Flying Lotusは、そこから成功した出演者の一人である。Flying Lotusは同じ環境の中で、ラッパー名義Captain Murphyとして2012年に『Duality』を発表した。

2012年にはFlatbush ZOMBiES、2013年にはThe Underachieversが、ニューヨークで幻覚剤を主題にした作品を発表した。2015年には、Kendrick Lamarの『To Pimp a Butterfly』が、ジャズやファンクを取り入れた作品として注目された。一部の批評家は、そこに歪んだサイケデリアを指摘した。2016年のDanny Brown『Atrocity Exhibition』は、Joy Divisionの曲名とJ・G・バラードの小説から題名を取った。薬物依存と不安をノイズ混じりの音で描いた作品である。

背景には、2010年代のアメリカで幻覚剤の治療利用をめぐる議論が復活したことや、インターネット上で古い実験的音源が容易に聴けるようになったことがある、という見方もある。</p>
