<h1>Sovietwave（ソビエトウェーブ）とは</h1>
<p>ソ連時代の記憶と美学を主題とする、ロシア語圏発のシンセ音楽。BPMは70〜110と遅めで、四つ打ちよりも緩やかな8分音符の刻みや、テンポの曖昧な漂う構成が好まれる。音色は1970年代から1980年代の東側で実際に使われた電子楽器、</p>
<p>ソ連時代の記憶と美学を主題とする、ロシア語圏発のシンセ音楽。BPMは70〜110と遅めで、四つ打ちよりも緩やかな8分音符の刻みや、テンポの曖昧な漂う構成が好まれる。音色は1970年代から1980年代の東側で実際に使われた電子楽器、たとえばポリヴォークスやアルアなどのソ連製シンセサイザー、あるいはその音を模したソフト音源が基調で、西側の同時代機より粗く、フィルターの効きが荒い独特の質感を持つ。旋律は長く息の長い線を描き、短調でありながら悲壮ではなく、どこか穏やかで諦観に近い情緒を帯びる。和声は単純な三和音の反復が多く、転調はほとんどない。素材としてソ連時代のニュース放送、宇宙開発の交信音声、児童向け番組の音楽、党の演説などがサンプリングされ、これが世界観を決定づける。歌が入る場合はロシア語で、宇宙、冬、故郷、未来といった主題が扱われる。実際に体験したソ連というより、後の世代が映像と伝聞から再構成した理想化された過去を鳴らす音楽であり、その意味でシンセウェイヴと構造的に同じ操作を、別の歴史に対して行っている。</p>
<h2>成り立ち</h2><p>2010年代前半、ロシアおよび旧ソ連圏のインターネット、とりわけソーシャル・ネットワーク・サービスであるVKontakteの音楽コミュニティを中心に形成された。名称は、シンセウェイヴがアメリカの1980年代を懐かしむのに対し、こちらはソヴィエトの1980年代を懐かしむ、という対比から生まれた。前史として、ソ連時代には国家が電子音楽を制度的に支援した時期があり、作曲家Eduard Artemyev（映画監督アンドレイ・タルコフスキーの作品の音楽で知られる）が、ANSシンセサイザーという光学式の独自機材を用いて先進的な作品を残していた。また、1970年代から1980年代にかけてはZodiacというラトビアのグループが、ソ連圏全域で電子音楽の人気を確立していた。これらの遺産が後の世代に素材と規範を提供した。ジャンルとしての中心となったのはСоюз（Soyuz）、Маяк（Mayak）といった名義の作家群で、いずれもインターネット上で無料配布に近い形で作品を発表した。文化的背景は複雑で、この音楽が広まった2010年代は、ソ連崩壊後に生まれた世代が成人した時期であり、彼らにとってソ連は体験ではなく、親の話と古い映像の中にだけ存在する場所だった。その結果、この音楽が描くのは実際の抑圧や欠乏ではなく、宇宙開発の高揚や集団的な安心感といった選ばれた記憶である。この点は当初から批判の的でもあり、政治的な抑圧の歴史を美化しているという指摘、逆に単なる私的な郷愁であって政治的主張ではないという反論が並行して語られてきた。2022年以降の国際情勢の変化により、この美学は外部からより厳しい目で見られるようになり、シーンの一部は活動の場を国外へ移している。</p>
