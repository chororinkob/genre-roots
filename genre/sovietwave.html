<h1>Sovietwave（ソビエトウェーブ）とは</h1>
<p>ソヴィエトウェイヴは、ソ連時代の記憶と美学を主題とする、ロシア語圏発のシンセ音楽だ。 音色は、ソ連時代風のシンセ音だ。本物の機材を使う場合も、エミュレートしたものを使う場合もある。制作は主にDAWで行われる。ソ連製シンセサイザーの</p>
<p>ソヴィエトウェイヴは、ソ連時代の記憶と美学を主題とする、ロシア語圏発のシンセ音楽だ。

音色は、ソ連時代風のシンセ音だ。本物の機材を使う場合も、エミュレートしたものを使う場合もある。制作は主にDAWで行われる。ソ連製シンセサイザーの例には、エリータ（Aelita）、アリサ（Alisa）、ポリヴォークス（1982〜1990年に生産）がある。

テンポは、中庸〜遅めのものが多いとされる。リズムは、8分音符（1拍を2つに割った音）を基調とする。

旋律は、長く息の長い線を描く。素材として、ソ連時代の科学啓蒙映画の挿入、国家指導者の演説、ラジオ局「Маяк」の呼出信号、ガガーリンの「Поехали!」、TASSの宇宙飛行報道などがサンプリングされる。これらの音の断片（サンプリング）が、世界観を決定づける。

歌が入る場合、主題は宇宙開発やソ連の科学・文化への郷愁が中心だ。

この音楽が鳴らすのは、実際に体験したソ連ではない。後の世代が、映像と伝聞から再構成した、理想化された過去だ。その意味で、シンセウェイヴと構造的に同じ操作を、別の歴史に対して行っている。</p>
<h2>成り立ち</h2><p>2010年代前半、ロシアおよび旧ソ連圏のインターネットで、この音楽は形づくられた。ソーシャル・ネットワーク・サービスであるVKontakteの音楽コミュニティが、重要な拠点の一つだった。コミュニティの創設者のブログは2014年に開設され、それ以前にも似た音を出す活動があったという。

シンセウェイヴの派生とされることが多い。ただし、vaporwaveの旧ソ連版、retrowave／chillwave系とする見方もある。コミュニティの創設者の一人は、その雰囲気を、こう説明している。ニューレトロウェイヴがネオンとマイアミのドライブなら、ソヴィエトウェイヴはダーチャで過ごすのんびりした夏、子供時代、休暇の雰囲気だ、と。

前史もある。ソ連時代の1967年には、モスクワのスクリャービン博物館に、実験電子音楽スタジオ（Murzin 指導）が正式に開設された。ANS の博物館設置は1959〜60年頃である。作曲家Eduard Artemyev（映画監督アンドレイ・タルコフスキーの作品の音楽で知られる）は、ANSシンセサイザーという光学式の独自機材を用いて、先進的な作品を残していた。また、1980年代には、Zodiacというラトビアのスペース・ディスコのグループ（1980〜1992年に活動）が、ソ連で非常に人気だった。これらの遺産が、後の世代に素材とお手本を提供した。

ハリコフ（ウクライナ）のМаяк（Mayak、2013〜14年）は、最初期に独自の方向性を打ち出した担い手の一つである。Kim and Buran、PPVK、N.E.M.O.らは、2014年以前から活動していた。Proton-4、Tvorozhnoe Ozeroなども挙がっており、インターネット上で作品を発表した。

文化的背景は複雑だ。この音楽が広まった2010年代は、ソ連崩壊後に生まれた世代が成人した時期だった。当時の若い制作者・リスナーの多くにとって、ソ連は体験ではなく、親の話と古い映像の中にだけ存在する場所だった。その結果、この音楽が描くのは、実際の抑圧や欠乏ではない。宇宙開発の高揚や、集団的な安心感といった、選ばれた記憶である。

このジャンルには、現実の困難を切り捨てているという批判と、非政治的な郷愁だという反論がある。

そして、2022年以降の国際情勢の変化により、この美学は外部からより厳しい目で見られるようになった。シーンの一部は、活動の場を国外へ移している。</p>
