<h1>Sovietwave（ソビエトウェーブ）とは</h1>
<p>ソ連時代の記憶と美学を主題とする、ロシア語圏発のシンセ音楽。テンポは中庸から遅めのものが多いとされ、8分音符（1拍を2つに割った音）を基調にした刻みが使われる。音色は、ソ連時代風の（本物またはその音を模した）シンセの音が使われ、ソ</p>
<p>ソ連時代の記憶と美学を主題とする、ロシア語圏発のシンセ音楽。テンポは中庸から遅めのものが多いとされ、8分音符（1拍を2つに割った音）を基調にした刻みが使われる。音色は、ソ連時代風の（本物またはその音を模した）シンセの音が使われ、ソ連時代の東側で実際に使われた電子楽器、たとえばエリータ（Aelita）、アリサ（Alisa）、ポリヴォークス（1982〜1990年に生産）などのソ連製シンセサイザーが例に挙がる。制作は主にDAW（パソコンの制作ソフト）で行われる。旋律は長く息の長い線を描き、素材としてソ連時代の科学啓蒙映画の挿入、国家指導者の演説、ラジオ局「Маяк」の呼出信号、ガガーリンの「Поехали!」、TASSの宇宙飛行報道などがサンプリングされ、これらの音の断片（サンプリング）が世界観を決定づける。主題は宇宙開発やソ連の科学・文化への郷愁が中心になる。実際に体験したソ連というより、後の世代が映像と伝聞から再構成した理想化された過去を鳴らす音楽であり、その意味でシンセウェイヴと構造的に同じ操作を、別の歴史に対して行っていると論じられる。</p>
<h2>成り立ち</h2><p>2010年代前半、ロシアおよび旧ソ連圏のインターネット、とりわけソーシャル・ネットワーク・サービスであるVKontakteの音楽コミュニティを重要な拠点の一つとして形成された（コミュニティの創設者のブログは2014年に開設され、それ以前にも似た音を出す活動があったという）。シンセウェイヴの派生とされることが多いが、vaporwaveの旧ソ連版、retrowave／chillwave系とする見方もある。コミュニティの創設者の一人は、その雰囲気を、ニューレトロウェイヴがネオンとマイアミのドライブなら、ソヴィエトウェイヴはダーチャで過ごすのんびりした夏、子供時代、休暇の雰囲気、と説明している。前史として、ソ連時代の1967年には、モスクワのスクリャービン博物館にMurzin率いる実験電子音楽スタジオが正式に開設され（ANS自体の博物館への設置は1959〜60年ごろとする資料もある）、作曲家Eduard Artemyev（映画監督アンドレイ・タルコフスキーの作品の音楽で知られる）が、ANSシンセサイザーという光学式の独自機材を用いて先進的な作品を残していた。また、1980年代にはZodiacというラトビアのスペース・ディスコのグループ（1980〜1992年に活動）が、ソ連で非常に人気だった。これらの遺産が後の世代に素材と規範を提供した。最初期に独自の方向性を打ち出した担い手の一つが、ハリコフ（ウクライナ）のМаяк（Mayak、2013〜14年）である。Kim and Buran、PPVKなどは2014年以前から活動しており、Proton-4、Tvorozhnoe Ozeroなども、インターネット上で作品を発表した。文化的背景は複雑で、この音楽が広まった2010年代は、ソ連崩壊後に生まれた世代が成人した時期であり、当時の若い制作者・リスナーの多くにとってソ連は、体験ではなく、親の話と古い映像の中で知る場所だった。その結果、この音楽が描くのは実際の抑圧や欠乏ではなく、宇宙開発の高揚や集団的な安心感といった選ばれた記憶である。この点には批判もあり、政治的な抑圧の歴史を美化しているという指摘、逆に単なる私的な郷愁であって政治的主張ではないという反論が並行して語られてきた。2022年のロシアによるウクライナ侵攻後は、ソ連ノスタルジア全般が政治的に論じられる度合いが強まった。</p>
