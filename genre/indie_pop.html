<h1>Indie Pop（インディーポップ）とは</h1>
<p>独立系レーベルの流通に根差しながら、旋律の甘さと簡素な編成を特徴とするポップス。編成はギター、ベース、ドラムに、しばしばオルガンや鍵盤ハーモニカ、鉄琴、そして手拍子が加わる。ギターは歪ませず、コーラスをかけた澄んだ音でアルペジオや</p>
<p>独立系レーベルの流通に根差しながら、旋律の甘さと簡素な編成を特徴とするポップス。編成はギター、ベース、ドラムに、しばしばオルガンや鍵盤ハーモニカ、鉄琴、そして手拍子が加わる。ギターは歪ませず、コーラスをかけた澄んだ音でアルペジオや軽いカッティングを弾き、演奏技術の誇示は徹底して避けられる。この、上手くないことを恥じないという姿勢は、パンクの倫理をポップスの側から引き継いだものである。ドラムは装飾を排し、時に立って叩ける最小限の構成にまで削られる。和声は三和音を基本としながら、長三度を含む明るい響きに一瞬の短調を差し込む書法が好まれる。旋律は口ずさめる範囲に収まり、単純さそのものが価値とされる。歌唱は細く頼りない声、あるいは音程の揺れる声が肯定され、少年少女のような無防備さが表現の核となる。歌詞は片思い、友情、日常の些細な出来事、そして社会への居心地の悪さを扱い、皮肉と純真が同居する。ジャケットや衣装も、白黒写真や手描きの文字といった手作りの意匠が選ばれ、音と一体の美学を作る。</p>
<h2>成り立ち</h2><p>起点は1980年代前半のイギリスとスコットランドである。1979年にスコットランドのグラスゴーで設立されたPostcard Recordsが、Orange Juice、Josef Kらを擁し、パンク以後の簡素で明るいギター・ポップを提示した。Orange JuiceのEdwyn Collinsは、攻撃的なパンクへの反発として、あえて優しく不器用な音を選んだと語っている。決定的な出来事は1986年、音楽誌NMEが付録カセットC86を発表したことで、ここに収録された22組が、この感性の共通の指標となった。The Pastels、The Shop Assistants、Primal Screamの初期などが含まれる。同時期、Sarah Recordsが1987年にブリストルで設立され、七インチのシングルのみを美しい意匠で発売するという方針を貫き、この分野の倫理的な純度を象徴する存在となった。同レーベルは1995年、100枚目の作品を出して自ら活動を終えている。米国側では、ワシントンD.C.のTeen Beat、シアトルのK Recordsが同種の役割を果たした。K Recordsを運営したCalvin Johnsonは、技術より衝動を重んじる姿勢を明確に打ち出し、Beat Happeningを率いた。この考え方は1990年代前半、女性が主体となるライオット・ガールの運動にも直接つながっている。日本では1990年代、渋谷系と呼ばれる動きがこの感性と共鳴し、フリッパーズ・ギターらが独自の展開を見せた。スウェーデンではLabradorレーベルを中心に強い伝統が育ち、2000年代にはThe Radio Dept.やJens Lekmanが国際的に知られた。この音楽は常に規模の小ささを引き受けており、商業的成功を目指さないこと自体が価値として共有されてきた。</p>
<h2>代表曲</h2><ul><li>There Is a Light That Never Goes Out (The Smiths)</li><li>Young Folks (Peter Bjorn and John)</li><li>Chewing Gum (Annie)</li><li>Lust for Life (Girls)</li><li>Sleep the Clock Around (Belle and Sebastian)</li></ul>
