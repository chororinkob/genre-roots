<h1>Neoclassicism（ネオクラシシズム）とは</h1>
<p>二十世紀前半に現れた、十八世紀以前の音楽の形式と均衡を意図的に取り戻そうとする作曲の潮流。後期ロマン派の巨大な管弦楽と過剰な感情表現への反動として、編成は室内楽規模まで縮小され、木管が主役に立ち、弦は分厚い持続音ではなく明晰な線を</p>
<p>二十世紀前半に現れた、十八世紀以前の音楽の形式と均衡を意図的に取り戻そうとする作曲の潮流。後期ロマン派の巨大な管弦楽と過剰な感情表現への反動として、編成は室内楽規模まで縮小され、木管が主役に立ち、弦は分厚い持続音ではなく明晰な線を弾く。形式面ではソナタ形式、フーガ、パッサカリア、組曲、コンチェルト・グロッソといった古い枠組みが復活し、楽章は簡潔で、対位法的な書法が前面に出る。ただし響きは十八世紀そのものではない。三和音を基礎にしながら、そこに予期しない音が付加され、調が突然すり替わり、リズムは不規則に区切られる。バロックの様式を模倣しながら、わざと一音だけ外して聴き手を落ち着かせないという、いわば距離を置いた引用の態度が根本にある。表現の方針も対照的で、感情を吐露するのではなく、感情から距離を取り、客観性、乾いた明晰さ、機械的な運動感が重んじられる。速い楽章では拍が絶えず入れ替わり、舞曲のような推進力が生まれる。演奏の場は演奏会場に加えてバレエの舞台で、二十世紀の振付家と結びついて多くの傑作が生まれた点も特徴である。</p>
<h2>成り立ち</h2><p>第一次世界大戦は、この潮流の直接の背景である。四年にわたる総力戦は、十九世紀の進歩と壮麗さへの信頼を根こそぎ破壊し、大編成の管弦楽を維持する経済的な余裕そのものも失われた。フランスではJean Cocteauが1918年に『雄鶏とアルルカン』を書き、ワーグナーの霧のような音楽を捨てて日常的で簡潔な音楽へ向かえと主張し、Erik Satieを旗印にした若い作曲家六人組が現れた。決定的だったのはIgor Stravinskyである。『春の祭典』(1913)で原始的な破壊力を示した彼は、ロシア革命で祖国と収入を失い、亡命者としてスイスとフランスで生きることになる。1920年、興行主Sergei Diaghilevの依頼でペルゴレージ作とされた古い旋律を編曲したバレエ『プルチネッラ』を書き、これが新古典主義の起点とされた。彼はその後30年にわたりこの路線を続け、『詩篇交響曲』(1930)や『放蕩者のなりゆき』(1951)を残した。ドイツではPaul Hindemithが、実用音楽という考えのもとで演奏しやすい作品を大量に書き、対位法を中心に据えた。フランスではNadia Boulangerがパリ郊外で教育者として絶大な影響力を持ち、Aaron Copland、Elliott Carter、後にはPhilip Glassやアストル・ピアソラまで、世界中から集まった作曲家を新古典主義の規律で鍛えた。ソ連ではSergei Prokofievが『古典交響曲』(1917)でハイドンの様式を借り、後にスターリン体制下で社会主義リアリズムを強いられることになる。この潮流は第二次大戦後、Pierre BoulezらがStravinskyを時代遅れと激しく攻撃したことで一度は退けられたが、Stravinsky自身が晩年に十二音技法へ転じたことで議論は複雑になった。二十世紀後半の新ロマン主義や、映画音楽の書法にその影響は残っている。</p>
<h2>代表曲</h2><ul><li>Pulcinella Suite（Igor Stravinsky）</li><li>Symphony No. 1 'Classical'（Sergei Prokofiev）</li><li>Concert Champêtre（Francis Poulenc）</li></ul>
