<h1>Neoclassicism（ネオクラシシズム）とは</h1>
<p>新古典主義は、20世紀前半に現れた作曲の流れだ。18世紀以前の音楽の形式と均衡を、意図的に取り戻そうとした。後期ロマン派の巨大な管弦楽（オーケストラ）と、過剰な感情表現への反動として生まれた。 編成は縮小され（室内オーケストラを含</p>
<p>新古典主義は、20世紀前半に現れた作曲の流れだ。18世紀以前の音楽の形式と均衡を、意図的に取り戻そうとした。後期ロマン派の巨大な管弦楽（オーケストラ）と、過剰な感情表現への反動として生まれた。

編成は縮小され（室内オーケストラを含む）、多くの作品で、弦は分厚い持続音ではなく、明晰な線を弾く傾向がある。ただし『詩篇交響曲』は、ヴァイオリンとヴィオラを使わない特殊な編成である。

形式の面では、ソナタ形式、フーガ、パッサカリア、組曲、コンチェルト・グロッソといった古い枠組みが、多くの作品で復活した。楽章は簡潔で、対位法（複数の旋律を組み合わせる技法）的な書き方が前面に出る。

ただし、響きは18世紀そのものではない。三和音（三つの音を重ねた基本の和音）を土台にしながら、そこに予期しない音が付加される。調（曲の中心の音階）は突然すり替わり、リズムは不規則に区切られる。速い楽章では拍が絶えず入れ替わり、舞曲のような前へ進む勢いが生まれる。

バロックや古典派など18世紀のスタイルを素材にしつつ、拡張された調性や不規則なリズムで現代的に再解釈する。「外れた音（wrong note）」的な書法はStravinskyやプーランクなどに指摘される。ただし、全体に共通する根本原理とは言えない。

表現の方針も対照的である。傾向として、感情を吐き出すのではなく、感情から距離を取り、客観性、乾いた明晰さ、機械的な運動感が重んじられる。

演奏の場は、演奏会場に加えてバレエの舞台である。ストラヴィンスキーの『プルチネッラ』『アポロ』『オルフェウス』などバレエ作品が代表例だ。</p>
<h2>成り立ち</h2><p>後期ロマン派への反動と、秩序に立ち返ろうとする気運が、この流れの背景にあった。戦時下の経済事情が、『兵士の物語』のように、個別の小編成作品を生む動機になった例もある。

舞台はまずフランスだ。Jean Cocteauは1918年に『雄鶏とアルルカン』を書いた。ワーグナーやドビュッシー的な印象主義から離れ、日常的で簡潔な音楽へ向かえと主張した。Erik Satieの影響下には、若い作曲家たちが集まっていた。1920年1月、批評家アンリ・コレが『コメディア』紙の記事で、この作曲家たちを「6人組」と名付けた。Cocteauはこの集団の美学的な旗印となった。ただし、命名や結成を主導したかどうかは、論者により見解が分かれる。

決定的だったのはIgor Stravinskyである。『春の祭典』(1913)で原始的な破壊力を示した彼は、第一次世界大戦の開戦後からスイスに住んだ（1914〜1920年）。やがてロシア革命で帰国が難しくなり、戦後にフランスへ移って、亡命者として生きることになる。

1919〜20年、興行主Sergei Diaghilevの依頼で、彼はバレエ『プルチネッラ』を作曲した。ペルゴレージ作とされた古い旋律を編曲したものだ。初演は1920年5月15日である。これはStravinskyの新古典主義期の出発点とされる（新古典主義全体の起点とは言えず、19世紀にも先駆例がある）。彼はその後30年にわたってこの路線を続け、『詩篇交響曲』(1930)や『放蕩者のなりゆき』(1951)を残した。

ほかの国にも広がった。ドイツではPaul Hindemithが、実用音楽（実際の用途に役立つ音楽）という考えのもとで、演奏しやすい作品を大量に書き、対位法を中心に据えた。フランスではNadia Boulangerが、パリの自宅と夏期のフォンテーヌブローで、教育者として大きな影響力を持った。Aaron Copland、Elliott Carter、後にはPhilip Glassやアストル・ピアソラまで、世界中から集まった作曲家を教え、その門下が新古典主義の考え方の普及に寄与した。ロシアではSergei Prokofievが、『古典交響曲』(1917年に作曲、1918年に初演)でハイドンのスタイルを借りた（新古典主義の先駆とされることがある）。彼は後に、スターリン体制下の1948年に「形式主義」で批判されることになる。

第二次大戦後、ブーレーズは1951年執筆(1953年刊)の論考『ストラヴィンスキーは(なお)残る』で、新古典主義期の作品を批判した。一方、Stravinsky自身が晩年に十二音技法（十二の音を偏りなく使う作曲法）へ転じたことで、議論は複雑になった。

新古典主義の影響は、ブーランジェ門下を通じた米国音楽などに見られる。新ロマン主義との関係は、影響ではなく対比である。</p>
