<h1>Neoclassicism（ネオクラシシズム）とは</h1>
<p>20世紀前半に現れた、18世紀以前の音楽の形式と均衡を意図的に取り戻そうとする作曲の潮流。後期ロマン派の巨大な管弦楽（オーケストラ）と過剰な感情表現への反動として、編成は縮小され（室内オーケストラを含む）、弦は分厚い持続音ではなく</p>
<p>20世紀前半に現れた、18世紀以前の音楽の形式と均衡を意図的に取り戻そうとする作曲の潮流。後期ロマン派の巨大な管弦楽（オーケストラ）と過剰な感情表現への反動として、編成は縮小され（室内オーケストラを含む）、弦は分厚い持続音ではなく明晰な線を弾く。形式面ではソナタ形式、フーガ、パッサカリア、組曲、コンチェルト・グロッソといった古い枠組みが復活し、楽章は簡潔で、対位法（複数の旋律を組み合わせる技法）的な書き方が前面に出る。ただし響きは18世紀そのものではない。三和音（三つの音を重ねた基本の和音）を基礎にしながら、そこに予期しない音が付加され、調（曲の中心の音階）が突然すり替わり、リズムは不規則に区切られる。バロックの様式を模倣しながら、わざと一音だけ外して聴き手を落ち着かせないという、いわば距離を置いた引用の態度が根本にある。表現の方針も対照的で、感情を吐露するのではなく、感情から距離を取り、客観性、乾いた明晰さ、機械的な運動感が重んじられる。速い楽章では拍が絶えず入れ替わり、舞曲のような前へ進む勢いが生まれる。演奏の場は演奏会場に加えてバレエの舞台で、20世紀の振付家と結びついて多くの傑作が生まれた点も特徴である。</p>
<h2>成り立ち</h2><p>第一次世界大戦は、この潮流の直接の背景である。四年にわたる総力戦は、19世紀の進歩と壮麗さへの信頼を根こそぎ壊し、大編成の管弦楽を維持する経済的な余裕そのものも失われた。フランスではJean Cocteauが1918年に『雄鶏とアルルカン』を書き、ワーグナーやドビュッシー的な印象主義から離れ、日常的で簡潔な音楽へ向かえと主張し、Erik Satieの影響下に集まった若い作曲家たちが、Cocteauに主導され、1920年に「6人組」と命名された。決定的だったのはIgor Stravinskyである。『春の祭典』(1913)で原始的な破壊力を示した彼は、第一次世界大戦の開戦後からスイスに住み（1914〜1920年）、ロシア革命で帰国が難しくなり、戦後にフランスへ移って亡命者として生きることになる。1920年、興行主Sergei Diaghilevの依頼でペルゴレージ作とされた古い旋律を編曲したバレエ『プルチネッラ』を書き、これはStravinskyの新古典主義期の出発点とされる（新古典主義全体の起点とは言えず、19世紀にも先駆例がある）。彼はその後30年にわたりこの路線を続け、『詩篇交響曲』(1930)や『放蕩者のなりゆき』(1951)を残した。ドイツではPaul Hindemithが、実用音楽（実際の用途に役立つ音楽）という考えのもとで演奏しやすい作品を大量に書き、対位法を中心に据えた。フランスではNadia Boulangerがパリの自宅と夏期のフォンテーヌブローで教育者として大きな影響力を持ち、Aaron Copland、Elliott Carter、後にはPhilip Glassやアストル・ピアソラまで、世界中から集まった作曲家を教え、その門下が新古典主義の考え方の普及に寄与した。ロシアではSergei Prokofievが『古典交響曲』(1917年に作曲、1918年に初演)でハイドンの様式を借り（新古典主義の先駆とされることがある）、後にスターリン体制下で社会主義リアリズムを強いられることになる。この潮流は第二次大戦後、Pierre BoulezらがStravinskyを時代遅れと激しく攻撃したことで一度は退けられたが、Stravinsky自身が晩年に十二音技法（十二の音を偏りなく使う作曲法）へ転じたことで議論は複雑になった。20世紀後半の新ロマン主義や、映画音楽の書法にその影響は残っている。</p>
