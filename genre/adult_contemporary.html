<h1>Adult Contemporary（アダルトコンテンポラリー）とは</h1>
<p>1960年代末以降のアメリカで、ラジオの放送形式として確立された分類に由来する、成人層へ向けた聴きやすいポピュラー音楽。定義の中心は音楽的な様式そのものではなく、職場や車の中で流していて誰も不快にならない、という機能にある。テンポ</p>
<p>1960年代末以降のアメリカで、ラジオの放送形式として確立された分類に由来する、成人層へ向けた聴きやすいポピュラー音楽。定義の中心は音楽的な様式そのものではなく、職場や車の中で流していて誰も不快にならない、という機能にある。テンポは中庸からゆったりで、拍は明確だが強く打ち込まれず、リズムは体を激しく動かすためではなく快適に流れ続けるために設計されている。編成はピアノやアコースティックギターを軸に、弦楽器のパッド、柔らかいエレキギター、控えめなドラムとベースが加わり、1980年代以降はシンセサイザーのパッドとゲートリバーブのかかったドラムがそこへ重なった。和声は明快で、複雑な代理和音よりも素直に解決する進行が好まれる。歌唱は技巧を見せつけるよりも言葉が明瞭に届くことを優先し、サビでは複数の声を重ねて広がりを出す。歌詞は恋愛、家族、別離、人生の再出発といった、成人が自分の経験に重ねられる主題を扱い、露骨な性的表現や政治的な主張は避けられる。曲の構成は定型に忠実で、聴き手が次の展開を予測できることそのものが価値とされる。ロックが逸脱を、R&amp;Bが身体性を追求する場所で、この音楽は安定と親しみやすさを追求する。</p>
<h2>成り立ち</h2><p>1960年代のアメリカで、ラジオ局の編成戦略として生まれた分類である。1950年代にロックンロールが登場すると、放送局は若者向けのトップ40形式へ一斉に移行し、その結果、25歳以上の聴取者は聴くべき局を失った。この空白を埋めるため、1960年代半ばからミドル・オブ・ザ・ロードと呼ばれる編成が広がり、Frank Sinatra、Andy Williams、Perry Comoといった歌手を中心に、静かで耳ざわりのよい曲だけを流す局が各地に生まれた。業界誌Billboardは1961年にEasy Listeningのチャートを設け、1979年にこれをAdult Contemporaryへ改称する。この改称は、対象が戦前生まれの世代から、ロックとともに育ちながら年齢を重ねたベビーブーマー世代へ移ったことを示していた。1970年代にはCarpenters、Barry Manilow、Bread、Anne Murrayらがこの分野の中心となり、シンガーソングライター系のJames TaylorやCarole Kingも取り込まれる。1980年代には、Lionel Richie、Phil Collins、Whitney Houston、Celine Dionといった歌手のバラードが主軸となり、この時期にソフト・ロックやAORといった隣接する呼称も流通した。1990年代には、Michael BoltonやMariah Carey、そしてElton Johnの「Candle in the Wind 1997」のような楽曲が記録的な売り上げを示している。放送形式としてのアダルト・コンテンポラリーは、毎年11月から12月にかけて全曲をクリスマス音楽へ切り替えるという独特の慣行を持ち、これが年末の音楽市場に大きな影響を与えてきた。一方で、この分類には批判もつきまとう。安全に振り切った選曲は無難で退屈だと揶揄され、放送局が黒人アーティストの楽曲を排除する口実として機能してきたという指摘もある。2000年代以降、ラジオの影響力が配信サービスへ移ると、この分類は作業用やリラックス用のプレイリストという形へ姿を変えて存続している。</p>
