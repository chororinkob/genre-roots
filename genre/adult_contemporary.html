<h1>Adult Contemporary（アダルトコンテンポラリー）とは</h1>
<p>成人層へ向けた、聴きやすいポピュラー音楽だ。起源は、1960年代のアメリカのイージーリスニング形式である。ラジオの編成用語は1970年代初頭に使われ始め、Billboardのチャート名は1979年4月7日号で Adult Cont</p>
<p>成人層へ向けた、聴きやすいポピュラー音楽だ。起源は、1960年代のアメリカのイージーリスニング形式である。ラジオの編成用語は1970年代初頭に使われ始め、Billboardのチャート名は1979年4月7日号で Adult Contemporary になった。

定義の中心は音楽的なスタイルそのものではなく、職場や車の中で流していて誰も不快にならない、という機能にあると見られる。

編成はピアノやアコースティックギターを軸に、弦楽器のパッド（持続する背景の音）、柔らかいエレキギター、控えめなドラムとベースが加わることが多い。1980年代以降は、シンセサイザーのパッドとゲートリバーブ（残響を急に断ち切る処理）のかかったドラムが、そこへ重なることが多かった。

和声は明快で、複雑な代理和音（別の和音で置き換えた響き）よりも素直に解決する進行が好まれる傾向がある。

Soft ACはバラード中心だが、Hot ACは速めのテンポの曲が中心だ。拍は明確だが強く打ち込まれない。リズムは、体を激しく動かすためではなく、快適に流れ続けるために設計されている。

歌唱は、歌詞の明瞭さが重視される傾向はあるが、Britannicaは歌唱力の高さも特徴に挙げる。サビでは複数の声を重ねて広がりを出す。

歌詞は恋愛、家族、別離、人生の再出発といった、成人が自分の経験に重ねられる主題を扱う。露骨な性的表現や政治的な主張は避けられる傾向がある。

曲の構成は定型に忠実な傾向があり、聴き手が次の展開を予測できることそのものが価値とされる。ロックが逸脱を、R&amp;Bが体で感じる力を追求しがちな場所で、この音楽は安定と親しみやすさを追求する傾向がある。</p>
<h2>成り立ち</h2><p>舞台は、1950年代末から1960年代初頭のアメリカのラジオ局だ。一部の放送局は、「ロックンロール局」と呼ばれるのを避けつつ、当時のヒット曲を流し続けた（MOR／イージーリスニング形式）。

こうして1960年代前半からミドル・オブ・ザ・ロードと呼ばれる編成が広がった。Frank Sinatra、Andy Williams、Perry Comoといった歌手を中心に、現行のヒット曲に加え、ロック以前のスタンダードも混ぜた局が各地に生まれた。

業界誌Billboardは、1961年にEasy Listeningのチャートを設けた。その後、Middle-Road Singles(1962〜64年)、Pop-Standard Singles(1964〜65年)を経て、1965〜79年に再びEasy Listeningとなり、1979年4月にAdult Contemporaryへ改称する。

この分野は、1960年代のアメリカのイージーリスニング形式を起源とし、1970年代に変化した。ラジオの編成用語は1970年代初頭に使われ始め、Billboardのチャート名は1979年4月7日号で Adult Contemporary になった。ACは、ベビーブーマー世代に向けて売り出された。

1970年代にはCarpenters、Barry Manilow、Bread、Anne Murrayらがこの分野の中心となった。シンガーソングライター系のJames TaylorやCarole Kingも取り込まれる。

1980年代には、Lionel Richie、Phil Collins、Whitney Houstonといった歌手のバラードが主軸となった。1980年代にかけて、ソフトロックは別名 adult-oriented rock とも呼ばれる。AOR（album-oriented rock）は別のFMロック形式で、混同されることがある。

1990年代には、Michael BoltonやMariah Carey、Celine Dion、そしてElton Johnの「Candle in the Wind 1997」のような楽曲が、世界的な売り上げ記録を示している（ACチャートでの順位は5位）。1990年代以降、多くのAC局、とくにソフトAC局が11〜12月にクリスマス音楽を中心に放送する。

一方で、この分類には批判もつきまとう。安全に振り切った選曲は無難で退屈だとからかわれ、フォーマットの区分がR&amp;B系の歌手の露出を妨げているとの批判がある。ACはラジオ形式・チャート区分として存続している。一方、若年層の配信サービスへの移行が指摘されている。</p>
