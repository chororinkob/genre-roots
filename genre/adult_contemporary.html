<h1>Adult Contemporary（アダルトコンテンポラリー）とは</h1>
<p>1960年代のアメリカのイージーリスニング形式を起源とし、ラジオの編成用語として1970年代初頭に使われ始め、Billboardのチャート名は1979年4月7日号でAdult Contemporaryになった、成人層へ向けた聴きや</p>
<p>1960年代のアメリカのイージーリスニング形式を起源とし、ラジオの編成用語として1970年代初頭に使われ始め、Billboardのチャート名は1979年4月7日号でAdult Contemporaryになった、成人層へ向けた聴きやすいポピュラー音楽。定義は、ラジオ形式でありチャート区分であり、職場や車の中で流していて誰も不快にならない、という機能が中心とも言われるが、ポップにソフトロック、フォークロック、スムースソウルなどを混ぜた音楽様式としても説明される。ソフトACはバラード中心でテンポは中庸からゆったりだが、ホットACは速めのテンポの曲が中心である。拍は明確だが強く打ち込まれず、リズムは体を激しく動かすためではなく快適に流れ続けるために設計されている。編成はピアノやアコースティックギターを軸にした例が多く、弦楽器のパッド（持続する背景の音）、柔らかいエレキギター、控えめなドラムとベースが加わり、1980年代のパワーバラード期にはシンセサイザーとデジタルドラムが目立った。和声は明快で、複雑な代理和音（別の和音で置き換えた響き）よりも素直に解決する進行が好まれる傾向がある。歌唱は言葉が明瞭に届くことが重視される傾向がある一方、歌唱力の高さも特徴に挙げられ、サビでは複数の声を重ねて広がりを出す。歌詞は恋愛、家族、別離、人生の再出発といった、成人が自分の経験に重ねられる主題を扱い、ロマンチックな歌詞が多い。曲の構成は定型に忠実な傾向がある。</p>
<h2>成り立ち</h2><p>1960年代のアメリカのイージーリスニング形式を起源とし、1970年代初頭にラジオの編成用語として使われ始め、Billboardのチャート名は1979年4月7日号でAdult Contemporaryになった、ラジオ局の編成戦略に由来する分類である。1950年代末から1960年代初頭にかけて、一部の放送局は「ロックンロール局」と呼ばれるのを避けつつ、当時のヒット曲を流し続けた（MOR／イージーリスニング形式）。こうして1960年代前半からミドル・オブ・ザ・ロードと呼ばれる編成が広がり、Frank Sinatra、Andy Williams、Perry Comoといった歌手を中心に、現行のヒット曲に加え、ロック以前のスタンダードも混ぜた局が各地に生まれた。業界誌Billboardは1961年にEasy Listeningのチャートを設け、Middle-Road Singles(1962〜64年)、Pop-Standard Singles(1964〜65年)を経て、1965〜79年に再びEasy Listeningとなり、1979年4月にAdult Contemporaryへ改称する。ACは、ベビーブーマー世代を主な対象として売り出された。1970年代にはCarpenters、Barry Manilow、Bread、Anne Murrayらがこの分野の中心となり、シンガーソングライター系のJames TaylorやCarole Kingも取り込まれる。1980年代には、Lionel Richie、Phil Collins、Whitney Houstonといった歌手のバラードが主軸となり、1980年代にかけて、ソフトロック（別名adult-oriented rock）も流通した。AOR（album-oriented rock）は別のFMロック形式で、混同されることがある。1990年代には、Michael BoltonやMariah Carey、Celine Dion、そしてElton Johnの「Candle in the Wind 1997」のような楽曲が世界的な売り上げ記録を残した（ACチャートでの順位は5位）。1990年代以降、多くのAC局、とくにソフトAC局が11〜12月にクリスマス音楽を中心に放送する。一方で、この分類には批判もつきまとう。安全に振り切った選曲は無難で退屈だとからかわれ、フォーマットの区分がR&amp;B系の歌手の露出を妨げているとの批判がある。2000年代以降もACはラジオ形式・チャート区分として存続している。一方、若年層の配信サービスへの移行が指摘されている。</p>
