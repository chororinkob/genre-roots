<h1>Speed Garage（スピードガラージ）とは</h1>
<p>UKガラージの初期形態のひとつで、四つ打ちを保ちながら低音を極端に強調した攻撃的な系統。最大の特徴はベースで、レゲエやジャングルから受け継いだ、うねりながら跳ねるベースラインが曲の主役になる。この音はしばしば1オクターブ以上を跳躍</p>
<p>UKガラージの初期形態のひとつで、四つ打ちを保ちながら低音を極端に強調した攻撃的な系統。最大の特徴はベースで、レゲエやジャングルから受け継いだ、うねりながら跳ねるベースラインが曲の主役になる。この音はしばしば1オクターブ以上を跳躍し、ポルタメントで滑り、サブベース領域まで沈み込む。土台は四つ打ちのキックで、テンポは130〜140BPMとハウスより速い。ハイハットには深いスウィングがかかり、跳ねる質感を作る。特徴的な装飾として、ジャマイカのサウンドシステム文化から借りた銃声の効果音(ガンショット)や、DJが曲を頭に戻すリワインドの操作、サイレンの音が挿入される。上物は薄く、歌の断片を切り刻んで音程を上げたもの、シンセの短い和音の突き刺しが中心。ヴォーカルは女性歌手のディーヴァ的な歌唱を加工したものが多く、MCが上から煽る。和声は単純なマイナー調の循環か、和声を持たずベースの動きだけで曲が成立する場合もある。構成は8分前後で、ベースが抜けるブレイクと、そこから低音が戻る瞬間の落差が最大の見せ場になる。2ステップと違って拍の骨格は崩さず、ハウスと違って低音の暴力性を前面に出す点が識別点になる。</p>
<h2>成り立ち</h2><p>1995年から1997年頃のロンドンで生まれた。直接の契機は、当時のクラブでガラージ・ハウスのレコードを本来の33回転ではなく速い回転数でかけていた慣習にある。テンポが上がることでヴォーカルは甲高くなり、リズムは前のめりになった。これに、同時期にイギリスで支配的だったジャングルの低音感覚が接続された。当時ロンドンのクラブでは、ジャングルの部屋とガラージの部屋が同じ建物で並行して営業しており、DJと客が両方を行き来する中で自然に融合が起きた。名称のspeed garageは1997年前後にイギリスの音楽誌とレコード店が使い始めたもので、当初は制作者自身の自称ではなかった。最初期の重要作としてはDoubleoseven名義のDJ Sの1996年「RIP Groove」が挙がる。これはジャングルの低音とガラージのグルーヴを結合させ、シーンの方向を決定づけた。1997年にはArmand Van Heldenがアメリカ人でありながらSneaker Pimpsの「Spin Spin Sugar」をリミックスし、跳ねるベースと四つ打ちの組み合わせを提示、これが英国で大ヒットしてスピードガラージの国際的な認知を作った。他にRIPやIce Cream Recordsといったレーベル、Grant Nelson、Todd Edwards(アメリカ側からヴォーカルを細切れにする独自の手法を持ち込んだ)、Tuff Jamらが中心となった。海賊放送のFreek FMやEruption FMが普及を担い、ロンドン東部のクラブでの日曜の集まりが場を提供した。文化面では、ジャングルの荒々しさに対して、シャンパンとデザイナーズブランドの服という洗練を掲げる意識が強かった。しかし1998年から1999年にかけて、シーンの主流は2ステップへ急速に移行する。四つ打ちの単調さより、拍を崩した2ステップの新しさが求められたためで、スピードガラージはわずか数年で時代遅れとされた。その後、2000年代にはこの語は事実上死語になる。復活は2000年代半ばで、イギリス北部を中心にバスライン(bassline)またはニッチ(niche、シェフィールドのクラブNicheに由来する)と呼ばれる形で再燃した。T2の2007年「Heartbroken」が全英2位を記録し、この系統の商業的頂点となった。しかしNicheは2005年に警察の大規模な強制捜査により閉鎖され、シーンは打撃を受けた。2010年代後半には再びスピードガラージとバスラインの語彙がUKベース全般に取り込まれ、若い制作者が再解釈を続けている。</p>
