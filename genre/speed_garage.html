<h1>Speed Garage（スピードガラージ）とは</h1>
<p>スピードガラージは、UKガラージの初期の形のひとつだ。四つ打ちを保ちながら、低音を極端に強調した、攻撃的な系統である。 いちばんの特徴はベースだ。レゲエやジャングルから受け継いだ、うねりながら跳ねるベースラインが、曲の主役になる。</p>
<p>スピードガラージは、UKガラージの初期の形のひとつだ。四つ打ちを保ちながら、低音を極端に強調した、攻撃的な系統である。

いちばんの特徴はベースだ。レゲエやジャングルから受け継いだ、うねりながら跳ねるベースラインが、曲の主役になる。この音が1オクターブ以上を跳躍し、ポルタメントで滑り、サブベースの領域まで沈み込む曲もある。

上に重ねる音は薄い。歌の断片を切り刻んで音程を上げたものと、シンセの短い和音の突き刺しが中心になる。和音は単純な短調のくり返しになることが多い。和音を持たず、ベースの動きだけで曲が成り立つ場合もある。

土台は四つ打ちのキックだ。テンポは130BPM前後を基本とし、140前後まで幅があり、ハウスより速い。ハイハットには深いスウィングがかかり、跳ねる質感を作ることが多い。

特徴的な飾りとして、ジャングルやダブから受け継いだ銃声の効果音(ガンショット)、DJが曲を頭に戻すリワインドの操作、サイレンの音が差し込まれる。

ヴォーカルは、女性歌手のディーヴァ的な歌い方を加工したものが多い。その上から、MCが煽る。

長さは、12インチのクラブ・ミックスが5〜9分程度、ラジオ・エディットが3分台だ。構成は、ベースが抜けるブレイクと、そこから低音が戻る瞬間の落差が、最大の見せ場になる。

2ステップとは違って、拍の骨組みは崩さない。ハウスとは違って、低音の暴力性を前面に出す。この点が、見分けるポイントになる。</p>
<h2>成り立ち</h2><p>スピードガラージは、1990年代半ばのロンドンで広まったとされる。ただし、起源には諸説ある。

ガラージ・ハウスを130BPM前後の速いテンポでかけたものが、スピードガラージと呼ばれた、という説明が知られている。音そのものは、まずアメリカの制作者、Todd EdwardsとArmand Van Heldenが作ったとされる。1994年にDJ EZがTodd Edwardsの曲を130BPMでかけた例も伝わる。

そこに、同じ時期のイギリスで主流だったジャングルの低音の感覚がつながった。当時ロンドンのクラブでは、ジャングルの部屋とガラージの部屋が、同じ建物で並んで営業していた。DJと客が両方を行き来するうちに、混ざり合いが起きたとされる。

speed garageという名前は、1997年の初めに広く聞かれるようになった。音楽誌にも、「plus-8」「speed garage」という、ややからかい気味の愛称として登場した。Armand Van Helden自身は、自分のスタイルに名前を付けていなかった。

最初期の重要作として挙がるのが、Double 99（Tim LikenとOmar Adimora）の1997年の「RipGroove」だ。初出はR.I.P. Productions名義のEPだった。シングルとしては、1997年5月に全英31位、同じ年の10月の再発で14位になった。一方で、Armand Van HeldenによるCJ Bollandの「Sugar Is Sweeter」のリミックスを、最初の本格的なスピードガラージの曲とみなす説もある。

Armand Van Heldenはアメリカ人でありながら、1997年にシングルとして発売されたSneaker Pimpsの「Spin Spin Sugar」の（その前後に作られた）リミックスを手がけた（リミックスの制作年は1996年説もある）。跳ねるベースと四つ打ちの組み合わせを示したものだ。このシングルは全英シングルで最高21位、UKダンス・チャートで1位となり、スピードガラージが国際的に知られるきっかけを作った。

ほかに、Double 99（別名義R.I.P. Productions）や、レーベルのIce Cream Records、Grant Nelson、Todd Edwards(アメリカ側からヴォーカルを細切れにする独自の手法を持ち込んだ)、Tuff Jamらが中心になった。

広める役を担ったのは、海賊放送のFreek FMやLondon Undergroundなどだ。「Sunday Scene」と呼ばれた日曜の集まりが、場を提供した。会場は、南東ロンドンのOld Kent Roadにある店（The Frog &amp; Nightgown）や、中心部のLeicester Squareのクラブ（Gass Club）などだった。日曜に開かれた主な理由は、複数あるとされる（土曜の会場確保が難しかったこと、週末のアフターパーティー需要など）。UKガラージのサンデー・シーンでは、のちにシャンパンやデザイナーズの服がトレードマークになった。

しかし1998年から1999年にかけて、シーンの主流は2ステップへ急速に移っていく。理由は諸説あるが、2ステップが軽く、ポップやR&amp;Bと相性が良かったことが指摘される。スピードガラージは、わずか数年で時代遅れとされた。1998年以降は、呼び名が『UK garage』『2-step』に移り、主流の用語ではなくなった。

一方、スピードガラージの流れを汲むものとして、バスライン(bassline)、またはニッチ(niche、シェフィールドのクラブNicheに由来する)と呼ばれる系統が生まれた。バスラインは、スピードガラージの「子孫」にあたる。起点は1990年代後半のシェフィールドだ。クラブNicheでスピードガラージが流され、1997年頃からDJがボーカルを抜いて低音を強調し始めたとされる。

Nicheは2005年11月、警察の作戦「Operation Repatriation」による大規模な強制捜査で閉鎖され、シーンは打撃を受けた。その後、T2の2007年の「Heartbroken」が全英2位を記録し、この系統の商業的な頂点となった。

2020年代初頭には、スピードガラージが英国の音楽シーンで再評価された。その音は、UKガラージ復興の流れの中で、若い制作者に再解釈されている。</p>
