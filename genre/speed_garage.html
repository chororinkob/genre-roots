<h1>Speed Garage（スピードガラージ）とは</h1>
<p>UKガラージの初期形態のひとつで、四つ打ちを保ちながら低音を極端に強調した攻撃的な系統。いちばんの特徴はベースで、レゲエやジャングルから受け継いだ、うねりながら跳ねるベースラインが曲の主役になる。この音はしばしば1オクターブ以上を</p>
<p>UKガラージの初期形態のひとつで、四つ打ちを保ちながら低音を極端に強調した攻撃的な系統。いちばんの特徴はベースで、レゲエやジャングルから受け継いだ、うねりながら跳ねるベースラインが曲の主役になる。この音はしばしば1オクターブ以上を跳躍し、ポルタメントで滑り、サブベース領域まで沈み込む。土台は四つ打ちのキックで、テンポは130〜140BPMとハウスより速い。ハイハットには深いスウィングがかかり、跳ねる質感を作る。特徴的な装飾として、ジャングルやダブから受け継いだ銃声の効果音(ガンショット)や、DJが曲を頭に戻すリワインドの操作、サイレンの音が挿入される。上に重ねる音は薄く、歌の断片を切り刻んで音程を上げたもの、シンセの短い和音の突き刺しが中心。ヴォーカルは女性歌手のディーヴァ的な歌唱を加工したものが多く、MCが上から煽る。和音は単純な短調のくり返しか、和音を持たずベースの動きだけで曲が成り立つ場合もある。構成は8分前後で、ベースが抜けるブレイクと、そこから低音が戻る瞬間の落差が最大の見せ場になる。2ステップと違って拍の骨格は崩さず、ハウスと違って低音の暴力性を前面に出す点が見分けるポイントになる。</p>
<h2>成り立ち</h2><p>1995年から1997年頃のロンドンで広まったとされる（起源には諸説ある）。ガラージ・ハウスを130BPM前後の速いテンポでかけたものがスピードガラージと呼ばれた、という説明が知られている。音そのものはまずアメリカの制作者（Todd EdwardsとArmand Van Helden）が作ったとされ、DJ EZがTodd Edwardsの曲を速いテンポでかけた例も伝わる。これに、同時期にイギリスで支配的だったジャングルの低音感覚が接続された。当時ロンドンのクラブでは、ジャングルの部屋とガラージの部屋が同じ建物で並行して営業しており、DJと客が両方を行き来する中で自然に混ざり合いが起きた。名称のspeed garageは1997年初頭に広く聞かれるようになり、音楽誌にも「plus-8」「speed garage」というやや揶揄的な愛称として登場した。Armand Van Helden自身は、自分の様式に名前を付けていなかった。最初期の重要作としてはDouble 99（Tim LikenとOmar Adimora）の1997年「RIP Groove」が挙がる。初出はR.I.P. Productions名義のEPで、シングルとしては1997年5月に全英31位、同年10月の再発で14位になった。一方で、Armand Van HeldenによるCJ Bollandの「Sugar Is Sweeter」のリミックスを最初の本格的なスピードガラージ曲とみなす説もある。1997年にはArmand Van Heldenがアメリカ人でありながらSneaker Pimpsの「Spin Spin Sugar」をリミックスし、跳ねるベースと四つ打ちの組み合わせを提示、これが全英シングル最高21位、UKダンス・チャート1位となってスピードガラージの国際的な認知を作った。他にRIPやIce Cream Recordsといったレーベル、Grant Nelson、Todd Edwards(アメリカ側からヴォーカルを細切れにする独自の手法を持ち込んだ)、Tuff Jamらが中心となった。海賊放送のFreek FMやLondon Undergroundなどが普及を担い、「Sunday Scene」と呼ばれた日曜の集まりが場を提供した。会場は、南東ロンドンのOld Kent Roadにある店（The Frog &amp; Nightgown）や、中心部のLeicester Squareのクラブ（Gass Club）などで、日曜に開かれたのは、会場側が金曜と土曜を他のジャンルに充てていたためである。文化面では、ジャングルの荒々しさに対して、シャンパンとデザイナーズブランドの服という洗練を掲げる意識が強かった。しかし1998年から1999年にかけて、シーンの主流は2ステップへ急速に移行する。四つ打ちの単調さより、拍を崩した2ステップの新しさが求められたためで、スピードガラージはわずか数年で時代遅れとされた。その後、2000年代にはこの語は事実上死語になる。スピードガラージの流れを汲むものとして、バスライン(bassline)またはニッチ(niche、シェフィールドのクラブNicheに由来する)と呼ばれる系統が生まれた。バスラインはスピードガラージの「子孫」にあたり、その起点は1990年代後半のシェフィールドで、クラブNicheでスピードガラージが流され、1997年頃からDJがボーカルを抜いて低音を強調し始めたことにある。Nicheは2005年11月、警察の作戦「Operation Repatriation」による大規模な強制捜査で閉鎖され、シーンは打撃を受けた。その後、T2の2007年「Heartbroken」が全英2位を記録し、この系統の商業的頂点となった。2020年代初頭にはスピードガラージが英国の音楽シーンで再評価され、その語彙はバスラインとともにUKベース全般に取り込まれ、若い制作者が再解釈を続けている。</p>
