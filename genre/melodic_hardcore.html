<h1>Melodic Hardcore（メロディックハードコア）とは</h1>
<p>メロディック・ハードコアは、ハードコア・パンクの速度と音量を保ちながら、旋律と和声の豊かさを組み込んだスタイルだ。 ギターは、ハーモニーやオクターブ・コード、分散和音を多用する。これらが、荒々しい演奏に旋律の厚みを与える。 テンポ</p>
<p>メロディック・ハードコアは、ハードコア・パンクの速度と音量を保ちながら、旋律と和声の豊かさを組み込んだスタイルだ。

ギターは、ハーモニーやオクターブ・コード、分散和音を多用する。これらが、荒々しい演奏に旋律の厚みを与える。

テンポは速い。BPM（1分間の拍数）には、バンドによるばらつきがある。ドラムは、ハードコア由来の高速ビートを軸とする。ディービートやスケートビートなどが、その例だ。

歌唱は、叫びと歌唱を併用する。どちらに重きを置くかは、バンドによって異なる。

歌詞は、政治的な主張、社会構造への批判、環境問題、そして個人の倫理と葛藤を扱うことが多い。感情の吐露と、思想的な訴えが同居している。

曲の構成は明確だ。疾走する部分と、テンポを落として和音を伸ばす部分が、対比して置かれる。後者では、複数の声によるコーラスが加わる。ライブでは、観客との合唱が重視される。マイクを客席へ向ける光景が、この分野のよく見られる場面の一つである。</p>
<h2>成り立ち</h2><p>1980年代前半までに、米国で萌芽が見られた。特にカリフォルニアとワシントンD.C.が知られる。ただし、起源には諸説ある。

最初期のメロディック・ハードコアには、1977年結成のDescendentsや、The Faithの1983年のEP『Subject to Change』、Dag Nastyなどがある。カリフォルニア州ロサンゼルス郊外のBad Religionは、1988年の『Suffer』でジャンルに大きな影響を与えた。Bad Religionは、1980年に高校生だったGreg Graffinらが結成した。彼らは1982年にHow Could Hell Be Any Worse?でデビューした。速い演奏に3声のコーラスを組み合わせる手法は、1988〜90年の『Suffer』『No Control』『Against the Grain』で、新しい音楽的な土台として示されたと言われる。ギタリストのBrett Gurewitzが同時に運営したレーベルEpitaph Recordsは、後にこの分野全体の商業的な土台となった。

1980年代前半には、ミネソタ州セントポールのHüsker Dü（ミネアポリス＝セントポール都市圏）が、旋律とハードコアを結びつけた。半ばには、ワシントンD.C.のDag Nasty（1985年結成）も、それぞれの角度から同じ試みを行った。Hüsker Düの1984年の2枚組Zen Arcadeは、この試みの野心的な例の一つとされる。

1990年代前半には、カリフォルニアのLagwagonとStrung Out、そしてサンフランシスコのレーベルFat Wreck Chordsが中心となった。このレーベルは、Fat MikeことMike Burkettと、当時の妻Erin Burkettが1990年に共同で創設した。旋律的なパンクの主要な発信源となった（2025年に旧譜と運営はHopeless Recordsへ売却され、Fat Mikeらは商標を保持している）。

1990年代後半には、ポスト・ハードコアは1980年代の米国でHüsker DüやMinutemenらから始まった。その米国外での代表例として、スウェーデンのRefusedが現れた。彼らは1998年のThe Shape of Punk to Comeで、ジャズや電子音楽の要素を持ち込み、枠組み自体を問い直した。同作は発表当時ほとんど売れず、バンドは直後に解散した。しかし後年になって、決定的な影響力を持つ作品と評価された。

2000年代以降は、Rise Against、Comeback Kidや、イギリスのGallows（ハードコア・パンクやポスト・ハードコアに分類される）が、それぞれ商業的な規模と地下的な硬さの異なる位置を占めている。Bad ReligionやRise Againstのように、政治的な姿勢を保ち続けるバンドも多い。一方、Descendentsは個人的なテーマが中心だ。Lagwagonなどのskate punk系は、一律に政治的とは言えない。</p>
