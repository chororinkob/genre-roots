<h1>Melodic Hardcore（メロディックハードコア）とは</h1>
<p>ハードコア・パンクの速度と音量を保ちながら、旋律と和声の豊かさを組み込んだ様式。BPMは概ね180〜210、ドラムは8分音符あるいは16分音符の高速の刻みと、2拍子的に速く往復するディービートを軸とする。ギターは歪ませつつも輪郭を</p>
<p>ハードコア・パンクの速度と音量を保ちながら、旋律と和声の豊かさを組み込んだ様式。BPMは概ね180〜210、ドラムは8分音符あるいは16分音符の高速の刻みと、2拍子的に速く往復するディービートを軸とする。ギターは歪ませつつも輪郭を保ち、パワー・コードの刻みの上に、高音域で単音の旋律を重ねる二層構造が定番。この上物の旋律線がジャンルの名称の由来である。和声は短調の循環が多く、通常のパンクより和音の数が多い進行が組まれ、時に借用和音や転調も用いられる。曲の構成は明確で、疾走する部分と、テンポを落として和音を伸ばす部分の対比が置かれ、後者では複数の声によるコーラスが加わる。ベースはルート弾きにとどまらず、対旋律を弾いて厚みを作る。歌唱は喉を潰した叫びが基本だが、言葉が聴き取れる程度の明瞭さは保たれ、時に歌に近い発声へ移る。歌詞は政治的な主張、社会構造への批判、環境問題、そして個人の倫理と葛藤を扱い、感情の吐露と思想的な訴えが同居する。ライブでは観客との合唱が重視され、マイクを客席へ向ける光景が象徴的である。</p>
<h2>成り立ち</h2><p>1980年代前半の米国で、ハードコア・パンクの単純さと画一性に飽き足りない演奏者たちが、旋律を持ち込んだところから始まる。最初期のメロディック・ハードコアには、1978年結成のDescendentsや、The Faithの1983年のEP『Subject to Change』などがあり、その一つに、カリフォルニア州ロサンゼルス郊外のBad Religionがある。Bad Religionは1980年に高校生だったGreg Graffinらが結成した。彼らは1982年にHow Could Hell Be Any Worse?でデビューし、速い演奏に3声のコーラスを組み合わせる手法は、1988〜90年の『Suffer』『No Control』『Against the Grain』で新しい音楽的基盤として示された。ギタリストBrett Gurewitzが同時に運営したレーベルEpitaph Recordsは、後にこの分野全体の商業的な基盤となった。1980年代前半にはミネソタ州セントポールのHüsker Dü（ミネアポリス＝セントポール都市圏）が、半ばにはワシントンD.C.のDag Nasty（1985年結成）が、それぞれの角度から旋律とハードコアを結合させた。Hüsker Düの1984年の2枚組Zen Arcadeは、この試みの最も野心的な例とされる。1990年代前半にはカリフォルニアのLagwagon、Strung Out、そしてサンフランシスコのレーベルFat Wreck Chordsが中心となり、Fat MikeことMike Burkettが1990年に創設したこのレーベルは、旋律的なパンクの主要な発信源となった（2025年に旧譜と運営はHopeless Recordsへ売却され、Fat Mikeらは商標を保持している）。並行して、より重く感情的なハードコア系の流れ（ポスト・ハードコアなどに分類される）がヨーロッパで発展し、スウェーデンのRefusedが1998年のThe Shape of Punk to Comeで、ジャズや電子音楽の要素を持ち込んで枠組み自体を問い直した。同作は発表当時ほとんど売れず、バンドは直後に解散したが、後年になって決定的な影響力を持つ作品と評価された。2000年代以降は、Rise Against、Comeback Kidや、イギリスのGallows（ハードコア・パンクやポスト・ハードコアに分類される）が、それぞれ商業的な規模と地下的な硬さの異なる位置を占めている。Bad ReligionやRise Againstのように政治的な姿勢を保ち続けるバンドも多いが、Descendentsは個人的なテーマが中心で、Lagwagonなどのskate punk系は一律に政治的とは言えない。</p>
