<h1>Melodic Hardcore（メロディックハードコア）とは</h1>
<p>ハードコア・パンクの速度と音量を保ちながら、旋律と和声の豊かさを組み込んだ様式。BPM（1分間の拍数）は速め（曲によってばらつきがある）、ドラムは高速の刻みと、ハードコア由来の高速ビート（ディービートやスケートビートなど）を軸とす</p>
<p>ハードコア・パンクの速度と音量を保ちながら、旋律と和声の豊かさを組み込んだ様式。BPM（1分間の拍数）は速め（曲によってばらつきがある）、ドラムは高速の刻みと、ハードコア由来の高速ビート（ディービートやスケートビートなど）を軸とする。ギターは歪ませつつも輪郭を保ち、ギターのハーモニー（2本以上のギターで音を重ねること）、オクターブ・コード（同じ音を1オクターブ離して重ねた和音）、分散和音（和音の音を一つずつ順に弾く弾き方）を多用する。この旋律的な作りがジャンルの名称の由来である。曲の構成は明確で、疾走する部分と、テンポを落として和音を伸ばす部分の対比が置かれ、後者では複数の声によるコーラスが加わる。歌唱は叫びと歌を併用し、バンドによって比重が異なる。言葉が聴き取れる程度の明瞭さは保たれる。歌詞は政治的・知的な主張や、個人の倫理と葛藤を扱うことが多く、感情の吐露と思想的な訴えが同居する。ライブでは観客との合唱が重視され、マイクを客席へ向ける場面もよく見られる。</p>
<h2>成り立ち</h2><p>1980年代前半までに米国（特にカリフォルニアとワシントンD.C.）で、ハードコア・パンクの単純さと、どれも同じような作りに飽き足りない演奏者たちが、旋律を持ち込んだところに芽が見られる。起源には諸説があり、何をメロディック・ハードコアと呼ぶかも定まっていない。最初期のメロディック・ハードコアには、1977年結成のDescendentsや、The Faithの1983年のEP『Subject to Change』、Dag Nastyなどがある。カリフォルニア州ロサンゼルスのBad Religionは、1982年のデビュー作の頃はハードコア・パンクだったが、1988年の『Suffer』以降の旋律的な作風で、この分野に大きな影響を与えた。Bad Religionは1980年に高校生だったGreg Graffinらが結成した。彼らは1981年のEPに続いて、1982年にHow Could Hell Be Any Worse?でデビューアルバムを出した。速い演奏に3声のコーラスを組み合わせる手法（バンド自身はAdolescentsの影響と語っている）は、1988〜90年の『Suffer』『No Control』『Against the Grain』で広く知られるようになった。ギタリストBrett Gurewitzが運営したレーベルEpitaph Records（本人はバンドを離れていた時期もある）は、後にこの分野全体の商業的な基盤となった。1980年代前半にはミネソタ州セントポールのHüsker Dü（ミネアポリス＝セントポール都市圏）が、半ばにはワシントンD.C.のDag Nasty（1985年結成）が、それぞれの角度から旋律とハードコアを結合させた。Hüsker Düの1984年の2枚組Zen Arcadeは、この試みの野心的な例として知られる。1990年代前半にはカリフォルニアのLagwagon、Strung Out、そしてサンフランシスコのレーベルFat Wreck Chordsが中心となり、Fat MikeことMike Burkettが、当時の妻Erin Burkettと1990年に創設したこのレーベルは、旋律的なパンクの主要な発信源となった（2025年に旧譜と運営はHopeless Recordsへ売却され、Fat Mikeらは商標を保持している）。1980年代の米国でHüsker DüやMinutemenらから始まったポスト・ハードコア（より重く感情的なハードコア系の流れ）は、米国外でも広がり、1990年代後半にはスウェーデンのRefusedが1998年のThe Shape of Punk to Comeで、ジャズや電子音楽の要素を持ち込んで枠組み自体を問い直した。同作は発表当時ほとんど売れず、バンドは直後に解散したが、後年になって決定的な影響力を持つ作品と評価された。2000年代以降は、Rise Against、Comeback Kidや、イギリスのGallows（ハードコア・パンクやポスト・ハードコアに分類される）が、それぞれ商業的な規模と地下的な硬さの異なる位置を占めている。Bad ReligionやRise Againstのように政治的な姿勢を保ち続けるバンドも多いが、Descendentsは個人的なテーマが中心で、Lagwagonなどのskate punk系は一律に政治的とは言えない。</p>
