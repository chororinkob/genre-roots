<h1>J-Fusion（ジェイフュージョン）とは</h1>
<p>1970年代後半から1980年代の日本で発達した、インストゥルメンタル音楽だ。演奏技術の高さと分かりやすさを両立させている。アメリカのフュージョンを出発点としながら、独自の性格を持つようになった。 第一の特徴は、演奏の正確さである</p>
<p>1970年代後半から1980年代の日本で発達した、インストゥルメンタル音楽だ。演奏技術の高さと分かりやすさを両立させている。アメリカのフュージョンを出発点としながら、独自の性格を持つようになった。

第一の特徴は、演奏の正確さである。Casiopea、T-SQUAREなど代表的なバンドは4〜5人編成が中心で、とても複雑なフレーズを一糸乱れず合奏する。

第二の特徴は、旋律の性格だ。アメリカのフュージョンには、即興色の強いものと、商業的で聴きやすいものがある。日本では後者に近い傾向が目立ち、明るく覚えやすいメロディーを主役にする。長調の伸びやかな線が多く、歌のないインストゥルメンタルでありながら、口ずさめる曲が多い。

鍵盤には、アナログとデジタルの両方のシンセサイザーが使われる。ギターはコーラス効果をかけた澄んだ音色で、速い単音を弾くことが多い。管楽器では、息で操作する電子的な吹奏楽器が独特の音色を担う。

和音には、ジャズ由来の四つの音の和音や、次々に調が変わる流れが使われる。ただし、難解さより爽快さが優先される。

リズムは、16分音符を細かく刻む型が基本とされる。ドラムは装飾を凝らし、ベースは弦を叩いて引っ張る奏法で、打楽器のように動くことが多い。

テンポは中速から速めで、曲は5分前後のものが多いとされる。</p>
<h2>成り立ち</h2><p>1970年前後、アメリカではMiles Davisらが、電気楽器をジャズに取り入れた。これを受けて、日本の演奏者たちも同じ方向を探り始めた。

1970年代前半には、ロック側のサディスティック・ミカ・バンドや四人囃子などに、フュージョン的な要素が見られる。ジャズ側では、渡辺貞夫が1969年の『パストラル』から、ジャズを超えた音作りに取り組んだ。その代表的なフュージョン作は、1978年の『カリフォルニア・シャワー』だ。渡辺香津美は1971年にデビューした。日野皓正は1970年代前半にはファンクやフリー・ジャズへ向かい、1970年代後半からはフュージョンにも挑んだ。1979年の『City Connection』は、その時期の作品だ。

東京には、腕の立つスタジオ・ミュージシャンが数多くいた。1974〜75年に活動した「バンブー」(林立夫、村上&quot;ポンタ&quot;秀一ら)のような顔ぶれの活躍が、このスタイルの演奏水準を支えたと指摘されることがある。

やがて、この分野の二つの大きな柱とされるバンドが現れる。Casiopeaは1976年に結成された（1990年代以降は1977年が公式な結成年とされる）。同じ1976年にはTHE SQUAREも結成され、1978年にデビューした。米国展開を機にT-SQUAREへ改名し、日本でT-SQUAREの名前になったのは1989年からだ。

彼らの音楽は、ジャズの聴衆だけでなく、若い一般の聴き手にも届いた。テレビやFM放送が、認知を広げる助けになった。とりわけ1987年にTHE SQUAREが発表した楽曲が自動車競技の中継に使われたことで、この音楽は日本人の耳に深く刻まれた。高中正義や松岡直也といった演奏者も、それぞれ南国的な色彩やラテン音楽の要素を持ち込み、独自の位置を占めている。

しかし、この分野は長らく、批評の世界では軽く見られてきたとされる。演奏が整いすぎていて、ジャズが本来持つ即興の緊張や危うさに欠ける、という批判である。実際、アメリカのフュージョンと比べると、先が読める作りだという指摘には、当たっている面もある。

それでも近年、動画共有を通じて、この時期の日本の音楽が海外で再発見された。その演奏水準と楽曲の完成度は、驚きをもって受け止められた。シティポップの国際的な再評価とも重なり、現在では独自の達成として認められつつある。</p>
