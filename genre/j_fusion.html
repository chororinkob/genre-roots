<h1>J-Fusion（ジェイフュージョン）とは</h1>
<p>1970年代後半から1980年代の日本で発達した、演奏技術の高さと明快さを両立させたインストゥルメンタル音楽である。アメリカのフュージョンを出発点としながら、独自の性格を持つに至った。第一の特徴は演奏の精度である。四人から五人の編</p>
<p>1970年代後半から1980年代の日本で発達した、演奏技術の高さと明快さを両立させたインストゥルメンタル音楽である。アメリカのフュージョンを出発点としながら、独自の性格を持つに至った。第一の特徴は演奏の精度である。四人から五人の編成が、極めて複雑な音型を一糸乱れず合奏することが最大の聴きどころとされ、揺らぎや粗さは徹底して排除される。第二に旋律の性格で、アメリカのフュージョンが即興と和声の探求に傾いたのに対し、こちらは明るく覚えやすい旋律を主役に据える。長調の伸びやかな線が多く、歌のないインストゥルメンタルでありながら口ずさめる曲が多い。リズムは16分音符を細かく刻む型が基本で、ドラムは装飾を凝らし、ベースは弦を叩き引っ張る奏法で打楽器的に動く。ギターはコーラス効果をかけた澄んだ音色で速い単音を弾き、鍵盤にはアナログとデジタルの両方のシンセサイザーが用いられる。管楽器では、息で操作する電子的な吹奏楽器が独特の音色を担う。和声はジャズ由来の四和音や、次々に転調する進行が用いられるが、難解さより爽快さが優先される。テンポは中速から速く、曲は5分前後である。</p>
<h2>成り立ち</h2><p>1970年前後、アメリカでMiles Davisらが電気楽器をジャズへ導入したことを受けて、日本の演奏者たちも同じ方向を模索し始めた。1970年代前半には渡辺香津美や日野皓正といった演奏者が、ジャズとロックの融合を試みている。この時期の日本には、決定的に有利な条件があった。すなわち、高度経済成長を経て録音の予算が潤沢であり、また東京には一日に複数の録音を掛け持ちする一流の職業演奏家の層が厚く存在していたのである。この演奏技術の水準の高さが、後の様式の性格を決めた。1976年に結成されたCasiopeaと、1978年に結成されたT-SQUAREが、この分野の二つの大きな柱となる。両者は演奏の精度と楽曲の明快さを競い合い、その競争が全体の水準を押し上げた。彼らの音楽は、ジャズの聴衆だけでなく、若い一般の聴き手にも届いた。この普及に決定的だったのがテレビである。番組の主題歌や背景音楽として大量に用いられ、とりわけ1987年にT-SQUAREが発表した楽曲が自動車競技の中継に採用されたことで、この音楽は日本人の耳に深く刻まれた。高中正義や松岡直也といった演奏者も、それぞれ南国的な色彩やラテン音楽の要素を持ち込んで独自の位置を占めている。この分野は長らく批評的には軽んじられてきた。演奏が整いすぎており、ジャズが本来持つ即興の緊張や危うさを欠いているという批判である。実際、アメリカのフュージョンと比べると、予定調和的だという指摘は当たっている面もある。しかし2010年代以降、動画共有を通じてこの時期の日本の音楽が海外で再発見されると、その演奏水準と楽曲の完成度が驚きをもって受け止められた。シティポップの国際的な再評価とも重なり、現在では独自の達成として認められつつある。</p>
