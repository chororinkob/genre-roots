<h1>J-Fusion（ジェイフュージョン）とは</h1>
<p>1970年代後半から1980年代の日本で発達した、演奏技術の高さと分かりやすさを両立させたインストゥルメンタル音楽である。アメリカのフュージョンを出発点としながら、独自の性格を持つに至った。第一の特徴は演奏の正確さである。4人から</p>
<p>1970年代後半から1980年代の日本で発達した、演奏技術の高さと分かりやすさを両立させたインストゥルメンタル音楽である。アメリカのフュージョンを出発点としながら、独自の性格を持つに至った。第一の特徴は演奏の正確さである。4人から5人の編成が、とても複雑なフレーズを一糸乱れず合奏することが最大の聴きどころとされ、揺らぎや粗さは徹底して排除される。第二に旋律の性格で、アメリカのフュージョンが即興と和音の探求に傾いたのに対し、こちらは明るく覚えやすいメロディーを主役にする。長調の伸びやかな線が多く、歌のないインストゥルメンタルでありながら口ずさめる曲が多い。リズムは16分音符を細かく刻む型が基本で、ドラムは装飾を凝らし、ベースは弦を叩き引っ張る奏法で打楽器的に動く。ギターはコーラス効果をかけた澄んだ音色で速い単音を弾き、鍵盤にはアナログとデジタルの両方のシンセサイザーが用いられる。管楽器では、息で操作する電子的な吹奏楽器が独特の音色を担う。和音はジャズ由来の四つの音の和音や、次々に調が変わる流れが使われるが、難解さより爽快さが優先される。テンポは中速から速く、曲は5分前後である。</p>
<h2>成り立ち</h2><p>1970年前後、アメリカでMiles Davisらが電気楽器をジャズへ導入したことを受けて、日本の演奏者たちも同じ方向を模索し始めた。1970年代前半には、ロック側のサディスティック・ミカ・バンドやティン・パン・アレー、4人囃子らが、ジャズ側では渡辺貞夫(1969年『パストラル』)らが先行して、フュージョン的な音を取り入れた。渡辺香津美は1971年にデビューし、日野皓正は1970年代前半にはファンクやフリー・ジャズへ向かい、フュージョンでの成功は1979年の『City Connection』だった。東京には腕の立つスタジオ・ミュージシャンの層が厚く、1975年の「バンブー」(林立夫、村上&quot;ポンタ&quot;秀一ら)のような顔ぶれが活躍したことが、この様式の演奏水準を支えたと指摘されることがある。1976年に結成されたCasiopeaと、同じ1976年にTHE SQUAREとして結成され、1978年にデビューしたT-SQUARE(1989年にT-SQUAREへ改名)が、この分野の二つの大きな柱となる。両者は演奏の精度と楽曲の明快さを競い合い、その競争が全体の水準を押し上げた。彼らの音楽は、ジャズの聴衆だけでなく、若い一般の聴き手にも届いた。この普及に決め手になったのがテレビである。番組の主題歌や背景音楽として大量に用いられ、とりわけ1987年にTHE SQUAREが発表した楽曲が自動車競技の中継に採用されたことで、この音楽は日本人の耳に深く刻まれた。高中正義や松岡直也といった演奏者も、それぞれ南国的な色彩やラテン音楽の要素を持ち込んで独自の位置を占めている。この分野は長らく批評的には軽んじられてきた。演奏が整いすぎており、ジャズが本来持つ即興の緊張や危うさを欠いているという批判である。実際、アメリカのフュージョンと比べると、先が読める作りだという指摘は、当たっている面もある。しかし2010年代以降、動画共有を通じてこの時期の日本の音楽が海外で再発見されると、その演奏水準と楽曲の完成度が驚きをもって受け止められた。シティポップの国際的な再評価とも重なり、現在では独自の達成として認められつつある。</p>
<h2>代表曲</h2><ul><li>Omens of Love (T-SQUARE)</li><li>Brasilian Skies (高中正義)</li><li>Asayake (カシオペア)</li><li>California Shower (渡辺貞夫)</li><li>Saudade (高中正義)</li><li>Sky So High (Casiopea)</li><li>Looking Up (Casiopea 3rd)</li><li>Azzurro (T-SQUARE)</li><li>Karma (Prism)</li><li>Magic Ray (Casiopea)</li><li>Take Me (Casiopea 3rd)</li></ul>
