<h1>Bro-Country（ブロカントリー）とは</h1>
<p>2010年代前半のアメリカで主流となった、カントリーにロックとヒップホップの要素を混ぜた商業的な様式。ギターは歪ませたエレキギターが前面に出て、アリーナロックのような分厚いパワーコードのリフを弾き、そこにバンジョーやスチールギター</p>
<p>2010年代前半のアメリカで主流となった、カントリーにロックとヒップホップの要素を混ぜた商業的な様式。ギターは歪ませたエレキギターが前面に出て、アリーナロックのような分厚いパワーコードのリフを弾き、そこにバンジョーやスチールギターが記号的に少しだけ加わる。ドラムは打ち込みで補強され、キックは重く、手拍子やスネアの連打といったヒップホップ由来の処理が施される。テンポは毎分100から130拍程度で、四つ打ちに近い明快なリズムが多い。和音は三つか四つの長調の和音の反復で、転調はほとんどない。歌唱は南部訛りを強調した男性の低い声で、サビでは複数の声を重ねて合唱にする。曲の構成にはヒップホップの影響が強く、語るように言葉を詰め込むヴァースと、旋律的に開けるサビの対比で作られている。決定的なのは歌詞で、ピックアップトラック、冷えたビール、川辺やあぜ道での夜、ショートパンツ姿の若い女性、日焼け、南部への誇りといった要素が、ほぼ定型として組み合わされる。従来のカントリーが失恋や貧困、労働、家族といった生活の重みを歌ってきたのに対し、こちらは若い男性の享楽に主題を限定した点が最大の違いであり、そのことが激しい論争を呼んだ。演奏の場は大規模な野外フェスとスタジアムである。</p>
<h2>成り立ち</h2><p>土台は1990年代にできていた。Garth Brooksがロックの演出をカントリーに持ち込んでスタジアムを埋め、2000年代にはBig and RichやKenny Chesneyが、遊びとパーティーを主題にしたカントリーで市場を作っていた。決定的な転換は2010年で、この年Jason Aldeanが『Dirt Road Anthem』を発表した。もともとColt Fordが書いたこの曲は、カントリーの歌にラップの語りを組み込んだもので、2011年に大ヒットして以後の方向を決めた。2012年、Florida Georgia Lineの『Cruise』が登場する。この曲は最終的に1000万枚以上を売り、カントリー史上最大級の売上となったが、それを可能にしたのはラッパーNellyを迎えたリミックス版で、カントリーとヒップホップの融合が商業的に成立することを証明した。同じ頃Luke Bryan、Blake Shelton、Thomas Rhett、Chase Riceらが続き、ラジオ局の選曲はこの様式で埋め尽くされた。名称を与えたのは2013年、批評家のJody Rosenがニューヨーク誌に書いた記事で、彼はこれを男子学生の社交クラブ的なカントリーだと評した。批判はすぐに広がった。歌詞における女性の描き方が、名前も人格もない身体としてのみ扱われるという指摘が相次ぎ、ベテラン歌手のAlan Jacksonやカントリー界の重鎮たちも公然と苦言を呈した。2014年、Maddie and Taeが『Girl in a Country Song』でこの様式を正面から皮肉り大ヒットさせた。さらに深刻だったのが、女性歌手がラジオでほとんどかからなくなる現象で、2015年にはあるラジオ業界の助言者が、女性歌手をサラダに例えて主役にするなと発言し、大炎上した。2015年頃を境にこの様式は下火となり、Chris Stapletonのような伝統回帰の流れに主役の座を明け渡した。</p>
<h2>代表曲</h2><ul><li>Cruise（Florida Georgia Line）</li><li>Country Girl (Shake It for Me)（Luke Bryan）</li><li>Dirt Road Anthem（Jason Aldean）</li><li>Boys 'Round Here（Blake Shelton）</li><li>That's My Kind of Night（Luke Bryan）</li></ul>
