<h1>Bro-Country（ブロカントリー）とは</h1>
<p>ブロ・カントリーは、カントリーにロックとヒップホップの要素を混ぜた、商業的なスタイルだ。2010年代前半のアメリカで主流となった。 ギターは、歪ませたエレキギターが前面に出る。ロック寄りの重いギターを弾き、そこにバンジョーが質感づ</p>
<p>ブロ・カントリーは、カントリーにロックとヒップホップの要素を混ぜた、商業的なスタイルだ。2010年代前半のアメリカで主流となった。

ギターは、歪ませたエレキギターが前面に出る。ロック寄りの重いギターを弾き、そこにバンジョーが質感づけに使われる例が多い。和音は、単純なコード進行の反復が中心で、長調が多い。

ドラムは打ち込みで補強され、ヒップホップ風のリズム処理が施される。テンポはミッドテンポで、バックビート（2拍目と4拍目を強調する拍）を基本とした、明快なリズムが多い。

歌唱は南部訛りで、サビでは複数の声を重ねて合唱にする。曲の構成にはヒップホップの影響が強い。語るように言葉を詰め込むヴァース（歌の節）と、旋律的に開けるサビの対比で作られている。

決定的なのは歌詞だ。ピックアップトラック、冷えたビール、川辺やあぜ道での夜、ショートパンツ姿の若い女性、日焼け、南部への誇りといった要素が、ほぼ定型として組み合わされる。従来のカントリーは、失恋や貧困、労働、家族といった生活の重みを歌ってきた。それに対し、こちらは若い男性の享楽に主題を限定した点が最大の違いとされ、そのことが激しい論争を呼んだ。アリーナやフェスの大舞台を想定した作りである。</p>
<h2>成り立ち</h2><p>一部の論者は、1990年代にGarth Brooksがカントリーに持ち込んだアリーナ・ロック的な演出や、2000年代のBig &amp; RichとKenny Chesneyのパーティー路線を先駆と見る。前史は2005年のTrace Adkinsの「Honky Tonk Badonkadonk」などにあり、2010年代前半に勢いを増した。

2010年のアルバム『My Kinda Party』に、Jason Aldeanの『Dirt Road Anthem』が収められた。シングル発売は2011年4月だ。この曲は、もともとColt FordがBrantley Gilbertと共作し、2008年に録音した曲である。カントリーの歌にラップの語りを組み込んだ曲で、2011年に大ヒットし、後のブロ・カントリーの先行例の一つとなった。

2012年、Florida Georgia Lineの『Cruise』が登場する。この曲は、2016年11月時点で、米国で約760万枚を売った（RIAAのDiamond認定の1000万は、ストリーミング換算を含むユニット）。カントリー史上最大級の売上である。原曲は先にカントリー市場で1位になっており、ラッパーNellyを迎えたリミックス（別の人が作り直した）版（2013年）が、それを大きく後押しした。先行するDirt Road Anthemに続いて、カントリーとヒップホップの融合の商業性を示したのである。同時期にLuke Bryan、Jason Aldeanらがすでに人気を得ており、ラジオで大きな存在感を持った。

この語を最初に活字にしたのは2013年、批評家のJody Rosenがニューヨーク誌に書いた記事だ。彼はこれを、入れ墨を入れ、ジムで体を鍛えた、パーティー好きな若いアメリカ人の白人男性による、そしてその人たちのための音楽だと評した。

批判が広がった。歌詞における女性の描き方が、名前も人格もない身体としてのみ扱われるという指摘が相次いだ。Kenny Chesneyは2014年11月、Brad Paisleyは2014年12月、Steve Earleは2017年に苦言を呈した（Alan Jacksonは、ポップ寄りの現代カントリー全般を嘆いた）。2014年、Maddie &amp; Taeが『Girl in a Country Song』でこのスタイルを正面から皮肉り、大ヒットさせた。

さらに深刻だったのが、女性歌手の曲がラジオで少なくなる現象だ（Country Aircheckのチャートに入った女性単独名義の曲の割合が、2016年の13%から2017年の10.4%に低下）。2015年にはラジオ・コンサルタントのKeith Hillが、男性歌手をサラダのレタス、女性歌手をトマトにたとえ、大炎上した。

2015年頃には、このスタイルは衰えたとする見方と、なお人気だとする見方が併存した。2015年にChris Stapletonの『Traveller』が全米アルバムチャート1位になるなど、伝統に戻ろうとする流れも注目を集めた。</p>
