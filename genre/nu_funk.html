<h1>Nu Funk（ニューファンク）とは</h1>
<p>ヌー・ファンクは、1970年代のファンクの手ざわりを作り直した音楽だ。新しく録音した生演奏やアナログ録音による流れが主流で、サンプラー中心の制作もここに含める用法がある。 土台は往年のファンクそのままだ。1拍目を強く踏むワン・オン</p>
<p>ヌー・ファンクは、1970年代のファンクの手ざわりを作り直した音楽だ。新しく録音した生演奏やアナログ録音による流れが主流で、サンプラー中心の制作もここに含める用法がある。

土台は往年のファンクそのままだ。1拍目を強く踏むワン・オン・ザ・ワンのキック、16分音符で細かく刻むカッティングギター、クラビネットとホーンセクション、跳ねるスラップベースが並ぶ。

ただしサンプリング系の作品では、出音が当時と違う。低音がはるかに深く沈み、キックとスネアは圧縮で押しつぶされて前に出る。こうした作品では、サンプラーとデジタルの音の編集を使う。古いレコードから抜き出した2小節の断片を延々と繰り返し、そこに自分たちで演奏したホーンや鍵盤を重ねる方式が多い。

テンポは典型例で100前後から120 BPM程度で、踊れる速さに保たれる。

ヒップホップ以降の耳で作られているため、曲の展開は歌よりも、繰り返しと音の足し引きに重きがある。歌が入らず、インストで完結する曲も多い。

アナログテープやテープシミュレータを通した歪み、レコードの針音、わざと落とした音の細かさの粗さが、狙って古びた質感として加えられる。

原曲を知らない世代のクラブでかかるダンス音楽である。同時に、レコードを掘る文化と深くつながっている。復刻志向のレーベルでは、七インチのアナログ盤で発売されることが多い。</p>
<h2>成り立ち</h2><p>1980年代後半、純粋なファンクの商業的な勢いは弱まった。しかし皮肉なことに、ファンクはヒップホップのサンプリング素材として生き延びた。

1980年代のロンドンでは、中古レコード店やクラブで、忘れられたファンクの七インチ盤を掘り起こして踊らせるレア・グルーヴの文化が生まれた。そこから1980年代後半に、アシッド・ジャズが誕生した。1985年結成のJames Taylor QuartetやThe Brand New Heavies（米国での商業的ヒットは1991年、英国でのチャート入りは1992年、決定的な成功は1994年）などは、生演奏でファンクを再現する方向に進んだ。

1990年代半ば以降、deep funkの収集家のシーンを中心に、新しい流れが広がった。レアな45回転のファンクに影響を受けた新作を作る「ヌー・ファンク（funk revivalist）」のシーンである。ただし、その定義には諸説ある。

ニューヨークのDaptone Recordsは、アナログ・テープ中心（8トラック録音が増えているとされる）で新曲を録った。機材は新旧混在で、Sharon Jones and the Dap-KingsやThe Budos Bandがその代表とされる。一方で、サンプラーと現代のミックスを使って新旧を混ぜる側を、ヌー・ファンクと呼ぶ向きもある。

レーベルでは、米国のKay-Dee Records（Kenny Dopeが2003年に設立）、英国のBombstrikes（2004年設立）、Freestyle Records（2003年設立）などが、ファンク系の新録・再発・再ミックスを手がけた。ドイツのMr. Confuse、日本のOsaka Monaurailらも、同時期に各国で並行して現れた。オランダのKraak &amp; Smaakや、英国のThe Herbaliserも近い位置にいる。

2010年代には、ファンクらしい音の使い方が、広い舞台でも聴かれるようになった。Mark RonsonとBruno Marsの『Uptown Funk』(2014)は、全米1位を14週続ける世界的な大ヒットとなった。Daft Punkの『Random Access Memories』(2013)は、セッション・ミュージシャンの生演奏とNile Rodgersの参加で、ディスコとファンクを再訪した。

ただし、ヌー・ファンクという名は、他人が付けた呼び名に近いと見る向きもある。ファンク・ブレイクスといった呼び名とも重なり合っており、境目は今もあいまいだ。オリジナルの演奏者に印税が渡らないままサンプリングされてきた歴史には、批判もある。近年は、権利処理や共同名義での発表の例も見られる。</p>
