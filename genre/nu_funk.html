<h1>Nu Funk（ニューファンク）とは</h1>
<p>1970年代のファンクの手触りを、サンプリングと現代の録音技術で作り直した音楽。骨格は往年のファンクそのままで、一拍目を強く踏むワン・オン・ザ・ワンのキック、16分音符で細かく刻むカッティングギター、クラビネットとホーンセクション</p>
<p>1970年代のファンクの手触りを、サンプリングと現代の録音技術で作り直した音楽。骨格は往年のファンクそのままで、一拍目を強く踏むワン・オン・ザ・ワンのキック、16分音符で細かく刻むカッティングギター、クラビネットとホーンセクション、跳ねるスラップベースが並ぶ。ただし出音は当時と違い、低音がはるかに深く沈み、キックとスネアは圧縮で押しつぶされて前に出る。制作の中心はサンプラーとデジタル音響編集で、古いレコードから抜き出した二小節の断片を延々と繰り返し、そこに自分たちで演奏したホーンや鍵盤を重ねる方式が多い。テンポは毎分100前後から120拍程度で、踊れる速度に保たれる。ヒップホップ以降の耳で作られているため、曲の展開は歌よりも反復と抜き差しに重心があり、歌が入らずインストで完結する曲も多い。アナログテープやテープシミュレータを通した歪み、レコードの針音、意図的に落としたビットの粗さが、狙って古びた質感として加えられる。原曲を知らない世代のクラブでかかるダンス音楽であると同時に、レコードを掘る文化と密接につながっており、七インチのアナログ盤で発売されることが多い点も特徴である。</p>
<h2>成り立ち</h2><p>1980年代に主流から退いたファンクは、皮肉なことにヒップホップのサンプリング素材として生き延びた。1990年代、ロンドンの中古レコード店やクラブでは、忘れられたファンクの七インチ盤を掘り起こして踊らせるレア・グルーヴの文化が根づき、そこからJames Taylor QuartetやThe Brand New Heavies、いわゆるアシッド・ジャズ勢が生演奏によるファンク再現に向かった。2000年代に入ると、この動きは二方向に分かれる。ひとつはニューヨークのDaptone Recordsのように、1960年代の八トラック機材とテープだけを使って完全に当時の音で新曲を録る復刻派で、Sharon Jones and the Dap-KingsやThe Budos Bandがこの流れを代表した。もうひとつが、サンプラーと現代のミックスを堂々と使って新旧を混ぜる側で、これがヌー・ファンクと呼ばれるようになった。中心地はやはりロンドンとアムステルダムで、Kay-Deeレコード、Bombstrikes、Freestyle Recordsといったレーベルが受け皿となり、フランスのBreakbotやドイツのMr. Confuse、日本のOsakaMonaurailらが国境を越えて交流した。オランダのKraak &amp; SmaakやHerbaliserも近い位置にいる。2010年代にはこの語法がさらに広い舞台へ出て、Mark RonsonとBruno Marsの『Uptown Funk』(2014)が世界的な大ヒットとなり、Daft Punkの『Random Access Memories』(2013)がNile Rodgersを招いてディスコとファンクの再訪を大々的に行った。ただしヌー・ファンクという語は他称に近く、ファンク・ブレイクスやフューチャー・ファンクといった呼び名と重なり合っており、境界は今も曖昧である。オリジナルの演奏者に印税が渡らないままサンプリングされてきた歴史への批判もあり、近年は権利処理や共同名義での発表が増えている。</p>
