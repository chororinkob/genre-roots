<h1>Neo-Acoustic（ネオアコ）とは</h1>
<p>ネオアコは、アコースティック・ギターとエレキ・ギターを重ねる、繊細な英国風ギター・ポップだ。代表曲22曲を動画で聴け、ルーツと影響のつながりを地図でたどれる。</p>
<p>ネオアコは、アコースティック・ギターとエレキ・ギターを重ねる、繊細な英国風ギター・ポップだ。日本語の「ネオ・アコースティック」の略で、英語圏では通じない、日本だけの呼び名である。

中心になるのは6弦と12弦のエレキ・ギター、それにセミアコースティック・ギターとアコースティック・ギターだ。12弦のリッケンバッカーやセミアコを、ブリッジ寄りで細かく刻む。弦を鳴らし切らずに短く切る奏法が基本で、金属的な「ジャラン」という響きが出る。ベースは指弾きで丸い音、ドラムはハイハットを細かく刻む控えめな演奏だ。トランペットやフレンチホルン、弦楽器、ヴィブラフォンを彩りに足すバンドも多い。

和音は三和音を中心にした明るいメジャー・コードが多い。そこに7thやメジャー7thを足して、少しだけ翳りを混ぜる。メロディは3度や5度の跳躍を使うことが多く、狭い音域を行き来する。長調の曲でも最後に短調のコードを置き、明るさの中に寂しさを残す。

拍子は4分の4拍子が多く、テンポは中速域に集まることが多い。8分音符で弦を鳴らし続け、2拍目と4拍目をスネアで軽く弾ませる。タメやブレイクをほとんど作らず、前へまっすぐ進むのが特徴だ。16分音符の細かいカッティングでコードを刻む曲もある。

歌い方は力まない地声で、息を多めに混ぜる。ビブラートは控えめで、語尾を上げずに平坦に落とす。裏声やハモりを重ねる曲もあり、少年のような高さと、照れを隠すような淡々とした低さが同居する。

歌詞は恋と日常が中心だ。雨、自転車、海、手紙、写真、季節の変わり目といった具体物が細かく並ぶ。内面のためらいを言葉にすることが多い。英語詞が多く、皮肉や言葉遊びを軽く混ぜる曲もある。

曲はイントロのギター・フレーズで始まり、Aメロ、Bメロ、サビの順に進む型が多い。ギター・ソロは短いことが多い。最後はサビを繰り返さず、静かなコーダで終わる曲も珍しくない。

ジャングル・ポップやギターポップとほぼ同じ音を指すが、ネオアコはアコースティックとエレキの混在と、内省的な照れを重視する。パンクやハードロックのような歪みと速さはなく、シンセ・ポップのように打ち込みだけで組み立てることもない。レコード店の片隅、小さなライブハウス、雨の日の部屋、夜のドライブで鳴る音だ。</p>
<h2>成り立ち</h2><p>舞台は、1976年のスコットランド、グラスゴー郊外ベアーズデンだ。エドウィン・コリンズを中心に、のちのオレンジ・ジュースとなるバンドが動き出す。当初の名はヌーソニックスで、1979年にオレンジ・ジュースへ改名した。彼らはパンクの速さを捨て、アコースティック・ギターの軽い刻みとソウルの節回しを持ち込んだ。

同じ1979年、グラスゴーでポストカード・レコードが設立される。アラン・ホーンが創業し、コリンズが協力したという見方もあるレーベルで、第1弾はオレンジ・ジュースのシングルだった。同じころ、エディンバラではポール・ヘイグとロニー・トランスが1979年にTV Artを結成し、のちにマルコム・ロスらが加わってヨーゼフ・Kになる。1979年12月の「Chance Meeting」でデビューし、切り詰めたギターと跳ねるベースで独自の位置を占める。

ポストカードには、イースト・キルブライド出身のアズテック・カメラも加わった。中心人物のロディ・フレイムが曲を書き、ポストカードに加わったのは16歳のときで、1981年3月に「Just Like Gold」を発売した17歳のときにデビューした。しかしオレンジ・ジュースのポリドール移籍の直後、1981年にレーベルは活動を終えた。アズテック・カメラは1982年にラフ・トレードと契約した。

ロンドンでは、チェリー・レッドが動いていた。スタッフのマイク・オールウェイは、ポップで風変わりな才能を次々に紹介する。そのひとつが、1979年にウォリックシャーのウォーター・オートンで結成されたフェルトだ。フェルトはローレンスが率い、ギタリストのモーリス・ディーバンクの細い音色が特徴だった。1979年にローレンスが自主制作した「Index」を出し、1981年にはチェリー・レッド移籍後のバンドとして最初のシングル「Something Sends Me to Sleep」を出し、1982年に1stアルバム『Crumbling the Antiseptic Beauty』を出した。同じ1982年のコンピレーション『Pillows &amp; Prayers』に収めた「My Face Is on Fire」が評判を呼ぶ。1985年の「Primitive Painters」ではコクトー・ツインズのエリザベス・フレイザーがバッキング・ボーカルで参加し、全英インディー・チャート1位に達した。フェルトは1986年にクリエイション・レコードへ移り、10枚のシングルと10枚のアルバムを残して1989年に解散する。

やがて、この音は英国のチャートにも届く。1983年2月、オレンジ・ジュースの「Rip It Up」が全英8位に入った。1983年にはアズテック・カメラの『High Land, Hard Rain』、1983年6月にはロータス・イーターズの「The First Picture of You」が出る。1984年は当たり年で、3月にプリファブ・スプラウトの『Swoon』、4月にブルー・ナイルの『A Walk Across the Rooftops』、5〜6月にエヴリシング・バット・ザ・ガールの『Eden』、10月にロイド・コール&amp;ザ・コモーションズの『Rattlesnakes』が並ぶ。1985年にはプリファブ・スプラウトの『Steve McQueen』が出て、「When Love Breaks Down」が広く知られた。ザ・スミスは1982年に結成され、ジョニー・マーがリッケンバッカー330で作る細かいアルペジオが、この音の教科書になる。

音楽誌NMEのカセット『C86』は、読者が通信販売で購入したカセットだ。1986年5月発売で、同年11月24日にはラフ・トレードからLPになった。選曲はロイ・カー、ニール・テイラー、エイドリアン・スリルズである。このカセットは、ギターの刻みを中心にしたインディー・ポップの流れの代名詞になった。1987年にはブリストルでサラ・レコードが生まれ、クレア・ワッドとマット・ヘインズが小さなシングルを次々に出す。ザ・パステルズ、ティーンエイジ・ファンクラブ、ベル・アンド・セバスチャンは、この流れを次の世代へ渡した。

日本では、この音に別の名前がついた。「ネオ・アコースティック」という呼び名は和製英語で、英国では通じない。確認できる限り、1983年11月に徳間ジャパンから出たコンピレーション盤のライナーで「ネオ・アコースティック・ポップ」と書かれたのが最初である。1984年5月には『ギター・マガジン』が「ネオ・アコースティックとでも呼ぶべきサウンド」と紹介した。1985年2月の『フールズ・メイト』は「83年にはネオ・アコースティック・ブームとまで」と振り返り、同誌の1985年1月号には「モダン・アコースティック・サウンドが流行ったのはもう2年前」とある。英国での流行は、日本では早くも終わった扱いだった。

それでも、この音は日本で生き残った。1989年8月25日、小山田圭吾と小沢健二のフリッパーズ・ギターが『three cheers for our side〜海へ行くつもりじゃなかった』でデビューする。1990年5月5日の「恋とマシンガン」はTBSのドラマ『予備校ブギ』の主題歌になり、彼らはラジオや雑誌の連載で英国のバンドを紹介した。このとき「ネオアコ」という4文字の略称が一気に広がり、1990年代初頭の渋谷系の土台になった。

1990年代に入ると、京都で1985〜86年頃（公式表記は1988年）に結成されたb-flowerが自分たちの音として作り続けた。デボネアは1986年に大阪で結成され、1990年のライブ音源が残り、活動休止後に近年再始動した。カジヒデキはブリッジを経て1996年にソロデビューし、1997年の『MINI SKIRT』がオリコン4位に入る。渋谷のレコード店に通った世代が、この音を自分たちの言葉で作り直した。

ただし、この名前には無理もある。英国のバンド自身は、ポスト・パンク以後の動きの一つと言われており、ネオアコという言葉を使っていない。実際、オレンジ・ジュースは「Rip It Up」でディスコの影響を受けたダンサブルな曲を作っており、アコースティック1本のイメージとはずれる。フェルトでは1985年にギタリストのモーリス・ディーバンクが抜け、結果として10枚のシングルと10枚のアルバムを出して1989年に解散した。キーボードのマーティン・ダフィーは2022年に亡くなっている。

現在、この音は再評価の途中にある。2018年にはチェリー・レッドがフェルトの全10アルバムを再発し、2020年代には元メンバーが別名義で再会した。カジヒデキはソロデビュー30周年に、渋谷クラブクアトロで「MY FAVOURITE BLUE～カジヒデキ、ネオアコを歌う。」、ビルボードライブ東京で「カジヒデキ、渋谷系を歌う」と題した公演を開いた。小さな会場と中古盤の棚で、この音は今も鳴っている。</p>
