<h1>Neo-Acoustic（ネオアコ）とは</h1>
<p>ネオアコは、アコースティック・ギターとエレキ・ギターを同じ音量で重ねる、繊細な英国風ギター・ポップだ。代表曲22曲を動画で聴け、ルーツと影響のつながりを地図でたどれる。</p>
<p>ネオアコは、アコースティック・ギターとエレキ・ギターを同じ音量で重ねる、繊細な英国風ギター・ポップだ。日本語の「ネオ・アコースティック」の略で、英語圏では通じない日本だけの呼び名である。

中心になるのは6弦と12弦のエレキ・ギター、それにセミアコースティック・ギターとアコースティック・ギターだ。12弦のリッケンバッカーやセミアコを、ブリッジ寄りで細かく刻む。弦を鳴らし切らずに短く切る奏法が基本で、金属的な「ジャラン」という響きが出る。ベースは指弾きで丸い音、ドラムはハイハットを細かく刻む控えめな演奏だ。トランペットやフレンチホルン、弦楽器、ヴィブラフォンを彩りに足すバンドも多い。

和音は三和音を中心にした明るいメジャー・コードで、G、C、D、Aマイナー、Eマイナーを開放弦のまま鳴らす形が多い。そこに7thやメジャー7thを足して、少しだけ翳りを混ぜる。メロディは3度と5度の跳躍が多く、1オクターブ半ほどの狭い範囲を行き来する。長調の曲でも最後に短調のコードを置き、明るさの中に寂しさを残す。

拍子は4分の4拍子がほとんどで、テンポは100〜130 BPMの中速域に集まる。8分音符で弦を鳴らし続け、2拍目と4拍目をスネアで軽く弾ませる。タメやブレイクをほとんど作らず、前へまっすぐ進むのが特徴だ。16分音符の細かいカッティングでコードを刻む曲もある。

歌い方は力まない地声で、息を多めに混ぜる。ビブラートは控えめで、語尾を上げずに平坦に落とす。裏声やハモりを重ねる曲もあり、少年のような高さと、照れを隠すような淡々とした低さが同居する。

歌詞は恋と日常が中心だ。雨、自転車、海、手紙、写真、季節の変わり目といった具体物が細かく並ぶ。政治や社会への怒りはほとんど歌わず、内面のためらいを言葉にする。英語詞が基本で、皮肉や言葉遊びを軽く混ぜる曲もある。

曲はイントロのギター・フレーズで始まり、Aメロ、Bメロ、サビの順に進む型が多い。ギター・ソロは短く、2コーラス目のあとに一度だけ置かれる。最後はサビを繰り返さず、静かなコーダで終わる曲も珍しくない。

ジャングル・ポップやギターポップとほぼ同じ音を指すが、ネオアコはアコースティックとエレキの混在と、内省的な照れを重視する。パンクやハードロックのような歪みと速さはなく、シンセ・ポップのように打ち込みだけで組み立てることもない。レコード店の片隅、小さなライブハウス、雨の日の部屋、夜のドライブで鳴る音だ。</p>
<h2>成り立ち</h2><p>1970年代の終わり、スコットランドのグラスゴー郊外ベアーズデンで、エドウィン・コリンズを中心にオレンジ・ジュースが動き出す。前身はヌーソニックスというバンドで、1979年にオレンジ・ジュースへ改名した。彼らはパンクの速さを捨て、アコースティック・ギターの軽い刻みとソウルの節回しを持ち込んだ。

1980年、グラスゴーでポストカード・レコードが設立される。エドウィン・コリンズとアラン・ホーンが共同で立ち上げたレーベルで、第1弾はオレンジ・ジュースのシングルだった。同じ時期、エディンバラではポール・ヘイグとマルコム・ロスがヨーゼフ・Kを組んでいた。1979年12月の「Chance Meeting」でデビューし、切り詰めたギターと跳ねるベースで独自の位置を占める。

ポストカードには、イースト・キルブライド出身のアズテック・カメラも加わった。中心人物のロディ・フレイムは当時16歳で、1981年に「Just Like Gold」でデビューする。しかしポストカードは資金に行き詰まり、1981年には主要なバンドが相次いで離れ、レーベルはほどなく活動を止めた。オレンジ・ジュースはポリドールへ、アズテック・カメラはラフ・トレードへ移る。

ロンドンではチェリー・レッドが動いていた。スタッフのマイク・オールウェイは、ポップで風変わりな才能を次々に紹介する。その代表がモノクローム・セットであり、1979年にウォリックシャーのウォーター・オートンで結成されたフェルトだった。フェルトはローレンスが率い、ギタリストのモーリス・ディーバンクの細い音色が特徴だった。1981年に「Something Sends Me to Sleep」でデビューし、1982年に1stアルバム『Crumbling the Antiseptic Beauty』を出す。同じ1982年のコンピレーション『Pillows &amp; Prayers』に収めた「My Face Is on Fire」が評判を呼んだ。1985年の「Primitive Painters」ではコクトー・ツインズのエリザベス・フレイザーが歌い、全英インディー・チャート1位に達した。フェルトは1986年にクリエイション・レコードへ移り、10枚のシングルと10枚のアルバムを残して1989年に解散する。

一方、この音は英国のチャートにも届いた。1983年2月、オレンジ・ジュースの「Rip It Up」が全英8位に入る。1983年4月にはアズテック・カメラの『High Land, Hard Rain』、1983年6月にはロータス・イーターズの「The First Picture of You」が出た。1984年は当たり年で、3月にプリファブ・スプラウトの『Swoon』、5月にブルー・ナイルの『A Walk Across the Rooftops』とエヴリシング・バット・ザ・ガールの『Eden』、10月にロイド・コール&amp;ザ・コモーションズの『Rattlesnakes』が並んだ。1985年にはプリファブ・スプラウトの『Steve McQueen』が出て、「When Love Breaks Down」が広く知られる。ザ・スミスは1982年に結成され、ジョニー・マーがリッケンバッカー330で作る細かいアルペジオが、この音の教科書になった。

1986年、音楽誌NMEがカセット『C86』を付録につけた。選曲はロイ・カー、ニール・テイラー、エイドリアン・スリルズである。このカセットが引き金になり、ギターの刻みを中心にしたインディー・ポップが一つの流れになった。1987年にはブリストルでサラ・レコードが生まれ、クレア・ワッドとマット・ヘインズが小さなシングルを次々に出した。ザ・パステルズ、ティーンエイジ・ファンクラブ、ベル・アンド・セバスチャンは、この流れを次の世代へ渡した。

日本では、この音に別の名前がついた。「ネオ・アコースティック」という呼び名は和製英語で、英国では通じない。確認できる限り、1983年11月に徳間ジャパンから出たコンピレーション盤のライナーで「ネオ・アコースティック・ポップ」と書かれたのが最初である。1984年5月には『ギター・マガジン』が「ネオ・アコースティックとでも呼ぶべきサウンド」と紹介した。1985年2月の『フールズ・メイト』は「83年にはネオ・アコースティック・ブームとまで」と振り返っており、同誌の1985年1月号には「モダン・アコースティック・サウンドが流行ったのはもう二年前」とある。英国での流行は、日本では早くも終わった扱いだった。

それでも、この音は日本で生き残った。1989年8月25日、小山田圭吾と小沢健二のフリッパーズ・ギターが『three cheers for our side〜海へ行くつもりじゃなかった』でデビューする。1990年5月5日の「恋とマシンガン」はTBSのドラマ『予備校ブギ』の主題歌になり、彼らはラジオや雑誌の連載で英国のバンドを紹介した。このとき「ネオアコ」という4文字の略称が一気に広がり、1990年代初頭の渋谷系の土台になった。

1990年代に入ると、京都で1985年に結成されたb-flowerや、関西のデボネアが自分たちの音として作り続けた。カジヒデキはブリッジを経て1996年にソロデビューし、1997年の『MINI SKIRT』がオリコン4位に入る。渋谷のレコード店に通った世代が、この音を自分たちの言葉で作り直した。

ただし、この名前には無理もある。英国のバンド自身は自分たちをポスト・パンクと呼んでおり、ネオアコという言葉を使っていない。実際、オレンジ・ジュースは「Rip It Up」でディスコの影響を受けたダンサブルな曲を作っており、アコースティック一本のイメージとはずれる。フェルトのローレンスは「10枚のシングルと10枚のアルバム」と宣言して実際に完遂し、1985年にはギタリストのモーリス・ディーバンクが抜けた。キーボードのマーティン・ダフィーは2022年に亡くなっている。

現在、この音は再評価の途中にある。2018年にはチェリー・レッドがフェルトの全10アルバムを再発し、2020年代にも再結成や来日公演の知らせが続く。カジヒデキはソロデビュー30周年に「ネオアコを歌う」と題した公演を渋谷クラブクアトロとビルボードライブ東京で開いた。小さな会場と中古盤の棚で、この音は今も鳴っている。</p>
