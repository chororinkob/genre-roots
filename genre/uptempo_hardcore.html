<h1>Uptempo（アップテンポハードコア）とは</h1>
<p>アップテンポは、ハードコアの中でも高速な種類（約185〜220BPM）に入る音楽だ。テンポは185〜220 BPM（または200以上）とされる。非常に速く、キックが連続して聴こえる。 中心になる音は、歪ませたキックドラムだ。元の音</p>
<p>アップテンポは、ハードコアの中でも高速な種類（約185〜220BPM）に入る音楽だ。テンポは185〜220 BPM（または200以上）とされる。非常に速く、キックが連続して聴こえる。

中心になる音は、歪ませたキックドラムだ。元の音を何段階も歪ませて、組み立て直す。キックの音は、頭の打撃音と、そのあとに続く、音程を持った減衰部分（音がだんだん消えていく部分）でできている。この減衰部分に音階を割り当てて、キックだけで旋律を作ることもある。

旋律は最小限だ。キックの音程変化や、高音の金属的な主旋律音が、旋律の役割を担う。上物（キックやベース以外の、上に重ねる音）は極端に少ない。置かれるのは、金属的な刺し、警報音、加工した叫び声、そして映画からの断片だ。

キックは1拍ごとに踏む四つ打ちで走る。ただし、拍を細かく割った連打や、二つ三つを詰めて置く変則的な配置もよく使われる。

声は、省くか控えめに使うとされる。使う時は絶叫や低い語りで、暴力的あるいは終末的な言葉が使われる。

曲の組み立ては、キックが走る部分と、すべての音が抜けて緊張を溜める部分の繰り返しだ。その落差だけで曲ができている。

演奏の場は、オランダやベルギー、ドイツの大型イベントだ。観客は、極端に速い足踏みの踊りを踊る。音楽的な情報量を極限まで削ぎ落とし、速さと圧力だけで成り立たせる点が、この音楽の本質である。</p>
<h2>成り立ち</h2><p>アップテンポの系譜は、オランダとベルギーにある。

1990年代のガバは、140〜190 BPMほどだった。テラーコアやスピードコアは、1990年代前半〜中頃にはすでにあった。アップテンポは、諸説あるが、2010年代前半〜中頃に、主流ハードコアの高速化から独立した。

2000年代半ば、ハードコアの主流は、160から180 BPM程度のミレニアム・ハードコアに落ち着いていた。より重く、聴きやすい音だ。しかし若い作り手たちは、この遅さに満足しなかった。

アップテンポの起点とされるのはPartyraiserだが、定説とまでは言えない。彼は2004年頃から、ハードコアのレコードの速いB面を中心にセットを組んだ。このやり方は「Partyraiser style」と呼ばれ、2012年頃に「uptempo」という名前が定着したとされる。そして2012年から15年頃に、今の形が固まった。

一方、The Sickest Squad（イタリアのデュオ）とDr. Peacock（オランダのフレンチコアDJ）は、主にフレンチコアの人物である。アップテンポとフレンチコアは隣り合うジャンルで、同じイベントに出演した。アップテンポの形成の中心にいたのは、Partyraiser、F. Noize、Destructive Tendencies、DRS、Sjammienators、そしてN-Vitralらである。Tha Watcherは、ハードコア、フレンチコア、ハードスタイルなどを横断して活動する盛り上げ役で、アップテンポのイベントにも出演する。N-Vitralは、インダストリアル・ハードコアの作り手とされる主要アーティストの一人だ。

2016年からは、アイントホーフェンで、アップテンポ・ハードコアを中心とするイベントSnakepitが始まった。このイベントは、のちにDominatorにも出展した。2010年代後半〜2020年代には、Triple SixやBarbaric Recordsなどの専門レーベルが受け皿になった。

欧州の外でも、日本のレーベルからアップテンポの作品が出ており、イスラエルのテルアビブでもイベントが開かれている。フレンチコアとの相互交流も進んだ。大型イベントでの人気は、今も衰えていない。</p>
