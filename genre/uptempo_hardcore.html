<h1>Uptempo（アップテンポハードコア）とは</h1>
<p>ハードコア・テクノの中でも最も速く、最も歪んだ領域に位置する様式。テンポは毎分190から240拍程度、時にそれ以上に達し、拍を個別に数えることはほぼ不可能になる。核となるのは歪ませたキックドラムで、原音を何段階も歪ませて再構成し、</p>
<p>ハードコア・テクノの中でも最も速く、最も歪んだ領域に位置する様式。テンポは毎分190から240拍程度、時にそれ以上に達し、拍を個別に数えることはほぼ不可能になる。核となるのは歪ませたキックドラムで、原音を何段階も歪ませて再構成し、頭の打撃音と、その後に続く音程を持った減衰部分から成る。この減衰部分に音階を割り当てることで、キックだけで旋律を作ることも行われる。キックは四つ打ちで走るが、しばしば拍を細かく割った連打や、二つ三つを詰めて置く変則的な配置が用いられる。上物は極端に少なく、金属的な刺し、警報音、加工した叫び声、そして映画やニュースからの断片が置かれる。和音や旋律的な展開は基本的に存在しない。曲の構成は、キックが走る部分と、すべてが抜けて緊張を溜める部分の反復で、その落差だけで組み立てられる。声は絶叫や低い語りで、暴力的あるいは終末的な文言が用いられる。演奏の場はオランダやベルギー、ドイツの大型催しで、観客は極端に速い足踏みの踊りを行う。音楽的な情報量を極限まで削ぎ落とし、速度と圧力だけで成立させる点が本質である。</p>
<h2>成り立ち</h2><p>系譜はオランダとベルギーにある。1990年代のガバは毎分180拍前後だったが、1990年代末から2000年代にかけて、より速い領域を追う一派が現れた。当時これはテラーコアやスピードコアと呼ばれ、極端な速度そのものが目的だった。2000年代半ば、ハードコアの主流は毎分150から170拍程度の、より重く聴きやすいミレニアム・ハードコアへ落ち着いていたが、その一方で若い作り手たちは、この遅さに満足しなかった。2010年前後、オランダのAngerfist周辺や、より速い作り手たちが集まり、2012年から15年頃に現在の形が固まる。中心にいたのはPartyraiser、Sjammienators、The Sickest Squad、Dr. Peacock、そしてN-Vitral、Tha Watcherらである。とりわけN-Vitralは、キックの設計を突き詰めてこの様式の音を定義した。決定的だったのは催しの構造で、オランダのMasters of HardcoreやDominatorといった大型の催しが、この速い音のための独立した演目を設けたことにより、聴衆と市場が確立した。レーベルではTriple Six、Masters of Hardcore、Barbarixが受け皿となった。2010年代後半には、この様式がヨーロッパ全域とイスラエル、日本にも広がり、フレンチコアやローとの相互交流が進んだ。ただし批判も存在する。速度と歪みの追求が極まった結果、音楽的な多様性が失われ、どの曲も同じに聞こえるという指摘が内部から繰り返され、また極端な音量と速度が聴覚に与える影響についても議論がある。それでも大型催しでの人気は衰えていない。</p>
<h2>代表曲</h2><ul><li>Sound Becomes One（Partyraiser &amp; Destructive Tendencies）</li><li>Bassface（Andy the Core）</li><li>Street Fighter（Angerfist &amp; Miss K8）</li></ul>
