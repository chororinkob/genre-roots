<h1>Uptempo（アップテンポハードコア）とは</h1>
<p>ハードコアの高速系（約185〜220BPM）に位置する様式。テンポは毎分185〜220拍（または200以上）とされ、拍を個別に数えることはほぼ不可能になる。核となるのは歪ませたキックドラムで、原音を何段階も歪ませて再構成し、頭の打</p>
<p>ハードコアの高速系（約185〜220BPM）に位置する様式。テンポは毎分185〜220拍（または200以上）とされ、拍を個別に数えることはほぼ不可能になる。核となるのは歪ませたキックドラムで、原音を何段階も歪ませて再構成し、頭の打撃音と、その後に続く、音程を持った減衰部分（音がだんだん消えていく部分）から成る。この減衰部分に音階を割り当てることで、キックだけで旋律を作ることも行われる。キックは1拍ごとに踏む四つ打ちで走るが、しばしば拍を細かく割った連打や、二つ三つを詰めて置く変則的な配置が用いられる。上物（キックやベース以外の、上に重ねる音）は極端に少なく、金属的な刺し、警報音、加工した叫び声、そして映画やニュースからの断片が置かれる。和音や旋律的な展開は基本的に存在しない。曲の構成は、キックが走る部分と、すべてが抜けて緊張を溜める部分の反復で、その落差だけで組み立てられる。声は絶叫や低い語りで、暴力的あるいは終末的な文言が用いられる。演奏の場はオランダやベルギー、ドイツの大型催しで、観客は極端に速い足踏みの踊りを行う。音楽的な情報量を極限まで削ぎ落とし、速度と圧力だけで成立させる点が本質である。</p>
<h2>成り立ち</h2><p>系譜はオランダとベルギーにある。1990年代のガバは毎分140〜190拍ほどだったが、テラーコアやスピードコアは1990年代前半にすでにあり、アップテンポは2010年代前半に、主流ハードコアの高速化から独立した。2000年代半ば、ハードコアの主流は毎分160から180拍程度の、より重く聴きやすいミレニアム・ハードコアへ落ち着いていたが、その一方で若い作り手たちは、この遅さに満足しなかった。2010年前後、オランダのAngerfist周辺や、より速い作り手たちが集まり、2012年から15年頃に現在の形が固まる。中心にいたのはPartyraiser、Sjammienators、The Sickest Squad（イタリアのデュオ）、Dr. Peacock（オランダのフレンチコアDJ）、そしてN-Vitral、Tha Watcherらである。N-Vitralは歪んだキックの設計で知られる主要アーティストの一人である。アップテンポ専門のイベントSnakepit（2016年〜、アイントホーフェン）が成立し、のちにDominatorにも出展した。2010年代後半〜2020年代にかけて、Triple Six、Barbaric Recordsなどの専門レーベルが受け皿となった。日本やイスラエルなど欧州外にもシーンがある。フレンチコアやローとの相互交流が進んだ。大型催しでの人気は衰えていない。</p>
<h2>代表曲</h2><ul><li>Trip to Valhalla (Dr. Peacock)</li><li>Mother Earth (Dr. Peacock &amp; Billx)</li><li>Street Fighter (Angerfist)</li><li>Sound Becomes One（Partyraiser &amp; Destructive Tendencies）</li><li>La Familia (Dr. Peacock)</li><li>Incoming (Dr. Peacock &amp; Sefa)</li><li>Wake Up! (Dr. Peacock)</li><li>L.P.A. (Losse Polsjes Anthem) (Akimbo &amp; Missy)</li><li>Hard Bass (Angerfist)</li><li>ORDER (Unexist &amp; Art of Fighters)</li><li>Bass in Your Face (Andy The Core)</li></ul>
