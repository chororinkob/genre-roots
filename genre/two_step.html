<h1>2-Stepとは</h1>
<p>UKガラージの中でも、四つ打ちを放棄して、拍の骨格そのものを崩したスタイルだ。 名称の通り、1小節の中でキックが2回だけ鳴る。それも、1拍目と、3拍目の少し手前や後ろにずれた位置に置かれる。この結果、聴き手は拍の頭を掴みかけては外</p>
<p>UKガラージの中でも、四つ打ちを放棄して、拍の骨格そのものを崩したスタイルだ。

名称の通り、1小節の中でキックが2回だけ鳴る。それも、1拍目と、3拍目の少し手前や後ろにずれた位置に置かれる。この結果、聴き手は拍の頭を掴みかけては外され、身体が前後に揺れる。独特の歩行感が生まれる。テンポはおおむね130BPM前後。

ドラムの細部も特徴的だ。スネアまたはリムショット（太鼓の縁を叩く音）は、2・4拍付近に置かれることが多い。ただし、オフビートの配置も特徴とされる。その周囲に、ゴーストノート（弱く叩く装飾音）を散らして、揺れを増幅する曲もある。ハイハットは均等に刻まない。傾向として、打点ごとに音量と定位（左右の位置）を変えることが多く、シェイカーやコンガの断片を混ぜて、有機的な質感を作る。

ベースは、サブベース（体に響く極低音）の帯域の丸い音だ。キックが抜けた位置を埋めるように、短く置かれることが多い。

上物（メロディーなど上に重ねる音）は、R&amp;Bやソウルのヴォーカルを細切れにして音程をずらしたものが中心だ。Fender Rhodes風の柔らかい和音や、弦楽器のサンプルも使われる。和声（コードの響き）は、メジャーセブンスや9thの穏やかな響きが好まれる傾向がある。

ヴォーカルが入る場合は、女性歌手のなめらかな歌唱が多い。コーラス部分では、素直な歌もの構成になる。曲は4分から6分ほどのことが多く、DJ向けのイントロとアウトロを備える。

UKガラージ全般の中で、洗練された甘い方向を担うと言われる。後のダブステップやフューチャーガラージが直接受け継いだ、リズムの原型でもある。</p>
<h2>成り立ち</h2><p>1990年代半ば〜後半(英国での転機は1997年)のロンドンで、UKガラージの内部から分岐した。

転機となったのは、アメリカのR&amp;B歌手Tina Mooreの1995年の曲「Never Gonna Let You Go」だとされる。シカゴのKelly Gが手がけ、1995年の米国盤に収録されていたリミックスを、1997年に英国で再発すると、全英7位になった。このリミックスでは、四つ打ちのキックが取り払われた。代わりに、ずれた2拍のキックと、シンコペーション（拍をずらして強調するリズム）するパーカッションが置かれた。これがロンドンのクラブで爆発的な反応を得て、最初期の例の一つとして挙げられることが多い。

背景には、スピード・ガラージから2ステップへ移る中で、R&amp;B風のヴォーカルが取り入れられ、ドラムのパターンが変わったことがある。制作は、ロンドンを中心に、サウサンプトンやマンチェスターなど各地の若い制作者たちが担った。MJ Coleのように、寝室でサンプラーなどを使って作った例もある。Steve Gurleyは、ジャングル制作者からの転向組として重要な役割を果たした。Zed BiasやEl-Bらが、独自の解釈を加えた。

1999年に、Artful Dodgerが「Re-Rewind (The Crowd Say Bo Selecta)」を発表した。当時無名だったCraig Davidが歌ったことで全英2位を記録し、2ステップが大衆音楽として認知された。Craig Davidは、2000年のアルバム「Born to Do It」で世界的に成功した。しかしその後、『Bo' Selecta!』で繰り返しパロディの対象となり、本人は「真剣に受け取られなくなった」と述べている。2009年からマイアミに住んだが、本人は番組から逃れるための移住だったことを否定している。

同時期に、Sweet Female Attitude「Flowers」、Shanks &amp; Bigfoot「Sweet Like Chocolate」(1999年全英1位)、MJ Cole「Sincere」がヒットした。MJ Coleは、オーボエとピアノの古典的訓練を受けた制作者で、Royal College of Music(王立音楽大学)のジュニア部門で学んだ経歴を持つ。海賊放送のRinse FMやDeja Vu FMが、普及を支えた。

2001年以降、So Solid Crewの暴力事件と警察の対応(ツアー中止・出演不許可)による悪評が、UKガラージ全体への逆風の一因となった。ジャンルは主流からアンダーグラウンドへ後退した。しかし、そのリズムは複数の後継へ受け継がれた。ダブステップは、2ステップのR&amp;B色を削ぎ、サブベースを前面に出した。グライムは、UKガラージから発展し、ジャングルやダンスホール、ヒップホップの影響も受けた。

2000年代後半（2006〜2007年）には、Burial(William Bevan)が、2007年の「Untrue」で、劣化した2ステップのリズムと切り刻んだ声を、廃墟のような音響で示した。批評的に極めて高い評価を得て、2ステップを郷愁と喪失の音楽として再定義した。以後、Mount Kimbieはポスト・ダブステップ、Jamie xxとDisclosureはUKガラージ/ハウスの語彙を再解釈した例として挙げられる。</p>
