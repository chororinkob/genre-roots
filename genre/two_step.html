<h1>2-Stepとは</h1>
<p>UKガラージの中でも、四つ打ちを放棄して拍の骨格そのものを崩した形式。名称の通り、1小節の中でキックが2回だけ、それも1拍目と、3拍目の少し手前や後ろにずれた位置に置かれる。この結果、聴き手は拍の頭を掴みかけては外され、身体が前後</p>
<p>UKガラージの中でも、四つ打ちを放棄して拍の骨格そのものを崩した形式。名称の通り、1小節の中でキックが2回だけ、それも1拍目と、3拍目の少し手前や後ろにずれた位置に置かれる。この結果、聴き手は拍の頭を掴みかけては外され、身体が前後に揺れる独特の歩行感が生まれる。テンポはおおむね130BPM前後。スネアまたはリムショット（太鼓の縁を叩く音）は2拍4拍付近に置かれることが多いが、オフビートの配置も特徴とされ、ゴーストノート（弱く叩く装飾音）を散らして揺れを増幅する曲もある。ハイハットは均等に刻まず、打点ごとに音量と定位（左右の位置）を変えることがあり、シェイカーやコンガの断片を混ぜて有機的な質感を作る。ベースはサブベース（体に響く極低音）の帯域の丸い音で、キックが抜けた位置を埋めるように短く置かれることが多い。上物（メロディーなど上に重ねる音）はR&amp;Bやソウルのヴォーカルを細切れにして音程をずらしたもの、Fender Rhodes風の柔らかい和音、弦楽器のサンプルが中心で、和声（コードの響き）はメジャーセブンスや9thの穏やかな響きを好む傾向がある。ヴォーカルが入る場合は女性歌手のなめらかな歌唱が多い傾向があり、コーラス部分では素直な歌もの構成になる。曲は4分から6分程度のものが多く、DJ向けのイントロとアウトロを備える。UKガラージ全般の中で洗練された甘い方向を担うとされ、後のダブステップやフューチャーガラージが直接受け継いだリズムの原型でもある。</p>
<h2>成り立ち</h2><p>1990年代半ばから後半（英国での転機は1997年）のロンドンで、UKガラージの内部から分岐した。転機となったのは、アメリカのR&amp;B歌手Tina Mooreの1995年の曲「Never Gonna Let You Go」を、シカゴのKelly Gが手がけ、1995年の米国盤に収録されていたリミックスを、1997年に英国で再発して全英7位になったものとされる。このリミックスでは四つ打ちのキックが取り払われ、代わりにずれた2拍のキックとシンコペーション（拍をずらして強調するリズム）するパーカッションが置かれた。これがロンドンのクラブで爆発的な反応を得て、最初期の2ステップの例の一つとして挙げられることが多い。英国産の初期の例としては、SkyKapの「Endorphins」もある。背景には、スピード・ガラージから2ステップへのドラムパターンの変化と、R&amp;B風のヴォーカルの導入があった。ドラムンベース側の不調で聴衆がガラージに流れ込んだという証言もある。制作はロンドンを中心に、サウサンプトンやマンチェスターなど各地の若い制作者たちが担い、MJ Coleのように寝室でサンプラーなどを使って作った例もある。Steve Gurleyがジャングル制作者からの転向組として重要な役割を果たし、Zed BiasやEl-Bらが独自の解釈を加えた。1999年にArtful Dodgerが「Re-Rewind (The Crowd Say Bo Selecta)」を発表し、当時無名だったCraig Davidが歌ったことで全英2位を記録、2ステップが大衆音楽として認知された。Craig Davidは2000年のアルバム「Born to Do It」で世界的に成功したが、その後コメディ番組『Bo' Selecta!』で繰り返しパロディの対象となり、本人は「真剣に受け取られなくなった」と述べている。2009年からマイアミに住んだが、番組から逃れるための移住だったことは本人が否定している。同時期にSweet Female Attitude「Flowers」、Shanks &amp; Bigfoot「Sweet Like Chocolate」(1999年全英1位)、MJ Cole「Sincere」がヒットし、MJ Coleは、Royal College of Music(王立音楽大学)のジュニア部門でオーボエとピアノの古典的な訓練を受けた制作者として知られる。海賊放送のRinse FMやDeja Vu FMが普及を支えた。2001年以降、So Solid Crewの暴力事件と警察の対応（ツアー中止・出演不許可）による悪評がガラージ全体への逆風の一因となり、ヒット曲の繰り返しによる停滞や聴衆層の変化も重なって、2ステップは主流からアンダーグラウンドへ後退したが、そのリズムは複数の後継へ受け継がれた。ダブステップは2ステップのR&amp;B色を削ぎ、サブベースを前面に出した。グライムはUKガラージから発展し、ジャングルやダンスホール、ヒップホップの影響も受けた。2000年代後半（2006〜2007年）にはBurial(William Bevan)が2007年の「Untrue」で、劣化した2ステップのリズムと切り刻んだ声を廃墟のような音響で示し、批評的に極めて高い評価を得て、2ステップを郷愁と喪失の音楽として再定義した。以後、Mount Kimbieはポスト・ダブステップ、Jamie xxとDisclosureはUKガラージやハウスの語彙を再解釈した例として挙げられる。</p>
<h2>代表曲</h2><ul><li>21 Seconds (So Solid Crew)</li><li>Fill Me In (Craig David)</li><li>Never Gonna Let You Go (Tina Moore)</li><li>Re-Rewind (Artful Dodger)</li><li>Sweet Like Chocolate (Shanks &amp; Bigfoot)</li><li>Flowers (Sweet Female Attitude)</li><li>Crazy Love (MJ Cole)</li><li>Gabriel (Roy Davis Jr. ft. Peven Everett)</li><li>Out of Your Mind (True Steppers &amp; Dane Bowers)</li><li>Bound 4 da Reload (Oxide &amp; Neutrino)</li><li>Do You Really Like It (Pied Piper)</li><li>A Little Bit of Luck (DJ Luck &amp; MC Neat)</li><li>Destiny (Dem 2)</li><li>Masterblaster 2000 (DJ Luck &amp; MC Neat)</li><li>Girls Like Us (B15 Project)</li><li>Summer of Love (Lonyo)</li><li>Booo! (Sticky)</li><li>Woman Trouble (Artful Dodger)</li><li>The Heartless Theme (Heartless Crew)</li><li>Battle (Wookie)</li><li>Masterplan (Groove Chronicles)</li><li>The Theme (Dreem Teem)</li></ul>
