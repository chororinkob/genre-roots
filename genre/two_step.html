<h1>2-Stepとは</h1>
<p>UKガラージの中でも、四つ打ちを放棄して拍の骨格そのものを崩した形式。名称の通り、一小節の中でキックが2回だけ、それも1拍目と、3拍目の少し手前や後ろにずれた位置に置かれる。この結果、聴き手は拍の頭を掴みかけては外され、身体が前後</p>
<p>UKガラージの中でも、四つ打ちを放棄して拍の骨格そのものを崩した形式。名称の通り、一小節の中でキックが2回だけ、それも1拍目と、3拍目の少し手前や後ろにずれた位置に置かれる。この結果、聴き手は拍の頭を掴みかけては外され、身体が前後に揺れる独特の歩行感が生まれる。テンポは128〜135BPM。スネアまたはリムショットは2拍4拍の位置を守るが、その周囲に16分音符のゴーストノートを散らして揺れを増幅する。ハイハットは均等に刻まず、打点ごとに音量と定位を変え、シェイカーやコンガの断片を混ぜて有機的な質感を作る。ベースはサブベース領域の丸い音で、キックが抜けた位置を埋めるように短く置かれる。上物はR&amp;Bやソウルのヴォーカルを細切れにして音程をずらしたもの、Fender Rhodes風の柔らかい和音、弦楽器のサンプルが中心で、和声はメジャーセブンスや9thの穏やかな響きを好む。ヴォーカルが入る場合は女性歌手のなめらかな歌唱が多く、コーラス部分では素直な歌もの構成になる。曲は4分から6分で、DJ向けのイントロとアウトロを備える。UKガラージ全般の中で最も洗練された甘い方向を担い、後のダブステップやフューチャーガラージが直接受け継いだリズムの原型でもある。</p>
<h2>成り立ち</h2><p>1997年前後のロンドンで、UKガラージの内部から分岐した。転機となったのは、アメリカのR&amp;B歌手Tina Mooreの1995年の曲「Never Gonna Let You Go」を、ロンドンのKelly Gが1997年にリミックスしたヴァージョンとされる。このリミックスでは四つ打ちのキックが取り払われ、代わりにずれた2拍のキックとシンコペーションするパーカッションが置かれた。これがロンドンのクラブで爆発的な反応を得て、以後この形式が2ステップと呼ばれるようになった。背景には、当時のUKガラージが速すぎて息苦しいという不満と、R&amp;Bのゆったりしたグルーヴを取り込みたいという欲求があった。制作の中心はロンドン南部と東部の若い制作者たちで、寝室に置いたパソコンと安価なソフトウェアで作られた。Steve Gurleyがジャングル制作者からの転向組として重要な役割を果たし、Zed BiasやEl-Bらが独自の解釈を加えた。1999年にArtful Dodgerが「Re-Rewind (The Crowd Say Bo Selecta)」を発表し、当時無名だったCraig Davidが歌ったことで全英2位を記録、2ステップが大衆音楽として認知された。Craig Davidは2000年のアルバム「Born to Do It」で世界的に成功したが、その後イギリスの風刺番組で執拗に揶揄されたことで国内での評価を落とし、一時的に活動の場を海外へ移すことになった。同時期にSweet Female Attitude「Flowers」、Shanks &amp; Bigfoot「Sweet Like Chocolate」(1999年全英1位)、MJ Cole「Sincere」がヒットし、MJ Coleは王立音楽院でオーボエを学んだ経歴を持つことから、洗練された編曲でこのジャンルの音楽的水準を引き上げた。海賊放送のRinse FMやDeja Vu FMが普及を支えた。2001年以降、So Solid Crewの公演をめぐる暴力事件と大衆紙の攻撃により、ガラージ全般がクラブから締め出される。この排除により2ステップは表舞台から消えたが、そのリズムは複数の後継へ受け継がれた。ダブステップは2ステップの拍構造から旋律を削ぎ落とし、グライムは同じ骨格に攻撃的なMCを乗せた。2010年前後にはBurial(William Bevan)が2007年の「Untrue」で、劣化した2ステップのリズムと切り刻んだ声を廃墟のような音響で提示し、批評的に極めて高い評価を得て、2ステップを郷愁と喪失の音楽として再定義した。以後Mount Kimbie、Jamie xx、Disclosureがこの語彙を国際化させている。</p>
