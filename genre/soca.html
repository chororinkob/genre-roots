<h1>Soca（ソカ）とは</h1>
<p>ソカは、カリプソの歌詞中心の性格を踏まえつつ、踊ることに特化して速度と前へ進む勢いを高めた音楽だ。 編成は打ち込みのドラムとシンセベースに、電気ギター、そしてアイアンと呼ばれる金属を打つ打楽器、コンガが加わる。時にスティールパンも</p>
<p>ソカは、カリプソの歌詞中心の性格を踏まえつつ、踊ることに特化して速度と前へ進む勢いを高めた音楽だ。

編成は打ち込みのドラムとシンセベースに、電気ギター、そしてアイアンと呼ばれる金属を打つ打楽器、コンガが加わる。時にスティールパンも加わる。ホーンセクションは、ライブ編成の大きなショーで用いられることがある。上物（メロディーなど上に重ねる音）はシンセの反復音型で、隙間を多く残す。

和声（コードの響き）は、長調の循環が一般的な例の一つだ。

BPM（1分間の拍数）はグルーヴィー系で約110〜135、パワー・ソカで約155〜163と資料により幅があり、拍子は4分の4。最大の特徴はリズムの設計だ。キックは四つ打ち（four-on-the-floor）を基本とし、その裏で打楽器群が細かく刻むことで、絶えず前へ転がる感覚を作る。

歌唱はスタイルにより多様（呼びかけ型の曲も多い）。

歌詞は祭りの熱狂、身体の動き、そして自由の解放を扱い、飲酒を歌う例もある。ダンス向けの指示的な歌詞が多い。



速く激しいパワー・ソカと、腰を回して踊るゆったりしたグルーヴィー・ソカが主要な二系統（2005年の大会区分に由来）である。</p>
<h2>成り立ち</h2><p>舞台は、1970年代前半のトリニダード・トバゴだ。カリプソ歌手のGarfield Blackman、すなわちLord Shortyによって、この音楽は作られた。

彼は当時、カリプソがジャマイカのレゲエや米国のソウル／ファンクに押されて若者の支持を失っていることに危機感を抱いた。そこで、国の人口のおよそ四割（1970年の国勢調査で40.1%）を占めるインド系住民の音楽に着目した。インド系トリニダード人は1845年から1917年にかけて年季契約労働者（決まった年数、契約で働く人）として渡来した人々の子孫であり、ドーラクやダンタルといった打楽器を用いる独自の音楽を持っていた。

Lord Shortyはこの打楽器のリズムをカリプソに組み込み、1973年のIndrani、そして1974年のEndless Vibrations（いずれも資料により年に揺れがある）で新しい音を示した。名称は当初「sokah」と綴られ、のちに「soca」が広まった。米国のソウル音楽の影響を指すと誤解されたが、Shortyは「カリプソの魂（soul of calypso）」の意味だと訂正した。別説として、「soul calypso」を縮めたとする説明もある。

彼は後にラスタファリの影響を受けて改名し（時期は1970年代後半〜1984年前後と資料により異なる）、Ras Shorty Iの名でより精神的な音楽へ転じた。のちにはキリスト教色の強い音楽（jamoo）へ進んだ。

1980年代に入ると、Arrowの「Hot Hot Hot」が登場する。この曲は、アルバムが1982年、シングルが1983年とされ、1983年以降に国際的に知られるようになり、1987年のBuster Poindexterによるカバーでさらに広がった。

同時期、Machel Montanoが7歳（1982年）でキャリアを始め、1985年（資料により1986年）にデビューアルバムを出した。1990年代後半以降、ソカの第一人者である。

産業構造はカーニヴァルと結びつきが非常に強い。ロード・マーチ（パレード・コースの審査地点）で最も多く演奏された曲を決める競争が、最も権威ある称号の一つとされる。トリニダードのほか、ロンドンのノッティング・ヒルなどでは主要な音楽の一つとなり、バルバドス（クロップ・オーヴァー）、アンティグアでも主要な音楽である。

近年はアフロビーツやEDMとの融合が進み、Voiceなどの新世代と、2000年代から活躍するKes、Patrice Robertsらがいる。</p>
<h2>代表曲</h2><ul><li>Turn Me On（Kevin Lyttle）</li><li>Famalay（Skinny Fabulous, Machel Montano, Bunji Garlin）</li><li>Savannah Grass（Kes）</li><li>Like Ah Boss（Machel Montano）</li><li>Ministry of Road March (Machel Montano)</li><li>Differentology（Bunji Garlin）</li><li>Roll It Gal (Alison Hinds)</li><li>Wotless (Kes)</li><li>Lucy (Destra)</li><li>Dollar Wine (Colin Lucas)</li><li>Fantastic Friday (Super Blue)</li><li>Truck on D Road (Bunji Garlin)</li></ul>
