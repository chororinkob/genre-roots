<h1>Soca（ソカ）とは</h1>
<p>カリプソの歌詞中心の性格を踏まえつつ、踊ることに特化して速度と推進力を高めた音楽。BPMは130〜160と速く、拍子は四分の四。最大の特徴はリズムの設計で、キックが四つ打ちに近く一定に踏まれる一方、その裏で打楽器群が細かく刻み、ベ</p>
<p>カリプソの歌詞中心の性格を踏まえつつ、踊ることに特化して速度と推進力を高めた音楽。BPMは130〜160と速く、拍子は四分の四。最大の特徴はリズムの設計で、キックが四つ打ちに近く一定に踏まれる一方、その裏で打楽器群が細かく刻み、ベースが一拍目を空けて裏拍に落とすことで、絶えず前へ転がる感覚を作る。編成は打ち込みのドラムとシンセベースに、ホーンセクション、電気ギター、そしてアイアンと呼ばれる金属を打つ打楽器、コンガ、そして時にスティールパンが加わる。上物は短いホーンの刺しとシンセの反復音型で、隙間を多く残す。和声は長調の単純な循環が中心で、四小節で完結することが多い。歌唱は叫びに近い高い声で、聴衆への呼びかけと指示が絶えず挟まれる。曲構成は、静かな導入からホーンの合図で一気に音が揃うブレイクを軸とし、この落差で群衆を一斉に動かす。歌詞は祭りの熱狂、飲酒、身体の動き、そして自由の解放を扱い、内省的な要素はほとんどない。速く激しいパワー・ソカと、腰を回して踊るゆったりしたグルーヴィー・ソカに大別される。</p>
<h2>成り立ち</h2><p>1970年代前半のトリニダード・トバゴで、カリプソ歌手Garfield Blackman、すなわちLord Shortyによって作られた。彼は当時、カリプソがジャマイカのレゲエに押されて若者の支持を失っていることに危機感を抱き、島の人口の四割を占めるインド系住民の音楽に着目した。インド系トリニダード人は19世紀に年季契約労働者として渡来した人々の子孫であり、ドーラクやダンタルといった打楽器を用いる独自の音楽を持っていた。Lord Shortyはこの打楽器のリズムをカリプソに組み込み、1973年のIndrani、そして1974年のEndless Vibrationsで新しい音を提示した。名称は当初ソウル・カリプソを縮めたソカとされたが、彼自身は魂を意味するソウルではなく、カリプソの魂という意味だと説明している。彼は後にラスタファリの影響を受けて改名し、Ras Shortyの名でより精神的な音楽へ転じた。1980年代に入ると、Arrowが1982年に発表したHot Hot Hotが国際的なヒットとなり、ソカという名称を世界に広めた。同時期、Machel Montano が10代でデビューし、以後30年以上にわたって最大の存在であり続けている。産業構造はカーニヴァルと完全に一体で、毎年謝肉祭の前に新曲が大量に発表され、ロード・マーチ、すなわち当日に最も多く演奏された曲を決める競争が最大の名誉とされる。トリニダードのほか、バルバドスのクロップ・オーヴァー、アンティグア、そしてロンドンのノッティング・ヒル、ニューヨークとトロントのカリブ系の祭など、世界各地の移民共同体の祭でも中心的な音楽となっている。近年はアフロビーツやEDMとの融合が進み、Kes、Voice、Patrice Robertsらが新しい世代を形成している。</p>
<h2>代表曲</h2><ul><li>Differentology（Bunji Garlin）</li><li>Like Ah Boss（Machel Montano）</li><li>Savannah Grass（Kes）</li><li>Famalay（Skinny Fabulous, Machel Montano, Bunji Garlin）</li><li>Turn Me On（Kevin Lyttle）</li></ul>
