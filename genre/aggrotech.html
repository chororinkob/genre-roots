<h1>Aggrotech（アグロテック）とは</h1>
<p>EBM(エレクトロニック・ボディ・ミュージック)の硬質で機械的なビートを、さらに攻撃的な方向へ極端に押し進めた電子音楽。テンポは130〜145BPM前後の四つ打ちが基本で、キックはディストーションで潰され、ハイハットとクラップが1</p>
<p>EBM(エレクトロニック・ボディ・ミュージック)の硬質で機械的なビートを、さらに攻撃的な方向へ極端に押し進めた電子音楽。テンポは130〜145BPM前後の四つ打ちが基本で、キックはディストーションで潰され、ハイハットとクラップが16分音符で細かく詰め込まれる。シンセのリードは矩形波やノコギリ波を歪ませ、フィルターを激しく開閉させた金属的な音色で、単純で覚えやすい短調のフレーズを執拗に反復する。最大の特徴はヴォーカルで、ディストーション、ピッチシフト、ビットクラッシャーを何重にもかけて人間の声から遠ざけ、獣の唸りのような、あるいは無線機越しの怒号のような響きに加工される。歌詞は暴力、虐殺、精神の崩壊、猟奇殺人、宗教への冒涜、終末といった主題を極端に露悪的に扱い、映画の台詞やニュース音声のサンプルがそこへ重ねられる。曲の構成は、静かな導入から一気に全帯域が埋まる展開部へ突入する型が定番で、クラブのフロアで踊るための機能性はきちんと保たれている。同じ系譜のEBMやフューチャーポップが旋律の美しさや高揚感を残すのに対し、アグロテックは意図的に不快さと過剰さへ振り切る点で異なる。</p>
<h2>成り立ち</h2><p>2000年代前半、メキシコのHocico、ベルギーのSuicide Commandoが、このジャンルを牽引する存在として台頭した。Combichristが発表した「What the F**k Is Wrong with You People?」(2007)は、インダストリアル系シーンの中でのメインストリームヒットとなった。オランダのGrendel、アメリカのPsyclon Nineも重要なアーティストである。アメリカのMetropolis Records、ドイツのDependent Recordsが、このジャンルの主要なレーベルとして機能している。EBMとハードコアテクノの中間に位置するサウンドとして発展してきた。ボーカルには、声を機械的に歪ませる「ディストーション・ボーカル」がほぼ必須の要素として用いられ、人間の声を意図的に非人間的な響きへと変質させることで、このジャンル特有の攻撃性と非情さが演出される。ドイツのWGT(Wave-Gotik-Treffen)やM'era Lunaといった大規模フェスティバルは、こうしたアーティストが一堂に会する重要な発表の場となっている。「Aggrotech」という呼称は、実のところシーンの内部よりも外部の分類者やレコード店によって使われることが多く、当のアーティストたち自身は自らの音楽を単に「ハーシュEBM」や「ダークエレクトロ」と呼ぶことも少なくない。このジャンルの音作りに決定的な影響を与えた先行者としては、1980年代ベルギーのFront 242(EBMの創始者的存在)や、より攻撃的な方向を示したドイツのWumpscutなどが挙げられる。2000年代後半以降、シーンの規模自体は縮小傾向にあるが、ヨーロッパのゴシック系フェスティバルや専門クラブを通じて、根強いコミュニティが現在も維持されている。</p>
<h2>代表曲</h2><ul><li>Poltergeist (Suicide Commando)</li><li>Blasphemies of the Flesh (Hocico)</li><li>What the F**k Is Wrong with You People? (Combichrist)</li><li>Soilbleed (Grendel)</li><li>Parasitic (Psyclon Nine)</li></ul>
