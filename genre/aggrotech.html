<h1>Aggrotech（アグロテック）とは</h1>
<p>EBM(エレクトロニック・ボディ・ミュージック)の硬質で機械的なビートを、さらに攻撃的な方向へ極端に押し進めた電子音楽。テンポは速めの四つ打ちが基本で、キックはディストーション(音をわざと割って歪ませる処理)で潰され、ハイハットと</p>
<p>EBM(エレクトロニック・ボディ・ミュージック)の硬質で機械的なビートを、さらに攻撃的な方向へ極端に押し進めた電子音楽。テンポは速めの四つ打ちが基本で、キックはディストーション(音をわざと割って歪ませる処理)で潰され、ハイハットとクラップが16分音符で細かく詰め込まれる。シンセのリードはノコギリ波系の音を歪ませ、フィルターを激しく開閉させた金属的な音色で、単純で覚えやすい短調のフレーズを執拗に反復する。最大の特徴はヴォーカルで、ディストーション、ピッチシフト(音の高さを変える処理)、ビットクラッシャー(音をざらつかせる処理)を何重にもかけて人間の声から遠ざけ、獣の唸りのような、あるいは無線機越しの怒号のような響きに加工される。歌詞は暴力、虐殺、精神の崩壊、猟奇殺人、宗教への冒涜、終末といった主題を極端に露悪的に扱い、映画の台詞やニュース音声のサンプルがそこへ重ねられる。曲の構成は、静かな導入から一気にあらゆる音域が音で埋まる展開部へ入る形が定番で、クラブのフロアで踊るための機能性はきちんと保たれている。同じ系譜のEBMが簡素な構成とクリーンな音づくりを特徴とするのに対し、アグロテックは意図的に不快さと過剰さへ振り切る点で異なる。</p>
<h2>成り立ち</h2><p>ジャンルは1990年代中盤から後半に現れ、2000年代に拡大した。メキシコのHocico(1993年結成)、ベルギーのSuicide Commando(1986年結成)が、このジャンルを牽引する存在とされる。アメリカのCombichristは、2006年のEP『Get Your Body Beat』の表題曲でブレイクし(Billboardのダンス・シングル・チャートで初めてTop10に入った)、2007年3月にはアルバム『What the F**k Is Wrong with You People?』を発表した。オランダのGrendel、アメリカのPsyclon Nineも重要なアーティストである。アメリカのMetropolis Records、ドイツのDependent Recordsが、このジャンルの主要なレーベルとして機能している。EBMやダークエレクトロから派生し、テクノ(インダストリアル・ハードコアやハードトランス)の影響が強いサウンドとして発展してきた。ボーカルには、声を機械的に歪ませる「ディストーション・ボーカル」がしばしば用いられる。人間の声をわざと人間離れした響きに変えることで、このジャンル特有の攻撃性と冷酷さが演出される。ドイツのWGT(Wave-Gotik-Treffen)やM'era Lunaといった大規模フェスティバルは、こうしたアーティストが一堂に会する重要な発表の場となっている。「Aggrotech」には、hellektro、harsh EBM(ハーシュEBM)、terror EBMなどの別名もある。このジャンルに影響を与えた先行者としては、1981年にベルギーで結成され、1984年の『No Comment』で「electronic body music」を自称して様式を確立したFront 242や、1991年に結成されたドイツのWumpscutなどが挙げられる。ヨーロッパのゴシック系フェスティバルや専門クラブを通じて、根強いコミュニティが現在も維持されている。</p>
