<h1>Aggrotech（アグロテック）とは</h1>
<p>アグロテックは、EBM(エレクトロニック・ボディ・ミュージック)の硬く機械的なビートを、さらに攻撃的な方向へ極端に押し進めた電子音楽だ。 シンセのリードは、ノコギリ波系の音を歪ませ、フィルターを激しく開閉させた金属的な音色だ。単純</p>
<p>アグロテックは、EBM(エレクトロニック・ボディ・ミュージック)の硬く機械的なビートを、さらに攻撃的な方向へ極端に押し進めた電子音楽だ。

シンセのリードは、ノコギリ波系の音を歪ませ、フィルターを激しく開閉させた金属的な音色だ。単純で覚えやすいフレーズを、しつこく繰り返す。無調のメロディーも多い。

テンポは速めの四つ打ちが基本だ。キックはディストーション(音をわざと割って歪ませる処理)で潰され、金属的なハイハットやクラップが重ねられる。

最大の特徴はヴォーカルとされる。ディストーション、ピッチシフト(音の高さを変える処理)、ノイズ音やグリッチ音の効果を何重にもかけ、人間の声から遠ざける。獣の唸りのような、あるいは無線機越しの怒号のような響きに加工される。

歌詞は、暴力、憎悪、社会崩壊、ホラー、オカルトなどの暗い主題を扱う。

曲の構成は、静かな導入から、一気にあらゆる音域が音で埋まる展開部へ入る形をとることがある。それでも、クラブのフロアで踊るための機能はきちんと保たれている。</p>
<h2>成り立ち</h2><p>1990年代の中ごろから後半にかけて、このジャンルは姿を現し、2000年代に広がった。

メキシコのHocico(1993年結成)が、このジャンルを引っぱる存在とされる。ベルギーのSuicide Commandoは1986年結成の老舗で、のちにアグロテックの代表格となった。

アメリカのCombichristは、2006年のEP『Get Your Body Beat』の表題曲でブレイクした(Billboardの売上ベースのダンス・シングル・チャートであるHot Dance Singles Salesで初めてTop10に入った)。2007年3月には、アルバム『What the F**k Is Wrong with You People?』を発表した。オランダのGrendel、アメリカのPsyclon Nineも重要なアーティストである。レーベルでは、アメリカのMetropolis Records、ドイツのDependent Recordsが、このジャンルの主なレーベルになっている。

音は、EBMからエレクトロ・インダストリアル、ダークエレクトロへと続く流れの中で、ダークエレクトロから派生し、テクノの影響を強く受けて発展してきた。とくにインダストリアル・ハードコアの影響が挙げられ、ハードトランスの影響を挙げる見方もある。ボーカルには、声を機械的に歪ませる「ディストーション・ボーカル」がよく使われる。人間の声をわざと人間離れした響きに変えることで、このジャンルならではの攻撃性と冷たさが生まれる。

ドイツのM'era Lunaなど、ゴシック/インダストリアル系のフェスには、アグロテック勢が出演する。「Aggrotech」には、hellektro、harsh EBM(ハーシュEBM)、terror EBMなどが別名として挙げられることがある。

このジャンルに影響を与えた先行者には、1981年にベルギーで結成されたFront 242や、1991年に結成されたドイツのWumpscutなどが挙げられることがある。前者は、1984年の『No Comment』で「electronic body music」を自称し、そのスタイルを固めた。今も、ヨーロッパのゴシック系フェスティバルや専門クラブを通じて、根強いコミュニティが保たれているとされる。</p>
