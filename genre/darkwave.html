<h1>Darkwave（ダークウェーブ）とは</h1>
<p>ニューウェイヴの電子的な語彙を、憂鬱と死のイメージへ振り切った音楽。シンセサイザーのパッドを霧のように敷き詰め、その上に残響の深いギターと重いドラムマシンを重ねる。音色選びの原則は明るい倍音を避けることで、シンセはローパスフィルタ</p>
<p>ニューウェイヴの電子的な語彙を、憂鬱と死のイメージへ振り切った音楽。シンセサイザーのパッドを霧のように敷き詰め、その上に残響の深いギターと重いドラムマシンを重ねる。音色選びの原則は明るい倍音を避けることで、シンセはローパスフィルターを絞った鈍い音、ギターはコーラスとディレイで輪郭をぼかした音が使われる。テンポは90〜130BPM程度で、四つ打ちのものからゆったりしたバラード的なものまで幅がある。ベースは中低域を厚く占め、単純な反復で曲を支える。和声は自然短音階やハーモニックマイナーを軸にし、増二度を含む中東風の音程やグレゴリオ聖歌を思わせる旋法が使われることもある。ヴォーカルは二極に分かれ、男性は低く沈んだバリトンで語るように、女性はソプラノで教会音楽風に伸びやかに歌う。歌詞は死、喪失、宗教的な罪、夢と幻視、中世や神話の情景を扱い、文学的な引用も多い。しばしばチェンバロ、ヴァイオリン、チェロ、ティンパニといったクラシック楽器のサンプルが加わり、擬似的な室内楽の質感を作る。ゴシックロックと重なる領域が大きいが、ゴシックがギターバンドの編成を保つのに対し、ダークウェイヴはシンセとプログラミングが主導する点で区別される。またコールドウェイヴの乾いた簡素さとは対照的に、装飾的で情感過多な傾向がある。</p>
<h2>成り立ち</h2><p>1980年代前半のイギリスとドイツで、ゴシックロックとシンセポップが交差する地点から生まれた。イギリス側の源流はBauhausの1979年「Bela Lugosi's Dead」に始まるゴシックロックだが、その電子的側面を拡張したのがThe Cureの1982年「Pornography」やSiouxsie and the Bansheesの一連の作品だった。ドイツではXmal Deutschlandが1980年にハンブルクで結成され、女性ヴォーカルAnja Huweのドイツ語の歌とシンセの層で独自の位置を占めた。ジャンル名としてのdark waveが定着したのはドイツ語圏で、1980年代半ばに音楽誌やレコード店が使い始めた。ドイツのシーンを支えたのはHyperium Recordsや、後にDance or Die、Deine Lakaien、Das Ichといったバンドを擁するDanse Macabre、そしてベルギーのPlay It Again Samだった。とりわけ重要なのがロンドンの4AD Recordsで、Ivo Watts-Russellが1980年に設立し、Cocteau Twins、Dead Can Dance、This Mortal Coilを送り出した。Dead Can DanceのBrendan PerryとLisa Gerrardは1981年にメルボルンで出会いロンドンへ移り、中世ヨーロッパや中東の楽器を取り入れて、ダークウェイヴから派生する民族音楽的な系統(ネオフォークやエスニックウェイヴ)を切り開いた。Lisa Gerrardは意味を持たない自作の言語で歌うことで知られ、後に映画「グラディエーター」の音楽で広く知られるようになる。1990年代のドイツではWave-Gotik-Treffenという祭典が1992年にライプツィヒで始まり、数万人規模の集会としてダークウェイヴとゴシックの共同体を可視化した。同時期にネオクラシカル・ダークウェイヴやエセリアル・ウェイヴといった下位分類が分岐し、Elend、Stoa、Love Is Colderといった名が現れる。この共同体は服装や図像において十字架や中世の紋章を用いたため、外部からは宗教的異端や政治的極端主義と混同されることがあり、実際に一部のネオフォーク系バンドが極右の図像を引用したことで真剣な内部論争が起きた。2000年代以降は市場が縮小したが、2010年代の再興期にはSNSとストリーミングを通じて若い世代が発見し、Drab Majestyや She Past Awayといったバンドが新たな聴衆を得ている。</p>
