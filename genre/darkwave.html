<h1>Darkwave（ダークウェーブ）とは</h1>
<p>ニューウェイヴの電子的な語彙を、憂鬱と死のイメージへ振り切った音楽。シンセサイザーのパッドを霧のように敷き詰め、その上に残響の深いギターと重いドラムマシンを重ねる。音色選びの原則は明るい倍音を避けることで、シンセはローパスフィルタ</p>
<p>ニューウェイヴの電子的な語彙を、憂鬱と死のイメージへ振り切った音楽。シンセサイザーのパッドを霧のように敷き詰め、その上に残響の深いギターと重いドラムマシンを重ねる。音色選びの原則は明るい倍音を避けることで、シンセはローパスフィルターを絞った鈍い音、ギターはコーラスとディレイで輪郭をぼかした音が使われる。テンポは90〜130BPM程度で、四つ打ちのものからゆったりしたバラード的なものまで幅がある。ベースは中低域を厚く占め、単純な反復で曲を支える。和声は自然短音階やハーモニックマイナーを軸にし、増二度を含む中東風の音程やグレゴリオ聖歌を思わせる旋法が使われることもある。ヴォーカルは二極に分かれ、男性は低く沈んだバリトンで語るように、女性はソプラノ（Elizabeth Fraserなど）やコントラルト（Gerrard）などで教会音楽風に伸びやかに歌う。歌詞は死、喪失、宗教的な罪、夢と幻視、中世や神話の情景を扱い、文学的な引用も多い。しばしばチェンバロ、ヴァイオリン、チェロ、ティンパニといったクラシック楽器のサンプルが加わり、擬似的な室内楽の質感を作る。ダークウェイヴはゴシックロックを含みうる、より広い包括語である。またコールドウェイヴの乾いた簡素さとは対照的に、装飾的で情感過多な傾向がある。</p>
<h2>成り立ち</h2><p>1970年代末〜1980年代初頭の欧州（イギリス、西ドイツのほか、ベルギー、オランダ、フランス、イタリアを含む）で、ゴシックロックとシンセポップが交差する地点から生まれた。イギリス側の源流はゴシックロックで、Bauhausの1979年「Bela Lugosi's Dead」がしばしばその始まりとされるが、その流れを広げたのが、The Cureの1982年「Pornography」（厚く歪んだギター・ベース・ドラム主体の作品として語られるのが一般的）やSiouxsie and the Bansheesの一連の作品だった。ドイツではXmal Deutschlandが1980年にハンブルクで結成され、女性ヴォーカルAnja Huweのドイツ語の歌と、ギター中心の音で独自の位置を占めた。dark waveという語は、1980年代以降のヨーロッパの音楽誌が使い、米国では1993年以降、Projekt Recordsの創設者Sam Rosenthalが、ドイツの雑誌Zilloから採り入れたとされる。ドイツのシーンを支えたのは、1991年に設立されたHyperium Recordsや、1989年にDas Ichのメンバーが創設したDanse Macabre（ドイツ・ヴィルスベルク。Das Ichなどを擁した）だった。Play It Again Samは、ベルギー／英国のEBM・インダストリアル系の主要レーベルである。とりわけ重要なのがロンドンの4AD Recordsで、Ivo Watts-RussellがPeter Kentと共同で1979年にAxis Recordsとして設立し、1980年に4ADへ改称し、Cocteau Twins、Dead Can Dance、This Mortal Coilを送り出した。Dead Can DanceのBrendan PerryとLisa Gerrardは1981年にメルボルンで出会いロンドンへ移り、中世ヨーロッパや中東の楽器を取り入れて、ネオクラシカル・ダークウェイヴの先駆の1つとなった（ネオフォークの起点ではない）。Lisa Gerrardは意味を持たない自作の言語で歌うことで知られ、後に映画「グラディエーター」の音楽で広く知られるようになる。1990年代のドイツではWave-Gotik-Treffenという祭典が1992年にライプツィヒで約2,000人で始まり、1990年代を通じて拡大して2000年には約25,000人、近年は約2万人前後の集会となり、ダークウェイヴとゴシックの共同体を可視化した。エセリアル・ウェイヴは1980年代初頭、ネオクラシカル・ダークウェイヴは1980年代後半に成立しており、1990年代はその定着・拡大期にあたる。その時期には、Elend、Stoa、Love Is Colder Than Deathといった名が現れる。この共同体は服装や図像において十字架や中世の紋章を用いたため、外部からは宗教的異端や政治的極端主義と混同されることがあり、実際に一部のネオフォーク系バンドが極右の図像を引用したことで真剣な内部論争が起きた。2000年代以降は市場が縮小したが、2010年代の再興期にはSNSとストリーミングを通じて若い世代が発見し、Drab Majestyや She Past Awayといったバンドが新たな聴衆を得ている。</p>
<h2>代表曲</h2><ul><li>The Perfect Girl (Mareux)</li><li>Gallowdance (Lebanon Hanover)</li><li>The Host of Seraphim (Dead Can Dance)</li><li>Ritüel (She Past Away)</li><li>Pearly-Dewdrops' Drops (Cocteau Twins)</li><li>Sacrifice (London After Midnight)</li><li>Louise (Clan of Xymox)</li><li>A Little Death to Laugh (Cold Cave)</li><li>Jasmine and Rose (Clan of Xymox)</li><li>Medusa (Clan of Xymox)</li><li>Gottes Tod (Das Ich)</li><li>Der Eissturm (Goethes Erben)</li></ul>
