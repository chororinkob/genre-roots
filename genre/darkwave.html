<h1>Darkwave（ダークウェーブ）とは</h1>
<p>ニューウェイヴの電子的な要素を、憂鬱と死のイメージへ振り切った音楽。シンセサイザーのパッド（持続する背景の音）を霧のように敷き詰め、その上に残響の深いギターと重いドラムマシンを重ねる。音色選びでは、明るい倍音（音の明るさを作る高い</p>
<p>ニューウェイヴの電子的な要素を、憂鬱と死のイメージへ振り切った音楽。シンセサイザーのパッド（持続する背景の音）を霧のように敷き詰め、その上に残響の深いギターと重いドラムマシンを重ねる。音色選びでは、明るい倍音（音の明るさを作る高い成分）を避けることが多く、シンセはローパスフィルター（高い音を削る装置）を絞った鈍い音、ギターはコーラス（音を揺らして厚くする効果）とディレイ（音を遅らせて繰り返す効果）で輪郭をぼかした音が使われる。テンポはニューウェイヴより遅めのものが多く、四つ打ちのものからゆったりしたバラード的なものまで幅がある。ベースは中低域を厚く占め、単純な反復で曲を支える。和声は短調（暗く聞こえる音階）を中心にしたものが多い。Dead Can Danceのように、グレゴリオ聖歌（中世の教会の歌）や中東の音楽の要素を取り入れた例もある。ヴォーカルは、エセリアルやネオクラシカルといった細かい種類では女声が目立ち、ソプラノ（Elizabeth Fraserなど）やコントラルト（低めの女声。Gerrard）などで教会音楽風に伸びやかに歌うことが多い。男性が低く沈んだバリトンで語るように歌う例もある。歌詞は死、喪失、宗教的な罪、夢と幻視、中世や神話の情景を扱い、文学的な引用も多い。ギターやヴァイオリンなども併用される。ネオクラシカルのような細かい種類では、チェロなどのクラシック楽器やオーケストラ風のサンプル（録音から切り出した素材）が目立ち、擬似的な室内楽の質感を作る。ダークウェイヴはゴシックロックを含みうる、より広く包む呼び名である。またコールドウェイヴ（ダークウェイヴに含まれる種類で、初期には同じ意味でも使われた呼び名）の乾いた簡素さとは対照的に、装飾的で情感過多な傾向があると言われる。</p>
<h2>成り立ち</h2><p>1970年代末〜1980年代初頭の欧州（イギリス、西ドイツのほか、ベルギー、オランダ、フランス、イタリアを含む）で、ゴシックロックとシンセポップが交差する地点から生まれた。イギリス側の源流はゴシックロックで、Bauhausの1979年「Bela Lugosi's Dead」がしばしばその始まりとされるが、その流れを広げたのが、The Cureの1982年「Pornography」（ドラム、ギター、声がぎゅっと詰まった密度の高い音に、オルガンの響きも加わった作品として語られる）やSiouxsie and the Bansheesの一連の作品だった。ドイツではXmal Deutschlandが1980年にハンブルクで結成され、女性ヴォーカルAnja Huweのドイツ語の歌と、ギター中心の音で独自の位置を占めた。dark waveという語は、1980年代以降のヨーロッパの音楽誌が使い、米国では1993年以降、Projekt Recordsの創設者Sam Rosenthalが、ドイツの雑誌Zilloから採り入れたとされる。ドイツのシーンを支えたのは、1991年に設立されたHyperium Recordsや、1989年にDas Ichのメンバーが創設したDanse Macabre（ドイツ・ヴィルスベルク。Das Ichなどを擁した）だった。なお、ダークウェイヴのレーベルとは言えないが、参考までに、Play It Again Samは、ベルギー／英国のレーベルで（1982年設立とされるが、1983年とする資料もある）、EBM・インダストリアル系の主要レーベルである。とりわけ重要なのがロンドンの4AD Recordsで、Ivo Watts-RussellがPeter Kentと共同で1979年にAxis Recordsとして設立し、1980年に4ADへ改称し、Cocteau Twins、Dead Can Dance、This Mortal Coilを送り出した。Dead Can Danceは1981年にメルボルンで結成された。Brendan PerryとLisa Gerrardはそれ以前に同じ町の音楽シーンで知り合い、1982年5月にロンドンへ移り、中世ヨーロッパや中東の楽器を取り入れて、ネオクラシカル・ダークウェイヴの先駆の1つとなった（ネオフォークの起点ではない）。Lisa Gerrardは意味を持たない自作の言語で歌うことで知られ、後に映画「グラディエーター」の音楽で広く知られるようになる。1990年代のドイツではWave-Gotik-Treffenという祭典が1992年にライプツィヒで約2,000人で始まり、1990年代を通じて拡大して2000年には約25,000人、近年は約2万人前後の集会となり、ダークウェイヴとゴシックの共同体を可視化した。エセリアル・ウェイヴは1980年代初頭、ネオクラシカル・ダークウェイヴは1980年代後半に成立しており、1990年代はその定着・拡大期にあたる。その時期には、Elend、Stoa、Love Is Colder Than Deathといった名が現れる。これはダークウェイヴ全体の話ではないが、近いところから生まれたネオフォークの一部では、ファシズム（極端な国家主義の政治思想）を思わせる象徴や標語を使ったことで、ジャンルが極右と結びつけて見られるようになった。ファンはこの見方に反対している。2000年代にはポストパンク・リヴァイヴァル（ポストパンクを見直す動き）の中で新しい世代のバンドが現れ、初期のダークウェイヴの音の特徴をよみがえらせた。その広がりは2010年代の初めまで続き、Drab Majestyや She Past Awayといったバンドが新たな聴衆を得ている。</p>
