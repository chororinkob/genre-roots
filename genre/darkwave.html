<h1>Darkwave（ダークウェーブ）とは</h1>

<p>ダークウェイヴは、ニューウェイヴの電子的な要素を、憂鬱と死のイメージへ振り切った音楽だ。ゴシックロックを含みうる、より広く包む呼び名でもある。

音の土台は、シンセサイザーのパッド（持続する背景の音）だ。これを霧のように敷き詰め、その上に残響の深いギターと、重いドラムマシンを重ねる。

シンセは、ローパスフィルター（高い音を削る装置）を絞った鈍い音になる。ギターは、コーラス（音を揺らして厚くする効果）とディレイ（音を遅らせて繰り返す効果）で、輪郭をぼかした音が使われる。

和声は、短調中心で暗く内省的だ。サブジャンル（エセリアル、ネオクラシカル）では、女声やオーケストラ的な要素が目立つ。楽器は、シンセ、サンプラー、ドラムマシンと、ギターやヴァイオリンなどを併用する。

テンポは、新ウェイヴより遅めのものが多い。四つ打ちのものから、ゆったりしたバラード的なものまで幅がある。ベースは中低域を厚く占め、単純な反復で曲を支える。

歌詞は、死、喪失、宗教的な罪、夢と幻視、中世や神話の情景を扱う。文学的な引用も多い。

またコールドウェイヴの乾いた簡素さとは対照的に、装飾的で情感過多な傾向があると言われる。</p>
<h2>成り立ち</h2><p>1970年代末から1980年代初頭、舞台はヨーロッパだった。イギリスと西ドイツのほか、ベルギー、オランダ、フランス、イタリアも含まれる。ゴシックロックとシンセポップが交差する地点から、この音楽は生まれた。

イギリス側の源流はゴシックロックだ。Bauhausの1979年「Bela Lugosi's Dead」が、しばしばその始まりとされる。その流れを広げたのが、The Cureの1982年「Pornography」（ドラム、ギター、声が密に押し固められた、密度の高い音の作品として語られる）と、Siouxsie and the Bansheesの一連の作品だった。

ドイツでは、Xmal Deutschlandが1980年にハンブルクで結成された。女性ヴォーカルAnja Huweのドイツ語の歌と、ギター中心の音で、独自の位置を占めた。

dark waveという語は、1980年代以降のヨーロッパの音楽誌が使った。米国では1993年以降、Projekt Recordsの創設者Sam Rosenthalが、ドイツの雑誌Zilloから採り入れたとされる。

ドイツのシーンを支えたのは、1991年に設立されたHyperium Recordsだ。1989年にDas Ichのメンバーが創設したDanse Macabre（ドイツ・ヴィルスベルク。Das Ichなどを擁した）も、その一つだった。ベルギーと英国では、Play It Again Sam（1982年または1983年の設立）がEBM・インダストリアル系の主要レーベルである。

とりわけ重要なのが、ロンドンの4AD Recordsだ。Ivo Watts-RussellがPeter Kentと共同で、1979年にAxis Recordsとして設立した。1980年に4ADへ改称し、Cocteau Twins、Dead Can Dance、This Mortal Coilを送り出した。

Dead Can DanceのBrendan PerryとLisa Gerrardは、1981年にメルボルンで結成した。2人はそれ以前に同地のシーンで知り合い、1982年5月にロンドンへ移った。中世ヨーロッパや中東の楽器を取り入れて、ネオクラシカル・ダークウェイヴの先駆の1つとなった（ネオフォークの起点ではない）。Lisa Gerrardは、意味を持たない自作の言語で歌うことで知られる。後に映画「グラディエーター」の音楽で、広く知られるようになる。

1990年代のドイツでは、Wave-Gotik-Treffenという祭典が、1992年にライプツィヒで約2,000人で始まった。1990年代を通じて拡大し、2000年には約25,000人、近年は約2万人前後の集会となった。ダークウェイヴとゴシックの共同体を、目に見える形にした。

エセリアル・ウェイヴは1980年代初頭、ネオクラシカル・ダークウェイヴは1980年代後半に成立している。1990年代は、その定着・拡大期にあたる。その時期には、Elend、Stoa、Love Is Colder Than Deathといった名が現れる。

ネオフォークの一部では、ファシズム的なシンボルの使用が極右との関連を招いた。ただし、ファンはこれを争っている。

2000年代には、ポストパンク・リヴァイヴァルの中で新世代が登場し、2010年代初頭にかけて広がった。Drab Majestyや She Past Awayといったバンドが、新たな聴衆を得ている。</p>
