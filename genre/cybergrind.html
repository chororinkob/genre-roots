<h1>Cybergrind（サイバーグラインド）とは</h1>
<p>グラインドコアの極端な速さと短さを、生演奏ではなく打ち込みで再構築したエクストリームメタルである。中核にあるのはプログラミングされたブラストビートで、人間の腕では維持できない毎分1000打を超えるスネア連打や、ガバ由来の歪んだキッ</p>
<p>グラインドコアの極端な速さと短さを、生演奏ではなく打ち込みで再構築したエクストリームメタルである。中核にあるのはプログラミングされたブラストビートで、人間の腕では維持できない毎分1000打を超えるスネア連打や、ガバ由来の歪んだキックが用いられる。ドラム音源はあえて生々しさを消し、金属的でパルスのような硬い質感に整えられることが多い。ギターは7弦や8弦をドロップチューニングで下げ、単音リフをスタッカートで刻む奏法が中心で、和音よりも打楽器的な役割を担う。ヴォーカルは低音のグロウルと金切り声のシュリークを曲中で切り替え、歌詞は身体の損壊、薬物、機械と人間の融合、社会への嫌悪といった主題を扱う。曲は30秒から2分程度と極端に短く、1枚のアルバムに30曲以上が詰め込まれることも珍しくない。構成は展開というより断片の衝突で、無関係な映画の台詞サンプル、チップチューン、アンビエントの静寂が脈絡なく差し込まれる。生バンドのグラインドコアが持つ肉体的な揺れを捨て、編集精度と非人間性を武器にしている点が最大の違いである。</p>
<h2>成り立ち</h2><p>母体となったのは1980年代後半にイギリスのNapalm Deathが確立したグラインドコアだが、そこへドラムマシンとサンプラーを持ち込む発想は1990年代半ばに複数の場所で同時に芽生えた。アメリカ側の中心人物はScott Hullで、Enemy Soilでの活動を経てAgoraphobic Nosebleedのプログラマー兼ギタリストとなり、Relapse Recordsから2002年にフローズン・コープス・スタッフド・ウィズ・ドープ、2003年には20分間に100曲を収めたAltered States of Americaを発表した。生ドラマーを雇えない、あるいは人間には演奏不可能な速度を求めるという実務的な動機が、そのまま美学へ転化した典型例である。オーストラリア側ではLuke Kennyが1995年にメルボルンでThe Berzerkerを結成し、1999年にEarache Recordsと契約、ガバのキックドラムをメタルのリフに直接重ねるという当時としては異様な折衷を実行した。マスクを被った匿名的なステージングも、機械化された音楽性と呼応していた。2004年にニューヨーク州で結成されたGenghis Tronは、シンセサイザーとブラストビートを往復する作風でDead Mountain Mouthやボード・アップ・ザ・ハウスを発表し、2008年前後にこの領域を最も広い聴衆へ届けた。2010年代以降はDAWの低価格化とBandcampの普及により、寝室で一人が全パートを作るサイバーグラインドが大量に生まれ、アニメやゲームの画像を使ったジャケットとともにインターネット上のニッチとして定着した。一方で、打ち込み特有の均質さが飽きを呼びやすいという批判は根強く、正統派のグラインドコア勢からは長らく本物ではないと見なされてきた経緯もある。</p>
