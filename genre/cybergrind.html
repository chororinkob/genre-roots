<h1>Cybergrind（サイバーグラインド）とは</h1>
<p>サイバーグラインドは、グラインドコアの極端な速さと短さを、生演奏ではなく打ち込みで組み立て直したエクストリームメタルである。 中心にあるのは、プログラミングで作ったブラストビートだ。人間の腕では続けにくい超高速のスネア連打が使われ</p>
<p>サイバーグラインドは、グラインドコアの極端な速さと短さを、生演奏ではなく打ち込みで組み立て直したエクストリームメタルである。

中心にあるのは、プログラミングで作ったブラストビートだ。人間の腕では続けにくい超高速のスネア連打が使われる。The Berzerkerのように、ガバ由来のTR-909系の歪んだキックを使う例もある。The Berzerkerは初期(デビュー作)は打ち込みで、のちに生ドラムの時期もある。ドラム音源は、たとえばScott Hullの場合、初期は人工的な音だったが、のちに本物と区別がつかないリアルなサンプル音源になった。

ギターは、たとえばScott Hullのように7弦や8弦を使う。

ヴォーカルは、グラインドコア全般と同じく、金切り声のシュリークから低音のグロウル（うなる声）まで幅がある。Agoraphobic Nosebleedでは、複数のヴォーカリストが分担している。歌詞は、身体の損壊、薬物、自己嫌悪・うつ、ビデオゲーム的な題材といったテーマを扱う。

曲は数秒〜2分程度と極端に短い。1枚のアルバムに30曲以上が詰め込まれることも珍しくない。構成は、展開というより断片のぶつかり合いだ。チップチューンやテレビ番組のサンプルなどが、脈絡なく差し込まれる。生バンドのグラインドコアが持つ肉体的な揺れを捨て、編集の精度と人間離れした感触を武器にしている。そこが、生バンドとの最大の違いである。</p>
<h2>成り立ち</h2><p>土台になったのは、1980年代半ばから後半にかけて、イギリスのNapalm Deathが発展させたグラインドコアだ。そこへドラムマシンとサンプラーを持ち込む動きでは、Enemy SoilやWadgeなどが先行した。その流れで、Agoraphobic Nosebleedが打ち込みを定着させた。

Enemy SoilのRichard Johnsonは、Enemy SoilがHullの打ち込み採用の後押しになったと述べている。Scott Hullは1994年にAgoraphobic Nosebleedを結成し、プログラマー兼ギタリストを務めた。Relapse Recordsから、2002年にフローズン・コープス・スタッフド・ウィズ・ドープを発表した。2003年には、約22分に100曲を収めたAltered States of Americaを出した。Hull本人は、打ち込みを使い始めた動機として、簡単だったこと、ドラマーがいなかったこと、リハーサルを繰り返したくなかったことを挙げている。のちには、本物と区別のつかないリアルなドラム音源を追求した。

一方、オーストラリアではLuke Kennyが1995年にメルボルンでThe Berzerkerを結成した。1998年にEarache Recordsと接触し、その後契約して、2000年4月10日にデビュー作を出した。ガバのキックドラムをメタルのリフに直接重ねるという、当時としては異様な組み合わせを形にした。初期のライブではマスクと匿名表記を用いたが、のちに廃止した。

2004年には、ニューヨーク州でGenghis Tronが結成された。シンセサイザーとブラストビートを行き来する作風で、Dead Mountain Mouthやボード・アップ・ザ・ハウスを発表した。『Board Up the House』は、2008年2月18日にNew York Timesの「Critics' Choice」欄で取り上げられた。

また、2000年代半ばのMyspace時代には、寝室で一人が全パートを作る自宅録音のシーンが広がった。2020年前後には再び流行し、ビデオゲーム的な美学とともに、インターネット上のニッチとして定着した。

一方で、電子グラインドは2000年代前半〜半ばにメタル界の流行から外れ、のちに再評価された。</p>
<h2>代表曲</h2><ul><li>No One Wins (The Berzerker)</li><li>Board Up the House (Genghis Tron)</li><li>Corporal Jigsore Quandary (The Berzerker)</li><li>Last Mistake (The Berzerker)</li><li>Reality (The Berzerker)</li><li>Frozen Corpse Stuffed with Dope (Agoraphobic Nosebleed)</li><li>I Am All (Genghis Tron)</li><li>National Stem Cell and Clone (Agoraphobic Nosebleed)</li><li>I Won't Come Back Alive (Genghis Tron)</li><li>Born Prey (Genghis Tron)</li><li>Future Worship (Genghis Tron)</li></ul>
