<h1>Cybergrind（サイバーグラインド）とは</h1>
<p>グラインドコアの極端な速さと短さを、生演奏ではなく打ち込みで再構築したエクストリームメタルである。中核にあるのはプログラミングされたブラストビートで、人間の腕では維持しにくい超高速のスネア連打が用いられ、The Berzerker</p>
<p>グラインドコアの極端な速さと短さを、生演奏ではなく打ち込みで再構築したエクストリームメタルである。中核にあるのはプログラミングされたブラストビートで、人間の腕では維持しにくい超高速のスネア連打が用いられ、The Berzerkerのようにガバ由来のTR-909系の歪んだキックを使う例もある。ドラム音源は、初期は人工的な音だったが、のちに本物と区別がつかないリアルなサンプル音源を目指す例も多い。ギターは、たとえばScott Hullのように7弦や8弦を使い、ドロップチューニングで低く下げ、単音リフをスタッカートで刻む奏法が中心で、和音よりも打楽器的な役割を担う。ヴォーカルは低音のグロウルと金切り声のシュリークを曲中で切り替え、歌詞は身体の損壊、薬物、機械と人間の融合、社会への嫌悪といった主題を扱う。曲は30秒から2分程度と極端に短く、1枚のアルバムに30曲以上が詰め込まれることも珍しくない。構成は展開というより断片の衝突で、無関係な映画の台詞サンプル、チップチューン、アンビエントの静寂が脈絡なく差し込まれる。生バンドのグラインドコアが持つ肉体的な揺れを捨て、編集精度と非人間性を武器にしている点が最大の違いである。</p>
<h2>成り立ち</h2><p>母体となったのは1980年代半ばから後半にかけてイギリスのNapalm Deathが発展させたグラインドコアだが、そこへドラムマシンとサンプラーを持ち込む発想は、複数の場所で独立に芽生えたとされる(諸説あり)。アメリカ側の中心人物はScott Hullで、Enemy Soilに影響を受けて1994年にAgoraphobic Nosebleedを結成し、プログラマー兼ギタリストとして、Relapse Recordsから2002年にフローズン・コープス・スタッフド・ウィズ・ドープ、2003年には約22分に100曲を収めたAltered States of Americaを発表した。Hull本人によれば、打ち込みを使い始めた動機は、簡単だったこと、ドラマーがいなかったこと、リハーサルを繰り返したくなかったことで、のちには本物と区別のつかないリアルなドラム音源を追求した。オーストラリア側ではLuke Kennyが1995年にメルボルンでThe Berzerkerを結成し、1998年にEarache Recordsと契約して2000年にデビュー作を出し、ガバのキックドラムをメタルのリフに直接重ねるという当時としては異様な折衷を実行した。マスクを被った匿名的なステージングも、機械化された音楽性と呼応していた。2004年にニューヨーク州で結成されたGenghis Tronは、シンセサイザーとブラストビートを往復する作風でDead Mountain Mouthやボード・アップ・ザ・ハウスを発表し、2008年前後に広い注目を集めた(『Board Up the House』はNew York Timesの「Critics' Choice」に選ばれた)。2010年代以降はDAWの低価格化とBandcampの普及により、寝室で一人が全パートを作るサイバーグラインドが大量に生まれ、アニメやゲームの画像を使ったジャケットとともにインターネット上のニッチとして定着した。一方で、打ち込み特有の均質さが飽きを呼びやすいという批判は根強く、正統派のグラインドコア勢からは長らく本物ではないと見なされてきた経緯もある。</p>
<h2>代表曲</h2><ul><li>No One Wins (The Berzerker)</li><li>Board Up the House (Genghis Tron)</li><li>Corporal Jigsore Quandary (The Berzerker)</li><li>Last Mistake (The Berzerker)</li><li>Reality (The Berzerker)</li><li>Frozen Corpse Stuffed with Dope (Agoraphobic Nosebleed)</li><li>I Am All (Genghis Tron)</li><li>National Stem Cell and Clone (Agoraphobic Nosebleed)</li><li>I Won't Come Back Alive (Genghis Tron)</li><li>Born Prey (Genghis Tron)</li><li>Future Worship (Genghis Tron)</li></ul>
