<h1>Tropical House（トロピカルハウス）とは</h1>
<p>トロピカル・ハウスは、ディープ・ハウスの構造を土台に、テンポを落とし、南国の情景を思い起こさせる音色を乗せたダンス音楽だ。 特徴的な要素は、主旋律を担う音色である。パンフルート、スチールドラム、マリンバ、サックス、フルートなど、南</p>
<p>トロピカル・ハウスは、ディープ・ハウスの構造を土台に、テンポを落とし、南国の情景を思い起こさせる音色を乗せたダンス音楽だ。

特徴的な要素は、主旋律を担う音色である。パンフルート、スチールドラム、マリンバ、サックス、フルートなど、南国的で生楽器的な音色が使われる。和声は、明るい長調の単純な進行が中心だ。低音は太く滑らかで、和音の変化に合わせて動く。和音を支える音には、キックが鳴るたびに音量が一瞬押し下げられる処理（サイドチェイン）が深くかけられ、全体が呼吸するように脈打つ。

テンポは概ね100から120 BPMで、通常のハウスより遅い。この速度が、くつろいだ雰囲気を作る。キックは四つ打ちを保つが、一般に、音量は抑えられ、角の丸い柔らかい音色が選ばれる。

歌が入る場合は、伸びやかな歌唱が使われる。

構成の面では、通常のダンス音楽が持つ、緊張を溜めて激しく解放するという型に、あまり頼らない。盛り上がりの部分でも音は攻撃的にならず、旋律が優しく前へ出るだけである。</p>
<h2>成り立ち</h2><p>トロピカル・ハウスという呼び名は、オーストラリアの制作者Thomas Jackが、2013〜2014年頃に自身のミックス・シリーズの題名などに用い、半ば冗談として使い始めたとされる。Sam Feldtは、自分との共同作業から生まれた語だと語る。

この語が指し示す音は、EDMの過熱への対比・息抜きとして受け入れられた面がある。2010年代前半のアメリカとヨーロッパでは、いわゆるエレクトロ・ハウスやビッグルームと呼ばれる、極端に音圧の高い攻撃的なダンス音楽が、巨大な祭典を席巻していた。

この流れを広げた中心人物の一人が、ノルウェーのKygoだ。1991年生まれの彼は、当初、有名楽曲を穏やかに作り替えた音源をSoundCloudなどの共有サービスへ上げて、支持を集めた。2014年に発表した自作の楽曲によって、国際的な成功を収め始めた。Kygoはグランドピアノを弾く演出で知られる。

フランスのKlingandeが2013年に発表した楽曲、ドイツのRobin Schulzによる作り替え、そしてノルウェーのMatoma、ベルギーのLost Frequenciesが、同時期に人気を集めた。

流通において大きかったのは、SoundCloudやSpotify、YouTubeといった配信サービスの存在である。ダンス音楽としては珍しく、クラブではなくこれらのサービス上で広まったと評された。

しかし、この音楽には批判もあった。Black Madonnaは「EDMのビートを乗せたリラクゼーション・テープ」と評した。実際、2010年代半ばに最盛期を迎えた後は下火になり、Thomas Jack本人も2015年のインタビューで、模倣が増えて飽きたと語り、距離を置いた。ただし、遅いテンポで柔らかい音のダンス音楽という選択肢を、主流に定着させた功績はある。その質感は、現在のポップスにも広く残っている。</p>
