<h1>Tropical House（トロピカルハウス）とは</h1>
<p>ディープ・ハウスの構造を土台に、テンポを落とし、南国の情景を喚起する音色を乗せたダンス音楽である。テンポは概ね100から115 BPMと、通常のハウスより明確に遅い。この速度は、踊るためというより、日中の屋外や移動中に聴くことを想</p>
<p>ディープ・ハウスの構造を土台に、テンポを落とし、南国の情景を喚起する音色を乗せたダンス音楽である。テンポは概ね100から115 BPMと、通常のハウスより明確に遅い。この速度は、踊るためというより、日中の屋外や移動中に聴くことを想定したものである。キックは四つ打ちを保つが、音量は抑えられ、角の丸い柔らかい音色が選ばれる。低音は太く滑らかで、和音の変化に合わせて動く。決定的な要素は主旋律を担う音色で、パンフルート、スチールドラム、マリンバ、木琴といった南国や民族楽器を模した合成音が用いられ、これがこの分野を一瞬で識別させる印となっている。和音の敷物には、キックが鳴るたびに音量が押し下げられる処理が深くかけられ、全体が呼吸するように脈打つ。和声は明るい長調の四つの和音を循環させる単純な進行が中心である。構成上の最大の特徴は、通常のダンス音楽が持つ、緊張を溜めて激しく解放するという型を意図的に和らげている点で、盛り上がりの部分でも音は攻撃的にならず、旋律が優しく前へ出るだけである。歌が入る場合は伸びやかな歌唱が用いられ、歌詞は恋愛と解放感を扱う。</p>
<h2>成り立ち</h2><p>呼称の起源は2013年頃、オーストラリアの制作者Thomas Jackが、自分の作る遅く穏やかなハウスを半ば冗談として南国のハウスと呼んだことにあるとされる。この語が定着したのは、それが指し示す音が、当時のダンス音楽の状況に対する明確な反動だったからである。2010年代前半のアメリカとヨーロッパでは、いわゆるエレクトロ・ハウスやビッグルームと呼ばれる、極端に音圧の高い攻撃的なダンス音楽が巨大な祭典を席巻していた。その疲弊への反動として、耳に優しく、日中に聴ける音への需要が生まれたのである。この流れを決定づけたのはノルウェーのKygoである。1991年生まれの彼は、当初、有名楽曲を穏やかに作り替えた音源を動画共有サイトへ上げることで支持を集め、2014年に発表した自作の楽曲によって国際的な成功を収めた。ピアノを弾く姿と、南国的な音色による旋律の組み合わせは、この分野の標準となる。フランスのKlingandeが2013年に発表した楽曲、ドイツのRobin Schulzによる作り替え、そしてノルウェーのMatoma、ベルギーのLost Frequenciesが続いた。流通において決定的だったのは、音楽配信における再生一覧の存在である。夏、休暇、海辺といった主題で編まれた一覧に採用されることが、事実上の成功の条件となり、その基準に合わせて楽曲が設計されるという逆転が起きた。この構造は強い批判を招いた。すなわち、どの曲も同じに聞こえる、背景音として消費されるために作られている、という指摘である。実際、流行は2016年前後に頂点を迎えると急速に飽きられ、呼称自体が揶揄の対象となった。ただし、遅いテンポで柔らかい音のダンス音楽という選択肢を主流に定着させた功績はあり、その質感は現在のポップスにも広く残っている。</p>
