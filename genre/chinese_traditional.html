<h1>Chinese Traditionalとは</h1>
<p>中国の伝統音楽は、中国大陸で数千年かけて育ってきた、楽器の音楽と歌の音楽の全体を指す。 楽器は、材質によって金・石・糸・竹・匏・土・革・木の8音に分けられる。弦をはじく楽器には、まず古琴がある。7本の絹の弦を張り、指の位置を漢字で</p>
<p>中国の伝統音楽は、中国大陸で数千年かけて育ってきた、楽器の音楽と歌の音楽の全体を指す。

楽器は、材質によって金・石・糸・竹・匏・土・革・木の8音に分けられる。弦をはじく楽器には、まず古琴がある。7本の絹の弦を張り、指の位置を漢字で記す独自の楽譜を持つ。ほかに、爪をはめて弾く箏や、膝に立てて構え、輪指(高速のトレモロ)を多く使う琵琶がある。

弓でこする楽器の二胡は、2本の弦の間に弓の毛を挟み込む作りだ。指板がないため、音程は指で押さえる力だけで作る。滑音や揉弦によって、人の泣き声に近い表情を生む。

管楽器には、笛膜を貼って独特のびりつく響きを出す笛子、縦に構える簫、十数本の竹の管を束ねて和音を出せる笙、屋外で甲高く鳴る唢吶がある。打楽器は銅鑼、鈸、板鼓などで、芝居の場面の切り替えや立ち回りの合図を受け持つ。

音階の基本は、宮・商・角・徴・羽の5声だ。半音を含まない5音音階がメロディーの土台になり、そこに変徴・変宮を加えた7声も使われる。

和音を積み重ねる代わりに、支声(ヘテロフォニー)で厚みを出す。同じメロディーを、全員がそれぞれ違う飾りをつけて同時に奏でるやり方だ。そのため、西洋音楽のように和音が役割を持って移り変わる仕組みは、本来ない。

曲の組み立てにも特徴がある。拍の定まらない散板を曲の序や結びに置く形や、散から慢、快へと加速していく形が、多くの曲に見られる。</p>
<h2>成り立ち</h2><p>文字の記録としては、殷代の甲骨文に、すでに楽器や楽舞の記録がある。周代(紀元前11〜3世紀)になると、『詩経』など、まとまった文献が現れる。『詩経』は当時の歌の詞を集めたものだ。孔子は礼と並んで楽を国を治める要と位置づけ、音楽が人の心を整えるという考えを残した。

紀元前433年頃(またはそれ以降)に亡くなったと推定される曾侯乙の墓からは、64個の青銅の鐘を組んだ編鐘が出土した(ほかに楚の恵王が贈った別の鐘1個を加えて計65個)。1つの鐘の2か所を打つと違う高さの音が出る、精密な作りだった。鐘に刻まれた文字には、12音位を土台にして、楚・周・晋などの律名と対応させた細かな音律の仕組みが記されている。

楽府という音楽の役所については、秦代の甬鐘銘や封泥から、秦代の役所だったとする説が有力だ。一方、漢の武帝の時代に作られたとする説もある。武帝の時代には規模が広げられ、民間の歌が集められた。

唐代(618〜907)は、西域との交易を通じて、中央アジアの楽器が大量に流れ込んだ時期だ。洋梨型の琵琶も、中央アジアなど外から来た系統とみられ、南北朝期(北魏の石刻を含む)の図像に広く現れる。宮廷の燕楽は、国際色豊かなものだった。

宋代以降は都市の市民文化が発達し、語り物や戯曲と結びついた音楽が広がる。元代の雑劇、明清の崑曲を経て、18世紀末、安徽省の劇団が北京へ入ったことをきっかけに京劇が生まれた。京胡と打楽器が芝居を支える形が、ここで完成した。

20世紀に入ると、盲目の民間音楽家である阿炳(本名・華彦鈞)が、二胡の曲「二泉映月」を残した。1950年に録音されたこの曲は、中国の器楽の代表作となった。これより前の1910〜30年代には、劉天華(1895〜1932)が二胡の地位を高めていた。彼は1922年に北京大学音楽研究会の国楽導師となり、同年12月に音楽伝習所ができてからは、二胡・琵琶などの導師を務めた。練習曲47曲も作った。

1949年に中華人民共和国が成立すると、伝統楽器を西洋の管弦楽団に倣って編成した民族楽団が、各地に作られた。楽器そのものも、音量と音程のそろい方を求めて改造された。

しかし、文化大革命(1966〜76)で流れは途切れる。伝統の演目の多くが封建的だとして禁じられ、江青が主導する革命模範劇のみが上演された。改革開放の後、演目と教育は回復した。現在は、音楽学院での専門教育と、女子十二楽坊のような大衆向けの編成が並んで存在している。</p>
<h2>代表曲</h2><ul><li>高山流水 (項斯華)</li><li>賽馬 (劉宇)</li><li>广陵散 (孔子文)</li><li>二泉映月 (閔惠芬)</li><li>平湖秋月 (馬向華)</li><li>Butterfly Lovers' Violin Concerto（He Zhanhao &amp; Chen Gang）</li><li>十面埋伏 (劉德海)</li><li>阳春白雪 (吴蛮)</li><li>春江花月夜 (項斯華)</li><li>Fisherman's Song at Eventide（古箏伝統曲）</li><li>梅花三弄 (龚一)</li><li>汉宫秋月 (谢雪梅)</li></ul>
