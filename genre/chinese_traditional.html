<h1>Chinese Traditionalとは</h1>
<p>中国大陸で数千年かけて形成された器楽・声楽の総体。音階の基本は宮・商・角・徴・羽の五声で、半音を含まない五音音階が旋律の骨格をなし、そこに変徴・変宮を加えた七声も用いられる。和音を積み重ねる代わりに、同じ旋律を全員がそれぞれ違う装</p>
<p>中国大陸で数千年かけて形成された器楽・声楽の総体。音階の基本は宮・商・角・徴・羽の五声で、半音を含まない五音音階が旋律の骨格をなし、そこに変徴・変宮を加えた七声も用いられる。和音を積み重ねる代わりに、同じ旋律を全員がそれぞれ違う装飾で同時に奏でる支声(ヘテロフォニー)によって厚みを出すため、西洋音楽のような機能和声は本来存在しない。楽器は材質によって金・石・糸・竹・匏・土・革・木の八音に分類される。撥弦楽器では、7本の絹弦を張り指の位置を漢字で記す独自の楽譜を持つ古琴、爪をはめて弾く箏、膝に立てて構え輪指(高速のトレモロ)を多用する琵琶がある。擦弦楽器の二胡は2本の弦の間に弓の毛を挟み込む構造で、指板がないため音程を指の圧力だけで作り、滑音や揉弦によって人の泣き声に近い表情を生む。管楽器には笛膜を貼って独特のびりつく響きを出す笛子、縦に構える簫、十数本の竹管を束ねて和音を出せる笙、屋外で甲高く鳴る唢吶がある。打楽器は銅鑼、鈸、板鼓などで、戯曲の場面転換や立ち回りの合図を担う。曲は拍の定まらない散板から始まり、慢・中・快と加速して再び散板に戻る展開が典型である。</p>
<h2>成り立ち</h2><p>文献上の起源は周代(紀元前11〜3世紀)にさかのぼる。『詩経』は当時の歌の詞を集めたものであり、孔子は礼と並んで楽を統治の要と位置づけ、音楽が人心を整えるという思想を残した。紀元前433年に没した曾侯乙の墓からは65個の青銅の鐘を組んだ編鐘が出土し、1つの鐘の2か所を打つと異なる音高が出る精緻な設計と、十二律の音律体系が当時すでに確立していたことを示した。漢代には宮廷に楽府という音楽官庁が置かれ、民間の歌が収集された。唐代(618〜907)は西域との交易を通じて中央アジアの楽器が大量に流入した時期で、琵琶はペルシア起源の楽器が改良されたものであり、宮廷の燕楽は国際色豊かなものだった。宋代以降は都市の市民文化が発達し、語り物や戯曲と結びついた音楽が広がる。元代の雑劇、明清の崑曲を経て、18世紀末に安徽省の劇団が北京へ入ったことをきっかけに京劇が成立し、京胡と打楽器が芝居を支える形式が完成した。20世紀に入ると、盲目の民間音楽家である阿炳(本名・華彦鈞)が二胡曲「二泉映月」を残し、1950年に録音されたこの曲は中国器楽の代表作となった。同時期、劉天華は二胡を路上の楽器から音楽学校の教材へと引き上げ、西洋のヴァイオリン技法を取り入れた練習曲を整備した。1949年の中華人民共和国成立後は、伝統楽器を西洋の管弦楽団に倣って編成した民族楽団が各地に作られ、楽器自体も音量と音程の均一性を求めて改造された。文化大革命(1966〜76)では伝統演目の多くが封建的として禁じられ、江青が主導する革命模範劇のみが上演されるという断絶が起きた。改革開放後に演目と教育は回復し、現在は音楽学院での専門教育と、女子十二楽坊のような大衆向けの編成が並存している。</p>
<h2>代表曲</h2><ul><li>The Moon Reflected on the Second Spring（阿炳）</li><li>Butterfly Lovers' Violin Concerto（He Zhanhao &amp; Chen Gang）</li><li>Fisherman's Song at Eventide（古箏伝統曲）</li></ul>
