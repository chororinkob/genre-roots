<h1>Cool Jazz（クールジャズ）とは</h1>
<p>ビバップの熱狂と速度への反動として、抑制と均衡を選び取ったジャズ。BPM（1分間の拍数）は中庸から遅めで、音量は全体に小さく保たれる。管楽器の音色が最大の識別点で、サックスは軽い音色を用い、トランペットもミュート（音を弱める器具）</p>
<p>ビバップの熱狂と速度への反動として、抑制と均衡を選び取ったジャズ。BPM（1分間の拍数）は中庸から遅めで、音量は全体に小さく保たれる。管楽器の音色が最大の識別点で、サックスは軽い音色を用い、トランペットもミュート（音を弱める器具）を多用して角を丸める。「cool」の呼び名は、1953年頃、CapitolのLP『Classics in Jazz: Cool and Quiet』の発売を機にこの音楽に当てはめられ、広まった。編成には通常のジャズ編成には少ない楽器が加わり、フレンチホルンやチューバなどが用いられる。書き方の面では、対位法（複数の旋律が独立して同時に進行する手法）が積極的に取り入れられ、バロック音楽やクラシックの室内楽に近い緻密な編曲が施される。和声（コードの響き）は拡張和音（基本の和音に高い音を足した和音）を用い、テンポはビバップより緩やかである。即興は激情ではなく論理を旨とし、旋律的な線の美しさが評価される。リズムは軽く、ドラムは音量を抑え、ベースは滑らかに進む。全体として、ジャズを室内楽（少人数の合奏）のようにじっくり聴く対象として示す試みであった。</p>
<h2>成り立ち</h2><p>決定的な出発点は1949年から1950年にかけて、ニューヨークで行われたMiles Davisを中心とする9人編成のスタジオ録音である（1948年にはライブ出演があった）。これらは1957年にLP『Birth of the Cool』（11曲）としてまとめられた。集まりの中心人物はカナダ出身のGil Evansで（編曲者にはMulligan、Lewis、Carisiらもいた）、彼のアパートの部屋が若い音楽家たちの議論の場となっていた。参加者にはGerry Mulligan、Lee Konitz、John Lewis、Max Roachらがいる。彼らはビバップの手法を踏まえながら、大編成の色彩とビバップの機動性を両立させる編曲を模索した。もう一つの源流はピアニストLennie Tristanoの周辺で、彼は対位法的な即興と厳格な訓練を弟子に課し、Lee KonitzやWarne Marshを育てた。1950年代に入ると、この考え方は米国西海岸で商業的に開花し、ウエストコースト・ジャズと呼ばれるようになる。Gerry Mulligan がロサンゼルスでピアノを含まない四重奏を結成し、トランペットのChet Bakerとの対位法的な絡みが人気を博した。Chet Bakerは甘い外見と囁くような歌唱でも人気を集めたが、長年の薬物依存の末、1988年にアムステルダムのホテルから転落して死去した（事故と判断されたが、状況には別説もある）。Dave Brubeck四重奏団は1959年のTime Outで、4分の5拍子のTake Fiveをはじめ、変拍子や珍しい拍子の実験を中心とする作品を発表し、ジャズのアルバムとして初めて100万枚以上を売ったとされる。批判も強く、批評の言説に人種的な偏りがあったと論じられている。一方で、Miles DavisやJohn Lewis、Max Roachなど黒人の演奏家も重要な役割を担った。ハードバップは1950年代半ばにニューヨークとデトロイトで起こり、クール・ジャズへの反応とする見方や、他の要因を挙げる見方がある。</p>
<h2>代表曲</h2><ul><li>My Funny Valentine (Chet Baker)</li><li>Blue Rondo à la Turk (The Dave Brubeck Quartet)</li><li>Boplicity (Miles Davis)</li><li>Moon Dreams (Miles Davis)</li><li>Walkin' Shoes (Gerry Mulligan Quartet)</li><li>Let's Get Lost (Chet Baker)</li><li>Django (The Modern Jazz Quartet)</li><li>Bernie's Tune (Gerry Mulligan)</li><li>Jeru (Miles Davis)</li><li>Godchild (Miles Davis)</li><li>Line for Lyons (Gerry Mulligan Quartet)</li><li>Rocker (Miles Davis Nonet)</li></ul>
