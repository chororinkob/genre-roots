<h1>Cool Jazz（クールジャズ）とは</h1>
<p>クール・ジャズは、ビバップの熱狂と速度への反動として、抑制と均衡を選び取ったジャズだ。ジャズを室内楽（少人数の合奏）のようにじっくり聴く対象として示す試みであった。 音色には特徴がある。軽い音色、遅いかゼロのヴィブラート、控えめな</p>
<p>クール・ジャズは、ビバップの熱狂と速度への反動として、抑制と均衡を選び取ったジャズだ。ジャズを室内楽（少人数の合奏）のようにじっくり聴く対象として示す試みであった。

音色には特徴がある。軽い音色、遅いかゼロのヴィブラート、控えめなドラムなどが特徴である。ミュート（音を弱める器具）はMiles Davisなどが1950年代に多用した。編成については、Birth of the Coolなどではフレンチホルンやチューバが加わった。

曲の書き方では、対位法（複数の旋律が独立して同時に進行する手法）が積極的に取り入れられた。バロック音楽やクラシックの室内楽に近い、緻密な編曲が施される。和声（コードの響き）には、珍しい和声の試みが見られる。即興は激情ではなく論理を旨とし、旋律的な線の美しさが評価される。

リズムは軽い。BPM（1分間の拍数）は中庸から遅めで、テンポはビバップより緩やかだ。音量は全体に小さく保たれる。ドラムは音量を抑え、ベースは滑らかに進む。

「cool」の呼び名は、1953年頃、Capitolの10インチLP『Classics in Jazz: Cool &amp; Quiet』（H-371）などを機に、この音楽に使われ始めたとされる。</p>
<h2>成り立ち</h2><p>クール・ジャズは、1940年代後半にThornhill楽団の流れから生まれた。1949年から1950年にかけて、ニューヨークで録音が行われた。Miles Davisを中心とする9人編成のスタジオ録音で、これが代表的な出発点とされる（1948年にはライブ出演があった）。録音は1957年にLP『Birth of the Cool』（11曲）としてまとめられた。

集まりの場となったのは、Gil Evansのアパートだ。彼はカナダ出身で、アパートの提供者であり、編曲面の中心の一人でもあった（編曲者にはMulligan、Lewis、Carisiらもいた）。彼のアパートの部屋が、若い音楽家たちの議論の場となっていた。バンドのリーダーはMiles Davisである。参加者にはGerry Mulligan、Lee Konitz、John Lewis、Max Roachらがいる。彼らはビバップの手法を踏まえながら、大編成の色彩とビバップの機動性を両立させる編曲を模索した。

もう一つの源流は、ピアニストLennie Tristanoの周辺にあった。彼は対位法的な即興と厳格な訓練を弟子に課し、Lee KonitzやWarne Marshを育てた。

1950年代前半になると、カリフォルニアで活動した白人奏者らの録音や宣伝が目立つようになる。そこにウエストコースト・ジャズというラベルが当てられた。Gerry Mulligan がロサンゼルスでピアノを含まない四重奏を結成し、トランペットのChet Bakerとの対位法的な絡みが人気を博した。Chet Bakerは甘い外見と囁くような歌唱でも人気を集めた。しかし長年の薬物依存の末、1988年にアムステルダムのホテルから転落して死去した（事故と判断されたが、状況には別説もある）。

1959年には、Dave Brubeck四重奏団がTime Outを発表した。4分の5拍子のTake Fiveをはじめ、変拍子や珍しい拍子の実験を中心とする作品だ。ジャズのアルバムとして初めて100万枚を売ったと言われる（RIAA認証は1963年にゴールド、1997年にプラチナ、2011年にダブルプラチナ）。

一方で、批評家の一部が、奏者に白人が多いことなどを理由に評価を低くした。それでも、Miles DavisやJohn Lewis、Max Roachなど黒人の演奏家も重要な役割を担った。

ハードバップは、1950年代半ばに、ニューヨークのJazz Messengersが起源とされる（デトロイトも初期の中心とする説もある）。クール・ジャズへの反応とする見方や、他の要因を挙げる見方がある。</p>
<h2>代表曲</h2><ul><li>My Funny Valentine (Chet Baker)</li><li>Blue Rondo à la Turk (The Dave Brubeck Quartet)</li><li>Boplicity (Miles Davis)</li><li>Moon Dreams (Miles Davis)</li><li>Walkin' Shoes (Gerry Mulligan Quartet)</li><li>Let's Get Lost (Chet Baker)</li><li>Django (The Modern Jazz Quartet)</li><li>Bernie's Tune (Gerry Mulligan)</li><li>Jeru (Miles Davis)</li><li>Godchild (Miles Davis)</li><li>Line for Lyons (Gerry Mulligan Quartet)</li><li>Rocker (Miles Davis Nonet)</li></ul>
