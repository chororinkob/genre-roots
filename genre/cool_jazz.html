<h1>Cool Jazz（クールジャズ）とは</h1>
<p>ビバップの熱狂と速度への反動として、抑制と均衡を選び取ったジャズ。BPMは中庸から遅めで、音量は全体に小さく保たれる。管楽器の音色が最大の識別点で、サックスはビブラートをほとんどかけず、息の成分を多く含む乾いた音を用い、トランペッ</p>
<p>ビバップの熱狂と速度への反動として、抑制と均衡を選び取ったジャズ。BPMは中庸から遅めで、音量は全体に小さく保たれる。管楽器の音色が最大の識別点で、サックスはビブラートをほとんどかけず、息の成分を多く含む乾いた音を用い、トランペットもミュートを多用して角を丸める。この、感情を露骨に出さない音色そのものが様式の名の由来である。編成には通常のジャズで使われない楽器が加わり、フレンチホルン、チューバ、フルート、バリトン・サックスなどが用いられる。書法の面では、対位法、すなわち複数の旋律が独立して同時に進行する手法が積極的に取り入れられ、バロック音楽やクラシックの室内楽に近い緻密な編曲が施される。和声は拡張和音を用いるが、ビバップのような急速な変化を避け、一つの和音の上に長くとどまることも多い。即興は激情ではなく論理を旨とし、旋律的な線の美しさが評価される。リズムは軽く、ドラムはブラシを用いて音量を抑え、ベースは滑らかに進む。全体として、ジャズを室内楽的な聴取の対象として提示する試みであった。</p>
<h2>成り立ち</h2><p>決定的な出発点は1948年から1950年、ニューヨークで行われたMiles Davisを中心とする九人編成の録音である。これらは後にBirth of the Coolとして一枚にまとめられた。中心的な編曲者はカナダ出身のGil Evansで、彼のアパートの部屋が若い音楽家たちの議論の場となっていた。参加者にはGerry Mulligan、Lee Konitz、John Lewis、Max Roachらがいる。彼らはビバップの語法を踏まえながら、大編成の色彩とビバップの機動性を両立させる編曲を模索した。もう一つの源流はピアニストLennie Tristanoの周辺で、彼は対位法的な即興と厳格な訓練を弟子に課し、Lee KonitzやWarne Marshを育てた。1950年代に入ると、この美学は米国西海岸で商業的に開花し、ウエストコースト・ジャズと呼ばれるようになる。Gerry Mulligan がロサンゼルスでピアノを含まない四重奏を結成し、トランペットのChet Bakerとの対位法的な絡みが人気を博した。Chet Bakerは甘い外見と囁くような歌唱でも人気を集めたが、長年の薬物依存の末、1988年にアムステルダムのホテルの窓から転落死している。Dave Brubeck四重奏団は1959年のTime Outで、四分の五拍子のTake Fiveをはじめ変拍子を主題とする作品を発表し、ジャズのアルバムとして初めて100万枚を売り上げた。批判も強く、この様式は白人演奏家が中心であり、黒人の音楽から熱と身体性を取り除いて商業化したという指摘が繰り返しなされた。実際、レコード会社の宣伝と批評における人種的な偏りは存在した。この批判への反動として、1950年代半ばに東海岸でハードバップが起こることになる。</p>
<h2>代表曲</h2><ul><li>My Funny Valentine (Chet Baker)</li><li>Boplicity (Miles Davis)</li><li>Moon Dreams (Miles Davis)</li><li>Rocker (Miles Davis Nonet)</li><li>Bernie's Tune (Gerry Mulligan)</li></ul>
