<h1>Digital Hardcore（デジタルハードコア）とは</h1>
<p>パンクの態度とハードコア・テクノの速さ、そしてノイズを正面から衝突させた音楽。土台は打ち込みのブレイクビーツで、アーメン・ブレイクなどのドラムのループを極端に速く、しかも歪ませて再生する。テンポは毎分160から200拍を超える程度</p>
<p>パンクの態度とハードコア・テクノの速さ、そしてノイズを正面から衝突させた音楽。土台は打ち込みのブレイクビーツで、アーメン・ブレイクなどのドラムのループを極端に速く、しかも歪ませて再生する。テンポは毎分160から200拍を超える程度に達し、しばしばリズムが崩壊寸前まで加速する。ここに歪ませたエレキギターのリフ、金属的なノイズ、警報音、そして意図的にクリップさせた音の壁が積み重ねられる。低音は割れるまで押し込まれ、耳に痛い高音がそのまま残される。音量の均し方も特徴的で、全体を圧縮して常に最大音量が続く状態が作られ、聴き手に休みを与えない。和音や旋律はほとんど存在せず、音色そのものと速度が表現の中心になる。歌唱は絶叫で、しばしば演説のような語りが挟まれる。歌詞は明確に政治的で、反ファシズム、反資本主義、警察と国家への批判、移民排斥への抗議が具体的に書かれる。音楽の内容と政治的な実践が不可分であることを主張する点が、他の高速電子音楽との決定的な違いである。ライブは会場を破壊しかねない音量と、観客との物理的な混乱を伴うことが多い。</p>
<h2>成り立ち</h2><p>作り手も名づけ親も、ベルリンのAlec Empireである。1992年、彼は東西統一直後のベルリンでAtari Teenage Riotを結成した。当時のドイツでは、統一後の混乱の中でネオナチによる外国人襲撃が相次ぎ、1992年のメルンや1993年のゾーリンゲンで放火殺人事件が起きていた。一方でテクノは急速に商業化し、政治性を失いつつあった。Empireはその両方に対する怒りから、テクノの速度にパンクの叫びと明確な反ファシズムの主張を叩き込んだ。バンドはEmpire、女性MCのHanin Elias、MCのCarl Crackの3人で結成され、1996〜97年にはNic Endoが電子ノイズの担当として加わった。彼は1994年に自主レーベルDigital Hardcore Recordingsを設立し、これがそのまま様式の名になった。レーベルからはEC8OR、Shizuo、Bomb 20、Christoph de Babalonといった作り手が作品を出した。ATRは1993年に大手のPhonogram Recordsと契約しており、その前払金で自主レーベルを設立した形である。1999年5月1日のメーデーに、ベルリンで行われたNATOのユーゴスラビア(コソボ)空爆への抗議デモで、Atari Teenage Riotが演奏した。約3万人の群衆と警察が衝突し、バンドは「暴力扇動」の容疑で逮捕された。この事件はこの音楽の性格を象徴している。バンドは2000年に活動を休止し、2001年9月6日にメンバーのCarl Crackが出所不明の錠剤の過剰摂取で亡くなった。Alec Empireはその後もソロで活動を続け、2010年にバンドを再結成している。この音楽は商業的には限られていたが、『Burn, Berlin, Burn!』の成功により1997年にはWu-Tang Clan、Rage Against the Machine、Nine Inch Nailsらとツアーするなど、一定の成功を収めた。電子音楽に政治的な内容を持ち込むことは可能だと示した点で、その後のブレイクコアやノイズ寄りの電子音楽に道を開いた。</p>
