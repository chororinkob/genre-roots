<h1>Digital Hardcore（デジタルハードコア）とは</h1>
<p>デジタルハードコアは、パンクの態度とハードコア・テクノの速さ、そしてノイズを、真正面からぶつけ合わせた音楽だ。 土台は打ち込みのブレイクビーツである。ドラムのループを、極端に速く、しかも歪ませて再生する。そこに、歪ませたエレキギタ</p>
<p>デジタルハードコアは、パンクの態度とハードコア・テクノの速さ、そしてノイズを、真正面からぶつけ合わせた音楽だ。

土台は打ち込みのブレイクビーツである。ドラムのループを、極端に速く、しかも歪ませて再生する。そこに、歪ませたエレキギターのリフ、金属的なノイズ、警報音が重なる。さらに、わざと音を割らせた音の壁が積み上げられる。低音は割れるまで押し込まれ、耳に痛い高音もそのまま残される。

音色そのものと速さが表現の中心になる。

テンポは、200 BPMを超えるとされることが多い。リズムが崩れる寸前まで加速することも多い。

歌は絶叫で、演説のような語りがしばしば挟まれる。歌詞ははっきりと政治的だ。反ファシズム、反資本主義、警察と国家への批判、移民排斥への抗議が、具体的に書かれる。

ライブは、会場を壊しかねない音量と、観客との物理的な混乱を伴うことが多い。</p>
<h2>成り立ち</h2><p>このスタイルを最初に定義したのはAtari Teenage Riotであり、名付けたのはAlec Empireである。1992年、彼は東西統一から間もないベルリンで、Atari Teenage Riotを結成した。

当時のドイツでは、統一後の混乱の中で、ネオナチによる外国人への襲撃が相次いでいた。1992年にはメルンで、バンド結成より後の1993年にはゾーリンゲンで、放火殺人事件が起きている。一方でEmpireは、テクノが急速に商業化し、政治性を失いつつあると見ていた。Empireはその両方への怒りから、テクノの速さに、パンクの叫びと明確な反ファシズムの主張を叩き込んだ。Empire本人は、最初のシングル「Hetzjagd auf Nazis!」が、1992年のロストックでの外国人収容施設襲撃への反応だったと語っている。

バンドはEmpire、女性MCのHanin Elias、MCのCarl Crackの3人で結成された。1997年ごろには、Nic Endoが電子ノイズの担当として加わった。Empireらは1994年に、自主レーベルDigital Hardcore Recordingsを設立する。これが、そのままスタイルの名前になった。レーベルからは、EC8OR、Shizuo、Bomb 20、Christoph de Babalonといった作り手が作品を出した。ATRは1993年に大手のPhonogram Recordsと契約しており、その前払金で自主レーベルを立ち上げた形である。

1999年5月1日のメーデー。ベルリンで、NATOのユーゴスラビア(コソボ)空爆に抗議するデモが行われ、Atari Teenage Riotが演奏した。約3万人の群衆と警察が衝突し、バンドは「暴力扇動」の容疑で逮捕された。ただし、容疑は後に取り下げられた。この事件は、この音楽の性格をよく表している。

バンドは2000年に、事実上活動を止めた。2001年9月6日には、メンバーのCarl Crackが、種類が特定されていない錠剤の過剰摂取で亡くなった。Alec Empireはその後もソロで活動を続け、2010年にバンドを再結成している。

この音楽は、商業的には限られていた。それでも、1997年には編集盤『Burn, Berlin, Burn!』が米国でも発売され、同じ年にRage Against the Machine、Wu-Tang Clanとツアーを回った。ただし、Wu-Tang Clanは途中で離脱している。1999年にはNine Inch Nailsの前座を務めるなど、一定の成功を収めた。Alec Empireの作品は、その後のブレイクコアの音の雛形になったという見方もある。</p>
