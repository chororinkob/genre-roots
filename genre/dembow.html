<h1>Dembow（デンボウ）とは</h1>
<p>カリブ海の島々で発達した、単一のリズム型を全ての曲で共有するという特異な構造を持つダンス音楽である。中核となるのは、一小節の中にキックとスネアを組み合わせた特定の打点配置で、簡潔に言えば四拍子の中で三つ、三つ、二つと数える不均等な</p>
<p>カリブ海の島々で発達した、単一のリズム型を全ての曲で共有するという特異な構造を持つダンス音楽である。中核となるのは、一小節の中にキックとスネアを組み合わせた特定の打点配置で、簡潔に言えば四拍子の中で三つ、三つ、二つと数える不均等な分割に対応している。この型は無数の楽曲で寸分違わず用いられ、聴き手はどの曲を聴いても同じ骨格を感じ取る。個々の曲の差異は、その上に乗せる音色、旋律、歌詞、そして細部の装飾によって作られる。つまり共有された土台の上で個性を競うという、ジャマイカの音楽文化に由来する発想がそのまま制度化されている。テンポは概ね90から100 BPM前後で、低音は太く短い音が繰り返され、上物には金属的なシンセの刺し込み、警笛、銃声、犬の吠え声といった鋭い効果音が置かれる。全体の音数は少なく、隙間が多い。歌唱はラップと歌の中間にあり、短い定型句を何度も繰り返す形が好まれる。歌詞は性的な誘い、踊りへの指示、地元への誇り、日常の苦境を、極めて直截な俗語で述べる。制作は簡素な機材で完結し、素人が短時間で作れることが、この音楽の爆発的な普及を支えている。</p>
<h2>成り立ち</h2><p>起点は1990年前後のジャマイカである。ダンスホール・レゲエの制作者Dennis Halliburtonがボビー・ディジタルの名で手掛けた楽曲と、その周辺で作られた伴奏の型が、後に全てのもとになった。ジャマイカでは一つの伴奏を複数の歌手が共有して別々の曲にするという慣習があり、その伴奏は固有の名で呼ばれる。この慣習が、単一のリズム型を共有するという発想の源である。1990年代前半、この音源がパナマとプエルトリコへ伝わった。パナマではEl Generalらが、ジャマイカの音楽をスペイン語で歌うという実践を先行させており、プエルトリコの都市部の若者たちがそれを受け継ぐ。当初この音楽はプエルトリコで、地下という意味の名で呼ばれ、カセットテープの手渡しによって流通していた。歌詞の露骨さと、貧困地区との結びつきから、1995年には当局による摘発が行われ、レコード店から音源が押収されるという弾圧を受けている。それでも流通は止まらず、2000年代前半にレゲトンという呼称のもとで一気に商業化した。2004年にDaddy Yankeeが発表した楽曲が国際的な大ヒットとなり、この音楽は世界的な存在となる。並行して、ドミニカ共和国では独自の変化が起きた。同じリズム型をより速く、より粗く、より簡素にしたものが現地でデンボウと呼ばれ、2010年代以降、El Alfaらを中心に爆発的な人気を得ている。ドミニカのそれは、電力事情の悪い地区でも安価な機材で作れることから、無数の若者が制作に参入し、毎週膨大な数の楽曲が生まれるという状況を作った。この音楽は繰り返し批判されてきた。歌詞の女性描写、暴力の称揚、そして単調さである。一方で、カリブ海の貧困地区の若者が自らの言葉で世界に届いた稀有な例でもあり、現在ではラテン音楽の主流を形成する土台となっている。</p>
