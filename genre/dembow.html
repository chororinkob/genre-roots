<h1>Dembow（デンボウ）とは</h1>
<p>デンボウは、ジャマイカで生まれ、ニューヨーク、パナマ、プエルトリコ、ドミニカ共和国へ広がって発達したダンス音楽だ。中核となるリズム型を、多くの曲で共有するという独特な仕組みを持つ。 中心となるのは、通常、4つ打ちのキックの上に3+</p>
<p>デンボウは、ジャマイカで生まれ、ニューヨーク、パナマ、プエルトリコ、ドミニカ共和国へ広がって発達したダンス音楽だ。中核となるリズム型を、多くの曲で共有するという独特な仕組みを持つ。

中心となるのは、通常、4つ打ちのキックの上に3+3+2のスネア(クロスリズム)が乗る型だ。ループの長さは、資料により1〜2小節である。この型は無数の楽曲で用いられる(レゲトン作品の8割超にDem Bow由来の要素が含まれると、Wayne Marshallは2008年時点で推定した)。聴き手は、どの曲を聴いても同じ土台を感じ取る。

個々の曲の差は、その上に乗せる音色、旋律、歌詞、そして細部の装飾によって作られる。つまり、共有された土台の上で個性を競う。この発想は、ジャマイカのリディム文化に着想を得ている。

テンポはレゲトン系で90〜100前後が典型だが、110台の例もある。ドミニカのスタイルでは110超〜135超と、スタイルによって異なる。低音は太く短い音が繰り返され、上物には、鋭い要素を足す制作者もいる。全体の音数は少なく、隙間が多い。

歌唱はラップと歌の中間にあり、短い定型句を何度も繰り返す形が好まれる。歌詞は、性的な誘い、踊りへの指示、地元への誇り、日常の苦境を、極めて直截な俗語で述べる。

ドミニカでは、資源の乏しい地区の若者が手元の機材で制作に参入したことが、普及の一因となった。</p>
<h2>成り立ち</h2><p>出発点は、1990年前後のジャマイカだ。

Steely &amp; Clevieが1989年に作ったリディム『Poco Man Jam』(通称『Fish Market』)を、Bobby Digital(Robert Dixon)がShabba Ranksの『Dem Bow』(1990年)に用いた。Dennis Halliburton(Dennis the Menace。Thompsonとする資料もある)が作ったPounderリディムは、Nando Boomの『Ellos Benia』に使われた。そのインスト版『Pounder (Dub Mix II)』が広まった。Fish Market/Dem Bowは、Bam BamやFever Pitchなど近縁のリディム群の一つである。起源には諸説ある。

ジャマイカでは、一つの伴奏を複数の歌手が共有して別々の曲にするという慣習があり、その伴奏は固有の名で呼ばれる。この慣習に着想を得て、プエルトリコの制作者が既存の伴奏をループ化して使った。1990年にニューヨークのHC&amp;Fスタジオでジャマイカ人とパナマ人が再録した版が、パナマとプエルトリコへ伝わり、広く使われた。

パナマではEl Generalらが、ジャマイカの音楽をスペイン語で歌うという実践を先行させていた。プエルトリコの都市部の若者たちが、それを受け継ぐ。当初この音楽はプエルトリコで、地下という意味の名で呼ばれ、カセットテープの手渡しによって流通していた。歌詞の露骨さと、貧困地区との結びつきから、1995年には当局による摘発が行われた。レコード店から音源が押収されるという取り締まりである。

それでも流通は止まらず、2000年代前半に商業的な転機を迎えた。2004年にDaddy Yankeeが発表した『Gasolina』が、2005年にかけて国際的なヒットとなり、この音楽は世界的な存在となる。

並行して、ドミニカ共和国では独自の変化が起きた。同じリズム型を、より速く、より粗く、より簡素にしたものが、現地でデンボウと呼ばれる(始まりの年は1990年代前半〜2000年代と諸説ある)。2010年代以降、El Alfaらを中心に爆発的な人気を得ている。ドミニカのそれは、資源に乏しい貧困地区の若者たちが手元の機材で制作に参入したことで広がった。

この音楽は、繰り返し批判されてきた。歌詞の露骨な性的描写などである。一方で、デンボウのリズムはレゲトンの土台となり、ドミニカのデンボウは2010年代以降に国際的な注目を集めた。</p>
