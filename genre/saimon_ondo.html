<h1>Saimon Ondoとは</h1>
<p>盆踊りの場で、物語を語るようにうたわれる音頭。代表曲22曲を動画で聴け、ルーツと影響のつながりを地図でたどれる。</p>
<p>盆踊りの場で、物語を語るようにうたわれる音頭。一言でいうと、祭文という語り芸が歌と踊りの形を帯びた音楽である。

中心の楽器は法螺貝と錫杖（しゃくじょう）である。音頭取りは小さな法螺貝を口に当て、拡声器がわりに息を送り、一同に「デロレン、デロレン」という合いの手を唱和させる。音頭取りが握る10センチほどの短い錫杖「金錠」を打ち鳴らし、キン、キンという音で拍子をとる。三味線が伴奏につくこともある。

和音は伴わない。節回しだけで成り立ち、語りの抑揚がそのままメロディになる。詞章は七七調が基調で、物語をしみじみ詠み込むクドキ調と呼ばれる形式をとる。

リズムは音頭取りと囃子方の掛け合いで生まれる。音頭取りが「デロレーン」と一声を上げると、囃子方が「ヨイト ヨイヤマカ ドッコイサノセ」の囃し言葉で答える。踊りの運びに合わせて錫杖の点打が拍子を保つ。

歌い方は、音頭取りが長い物語を節に乗せて語り、踊り手が合いの手で唱和する二部構成である。歌の合間に語りが戻り、語りの合間に歌が来る。

歌詞の主題は講談や実録に取材した物語である。仇討ちや心中、恋愛の話をうたう。和讃と呼ばれる仏教讃歌の演目もある。

曲の組み立てでは、歌い出しの外題づけで演目名を告げ、デロレンの貝をとなえ、錫杖で拍子をとってから物語に入る。長い物語が一晩をかけて進む。

江州音頭や河内音頭と同じくデロレン祭文の血を引くが、祭文語りの形式を色濃く残すとされる点が異なる。盆踊りのやぐらの上で、夏の盆の夜にうたわれる。</p>
<h2>成り立ち</h2><p>物語は、神道の祝詞を母体にした祭文から始まる。祭文は中世に仏教声明の影響を受けて山伏の布教手段となり、江戸時代に三味線と結びついて歌祭文と呼ばれる俗謡になった。元禄年間（1688-1704）には八百屋お七やお染久松の心中を題材にした演目が現れ、下世話な事件をクドキ調に詠み込む芸になった。大坂の生玉神社の境内には定設の小屋さえ建てられ、歌舞伎や文楽にも影響を与えた。

一方、江戸中期には法螺貝を口に当てて「デロレン」と囃すデロレン祭文が生まれ、寛政年間（1789-1801）には祭文太夫と呼ばれる俗人の門付芸として北関東・東北・近畿へ広がった。

文化6年（1809年）、近江国河瀬村南河瀬（現・滋賀県彦根市）に西沢寅吉が生まれる。八日市（現・東近江市）で板前をしていた寅吉は、生来の歌好きが高じて文政12年（1829年）、武蔵国岡部村（現・埼玉県深谷市）のデロレン祭文の名人万宝院桜川雛山に師事した。桜川歌寅と名乗った歌寅は、歌念仏と念仏踊り、貝祭文を祭文語りに取り入れた独特の節回しを考案し、話芸と踊りを融合させた新しい音頭を作り上げた。これが祭文音頭である。当初は近江の八日市で踊られた。

しかし歌寅はここで止まらず、親交のあった奥村久左衛門（初代真鍮家好文）の協力で節回しと演目を音曲へ大成させた。明治初年、滋賀県豊郷町下枝の千樹寺の本堂再建の落慶法要で興行として演じられ、その音頭に乗って村人たちが踊り明かしたと伝わる。これが江州音頭の始まりとされる。歌寅は師匠の許しを得て初代桜川大龍を名乗り、江州音頭の家元となり、1890年3月29日に没するまで普及に尽くした。

その後、近江商人兼業の音頭取りたちが街道筋の各地へ江州音頭を伝え、滋賀県全域と近畿の各府県に広がった。明治中頃には大龍の門弟たちが大阪千日前界隈の寄席に進出して人気演目となり、砂川捨丸や中村春代ら音頭取り出身者は漫才や浪曲の舞台へ転じた。江州音頭は河内音頭の成立にも多大な影響を及ぼしている。

一方、元の祭文音頭は地方の盆踊りに残った。佐倉宗吾くどきや石童丸苅茅道心くどきで盆踊りを踊る土地も近年まであった。奈良市田原地区では、戦前に大和高原一帯を巡業した伊賀地方の山崎派一座の影響で結成された砂川座の流れが祭文と祭文音頭を伝え、現在も8月14日の盆踊りで踊られている。この田原の祭文・祭文音頭・おかげ踊りは奈良県指定無形民俗文化財に指定されている。</p>
