<h1>Spirituals（スピリチュアルズ）とは</h1>
<p>アメリカの奴隷制のもとで、連行されたアフリカ系の人々の間から生まれた宗教的な歌だ。 サウスカロライナ（1740年）などで、太鼓など大きな音の出る楽器が禁じられ、声と身体を中心に成り立つ形を持つと指摘される(弦楽器は許されることもあ</p>
<p>アメリカの奴隷制のもとで、連行されたアフリカ系の人々の間から生まれた宗教的な歌だ。

サウスカロライナ（1740年）などで、太鼓など大きな音の出る楽器が禁じられ、声と身体を中心に成り立つ形を持つと指摘される(弦楽器は許されることもあった)。

中心にあるのは呼びかけと応答だ。一人が短い一節を歌い、集団が決まった応答を返す。このやり取りが延々と繰り返される。

この歌は、アフリカ由来の要素と、白人の農村フォーク賛美歌・キャンプ集会の歌が混ざり合って成立したと考えられる。呼びかけと応答は、両方の伝統にある。歌の指導者は毎回違う言葉を歌えるので、即興による変化が織り込まれている。

音階は5音音階がよく使われ、そこに音程をわざと不安定にする音が混ざる。これは後にブルーノートと呼ばれる音使いに通じるとされる。ここでは、アフリカと白人フォークの双方に見られる要素が重なった。

リズムは複雑だ。手拍子と足踏みが拍を刻む一方、歌はその拍からずらして置かれ、独特のうねりを生む。

集団で反時計回りに円を描き、足を擦って進む踊りが伴うこともあった。そこでは、足を交差させないという決まりが守られた。これは、踊りを禁じる教えを避けるための工夫だったとされる。

歌詞は聖書を題材にする。とりわけ出エジプトの物語や、ヨルダン川を渡ることを扱い、解放と救いへの願いがテーマになる。同じ言葉が、この世での逃亡を指すとも読める。そうした二重の意味が、読み込まれてきた。</p>
<h2>成り立ち</h2><p>舞台は、アメリカ南部だ。

奴隷とされ、連行されたアフリカ人(北米へ直接連行されたのは推計で約38.8万人)とその子孫。この歌は、彼らの暮らしの中で生まれた。18世紀（初頭〜後半と資料により異なる）に成立し、19世紀に広まった。

彼らは出身地も言語も異なっていた。家族は分断され、母語を奪われた。宗教的な実践は禁じられ、強い圧力を受けた。それでも、アフリカの信仰の要素は、キリスト教と混ざり合って受け継がれた。

キリスト教が持ち込まれたのは17世紀だ。その後、18世紀の大規模な宗教運動や、19世紀初めのキャンプ集会を通じて広まった。大規模な改宗の時期は、第一次大覚醒（1730年代〜）とする説と、第二次大覚醒（18世紀末〜19世紀初頭）とする説がある。

彼らはキリスト教を受け入れた。ただし、そのまま受け取ったのではない。アフリカの音楽の組み立てと身体の感覚の中へ、組み替えたのだ。その結果生まれたのが、この歌である。

歌の内容には、しばしば二重の意味が読み込まれてきた。約束の地へ向かうという聖書の言葉が、同時に北部や自由州への逃亡を指す。川を渡れという歌詞は、追っ手の犬に匂いをたどらせないための、実際の指示だった。そうした解釈である。

この暗号説は広く知られている。しかし、『Follow the Drinking Gourd』などの暗号説は、当時の記録による裏付けに乏しいとされる。近年の研究は、慎重な検討を促している。ただし、タブマンが一部の歌を合図に使った記録や、ダグラスの二重の意味の証言はある。解放への希望が歌に込められていたことは確かだ。

霊歌の最初の主要な歌集は、1867年に出版されている。そして1871年は、この歌がコンサートの曲目として広まる転機の年となった。

ナッシュヴィルに設立された黒人のための大学が、お金の面で破綻しかけた。そこで学生による合唱団が、資金集めのために巡業に出た。巡業の曲目は当初、クラシック・一般曲が中心で、霊歌は少数だった。聴衆の反応を受けて、霊歌の割合を増やした。ヨーロッパの演奏会のスタイルに合わせて編曲した霊歌を、歌うようになった。冷淡さや敵意に遭った後、やがてアメリカとヨーロッパで熱狂的に迎えられ、大学は救われた。この巡業によって、この歌は評価を得た。

20世紀には、Paul RobesonやMarian Andersonが、演奏会でこの歌を歌った。1939年、後者は人種を理由に、首都の会場を使うことを拒まれた。その際、彼女はリンカーン記念堂の階段で、約7万5千人を前に歌った。この場面は、公民権運動のシンボルとして記憶されている。

この歌は、ゴスペルとブルースの重要な源流の一つである。公民権運動のフリーダム・ソングには、霊歌を翻案したものが多い（ただし賛美歌・ゴスペル・労働歌由来も多い）。</p>
