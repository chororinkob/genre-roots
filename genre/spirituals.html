<h1>Spirituals（スピリチュアルズ）とは</h1>
<p>アメリカの奴隷制下で、連行されたアフリカ系の人々の間から生まれた宗教的な歌である。太鼓など大きな音の出る楽器が規制された環境で、声と身体を中心に成立する構造を持つ(弦楽器は許されることもあった)。中核をなすのは呼びかけと応答で、一</p>
<p>アメリカの奴隷制下で、連行されたアフリカ系の人々の間から生まれた宗教的な歌である。太鼓など大きな音の出る楽器が規制された環境で、声と身体を中心に成立する構造を持つ(弦楽器は許されることもあった)。中核をなすのは呼びかけと応答で、一人が短い一節を歌い、集団が定型の応答を返すという往復が延々と繰り返される。この形式は、アフリカの音楽的な要素と、宣教師らがもたらした賛美歌との融合から生まれたもので、歌の指導者は毎回異なる言葉を歌えるため、即興による変化が織り込まれている。音階は5音音階がしばしば用いられ、そこに音程を意図的に不安定にする音が混ざる。これは後にブルーノートと呼ばれるものである。リズムは複雑で、手拍子と足踏みが拍を刻む一方、歌はその拍からずらして置かれ、独特のうねりを生む。集団で反時計回りに円を描きながら足を擦って進む形式の踊りが伴うこともあり、足を交差させないという規則が守られた。これは踊りを禁じる教義を回避するための工夫だったとされる。歌詞は聖書、とりわけ出エジプトの物語や、ヨルダン川を渡ることを扱い、解放と救済への希求が主題となる。同じ言葉が現世の逃亡を指すとも読めるという二重の意味が、読み込まれてきた。</p>
<h2>成り立ち</h2><p>この歌が生まれたのは、17世紀から19世紀にかけてアメリカ南部で奴隷とされた、連行されたアフリカ人(北米へ直接連行されたのは約38.8万人)とその子孫の生活の中である。彼らは出身地も言語も異なり、家族は分断され、母語も宗教も奪われた。キリスト教は17世紀に導入され、18世紀の大規模な宗教運動や19世紀初頭のキャンプ集会を通じて広まった。彼らはキリスト教を受け入れたが、それをそのまま受け取ったのではなく、アフリカの音楽的な構造と身体感覚の中へ組み替えた。その結果生まれたのがこの歌である。歌の内容には、しばしば二重の意味が読み込まれてきた。約束の地へ向かうという聖書の言葉が、同時に北部や自由州への逃亡を指し、川を渡れという歌詞が、追跡犬に匂いを断つための実際的な指示だったという解釈である。この暗号説は広く流布しているが、逃亡の実用的な暗号だったという主張には当時の記録による裏付けが乏しいとされ、近年の研究は慎重な検討を促している。解放への希望が歌に込められていたことは確かだが、逃亡者への文字どおりの指示だったとは言えない。霊歌の最初の歌集は1867年に出版されており、1871年は、この歌がコンサートの曲目として広まる転機となった年である。ナッシュヴィルに設立された黒人のための大学が財政的に破綻しかけた際、学生による合唱団が資金集めのために巡業へ出た。彼らの巡業の曲目は当初、大半が一般曲やクラシックで、霊歌は少数だった。聴衆の反応を受けて霊歌の比重を増やし、ヨーロッパの演奏会の様式に合わせて編曲した霊歌を歌うようになり、当初は嘲笑されたが、やがてアメリカとヨーロッパで熱狂的に迎えられ、大学は救われた。この巡業によって、この歌は芸術音楽としての地位を得る。20世紀にはPaul RobesonやMarian Andersonが演奏会でこれを歌った。1939年、後者が人種を理由に首都の会場の使用を拒まれた際、リンカーン記念堂の階段で7万5千人以上を前に歌ったことは、公民権運動の象徴的な場面として記憶されている。この歌はゴスペルとブルースの母体であり、1960年代の運動における歌の直接の源でもある。</p>
