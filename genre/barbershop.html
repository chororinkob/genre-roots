<h1>Barbershop（バーバーショップ）とは</h1>
<p>バーバーショップは、4声部・無伴奏・密集した和声で編曲する様式で、4声部のアカペラ・ハーモニーを核とする。楽器は一切使用せず、テナー・リード・バリトン・ベースの4パートが緊密に絡み合い、純正律（和音が濁らず響く音程）に近い音程で和</p>
<p>バーバーショップは、4声部・無伴奏・密集した和声で編曲する様式で、4声部のアカペラ・ハーモニーを核とする。楽器は一切使用せず、テナー・リード・バリトン・ベースの4パートが緊密に絡み合い、純正律（和音が濁らず響く音程）に近い音程で和音を構築する。最大の特徴は「バーバーショップ・コード」と呼ばれる属七和音（ドミナント・セブンス）の多用であり、属七和音が、5度ずつ進む流れ（5度圏）に沿って連鎖的に解決していく進行が独特の甘い緊張感を生む。この和音が完全に共鳴したとき、4声部の倍音が重なり合って、5声目のように感じられる「幽霊音」が聴こえる現象を「リング」と呼び、バーバーショップ最大の美学とされる。

メロディーはリード声部が担い、テナーはリードの上を飾り、バリトンはコードを埋め、ベースが根音を支える。この構造はクラシックのSATB合唱（ソプラノ・アルト・テノール・バスの混声合唱）とは異なり、テナーが最高音を担う点が特徴的だ。音域は比較的狭く設定され、全声部が密集した音域で鳴ることで倍音の共鳴が最大化される。

リズムは、中速や速い曲は譜面どおりに、遅い曲や導入部はルバート（自由なテンポ）で語るように歌われることが多い。打楽器がないため、リズムの推進力はもっぱら和音の解決感と歌詞のアクセントによって生まれる。

歌唱スタイルは非常に表情豊かで、だんだん強く、だんだん弱くを細かく使い分け、フレーズの山で和音を「張る」ことでリングを引き出す。過度なビブラートを避けて歌うことが基本とされる。これは大きなビブラートが倍音の共鳴を乱すためだ。歌詞の主題は恋愛・郷愁・ユーモアが中心で、19世紀末から20世紀初頭のアメリカ大衆文化を色濃く反映している。

隣接ジャンルとの違いを挙げると、ゴスペルは宗教的主題と感情的な発声を重視するのに対し、バーバーショップは世俗的な主題と純粋な和声美を追求する。ドゥーワップは1940年代に黒人都市コミュニティで生まれたR&amp;Bの一種で、ゴスペルやミルズ・ブラザーズなどの影響を受けた。合唱には伴奏付きも無伴奏もあるが、バーバーショップは完全に無伴奏だ。

この音楽が実際に鳴っている場所としては、競技会（コンテスト）が最も典型的だ。バーバーショップ・ハーモニー・ソサエティ主催の国際大会（International Convention）では、国際カルテット部門に50組前後が出場し、コーラスとともに審査員の前で演じる。また、地域のコミュニティ・センターや教会ホール、パレードの沿道でも披露される。</p>
<h2>成り立ち</h2><p>バーバーショップの起源は、1880〜90年代にアフリカ系アメリカ人のコミュニティで広く行われていた四重唱の伝統に求められる。地域や社会的な背景は、はっきり分かっていない。当時の理髪店（バーバーショップ）は単なる散髪の場ではなく、地域の男性たちが集まり、時間を潰しながら歌い合う社交の場でもあったと言われる。名称は理髪店との結びつきに由来するといわれることがあるが、確定していない。

19世紀末のアメリカでは、楽譜出版業（ティン・パン・アレー）が隆盛し、家庭での歌唱が娯楽の中心だった。ラジオも蓄音機も普及していない時代、人々は自ら歌うことで音楽を楽しんだ。この文化的土壌の中で、黒人コミュニティの伝統に端を発したハーモニーが、白人のプロのカルテットの録音を通じて混ざり合っていったという見方が有力である。ただし、起源をめぐる議論は現在も決着していない。

1938年、オクラホマ州タルサで税務弁護士のO.C.キャッシュ（Owen C. Cash）と投資銀行家のルパート・I・ホールが「米国におけるバーバーショップ・カルテット歌唱の保存・奨励協会（SPEBSQSA）」を設立した。この協会は2004年以降、通称・ブランド名として「バーバーショップ・ハーモニー・ソサエティ（BHS）」を使っており、ジャンルの制度化・標準化に決定的な役割を果たした。同協会はコンテストのルール、和声の定義、審査基準を体系化し、バーバーショップを趣味の集まりから競技音楽へと昇格させた。

1945年には女性のための組織「スウィート・アデラインズ・インターナショナル」（2026年5月にSingUnited Internationalへ改称）が設立され、女性バーバーショップも独自の発展を遂げた。さらに1959年には「ハーモニー・インコーポレーテッド（Harmony, Incorporated）」が設立され、女声バーバーショップも組織化された。同組織はスウィート・アデラインズ・インターナショナルから黒人会員の受け入れ問題をめぐって分裂する形で誕生した女声専門の団体であり、ロードアイランド州プロビデンスで発足した。

代表的なグループとしては、ミルズ・ブラザーズが挙げられる。彼らは1930年代に楽器の音を声で模倣するスタイルで大衆的な人気を博し、バーバーショップの語法をポップ市場に橋渡しした。また、インク・スポッツは、テナーが歌い、ベースが歌詞を語るコーラスを挟む「Top &amp; Bottom」形式（1938年にビル・ケニーが導入）で知られる。

大衆的な人気は1900〜1910年代に高く、近代的な再興は1940年代に始まったとされる。1960年代以降はコンテスト文化と愛好家コミュニティの中に閉じていく傾向が強まった。

バーバーショップの影響を受けたとされる流れのひとつが、ドゥーワップである。ドゥーワップは1940年代に黒人都市コミュニティで生まれたR&amp;Bの一種で、ゴスペルやスピリチュアルのハーモニーのほか、バーバーショップに由来するハーモニーをもつミルズ・ブラザーズなどの影響を受けた。

現在、バーバーショップはBHSとSingUnited International（旧スウィート・アデラインズ）を中心に世界規模で活動が続いている。毎年夏に開催される国際大会（International Convention）には約6,000〜8,000人が集まり、提携団体はオーストラリア、ヨーロッパ各国、ニュージーランド、南アフリカなどにある。2010年代以降はYouTubeを通じた動画投稿でジャンルへの関心が若い世代にも広がっており、アカペラ・ポップとの境界を探る新世代グループも登場している。ただし、コンテスト文化の保守性と革新の間の緊張は現在も続いており、現代的な楽曲をバーバーショップ・スタイルで編曲することへの賛否はコミュニティ内で議論が絶えない。</p>
