<h1>Barbershop（バーバーショップ）とは</h1>
<p>バーバーショップは、4声部のアカペラ・ハーモニーを核とする声楽ジャンルだ。楽器は一切使用せず、テナー・リード・バリトン・ベースの4パートが緊密に絡み合い、純正律に近い音程で和音を構築する。最大の特徴は「バーバーショップ・コード」と</p>
<p>バーバーショップは、4声部のアカペラ・ハーモニーを核とする声楽ジャンルだ。楽器は一切使用せず、テナー・リード・バリトン・ベースの4パートが緊密に絡み合い、純正律に近い音程で和音を構築する。最大の特徴は「バーバーショップ・コード」と呼ばれる属七和音（ドミナント・セブンス）の多用であり、解決されないまま次の属七和音へと連鎖する進行が独特の甘い緊張感を生む。この和音が完全に共鳴したとき、4声部の倍音が重なり合って5声目・6声目の「幽霊音」が聴こえる現象を「リング」と呼び、バーバーショップ最大の美学とされる。

メロディーはリード声部が担い、テナーはリードの上を飾り、バリトンはコードを埋め、ベースが根音を支える。この構造はクラシックのSATB合唱とは異なり、テナーが最高音を担う点が特徴的だ。音域は比較的狭く設定され、全声部が密集した音域で鳴ることで倍音の共鳴が最大化される。

リズムは基本的に4拍子で、テンポはバラードから中程度のスウィング感まで幅広い。アクセントは2拍・4拍に置かれることが多く、ジャズのスウィング感と共通する揺れを持つ。ただし打楽器がないため、リズムの推進力はもっぱら和音の解決感と歌詞のアクセントによって生まれる。

歌唱スタイルは非常に表情豊かで、クレッシェンド・デクレッシェンドを細かく使い分け、フレーズの山で和音を「張る」ことでリングを引き出す。ビブラートはほぼ使用せず、ストレートトーンで歌うことが基本とされる。これはビブラートが倍音の共鳴を乱すためだ。歌詞の主題は恋愛・郷愁・ユーモアが中心で、19世紀末から20世紀初頭のアメリカ大衆文化を色濃く反映している。

隣接ジャンルとの違いを挙げると、ゴスペルは宗教的主題と感情的な発声を重視するのに対し、バーバーショップは世俗的な主題と純粋な和声美を追求する。ドゥーワップはバーバーショップの直系の子孫だが、電気マイクとリズムセクションを導入した点で異なる。コーラスはオーケストラ伴奏を前提とするが、バーバーショップは完全に無伴奏だ。

この音楽が実際に鳴っている場所としては、競技会（コンテスト）が最も典型的だ。バーバーショップ・ハーモニー・ソサエティ主催の全米大会では、数百のカルテットとコーラスが審査員の前で演じる。また、地域のコミュニティ・センターや教会ホール、パレードの沿道でも披露される。</p>
<h2>成り立ち</h2><p>バーバーショップの起源は19世紀末のアメリカ南部および中西部に求められる。当時の理髪店（バーバーショップ）は単なる散髪の場ではなく、地域の男性たちが集まり、時間を潰しながら即興で歌い合う社交の場でもあった。待ち時間に客たちが自然発生的にハーモニーを付けて歌う習慣が根付いており、これがジャンルの名称の由来となっている。

19世紀末のアメリカでは、楽譜出版業（ティン・パン・アレー）が隆盛し、家庭での歌唱が娯楽の中心だった。ラジオも蓄音機も普及していない時代、人々は自ら歌うことで音楽を楽しんだ。この文化的土壌の中で、バーバーショップ・ハーモニーは黒人コミュニティと白人コミュニティの双方で独自に発展したとされる。ただし、どちらが先かという起源論争は現在も決着しておらず、断定は避けるべきだ。

1938年、オクラホマ州タルサで税務弁護士のO.C.キャッシュ（Owen C. Cash）と投資マネージャーのルパート・ホールが「バーバーショップ・カルテットを歌う愛好家協会（SPEBSQSA）」を設立した。これが後に「バーバーショップ・ハーモニー・ソサエティ（BHS）」と改称される組織であり、ジャンルの制度化・標準化に決定的な役割を果たした。同協会はコンテストのルール、和声の定義、審査基準を体系化し、バーバーショップを趣味の集まりから競技音楽へと昇格させた。

1945年には女性のための組織「スウィート・アデラインズ・インターナショナル」が設立され、女性バーバーショップも独自の発展を遂げた。さらに1959年には「ハーモニー・インコーポレーテッド（Harmony, Incorporated）」が設立され、女声バーバーショップも組織化された。同組織はスウィート・アデラインズ・インターナショナルから黒人会員の受け入れ問題をめぐって分裂する形で誕生した女声専門の団体であり、ロードアイランド州プロビデンスで発足した。

代表的なグループとしては、ミルズ・ブラザーズが挙げられる。彼らは1930年代に楽器の音を声で模倣するスタイルで大衆的な人気を博し、バーバーショップの語法をポップ市場に橋渡しした。また、インク・スポッツも属七和音の多用とリードとベースの対話という構造でバーバーショップの美学を継承した。

1940年代から50年代にかけてがバーバーショップの黄金期であり、ラジオ番組や映画にも登場した。しかしロックンロールの台頭とともに大衆的な人気は急速に失われ、1960年代以降はコンテスト文化と愛好家コミュニティの中に閉じていく傾向が強まった。

バーバーショップが音楽史に残した最大の遺産はドゥーワップへの影響だ。1950年代に黒人都市部の若者たちが路上で歌ったドゥーワップは、バーバーショップの4声ハーモニーと属七和音の語法を直接継承しつつ、リズムアンドブルースのビートと融合させた。さらにドゥーワップはソウル・R&amp;Bへと連なり、現代のポップ・ボーカルグループの原型を形成した。

現在、バーバーショップはBHSとスウィート・アデラインズを中心に世界規模で活動が続いている。毎年開催される全米大会には数万人が参加し、日本・オーストラリア・ヨーロッパにも支部が存在する。2010年代以降はYouTubeを通じた動画投稿でジャンルへの関心が若い世代にも広がっており、アカペラ・ポップとの境界を探る新世代グループも登場している。ただし、コンテスト文化の保守性と革新の間の緊張は現在も続いており、現代的な楽曲をバーバーショップ・スタイルで編曲することへの賛否はコミュニティ内で議論が絶えない。</p>
