<h1>Barbershop（バーバーショップ）とは</h1>
<p>バーバーショップは、4つの声部だけで、伴奏なしに、ぎゅっと詰まった和音を歌うように編曲するスタイルだ。中心にあるのは、4声部のアカペラ・ハーモニーである。 楽器は一切使わない。テナー・リード・バリトン・ベースの4パートが、ぴったり</p>
<p>バーバーショップは、4つの声部だけで、伴奏なしに、ぎゅっと詰まった和音を歌うように編曲するスタイルだ。中心にあるのは、4声部のアカペラ・ハーモニーである。

楽器は一切使わない。テナー・リード・バリトン・ベースの4パートが、ぴったりと絡み合う。音程は純正律（和音が濁らず響く音程）に近づけて、和音を組み立てる。

最大の特徴は、「バーバーショップ・コード」と呼ばれる属七和音（ドミナント・セブンス）を多く使うことだ。属七和音が、5度ずつ進む流れ（5度圏）に沿って次々と解決していく。この進み方が、独特の甘い緊張感を生む。この和音が完全に響き合うと、4声部の倍音が重なり、5つ目の声のように感じられる「幽霊音」が聞こえる。この現象を「リング」と呼び、バーバーショップで最も大切な美しさとされる。

メロディーはリードが歌う。テナーはリードの上を飾り、バリトンは和音のすき間を埋め、ベースが土台の音を支える。この形は、クラシックのSATB合唱（ソプラノ・アルト・テノール・バスの混声合唱）とは違う。テナーが一番高い音を受け持つ点が特徴だ。

リズムは、中くらいの速さや速い曲では譜面どおりに歌う。遅い曲や曲の導入部では、ルバート（自由なテンポ）で語るように歌われることが多い。打楽器がないので、リズムを前へ進める力は、ほぼ和音の解決感と歌詞のアクセントから生まれる。

歌い方はとても表情豊かだ。だんだん強く、だんだん弱くを細かく使い分け、フレーズの山場で和音を「張る」ことで、リングを引き出す。大げさなビブラートは避けて歌うのが基本とされる。大きなビブラートは、倍音の響き合いを乱すからだ。

歌詞のテーマは、伝統的には恋愛・郷愁・ユーモアが多く、19世紀末から20世紀初頭のアメリカの大衆文化を映したものが多い。ただし、現在は現代曲も歌われる。

近いジャンルと比べてみる。ゴスペルは宗教的なテーマと感情のこもった発声を大切にするが、バーバーショップは宗教と関係のないテーマと、純粋な和音の美しさを追い求める。ドゥーワップは1940年代に黒人の都市のコミュニティで生まれたR&amp;Bの一種で、ゴスペルやミルズ・ブラザーズなどの影響を受けた。合唱には伴奏付きも無伴奏もあるが、バーバーショップは完全に無伴奏だ。

この音楽が実際に聞かれる場所として、最も典型的なのは競技会（コンテスト）だ。バーバーショップ・ハーモニー・ソサエティが主催する国際大会（International Convention）では、国際カルテット部門に50組前後が出場し、コーラスとともに審査員の前で歌う。また、地域のコミュニティ・センターや教会ホールでも披露される。</p>
<h2>成り立ち</h2><p>バーバーショップの起源は、1880〜90年代にアフリカ系アメリカ人のコミュニティで広く行われていた、四重唱の伝統にあるとする説が有力だ。ただし、地域や社会的な背景は、はっきり分かっていない。当時の理髪店（バーバーショップ）は、ただ髪を切る場所ではなかった。地域の男性たちが集まり、時間をつぶしながら歌い合う社交の場でもあったと言われる。名前は理髪店とのつながりから来ている、といわれることがあるが、確かではない。

19世紀末のアメリカでは、楽譜出版業（ティン・パン・アレー）が盛んになった。録音産業はまだ始まったばかりで、家庭や集会で歌うことが大事な娯楽だった。人々は自分で歌って音楽を楽しんだ。こうした文化の土台の上で、黒人コミュニティの伝統から始まったハーモニーが、白人のプロのカルテットの録音を通じて混ざり合っていった、という見方が有力である。それでも、起源をめぐる議論は今も決着していない。

1938年、オクラホマ州タルサで、税務弁護士のO.C.キャッシュ（Owen C. Cash）と、投資会社勤務のルパート・I・ホールが、「米国におけるバーバーショップ・カルテット歌唱の保存・奨励協会（SPEBSQSA）」を設立した。この協会は2004年以降、通称・ブランド名として「バーバーショップ・ハーモニー・ソサエティ」を使っている。協会は、ジャンルの仕組みづくりと標準化に決定的な役割を果たしたと評価される。コンテストのルール、和音の定義、審査基準を整理し、バーバーショップを趣味の集まりから競技の音楽へと引き上げた、という見方もある。

1945年には、女性のための組織「スウィート・アデラインズ・インターナショナル」（2026年5月にSingUnited Internationalへ改称）が設立され、女性のバーバーショップも独自に発展した。さらに1957〜58年に、スウィート・アデラインズ・インターナショナルの一部会員の離脱が始まった。そして1959年に「ハーモニー・インコーポレーテッド（Harmony, Incorporated）」が法人化され、女声のバーバーショップも組織化された。この組織は、スウィート・アデラインズ・インターナショナルから、黒人会員の受け入れ問題をめぐって分かれる形で生まれた女声専門の団体で、ロードアイランド州プロビデンスで発足した。

バーバーショップの代表例には、初期の録音カルテットであるHaydn Quartet、American Quartet、Peerless Quartetや、バーバーショップ・ハーモニー・ソサエティの歴代優勝カルテットがある。一方、ミルズ・ブラザーズは、理髪店を営む父のもとでバーバーショップ・カルテットとして出発した、ジャズ／ポップのヴォーカル・グループだ。後のドゥーワップに影響を与えた。彼らは1930年代に、楽器の音を声でまねるスタイルで大衆的な人気を集めた。また、ドゥーワップへつながる黒人ヴォーカル・グループのインク・スポッツは、「Top &amp; Bottom」形式（1938年にビル・ケニーが導入）で知られる。テナーが歌い、ベースが歌詞を語るコーラスを間に挟む形だ。

大衆的な人気は1900〜1910年代に高く、近代的な復活は1940年代に始まったとされる。SPEBSQSAの会員数は1983年に約3.8万人で最も多くなり、その後は減っていった。

バーバーショップの影響を受けたとされる流れのひとつが、ドゥーワップである。ドゥーワップは1940年代に黒人の都市のコミュニティで生まれたR&amp;Bの一種だ。ゴスペルやスピリチュアルのハーモニーのほか、バーバーショップに由来するハーモニーをもつミルズ・ブラザーズなどの影響を受けた。

現在、バーバーショップはバーバーショップ・ハーモニー・ソサエティとSingUnited International（旧スウィート・アデラインズ）を中心に、世界規模で活動が続いている。毎年夏に開かれる国際大会（International Convention）の参加者は、近年は約4,500〜7,000人台で推移している（2024年は5,557人）。提携団体は、オーストラリア、ヨーロッパ各国、ニュージーランド、南アフリカなどにある。2010年代以降はYouTube上での発信が増えており、アカペラ・ポップとの境目を探る新しい世代のグループも現れている。ただし、コンテスト文化の保守的な面と新しい試みとの間の緊張は今も続いている。現代的な曲をバーバーショップ・スタイルで編曲することには、コミュニティの中で賛成と反対の議論が絶えない。</p>
