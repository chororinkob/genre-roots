<h1>Jazz Fusion（ジャズフュージョン）とは</h1>
<p>フュージョンは、ジャズの即興と、ロックやファンクのリズムおよび電気楽器を結合させた音楽だ。 編成の中核は電気楽器である。エレクトリック・ピアノ、とりわけFender Rhodesの鐘のような音色が使われる。Hammondオルガン、</p>
<p>フュージョンは、ジャズの即興と、ロックやファンクのリズムおよび電気楽器を結合させた音楽だ。

編成の中核は電気楽器である。エレクトリック・ピアノ、とりわけFender Rhodesの鐘のような音色が使われる。Hammondオルガン、Moogなどのシンセサイザーも加わる。そして、エフェクター（音を加工する機器）を通した電気ギターが用いられる。

ベースは、電気ベース（やアンプで増幅したウッドベース）が用いられる。親指で弦を叩き、他の指で弦を引いて離すスラップ奏法（弦を叩いたりはじいたりする奏法）が、特徴的な奏法となる。フレット（音程を区切る金属の棒）のない指板による、滑らかな音程移動も特徴だ。

和声（コードの響き）は、ジャズの拡張和音（基本の和音に高い音を足した和音）を保つ。ただし、旋法的な長い持続を採る。つまり、一つのスケール上で長く即興する構造である。

リズムは、4分の4のロック的な拍に加え、4分の7や、2+2+2+3など非対称に分ける8分の9といった変拍子（定型から外れた拍子）が頻繁に用いられる。複数の拍子が同時進行するポリリズム（複数のリズムが同時に進む形）も試みられる。ドラムは、ロック的な重い拍を刻みつつ、ジャズ由来の細かな装飾を絶やさない。

曲は器楽が中心で、長尺の曲が多い。技巧の水準は極めて高い。超高速のユニゾン、すなわち複数の楽器が正確に同じ旋律を弾く部分が、聴かせどころとなる。音量は大きく、ロックの会場でも演奏された。</p>
<h2>成り立ち</h2><p>1960年代末、ロックの人気の高まりと、それを意識した動きが背景にあったとされる。

先駆者にはLarry Coryellらがいた。しかし、決定的な影響を与えたのはMiles Davisだ。彼は1968年から1970年にかけて、電気楽器を導入した作品を次々に発表した。1969年のIn a Silent Way、そして1970年の2枚組Bitches Brewが転換点となる。

後者は、複数の鍵盤奏者を同時に起用し、長時間の即興を録音した。その後、制作者Teo Maceroがテープを切り貼りして構成するという方法で作られた。ジャズでは前例のない編集手法を用いた（『In a Silent Way』で先行し、『Bitches Brew』で拡大した）。

かつてMiles Davisのもとで活動した演奏家たちが、それぞれ自らの楽団を作った。そして、このスタイルを多方向へ展開させた。Herbie HancockはHead Huntersで、John McLaughlinはMahavishnu Orchestraで、Chick CoreaはReturn to Foreverで、Joe ZawinulとWayne ShorterはWeather Reportで、それぞれ異なる方向を追求した。

とりわけ、Weather Reportに1976年に加入したベーシストJaco Pastoriusは、フレットレスの電気ベースで独奏楽器としての可能性を大きく広げた一人である。彼は精神の病と依存に苦しんだ。1987年9月12日未明にフロリダのクラブの従業員（支配人とも）と衝突し、9月21日に35歳で死去している（9日後）。

日本では、渡辺香津美、カシオペア、THE SQUARE（現T-SQUARE）らが、独自の展開を見せた。

しかし、批評家の評価は割れたままだと言われる。ジャズの伝統を守る立場からは、商業主義に合わせたものだという批判が向けられた。即興の緊張を技巧の誇示に置き換えた、という批判もあった。とりわけ1980年代以降、この語は、より穏やかな器楽ポップスをも含むようになったとされる。当初の実験性が薄れたと見られる。</p>
<h2>代表曲</h2><ul><li>Birdland (Weather Report)</li><li>Spain (Chick Corea)</li><li>Chameleon (Herbie Hancock)</li><li>Meeting of the Spirits (Mahavishnu Orchestra)</li><li>Teen Town (Weather Report)</li><li>Stratus (Billy Cobham)</li><li>Red Baron (Billy Cobham)</li><li>Medieval Overture (Return to Forever)</li><li>Birds of Fire (Mahavishnu Orchestra)</li><li>Bitches Brew (Miles Davis)</li><li>Black Market (Weather Report)</li><li>Renaissance (Jean-Luc Ponty)</li></ul>
