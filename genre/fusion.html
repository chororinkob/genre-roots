<h1>Jazz Fusion（ジャズフュージョン）とは</h1>
<p>ジャズの即興と、ロックやファンクのリズムおよび電気楽器を結合させた様式。編成の中核は電気楽器で、エレクトリック・ピアノ、とりわけFender Rhodesの鐘のような音色、Hammondオルガン、Moogなどのシンセサイザー、そし</p>
<p>ジャズの即興と、ロックやファンクのリズムおよび電気楽器を結合させた様式。編成の中核は電気楽器で、エレクトリック・ピアノ、とりわけFender Rhodesの鐘のような音色、Hammondオルガン、Moogなどのシンセサイザー、そしてエフェクターを通した電気ギターが用いられる。ベースは電気ベースで、指で弦を叩くスラップ奏法や、フレットのない指板による滑らかな音程移動が特徴的な語法となる。ドラムはロック的な重い拍を刻みつつ、ジャズ由来の細かな装飾を絶やさない。リズムは四分の四のロック的な拍に加え、四分の七や八分の九といった変拍子が頻繁に用いられ、複数の拍子が同時進行するポリリズムも試みられる。和声はジャズの拡張和音を保持しつつ、旋法的な長い持続、すなわち一つのスケール上で長く即興する構造を採る。曲は器楽が中心で、長さは10分を超えることも多い。技巧の水準は極めて高く、超高速のユニゾン、すなわち複数の楽器が寸分違わず同じ旋律を弾く部分が聴かせどころとなる。音量は大きく、ロックの会場で演奏できる音楽として設計されている。</p>
<h2>成り立ち</h2><p>1960年代末、ジャズがロックに聴衆を奪われ、演奏の場と収入を失いつつあったことが背景にある。決定的な人物はMiles Davisで、彼は1968年から1970年にかけて、電気楽器を導入した作品を次々に発表した。1969年のIn a Silent Way、そして1970年の二枚組Bitches Brewが転換点となる。後者は、複数の鍵盤奏者を同時に起用し、長時間の即興を録音した後、制作者Teo Maceroがテープを切り貼りして構成するという方法で作られた。この編集による作曲という手法自体が革新的だった。この録音に参加した若い演奏家たちが、それぞれ自らの楽団を作り、様式を多方向へ展開させた。Herbie HancockはHead Huntersで、John McLaughlinはMahavishnu Orchestraで、Chick CoreaはReturn to Foreverで、Joe ZawinulとWayne ShorterはWeather Reportで、それぞれ異なる方向を追求した。とりわけWeather Reportに1976年に加入したベーシストJaco Pastoriusは、フレットを抜いた電気ベースにより、この楽器を独奏楽器へ引き上げた。彼は精神の病と依存に苦しみ、1987年にフロリダのクラブの用心棒に殴打されて35歳で死去している。日本では渡辺香津美、カシオペア、T-SQUAREらが独自の展開を見せた。批評的な評価は分裂したままである。ジャズの伝統を守る立場からは、商業主義への迎合であり、即興の緊張を技巧の誇示に置き換えたという批判が向けられた。とりわけ1980年代以降、この語はより穏やかな器楽ポップスをも含むようになり、当初の実験性が薄れたことは否めない。</p>
<h2>代表曲</h2><ul><li>Bitches Brew (Miles Davis)</li><li>Birdland (Weather Report)</li><li>Spain (Chick Corea)</li><li>Meeting of the Spirits (Mahavishnu Orchestra)</li><li>Chameleon (Herbie Hancock)</li></ul>
