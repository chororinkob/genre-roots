<h1>Conscious Rap（コンシャスラップ）とは</h1>
<p>コンシャス・ラップは、社会の仕組みへの批判と、聴き手の意識を変えることを目的にしたヒップホップだ。歌詞が中心にある。 音の面では、A Tribe Called Questなどはジャズ寄りの素材を使う一方、Public Enemyは</p>
<p>コンシャス・ラップは、社会の仕組みへの批判と、聴き手の意識を変えることを目的にしたヒップホップだ。歌詞が中心にある。

音の面では、A Tribe Called Questなどはジャズ寄りの素材を使う一方、Public Enemyはファンク、ノイズ、前衛的な素材が中心である。テンポにジャンルとして定まった範囲はなく(Public Enemyのように100 BPMを超える例もある)、言葉が聞き取りやすいように隙間が確保されることが多い。間奏に演説や講義、報道の音声が挿入されることもある。

語り口は、説教調になる場合もあれば、物語の中に主張を埋め込む場合もある。聴き手を糾弾するのではなく、共に考えるよう促す二人称が好まれる。

扱われる主題は、人種差別、警察による暴力、貧困の再生産、教育の欠如、歴史の書き換え、環境、宗教、そして自己の内面の点検にまで及ぶ。言葉づかいの面では、複数の意味を重ねた比喩、歴史上の人物や事件への言及、統計や引用の織り込みが多用される。一度聴いただけでは全ての層を把握できない密度が、わざと作られる。

ギャングスタ・ラップは、街頭の現実を証言として描く。これに対し、こちらは同じ現実の原因を構造の側に求め、問題への気づきを促し、解決まで語る作品もある点で立場が違う。</p>
<h2>成り立ち</h2><p>その前の流れは、1960年代末から1970年代初めのアメリカにある。公民権運動とブラックパワー運動が高まる中で、ニューヨークのThe Last Poetsは、打楽器の伴奏に乗せて政治的な詩を朗読した。Gil Scott-Heronは1970年の作品で、革命はテレビ中継されないと歌い、話し言葉による社会批判の型を固めた一人だった。

ヒップホップでは、1980年のBrother D with Collective Effortによる『How We Gonna Make the Black Nation Rise?』が、最初期の政治的ヒップホップ曲の一つとされる。1982年には、Grandmaster Flash and the Furious Fiveの名義でザ・メッセージが出て、貧民街の絶望を描いた。この曲の録音には、グループからはMelle Melのみが参加した。そのほかに、グループ外のDuke Bootee（共作・共同プロデュース・共同リード）とセッション・ミュージシャンが参加している。

中心的な存在となったのは、ニューヨーク州ロングアイランドのPublic Enemyだ。1988年の作品イット・テイクス・ア・ネイション・オブ・ミリオンズ・トゥ・ホールド・アス・バックは、Bomb Squadと呼ばれる制作班が手がけた。警報音とノイズを積み重ねた耳障りな音響と、Chuck Dの断定的な声によって、音そのものが政治的な緊張を帯びることを証明した。ただし翌1989年、構成員Professor Griffがユダヤ人に関する反ユダヤ主義的な発言を行い、集団は分裂の危機に陥っている。

ブロンクスのBoogie Down Productionsを率いたKRS-Oneは、盟友Scott La Rockが1987年に銃撃で殺害された事件を経験した。それをきっかけに、暴力の描写から教育と啓蒙へと路線を転じ、自らを教師と位置づけた。

1988年結成の、De La SoulやA Tribe Called Questを含むネイティヴ・タンズと呼ばれる緩やかな連合は、アフリカへ立ち返る意識と穏やかな音楽性を結びつけた。そして、攻撃的でない形の意識の高さを示した。1990年代後半には、ニューヨークのRawkus Recordsを拠点に、Mos DefとTalib Kweliがインディペンデントな姿勢を打ち出した。1998年にはLauryn Hillが、愛と信仰と母性と黒人女性の経験を主題とする作品で、全米初登場1位となり、グラミー賞の最優秀アルバム賞を含む5冠を得た。

この分野には、この分野ならではの困難がある。政治的に正しい優等生の音楽として型にはめられ、娯楽性を欠くと敬遠される。一方で、売れれば主張を商品にしたと非難される。この二重の圧力である。NPRは、この呼称が「メッセージはあるがビートも市場もない音楽」を指す蔑称になっていると説明している。Talib Kweli自身もこのラベルに反発している。

2015年、Kendrick Lamarはトゥ・ピンプ・ア・バタフライで、ジャズと即興を大胆に導入した。人種と自己嫌悪を正面から扱い、商業的にも批評的にも大きな成功を収めた。これは、この分野の可能性が失われていないことを示す出来事となった。</p>
