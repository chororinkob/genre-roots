<h1>Conscious Rap（コンシャスラップ）とは</h1>
<p>社会構造への批判と、聴き手の意識を変えることを目的に据えたヒップホップである。歌詞が中心にあり、扱われる主題は人種差別、警察による暴力、貧困の再生産、教育の欠如、歴史の書き換え、環境、宗教、そして自己の内面の点検にまで及ぶ。修辞の</p>
<p>社会構造への批判と、聴き手の意識を変えることを目的に据えたヒップホップである。歌詞が中心にあり、扱われる主題は人種差別、警察による暴力、貧困の再生産、教育の欠如、歴史の書き換え、環境、宗教、そして自己の内面の点検にまで及ぶ。修辞の面では、複数の意味を重ねた比喩、歴史上の人物や事件への言及、統計や引用の織り込みが多用され、一度聴いただけでは全ての層を把握できない密度が意図的に作られる。語り口は説教調になる場合もあれば、物語の中に主張を埋め込む場合もあり、聴き手を糾弾するのではなく共に考えるよう促す二人称が好まれる。音の面では、ジャズやソウル、アフリカの打楽器録音から取られた素材が多く、上下する管楽器の断片や、生ベースの太い音、木の質感を持つ打楽器が用いられる。テンポは85から100 BPM前後で、言葉が聞き取りやすいように隙間が確保され、過度な低音の強調は避けられる。曲は長く、間奏に演説や講義、報道の音声が挿入されることも多い。ギャングスタ・ラップが街頭の現実を証言として描くのに対し、こちらは同じ現実の原因を構造の側に求め、解決を語ろうとする点で立場が異なる。</p>
<h2>成り立ち</h2><p>前史は1960年代末のアメリカにある。公民権運動とブラックパワー運動の高まりの中で、ニューヨークのThe Last Poetsは打楽器の伴奏に乗せて政治的な詩を朗読し、Gil Scott-Heronは1970年の作品で、革命はテレビ中継されないと歌って、話し言葉による社会批判の型を作った。ヒップホップにこの姿勢が明確に現れたのは1982年、Grandmaster Flash and the Furious Fiveがザ・メッセージで貧民街の絶望を描いたときである。決定的な存在となったのはニューヨーク州ロングアイランドのPublic Enemyで、1988年の作品イット・テイクス・ア・ネイション・オブ・ミリオンズ・トゥ・ホールド・アス・バックは、Bomb Squadと呼ばれる制作班による、警報音とノイズを積み重ねた耳障りな音響と、Chuck Dの断定的な声によって、音そのものが政治的な緊張を帯びることを証明した。ただし翌1989年、構成員Professor Griffがユダヤ人に関する反ユダヤ主義的な発言を行い、集団は分裂の危機に陥っている。ブロンクスのBoogie Down Productionsを率いたKRS-Oneは、盟友Scott La Rockが1987年に銃撃で殺害された事件を経て、暴力の描写から教育と啓蒙へ路線を転じ、自らを教師と位置づけた。1988年から1989年にかけては、De La SoulやA Tribe Called Questを含むネイティヴ・タンズと呼ばれる緩やかな連合が、アフリカ回帰の意識と穏やかな音楽性を結びつけ、攻撃的でない形の意識の高さを提示した。1990年代後半にはニューヨークのRawkus Recordsを拠点に、Mos DefとTalib Kweliが商業主義に対抗する立場を鮮明にし、1998年にはLauryn Hillが信仰と母性と黒人女性の経験を主題とする作品で、批評と市場の双方を制覇した。この分野には固有の困難がある。政治的に正しい優等生の音楽として型にはめられ、娯楽性を欠くと敬遠される一方、売れれば主張を商品にしたと非難されるという二重の圧力である。実際にこの呼称自体を多くの当事者が嫌い、音楽を分断する言葉だと批判してきた。2015年、Kendrick Lamarがトゥ・ピンプ・ア・バタフライで、ジャズと即興を大胆に導入しながら人種と自己嫌悪を正面から扱い、商業的頂点と批評的評価を同時に得たことは、この分野の可能性が失われていないことを示す出来事となった。</p>
