<h1>Vocaloid（ボカロ）とは</h1>
<p>ボーカロイド音楽は、初音ミクに代表される「ボーカロイド」という歌声合成ソフトウェアを使った、インターネット発祥の日本の音楽文化だ。楽曲制作者が自ら歌わなくても、歌手を手配しなくても、楽曲を完成させることができる。 人間の声帯では物</p>
<p>ボーカロイド音楽は、初音ミクに代表される「ボーカロイド」という歌声合成ソフトウェアを使った、インターネット発祥の日本の音楽文化だ。楽曲制作者が自ら歌わなくても、歌手を手配しなくても、楽曲を完成させることができる。

人間の声帯では物理的に歌うことが難しいような、超高速・超高音のフレーズを歌わせられる。テクノロジーならではの表現の自由度が、特徴の一つとされる。電子的に合成された透明感のある声質と、それゆえの「無機質さ」も、聴き手にはむしろ個性として愛される。

音楽のスタイルは、特定のものに縛られない。ポップス、ロック、エレクトロニカ、ジャズに至るまで、あらゆる音楽がボーカロイドで作られている。

大手レーベルの審査を経ることなく、個人がインターネット上で楽曲を発表し、人気を得られる。ボーカロイド音楽は、そうした「創作の民主化」（誰でも創作に参加できるようになること）を形にした文化として発展してきた。

楽曲だけでなく、複数の創作分野が一体となって発展してきた点も、大きな特徴だ。イラストレーターによるキャラクターイラスト、映像作家によるMV（ミュージックビデオ）、そして既存の楽曲を人間が歌って動画サイトに投稿する「歌ってみた」文化などがある。1人のクリエイターの手を離れて、多くの人が二次創作的に関わっていく。このエコシステム（作り手と受け手が支え合う仕組み）そのものが、文化の推進力となっている。</p>
<h2>成り立ち</h2><p>2003年、ヤマハが歌声合成技術「VOCALOID」を発表した。すべてはここから始まる。この技術は、実在の歌手から収録した歌唱の断片をつなぎ合わせ、入力した音符と歌詞に沿って歌わせるものだ。スペインのポンペウ・ファブラ大学との共同研究から始まった。最初の製品として、2004年に英語音源のLEONとLOLAが発売された。

転換点は、2007年8月31日に訪れた。札幌のクリプトン・フューチャー・メディアが、初音ミクを発売したのだ。声優の藤田咲の声を収録し、イラストレーターのKEIによる青緑のツインテールのキャラクターを与えた。そのため、単なる音源ソフトが、人格を持った歌手として受け取られた。発売直後から品薄になった（発売後2週間で3,500〜4,000本が売れた）。

同じ時期に成長していた動画共有サイトのニコニコ動画が、発表の場となった。ユーザーが曲を投稿し、別のユーザーがイラストや3D動画、演奏や歌唱の動画を付けて、派生作品を作る。この連鎖が生まれ、画面上をコメントが流れる仕組みがそれを加速させた。

ika「みくみくにしてあげる♪」(2007)は、初期の代表曲となった。ryo「メルト」(2007)は、のちにsupercellの代表曲となる。等身大の恋愛を歌って、ボーカロイド曲の主題を大きく広げた。wowaka「ワールズエンド・ダンスホール」(2010)、じん「カゲロウデイズ」(2011)などが、世代ごとの代表作となった。ハチ名義で活動した米津玄師、DECO*27、Mitchie Mらは、後に商業音楽の第一線へ進んだと評される。

2009年のミクフェス'09で、透過スクリーン上演が始まった。2010年3月9日のミクの日感謝祭は、初のソロコンサートとなった。

一方で、二次創作の権利処理は、当初から混乱した。クリプトン側がピアプロ・キャラクター・ライセンスを整備することで、一応の線引きがなされた。

技術面では、UTAU、CeVIO、Synthesizer Vといった競合が現れた。2020年代には、VOCALOID6(VOCALOID:AI)やSynthesizer V、CeVIO AIなど、AI技術を用いた歌声合成が広がっている。</p>
