<h1>Vocaloid（ボカロ）とは</h1>
<p>初音ミクに代表される「ボーカロイド」という歌声合成ソフトウェアを使い、人間の歌手を一切必要とせずに楽曲を完成させることができる、インターネット発祥の日本の音楽文化。人間の声帯では物理的に歌うことが難しいような超高速・超高音のフレー</p>
<p>初音ミクに代表される「ボーカロイド」という歌声合成ソフトウェアを使い、人間の歌手を一切必要とせずに楽曲を完成させることができる、インターネット発祥の日本の音楽文化。人間の声帯では物理的に歌うことが難しいような超高速・超高音のフレーズを平然と歌わせられる、テクノロジーならではの表現の自由度が最大の武器である。電子的に合成された透明感のある声質と、それゆえの「無機質さ」も、聴き手にとってはむしろ個性として愛される。ジャンルとしての音楽性は特定のスタイルに縛られず、ポップス、ロック、エレクトロニカ、ジャズに至るまであらゆる音楽がボーカロイドで制作されており、大手レーベルの審査を経ることなく、個人がインターネット上で楽曲を発表し人気を得られる「創作の民主化」を体現する文化として発展してきた。楽曲だけでなく、イラストレーターによるキャラクターイラスト、映像作家によるMV、そしてボーカロイドの声に合わせて自作の歌詞を口ずさむ「歌ってみた」文化など、複数の創作分野が一体となって発展してきた点も大きな特徴で、1人のクリエイターの手を離れて多くの人が二次創作的に関わっていくエコシステムそのものが文化の推進力となっている。</p>
<h2>成り立ち</h2><p>2003年、ヤマハが歌声合成技術「VOCALOID」を発表したことに始まる。この技術は実在の歌手から収録した歌唱の断片をつなぎ合わせ、入力した音符と歌詞に沿って歌わせるもので、スペインのポンペウ・ファブラ大学との共同研究に端を発する。最初の製品は2004年に英語音源のLEONとLOLAが発売されたが、市場の反応は限定的だった。転換点は2007年8月31日、札幌のクリプトン・フューチャー・メディアが発売した初音ミクである。声優の藤田咲の声を収録し、イラストレーターのKEIによる緑のツインテールのキャラクターを与えたことで、単なる音源ソフトが人格を持った歌手として受け取られた。発売直後から品切れが続き、同時期に成長していた動画共有サイトのニコニコ動画が発表の場となる。ユーザーが曲を投稿し、別のユーザーがイラストや3D動画、演奏や歌唱の動画を付けて派生作品を作る連鎖が生まれ、画面上をコメントが流れる仕組みがそれを加速させた。ika「みくみくにしてあげる♪」(2007)は初期の象徴となり、ryo「メルト」(2007)は等身大の恋愛を歌ってボーカロイド曲の主題を大きく広げ、後のsupercellへつながった。wowaka「ワールズエンド・ダンスホール」(2010)、じん「カゲロウデイズ」(2011)などが世代ごとの代表作となり、ハチ名義で活動した米津玄師、DECO*27、Mitchie Mらが後に商業音楽の第一線へ進んだ。2010年には映像を舞台へ投影する「ミクの日感謝祭」が開催され、実在しない歌手の大規模公演が現実になった。一方で二次創作の権利処理は当初から混乱し、クリプトン側がピアプロ・キャラクター・ライセンスを整備することで一応の線引きがなされた。技術面ではUTAU、CeVIO、Synthesizer Vといった競合が現れ、2020年代のAI歌声合成へ世代交代が進んでいる。</p>
