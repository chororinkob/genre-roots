<h1>Gqom（ゴム）とは</h1>
<p>ゴムは、南アフリカの港町ダーバンで生まれた電子ダンス音楽だ。とても不穏で、骨組みだけでできている。名前はズールー語で、太鼓や打撃の音を表す擬音から来ている。その名の通り、打楽器が全てを支配する。 低音はとても深い。キックとサブベー</p>
<p>ゴムは、南アフリカの港町ダーバンで生まれた電子ダンス音楽だ。とても不穏で、骨組みだけでできている。名前はズールー語で、太鼓や打撃の音を表す擬音から来ている。その名の通り、打楽器が全てを支配する。

低音はとても深い。キックとサブベースが低い音域を受け持ち、部屋の空気そのものを震わせる。上に重ねる音は驚くほど少ない。暗いパッドやシンセの単発の音くらいに絞られることが多く、ほかは金属的な打撃音と、詠唱のように繰り返される人の声だけということも多い。メロディーらしいメロディーはなく、和声は最小限である。

伝統的なゴムは四つ打ちを使わない。キックを崩したブロークンビートが基本で、非対称でシンコペーション(拍の強弱をずらすこと)したキックの配置を取る。キックの型には「3-step」などがある。一方、「4-step」系(sgubhu)は比較的安定したキックで、ハウスに近い(キックの型の呼び名は、拍子の意味の3拍子・4拍子とは別)。この不均等さのため、聴き手はどこが拍の頭か分からないまま体を揺らす。そこから、ふらつくような独特の陶酔が生まれる。テンポはおおむね120前後から130 BPMで、見方によって幅がある。

声は歌うというより、呪文や号令のように短い言葉を繰り返す。複数人の掛け声が重ねられることも多い。

曲の展開も最小限で、要素が出たり入ったりするだけで数分が組み立てられる。この徹底した簡素さと、すき間の多さが、緊張を保ち続ける。全体としては、暗く張り詰めた響きを持つダンス音楽であり、ダンス文化(bhenga など)と結びついている。</p>
<h2>成り立ち</h2><p>舞台は南アフリカ東部の都市ダーバンだ。

この国では1990年代以降、クワイトが、アパルトヘイト後の黒人の若者文化の中心にあった。クワイトは、ハウスの速度を落として現地の言葉を乗せた音楽である。ハウス系の音楽は、1990年代初頭にケープタウンへ入ったとされ、それ以降この国に根づいてきた。

2009年末〜2012年ごろ、ダーバンの黒人居住区に住む10代の若者たちが、独学で曲を作り始めた。使ったのは安価な音楽制作ソフトで、違法に複製したソフトも使われたと言われる。この時期については諸説ある。既存のハウス、クワイト、トライバルハウスを聴き、Naked Boyzのブロークンビートに刺激を受けて、同じようなビートを作り始めたと語る制作者がいる。起源にも諸説あり、自分たちが新しい音を始めたとは気づかなかったという証言もある。

広まり方も独特だった。作品は、海賊版のCD、携帯電話のBluetooth、WhatsAppのグループ、ファイル共有サイトなどを通じて、手渡しのように広まった。乗り合いのミニバスタクシーは、新曲を試す場になった。

やがて海外にも届く。2015年には、RudeboyzのEPが海外のレーベルから出た。それに続いて2016年1月、イタリア人のNan Kolèと南アフリカのLerato Phiriが共同で作ったレーベルGqom Oh!が、現地の音源を集めた編集盤を出した。これで、この音楽はヨーロッパの電子音楽の聴き手にさらに広まった。DJ LagやRudeboyz、Distruction Boyzも、国際的に知られるようになる。

国内では2016年、Babes Wodumoの楽曲が爆発的な人気を得て、この音楽を全国区へ押し上げた。しかし2019年、彼女がInstagram Liveでファンと話している最中に、交際相手でマネージャーのMampintshaに繰り返し平手打ちされる映像が広まった。この事件は、南アフリカの女性への暴力という深刻な社会問題を、はっきり目に見える形にした。

それでも、作り手たちの思いは複雑だ。国内ではラジオでほとんど流されないまま、海外で先に評価された。そのことへの不満や、文化が搾取される心配を、制作者本人たちが語っている。

その後、アマピアノがゴムの要素を取り入れている。DJ Lagのアルバム『Meeting with the King』は、ゴムとアマピアノを「兄弟分」と捉えた作品と評された。ゴムは、南アフリカの若者文化を世界へ届ける道にもなった。</p>
