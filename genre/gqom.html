<h1>Gqom（ゴム）とは</h1>
<p>南アフリカの港湾都市ダーバンで生まれた、極めて不穏で骨組みだけの電子ダンス音楽である。名称はズールー語で太鼓や打撃の音を指す擬音に由来し、その通り打楽器が全てを支配する。最大の特徴は四つ打ちを用いない点で、キックは等間隔に並ばず、</p>
<p>南アフリカの港湾都市ダーバンで生まれた、極めて不穏で骨組みだけの電子ダンス音楽である。名称はズールー語で太鼓や打撃の音を指す擬音に由来し、その通り打楽器が全てを支配する。最大の特徴は四つ打ちを用いない点で、キックは等間隔に並ばず、三拍子と四拍子が同時に進行しているような、割り切れない配置を取る。この不均等さによって、聴き手はどこが拍の頭か分からないまま身体を揺らすことになり、ふらつくような独特の陶酔が生まれる。テンポは概ね120から130 BPMである。低音は極端に深く長く伸びる正弦波で、部屋の空気そのものを震わせる役割を担う。上物は驚くほど少なく、短調の不吉なシンセの和音がひとつかふたつ、金属的な打撃音、そして詠唱のように繰り返される人の声だけということも多い。旋律らしい旋律は存在せず、和声も進行しない。この徹底した簡素さと、隙間の多さが、緊張を持続させる。曲の展開も最小限で、要素の出入りだけで数分が構成される。声は歌うというより、呪文や号令のように短い語句を反復するもので、しばしば複数人の掛け声が重ねられる。祝祭的というより儀式的、あるいは威嚇的な性格を持つ音楽である。</p>
<h2>成り立ち</h2><p>舞台は南アフリカ東部の都市ダーバンである。この国では1990年代以降、クワイトと呼ばれる、ハウスの速度を落として現地の言葉を乗せた音楽が、アパルトヘイト後の黒人青年文化の中心にあった。2000年代にはハウスが国民的な音楽となり、南アフリカは世界でも有数のハウス消費国となる。2010年前後、ダーバンの黒人居住区に住む10代の若者たちが、安価な、あるいは違法に複製した音楽制作ソフトを使い、独学で曲を作り始めた。彼らは正式な訓練を受けておらず、四つ打ちの作法も知らなかったため、キックを直感的に並べた結果として、あの割り切れないリズムが生まれたと語られている。つまりこの音楽の最大の特徴は、無知と貧しさが生んだ偶然の産物でもあった。流通の経路も独特で、作品はCDやレコードではなく、ファイル共有サイトへ無償で上げられ、携帯電話の通信機能で手渡しされ、そして乗り合いのミニバスタクシーの車内で大音量で流されることによって街へ広まった。運転手が何をかけるかが事実上の売れ筋を決めていたのである。2016年、イタリア人のNan Kolèが運営するレーベルが現地の音源を集めた編集盤を国際的に発表したことで、この音楽はヨーロッパの電子音楽の聴き手に発見された。DJ LagやRudeboyz、Distruction Boyzが国際的に知られるようになる。国内では2016年にBabes Wodumoの楽曲が爆発的な人気を得て、この音楽を全国区へ押し上げた。ただし彼女は後年、交際相手であった制作者からの暴力被害を公にし、その様子が全国放送で報じられたことで、南アフリカにおける女性への暴力という深刻な社会問題を可視化する事件ともなった。国際的な成功に対しては、現地の制作者に利益が還元されていないという批判も繰り返されている。それでもこの音楽は、その後のアマピアノの流行へ道を開き、南アフリカの若者文化を世界へ届ける回路を作った。</p>
<h2>代表曲</h2><ul><li>Wololo（Babes Wodumo）</li><li>Omunye（Distruction Boyz）</li><li>Ice Drop（DJ Lag）</li></ul>
