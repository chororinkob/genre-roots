<h1>Gqom（ゴム）とは</h1>
<p>南アフリカの港湾都市ダーバンで生まれた、極めて不穏で骨組みだけの電子ダンス音楽である。名称はズールー語で太鼓や打撃の音を指す擬音に由来し、その通り打楽器が全てを支配する。最大の特徴は四つ打ちを用いない点で、キックは等間隔に並ばず、</p>
<p>南アフリカの港湾都市ダーバンで生まれた、極めて不穏で骨組みだけの電子ダンス音楽である。名称はズールー語で太鼓や打撃の音を指す擬音に由来し、その通り打楽器が全てを支配する。最大の特徴は四つ打ちを用いない点で、キックは等間隔に並ばず、非対称でシンコペーション(拍の強弱をずらすこと)したキックの配置を取る(キックの型は「3-step」「4-step」などと呼び分けられ、拍子の意味の3拍子・4拍子とは別)。この不均等さによって、聴き手はどこが拍の頭か分からないまま身体を揺らすことになり、ふらつくような独特の陶酔が生まれる。テンポは概ね120から130 BPMである。低音は極端に深く、長く引き延ばされたシンセのドローンと重い低音が、部屋の空気そのものを震わせる役割を担う。上物は驚くほど少なく、短調の不吉なシンセの和音がひとつかふたつ、金属的な打撃音、そして詠唱のように繰り返される人の声だけということも多い。旋律らしい旋律は存在せず、和声も進行しない。この徹底した簡素さと、隙間の多さが、緊張を持続させる。曲の展開も最小限で、要素の出入りだけで数分が構成される。声は歌うというより、呪文や号令のように短い語句を反復するもので、しばしば複数人の掛け声が重ねられる。祝祭的というより儀式的、あるいは威嚇的な性格を持つ音楽である。</p>
<h2>成り立ち</h2><p>舞台は南アフリカ東部の都市ダーバンである。この国では1990年代以降、クワイトと呼ばれる、ハウスの速度を落として現地の言葉を乗せた音楽が、アパルトヘイト後の黒人青年文化の中心にあった。アパルトヘイトの終わり以降、ハウス系の音楽はこの国に定着してきた。2010年代初頭(2011年ごろ)、ダーバンの黒人居住区に住む10代の若者たちが、安価な、あるいは違法に複製した音楽制作ソフトを使い、独学で曲を作り始めた。制作者たちは、既存のハウス、クワイト、トライバルハウスを聴き、Naked Boyzのブロークンビートに影響されて、歌のないビートを意図的に作ったと語っている。起源には諸説あり、自分たちが新しい音を始めたとは気づかなかったという証言もある。流通の経路も独特で、作品は、海賊版のCDや、携帯電話のBluetooth、WhatsAppのグループ、ファイル共有サイトなどで手渡し的に広まり、乗り合いのミニバスタクシーは新曲を試す場として機能した。2015年にはRudeboyzのEPが海外のレーベルから出るなど先行する紹介があり、2016年1月、イタリア人のNan Kolèと南アフリカのLerato Phiriが共同設立したレーベルが現地の音源を集めた編集盤を発表したことで、この音楽はヨーロッパの電子音楽の聴き手に広く知られるようになった。DJ LagやRudeboyz、Distruction Boyzが国際的に知られるようになる。国内では2016年にBabes Wodumoの楽曲が爆発的な人気を得て、この音楽を全国区へ押し上げた。ただし2019年、彼女がInstagram Liveでファンと話している最中に、交際相手でマネージャーのMampintshaに殴られる映像が広まり、南アフリカにおける女性への暴力という深刻な社会問題を可視化する事件ともなった。制作者本人たちは、国内でラジオ放送もほとんどされないまま海外で先に評価されたことへの不満や、文化が搾取される懸念を語っている。アマピアノはゴムの要素も取り入れており、DJ Lagはゴムとアマピアノを「兄弟分」と表現している。ゴムは、南アフリカの若者文化を世界へ届ける回路にもなった。</p>
