<h1>Lo-fi Hip Hop（ローファイヒップホップ）とは</h1>
<p>ヒップホップのビートから声と主張を取り除き、背景で流し続けるために最適化された器楽音楽。BPMは70〜90と遅く、キックとスネアはわずかに拍からずらして配置される。この意図的なずれ、いわゆるヨレが最大の特徴で、機械的な正確さを避け</p>
<p>ヒップホップのビートから声と主張を取り除き、背景で流し続けるために最適化された器楽音楽。BPMは70〜90と遅く、キックとスネアはわずかに拍からずらして配置される。この意図的なずれ、いわゆるヨレが最大の特徴で、機械的な正確さを避けることで人が叩いているような揺らぎを生む。音の質感はさらに重要で、テープの磁気ノイズ、レコードの針音、ビットレートを落とした歪み、高音域を切り落とすローパスフィルターが常時かかり、全体がくぐもって温かく聴こえる。素材はジャズのピアノやローズ・ピアノ、ソウルのギター、ボサノヴァのコード進行などから取られ、メジャー7thや9thを含む柔らかい和音が繰り返される。旋律は展開せず、二小節から四小節のループが数分間ほぼ変化しないまま続く。これは注意を引かないための設計で、聴き手が勉強や作業を続けられることが機能上の目的である。時折アニメや古い映画の台詞が挟まれ、情景を補う。ヒップホップでありながらラップがなく、アンビエントでありながら明確なビートがあるという中間的な位置に立ち、音楽を作品としてではなく環境として消費する現代的な聴き方を象徴している。</p>
<h2>成り立ち</h2><p>直接の祖は1990年代のインストゥルメンタル・ヒップホップで、とりわけ日本のNujabes（瀬場淳）と米国のJ Dillaの二人が決定的な役割を果たした。J Dilla（James Dewitt Yancey、デトロイト出身）は、サンプラーAkai MPC3000のクオンタイズ機能をあえて切り、人力に近いずれたリズムを打ち込む手法を確立し、2006年に発表したアルバムDonutsは死の三日後に世に出たことも相まって伝説化した。Nujabesはジャズのレコードを素材とした叙情的なビートで知られ、2004年のアニメ作品サムライチャンプルーの音楽を担当したことで海外にも広く知られたが、2010年に交通事故で36歳で死去した。この二人の早すぎる死が、シーンの精神的な支柱と追悼の物語を同時に作った。ジャンルとしての現在の形は2010年代半ばにインターネット上で確立した。決定的だったのは、YouTubeとTwitchにおける長時間の生放送という配信形式で、2017年頃から始まったChilledCow（後のLofi Girl）のチャンネルが、勉強する少女のアニメーションを固定表示しながら音楽を流し続け、常時数万人が視聴する状態を作った。2020年の新型コロナウイルス流行による在宅学習と在宅勤務の拡大は、この需要をさらに押し上げた。産業構造は独特で、無名の制作者が大量に楽曲を供給し、キュレーターのチャンネルがそれを配信する形で、一曲あたりの報酬は極めて低い一方、供給が絶えないという仕組みが成立している。批判としては、音楽が個々の作品としてではなく無名の背景として消費されること、制作者の取り分が不当に小さいこと、そして近年は人工知能による自動生成がこの分野に真っ先に入り込んでいることが議論されている。</p>
