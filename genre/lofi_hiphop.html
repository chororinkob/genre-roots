<h1>Lo-fi Hip Hop（ローファイヒップホップ）とは</h1>
<p>ヒップホップのビートから、声と主張を取り除いた楽器だけの音楽だ。背景で流し続けることに合わせて作られている。 素材は、ジャズなどのサンプルが多い。ローズ・ピアノやソウルのギター、ボサノヴァのコード進行などが使われることもある。メジ</p>
<p>ヒップホップのビートから、声と主張を取り除いた楽器だけの音楽だ。背景で流し続けることに合わせて作られている。

素材は、ジャズなどのサンプルが多い。ローズ・ピアノやソウルのギター、ボサノヴァのコード進行などが使われることもある。メジャー7thや9thを含む柔らかい和音が繰り返されることがある。メロディーは展開しない。短いフレーズのループを、ほぼ変化させないまま繰り返す。1曲は1〜3分程度が多い。これは注意を引かないための作り方で、聴き手が勉強や作業を続けられることが、機能の上での目的である。

テンポはBPMでおおむね70〜90前後と遅い。キックとスネアは、わずかに拍からずらして置かれる。このわざとのずれが、いわゆるヨレだ。ヨレは特徴の一つで、質感・サンプル加工・遅いテンポとあわせて語られる。機械的な正確さを避けることで、人が叩いているような揺らぎが生まれる。

音の質感では、テープの磁気ノイズ、レコードの針音、ビットレートを落とした歪み、高音域を切り落とすローパスフィルターが、しばしばかけられる。そのため全体がくぐもって、温かく聴こえる。時折、アニメや古い映画の台詞が挟まれ、情景を補う。

ヒップホップでありながらラップがなく、アンビエントでありながら明確なビートがある。その中間的な立場にあり、音楽を作品としてではなく環境として消費する、現代的な聴き方の代名詞になっている。</p>
<h2>成り立ち</h2><p>源流として挙げられるのは、2000年代のビートメイカーのシーンだ。日本のNujabes（瀬葉淳）は、「ロフィ・ヒップホップのゴッドファーザー」と呼ばれることが多い。米国のJ Dillaも、しばしば関連づけられる。ほかに、MF DoomとMadlibの2004年のアルバムMadvillainyを、共通の基準点とする見方もある。ただし、NujabesやJ Dillaとロフィの結びつきを疑問視する意見もある。

J Dilla（James Dewitt Yancey、デトロイト出身）は、サンプラーAkai MPC3000を使った。彼はクオンタイズ機能を切ったとも言われる。しかしDan Charnasは、著書『Dilla Time』で、これを俗説として退けている。彼は、スウィングとストレートが同居する、複数の拍感を作り出した。配置は曲ごとに異なる。例えば、ハイハットは手弾き、スネアがやや前、キックが遅れる曲もある。2006年2月7日、32歳の誕生日に、彼はアルバムDonutsを発売した。その三日後に亡くなったこともあって、この作品は伝説のようになった。

一方、Nujabesは、ジャズのレコードを素材にした叙情的なビートで知られた。2004年のアニメ作品サムライチャンプルーでは、4組の制作チーム(Tsutchie、Fat Jon、Nujabes、Force of Nature)が音楽を担当した。彼はその一つとして、複数のアルバムにわたり十数曲を提供し、サウンドの中心的存在だった。これにより海外にも広く知られたが、2010年に交通事故で36歳で亡くなった。この2人の早すぎる死は、シーンの精神的な支えと、追悼の物語を同時に生んだ。

ジャンルとしての今の形は、2010年代半ばから後半（2015〜2017年ごろ）に、YouTubeで広がった。大きな要因の一つは、YouTubeでの長時間の生放送という配信の形だ。ChilledCow（後のLofi Girl）のチャンネルは、2015年3月に開設され、2017年2月25日に24時間配信を始めた。勉強する少女のアニメーションを固定して映しながら、音楽を流し続けた。2023年には、平均約4万人が同時接続する状態になった。2020年には、新型コロナウイルスの流行で在宅学習と在宅勤務が広がり、この需要をさらに押し上げた。

産業の仕組みは独特だ。無名の制作者が大量に楽曲を送り出し、キュレーターのチャンネルがそれを配信する。こうして、供給が絶えない仕組みができている。配信チャンネルは通常、制作者に使用料を払わない。制作者は、非独占・無償のライセンスで露出を得る。収益は、ストリーミング配信の側で得る。

それでも、批判はある。音楽が一つ一つの作品ではなく、無名の背景として消費されること。制作者の取り分について、一部レーベルの低い配分が指摘されていること。そして2025年7月には、近年は人工知能の影響で、制作者が収益の減少と疎外に苦しんでいると報じられた。</p>
