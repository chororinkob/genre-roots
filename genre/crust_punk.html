<h1>Crust Punk（クラストパンク）とは</h1>
<p>ハードコア・パンクとメタルを混ぜ合わせ、絶望と汚さを前面に出した音楽だ。 ギターは深く歪ませた音で、単純だが重いリフを刻む。しばしば低音弦だけで進む。ベースも歪ませて前面に出され、ピック弾きの硬い音が曲の輪郭を作ることがある。和声</p>
<p>ハードコア・パンクとメタルを混ぜ合わせ、絶望と汚さを前面に出した音楽だ。

ギターは深く歪ませた音で、単純だが重いリフを刻む。しばしば低音弦だけで進む。ベースも歪ませて前面に出され、ピック弾きの硬い音が曲の輪郭を作ることがある。和声（コードの響き）は短調の反復になることもあり、初期は旋律が乏しい。のちに旋律的な流れ（ネオクラスト）が生まれた。

ドラムはディスチャージ由来で、スネアを2・4拍に置き、キックを群で刻む。これがディービート（4/4でスネアを2・4拍に置く型）という型で、使われることもある。当初は主にミッドテンポで、後続のバンドが速く、または旋律的にした。ドラムは高速で演奏される。録音は粗く濁ったものが多く、特徴の一つである。

歌唱は、男女どちらの場合も喉を絞る絶叫だ。Extreme Noise TerrorやNauseaのように、2人で歌うバンドもある。

歌詞が本質的に重要である。戦争、動物の権利、環境破壊、警察国家、資本主義、宗教への批判が、具体的な事実とともに書かれる。Crass系のレーベルでは、折り込みポスターに文章を載せる例があった。

生活のスタイルと切り離せない音楽でもある。廃屋の占拠、菜食主義、既存の流通を使わない自主制作が、実践として結びついている。ライブは占拠された建物や地下室で行われ、入場料は最小限に抑えられることもある。</p>
<h2>成り立ち</h2><p>1980年代のイギリスで、この音楽は始まった。

まずCrassが1977年に結成され、1979年に自主レーベルCrass Recordsを設立した。無政府主義と平和主義を掲げて活動を実践し、音楽と政治を切り離さない態勢を作った。次いでDischargeが1980年前後に、核戦争と軍事への恐怖を短い言葉で叫ぶスタイルを示した。そしてディービートを特徴的な形に発展させ、その名の由来となった。

この二つを土台に、メタルの重さを加えたのが、デヴォン州タヴィストックのAmebixと、ドーヴェントリーのAntisectである。1983年から85年頃に、現在の形が固まった。名称そのものを与えたのは、ニューカッスルのバンドHellbastardだ。1986年のデモ『Ripper Crust』が語源とされる（先行する別名にstenchcoreがある）。

同じ頃、Extreme Noise TerrorやNapalm Deathの初期が、この周辺から現れた。やや遅れて1987年にDoomも現れた。Napalm Deathはやがてグラインドコアへ進んだ。イギリスでは、安い住居・寛容な占拠法・福祉給付がシーンを支え、占拠した会場や住居を拠点にするバンドもあった。一方、核軍縮運動（CND）とは緊張関係があり、炭鉱ストとの連携は成立しなかった。

同時期のスウェーデンでは、Anti CimexやMob 47らにより、D-beat（kängpunk）の速く荒い形が発展した。のちにD-beatとクラストが結びついた。その後、このスタイルは国際的に広がる。

日本ではSSやThe Stalinに続いて、1981年にG.I.S.M.やGauzeが結成され、並行して活動した。後に大阪のGloomやFramtidがクラストの流れを担い、独自の激しさを示した。日本のバンドの音は世界的に高く評価された。

アメリカではNausea、Misery、Dystopiaが続いた。1990年代後半には、His Hero Is Goneらの旋律的クラストとスペインのエモクラストが並行して現れた。2000年代初頭にネオクラストと呼ばれ、2000年代半ばに広まった。この音楽はDIY志向が強く、商業的な成功を目指さない傾向がある。</p>
<h2>代表曲</h2><ul><li>Scum（Napalm Death）</li><li>Stress Builds Character (Dystopia)</li><li>Hear Nothing See Nothing Say Nothing（Discharge）</li><li>Amebix &quot;Knights of the Black Sun (Amebix)</li><li>Arise!（Amebix）</li><li>War System（Disclose）</li><li>Testament (Disfear)</li><li>Våld (Skitsystem)</li><li>Bullshit Propaganda (Extreme Noise Terror)</li><li>Johnny Got His Gun (Nausea)</li><li>Like Weeds (His Hero Is Gone)</li><li>Chain Reaction (Amebix)</li></ul>
