<h1>Crust Punk（クラストパンク）とは</h1>
<p>ハードコア・パンクとメタルを混ぜ合わせ、絶望と汚さを前面に出した音楽。ギターは深く歪ませた音で、単純だが重いリフを刻み、しばしば低音弦だけで進む。決定的な特徴は録音の質感で、意図的に音を潰し、中域を濁らせ、全体を泥のような塊にする</p>
<p>ハードコア・パンクとメタルを混ぜ合わせ、絶望と汚さを前面に出した音楽。ギターは深く歪ませた音で、単純だが重いリフを刻み、しばしば低音弦だけで進む。決定的な特徴は録音の質感で、意図的に音を潰し、中域を濁らせ、全体を泥のような塊にする。ドラムはディスチャージ由来の、キックとスネアが交互に高速で連打されるディービートという型を基本にし、テンポは毎分160から200拍程度で押し切るが、途中で極端に遅い部分に落ちる展開も多い。ベースは歪ませて前面に出され、ピック弾きの硬い音が輪郭を作る。歌唱は男女どちらの場合も喉を絞る絶叫で、しばしば二人が交互に、あるいは同時に叫ぶ。和声は短調の反復で、旋律はほぼない。歌詞が本質的に重要で、戦争、動物の権利、環境破壊、警察国家、資本主義、宗教への批判が具体的な事実とともに書かれ、レコードには長い解説文と抗議運動の連絡先が同封されることが多い。生活様式と不可分な音楽でもあり、廃屋の占拠、菜食主義、既存の流通を使わない自主制作が実践として結びついている。ライブは占拠された建物や地下室で行われ、入場料は最小限に抑えられる。</p>
<h2>成り立ち</h2><p>起点は1980年代のイギリスである。まずCrassが1977年から、無政府主義と平和主義を掲げて自主レーベルによる活動を実践し、音楽と政治を切り離さない態勢を作った。次いでDischargeが1980年前後に、核戦争と軍事への恐怖を短い言葉で叫ぶ様式と、後にディービートと呼ばれるドラムの型を確立した。この二つを土台に、メタルの重さを加えたのがヨークシャーのAmebixとロンドンのAntisectで、1983年から85年頃に現在の形が固まる。名称そのものを与えたのはStoke-on-TrentのバンドHellbastardで、1986年のカセット作品の題名が語源とされる。同じ頃DoomやExtreme Noise Terror、Napalm Deathの初期がこの周辺から現れ、Napalm Deathはやがてグラインドコアへ進んだ。イギリスではサッチャー政権下の炭鉱ストライキ、失業、核兵器配備への反対運動が背景にあり、担い手の多くは廃屋を占拠して暮らす若者だった。1980年代末には、この様式が国際的に広がる。スウェーデンではAnti CimexやMob 47が、より速く鋭い形を作り、これは後にディービート・クラストと呼ばれた。日本ではG.I.S.M.やGauze、後にGloomやFramtidが独自の激しさを示し、日本のバンドの音は世界的に高く評価された。アメリカではNausea、Misery、Dystopiaが続き、1990年代にはHis Hero Is GoneやTragedyが、より構築的で旋律的な方向へ広げてネオクラストと呼ばれる流れを生んだ。この音楽はほとんどの場合、商業的な成功を目指しておらず、レコードは少部数で作られ、公演は非営利で行われるという原則が40年以上守られ続けている。</p>
