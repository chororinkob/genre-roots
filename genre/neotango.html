<h1>Neotango（ネオタンゴ）とは</h1>
<p>アルゼンチン・タンゴの語法を、電子音楽や現代のジャズの手法で組み直した音楽。核となる楽器はバンドネオンで、蛇腹を強く引き絞って出す鋭い和音の刻みと、息のような長い持続音の対比がそのまま残されている。ヴァイオリンには弓の背で弦を叩く</p>
<p>アルゼンチン・タンゴの語法を、電子音楽や現代のジャズの手法で組み直した音楽。核となる楽器はバンドネオンで、蛇腹を強く引き絞って出す鋭い和音の刻みと、息のような長い持続音の対比がそのまま残されている。ヴァイオリンには弓の背で弦を叩くゴルペや、弦を擦って軋ませるチチャーラといったタンゴ特有の奏法が用いられる。ピアノは打楽器のように低音を叩き、コントラバスは弦を指板に打ちつけて破裂音を出す。これらの生楽器に、打ち込みのビート、サンプリング、シンセの持続音が重ねられる。リズムの中心は四拍を三と三と二に分割するマルカートの型で、この非対称の刻みがタンゴらしさを決定づけている。テンポは毎分100から130拍程度が多いが、電子的な四つ打ちを併用して踊りやすくした曲も多い。和声は短調を基調に半音階的な内声の動きを多用し、劇的な緊張と弛緩を作る。歌が入る場合はブエノスアイレスの下町の言葉であるルンファルドが使われ、しゃがれた声で語るように歌われる。同じタンゴでも、1940年代の舞踏場向けの様式が踊りの拍を守ることを最優先したのに対し、こちらは聴くための音楽と踊るための音楽の両方に軸足を置き、クラブでも演奏会場でも成立するように作られている。</p>
<h2>成り立ち</h2><p>前史として決定的なのはÁstor Piazzollaである。1920年生まれの彼は、ニューヨークで育ち、ブエノスアイレスの楽団でバンドネオンを弾いた後、パリでNadia Boulangerに作曲を学んだ。帰国後の1950年代後半から、フーガや不協和音、エレキギターを取り入れた新しいタンゴを打ち出し、これをタンゴ・ヌエボと名づけた。伝統的なタンゴの愛好家や踊り手からは激しく攻撃され、脅迫を受けたことも一度ではなかった。彼の『Adiós Nonino』(1959)や『Libertango』(1974)は、後の世代のすべての出発点となった。現在のネオタンゴが形になったのは1990年代末から2000年代前半のヨーロッパである。パリを拠点としたGotan Projectが2001年に『La Revancha del Tango』を発表し、バンドネオンとダブやハウスのビートを組み合わせたこの作品は、世界で100万枚以上を売った。彼らはアルゼンチン人とフランス人とスイス人の混成で、外から見たタンゴという性格を持っていた。同じ頃、ブエノスアイレス出身でチューリッヒに拠点を置いたBajofondoが、Gustavo Santaolallaを中心に2002年に結成され、より生演奏を重視した方向を示した。Santaolallaは映画音楽の作曲家として二度アカデミー賞を受賞している。ほかにTanghettoやNarcotangoが続き、ブエノスアイレスでは若い演奏家がミロンガと呼ばれる踊りの集いに新しい音を持ち込んだ。ただし論争は絶えず、踊り手の側からは電子的なタンゴでは踊れない、あるいは伝統の破壊だという批判が根強い。一方でこの流れは、2000年代に世界各地で起きたタンゴの踊りの再流行と結びつき、若い世代がこの音楽に触れる入口としての役割を果たした。</p>
