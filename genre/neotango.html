<h1>Neotango（ネオタンゴ）とは</h1>
<p>ここでいうネオタンゴは、アルゼンチン・タンゴの表現を、電子音楽や現代のジャズの手法で組み直した音楽だ。この語は、踊りやミロンガの種類を指すこともある。 中心になる楽器はバンドネオンである。蛇腹を強く引き絞って出す鋭い和音の刻みと、</p>
<p>ここでいうネオタンゴは、アルゼンチン・タンゴの表現を、電子音楽や現代のジャズの手法で組み直した音楽だ。この語は、踊りやミロンガの種類を指すこともある。

中心になる楽器はバンドネオンである。蛇腹を強く引き絞って出す鋭い和音の刻みと、息のように長く伸びる音。その対比が、そのまま残されている。

ヴァイオリンには、楽器の胴を叩くゴルペ(golpe de caja)や、駒の裏側の弦を弓で擦るチチャーラといった、タンゴ特有の奏法が使われる。ピアノは打楽器のように低音を叩く例が多い。コントラバスは、ゴルペ(胴を叩く奏法)やストラパタ(弓で弦を叩く奏法)で、打楽器のような音を出す。こうした生楽器に、打ち込みのビート、サンプリング、シンセの持続音が重ねられる。

和音は短調を基本にし、半音ずつ動く内側の声部を多く使って、劇的な緊張と緩みを作る例が多い。

リズムの代表的な型には、4拍を刻む伴奏のマルカートがある。また、4拍を8分音符8つで割って三と三と二に分ける3-3-2もあり、Piazzollaの音楽で目立つ特徴とされる。テンポは、代表例であるGotan Projectの初作では、平均で毎分約108拍だ。電子的な四つ打ちを併用して、踊りやすくした曲も多い。

歌詞には、ラプラタ川流域の隠語であるルンファルドが取り入れられることがある。

同じタンゴでも、1940年代の舞踏場向けのスタイルは、踊りの拍を守ることを何より優先した。これに対してこちらは、聴くための音楽と踊るための音楽の両方を大切にする。クラブでも演奏会場でも成り立つように作られている。</p>
<h2>成り立ち</h2><p>前の時代で大きな存在は、Ástor Piazzollaだ。1921年生まれの彼は、ニューヨークで育った。ブエノスアイレスの楽団でバンドネオンを弾いた後、パリでNadia Boulangerに作曲を学んだ。

1955年に帰国すると、彼はOcteto Buenos Airesを結成した。この頃から、不協和音やエレキギターを取り入れた新しいタンゴを打ち出した。フーガのような対位法的な書き方も、後の作品で発展させた。1955年に生まれたこのOcteto Buenos Airesが、のちにヌエボ・タンゴと呼ばれる動きの始まりとなった。

しかし、伝統的なタンゴの愛好家や踊り手からは激しく攻撃された。脅迫を受けたことも一度ではなかった。それでも、彼の『Adiós Nonino』(1959)や『Libertango』(1974)は、後の世代に大きな影響を与えた作品とされる。

今のネオタンゴが形になったのは、2000年代初頭だ。動きは、パリ(Gotan Project)とリオ・デ・ラ・プラタ(Bajofondo、Tanghetto、Narcotango)で並行して進んだ。

パリを拠点としたGotan Projectは、1999年に結成された。2001年に発表した『La Revancha del Tango』は、バンドネオンと電子音楽(エレクトロニカ、ニュー・ジャズ)を組み合わせた作品で、世界で100万枚以上を売った。メンバーはアルゼンチン人とフランス人とスイス人の混成で、外から見たタンゴという性格を持っていた。

同じ頃、アルゼンチンとウルグアイの音楽家による集団Bajofondoが、Gustavo SantaolallaとJuan Campodónicoの発案で、2000年代初頭に始まった。2002年には、デビュー作『Bajofondo Tango Club』を発表している。当初はスタジオ中心の電子的な制作だったが、活動を重ねるにつれて生演奏の割合が高まった。Santaolallaは、映画音楽の作曲家として2度アカデミー賞を受賞している。

Narcotangoも、2001年から活動を始めた。Tanghettoも、2001年にスタジオ企画として始まり、2003年に今の名前を名乗ってバンドになった。両者も、並行して現れたのである。電子的なタンゴは、ブエノスアイレスのNarcotangoのような動きと、欧米のネオロンガの両方を通じて、ミロンガと呼ばれる踊りの場に入っていった。

ただし、論争は絶えない。踊り手の側からは、電子的なタンゴでは踊れない、あるいは伝統の破壊だという批判が根強い。一方でこの流れは、1980年代以降に続いたタンゴの踊りの再興の中で、2000年代にネオタンゴやネオロンガの動きとして広がった。そして、若い世代がこの音楽に触れる入り口の役割を果たした。</p>
