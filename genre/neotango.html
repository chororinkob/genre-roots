<h1>Neotango（ネオタンゴ）とは</h1>
<p>アルゼンチン・タンゴの表現を、電子音楽や現代のジャズの手法で組み直した音楽。中心となる楽器はバンドネオンで、蛇腹を強く引き絞って出す鋭い和音の刻みと、息のような長く伸びる音との対比がそのまま残されている。ヴァイオリンには楽器の胴を</p>
<p>アルゼンチン・タンゴの表現を、電子音楽や現代のジャズの手法で組み直した音楽。中心となる楽器はバンドネオンで、蛇腹を強く引き絞って出す鋭い和音の刻みと、息のような長く伸びる音との対比がそのまま残されている。ヴァイオリンには楽器の胴を叩くゴルペ(golpe de caja)や、弦を擦って軋ませるチチャーラといったタンゴ特有の奏法が用いられる。ピアノは打楽器のように低音を叩き、コントラバスはゴルペ(胴を叩く奏法)やストラパタ(弓で弦を叩く奏法)で打楽器的な音を出す。これらの生楽器に、打ち込みのビート、サンプリング、シンセの持続音が重ねられる。リズムの代表的な型には、行進曲風のマルカートや、4拍を三と三と二に分ける3-3-2(特にPiazzolla以降)がある。テンポは毎分100から130拍程度が多いが、電子的な四つ打ちを併用して踊りやすくした曲も多い。和音は短調を基調に、半音ずつ動く内側の声部を多く使い、劇的な緊張と弛緩を作る。歌が入る場合はブエノスアイレスの下町の言葉であるルンファルドが使われ、しゃがれた声で語るように歌われる。同じタンゴでも、1940年代の舞踏場向けの様式が踊りの拍を守ることを最優先したのに対し、こちらは聴くための音楽と踊るための音楽の両方に重きを置き、クラブでも演奏会場でも成立するように作られている。</p>
<h2>成り立ち</h2><p>前の時代の話として大きいのはÁstor Piazzollaである。1921年生まれの彼は、ニューヨークで育ち、ブエノスアイレスの楽団でバンドネオンを弾いた後、パリでNadia Boulangerに作曲を学んだ。1955年に帰国してOcteto Buenos Airesを結成した頃から、フーガや不協和音、エレキギターを取り入れた新しいタンゴを打ち出し、これをタンゴ・ヌエボと名づけた。伝統的なタンゴの愛好家や踊り手からは激しく攻撃され、脅迫を受けたことも一度ではなかった。彼の『Adiós Nonino』(1959)や『Libertango』(1974)は、後の世代に大きな影響を与えた作品とされる。現在のネオタンゴが形になったのは2000年代初頭で、パリ(Gotan Project)とリオ・デ・ラ・プラタ(Bajofondo、Tanghetto、Narcotango)で並行して進んだ。パリを拠点としたGotan Projectは1999年に結成され、2001年に『La Revancha del Tango』を発表した。バンドネオンと電子音楽(エレクトロニカ、ニュー・ジャズ)を組み合わせたこの作品は、世界で100万枚以上を売った。彼らはアルゼンチン人とフランス人とスイス人の混成で、外から見たタンゴという性格を持っていた。同じ頃、アルゼンチンとウルグアイの音楽家による集団Bajofondoが、Gustavo SantaolallaとJuan Campodónicoの発案で2002年に構想され、より生演奏を重視した方向を示した。Santaolallaは映画音楽の作曲家として2度アカデミー賞を受賞している。ほかにTanghettoやNarcotangoが続き、ブエノスアイレスでは若い演奏家がミロンガと呼ばれる踊りの集いに新しい音を持ち込んだ。ただし論争は絶えず、踊り手の側からは電子的なタンゴでは踊れない、あるいは伝統の破壊だという批判が根強い。一方でこの流れは、2000年代に世界各地で起きたタンゴの踊りの再流行と結びつき、若い世代がこの音楽に触れる入り口としての役割を果たした。</p>
