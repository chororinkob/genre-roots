<h1>Minimal Techno（ミニマルテクノ）とは</h1>
<p>テクノから要素を削り落とし、極端に少ない素材だけで長時間を成立させる系統。考え方ははっきりしていて、鳴っている音の数を減らし、その代わりに一つ一つの音の質感と配置をぎりぎりまで精密にする。典型的な楽曲は、キック、ハイハット、短いク</p>
<p>テクノから要素を削り落とし、極端に少ない素材だけで長時間を成立させる系統。考え方ははっきりしていて、鳴っている音の数を減らし、その代わりに一つ一つの音の質感と配置をぎりぎりまで精密にする。典型的な楽曲は、キック、ハイハット、短いクリック音、そして低いベースの4要素だけで構成される。テンポは125〜130BPMと比較的穏やかで、速度ではなく持続と微細な変化が体験の中心になる。展開はとてもゆっくりで、16小節や32小節に一度、一つの音のフィルターがわずかに開くか、パーカッションが一つ増えるだけといった変化が積み重なる。この変化の少なさが、聴き手の注意を細部へ向けさせ、時間の感覚を引き伸ばす効果を生む。音色にはデジタル的なクリックやノイズ、加工したフィールド録音、木材や金属を叩いた短い音が用いられ、これらが空間の中で左右前後に精密に配置される。音を置く左右の位置と残響の作り込みが、曲の組み立てそのものを受け持つ。低い音の部分はきわめて整理されていて、キックとベースが互いの帯域を侵さないよう厳密に分離される。和音はほぼなく、あっても一つの伸びる和音が霧のように背景に置かれる。曲の長さは7分から12分が普通で、DJが複数の曲を長時間重ねることを前提とする。ダブテクノと素材を共有するが、ダブの残響の海に対して、ミニマルは乾いた空間と点描的な配置を志向する点が異なる。</p>
<h2>成り立ち</h2><p>起源には諸説あり、デトロイトのRobert HoodとDaniel Bellが1990年代初頭に発展させたとされる一方、ドイツのBasic Channelを起源とする見方もある。ここでは主な二つの流れを挙げる。一つはデトロイトのRobert Hoodで、Underground Resistanceのメンバーだった彼は1994年のアルバム「Minimal Nation」で、キックとハイハットとわずかなシンセだけの楽曲を提示した。Hood本人は、当時のテクノが「レイヴ的」になりすぎ、テンポの上昇でガバが出てきて、ソウルやファンクが失われたと考え、元のアンダーグラウンドへの回帰を目指したと説明している。もう一つはドイツのケルンで、Wolfgang Voigt、Reinhard Voigt、Jörg Burger、Jürgen Paapeが1993年にレコード店（Delirium）を開き、Michael Mayerらが少し後に加わって、1998年にレーベルKompaktを設立した。彼らはポップな旋律の断片と極度に整理された音響を組み合わせ、ケルン独自の柔らかいミニマルを作った。並行してベルリンではBasic Channel(Moritz von OswaldとMark Ernestus)がダブの残響と反復を持ち込み、後にChain ReactionやBasic Channelの系譜がミニマルの音響設計に決定的な影響を与えた。1990年代後半にはドイツのPerlonやランダムなクリック音を用いるMouse on Marsらの実験も重なり、音響志向の一群が生まれ、2000年にMille Plateauxが出した編集盤シリーズの題名「クリック&amp;カッツ」が、のちにその分野を指す語として広まった。マイクロハウスとも呼ばれる。2000年代前半に大きな流行が訪れる。チリ生まれで幼少期にドイツへ移住したRicardo Villalobosが2003年の「Alcachofa」で、長く展開の少ない楽曲を提示し、ベルリンのクラブ文化と結びついて国際的な現象になった。この時期の中心はベルリンのクラブPanorama BarとBerghain(2004年開店)、そしてスイスのLuciano、チリのDandy Jack、ドイツのRicardo Villalobos周辺の共同体だった。1998年から2008年頃にかけてミニマルはベルリンの時代の空気を形づくり、各国のクラブでも人気を集め、その反動として批判も強まる。曲に何も起きない、単調で退屈である、薬物なしには耐えられないといった非難が向けられた。2009年前後には市場が飽和して急速に退潮し、より歌ものやディープハウス寄りの音へ揺り戻しが起きた。しかし手法としては完全に定着し、現在のテクノやハウスの制作における音の整理の基準として生き続けている。Robert Hoodは2010年代にゴスペルをハウスやディスコ、テクノと結びつけたFloorplan名義(2016年から娘のLyricが加わった)で新たな評価を得ており、Kompaktもケルンで活動を続けている。</p>
