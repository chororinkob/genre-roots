<h1>Minimal Techno（ミニマルテクノ）とは</h1>
<p>ミニマル・テクノは、テクノから要素を削り落とし、極端に少ない素材だけで長い時間を成り立たせる種類の音楽だ。考え方ははっきりしている。鳴っている音の数を減らし、その代わりに一つ一つの音の質感と配置を、ぎりぎりまで精密にする。 一般的</p>
<p>ミニマル・テクノは、テクノから要素を削り落とし、極端に少ない素材だけで長い時間を成り立たせる種類の音楽だ。考え方ははっきりしている。鳴っている音の数を減らし、その代わりに一つ一つの音の質感と配置を、ぎりぎりまで精密にする。

一般的なミニマル・テクノは、ドラムマシンとシンセが中心だ。これらの音が、空間の中で左右・前後に精密に配置される。音を置く左右の位置と、残響の作り込みが、曲の組み立てそのものを受け持つ。ミニマルの原型であるMinimal Nationの構成は、キック、単一のメロディ要素（コード）、ハイハットである。

和音（コード）の反復が、曲の核になる例もある。

テンポは平均で125〜130BPMと、比較的穏やかだ。体験の中心になるのは、速さではなく、持続と細かな変化である。低い音の部分はきわめて整理されている。キックとベースは、互いの音域を侵さないよう厳密に分けられることが多い。

展開はとてもゆっくりだ。16小節や32小節に一度、一つの音のフィルターがわずかに開くか、パーカッションが一つ増えるだけ。そうした変化が積み重なっていくことが多い。この変化の少なさが、聴き手の注意を細部へ向けさせ、時間の感覚を引き伸ばす効果を生む。

曲の長さは、作家や時期によって大きく異なる。DJが複数の曲を長い時間重ねることが前提になっている。なお、ミニマルとダブテクノは重なりが大きい。</p>
<h2>成り立ち</h2><p>起源には諸説ある。デトロイトのRobert HoodとDaniel Bellが1990年代初頭に発展させたとされる一方、ドイツのBasic Channelを起源とする見方もある。ここでは主な二つの流れを挙げる。

一つ目はデトロイトのRobert Hoodだ。Underground Resistanceのメンバーだった彼は、1994年のアルバム「Minimal Nation」で、ほぼキックとハイハットとわずかなシンセだけの楽曲を示した。Hood本人の説明はこうだ。当時のテクノは「レイヴ的」になりすぎ、テンポが上がってガバが生まれ、ソウルやファンクが失われた。だから元のアンダーグラウンドへ戻ることを目指した、という。

二つ目はドイツのケルンだ。1993年、Wolfgang Voigt、Reinhard Voigt、Jörg Burger、Jürgen Paapeがレコード店（Delirium）を開いた。少し後にMichael Mayerらが加わり、1998年にレーベルKompaktを設立した。彼らはポップな旋律の断片と、極度に整理された音を組み合わせ、ケルン独自の柔らかいミニマルを作ったと評される。

同じころベルリンでは、Basic Channel(Moritz von OswaldとMark Ernestus)が、ダブの残響と反復を持ち込んでいた。その後、Basic Channelの2人が立ち上げたレーベルChain Reactionとともに、ミニマルの音響設計に影響を与えたと指摘する論者もいる。

1990年代後半には、ドイツのPerlonらの実験も重なり、音の響きを重んじる一群が生まれた。2000年にはMille Plateauxが編集盤シリーズを出し、その題名「クリック&amp;カッツ」が、のちにその分野を指す言葉として広まった。一方、マイクロハウスはハウス由来の別ジャンルで、ミニマルと融合し、時に単に「minimal」とも呼ばれる。

2000年代前半から半ばにかけて、大きな流行が訪れる。チリ生まれで幼いころにドイツへ移ったRicardo Villalobosが、2003年の「Alcachofa」で、長く展開の少ない楽曲を示した。Alcachofa（2003）はその代表的な作品だ。流行はベルリンのクラブ文化と結びつき、国際的な現象になった。この時期、ベルリンのクラブBerghain（Panorama Bar を含む）(2004年開店)は、ミニマルを含む複数の系統で知られた拠点だった。中心にいたのは、スイス・チリ系のLuciano、チリ生まれのDandy Jack、チリ・ドイツ系のRicardo Villalobosの周りの仲間たちだった。

1998年から2008年頃にかけて、ミニマルはベルリンの時代の空気を形づくり、各国のクラブでも人気を集めた。しかし、その反動として批判も強まる。「minimal が悪い言葉になった」「質の低いミニマルが増えた」といった声や、長い曲への批判が向けられた。2000年代後半には勢いを失い、「minimal」という言葉そのものが避けられるようになった。

それでも手法としては、今日のテクノの音づくりに影響を残している。Robert Hoodは2010年代、ゴスペルをハウスやディスコ、テクノと結びつけたFloorplan名義(2016年から娘のLyricが加わった)で新たな評価を得ている。Kompaktも、ケルンで活動を続けている。</p>
