<h1>Waltz（ワルツ）とは</h1>
<p>4分の3拍子で、男女が向かい合って組み、回転しながら踊るための音楽である。伴奏は左手が1拍目に低音を置き、2拍目と3拍目に和音を軽く重ねる、いわゆるズンチャッチャの型を取る。この1拍目だけが重く残りが浮くという重心の偏りが、踊り手</p>
<p>4分の3拍子で、男女が向かい合って組み、回転しながら踊るための音楽である。伴奏は左手が1拍目に低音を置き、2拍目と3拍目に和音を軽く重ねる、いわゆるズンチャッチャの型を取る。この1拍目だけが重く残りが浮くという重心の偏りが、踊り手を次の回転へ押し出す推進力になっている。テンポは種類によって大きく異なり、ゆったり聴かせるスローワルツは一分間に84から90拍程度、ウィンナ・ワルツは一分間に174から180拍と倍近い速さで回る。ウィーン風の演奏には楽譜に書かれない癖があり、2拍目をわずかに早めに、3拍目を遅らせて弾く。この揺れが独特の浮遊感を生み、機械的に均等な3拍子で演奏すると途端に別物になる。旋律は8小節を単位とした対称的な作りが基本で、序奏、複数のワルツ主題、締めのコーダ（締めくくりの部分）という組曲的な構成を取ることが多い。編成は舞踏会用の管弦楽が中心だが、地域によって編成は入れ替わり、アコーディオンや金管が主役になるものもある。3拍子を2拍のまとまりに聞かせるヘミオラを差し込んで拍の感覚を一時的に揺さぶる手法もよく使われる。演奏会用に書かれたものでは踊りやすさの制約が外れ、テンポや拍節が自在に崩される。</p>
<h2>成り立ち</h2><p>起源には諸説ある。16世紀ヨーロッパのvolteなど滑る舞踊にさかのぼる言及があり、1750年頃（語の初出は1748年とも）にバイエルン・チロル・シュタイアーマルクの庶民がWalzerを踊り始め、ボヘミアのmatenik・furiantやフランスのWaltも前身として挙がっている。ウィーンで流行したのは1780年代頃である。当時の宮廷舞踏は男女が離れて列を組む形式が主流であり、初期のワルツは現在のクローズドホールド（体を密着させて組む形）ではなく、腕を組んだり半クローズだったりした。非難は体の近さと、長いドレスを持ち上げる所作に向けられ、宮廷や宗教界などで各地の禁止・制限があった。例として、ウィーンやプロイセンの宮廷舞踏会、カリフォルニアの伝道所（1834年まで）がある。それでも18世紀末のウィーンでは市民層に爆発的に広まり、代表的な舞踏場Zum Sperlは1807年、Apolloは1808年に開設された。ワルツはウィーンで1780年代に流行し、英国には1791年に到達し、1813年には英国社交界で大きな話題になっていた。1814年から翌年にかけてのウィーン会議は、その普及を後押しした一要因で、ナポレオン戦争後の欧州秩序を決める各国代表が連日の舞踏会に明け暮れ、「会議は踊る、されど進まず」とからかわれた。この場でワルツを持ち帰った各国の使節により、欧州各地で流行が広がった。ただし宮廷の公式舞踏会では引き続き排除されていた。1830年代のウィーンではヨーゼフ・ランナーとヨハン・シュトラウス一世が人気を二分した、友好的なライバルだった。決定的な様式を完成させたのは息子のヨハン・シュトラウス二世で、1866年晩秋から翌冬にかけて作曲された『美しく青きドナウ』は、1867年2月15日にウィーン男声合唱協会で合唱版が初演されて好評を博し、管弦楽版もパリ万国博覧会で圧倒的な成功を収め、事実上のオーストリア第二の国歌となった。ランナーやシュトラウス一世の活躍期と重なる1824〜1849年に、フレデリック・ショパンは、踊るためではなく演奏会で聴くためのワルツを書き、拍節（拍の区切り）を自由に伸縮させる手法を持ち込んだ。20世紀に入ると、モーリス・ラヴェルが1920年に発表した『ラ・ヴァルス』で、優雅なウィーン舞踏会の情景が次第に歪み、崩壊していく音楽を書いた。第一次世界大戦でハプスブルク帝国が消滅した直後の作品であり、失われた世界への追悼と読まれているが、ラヴェル本人は、戦後ウィーンの状況とは関係がなく、象徴的な意味もなく、音楽が表現するもの（音響の漸進的な高まり）だけを見るべきだと述べている。アメリカに渡ったワルツはカントリー音楽に取り込まれ、1946年にピー・ウィー・キングらが書いた『テネシー・ワルツ』(1947年12月録音、1948年1月発売)は、1950年のパティ・ペイジ盤が数百万枚を売り上げた。メキシコやペルーでは現地の様式と結びついたバルスとして独自に発展し、日本でも戦後の歌謡曲に3拍子の型として定着した。</p>
<h2>代表曲</h2><ul><li>Waltz of the Flowers (Tchaikovsky)</li><li>The Blue Danube (Johann Strauss II)</li><li>Second Waltz (Shostakovich)</li><li>Waltz in D-flat major, Op. 64, No. 1 'Minute Waltz' (Chopin)</li><li>Waltz in C-sharp minor, Op. 64 No. 2 (Evgeny Kissin)</li><li>Emperor Waltz (Johann Strauss II)</li><li>Valse sentimentale (Josef Sakonov)</li><li>Voices of Spring (Johann Strauss II)</li><li>Roses from the South (Strauss II)</li><li>Waltz in A-flat Op. 69 No. 1 'Farewell' (Vladimir Ashkenazy)</li><li>Valse triste (Estonian Festival Orchestra)</li><li>Wiener Blut (Vienna Philharmonic)</li><li>Waltz of the Snowflakes (Warner Classics)</li><li>Tales from the Vienna Woods (Boston Pops Orchestra)</li><li>Sleeping Beauty Waltz (Moscow Philharmonic Orchestra)</li><li>Skater's Waltz (Orquestra Gulbenkian)</li><li>Gold and Silver Waltz (Royal Philharmonic Orchestra)</li></ul>
