<h1>Waltz（ワルツ）とは</h1>
<p>ワルツは、4分の3拍子で、男女が向かい合って組み、回転しながら踊るための音楽だ。 伴奏は、いわゆるズンチャッチャの型を取る。左手が1拍目に低音を置き、2拍目と3拍目に和音を軽く重ねる。1拍目だけが重く、残りが浮く。この重心の偏りが</p>
<p>ワルツは、4分の3拍子で、男女が向かい合って組み、回転しながら踊るための音楽だ。

伴奏は、いわゆるズンチャッチャの型を取る。左手が1拍目に低音を置き、2拍目と3拍目に和音を軽く重ねる。1拍目だけが重く、残りが浮く。この重心の偏りが、踊り手を次の回転へ押し出す推進力になっている。

編成は、舞踏会用の管弦楽が中心だ。ただし地域によって編成は入れ替わり、アコーディオンや金管が主役になるものもある。

旋律は、8小節または16小節を1つの楽句（周期）とする対称的な作りが基本だ。曲全体は、序奏、複数のワルツ主題、締めのコーダ（締めくくりの部分）という組曲的な構成を取ることが多い。

テンポは、種類によって大きく異なる。ゆったり聴かせるスローワルツは、84から90 BPM程度。ウィンナ・ワルツは174から180 BPMと、倍近い速さで回る。

ウィーン風の演奏には、楽譜に書かれない癖がある。2拍目をわずかに早めに、3拍目を遅らせて弾くのだ。この揺れが独特の浮遊感を生む。機械的に均等な3拍子で演奏すると、途端に別物になる。作品によってはヘミオラが用いられる。

演奏会用に書かれたものでは、踊りやすさの制約が外れる。テンポや拍節が、自在に崩される。</p>
<h2>成り立ち</h2><p>起源には諸説ある。16世紀ヨーロッパのvolteなど、滑る舞踊にさかのぼる言及がある。1750年頃（1748年、上オーストリアの禁令に「walzen」が見える）には、バイエルン・チロル・シュタイアーマルクの庶民がWalzerを踊り始めた。前身としては、Ländler、Dreher・Weller・Spinner、Deutscherなどが挙げられる（ボヘミアでもLändlerが流行し、ワルツは1785年にボヘミアで禁令が出た）。フランス説は、「volta がドイツで Walzer に名を変えた」というものである。ただし、この説を退け、Ländler・Schleiferを本当の祖先とする見方もある。

ウィーンで流行したのは、1780年代頃だ。当時の宮廷舞踏は、メヌエットやコントルダンスなど、体を密着させない形式が主流だった。初期のワルツも、現在のクローズドホールド（体を密着させて組む形）ではなく、腕を組んだり半クローズだったりした。

非難は、体の近さと、長いドレスを持ち上げる所作に向けられた。宮廷や宗教界などで、各地の禁止・制限があった。例として、ウィーンやプロイセンの宮廷舞踏会がある。カリフォルニアでは、閉じた組み方を理由に伝道所の司祭がワルツを1834年まで禁じたとされる。

それでも、ワルツは広まった。19世紀初頭には、Zum Sperl（1807年9月29日開業）、Apollosaal（1807年建設、1808年1月10日開業）などの大舞踏場が開かれた。ワルツはウィーンで1780年代に流行した。ケリーによれば、1791年に英国に到達した。レイクスは、1813年の導入を大きな出来事と回想した。

1814年から翌年にかけてのウィーン会議は、その普及を後押しした一要因だ。ナポレオン戦争後の欧州秩序を決める会議は、舞踏会など多くの社交行事を伴った。リーニュ公は、「会議は大いに踊るが、前に進まない」と皮肉ったとされる。実際には、会議は取り決めに達した。会議の社交の場でワルツが注目され、普及の一因になったとされる。ただし、宮廷の公式舞踏会では、引き続き排除されていた。

1830年代のウィーンでは、ヨーゼフ・ランナーとヨハン・シュトラウス一世が人気を二分した。2人は友好的なライバルだった。型はランナーとシュトラウス一世が固め、二世がそれを芸術的頂点に導いた。

1866年晩秋から翌冬にかけて、『美しく青きドナウ』が作曲された。1867年2月15日にディアナ浴場ホールで、ウィーン男声合唱協会が合唱版を初演。新聞は『決定的なヒット』と評した。管弦楽版もパリ万国博覧会で大成功を収めた。この曲は、オーストリアの非公式な国歌（heimliche Hymne）の一つとされ、ウィーンの非公式な州歌とも見なされる。

ランナーやシュトラウス一世の活躍期と重なる1824〜1849年に、フレデリック・ショパンは、踊るためではないピアノ・ワルツを書き、ルバートを用いた。

20世紀に入ると、モーリス・ラヴェルが1920年に『ラ・ヴァルス』を発表した。優雅なウィーン舞踏会の情景が次第に歪み、崩壊していく音楽である。第一次世界大戦でハプスブルク帝国が消滅した直後の作品であり、失われた世界への追悼と読まれている。しかしラヴェル本人は、戦後ウィーンの状況とは関係がなく、シンボルとしての意味もないと述べている。音楽が表現するもの（音響の漸進的な高まり）だけを見るべきだ、という。

アメリカに渡ったワルツは、カントリー音楽に取り込まれた。1946年にピー・ウィー・キングらが書いた『テネシー・ワルツ』(1947年12月録音、1948年1月発売)は、1950年のパティ・ペイジ盤が数百万枚を売り上げた。メキシコやペルーでは、現地のスタイルと結びついたバルスとして独自に発展した。日本でも、戦後の歌謡曲に3拍子の型として定着した。</p>
