<h1>Waltz（ワルツ）とは</h1>
<p>四分の三拍子で、男女が向かい合って組み、回転しながら踊るための音楽である。伴奏は左手が一拍目に低音を置き、二拍目と三拍目に和音を軽く重ねる、いわゆるズンチャッチャの型を取る。この一拍目だけが重く残りが浮くという重心の偏りが、踊り手</p>
<p>四分の三拍子で、男女が向かい合って組み、回転しながら踊るための音楽である。伴奏は左手が一拍目に低音を置き、二拍目と三拍目に和音を軽く重ねる、いわゆるズンチャッチャの型を取る。この一拍目だけが重く残りが浮くという重心の偏りが、踊り手を次の回転へ押し出す推進力になっている。テンポは種類によって大きく異なり、ゆったり聴かせるスローワルツは一分間に84から90拍程度、ウィンナ・ワルツは一分間に174から180拍と倍近い速さで回る。ウィーン風の演奏には楽譜に書かれない癖があり、二拍目をわずかに早めに、三拍目を遅らせて弾く。この揺れが独特の浮遊感を生み、機械的に均等な三拍子で演奏すると途端に別物になる。旋律は八小節を単位とした対称的な作りが基本で、序奏、複数のワルツ主題、締めのコーダという組曲的な構成を取ることが多い。編成は舞踏会用の管弦楽が中心だが、地域によって編成は入れ替わり、アコーディオンや金管が主役になるものもある。三拍子を二拍のまとまりに聞かせるヘミオラを差し込んで拍の感覚を一時的に揺さぶる書法もよく使われる。演奏会用に書かれたものでは踊りやすさの制約が外れ、テンポや拍節が自在に崩される。</p>
<h2>成り立ち</h2><p>起源は十八世紀後半、南ドイツからオーストリアにかけての農村で踊られていたレントラーという三拍子の舞踊である。当時の宮廷舞踏は男女が離れて列を組む形式が主流であり、抱き合って密着したまま回り続けるレントラーの姿勢は不道徳だとして各地で禁令が出た。それでも十八世紀末のウィーンでは市民層に爆発的に広まり、大規模な舞踏場が次々に建てられた。決定的に国際化したのは1814年から翌年にかけてのウィーン会議で、ナポレオン戦争後の欧州秩序を決める各国代表が連日の舞踏会に明け暮れ、「会議は踊る、されど進まず」と揶揄された。この場でワルツを持ち帰った各国の使節により、宮廷の正式な舞踏として認知が広がる。1830年代のウィーンではヨーゼフ・ランナーとヨハン・シュトラウス一世が人気を二分し、楽団を率いて争った。決定的な様式を完成させたのは息子のヨハン・シュトラウス二世で、1867年の『美しく青きドナウ』は当初、合唱付きで初演されて評判を落としたものの、歌詞を外した管弦楽版がパリ万国博覧会で圧倒的な成功を収め、事実上のオーストリア第二の国歌となった。同じ頃フレデリック・ショパンは、踊るためではなく演奏会で聴くためのワルツを書き、拍節を自由に伸縮させる書法を持ち込んだ。二十世紀に入ると、モーリス・ラヴェルが1920年に発表した『ラ・ヴァルス』で、優雅なウィーン舞踏会の情景が次第に歪み、崩壊していく音楽を書いた。第一次世界大戦でハプスブルク帝国が消滅した直後の作品であり、失われた世界への追悼と読まれている。アメリカに渡ったワルツはカントリー音楽に取り込まれ、1948年にピー・ウィー・キングらが書いた『テネシー・ワルツ』は、1950年のパティ・ペイジ盤が数百万枚を売り上げた。メキシコやペルーでは現地の様式と結びついたバルスとして独自に発展し、日本でも戦後の歌謡曲に三拍子の型として定着した。</p>
