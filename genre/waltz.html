<h1>Waltz（ワルツ）とは</h1>
<p>4分の3拍子で、男女が向かい合って組み、回転しながら踊るための音楽である。伴奏は左手が1拍目に低音を置き、2拍目と3拍目に和音を軽く重ねる、いわゆるズンチャッチャの型を取る。この1拍目だけが重く残りが浮くという重心の偏りが、踊り手</p>
<p>4分の3拍子で、男女が向かい合って組み、回転しながら踊るための音楽である。伴奏は左手が1拍目に低音を置き、2拍目と3拍目に和音を軽く重ねる、いわゆるズンチャッチャの型を取る。この1拍目だけが重く残りが浮くという重心の偏りが、踊り手を次の回転へ押し出す推進力になっている。テンポは種類によって大きく異なり、ゆったり聴かせるスローワルツは一分間に84から90拍程度、ウィンナ・ワルツは一分間に174から180拍と倍近い速さで回る。ウィーン風の演奏には楽譜に書かれない癖があり、2拍目をわずかに早めに、3拍目を遅らせて弾く。この揺れが独特の浮遊感を生み、機械的に均等な3拍子で演奏すると途端に別物になる。旋律は8小節または16小節を1つの楽句（周期）とする対称的な作りが基本で、序奏、複数のワルツ主題、締めのコーダ（締めくくりの部分）という組曲的な構成を取ることが多い。編成は舞踏会用の管弦楽が中心だが、地域によって編成は入れ替わり。3拍子を2拍のまとまりに聞かせるヘミオラが、作品によっては用いられる。演奏会用に書かれたものでは踊りやすさの制約が外れ、テンポや拍節が自在に崩される。</p>
<h2>成り立ち</h2><p>起源には諸説ある。16世紀ヨーロッパのvolteなど滑る舞踊にさかのぼる言及があり、1748年に上オーストリアの禁令に「walzen」という語が見え、バイエルン・チロル・シュタイアーマルクの庶民がWalzerを踊り始めたのは1750年頃とされ、前身としてはLändler、Dreher・Weller・Spinner、Deutscherなどが挙げられる（ボヘミアでもLändlerが流行し、ワルツは1785年にボヘミアで禁令が出た）。フランス説ではvoltaがドイツでWalzerに名を変えたとされるが、Ländler/Schleiferを本当の祖先とする資料もある。ウィーンで流行したのは1780年代頃である。当時の宮廷舞踏は、メヌエットやコントルダンスなど、体を密着させない形式が主流であり、初期のワルツは現在のクローズドホールド（体を密着させて組む形）ではなく、腕を組んだり半クローズだったりした。非難は体の近さと、長いドレスを持ち上げる所作に向けられ、宮廷や宗教界などで各地の禁止・制限があった。例として、ウィーンやプロイセンの宮廷舞踏会、カリフォルニアの伝道所（司祭が1834年まで禁じたとされる）がある。それでもウィーンでは市民層に広まり、19世紀初頭にはZum Sperl（1807年9月29日開業）、Apollosaal（1807年建設、1808年1月10日開業）などの大舞踏場が開かれた。ワルツはウィーンで1780年代に流行し、歌手マイケル・ケリーによれば英国には1791年に到達し、日記作家トマス・レイクスは1813年の導入を大きな出来事と回想した。1814年から翌年にかけてのウィーン会議は、その普及を後押しした一要因で、ナポレオン戦争後の欧州秩序を決める会議は、舞踏会など多くの社交行事を伴い、リーニュ公は「会議は大いに踊るが、前に進まない」と皮肉ったとされる。実際には会議は取り決めに達した。会議の社交の場でワルツが注目され、普及の一因になったとされる。ただし宮廷の公式舞踏会では引き続き排除されていた。1830年代のウィーンではヨーゼフ・ランナーとヨハン・シュトラウス一世が人気を二分した、友好的なライバルだった。序奏、ワルツ連鎖、コーダという型を確立したのはランナーとシュトラウス一世で、息子のヨハン・シュトラウス二世はそれを芸術的な頂点に導いた。1866年晩秋から翌冬にかけて作曲された『美しく青きドナウ』は、1867年2月15日にディアナ浴場ホールで、ウィーン男声合唱協会が合唱版を初演し、新聞は「決定的なヒット」と評し、管弦楽版もパリ万国博覧会で大成功を収め、オーストリアの非公式な国歌（heimliche Hymne）の一つとされ、ウィーンの非公式な州歌とも見なされる。ランナーやシュトラウス一世の活躍期と重なる1824〜1849年に、フレデリック・ショパンは、踊るためではないピアノ・ワルツを書き、ルバート（拍節を自由に伸縮させる演奏）を用いた。20世紀に入ると、モーリス・ラヴェルが1920年に発表した『ラ・ヴァルス』で、優雅なウィーン舞踏会の情景が次第に歪み、崩壊していく音楽を書いた。第一次世界大戦でハプスブルク帝国が消滅した直後の作品であり、失われた世界への追悼と読まれているが、ラヴェル本人は、戦後ウィーンの状況とは関係がなく、象徴的な意味もなく、音楽が表現するもの（音響の漸進的な高まり）だけを見るべきだと述べている。アメリカに渡ったワルツはカントリー音楽に取り込まれ、1946年にピー・ウィー・キングらが書いた『テネシー・ワルツ』(1947年12月録音、1948年1月発売)は、1950年のパティ・ペイジ盤が数百万枚を売り上げた。メキシコやペルーでは現地の様式と結びついたバルスとして独自に発展し、日本でも戦後の歌謡曲に3拍子の型として定着した。</p>
<h2>代表曲</h2><ul><li>Waltz of the Flowers (Tchaikovsky)</li><li>The Blue Danube (Johann Strauss II)</li><li>Second Waltz (Shostakovich)</li><li>Waltz in D-flat major, Op. 64, No. 1 'Minute Waltz' (Chopin)</li><li>Waltz in C-sharp minor, Op. 64 No. 2 (Evgeny Kissin)</li><li>Emperor Waltz (Johann Strauss II)</li><li>Valse sentimentale (Josef Sakonov)</li><li>Voices of Spring (Johann Strauss II)</li><li>Roses from the South (Strauss II)</li><li>Waltz in A-flat Op. 69 No. 1 'Farewell' (Vladimir Ashkenazy)</li><li>Valse triste (Estonian Festival Orchestra)</li><li>Wiener Blut (Vienna Philharmonic)</li><li>Waltz of the Snowflakes (Warner Classics)</li><li>Tales from the Vienna Woods (Boston Pops Orchestra)</li><li>Sleeping Beauty Waltz (Moscow Philharmonic Orchestra)</li><li>Skater's Waltz (Orquestra Gulbenkian)</li><li>Gold and Silver Waltz (Royal Philharmonic Orchestra)</li></ul>
