<h1>Wobble Bass（ウォブルベース）とは</h1>
<p>ダブステップのうち、後年のクラブ向けの系統で前面に出た、ベース音そのものの「うねり」を曲の主役にしたスタイルだ。 代表的な作り方の一つは、鋸波や矩形波など倍音の豊かな合成音にローパスフィルターをかけ、そのカットオフ周波数をLFO（</p>
<p>ダブステップのうち、後年のクラブ向けの系統で前面に出た、ベース音そのものの「うねり」を曲の主役にしたスタイルだ。

代表的な作り方の一つは、鋸波や矩形波など倍音の豊かな合成音にローパスフィルターをかけ、そのカットオフ周波数をLFO（低周波発振器）で周期的に上下させることである。フィルターが開くと、音は明るく前に出る。閉じると、こもって沈む。そのため「ワウワウ」「ウォンウォン」と喋るような揺れが生まれる。

音を作るのに使われたのは、Native InstrumentsのMassive(2006年発売)や、後年のXfer RecordsのSerum(2014年発売)といったソフト音源だ。これらのプリセットが、世界中に同じ音色を広めたとされる。さらに歪み、ビットクラッシャー、フォルマント処理を重ねて、人の声の母音のような響きを与えることも多い。

ウォブル系の曲でも、リード、鍵盤リフ、ボーカルサンプルは使われる。

LFOの速度は、テンポに合わせて動かす。4分音符、8分音符、3連符、16分音符と切り替えることで、うねりの細かさそのものがリズムパターンになる。ここが最大の聴かせどころだ。BPMは140前後で、ハーフタイムの骨格を持つ。ただしドロップの後は、ベースの動きが主役になる曲が多い。

EDMフェスの巨大なスピーカーで、低音が体を叩く。その体験を前提に設計された音楽である。</p>
<h2>成り立ち</h2><p>うねるベースの技法は、ガラージやドラムンベースで以前から使われていた。それが、2000年代初頭に南ロンドンで始まったとされるダブステップのうち、後年のクラブ向けの系統で前面に出た。特定の人物が起源とされているわけではない。

その中で、Rusko（Christopher Mercer、リーズ生まれ）とCaspa（Gary McCann、西ロンドン出身）が、うねるベースをパーティー向けに前面に押し出し、大衆に広めた。その転換点とされるのが、2007年のFabricLive.37である。ロンドンのクラブfabricのミックスCDシリーズ第37巻で、2007年12月に発売された。この作品は、それまでのダブステップが持っていた瞑想的な静けさを捨て、ベースの揺れそのものを娯楽として示した点で決定的だったと評された。この路線は米国で広く受け入れられ、2011年に米国市場で大きく伸びた。

2010年前後、ロサンゼルスを拠点としたSkrillex（Sonny Moore、元From First to Lastのボーカリスト）は、EPのScary Monsters and Nice Sprites（2010年）で、うねるベースをさらに歪ませた。細かく切り刻み、金属的な叫びのような音に加工したのである。この音は、米国では「ブロステップ」と呼ばれた。この語は冗談として生まれ、遅くとも2009年には英国のシーンで使われていた。造語者はKozeeとされるが、時期には異説がある。

技術面では、ソフトシンセMassive（2006年発売）が、代表的な制作ツールの一つとして広く使われた。YouTubeにはプリセット配布と制作解説の動画が投稿され、音の作り方が公開情報として共有された。その結果、模倣者が増えたとされる。

しかし反面、同じプリセットが使われすぎて、音色が似通っていったと指摘された。2013年前後からは、EDMトラップなどへ流れが移った。

現在は、ダブステップやEDM全般で使われる定番の技法として定着している。その一方で、Riddimのようにウォブルを核にしたスタイルも生まれた。</p>
