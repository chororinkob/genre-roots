<h1>Wobble Bass（ウォブルベース）とは</h1>
<p>ダブステップから派生した、ベース音そのものの「うねり」を曲の主役に据えたスタイル。仕組みは明快で、鋸波や矩形波などの倍音の豊かな合成音にローパスフィルターをかけ、そのカットオフ周波数をLFO（低周波発振器）で周期的に上下させる。フ</p>
<p>ダブステップから派生した、ベース音そのものの「うねり」を曲の主役に据えたスタイル。仕組みは明快で、鋸波や矩形波などの倍音の豊かな合成音にローパスフィルターをかけ、そのカットオフ周波数をLFO（低周波発振器）で周期的に上下させる。フィルターが開くと音が明るく前に出て、閉じるとこもって沈むため、「ワウワウ」「ウォンウォン」と喋るような揺れが生まれる。LFOの速度をテンポに同期させ、4分音符、8分音符、3連符、16分音符と切り替えることで、うねりの細かさそのものがリズムパターンになるのが最大の聴かせどころ。BPMは140前後、ハーフタイムの骨格を持つが、ドロップ後は上物をほぼ捨て、ベースとドラムだけで押し切る。音を作るのに使われたのはNative InstrumentsのMassive、Xfer RecordsのSerum といったソフト音源で、これらのプリセットが世界中に同じ音色を広めた。さらに歪み、ビットクラッシャー、フォルマント処理を重ねて人の声のような子音感を与えることも多い。旋律も和声もほとんど機能せず、快感の源は周波数の動きと音量の変化だけという、極端に還元的な音楽である。EDMフェスの巨大なスピーカーで低音が体を叩く体験を前提に設計されている。</p>
<h2>成り立ち</h2><p>起源は2000年代半ばのロンドンのダブステップにあり、Rusko（Christopher Mercer）とCaspa（Gary McCann）が2007年前後にリーズおよびロンドンで作った、うねりを強調した派手な作風が最初の分岐点とされる。両者の2007年の共作盤FabricLive 37 は、それまでのダブステップが持っていた瞑想的な静けさを捨て、ベースの揺れそのものを娯楽として提示した点で決定的だった。この路線は本国では「賑やかで軽薄」として批判もされたが、米国に渡って爆発的に受け入れられる。2010年前後、ロサンゼルスを拠点としたSkrillex（Sonny Moore、元From First to Last のボーカリスト）が、EPのScary Monsters and Nice Sprites（2010年）で、うねるベースをさらに歪ませ、細かく切り刻み、金属的な叫びのような音に加工した。この音は米国では「ブロステップ」と呼ばれ、2011年から2013年にかけてUltra Music Festival やElectric Daisy Carnival といった大型フェスの主役となった。技術面では、ソフトシンセMassive（2007年発売）が普及したことが決定的で、フィルターとLFOを直感的に結び付けられる操作画面のおかげで、専門知識のない若い制作者が短期間で同種の音を作れるようになった。YouTubeにはプリセット配布と制作解説の動画が大量に投稿され、音の作り方が公開情報として共有された結果、爆発的に模倣者が増えた。反面、同じプリセットが濫用されたことで音色の同質化が進み、2014年頃には飽きられて主流の座をフューチャー・ベースやトラップ系に譲った。現在は一つの独立ジャンルというより、ダブステップやEDM全般で用いられる定番の技法として定着している。</p>
