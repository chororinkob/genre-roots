<h1>Contemporary Christian Music（クリスチャン・ロック）とは</h1>
<p>キリスト教の信仰を主題にした歌詞を、現代のポピュラー音楽の様式で歌うジャンルの総称である。英語圏ではCCMの略称で広く知られ、Christian popとも呼ばれる。スタイルの幅は非常に広く、アコースティック・ギターとピアノを中心</p>
<p>キリスト教の信仰を主題にした歌詞を、現代のポピュラー音楽の様式で歌うジャンルの総称である。英語圏ではCCMの略称で広く知られ、Christian popとも呼ばれる。スタイルの幅は非常に広く、アコースティック・ギターとピアノを中心にしたフォーク調のバラードから、ディストーションを効かせたエレキギターが轟くロック、四つ打ちのビートに乗るダンス・ポップ、ラップを織り交ぜたアーバンな曲まで一枚の幕の下に置かれる。メロディーは平易で記憶に残りやすく、Aメロで抑えてサビで音域と音量を一気に上げる構成が定番である。和声はメジャーキーが基本で、ポップスで好まれるI-V-vi-IV型のコード進行を用いることが多く、最後のサビを半音か全音上へ転調して高揚を狙う演出も頻出する。テンポは静かなバラードで毎分70拍前後、ポップロック調の曲では毎分120拍前後が中心だ。ボーカルはクリーンで伸びやかな発声が主流であり、装飾するように音を割って歌うゴスペル由来のテクニックを、ポップスの発声と混ぜて使う歌手が多い。歌詞の主題は神への賛美、救いへの感謝、試練の中での祈り、喪失と癒やしで、聖書の言葉を直接引かず「あなた」という呼びかけで神に語りかける書き方が特徴である。この点が、伝統的な賛美歌の神学用語を使う作法とはっきり違う。隣接するゴスペルが黒人教会の合唱と即興の叫びを核にするのに対し、こちらはスタジオ制作のレコードとラジオ放送を前提にしたバンド・サウンドである。曲は全米や各国のクリスチャン音楽チャート、Spotifyのプレイリスト、教会の礼拝、屋外フェスティバルで鳴らされている。</p>
<h2>成り立ち</h2><p>誕生の地は1960年代後半のアメリカ合衆国西海岸である。カウンターカルチャーの渦中で若者中心の宗教リバイバル、いわゆるイエス・ムーブメントが広がり、1969年から1970年頃には南カリフォルニアのコスタメサやハリウッド、サンフランシスコ、シカゴなどで、ヒッピー出身のストリート・ミュージシャンが回心してゆき、以前と同じフォークやフォークロックのスタイルにキリスト教のメッセージを載せて歌った。これがイエス・ミュージックの始まりで、回心を後押ししたのがコスタメサの教会カルバリー・チャペルの牧師チャック・スミスと伝道者ロニー・フリスビーであった。同教会は1971年、レーベルMaranatha! Musicを非営利の伝道活動として設立し、Love SongやChildren of the Day、Daniel Amosらの音源を世に出した。Love Songの1972年のデビューアルバムは、史上最高のクリスチャン音楽アルバムの一枚に数えられる評価を得ている。ロックに聖書の言葉を乗せること自体が激しい論争の的で、保守派の多くはロックを「悪魔の音楽」とみなした。テレビ伝道師ジミー・スワガートは1985年、著書『Religious Rock n Roll: A Wolf in Sheep's Clothing』でキリスト教ロックを羊の皮をかぶった狼と断罪した。一方、ラリー・ノーマンは「なぜ悪魔が良い音楽を独占していなければならないのか」と歌い、1969年のアルバム『Upon This Rock』は最初期の本格的なクリスチャン・ロック・アルバムとされるが、Capitol Recordsは商業的な失敗とみて契約を打ち切った。1972年6月、テキサス州ダラスの伝道集会Explo '72は最終日に10万人から20万人を集める屋外音楽祭となり、「クリスチャン・ウッドストック」と呼ばれてジャンルの産業化を後押しした。1970年代半ばには「contemporary Christian music」という呼び名が使われはじめ、1969年にゴスペル音楽協会がDove Awardを創設、1978年7月には業界誌CCM Magazineが創刊してシーンは業界として自立した。1980年代にはAmy Grantが『Age to Age』(1982年)でソロ歌手のクリスチャン・アルバムとして初のゴールド認定を獲得し、『Heart in Motion』(1991年)はシングル「Baby Baby」を全米シングルチャート1位に届かせた。だが俗界との越境は賛否を呼び、「俗っぽすぎる」という批判や、歌詞の世俗性をめぐる受賞資格論争(1998〜1999年)も起きた。重厚なバンドではペトラとレザレクション・バンドが初期CCMにハードロックを持ち込み、1980年代後半にはStryperの映像がMTVで流れた。1990年代以降はdc Talkの『Jesus Freak』(1995年)がグラミー賞を受賞し、Jars of Clayの「Flood」がクリスチャン系レーベル出身としては最大級のクロスオーバー・ヒットになった。のちにSkilletの「Monster」(2009年)は当時のクリスチャン音楽史上最大のデジタル・シングル売上を記録した。しかし2010年以降、中心は教会で実際に歌う賛美(ワーシップ)音楽へ移り、2010年から2020年の教会で使われる人気楽曲の上位25曲のライセンスは、ほぼすべてヒルソング・ワーシップ、ベテル・ミュージック、エレベーション・ワーシップという三大メガチャーチ系が占めた。</p>
<h2>代表曲</h2><ul><li>Monster (Skillet)</li><li>Jesus Freak (dc Talk)</li><li>Baby Baby (Amy Grant)</li><li>Flood (Jars of Clay)</li><li>I Can Only Imagine (MercyMe)</li><li>God Gave Rock and Roll to You (Petra)</li><li>You Say (Lauren Daigle)</li><li>Why Should the Devil Have All the Good Music? (Larry Norman)</li><li>Honestly (Stryper)</li><li>Shine (Newsboys)</li><li>Youth of the Nation (P.O.D.)</li><li>Place in This World (Michael W. Smith)</li><li>Friends (Michael W. Smith)</li><li>The Coloring Song (Petra)</li><li>El Shaddai (Amy Grant)</li><li>Calling on You (Stryper)</li><li>I Wish We'd All Been Ready (Larry Norman)</li><li>Little Country Church (Love Song)</li><li>Creed (Petra)</li><li>Hero (Skillet)</li><li>Father's Eyes (Amy Grant)</li><li>How Great Is Our God (Chris Tomlin)</li></ul>
