<h1>Contemporary Christian Music（クリスチャン・ロック）とは</h1>
<p>キリスト教の信仰を主題にした歌詞を、今のポピュラー音楽のスタイルで歌うジャンルの総称である。英語圏ではCCMの略称で広く知られ、Christian popとも呼ばれる。 スタイルの幅はとても広い。アコースティック・ギターとピアノを</p>
<p>キリスト教の信仰を主題にした歌詞を、今のポピュラー音楽のスタイルで歌うジャンルの総称である。英語圏ではCCMの略称で広く知られ、Christian popとも呼ばれる。

スタイルの幅はとても広い。アコースティック・ギターとピアノを中心にしたフォーク調のバラードもあれば、ディストーションを効かせたエレキギターが轟くロックもある。四つ打ちのビートに乗るダンス・ポップや、ラップを織り交ぜた都会的な曲まで、すべてがひとつの枠の中に収まる。

メロディーは分かりやすく、記憶に残りやすい。Aメロで抑え、サビで音域と音量を一気に上げる構成がよく見られる。和音はメジャーキー、つまり明るい長調が基本だ。ポップスで好まれるI-V-vi-IV型のコード進行を使う曲もよく見られる。最後のサビを半音か全音上へ転調し、気持ちの高まりを狙う演出もよく見られる。

テンポは、バラードが遅めで毎分50〜70拍台、ポップロックは中くらいから速めで、毎分100〜130拍台が多い。

歌声はクリーンで伸びやかな発声が主流だ。ゴスペル由来の、飾るように音を割って歌うテクニックを、ポップスの発声と混ぜて使う歌手もよく見られる。

歌詞の主題は、神への賛美、救いへの感謝、試練の中での祈り、喪失と癒やしである。とくにイエス・ミュージックでは、聖書の引用や宗教的な決まり文句よりも、物語やたとえを使って語る書き方が見られた。

隣のジャンルである黒人ゴスペルは、黒人教会の合唱と即興の叫びを中心にしている。これに対しこちらは、バンドやソロ歌手によるスタジオ録音と、ラジオ放送を通じて主に広まる。曲は、全米や各国のクリスチャン音楽チャート、Spotifyのプレイリスト、教会の礼拝、屋外フェスティバルで流れている。</p>
<h2>成り立ち</h2><p>1960年代後半、アメリカ合衆国の西海岸でこの音楽は生まれた。

当時はカウンターカルチャーの真っただ中だった。若者を中心にした宗教リバイバル、いわゆるイエス・ムーブメントが広がっていた。1969年から1970年頃、西海岸の南カリフォルニアのコスタメサやハリウッド、サンフランシスコを中心に、シカゴなど各地で、ヒッピー出身のストリート・ミュージシャンが次々に回心していった。彼らは以前と同じフォークやフォークロックのスタイルのまま、キリスト教のメッセージを載せて歌った。これがイエス・ミュージックの始まりである。回心を後押ししたのは、コスタメサの教会カルバリー・チャペルの牧師チャック・スミスと、伝道者ロニー・フリスビーだった。

同教会は1971年、レーベルMaranatha! Musicを、利益を目的としない伝道活動として設立した。そこからLove SongやChildren of the Day、Daniel Amosらの音源が世に出た。Love Songの1972年のデビューアルバムは、CCM Magazine選出の『25 Best Contemporary Christian Albums』に入っている。

しかし、ロックに聖書の言葉を乗せること自体が、激しい論争の的になった。一部の保守派は、ロックを「悪魔の音楽」とみなした。テレビ伝道師ジミー・スワガートは1987年、著書『Religious Rock n Roll: A Wolf in Sheep's Clothing』で、キリスト教ロックを羊の皮をかぶった狼だと強く非難した。

一方、ラリー・ノーマンは、1972年のアルバム『Only Visiting This Planet』に収めた曲「Why Should the Devil Have All the Good Music」で、「なぜ悪魔が良い音楽を独占していなければならないのか」と歌った。1969年に録音されたアルバム『Upon This Rock』は、最初期の本格的なクリスチャン・ロック・アルバムとされる。発売は1969年末または1970年とする資料もある。だがCapitol Recordsは商業的な失敗とみて、契約を打ち切った。

1972年6月、テキサス州ダラスの伝道集会Explo '72は、最終日に推定10万人から20万人を集める屋外音楽祭となった。「クリスチャン・ウッドストック」と呼ばれ、ジャンルの産業化を後押しした。1969年には、ゴスペル音楽協会がDove Awardを作っていた。1970年代半ばには「contemporary Christian music」という呼び名が使われはじめた。1978年7月には業界誌CCM Magazineが創刊し、この音楽の世界は業界として自立した。

1980年代、Amy Grantの1982年のアルバム『Age to Age』は、翌1983年にソロ歌手のクリスチャン・アルバムとして初のゴールド認定を受けた。『Heart in Motion』(1991年)では、シングル「Baby Baby」が全米シングルチャート1位に届いた。だが、世俗の世界との行き来は賛否を呼んだ。「俗っぽすぎる」という批判が出て、歌詞の世俗性をめぐる受賞資格の論争(1998〜1999年)も起きた。

重厚なバンドでは、レザレクション・バンドがblues-rockとhard rockを融合させた。ペトラも1970年代後半以降、ハードな音へ移った。1980年代後半には、Stryperの映像がMTVで流れた。

1990年代以降、dc Talkの『Jesus Freak』(1995年)が1997年のグラミー賞を受賞した。Jars of Clayの「Flood」は、クリスチャン系レーベル出身としては最大級の、他の分野でも売れるヒット（クロスオーバー・ヒット）になった。のちに、Skilletの2009年発売の「Monster」は、2016年にRIAA 2xプラチナ認定を受けた。売上とストリーミングの合計で、クリスチャン音楽史上最大のデジタル・シングルと認定されたのである。

しかし2010年以降、中心は教会で実際に歌う賛美(ワーシップ)音楽へ移った。2010年から2020年の、教会での使用報告と楽曲購入のランキング（CCLIとPraiseCharts）で上位25曲に入った賛美曲の大半は、ベテル・ミュージック、ヒルソング・ワーシップ、エレベーション・ワーシップ、Passionという4つの大教会系の団体と、共作や普及を通じて直接つながっている。</p>
