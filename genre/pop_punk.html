<h1>Pop Punk（ポップパンク）とは</h1>
<p>ポップ・パンクは、パンクの速度と簡素さに、明快な旋律と多声のコーラスを結合させたスタイルだ。速いテンポと、ポップな曲作り・ハーモニーを組み合わせた点が、特徴とされる。 編成は、ギター1本または2本、ベース、ドラムという最小構成が基</p>
<p>ポップ・パンクは、パンクの速度と簡素さに、明快な旋律と多声のコーラスを結合させたスタイルだ。速いテンポと、ポップな曲作り・ハーモニーを組み合わせた点が、特徴とされる。

編成は、ギター1本または2本、ベース、ドラムという最小構成が基本だ。ギターは、歪んだパワー・コード（ルートと5度だけの和音）やバレー・コード中心の、簡素な演奏が多い。

和声（コードの響き）は、長調の三和音（基本の3音の和音）が中心だ。I–V–vi–IVなどがよく使われる。旋律は口ずさめる範囲に収まる。コーラスでは、ハーモニーを重ねることが多い。

テンポは速い。ドラムは、多くの場合、8分音符を刻むハイハットの上で、2拍目と4拍目のスネアを強打する。しばしばバスドラムを連打して、疾走感を煽る。

曲は、パンク同様、短めの傾向がある。

歌詞は、青春期の恋愛・郊外生活・反抗などが中心だ。ユーモアを含むことも多い。</p>
<h2>成り立ち</h2><p>音楽的な原型の一つは、1976年のRamonesにある。彼らは、1950〜60年代のポップス、バブルガム、ガール・グループ（Ronettes、Shangri-Lasなど）の旋律と構造を、極端に速く単純な演奏に乗せ替えた。1978年のThe Undertonesや、1979年に編集盤『Singles Going Steady』を出したBuzzcocksも、旋律的なパンクの重要な先駆である。

1970年代後半に、Ramones、Undertones、Buzzcocksなどが土台を築いたとされる。旋律を重んじる米国の系統は、1980年代のDescendentsが出した1982年盤『Milo Goes to College』がひな型になったとされる。

商業的に大衆化したのは、1990年代の米国カリフォルニア州だ。バークレーの共同運営のライブ会場924 Gilman Streetが中心的な場となり、Green DayとRancidがここから育った。Green Dayは1993年に、独立系レーベルLookout! Recordsから、大手のRepriseへ移籍した。そして1994年2月にアルバムDookieを発表し、全世界で2000万枚超（米国でRIAAダブル・ダイヤモンド認定）の売上を記録した。一方で彼らは、Reprise移籍（1993年4月）を理由に、1993年9月に出入り禁止となった。禁止は2015年に解除された。

同じころ、南カリフォルニアのThe Offspringが、1994年のSmashで、独立系レーベルEpitaphから、史上最多の売上を達成した。現在も独立系レーベル発売作品として最多で、全世界で1,100万枚超だ。同レーベルはBad ReligionのBrett Gurewitzが1980年に創設し、現在も運営している。

1990年代後半には、blink-182が、下品な冗談と親しみやすい旋律により、1999年のEnema of the Stateで最大級の商業的成功を収めた。2000年代前半にはSum 41、Good Charlotteが人気を集めた。2000年代半ばには、より情緒的な系統としてFall Out BoyやMy Chemical Romanceが注目を集め、エモとの境界が曖昧になった。1995年に始まったWarped Tourという移動型のフェスが、この時期のシーンの中核をなした。

批判としては、セルアウトと批判された。また、2015年以降、Warped Tourに関わるエモ／ポップ・パンクのシーンで、未成年への性的不品行の告発が相次いだ。</p>
