<h1>Pop Punk（ポップパンク）とは</h1>
<p>パンクの速度と簡素さに、明快な旋律と多声のコーラスを結合させた様式。BPMは160〜200と速く、ドラムは8分音符を刻むハイハットの上で二拍目と四拍目のスネアを強打し、しばしばバスドラムの連打で疾走感を煽る。ギターは歪ませたパワー</p>
<p>パンクの速度と簡素さに、明快な旋律と多声のコーラスを結合させた様式。BPMは160〜200と速く、ドラムは8分音符を刻むハイハットの上で二拍目と四拍目のスネアを強打し、しばしばバスドラムの連打で疾走感を煽る。ギターは歪ませたパワー・コードのダウンストロークで、複雑な奏法は用いない。編成はギター一本または二本、ベース、ドラムという最小構成が基本。和声は長調の三和音が中心で、I–V–vi–IVという極めて明るい循環進行が最も多く用いられる。この、パンクの攻撃性と長調の明るさという組み合わせが最大の特徴である。旋律は口ずさめる範囲に収まり、コーラスでは三度と五度で重ねた声が加わって厚みを作る。曲は二分から三分と短く、イントロ、ヴァース、コーラス、ブリッジという型が守られる。歌唱は鼻にかかった声、いわゆるノーズ・ボイスが定番で、これは意図的に幼く未熟に聴こえるよう選ばれている。歌詞は郊外の退屈、学校生活、片思い、親との衝突、そして友人関係を扱い、政治的な主張より個人的で日常的な悩みが中心となる。</p>
<h2>成り立ち</h2><p>音楽的な原型は1976年のRamonesにある。彼らは1950年代のポップスの旋律とガール・グループの構造を、極端に速く単純な演奏に乗せ替えた。1978年のThe Undertonesや、1979年のBuzzcocksも、旋律的なパンクの重要な先駆である。ジャンルとして商業的に確立したのは1990年代の米国カリフォルニア州である。バークレーの共同運営のライブ会場924 Gilman Streetが中心的な場となり、Green DayとRancidがここから育った。Green Dayは1994年、独立系レーベルLookout! Recordsから大手へ移籍してアルバムDookieを発表し、2000万枚を超える売上を記録した。この商業的成功は、Gilman Streetの共同体からは裏切りと見なされ、彼らは長く出入りを禁じられた。同時期、南カリフォルニアのThe Offspringが1994年のSmashで、独立系レーベルEpitaphから当時としては史上最多の売上を達成した。同レーベルはBad ReligionのBrett Gurewitzが運営していた。1990年代後半にはblink-182が、下品な冗談と親しみやすい旋律により、1999年のEnema of the Stateで最大の商業的成功を収めた。2000年代前半には、Sum 41、Good Charlotte、そしてより情緒的な系統としてFall Out BoyやMy Chemical Romanceが台頭し、エモとの境界が曖昧になった。2004年に始まったWarped Tourという移動型のフェスが、この時期のシーンの中核をなした。批判としては、パンクの政治性を抜き取って商品化したという指摘が当初から根強く、また2010年代後半には、シーン内部での未成年に対する性的搾取が多数告発され、深刻な問題として議論されている。</p>
