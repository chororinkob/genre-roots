<h1>Pop Punk（ポップパンク）とは</h1>
<p>パンクの速度と簡素さに、明快な旋律と多声のコーラスを結合させた様式。テンポは速く、ドラムは8分音符を刻むハイハットの上で2拍目と4拍目のスネアを強打し、しばしばバスドラムの連打で疾走感を煽る。ギターは歪ませたパワー・コード（ルート</p>
<p>パンクの速度と簡素さに、明快な旋律と多声のコーラスを結合させた様式。テンポは速く、ドラムは8分音符を刻むハイハットの上で2拍目と4拍目のスネアを強打し、しばしばバスドラムの連打で疾走感を煽る。ギターは歪ませたパワー・コード（ルートと5度だけの和音）のダウンストローク（ピックを下へ振り下ろす弾き方）で、複雑な奏法は用いない。編成はギター1本または2本、ベース、ドラムという最小構成が基本。和声（コードの響き）は長調の三和音（基本の3音の和音）が中心で、I–V–vi–IVという明るい循環進行が用いられる。この、パンクの攻撃性と長調の明るさという組み合わせが最大の特徴である。旋律は口ずさめる範囲に収まり、コーラスでは三度と5度で重ねた声が加わって厚みを作る。曲は二分から三分と短く、イントロ、ヴァース、コーラス、ブリッジという型が守られる。歌詞は郊外の退屈、学校生活、片思い、親との衝突、そして友人関係を扱い、政治的な主張より個人的で日常的な悩みが中心となる。</p>
<h2>成り立ち</h2><p>音楽的な原型の一つは1976年のRamonesにある。彼らは1950〜60年代のポップス、バブルガム、ガール・グループ（Ronettes、Shangri-Lasなど）の旋律と構造を、極端に速く単純な演奏に乗せ替えた。1978年のThe Undertonesや、1979年に編集盤『Singles Going Steady』を出したBuzzcocksも、旋律的なパンクの重要な先駆である。ジャンルの起源は1970年代後半（Ramones、Undertones、Buzzcocks）で、旋律を重んじる米国の系統は1980年代のDescendentsの1982年盤などがひな型になった。商業的に大衆化したのは1990年代の米国カリフォルニア州である。バークレーの共同運営のライブ会場924 Gilman Streetが中心的な場となり、Green DayとRancidがここから育った。Green Dayは1993年に独立系レーベルLookout! Recordsから大手のRepriseへ移籍し、1994年2月にアルバムDookieを発表し、2000万枚を超える売上を記録した。この商業的成功は、Gilman Streetの共同体からは裏切りと見なされ、彼らは長く出入りを禁じられた。同時期、南カリフォルニアのThe Offspringが1994年のSmashで、独立系レーベルEpitaphから当時としては史上最多の売上を達成した。同レーベルはBad ReligionのBrett Gurewitzが1980年に創設し、現在も運営している。1990年代後半にはblink-182が、下品な冗談と親しみやすい旋律により、1999年のEnema of the Stateで最大の商業的成功を収めた。2000年代前半にはSum 41、Good Charlotteが、2000年代半ばにはより情緒的な系統としてFall Out BoyやMy Chemical Romanceが台頭し、エモとの境界が曖昧になった。1995年に始まったWarped Tourという移動型のフェスが、この時期のシーンの中核をなした。批判としては、パンクの政治性を抜き取って商品化したという指摘が当初から根強く、また2010年代半ば以降には、シーン内部での未成年に対する性的搾取が多数告発され、深刻な問題として議論されている。</p>
