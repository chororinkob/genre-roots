<h1>Pop Punk（ポップパンク）とは</h1>
<p>パンクの速度と簡素さに、明快な旋律と多声のコーラスを結合させた様式。テンポは速く、ドラムは多くの場合、8分音符を刻むハイハットの上で2拍目と4拍目のスネアを強打し、しばしばバスドラムの連打で疾走感を煽る。ギターは歪んだパワー・コー</p>
<p>パンクの速度と簡素さに、明快な旋律と多声のコーラスを結合させた様式。テンポは速く、ドラムは多くの場合、8分音符を刻むハイハットの上で2拍目と4拍目のスネアを強打し、しばしばバスドラムの連打で疾走感を煽る。ギターは歪んだパワー・コード（ルートと5度だけの和音）やバレー・コード中心の簡素な演奏が多い。編成はギター1本または2本、ベース、ドラムという最小構成が基本。和声（コードの響き）は長調の三和音（基本の3音の和音）が中心で、I–V–vi–IVなどがよく使われる。この、速いテンポと、ポップな曲作り・ハーモニーを組み合わせた点が特徴とされる。旋律は口ずさめる範囲に収まり、ハーモニーを重ねるコーラスが多い。パンク同様、曲は短めの傾向がある。歌詞は青春期の恋愛、郊外生活、反抗などが中心で、ユーモアを含むことも多い。</p>
<h2>成り立ち</h2><p>音楽的な原型の一つは1976年のRamonesにある。彼らは1950〜60年代のポップス、バブルガム、ガール・グループ（Ronettes、Shangri-Lasなど）の旋律と構造を、極端に速く単純な演奏に乗せ替えた。1978年のThe Undertonesや、1979年に編集盤『Singles Going Steady』を出したBuzzcocksも、旋律的なパンクの重要な先駆である。ジャンルは、1970年代後半にRamones、Undertones、Buzzcocksなどが土台を築いたとされ、旋律を重んじる米国の系統は1982年のDescendentsのMilo Goes to Collegeがひな型になったとされる。商業的に大衆化したのは1990年代の米国カリフォルニア州である。バークレーの共同運営のライブ会場924 Gilman Streetが中心的な場となり、Green DayとRancidがここから育った。Green Dayは1993年に独立系レーベルLookout! Recordsから大手のRepriseへ移籍し、1994年2月にアルバムDookieを発表し、全世界で2000万枚超の売上を記録した（米国でRIAAダブル・ダイヤモンド認定）。このReprise移籍は、Gilman Streetの共同体からは裏切りと見なされ、彼らは1993年9月に出入りを禁じられた。禁止は2015年に解除された。同時期、南カリフォルニアのThe Offspringが1994年のSmashで、独立系レーベルEpitaphから発売され、現在も独立系レーベル作品として史上最多の売上（全世界で1100万枚超）を記録している。同レーベルはBad ReligionのBrett Gurewitzが1980年に創設し、現在も運営している。1990年代後半にはblink-182が、下品な冗談と親しみやすい旋律により、1999年のEnema of the Stateで最大級の商業的成功を収めた。2000年代前半にはSum 41、Good Charlotteが、2000年代半ばにはより情緒的な系統としてFall Out BoyやMy Chemical Romanceが台頭し、エモとの境界が曖昧になった。1995年に始まったWarped Tourという移動型のフェスが、この時期のシーンの中核をなした。批判としては、「セルアウト」「ソフトすぎる」「本物のパンクではない」という批判が根強く、また2015年以降、Warped Tourに関わるエモ／ポップ・パンクのシーンで、未成年への性的不品行の告発が相次ぎ、深刻な問題として議論されている。</p>
