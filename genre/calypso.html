<h1>Calypso（カリプソ）とは</h1>
<p>トリニダード・トバゴで発展した、歌詞の風刺と言葉遊びを中心とする音楽。編成は管楽器を主体とし、トランペット、トロンボーン、サックスによるホーンセクションに、ギター、ベース、ピアノ、そしてコンガやカウベルなどの打楽器が加わる。時にス</p>
<p>トリニダード・トバゴで発展した、歌詞の風刺と言葉遊びを中心とする音楽。編成は管楽器を主体とし、トランペット、トロンボーン、サックスによるホーンセクションに、ギター、ベース、ピアノ、そしてコンガやカウベルなどの打楽器が加わる。時にスティールパン、すなわちドラム缶の底を叩き出して音階を作った打楽器が旋律を担う。拍子は四分の四または二分の二で、BPMは110〜140。リズムの核となるのは、二小節にまたがる非対称のパターンで、一拍目を強く踏んだ後、裏拍にアクセントが移動していく揺れを持つ。ギターとピアノは裏拍を短く刻み、ベースは一拍目と三拍目の裏に音を置いて宙に浮く推進力を作る。和声は長調の三和音や四和音が中心で、明るく開放的な響きを持つ。しかし音楽の本体は歌詞にあり、政治家の汚職、社会の矛盾、隣人の噂話、性的な暗示を、二重の意味を持つ言い回しで巧みに包んで語る。この、直接言えないことを比喩と洒落で言うという技法こそが、カリプソの本質である。歌唱は語りに近く、韻とリズムの巧みさで聴かせる。</p>
<h2>成り立ち</h2><p>起源は18世紀から19世紀のトリニダード島にある。フランス系の農園主が連れてきた奴隷たちは、互いに異なる言語を話し、また農園主の前で自由に話すことを禁じられていた。彼らはフランス系クレオール語で歌を作り、その中で農園主を風刺した。この語りの歌はカイソと呼ばれ、集団の中でシャントウェルと呼ばれる歌い手が即興で歌った。1834年の奴隷制廃止後、解放された人々は謝肉祭カーニヴァルの主役となり、この歌が祭の中心的な表現となった。植民地政府はこれを繰り返し規制し、1884年には太鼓の使用を禁じた。これに対し人々は竹を打ち鳴らすタンブー・バンブーで応じ、それも禁じられると、廃棄されたドラム缶を加工してスティールパンを生み出した。20世紀に入ると、歌はカリプソと呼ばれるようになり、歌手はロード・キチナー、マイティ・スパロウのように貴族や強さを示す称号を名乗った。1930年代から1950年代が黄金期で、毎年の謝肉祭に向けて新曲が作られ、カリプソ・テントと呼ばれる仮設の小屋で競演が行われた。歌詞は常に検閲との緊張関係にあり、1930年代には植民地政府が事前検閲を制度化している。国際的な広まりの契機は1956年、米国のHarry Belafonteが発表したアルバムCalypsoで、これは史上初めて100万枚を売り上げたLPとなった。ただし彼はニューヨーク生まれのジャマイカ系であり、本場からは商業的に薄めた版だという批判もあった。1970年代以降、より速く踊ることに特化したソカが分岐し、カリプソ自体は歌詞の芸術として位置づけが変化した。現在も謝肉祭のカリプソ・モナークという競演が続き、社会批評の伝統が保たれている。</p>
<h2>代表曲</h2><ul><li>Day-O (Banana Boat Song)（Harry Belafonte）</li><li>Rum and Coca-Cola（Lord Invader）</li><li>Jean and Dinah（Mighty Sparrow）</li><li>Pan in A Minor（Lord Kitchener）</li><li>Hot Hot Hot（Arrow）</li></ul>
