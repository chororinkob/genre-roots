<h1>Calypso（カリプソ）とは</h1>
<p>トリニダード・トバゴで発展した、歌詞の風刺と言葉遊びを中心とする音楽。編成は時代によって異なる。初期はシャントウェルの即興歌に太鼓が付き、のちにタンブー・バンブーや弦楽器が加わり（1912年のLovey's String Band</p>
<p>トリニダード・トバゴで発展した、歌詞の風刺と言葉遊びを中心とする音楽。編成は時代によって異なる。初期はシャントウェルの即興歌に太鼓が付き、のちにタンブー・バンブーや弦楽器が加わり（1912年のLovey's String Bandが、カリプソと識別できる最初期の録音とされる）、20世紀にはトランペット、トロンボーン、サックスによるホーンセクションも加わり、ギター、ベース、ピアノ、そして打楽器が支える形が広まった。時にスティールパン、すなわちドラム缶の底を叩き出して音階を作った打楽器が旋律を担う。拍子は2/4または4/4で、シンコペーション（拍をずらす乗り）があり、コード（和音）を裏拍で刻む。8分音符8つを3+3+2に区切る1小節のパターンが、カリプソの典型的なリズムとされる（学術的な裏づけは弱い）。和声は長調の単純な和音（I・IV・Vなど）が多いとされるが、伝統的なカリプソには短調も多い。しかし音楽の本体は歌詞にあり、政治家の汚職、社会の矛盾、隣人の噂話、性的な暗示を、二重の意味を持つ言い回しで巧みに包んで語る。この、直接言えないことを比喩と洒落で言うという技法は、カリプソの主要な特徴の一つである。歌は旋律に乗せて歌われ、韻とリズムの巧みさで聴かせる。</p>
<h2>成り立ち</h2><p>起源は19世紀前半から中頃のトリニダード島にあるとする資料が多い（17〜18世紀にさかのぼる説もある）。フランス系の農園主が連れてきた奴隷たちは、互いに異なる言語を話し、また互いに話すことを禁じられたという話が広く流布している。彼らはフランス系クレオール語で歌を作り、その中で農園主を風刺した。起源は諸説あり、都市の下層民（自由になった人々）のカーニヴァル文化が重要だったという見方があり、その形成時期は1860年頃のポートオブスペインとされる。この語りの歌はカイソと呼ばれ、集団の中でシャントウェルと呼ばれる歌い手が即興で歌った。奴隷制廃止法は1833年に成立し、1834年8月1日に施行されたが徒弟制が続き、トリニダードで完全解放となったのは1838年8月1日で、解放された人々は謝肉祭カーニヴァルの主役となり、この歌が祭の中心的な表現となった。植民地政府はカーニヴァルを繰り返し規制し、1883年（1884年とする資料もある）には太鼓の使用を禁じた。これに対し人々は竹を打ち鳴らすタンブー・バンブーで応じ、それも禁じられると、1930年代半ばに金属打楽器（ブレーキハブ、ビスケット缶など）が使われ、1937年にフライパン・ごみ箱の蓋・ドラム缶の管弦楽団が現れた。スティールパンは1939年ごろに作られ、1940年のカーニヴァルで初めて公に登場したとされる（発明者には諸説あり、起源の逸話には疑わしいものもある）。55ガロンのドラム缶が使われたのは1946〜47年ごろである。20世紀に入ると、歌はカリプソと呼ばれるようになり、歌手はロード・キチナー、マイティ・スパロウのように貴族や強さを示す称号を名乗った。1930年代（資料により1920年代末から1940年代）を黄金期とする見方が多く（1950年代のキチナーやスパロウの時代を黄金期とする資料もある）、毎年の謝肉祭に向けて新曲が作られ、カリプソ・テントと呼ばれる仮設の小屋で競演が行われた。歌詞は検閲との緊張関係にあり、1930年代には植民地政府が事前検閲を制度化している。海外での広まりは1956年より前に始まっており、1934年にAttila the HunとRoaring Lionがニューヨークで録音し、1940年代にはLord Invaderが作詞した「Rum and Coca-Cola」（作曲はLionel Belasco）をAndrews Sistersがカバーして米国でヒットした。1956年は米国での「カリプソ・ブーム」を決定づけた年で、その中心となったのは米国のHarry Belafonteが発表したアルバムCalypsoで、これは単独アーティストによるLPとして初めて100万枚を売り上げたとされる。ただし彼はニューヨーク生まれのジャマイカ系であり、収録曲は全11曲で、8曲がIrving Burgie（ブルックリン生まれ、母はバルバドス出身）名義の西インド諸島風の曲であり、その多くはWilliam Attawayとの共作である。この8曲には、ジャマイカの伝承曲を編曲した「Day-O」と、メントの旋律をもとにした「Jamaica Farewell」も含まれる。ほかに「Brown Skin Girl」と「Man Smart (Woman Smarter)」はトリニダードのカリプソ歌手Norman Span（芸名King Radio）の作で、「Man Smart (Woman Smarter)」は本人が1936年に先に録音している。残る1曲は「Will His Love Be Like His Rum?」である。1970年代にLord Shortyらがカリプソにインド系のリズムやソウル、ファンクを融合してソカを生み出し、カリプソ自体は歌詞の芸術として位置づけが変化した。現在も謝肉祭のカリプソ・モナークという競演が続き、社会批評の伝統が保たれている。</p>
<h2>代表曲</h2><ul><li>Day-O (Banana Boat Song)（Harry Belafonte）</li><li>Day-O (The Banana Boat Song) (Harry Belafonte)</li><li>Hot Hot Hot（Arrow）</li><li>Jump in the Line (Harry Belafonte)</li><li>Pan in A Minor（Lord Kitchener）</li><li>Come Back Liza (Harry Belafonte)</li><li>Jean and Dinah（Mighty Sparrow）</li><li>Jamaica Farewell (Harry Belafonte)</li><li>Coconut Woman (Harry Belafonte)</li><li>Sugar Bum Bum (Lord Kitchener)</li><li>Rum and Coca-Cola（Lord Invader）</li><li>Island in the Sun (Harry Belafonte)</li><li>Matilda (Harry Belafonte)</li><li>Brown Skin Girl (Harry Belafonte)</li><li>Congo Man (Mighty Sparrow)</li><li>Dan Is the Man (in the Van) (Mighty Sparrow)</li><li>Bebop Calypso (Lord Kitchener)</li></ul>
