<h1>Calypso（カリプソ）とは</h1>
<p>カリプソは、トリニダード・トバゴで発展した、歌詞の風刺と言葉遊びを中心とする音楽だ。 編成は時代によって異なる。初期はシャントウェルの即興歌に太鼓、のちにタンブー・バンブーや弦楽器が付いた。1912年のLovey's String</p>
<p>カリプソは、トリニダード・トバゴで発展した、歌詞の風刺と言葉遊びを中心とする音楽だ。

編成は時代によって異なる。初期はシャントウェルの即興歌に太鼓、のちにタンブー・バンブーや弦楽器が付いた。1912年のLovey's String Bandは、カリプソと識別できる最初期の録音（器楽）とされる。のちにトランペット、トロンボーン、サックスによるホーンセクションが加わり、ギター、ベース、ピアノ、そして打楽器が支える形が広まった。時にスティールパン、すなわちドラム缶の底を叩き出して音階を作った打楽器が、旋律を担う。

和声は、長調の単純な和声（I・IV・Vなど）が多いとされる。ただし、伝統的なカリプソには短調も多い。

拍子は2/4または4/4で、シンコペーション（拍をずらす乗り）があり、コード（和音）を裏拍で刻む。カリプソの典型的なリズムは、8分音符8つを3+3+2に区切る1小節のパターンとされる（学術的な裏づけは弱い）。

音楽の本体は歌詞にある。政治家の汚職、社会の矛盾、隣人の噂話、性的な暗示を、二重の意味を持つ言い回しで巧みに包んで語る。風刺と二重の意味は主要な特徴の一つである。歌は旋律に乗せて歌う。</p>
<h2>成り立ち</h2><p>カリプソは、トリニダード島で生まれた。19世紀前半〜中頃に成立とする資料が多い（17〜18世紀に遡る説もある）。

フランス系の農園主が連れてきた奴隷たちは、互いに異なる言語を話し、また互いに話すことを禁じられたという話が広く流布している。彼らはフランス系クレオール語で歌を作り、その中で農園主を風刺した。一方、起源は諸説ある。都市の下層民（自由になった人々）のカーニヴァル文化が重要だったという見方がある。その形成時期は、1860年頃のポートオブスペインとされる。

この語りの歌はカイソと呼ばれ、集団の中でシャントウェルと呼ばれる歌い手が即興で歌った。奴隷制廃止法は1833年に成立し、1834年8月1日に施行された。ただ、徒弟制が続き、トリニダードで完全解放となったのは1838年8月1日だった。解放された人々は謝肉祭カーニヴァルの主役となり、この歌が祭の中心的な表現となった。

植民地政府はカーニヴァルを繰り返し規制し、1883年（1884年とする資料もある）には太鼓の使用を禁じた。これに対し人々は、竹を打ち鳴らすタンブー・バンブーで応じた。それも禁じられると、1930年代半ばに金属打楽器（ブレーキハブ、ビスケット缶など）が使われた。1937年には、フライパン・ごみ箱の蓋・ドラム缶の管弦楽団が現れた。

スティールパンは1939年頃に作られ、1940年に初登場したとされる（発明者には諸説）。55ガロン缶の使用は1946〜47年頃である（起源の逸話には疑わしいものもある）。

1900年頃（Errol Hill）に、歌はカリプソと呼ばれるようになった。歌手は、ロード・キチナー、マイティ・スパロウのように、貴族や強さを示す称号を名乗った。1930年代（資料により1920年代末〜1940年代）を黄金期とする見方が多い。ただし、1950年代のキチナーやスパロウの時代を黄金期とする資料もある。毎年の謝肉祭に向けて新曲が作られ、カリプソ・テントと呼ばれる仮設の小屋で競演が行われた。歌詞は検閲との緊張関係にあることが多く、1930年代には植民地政府が事前検閲を制度化している。

海外での広まりは、1956年より前に始まっていた。1934年にAttila the HunとRoaring Lionがニューヨークで録音した。1940年代には、作曲はLionel Belasco、作詞はLord Invaderの「Rum and Coca-Cola」をAndrews Sistersがカバーして、米国でヒットした。

1956年は、米国での「カリプソ・ブーム」を決定づけた年だった。その中心となったのは、米国のHarry Belafonteが発表したアルバムCalypsoだ。これは単独アーティストによるLPとして初めて100万枚を売り上げたとされる。ただし彼はニューヨーク生まれのジャマイカ系である。収録曲は全11曲で、そのうちIrving Burgie（ブルックリン生まれ、母はバルバドス出身）名義が8曲（「Day-O」＝伝承曲のアレンジと、「Jamaica Farewell」＝メント風を含み、William Attawayとの共作が多い）ある。Attaway／Belafonte作の「Will His Love Be Like His Rum?」が1曲。そして「Brown Skin Girl」と「Man Smart (Woman Smarter)」はNorman Span作の2曲である。「Man Smart (Woman Smarter)」はトリニダードのカリプソニアンNorman Span（芸名King Radio）の作で、本人が1936年に先に録音している。

1970年代以降、Lord Shortyらがカリプソにインド系リズムやソウル／ファンクを融合して生んだソカが分岐した。のちに高速のパワー・ソカなどが派生し、カリプソ自体は歌詞の芸術として位置づけが変化した。現在も謝肉祭のカリプソ・モナークという競演が続き、社会批評の伝統が保たれている。</p>
