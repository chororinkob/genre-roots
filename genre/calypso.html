<h1>Calypso（カリプソ）とは</h1>
<p>トリニダード・トバゴで発展した、歌詞の風刺と言葉遊びを中心とする音楽。編成は時代によって異なる。最初期はギターなどの弦楽器を中心にした弦楽バンドで（1912年のLovey's String Bandが最初の器楽カリプソの録音とされ</p>
<p>トリニダード・トバゴで発展した、歌詞の風刺と言葉遊びを中心とする音楽。編成は時代によって異なる。最初期はギターなどの弦楽器を中心にした弦楽バンドで（1912年のLovey's String Bandが最初の器楽カリプソの録音とされる）、のちにトランペット、トロンボーン、サックスによるホーンセクションが加わり、ギター、ベース、ピアノ、そして打楽器が支える形が広まった。時にスティールパン、すなわちドラム缶の底を叩き出して音階を作った打楽器が旋律を担う。拍子は2/4または4/4で、シンコペーションがあり、コードを裏拍で刻む。3+3+2のパターンがカリプソと結びつけられ、ギターのストラムには2小節パターンの例がある。和声は長調の三和音や四和音が中心で、明るく開放的な響きを持つ。しかし音楽の本体は歌詞にあり、政治家の汚職、社会の矛盾、隣人の噂話、性的な暗示を、二重の意味を持つ言い回しで巧みに包んで語る。この、直接言えないことを比喩と洒落で言うという技法こそが、カリプソの本質である。歌唱は語りに近く、韻とリズムの巧みさで聴かせる。</p>
<h2>成り立ち</h2><p>起源は18世紀から19世紀のトリニダード島にある。フランス系の農園主が連れてきた奴隷たちは、互いに異なる言語を話し、また互いに話すことを禁じられたという話が広く流布している(出典のない記述)。彼らはフランス系クレオール語で歌を作り、その中で農園主を風刺した。起源は諸説あり、都市の下層民（自由になった人々）のカーニヴァル文化が重要だったという見方があり、その形成時期は1860年頃のポートオブスペインとされる。この語りの歌はカイソと呼ばれ、集団の中でシャントウェルと呼ばれる歌い手が即興で歌った。奴隷制廃止法は1833年に成立し、1834年8月1日に施行されたが徒弟制が続き、トリニダードで完全解放となったのは1838年8月1日で、解放された人々は謝肉祭カーニヴァルの主役となり、この歌が祭の中心的な表現となった。植民地政府はこれを繰り返し規制し、1883年（1884年とする資料もある）には太鼓の使用を禁じた。これに対し人々は竹を打ち鳴らすタンブー・バンブーで応じ、それも禁じられると、1930年代半ばに金属打楽器（ブレーキハブ、ビスケット缶など）が使われ、1937年にフライパン・ごみ箱の蓋・ドラム缶の管弦楽団が現れ、55ガロンのドラム缶が使われたのは1947年頃で、スティールパンが生まれた（起源の逸話には疑わしいものもある）。20世紀に入ると、歌はカリプソと呼ばれるようになり、歌手はロード・キチナー、マイティ・スパロウのように貴族や強さを示す称号を名乗った。1920年代末から1930年代前半を黄金期とする見方が一般的で（1950年代のキチナーやスパロウの時代を黄金期とする資料もある）、毎年の謝肉祭に向けて新曲が作られ、カリプソ・テントと呼ばれる仮設の小屋で競演が行われた。歌詞は常に検閲との緊張関係にあり、1930年代には植民地政府が事前検閲を制度化している。海外での広まりは1956年より前に始まっており、1934年にAttila the HunとRoaring Lionがニューヨークで録音し、1940年代にはLord Invaderの「Rum and Coca-Cola」をAndrews Sistersがカバーして米国でヒットした。1956年は米国での「カリプソ・ブーム」を決定づけた年で、その中心となったのは米国のHarry Belafonteが発表したアルバムCalypsoで、これは史上初めて100万枚を売り上げたLPとされる。ただし彼はニューヨーク生まれのジャマイカ系であり、収録曲は、全11曲のうち8曲がIrving Burgie（ブルックリン生まれ、母はバルバドス出身）作の西インド諸島風の創作曲で、「Day-O」はジャマイカの伝承曲、「Jamaica Farewell」はメントであり、「Brown Skin Girl」と「Man Smart (Woman Smarter)」はNorman Span作で、後者はトリニダードの歌手King Radioが先に録音した曲だったため、商業的に薄めた版とみなされた。1970年代以降、より速く踊ることに特化したソカが分岐し、カリプソ自体は歌詞の芸術として位置づけが変化した。現在も謝肉祭のカリプソ・モナークという競演が続き、社会批評の伝統が保たれている。</p>
