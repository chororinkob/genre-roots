<h1>Glam Rock（グラムロック）とは</h1>
<p>グラム・ロックは、演奏される音そのものより、化粧と衣装を含めた見せ方までを、一体の作品と見なした1970年代前半のロックだ。 音楽の骨格は、意外なほど古風だ。1950年代のロックンロールやブギの単純な進行を土台に、床を踏み鳴らすよ</p>
<p>グラム・ロックは、演奏される音そのものより、化粧と衣装を含めた見せ方までを、一体の作品と見なした1970年代前半のロックだ。

音楽の骨格は、意外なほど古風だ。1950年代のロックンロールやブギの単純な進行を土台に、床を踏み鳴らすような重い4/4拍子の刻みを置く。ブギ的な単純さを軸にしたものが目立つ一方、Roxy Musicのようなアート寄りの例もあり、実際は多様である。

ギターは歪ませるが、音符は少ない。短く覚えやすい音型を繰り返す。サックスや弦楽器、ピアノが加えられて、華やかさを出す。録音では、残響を深くかけて、実際より大きな空間で鳴っているように仕立てる例もある。テンポは勢いのあるものが多く、間奏は短いことが多い。

歌詞は、恋愛や享楽を扱う軽いものが多い。その一方で、宇宙人や未来の破滅といったSF的な物語を持ち込み、演者自身が架空の人格を演じる例もあった。

視覚面では、男性とも女性ともつかない化粧、銀色の衣装、極端に厚い底の靴、全身の輝きがしばしば見られた。テレビの音楽番組で映えることを前提に設計されていたと見られる。

同時代のプログレッシブ・ロックは、演奏技術と長大な構成を誇った。これに対し、グラム・ロックは、単純さと派手さを堂々と選び取った。そこに本質がある。</p>
<h2>成り立ち</h2><p>起点は、1970年から1971年のイギリスだ。

フォーク寄りの活動をしていたMarc Bolanは、バンド名をT. Rexへ縮め、電気楽器へ転向した。1970年のライド・ア・ホワイト・スワン、翌年のゲット・イット・オンで、一気に国民的な人気を得る。決定的だったのは、1971年3月のテレビ番組トップ・オブ・ザ・ポップスへの出演だ。目の下にラメを塗って現れたこの出演は、しばしばグラム・ロックの起点とされる。

1972年には、David Bowieが、宇宙から来た架空のロックスターを主人公とする作品ジギー・スターダストを発表した。Mick Ronsonの荒々しいギターとともに、演者が別人格を演じるというやり方を広く定着させた。同年、Bowieが書き与えた楽曲でMott the Hoopleが復活する。彼が制作を手掛けたLou Reedのトランスフォーマーも成功した。

より大衆的な側でも、動きは広がった。Mike ChapmanとNicky Chinnの制作者組は、SweetやSuzi Quatroに、単純で力強い楽曲を供給した。Sladeは、労働者階級の若者に向けた合唱曲を量産した。Wizzardも続いた。

男性とも女性ともつかない表現には、社会的な意味もあった。同性愛は、イングランドとウェールズで1967年に、合意のうえ・私的な場・21歳以上の男性間に限って合法化されるまで、犯罪とされていた。そうした社会で、この表現は性の規範を揺さぶった。Bowieが1972年のMelody Makerのインタビューで同性愛（gay）を公言したことは、大きな事件となった。

一方で、影の歴史もある。この時代の中心人物の一人だったGary Glitterが、後年、児童に対する性犯罪で複数回にわたり有罪判決を受けた。これは、シーンの歴史に消せない汚点として残っている。

しかし、流行は長く続かなかった。1970年代半ば〜1976年頃にかけて衰退する。それでもアメリカでは、New York DollsやAlice Cooper、Kissが、別の形で引き継いだ。その後のパンク、ニューロマンティック、グラムメタル、そして視覚表現を伴うあらゆるポップスへ、影響を残した。</p>
