<h1>Glam Rock（グラムロック）とは</h1>
<p>演奏される音そのものより、化粧と衣装を含めた見せ方までを一体の作品と見なした1970年代前半のロックである。音楽面の骨格は意外なほど古風で、1950年代のロックンロールやブギの単純な進行を土台に、床を踏み鳴らすような重い4/4拍子</p>
<p>演奏される音そのものより、化粧と衣装を含めた見せ方までを一体の作品と見なした1970年代前半のロックである。音楽面の骨格は意外なほど古風で、1950年代のロックンロールやブギの単純な進行を土台に、床を踏み鳴らすような重い4/4拍子の刻みを置く。この地響きのようなドラムに手拍子を重ね、複数の声を厚く合唱させるなど、ブギ的な単純さを軸にしたものが目立つ一方、Roxy Musicのようなアート寄りの例もあり、実際は多様だった。ギターは歪ませつつも音符は少なく、短く覚えやすい音型を繰り返す。サックスや弦楽器、ピアノが加えられて華やかさを出し、録音では残響を深くかけて実際より大きな空間で鳴っているように仕立てられる例もある。テンポは勢いのあるものも多く、間奏が短い例もある。歌詞は恋愛や享楽を扱う軽いものが多い一方、宇宙人や未来の破滅といったSF的な物語を持ち込み、演者自身が架空の人格を演じる例もあった。視覚面では男性とも女性ともつかない化粧、銀色の衣装、極端に厚い底の靴、全身の輝きがしばしば見られ、テレビの音楽番組で映えることを前提にした例も多い。同時代のプログレッシブ・ロックが演奏技術と長大な構成を誇ったのに対し、こちらは単純さと派手さを堂々と選び取った例が目立つ。</p>
<h2>成り立ち</h2><p>起点は1970年から1971年のイギリスである。フォーク寄りの活動をしていたMarc Bolanは、バンド名をT. Rexへ縮めて電気楽器へ転向し、1970年のライド・ア・ホワイト・スワン、翌年のゲット・イット・オンで一気に国民的な人気を得た。決定的だったのは1971年3月のテレビ番組トップ・オブ・ザ・ポップスへの出演で、目の下にラメを塗って現れたこの出演は、しばしばグラム・ロックの起点とされる。1972年にはDavid Bowieが、宇宙から来た架空のロックスターを主人公とする作品ジギー・スターダストを発表し、Mick Ronsonの荒々しいギターとともに、演者が別人格を演じるというやり方を広く定着させる。同年、Bowieが書き与えた楽曲でMott the Hoopleが復活し、彼が制作を手掛けたLou Reedのトランスフォーマーも成功した。より大衆的な側では、Mike ChapmanとNicky Chinnの制作者組が、SweetやSuzi Quatroに単純で力強い楽曲を供給し、Sladeが労働者階級の若者に向けた合唱曲を量産し、Wizzardも続いた。男性とも女性ともつかない表現は、同性愛が、イングランドとウェールズで1967年に合意のうえ・私的な場・21歳以上の男性間に限って合法化されるまで犯罪とされていた社会にあって性の規範を揺さぶる意味を持ち、Bowieが1972年のMelody Makerのインタビューで同性愛（gay）を公言したことは大きな事件となった。一方で、この時代の中心人物の一人だったGary Glitterが後年、児童に対する性犯罪で複数回にわたり有罪判決を受けたことは、シーンの歴史に消せない汚点として残っている。1970年代半ば〜1976年頃にかけて衰退するが、アメリカではNew York DollsやAlice Cooper、Kissが別の形で引き継ぎ、その後のパンク、ニューロマンティック、グラムメタル、そして視覚表現を伴うあらゆるポップスへ影響を残した。</p>
