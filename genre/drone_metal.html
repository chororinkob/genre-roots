<h1>Drone Metal（ドローンメタル）とは</h1>
<p>ドローン・メタルは、音の高さやリズムの変化をほぼ完全に手放して、伸び続ける低音の轟音そのものを聴かせる音楽だ。 テンポという概念が成立しない場合も多い。極端に遅く、拍やリズムが曖昧な曲が多い。 ギターは低音域を強調する。和音を一度</p>
<p>ドローン・メタルは、音の高さやリズムの変化をほぼ完全に手放して、伸び続ける低音の轟音そのものを聴かせる音楽だ。

テンポという概念が成立しない場合も多い。極端に遅く、拍やリズムが曖昧な曲が多い。

ギターは低音域を強調する。和音を一度鳴らすと、その音が消え切るまで数十秒間、そのまま鳴らし続ける。

この長い持続の間に、弦と弦の音が重なって生じるうなり、アンプの回路が出す雑音、空間の中で反射した音が混ざり合う。すると、元々含まれる倍音や、二つの音から生まれる差音などが聞き取りやすくなる。鳴らした後に聞こえ方が変化する過程こそが、この分野の中身そのものだ。

ドラムを使わない、またはごく控えめに使う例が多い。バンドごとに差がある。そのため聴き手は、リズムに体を合わせることも、旋律を追うこともできない。

Sunn O)))などは、音量と空間での体験を重視する。実際の演奏では大量のアンプを積み上げ、低音域を強調した音圧が使われる。録音では再現しきれない面があると語られる。

声が入る場合は、遠くで唸る咆哮や、儀式的な詠唱として、断片的に現れる。Sunn O)))のように、フード付きの長い衣をまとい、舞台を濃い煙で満たす演奏者もいる。</p>
<h2>成り立ち</h2><p>ドローン・メタルの源流としては、主に次の二つが挙げられる。

ひとつは、1960年代のアメリカの前衛音楽だ。La Monte YoungやTony Conradは、長い持続音と和声（音程）の組み合わせを、Youngが定めた規則の範囲内で、何時間も即興的に移していった。聴き手の感じ方が変わることを促す試みだった。

もうひとつは、ヘヴィメタルの系譜だ。1968年に結成されたBlack Sabbathは、1970年のデビュー作で、極端に遅く重い音を示した。1980年代には、Melvinsがそれをさらに遅くする方向へ押し進めていた。

この二つをつないだ先駆けとされるのが、Dylan Carlson(シアトル生まれ)だ。彼が率いるEarthは、1989年にオリンピアで結成され、のちにシアトルへ移った。Earthは1993年に発表した『Earth 2』で、ドラムをほぼなくし(打楽器があるのは1曲だけ)、歪んだギターとベースの反復と持続で組み立てる形を示した。日本のBorisも、並行してドローン・メタルを発展させた。大阪のCorruptedも、ドローン的な要素を持つ。

この時期の彼は、シアトルの音楽家たちと近く、Nirvanaの中心人物と親しかったことでも知られる。だがその関係には、痛ましい事実も含まれている。彼が代理で買った銃が、1994年の悲劇に使われたのだ。

1998年には、Stephen O'MalleyとGreg Andersonが、Earthへの敬意からSunn O)))を結成した。名前はアンプの製造会社から借りた。演奏では修道士のような長い衣をまとい、舞台を煙で満たす演出で知られる。

彼らは録音作品と並行して、その場の音圧を体験させる公演を重ねてきた。教会・大聖堂や美術ギャラリーなど、ロック以外の会場でも演奏している。2009年の作品では、管楽器や合唱団、ホルンを取り入れ、この分野が単なる轟音にとどまらないことを示した。

日本のBorisは、Melvinsの曲から名前を取った。この領域とサイケデリック・ロックやポップスを自在に行き来する作風で、国際的な評価を得た。ニューヨークのKhanateは、より苦痛と絶望に特化した作風を残している。

この分野は聴き手を選ぶ。音楽というより体験のための装置に近い。現代音楽、アンビエント、ノイズの各分野と地続きで、メタルの外側（現代音楽・ノイズ・美術）との接点が多い領域といえる。</p>
