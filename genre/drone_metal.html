<h1>Drone Metal（ドローンメタル）とは</h1>
<p>音の高さやリズムの変化をほぼ完全に放棄し、持続する低音の轟音そのものを聴かせる音楽である。テンポという概念が成立しないことも多く、拍を数えられる場合でも毎分30打を下回る。ギターは極端に低く調弦され、和音を一度鳴らすと、その音が減</p>
<p>音の高さやリズムの変化をほぼ完全に放棄し、持続する低音の轟音そのものを聴かせる音楽である。テンポという概念が成立しないことも多く、拍を数えられる場合でも毎分30打を下回る。ギターは極端に低く調弦され、和音を一度鳴らすと、その音が減衰し切るまで数十秒にわたって放置される。この長い持続の間に、弦と弦の干渉によって生じるうなり、アンプの回路が発する雑音、そして空間の中で反射した音が混ざり合い、当初は存在しなかった倍音が浮かび上がってくる。この、鳴らした後に生成される音の変化こそが、この分野の実質的な内容である。ドラムは置かれないことが多く、置かれても数十秒に一度の打撃に留まる。したがって聴き手は、リズムに身体を合わせることも、旋律を追うこともできない。決定的に重要なのが音量で、実際の演奏では大量のアンプを積み上げ、聴き手の内臓が振動するほどの音圧が用いられる。この物理的な体験こそが作品であり、小音量で再生した録音は本質を伝えないと考えられている。声が入る場合は、遠くで唸る咆哮や、儀式的な詠唱として断片的に現れる。演奏者は覆面や長衣をまとい、濃い煙で姿を隠すことも多い。</p>
<h2>成り立ち</h2><p>二つの源流がある。ひとつは1960年代のアメリカの前衛音楽で、La Monte YoungやTony Conradが実践した、単一の和音を何時間も持続させて聴き手の知覚の変容を促すという試みである。もうひとつは1970年のBlack Sabbathに始まる、極端に遅く重いヘヴィメタルの系譜であり、1980年代のMelvinsがそれをさらに遅くする方向へ押し進めていた。この二つを直接接続したのが、ワシントン州オリンピアのDylan Carlsonである。彼が率いるEarthは1993年に発表した作品で、ドラムを排し、歪んだギターの和音を延々と持続させるだけという構成を提示した。この時期の彼はシアトルの音楽家たちと近く、Nirvanaの中心人物と親しかったことでも知られるが、その関係は、彼が代理で購入した銃器が1994年の悲劇に用いられたという痛ましい事実を含んでいる。1998年、Stephen O'MalleyとGreg AndersonがEarthへの敬意から結成したSunn O)))は、アンプの製造会社の名を借り、演奏においては修道士のような長衣をまとい、舞台を煙で満たすという儀式的な形式を確立した。彼らは録音作品よりも、その場の音圧を体験させる公演を中心に据え、時に美術館や教会で演奏している。2009年の作品では管楽器や合唱団、ホルンを導入し、この分野が単なる轟音に留まらないことを示した。日本のBorisは、Melvinsの楽曲から名を取り、この領域とサイケデリック・ロックやポップスを自在に往復する作風で国際的な評価を得た。ニューヨークのKhanateは、より苦痛と絶望に特化した作風を残している。この分野は聴き手を選ぶ。演奏中に退屈して帰る客も、逆に涙を流す客もおり、音楽というより体験装置に近い。現代音楽、アンビエント、ノイズの各分野と地続きであり、メタルの内側にありながら最もその外側へ開かれた領域といえる。</p>
