<h1>Zydeco（ザディコ）とは</h1>
<p>ズデコは、アメリカ南部ルイジアナ州の南西部で、フランス語を話す黒人クレオールの共同体が育てた、踊るための音楽だ。同じ地域には白人によるケイジャン音楽があり、担い手は違う。それでも両者は多くの曲を共有し、互いに借り合ってきた。 編成</p>
<p>ズデコは、アメリカ南部ルイジアナ州の南西部で、フランス語を話す黒人クレオールの共同体が育てた、踊るための音楽だ。同じ地域には白人によるケイジャン音楽があり、担い手は違う。それでも両者は多くの曲を共有し、互いに借り合ってきた。

編成の中心は、蛇腹式の手風琴だ。鍵盤式(Clifton ChenierやBuckwheat Zydecoらの系統)とボタン式(Boozoo Chavisらの系統)の二つの流れがある。

もうひとつのトレードマークが、波型に加工した金属の板を胸に吊るし、栓抜きや匙で擦る打楽器である。洗濯板を改造したもので、1946年にClifton Chenierが設計し、金属加工職人のWillie Landryが作ったとされる。奏者は両手で複雑なリズムを刻み、全身を使って演奏する。ほかにドラム、エレクトリックギター、低音楽器が入り、時に管楽器も加わる。

リズムはブルースとリズム・アンド・ブルースの影響を強く受けている。跳ねた刻みと、拍の裏を強調する並べ方が特徴だ。シンコペーションが強く、リズム隊の動きはケイジャン音楽より活発である。

歌はフランス語のクレオール、あるいは英語で、力強く叫ぶように歌われる。歌では、苦しみや孤独といった主題が表される。</p>
<h2>成り立ち</h2><p>ルイジアナ州で黒人クレオールと呼ばれる人々が、この音楽を生んだ。彼らの歴史はフランスの植民地の時代に遡る。フランス語系の言語を話し、アフリカ系の文化的な背景を持っていた。

19世紀から20世紀にかけて、この地域では白人のケイジャン、黒人のクレオール、そして英語を話す人々が隣り合って暮らし、音楽をやり取りしていた。

初期の重要な人物がAmédé Ardoinだ。彼は1929年から1934年にかけて録音を残した、最初期の黒人クレオールの手風琴奏者である。その旋律の多くは、今も演奏されている。

しかし、彼の生涯は残酷な終わりを迎えた。言い伝えでは、約1939年、白人宅のダンスで演奏したあと、宿へ歩いて帰る途中で、人種的な動機の暴行を受けたとされる。ただし、死因を含めて確定していない。1942年9月に州立の精神病院(Pineville)に入り、同年11月3日に亡くなった。この言い伝えは、当時の南部の人種秩序の暴力を示すものとして語り継がれている。

現代的なズデコの形を定着させたのは、Clifton Chenierである。彼は1950年代から、この地域の伝統的な旋律に、テキサスやルイジアナのブルースとリズム・アンド・ブルースを大胆に取り込んだ。そして、鍵盤式の手風琴と電気楽器による現代的な編成を作り上げた。彼は自らをこの音楽の王と名乗り、1984年の授賞式で、グラミー賞(Best Ethnic or Traditional Folk Recording)を『I'm Here』で受賞している。金属の洗濯板を胸に吊るす形の打楽器も、彼と兄弟が金属加工の職人に頼んで作らせたものだと伝えられる。

名前の由来は、はっきりしない。有力とされる説は、豆に塩気がないという意味のフランス語の言い回しにさかのぼるというものだ。この言い回しは、貧しさを表す慣用句だった。ほかに、西アフリカに起源を求める説もある。

1980年代以降、Buckwheat Zydecoは国際的に活動した。一方、Boozoo Chavisはアメリカとカナダを中心に活動した。この音楽は今も、土曜の夜の踊りの場で、生きた音楽として演奏され続けている。</p>
<h2>代表曲</h2><ul><li>My Toot Toot (Rockin' Sidney)</li><li>Ma 'Tit Fille (Buckwheat Zydeco)</li><li>Hot Tamale Baby (Buckwheat Zydeco)</li><li>Dog Hill (Boozoo Chavis)</li><li>The Louisiana Two Step (Rockin' Dopsie &amp; The Zydeco Twisters)</li><li>Paper in My Shoe (Boozoo Chavis)</li><li>Zydeco Sont Pas Salés (Clifton Chenier)</li><li>Zydeco (Queen Ida)</li><li>Hot Rod (Clifton Chenier)</li><li>Give Him Cornbread (Beau Jocque)</li><li>Tu Le Ton Son Ton (Clifton Chenier)</li><li>Bogalusa Boogie (Clifton Chenier)</li></ul>
