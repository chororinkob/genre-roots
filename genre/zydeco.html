<h1>Zydeco（ザディコ）とは</h1>
<p>アメリカ南部ルイジアナ州西部の、フランス語を話す黒人クレオールの共同体で発達した舞踏音楽である。同じ地域の白人によるケイジャン音楽とは、担い手も音も明確に区別される。編成の中心は蛇腹式の手風琴で、こちらでは鍵盤式の大型のものが好ま</p>
<p>アメリカ南部ルイジアナ州西部の、フランス語を話す黒人クレオールの共同体で発達した舞踏音楽である。同じ地域の白人によるケイジャン音楽とは、担い手も音も明確に区別される。編成の中心は蛇腹式の手風琴で、こちらでは鍵盤式の大型のものが好まれる。これはケイジャン音楽が用いる小型のボタン式と異なり、より多くの調で演奏でき、ブルースの音階を扱える点が選択の理由である。もうひとつの象徴が、波型に加工された金属の板を胸に吊るし、栓抜きや匙で擦る打楽器である。これは洗濯板を改造したもので、1940年代にこの音楽のために専用の形が設計された。奏者は両手で複雑な刻みを刻み、全身を使って演奏する。加えてドラム、エレクトリックギター、低音楽器が入り、時に管楽器も加わる。リズムはブルースとリズム・アンド・ブルースの影響を強く受け、跳ねた刻みと、拍の裏を強調する配置が特徴である。テンポはケイジャン音楽より明らかに速い。歌唱はフランス語のクレオール、あるいは英語で、力強く叫ぶように歌われる。歌詞は恋愛、労働、食べ物、そして地域の出来事を扱う。</p>
<h2>成り立ち</h2><p>この音楽を生んだのは、ルイジアナ州の黒人クレオールと呼ばれる人々である。彼らはフランス植民地期に遡る歴史を持ち、フランス語系の言語を話しながら、アフリカ系の文化的な背景を持っていた。19世紀から20世紀にかけて、この地域では、白人のケイジャン、黒人のクレオール、そして英語話者が隣接して暮らし、音楽を交換していた。初期の重要な人物がAmédé Ardoinである。彼は1930年代に録音を残した最初期の黒人クレオールの手風琴奏者であり、その旋律の多くは現在も演奏されている。しかし彼の生涯は残酷に終わった。1939年、白人の集まりで演奏していた際、白人女性が汗を拭くようにと自らのハンカチを差し出したことが引き金となり、演奏後に暴行を受けて頭部に重い障害を負う。彼は施設に収容され、1942年に死亡した。この事件は、当時の南部の人種秩序の暴力性を端的に示している。様式としてのズデコを確立したのはClifton Chenierである。彼は1950年代から、この地域の伝統的な旋律に、テキサスやルイジアナのブルースとリズム・アンド・ブルースを大胆に取り込み、鍵盤式の手風琴と電気楽器による現代的な編成を作り上げた。彼は自らをこの音楽の王と称し、1983年にはアメリカの主要な音楽賞を受賞している。金属の洗濯板を胸に吊るす形の打楽器も、彼と兄弟が金属加工の職人に依頼して作らせたものだと伝えられる。名称の由来には諸説あるが、豆に塩気がないという意味のフランス語の言い回しが、貧しさを嘆く歌の冒頭に用いられていたことに遡るという説が有力である。1980年代以降、Buckwheat ZydecoやBoozoo Chavisが国際的に活動し、現在も土曜の夜の踊りの場で生きた音楽として演奏され続けている。</p>
<h2>代表曲</h2><ul><li>Zydeco Sont Pas Salés (Clifton Chenier)</li><li>My Toot Toot (Rockin' Sidney)</li><li>Hot Tamale Baby (Buckwheat Zydeco)</li></ul>
