<h1>Doom Metal（ドゥームメタル）とは</h1>
<p>ドゥーム・メタルは、速度を捨て、遅さと重さそのものを表現の核に据えたメタルだ。 主役は、低い調弦と大音量のアンプを使うギターだ。倍音（高い成分の音）が潰れて唸るような、厚い音を作る。Big MuffやOrangeのアンプのような機</p>
<p>ドゥーム・メタルは、速度を捨て、遅さと重さそのものを表現の核に据えたメタルだ。

主役は、低い調弦と大音量のアンプを使うギターだ。倍音（高い成分の音）が潰れて唸るような、厚い音を作る。Big MuffやOrangeのアンプのような機材が好まれる。奏法は、速弾きを排する。一音一音を長く伸ばして、減衰（音が消えていくこと）の変化を聴かせる。この結果、音の立ち上がりより余韻が主役になる。

和声は短調に加え、三全音、そして減和音（不安定な響きの和音）を使う。これらを長く保持することで、不安を持続させる。一つの和音が数小節にわたって持続することも珍しくない。ベースはギターと同じ低音域で厚みを重ね、時に歪ませて轟音の一部となる。

BPMは非常に遅いテンポだ。ドラムは、シンバルの残響を活かした大きな間を取る。フィルイン（つなぎの連打）は少ない。

歌唱は「クリーン/オペラ的/唸り声」の3つに分けられる。歌詞は、苦悩・恐怖・悲嘆・死・オカルト的なシンボルなどを扱う。ストーナー・ドゥームでは薬物も扱う。

長尺の曲が多い。サブジャンル(フューネラル、ドローン、ストーナー・ドゥーム)ではさらに長大化する。聴き手に忍耐を要求する構造そのものが、体験の一部となる。ライブでは、音量による物理的な圧迫感が重視される。身体が振動する感覚が目的となる。</p>
<h2>成り立ち</h2><p>ドゥームの原型は、Black Sabbathの初期作品、とくに1970年にイギリス・バーミンガムで出したデビュー・アルバムと見なされる。

冒頭曲Black Sabbathは、鐘の音に続いて、三全音を用いた遅く重いリフが鳴る構成だ。その後のドゥームの要素の多くをすでに含んでおり、「最初のドゥーム・メタル曲」と呼ばれることもある。

ギタリストTony Iommiは、工場での事故で指先を失った。そこで義指と軽い弦を使い、パワーコード（ルートと5度だけの和音）中心に弾いた。これが、この重さの物理的な原因とされる（3作目のMaster of Reality（1971年）の一部曲(『Into the Void』など)で、3半音下げたC♯の調弦（弦の音合わせ）を用いた）。

1970年代から1980年代前半にかけて、このスタイルを意識的に受け継ぐバンドが現れた。1980年代前半に、ドゥーム・メタルは独立したジャンルとして定着した。ワシントンD.C.圏では、バージニア州のPentagram（1971年結成）とメリーランド州のThe Obsessed（1976年にWarhorseとして結成。1979〜80年ごろにThe Obsessedを名乗る）がいた。スウェーデンではCandlemassである。

とりわけCandlemassが1986年に発表したEpicus Doomicus Metallicusは、アルバム名がジャンル名のラテン語風表記で、このアルバムがエピック・ドゥームの典型として知られる。オペラ的な歌唱と荘厳な遅さを結合させた作品だ。同時期、イギリスのWitchfinder Generalが同種の音を追求していた。

1990年前後には、イギリス北部のPeaceville Recordsを拠点に、My Dying Bride、Anathema、Paradise Lostの三組が現れた。デスメタルの唸り声を取り入れた、英国におけるデス・ドゥームの代表的な先駆者（通称Peaceville Three）となった（ヴァイオリンはMy Dying Bride、女性の歌声はParadise Lostが採り入れた）。

並行して米国では、Sleepが1990年代に、極端に長く遅い曲を追求した。1990年代半ば（1994〜96年ごろ）には、一時間を超える単一楽曲(録音当時は『Jerusalem』と呼ばれた作品。のちにDopesmoker)を録音した。しかし、レコード会社がこれを商品として受け入れず、バンドは1998年に解散に追い込まれた。この作品は、1999年に別の版で、2003年にDopesmokerとして正式に発売された。いまではストーナー・ドゥームの記念碑として評価されている。

バーミンガムの工業的・労働者階級の環境が初期ヘヴィメタルの形成に影響したとする研究がある(Harrison 2010)。現在は、フューネラル・ドゥーム、ドローン・ドゥーム、スラッジなど多数の細かなスタイルに分かれている。</p>
