<h1>Doom Metal（ドゥームメタル）とは</h1>
<p>速度を捨て、遅さと重さそのものを表現の核に据えたメタル。BPMは60〜90、時に40台まで落ち、一つの和音が数小節にわたって持続することも珍しくない。ギターは低い調弦と大音量のアンプで、倍音が飽和して唸るような厚い音を作り、Big</p>
<p>速度を捨て、遅さと重さそのものを表現の核に据えたメタル。BPMは60〜90、時に40台まで落ち、一つの和音が数小節にわたって持続することも珍しくない。ギターは低い調弦と大音量のアンプで、倍音が飽和して唸るような厚い音を作り、Big MuffやOrangeのアンプのような機材が好まれる。奏法は速弾きを排し、一音一音を長く伸ばして減衰の変化を聴かせる。この結果、音の立ち上がりより余韻が主役になる。和声は短調に加え、三全音、そして減和音を長く保持することで不安を持続させる。ベースはギターと同じ低音域で厚みを重ね、時に歪ませて轟音の一部となる。ドラムはシンバルの残響を活かした大きな間を取り、フィルインは少ない。歌唱は二系統あり、一つは高く伸びやかで悲劇的な歌い上げ、もう一つは低く唸る発声である。歌詞は死、喪失、疫病、宗教的な絶望、薬物、そして人間の無力さを扱う。曲の長さは10分を超えることが多く、聴き手に忍耐を要求する構造そのものが体験の一部となる。ライブでは音量による物理的な圧迫感が重視され、身体が振動する感覚が目的となる。</p>
<h2>成り立ち</h2><p>起源は1970年、イギリス・バーミンガムのBlack Sabbathのデビュー・アルバムにある。冒頭曲Black Sabbathは、鐘と雨の音に続いて三全音を用いた遅く重いリフが鳴るという構成で、その後のドゥームの全要素をすでに含んでいた。ギタリストTony Iommiが工場での事故で指先を失い、弦の張力を下げるため調弦を低くしたことが、この重さの物理的な原因である。1980年代に入り、この様式を意識的に受け継ぐバンドが現れた。米国メリーランド州のThe Obsessed とPentagram、スウェーデンのCandlemassである。とりわけCandlemassが1986年に発表したEpicus Doomicus Metallicusは、ジャンルの名称の由来ともなり、オペラ的な歌唱と荘厳な遅さを結合させた。同時期、イギリスのWitchfinder Generalが同種の音を追求していた。1990年前後には、イギリス北部のPeaceville Recordsを拠点に、My Dying Bride、Anathema、Paradise Lostの三組が現れ、デスメタルの唸り声とヴァイオリンや女性の歌声を組み合わせたデス・ドゥームを確立した。並行して米国では、Sleepが1990年代に極端に長く遅い曲を追求し、1990年代末に一時間を超える単一楽曲Dopesmokerを制作したが、レコード会社がこれを商品として受け入れず、バンドは解散に追い込まれた。この作品は後に発売され、ストーナー・ドゥームの記念碑として評価されている。文化的背景には、産業都市の衰退と失業、そして冷戦下の終末への不安があり、遅さは怠惰ではなく、抗いようのない重圧の表現として選ばれた。現在はフューネラル・ドゥーム、ドローン・ドゥーム、スラッジなど多数の下位様式に分かれている。</p>
<h2>代表曲</h2><ul><li>Solitude (Candlemass)</li><li>Born Too Late (Saint Vitus)</li><li>Dopethrone (Electric Wizard)</li><li>The Cry of Mankind (My Dying Bride)</li><li>Funeralopolis (Electric Wizard)</li></ul>
