<h1>Rebetiko（レベティコ）とは</h1>
<p>レベティコは、19世紀末から20世紀前半にかけて、ギリシャ人の都市の下層社会で歌われた歌だ。起源は19世紀末にさかのぼる。1920年代に難民が流入し、1930年代に融合が進んで、1930年代末に古典期に至った。 1930年代半ば以</p>
<p>レベティコは、19世紀末から20世紀前半にかけて、ギリシャ人の都市の下層社会で歌われた歌だ。起源は19世紀末にさかのぼる。1920年代に難民が流入し、1930年代に融合が進んで、1930年代末に古典期に至った。

1930年代半ば以降、編成の中心はブズーキだ。長い棹を持ち、弦をはじいて鳴らす楽器である。金属弦を撥で弾き、細かく震わせる奏法で、独特の金属的な響きを作る。加えて、これを極端に小さくしたバグラマスも使われる。持ち運びやすく、獄中で作りやすく、衣服の下に隠して警察の目を逃れやすかった。伴奏にはギターが加わる。

旋律は、オスマン帝国の音楽理論に由来する旋法の体系に基づく。旋法(ドロモス)はマカームに由来する。ただし、平均律の楽器・西洋和声で演奏されることが多い。微分音は一部の楽器・奏者に限られる。

リズムには複数の型がある。とりわけ、9/8拍子を不均等に分ける型は、男が一人で即興的に踊るための特別なものとされる。ほかに、2拍子で連なって踊る型や、腰を使う4拍子の型がある。テンポは緩やかなものが多いが、速い型もある。

歌い方は、静かで力まないしわがれ声だ。男声だけでなく、女性歌手も重要である。

歌詞は、大麻の吸引、監獄、貧困、病、報われない恋、死、そして故郷の喪失を扱う。道徳的な教訓よりも、社会の底辺に生きる者の現実が、そのまま差し出される。</p>
<h2>成り立ち</h2><p>諸説あるが、この歌が生まれるまでには、二つの流れがあったとされる。ひとつは、オスマン帝国領のスミルナ、今のイズミルにあった都会的な酒場の音楽だ。こちらは洗練された旋法を使い、女性の歌手もいた。もうひとつは、ギリシャ本土の港町ピレウスの、犯罪や麻薬に近い下層社会の音楽である。

この二つを一つにしたのが、1922年の悲劇的な出来事だった。ギリシャとトルコの戦争が、ギリシャの敗北に終わる。その後、1923年の条約による住民交換が、すでに多くの人々が避難していた現実を、後から公式に認めた。小アジアなどに長く住んでいたギリシャ系の人々、推計で100万〜150万人が、着の身着のまま本土へ移ることになったのである。

彼らの多くは、ピレウスやテッサロニキなどの港湾都市、およびアテネ周辺に住みついた。ピレウスの港の一帯には、掘っ立て小屋の集落もできた。このひどい貧しさと喪失の中から、この歌は今の形を得た。

Markos Vamvakarisは、ピレウスの下層社会から出た中心人物である。ピレウスの下層の暮らしを飾らない言葉で歌い、この分野の族長と呼ばれる。

しかし、歌の内容のために、この音楽は権力から敵視された。1936年に成立した独裁体制は、大麻や裏社会を扱う歌の録音を許可制にして検閲した。東方的な音をヨーロッパ風にするようにも勧めた。1938年には、一部の放送局がアマネス(東方風の嘆き歌)を放送禁止にした。ただし、ブズーキそのものが禁止されたという通説は、俗説とされる。

Vassilis Tsitsanisは、占領下のテッサロニキで名声を得て、名曲を書いた。1946年にアテネへ戻ったあとの録音で、西洋化と普及を進めた。彼が占領下の1943年か44年に書いた曇った日曜日という曲は、「一種の非公式の国歌」と評されている。

歌手では、Sotiria Bellouが特に目立つ。彼女は同性愛者であることを隠さずに生きた。左派のEAM系の抵抗運動に加わってナチスに捕まり、拷問と投獄を経験した人物だった。

一方で、左派はこの音楽を、反動的・運命論的と批判した。右派系の論調は、1930年代から「東方的で不道徳」と批判した。

それでも、再評価は1948年のHatzidakisの講演に始まった。1960年ごろからは、作曲家のMikis TheodorakisやManos Hatzidakisがブズーキ奏者を起用し、復興の第1段階に入った。1970年代初頭の軍政下から復興が進み、1974年の軍政崩壊以降に広がった。</p>
