<h1>Rebetiko（レベティコ）とは</h1>
<p>20世紀前半のギリシャの都市の下層社会で生まれた歌である。編成の中心はブズーキという長い棹を持つ撥弦楽器で、金属弦を撥で弾き、細かく震わせる奏法によって独特の金属的な響きを作る。加えて、これを極端に小型化した楽器が用いられる。これ</p>
<p>20世紀前半のギリシャの都市の下層社会で生まれた歌である。編成の中心はブズーキという長い棹を持つ撥弦楽器で、金属弦を撥で弾き、細かく震わせる奏法によって独特の金属的な響きを作る。加えて、これを極端に小型化した楽器が用いられる。これは携帯しやすく、また衣服の下に隠して警察の目を逃れることができたため、しばしば獄中で自作された。伴奏にはギターが加わる。旋律はオスマン帝国の音楽理論に由来する旋法の体系に基づいており、西洋の長短調では説明できない音階と、半音より狭い音程の揺れが用いられる。リズムには複数の型があり、とりわけ9/8拍子を不均等に分割する型は、男が一人で即興的に踊るための特別なものとされる。ほかに二拍子の連なって踊る型や、腰を使う四拍子の型がある。テンポは概ね緩やかで、歌唱は装飾を凝らしながら、鼻にかかった声で絞り出すように歌われる。歌詞は大麻の吸引、監獄、貧困、病、報われない恋、死、そして故郷の喪失を扱う。道徳的な教訓は一切なく、社会の底辺に生きる者の現実がそのまま提示される。</p>
<h2>成り立ち</h2><p>この歌の成立には二つの流れがある。ひとつはオスマン帝国領のスミルナ、現在のイズミルにあった都市的な酒場の音楽で、こちらは洗練された旋法と女性の歌手を含んでいた。もうひとつはギリシャ本土の港湾都市ピレウスの、犯罪と麻薬に近い下層社会の音楽である。この二つを一つにしたのが、1922年の破局的な出来事だった。ギリシャとトルコの戦争がギリシャの敗北に終わり、その後の住民交換によって、小アジアに数千年住んでいたギリシャ系の人々150万人が、着の身着のまま本土へ追われたのである。彼らは受け入れ先を持たず、ピレウスの港湾部にできた掘っ立て小屋の集落に押し込められた。この極限的な貧困と喪失の中から、この歌は現在の形を得た。Markos Vamvakarisはこの世代の中心人物であり、ピレウスの下層の生活を飾らない言葉で歌って、この分野の族長と呼ばれる。しかし歌の内容ゆえに、この音楽は権力から敵視された。1936年に成立した独裁体制は、大麻を主題とする歌を明確に禁じ、さらに東方的な旋法そのものを非ギリシャ的として排除し、放送からブズーキを締め出した。多くの歌が録音されずに失われている。第二次世界大戦中の枢軸国による占領と大飢饉の時期、Vassilis Tsitsanisは、より詩的で普遍的な歌詞によってこの分野を芸術の水準へ引き上げた。彼が占領下に書いた曇った日曜日という楽曲は、事実上の国民歌となっている。歌手の側では、Sotiria Bellouが特筆される。彼女は同性愛者であり、共産主義者としてナチスへの抵抗運動に加わり、投獄と拷問を経験した人物だった。戦後、この音楽は左派からは敗北主義的だと批判され、右派からは不道徳だと非難されたが、1960年代に作曲家Mikis Theodorakisがブズーキを芸術音楽に導入したことで、その地位は完全に回復した。</p>
