<h1>Kompa / Compas（コンパ）とは</h1>
<p>コンパは、ハイチで生まれたダンス音楽だ。なめらかに転がるグルーヴが持ち味である。ただしバンドや時代によっては、強い推進力のあるスタイルもある。 編成には、大きなバンドと小さなバンドが並んでいる。大きい方は、トランペットやトロンボー</p>
<p>コンパは、ハイチで生まれたダンス音楽だ。なめらかに転がるグルーヴが持ち味である。ただしバンドや時代によっては、強い推進力のあるスタイルもある。

編成には、大きなバンドと小さなバンドが並んでいる。大きい方は、トランペットやトロンボーン、サックスを含むフルバンド（大編成のバンド）だ。小さい方は、電気ギター、エレキベース、ドラムなどで組む小編成化したバンド(ミニ・ジャズ)である。ミニ・ジャズには、アルトサックス1本から、フルのホーンセクションまで使う例がある。管楽器が入る場合は、斉奏（全員が同じ旋律を一斉に吹くこと）で覚えやすいフレーズを吹くことがあり、間奏ではソロを回すこともある。ギターは高い音域で短く和音を刻むか、メロディーのような単音を弾く。鍵盤楽器は和音を厚く敷くことがあり、時には電子的な音色が前に出る。

和声（コードの響き）は、初期は2和音の単純な進行が基本だった。後の世代では、長調・短調の三和音（三つの音を重ねた基本の和音）も使われる。

テンポは速い曲から遅い曲まで幅がある。最大の特徴は、拍の刻み方だ。低音とドラムが、拍を淡々と打ち続ける。カウベルが拍を刻み、フロアタム（床に置く大きなタム）がシンコペーション（拍をずらして強調するリズム）を加える。そこにハイハット（小さなシンバルを重ねた装置）が細かい分割を重ねることもある。一定の脈拍のように途切れないこのリズムが、踊りに合っている。踊りは、密着した姿勢で腰を動かし、歩くように2ステップを踏む形だ。

歌い方は力まない。柔らかく甘い声が好まれることが多く、複数の声で和音が加えられることもある。言葉はハイチのクレオール語（現地で独自に発達した言語）が中心だ。英語、スペイン語、フランス語で歌われることもある。歌詞の主題は、愛、自由、平和、抵抗だ。政治的な暗示を含むこともある。

同じカリブ海のズークとは、互いに影響し合う関係にある。ズーク・ラヴは事実上フランス領小アンティルのコンパで、次第にコンパと区別がつかなくなった。</p>
<h2>成り立ち</h2><p>1955年、ハイチのサックス奏者Nemours Jean-Baptisteが、新しいスタイルを打ち出した。当時はドミニカ共和国のメレンゲが流行しており、彼はその影響を受けていた。キューバのソン、チャランガ、米国のビッグバンド・スウィングも影響源とされる。彼はこれを、直接の拍という意味の名で呼んだ。このスタイルは、あっという間に国民的な人気を得る。

創始者はNemoursとされる。ただし、Sicotも共同創始者の一人とする説がある。数年後の1959年から1962年ごろ、盟友でありながら競争相手でもあったSicotが、別の名前を付けたよく似たスタイル(カデンス・ランパ)を打ち出した。2人は、歌詞で互いをからかい合うほど張り合った。

一方、1957年にはFrançois Duvalierが権力を握り、ハイチは独裁体制に入った。秘密警察による恐怖政治のもとで、多くの知識人と芸術家が国外へ逃れ、あるいは沈黙を強いられる。政権は音楽を政治に利用し、従わない音楽家を迫害した。多くの音楽家が国外へ逃れ、1970年代には主要なバンドの拠点が国外に移った。

1968年に結成されたTabou Comboは、1971年にNYで再結集した。1974年には、シングル『New York City』が欧州でミリオンセラーとなる。彼らはハイチ本国だけでなく、移民先の都市でも公演を重ね、『コンパの大使』を自称した。実際、この音楽の歴史は移民の歴史と切り離せない。

1986年、独裁体制は崩壊した。それでも、政情不安と貧困は続いた。

特異な例もある。Sweet Mickyの芸名で人気を得た歌手Michel Martellyが、2011年にハイチの大統領に選ばれたのだ。人気の理由は、女装や脱衣を含む奇抜なステージと、コンパの革新者としての評価だった。

CarimiやT-Viceといったグループが、より現代的な音で若い世代を引きつけた。Carimiは2016年に解散し、2022年以降、再結成公演を行っている。この音楽は今も、ハイチ人が集まる場所の中心にある。</p>
