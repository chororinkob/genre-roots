<h1>Kompa / Compas（コンパ）とは</h1>
<p>ハイチで生まれた、極めて滑らかで抑制の効いたダンス音楽である。テンポは概ね95から115 BPMと中庸で、最大の特徴は拍の刻み方にある。低音とドラムが、四拍子の各拍を淡々と均等に打ち続け、そこにハイハットが細かい分割を重ねる。この</p>
<p>ハイチで生まれた、極めて滑らかで抑制の効いたダンス音楽である。テンポは概ね95から115 BPMと中庸で、最大の特徴は拍の刻み方にある。低音とドラムが、四拍子の各拍を淡々と均等に打ち続け、そこにハイハットが細かい分割を重ねる。この、一定の脈拍のように途切れない律動が、身体を密着させてゆっくり回転する踊りに対応している。跳ねたり急いだりせず、常に同じ歩幅を保つことが最も重要とされる。編成は管楽器を含む楽団が基本で、トランペットとサックスが斉奏で覚えやすい音型を吹き、間奏では独奏を回す。ギターは高音域で短く和音を刻むか、旋律的な単音を弾く。鍵盤楽器は和音を厚く敷き、時に電子的な音色が前面に出る。和声は単純な三和音の循環が中心で、明るい長調が多い。歌唱は力まず、柔らかく甘い声質が好まれ、複数の声による和音が加えられる。言語はハイチのクレオール語で、歌詞は恋愛と祝祭が中心だが、政治的な暗示を含むこともある。同じカリブ海のズークと比べると、テンポが遅く、電子的な派手さより演奏の滑らかさを重んじる点が異なる。</p>
<h2>成り立ち</h2><p>1955年、ハイチのサックス奏者Nemours Jean-Baptisteが、それまで主流だった舞踏音楽メレングを整理し直し、より単純で均等な拍を持つ新しい様式を作り出した。彼はこれを直接の拍という意味の名で呼び、瞬く間に国民的な人気を得る。同時期、盟友でありながら競争相手でもあったWebert Sicotが、別の名を冠したよく似た様式を打ち出し、二人の対立は国を二分する論争となった。この競争が音楽の水準を押し上げたことは間違いない。当時のハイチは、1957年に権力を握ったFrançois Duvalierによる独裁体制下にあった。秘密警察による恐怖政治のもと、多くの知識人と芸術家が国外へ逃れ、あるいは沈黙を強いられる。この状況で音楽は、直接的な批判を避けながら人々の連帯を保つ数少ない場となった。1968年に結成されたTabou Comboは、間もなく活動の拠点をニューヨークへ移し、1974年にはその街を主題とする楽曲で国際的な成功を収める。彼らはハイチ本国だけでなく、ニューヨーク、マイアミ、モントリオール、パリに散らばった移民の共同体をつなぐ役割を果たした。実際、この音楽の歴史は移民の歴史と不可分である。1986年に独裁体制が崩壊した後も、政情不安と貧困は続き、音楽家の多くは国外を拠点とせざるを得なかった。特異な事例として、Sweet Mickyの芸名で下品な振る舞いによって人気を得た歌手Michel Martellyが、2011年にハイチの大統領に選出されたことが挙げられる。音楽家が国家元首となったこの出来事は、この国における音楽の社会的な位置の大きさを示している。近年ではCarimiやT-Viceといった集団が、より現代的な音で若い世代を惹きつけており、この音楽は依然としてハイチ人の集まる場所の中心にある。</p>
