<h1>Darkstep（ダークステップ）とは</h1>
<p>ドラムンベースの中でも、恐怖と圧迫感の演出に振り切ったスタイル。BPMはドラムンベース全体の目安(160〜180)の範囲にあり、Amen Breakを歪ませて切り刻んだ高速ブレイクビーツが息継ぎなく走り続ける。特徴は音色の選択で、</p>
<p>ドラムンベースの中でも、恐怖と圧迫感の演出に振り切ったスタイル。BPMはドラムンベース全体の目安(160〜180)の範囲にあり、Amen Breakを歪ませて切り刻んだ高速ブレイクビーツが息継ぎなく走り続ける。特徴は音色の選択で、ホラー映画のサウンドトラックから採ったような不協和なストリングス、ホラーやSF映画のサンプル、低く唸るドローンが層になって重ねられる。ベースはリース・ベース（二つのわずかにずれた発振器を重ねて濁らせた合成音）を歪ませたものが多く、単なる低音ではなく金属を擦るような不快な倍音を含む。和声は短調でも解決せず、半音でぶつかる音を意図的に残して緊張を持続させる。ドロップの形は様式によって異なる。歌もフックもほぼ存在せず、あるのは映画の台詞の断片くらいで、聴き手を高揚させるより追い詰めることを狙う。ダークステップはdark ambient、industrial、hardcoreの影響を受け、ホラーやSF映画のサンプルとindustrial由来の質感を特徴とする点が、他の系統と違う。深夜のレイヴの最終盤、フロアが疲弊しきった時間帯に鳴らされることが多い。</p>
<h2>成り立ち</h2><p>1990年代後半に、欧州と米国の複数の国で現れたとされる。darkcoreとドラムンベース自体の影響が結び付いて生まれたとされ、テックステップの派生形に挙げる資料もある。そのテックステップは1995年前後にEd Rush、Trace、Nico、Optical らが確立したもので、彼らはNo U-Turn Recordsを拠点に、それまでのジャングルやドラムンベースのR&amp;B的・ポップな要素を削ぎ落とし、歪んだリース・ベースと乾いたブレイクだけで構成する冷たい音を作った。ダークステップはそこからさらに映画的な恐怖描写へ踏み込んだ系統で、Panacea、Technical Itchといった作家が初期の担い手となった。Dom &amp; Rolandはテックステップへの貢献で知られる。ドイツのMathis Mootz（Panacea）はインダストリアルやデジタル・ハードコアの領域へ音を広げ、レーベルPosition Chromeを通じてヨーロッパ大陸側の拠点を作った。イギリス側ではバーミンガムのTechnical Itch（Mark Caro）がPenetration Recordingsを運営し、荒れた質感の作品を継続的に発表した。背景には、1990年代半ばにドラムンベースがLTJ BukemやAlex Reeceらの手で洗練とジャズ寄りの上品さに向かったことや、ポップで技巧的な要素が入ってきたことへの反動があり、「クラブで踊れる心地よさ」より「音で殴られる体験」を求める層の受け皿になった。2000年代半ば以降、ハードコア系と融合するクロスブリード(industrial hardcoreとドラムンベースの融合)が現れ、Prspct Recordings、Yellow Stripe、Future Sickness Recordsなどのレーベルが先導した。Limewax(ウクライナ出身でオランダ拠点)やCurrent Value(ドイツ出身)はskullstepの担い手とされる。商業的には常に周縁で、ラジオもメジャー流通もほぼ届かなかったが、ドラムンベースの大型イベントとしては、2009年にアントワープで始まったRampage（ベルギー）が、世界最大級の室内ドラムンベース/ダブステップのパーティーに成長している。</p>
<h2>代表曲</h2><ul><li>Dark Rain (Current Value)</li><li>The Rukus (Technical Itch)</li><li>The Calling (Technical Itch &amp; Kemal)</li><li>The Real (Technical Itch)</li><li>Fear (Current Value)</li><li>Failed Evolutionary Experiment (Technical Itch)</li><li>Cleansed By A Nightmare (Limewax)</li><li>Certainty (Current Value)</li><li>Tinnitus (Counterstrike)</li><li>Gravitate (Current Value)</li><li>Tic Tac (Counterstrike)</li><li>Masterpiece (Counterstrike feat. Paul McLaney)</li></ul>
