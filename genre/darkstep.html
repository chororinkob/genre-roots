<h1>Darkstep（ダークステップ）とは</h1>
<p>ダークステップは、ドラムンベースの中でも、恐怖と息苦しさを出すことに振り切ったスタイルだ。 特徴は音色の選び方にある。ホラー映画のサウンドトラックから採ったような不協和なストリングス、ホラーやSF映画のサンプル、低く唸るドローンが</p>
<p>ダークステップは、ドラムンベースの中でも、恐怖と息苦しさを出すことに振り切ったスタイルだ。

特徴は音色の選び方にある。ホラー映画のサウンドトラックから採ったような不協和なストリングス、ホラーやSF映画のサンプル、低く唸るドローンが、層になって重ねられる。

ベースは、リース・ベース（複数のわずかにデチューンした波形を重ねて濁らせた合成音）を歪ませたものが多い。単なる低音ではなく、金属を擦るような不快な倍音を含む。

和音は短調でも落ち着かない。半音でぶつかる音をわざと残し、緊張を保ち続ける。

BPMはおおむね160〜185前後だ。Amen Breakを歪ませて切り刻んだ高速ブレイクビーツが、息継ぎなく走り続ける。

歌もフックもほぼ存在しない。あるのは映画の台詞の断片くらいだ。聴き手を盛り上げるより、追い詰めることを狙っている。ドロップの形は、スタイルによって異なる。

ダークステップは、dark ambient、industrial、hardcoreの影響を受けている。テックステップはSF的だが、ダークステップはホラー映画のサンプルとindustrial由来の質感が前に出る。</p>
<h2>成り立ち</h2><p>ダークステップは、1990年代後半に、欧州と米国の複数の国で現れたとされる。darkcoreとドラムンベース自体の影響が結び付いて生まれたとされ、テックステップの派生形に挙げる資料もある。

そのテックステップは、1995年前後にEd RushとTraceが名称を考案し、Nico(No U-Turn)と形作った。OpticalはEd Rushとの1997年以降の協働で、ニューロファンクへ進んだ。彼らはNo U-Turn Recordsを拠点に、それまでのジャングルやドラムンベースのR&amp;B的・ポップな要素を削ぎ落とした。そして、より冷たくシンプルなハードコア寄りの音にした。核になったのは、リース・ベースと硬いブレイクだ。

ダークステップは、映画的な恐怖描写へ踏み込んだ系統だ。初期の担い手は、Panacea、Technical Itchといった作家である。Dom &amp; Rolandは、テックステップへの貢献で知られる。

ドイツのMathis Mootz（Panacea）は、インダストリアルやデジタル・ハードコアの領域へ音を広げた。レーベルPosition Chromeを通じて、ヨーロッパ大陸側の拠点も作った。一方イギリス側では、バーミンガム出身(のちブリストル、2008年からロサンゼルス)のTechnical Itch（Mark Caro）が、2001年にPenetration Recordsを設立した。荒れた質感の作品を、継続的に発表した。

背景には反動があった。1990年代半ば、ドラムンベースはLTJ Bukemらの洗練路線で、ジャズ寄りの上品さに向かった。ポップで技巧的な要素も入ってきた。ダークステップは、「クラブで踊れる心地よさ」より「音で殴られる体験」を求める層の受け皿になった。なお、ReeceのPulp Fictionは、Techstepにも影響した。

2000年代半ば以降は、ハードコア系と融合するクロスブリード(industrial hardcoreとドラムンベースの融合)が現れた。Prspct Recordings、Yellow Stripe、Future Sickness Recordsなどのレーベルが先導した。Limewax(ウクライナ出身でオランダ拠点)やCurrent Value(ドイツ出身)は、skullstepの担い手とされる。

主流のチャートからは遠かったが、Peel番組のような特定の番組では取り上げられた。ドラムンベースの大型イベントとしては、2009年にアントワープで始まったRampage（ベルギー）が、室内ドラムンベース/ダブステップのパーティーに成長している。主催側は『世界最大級』と称する。</p>
