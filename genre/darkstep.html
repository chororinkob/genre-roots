<h1>Darkstep（ダークステップ）とは</h1>
<p>ドラムンベースの中でも、恐怖と圧迫感の演出に振り切ったスタイル。BPMは170〜180前後、曲によっては190近くまで上がり、Amen Breakを歪ませて切り刻んだ高速ブレイクビーツが息継ぎなく走り続ける。特徴は音色の選択で、ホ</p>
<p>ドラムンベースの中でも、恐怖と圧迫感の演出に振り切ったスタイル。BPMは170〜180前後、曲によっては190近くまで上がり、Amen Breakを歪ませて切り刻んだ高速ブレイクビーツが息継ぎなく走り続ける。特徴は音色の選択で、ホラー映画のサウンドトラックから採ったような不協和なストリングス、サイレンや悲鳴のサンプル、逆再生させたシンバル、低く唸るドローンが層になって重ねられる。ベースはリース・ベース（二つのわずかにずれた発振器を重ねて濁らせた合成音）を歪ませたものが多く、単なる低音ではなく金属を擦るような不快な倍音を含む。和声は短調でも解決せず、半音でぶつかる音を意図的に残して緊張を持続させる。ドロップでは音圧を上げるのではなく、逆にすべての音を一瞬止めて無音を作り、そこにブレイクを叩き込むという落とし方が定番。歌もフックもほぼ存在せず、あるのは映画の台詞の断片くらいで、聴き手を高揚させるより追い詰めることを狙う。同じ暗さでもテックステップが工場のような無機質さを描くのに対し、ダークステップは心霊やスプラッターに近い情緒的な恐怖を描く点が違う。深夜のレイヴの最終盤、フロアが疲弊しきった時間帯に鳴らされることが多い。</p>
<h2>成り立ち</h2><p>1990年代後半のイギリスで、ジャングルが多様化していく過程から分かれ出た。直接の母体は1995年前後にEd Rush、Trace、Nico、Optical らが確立したテックステップで、彼らはNo U-Turn Recordsを拠点に、それまでのジャングルが持っていたレゲエ的な陽性のうねりを排除し、歪んだリース・ベースと乾いたブレイクだけで構成する冷たい音を作った。ダークステップはそこからさらに映画的な恐怖描写へ踏み込んだ系統で、Dom &amp; Roland、Panacea、Technical Itch、Limewax といった作家が中心となった。ドイツのMathis Mootz（Panacea）はインダストリアルやパワーエレクトロニクスの美学を持ち込み、レーベルPositionChromeを通じてヨーロッパ大陸側の拠点を作った。イギリス側ではバーミンガムのTechnical Itch（Mark Caro）がPenetration Recordingsを運営し、荒れた質感の作品を継続的に発表した。背景には、1990年代半ばにドラムンベースがJazzy BやLTJ Bukemらの手で洗練とジャズ寄りの上品さに向かったことへの反発があり、「クラブで踊れる心地よさ」より「音で殴られる体験」を求める層の受け皿になった。2000年代に入るとオランダのLimewaxやCurrent Value らが加速し、BPMをさらに上げてハードコア・テクノやスピードコアと接近、クロスブリードと呼ばれる混合様式を生む母体となった。商業的には常に周縁で、ラジオもメジャー流通もほぼ届かなかったが、Rampage（ベルギー）などの大規模イベントで暗い系統の枠が確保され続けたことでシーンは維持された。現在もニューロファンクの派手さとは別の道を行く硬派な支持層を持ち、ホラーやゲームの映像作品に音を提供する形でも生き延びている。</p>
<h2>代表曲</h2><ul><li>The Rukus (Technical Itch)</li><li>Fear (Current Value)</li><li>Cleansed By A Nightmare (Limewax)</li><li>Tinnitus (Counterstrike)</li></ul>
