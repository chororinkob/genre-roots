<h1>Nightcore（ナイトコア）とは</h1>
<p>既存の楽曲を再生速度と音程を同時に上げることで作られる、インターネット発の音の様式。操作は単純で、元の曲の再生速度をおおむね一割から三割ほど速め、その結果として音程も三度から五度ほど高くなる。この加工により、女性の歌声はさらに高く</p>
<p>既存の楽曲を再生速度と音程を同時に上げることで作られる、インターネット発の音の様式。操作は単純で、元の曲の再生速度をおおむね一割から三割ほど速め、その結果として音程も三度から五度ほど高くなる。この加工により、女性の歌声はさらに高く幼く響き、男性の歌声も女性のように聞こえるようになる。テンポは元曲によるが、結果として毎分140から180拍程度になることが多く、跳ねるような軽さが生まれる。音そのものには新しい素材が加えられないことが原則で、この点はチョップド・アンド・スクリュードとちょうど正反対の操作にあたる。近年はキックを重ねたり残響を加えたりする派生もある。素材として選ばれるのはユーロダンス、トランス、ポップパンク、アニメ主題歌、そして現代のポップスで、原曲の情緒がより切迫し、透明で非現実的な質感に変わる点が魅力とされる。視覚表現が不可分で、動画にはアニメ調の少女の静止画が添えられ、多くの場合は他人の絵が無断で使われている。聴かれる場は動画共有サイトとゲームの配信で、作業中や運動中の背景として消費される。</p>
<h2>成り立ち</h2><p>起源は2001年頃、ノルウェー北部のアルタという小さな町にある。高校生だったThomas S. NilsenとSteffen Ojala Søderholmの二人組が、Nightcoreという名義で自分たちの曲を作っていた。彼らは学校の課題として音楽制作を行い、2002年に『Energized』という自主制作のアルバムを完成させた。この作品はハッピーハードコアやユーロダンスを速めた曲で構成されており、彼らはナイトコアという言葉を、夜のハードコアという意味の自分たちの名前として使っていた。つまり本来これはジャンル名ではなくグループ名だった。ところが2000年代半ば、彼らの音源がファイル共有ソフトを通じて広まる過程で、速めて音程を上げるという加工方法そのものがナイトコアと呼ばれるようになる。2008年前後からYouTubeとニコニコ動画に、任意の曲を同じ方法で加工した動画が大量に投稿され、そこにアニメ調の画像を添える慣習が定着した。この段階で原作者たちの手を完全に離れ、匿名の集合的な運動になった。2010年代には、投稿された動画が数千万回再生されることも珍しくなくなったが、その多くは原曲の権利者にも、使用された絵の作者にも無断であり、削除要請と再投稿のいたちごっこが続いた。2014年頃には、この加工がインターネット上の音楽全般に浸透し、逆方向の操作である遅くする加工と対になって語られるようになる。2020年前後には、この加工を最初から前提に作曲する制作者も現れ、ハイパーポップの高く加工された声の系譜にもつながっている。原作者の二人は後年、自分たちの名前が加工方法の名として使われていることを知り、複雑な心境を語っている。</p>
<h2>代表曲</h2><ul><li>Dam Dadi Doo (Nightcore)</li><li>Angel with a Shotgun (Nightcore)</li><li>Spectre (Nightcore)</li></ul>
