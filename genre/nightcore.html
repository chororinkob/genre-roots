<h1>Nightcore（ナイトコア）とは</h1>
<p>ナイトコアは、既存の曲の再生速度と音程を同時に上げて作る、インターネット発の音楽スタイルだ。 操作は単純だ。元の曲の再生速度を、典型的には25〜35%ほど速める。その結果、音程も4〜5半音ほど（長3度から完全4度ほど）高くなる。 </p>
<p>ナイトコアは、既存の曲の再生速度と音程を同時に上げて作る、インターネット発の音楽スタイルだ。

操作は単純だ。元の曲の再生速度を、典型的には25〜35%ほど速める。その結果、音程も4〜5半音ほど（長3度から完全4度ほど）高くなる。

この加工により、女性の歌声はさらに高く幼く響き、男性の歌声も女性のように聞こえるようになる。曲を明るく（happier／upbeat）する。声が漫画的に響く。

テンポは元の曲によるが、結果として160から180 BPM程度になることが多く、跳ねるような軽さが生まれる。速めるナイトコアは、速度の向きがチョップド・アンド・スクリュードと逆である。

素材はトランス／ユーロダンスが原型で、のちにあらゆるジャンルへ拡大した。

動画にはアニメ調のイラストを添える慣習が広く見られる。聴かれる場は動画共有サイト、TikTok、ゲーム（osu!など）で、作業中や運動中の背景として消費される。</p>
<h2>成り立ち</h2><p>起源は、ノルウェー北部フィンマルク県のアルタにある。時期は2001年（最初の課題）から2002年（Energized）で、本人たちの説明も一定しない。

高校生だったThomas S. NilsenとSteffen Ojala Søderholmの2人組は、Nightcoreという名義で、既存の曲を速くしたリミックスを作っていた。彼らは学校の課題として音楽制作を行い、2002年に『Energized』という自主制作のアルバムを完成させた。このアルバムは、学校課題でDance eJay 3を使って作った、既存のトランス／ユーロダンス曲を速くした13曲入りのリミックス集だ。速める手法は最初の課題制作から用いられ、完成したCDを友人らに配った。

彼らはナイトコアという言葉を、night+core（夜の中心）の意味の自分たちの名前として使っていた。ハードコアに由来する「core」の語尾を含む、という解説もある。つまり本来これはジャンル名ではなくグループ名だった。

ところが、いつ・誰が最初に流通させたかは不明（本人たちも知らない）で、時期は諸説ある。その後、速めて音程を上げるという加工方法そのものがナイトコアと呼ばれるようになる。YouTubeでは2006年ごろから使われ始め、2008年以降にファン制作や公式曲の転載が増えた。Maikel631（2008年開始）はその最初期の投稿者の一人である。この段階で流行の主体は彼らから離れ、匿名の集合的な運動になった。

2010年代には、投稿された動画が数千万回再生されることも珍しくなくなった。一方で、著作権侵害を理由にアカウントが停止される例があった（Nightek1、Maikel631など）。

2017年ごろのslowed and reverbの流行と、2020〜2022年のTikTokでの再流行を中心に、この加工がインターネット上の音楽全般に広がり、逆方向の操作である遅くする加工と対になって語られるようになる。ハイパーポップはナイトコアの影響を受けた（早いテンポと高音加工）。

原作者の2人は後年、自分たちの曲が勝手にネットに出回っていたことに驚いた。その後、名前が広まったことを少し誇らしく感じている。</p>
