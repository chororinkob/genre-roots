<h1>Cha-Cha-Cha（チャチャチャ）とは</h1>
<p>チャチャチャは、1950年代初頭のキューバで生まれた、拍が数えやすく整えられたラテンダンス音楽だ。名称は、踊り手の足がチャ・チャ・チャと3歩を細かく刻む音に由来するとされる。Silver Starの曲のコーラスに由来するという説や</p>
<p>チャチャチャは、1950年代初頭のキューバで生まれた、拍が数えやすく整えられたラテンダンス音楽だ。名称は、踊り手の足がチャ・チャ・チャと3歩を細かく刻む音に由来するとされる。Silver Starの曲のコーラスに由来するという説や、ギロの音に由来するという説など、諸説ある。

編成の原型はチャランガと呼ばれるもので、フルート、複数のヴァイオリン、ピアノ、ベース、そして打楽器のギロ（ギザギザのある楽器を擦って鳴らす）とティンバレスから成る。フルートは高音域で細かく飾りのある旋律を吹き、ヴァイオリン群は短い決まった節を刻む。ティンバレス奏者は小型の高音カウベルで4分音符を刻み、拍をはっきり示す。ギロは、4分音符の長い擦りと8分音符2つの決まった型を繰り返す。のちにコンガを加える楽団もある。

基本は4拍子で、テンポは1分あたりおおむね112〜128拍と、中ぐらいの速さだ。ダンソン・マンボが持っていた複雑なシンコペーション（拍の位置をずらす乗り）を意図的に弱め、拍の位置がはっきり分かるように整理した。この点がいちばんの狙いといえる。

歌は、楽団員全員による斉唱（全員で同じ旋律を歌うこと）で歌われることが多く、これも聴き取りやすさを優先した結果である。歌詞は日常の風景や軽い恋の話題を扱い、ユーモアを含むことが多い。

後にアメリカでは、金管を強調した編曲が広まった。日本でも、歌謡曲に取り入れられた例がある。</p>
<h2>成り立ち</h2><p>チャチャチャは、1951年に作曲され、1953年に録音・発売されたとされる。考案者は、キューバ・ハバナの楽団Orquesta Américaのヴァイオリン奏者で作曲家のEnrique Jorrínとされる。楽団長のNinón Mondéjarとの間で、誰がチャチャチャの発明者としてクレジットされるべきかをめぐる対立があった。

当時流行していたダンソン・マンボは、リズムが複雑で拍の頭が取りにくく、アマチュアの踊り手が音楽についていけないという問題を抱えていた。Jorrínはダンスホールの客を観察し、彼らが特定の箇所でつまずくこと、そして拍が明確なときによく踊れることに気づく。Jorrínはダンソンで団員に短いリフレインを歌わせ、斉唱の手法をすでに持っていた。踊り手がシンコペーションに苦労するのを見て、旋律のシンコペーションを減らした。

踊り手の靴が床を擦るチャ・チャ・チャという3歩の音が名の由来とされるのが一般的だが、Silver Starのコーラスの歌詞に由来するという説や、ギロの音に由来するという説など、諸説ある。1953年に録音・発売された「La Engañadora」が最初のチャチャチャとして広く認められ、これがキューバ全土で爆発的な人気を得た。このスタイルは、フルートとヴァイオリンを擁するチャランガ編成の復権（再び力を持つこと）をもたらし、Orquesta Aragónがその代表格として国際的な人気を集める。

1954年から55年にかけて、チャチャチャは北米とヨーロッパへ渡り、マンボ・ブームの後を継いで社交ダンスの定番となった。Pérez Pradoの「Cherry Pink and Apple Blossom White」は、1953年にメキシコで録音・発売、1955年に米国で10週1位。ジャンルはマンボ／チャチャチャ両説ある。アメリカでは金管を強調した独自の解釈が広まる。その後、国際的な社交ダンスの競技種目に採用され、世界的に広く踊られている。ニューヨークではTito Puenteらがマンボと並行して演奏し、マンボはのちにサルサに吸収されていく。

キューバ本国では、1959年の革命後もチャランガ編成は生き続けた。Los Van Vanのような楽団が、チャランガ編成を土台にトロンボーンやシンセサイザーを加え、現代的なリズムを組み込んでいる。

なお社交ダンスの世界では、チャチャと短縮して呼ばれることが多く、競技ではキューバ音楽以外の曲で踊ることも多い。本来のキューバ式と競技のカウントは同じだが、一部の社交ダンス愛好家の誤ったカウント（ストリート版）によって、拍の取り方がずれることがある。</p>
