<h1>Cha-Cha-Cha（チャチャチャ）とは</h1>
<p>1950年代初頭のキューバで生まれた、拍が数えやすく整えられたラテンダンス音楽。名称は、踊り手の足がチャ・チャ・チャと3歩を細かく刻む音に由来する。基本は4拍子で、テンポは1分あたり110〜130拍程度と中庸である。ダンソン・マン</p>
<p>1950年代初頭のキューバで生まれた、拍が数えやすく整えられたラテンダンス音楽。名称は、踊り手の足がチャ・チャ・チャと3歩を細かく刻む音に由来する。基本は4拍子で、テンポは1分あたり110〜130拍程度と中庸である。ダンソン・マンボが持っていた複雑なシンコペーションを意図的に弱め、拍の位置がはっきり分かるように整理した点が最大の設計思想といえる。編成の原型はチャランガと呼ばれるもので、フルート、複数のヴァイオリン、ピアノ、ベース、そして打楽器のギロとティンバレスから成る。ここではフルートが高音域で細かく装飾的な旋律を吹き、ヴァイオリン群が短い定型句を刻み、ティンバレスの金属胴の側面を叩く乾いた音が拍を明示する。ギロの擦り音が裏拍を埋め、コンガは加えられても控えめである。歌は楽団員全員による斉唱で歌われることが多く、これも聴き取りやすさを優先した結果である。歌詞は日常の風景や軽い恋の話題を扱い、ユーモアを含むことが多い。後にアメリカのビッグバンドや歌謡曲へ取り入れられた際は、金管が加わってより派手な編曲となった。</p>
<h2>成り立ち</h2><p>1951年、キューバ・ハバナの楽団Orquesta Américaのヴァイオリン奏者で作曲家のEnrique Jorrínが考案した。当時流行していたダンソン・マンボは、リズムが複雑で拍の頭が取りにくく、アマチュアの踊り手が音楽についていけないという問題を抱えていた。Jorrínはダンスホールの客を観察し、彼らが特定の箇所でつまずくこと、そして拍が明確なときによく踊れることに気づく。そこで旋律をシンコペーションの少ない形へ書き換え、歌を楽団員の斉唱にして聴き取りやすくした。踊り手の靴が床を擦るチャ・チャ・チャという3歩の音が、そのままジャンル名になったとされる。1953年に発表された「La Engañadora」が最初のチャチャチャとして広く認められ、これがキューバ全土で爆発的な人気を得た。この様式は、フルートとヴァイオリンを擁するチャランガ編成の復権をもたらし、Orquesta Aragónがその代表格として国際的な人気を獲得する。1954年から55年にかけてチャチャチャは北米とヨーロッパへ渡り、マンボ・ブームの後を継いで社交ダンスの定番となった。Pérez Pradoの「Cherry Pink and Apple Blossom White」(1955)は全米1位を10週間維持し、アメリカでは金管を強調した独自の解釈が広まる。その後、国際的な社交ダンスの競技種目としても正式に採用され、ラテンアメリカ音楽の中で最も広く踊られる形式の一つとなった。ニューヨークではTito Puenteらがマンボと並行して演奏し、この語法はやがてサルサの中へ吸収されていく。キューバ本国では1959年の革命後もチャランガ編成は生き続け、Los Van Vanのような楽団がヴァイオリンとフルートを保ったまま現代的なリズムを組み込んでいる。なお社交ダンスの世界ではチャチャと短縮して呼ばれることが多く、本来のキューバの演奏様式とは拍の取り方が異なる点がしばしば指摘される。</p>
<h2>代表曲</h2><ul><li>La Engañadora (Enrique Jorrín)</li><li>Cherry Pink and Apple Blossom White (Perez Prado)</li><li>El Bodeguero (Orquesta Aragón)</li><li>Guantanamera (Celia Cruz)</li><li>Tea for Two Cha Cha (Tommy Dorsey)</li></ul>
