<h1>Vaporwave（ヴェイパーウェーブ）とは</h1>
<p>1980年代から1990年代の商業音楽や企業向け映像音楽を素材とし、それを極端に遅く再生し、加工して提示する電子音楽。中核となる技法は明快で、原曲の再生速度を大幅に落とすことによりピッチ（音の高さ）が下がり、歌声は間延びして正体を</p>
<p>1980年代から1990年代の商業音楽や企業向け映像音楽を素材とし、それを極端に遅く再生し、加工して提示する電子音楽。中核となる技法は明快で、原曲の再生速度を大幅に落とすことによりピッチ（音の高さ）が下がり、歌声は間延びして正体を失い、シンセの音は溶けたように鈍る。そこにリバーブ（残響効果）を深くかけ、音を繰り返すループ処理（同じ部分を繰り返す加工）や、細かく切ってずらす加工を施す。素材として選ばれるのは、スムーズ・ジャズ、シティ・ポップ、1980年代のR&amp;B、そして有名なポップスからショッピングモールや企業ビデオで流れていた無名の環境音楽まで、多くは、企業用BGMのような、気分を整えるための商業音楽だったものである。BPMは原曲次第で幅があり、おおむね60〜90とする解説もあり、明確なリズムより漂う質感が主体になる。曲名・アルバム名には日本語が、ジャケットにはギリシャ彫刻やパソコン画面の図像が用いられ、視覚表現と切り離せないほど結び付く。多くはサンプルの選択と加工が中心だが、ゼロから作る作家もいる。消費社会への批評とも、それへの加担とも読まれてきた作品で、郷愁と空虚さそのものを主題とする、極めて概念的（考え方が中心）な音楽である。</p>
<h2>成り立ち</h2><p>2010年から2012年頃、インターネット上の匿名的な音楽コミュニティから生まれた（2010年のEccojamsを先駆とし、2011年末のFloral Shoppeで形が定まった）。チルウェイヴの皮肉な変種として始まり、2000年代末のヒプナゴジック・ポップ（まどろみの中のような音楽）やポスト・ノイズの流れも受けて生まれた。James Ferraroは、2011年の「Far Side Virtual」で、エレベーター音楽や企業のムード音楽、着信音、初期のコンピューター音を思わせる世界を扱った（本人はヴェイパーウェイヴの歴史の一部とは考えていない）。the Skatersはポスト・ノイズの流れにあたり、ドローン作品も多数発表した。音楽的なひな型の一つとなったのは、Daniel Lopatin（Oneohtrix Point Never）が2010年にChuck Person名義で発表したChuck Person's Eccojams Vol. 1である。翌2011年、Ramona Andra Langley（Vektroid。出生時の名はRamona Andra Xavierとされる）がMacintosh Plus名義で発表したFloral Shoppeが、ジャンルの核が揃った作品として定着し、そのジャケットに描かれたギリシャ彫刻の胸像と日本語のカタカナ表記が視覚言語を固定した。流通はBandcampを中心に、掲示板・SoundCloud・YouTubeなどを通じた無料または少額の配布で、物理媒体にはカセットテープも使われた（Chuck Person's Eccojams Vol. 1は100本限定のカセット）。匿名の名義が次々に生まれては消えるという流動的な生態系を形成した。思想的な背景としては、後期資本主義への皮肉、1990年代のインターネットが約束した未来が実現しなかったことへの失望、そしてショッピングモールという場が衰退したことへの郷愁が繰り返し論じられた。一方で、批評家からは、素材を選んで加工しただけで音楽と呼べるのかという疑問や、見た目が先行して音が追いついていないという指摘がなされた。2012年に注目が集まり、2013年末にはネットミーム（ネットで広まる流行）のように見られ、2010年代半ば以降は「死んだジャンル」とも言われたが、活動は続いた。2012年の注目拡大の直後から、フューチャー・ファンク、モール・ソフト、シグナルウェイヴなどの下位様式が次々に生まれ、美学はファッションやネット文化にも影響した。</p>
