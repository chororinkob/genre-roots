<h1>Vaporwave（ヴェイパーウェーブ）とは</h1>
<p>ヴェイパーウェイヴは、1980年代から1990年代の商業音楽や企業向け映像音楽を素材とし、それを極端に遅く再生して加工し、提示する電子音楽だ。 中核となる技法は明快だ。原曲の再生速度を大幅に減速したことにより、ピッチ（音の高さ）が</p>
<p>ヴェイパーウェイヴは、1980年代から1990年代の商業音楽や企業向け映像音楽を素材とし、それを極端に遅く再生して加工し、提示する電子音楽だ。

中核となる技法は明快だ。原曲の再生速度を大幅に減速したことにより、ピッチ（音の高さ）が下がる。歌声は間延びして正体を失い、シンセの音は溶けたように鈍る。そこに深いリバーブ（残響効果）をかけ、音を繰り返す加工も施す。

素材として選ばれるのは、スムーズ・ジャズ、シティ・ポップ、1980年代のR&amp;Bだ。有名なポップスから、ショッピングモールや企業ビデオで流れていた無名の環境音楽まで、幅広く使われる。素材の多くは、企業用BGMなど機能的な商業音楽だった。

BPMは、おおむね60〜90とする解説もあるが、原曲次第で幅がある。明確なリズムより、漂う質感が主体になる。

曲名・アルバム名には日本語が使われ、ジャケットにはギリシャ彫刻やパソコン画面の図像が用いられる。視覚表現と切り離せないほど、強く結び付いている。

多くはサンプルの選択と加工が中心だが、ゼロから作る作家もいる。この点がこの分野の独特なところだ。主題は郷愁と、空虚さそのものである。消費社会への批評とも、それへの加担とも読まれてきた。極めて、考え方が中心の音楽である。</p>
<h2>成り立ち</h2><p>発祥は2010〜2012年頃とされる。インターネット上の匿名的な音楽コミュニティから生まれた。2010年のEccojamsが先駆となり、2011年末のFloral Shoppeで形が定まった。

この音楽は、チルウェイヴの皮肉な変種として生まれた。ヒプナゴジック・ポップ（まどろみの中のような音楽）やポスト・ノイズの流れも受けている。James Ferraroのソロ作は、消費文化、企業ムード音楽、着信音、初期コンピューター音を扱った（2011年Far Side Virtualなど）。the Skatersは、その前段のポスト・ノイズの流れにあたる。the Skatersはドローン作品も多数発表した。

音楽的なひな型の一つとなったのは、Daniel Lopatin（Oneohtrix Point Never）の作品だ。2010年にChuck Person名義で発表した、Chuck Person's Eccojams Vol. 1である。翌2011年、Ramona Andra Langleyが、Macintosh Plus名義でFloral Shoppeを発表した。出生時の名はRamona Andra Xavierとされる。Vektroidの名義もある。この作品はジャンルの核が揃った作品として定着した。ジャケットに描かれたギリシャ彫刻の胸像と、日本語表記(カタカナ・漢字)が、視覚言語を固定した。

流通はBandcampが中心だった。掲示板、SoundCloud、YouTubeなどを通じて、無料または少額で配られた。物理媒体にはカセットも使われ、Chuck Person's Eccojams Vol. 1は100本限定だった。匿名の名義が次々に生まれては消える、流動的な生態系ができあがった。

思想的な背景としては、後期資本主義への皮肉が繰り返し論じられた。1990年代のインターネットが約束した未来が実現しなかったことへの失望も、論じられた。そして、ショッピングモールを魂のない消費空間とみなす見方も論じられた。

一方で、批評家からは疑問や指摘も出た。素材を選んで加工しただけで音楽と呼べるのか、という疑問があった。皮肉が消費されて、単なる装飾になったという指摘もあった。

実際、2012年に注目が集まり、2013年末には“ネットミーム”視された（ネットで広まる流行）。2010年代半ば以降は“死んだ”とも言われたが、活動は続いた。多くの作家が別のスタイルへ移った。一方、2012年の注目拡大以降、並行してフューチャー・ファンク、モール・ソフト、シグナルウェイヴなど、枝分かれした無数のスタイルが生まれた。そしてインターネット発の美学が、ファッションやネット文化にも影響した。</p>
