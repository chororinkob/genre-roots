<h1>Vaporwave（ヴェイパーウェーブ）とは</h1>
<p>1980年代から1990年代の商業音楽や企業向け映像音楽を素材とし、それを極端に遅く再生し、加工して提示する電子音楽。中核となる技法は明快で、原曲の再生速度を三割から五割ほど落とすことによりピッチが下がり、歌声は間延びして正体を失</p>
<p>1980年代から1990年代の商業音楽や企業向け映像音楽を素材とし、それを極端に遅く再生し、加工して提示する電子音楽。中核となる技法は明快で、原曲の再生速度を三割から五割ほど落とすことによりピッチが下がり、歌声は間延びして正体を失い、シンセの音は溶けたように鈍る。そこにリバーブとコーラス（音を微妙にずらして重ねる効果）を過剰にかけ、時に音を数拍ごとに繰り返して引き伸ばすループ処理を施す。素材として選ばれるのは、スムーズ・ジャズ、シティ・ポップ、1980年代のR&amp;B、そしてショッピングモールや企業ビデオで流れていた無名の環境音楽で、いずれも当時は使い捨ての商品音楽だったものである。BPMは原曲依存で60〜90程度に落ち着き、明確なリズムより漂う質感が主体になる。曲名やアルバム名には日本語やギリシャ彫刻、初期のパソコン画面の図像が用いられ、視覚表現と不可分に結び付く。音楽的な作為を最小限にとどめ、選曲と加工だけで意味を生み出す点が独特で、消費社会への郷愁と批評、そして空虚さそのものを主題とする、極めて概念的な音楽である。</p>
<h2>成り立ち</h2><p>2010年から2012年頃、インターネット上の匿名的な音楽コミュニティから生まれた。直接の前史は2000年代末のヒプナゴジック・ポップと呼ばれる潮流で、James Ferraroやthe Skaters周辺が、幼少期のテレビや広告の記憶を歪んだ音で再現する試みを行っていた。決定的な最初期の作品は、Daniel Lopatin（Oneohtrix Point Never）が2010年にChuck Person名義で発表したChuck Person's Eccojams Vol. 1で、1980年代のポップスを引き伸ばして反復させるという中核技法をほぼ完成させた。翌2011年、Ramona Xavier（Vektroid）がMacintosh Plus名義で発表したFloral Shoppeが、ジャンルの決定版として広く認識され、そのジャケットに描かれたギリシャ彫刻の胸像と日本語のカタカナ表記が視覚言語を固定した。流通はほぼ全てBandcampとインターネット・フォーラムを通じた無料または少額の配布で、物理媒体としてはあえて時代遅れのカセットテープが選ばれた。作品は数百枚単位の限定生産で、匿名の名義が次々に生まれては消えるという流動的な生態系を形成した。思想的な背景としては、後期資本主義への皮肉、1990年代のインターネットが約束した未来が実現しなかったことへの失望、そしてショッピングモールという場が衰退したことへの郷愁が繰り返し論じられた。一方で、批評家からは、素材を選んで加工しただけで音楽と呼べるのかという疑問、著作権処理の不明瞭さ、そして皮肉が消費されて単なる装飾になったという指摘がなされた。実際、2013年前後には流行が一巡し、当事者の多くが終わったと宣言したが、その後もフューチャー・ファンク、モール・ソフト、シグナルウェイヴなど無数の下位様式に分岐して存続し、インターネット発の美学が音楽を超えて視覚文化全般に影響を与えた稀な例となっている。</p>
<h2>代表曲</h2><ul><li>リサフランク420 / 現代のコンピュー (Macintosh Plus)</li><li>Hit Vibes (SAINT PEPSI)</li><li>Teen Pregnancy (Blank Banshee)</li><li>Nobody Here (Oneohtrix Point Never)</li></ul>
