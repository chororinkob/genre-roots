<h1>Turkish Pop（トルコポップ）とは</h1>
<p>トルコで作られる大衆音楽の総称であり、西洋のポップスの構造と、この土地固有の旋律と拍節が混ざり合っている点に特徴がある。旋律には、オスマン帝国以来の古典音楽で用いられてきた旋法体系が生きており、増二度を含む音階や、四分音に近い微細</p>
<p>トルコで作られる大衆音楽の総称であり、西洋のポップスの構造と、この土地固有の旋律と拍節が混ざり合っている点に特徴がある。旋律には、オスマン帝国以来の古典音楽で用いられてきた旋法体系が生きており、増二度を含む音階や、四分音に近い微細な音程が現れる。この、西洋の長短調では説明できない音の運びが、明るい編曲の中にも独特の哀感をもたらす。歌唱では一音を細かく揺らして装飾する技法が多用され、感情を大きく揺さぶる歌い上げが好まれる。リズムには、二拍と三拍を組み合わせた不均等な拍節が用いられることがあり、9/8拍子を二二二三と数える型は特に頻繁に現れる。この足を引きずるような独特の躍動は、踊りと直結している。楽器では、シンセサイザーと打ち込みの現代的な土台の上に、長い棹の撥弦楽器バーラマ、逆円錐形の片面太鼓ダルブカ、そして時に管楽器や大人数の弦楽合奏が重ねられる。この、電子音と伝統楽器を同じ平面に並べる配合こそが、この分野の音の指紋である。歌詞は恋愛、別れ、都会での孤独、そして時に社会的な主題を扱い、詩的な比喩が重んじられる。</p>
<h2>成り立ち</h2><p>1923年に成立したトルコ共和国は、建国者Mustafa Kemal Atatürkのもとで徹底した西洋化政策を採り、オスマン以来の古典音楽は一時ラジオ放送から締め出された。国家は西洋の多声音楽を国民に教育しようとしたが、人々は隣国からの放送でアラブ音楽を聴き続けた。この上からの近代化と、下からの土着の嗜好とのねじれが、この国のポップスの通奏低音となる。1960年代には、西洋のヒット曲にトルコ語の歌詞を付けて歌う様式が流行し、Ajda Pekkanらが人気を得た。同時期、Barış Mançoらは西洋のロックに土着の楽器と旋法を持ち込むアナドル・ロックを試みている。1970年代、農村から大都市への大規模な人口移動が起こると、都市の周縁に住み着いた人々の情感を代弁する音楽が生まれた。Orhan Gencebayを代表とするこの様式は、運命への諦念と嘆きを歌い、乗り合いバスや安食堂で鳴り響いたが、国家からは後進的で敗北主義的だとして長く放送を制限された。1980年の軍事クーデター後、経済の自由化が進み、1990年代に民間放送が解禁されると、音楽産業は一気に拡大する。この時代の中心にいたのがSezen Aksuである。彼女は自ら歌うだけでなく、無数の若い歌手に楽曲を書き、育成し、トルコ的な旋律と現代的な編曲を結合させる方法を確立した。彼女が育てたTarkanは、1997年に発表した楽曲が世界的なヒットとなり、トルコのポップスが初めて国際市場で成功した例となる。2003年にはSertab Erenerが欧州の歌謡祭典で優勝し、国民的な祝賀となった。近年は、伝統的な旋法とヒップホップやトラップを結合させる若い世代が現れ、また移民として欧州に暮らすトルコ系の作り手が独自の潮流を形成している。一方で、表現の自由をめぐる状況は厳しく、歌詞や発言を理由に法的な追及を受ける音楽家も出ており、Sezen Aksu自身も歌詞をめぐって政治的な非難の対象となったことがある。</p>
