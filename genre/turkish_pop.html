<h1>Turkish Pop（トルコポップ）とは</h1>
<p>トルコで作られる大衆音楽を、まとめて呼ぶ名前だ。西洋のポップスの組み立てに、この土地独自のメロディーと拍の取り方が混ざり合っている点に特徴がある。 楽器では、シンセサイザーと打ち込みによる現代的な土台の上に、伝統楽器が重ねられる。</p>
<p>トルコで作られる大衆音楽を、まとめて呼ぶ名前だ。西洋のポップスの組み立てに、この土地独自のメロディーと拍の取り方が混ざり合っている点に特徴がある。

楽器では、シンセサイザーと打ち込みによる現代的な土台の上に、伝統楽器が重ねられる。長い棹を持ち、弦をはじいて鳴らす楽器バーラマ、杯の形をした片面の太鼓ダルブカ、そして時には管楽器や大人数の弦楽合奏も加わる。この、電子音と伝統楽器を同じ並びに置く組み合わせは、音の特徴の一つである。

メロディーには、オスマン帝国の時代から古典音楽で使われてきた旋法の仕組みが生きている。増2度を含む音階や、四分音に近いごく細かな音程が現れる(トルコの理論ではオクターブを53のコンマに分けて測る)。西洋の長調・短調では説明できないこの音の運びが、明るい編曲の中にも独特の哀しさを生む。

リズムでは、2拍と3拍を組み合わせた不均等な拍の取り方が使われることがある。9/8拍子を二二二三と数える型は、トルコの民俗音楽や舞曲の典型で、ポップスにも使われることがある。足を引きずるようなこの独特の躍動は、踊りと直結している。

歌では、装飾的な歌い方と、感情を大きく揺さぶる歌い上げが好まれる。

歌詞は、恋愛、別れ、都会での孤独、そして時には社会的なテーマを扱う。詩的なたとえが大切にされる。</p>
<h2>成り立ち</h2><p>1923年、トルコ共和国が成立した。建国者Mustafa Kemal Atatürkのもとで、国は徹底した西洋化を進めた。オスマン以来の古典音楽は、一時ラジオ放送から締め出された。ただし、これはMustafa Kemal Atatürkの発言が誤解された結果で、全面禁止の意図ではなかったとも伝えられる。

国家は、西洋の多声音楽を国民に教えようとした。しかし、1934〜36年にトルコ国内のラジオで古典音楽が禁じられた間、人々はカイロなど国外のアラビア語ラジオ、アラブ映画、レコードに向かった。上からの近代化と、下からの土着の好みとのねじれは、この国のポップスの底をずっと流れ続けることになる。

1960年代には、西洋のヒット曲にトルコ語の歌詞を付けて歌うスタイルが流行し、Ajda Pekkanらが人気を得た。同じころ、Barış Mançoらは、西洋のロックに土着の楽器と旋法を持ち込むアナドル・ロックを試みている。

一方、1950年代からは、農村から大都市への大規模な人口移動が続いていた。その中で、都市の周縁に住み着いた人々の思いを代弁する音楽(アラベスク)が、1960年代後半〜70年代にOrhan Gencebayらによって広く知られるようになった。起源には1940年代説もあり、定まっていない。

Orhan Gencebay(本人はこの呼び名を拒否している)を代表的な歌手の一人とするこのスタイルは、運命へのあきらめと嘆きを歌った。乗り合いバスやタクシー、酒場で鳴り響いたが、国営の放送では長く放送を制限された。

1980年1月の経済安定化措置を起点に、同じ年の軍事クーデターの後も、経済の自由化は進んだ。1990年代前半には国営放送の独占が終わり、民間放送が急増した。

この時代の中心にいたのがSezen Aksuである。彼女は自ら歌うだけでなく、多くの若手に曲を書いて育て、トルコ的な旋律と現代的な編曲を結びつける方法を築いた。Tarkanが1997年にトルコで発表した「Şımarık」は、Sezen Aksuが作詞し、のちに作曲もAksuと認められた曲だ。この曲は1998〜99年に欧州でヒットし、トルコ語で歌うポップスの代表的な国際的成功例となった。2003年には、Sertab Erenerが欧州の歌謡祭典で優勝し、トルコ初の優勝として注目された。

近年は、Ezhelなど、トルコのヒップホップやトラップの担い手が現れた。また、移民として欧州に暮らすトルコ系の作り手が、独自の流れを生み出している。

それでも、表現の自由をめぐる状況は厳しい。歌詞や発言を理由に、法的な追及を受ける音楽家も出ている。Sezen Aksu自身も、歌詞をめぐって政治的な非難の的になったことがある。</p>
