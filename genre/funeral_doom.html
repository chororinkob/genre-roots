<h1>Funeral Doom（フューネラルドゥーム）とは</h1>
<p>フューネラル・ドゥームは、葬送の行進を思わせる極端な遅さと、圧倒的な重さ、そして悲嘆を追い求めたヘヴィメタルだ。 ギターは極端に低く調弦される。和音を鳴らして長く伸ばし、同じ音型を何小節も繰り返す。 旋律は乏しい。和声は短調の和音</p>
<p>フューネラル・ドゥームは、葬送の行進を思わせる極端な遅さと、圧倒的な重さ、そして悲嘆を追い求めたヘヴィメタルだ。

ギターは極端に低く調弦される。和音を鳴らして長く伸ばし、同じ音型を何小節も繰り返す。

旋律は乏しい。和声は短調の和音を長く保ち、陰鬱で濁った響きを生む。

この音楽を特徴づけるのは、鍵盤楽器の使い方だ。パイプオルガンを模した音色が典型で、ベース・ペダル（足で弾く低音の鍵盤）付きのキーボードやシンセサイザーも使われる。これらが、荘厳さと陰鬱さを同時にもたらす。

テンポは極端に遅く、20〜50 BPM前後だ。一つの和音が鳴ってから次へ移るまでに、数秒かかることもある。この時間の引き延ばしによって、聴き手は音楽が進んでいるという感覚を失い、時間そのものに閉じ込められる。ドラムは一打ごとに深く沈み、シンバルの余韻が長く残る。

ヴォーカルは、喉の奥から絞り出す極めて低い咆哮で、言葉はほとんど聞き分けられない。時には、嘆くような詠唱や、清らかな女性の歌声が対比として置かれる。

歌詞は、死、喪失、宇宙的な虚無、そして永遠に続く時間を扱う。

曲は長くなりやすい。ただし、始まったころの作品には、6曲で計40分ほどのものもある。</p>
<h2>成り立ち</h2><p>1990年代前半、当時のデスメタルは高速化・複雑化していた。その流れに対し、正反対の方向を選んだ一群が現れた。発祥の地はフィンランド（Thergothon、Skepticism、Unholy）で、のちに各国へ広がった。

1990年に結成されたThergothonは、極端に遅く重い演奏と、耳を圧するような低い咆哮を組み合わせた音源を残した。1991年のデモと、1994年に発表された唯一のスタジオ・アルバムは、この分野の先駆けの一つとされている。ただしバンドは、アルバムの発表を待たずに解散しており、活動期間はわずか数年だった。

同じフィンランドのSkepticismは、1991年に結成された。ベース・ペダル（足で弾く低音の鍵盤）付きのキーボードによるオルガンのような音を軸に、葬儀を思わせる音を作り上げた。このオルガン主体の音は、1995年のデビュー作より前のデモ『Aeothe Kaear』で初めて聴ける。バンド自身は、このデモの評で初めて「Funeral Doom」と呼ばれたと述べている。ただし、この呼び名の由来には諸説ある。彼らはステージでは黒いスーツ姿で、歌手はテールコートを着る（ドラマーは普段着）。

ほかの国では、イギリスのEsotericが、より長大で幻覚的な構成を追い求めた。アメリカ・ニュージャージーのEvokenは、重さと絶望を突き詰めた。オーストラリアのMournful Congregationは、旋律的な悲嘆を前面に出す独自の方向を示している。

この分野が扱う主題は、喪失・死・虚無などが多い。それは形式そのものに表れている。聴き手を退屈させる危険を冒してまで遅さを保つことは、悲しみがすぐには消えないという事実を、音楽で表したものだと解釈できる。

商業規模は小さく、小規模なレーベルが中心だ。それでも熱心な聴き手は世界中におり、小さなレーベルが作品を出し続けている。

2017年、アメリカ・シアトルのBell Witchが、一枚のアルバムを83分の1つの曲として組み立てた『Mirror Reaper』を発表した(単一の曲なのはデジタル版で、CDやLPでは分割されている)。この作品は、2016年に亡くなった元ドラマーへの追悼として作られた。その事実を知って聴くと、この分野の遅さが単なるスタイルではなく、悲しみが続くことそのものだと分かる。</p>
<h2>代表曲</h2><ul><li>Mirror Reaper (Bell Witch)</li><li>Below the Sun (Ahab)</li><li>Everlasting (Thergothon)</li><li>Antithesis of Light (Evoken)</li><li>The Monad of Creation (Mournful Congregation)</li><li>The Pacific (Ahab)</li><li>Crying Blood &amp; Crimson Snow (Thergothon)</li><li>The Organium (Skepticism)</li><li>The Gallant Crow (Skepticism)</li><li>Nothing (Skepticism)</li><li>Lauds (Evoken)</li><li>The March and the Stream (Skepticism)</li></ul>
