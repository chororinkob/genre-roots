<h1>Funeral Doom（フューネラルドゥーム）とは</h1>
<p>葬送の行進を思わせる極端な遅さと、圧倒的な重さと悲嘆を追求したヘヴィメタルである。テンポは概ね毎分20から40打で、これは人が歩く速度よりも遅く、一つの和音が鳴ってから次へ移るまでに数秒を要する。この時間の引き延ばしによって、聴き</p>
<p>葬送の行進を思わせる極端な遅さと、圧倒的な重さと悲嘆を追求したヘヴィメタルである。テンポは概ね毎分20から40打で、これは人が歩く速度よりも遅く、一つの和音が鳴ってから次へ移るまでに数秒を要する。この時間の引き延ばしによって、聴き手は音楽が進行しているという感覚を失い、時間そのものに閉じ込められる。ギターは極端に低く調弦され、和音を鳴らして長く伸ばし、同じ音型を何十小節も繰り返す。旋律らしい旋律は存在せず、和声も短二度や増四度といった不協和な響きを含んで濁る。この分野を特徴づけるのが鍵盤楽器の用い方で、教会のパイプオルガンやそれを模した音色、あるいは足踏み式のリード・オルガンが用いられ、荘厳と陰鬱を同時にもたらす。ドラムは一打ごとに深く沈み、シンバルの余韻が長く残る。ヴォーカルは喉の奥から絞り出す極めて低い咆哮で、言葉はほとんど判別できず、時に嘆きの詠唱や清らかな女性の歌声が対比として置かれる。曲は15分から30分に及び、一枚のアルバムに三曲しか収められないこともある。歌詞は死、喪失、宇宙的な虚無、そして時間の永劫を扱う。</p>
<h2>成り立ち</h2><p>1990年代前半、北欧を中心にエクストリームメタルが速度を競っていた時期に、正反対の方向を選んだ一群が現れた。中心地となったのはフィンランドである。1990年に結成されたThergothonは、極端に遅く重い演奏と、耳を圧する低い咆哮を組み合わせた音源を残し、1994年に発表された唯一の作品がこの分野の出発点とされている。彼らはその発表を待たずに解散しており、活動期間はわずか数年だった。同じフィンランドのSkepticismは1991年に結成され、1995年の作品で足踏み式のオルガンを全面的に導入することによって、葬儀そのものの音を作り上げた。彼らは公演の際に喪服を着用し、舞台に花を飾るという演出を貫いている。イギリスのEsotericは、より長大で幻覚的な構成を追求し、アメリカ・ニュージャージーのEvokenは重さと絶望を突き詰めた。オーストラリアのMournful Congregationは、旋律的な悲嘆を前面に出す独自の方向を示している。この分野が扱う主題は一貫して喪失と死であり、それは形式そのものに反映されている。すなわち、聴き手を退屈させる危険を冒してまで遅さを維持することは、悲しみが即座に解消されないという事実の音楽的な表現だと理解されてきた。商業的な成功とはおよそ無縁で、多くの作品は数百枚から数千枚の規模でしか流通しない。しかし熱心な聴き手は世界中に存在し、小規模なレーベルが継続的に作品を発表している。2017年、アメリカ・シアトルのBell Witchが、一枚のアルバムを83分の単一の楽曲として構成した作品を発表した。この作品は、直前に亡くなった元構成員への追悼として作られており、その事実を知って聴くとき、この分野の遅さが単なる様式ではなく、悲嘆の持続そのものであることが明らかになる。</p>
<h2>代表曲</h2><ul><li>The March and the Stream (Thergothon)</li><li>The Gallant Crow (Skepticism)</li><li>Below the Sun (Ahab)</li><li>The Monad of Creation (Mournful Congregation)</li><li>Mirror Reaper (Bell Witch)</li></ul>
