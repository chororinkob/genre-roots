<h1>New Beat（ニュービート）とは</h1>
<p>1980年代末のベルギーで生まれた、極端に遅く、重いダンス音楽だ。 いちばんの特徴はテンポである。おおむね90から120 BPMで、当時のダンス音楽としては異様に遅い。この遅さのために、一打ごとの重みが増す。体は跳ねるのではなく、</p>
<p>1980年代末のベルギーで生まれた、極端に遅く、重いダンス音楽だ。

いちばんの特徴はテンポである。おおむね90から120 BPMで、当時のダンス音楽としては異様に遅い。この遅さのために、一打ごとの重みが増す。体は跳ねるのではなく、ゆっくりと押し込まれるように動く。

音の材料の中心は、エレクトロニック・ボディ・ミュージックと呼ばれる、西ヨーロッパ(西ドイツ・ベルギーなど)生まれの硬い電子音楽だ。ニュー・ウェイヴやHi-NRG、ヒップホップ、アシッドハウスなどからも借りている。曲は暗く反復的で、遅いテンポと重い低音を使う。

低音は自動演奏装置で正確にくり返され、そのしつこさが催眠のような効果を生む。象の鳴き声のようなおどけたサンプルや、東洋風の音色が使われることもある。曲の雰囲気は、陽気で祝祭的なものから性的なものまで幅がある。

声は歌われるより、加工された語りや機械的な発声、そして映画の台詞、時事ニュースの音声、スローガン的な掛け声として現れる。そこには、しばしば猥雑さと滑稽さが同居する。一部のグループは性的な題材を扱った。

曲の作りはくり返しが中心で、展開はほとんどない。踊るための実用性より、集団で同じ動きを繰り返すという、儀式のような性格が強い音楽である。</p>
<h2>成り立ち</h2><p>生まれたときのエピソードが、この分野の性格をいちばんよく表している。

1987年頃、アントウェルペンのクラブAncienne Belgiqueでのことだ。DJのDikke Ronnyが、本来は毎分45回転で再生するA Split-Secondの「Flesh」を、毎分33回転で、しかも音程を上げる装置を+8にして流した。すると、その遅く重い響きが客に熱狂的に受け入れられた、とする説がある。

ただし、起源がどのDJの、どの曲なのかには諸説ある。ゲント近郊のクラブBoccaccioで、Marc Groulsが「Flesh」を33回転で流したとする説がある。ブリュッセルのMiranoで、Jean-Claude Mauryが最初に「Flesh」を45回転から33回転に落とし、+8にしたとする説もある。Ronny本人は、事故で遅く流した曲はFad Gadgetの「Coitus Interruptus」だったと語っている。また、ブリュッセルのDJたちが、先に遅い回転で回していたという発言もある。発祥年にも、1986年説と1987年説がある。この偶然が、意図的なスタイルとして定着したとされる。

土台は、すでにあった。ベルギーは1980年代を通じて、Front 242に代表されるエレクトロニック・ボディ・ミュージックの、ドイツと並ぶ中心地だった。加えて、この国には大規模なクラブがいくつもあった、という事情もある。

1988年から1989年にかけて、このスタイルは爆発的に流行した。Confetti'sの「The Sound of C」(1988年)のような曲が、全国的なヒットになった。Praga Khanが関わったLords of Acidは、1988年(ベルギー盤。1989年とする説もある)にニュービートのシングル「I Sit on Acid」でデビューした。1991年の『Lust』で、性的な内容を露骨に扱う作品として知られるようになる。Antler-Subwayをはじめとするレーベルが、数多くの新譜を送り出した。

しかし、この急成長がそのまま崩壊を招く。制作が簡単だったため、質を問わない作品が大量に市場へ出回り、およそ2〜3年で下火になった。後期には、型にはまった作風が「nougat beat」と呼ばれるようになる。ベルギーの音楽業界は、向きを変えざるをえなくなった。

その転換先が、より速く硬いテクノとハードコアだった。ゲントに1983年(1984年とする説もある)に設立されたR&amp;S Recordsは、ニュービート期にもリリースを重ねていた。そして90年代初頭に、この転換期に注目を集めた複数のベルギーのレーベル(Music Manなど)のひとつとして、国際的なテクノの中心地のひとつとなった。T99の「Anasthasia」(1991年)は、英国やオランダなどでヒットした。

つまり、ベルギーが1990年代のハードコアとレイヴ音楽の主な送り出し元になった背景には、ニュービートのスタイルや制作者がテクノやハードコアへつながったことがあった。近年では、当時の遅く重い質感が再評価されている。</p>
