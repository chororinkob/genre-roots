<h1>New Beat（ニュービート）とは</h1>
<p>1980年代末のベルギーで生まれた、極端に遅く、重く、そして不吉なダンス音楽である。最大の特徴はテンポで、概ね90から115 BPMと、当時のダンス音楽としては異様に遅い。この遅さのために、一打ごとの重量が増し、身体は跳ねるのでは</p>
<p>1980年代末のベルギーで生まれた、極端に遅く、重く、そして不吉なダンス音楽である。最大の特徴はテンポで、概ね90から115 BPMと、当時のダンス音楽としては異様に遅い。この遅さのために、一打ごとの重量が増し、身体は跳ねるのではなくゆっくりと押し込まれるように動く。音の材料はエレクトロニック・ボディ・ミュージックと呼ばれるベルギー発の硬質な電子音楽から借りられており、金属を打つ音を模した打楽器、順次進行する低音の音型、そして工場を思わせる機械音が用いられる。低音は自動演奏装置によって正確に反復され、その執拗さが催眠的な効果を生む。上物は極端に少なく、不吉な短調の和音がひとつ、あるいは金属的な単音が置かれる程度である。この余白の多さが、暗く不安な空気を作る。声は歌われるより、加工された語り、機械的な発声、そして映画や成人向け作品から抜き出した喘ぎ声や台詞の断片として現れ、しばしば猥雑さと滑稽さが同居する。曲の構造は反復を基調とし、展開はほとんどない。踊るための実用性より、集団で同じ動きを繰り返すという儀式的な性格が強い音楽である。</p>
<h2>成り立ち</h2><p>誕生の逸話がこの分野の性格を最もよく物語っている。1987年頃、ベルギー東部の巨大なクラブで、あるDJが毎分45回転で再生すべきレコードを、誤って毎分33回転で、しかも音程を上げる装置を使って流したところ、その遅く重い響きが客に熱狂的に受け入れられた。この偶然が、意図的な様式として定着したとされる。土壌は既にあった。ベルギーは1980年代を通じて、Front 242に代表されるエレクトロニック・ボディ・ミュージックの世界的な生産地であり、硬質な電子音を扱う制作者と機材が国内に蓄積されていた。加えて、この国には巨大なクラブが多数存在し、数千人が集まる催しが日常的に開かれていたという特殊な事情もある。1988年から1989年にかけて、この様式は爆発的に流行した。Confetti'sのような楽曲が全国的なヒットとなり、Praga Khanが関わったLords of Acidが、性的な内容を露骨に扱う作品で国際的な悪名を得る。Antler-Subwayをはじめとするレーベルが、毎週のように新譜を送り出した。しかしこの急成長がそのまま崩壊を招く。制作が容易であったため、質を問わない作品が大量に市場へ投入され、わずか二年で聴き手が離れてしまった。1990年頃には呼称自体が嘲笑の対象となり、ベルギーの音楽産業は方向転換を迫られる。その転換先が、より速く硬いテクノとハードコアだった。ゲントに設立されたR&amp;S Recordsは、この転換を主導して国際的なテクノの中心地のひとつとなり、T99のような作品がヨーロッパ全土のレイヴを席巻した。つまりベルギーが1990年代のハードコアとレイヴ音楽の主要な供給地となった背景には、この短命な流行で蓄積された制作の技術と機材があったのである。近年では、当時の遅く重い質感が再評価され、若い制作者によって参照され直している。</p>
