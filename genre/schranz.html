<h1>Schranz（シュランツ）とは</h1>
<p>ドイツで生まれた、極端に硬く工業的なテクノの一系統。名称は歪んだ音を表す語で、その通り音のつぶれ方が、そのままこのジャンルの定義になっている。中心はキックで、ディストーションとコンプレッションを何段も重ねて低域よりも中域が目立つ状</p>
<p>ドイツで生まれた、極端に硬く工業的なテクノの一系統。名称は歪んだ音を表す語で、その通り音のつぶれ方が、そのままこのジャンルの定義になっている。中心はキックで、ディストーションとコンプレッションを何段も重ねて低域よりも中域が目立つ状態まで加工され、木材を殴りつけるような打撃音になる。テンポは140〜160BPM。リズムの組み立ては純粋な四つ打ちだが、キックの裏に置かれた歪んだハイハットやループしたパーカッションが、休みなく前へ押す力を作る。もう一つの特徴が、短いループ素材の多用である。1小節あるいは2小節の打楽器の断片を切り出し、それをフィルターやピッチを変えながら延々と重ねていく手法が中心で、メロディーや和音は控えめである。上に重ねる音は金属を打つ音、機械の駆動音、サイレン、加工された叫び声といった音楽らしくない素材が中心になる。展開はフィルターの開閉と、要素の抜き差しだけで作られ、ブレイクダウンはあっても少なく、静かな部分にはメロディや声のサンプルが入ることもあり、そこからキックを戻す。この音楽は大型のクラブや野外の舞台で、極めて大きな音量で再生されることを前提としており、身体への物理的な打撃そのものが体験の中心になる。ハードテクノの中でも最も乾いていて、旋律的な要素を最小限に抑えた位置にある。</p>
<h2>成り立ち</h2><p>1990年代のドイツで生まれた。名称は、1994年にChris LiebingとフランクフルトのDJ Toeがレコード店BOY Recordsで広めたとされる。Liebing本人は、友人が叫んだ「schreddern(細断する)」と同じ意味の言葉としてschranzenが生まれたと説明しており、「Schrei(叫び)＋Tanz(踊り)」という説もある。Liebing自身は、特定の速さや硬さを指すつもりはなかったと述べている。Liebingはこの語を広めた中心人物で、ギーセンの出身である。1990年にギーセン周辺でDJを始め、1994年に地元で自分のクラブSpinclubを開いた。フランクフルトのクラブOmenには、代役出演をきっかけに定期的に出演するようになり、1998年の閉店まで続けた。1996年に最初のレーベルAudio(Fine Audio Recordings)を設立したが、1999年春に閉鎖され、同年に別のレーベルCLRを設立した。2000年代にはドイツのシーンでArkus P.、Marco Remus、Frank Kvitta、Sven Wittekind、Robert Natusらが活動し、高速で硬いテクノを発表した。Arkus P.の初のレコードは2001年、Sven WittekindはDJを1999年に始め、初のシングルは2002年だった。制作技術の面では、1990年代後半にパソコンでのサンプル編集が一般化したことが大きい。既存のテクノやハードコアのレコードから打楽器の断片を切り出し、それを潰して重ねるという手法が、安い機材でできるようになった。この結果、旋律を作曲する能力がなくても強度の高いトラックを量産できるようになり、大量のレコードが地下流通した。文化面では、ドイツの大型の催し、とりわけ野外のNature One(1995年開始で、第1回は空港、1996年から旧ミサイル基地跡地で開催)や、屋内のMayday(1991年開始)が主要な発表の場となった。Maydayは約12時間にわたり、1万5千〜3万人規模、Nature Oneは数日間の週末開催である。2000年代前半が最盛期で、ドイツ国内では商業的にも大きな市場を形成したが、国外での評価は限定的だった。とりわけイギリスやアメリカの批評家からは、単調で暴力的なだけの音楽として軽視されることが多く、ミニマル・テクノの洗練が国際的に評価されていた時期には、シュランツはドイツ国内の低俗な流行という扱いを受けた。この評価の非対称性はドイツ国内でも議論になった。2000年代半ばにミニマルの流行が押し寄せると、シュランツは急速に退潮し、多くの制作者が活動を縮小した。しかし完全には消えなかった。2018年前後からのハードテクノの世界的復興に伴い、当時のシュランツのレコードが再評価され、若い制作者が当時の手法を意識的に引用する動きが起きている。Chris Liebingはその後よりミニマルで実験的な方向へ転じたが、シュランツの名を定着させた人物として今も参照される。</p>
