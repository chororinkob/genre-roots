<h1>Schranz（シュランツ）とは</h1>
<p>シュランツは、ドイツで生まれた、極端に硬く工業的なテクノの一系統だ。名前は、当初は歪んで汚れた音を指す呼び名だった。それが後に、一つのジャンル名として定着した。 中心になるのはキックだ。ディストーションとコンプレッションを何段も重</p>
<p>シュランツは、ドイツで生まれた、極端に硬く工業的なテクノの一系統だ。名前は、当初は歪んで汚れた音を指す呼び名だった。それが後に、一つのジャンル名として定着した。

中心になるのはキックだ。ディストーションとコンプレッションを何段も重ね、低い音よりも中くらいの高さの音が目立つところまで加工する。その結果、木材を殴りつけるような打撃音になる。

上に重ねる音も、音楽らしくない素材が中心になる。金属を打つ音や機械の駆動音などだ。メロディーや和音は控えめである。

テンポはおおむね140〜160BPMだ。リズムの組み立ては四つ打ちである。反復する歪んだパーカッション・ループが、休みなく前へ押す力を生む。

もう一つの特徴は、短いループ素材を多く使うことだ。打楽器の断片を切り出し、フィルターやピッチを変えながら延々と重ねていく。この手法が中心になっている。

曲の展開は、フィルターの開け閉めと、音の要素の抜き差しだけで作られる。静かなブレイクダウンには、メロディや声のサンプルが入ることもあり、そこから再びキックを戻す。

この音楽は、大型のクラブや野外の舞台で、極めて大きな音量で流されることが多い。体に物理的に打ちつけられる音そのものが、体験の中心になる。後のハードテクノの源流にあたる、最も旋律の少ないスタイルである。</p>
<h2>成り立ち</h2><p>シュランツは、1990年代のドイツで生まれた。名前は、1994年にChris LiebingとフランクフルトのDJ Toeが、レコード店BOY Recordsで広めたとされる。ただし、1997〜99年のラジオ番組説もあり、2つの説が併存する。

Liebing本人は、友人が突然叫んだ「schranzen」が、Liebingが以前から使っていた「schreddern(細断する)」と同じ意味の言葉として生まれたと説明している。一方で、「Schrei(叫び)＋Tanz(踊り)」という説もある。Liebing自身は、特定の速さや硬さを指すつもりはなかったと述べている。

Liebingは、この語を広めた中心人物で、ギーセンの出身だ。1990年にギーセン周辺でDJを始め、1994年には地元に自分のクラブSpinclubを開いた。フランクフルトのクラブOmenには、代役での出演をきっかけに定期的に出るようになり、1998年に店が閉まるまで続けた。

1996年には、レーベルAudioを設立した。1999年にはMichael BurkatがAudioを引き継ぎ、Fine Audio Recordingsと名前を改めた。同じ年、LiebingはCLRを立ち上げた。

2000年代には、ドイツのシーンでArkus P.、Marco Remus、Frank Kvitta、Sven Wittekind、Robert Natusらが活動し、速くて硬いテクノを発表した。Arkus P.の初のレコードは2001年だ。Sven WittekindはDJを1999年に始め、初のシングルを2002年に出した。

制作の技術の面では、1990年代後半に、パソコンでのサンプル編集が広まったことが大きいとも言われる。既存のテクノやハードコアのレコードから打楽器の断片を切り出し、潰して重ねる。この手法が、安い機材でできるようになった。その結果、強度の高いトラックを大量に作れるようになったとも言われる。大量のレコードが、地下のルートで出回った。

文化の面では、ドイツの大型の催しが主な発表の場になった。とりわけ、野外のNature One(1995年開始で、第1回は空港、1996年から旧ミサイル基地跡地で開催)と、屋内のMayday(1991年開始)である。Maydayは近年は11〜14時間程度にわたって開かれ、規模は1万5千〜3万人だ。Nature Oneは、数日間の週末に開かれる。

最盛期は2000〜2008年頃だ。ドイツ国内では、商業的にも大きな市場ができた。一方で、シュランツは単調と受け取られやすい。

やがてシュランツは、2008年以降に後退し、ハードテクノの部屋の中で生き残った。

2018〜2020年にベルリンで始まったハードテクノの復興は、2020年前後に世界に広まった。それに伴い、当時のシュランツのレコードが見直され、若い作り手が当時の手法を意識して引用する動きが起きている。Chris Liebingはその後、よりミニマルで実験的な方向へ進んだ。それでも、シュランツの名前を定着させた人物として、今も名前が挙がる。</p>
