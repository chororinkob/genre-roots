<h1>Schranz（シュランツ）とは</h1>
<p>ドイツで生まれた、極端に硬く工業的なテクノの一系統。名称は歪んだ音を表す造語とされ、その通り音色の潰れかたが定義そのものになっている。中核はキックで、ディストーションとコンプレッションを何段も重ねて低域よりも中域が目立つ状態まで加</p>
<p>ドイツで生まれた、極端に硬く工業的なテクノの一系統。名称は歪んだ音を表す造語とされ、その通り音色の潰れかたが定義そのものになっている。中核はキックで、ディストーションとコンプレッションを何段も重ねて低域よりも中域が目立つ状態まで加工され、木材を殴りつけるような打撃音になる。テンポは140〜160BPM。リズム構造は純粋な四つ打ちだが、キックの裏に置かれた歪んだハイハットやループしたパーカッションが、休みなく前へ押す圧力を作る。もう一つの特徴が、短いループ素材の多用である。1小節あるいは2小節の打楽器の断片を切り出し、それをフィルターやピッチを変えながら延々と重ねていく手法が中心で、旋律や和声は事実上存在しない。上物は金属を打つ音、機械の駆動音、サイレン、加工された叫び声といった非音楽的な素材のみ。展開はフィルターの開閉と、要素の抜き差しだけで作られ、ブレイクでは打楽器を全て止めてノイズと残響のみを残し、そこからキックを戻す。曲は6分から8分。この音楽は大型のクラブや野外の舞台で、極めて大きな音量で再生されることを前提としており、身体への物理的な打撃そのものが体験の中心になる。ハードテクノの中でも最も乾いていて、旋律的な要素を徹底的に排除した位置にある。</p>
<h2>成り立ち</h2><p>1990年代後半のドイツで成立した。名称の起源については諸説あり、フランクフルトのDJたちが使い始めた俗語で、ドイツ語のschrammen(擦る)やKrach(騒音)に通じる語感から生まれたとされる。ジャンルとして決定づけたのはChris Liebingで、彼はフランクフルトのクラブOmenでDJを始め、1996年にレーベルFine Audio Recordings(後のCLR)を設立した。Liebingは自身のDJスタイルを説明する際にこの語を用い、それが定着した。同時期にドイツのシーンではArkus P.、Marco Remus、Frank Kvitta、Sven Wittekind、Robert Natusらが活動し、ハノーファーやデュッセルドルフ、フランクフルトを拠点に高速で硬いテクノを発表した。制作技術の面では、1990年代後半にパソコンでのサンプル編集が一般化したことが大きい。既存のテクノやハードコアのレコードから打楽器の断片を切り出し、それを潰して重ねるという手法が、安価な機材で可能になった。この結果、旋律を作曲する能力がなくても強度の高いトラックを量産できるようになり、大量のレコードが地下流通した。文化面では、ドイツの大型の屋内フェスティバル、とりわけNature One(1995年開始、旧ミサイル基地跡地で開催)やMayday(1991年開始)が主要な発表の場となった。これらの催しは数万人規模で、数十時間にわたって続く形式が定着していた。2000年代前半が最盛期で、ドイツ国内では商業的にも大きな市場を形成したが、国外での評価は限定的だった。とりわけイギリスやアメリカの批評家からは、単調で暴力的なだけの音楽として軽視されることが多く、ミニマル・テクノの洗練が国際的に評価されていた時期には、シュランツはドイツ国内の低俗な流行という扱いを受けた。この評価の非対称性はドイツ国内でも議論になった。2000年代半ばにミニマルの流行が押し寄せると、シュランツは急速に退潮し、多くの制作者が活動を縮小した。しかし完全には消えず、ドイツ、ポーランド、スペイン、南米の一部で支持が続いた。2018年前後からのハードテクノの世界的復興に伴い、当時のシュランツのレコードが再評価され、若い制作者が当時の手法を意識的に引用する動きが起きている。Chris Liebingはその後よりミニマルで実験的な方向へ転じたが、シュランツの名を定着させた人物として今も参照される。</p>
<h2>代表曲</h2><ul><li>The Reason (Chris Liebing)</li><li>Motherfucking Bass (DJ Rush)</li><li>Schranz Total (Frank Kvitta)</li><li>Bang Bang (Viper XXL)</li><li>The Real Schranz (Sven Wittekind)</li></ul>
