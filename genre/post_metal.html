<h1>Post-Metal（ポストメタル）とは</h1>
<p>ポスト・メタルは、メタルの音量と重さを保ちながら、曲の組み立てをポスト・ロック（ロックの枠を超えた実験的な音楽）の発想で作ったスタイルだ。 中心はギターで、2本以上が層をなして重なる。歪ませた重い刻みと、ディレイ（反響）とリヴァー</p>
<p>ポスト・メタルは、メタルの音量と重さを保ちながら、曲の組み立てをポスト・ロック（ロックの枠を超えた実験的な音楽）の発想で作ったスタイルだ。

中心はギターで、2本以上が層をなして重なる。歪ませた重い刻みと、ディレイ（反響）とリヴァーブ（残響）をかけた澄んだアルペジオ（和音を一音ずつ弾く奏法）が、交互に、あるいは同時に鳴る。

和声（コードの響き）は、多くの作品で明確な機能を持たない傾向がある。同じ和音や旋法の上に長くとどまり、その上で音色と密度だけが変化していくことが多い。

リズムは中庸から遅めだ。変拍子（定型から外れた拍子）が用いられることもあるが、多くの作品で複雑さより重さが優先される傾向がある。ドラムはシンバルの残響を長く鳴らし、タムの反復による儀式的な効果を作ることが多い。

歌はしばしば存在しない。あっても、遠くから聴こえる叫びとして音響の一部に埋め込まれる。歌詞よりも作品全体の主題、たとえば自然、崩壊、人間の不在といった概念が、アルバムの構成や題名を通じて示される傾向がある。

曲は長尺のものが多く（おおむね7〜10分前後が中心で、20分を超える例もある）、明確なヴァース（歌の節）とコーラス（繰り返しの部分）の反復を持たない。代わりに、クレッシェンドや反復する主題を軸にした、緩やかで層状の構成が多い。聴き手を没入させ、時間の感覚を失わせることを狙う作品が多い。</p>
<h2>成り立ち</h2><p>1990年代、ハードコアとメタルの演奏者たちが、曲の構造の実験に向かった。ここからポスト・メタルが始まり、NeurosisやGodflesh（英国バーミンガム）らから生じたとされる。1992年のNeurosisの『Souls at Zero』とGodfleshの『Pure』は、後年の回顧でしばしば最初のポスト・メタル作品とみなされる。

中心の一つになったのが、カリフォルニア州オークランドのNeurosisだ。彼らは、クラスト寄りのハードコア・パンクとして1985年に結成した。しかし1990年代に入ると、曲を長大化させていく。1992年の『Souls at Zero』と1993年の『Enemy of the Sun』で、独自のスタイルを形づくった。1996年のThrough Silver in Bloodはそれを引き継いだ作品で、ポスト・メタルの源流の一つと評されている。

彼らは、1990年代から映像担当（Adam Kendall 1990–93、Pete Inc. 1993–2000、Josh Graham 2000–2012）を置いてライブを行った。映像と音を一体で見せる公演で評価を得たが、2012年に映像の使用は終わっている。

同じ時期、別の流れもあった。Reynoldsが造語し、シカゴのTortoiseの1996年作を契機に定着したポスト・ロックだ。もう一つは、スコットランドのMogwaiによる、静と動の落差の構成である。この二つが、構造面での参照点となった。

2000年代前半、この二つの流れが明確に合流する。ボストンで結成され、後にロサンゼルスへ移ったIsisが、2002年のOceanicと2004年のPanopticonで、長い上昇と崩壊を軸とする構成を洗練させた。彼らはこの分野の代表格となる。ただ、バンド名は後年、イスラム国（Islamic State）との混同を避けるため、2014年8月にFacebook上の名前を「Isis the band」に変えることになった。

同じ時期には、ほかのバンドも現れた。シカゴのPelicanは、ほぼ完全に器楽で同じ構造を追求した。フランスのGojiraは、デス／プログレッシヴ寄りのバンドで、ポスト・メタルの要素も取り入れた。2005年の『From Mars to Sirius』以降は、環境問題を前面に出している。

批評の場では、この音楽にアトモスフェリック・スラッジ（空気感のある、泥のように重く遅いメタル）という呼称も用いられた。また、Isis『Oceanic』のように水を主題にした作品がある。一方で批判もあり、構成の型が定型化しやすく、静かな導入から轟音の頂点へという流れが予測可能になりがちで、新鮮さを保つのが課題とされる。

2010年代以降、この表現はブラックメタルとも合流した。Alcestに続いてブラックゲイズで注目されたDeafheavenのように、轟音と美しい和声を同時に成立させる作家が現れている。現在では、定義が曖昧で、サブジャンルとも、複数のメタルに見られるスタイルの要素とも捉えられる語である。</p>
