<h1>Post-Metal（ポストメタル）とは</h1>
<p>メタルの音量と重さを保ちながら、曲の構造をポスト・ロックの発想で組み立てた様式。曲の長さは八分から20分に及び、明確なヴァースとコーラスの反復を持たない。代わりに、極めて静かな部分から始まり、長い時間をかけて音量と密度を積み上げ、</p>
<p>メタルの音量と重さを保ちながら、曲の構造をポスト・ロックの発想で組み立てた様式。曲の長さは八分から20分に及び、明確なヴァースとコーラスの反復を持たない。代わりに、極めて静かな部分から始まり、長い時間をかけて音量と密度を積み上げ、頂点で崩壊するという単一方向の構成、いわゆるクレッシェンドの構造をとる。ギターは二本以上が層をなし、歪ませた重い刻みと、ディレイとリヴァーブをかけた澄んだアルペジオが交互に、あるいは同時に鳴る。和声は明確な機能を持たず、同じ和音や旋法の上に長くとどまり、その上で音色と密度だけが変化していく。リズムは中庸から遅めで、変拍子が用いられるが、複雑さより重さが優先される。ドラムはシンバルの残響を長く鳴らし、タムの反復による儀式的な効果を作る。歌はしばしば存在せず、あっても遠くから聴こえる叫びとして音響の一部に埋め込まれる。歌詞よりも作品全体の主題、たとえば自然、崩壊、人間の不在といった概念が、アルバムの構成や題名を通じて提示される。聴き手を没入させ、時間の感覚を失わせることが目的の音楽である。</p>
<h2>成り立ち</h2><p>1990年代半ばの米国で、ハードコアとメタルの演奏者が構造の実験に向かったところから始まる。決定的な出発点はカリフォルニア州オークランドのNeurosisで、彼らはハードコア・パンクとして1985年に出発したが、1990年代に入って曲を長大化させ、1996年のThrough Silver in Bloodで、部族的な打楽器と儀式的な反復を含む独自の様式を確立した。彼らの演奏は映像の投影を伴い、音楽を体験として提示するという発想を持ち込んだ。同時期、シカゴのTortoiseらが確立したポスト・ロック、そしてスコットランドのMogwaiによる静と動の落差の構成が、構造面での参照点となった。2000年代前半、この二つの流れが明確に合流する。ボストンで結成され後にロサンゼルスへ移ったIsisが2002年のOceanicと2004年のPanopticonで、長い上昇と崩壊を軸とする構成を洗練させ、この分野の代表格となった。バンド名は後年、その語が持つ別の意味により報道で混乱を招くことになる。同時期、シアトルのPelicanは歌を持たない完全な器楽で同じ構造を追求し、フランスのGojiraは環境問題を主題とする独自の路線を作った。批評の場では、この様式に対してアトモスフェリック・スラッジという呼称も用いられ、また海のような、あるいは氷河のようなという比喩が頻繁に使われた。批判としては、構成の型が定型化しすぎて、静かな導入から轟音の頂点へという流れが予測可能になったという指摘がある。2010年代以降、この語彙はブラックメタルとも合流し、Deafheavenのように、轟音と美しい和声を同時に成立させる作家が現れた。現在では、メタルにおいて構造と持続を重視する姿勢の総称として広く用いられている。</p>
