<h1>Post-Metal（ポストメタル）とは</h1>
<p>メタルの音量と重さを保ちながら、曲の構造をポスト・ロック（ロックの枠を超えた実験的な音楽）の発想で組み立てた様式。曲は長いものが多く（おおむね7〜10分前後が中心で、20分を超える例もある）、明確なヴァース（歌の節）とコーラス（繰</p>
<p>メタルの音量と重さを保ちながら、曲の構造をポスト・ロック（ロックの枠を超えた実験的な音楽）の発想で組み立てた様式。曲は長いものが多く（おおむね7〜10分前後が中心で、20分を超える例もある）、明確なヴァース（歌の節）とコーラス（繰り返しの部分）の反復を持たない。代わりに、クレッシェンド（だんだん大きくなる）や、繰り返される主題を軸にした、ゆるやかで層になった構成が多い。ギターは2本以上が層をなし、歪ませた重い刻みと、ディレイ（反響）とリヴァーブ（残響）をかけた澄んだアルペジオ（和音を一音ずつ弾く奏法）が交互に、あるいは同時に鳴る。和声（コードの響き）は明確な機能を持たないことが多く、同じ和音や旋法の上に長くとどまり、その上で音色と密度だけが変化していく。リズムは中庸から遅めで、変拍子（定型から外れた拍子）が用いられることがあるが、複雑さより重さが優先される傾向がある。ドラムはシンバルの残響を長く鳴らし、タムの反復による儀式的な効果を作ることが多い。歌はしばしば存在せず、あっても遠くから聴こえる叫びとして音響の一部に埋め込まれる。歌詞よりも作品全体の主題、たとえば自然、崩壊、人間の不在といった概念が、アルバムの構成や題名を通じて示される作品が多い。聴き手を没入させ、時間の感覚を失わせるような音楽が多い。</p>
<h2>成り立ち</h2><p>1990年代に、ハードコアとメタルの演奏者が構造の実験に向かったところから始まり、NeurosisやGodflesh（英国バーミンガム）らから生じた。1992年のNeurosisの『Souls at Zero』とGodfleshの『Pure』は、後年の回顧でしばしば最初のポスト・メタル作品とみなされる。カリフォルニア州オークランドのNeurosisは、クラスト寄りのハードコア・パンクとして1985年に結成されたが、1990年代に入って曲を長大化させ、1992年の『Souls at Zero』と1993年の『Enemy of the Sun』で独自の様式を形づくり、1996年のThrough Silver in Bloodはそれを引き継いだ作品で、ポスト・メタルの源流の一つと評されている。彼らは1990年代から映像担当を置いてライブを行い、映像と音を一体で見せる公演で評価を得た（2012年に映像の使用は終了した）。同時期、シカゴのSimon Reynoldsが名づけ、Tortoiseの1996年作をきっかけに広く定着したポスト・ロック、そしてスコットランドのMogwaiによる静と動の落差の構成が、構造面での参照点となった。2000年代前半、この二つの流れが明確に合流する。ボストンで結成され後にロサンゼルスへ移ったIsisが2002年のOceanicと2004年のPanopticonで、長い上昇と崩壊を軸とする構成を洗練させ、この分野の代表格となった。バンド名は後年、イスラム国（ISIS）と名前が重なったため混同が生じ、2014年にSNS上の名称を「Isis the band」に変更した。同時期、シカゴのPelicanはほぼ完全に器楽で同じ構造を追求した。フランスのGojiraはデス・メタルやプログレッシヴ・メタル寄りのバンドで、ポスト・メタルの要素も取り入れ、2005年の『From Mars to Sirius』以降、環境問題を前面に出した。批評の場では、この様式に対してアトモスフェリック・スラッジ（空気感のある、泥のように重く遅いメタル）という呼称も用いられ、また、Isisの『Oceanic』のように水を主題にした作品もある。批判としては、新鮮さを保つのが課題とされる。2010年代以降、この表現はブラックメタルとも合流し、Alcestに続いて、Deafheavenのように、轟音と美しい和声を同時に成立させる作家が現れた。現在でも定義が曖昧で、独立したサブジャンルとも、複数のメタルに見られる共通の特徴とも捉えられる語である。</p>
