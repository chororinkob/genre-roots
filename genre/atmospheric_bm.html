<h1>Atmospheric Black Metal（アトモスフェリックブラックメタル）とは</h1>
<p>アトモスフェリック・ブラックメタルは、ブラックメタルの手法を使いながら、攻撃性よりも情景を思い浮かばせることを目的とする音楽だ。 ギターは、単音や少数の音を素早く繰り返し弾くトレモロ奏法が基本である。そこに深い残響を加え、一つ一つ</p>
<p>アトモスフェリック・ブラックメタルは、ブラックメタルの手法を使いながら、攻撃性よりも情景を思い浮かばせることを目的とする音楽だ。

ギターは、単音や少数の音を素早く繰り返し弾くトレモロ奏法が基本である。そこに深い残響を加え、一つ一つの音の輪郭を溶かして、一枚の霞のような音の面を作る。

和音は短調が基本だ。ただし、不協和よりも持続和音や旋律の抒情性が前面に出る傾向があり、切なさや荘厳さを帯びた響きが選ばれる。鍵盤楽器やクラシックの楽器もよく使われる。長く伸ばした和音の敷物や、遠くで鳴る合唱をまねた音色が、全体を包み込む。

この音の面の上で、ブラストビート（スネアなどを超高速で連打する奏法）が使われる例もある。しかし、この分野は一般に遅めから中速だ。ブラストビートの使用は一般にはまれだが、Wolves in the Throne Roomなど多用する例もある。静かで広々とした聴き心地が生まれる。

ヴォーカルは、シュリークと呼ばれる絞り出すような絶叫が中心だが、クリーン・ヴォーカルを併用する例もある。歌声は音量を絞り、音の層の奥へ埋め込まれる。主題は自然、民間伝承、神話、内省が多く、文学作品に基づくものもある。

曲はしばしば7〜8分を超え、20分を超える曲もある。同じ音の型を何十小節も繰り返しながら、要素を少しずつ足したり引いたりして、情景を移り変わらせる組み立てを取る。さらに、風などの現場の録音を、導入や間奏に使うバンドもある。</p>
<h2>成り立ち</h2><p>ブラックメタルの起源は、1980年代前半にさかのぼる。名前の由来は、Venomが1982年に出したアルバム『Black Metal』だ。

1990年代前半のノルウェーで定着したのは、その「第二波」である。当初は、悪魔崇拝と反キリスト教を掲げる過激な運動だった。この時期のシーンには、教会への放火や殺人事件をともなう、極めて暗い歴史がある。

その渦中にいたのがVarg Vikernesだ。彼はBurzum名義で、1990年代前半に、鍵盤楽器と長い反復による陰鬱で情景的な作品を作った。この分野の有力な先駆者の一人とされる。しかし彼は、1993年に仲間だったØystein Aarsethを刺殺し、複数の教会への放火にも関わって有罪となった人物だ。さらに、新ナチスと評される人種差別的な思想を表明してきた。かつてはネオナチを自称した。のちにナチというラベルを拒み、オーダリズムを名乗るとされる。2014年には、フランスで人種的憎悪をあおった罪で有罪となった。その音楽の影響力と、受け入れがたい人物と思想をどう扱うかは、議論の的になり続けている問題の一つである。

同じノルウェーのUlverは、1995年の作品で、伝承と自然を主題に、フォークの旋律とブラックメタルを結びつけた。

アメリカでは、1990年代後半からAgallochらが現れ、2000年代にWolves in the Throne Roomが続いた。Wolves in the Throne Roomは、ワシントン州オリンピアで2002年(2003年とする説もある)に結成された。彼らは農場を所有・拠点とし、太平洋岸北西部の原生林と環境思想を主題に据えた。この系統を代表するバンドの一つである。彼らは悪魔崇拝的な図像やコープスペイントなどを用いず、独自の立場で演奏し、代わりに土地との関係を前面に出した。1995年結成のオレゴン州のAgallochは、より旋律的で内省的な方向を示している。

ヨーロッパでは、オーストリアのSummoningが文学作品の世界観を主題とした。スイスのPaysage d'Hiverは、極端に粗い録音で雪と冬を描いた。

一方で、この分野には今も政治的な緊張がつきまとう。自然と土地への愛着は、たやすく民族主義と結びつきうる。そのため、ブラックメタル全般では、極右思想を掲げる集団との近さが指摘され、極右との関係を理由に、会場やイベントへの出演が中止された例もある。2026年には、アメリカのニュージャージー州で、出演バンドと白人至上主義との関係を理由に音楽祭が中止された。多くの作り手はこうした思想をはっきり否定しているが、この緊張は解消されていない。</p>
