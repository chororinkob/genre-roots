<h1>Atmospheric Black Metal（アトモスフェリックブラックメタル）とは</h1>
<p>ブラックメタルの手法を用いながら、攻撃性より情景の喚起を目的とする音楽である。ギターは全ての弦を高速で往復して弾くトレモロ奏法を基本とするが、そこに深い残響を加え、個々の音符の輪郭を溶かして一枚の霞のような面を作る。この面の上に、</p>
<p>ブラックメタルの手法を用いながら、攻撃性より情景の喚起を目的とする音楽である。ギターは全ての弦を高速で往復して弾くトレモロ奏法を基本とするが、そこに深い残響を加え、個々の音符の輪郭を溶かして一枚の霞のような面を作る。この面の上に、毎分200打を超えるブラストビートが敷かれるため、激しく叩かれているのに聴感としては静かで広大という逆説が生まれる。和声は短調を基本としながら、伝統的なブラックメタルのような露骨な不協和を避け、切なさや荘厳さを帯びた響きが選ばれる。決定的に重要なのが鍵盤楽器で、持続する和音の敷物や、遠くで鳴る合唱を模した音色が全体を包み、これがなければこの分野は成立しない。加えて、風、雨、川、鳥の声、雷といった現場の録音が導入や間奏に用いられる。曲は8分から20分と長く、同じ音型を何十小節も反復しながら、要素を少しずつ足し引きして情景を移り変わらせる構成を取る。ヴォーカルは絶叫だが、音量を絞って音の層の奥へ埋め込まれ、歌詞は聴き取れないことが前提となる。主題は自然、季節、孤独、失われた古代、そして人間の不在である。</p>
<h2>成り立ち</h2><p>1990年代前半のノルウェーで確立したブラックメタルは、当初、悪魔崇拝と反キリスト教を掲げる過激な運動だった。この時期のシーンは、教会への放火や殺人事件を伴う極めて暗い歴史を持っている。その渦中にいたVarg Vikernesは、Burzum名義で1990年代前半に、鍵盤楽器と長大な反復による陰鬱で情景的な作品を制作し、この分野の音楽的な原型を作った。しかし彼は1993年に仲間であったØystein Aarsethを刺殺し、複数の教会への放火にも関与して有罪となった人物であり、さらに新ナチス的な人種差別思想を公然と表明し続けている。その音楽の影響力と、人物と思想の許容し難さをどう扱うかは、この分野が今も抱える最大の難問である。同じノルウェーのUlverは1995年の作品で、伝承と自然を主題に、フォークの旋律とブラックメタルを結合させた。2000年代に入ると重心はアメリカへ移る。ワシントン州オリンピアで結成されたWolves in the Throne Roomは、自ら農場を営みながら、太平洋岸北西部の原生林と環境思想を主題に据え、この音楽を自然への畏怖の表現として再定義した。彼らはヨーロッパ由来の悪魔崇拝的な記号を明確に拒否し、代わりに土地との関係を掲げた点で、思想的な転換をもたらした。同時期のオレゴン州のAgallochは、より旋律的で内省的な方向を示している。ヨーロッパではオーストリアのSummoningが文学作品の世界観を主題とし、スイスのPaysage d'Hiverが極端に粗い録音で雪と冬を描いた。この分野には現在も政治的な緊張がつきまとう。自然と土地への愛着は容易に民族主義と結びつきうるため、実際に極右思想を掲げる集団が近接して存在し、音楽祭からの出演取り消しをめぐる論争が繰り返されてきた。多くの作り手はこうした思想を明確に否定しているが、この緊張は解消されていない。</p>
