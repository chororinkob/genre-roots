<h1>Atmospheric Black Metal（アトモスフェリックブラックメタル）とは</h1>
<p>ブラックメタルの手法を用いながら、攻撃性より情景の喚起を目的とする音楽である。ギターは、単音や少数の音を素早く繰り返し弾くトレモロ奏法を基本とするが、そこに深い残響を加え、個々の音符の輪郭を溶かして一枚の霞のような面を作る。この面</p>
<p>ブラックメタルの手法を用いながら、攻撃性より情景の喚起を目的とする音楽である。ギターは、単音や少数の音を素早く繰り返し弾くトレモロ奏法を基本とするが、そこに深い残響を加え、個々の音符の輪郭を溶かして一枚の霞のような面を作る。この面の上に、ブラストビートが使われる例もあるが、この分野は一般に遅めから中速で、ブラストビートの使用はまれとされ、静かで広大な聴感が生まれる。和声は短調を基本としながら、伝統的なブラックメタルのような露骨な不協和を避け、切なさや荘厳さを帯びた響きが選ばれる。鍵盤楽器やクラシックの楽器がしばしば用いられ、持続する和音の敷物や、遠くで鳴る合唱を模した音色が全体を包む。加えて、風、雨、川、鳥の声、雷といった現場の録音が導入や間奏に用いられる。曲は8分から20分と長く、同じ音型を何十小節も反復しながら、要素を少しずつ足し引きして情景を移り変わらせる構成を取る。ヴォーカルは絶叫だが、音量を絞って音の層の奥へ埋め込まれ、歌詞は聴き取れないことが前提となる。主題は自然、季節、孤独、失われた古代、そして人間の不在である。</p>
<h2>成り立ち</h2><p>ブラックメタルの起源は1980年代前半にあり、Venomの1982年のアルバム『Black Metal』が名称の由来となった。1990年代前半のノルウェーで確立したのは、その「第二波」で、当初、悪魔崇拝と反キリスト教を掲げる過激な運動だった。この時期のシーンは、教会への放火や殺人事件を伴う極めて暗い歴史を持っている。その渦中にいたVarg Vikernesは、Burzum名義で1990年代前半に、鍵盤楽器と長大な反復による陰鬱で情景的な作品を制作し、この分野の有力な先駆者の一人とされる。しかし彼は1993年に仲間であったØystein Aarsethを刺殺し、複数の教会への放火にも関与して有罪となった人物であり、さらに、新ナチスと評される人種差別的な思想を表明してきた(本人は「ナチ」ではなくオーダリズムを名乗っている)。2014年にはフランスで人種的憎悪の扇動により有罪となった。その音楽の影響力と、人物と思想の許容し難さをどう扱うかは、この分野が今も抱える最大の難問である。同じノルウェーのUlverは1995年の作品で、伝承と自然を主題に、フォークの旋律とブラックメタルを結合させた。2000年代には、アメリカでも注目すべき動きが現れる。ワシントン州オリンピアで2002年(2003年とする資料もある)に結成されたWolves in the Throne Roomは、自ら農場を営みながら、太平洋岸北西部の原生林と環境思想を主題に据え、この音楽を自然への畏怖の表現として再定義した。彼らはヨーロッパ由来の悪魔崇拝的な記号を明確に拒否し、代わりに土地との関係を掲げた点で、思想的な転換をもたらした。1995年結成のオレゴン州のAgallochは、より旋律的で内省的な方向を示している。ヨーロッパではオーストリアのSummoningが文学作品の世界観を主題とし、スイスのPaysage d'Hiverが極端に粗い録音で雪と冬を描いた。この分野には現在も政治的な緊張がつきまとう。自然と土地への愛着は容易に民族主義と結びつきうるため、ブラックメタル全般では極右思想を掲げる集団との近接が指摘され、極右との関係を理由とする会場やイベントの出演中止が報じられている。多くの作り手はこうした思想を明確に否定しているが、この緊張は解消されていない。</p>
