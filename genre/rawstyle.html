<h1>Rawstyle（ロウスタイル）とは</h1>
<p>ローは、ハードスタイルから派生した、より暗く歪んだスタイルのダンス音楽だ。 中心にあるのはキックドラムの音作りである。キックの型は複数ある。そのひとつは、原音の頭の部分に金属的な打撃音を置き、その後に続く減衰部分（音がだんだん消え</p>
<p>ローは、ハードスタイルから派生した、より暗く歪んだスタイルのダンス音楽だ。

中心にあるのはキックドラムの音作りである。キックの型は複数ある。そのひとつは、原音の頭の部分に金属的な打撃音を置き、その後に続く減衰部分（音がだんだん消えていく部分）を極端に歪ませ、音程を下げながら伸ばす型だ。減衰部分の音程が無いゲーテッド型もある。歪んだキックが主役になる。キックとは別に裏拍へ置くリバースベース（reverse bass）なども引き継いでいる。歪みの量は通常のハードスタイルよりはるかに多く、キックそのものが唸り声のように聞こえる。

上物（キックやベース以外の、上に重ねる音）の中心はスクリーチで、暗い旋律が付くことがある。旋律への比重は小さい、または旋律を欠くとされる（Radical Redemptionの曲は「huge melodies」を持つとも言われる）。

テンポは、ハードスタイル全体で見ると、毎分の拍の数で初期は約140、現在は150〜160が中心とされる。1拍ごとにキックを踏む四つ打ちが基本だ。

曲の構成は、クライマックスを欠き、アンチクライマックスと呼ばれる偽のドロップが中心になるとされる。キックロールも多く使われる。

演奏の場は、オランダの大型の催し（Defqon.1は屋外の祭典）が中心だ。ただし、催しはベルギー、オーストラリア、ドイツなどでも開かれる。会場には、暗い照明と炎の演出、そして数万人の観客が同時に頭を振る光景が伴う。</p>
<h2>成り立ち</h2><p>ローの母体は、ハードスタイルである。ハードスタイルは、1990年代後半〜2000年代初頭にかけて、オランダ・ベルギー・イタリアで形づくられたとされ、単一の起源は特定できない。

2000年代初頭には、Fusion RecordsやScantraxxが主要レーベルとなった。2006年には、Dirty Workzも設立された。Headhunterz、Wildstylez、Noisecontrollersらは、旋律的で明るい方向を推し進めた。こうしてハードスタイルは、巨大な催しの主役になった。

しかし2010年代初頭から、この商業化と甘さへの反動が現れる。ユーフォリック・ハードスタイルの人気が高まった2010年頃、より暗い曲を求めて、ローが生まれたとされる。ただし、その時期には諸説ある。

初期の担い手には、Ran-D、E-Force、Adaro、Gunz For Hire、Digital Punk、The R3belz、Alpha²、Crypsisなどがいた。Radical Redemptionは、ローの代表的な作家の一人だ。最初期の曲は2008年頃とする見方と、ジャンル名の定着は2010〜2011年頃とする見方がある。

レーベルでは、成立期にはA2 RecordsなどScantraxx系のレーベル、Minus is More、Theracordsが中心となった。のちに、Gearbox Digitalなどが注目を集めた。

QlimaxやDefqon.1は、オランダの大型の催しだ（Qlimaxは2000〜2024年に開かれた屋内の催し）。そのうちDefqon.1には、Blue・Indigoのように、ローを主軸とするステージがある。一方、Qlimaxは、1夜のラインナップに複数ジャンルが混在する形式である。

2010年代後半には、ユーフォリック・ハードスタイルとの融合（rawphoric）が現れた。のちには、アップテンポとの接近も語られている。</p>
