<h1>Rawstyle（ロウスタイル）とは</h1>
<p>ハードスタイルから派生した、より暗く歪んだ様式。中心にあるのはキックドラムの設計で、原音の頭の部分に金属的な打撃音を置き、その後に続く減衰部分（音がだんだん消えていく部分）を極端に歪ませ、音程を下げながら伸ばす。この減衰部分がベー</p>
<p>ハードスタイルから派生した、より暗く歪んだ様式。中心にあるのはキックドラムの設計で、原音の頭の部分に金属的な打撃音を置き、その後に続く減衰部分（音がだんだん消えていく部分）を極端に歪ませ、音程を下げながら伸ばす。この減衰部分がベースの役割を兼ね、キックが歪んで主役になる。リバースベース（reverse bass）などを引き継ぐ。歪みの量が通常のハードスタイルよりはるかに多く、キックそのものが唸り声のように聞こえる。テンポは、ハードスタイル全体では毎分140〜160拍とされる。1拍ごとにキックを踏む四つ打ちが基本である。上物（キックやベース以外の、上に重ねる音）は最小限で、金属的なシンセの短い刺し、暗く不穏な弦の持続音、鐘や鎖の擦れる音のような効果音が置かれる。旋律への比重は小さく、または旋律を欠くとされる（Radical Redemptionの公式紹介には「huge melodies」の言及もある）。曲の構成は明快で、キックが走る部分、すべてが抜けて重く沈む導入部、そして再びキックが戻る瞬間の落差が要になる。演奏の場はオランダの巨大な催し（Defqon.1は屋外の祭典）で、暗い照明と炎の演出、そして数万人の観客が同時に頭を振る光景が伴う。</p>
<h2>成り立ち</h2><p>母体となったハードスタイルは、1990年代後半にオランダ・ベルギー・イタリアを起源として現れた。2000年代半ばにはScantraxxやDirty Workzといったレーベルが市場を作り、Headhunterz、Wildstylez、Noisecontrollersらが旋律的で明るい方向を推し進め、この様式は巨大な催しの主役になった。しかし2010年代初頭から、この商業化と甘さに対する反動が現れる。ユーフォリック・ハードスタイルの人気が高まった2010年頃に、より暗い曲を求めて、この様式が生まれた。中心にいたのはRadical Redemption、Digital Punk、Delete、Crypsis、そしてE-Forceといった名義である。とりわけRadical Redemptionは、極端に歪んだキックの設計を突き詰め、この様式の基準を作った。名称としてのローが定着した時期は、資料により2008年（最初の曲）、2010年、2011年、2012年と割れている。レーベルではMinus is More、Gearbox Digital、Theracordsが中心となった。QlimaxやDefqon.1といったオランダの大型催し（Qlimaxは2000〜2024年に開かれた屋内の催し）のうち、Defqon.1にはBlue・Indigoのようにローを主軸とするステージがある。Qlimaxは1夜のラインナップに複数ジャンルが混在する形式である。2010年代後半には、さらに歪みを強めてフレンチコアやアップテンポに接近する作り手も現れ、境界は溶けつつある。</p>
<h2>代表曲</h2><ul><li>Zombie (Ran-D)</li><li>Brutal 6.0（Radical Redemption）</li><li>Payback (Delete)</li><li>Fire (Phuture Noize)</li><li>Take It Back (Delete)</li><li>Lunatic (Delete)</li><li>Rebel or Redeem (Radical Redemption)</li><li>Rise from the Streets (Rebelion)</li><li>Genocide（Delete）</li><li>Brutal 12.0 (Radical Redemption)</li><li>Whiplashed (Digital Punk)</li><li>Elektronic Symphony (B-Front)</li></ul>
