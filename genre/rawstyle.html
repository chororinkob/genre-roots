<h1>Rawstyle（ロウスタイル）とは</h1>
<p>ハードスタイルから派生した、より暗く歪んだ様式。中心にあるのはキックドラムの設計で、原音の頭の部分に金属的な打撃音を置き、その後に続く減衰部分を極端に歪ませ、音程を下げながら伸ばす。この減衰部分がベースの役割を兼ねるため、ベースパ</p>
<p>ハードスタイルから派生した、より暗く歪んだ様式。中心にあるのはキックドラムの設計で、原音の頭の部分に金属的な打撃音を置き、その後に続く減衰部分を極端に歪ませ、音程を下げながら伸ばす。この減衰部分がベースの役割を兼ねるため、ベースパートが別に存在しない。歪みの量が通常のハードスタイルよりはるかに多く、キックそのものが唸り声のように聞こえる。テンポは毎分150から155拍程度で、四つ打ちが基本である。上物は最小限で、金属的なシンセの短い刺し、暗く不穏な弦の持続音、鐘や鎖の擦れる音のような効果音が置かれる。旋律的な展開はほぼ排され、その点が明るいハードスタイルと決定的に違う。曲の構成は明快で、キックが走る部分、すべてが抜けて重く沈む導入部、そして再びキックが戻る瞬間の落差が要になる。声は加工された低い語りや叫びで、宗教的な引用や不吉な宣告のような文言が用いられる。演奏の場はオランダやベルギーの巨大な屋内催しで、暗い照明と炎の演出、そして数万人の観客が同時に頭を振る光景が伴う。</p>
<h2>成り立ち</h2><p>母体となったハードスタイルは、2000年前後のオランダで、ガバとハードトランスの中間から生まれた。2000年代半ばにはScantraxxやDirty Workzといったレーベルが市場を作り、Headhunterz、Wildstylez、Noisecontrollersらが旋律的で明るい方向を推し進め、この様式は巨大な催しの主役になった。しかし2008年から10年頃、この商業化と甘さに対する反動が現れる。より暗く、より歪んだキックを求める作り手たちが、当初はダーティ・ハードスタイルやアンダーグラウンドと呼ばれる音を作り始めた。中心にいたのはRadical Redemption、Digital Punk、Delete、Crypsis、Ncrypta、そしてRandom Hero、E-Forceといった名義である。とりわけRadical Redemptionは、極端に歪んだキックの設計を突き詰め、この様式の基準を作った。名称としてのローが定着したのは2012年前後で、業界誌や催しの主催者が、旋律的なユーフォリック・ハードスタイルと区別するために使い始めた。レーベルではMinus is More、Gearbox Digital、Theracordsが中心となった。2010年代半ばには、この暗い側が主流を追い越すほどの人気を得て、Qlimax、Defqon.1、Dominatorといったオランダの大型催しでは、両者が明確に区分された演目として並ぶようになった。2010年代後半には、さらに歪みを強めてフレンチコアやアップテンポに接近する作り手も現れ、境界は溶けつつある。一方で、キックの設計が高度に技術化したことで、音の個性が均質になったという批判も内部から出ている。</p>
<h2>代表曲</h2><ul><li>Brutal 6.0（Radical Redemption）</li><li>Genocide（Delete）</li></ul>
