<h1>New Age（ニューエイジ）とは</h1>
<p>ニューエイジは、瞑想、癒し、リラクゼーションを目的として作られた、器楽中心の音楽だ。実用の場で鳴っていることが多く、音楽自体が環境を整える道具として設計されている。ヨガ教室、マッサージ店、書店の売り場、瞑想アプリ、病院の待合室など</p>
<p>ニューエイジは、瞑想、癒し、リラクゼーションを目的として作られた、器楽中心の音楽だ。実用の場で鳴っていることが多く、音楽自体が環境を整える道具として設計されている。ヨガ教室、マッサージ店、書店の売り場、瞑想アプリ、病院の待合室などがその例だ。ニューエイジは癒し・楽観を志向する傾向が強い。アンビエントとは重なる部分が大きい。

使われる音色は、アコースティックピアノ、ナイロン弦のギター、ハープ、フルート、パンフルートである。シンセサイザーのパッド（持続する背景の音）も使われる。波音や鳥の声、風、雨といったフィールド録音（現場で録った音）の環境音も加わる。シンセでは、Yamaha DX7の澄んだエレクトリックピアノ音や、Roland D-50の煌めくパッドが、1980年代のシンセ音色として広く使われた。

基本設計は、聴き手の注意を引きつけすぎない、穏やかな持続音を敷き詰めることだ。明確なビートや、歌詞による意味づけは避ける。

和声は、長調のダイアトニック（ドレミファソラシの音階）を使う。ペンタトニック（5音音階）や、リディア旋法（明るく浮遊感のある音の並び）を選ぶこともある。どれも不安のない響きで、不協和音や急な転調はほとんど使われない。

ゆったりしたテンポの曲が多い。拍節（拍の区切り）そのものを曖昧にして、呼吸や心拍に寄り添わせることもある。

曲の展開に、起承転結はない。同じ音型が緩やかに変化しながら、数分から十数分続く形が多い。リヴァーブ（残響効果）を深くかけて、音の輪郭を溶かす。残響が次の音と重なり合う、空間を作る。</p>
<h2>成り立ち</h2><p>1960年代から1970年代初頭にかけて、欧米で、ニューエイジは生まれた。ヒッピー文化の後継としてのニューエイジ運動と、結びついていた。Tony Scottの『Music for Zen Meditation』（1964年）は、最初のニューエイジ録音と見なされることがある。Paul Horn（1968年）やIrv Teibelも、先駆者に挙げられる。

直接の需要になったのは、東洋思想、超常現象、代替医療、環境保護といった関心を持つ層だ。彼らは、瞑想や身体作業の伴奏となる音楽を求めた。先駆者としては、Tony ScottやPaul Horn、Irv Teibel、ドイツのDeuterの名が挙がる。アメリカでは、Steven Halpernの名が挙がる。

Halpernは、1975年に『Christening for Listening』を、自身の独立レーベルSound Principle Recordsから発売した。1976年には『Spectrum Suite』として再発されている。瞑想的な電子ピアノ（Fender Rhodes）曲が中心だが、1975年初版にはジャズ／ロック曲も含まれていた。これがニューエイジ音楽の重要な作品のひとつとなった。彼は、音の周波数が身体のチャクラ（ヨガで体にあるとされる気の中心）に対応するという理論を掲げていた。音楽を癒しの手段として打ち出し、この分野の先駆者と評される。

1970年代半ばからは、ギリシャのVangelisが、電子音による叙情的な作風を固めた。1981年の映画「炎のランナー」の音楽でアカデミー賞を受賞し、大衆的認知を広げた。ただ、ニューエイジに分類されることもあるが、本人や識者は異論を唱える。

1980年代に入ると、市場が急拡大する。カリフォルニアのWindham Hillは、1976年にウィリアム・アッカーマンとアン・ロビンソンがパロアルトで創設した、小さなレーベルだった。しかし、ピアニストGeorge Winstonの『Autumn』と、1982年の『December』が成功する。これでA&amp;Mとの配給契約を得て、一躍主要レーベルになった。同時期に、Narada、Private Music、Higher Octaveといったレーベルが続いた。Ray LynchやKitaro(喜多郎)、Enyaが、商業的成功を収めた。喜多郎は1980年からNHK特集「シルクロード」の音楽を担当し、日本発のニューエイジとして国際的に知られた。

1987年、グラミー賞にBest New Age Recording部門が新設された（初代受賞者はAndreas Vollenweider）。ニューエイジは、ジャンルとして公式に認知される。

しかし、同時期から批判も強まった。音楽評論家からは、退屈で無害なだけの壁紙音楽、スピリチュアル商法の付属品といったからかいが浴びせられた。ニューエイジという語自体が、音楽家にとって不名誉なレッテルになっていく。EnyaやGeorge Winston本人が、この分類を拒否したことも知られる。1980年代後半から、実作者たちの中には、アンビエント、コンテンポラリー・インストゥルメンタル、ヒーリング・ミュージックなど別の呼称を選ぶ人も出てきた。

それから時を経た2010年代、YouTubeのアルゴリズムや収集家・再発レーベルを通じて、吉村弘・芦川聡ら日本の環境音楽が、国際的に再発見された。</p>
