<h1>New Age（ニューエイジ）とは</h1>
<p>瞑想、癒し、リラクゼーションを目的として作られた器楽中心の音楽。明確なビートや歌詞による意味づけを避け、聴き手の注意を引きつけすぎない穏やかな持続音を敷き詰めるのが基本設計になる。使われる音色はアコースティックピアノ、ナイロン弦の</p>
<p>瞑想、癒し、リラクゼーションを目的として作られた器楽中心の音楽。明確なビートや歌詞による意味づけを避け、聴き手の注意を引きつけすぎない穏やかな持続音を敷き詰めるのが基本設計になる。使われる音色はアコースティックピアノ、ナイロン弦のギター、ハープ、フルート、パンフルート、シンセサイザーのパッド、そして波音や鳥の声、風、雨といったフィールド録音の環境音。シンセではYamaha DX7の澄んだエレクトリックピアノ音やRoland D-50の煌めくパッドが定番になった。和声は長調のダイアトニックか、ペンタトニックやリディア旋法など不安のない響きを選び、不協和音や急な転調はほとんど使われない。テンポは60BPM前後、あるいは拍節そのものを曖昧にして呼吸や心拍に寄り添わせる。曲の展開は起承転結を持たず、同じ音型が緩やかに変化しながら数分から十数分続く形が多い。リヴァーブを深くかけて音の輪郭を溶かし、残響が次の音と重なり合う空間を作る。アンビエントと似ているが、アンビエントが無機質や不穏さも含む実験性を持つのに対し、ニューエイジは常に肯定的で治癒的な情緒に寄せられる点が異なる。ヨガ教室、マッサージ店、書店の売り場、瞑想アプリ、病院の待合室といった実用の場で鳴っていることが多く、音楽自体が環境を整える道具として設計されている。</p>
<h2>成り立ち</h2><p>1970年代のアメリカ西海岸で、ヒッピー文化の後継としてのニューエイジ運動と結びついて生まれた。東洋思想、超常現象、代替医療、環境保護といった関心を持つ層が、瞑想や身体作業の伴奏となる音楽を求めたことが直接の需要になった。先駆者としてはドイツのDeuterやフランスのDidier Marouani、アメリカではSteven Halpernの名が挙がる。Halpernは1975年の「Spectrum Suite」で、明確な旋律もリズムも持たない電子ピアノの持続音だけのアルバムを自主制作し、これがニューエイジ音楽の設計図となった。彼は音の周波数が身体のチャクラに対応するという理論を掲げており、音楽を治療の道具として位置づけた点で後続に大きな影響を残した。1976年にはギリシャのVangelisが電子音による叙情的な作風を確立し、1981年の映画「炎のランナー」の音楽でアカデミー賞を受賞して大衆的認知を広げた。1980年代に入ると市場が急拡大する。カリフォルニアのWindham Hillはギタリストのウィリアム・アッカーマンが1976年に自宅で設立した小さなレーベルだったが、ピアニストGeorge Winstonの1982年「December」が100万枚を超える売上を記録し、一躍主要レーベルになった。同時期にNarada、Private Music、Higher Octaveといったレーベルが続き、Ray LynchやKitaro(喜多郎)、Enyaが商業的成功を収めた。喜多郎は1980年からNHK特集「シルクロード」の音楽を担当し、日本発のニューエイジとして国際的に知られた。1987年にはグラミー賞にBest New Age Recording部門が新設され、ジャンルとして公式に認知される。しかし同時期から批判も強まった。音楽評論家からは、退屈で無害なだけの壁紙音楽、スピリチュアル商法の付属品といった揶揄が浴びせられ、ニューエイジという語自体が音楽家にとって不名誉なレッテルになっていく。EnyaやGeorge Winston本人がこの分類を拒否したことも知られる。そのため1990年代以降、実作者たちはアンビエント、コンテンポラリー・インストゥルメンタル、ヒーリング・ミュージックなど別の呼称を選ぶようになった。2010年代にはヴェイパーウェイヴやアンビエントの再評価の流れで、当時のニューエイジ作品が皮肉抜きに掘り起こされ、日本の吉村弘や芦川聡といった環境音楽の作家が国際的に再発見されている。</p>
