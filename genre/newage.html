<h1>New Age（ニューエイジ）とは</h1>
<p>瞑想、癒し、リラクゼーションを目的として作られた器楽中心の音楽。明確なビートや歌詞による意味づけを避け、聴き手の注意を引きつけすぎない穏やかな持続音を敷き詰めるのが基本設計になる。使われる音色はアコースティックピアノ、ナイロン弦の</p>
<p>瞑想、癒し、リラクゼーションを目的として作られた器楽中心の音楽。明確なビートや歌詞による意味づけを避け、聴き手の注意を引きつけすぎない穏やかな持続音を敷き詰めるのが基本設計になる。使われる音色はアコースティックピアノ、ナイロン弦のギター、ハープ、フルート、パンフルート、シンセサイザーのパッド（持続する背景の音）、そして波音や鳥の声、風、雨といったフィールド録音（現場で録った音）の環境音。シンセではYamaha DX7の澄んだエレクトリックピアノ音やRoland D-50の煌めくパッドが定番になった。和声は長調のダイアトニック（ドレミファソラシの音階）か、ペンタトニック（5音音階）やリディア旋法（明るく浮遊感のある音の並び）など不安のない響きを選び、不協和音や急な転調はほとんど使われない。テンポはゆったりした曲が多く、拍節（拍の区切り）そのものを曖昧にして呼吸や心拍に寄り添わせる曲もある。曲の展開は起承転結を持たず、同じ音型が緩やかに変化しながら数分から十数分続く形が多い。リヴァーブ（残響効果）を深くかけて音の輪郭を溶かし、残響が次の音と重なり合う空間を作る。アンビエントと似ているが、アンビエントとは重なる部分が大きいが、アンビエントが無機質や不穏さも含む実験性を持つのに対し、ニューエイジは癒しや楽観を志向する傾向が強い。ヨガ教室、マッサージ店、書店の売り場、瞑想アプリ、病院の待合室といった実用の場で鳴っていることが多く、音楽自体が環境を整える道具として設計されている。</p>
<h2>成り立ち</h2><p>1960年代から1970年代初頭にかけての欧米で、ヒッピー文化の後継としてのニューエイジ運動と結びついて生まれた（Tony Scottの『Music for Zen Meditation』（1964年）が最初のニューエイジの録音とされ、Paul Horn（1968年）やIrv Teibelも先駆者に挙げられる）。東洋思想、超常現象、代替医療、環境保護といった関心を持つ層が、瞑想や身体作業の伴奏となる音楽を求めたことが直接の需要になった。先駆者としては、Tony ScottやPaul Horn、Irv Teibel、ドイツのDeuter、アメリカではSteven Halpernの名が挙がる。Halpernは、1975年の『Christening for Listening』（1976年に『Spectrum Suite』として再発）で、瞑想的な電子ピアノ（Fender Rhodes）曲が中心だが、1975年初版にはジャズ／ロック曲も含まれていたアルバムを、自身の独立レーベルSound Principle Recordsから発売し、これがニューエイジ音楽の重要な作品のひとつとなった。彼は音の周波数が身体のチャクラ（ヨガで体にあるとされる気の中心）に対応するという理論を掲げており、音楽を治療の道具として位置づけた点で後続に大きな影響を残した。1970年代半ばからギリシャのVangelis（ニューエイジに分類されることもあるが、本人や識者には異論もある）が電子音による叙情的な作風を確立した。1980年代に入ると市場が急拡大する。カリフォルニアのWindham Hillは、1976年にウィリアム・アッカーマンとアン・ロビンソンがパロアルトで創設した小さなレーベルだったが、ピアニストGeorge Winstonの『Autumn』と1982年の『December』の成功でA&amp;Mとの配給契約を得て、一躍主要レーベルになった。同時期にNarada、Private Music、Higher Octaveといったレーベルが続き、Ray LynchやKitaro(喜多郎)、Enyaが商業的成功を収めた。喜多郎は1980年からNHK特集「シルクロード」の音楽を担当し、日本発のニューエイジとして国際的に知られた。1987年にはグラミー賞にBest New Age Recording部門が新設され（初代受賞者はAndreas Vollenweider）、ジャンルとして公式に認知される。しかし同時期から批判も強まった。音楽評論家からは、退屈で無害なだけの壁紙音楽、スピリチュアル商法の付属品といったからかいが浴びせられ、ニューエイジという語自体が音楽家にとって不名誉なレッテルになっていく。EnyaやGeorge Winston本人がこの分類を拒否したことも知られる。1980年代後半から、実作者たちはアンビエント、コンテンポラリー・インストゥルメンタル、ヒーリング・ミュージックなど別の呼称を選ぶようになった。2010年代には、YouTubeのおすすめ機能や収集家、再発売を手がけるレーベルを通じて、日本の吉村弘や芦川聡といった環境音楽の作家が国際的に再発見されている。</p>
