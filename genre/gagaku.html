<h1>Gagaku（ガガク）とは</h1>
<p>雅楽は、日本の宮廷音楽だ。千数百年の伝統を持ち、今も演奏され続けている。管絃は「世界最古の管弦楽」と呼ばれることがある。 その響きは、音階の仕組みと時間の感じ方に特徴がある。音階は「旋法（調子）」と呼ばれる体系でまとめられている。</p>
<p>雅楽は、日本の宮廷音楽だ。千数百年の伝統を持ち、今も演奏され続けている。管絃は「世界最古の管弦楽」と呼ばれることがある。

その響きは、音階の仕組みと時間の感じ方に特徴がある。音階は「旋法（調子）」と呼ばれる体系でまとめられている。「壱越調」「平調」「双調」「黄鐘調」「盤渉調」「太食調」の六調子があり、六調子は楽曲の調性・分類の枠組みである。これらは5音＋2変音（7声）と説明されることが多く、浮遊感と荘厳さを同時に生み出す。

管絃では、使う楽器は大きく三種に分けられる。管楽器では「篳篥（ひちりき）」「龍笛（りゅうてき）」「笙（しょう）」が中心になる。篳篥は、2枚のリード（振動する薄片）で音を出す縦笛だ。鋭く通る音色で主旋律を受け持つ。龍笛は横笛で、高い音域の旋律を奏でる。

笙は17本の竹の管を束ねたフリーリード楽器だ。複数の音を同時に鳴らす「合竹（あいたけ）」という奏法で、西洋のコードとは異なる、音がぎっしり重なる独特の響きを生む。笙は息を吸うときにも音が出るため、途切れのない持続音を鳴らし続けられる。

打楽器には「鞨鼓（かっこ）」「太鼓（たいこ）」「鉦鼓（しょうこ）」が使われる。弦楽器には「琵琶（びわ）」と「箏（そう）」がある。舞楽には弦楽器がない。

リズムは「拍子（ひょうし）」と呼ばれる単位でまとめられる。テンポは極めて遅い。ただし速さは曲の種類によって大きく違い、管絃は舞楽より遅い。このゆったりした時間の流れは、「間（ま）」の考え方と深く結びついている。音と音のあいだの沈黙そのものが、音楽として意味を持つのだ。

曲の構成は「序破急（じょはきゅう）」という三部構造を理想型とする。序は静かにゆっくり始まり、破で展開し、急で速度を上げて終わる。ただし、序破急のそろった楽曲は意外に少ない。この組み立ての考え方は、後の能楽にも影響を与えたとされる。

演奏される場所は、主に宮中の儀式、神社や寺の祭礼、そして現代では演奏会場だ。伝統的には電気的な加工を行わず、楽器本来の倍音と、空間の自然な残響が使われる。

隣り合う東アジアの宮廷音楽（中国の燕楽、朝鮮の雅楽）と比べると、日本の雅楽は、大陸から伝わった要素を独自に変え、保存してきた。とくに日本の笙は和音を常に使う点で、旋律に時折4度・5度を重ねる程度の中国の笙と対照的だ。序破急を理想の構成とみなす考えは日本で形成された可能性が高い、とする説もある。</p>
<h2>成り立ち</h2><p>雅楽の歴史は、日本の国の成り立ちと切り離せない。その起源は、5世紀ごろに大陸の音楽や舞が伝わりはじめたことにさかのぼる。そして10世紀ごろにほぼ完成したとされる。

飛鳥時代末期から奈良時代にかけて、日本は律令国家づくりを急いでいた。唐（中国）・百済・高句麗・新羅・林邑（現在のベトナム中南部）など、大陸・半島・東南アジアの国々から、さまざまな音楽や舞踊を積極的に取り入れた。

701年（大宝元年）に定められた大宝律令で、「雅楽寮（うたまいのつかさ）」が置かれた。雅楽寮は、国家が宮廷音楽を制度として管理する役所として機能した。この役所は歌人・舞人・楽師など数百人を官僚として抱え、外来音楽の習得・保存・演奏を国の事業として進めた。

取り入れた音楽は、のちの平安時代に、左方の「唐楽（とうがく）」と右方の「高麗楽（こまがく）」の二つの系統に整理された。唐楽は中国本土系に加え、林邑楽など中国を経由した諸地域の楽舞を含み、左方（さほう）の舞楽として演奏された。南アジアと関係する曲もある。高麗楽は、高句麗・百済・新羅に加えて渤海の楽舞も土台とし、右方（うほう）の舞楽として唐楽と対になった。この左右の区別は、舞人が舞台に登場する位置や、装束の左右対称にも表れている。また雅楽には、国風歌舞（神楽・東遊など）と歌物（催馬楽・朗詠）もある。

平安時代（794〜1185年）に入ると、雅楽は日本風に変わっていき、独自のスタイルが固まった。平安初期から中期にかけて、楽制の改革が少しずつ進んだ。とくに仁明天皇（在位833〜850年）のころには、創作活動が頂点を迎えたと説明される。雅楽はほぼ10世紀に完成したとされる。

この時期に活躍した音楽家に、源博雅（みなもとのひろまさ、918〜980年）がいる。彼は笛の名手として知られた。鬼と笛を取り替えて笛「葉二（はふたつ）」を得たという話が『十訓抄』に記されるほど、その腕前は伝説の域に達していた。また、藤原師長（ふじわらのもろなが、1138〜1192年）は琵琶と箏の大家として知られ、琵琶の譜集『三五要録』を編んだ。

中世以降、雅楽は宮廷の衰えとともに、一時は担い手を失いかけた。室町時代の応仁の乱（15世紀）では、京都の楽人が離散した。京都方の伝承は大きく途絶えかけたが、天王寺・南都の楽人の協力で再興された。

その後、安土桃山時代から江戸時代の初めにかけて、京都の「三方楽所（さんぽうがくそ）」——南都（奈良）・天王寺（大阪）・京都の三つの楽家集団——の枠組みが成立した。まず朝廷が動き、天正年間に正親町天皇が天王寺の楽人を、文禄年間に後陽成天皇が南都の楽人を召し出した。江戸幕府は、のちにこれを手厚く保護した。この三方楽所の楽師たちは世襲で技術を受け継いだ。のちに江戸幕府側の紅葉山楽人とともに雅楽局に再編され、現在の宮内庁式部職楽部の前身となった。

明治維新（1868年）は、雅楽に大きな変化をもたらした。皇居が東京へ移ったのに伴い、新政府は宮中の奏楽のため、1870年に「雅楽局」を仮に置いた。三方楽所と紅葉山楽人を統合して流儀を統一する必要から、1876年に「明治撰定譜」が作られた（1888年に追加）。そこから外れた曲は「遠楽」と呼ばれた。

林廣守（はやしひろもり、1831〜1896年）は明治政府の命を受け、現在の「君が代」の旋律を、雅楽の壱越調の旋法で作曲した人物とされる。ただし実際には、廣守の長男・林廣季と奥好義がつけた旋律をもとに、廣守が曲を起こしたと見られている。

20世紀後半、雅楽は伝統を守るだけでなく、現代音楽との対話を始めた。作曲家の武満徹（たけみつとおる、1930〜1996年）は、国立劇場の委嘱による雅楽作品『秋庭歌』（1973年）と、『秋庭歌一具』（1979年）を発表した。笙奏者の宮田まゆみは、現代音楽の場で笙の可能性を広げた。ジョン・ケージが彼女のために笙の作品を書いたほか、彼女は武満徹、一柳慧、細川俊夫らの作品を初演した。

現在は、宮内庁式部職楽部が正統な伝承機関として働いている。一方で、東京藝術大学でも雅楽の専門教育が行われている。ユネスコ無形文化遺産（2009年登録）として、国際的な認知も高まっている。</p>
