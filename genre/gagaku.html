<h1>Gagaku（ガガク）とは</h1>
<p>雅楽は日本の宮廷音楽であり、「世界最古のオーケストラ」とも呼ばれる、千数百年の伝統を持つ音楽として現在も演奏され続けている。その音響的な特徴は、西洋音楽とは根本的に異なる音階体系と時間感覚に基づいている。音階は「旋法（調子）」と呼</p>
<p>雅楽は日本の宮廷音楽であり、「世界最古のオーケストラ」とも呼ばれる、千数百年の伝統を持つ音楽として現在も演奏され続けている。その音響的な特徴は、西洋音楽とは根本的に異なる音階体系と時間感覚に基づいている。音階は「旋法（調子）」と呼ばれる体系で組織され、「壱越調」「平調」「双調」「黄鐘調」「盤渉調」「太食調」の六調子が管楽器の調律に対応している。これらは5音音階を基本としながらも、独特の半音の配置を持ち、西洋の長調・短調とは異なる浮遊感と荘厳さを同時に生み出す。

使用楽器は大きく三種に分類される。管楽器としては「篳篥（ひちりき）」「龍笛（りゅうてき）」「笙（しょう）」が中心的役割を担う。篳篥は2枚のリード（振動する薄片）で音を出す縦笛で、鋭く通る音色が主旋律を担当する。龍笛は横笛で、高音域の旋律線を奏でる。笙は17本の竹管を束ねたフリーリード楽器で、複数の音を同時に鳴らす「合竹（あいたけ）」という奏法により、西洋のコードとは異なる音がぎっしり重なる独特の響きを生み出す。この笙の音は息を吸う際にも音が出るという特性を持ち、途切れのない持続音を実現する。打楽器には「鞨鼓（かっこ）」「太鼓（たいこ）」「鉦鼓（しょうこ）」が用いられ、弦楽器には「琵琶（びわ）」と「箏（そう）」がある。

リズム構造は「拍子（ひょうし）」と呼ばれる単位で組織されるが、テンポは極めて遅く、1拍が数秒に及ぶことも珍しくない。この緩慢な時間の流れは「間（ま）」の概念と深く結びついており、音と音の間の沈黙そのものが音楽的意味を持つ。曲の構成は「序破急（じょはきゅう）」という三部構造を基本とし、序は静かにゆっくりと始まり、破で展開し、急で速度を上げて終わるという流れをとる。この構造原理は後の能楽にも影響を与えたとされる。

演奏される場所は主に宮中の儀式、神社・仏閣の祭礼、そして現代では演奏会場である。音響エフェクトとしては人工的な加工は一切施されず、楽器本来の倍音と空間の自然な残響のみが用いられる。隣接する東アジアの宮廷音楽（中国の燕楽、朝鮮の雅楽）と比較すると、日本の雅楽は大陸から伝来した要素を独自に変容・保存しており、特に笙の和音的使用法と序破急の構造化において独自の発展を遂げている点が際立つ。</p>
<h2>成り立ち</h2><p>雅楽の歴史は日本の国家形成と不可分に結びついている。その起源は、5世紀ごろから大陸の音楽や舞が伝わりはじめたことに遡り、10世紀ごろにほぼ完成したとされる。奈良時代の日本は律令国家の建設を急ぎ、唐（中国）・百済・高句麗・新羅・林邑（現在のベトナム中部）など大陸・半島・東南アジア諸国から多様な音楽・舞踊を積極的に輸入した。701年（大宝元年）に制定された大宝律令において「雅楽寮（うたまいのつかさ）」が設置され、これが世界史上でも稀な、国家が宮廷音楽を制度として管理する役所として機能した。雅楽寮は演奏家・作曲家・舞人を官僚として抱え、外来音楽の習得・保存・演奏を国家事業として推進した。

輸入された音楽は、のちの平安時代に、左方の「唐楽（とうがく）」と右方の「高麗楽（こまがく）」の二つの系統に整理された。唐楽は中国・インド・東南アジア系の音楽を源流とし、左方（さほう）の舞楽として演奏された。高麗楽は朝鮮半島系の音楽を源流とし、右方（うほう）の舞楽として対をなした。この左右対称の構成は、演奏時の配置にも反映され、舞台の左右から異なる系統の音楽が奏でられるという独特の儀礼空間を生み出した。

平安時代（794〜1185年）に入ると、雅楽は日本化の過程を経て独自の様式を確立した。平安初期から中期にかけて楽制の改革が少しずつ進み、特に仁明天皇（在位833〜850年）のころには創作活動が頂点を迎えたと説明される。雅楽はほぼ10世紀に完成したとされる。この時期に活躍した音楽家として、源博雅（みなもとのひろまさ、918〜980年）が挙げられる。彼は笛の名手として知られ、鬼から笛「葉二（はふたつ）」を譲り受けたという話が『十訓抄』に記されるほど、その技量は伝説的な域に達していた。また、藤原師長（ふじわらのもろなが、1138〜1192年）は琵琶と箏の大家として知られ、琵琶の譜集『三五要録』を編んだ。

中世以降、雅楽は宮廷の衰退とともに一時的に担い手を失いかけた。室町時代の応仁の乱（15世紀）では楽人が四散し、楽譜や舞楽の装束の大半が焼失して、宮廷音楽としての雅楽はほぼ断絶した。しかし江戸時代（1603〜1868年）に入ると、徳川幕府が朝廷の権威を利用する政策の一環として雅楽の復興を支援し、京都の「三方楽所（さんぽうがくそ）」——南都（奈良）・天王寺（大阪）・京都の三つの楽家集団——が制度的に整備された。この三方楽所の楽師たちは世襲制で技術を継承し、現在の宮内庁式部職楽部の前身となった。

明治維新（1868年）は雅楽に劇的な変化をもたらした。皇居が東京へ移ったことに伴い、新政府は宮中の奏楽のために、1870年に「雅楽局」を仮に設置した。三方楽所と紅葉山楽人を統合して流儀を統一する必要から、1876年に「明治撰定譜」が作られ（1888年に追加）、そこから外れた曲は「遠楽」と呼ばれた。林廣守（はやしひろもり、1831〜1896年）は明治政府の命を受け、現在の「君が代」の旋律を、雅楽の壱越調の旋法で作曲した人物とされる。ただし実際には、廣守の長男・林廣季と奥好義がつけた旋律をもとに廣守が曲を起こしたと見られている。

20世紀後半、雅楽は伝統の保存という枠を超えて現代音楽との対話を始めた。作曲家の武満徹（たけみつとおる、1930〜1996年）は琵琶と尺八を独奏楽器として西洋オーケストラと組み合わせた作品「ノヴェンバー・ステップス」（1967年）を発表し、国際的な注目を集めた。また、笙奏者の宮田まゆみは現代音楽の文脈で笙の可能性を拡張し、ジョン・ケージが彼女のために笙の作品を書いたほか、武満徹、一柳慧、細川俊夫らの作品を初演した。現在、宮内庁式部職楽部が正統な伝承機関として機能する一方、東京藝術大学でも雅楽の専門教育が行われており、ユネスコ無形文化遺産（2009年登録）としての国際的認知も高まっている。</p>
