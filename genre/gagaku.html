<h1>Gagaku（ガガク）とは</h1>
<p>雅楽は日本の宮廷音楽であり、世界最古の組織的な管弦楽の伝統の一つとして現在も演奏され続けている。その音響的な特徴は、西洋音楽とは根本的に異なる音階体系と時間感覚に基づいている。音階は「旋法（調子）」と呼ばれる体系で組織され、「壱越</p>
<p>雅楽は日本の宮廷音楽であり、世界最古の組織的な管弦楽の伝統の一つとして現在も演奏され続けている。その音響的な特徴は、西洋音楽とは根本的に異なる音階体系と時間感覚に基づいている。音階は「旋法（調子）」と呼ばれる体系で組織され、「壱越調」「平調」「双調」「黄鐘調」「鸞鏡調」「盤渉調」の六調子が管楽器の調律に対応している。これらは五音音階を基本としながらも、独特の半音の配置を持ち、西洋の長調・短調とは異なる浮遊感と荘厳さを同時に生み出す。

使用楽器は大きく三種に分類される。管楽器としては「篳篥（ひちりき）」「龍笛（りゅうてき）」「笙（しょう）」が中心的役割を担う。篳篥はダブルリードの縦笛で、鋭く通る音色が主旋律を担当する。龍笛は横笛で、高音域の旋律線を奏でる。笙は17本の竹管を束ねたフリーリード楽器で、複数の音を同時に鳴らす「合竹（あいたけ）」という奏法により、西洋のコードとは異なる独特の和音クラスターを生み出す。この笙の音は息を吸う際にも音が出るという特性を持ち、途切れのない持続音を実現する。打楽器には「鞨鼓（かっこ）」「太鼓（たいこ）」「鉦鼓（しょうこ）」が用いられ、弦楽器には「琵琶（びわ）」と「箏（こと）」がある。

リズム構造は「拍子（ひょうし）」と呼ばれる単位で組織されるが、テンポは極めて遅く、一拍が数秒に及ぶことも珍しくない。この緩慢な時間の流れは「間（ま）」の概念と深く結びついており、音と音の間の沈黙そのものが音楽的意味を持つ。曲の構成は「序破急（じょはきゅう）」という三部構造を基本とし、序は静かにゆっくりと始まり、破で展開し、急で速度を上げて終わるという流れをとる。この構造原理は後の能楽や武道の型にも影響を与えた。

演奏される場所は主に宮中の儀式、神社・仏閣の祭礼、そして現代では演奏会場である。音響エフェクトとしては人工的な加工は一切施されず、楽器本来の倍音と空間の自然な残響のみが用いられる。隣接する東アジアの宮廷音楽（中国の燕楽、朝鮮の雅楽）と比較すると、日本の雅楽は大陸から伝来した要素を独自に変容・保存しており、特に笙の和音的使用法と序破急の構造化において独自の発展を遂げている点が際立つ。</p>
<h2>成り立ち</h2><p>雅楽の歴史は日本の国家形成と不可分に結びついている。その起源は7世紀から8世紀にかけての奈良時代に遡る。当時の日本は律令国家の建設を急ぎ、唐（中国）・百済・高句麗・新羅・林邑（現在のベトナム中部）など大陸・半島・東南アジア諸国から多様な音楽・舞踊を積極的に輸入した。701年（大宝元年）に制定された大宝律令において「雅楽寮（うたまいのつかさ）」が設置され、これが世界史上でも稀な、国家による宮廷音楽の制度的管理機関として機能した。雅楽寮は演奏家・作曲家・舞人を官僚として抱え、外来音楽の習得・保存・演奏を国家事業として推進した。

輸入された音楽は大きく「唐楽（とうがく）」と「高麗楽（こまがく）」に分類された。唐楽は中国・インド・東南アジア系の音楽を源流とし、左方（さほう）の舞楽として演奏された。高麗楽は朝鮮半島系の音楽を源流とし、右方（うほう）の舞楽として対をなした。この左右対称の構成は、演奏時の配置にも反映され、舞台の左右から異なる系統の音楽が奏でられるという独特の儀礼空間を生み出した。

平安時代（794〜1185年）に入ると、雅楽は日本化の過程を経て独自の様式を確立した。醍醐天皇の治世（897〜930年）には、散逸しかけていた曲目の整理・統合が行われ、現在に伝わるレパートリーの基礎が固まった。この時期に活躍した音楽家として、源博雅（みなもとのひろまさ、918〜980年）が挙げられる。彼は笛の名手として知られ、鬼から笛「葉二（はふたつ）」を譲り受けたという伝説が『今昔物語集』に記されるほど、その技量は神話的な域に達していた。また、藤原師長（ふじわらのもろなが、1138〜1192年）は琵琶と箏の大家として知られ、音楽理論書『三五要録』を著した。

中世以降、雅楽は宮廷の衰退とともに一時的に担い手を失いかけた。南北朝の動乱（14世紀）では演奏家が離散し、多くの曲目が失われた。しかし江戸時代（1603〜1868年）に入ると、徳川幕府が朝廷の権威を利用する政策の一環として雅楽の復興を支援し、京都の「三方楽所（さんぽうがくそ）」——南都（奈良）・天王寺（大阪）・京都の三つの楽家集団——が制度的に整備された。この三方楽所の楽師たちは世襲制で技術を継承し、現在の宮内庁式部職楽部の前身となった。

明治維新（1868年）は雅楽に劇的な変化をもたらした。新政府は神道国家建設のために雅楽を国家儀礼の音楽として位置づけ、1870年に「雅楽局」を設置した。この際、西洋音楽の理論を参照しながら楽譜の標準化・音律の統一が行われた。林廣守（はやしひろもり、1831〜1896年）は明治政府の命を受け、現在の「君が代」の旋律を雅楽の様式で編曲した人物として知られる。

20世紀後半、雅楽は伝統の保存という枠を超えて現代音楽との対話を始めた。作曲家の武満徹（たけみつとおる、1930〜1996年）は笙・琵琶・尺八などの雅楽器を西洋オーケストラと組み合わせた作品「ノヴェンバー・ステップス」（1967年）を発表し、国際的な注目を集めた。また、笙奏者の宮田まゆみは現代音楽の文脈で笙の可能性を拡張し、ジョン・ケージやモートン・フェルドマンらの作品を演奏した。現在、宮内庁式部職楽部が正統な伝承機関として機能する一方、東京藝術大学でも雅楽の専門教育が行われており、ユネスコ無形文化遺産（2009年登録）としての国際的認知も高まっている。</p>
