<h1>Horror Ambient（ホラーアンビエント）とは</h1>
<p>恐怖という情動を生じさせることを唯一の目的として設計されたアンビエント。手法は映画の音響設計と共通しており、聴き手の予期を裏切ることで生理的な反応を引き出す。基本素材は、極低域のうねり(20〜40Hz付近の、耳では聴こえにくいが胸</p>
<p>恐怖という情動を生じさせることを唯一の目的として設計されたアンビエント。手法は映画の音響設計と共通しており、聴き手の予期を裏切ることで生理的な反応を引き出す。基本素材は、極低域のうねり(20〜40Hz付近の、耳では聴こえにくいが胸に圧迫を感じる帯域)、金属を引き摺る音、逆再生した楽音、極端に引き伸ばした人声、そして無音そのもの。緊張の作り方には定型があり、長い静寂の後に予告なく大音量を差し込むスティンガーや、少しずつ音程を上げ続けて解決を与えないリーゼゴング的な上昇、そして二つのわずかに周波数の異なる音を重ねて生じる不快な唸りが使われる。弦楽器では駒に極端に近い位置で弓を当てるスル・ポンティチェロ、弓を弦に叩きつけるコル・レーニョ、微分音でずらした複数のヴァイオリンによるクラスターといった現代音楽の奏法が引用される。ピアノは内部の弦を直接擦る、あるいはハンマーを止めて共鳴だけを残す用法が多い。リズムは基本的に排され、代わりに心拍や呼吸、滴る水、足音といった生理的・情景的な音が不規則に置かれる。和声は減五度(トライトーン)や半音のぶつかりを露骨に用い、解決しないまま持続させる。ゲームやアトラクションで実際に使われるものも多く、映像なしで聴くこと自体が試練になるよう作られている点が、他の暗いアンビエントとの相違になる。</p>
<h2>成り立ち</h2><p>母体は20世紀の映画音楽と現代音楽で、両者がインダストリアル以降の電子音楽と合流して独立した分類になった。決定的な参照源はポーランドのKrzysztof Pendereckiで、1960年の「広島の犠牲者に捧げる哀歌」では52の弦楽器が微分音のクラスターと極端な奏法で、旋律を一切持たない音塊を作った。この作品は後にStanley Kubrickが1980年の映画「シャイニング」で無断に近い形で使用し、György Ligetiの「ロンターノ」やKrzysztof Pendereckiの他作品とともに、恐怖の音響の共通語彙として大衆に刷り込まれた。同様に1968年の「2001年宇宙の旅」でLigetiの「レクイエム」が使われたことも、微分音の合唱が超越的な恐怖を表すという定型を作った。電子的な側面では、1956年の映画「禁断の惑星」でLouis and Bebe Barronが完全に電子回路だけで音楽を制作し、回路が焼き切れるまで動作させて録音するという手法をとった。1970年代にはJohn Carpenterが低予算のため自ら音楽を担当し、1978年の「ハロウィン」で5拍子の単純なシンセの反復を用いて、簡素な電子音でも極度の緊張を作れることを示した。1977年の「サスペリア」ではイタリアのバンドGoblinが、囁き声とブズーキと電子音を組み合わせた音楽を制作している。並行して、インダストリアルとダークアンビエントの側からLustmordやColdworkerといった作家が、実際の洞窟や廃墟での録音を素材にした恐怖の音響を発表した。この分野を決定的に拡張したのはゲーム音楽で、1999年から始まる「Silent Hill」シリーズで山岡晃が、金属の擦過音と壊れた工場のノイズを楽曲として提示し、音楽と効果音の境界を消した。2008年の「Dead Space」ではJason Graves がホラー用の弦楽奏法を全面に用い、2010年代の「SOMA」や「Amnesia」ではMikko Tarmiaらが極低域と沈黙の設計を洗練させた。もう一つの流れとしてハロウィン産業がある。アメリカでは1970年代から効果音レコードが季節商品として販売され、後にDisneyのテーマパークやお化け屋敷向けの長時間ループ音源という実用市場を形成した。2010年代以降はストリーミングと動画配信で、映像なしの長時間ホラーアンビエントが独立した鑑賞対象として定着し、Cryo Chamberの「Cthulhu」共作企画のように、H. P. Lovecraftの小説世界を音だけで構築する試みが広い聴衆を得ている。</p>
