<h1>Horror Ambient（ホラーアンビエント）とは</h1>
<p>ホラーアンビエントは、恐怖や不安を呼び起こすことを中心に据える傾向がある、アンビエントの一種だ。手法は映画の音響づくりと共通している。聴き手の予想を裏切ることで、体の反応を引き出す。 基本の素材は、極低域のうねり(20〜40Hz付</p>
<p>ホラーアンビエントは、恐怖や不安を呼び起こすことを中心に据える傾向がある、アンビエントの一種だ。手法は映画の音響づくりと共通している。聴き手の予想を裏切ることで、体の反応を引き出す。

基本の素材は、極低域のうねり(20〜40Hz付近の、耳では聴こえにくい（大音量では聴こえる）が、胸に圧迫を感じる帯域)、金属を引きずる音、逆再生した楽器の音、極端に引き伸ばした人の声、そして無音そのものだ。

緊張の作り方には、決まった型がある。まず、長い静けさの後に、予告なく大音量を差し込むスティンガー。次に、少しずつ音程を上げ続けて解決を与えない、シェパード・リセ・グリッサンド（音程が滑らかに上がり続けて聴こえる音）のような上昇。そして、周波数がわずかに違う二つの音を重ねて生じる、不快なうなりだ。

弦楽器では、駒に極端に近い位置で弓を当てるスル・ポンティチェロ、弓を弦に叩きつけるコル・レーニョ、微分音でずらした複数のヴァイオリンによるクラスターといった奏法が引用される。コル・レーニョやスル・ポンティチェロは古くからある奏法で、20世紀の現代音楽（ペンデレツキら）が先鋭的に使った。

ピアノは、内部の弦を直接こする使い方や、ハンマーを止めて響きだけを残す使い方が多い。

和音は、減5度(トライトーン)や半音のぶつかりをむき出しに使い、落ち着かないまま伸ばし続ける。

リズムは基本的に使わない。代わりに、心拍や呼吸、滴る水、足音といった体や情景の音が、不規則に置かれる。

ゲームやアトラクションで実際に使われるものも多い。映像なしで聴くこと自体が試練になるように作られたものもある。</p>
<h2>成り立ち</h2><p>土台になったのは、20世紀の映画音楽と現代音楽だ。この両者が、インダストリアル以降の電子音楽と合流した。ダークアンビエント（当初は ambient industrial）は1980年代半ばに生まれた。ホラーアンビエントは、その中の映画やホラーに向かう流れを指す呼び名として使われる（定義はまだ定まっていない）。

ポーランドのKrzysztof Pendereckiは、映画やドラマで繰り返し使われ、恐怖の音響の参照点の一つとされる。1960年に作曲され、1961年に初演された「広島の犠牲者に捧げる哀歌」では、52の弦楽器が微分音のクラスターと極端な奏法で、旋律をまったく持たない音のかたまりを作った。この作品は後に「トゥモロー・ワールド」（2006年）や「ツイン・ピークス The Return」などで使われた。

Stanley Kubrickは、1980年の映画「シャイニング」で、Pendereckiの「De natura sonoris」や「The Awakening of Jacob」「Polymorphia」など、そしてGyörgy Ligetiの「ロンターノ」を使った。同じように、1968年の「2001年宇宙の旅」では、Ligetiの「レクイエム」が使われた。これも、ミクロポリフォニー（密な多声が生む音のクラスター）による合唱が、超越的な恐怖を表すという先例になった。

電子の面では、1956年の映画「禁断の惑星」で、Louis and Bebe Barronが完全に電子回路だけで音楽を作った。回路が焼き切れるまで動かして録音する、という手法だった。

1970年代には、John Carpenterが低予算のため、自分で音楽を担当した。1978年の「ハロウィン」では、5/4（10/8とも）の繰り返しの主題を、ピアノの音色とシンセで奏でた。簡素な電子音でも、極度の緊張を作れることを示したのだ。1977年の「サスペリア」では、イタリアのバンドGoblinが、ささやき声とブズーキと電子音を組み合わせた音楽を作っている。

並行して、インダストリアルとダークアンビエントの側からは、Lustmordや、2003年にデビューしたAtrium Carceriといった作家が現れた。Lustmordは、1989年の『Heresy』以降、地下聖堂・洞窟・屠殺場などで録った音を、コンピュータで加工する手法を中心にした。Atrium Carceriは、シンセ、効果音、サンプルが主体である。

一方、ゲーム音楽もホラー音響の重要な発展の場になった。1999年から始まる「Silent Hill」シリーズでは、山岡晃によるインダストリアル調のノイズのような音楽が使われた。2008年の「Dead Space」では、Jason Gravesがホラー用の弦楽奏法を全面に使った。2010年代の「SOMA」や「Amnesia」では、Mikko Tarmiaらが極低域と沈黙の設計を洗練させたとされる。

もう一つの流れが、ハロウィンの産業だ。アメリカでは1950年代末〜60年代から、効果音のLPが季節の商品として売られた。1964年には、ディズニーランド・レコードが、スタジオの効果音素材を集めた「Chilling, Thrilling Sounds of the Haunted House」を発売した。

2010年代以降は、ストリーミングと動画配信によって、映像なしの長時間のホラーアンビエントが、それだけで聴く対象として定着した。Cryo Chamberの「Cthulhu」共作企画のように、H. P. Lovecraftの小説の世界を音だけで組み立てる試みが、広い聴き手を得ている。</p>
