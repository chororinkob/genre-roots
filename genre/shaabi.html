<h1>Shaabi（シャアビ）とは</h1>
<p>シャアビは、エジプトの大衆音楽だ。名前には「民衆のもの」という意味の語が使われている。二つの流れを含むとされるが、後のほうは、担い手自身が別のジャンルだと位置づけている。今の形は1970年代に大衆的な人気を得て定着したもので、ルー</p>
<p>シャアビは、エジプトの大衆音楽だ。名前には「民衆のもの」という意味の語が使われている。二つの流れを含むとされるが、後のほうは、担い手自身が別のジャンルだと位置づけている。今の形は1970年代に大衆的な人気を得て定着したもので、ルーツは1920〜40年代にさかのぼるとされる。

編成は、アコーディオン、キーボード、指で叩く胴太鼓のタブラが中心だ。ダブルリードの木管楽器(ショーム系)であるミズマールは、民俗的な編成で使われる。

メロディーは、アラブ音楽の旋法の仕組みに基づく。四分音に近い細かな音程と、細かい飾りをつけた節回しが特徴だ。

リズムは、バラディのスタイルの枠組みの中で、maqsoum など4拍子系のリズムを基本とする。腰を使う踊りのためのリズムである。

歌い方は感情を隠さない。曲の頭に、拍のない歌の即興である mawwal を置き、庶民の俗語で荒削りに歌う。歌詞は、生活の苦しさ、失業、権力への皮肉、恋愛を、洗練を拒んだ俗語で語る。

近年のマハラガナート(電子シャアビとも呼ばれる)は、シャアビの影響を受けて生まれた。ただし担い手は、別のジャンルだと位置づけている。パソコンと海賊版ソフトを使い、サンプルと打ち込みを中心に作られる。声には強いオートチューンがかけられ、金属的で甲高い電子音が鳴る。テンポは曲によって異なる。伝統的な太鼓の型を打ち込みで再現し、そこへ耳を刺す電子音を重ねる。歌詞には、結婚式を盛り上げるための煽りと、都市の周縁で生きる若者の現実が入り混じる。そのため、しばしば当局に嫌われる。</p>
<h2>成り立ち</h2><p>1970年代のエジプトでは、経済開放政策のもとで貧富の差が急速に広がった。手頃な住宅を正規の市場で得られない人々は、密集した非公式の居住地区に集まった。

シャアビは、1920〜40年代に都市の庶民の音楽として形づくられた。そして1970年代、この人々の気持ちを代わりに語る音楽として大衆的な人気を得て、定着した。最初に大衆的な人気を得たとされる歌手が、Ahmed Adaweyahである(それ以前にもシャアビの歌手はいた)。洗練された古典的なアラブ歌謡が主流だった時代に、彼は粗野な発声と俗語の歌で爆発的な人気を得た。

当時の国営放送は彼を締め出した。それでも、カセットテープという安い媒体を通じて、その音楽は路上や乗合バス、市場にあふれた。放送を通さずに広められるようになったことが、この分野が成り立つ重要な要因の一つだった。

2000年代半ば、説では2004〜2008年頃に、この音楽は新しい段階に入る。カイロの周縁の地区に住む十代後半から二十代前半の若者たちが、海賊版の音楽制作ソフトを使い、パソコン1台で曲を作り始めたのだ。彼らは伝統的な太鼓の型を打ち込みで再現した。そこへ極端に歪んだ電子音と、音程を補正した声を乗せた。この形は「祭り」を意味する語で呼ばれ、結婚式の余興として爆発的に広まる。

2011年の革命の前後の混乱期には、この音楽は若者の声を代弁し、路上の抗議の場でも鳴らされた。SadatやAlaa Fiftyといった演者は、国際的にも知られるようになる。鍵盤を壊すように叩くIslam Chipsyも、この流れの中で語られることが多い。ただし本人は距離を置いており、演奏は主にインストゥルメンタルである。

しかし、この成功は激しい反発を招いた。2020年2月、エジプトの音楽家組合は、マハラガナートの歌手が国内の催しやクラブ、カフェなどに出ることを禁じると発表した。2020年3月4日には、組合は「マハラガナートではない」新しい部門を設けた。試聴委員会の審査を通れば、年間ライセンスで出演できるとしたのだ。それでも2021年には、歌手19人が禁じられている。理由は、歌詞が道徳を損ない、社会の価値をおとしめるというものだった。

この措置は、表現の自由をめぐる大きな論争になった。階級や、文化としての正しさをめぐる対立も表に出た。禁止されても、この音楽は動画共有サイトと結婚式の現場で鳴り続けている。</p>
