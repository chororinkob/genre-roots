<h1>Shaabi（シャアビ）とは</h1>
<p>エジプトで、民衆のものという意味の語を冠した大衆音楽である。二つの世代を含む。古典的な形態は1970年代に確立したもので、編成には縦笛の一種であるミズマール、手風琴、指で叩く胴太鼓のタブラ、電気オルガンなどが用いられる。旋律はアラ</p>
<p>エジプトで、民衆のものという意味の語を冠した大衆音楽である。二つの世代を含む。古典的な形態は1970年代に確立したもので、編成には縦笛の一種であるミズマール、手風琴、指で叩く胴太鼓のタブラ、電気オルガンなどが用いられる。旋律はアラブ音楽の旋法体系に基づき、四分音に近い微細な音程と、装飾を凝らした節回しが特徴となる。リズムはバラディと呼ばれる、腰を使う踊りのための跳ねた四拍子が基本である。歌唱は喉を絞った鼻にかかる発声で、感情を隠さず、しばしば語りに近い。歌詞は生活の苦しさ、失業、権力への皮肉、恋愛を、洗練を拒んだ俗語で述べる。近年の形態はさらに過激で、生楽器を捨て、安価な制作ソフトによる歪んだ電子音と打ち込みだけで作られる。声には音程補正の装置が極端にかけられ、低音は音量の限界を超えて潰される。テンポは概ね100から120 BPMで、伝統的な太鼓の型を打ち込みで再現しながら、そこへ耳を刺す電子音が重ねられる。歌詞は結婚式で盛り上げるための煽りと、都市の周縁で生きる若者の現実が混在し、しばしば当局の忌避に触れる。</p>
<h2>成り立ち</h2><p>1970年代のエジプトでは、経済開放政策のもとで貧富の差が急速に拡大し、農村から首都カイロへ大量の人口が流入していた。彼らが暮らしたのは、行政の管理が及ばない密集した非公式の居住地区である。この人々の情感を代弁する音楽として、シャアビは生まれた。最初の大きな存在はAhmed Adaweyahである。彼は洗練された古典的なアラブ歌謡が支配していた時代に、粗野な発声と俗語による歌で爆発的な人気を得た。当時の国営放送は彼を締め出したが、カセットテープという安価な媒体を通じて、その音楽は路上と乗合バスと市場に溢れた。放送を経由しない流通が可能になったことが、この分野の成立の決定的な条件だった。2000年代に入ると、この音楽は新しい段階へ入る。カイロの周縁の地区に住む10代の若者たちが、海賊版の音楽制作ソフトを使い、パソコン一台で楽曲を作り始めたのである。彼らは伝統的な太鼓の型を打ち込みで再現し、そこへ極端に歪んだ電子音と、音程補正をかけた声を乗せた。この形態は祭りを意味する語で呼ばれ、結婚式の余興として爆発的に広まる。2011年の革命前後の混乱期に、この音楽は若者の鬱屈を最も直接に代弁するものとなり、路上の抗議の場でも鳴らされた。SadatやAlaa Fifty、鍵盤を破壊的に叩くIslam Chipsyといった演者が国際的にも知られるようになる。しかしこの成功は激しい反発を招いた。2020年、エジプトの音楽家組合は、この分野の演者に対して公の場での演奏を禁じる決定を下した。理由は、歌詞が道徳を損ない、社会の価値を貶めるというものである。この措置は表現の自由をめぐる大きな論争となり、階級と文化的な正統性をめぐる対立を露呈させた。禁止にもかかわらず、この音楽は動画共有サイトと結婚式の現場で鳴り続けている。</p>
