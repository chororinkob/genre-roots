<h1>Enkaとは</h1>
<p>こぶしと呼ばれる細かい声の揺らしを最大の武器とし、耐える情感を歌い上げる日本の大衆歌謡。音階は長音階から第4音と第7音を抜いたヨナ抜き音階、あるいは短音階から同様に音を抜いた都節系の音階が中心で、この音の選び方が独特の哀感を作る。</p>
<p>こぶしと呼ばれる細かい声の揺らしを最大の武器とし、耐える情感を歌い上げる日本の大衆歌謡。音階は長音階から第4音と第7音を抜いたヨナ抜き音階、あるいは短音階から同様に音を抜いた都節系の音階が中心で、この音の選び方が独特の哀感を作る。歌唱ではこぶしのほかに、語尾を震わせるビブラート、息を混ぜてかすれさせる発声、意図的に音程へ下から入るしゃくりといった技法が体系化されており、これらの使い分けが歌手の個性そのものになる。伴奏は弦楽合奏とギター、和太鼓や三味線、尺八といった邦楽器を織り交ぜ、間奏では尺八やサックスが主旋律を吹く。テンポは遅く60〜80BPM程度、拍子は4分の4が基本で、曲の後半に転調して盛り上げる型が多い。歌詞の主題は限定されており、報われない恋、別れ、酒、雪や海や港といった北国の風景、故郷への思い、母への感謝が繰り返し歌われる。三番構成が定型で、一番と二番で情景を語り、三番で心情を締める。歌手は着物やタキシードで直立して歌い、身振りを抑えることで声の表現に集中させる点も様式の一部である。</p>
<h2>成り立ち</h2><p>語源は明治時代にさかのぼる。自由民権運動の活動家たちが、演説を禁じられた際に主張を歌にして街頭で売り歩いた演説歌が略されて演歌となった。明治末から大正にかけては添田唖蝉坊らが社会風刺を歌う演歌師として知られ、ヴァイオリンを伴奏に街角で歌う姿が定着する。ただし、現在の演歌と呼ばれる音楽の直接の母体は、昭和初期の流行歌である。1931年、古賀政男が作曲し藤山一郎が歌った「酒は涙か溜息か」は、ギターの音色と切ない旋律で大衆をつかみ、いわゆる「古賀メロディー」の型を確立した。戦後は美空ひばりが登場する。1949年、12歳で「悲しき口笛」を歌った彼女は、以後半世紀にわたって日本の歌謡界の中心に立ち続けた。1960年代に入ると、ジャズやロックの影響を受けたポップスと、日本的な情感を守る歌との区別が意識されるようになり、後者を指す名として演歌の語が再利用される。この時期に春日八郎、三橋美智也、北島三郎、都はるみ、五木ひろしといった歌手が現れ、作曲家では船村徹、猪俣公章、市川昭介、作詞家では星野哲郎、なかにし礼、阿久悠が量産の体制を支えた。1970年、藤圭子の「圭子の夢は夜ひらく」は、影のある低い声と暗い歌詞で当時の若者にまで届き、演歌の表現の幅を広げている。テレビ番組「NHK紅白歌合戦」と、地方を回る歌謡ショー、そして有線放送が普及の三本柱だった。1980年代の演歌は成熟の頂点にあり、細川たかしや石川さゆりの「津軽海峡・冬景色」が国民的に知られる。だが同時に聴き手の高齢化が進み、若い世代はニューミュージックやJ-POPへ移っていった。1990年代以降は市場が縮小し、業界は氷川きよしのような若手の売り出しで対応する。近年は演歌の様式を意図的に借りたポップスや、海外での再評価も見られ、日本人の情感を代表する音楽という位置づけ自体が問い直されている。</p>
