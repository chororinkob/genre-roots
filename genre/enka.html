<h1>Enkaとは</h1>
<p>演歌は、こぶしと呼ばれる細かい声の揺らしを最大の武器とし、耐える情感を歌い上げる日本の大衆歌謡だ。 音階は、長音階から第4音と第7音を抜いたヨナ抜き音階が中心になる。あるいは、短音階から同様に音を抜いた都節（みやこぶし）系の音階も</p>
<p>演歌は、こぶしと呼ばれる細かい声の揺らしを最大の武器とし、耐える情感を歌い上げる日本の大衆歌謡だ。

音階は、長音階から第4音と第7音を抜いたヨナ抜き音階が中心になる。あるいは、短音階から同様に音を抜いた都節（みやこぶし）系の音階も使われる。この音の選び方が、独特の哀感を作る。

伴奏には、ギター、ヴァイオリン、三味線、尺八、和太鼓などが用いられる。

遅めの曲が多いが、拍子・テンポは曲ごとに異なる。曲の後半に転調（調を変えること）して盛り上げる曲もある。

こぶしやビブラートを多用する歌唱が特徴とされる。

歌詞の主題は、報われない恋、別れ、酒、雪や海や港といった北国の風景、故郷への思い、母への感謝が繰り返し歌われてきた。ただ、中高年女性の支持を得て「夫婦」も主題に加わった（「ふたり酒」1980年、「だんな様」1983年）。

三番構成の曲が多く、一番と二番で情景を語り、三番で心情を締めることもある。歌手は着物やスーツ、ドレスなどで歌うことが多い。</p>
<h2>成り立ち</h2><p>語源は明治時代にさかのぼる。自由民権運動の活動家たちが、演説会への取り締まりが強まるなか、主張を歌にして街頭で売り歩いた。この演説歌が略されて、演歌となった。

明治末から大正にかけては、添田唖蝉坊らが社会風刺を歌う演歌師として知られた。神長瞭月が演歌にヴァイオリンを最初に用いたとされ、ヴァイオリンを伴奏に街角で歌う姿が定着する。

ただし、現在の演歌は、昭和初期の流行歌（古賀メロディーなど）や戦後のレコード歌謡の流れを汲みつつ、1960年代後半〜70年ごろに「演歌」というジャンルとして成立した（諸説あり）。1931年、古賀政男が作曲し藤山一郎が歌った「酒は涙か溜息か」は、ギターの音色と切ない旋律で大衆をつかんだ。いわゆる「古賀メロディー」の型を固めた曲だ。

戦後に登場した美空ひばりは、歌謡曲を代表する存在で、のちに演歌に分類される曲も多い。初舞台は1945年12月（8歳）。レコードデビューは1949年（11歳）の「河童ブギウギ」だ。同じ1949年、12歳で「悲しき口笛」を歌って出世作とした。彼女は1989年の没まで約40年にわたって、日本の歌謡界の中心に立ち続けた。

1960年代半ば（1964年の朝日新聞が初例）〜後半に、古いタイプのレコード歌謡が「演歌」と呼ばれ始めた。1970年ごろにジャンルとして固まった。

1950年代には春日八郎（1952年デビュー）や三橋美智也（1954年デビュー）が活躍した。1960年代には北島三郎（1962年）、都はるみ（1964年）、五木ひろし（1965年、芸名は松山まさる）が登場した。作曲家では船村徹、猪俣公章、市川昭介、作詞家では星野哲郎、なかにし礼が、量産の体制を支えた。阿久悠が演歌を手がけたのは主に1970年代以降である。

1970年、藤圭子の「圭子の夢は夜ひらく」は、影のある低い声と暗い歌詞で当時の若者にまで届き、演歌の表現の幅を広げている。1951年にラジオ番組として始まり、1953年12月からテレビ放送になった「NHK紅白歌合戦」と、地方を回る歌謡ショー、そして有線放送は、いずれも普及の要因の一つだったと見られる。1977年に発売された石川さゆりの「津軽海峡・冬景色」は国民的に知られ、1980年代にも細川たかしらが活躍した。

一方で、カラオケの普及により歌詞・曲調・歌唱技法がどれも似てきた。1980年代後半にはカラオケボックスの普及などで若者の利用が増え、演歌のシェアは狭まった。1990年代以降は市場が縮小し、業界は氷川きよしのような若手の売り出しで対応する。近年は演歌のスタイルを意図的に借りたポップスや、海外での再評価も見られる。日本人の情感を代表する音楽という位置づけ自体が問い直されている。</p>
