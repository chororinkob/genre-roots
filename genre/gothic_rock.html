<h1>Gothic Rock（ゴシックロック）とは</h1>
<p>パンク以後のギターバンドの編成を保ちながら、音色と主題を暗黒方向へ徹底させたロック。最大の特徴はギターの音作りで、歪みよりもコーラス、フランジャー、ロングディレイ、深いリヴァーブを重ね、和音を弾いても輪郭が滲む冷たい響きを作る。低</p>
<p>パンク以後のギターバンドの編成を保ちながら、音色と主題を暗黒方向へ徹底させたロック。最大の特徴はギターの音作りで、歪みよりもコーラス、フランジャー、ロングディレイ、深いリヴァーブを重ね、和音を弾いても輪郭が滲む冷たい響きを作る。低音弦のパワーコードより高音弦のアルペジオや、意図的に不協和を残す和音が好まれる。ベースは曲の旋律を担うほど前に出て、ピックで硬く弾いた音を中域まで持ち上げる。ドラムはフロアタムとスネアを強く打つ部族的なパターンや、ドラムマシンによる無機質な反復が使われ、ハイハットの刻みを排して空間を作ることが多い。テンポは100〜140BPM。ヴォーカルは男性なら墓場から響くような低いバリトンで芝居がかった発声、女性なら鋭く裏返る叫びを含む表現主義的な歌唱になる。和声は自然短音階とフリギア旋法が中心で、増音程や半音進行で不安を演出する。歌詞は死、吸血鬼、宗教的な堕落、性と暴力、ゴシック小説や象徴主義詩からの引用で構成され、直接的な社会批判より寓話的な暗喩を好む。ライヴでは黒衣、白塗り、逆立てた髪といった視覚様式が音と不可分に結びついている。ポストパンクの一分派だが、暗さを美学として自覚的に様式化した点で他と区別される。</p>
<h2>成り立ち</h2><p>1979年から1982年頃のイギリスで、パンクの熱狂が失速した後の空白から生まれた。呼称の起源には諸説あるが、1979年にJoy Divisionのマネージャー Tony Wilsonが同バンドを「ゴシック」と形容した発言や、Siouxsie and the Bansheesを評した英国音楽誌の記事が早い例として挙がる。音としての出発点はBauhausが1979年に発表した9分半のシングル「Bela Lugosi's Dead」で、ドラムのボサノヴァ的なリズムと空虚なダブ処理、Peter Murphyの朗誦めいた歌が、それまでのロックにない不気味な空間を作った。同時期にSiouxsie and the Bansheesの1981年「Juju」、The Cureの1982年「Pornography」、Killing Jokeの攻撃的なリズムがそれぞれの方向から様式を固めた。決定的な場となったのはロンドンのソーホーにあったクラブBatcaveで、1982年にOllie WisdomとJon Kleinが開いた。ここに集った黒衣の客の見た目がバットケイヴ・シーンと呼ばれ、後にゴス(goth)という語がサブカルチャー全体の名として定着する。The Sisters of Mercyはリーズで1980年にAndrew Eldritchが結成し、Doktor Avalancheと名付けたドラムマシンを正式メンバー扱いにして、機械的な反復と低いバリトンでジャンルの代表格になった。しかしEldritchはゴシックというレッテルを一貫して嫌悪し、後年まで公然と否定し続けた。同バンドは1985年に分裂し、離脱したメンバーがThe Missionを結成するという内紛も起きている。他にThe March Violets、Fields of the Nephilim、Alien Sex Fiend、Southern Death Cult(後のThe Cult)が続いた。レーベル面ではBeggars Banquet、4AD、Merciful Releaseが重要な役割を果たした。1980年代後半にはイギリスの音楽誌が一斉に手のひらを返してゴス叩きを始め、大袈裟で滑稽なものとして嘲笑の対象となり、主流からは急速に消えた。しかしサブカルチャーとしては地下で存続し、ドイツやアメリカで独自に育つ。1990年代にはMarilyn MansonやType O Negativeが別経路で暗黒美学を大衆化し、日本ではヴィジュアル系がゴシックの視覚言語を独自に発展させた。1999年のコロンバイン高校銃乱射事件では、犯人がゴスだったという誤報が全米に広まり、無関係な若者への偏見と迫害を引き起こす。2007年にはイギリスでゴス風の服装をしていた女性Sophie Lancasterが暴行を受けて死亡し、これを機に亜文化への差別を憎悪犯罪として扱う法改正の議論が進んだ。現在もWhitby Goth WeekendやWave-Gotik-Treffenといった祭典を通じて共同体が維持されている。</p>
<h2>代表曲</h2><ul><li>Bela Lugosi's Dead (Bauhaus)</li><li>Spellbound (Siouxsie and the Banshees)</li><li>Temple of Love (The Sisters of Mercy)</li><li>A Night Like This (The Cure)</li><li>Wasteland (The Mission)</li></ul>
