<h1>Gothic Rock（ゴシックロック）とは</h1>
<p>ゴシック・ロックは、パンク以後のギターバンドの編成を保ちながら、音色と主題を暗黒方向へ徹底させたロックだ。ポストパンクの一分派だが、暗さを美学として自覚的にスタイル化した点で、ほかと区別される。 ギターの音作りは特徴のひとつだ。マ</p>
<p>ゴシック・ロックは、パンク以後のギターバンドの編成を保ちながら、音色と主題を暗黒方向へ徹底させたロックだ。ポストパンクの一分派だが、暗さを美学として自覚的にスタイル化した点で、ほかと区別される。

ギターの音作りは特徴のひとつだ。マイナー・コードを軸に、リヴァーブなどのエフェクトを多用する。和音を弾いても輪郭がにじむ、冷たい響きになる。

和音には、不協和と評される響きもある。ベースは曲の旋律を担うほど前に出る。

ドラムは、フロアタム（床に置く大きなタム）とスネアを強く打つ部族的なパターンが中心だ。ドラムマシンによる無機質な反復も使われる。

ヴォーカルは、男性では、墓場から響くような低いバリトンで、芝居がかった発声をする例が目立つ。

歌詞の主題は、ゴシック文学、ニヒリズム、ダーク・ロマンティシズム、詩、悲劇、宗教的シンボル、超自然的神秘である。

ライヴでは、黒衣、白塗り、逆立てた髪といった見た目のスタイルが、音と切り離せないほど結びついている。</p>
<h2>成り立ち</h2><p>1979年から1982年ごろのイギリスで、ゴシック・ロックは生まれた。パンクの熱狂が失速した後の空白が、その土壌だった。

呼称の起源には諸説ある。1979年にFactory Records共同設立者のTony WilsonがJoy Divisionを「ゴシック」と形容した発言が、早い例として挙がる。Siouxsie and the Bansheesを評した英国音楽誌の記事も同じだ（NME誌、Nick Kent、1978年7月29日付のBanshees公演評）。さらに早い用例として、1967年のThe Doors評もある。

音としては、後年、出発点とされることが多い曲がある。Bauhausが1979年に発表した約9分36秒のシングル「Bela Lugosi's Dead」だ。空虚なダブ処理（音を加工して空間を広げる手法）と、Peter Murphyの朗誦めいた歌が、それまでのロックにない不気味な空間を作った。

同時期には、Siouxsie and the Bansheesの1981年「Juju」と、The Cureの1982年「Pornography」が出た。どちらもゴシックロックの代表作と評されることがある。Killing Jokeはゴシックロックの先駆（proto-goth）とされる。

プロミネントな集合場所となったのは、ロンドンのソーホーにあったクラブBatcaveだ。1982年7月にOlli WisdomとJon Kleinが開いた。ここに集った黒衣の客の見た目は、バットケイヴ・シーンと呼ばれた。後にゴス(goth)という語が、サブカルチャー全体の名として定着する。

The Sisters of Mercyは、リーズで1980年にGary MarxとAndrew Eldritchが結成した。機械的な反復と低いバリトンで、ジャンルの代表格になった。しかしバンドは、プレス発言や契約書の付帯条件を通じて、ゴスとの結びつけを一貫して避けてきた（Eldritch個人の公的否定が記録されているのは1990年代初頭以降）。同バンドは1985年に分裂し、離脱したメンバーがThe Missionを結成するという内紛も起きている。

他にThe March Violets、Fields of the Nephilim、Alien Sex Fiend、Southern Death Cult（解散後にIan Astburyが結成したDeath Cultが、のちにThe Cultとなった）が続いた。レーベル面では、Beggars Banquet、4AD、Merciful Releaseが重要な役割を果たした。

1980年代末には、メディア・業界の関心が薄れ、からかいの対象にもなった。しかしサブカルチャーとしては地下で存続した。米国では、1970年代末〜80年代初頭にカリフォルニアでデスロックが発達した。ドイツの大型祭典Wave-Gotik-Treffenは、1992年に始まった。

1990年代には、MansonはSpin誌が「goth-shock icon」と呼ぶ存在で、古参ゴスからは「poseur」と拒絶されている。Type O Negativeは、ゴシック・メタル／ドゥーム・メタルの米国バンド（1989年結成）である。日本のヴィジュアル系は、グラム・ロック、ヘヴィメタル、パンク、ゴシックロックなどの影響下に生まれた。初期の一部は、80年代のゴスの影響を受けた。

1999年のコロンバイン高校銃乱射事件では、犯人がゴスだったという誤報が全米に広まった。無関係な若者への偏見と迫害を引き起こした。2007年には、イギリスでゴス風の服装をしていた女性Sophie Lancasterが、暴行を受けて死亡した。これを機に、2009年には法務大臣が、量刑指針を改めて、サブカルチャーを標的とした攻撃を刑を重くする事情として扱わせる考えを示した。2013年には、グレーター・マンチェスター警察が、ゴスなどへの犯罪をヘイトクライムとして記録し始めた。

現在も、Whitby Goth WeekendやWave-Gotik-Treffenといった祭典を通じて、共同体が維持されている。</p>
