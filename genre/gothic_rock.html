<h1>Gothic Rock（ゴシックロック）とは</h1>
<p>パンク以後のギターバンドの編成を保ちながら、音色と主題を暗黒方向へ徹底させたロック。ギターは、リヴァーブ（音を響かせる効果）などのエフェクター（音を加工する機器）を多く使い、冷たく暗い響きを作る。ギターの弾き方は、鎌で刈るように鋭</p>
<p>パンク以後のギターバンドの編成を保ちながら、音色と主題を暗黒方向へ徹底させたロック。ギターは、リヴァーブ（音を響かせる効果）などのエフェクター（音を加工する機器）を多く使い、冷たく暗い響きを作る。ギターの弾き方は、鎌で刈るように鋭く切り込むと評されることがある。ベースは曲の旋律を担うほど前に出る。ドラムはフロアタム（床に置く大きなタム）とスネアを強く打つ部族的なパターンや、ドラムマシンによる無機質な反復が使われる。ヴォーカルは、男性では墓場から響くような低いバリトンで、芝居がかった発声になることが多い。和声は、マイナー・コード（暗く聞こえる和音）が重んじられ、不協和（音がぶつかる感じ）と評されることもある。歌詞は、死、吸血鬼、宗教的な堕落、ゴシック小説からの引用などで構成される。ニヒリズム（何にも意味はないという考え方）や、宗教的な象徴、超自然的な神秘も題材になった。初期の歌詞は、自分の内面を見つめる個人的なものが多かった。ライヴでは黒衣、白塗り、逆立てた髪といった視覚様式が音と切り離せないほど結びついている。ポストパンクの一分派だが、暗さを美学として自覚的に様式化した点で他と区別される。</p>
<h2>成り立ち</h2><p>1979年から1982年頃のイギリスで、パンクの熱狂が失速した後の空白から生まれた。呼称の起源には諸説あるが、1979年にFactory Records共同設立者のTony WilsonがJoy Divisionを「ゴシック」と形容した発言や、Siouxsie and the Bansheesを評した英国音楽誌の記事（1978年7月のSiouxsie公演評）が早い例として挙がる（さらに早い用例として、1967年のThe Doors評もある）。音としては後年、出発点とされることが多いのがBauhausが1979年に発表した約9分36秒のシングル「Bela Lugosi's Dead」で、空虚なダブ処理（音を加工して空間を広げる手法）と、Peter Murphyの朗誦めいた歌が、それまでのロックにない不気味な空間を作った。同時期に、Siouxsie and the Bansheesの1981年「Juju」とThe Cureの1982年「Pornography」が、ゴシックロックの代表作と評されることがある（どちらのバンドも、その分類を認めていない）。Killing Jokeは、ゴシックロックより前の先駆けとされるバンドで、本人たちはその呼ばれ方を嫌っていた。初期の集まりの場としては、リーズのF Clubなども挙げられる。中でもよく知られたのはロンドンのソーホーにあったクラブBatcaveで、1982年7月にOlli WisdomとJon Kleinが開いた。ここに集った黒衣の客の見た目がバットケイヴ・シーンと呼ばれ、後にゴス(goth)という語がサブカルチャー全体の名として定着する。The Sisters of Mercyはリーズで1980年にAndrew EldritchとGary Marxが結成し、機械的な反復と低いバリトンでジャンルの代表格になった。しかしバンドは、記者へのコメントや、公演の契約に付ける条件書を通じて、ゴシックと結びつけられることを一貫して避けてきた（Eldritch個人が公の場で否定したと記録されているのは、1990年代初頭以降）。同バンドは1985年に分裂し、離脱したメンバーがThe Missionを結成するという内紛も起きている。他にThe March Violets、Fields of the Nephilim、Alien Sex Fiend、Southern Death Cult（解散後にIan Astburyが結成したDeath Cultが、のちにThe Cultとなった）が続いた。レーベル面ではBeggars Banquet、4AD、Merciful Releaseが重要な役割を果たした。1980年代末にメディア・業界の関心が薄れ、からかいの対象にもなった。しかしサブカルチャーとしては地下で存続した。アメリカでは、それより前の1970年代末から1980年代初頭に、カリフォルニアでパンクの別の流れとしてデスロック（暗い雰囲気のパンク）が生まれていた。ドイツでは1992年に、大きな祭典Wave-Gotik-Treffenが始まった。1990年代には、Marilyn Mansonが、雑誌で「ゴス風で人を驚かせる代表的な存在」と呼ばれた。ただし、昔からのゴスの一部は、彼を「ゴスの本当の意味をだめにする、ふりをしているだけの人」として受け入れなかった。Type O Negativeは、1989年にニューヨークで結成された、ゴシック・メタル（暗い雰囲気のヘヴィメタル）のバンドである。日本のヴィジュアル系は、グラム・ロック、ヘヴィメタル、パンク、ゴシックロックなどの影響を受けて生まれ、初期の一部には1980年代のゴスの影響を受けたバンドもあった。1999年のコロンバイン高校銃乱射事件では、犯人がゴスだったという誤報が全米に広まり、無関係な若者への偏見と迫害を引き起こす。2007年にはイギリスでゴス風の服装をしていた女性Sophie Lancasterが暴行を受けて死亡し、これを機に、2009年には法務大臣が、量刑指針を改めて、サブカルチャーを標的とした攻撃を刑を重くする事情として扱わせる考えを示し、2013年にはグレーター・マンチェスター警察がゴスなどへの犯罪をヘイトクライムとして記録し始めた。現在もWhitby Goth WeekendやWave-Gotik-Treffenといった祭典を通じて共同体が維持されている。</p>
