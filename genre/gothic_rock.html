<h1>Gothic Rock（ゴシックロック）とは</h1>
<p>パンク以後のギターバンドの編成を保ちながら、音色と主題を暗黒方向へ徹底させたロック。特徴の一つはギターの音作りで、暗い響きのマイナー・コード（短調の和音）にリヴァーブ（響かせる効果）などのエフェクトを多用し、和音を弾いても輪郭が滲</p>
<p>パンク以後のギターバンドの編成を保ちながら、音色と主題を暗黒方向へ徹底させたロック。特徴の一つはギターの音作りで、暗い響きのマイナー・コード（短調の和音）にリヴァーブ（響かせる効果）などのエフェクトを多用し、和音を弾いても輪郭が滲む冷たい響きを作る。暗い響きのマイナー・コードが重視され、耳障りな不協和と評されることもある。ベースは曲の旋律を担うほど前に出る。ドラムはフロアタム（床に置く大きなタム）とスネアを強く打つ部族的なパターンや、ドラムマシンによる無機質な反復が使われる。ヴォーカルは、墓場から響くような低くうなるバリトンで芝居がかった発声をするものがよく挙げられる。歌詞はゴシック文学やニヒリズム（虚無主義）、ダーク・ロマンティシズム、詩や悲劇、宗教的な象徴、超自然的な神秘などを題材にし、初期には内省的で個人的なものが多かった。ライヴでは黒衣、白塗り、逆立てた髪といった視覚様式が音と切り離せないほど結びついている。ポストパンクの一分派だが、暗さを美学として自覚的に様式化した点で他と区別される。</p>
<h2>成り立ち</h2><p>1979年から1982年頃のイギリスで、パンクの熱狂が失速した後の空白から生まれた。呼称の起源には諸説あるが、1979年にFactory Records共同設立者のTony WilsonがJoy Divisionを「ゴシック」と形容した発言や、Siouxsie and the Bansheesを評した英国音楽誌の記事（1978年7月のSiouxsie公演評）が早い例として挙がる（さらに早い用例として、1967年のThe Doors評もある）。音としては後年、出発点とされることが多いのがBauhausが1979年に発表した9分半のシングル「Bela Lugosi's Dead」で、空虚なダブ処理（音を加工して空間を広げる手法）と、Peter Murphyの朗誦めいた歌が、それまでのロックにない不気味な空間を作った。同時期にSiouxsie and the Bansheesの1981年「Juju」、The Cureの1982年「Pornography」がそれぞれの方向から様式を固めた。Killing Jokeはゴシックロックの先駆とされるが、本人たちはその呼び名を嫌った。決定的な場となったのはロンドンのソーホーにあったクラブBatcaveで、1982年7月にOlli WisdomとJon Kleinが開いた。ここに集った黒衣の客の見た目がバットケイヴ・シーンと呼ばれ、後にゴス(goth)という語がサブカルチャー全体の名として定着する。The Sisters of Mercyはリーズで1980年にGary MarxとAndrew Eldritchが結成し、機械的な反復と低いバリトンでジャンルの代表格になった。しかしバンドはゴシックというレッテルを一貫して退けてきた（Eldritch個人の公の否定が記録されているのは1990年代初頭以降）。同バンドは1985年に分裂し、離脱したメンバーがThe Missionを結成するという内紛も起きている。他にThe March Violets、Fields of the Nephilim、Alien Sex Fiend、Southern Death Cult（解散後にIan Astburyが結成したDeath Cultが、のちにThe Cultとなった）が続いた。レーベル面ではBeggars Banquet、4AD、Merciful Releaseが重要な役割を果たした。1980年代末にメディア・業界の関心が薄れ、からかいの対象にもなった。しかしサブカルチャーとしては地下で存続した。アメリカでは1970年代末〜80年代初頭にカリフォルニアでデスロックという別の系統が生まれており、ドイツでは1992年に大型祭典Wave-Gotik-Treffenが始まった。1990年代には、Marilyn Mansonが「ゴス・ショックの象徴」と呼ばれ（古参のゴスからは拒絶された）、Type O Negativeがゴシック・メタルの米国バンドとして活動し、日本ではヴィジュアル系が、グラム・ロックやヘヴィメタル、パンク、ゴシックロックなどの影響下に生まれ、初期の一部は1980年代のゴスの影響を受けた。1999年のコロンバイン高校銃乱射事件では、犯人がゴスだったという誤報が全米に広まり、無関係な若者への偏見と迫害を引き起こす。2007年にはイギリスでゴス風の服装をしていた女性Sophie Lancasterが暴行を受けて死亡し、これを機に、2009年には法務大臣が、量刑指針を改めて、サブカルチャーを標的とした攻撃を刑を重くする事情として扱わせる考えを示し、2013年にはグレーター・マンチェスター警察がゴスなどへの犯罪をヘイトクライムとして記録し始めた。現在もWhitby Goth WeekendやWave-Gotik-Treffenといった祭典を通じて共同体が維持されている。</p>
