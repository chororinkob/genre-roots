<h1>Cajun（ケイジャン）とは</h1>
<p>ケイジャンは、アメリカ・ルイジアナ州南部で、フランス語を話すケイジャンの共同体の音楽だ。この共同体は主に白人で、音楽は黒人クレオールの音楽家とも互いに影響し合いながら形づくられた。 編成の中心は、ボタン式の全音階手風琴（アコーディ</p>
<p>ケイジャンは、アメリカ・ルイジアナ州南部で、フランス語を話すケイジャンの共同体の音楽だ。この共同体は主に白人で、音楽は黒人クレオールの音楽家とも互いに影響し合いながら形づくられた。

編成の中心は、ボタン式の全音階手風琴（アコーディオンの一種）である。一つの調しか出せない、単純な作りの楽器だ。この制約が、旋律を単純で力強いものに保っている。

もうひとつの主役がフィドルだ。2本使うことが多く、一方が旋律を弾く。もう一方は低い音域で伴奏の部分（スコンド）を弾いて支える。さらに、三角形の金属の打楽器が細かい刻みを保ち、ギターが和音を刻む。1930〜40年代には、ウエスタン・スウィングやカントリーの影響で、ドラムやスティールギターが加わった編成が現れた。この編成は今もよく使われる。

和声は、単純な基本の和音（三和音）の繰り返しが中心である。

曲の種類は大きく二つある。ゆったりした3拍子のワルツと、跳ねるような2拍子の踊りの曲だ。

この音楽の情感を担うのは歌だ。高音域で、鼻にかかった張りのある声で歌われる。歌詞の典型的な主題は、愛と失恋、孤独、酒場などで、この地方ならではのフランス語で歌われる。</p>
<h2>成り立ち</h2><p>始まりは、18世紀の強制移住だ。

現在のカナダ東部にあたる地域には、フランス系の農民たちが入植していた。彼らは英仏の争いの中でイギリスの支配下に置かれ、1755年から1764年までの約9年間にわたって土地を追われた。家族は引き裂かれ、船に詰め込まれて各地へ散らされた。航海中に亡くなった者も多い。

生き残った者の一部がたどり着いたのが、ルイジアナの湿地帯だった。ルイジアナは法的には1762年にスペイン領となっていた。ただし初期の入植はフランスの行政のもとで行われ、スペインが実際に支配したのは1769年からだった。彼らは沼地と草原で自給自足の暮らしを築いた。この音楽は、アカディア由来のバラッドに複数の伝統が混ざり合い、ルイジアナで形づくられた。

この音楽の手風琴は、19世紀半ば〜後半に広まった。いつ、どこから入ったかは、どちらも諸説ある。安くて丈夫なこの楽器は、1920年代にフィドルと同じ調のものが手に入るようになると、一気に広まった。1928年4月27日には、Joe Falconと、のちの妻Cléoma BreauxがColumbiaで録音を行った。これが最初の商業録音と考えられている。

しかし20世紀前半、この共同体は厳しい文化の抑圧に直面した。1921年の州憲法は、公立学校での英語のみを求めた。学校の運用ではフランス語が事実上禁止され、処罰の対象になった。子どもたちは、母語を話しただけで体罰を受けた。その結果、言葉は世代の間で途切れ、話す人は急速に減っていく。音楽も田舎者の恥ずかしい文化として軽く見られ、若者はアメリカの流行歌へ流れた。

転機は1964年に訪れる。この年、Dewey Balfa、Gladius Thibodeaux、Louis「Vinesse」LeJeuneの3人が、ルイジアナの代表として、東部で開かれた大規模なフォークの音楽祭（Newport Folk Festival）に出演した。Balfaの回想では、約1万7千人の聴衆から熱狂的な喝采を受けたという。Balfaはこの反応をきっかけに、翌1965年にBalfa Brothers Bandを作った（兄弟での演奏活動自体は1940年代から）。

故郷では見下されていた音楽が、外の世界でほめたたえられた。この経験は、共同体が自分たちをどう見るかを一変させる。彼は帰郷後、この音楽と言葉の復興に生涯を捧げた。1968年には州の機関が作られ、フランス語の教育が再開される。今も言葉を話す人は減り続けているが、音楽は若い世代に受け継がれている。</p>
