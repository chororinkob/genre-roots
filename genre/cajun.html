<h1>Cajun（ケイジャン）とは</h1>
<p>アメリカ・ルイジアナ州南部の、フランス語を話す白人の共同体で受け継がれてきた音楽である。編成の中心はボタン式の全音階手風琴で、一つの調しか出せない単純な構造を持つ。この制約が、旋律を単純で力強いものに保っている。もうひとつの主役が</p>
<p>アメリカ・ルイジアナ州南部の、フランス語を話す白人の共同体で受け継がれてきた音楽である。編成の中心はボタン式の全音階手風琴で、一つの調しか出せない単純な構造を持つ。この制約が、旋律を単純で力強いものに保っている。もうひとつの主役がフィドルで、しばしば二本用いられ、一方が旋律を弾き、もう一方が低い音域で持続音を擦って支える。この二重奏の唸るような響きが、この音楽の古層を伝えている。加えて三角形の金属の打楽器が細かい刻みを保ち、ギターが和音を刻む。20世紀半ば以降はドラムとスティールギターが加わった編成も一般化した。曲種は大きく二つで、緩やかな三拍子のワルツと、跳ねた二拍子の踊りの曲である。テンポは中庸で、隣接するズデコより明らかに落ち着いている。和声は単純な三和音の循環が中心である。歌唱がこの音楽の情感を担う。高く張り詰めた鼻にかかる声で、しばしば裏声へ跳ね上がりながら、絞り出すように歌われる。この独特の泣き節は他に類例が少ない。歌詞は失恋、貧困、家族との別れ、そして酒場での夜を、この地方特有のフランス語で歌う。</p>
<h2>成り立ち</h2><p>この共同体の歴史は、18世紀の強制移住に始まる。現在のカナダ東部にあたる地域に入植していたフランス系の農民たちは、英仏の抗争の中でイギリスの支配下に置かれ、1755年から数年にわたって土地を追われた。家族は引き裂かれ、船に詰め込まれて各地へ散らされ、多数が航海中に死亡している。生き残った者の一部が辿り着いたのが、当時スペイン領だったルイジアナの湿地帯だった。彼らは沼地と草原で自給的な生活を築き、フランス語と自らの音楽を保持し続けた。この音楽の性格を決めたのは、19世紀末にドイツからの移民がもたらした手風琴である。安価で丈夫なこの楽器は、それまでフィドル中心だった音楽の主役を奪い、旋律を単純化させた。1928年、Joseph Falconによる最初の録音が行われ、商業的な記録が始まる。しかし20世紀前半、この共同体は深刻な文化的抑圧に直面した。1921年の州憲法によって、学校におけるフランス語の使用が禁じられ、子どもたちは母語を話しただけで体罰を受けた。その結果、言語は世代間で断絶し、話者は急速に減少する。音楽も、田舎者の恥ずべき文化として軽んじられ、若者はアメリカの流行歌へ流れた。転機は1964年である。この年、Dewey Balfaら兄弟の楽団が、東部で開かれた大規模なフォークの音楽祭に招かれ、数万人の聴衆から熱狂的な喝采を受けた。故郷では見下されていた音楽が外部で賞賛されたという経験は、共同体の自己認識を一変させる。彼は帰郷後、この音楽と言語の復興に生涯を捧げた。1968年には州の機関が設立され、フランス語教育が再開される。現在、言語の話者は依然として減少しているが、音楽は若い世代によって受け継がれている。</p>
