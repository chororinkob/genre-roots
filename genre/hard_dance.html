<h1>Hard Dance（ハードダンス）とは</h1>
<p>ハードスタイル、ハードトランス、ハードハウスといった、速く硬い電子ダンス音楽をまとめて指す枠組み(ハードコア・テクノの同義語として使われることもあるが、ハードコアよりやや遅く荒々しさも控えめとされ、重なる部分があるにとどまる)。単</p>
<p>ハードスタイル、ハードトランス、ハードハウスといった、速く硬い電子ダンス音楽をまとめて指す枠組み(ハードコア・テクノの同義語として使われることもあるが、ハードコアよりやや遅く荒々しさも控えめとされ、重なる部分があるにとどまる)。単一の様式ではないため定義は緩いが、共通する要素はいくつかある。テンポは毎分140から160拍程度が多いとされるが、範囲には諸説あり、通常のハウスやテクノより明確に速い。キックドラムは四つ打ちで、圧縮と歪みを強くかけて前に押し出され、しばしば音程を持たせた減衰部分がベースを兼ねる。上に重ねる音には、輪郭の硬いシンセによるメロディーが置かれ、長調のはっきりした和音の流れで盛り上げるものと、短調で緊張を保つものの両方がある。曲の構成が特に重要で、静かな導入から、リズムがすべて抜けて上物だけが残る溜めの部分を経て、キックと旋律が同時に戻る一気に解き放たれる瞬間へ向かう作り方が徹底されている。この落差を作ることが、作る側にとってのいちばんの肝である。声の加工も多用され、感情的な女性の歌唱や、低く加工した宣告のような語りが挟まれる。演奏の場はオランダ、ベルギー、イギリス、オーストラリアの大型の催し(Defqon.1のような野外フェスを含む)で、照明、炎、映像を大規模に用いた演出と一体で提供される。</p>
<h2>成り立ち</h2><p>1990年代後半に、ハウスとトランスがより速く硬くなっていく流れの中から使われるようになったまとめた呼び名である。ハードハウスの母体はロンドンのクラブTradeにあった。1990年にLaurence Malice主宰で始まったこのゲイ向けのアフターアワーズは、土曜の深夜3時から日曜の朝〜昼まで営業し(閉店時刻は資料により9時から13時まで揺れる)、開業当初はdeep and chunkyなソウルフルなハウスで始まった。ハードな音は、その後Tony De Vitらレジデントの下で形成された。ここでレジデントを務めたTony De Vitは、キックの強い高速ハウスを確立した。ハードハウスのサウンド(以前は「hardbag」とも呼ばれた)をきちんと形にして広めた主要なDJの一人で、「UKハードハウスの父(godfather)」とも呼ばれる。1995年にリーズで設立されたレーベルTidy Traxと、ロンドンのNukleuzが二大拠点となり、Anne Savage、Lisa Lashes、Lisa Pin-Upといった女性DJが表看板になったことで、シーンは他のダンスミュージックと異なる顔ぶれを持った。1998年にはTony De Vitが40歳で、長い闘病の末にHIV/AIDS関連の合併症で亡くなり、その後はTradeのレジデントだったBKやIan Mらが中心を担う。2002年には、イベントとコンピレーションの『Tidy Weekender』も始まった。2000年代に入ると、1990年代初頭にベルギー・ドイツ・オランダで成立したハードトランスや、オランダ・イタリア・ベルギーで育ったハードスタイルがイギリスにも広がり、Blutonium Recordsのようなドイツのレーベルの音源や、Yoji Biomehanikaら国外の作り手がイギリスのフロアで混ざり合った。この時期に、ハードハウス、ハードトランス、ハードNRG、ハードスタイルをまとめて指す言葉としてハードダンスが定着する。ハードダンスの周辺では、トランスで知られるシェフィールドのGatecrasherや、ハッピーハードコアの興行ブランドHTID(2004年にHixxyが設立)なども催しを開いた。しかし2000年代後半には、Tidyの売上と集客が落ち込むなど、シーンは苦しい時期を迎えた。現在はハードスタイル系の巨大フェスティバルへ人が流れる一方で、Tidy Traxの復活興行など、当時の世代による同窓会的なイベントが各地で続いている。</p>
<h2>代表曲</h2><ul><li>2003 (TNT)</li><li>Rumble in the Jungle (Zatox)</li><li>My Life (Zatox)</li><li>Alive (D-Block &amp; S-te-Fan &amp; Isaac)</li><li>Hard Beat (TNT &amp; Darren Styles)</li><li>FTS (Showtek)</li><li>Feel Inside (D-Block &amp; S-te-Fan)</li><li>My Strength Is Hardstyle (Zatox)</li><li>CTRL (Technoboy, Tuneboy &amp; Isaac)</li><li>Come Alive (D-Sturb &amp; D-Block &amp; S-te-Fan)</li><li>World of Madness（Headhunterz &amp; Wildstylez feat. Noisecontrollers）</li><li>Scantraxx Rootz (Headhunterz)</li></ul>
