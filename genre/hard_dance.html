<h1>Hard Dance（ハードダンス）とは</h1>
<p>ハードダンスは、ハードスタイル、ハードトランス、ハードハウスといった、速く硬い電子ダンス音楽をまとめて指す枠組みだ。ハードコア・テクノの同義語として使われることもある。ただし、ハードコアよりやや遅く、荒々しさも控えめとされ、重なる</p>
<p>ハードダンスは、ハードスタイル、ハードトランス、ハードハウスといった、速く硬い電子ダンス音楽をまとめて指す枠組みだ。ハードコア・テクノの同義語として使われることもある。ただし、ハードコアよりやや遅く、荒々しさも控えめとされ、重なる部分があるにとどまる。

単一のスタイルではないため、定義は緩い。それでも、共通する要素はいくつかある。

テンポは140から160 BPM程度が多いとされるが、範囲には諸説ある。通常のハウスやテクノより、はっきりと速い。

キックドラムは四つ打ちだ。圧縮と歪みを強くかけて、前に押し出される。ハードスタイルでは、しばしば、音程を持たせた減衰部分がベースを兼ねる。

上に重ねる音には、輪郭の硬いシンセによるメロディーが置かれる。長調のはっきりした和音の流れで盛り上げるものと、短調で緊張を保つものの両方がある。

声の加工も多用される。感情的な女性の歌唱や、低く加工した宣告のような語りが挟まれる。

曲の構成では、次の流れがよく使われる。静かな導入から、リズムがすべて抜けて上物だけが残る溜めの部分を経て、キックと旋律が同時に戻る瞬間へ向かい、一気に解き放たれる。

演奏の場は、主にオランダ、ベルギー、ドイツなどの大型の催しだ。Defqon.1のような野外フェスも含まれる。照明、炎、映像を大規模に使った演出と一体で届けられる。Defqon.1のオーストラリア版は、2009〜2018年で終了した。</p>
<h2>成り立ち</h2><p>ハードダンスは、1990年代後半に、ハウスとトランスがより速く硬くなっていく流れの中から使われるようになった、まとめた呼び名である。

ハードハウスは、ロンドンのクラブTradeが発祥地とされる。このクラブは1990年に、Laurence Maliceの主宰で始まったゲイ向けのアフターアワーズだ。日曜午前3時から朝〜昼まで営業し、閉店時刻は9時から13時まで諸説ある。Tradeの毎回の夜は、3時の開場時にdeep and chunkyなソウルフルなハウスで始まり、明け方に向かって加速した。

ここでレジデントを務めたのがTony De Vitだ。ハードハウスのサウンドを形にし、広めた主要なDJの一人で、「UKハードハウスの父(godfather)」とも呼ばれる。このサウンドは、以前は「hardbag」とも呼ばれた。

1995年には、ロザラムを拠点とするAndy PicklesとAmadeus Mozartが、レーベルTidy Traxを設立した。レーベルは現在、リーズを拠点としている。このレーベルと、ロンドンのNukleuzが、当時の主要レーベルとなった。Anne Savage、Lisa Lashes、Lisa Pin-UpといったTidy Girlsなどの女性DJも人気を集めた。

1998年には、Tony De Vitが40歳で、エイズ関連の合併症で亡くなった。De Vitの死後も、TradeのレジデントだったBKやIan Mらが活動した。2002年には、イベントの『Tidy Weekender』も始まった。

1990年代初頭にベルギー・ドイツ・オランダで成立したハードトランスは、1990年代からイギリスのシーンに入り込み、2000年代にさらに混ざり合った。Yoji Biomehanikaら国外の作り手も、イギリスのフロアで混ざり合った。こうした流れの中で、ハードハウス、ハードトランス、ハードNRG、ハードスタイルをまとめて指す言葉として、ハードダンスが定着していった。

トランスで知られるシェフィールドのGatecrasherや、ハッピーハードコアの興行ブランドHTID(Hixxyらが2004年ごろに設立)なども催しを開いた。

しかし、2000年代半ばの2004〜2005年ごろには、Tidyの売上と集客が落ち込むなど、シーンは苦しい時期を迎えた。クラブシーンの落ち込みや客層の高齢化などで、客足は遠のいたとされる。それでも、Tidy Traxのイベントは継続的に開催され、2020年代には人気が再び高まったとされる。</p>
