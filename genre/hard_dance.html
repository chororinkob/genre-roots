<h1>Hard Dance（ハードダンス）とは</h1>
<p>ハードスタイル、ハードトランス、ハードハウス、ハードコア・テクノといった、速く硬い電子ダンス音楽を包括的に指す枠組み。単一の様式ではないため定義は緩いが、共通する要素はいくつかある。テンポは毎分140から160拍程度が中心で、通常</p>
<p>ハードスタイル、ハードトランス、ハードハウス、ハードコア・テクノといった、速く硬い電子ダンス音楽を包括的に指す枠組み。単一の様式ではないため定義は緩いが、共通する要素はいくつかある。テンポは毎分140から160拍程度が中心で、通常のハウスやテクノより明確に速い。キックドラムは四つ打ちで、圧縮と歪みを強くかけて前に押し出され、しばしば音程を持たせた減衰部分がベースを兼ねる。上物には輪郭の硬いシンセによる旋律が置かれ、長調の明快な進行で高揚を作るものと、短調で緊張を保つものの両方がある。曲の構成が特に重要で、静かな導入から、リズムがすべて抜けて上物だけが残る溜めの部分を経て、キックと旋律が同時に戻る解放の瞬間へ向かう設計が徹底されている。この落差を作ることが制作の核心である。声の加工も多用され、感情的な女性の歌唱や、低く加工した宣告のような語りが挟まれる。演奏の場はオランダ、ベルギー、イギリス、オーストラリアの大型の屋内催しで、照明、炎、映像を大規模に用いた演出と一体で提供される。</p>
<h2>成り立ち</h2><p>1990年代のイギリスで、ハウスとトランスがより速く硬くなっていく過程から形成された総称である。直接の母体はロンドンのクラブTradeにあった。1990年にLaurence Malice主宰で始まったこのゲイ向けのアフターアワーズは、土曜の深夜3時から日曜の昼まで営業し、疲れ切った客を持たせるために極端に速く硬いハウスがかけられた。ここでレジデントを務めたTony De Vitは、キックの強い高速ハウスを確立し、ハードハウスという言葉を実質的に定義した人物とされる。1995年にリーズで設立されたレーベルTidy Traxと、ロンドンのNukleuzが二大拠点となり、Anne Savage、Lisa Lashes、Lisa Pin-Upといった女性DJが表看板になったことで、シーンは他のダンスミュージックと異なる顔ぶれを持った。1998年に始まったイベントとコンピレーションの『Tidy Weekender』は数千人規模を集めたが、同じ1998年にTony De Vitが38歳で急死し、その門下のBKやIan Mが中心を引き継ぐことになる。2000年代に入るとオランダとドイツからハードスタイルとハードトランスが流入し、Blutonium Recordsのようなドイツのレーベルの音源や、Yoji Biomehanikaら国外の作り手がイギリスのフロアで混ざり合った。この時期に、ハードハウス、ハードトランス、ハードNRG、ハードスタイルをまとめて指す言葉としてハードダンスが定着する。イベント面ではシェフィールドのGatecrasher、ハードコアとの合同興行であるHTIDが規模を拡大した。しかし2000年代後半、EDMの世界的な流行、イギリスのクラブへの営業規制の強化、そして薬物との結びつきを理由とした会場側の敬遠が重なり、シーンは急速に縮小した。現在はハードスタイル系の巨大フェスティバルへ人が流れる一方で、Tidy Traxの復活興行など、当時の世代による同窓会的なイベントが各地で続いている。</p>
