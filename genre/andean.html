<h1>Andean Musicとは</h1>
<p>アンデス音楽は、南米のアンデス山脈一帯、ボリビア、ペルー、エクアドル、チリ北部、アルゼンチン北西部に伝わる音楽だ。 中心になるのは笛の類である。竹や葦で作られた縦笛のケーナは、指孔が六つと裏孔が一つある。息を吹きつける歌口が切り欠</p>
<p>アンデス音楽は、南米のアンデス山脈一帯、ボリビア、ペルー、エクアドル、チリ北部、アルゼンチン北西部に伝わる音楽だ。

中心になるのは笛の類である。竹や葦で作られた縦笛のケーナは、指孔が六つと裏孔が一つある。息を吹きつける歌口が切り欠きだけの単純な構造である。長さの違う管を筏状に束ねたサンポーニャには、2人の音が交互に組み合わさって1つの旋律になる(ホケット)奏法がある。これがステレオ的な響きを作るとされる。弦楽器では小型のチャランゴが用いられ、もとはアルマジロの甲羅を胴にしていた。打楽器は、ボンボなどの両面太鼓が用いられる。

楽器は、5音音階（5つの音だけの音階）または全音階（ドレミファソラシ）に調律される。民族音楽学では、半音を含まない5音音階が中心的に論じられる。典型的なのは、5音音階の旋律に、平行調（同じ音を使う長調と短調）の和音が交互に付く形である。旋律は下降型が多く、同じ句が少しずつ変化しながら繰り返される。

リズムは、踊りの型（踊りのリズムの決まり）に沿う。拍子は、2拍子系のワイニョと、6/8と3/4が交錯する(セスキアルテラ)舞曲のバイレシートなどの型である。

歌詞はスペイン語のほか、ケチュア語やアイマラ語で歌われる。主題は、土地、農作業、山、別離、政治的な抵抗である。

演奏の場は、伝統的には祭礼や労働に結びついていた。20世紀には、舞台・録音向けの演奏も成り立った。</p>
<h2>成り立ち</h2><p>この地域の音楽は、インカ帝国よりも前にさかのぼる。考古学的には、約4200〜4600年前のカラル遺跡から、ペリカンとコンドルの骨で作られた笛が出土した。ペリカンのみとする資料もある。のちのパラカス（前800〜前100年頃）やナスカ（前100年〜後800年頃）の遺跡からは、土器製のパンパイプやドラムが出土している。笛を中心とする合奏は約4,000年以上前に遡り、太鼓は少なくとも紀元前数世紀の例がある。

16世紀のスペインによる征服の後、楽器・旋律の一部は存続・変容し、ヨーロッパの要素と融合した。植民地当局は先住民の祭祀を偶像崇拝として弾圧し、多くの儀礼音楽が失われた。一方で、スペインがもたらした弦楽器は土着化していく。チャランゴは、ビウエラ、バンドゥリア、リュートなどの説があり、系統は明確ではない。スペインの弦楽器を模して、入手できる材料で小型に作り替えたものだという説（逸話）がある。他に、禁圧下でポンチョに隠せる楽器として作られたという逸話もある。19世紀の独立後も、先住民の音楽は長く劣ったものとして扱われた。

転機は20世紀半ばである。1920〜40年代のインディヘニスモの流れがあり、1952年のボリビア革命の後、先住民文化を国民の誇りとして位置づける政策が取られ、国策として強まった。1960年代にはLos Jairasなどが登場した。

1960年代、この動きはチリのヌエバ・カンシオンと結びつく。Violeta Parraは1950年代から各地を歩いて民謡を採集した。それは1960年代のヌエバ・カンシオンの土台となった。Víctor Jara（Quilapayúnの芸術監督を1966〜69年に務めた）や、QuilapayúnやInti-Illimaniといった音楽家や集団が、アンデスの楽器を用いて社会変革を歌った。

しかし1973年のチリ軍事クーデターで、Víctor Jaraは競技場に連行され、拷問の末に射殺された。多くの音楽家が国外に亡命し、ヨーロッパで演奏を続けた。それが、皮肉にもこの音楽を世界に広める結果になった。

もうひとつの経路が『El Cóndor Pasa』である。もとは1913年にペルーの作曲家Daniel Alomía Roblesが書いた劇音楽の一曲だ。1970年にSimon and Garfunkelが、Los Incasの編曲を土台に、Paul Simonが英語詞を付けて世界的なヒットとなり、Billboard Hot 100で18位に入った。以後、街頭で演奏するアンデスの楽団が世界各地に現れた。同時に、この音楽が観光的な記号として消費されることへの批判も生まれている。</p>
