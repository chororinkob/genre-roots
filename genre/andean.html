<h1>Andean Musicとは</h1>
<p>南米アンデス山脈一帯、ボリビア、ペルー、エクアドル、チリ北部、アルゼンチン北西部に伝わる音楽。中心となるのは笛の類で、竹や葦で作られた縦笛のケーナは指孔六つと裏孔一つを持ち、息を吹きつける歌口が切り欠きだけの単純な構造のため、奏者</p>
<p>南米アンデス山脈一帯、ボリビア、ペルー、エクアドル、チリ北部、アルゼンチン北西部に伝わる音楽。中心となるのは笛の類で、竹や葦で作られた縦笛のケーナは指孔六つと裏孔一つを持ち、息を吹きつける歌口が切り欠きだけの単純な構造のため、奏者の息づかいがそのまま音の揺れになる。長さの違う管を筏状に束ねたサンポーニャは、二人が交互に音を吹き分けて一つの旋律を作る奏法があり、これが独特の途切れた響きを生む。弦楽器では小型のチャランゴが用いられ、もとはアルマジロの甲羅を胴にしていた。打楽器は片面太鼓のボンボである。音階は五音音階が基本で、半音を含まないため素朴に響き、和音は短調の二つか三つを往復する。旋律は下降型が多く、同じ句が少しずつ変化しながら反復される。拍子は二拍子系のワイニョと三拍子系のバイレシートなどの舞曲の型に沿う。歌詞はスペイン語のほか、ケチュア語やアイマラ語で歌われ、土地、農作業、山、別離、政治的な抵抗を主題にする。演奏の場は祭りと祈りと労働の現場であり、鑑賞用の音楽として作られたものではない。</p>
<h2>成り立ち</h2><p>この地域の音楽はインカ帝国以前にさかのぼる。考古学的にも、紀元前の遺跡から土器製の笛やパンパイプが出土しており、笛と太鼓を中心とする合奏は数千年の歴史を持つ。十六世紀のスペインによる征服は決定的な断絶をもたらした。植民地当局は先住民の祭祀を偶像崇拝として弾圧し、多くの儀礼音楽が失われた一方で、スペインがもたらした弦楽器が土着化する。チャランゴは、スペインのビウエラやギターを模して、入手できる材料で小型に作り替えたものである。十九世紀の独立後も、先住民の音楽は長く劣ったものとして扱われた。転機は二十世紀半ばである。1952年のボリビア革命の後、先住民文化を国民の誇りとして位置づける政策が取られ、都市の学生や知識人が民俗音楽を演奏し始めた。1960年代、この動きはチリのヌエバ・カンシオンと結びつく。Violeta Parraは各地を歩いて民謡を採集し、Víctor JaraやQuilapayún、Inti-Illimaniといった集団が、アンデスの楽器を用いて社会変革を歌った。1973年のチリ軍事クーデターで、Víctor Jaraは競技場に連行され、拷問の末に射殺された。多くの音楽家が国外に亡命し、ヨーロッパで演奏を続けたことが、皮肉にもこの音楽を世界に広める結果になった。もうひとつの経路が『El Cóndor Pasa』である。もとは1913年にペルーの作曲家Daniel Alomía Roblesが書いた劇音楽の一曲で、1970年にSimon and Garfunkelが英語詞を付けて世界的なヒットとなった。以後、街頭で演奏するアンデスの楽団が世界各地に現れたが、同時に、この音楽が観光的な記号として消費されることへの批判も生まれている。</p>
