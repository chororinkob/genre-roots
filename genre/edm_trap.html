<h1>EDM Trapとは</h1>
<p>この音楽は、南部ヒップホップのトラップのリズム構造を、フェス向けのEDMの音の迫力（音圧）と構成に結びつけた音楽だ。 BPM（1分間の拍数）は、表記上おおむね140前後である。ただし、キックとスネアはその半分の速度で置かれる。その</p>
<p>この音楽は、南部ヒップホップのトラップのリズム構造を、フェス向けのEDMの音の迫力（音圧）と構成に結びつけた音楽だ。

BPM（1分間の拍数）は、表記上おおむね140前後である。ただし、キックとスネアはその半分の速度で置かれる。そのため、体感は70〜75のゆったりした揺れになる。

中核は、リズムの三層構造だ。まず、深く沈む808系（ドラムマシンTR-808の音）のキックが、不規則な位置で長く伸びる。次に、スネアあるいはクラップ（手拍子の音）は、基本形では3拍目に置かれることが多い。その隙間を、ハイハットが埋める。ハイハットは、16分音符から32分音符、さらに三連符（1拍を三つに分けたリズム）のロール（連打）へと、目まぐるしく変速する。この変速するハイハットが、トラップの最も分かりやすい指紋である。

上物には、Lex Luger 以降の金管風・弦風の劇的なシンセが目立つ。ほかに、東洋風の旋律や鐘の音を使う曲もある。和声（コードの響き）は、短調が好まれる。ナチュラル・マイナーのほか、ハーモニック・マイナー（哀愁のある短調の音階）やフリジアンも使われる。そうして、異国的で不穏な色を出す。

曲の組み立ては、EDMの型に従う。ビルドアップ（徐々に盛り上げる部分）と無音を経て、ドロップ（山場で一気に爆発する部分）へ入る。ただし、ドロップの中身は四つ打ちではない。ハーフタイム（拍の進みが半分に感じられる形）である。そのため、体を跳ねさせるのではなく、重く沈み込ませる効果を持つ。

ヒップホップのラップが乗ることもある。一方で、器楽曲として完結する場合も多い。</p>
<h2>成り立ち</h2><p>舞台は、2012年前後の米国だ。アトランタ発祥のトラップが、クラブとフェスの文脈に持ち込まれたことで、この音楽は成立した。

原型は、1990年代後半から2000年代のアトランタで形づくられた。2010年前後には、Lex Lugerが現在の音を広げた一人とされる。その土台は、T.I.、Gucci Mane、Young Jeezy らのラップと、Shawty Redd、Zaytoven、Lex Luger といったプロデューサーによる制作スタイルである。核になるのは、Roland TR-808の伸びるキックと、高速ハイハットだ。

これをダンス音楽側から捉え直した最初期の作家として、シカゴのFlosstradamus（Curt Cameruci とJosh Young）、UZ（2017年に素顔を公表したフランス出身の作家）、Baauer（Harry Rodrigues）、RL Grime（Henry Steinway）、Carnage が挙げられる。そのほか、TNGHT（Hudson MohawkeとLunice）やRustieなども挙げられる。

決定的な事件は、Baauer のHarlem Shake である。2012年5月に発表された曲が、2013年2月に動画ミームで急拡散した。同年3月2日付のHot 100で首位に初登場し、5週連続で首位となった。この曲の成功は、動画の再生回数をチャートに算入する規則変更の最初の受益例としても記録された。ジャンルの認知は、一気に押し上げられた。

同時に、原曲に使われた声のサンプルの権利処理が、事後的に問題化した。補償の交渉を経て、Diploが2013年4月に権利処理で合意したと述べた。この点も、この時代の制作環境をよく表している。

舞台面では、Fool's Gold Records が主要な発信源となった。ロサンゼルスのSkrillex が主宰したレーベルOWSLAは、主にダブステップ／ベース系で、トラップ寄りの作品も一部あった。Mad Decent（Diplo 主宰）が主催する移動型フェスMad Decent Block Party が、この音を全米に広める役割を果たしたとされる。

批判もあった。アトランタの黒人コミュニティの音楽的発明が、その社会的文脈を切り離した形で、白人中心のフェス市場に使われた。そうした文化的横領（他の文化の要素を無断で取り入れること）の指摘が、繰り返しなされた。

しかし、2010年代半ば以降は、フューチャー・ベースなどに人気が移った。それでも、ハーフタイムのドロップという発想は、EDM全体に定着した。フューチャー・ベースなどの派生形を生み、トラップ要素を取り入れたスタイル（ハードウェイヴ等）も現れた。</p>
