<h1>EDM Trapとは</h1>
<p>南部ヒップホップのトラップのリズム構造を、フェス向けのEDMの音の迫力（音圧）と構成に結びつけた様式。BPM（1分間の拍数）は表記上おおむね140前後（140〜160とも）だが、キックとスネアはその半分の速度で置かれるため、体感は</p>
<p>南部ヒップホップのトラップのリズム構造を、フェス向けのEDMの音の迫力（音圧）と構成に結びつけた様式。BPM（1分間の拍数）は表記上おおむね140前後（140〜160とも）だが、キックとスネアはその半分の速度で置かれるため、体感は70〜75のゆったりした揺れになる。中核はリズムの三層構造で、深く沈む808系（ドラムマシンTR-808の音）のキックが不規則な位置で長く伸び、スネアあるいはクラップ（手拍子の音）が基本形では3拍目に置かれることが多く、その隙間をハイハットが16分音符から32分音符、さらに三連符（1拍を三つに分けたリズム）のロール（連打）へと目まぐるしく変速しながら埋める。この変速するハイハットが、トラップの最も分かりやすい指紋である。上物には、Lex Luger以降の金管風や弦風の劇的なシンセ（いわゆるブラス・スタブなど）が目立ち、ほかに東洋風の旋律や鐘の音を使う曲もあり、これらが短い動機を反復する。和声（コードの響き）は短調（ナチュラル・マイナーのほか、ハーモニック・マイナー（哀愁のある短調の音階）やフリジアンも使われ）、異国的で不穏な色を出す。構成はEDMの型に従い、ビルドアップ（徐々に盛り上げる部分）と無音を経てドロップ（山場で一気に爆発する部分）へ入るが、ドロップの中身は四つ打ちではなくハーフタイム（拍の進みが半分に感じられる形）であるため、体を跳ねさせるのではなく重く沈み込ませる効果を持つ。ヒップホップのラップが乗ることもあるが、器楽曲として完結する場合も多い。</p>
<h2>成り立ち</h2><p>2012年前後に、米国を中心に英国・カナダ・フランスなどでも、アトランタ発祥のトラップがクラブとフェスの文脈に持ち込まれたことで成立した。原型は1990年代後半から2000年代のアトランタで形づくられ、2010年前後にLex Lugerの曲がSnoop DoggやKanye Westらの曲に使われ、現在の音が広がった。その土台は、T.I.、Gucci Mane、Young Jeezy らのラップと、Shawty Redd、Zaytoven、Lex Luger といったプロデューサーによる、Roland TR-808の伸びるキックと高速ハイハットを核とする制作様式である。これをダンス音楽側から捉え直した最初期の作家として、シカゴのFlosstradamus（Curt Cameruci とJosh Young）、UZ（2017年に素顔を公表したフランス出身の作家）、Baauer（Harry Rodrigues）、RL Grime（Henry Steinway）のほか、TNGHT（Hudson MohawkeとLunice）やRustieなども、最初期の担い手として挙げられる。決定的な事件は、2012年5月に発表されたBaauer のHarlem Shake が、2013年2月にインターネット上の投稿動画の流行と結び付いて急拡散し、同年3月2日付で米国のビルボード首位に初登場して、五週にわたって首位を獲得したことである。この曲の成功は、動画の再生回数をチャートに算入する規則変更の最初の受益例としても記録され、ジャンルの認知を一気に押し上げた。同時に、原曲に使われた声のサンプルの権利処理が事後的に問題化し、補償の交渉を経て、Diploが2013年4月に権利処理で合意したと語った点も、この時代の制作環境を象徴している。舞台面では、ロサンゼルスのSkrillex が主宰したレーベルOWSLAにもトラップ寄りの作品が一部あったが、Fool's Gold Records が主要な発信源となり、Mad Decent（Diplo 主宰）が主催する移動型フェスMad Decent Block Party がこの音を全米各地に届ける役割を果たした。批判としては、アトランタの黒人コミュニティの音楽的発明が、その社会的文脈を切り離した形で白人中心のフェス市場に使われたという文化的横領（他の文化の要素を無断で取り入れること）の指摘が、TNGHTのメンバーの発言などを通じて繰り返しなされた。2010年代半ば以降、フューチャー・ベースなどに人気が移ったが、ハーフタイムのドロップという発想はEDMに広がり、フューチャー・ベースなどの派生形を生み、トラップ要素を取り入れた様式（ハードウェイヴなど）も現れた。</p>
