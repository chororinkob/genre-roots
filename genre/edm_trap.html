<h1>EDM Trapとは</h1>
<p>南部ヒップホップのトラップのリズム構造を、フェス向けのEDMの音圧と構成に接続した様式。BPMは表記上140〜150だが、キックとスネアはその半分の速度で置かれるため、体感は70〜75のゆったりした揺れになる。中核はリズムの三層構</p>
<p>南部ヒップホップのトラップのリズム構造を、フェス向けのEDMの音圧と構成に接続した様式。BPMは表記上140〜150だが、キックとスネアはその半分の速度で置かれるため、体感は70〜75のゆったりした揺れになる。中核はリズムの三層構造で、深く沈む808系のキックが不規則な位置で長く伸び、スネアあるいはクラップが必ず三拍目に着地し、その隙間をハイハットが16分音符から32分音符、さらに三連符のロールへと目まぐるしく変速しながら埋める。この変速するハイハットが、トラップの最も分かりやすい指紋である。上物には、金管を模した咆哮のようなシンセ（いわゆるブラス・スタブ）、東洋的な音階を用いた笛や琴の音色、そして教会の鐘が定番で、これらが短い動機を反復する。和声は短調、とりわけハーモニック・マイナーが好まれ、異国的で不穏な色を出す。構成はEDMの型に従い、ビルドアップと無音を経てドロップへ入るが、ドロップの中身は四つ打ちではなくハーフタイムであるため、体を跳ねさせるのではなく重く沈み込ませる効果を持つ。ヒップホップのラップが乗ることもあるが、器楽曲として完結する場合も多い。</p>
<h2>成り立ち</h2><p>2012年前後の米国で、アトランタ発祥のトラップがクラブとフェスの文脈に持ち込まれたことで成立した。原型を作ったのは2000年代前半のアトランタで、T.I.、Gucci Mane、Young Jeezy らのラップと、Shawty Redd、Zaytoven、Lex Luger といったプロデューサーによる、Roland TR-808の伸びるキックと高速ハイハットを核とする制作様式である。これをダンス音楽側から捉え直した最初期の作家として、ロサンゼルスのFlosstradamus（Curt Cameruci とJosh Young）、UZ（正体を伏せたフランスの作家）、Baauer（Harry Rodrigues）、RL Grime（Henry Steinway）、Carnage らが挙げられる。決定的な事件は2012年末から2013年初頭、Baauer のHarlem Shake がインターネット上の投稿動画の流行と結び付き、米国のビルボード首位を五週にわたって獲得したことである。この曲の成功は、動画の再生回数をチャートに算入する規則変更の初期の事例としても記録され、ジャンルの認知を一気に押し上げた。同時に、原曲に使われた声のサンプルの権利処理が事後的に問題化し、無断使用を巡る訴訟へ発展した点も、この時代の制作環境を象徴している。舞台面では、ロサンゼルスのSkrillex が主宰したレーベルOWSLA、そしてFools Gold Records が主要な発信源となり、Mad Decent（Diplo 主宰）が主催する移動型フェスMad Decent Block Party がこの音を全米に運んだ。批判としては、アトランタの黒人コミュニティの音楽的発明が、その社会的文脈を切り離した形で白人中心のフェス市場に流用されたという文化的横領の指摘が繰り返しなされた。2015年前後には流行の頂点を過ぎたが、ハーフタイムのドロップという発想はEDM全体に定着し、フューチャー・ベースやハードウェイヴなど後続の様式に直接受け継がれている。</p>
<h2>代表曲</h2><ul><li>Harlem Shake (Baauer)</li><li>Core (RL Grime)</li><li>Original Don (Flosstradamus)</li><li>Higher Ground (TNGHT)</li><li>DJ Turn It Up (Yellow Claw)</li></ul>
