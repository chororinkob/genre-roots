<h1>Trap（トラップ）とは</h1>
<p>米国南部で確立した、リズムの層構造を最大の特徴とするヒップホップの様式。BPMは表記上100〜176と幅があり、典型は140前後だが、キックとスネアは半分の速度で置かれるため、体感は典型的に70前後の重い揺れになる。中核はRola</p>
<p>米国南部で確立した、リズムの層構造を最大の特徴とするヒップホップの様式。BPMは表記上100〜176と幅があり、典型は140前後だが、キックとスネアは半分の速度で置かれるため、体感は典型的に70前後の重い揺れになる。中核はRoland TR-808のバスドラムで、減衰（音が消えていくこと）を長く伸ばして音程を持たせ、旋律を弾くように上下させる。この808（実機のほか、808を録音して使う音や、808に似せてシンセで作った音も多い）が低音とベースラインを同時に担う点が決定的である。スネアあるいはクラップ（手拍子の音）は典型的には、140BPMで数えると小節の3拍目（半分の70で数えると2拍目と4拍目）に置かれ、その隙間をハイハットが埋める。ハイハットは16分音符を基本としながら、32分音符、64分音符、さらに三連符（1拍を3等分したリズム）へと目まぐるしく変速し、この変速そのものが曲の推進力となる。上物（メロディーなど上に重ねる音）は多くなく、単音のシンセ、金属的なベル、管弦楽風のパッド、ピアノの短い動機などが繰り返し使われ、暗めの作風が多い。歌唱面ではオートチューン（音程を自動で補正する処理）を深くかけた歌とラップの中間的な発声が、2010年代以降、Future、Young Thug、Migosらを通じて広まり、同じ語句を繰り返すアドリブが背後に多層に重ねられる。歌詞は薬物の売買、暴力、貧困からの脱出、成功の誇示を扱い、名称そのものが麻薬を売る場所を指す俗語に由来する。</p>
<h2>成り立ち</h2><p>1990年代のアトランタに起源を持ち、2000年代初頭に南部ヒップホップの一派として形を整えた（時期には諸説ある）。名称は、麻薬取引が行われる建物を指す俗語トラップ・ハウスに由来する。音の原型を築いたとされるのはアトランタのプロデューサーShawty Redd、DJ Toompらで（メンフィスのThree 6 MafiaやDJ Paul &amp; Juicy J、マイアミ・ベース（フロリダ発の低音が強いダンス音楽）、ニューオーリンズなど、南部のいくつもの音楽の影響を受けた）、彼らはTR-808の伸びるキックと高速のハイハットを組み合わせた独自の骨格を築いた。ジャンル名を広めた一因はラッパーT.I.で、2003年のアルバムTrap Muzikにより語が広く知られた（T.I.本人は用語を作ったと主張するが定説ではなく、語やそれに関わる作品はそれ以前からある）。続いてYoung Jeezyが2005年のLet's Get It: Thug Motivation 101で、Gucci Maneが同年のTrap Houseで、それぞれ異なる語り口を提示した。クランクやスナップ（どちらも南部で流行したヒップホップの型）に続き、トラップでもアトランタが南部ヒップホップの中心地となった。2010年前後、プロデューサーLex Lugerが劇的な管弦楽風のシンセと重い808を組み合わせた音を広め、Waka Flocka FlameのFlockaveliやRick RossのB.M.F.といった作品を通じて全国的な標準となった。Zaytovenは2000年代前半からGucci Maneと曲を作っていて、教会音楽を背景にしたキーボード中心の作風で知られる。三連符で畳みかけるフロウ、いわゆるトリプレット・フロウ（細かい三連の節回し）は、1988年のPublic Enemyや、1990年代のThree 6 Mafia、Bone Thugs-N-Harmonyにも先例があり、2013年のVersaceでMigosが広く知らしめ、2016年に発表されたMigos feat. Lil Uzi Vert名義のBad and Boujeeが2017年初め（1月21日付）に米国で首位を獲得した。これは、2010年代を通じてトラップが人気を広げてきた流れを、はっきり示す出来事の一つだった。Future、Young Thug、21 Savage、Lil Babyらがそれぞれ異なる方向へ拡張し、808 MafiaのSouthsideやLex Luger、そしてSouthsideと組んだMetro Boominといったプロデューサーが音の設計を担った。産業面では、ミックステープ（正式リリースを経ず、無料などで配布される非公式な音源集。オリジナル曲を収めることが多い）の無料配布という流通形態、そしてSoundCloudやYouTubeでの直接発表が既存の仕組みを迂回する経路を作った。批判としては、薬物と暴力の美化、そして実際にトラップを含むヒップホップ界で多くの当事者が銃撃や薬物の過剰摂取で若くして命を落としていることが繰り返し指摘されている。現在ではヒップホップの枠を超え、ポップスやEDM（クラブ向けの電子ダンス音楽）など幅広いジャンルに、ハイハットや808の手法が取り入れられている。</p>
<h2>代表曲</h2><ul><li>Life Is Good (Future feat. Drake)</li><li>Congratulations (Post Malone feat. Quavo)</li><li>Sicko Mode (Travis Scott)</li><li>Bad and Boujee (Migos)</li><li>Mask Off (Future)</li><li>Bodak Yellow (Cardi B)</li><li>XO Tour Llif3 (Lil Uzi Vert)</li><li>Goosebumps (Travis Scott)</li><li>Black Beatles (Rae Sremmurd feat. Gucci Mane)</li><li>Started From the Bottom (Drake)</li><li>Trap Queen (Fetty Wap)</li><li>Panda (Desiigner)</li><li>Bank Account (21 Savage)</li><li>Mo Bamba (Sheck Wes)</li><li>Broccoli (DRAM)</li><li>Ric Flair Drip (Offset &amp; Metro Boomin)</li><li>Caroline (Aminé)</li><li>T-Shirt (Migos)</li><li>No Type (Rae Sremmurd)</li><li>March Madness (Future)</li><li>Move That Dope (Future feat. Pharrell, Pusha T &amp; Casino)</li><li>Shoota (Playboi Carti feat. Lil Uzi Vert)</li></ul>
