<h1>Trap（トラップ）とは</h1>
<p>トラップは、米国南部で固まった、リズムの層構造を最大の特徴とするヒップホップのスタイルだ。 中核はRoland TR-808のバスドラムである。減衰（音が消えていくこと）を長く伸ばして音程を持たせ、旋律を弾くように上下させる。この</p>
<p>トラップは、米国南部で固まった、リズムの層構造を最大の特徴とするヒップホップのスタイルだ。

中核はRoland TR-808のバスドラムである。減衰（音が消えていくこと）を長く伸ばして音程を持たせ、旋律を弾くように上下させる。この808（またはそれを模したサンプル・シンセ音）が低音とベースラインを担う点が決定的で、通常の楽器としてのベースはほとんど使われない。

上物（メロディーなど上に重ねる音）は、単音のドローンやシンセ、管弦楽風の音色が使われ、暗めの作風が多い。ただしZaytovenのように、明るい和音の変種もある。

BPMは表記上100〜176と幅がある。典型は140前後だが、キックとスネアは半分の速度で置かれる。そのため体感は、典型的に70前後の重い揺れになる。スネアあるいはクラップ（手拍子の音）は、典型的には小節の、140BPM基準では3拍目（70基準では2・4拍に相当）に置かれる。その隙間をハイハットが埋める。ハイハットは16分音符を基本とする。そこから32分音符、64分音符、さらに三連符（1拍を3等分したリズム）へと目まぐるしく変速し、この変速そのものが曲の推進力となる。

歌唱面では、オートチューン（音程を自動で補正する処理）を深くかけた、歌とラップの中間的な発声が、2010年代以降、Future、Young Thug、Migosらを通じて広まった特徴だ。同じ語句を繰り返すアドリブが、背後に多層に重ねられる。

歌詞は、薬物の売買、暴力、貧困からの脱出、成功の誇示を扱う。名称そのものが、麻薬を売る場所を指す俗語に由来する。</p>
<h2>成り立ち</h2><p>舞台はアトランタだ。トラップは、南部ヒップホップの一派として、1990年代に起源を持ち、2000年代初頭に形を整えた（時期には諸説）。名称は、麻薬取引が行われる建物を指す俗語、トラップ・ハウスに由来する。

音の原型を築いたとされるのは、アトランタのプロデューサーShawty Redd、DJ Toompらだ。メンフィス（Three 6 Mafia、DJ Paul &amp; Juicy J）やマイアミ・ベース、ニューオーリンズなど、複数の南部の源流の影響を受けたという。彼らはTR-808の伸びるキックと、高速のハイハットを組み合わせて、独自の骨格を築いた。

ジャンル名を広めた一因は、ラッパーのT.I.である。2003年のアルバムTrap Muzikによって、この語が広く知られた。T.I.本人は用語を作ったと主張するが、定説ではない。語やそれに関わる作品は、それ以前からある。

続いてYoung Jeezyが2005年にLet's Get It: Thug Motivation 101を、Gucci Maneが同年にTrap Houseを出し、それぞれ異なる語り口を示した。クランクやスナップに続き、トラップでもアトランタが中心となった。Zaytovenは2000年代前半からGucci Maneと制作し、教会音楽を背景にした、キーボード主体の作風で知られる。

2010年前後には、プロデューサーのLex Lugerが、劇的な管弦楽風のシンセと重い808を組み合わせた音を広めた。Waka Flocka FlameのFlockaveliや、Rick RossのB.M.F.といった作品を通じて、この音は全国的な標準となった。

続いて、三連符で畳みかけるフロウが広まった。いわゆるトリプレット・フロウ（細かい三連の節回し）である。1988年のPublic Enemyや、90年代のThree 6 Mafia、Bone Thugs-N-Harmonyに先例があった。それをMigosが、2013年のVersaceで広く知らしめた。2016年に発表されたMigos feat. Lil Uzi Vert名義のBad and Boujeeは、2017年初め（1月21日付）に米国で首位を獲得した。Bad and Boujeeの首位は、2010年代に進んだ主流化を表す出来事の一つである。

Future、Young Thug、21 Savage、Lil Babyらは、それぞれ異なる方向へ拡張した。808 MafiaのSouthsideやLex Luger、そしてSouthsideと組んだMetro Boominといったプロデューサーが、音の設計を担った。

産業面では、ミックステープ（正式リリースを経ず、無料などで配布される非公式な音源集。オリジナル曲を収めることが多い）の無料配布という流通形態があった。さらにSoundCloudやYouTubeでの直接発表が、既存の仕組みを迂回する経路を作った。

一方で、批判もある。薬物と暴力の美化が指摘されてきた。さらに、実際にトラップを含むヒップホップ界で、多くの当事者が銃撃や薬物の過剰摂取で若くして命を落としていることも、指摘されることがある。

現在では、ヒップホップの枠を超えた。ポップスやEDMなど幅広いジャンルに、ハイハットや808の手法が取り入れられている。</p>
