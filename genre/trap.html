<h1>Trap（トラップ）とは</h1>
<p>米国南部で確立した、リズムの層構造を最大の特徴とするヒップホップの様式。BPMは表記上130〜150だが、キックとスネアは半分の速度で置かれるため体感は65〜75の重い揺れになる。中核はRoland TR-808のバスドラムで、減</p>
<p>米国南部で確立した、リズムの層構造を最大の特徴とするヒップホップの様式。BPMは表記上130〜150だが、キックとスネアは半分の速度で置かれるため体感は65〜75の重い揺れになる。中核はRoland TR-808のバスドラムで、減衰を長く伸ばして音程を持たせ、旋律を弾くように上下させる。この808が低音とベースラインを同時に担う点が決定的で、通常の楽器としてのベースはほとんど使われない。スネアあるいはクラップは必ず三拍目に着地し、その隙間をハイハットが埋める。ハイハットは16分音符を基本としながら、32分音符、64分音符、さらに三連符へと目まぐるしく変速し、この変速そのものが曲の推進力となる。上物は極めて少なく、単音のシンセ、金属的なベル、暗い管弦楽風のパッド、ピアノの短い動機などが短調で反復される。歌唱面ではオートチューンを深くかけた歌とラップの中間的な発声が主流で、同じ語句を繰り返すアドリブが背後に多層に重ねられる。歌詞は薬物の売買、暴力、貧困からの脱出、成功の誇示を扱い、名称そのものが麻薬を売る場所を指す俗語に由来する。</p>
<h2>成り立ち</h2><p>1990年代末から2000年代初頭のアトランタで、南部ヒップホップの一派として形成された。名称は、麻薬取引が行われる建物を指す俗語トラップ・ハウスに由来する。音の原型を作ったのはプロデューサーのShawty Redd、DJ Toomp、そしてMannie Freshらで、彼らはTR-808の伸びるキックと高速のハイハットを組み合わせた独自の骨格を築いた。ジャンル名を決定づけたのはラッパーT.I.で、2003年のアルバムTrap Muzikにより語が一般化した。続いてYoung Jeezyが2005年のLet's Get It: Thug Motivation 101で、Gucci Maneが同年のTrap Houseで、それぞれ異なる語り口を提示し、アトランタが南部ヒップホップの中心地となった。2010年前後、プロデューサーLex Lugerが劇的な管弦楽風のシンセと重い808を組み合わせた音を確立し、Waka Flocka FlameのFlockaveliやRick RossのB.M.F.といった作品を通じて全国的な標準となった。同時期、Zaytovenは教会のオルガン奏者としての素養を活かし、明るい和音を持つ変種を作った。2010年代半ばには、Migosが三連符で畳みかけるフロウ、いわゆるトリプレット・フロウを広め、2016年のBad and Boujeeが米国で首位を獲得したことでトラップが完全に主流の音になった。Future、Young Thug、21 Savage、Lil Babyらがそれぞれ異なる方向へ拡張し、Metro BoominやSouthsideといったプロデューサー集団808 Mafiaが音の設計を担った。産業面では、ミックステープの無料配布という流通形態、そしてSoundCloudやYouTubeでの直接発表が既存の仕組みを迂回する経路を作った。批判としては、薬物と暴力の美化、そして実際に多くの当事者が銃撃や薬物の過剰摂取で若くして命を落としていることが繰り返し指摘されている。現在ではヒップホップの枠を超え、世界中のポップスの基本的なリズム語彙として定着している。</p>
<h2>代表曲</h2><ul><li>Bad and Boujee (Migos)</li><li>Mask Off (Future)</li><li>Sicko Mode (Travis Scott)</li></ul>
