<h1>Balkan Brass Band（バルカンブラスバンド）とは</h1>
<p>バルカン半島の村や街で吹き鳴らされる、金管バンドの音楽だ。 編成は、トランペット数本、フリューゲルホルン、テノールホルンやバリトン・ホルンといった中低音の金管、そしてチューバだ。これに、両面太鼓のタパンやスネアが加わる。金管と打楽</p>
<p>バルカン半島の村や街で吹き鳴らされる、金管バンドの音楽だ。

編成は、トランペット数本、フリューゲルホルン、テノールホルンやバリトン・ホルンといった中低音の金管、そしてチューバだ。これに、両面太鼓のタパンやスネアが加わる。金管と打楽器が中心で、弦楽器も鍵盤も通常は入らない。ただし録音やステージでは、ヴァイオリンやアコーディオンが加わる例がある。木管（サックスやクラリネット）を加える楽団も多い。

チューバとバリトン・ホルンが、休みなく行進曲風の低音を刻む。その上でトランペットが、細かい飾りの音を詰め込んだメロディーを吹く。音階はオスマン・トルコなど中東系の旋法の影響が濃い。増2度を含む音程が、独特の東方的な陰りを与える。

拍子に特徴がある。2拍子系の速い拍子のほか、8分の7、8分の9といった非対称の拍子も使われる。長い拍と短い拍がまとまりごとに組み合わさり、跳ねたリズムになる。テンポは曲の種類によって異なる。速いテンポの曲が多く、曲の中で勢いを増していくこともある。儀礼の遅い踊りでは、速度を落とす例もある。強弱の幅は極端で、奏者は楽器の向きで音量を調整する。

演奏の場は、結婚式などの儀礼や祭りだ。奏者は聴衆の目の前まで歩み寄って吹き、客が奏者にチップを渡す習慣がある。多くの奏者は独学で、楽譜を使わずに耳で覚える。</p>
<h2>成り立ち</h2><p>起源には諸説がある。ひとつは、オスマン帝国とハプスブルク帝国の軍楽隊の編成に、地元の音楽家が影響を受けたという説だ。1804〜13年のセルビア蜂起で信号ラッパを使った兵士が、帰郷後に民謡を演奏したという説もある。1831年にミロシュ公が軍楽隊を設立したという説などもある。

南東セルビアのロマは、1912〜13年のバルカン戦争の兵役で、金管に触れたとされる。セルビアでは、東部（ザイェチャルなど）、南部（ヴラニェなど）、西部（ウジツェなど）の3つの流派が発展した。南東部では、ロマの楽団が優勢である。

中心的な役割を果たしたのが、グチャ・トランペット祭だ。1961年に、セルビアのグチャという小さな村で始まった。当初は数バンドの地域行事だったが、現在は八月の数日間に推定値で数十万人が集まる、巨大な催しとなった。

賞の格づけでは、最高位は審査員賞の最優秀オーケストラで、第1トランペットも重視される。黄金のトランペットは観客投票による賞で、4大賞の中では最も格が低いとされている。この祭の競争が、奏者の名声と技の向上を促したとされる。

最も知られた名手の一人が、ロマ出身のトランペット奏者Boban Markovićだ。グチャで何度も優勝し、後に息子のMarko Markovicと組んで世界を巡っている。北マケドニアではKočani Orkestarが、東方的な旋法と、技巧的で荒々しいソロで知られる。その音楽は、トルコ的なリズムを取り入れたロマの音楽である。

この音楽を欧州の外にも広めた功労者の一人が、映画監督のEmir Kusturicaである。『アンダーグラウンド』(1995)ではGoran Bregovićの音楽とともに、『黒猫・白猫』(1998)ではNele Karajlićらの音楽とともに、この音楽を大々的に用いた。どちらも多くの観客に強い印象を残した。Fanfare CiocărliaやBoban Marković、Shantelなども、普及に力を貸した。

ただしその過程で、ロマの音楽が異国風の雰囲気として消費されることや、原曲の作者に正当な対価が渡らないことへの批判も生じた。対価をめぐる批判は主にGoran Bregovićに向けられたが、本人は否定している。1990年代のユーゴスラビア紛争では、この音楽が民族主義的な文脈で使われた例が指摘されている。

1990年代には、ベルリンのDJ Robert Šokoが「バルカン・ビーツ」と名付けた流れを広めた。のちにShantelやBalkan Beat Boxらが、クラブ音楽との融合を進めた。</p>
