<h1>Balkan Brass Band（バルカンブラスバンド）とは</h1>
<p>バルカン半島の村や街で吹き鳴らされる金管バンドの音楽。編成はトランペット数本、フリューゲルホルン、テノールホルンやバリトン・ホルンといった中低音の金管、そしてチューバ、加えて両面太鼓のタパンやスネアが加わる。弦楽器も鍵盤も入らず、</p>
<p>バルカン半島の村や街で吹き鳴らされる金管バンドの音楽。編成はトランペット数本、フリューゲルホルン、テノールホルンやバリトン・ホルンといった中低音の金管、そしてチューバ、加えて両面太鼓のタパンやスネアが加わる。弦楽器も鍵盤も入らず、金管と打楽器が中心で、木管（サックスやクラリネット）を加える楽団も多い。チューバとバリトン・ホルンが休みなく行進曲風の低音を刻み、その上でトランペットが細かい飾りの音を詰め込んだメロディーを吹き、時に2本がわずかにずれた同じ旋律で、唸るような響きを生む。拍子が特徴的で、2拍子系の速い拍子のほか、8分の7、8分の9といった非対称の拍子も使われ、長短の拍が交互に来る跳ねたリズムになる。テンポは曲の中で加速し、終盤には演奏不能寸前まで速まる。音階はトルコやアラブ由来の旋法の影響が濃く、増2度を含む音程が独特の東方的な陰りを与える。強弱の幅は極端で、全員が力の限り吹き鳴らす音量が基本である。演奏の場は結婚式などの儀礼や祭りで、聴衆の目の前まで歩み寄って吹き、客が奏者にチップ（baksheesh）を渡す習慣がある。多くの奏者は独学で、楽譜を使わず耳で覚える。</p>
<h2>成り立ち</h2><p>起源には諸説がある。オスマン帝国とオーストリア＝ハンガリーの軍楽隊の編成に地元の音楽家が影響を受けたという説、1804〜13年のセルビア蜂起で信号ラッパを使った兵士が帰郷後に民謡を演奏したという説、1831年にミロシュ公が軍楽隊を設立したという説などがある。南東セルビアのロマは、1912〜13年のバルカン戦争の兵役で金管に触れたとされる。セルビアでは、東部（ザイェチャルなど）、南部（ヴラニェなど）、西部（ウジツェなど）の3つの流派が発展し、南東部ではロマの楽団が優勢である。中心的な役割を果たしたのが、1961年にセルビアのグチャという小さな村で始まったグチャ・トランペット祭である。当初は数バンドの地域行事だったが、現在は八月の数日間に数十万人が集まる巨大な催しとなった。賞の格づけには資料により違いがあり、審査員賞の最優秀オーケストラや第1トランペットを重視する見方もあれば、観客投票の黄金のトランペットを「最強の楽団の証」とする見方もある。この祭が競争を通じて技術水準を飛躍的に高めた。最大の名手はロマ出身のトランペット奏者Boban Markovicで、グチャで何度も優勝し、後に息子のMarko Markovicと組んで世界を巡っている。マケドニアではKocani Orkestarが、東方的な旋法、7/8や9/8などの非対称拍子、技巧的で荒々しいソロで知られる。この音楽を欧州外にも広めた功労者の一人が映画監督のEmir Kusturicaで、『アンダーグラウンド』(1995)ではGoran Bregovicの音楽とともに、『黒猫・白猫』(1998)ではNele Karajlićらの音楽とともに大々的に用い、多くの観客に強い印象を残した。Fanfare CiocărliaやBoban Marković、Shantelなども普及に寄与した。ただしその過程で、ロマの音楽が異国風の雰囲気として消費されることや、原曲の作者に正当な対価が渡らないことへの批判も生じた。1990年代のユーゴスラビア紛争では、この音楽が民族主義の象徴として使われる場面もあった。2000年代以降はBalkan Beat BoxやShantel、Fanfare Ciocarliaを通じてクラブ音楽と結びつき、バルカン・ビーツと呼ばれる流れを生んでいる。</p>
