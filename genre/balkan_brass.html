<h1>Balkan Brass Band（バルカンブラスバンド）とは</h1>
<p>バルカン半島の村や街で吹き鳴らされる金管バンドの音楽。編成はトランペット数本、フリューゲルホルン、テノールホルンやバリトンといった中低音の金管、そしてチューバ、加えて片面太鼓のタパンやスネアが加わる。弦楽器も鍵盤も入らず、旋律から</p>
<p>バルカン半島の村や街で吹き鳴らされる金管バンドの音楽。編成はトランペット数本、フリューゲルホルン、テノールホルンやバリトンといった中低音の金管、そしてチューバ、加えて片面太鼓のタパンやスネアが加わる。弦楽器も鍵盤も入らず、旋律から低音まですべて金管が担う。チューバとバリトンが休みなく行進曲風の低音を刻み、その上でトランペットが装飾音を詰め込んだ旋律を吹き、時に二本が僅かにずれたユニゾンで唸りを生む。拍子が最大の特徴で、四分の四だけでなく、八分の七、八分の九、八分の11といった非対称の拍子が日常的に使われ、長短の拍が交互に来る跳ねたリズムになる。テンポは曲の中で加速し、終盤には演奏不能寸前まで速まる。音階はトルコやアラブ由来の旋法の影響が濃く、増二度を含む音程が独特の東方的な陰りを与える。強弱の幅は極端で、全員が力の限り吹き鳴らす音量が基本である。演奏の場は屋内ではなく屋外で、結婚式、洗礼、葬儀、収穫祭の行列で、聴衆の目の前まで歩み寄って吹き、客が奏者の額に紙幣を貼りつける習慣がある。楽譜は使われず、すべて耳で覚えて伝えられる。</p>
<h2>成り立ち</h2><p>起源は十九世紀のオスマン帝国とハプスブルク帝国の軍楽隊にある。オスマン軍のメフテルと呼ばれる軍楽と、オーストリア側の西洋式の吹奏楽が、支配の交代とともにこの地域に金管楽器を残した。徴兵を終えた兵士が楽器を持ち帰り、村の祭りで演奏したことから民間に広まったとされる。とりわけセルビア南西部と、ロマの人々が多く住む地域で独自に発展した。中心的な役割を果たしたのが、1961年にセルビアのグチャという小さな村で始まったグチャ・トランペット祭である。当初は数バンドの地域行事だったが、現在は八月の数日間に数十万人が集まる巨大な催しとなり、優勝者に授けられる黄金のトランペットは奏者にとって最高の栄誉とされる。この祭が競争を通じて技術水準を飛躍的に高めた。最大の名手はロマ出身のトランペット奏者Boban Markovicで、グチャで何度も優勝し、後に息子のMarko Markovicと組んで世界を巡っている。マケドニアではKocani Orkestarが、より東方的な旋法とゆったりした九拍子の演奏で知られる。この音楽を世界に広めたのは映画監督のEmir Kusturicaで、『アンダーグラウンド』(1995)や『黒猫・白猫』(1998)の中でGoran Bregovicの音楽とともに大々的に用い、欧州の観客に強い印象を残した。ただしその過程で、ロマの音楽が異国情緒として消費されることや、原曲の作者に正当な対価が渡らないことへの批判も生じた。1990年代のユーゴスラビア紛争では、この音楽が民族主義の象徴として使われる場面もあった。2000年代以降はBalkan Beat BoxやShantel、Fanfare Ciocarliaを通じてクラブ音楽と結びつき、バルカン・ビーツと呼ばれる流れを生んでいる。</p>
