<h1>Musical theatre（ミュージカル）とは</h1>
<p>ミュージカルは、歌・台詞・演技・ダンスをひとつの作品の中で統合して物語を運ぶ、舞台音楽の形式である。 音の中心を担うのは、ピットオーケストラ（舞台前の低い場所で演奏する楽団）だ。弦楽器・木管・金管・打楽器に加え、作品によってはシン</p>
<p>ミュージカルは、歌・台詞・演技・ダンスをひとつの作品の中で統合して物語を運ぶ、舞台音楽の形式である。

音の中心を担うのは、ピットオーケストラ（舞台前の低い場所で演奏する楽団）だ。弦楽器・木管・金管・打楽器に加え、作品によってはシンセサイザー、エレクトリックピアノ、シンセベース、エレキギター、ドラムセットまでオーケストラピットに並ぶ。編成によって音色は大きく変わる。クラシック由来の弦の響きを基調にした豊かな響きから、1980年代風のエレクトリックピアノとシンセベースが効いた密度の高い音まで幅がある。

和声は、大衆歌謡と同じ機能和声（和音ごとの役割で進行を決める仕組み）を基調にしている。転調や浮遊感のあるモーダルな響きで、感情の転換を描く。

リズムは曲ごとに独立している。タップダンスのシンコペーション（拍の位置をずらす乗り）、ワルツ、ロックのバックビート、ラテンのクラーベ（決まったリズムの型）まで、場面ごとに切り替わる。

歌唱法にはレジット、ベルト、ミックスなどのスタイルがあり、ベルティングはその1つだ。強烈な高音で観客席を圧倒するベルティングは、ブロードウェイを特徴づける歌唱法の1つである。

歌詞は、登場人物の内面描写と物語の推進を同時に担う。

ナンバーは、一般に台詞の途切れ目に差し込まれる。序曲（オーバーチュア）で作品の代表的な旋律の抜粋をメドレー風に聴かせる作品が多い(序曲のない作品もある)。第1幕の早い段階で主人公の願望・動機を歌い、物語の軌道を決めるI Wantソングや、終盤で決断や代償を歌う11時のナンバー（終盤の見せ場の曲）という機能的な型も定着している。

構成は、台詞と歌を交互に挟む形式が一般的だ。ただし『Les Misérables』『Hamilton』のように、ほぼ全編を歌で通す(sung-through)作品もある。

コーラスのアンサンブルが、群衆や心理の厚みを補う。劇場の残響の中で、拡声された生の歌声と実演のオーケストラが直接届く。この点が、録音で聴く音楽と決定的に違う。</p>
<h2>成り立ち</h2><p>ミュージカルの起源には、諸説ある。1860年代(1862年Doctor of Alcantara、1866年Black Crook)が起点とされることが多いが、1841年の先行例や欧州の軽歌劇の影響も指摘される。

1866年に初演されたThe Black Crookは、ダンスと、既存曲の翻案を中心に一部の新曲(『You Naughty, Naughty Men』など)を加えた音楽を物語に織り込んだ、大仕掛けのショーだった。大当たりし、当時の記録となる474回公演を達成した。

やがて、ジェローム・カーンが作曲し、オスカー・ハマースタイン2世が台本を手がけたShow Boatが、1927年にブロードウェイで初演された。台本と楽曲を従来以上に完全に統合し、音楽・台詞・舞台装置・動きで劇的な主題を語る道を開いた。

1943年にはリチャード・ロジャースとハマースタインのOklahoma!が、この統合を完成させたと評される。一貫した筋立て、物語を進める歌、夢のバレエと呼ばれる筋を運ぶダンスを備え、アメリカ・ミュージカルの黄金時代(1940〜60年代)の幕を開けたとされる。この時代には、ラーナーとルーウェのMy Fair Lady(1956年、2717回公演で長らく長寿記録を保持)や、ロミオとジュリエットを現代ニューヨークに移し替えたWest Side Story(1957年)が生まれた。

1962年にはスティーブン・ソンドハイムがブロードウェイの上演作として初めて作詞と作曲の双方を担当したA Funny Thing Happened on the Way to the Forumが上演された。その流れは、のちにCompany(1970年)、Sweeney Todd(1979年)といった観念的で暗い主題の作品群へと発展した。1967年にオフ・ブロードウェイで初演され、1968年にブロードウェイで開幕したHairは、ロック音楽を本格的に導入した。ヌードやベトナム戦争をめぐる物議を醸す主題でも話題を呼んだ。

1980年代には、アンドリュー・ロイド・ウェバーとプロデューサーのキャメロン・マッキントッシュが、Cats(1981年)でメガミュージカル（巨大規模のミュージカル）現象を起こした。クロード=ミシェル・シェーンベルクとアラン・ブーブリルのLes Misérables(1985年ロンドン初演の英語版。フランス語版は1980年にパリで初演)が続いた。ロイド・ウェバーのThe Phantom of the Opera(1986年ロンドン初演、1988年ブロードウェイ開幕)は、Catsを抜いてブロードウェイ史上最長の公演記録を打ち立てた。2023年に閉幕したが、記録は今も破られていない。Les Misérablesはウェスト・エンド史上最長のミュージカルであり続けている。

既存のヒット曲集を薄い筋でつなぐジュークボックス・ミュージカル(Movin' Out(2002年)、Jersey Boys(2004年初演、2005年ブロードウェイ開幕)、Rock of Ages(2005年初演、2009年ブロードウェイ開幕)、Thriller Live(2009年))が、1999年の『Mamma Mia!』以降に人気が急拡大した。一方でWicked(2003年)やHamilton(2015年)のような新作スコアの作品も成功を収めた。ただし大都市の大規模製作の多くは、Fiddler on the RoofやWest Side Storyといった定番のリバイバル（再演）や映画化作品に活路を見出す堅実路線が多い。

拠点はニューヨークのブロードウェイとロンドンのウェスト・エンドであり、両都市の大劇場が、世界のミュージカル製作の中心であり続けている。</p>
