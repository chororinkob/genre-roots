<h1>Musical theatre（ミュージカル）とは</h1>
<p>ミュージカルは、歌・台詞・演技・ダンスをひとつの作品の中で統合して物語を運ぶ舞台音楽の形式である。音の中心を担うのはピットオーケストラで、弦楽器・木管・金管・打楽器に加え、作品によってはシンセサイザー、エレクトリックピアノ、シンセ</p>
<p>ミュージカルは、歌・台詞・演技・ダンスをひとつの作品の中で統合して物語を運ぶ舞台音楽の形式である。音の中心を担うのはピットオーケストラで、弦楽器・木管・金管・打楽器に加え、作品によってはシンセサイザー、エレクトリックピアノ、シンセベース、エレキギター、ドラムセットまでオーケストラピットに並ぶ。編成によって音色は大きく変わり、クラシック由来の弦の響きを基調にした豊かな響きから、1980年代風のエレクトリックピアノとシンセベースが効いた密度の高い音まで幅がある。歌唱法は大きく2系統で、クラシック的な響きを保つレジット声と、マイクを用いて胸声を強く割らせて前方へ投げるベルティングであり、強烈な高音で観客席を圧倒するベルティングがブロードウェイ風の歌唱の代名詞になっている。ナンバーは台詞の途切れ目に差し込まれ、幕開けには全曲の主題を織り合わせたオーバーチュアが鳴り、主人公の願望や恐れを観客だけに明かすI Wantソング、終盤で決断や代償を歌う11時のナンバーという機能的な型が定着している。リズムは曲ごとに独立していて、タップダンスのシンコペーション、ワルツ、ロックのバックビート、ラテンのクラーベまで場面ごとに切り替わる。和声は大衆歌謡と同じ機能和成を基調に、転調や浮遊感のあるモーダルな響きで感情の転換を描く。構成には台詞と歌を交互に挟むブックミュージカルと、ほぼ全編を歌で通すsung-throughの2系統があり、歌詞は登場人物の内面描写と物語の推進を同時に担う。コーラスのアンサンブルが群衆や心理の厚みを補い、劇場の残響の中で拡声された生の歌声と実演のオーケストラが直接届く点が、録音で聴く音楽と決定的に違う。</p>
<h2>成り立ち</h2><p>ミュージカルの芽は19世紀のニューヨークの興行にあった。1866年に初演されたThe Black Crookは、ダンスとオリジナルの楽曲を物語に織り込んだ大仕掛けのショーとして大当たりし、当時の記録となる474回公演を達成した。やがてジェローム・カーンが作曲し、オスカー・ハマースタイン2世が台本を手がけたShow Boatが1927年にブロードウェイで初演され、台本と楽曲を従来以上に完全に統合し、音楽・台詞・舞台装置・動きで劇的な主題を語る道を開いた。1943年にはリチャード・ロジャースとハマースタインのOklahoma!がこの統合を完成させ、一貫した筋立て、物語を進める歌、夢のバレエと呼ばれる筋を運ぶダンスを備え、アメリカ・ミュージカルの黄金時代(1940〜60年代)の幕を開けた。この時代にはラーナーとルーウェのMy Fair Lady(1956年、2717回公演で長らく長寿記録を保持)や、ロミオとジュリエットを現代ニューヨークに移し替えたWest Side Story(1957年)が生まれた。1962年にはスティーブン・ソンドハイムが初めて作詞と作曲の双方を担当したA Funny Thing Happened on the Way to the Forumが上演され、のちにCompany(1970年)、Sweeney Todd(1979年)といった観念的で暗い主題の作品群へと発展した。1967年のHairはロック音楽を本格的に導入し、ヌードやベトナム戦争をめぐる物議を醸す主題でも話題を呼んだ。1980年代にはアンドリュー・ロイド・ウェバーとプロデューサーのキャメロン・マッキントッシュがCats(1981年)でメガミュージカル現象を起こし、クロード=ミシェル・シェーンベルクとアラン・ブーブリルのLes Misérables(1985年ロンドン初演)が続き、ロイド・ウェバーのThe Phantom of the Opera(1986年)はCatsを抜いてブロードウェイ史上最長 rož公演記録を打ち立て、現在もそれを保持する。Les Misérablesはウェスト・エンド史上最長のミュージカルであり続けている。21世紀には既存のヒット曲集を薄い筋でつなぐジュークボックス・ミュージカル(Movin' Out(2002年)、Jersey Boys(2006年)、Rock of Ages(2009年)、Thriller Live(2009年))が流行し、一方でWicked(2003年)やHamilton(2015年)のような創作も成功を収めた。ただし大都市の大規模製作の多くは、Fiddler on the RoofやWest Side Storyといった定番のリバイバルや映画化作品に活路を見出す堅実路線が主流になっている。拠点はニューヨークのブロードウェイとロンドンのウェスト・エンドであり、両都市の大劇場が世界のミュージカル製作の中心であり続けている。</p>
