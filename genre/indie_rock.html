<h1>Indie Rock（インディーロック）とは</h1>
<p>独立系レーベルからの発表という流通形態に由来する名称を持つロックだが、特定の音の型ではなく、自分たちの手で作る姿勢で結ばれた幅広い音楽を指す。ただし、ギターが鋭く角張った音になりがちなことや、技巧より個性や本物らしさを大切にする傾</p>
<p>独立系レーベルからの発表という流通形態に由来する名称を持つロックだが、特定の音の型ではなく、自分たちの手で作る姿勢で結ばれた幅広い音楽を指す。ただし、ギターが鋭く角張った音になりがちなことや、技巧より個性や本物らしさを大切にする傾向は、よく指摘される。編成はギター、ベース、ドラムの基本形に、鍵盤や管楽器、時に弦楽器が加わる。ギターはコーラスやリヴァーブをかけたクリーン（歪んでいない）な音、あるいは軽く歪ませたアルペジオ（和音を1音ずつ順に弾く奏法）に寄る傾向もあるが、Dinosaur Jr.やノイズロック系のように轟音のものも含む。歌唱は技巧より、その人らしさを大切にすることが多い。歌詞は日常の細部、友人関係、都市生活の孤独、文学や映画への言及を扱い、私的で観察的な視点を持つ。録音は低予算であることを隠さず、その手作り感そのものが誠実さの証として受け取られてきた。</p>
<h2>成り立ち</h2><p>起源は1980年代前半から半ばの、イギリス・米国・ニュージーランドにおける独立系レーベルの隆盛にある。イギリスでは1970年代末にRough Tradeが全国への配給（レコード店へ商品を届ける仕事）を始め、のちに、各地の配給会社が手を組んだ組合The Cartelにまとめられた（できた年は資料によって違う）。Mute Recordsを作ったDaniel Millerも、1978年に最初のシングルをRough Tradeに持ち込み、配給を引き受けてもらった。こうして、大手レコード会社を通さずに全国のレコード店へ作品を届ける独自の流通網ができた。1986年、音楽誌NMEが読者向けの通信販売でカセットC86を頒布し、そこに収録された22組のギター・バンドは、後にインディー・ポップやインディー・ロックと呼ばれる感性の、はじまりの一つとされる。米国側では、大学ラジオ局と地域の小規模レーベル、たとえば、ミシガン州で始まりのちにシカゴへ移ったTouch and Goや、ワシントンD.C.のDischordが同様の役割を果たした。少し遅れて1980年代末からは、ノースカロライナのMerge Recordsも同じ役割を担った。1990年代にはPavementとGuided by Voicesがlo-fi（安い機材や少ない予算で録った、粗い音の録音）の代表格となり、低予算や簡単な機材のために生まれた録音の粗さを自分たちの持ち味として受け入れ、気だるい歌唱とあわせて魅力にし、Built to Spillは別の方向性（長いギターソロ）で1990年代のインディーを代表した。とりわけPavementは1992年のSlanted and Enchantedで、乱れたギターの音や、音がぶつかり合う和音の組み立てを前に出し、手作りの味わいのある作品として評された。転機は2000年代前半から半ばにかけてで、ニューヨークのThe Strokes、デトロイトのThe White Stripes、そしてイギリスのArctic Monkeysが商業的な成功を収めたことにより、インディーという語の意味が曖昧になった（語は1990年代までに音の様式を指すようになっていた）。Arctic Monkeysは2005年に、ファンがMySpace上で共有した音源から人気を得て、2006年当時、英国史上最速で売れたデビュー作となり（現在もバンドとしては最速）、バンドが関わらないファンの共有から人気が広がるという、新しい広まり方の例となった。2000年代半ばには、ブログを中心とする批評のしくみができ、Pitchforkのような媒体の好意的な評価が売上を押し上げるようになった。たとえば、2004年のArcade Fire『Funeral』は、Pitchforkの10点満点中9.7点という高い評価が人気の大きな理由としてよく挙げられる。しかしこの過程で、独立性という当初の定義は薄れ、大手レコード会社との契約が増え、インディーは単なる市場の区分と化した。現在では、音の質感と態度を指す形容詞として世界中で使われている。</p>
