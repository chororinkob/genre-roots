<h1>Indie Rock（インディーロック）とは</h1>
<p>独立系レーベルからの発表という流通形態に由来する名称を持つロックだが、音楽的にも一定の傾向を共有する。編成はギター、ベース、ドラムの基本形に、鍵盤や管楽器、時に弦楽器が加わる。ギターは大音量の歪みより、コーラスやリヴァーブをかけた</p>
<p>独立系レーベルからの発表という流通形態に由来する名称を持つロックだが、音楽的にも一定の傾向を共有する。編成はギター、ベース、ドラムの基本形に、鍵盤や管楽器、時に弦楽器が加わる。ギターは大音量の歪みより、コーラスやリヴァーブをかけたクリーンな音、あるいは軽く歪ませたアルペジオが好まれ、音の隙間を残す。この結果、轟音で塗りつぶすメタルやハードロックとは対照的に、各楽器の輪郭が見える録音になる。ドラムは装飾を抑え、シンプルな8分音符の刻みが多い。和声はロックの三和音に加え、七度や九度を含む響き、あるいは旋法的な進行を用い、明快な解決を避けることがある。旋律は口ずさめる範囲に収まるが、フックを繰り返す商業的な作りは意図的に避けられる。歌唱は技巧より個性を重んじ、細く頼りない声、話し声に近い発声、外れかけた音程が表現として肯定される。歌詞は日常の細部、友人関係、都市生活の孤独、文学や映画への言及を扱い、私的で観察的な視点を持つ。録音は低予算であることを隠さず、その手作り感そのものが誠実さの証として受け取られてきた。</p>
<h2>成り立ち</h2><p>起源は1980年代のイギリスと米国における独立系レーベルの隆盛にある。イギリスでは1980年にRough Trade、Factory Records、Mute Recordsといったレーベルが独自の流通網を築き、大手レコード会社を通さずに全国のレコード店へ商品を届ける仕組みを作った。1986年、音楽誌NMEが付録カセットC86を発表し、そこに収録された22組のギター・バンドが、後にインディー・ポップやインディー・ロックと呼ばれる感性の出発点となった。米国側では、大学ラジオ局と地域の小規模レーベル、たとえばシカゴのTouch and Go、ワシントンD.C.のDischord、ノースカロライナのMerge Recordsが同様の役割を果たした。1990年代前半にはPavement、Guided by Voices、Built to Spillといったバンドが、あえて粗い録音と気だるい歌唱を選び、この様式を確立した。とりわけPavementは1992年のSlanted and Enchantedで、音を外すことや構成を崩すことを美学として提示した。転機は2000年代前半で、ニューヨークのThe Strokes、デトロイトのThe White Stripes、そしてイギリスのArctic Monkeysが商業的な成功を収めたことにより、インディーという語が流通形態ではなく音の様式を指すようになった。Arctic Monkeysは2005年、MySpace上でファンが共有した音源から人気を得て、イギリス史上最速で売れたデビュー・アルバムを記録し、インターネットが業界の構造を変えたことを示した。2000年代後半にはブログを中心とする批評の生態系が形成され、Pitchforkのような媒体の評価が売上を左右するようになった。しかしこの過程で、独立性という当初の定義は薄れ、大手レコード会社の傘下にある独立系レーベルが増え、インディーは単なる市場の区分と化した。現在では、音の質感と態度を指す形容詞として世界中で使われている。</p>
