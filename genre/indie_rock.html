<h1>Indie Rock（インディーロック）とは</h1>
<p>インディー・ロックは、独立系レーベルからの発表という流通形態に由来する名前を持つロックだ。特定の音の型ではなく、DIY的な姿勢で結ばれた幅広いスタイルを指す。ただし、ギターが鋭く角張る傾向や、技巧より個性や真正性を重んじる傾向が、</p>
<p>インディー・ロックは、独立系レーベルからの発表という流通形態に由来する名前を持つロックだ。特定の音の型ではなく、DIY的な姿勢で結ばれた幅広いスタイルを指す。ただし、ギターが鋭く角張る傾向や、技巧より個性や真正性を重んじる傾向が、しばしば指摘される。

編成は、ギター、ベース、ドラムの基本形が中心だ。そこに鍵盤や管楽器、時には弦楽器が加わる。ギターは、コーラスやリヴァーブをかけたクリーン（歪んでいない）な音になりやすい。軽く歪ませたアルペジオ（和音を1音ずつ順に弾く奏法）に寄る傾向もある。一方、Dinosaur Jr.やノイズロック系のように、轟音のものも含まれる。

和声は、ロックの三和音（基本の3音の和音）が土台になる。そこに、7度や9度を含む響きや、旋法（音の並び方の型）的な進行を加える。明快な解決を避けることもある。旋律は、口ずさめる範囲に収まる。

歌唱は、技巧より個性を重んじる。細く頼りない声、話し声に近い発声、外れかけた音程が、表現として肯定される。

歌詞は、日常の細部、友人関係、都市生活の孤独、文学や映画への言及を扱う。視点は私的で、観察的だ。

録音は、低予算であることを隠さない。その手作り感そのものが、誠実さの証として受け取られてきた。</p>
<h2>成り立ち</h2><p>起源は、1980年代前半から半ばにかけての、イギリス・米国・ニュージーランドにおける独立系レーベルが盛んになったことにある。

まずイギリスでは、1970年代末にRough Tradeが全国配給を開始した。のちにこれは、地域ごとの配給会社の協同組合であるThe Cartelへ組織化された（成立年は資料により異なる）。Factory RecordsとMute Recordsは、Cartelの加盟者ではなく、配給を受ける側のレーベルである。1986年には、音楽誌NMEが、読者向けの通信販売でカセットC86を頒布した。そこに収録された22組のギター・バンドが、後にインディー・ポップやインディー・ロックと呼ばれる感性の、一つの起点とされる。

米国側では、大学ラジオ局と地域の小規模レーベルが、同じ役割を果たした。たとえば、ミシガン州で創業し、のちにシカゴへ移ったTouch and Goや、ワシントンD.C.のDischordである。Merge Recordsは1980年代末の設立で、1990年代のノースカロライナのインディー・シーン（Superchunk、Archers of Loaf、Polvo）を担った。

1990年代には、PavementとGuided by Voicesが、lo-fi（低予算・簡易機材の録音で生じる粗さ）の代表格となった。彼らはその粗さをスタイルとして受け入れ、美学化し、気だるい歌唱を選んだ。Built to Spillは別の方向性（長いギターソロ）で、1990年代のインディーを代表した。とりわけPavementは、1992年のSlanted and Enchantedで、音を外すことや構成を崩すことを美学として提示したと評される。

転機は、2000年代前半から半ばにかけてだった。ニューヨークのThe Strokes、デトロイトのThe White Stripes、そしてイギリスのArctic Monkeysが、商業的な成功を収めた。これにより、インディーという語の意味が曖昧になった（語は1990年代までに、音のスタイルを指すようになっていた）。Arctic Monkeysは、2005年に、ファンがMySpace上で共有した音源から人気を得た。2006年当時、英国史上最速で売れたデビュー作となった（現在もバンドとしては最速）。バンドが関与しないファンの共有から人気が広がり、新しい広まり方の例となった。

2000年代半ばからは、影響力が顕在化した。ブログを中心とする批評のしくみが形成され、Pitchforkのような媒体の好意的な評価が、売上を押し上げた。

しかし、この過程で、独立性という当初の定義は薄れていった。大手との契約が増え、インディーは単なる市場の区分と化した。現在では、音の質感と態度を指す形容詞として、世界中で使われている。</p>
