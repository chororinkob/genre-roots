<h1>Electropop（エレクトロポップ）とは</h1>
<p>エレクトロポップは、シンセサイザーとドラムマシンで作られた電子音の伴奏に、明快なポップスの歌メロを乗せる音楽だ。シンセポップの派生で、硬質な電子音を強調する。1980年代初頭に成立し、2000年代後半に再び主流化した。実験性より、</p>
<p>エレクトロポップは、シンセサイザーとドラムマシンで作られた電子音の伴奏に、明快なポップスの歌メロを乗せる音楽だ。シンセポップの派生で、硬質な電子音を強調する。1980年代初頭に成立し、2000年代後半に再び主流化した。実験性より、歌のキャッチー（耳に残りやすい）さを優先する。この点で、同じ電子音楽でも、テクノやインダストリアルとは目的が異なる。

音の中心は、アナログシンセの太いベース音と、パッド（持続する背景の音）だ。そこに、電子音のリード（主旋律の音）が加わる。定番の機材は、アナログ機のRoland Jupiter-8やJuno-106、Korg Polysix、デジタル機のYamaha DX7といったものだ。1980年代には、LinnDrumやRoland TR-808、Oberheim DMXの打ち込みドラムが乗った。

和声は、マイナー調のシンプルな4コード循環の例がある。コーラス部分で長調へ抜けて、開放感を出す構成の例もある。

リズムは、4拍子の四つ打ちか、ゲート処理（残響を急に断ち切る処理）をかけたスネアが2拍4拍で鳴る、単純な形がよく見られる形のひとつだ。テンポは110〜130BPM前後の曲が多い。人力では困難な正確な16分音符の連打を、シーケンサーが刻む。そこに生の歌が乗る対比が、このジャンルの快感になる。

ヴォーカルは、張り上げるよりも、囁くように歌う抑制された発声も見られる。ハーモナイザー（声に和音を足す機器）や、後年はオートチューン（音程を自動で補正する処理）で加工されることも多い。

歌詞は、恋愛、都市の孤独、機械と人間の関係といった主題の曲もある。

曲の構成は、イントロ、Aメロ、プリコーラス、コーラス、間奏、大サビという歌謡曲的な型を守り、3〜4分台に収まることが多い。</p>
<h2>成り立ち</h2><p>1980年代初頭のイギリスと日本で、新しい電子音のポップスが育った。ドイツのKraftwerkが先行例だ。大きな背景のひとつになったのは、シンセサイザーが個人でも買える価格帯に降りてきたことだった。

それまでシンセは、大学の研究所や、プログレやクラウトロックなどで使われていた。ところが1978年前後に、Korgが小型で安価な機種を出す。パンク以降の若者たちは、楽器の訓練を経なくても、音楽を作れるようになった。

お手本になったのは、Kraftwerkだ。1977年の「Trans-Europe Express」と、1978年の「The Man-Machine」は、人間味を排した反復と機械的な歌声を使った。電子音だけで大衆音楽が成り立つことを示した、決定的な先例になった。

日本では、1978年にYellow Magic Orchestraが結成された。メンバーは、細野晴臣、坂本龍一、高橋幸宏だ。彼らは、Roland MC-8というマイクロコンポーザーで精密なシーケンスを打ち込み、ポップな旋律と組み合わせた。1979年の「Solid State Survivor」は、国際的に評価された。

イギリスでは、1979年に、Tubeway Army名義の「Are 'Friends' Electric?」とGary Numan名義の「Cars」が、全英1位を獲得した。（「Are 'Friends' Electric?」では、Numanがシンセ・ギター・ヴォーカル、Paul Gardinerがベース、Jess Lidyardがドラムを担当した。「Cars」では、Numanはギターを捨ててシンセ（Minimoog、Polymoog、ARP Odyssey）とシンセ・パーカッションを演奏した。ベースはPaul Gardiner、ドラムはCedric Sharpleyが担当した。）

1977年に結成されたThe Human Leagueは、当初は実験的だった。しかし1980年に女性ヴォーカル2人を加え、1981年に「Dare」と「Don't You Want Me」を発表して、世界的なヒットを飛ばす。そのあとに、Depeche Mode、Soft Cell、Orchestral Manoeuvres in the Dark、Yazoo、Erasureが続いた。この時期のイギリスの流れは、シンセポップと呼ばれる。ニューロマンティックとは関連はあるが、同じ意味ではない。

一方で、不安の声もあった。セッション奏者や劇場オーケストラの仕事が機械に奪われるという懸念から、1982年5月（23日とする記事もある）に、ミュージシャンズ・ユニオンのロンドン中央支部が、シンセサイザーやドラムマシンなどの禁止動議を可決したという逸話も残る（全国組織の方針ではない）。

1980年代半ばには、MTVの映像文化と結びついた。しかし、1980年代半ば以降は、反シンセの反動やインディー・ロックが人気を集めたことで後退する。1990年代初頭の米国では、グランジの人気で商業的価値を失った。

それでも2000年代に入ると、エレクトロクラッシュの流れとともに、再評価が始まる。Goldfrapp、Ladytron、The Postal Serviceなどが登場した。2005年前後には、Robynが自主レーベルから作品を出した。2007年のBritney Spears『Blackout』は、主流化の契機のひとつに挙げられる。2009年前後には、La RouxやOwl Cityが商業的成功を収めた。

2008年から2012年頃には、Lady Gaga、Kesha、Katy Perryといった主流ポップスが、エレクトロポップの要素を取り入れた。そのためジャンル名としての境界は、むしろ曖昧になった。現在は、ハイパーポップやベッドルームポップへ、要素が受け継がれている。</p>
