<h1>Electropop（エレクトロポップ）とは</h1>
<p>シンセサイザーとドラムマシンで作られた電子音の伴奏に、明快なポップスの歌メロを乗せる音楽。実験性より歌のキャッチー（耳に残りやすい）さを優先する点で、同じ電子音楽でもテクノやインダストリアルとは目的が異なる。音の中心はアナログシン</p>
<p>シンセサイザーとドラムマシンで作られた電子音の伴奏に、明快なポップスの歌メロを乗せる音楽。実験性より歌のキャッチー（耳に残りやすい）さを優先する点で、同じ電子音楽でもテクノやインダストリアルとは目的が異なる。音の中心はアナログシンセの太いベース音とパッド（持続する背景の音）、そして電子音のリード（主旋律の音）。アナログ機のRoland Jupiter-8やJuno-106、Korg Polysix、デジタル機のYamaha DX7といった機材が定番で、1980年代にはLinnDrumやRoland TR-808、Oberheim DMXの打ち込みドラムが乗った。リズムは4拍子の四つ打ちか、ゲート処理（残響を急に断ち切る処理）をかけたスネアが2拍4拍で鳴る単純な形がよく見られ、テンポは110〜130BPM前後の曲が多い。人力では困難な正確な16分音符の連打をシーケンサーが刻み、そこに生の歌が乗る対比がジャンルの快感になる。ヴォーカルは囁くように歌う抑制された発声の曲もあり、ハーモナイザー（声に和音を足す機器）や後年はオートチューン（音程を自動で補正する処理）で加工されることも多い。和声には、マイナー調のシンプルな4コード循環で始まり、コーラス部分で長調へ抜けて開放感を出す例がある。曲の構成はヴァース（歌い出し）とコーラス（サビ）を繰り返す形が基本で、3〜4分台の曲が多い。歌詞は恋愛、都市の孤独、機械と人間の関係といった主題が多い。シンセポップから派生し、硬質な電子音を強調する流れで、1980年代初頭に成立し、2000年代後半に再び主流になった。</p>
<h2>成り立ち</h2><p>1980年代初頭のイギリスと日本で（ドイツのKraftwerkが先行例）、シンセサイザーが個人でも購入可能な価格帯に降りてきたことが直接の契機になった。それまでシンセは大学の研究所や富裕なプログレッシブ・ロック奏者のものだったが、1978年前後にKorgが小型で安価な機種を出し、パンク以降の若者たちが楽器の訓練を経ずに音楽を作れるようになった。ドイツのKraftwerkが1977年に発表した「Trans-Europe Express」と1978年の「The Man-Machine」は、人間味を排した反復と機械的な歌声で、電子音だけで大衆音楽が成立することを示した決定的な先例になった。日本では細野晴臣、坂本龍一、高橋幸宏によるYellow Magic Orchestraが1978年に結成され、Roland MC-8というマイクロコンポーザーで打ち込んだ精密なシーケンスとポップな旋律を組み合わせ、1979年の「Solid State Survivor」が国際的に評価された。イギリスではTubeway Army名義の「Are 'Friends' Electric?」とGary Numan名義の「Cars」が1979年に全英1位を獲得した（「Cars」ではNumanはギターを使わずシンセを演奏し、ベースとドラムは生の奏者が担った。「Are 'Friends' Electric?」ではシンセに加えてギターも弾いた）。1977年に結成されたThe Human Leagueは当初実験的だったが、1980年に女性ヴォーカル2人を加え、1981年に発表した「Dare」と「Don't You Want Me」で世界的ヒットを飛ばす。Depeche Mode、Soft Cell、Orchestral Manoeuvres in the Dark、Yazoo、Erasureが続き、この時期のイギリスの潮流はシンセポップと呼ばれ、ニューロマンティックとは関連はあるが同義ではない。当時、セッション奏者や劇場オーケストラの仕事が機械に奪われるという懸念から、1982年5月23日にミュージシャンズ・ユニオンのロンドン中央支部が、シンセサイザーやドラムマシンなどの禁止動議を可決したという逸話も残る（全国組織の方針ではない）。1980年代半ばにはMTVの映像文化と結びつき、1980年代半ば以降は、反シンセの反動やインディー・ロックの台頭で後退し、1990年代初頭の米国ではグランジの人気で商業的な価値を失った。2000年代に入りエレクトロクラッシュの流れとともに再評価が始まり、Goldfrapp、Ladytron、The Postal Serviceなどが登場、2005年前後にはRobynが自主レーベルから作品を出し、2007年のBritney Spears『Blackout』が主流化の契機のひとつに挙げられ、2009年前後にはLa RouxやOwl Cityが商業的成功を収める。2008年から2012年頃にはLady Gaga、Kesha、Katy Perryといった主流ポップスがエレクトロポップの要素を取り入れ、ジャンル名としての境界がむしろ曖昧になった。現在はハイパーポップやベッドルームポップへ要素が受け継がれている。</p>
