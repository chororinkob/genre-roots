<h1>Electropop（エレクトロポップ）とは</h1>
<p>シンセサイザーとドラムマシンで作られた電子音の伴奏に、明快なポップスの歌メロを乗せる音楽。実験性より歌のキャッチーさを優先する点で、同じ電子音楽でもテクノやインダストリアルとは目的が異なる。音の中心はアナログシンセの太いベース音と</p>
<p>シンセサイザーとドラムマシンで作られた電子音の伴奏に、明快なポップスの歌メロを乗せる音楽。実験性より歌のキャッチーさを優先する点で、同じ電子音楽でもテクノやインダストリアルとは目的が異なる。音の中心はアナログシンセの太いベース音とパッド、そして電子音のリード。Roland Jupiter-8やJuno-106、Yamaha DX7、Korg Polysixといった機材が定番で、1980年代にはLinnDrumやRoland TR-808、Oberheim DMXの打ち込みドラムが乗った。リズムは4拍子の四つ打ちか、ゲート処理をかけたスネアが2拍4拍で鳴る単純な形が基本で、テンポは110〜130BPM前後。人力では困難な正確な16分音符の連打をシーケンサーが刻み、そこに生の歌が乗る対比がジャンルの快感になる。ヴォーカルは張り上げるよりも囁くように歌う抑制された発声が好まれ、ハーモナイザーや後年はオートチューンで加工されることも多い。和声はマイナー調のシンプルな4コード循環が多く、コーラス部分で長調へ抜けて開放感を出す構成が典型。曲の構成はイントロ、Aメロ、プリコーラス、コーラス、間奏、大サビという歌謡曲的な型を守り、3〜4分に収まる。歌詞は恋愛、都市の孤独、機械と人間の関係といった主題が多い。ニューウェイヴやシンセポップとほぼ重なる領域だが、エレクトロポップは特に2000年代以降の再興期における、より硬質で歪んだシンセ音を伴う潮流を指すことも多い。</p>
<h2>成り立ち</h2><p>1970年代末のイギリスと日本、ドイツで、シンセサイザーが個人でも購入可能な価格帯に降りてきたことが直接の契機になった。それまでシンセは大学の研究所や富裕なプログレッシブ・ロック奏者のものだったが、1978年前後にKorgやRolandが小型で安価な機種を出し、パンク以降の若者たちが楽器の訓練を経ずに音楽を作れるようになった。ドイツのKraftwerkが1977年に発表した「Trans-Europe Express」と1978年の「The Man-Machine」は、人間味を排した反復と機械的な歌声で、電子音だけで大衆音楽が成立することを示した決定的な先例になった。日本では細野晴臣、坂本龍一、高橋幸宏によるYellow Magic Orchestraが1978年に結成され、Roland MC-8というマイクロコンポーザーで打ち込んだ精密なシーケンスとポップな旋律を組み合わせ、1979年の「Solid State Survivor」が国際的に評価された。イギリスではGary Numanが1979年に「Are Friends Electric?」と「Cars」で全英1位を獲得し、シンセだけのバンドが商業的に成立することを証明した。同年結成のThe Human Leagueは当初実験的だったが、1981年に女性ヴォーカル2人を加えた「Dare」と「Don't You Want Me」で世界的ヒットを飛ばす。Depeche Mode、Soft Cell、Orchestral Manoeuvres in the Dark、Yazoo、Erasureが続き、この時期のイギリスの潮流はシンセポップまたはニューロマンティックと呼ばれた。当時、伝統的なロック側からは楽器も弾けない偽物という激しい非難が向けられ、ミュージシャンズ・ユニオンがシンセサイザーの使用制限を検討したという逸話も残る。1980年代半ばにはMTVの映像文化と結びつき、その後デジタルシンセの画一的な音色によって陳腐化が進み、90年代のグランジやブリットポップの生バンド回帰で一度は退潮した。2000年代に入りエレクトロクラッシュの流れとともに再評価が始まり、Goldfrapp、Ladytron、The Postal Serviceなどが登場、2005年前後からはLa RouxやRobyn、Owl Cityが商業的成功を収める。2008年から2012年頃にはLady Gaga、Kesha、Katy Perryといった主流ポップスがエレクトロポップの語彙を全面採用し、ジャンル名としての境界がむしろ曖昧になった。現在はハイパーポップやベッドルームポップへ語彙が受け継がれている。</p>
