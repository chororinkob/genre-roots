<h1>Psychedelic Rock（サイケデリックロック）とは</h1>
<p>幻覚体験を音で再現しようとしたロックの一派。基本編成はロックと同じで、スタジオ効果や西洋以外の楽器、長い楽器パートが加わる。ギターにはファズ（音を荒く歪ませる効果）による荒い歪み、ワウペダル（音色を波打たせるペダル）による周波数の</p>
<p>幻覚体験を音で再現しようとしたロックの一派。基本編成はロックと同じで、スタジオ効果や西洋以外の楽器、長い楽器パートが加わる。ギターにはファズ（音を荒く歪ませる効果）による荒い歪み、ワウペダル（音色を波打たせるペダル）による周波数の掃引、そしてテープを逆回転させた逆再生音が多用され、音が空間を移動する感覚を作る。録音技術では、位相をずらして重ねることで音が渦を巻くフランジングとフェイジング、そして音像を左右に振るステレオ・パンニング（音を左右に振ること）が表現の中心となった。編成には西洋以外の楽器、とりわけインドのシタール（弦楽器）やタブラ（太鼓）、そしてメロトロンという磁気テープを用いた鍵盤楽器が加わる。和声は機能和声（和音ごとの役割で進行を決める仕組み）から離れ、ドローン、すなわち一つの音を持続させる上で旋法（音の並び方の型）的な旋律が動く構造が好まれる。拍子は4分の4から外れる曲も時折あり、曲の長さは10分を超えることもある。構成は歌ものの型を崩し、曲によっては、長い即興的な間奏や、転調（曲の途中で調が変わること）、拍子の変化が見られる。歌詞は夢、宇宙、輪廻、幼年期の記憶、意識の変容などを扱い、シュールで幻想的、難解、文学的なものが多い。演奏は照明や映像の投影と一体で提示され、聴覚だけでなく視覚を含む総合的な体験として設計されていた。</p>
<h2>成り立ち</h2><p>1960年代半ばに、米国とイギリスで相次いで現れた（最初の作品の特定には諸説あり、テキサス州オースティンの13th Floor Elevatorsが名刺に「Psychedelic rock」と印刷した1966年1月の例が、確認できる最古の用例とされる）。背景には、精神科の研究を経て知られるようになった幻覚剤LSDが、1960年代半ばにOwsley Stanleyら地下の製造者の供給で若者文化へ広がったことがある。ハーヴァード大学の心理学者Timothy Learyが、その使用を思想運動として提唱したことも影響した。米国側の中心はサンフランシスコのヘイト・アシュベリー地区を拠点とするシーンで、その前段として、Grateful Dead（1965〜66年にアシッド・テストのハウスバンド＝その場の専属バンド）らが、作家Ken Keseyの主催したアシッド・テストと呼ばれる催しでベイエリア各地やロサンゼルスなどで長時間の即興演奏を行い、1966年1月のトリップス・フェスティバルにはGrateful Deadなどが出演した。1967年の夏、サンフランシスコのヘイト・アシュベリー地区とゴールデンゲート・パークに、最大約10万人（推計では7万5千〜10万人）の若者が集まったとされる、いわゆるサマー・オブ・ラブが運動の頂点となった。イギリス側では、ロンドンでは、UFOクラブを初期の出演拠点の一つとしたPink Floydが、Syd Barrettの主導で音響実験と童話的な歌詞を組み合わせた。The Beatlesは1966年のRevolverに収録したTomorrow Never Knowsで、テープループ（テープをつなげて繰り返す手法）と逆再生を用いた革新的な録音を行い、1967年のSgt. Pepper's Lonely Hearts Club Bandでこの美学を大衆規模に広げた。The Byrdsは1966年のEight Miles Highでインド音楽とジャズを取り込み、Jimi Hendrixは1967年のAre You Experiencedでギターの音そのものを素材として扱った。しかしLSDは英国で1966年9月、カリフォルニア州で同年10月に違法化され、1968年には連邦法で所持が禁止されるなど、運動の崩壊は早かった。1967年末にはヘイト・アシュベリーは薬物依存と犯罪で荒廃し、1969年のオルタモントの無料コンサートでの刺殺事件、1970年のJimi HendrixとJanis Joplinの死が続いた。Syd Barrettは、薬物使用の影響が指摘される一方、統合失調症などの説もあり、1968年4月にバンドの脱退が発表された。一方で、この時期に確立された録音技術と構造の自由は、プログレッシヴ・ロック、クラウトロック、ヘヴィメタル、そして後年のシューゲイザーやネオ・サイケデリアへ受け継がれている。</p>
