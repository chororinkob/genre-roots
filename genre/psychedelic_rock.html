<h1>Psychedelic Rock（サイケデリックロック）とは</h1>
<p>幻覚体験を音で再現しようとしたロックの一派。基本編成はロックと同じだが、音の処理と構造が根本的に異なる。ギターにはファズによる荒い歪み、ワウペダルによる周波数の掃引、そしてテープを逆回転させた逆再生音が多用され、音が空間を移動する</p>
<p>幻覚体験を音で再現しようとしたロックの一派。基本編成はロックと同じだが、音の処理と構造が根本的に異なる。ギターにはファズによる荒い歪み、ワウペダルによる周波数の掃引、そしてテープを逆回転させた逆再生音が多用され、音が空間を移動する感覚を作る。録音技術では、位相をずらして重ねることで音が渦を巻くフランジングとフェイジング、そして音像を左右に振るステレオ・パンニングが表現の中心となった。編成には西洋以外の楽器、とりわけインドのシタールやタブラ、そしてメロトロンという磁気テープを用いた鍵盤楽器が加わる。和声は機能和声から離れ、ドローン、すなわち一つの音を持続させる上で旋法的な旋律が動く構造が好まれる。拍子は四分の四から外れることも多く、曲の長さは10分を超えることもある。構成は歌ものの型を崩し、長い即興的な間奏、突然の転調、テンポの急変を含む。歌詞は夢、宇宙、輪廻、幼年期の記憶、意識の変容などを扱い、言葉の意味より響きと連想が重視される。演奏は照明や映像の投影と一体で提示され、聴覚だけでなく視覚を含む総合的な体験として設計されていた。</p>
<h2>成り立ち</h2><p>1965年から1966年にかけて、米国西海岸とイギリスでほぼ同時に生まれた。背景には、精神科医療の実験から流出した幻覚剤LSDが、1960年代半ばに若者文化へ広がったことがある。ハーヴァード大学の心理学者Timothy Learyが、その使用を思想運動として提唱したことも影響した。米国側の中心はサンフランシスコのヘイト・アシュベリー地区で、Grateful Dead、Jefferson Airplane、Quicksilver Messenger Serviceらが、作家Ken Keseyの主催したアシッド・テストと呼ばれる催しで長時間の即興演奏を行った。1967年の夏、この地区に10万人規模の若者が集まった、いわゆるサマー・オブ・ラブが運動の頂点となった。イギリス側では、ロンドンのUFOクラブを拠点にPink Floydが、Syd Barrettの主導で音響実験と童話的な歌詞を組み合わせた。The Beatlesは1966年のRevolverに収録したTomorrow Never Knowsで、テープループと逆再生を用いた革新的な録音を行い、1967年のSgt. Pepper's Lonely Hearts Club Bandでこの美学を大衆規模に広げた。The Byrdsは1966年のEight Miles Highでインド音楽とジャズを取り込み、Jimi Hendrixは1967年のAre You Experiencedでギターの音そのものを素材化した。しかし運動の崩壊は早く、1967年末にはヘイト・アシュベリーは薬物依存と犯罪で荒廃し、1969年のオルタモントの無料コンサートでの刺殺事件、1970年のJimi HendrixとJanis Joplinの死、そして幻覚剤の非合法化が続いた。Syd Barrettも薬物の影響で精神を病み、1968年にバンドを離れている。理想が現実に破れたこの経験は、その後のロックが二度と同じ楽観を持てなくなる原因となった。一方で、この時期に確立された録音技術と構造の自由は、プログレッシヴ・ロック、クラウトロック、ヘヴィメタル、そして後年のシューゲイザーやネオ・サイケデリアへ受け継がれている。</p>
