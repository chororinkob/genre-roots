<h1>Psychedelic Rock（サイケデリックロック）とは</h1>
<p>サイケデリック・ロックは、幻覚体験を音で再現しようとしたロックの一派だ。基本編成はロックと同じで、スタジオ効果や非西洋楽器、長い楽器パートが加わる。 ギターには、ファズ（音を荒く歪ませる効果）による荒い歪みと、ワウペダル（音色を波</p>
<p>サイケデリック・ロックは、幻覚体験を音で再現しようとしたロックの一派だ。基本編成はロックと同じで、スタジオ効果や非西洋楽器、長い楽器パートが加わる。

ギターには、ファズ（音を荒く歪ませる効果）による荒い歪みと、ワウペダル（音色を波打たせるペダル）による周波数の掃引が使われる。テープを逆回転させた逆再生音も多用され、音が空間を移動する感覚を作る。編成には西洋以外の楽器も加わる。とりわけ、インドのシタール（弦楽器）やタブラ（太鼓）、そしてメロトロンという磁気テープを用いた鍵盤楽器が目立つ。

録音技術では、位相をずらして重ねることで音が渦を巻くフランジングとフェイジングが使われた。音像を左右に振るステレオ・パンニング（音を左右に振ること）も、表現の中心となった。

和声は機能和声（和音ごとの役割で進行を決める仕組み）から離れる。好まれるのは、ドローン、すなわち一つの音を持続させる上で、旋法（音の並び方の型）的な旋律が動く構造だ。

拍子は4分の4から外れる曲も時折ある。曲の長さは10分を超えることもある。構成は歌ものの型を崩し、曲によっては、調や拍子の変化、長い楽器パートやジャムが見られる。

歌詞は夢、宇宙、輪廻、幼年期の記憶、意識の変容などを扱う。シュールで幻想的、難解、文学的な歌詞が多い。

演奏は、照明や映像の投影と一体で提示された。聴覚だけでなく視覚を含む、総合的な体験として設計されていた。</p>
<h2>成り立ち</h2><p>1960年代半ば、米国とイギリスで、サイケデリック・ロックが相次いで現れた。最初の作品の特定には諸説ある。テキサス州オースティンの13th Floor Elevatorsが名刺に「Psychedelic rock」と印刷した1966年1月の例が、最初に知られる用例とされる。

背景には、幻覚剤の広がりがあった。幻覚剤LSDは精神科研究を経て知られるようになり、1960年代半ばにはOwsley Stanleyら地下の製造者が供給して広まった。ハーヴァード大学の心理学者Timothy Learyが、その使用を思想運動として提唱したことも影響した。

米国では、サンフランシスコのヘイト・アシュベリー地区を拠点とするシーンが育った。その前段で、Grateful Dead（1965〜66年にアシッド・テストのハウスバンド＝その場の専属バンド）らが、作家Ken Keseyの主催したイベントで演奏した。ベイエリア各地のアシッド・テストで、長時間の即興演奏を行ったのだ。1966年1月のトリップス・フェスティバルにも、Grateful Deadなどが出演した。1967年の夏には、最大約10万人（推計75,000〜100,000人）の若者が、サンフランシスコのヘイト・アシュベリー地区とゴールデンゲート・パークに集まったとされる。このサマー・オブ・ラブが、運動の頂点となった。

イギリスでは、ロンドンのUFOクラブを初期の出演拠点の一つとして、Pink Floydが活動した。Syd Barrettの主導で、音響実験と童話的な歌詞を組み合わせた。The Beatlesは1966年のRevolverに収録したTomorrow Never Knowsで、テープループ（テープをつなげて繰り返す手法）と逆再生を用いた革新的な録音を行った。1967年のSgt. Pepper's Lonely Hearts Club Bandでは、この美学を大衆規模に広げた。The Byrdsは1966年のEight Miles Highでインド音楽とジャズを取り込み、Jimi Hendrixは1967年のAre You Experiencedでギターの音そのものを素材として扱った。

しかし、運動の崩壊は早かった。LSDは英国で1966年9月、カリフォルニア州で同年10月に違法化され、1968年には連邦法で所持が禁止された。1967年末にはヘイト・アシュベリーが薬物依存と犯罪で荒廃した。1969年のオルタモントの無料コンサートでの刺殺事件、1970年のJimi HendrixとJanis Joplinの死が続いた。Syd Barrettについては、薬物使用の影響が指摘される一方、統合失調症などの説もある。1968年4月6日に、バンドが脱退を発表した。

それでも、この時期に固まった録音技術と構造の自由は、受け継がれていった。受け継いだのは、プログレッシヴ・ロック、クラウトロック、ヘヴィメタル、そして後年のシューゲイザーやネオ・サイケデリアである。</p>
