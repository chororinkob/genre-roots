<h1>Okinawan Music（シマウタ）とは</h1>
<p>一言でいうと、三線という蛇皮の三弦楽器を中心に、琉球・沖縄で歌い継がれてきた音楽の総称である。代表曲22曲を動画で聴け、ルーツと影響のつながりを地図でたどれる。</p>
<p>一言でいうと、三線という蛇皮の三弦楽器を中心に、琉球・沖縄で歌い継がれてきた音楽の総称である。琉球古典音楽、民謡、エイサーの踊り歌、戦後のポップスまでを広く含む。

音の中心は三線である。胴にニシキヘビの皮を張り、三本の弦を指に付けたバチで爪弾く。甘くかすれたような音色が、沖縄音楽の顔になる。古典には箏（クトゥ）や胡弓（クーチョー）、横笛が加わる。民謡やエイサーでは、パーランクーと呼ぶ小型の片面太鼓や、締太鼓・平太鼓が入る。

旋律の土台は琉球音階と呼ばれる五音音階である。ド・ミ・ファ・ソ・シの五音からなり、レとラを使わない。ミとファ、シとドの間に半音が入るため、本土の民謡にはない切ない甘さが生まれる。和音で重ねるのではなく、歌・三線・箏が同じ旋律をそれぞれの形に装飾して奏でる。

リズムは三線の爪弾きが太鼓代わりに刻み、そのうねりに乗って歌う。手拍子と掛け声で輪がわくカチャーシーという踊り歌は、民謡ライブの最後を飾る定番である。エイサーでは、パーランクーを叩いて手首を返し音を響かせる独特の奏法が見られる。

歌い方は、語尾を長く伸ばす節回しと、張りのある声量が特徴である。歌詞は恋、海、故郷、家族、戦争の記憶など、島の暮らしに根ざした主題が多い。曲は三線の手と呼ばれる定型の旋律型を土台に組み立てられ、古典ではとりわけ型を忠実に守る。

本土の民謡と同じ五音の仲間でありながら半音の使い方が違い、演歌とも節回しが別物である。戦後は米軍統治下で入ってきたロックと混ざり、琉球民謡を土台にしたポピュラー音楽、ウチナーポップと呼ばれる流れも生まれた。三線のライブハウス、居酒屋の座、エイサーの街頭演舞など、島の人が集まる場で今日も鳴っている。</p>
<h2>成り立ち</h2><p>琉球音楽の土台は、琉球国と呼ばれた王国で育った。三線は中国から伝わり、本土の三味線の起源となった楽器である。王宮の首里城では御座楽という室内楽が官僚の職務として演奏され、音階や節の体系は後に琉球古典音楽として整理された。現在、古典音楽は湛水流・安冨祖流・野村流の三流派で伝承され、工工四（くんくんしー）という独自の譜で手（旋律型）を受け継ぐ。

しかし1879年に王国が消えると、旧士族たちは首里の高い文化を各地に広めた。民衆の歌だった民謡と古典の距離が縮まり、今日「沖縄民謡」と呼ばれる歌の姿ができ上がった。

レコードの世界では、1927年に普久原朝喜が大阪でマルフクレコードを創業したことが大きな画期である。彼は琉球民謡のレコードを制作し、新曲の作詞作曲も手がけた。蓄音機から「チコンキーふくばる」と呼ばれ、その音源は南米やハワイ、南洋諸島にまで渡った。本土から隔絶され、出稼ぎで故郷を離れた沖縄人の心を、レコードが支えたのである。

しかし戦争が島を焼き、戦後の沖縄は米軍統治下に置かれた。コザ市（現沖縄市）では米兵向けのクラブやライブハウスが栄え、紫のようなハードロックの演奏者が育った。一方、大正9年生まれの嘉手苅林昌は戦後を代表する唄者として民謡を歌い続け、琉球民謡協会名誉会長として後進を育てた。登川誠仁は三線の速弾きの名手として知られ、「沖縄のジミ・ヘンドリックス」と呼ばれた。この二人の活躍が、80年代以降のブームへの道を開いた。

1977年、喜納昌吉とチャンプルーズがファーストアルバムを発表した。「ハイサイおじさん」は1969年に歌集へ初めて収録され、70年代前半には沖縄と日本で大ヒットし、沖縄の音を本土に知らしめた。その流れにりんけんバンドやネーネーズが続いた。1992年には本土のバンドTHE BOOMが三線と琉球音階を取り入れた「島唄」をアルバムで発表し、翌1993年の全国発売で150万枚を売った。この曲は夏川りみの歌唱でも広まり、2000年前後にはBEGINの作曲した「涙そうそう」を夏川りみが歌って大ヒットした。Ryukyu Undergroundのように民謡とダブを融合する動きも現れた。

ただし「島唄」という呼び名は1970年代に奄美諸島から借りたものであり、奄美の呼び名だと反発する人々もいる。現在も古典の照屋忠清や西江喜春は人間国宝として伝承を守り、国立劇場おきなわを拠点に、民謡からポップスまで幅広く受け継がれている。</p>
