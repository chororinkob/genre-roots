<h1>Okinawan Music（シマウタ）とは</h1>
<p>三線を中心に、琉球・沖縄で歌い継がれてきた音楽の総称が、沖縄音楽だ。代表曲22曲を動画で聴け、ルーツと影響のつながりを地図でたどれる。</p>
<p>三線を中心に、琉球・沖縄で歌い継がれてきた音楽の総称が、沖縄音楽だ。琉球古典音楽、民謡、エイサーの踊り歌、戦後のポップスまでを広く含む。

主役は三線である。胴にニシキヘビの皮を張った蛇皮の三弦楽器で、3本の弦を指に付けたバチで爪弾く。甘くかすれた音色が、沖縄音楽の顔になる。古典には箏（クトゥ）や胡弓（クーチョー）、横笛も加わる。民謡やエイサーでは、パーランクーと呼ぶ小型の片面太鼓や、締太鼓・平太鼓が入る。

旋律の土台は、琉球音階と呼ばれる5音音階だ。ド・ミ・ファ・ソ・シの5音からなり、レとラを除く。ただし伝統的には、レを加えた6音の音階が最も多く使われてきた。ミとファ、シとドの間に半音が入る。半音を含む点は都節音階とも共通するが、半音の位置が異なり、切ない甘さが生まれる。和音で重ねるのではなく、歌・三線・箏が同じ旋律を、それぞれの形に装飾して奏でる。

リズムは、三線の爪弾きが太鼓代わりに刻む。そのうねりに乗って歌う。手拍子と掛け声で輪がわくカチャーシーという踊り歌は、民謡ライブの最後を飾る定番だ。エイサーでは、パーランクーを叩いて手首を返し、音を響かせる独特の奏法が見られる。

歌い方は、語尾を長く伸ばす節回しと、張りのある声量が特徴だ。歌詞は恋、海、故郷、家族、戦争の記憶など、島の暮らしに根ざした主題が多い。曲は、三線の手と呼ばれる定型の旋律型を土台に組み立てられる。古典では、とりわけ型を忠実に守る。

本土の民謡と同じ5音の仲間でありながら、半音の使い方が違う。演歌とも節回しが別物だ。戦後は米軍統治下で入ってきたロックと混ざり、琉球民謡を土台にしたポピュラー音楽、ウチナーポップと呼ばれる流れも生まれた。三線のライブハウス、居酒屋の座、エイサーの街頭演舞など、島の人が集まる場で今日も鳴っている。</p>
<h2>成り立ち</h2><p>舞台は、かつて琉球国と呼ばれた王国だ。沖縄音楽の土台は、この王国で育った。三線は中国から伝わり、本土の三味線の起源となったとされる楽器である。王宮の首里城では、御座楽という室内楽が演奏された。御座楽は、冊封使歓待などのために演奏された中国系の宮廷室内楽で、琉球古典音楽（歌三線）とは別系統である。現在、古典音楽は湛水流・安冨祖流・野村流の三流派で伝承され、工工四（くんくんしー）という独自の譜で、手（旋律型）を受け継ぐ。

しかし1879年、王国が消える。地方に下った士族を通じて、三線が庶民に広まった。

レコードの世界では、1927年に普久原朝喜が大阪でマルフクレコードを創業したことが、大きな画期となった。彼は琉球民謡のレコードを制作し、新曲の作詞作曲も手がけた。自転車で蓄音器を載せて行商したことから、関西の沖縄出身者に「チコンキーフクバル」と呼ばれた。その音源は、南米・ハワイなどの移民先に渡り、戦後は原盤を送って現地でもプレスした。故郷を離れて大阪などへ出稼ぎに出た、あるいは海外へ移住した沖縄出身者の心を、レコードが支えたのである。

しかし戦争が島を焼く。戦後の沖縄は、米軍統治下に置かれた。コザ市（現沖縄市）では、米兵向けのクラブやライブハウスが栄え、ハードロックバンド「紫（MURASAKI）」などの演奏者が育った。一方、大正9年生まれの嘉手苅林昌は、戦後沖縄を代表する民謡の唄い手として歌い続け、琉球民謡協会名誉会長として後進を育てた。登川誠仁は三線の速弾きの名手として知られ、「沖縄のジミ・ヘンドリックス」と呼ばれた。

1977年11月、喜納昌吉&amp;チャンプルーズが、ファーストアルバムを発表した。「ハイサイおじさん」は1969年、父・喜納昌永監修のレコード「かりゆしぬ唄全集」に初収録され、1972年に沖縄で大ヒットした。本土では1976年に関西圏でヒットし、1977年のアルバムで全国に広まった。りんけんバンド（1977年結成、1987年デビュー）やネーネーズ（1990年結成）も現れた。

本土のバンドTHE BOOMは、三線と琉球音階を取り入れた「島唄」を、1992年12月に沖縄限定盤で発表した。1993年6月には全国発売し、150万枚を超えた。この曲は夏川りみの歌唱でも知られる。一方、BEGINは「涙そうそう」を2000年に発表した。夏川りみ版（2001年）は、2002年ごろから大ヒットした。Ryukyu Undergroundのように、民謡とダブを融合する動きも現れた。

ただし「島唄」という呼び名は、1970年代に奄美諸島から借りたものだ。奄美の呼び名だと主張する声もある。現在も古典の西江喜春は、組踊音楽歌三線の人間国宝（安冨祖流）として伝承を守っている。国立劇場おきなわは、組踊・琉球舞踊などの伝統芸能を継承する拠点である。</p>
