<h1>Boogie-Woogie（ブギウギ）とは</h1>
<p>ピアノの左手が1小節に八つの音を刻み続け、その上で右手が自由に動き回る様式である。この左手の型は、4/4拍子の1小節に8分音符が8つ並ぶという意味でエイト・トゥ・ザ・バー(1小節に8つ)と呼ばれ、低音を上下に往復させ続けることで、</p>
<p>ピアノの左手が1小節に八つの音を刻み続け、その上で右手が自由に動き回る様式である。この左手の型は、4/4拍子の1小節に8分音符が8つ並ぶという意味でエイト・トゥ・ザ・バー(1小節に8つ)と呼ばれ、低音を上下に往復させ続けることで、休みなく前へ進む力を生む。型にはいくつかの定番があり、和音の構成音を順に上がって下りるもの、2音を交互に転がすロール、低音を単純に八分で連打するものなどがある。重要なのは、この左手が曲の最初から最後までほぼ一定に保たれる点で、演奏者は、左手を自動で動く状態にして、右手だけを別に動かしているような状態に近い。右手はブルーノートを含む短い決まったフレーズをくり返し、少しずつ変形させながら熱を上げていく。三連符を土台にした跳ねと、二対一の均等でない8分音符の配分が独特の前へ進む感じを作る。和音の枠は12小節形式がほとんどで、和音は三つしか使わない。速度は中庸から極端に速いものまであり、速い演奏では鍵盤全体を使ったグリッサンドや、同音の連打が見せ場になる。汽車の走行音や汽笛を模した表現が繰り返し現れるのも特徴である。</p>
<h2>成り立ち</h2><p>始まりの時期と場所には諸説ある。口述史に基づく通説では、1870年代初頭にテキサス北東部のパイニー・ウッズと呼ばれる松林地帯で始まったとされ、木材・松脂のキャンプとする説や、テキサス州マーシャルを中心とする説もある。20世紀初頭に現れたとする見方もある。鉄道の敷設現場や伐採地には労働者向けの酒場が付属し、そこに置かれた粗末なピアノで流しの弾き手が演奏した。鉄道網が初期の広がりに関わったとされ、機関車の音と汽笛のうめきがリズムに取り込まれて、汽車の音を模倣する表現が様式に刻み込まれた。名称を決定づけたのはクラレンス・スミスで、パインタップの愛称で吹き込んだ1928年の『パインタップス・ブギ・ウギ』が広く売れ、演奏中に踊り手へ指示を出す語りごとこの様式のお手本になった。彼は翌1929年、シカゴのダンスホールで起きた乱闘での銃撃に巻き込まれ、24歳で死去している(狙われたのが本人かどうかは資料により異なる)。全国的な流行のきっかけとなったのは、1938年12月23日にニューヨークのカーネギー・ホールで開かれた演奏会『フロム・スピリチュアルズ・トゥ・スウィング』である(同じ年の9月にはTommy Dorsey楽団も「Boogie Woogie」を録音していた)。企画したジョン・ハモンドは、黒人音楽の系譜を由緒ある演奏会場で提示するという意図のもと、アルバート・アモンズ、ミード・ラックス・ルイス、ピート・ジョンソンの3人を並べて演奏させた。酒場の音楽が権威ある舞台に上がったことで報道が過熱し、以後数年にわたる全国的な流行が起きる。3人はその後、全米初とされる人種混合クラブのカフェ・ソサエティ(1938年12月開店)に出演を続けた。流行はやがて大衆娯楽に取り込まれ、1941年のアンドリューズ・シスターズによる『ブギ・ウギ・ビューグル・ボーイ』のように、白人向けの明るい流行歌として消費されていく。第二次大戦後には左手の型がそのままリズム・アンド・ブルースに引き継がれ、さらに高速化されてジェリー・リー・ルイスやリトル・リチャードのロックンロールのピアノになった。ギターに移植された型はチャック・ベリーの伴奏となり、ロック全般の基本の弾き方として今も残っている。</p>
<h2>代表曲</h2><ul><li>Honky Tonk Train Blues (Meade Lux Lewis)</li><li>Roll 'Em Pete (Pete Johnson &amp; Big Joe Turner)</li><li>Boogie Woogie Stomp (Albert Ammons)</li><li>Two-Fisted Mama (Katie Webster)</li><li>Death Ray Boogie (Pete Johnson)</li><li>Yancey Special (Meade Lux Lewis)</li><li>The Dirty Dozen (Speckled Red)</li><li>Swanee River Hop (Fats Domino)</li><li>Dupree Shake Dance (Champion Jack Dupree)</li><li>Pinetop's Boogie Woogie (Pinetop Smith)</li><li>Down the Road Apiece (Amos Milburn)</li><li>Shout for Joy (Albert Ammons)</li></ul>
