<h1>Boogie-Woogie（ブギウギ）とは</h1>
<p>ピアノの左手が一小節に八つの音を刻み続け、その上で右手が自由に動き回る様式である。この左手の型は一小節に八拍という意味でエイト・トゥ・ザ・バーと呼ばれ、低音を上下に往復させ続けることで、休みなく前進する推進力を生む。型にはいくつか</p>
<p>ピアノの左手が一小節に八つの音を刻み続け、その上で右手が自由に動き回る様式である。この左手の型は一小節に八拍という意味でエイト・トゥ・ザ・バーと呼ばれ、低音を上下に往復させ続けることで、休みなく前進する推進力を生む。型にはいくつかの定番があり、和音の構成音を順に上がって下りるもの、二音を交互に転がすロール、低音を単純に八分で連打するものなどがある。重要なのは、この左手が曲の最初から最後までほぼ一定に保たれる点で、演奏者は左手を自動化した状態で右手だけを別の脳で動かしている状態に近い。右手はブルーノートを含む短い決め文句を反復し、少しずつ変形させながら熱を上げていく。三連符を土台にした跳ねと、二対一の均等でない8分音符の配分が独特の推進感を作る。和音の枠は12小節形式がほとんどで、和音は三つしか使わない。速度は中庸から極端に速いものまであり、速い演奏では鍵盤全体を使ったグリッサンドや、同音の連打が見せ場になる。汽車の走行音や汽笛を模した表現が繰り返し現れるのも特徴で、低音の反復が車輪の回転に、右手の不協和な重音が汽笛に対応している。</p>
<h2>成り立ち</h2><p>発祥は十九世紀末から二十世紀初頭のテキサス東部、パイニー・ウッズと呼ばれる松林地帯の木材伐採キャンプである。鉄道の敷設現場や伐採地には労働者向けの酒場が付属し、そこに置かれた粗末なピアノで流しの弾き手が演奏した。労働者の多くが鉄道と関わっていたこと、そして移動手段が貨物列車だったことから、汽車の音を模倣する表現が様式に深く刻み込まれた。名称を決定づけたのはクラレンス・スミスで、パインタップの愛称で吹き込んだ1928年の『パインタップス・ブギ・ウギ』が広く売れ、演奏中に踊り手へ指示を出す語りごと様式の見本になった。彼は翌1929年、シカゴのダンスホールで起きた喧嘩の流れ弾を受けて27歳で死去している。全国的な流行は1938年12月23日、ニューヨークのカーネギー・ホールで開かれた演奏会『フロム・スピリチュアルズ・トゥ・スウィング』から始まった。企画したジョン・ハモンドは、黒人音楽の系譜を由緒ある演奏会場で提示するという意図のもと、アルバート・アモンズ、ミード・ラックス・ルイス、ピート・ジョンソンの三人を並べて演奏させた。酒場の音楽が権威ある舞台に上がったことで報道が過熱し、以後数年にわたる全国的な流行が起きる。三人はその後、ニューヨーク初の人種混合クラブであるカフェ・ソサエティに出演を続けた。流行はやがて大衆娯楽に取り込まれ、1941年のアンドリューズ・シスターズによる『ブギ・ウギ・ビューグル・ボーイ』のように、白人向けの明るい流行歌として消費されていく。第二次大戦後には左手の型がそのままリズム・アンド・ブルースに引き継がれ、さらに高速化されてジェリー・リー・ルイスやリトル・リチャードのロックンロールのピアノになった。ギターに移植された型はチャック・ベリーの伴奏となり、ロック全般の基本語法として今も残っている。</p>
