<h1>Garifuna Music（ガリフナ・ミュージック）とは</h1>
<p>中央アメリカのカリブ海沿岸に暮らすガリフナの人々の音楽全般を指す。単一の様式ではなく、用途によって明確に区別された複数の型の総体である。中心にあるのは常に太鼓で、低音を刻むセグンダと、高音で即興を担うプリメーロの二種類が対をなす。</p>
<p>中央アメリカのカリブ海沿岸に暮らすガリフナの人々の音楽全般を指す。単一の様式ではなく、用途によって明確に区別された複数の型の総体である。中心にあるのは常に太鼓で、低音を刻むセグンダと、高音で即興を担うプリメーロの二種類が対をなす。木をくり抜いた胴に皮を張り、素手で叩かれる。これに亀の甲羅、振り物、手拍子が加わる。用途による区分が厳格で、葬送や祖先との交流の儀礼で用いられる型、労働の際に歌われる型、祝祭で踊るための型がそれぞれ別の名前とリズムを持つ。とりわけ重要なのがドゥグと呼ばれる祖先供養の儀礼で、数日にわたって太鼓が鳴らされ、参加者が祖先の霊を迎える。パランダと呼ばれる型では、アコースティック・ギターが加わり、太鼓を抑えて歌詞を聴かせる。リズムは二拍の枠の内側を三つに割る感覚が同時に働く複合構造を持ち、この重なりが独特の揺れを生む。歌唱は多くの型で女性が中心を担い、一人が歌い出して他が応答する掛け合いの形を取る。言語はガリフナ語で、先住民のアラワク系の言語を基層に、カリブ系、アフリカ系、そしてフランス語と英語の語彙が層をなしている。</p>
<h2>成り立ち</h2><p>十七世紀、東カリブ海のセントビンセント島に、難破や逃亡によってアフリカ系の人々が到達し、島の先住民である島カリブ族と混交した。言語は先住民のものを、身体的特徴と一部の文化はアフリカ由来とする独特の集団が、こうして形成された。彼らは十八世紀を通じてイギリスの支配に武力で抵抗したが、指導者ジョセフ・シャトワイエの戦死を経て1796年に敗北する。翌1797年、イギリスは約5000人を船に乗せ、ホンジュラス沖のロアタン島へ強制的に移送した。輸送中の死亡率は高く、到着したのは二千数百人だったと記録されている。生き残った人々は中央アメリカ本土のカリブ海沿岸へ散り、現在のベリーズ、ホンジュラス、グアテマラ、ニカラグアに定住した。この強制移住は共同体の記憶の中心にあり、毎年11月19日にベリーズで祝われる入植記念日では、当時の上陸が船を用いて再現される。二十世紀を通じて、この文化は消滅の危機に直面した。国民国家の中で少数派として周縁化され、若い世代が都市部やアメリカ合衆国へ移住し、言語を話せない世代が増えたためである。この状況に対する応答として、1970年代後半から音楽を通じた文化復興の運動が起きた。ベリーズのペン・カヤタノが太鼓の型をエレキギターに移し替え、アンディ・パラシオがそれを発展させて若者に届く形を作った。パラシオは2007年に発表した作品で国際的な評価を得たが、翌2008年に47歳で急逝している。同じ潮流からアウレリオ・マルティネスが現れ、現在も国外での演奏を続けている。2001年、ガリフナの言語、舞踊、音楽は国際連合教育科学文化機関によって人類の口承及び無形遺産の傑作に宣言された。強制移住から200年を経て、音楽が民族の存続そのものを支える手段となっている例である。</p>
