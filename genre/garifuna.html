<h1>Garifuna Music（ガリフナ・ミュージック）とは</h1>
<p>ガリフナ音楽は、中央アメリカのカリブ海沿岸に暮らすガリフナの人々の音楽全般を指す。単一のスタイルではなく、用途によってはっきり区別された、複数の型をまとめた呼び名である。 多くの型で、中心は太鼓だ。基本は、低音を刻むセグンダと、高</p>
<p>ガリフナ音楽は、中央アメリカのカリブ海沿岸に暮らすガリフナの人々の音楽全般を指す。単一のスタイルではなく、用途によってはっきり区別された、複数の型をまとめた呼び名である。

多くの型で、中心は太鼓だ。基本は、低音を刻むセグンダと、高音で即興を担うプリメーロの対である。儀礼などでは、3つ目の太鼓を加えることもある。太鼓は木をくり抜いた胴に皮を張る。伝統編成は太鼓とマラカス（シシラ）である。亀の甲羅は近年（20世紀後半）に加わった。

用途による区分は厳しい。葬送や祖先との交流の儀礼で使う型、労働の時に歌う型、祝祭で踊るための型が、それぞれ別の名前とリズムを持つ。とりわけ重要なのがドゥグだ。祖先の霊を慰め、交信する治癒・供養の儀礼で、太鼓が重要な役割を果たす。パランダと呼ばれる型は、アコースティック・ギターと歌が中心だ。太鼓や振り物を伴うこともある（伴わない演奏もある）。

リズムは、2拍の枠の内側を三つに割る感覚が同時に働く、重なった構造を持つとされる。この重なりが、独特の揺れを生む。

歌は、儀礼歌などでは女性の声が前面に立つ。一人が歌い出し、ほかの人が応える掛け合いの形を取る。

言葉はガリフナ語だ。先住民のアラワク系の言語を土台に、カリブ系・フランス語・英語・スペイン語から借りた語を多く含む。アフリカ系の語はごくわずかである。</p>
<h2>成り立ち</h2><p>17世紀、東カリブ海のセントビンセント島に、難破や逃亡によってアフリカ系の人々がたどり着いた。彼らは島の先住民である島カリブ族と混ざり合った。アフリカ系の人々は、伝承では難破船の生存者、近年の研究では近隣諸島からの逃亡奴隷が主とされる。こうして、言語は先住民のもの、身体的特徴と一部の文化はアフリカ由来という、独特の集団が生まれた。

18世紀後半、彼らはイギリスの支配に武力で抵抗した。しかし指導者ジョセフ・シャトワイエが戦死し、1796年に敗北する。約4,300〜5,000人が、1796年7月〜1797年2月にバリアッソー島へ送られた。そのうち約半数が、飢餓と熱病（黄熱病やチフスとされる）などで亡くなった。

翌1797年、人々はホンジュラス沖のロアタン島へ強制的に移された。到着したのは約2,000〜2,500人(資料により幅がある)だった。生き残った人々は中央アメリカ本土のカリブ海沿岸へ散り、現在のベリーズ、ホンジュラス、グアテマラ、ニカラグアに住み着いた。

この強制移住は、共同体の記憶の中心にある。毎年11月19日にベリーズで祝われる入植記念日には、ベリーズ南部のダングリガへの到着が、丸木舟で再現される。到着年は1802年説、1823年（Beniの入植許可）、1832年説に分かれる。Alejo Beniは1832年の集団の指導者とされる。

一方、20世紀を通じて、この文化は消える危機に直面した。国民国家の中で少数派として隅に追いやられ、若い世代が都市部やアメリカ合衆国へ移住した。言語を話せない世代も増えた。

これに応えるように、1970年代後半から、音楽を通じて文化を復活させる運動が起きた。ベリーズのペン・カヤタノが、亀の甲羅と電気楽器を取り入れてプンタ・ロックを生み出したとされる。アンディ・パラシオがそれを発展させ、若者に届く形を作った。パラシオは2007年に発表した作品で国際的な評価を得たが、翌2008年に47歳で急逝している。ガリフナ文化の再評価の流れの中で、アウレリオ・マルティネスも現れたが、2025年に事故死した。

2001年、ガリフナの言語、舞踊、音楽は、国際連合教育科学文化機関によって人類の口承及び無形遺産の傑作に宣言された。強制移住から200年を経て、音楽が民族の存続そのものを支える手段となっている例である。</p>
