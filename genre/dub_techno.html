<h1>Dub Techno（ダブテクノ）とは</h1>
<p>ダブテクノは、テクノの繰り返しに、ダブの残響の処理を全面的に取り入れた音楽だ。 中心になるのは、コード・スタブと呼ばれる短い和音である。これに極端に長いディレイとリヴァーブをかけ、元の音が消えた後も、残響が波のように寄せては返す状</p>
<p>ダブテクノは、テクノの繰り返しに、ダブの残響の処理を全面的に取り入れた音楽だ。

中心になるのは、コード・スタブと呼ばれる短い和音である。これに極端に長いディレイとリヴァーブをかけ、元の音が消えた後も、残響が波のように寄せては返す状態を作る。この残響そのものが、旋律の代わりを務める。和声は、ただ一つのマイナーコードか、二つの和音の行き来だけで、数分間を持たせることが多い。

キックは四つ打ちだが、柔らかく丸められ、深く沈んで前に出すぎない。テンポはおおむね毎分110〜125拍前後だ。毎分120台後半〜130拍程度までとする見方もある。ハイハットは控えめで、しばしばローパスフィルターで高い音を削られ、霧の中の輪郭のように鳴る。ベースは長く続く低いうねりで、和音の根音を支えながら、ほとんど動かない。

音の全体には、多くの作品でノイズが敷かれている。テープのヒス、レコードの針音、アナログ機器の唸りが、わざと残される。この汚れが、音に奥行きと手触りを与える。

制作の要は、ミキシング卓の操作だ。演奏しながら各トラックのフェーダーを上げ下げし、ディレイのフィードバック量（音を繰り返し戻す量）を、つまみでその場で変えていく。こうして曲の展開が作られる。これは、ジャマイカのダブから受け継いだやり方である。

インストゥルメンタルが中心で、歌やはっきりした旋律を欠く作品が多い。その代わりに、残響の中で音が溶けていく過程を聴くこと自体が、この音楽の中身になる。静的で瞑想的だと評されることが多い。</p>
<h2>成り立ち</h2><p>1990年代前半のベルリンで、Moritz von OswaldとMark Ernestusという2人が、このスタイルを形づくった。

Ernestusは1989年に、レコード店Hard Waxを開いた。この店は、開店時は中古のソウル/ファンクとレゲエ/ダブが中心だった。だが、まもなくデトロイト・テクノなどの輸入盤が主力になった。2人は1990年代の初めに、一緒にレゲエを改めて聴き込み始めた。

2人は1993年から、Basic Channelという名義で、匿名に近い形で12インチ盤を出し始める。盤面の表記は最小限で、Basic Channelのロゴも、回を追うごとに読みにくく歪められていった。この匿名性は、個人の表現ではなく、音そのものを聴かせるという考えの表れとも解釈される。

彼らはさらに、1995年にレーベルChain Reactionを作り、1997年にはRhythm &amp; Soundという名義を始めた。前者は、より実験的な作り手に開かれた場だと評する人もいる。後者は、ジャマイカの歌手を迎え、より本来のダブ/レゲエに近い形で作品を作った名義だ。Rhythm &amp; Soundには、ジャマイカのベテラン歌手Cornel Campbell、Sugar Minott、ニューヨークのレーベルWackiesのLloyd Barnes(ジャマイカ生まれ)に結びつくThe Chosen Brothersらが参加した。こうして、ダブの本流とベルリンのテクノがつながった。

技術の面でも動きがあった。2人は1995年に、マスタリングとレコード盤の切削(カッティング)を行う会社、Dubplates &amp; Masteringを作った。実際の切削はエンジニアが担当した(Robert Henkeは1996〜98年にそこで働いた)。初期のBasic Channelの盤は、デトロイトで切削・製造されていた。

デトロイトの音楽からの影響も指摘されている。von Oswaldはデトロイトの音楽を好み、現地に友人もいた。デトロイトの先駆者としては、Juan Atkinsらが挙げられる。

1990年代後半には、Porter Ricks、Vainqueur、Monolake(Robert HenkeとGerhard Behles)がChain Reactionから作品を発表し、この系統の中心になった。Monolakeの2人は、自分たちのライヴ用ツールを土台に、Bernd Roggendorfと共に、1999年に音楽制作ソフトのAbletonを設立した。

2000年代には、Deepchord(アメリカのRod Modell)とEchospaceが、アメリカ側で流れを受け継ぎ、より濃密な霧のような音を追い求めた。ドイツではPole(Stefan Betke)が、1990年代後半から、壊れたWaldorfのフィルター機材が出す不規則なノイズを素材にした作品を発表している。

批判としては、Basic ChannelやDeepchordの作品から大きく踏み出していない、という指摘がある。それでも、Hard Waxは今もベルリンのレコード店として営業を続け、この音楽の精神的な中心地とされている。</p>
<h2>代表曲</h2><ul><li>Quadrant Dub (Basic Channel)</li><li>Liumin (DeepChord)</li><li>M04a (Maurizio)</li><li>Ship-Scope (Shinichi Atobe)</li><li>Lyot Rmx (Basic Channel)</li><li>Cyan (Monolake)</li><li>Butterfly Effect (Shinichi Atobe)</li><li>Phylyps Rmx (Basic Channel)</li><li>Ping (Monolake)</li><li>Night Transmission (DeepChord)</li><li>TRNS (Shinichi Atobe)</li><li>Dubtechno (Echospace)</li></ul>
