<h1>Dub Techno（ダブテクノ）とは</h1>
<p>テクノの反復にダブの残響処理を全面的に適用した系統。中核となるのはコード・スタブと呼ばれる短い和音で、これに極端に長いディレイとリヴァーブをかけ、原音が消えた後も残響が波のように寄せては返す状態を作る。この残響そのものが旋律の代わ</p>
<p>テクノの反復にダブの残響処理を全面的に適用した系統。中核となるのはコード・スタブと呼ばれる短い和音で、これに極端に長いディレイとリヴァーブをかけ、原音が消えた後も残響が波のように寄せては返す状態を作る。この残響そのものが旋律の代わりを務める。キックは四つ打ちだが柔らかく丸められ、深く沈んで前に出すぎない。テンポは118〜130BPM。ハイハットは控えめで、しばしばローパスフィルターで高域を削られ、霧の中の輪郭のように鳴る。ベースは持続的な低いうねりで、和音の根音を支えながらほとんど動かない。全体の音像には常にノイズが敷かれており、テープのヒス、レコードの針音、アナログ機器の唸りが意図的に残される。この汚れが音に奥行きと質感を与える。制作上の要点はミキシング卓の操作で、演奏中に各トラックのフェーダーを上げ下げし、ディレイのフィードバック量をつまみで実時間に変化させることで展開が作られる。これはジャマイカのダブから直接受け継いだ方法論である。和声は単一のマイナーコードか、二つの和音の往復だけで数分間を持たせることが多い。曲の長さは6分から10分以上。旋律も歌もない代わりに、残響の中で音が溶けていく過程を聴くこと自体が内容になる。テクノの中でも最も静的で、瞑想的な性格を持つ系統といえる。</p>
<h2>成り立ち</h2><p>1990年代前半のベルリンで、Moritz von OswaldとMark Ernestusという二人によって確立された。二人は1989年の壁崩壊後のベルリンで出会い、Ernestusは1989年にレコード店Hard Waxを開いていた。この店はデトロイトのテクノとジャマイカのダブのレコードを同じ棚に並べる場所であり、その並置自体が新しい音楽の発想源になった。二人はBasic Channelという名義で1993年から匿名に近い形で12インチを発表し始める。ジャケットには情報がほとんどなく、レーベル名と番号だけが刻まれていた。この匿名性は、個人の表現ではなく音そのものを聴かせるという思想の表明だった。彼らはさらにChain ReactionとRhythm &amp; Soundという別名義を作り分け、前者はより実験的な作家に開かれた場、後者はジャマイカの歌手を実際に招いてダブとテクノを直接結合させる場となった。Rhythm &amp; Soundではジャマイカのヴェテラン歌手Cornell Campbell、Sugar Minott、The Chosen Brothersらが参加し、ダブの本流とベルリンのテクノが実際に接続された。技術面では、二人はマスタリングとレコード盤の切削(カッティング)まで自ら行うDubplates &amp; Masteringという工房を運営し、音の質感を最終工程まで管理した。これがこの音楽の異常なまでの音質へのこだわりの背景にある。デトロイト側からの影響も明確で、とりわけJuan Atkinsの初期作品とUnderground Resistanceの音響が下敷きになっている。1990年代後半にはPorter Ricks、Vainqueur、Monolake(Robert HenkeとGerhard Behles、後にBehlesは音楽制作ソフトAbletonを創業する)がChain Reactionから作品を発表し、この系統の中核をなした。Monolakeの活動が音楽ソフトAbletonの誕生に直結したことは、この分野が技術開発にまで影響を及ぼした例として重要である。2000年代にはDeepchord(アメリカのRod Modell)とEchospaceがアメリカ側で継承し、より濃密な霧のような音を追求した。ドイツではPole(Stefan Betke)が、壊れたWaldorfのフィルター機材から出る不規則なノイズを素材にした作品を発表している。批判としては、Basic Channelの様式があまりに完成されていたため、後続の多くが模倣に留まったという指摘がある。現在もHard Waxはベルリンのレコード店として営業を続け、この音楽の精神的な中心地であり続けている。</p>
<h2>代表曲</h2><ul><li>Quadrant Dub (Basic Channel)</li><li>Radiance I (Vladislav Delay)</li><li>Liumin (DeepChord)</li><li>Ship-Scope (Shinichi Atobe)</li><li>Cyan (Monolake)</li></ul>
