<h1>Dub Techno（ダブテクノ）とは</h1>
<p>テクノの反復にダブの残響処理を全面的に適用した系統。中核となるのはコード・スタブと呼ばれる短い和音で、これに極端に長いディレイとリヴァーブをかけ、原音が消えた後も残響が波のように寄せては返す状態を作る。この残響そのものが旋律の代わ</p>
<p>テクノの反復にダブの残響処理を全面的に適用した系統。中核となるのはコード・スタブと呼ばれる短い和音で、これに極端に長いディレイとリヴァーブをかけ、原音が消えた後も残響が波のように寄せては返す状態を作る。この残響そのものが旋律の代わりを務める。キックは四つ打ちだが柔らかく丸められ、深く沈んで前に出すぎない。テンポはおおむね110〜130台のBPM。ハイハットは控えめで、しばしばローパスフィルターで高域を削られ、霧の中の輪郭のように鳴る。ベースは持続的な低いうねりで、和音の根音を支えながらほとんど動かない。全体の音像には常にノイズが敷かれており、テープのヒス、レコードの針音、アナログ機器の唸りが意図的に残される。この汚れが音に奥行きと質感を与える。制作上の要点はミキシング卓の操作で、演奏中に各トラックのフェーダーを上げ下げし、ディレイのフィードバック量（音を繰り返し戻す量）をつまみで実時間に変化させることで展開が作られる。これはジャマイカのダブから直接受け継いだ方法論である。和声は単一のマイナーコードか、二つの和音の往復だけで数分間を持たせることが多い。曲の長さは6分から10分以上。旋律も歌もない代わりに、残響の中で音が溶けていく過程を聴くこと自体が内容になる。テクノの中でも最も静的で、瞑想的な性格を持つ系統といえる。</p>
<h2>成り立ち</h2><p>1990年代前半のベルリンで、Moritz von OswaldとMark Ernestusという2人によって確立された。Ernestusは1989年にレコード店Hard Waxを開き、2人は1990年代の初めに一緒にレゲエを改めて聴き込み始めた。この店はデトロイトのテクノの作品を扱い、レゲエやダブの45回転盤の壁もあった。2人はBasic Channelという名義で1993年から匿名に近い形で12インチを発表し始める。ジャケットにはアーティスト名もアルバム名もレーベル名も書かれておらず、盤面にぼやけた文字でタイトルとアーティストが記されていた。この匿名性は、個人の表現ではなく音そのものを聴かせるという思想の表れとも解釈される。彼らはさらに、1995年にレーベルChain Reactionを設立し、1997年にはRhythm &amp; Soundという名義を始めた。前者はより実験的な作家に開かれた場、後者は歌手を迎えてダブとテクノを直接結合させる場となった。Rhythm &amp; Soundには、ジャマイカのヴェテラン歌手Cornel Campbell、Sugar Minott、ニューヨークのレーベルWackiesのLloyd Barnes(ジャマイカ生まれ)に結びつくThe Chosen Brothersらが参加し、ダブの本流とベルリンのテクノが接続された。技術面では、2人は1995年に、マスタリングとレコード盤の切削(カッティング)を行うDubplates &amp; Masteringという会社を設立した。実際の切削はエンジニアが担当し(Robert Henkeは1996〜98年にそこで働いた)、初期のBasic Channelの盤はデトロイトで切削・製造されていた。デトロイトの音楽からの影響も指摘され、von Oswaldはデトロイトの音楽を好み、現地に友人もいた。デトロイトの先駆者としては、Juan Atkinsらが挙げられる。1990年代後半にはPorter Ricks、Vainqueur、Monolake(Robert HenkeとGerhard Behles、後に2人はBernd Roggendorfとともに、音楽制作ソフトのAbletonを1999年に創業する)がChain Reactionから作品を発表し、この系統の中核をなした。Monolakeの活動が音楽ソフトAbletonの誕生に直結したことは、この分野が技術開発にまで影響を及ぼした例として重要である。2000年代にはDeepchord(アメリカのRod Modell)とEchospaceがアメリカ側で継承し、より濃密な霧のような音を追求した。ドイツではPole(Stefan Betke)が、1990年代後半から、壊れたWaldorfのフィルター機材から出る不規則なノイズを素材にした作品を発表している。批判としては、Basic Channelの様式があまりに完成されていたため、後続の多くが模倣に留まったという指摘がある。現在もHard Waxはベルリンのレコード店として営業を続け、この音楽の精神的な中心地であり続けている。</p>
