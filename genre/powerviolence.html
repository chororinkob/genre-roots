<h1>Powerviolence（パワーバイオレンス）とは</h1>
<p>ハードコア・パンクの短さと速さを極限まで推し進め、さらに構成の予測不可能性を武器とした音楽である。最大の特徴は速さが急に変わることで、猛烈な高速部分と、突然の完全な静止、そして極端に遅く重い区間が、何の前触れもなく数秒単位で切り替</p>
<p>ハードコア・パンクの短さと速さを極限まで推し進め、さらに構成の予測不可能性を武器とした音楽である。最大の特徴は速さが急に変わることで、猛烈な高速部分と、突然の完全な静止、そして極端に遅く重い区間が、何の前触れもなく数秒単位で切り替わる。この切り替えは、わざと理由なく入れられていて、聴き手は体の動きを合わせる余裕を与えられない。曲の多くは1分未満で、20秒に満たないものもある。ギターは音を歪ませた和音をかき鳴らすだけで、メロディーは作らず、しばしば調律も正確ではない。ベースは音の高さが分からなくなるほど歪まされ、低音のかたまりとして鳴る。ドラムは高速のツービートと、拍を数えられないほどの連打を行き来する。ヴォーカルは低い怒号と甲高い金切り声を複数人で分担し、同時に別の言葉を叫ぶことも多い。歌詞は数語から一行程度の断片で、厭世、薬物、都市問題、内輪ネタを扱うが、同時に露悪的な冗談も混ざる。録音はわざと粗く、聴きやすくする工夫はまったくされない。</p>
<h2>成り立ち</h2><p>1980年代のアメリカのハードコア・パンクは、1980年代半ばにはメタル寄りの重い方向へ進み、演奏も洗練されつつあった。この流れに逆らい、初期の粗く短い形へ回帰しようとする動きが、この分野につながった。先駆としてはマサチューセッツ州のSiege(1984年のデモ『Drop Dead』)がしばしば挙げられるが、当事者のEric Woodは「Siegeとの関係は聞いたことがない」と述べており、見方は割れている。型が固まったのは、1980年代末から1990年代初頭のカリフォルニア州である。1986年9月にカリフォルニア州ヴァレンシアで結成されたInfestは、極端に短い曲と重い区間を組み合わせた作風で原型を作り、Man Is the Bastardは、自作の電子楽器を用いた低音の轟音を持ち込んだ。中心的な存在となったのは、サンフランシスコ湾岸のレッドウッド・シティ(Redwood City)出身のSpazz、そして南カリフォルニアのNeanderthal(ポモナ、ヴァレンシア)やCrossed Out(エンシニタス)である。彼らはいずれも1,000〜2,000枚ほどの7インチのレコードを主な媒体とし、通信販売と手紙のやり取りで、仲間のつながりを保った。パワーヴァイオレンスという呼称は、1989年後半、Neanderthalの練習中にギタリストのMatt Dominoが口にしたのが始まりとされる。当初は「West Coast Power Violence」という形だった。その場にいたEric Wood本人も、Dominoの功績だと証言している。はっきりした定義のある運動ではない。日本からの影響も見逃せない。1983年に大阪で結成された S.O.B. やLip Creamといった日本のハードコアのバンドの影響は、資料で繰り返し挙げられている。同時期にイギリスやスウェーデンでも、極端に短く速い音楽が並行して生まれていた。この分野の担い手の多くは、Slap-a-Ham Recordsのような小さなレーベルから作品を出し、演奏の場は倉庫や住宅の地下室のほか、全年齢の客が入れるライブハウスの924 Gilman Streetにも及んだ。専門フェスのFiesta Grandeは、1993年から2000年まで毎年そこで開かれていた。菜食主義や動物の権利、反資本主義といった思想を掲げる者も多く、音楽と主張は切り離せないものだった。1990年代末から2000年前後にいったん下火になるが、2000年代以降、当時の7インチが高値で取引されるようになり、また新しい世代のバンドが世界各地で活動を始めている。グラインドコアは1980年代半ばから後半にかけて英国で先に成立しており、パワーヴァイオレンスはこれと並行して発展した。のちにはAgoraphobic Nosebleedなどのグラインドコアのバンドに影響を与えた。</p>
