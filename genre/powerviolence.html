<h1>Powerviolence（パワーバイオレンス）とは</h1>
<p>パワーヴァイオレンスは、ハードコア・パンクの短さと速さを限界まで突き詰め、さらに先の読めない曲の組み立てを武器にした音楽だ。 ギターは音を歪ませた和音をかき鳴らすだけで、メロディーは作らない。 ドラムは、高速のツービートと、拍を数</p>
<p>パワーヴァイオレンスは、ハードコア・パンクの短さと速さを限界まで突き詰め、さらに先の読めない曲の組み立てを武器にした音楽だ。

ギターは音を歪ませた和音をかき鳴らすだけで、メロディーは作らない。

ドラムは、高速のツービートと、拍を数えられないほどの連打を行き来する。

特徴の一つは、速さが急に変わることだ。猛烈に速い部分、突然の完全な静止、極端に遅く重い部分が、何の前触れもなく数秒単位で切り替わる。

ヴォーカルは、低い怒鳴り声と甲高い金切り声を複数人で分け合う。Spazzでは3人全員が歌っていた。

歌詞の題材はバンドごとに違い、アナーキズム、動物解放、階級的な怒り、風刺などがある。厭世、薬物、都市問題を扱うのは一部のバンドで、内輪ネタやわざと悪趣味な冗談も混ざる。

曲の多くは1分未満で、20秒に満たないものもある。録音はわざと粗く、聴きやすくする工夫はまったくされない。</p>
<h2>成り立ち</h2><p>1980年代のアメリカのハードコア・パンクは、1980年代後半になるとメタル寄りの重い方向へ進み、演奏も洗練されていった。この流れに逆らい、初期の粗く短い形へ戻ろうとする動きが、この分野につながった。

先駆けとしては、マサチューセッツ州のSiege(1984年のデモ『Drop Dead』)がしばしば挙げられる。呼び名がSiegeから来たという説について、当事者のEric Woodは「聞いたことがない」と述べた。

型が固まったのは、1980年代末から1990年代初めのカリフォルニア州である。1986年9月にカリフォルニア州ヴァレンシアで結成されたInfestは、初期の重要なバンドの一つとなった。Man Is the Bastardは、自作の電子楽器を使った低音の轟音を持ち込んだ。ほかに、この時期に活動したのは、サンフランシスコ湾岸のレッドウッド・シティ(Redwood City)出身のSpazz、そしてポモナとヴァレンシアで練習した南カリフォルニアのNeanderthalやCrossed Out(エンシニタス)である。

彼らの作品の多くは、数百〜数千枚規模の7インチで出された。

パワーヴァイオレンスという呼び名は、1989年後半、Neanderthalの練習中に、ギタリストのMatt Dominoが「power violence」と口にしたのが始まりとされる。彼らは「West Coast Power Violence」という形で、自分たちの音楽を指した。その場にいたEric Wood本人も、Matt Dominoの功績だと証言している。ただし、はっきりした定義のある運動ではない。

日本からの影響も見逃せない。1983年に大阪で結成されたS.O.B.や、1984年に東京で結成されたLip Creamといった日本のハードコアのバンドの影響は、繰り返し指摘されている。同じころイギリスでも、極端に短く速い音楽が並行して生まれていた。

この分野の担い手の多くは、Slap-a-Ham Recordsのような小さなレーベルから作品を出した。演奏の場は、倉庫や住宅の地下室のほか、全年齢の客が入れるライブハウスの924 Gilman Streetにも広がった。専門のフェスであるFiesta Grandeは、1993年に始まり、1990年代を通してそこで開かれた。一部のバンドは、動物解放や反軍国主義などを掲げた。

1990年代末から2000年前後に、この分野はいったん下火になる。現在は当時の7インチが高値で取引される例があり、また継承を名乗る動きもあるが、当事者は否定している。グラインドコアは1980年代半ばから後半にかけて英国で先に成立しており、パワーヴァイオレンスはこれと並行して発展した。のちには、Agoraphobic Nosebleedなどのグラインドコアのバンドに影響を与えた。</p>
