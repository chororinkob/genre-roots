<h1>Powerviolence（パワーバイオレンス）とは</h1>
<p>ハードコア・パンクの短さと速さを極限まで推し進め、さらに構成の予測不可能性を武器とした音楽である。最大の特徴は速度の激変で、毎分300打に迫る猛烈な高速部分と、突然の完全な静止、そして極端に遅く重い区間が、何の前触れもなく数秒単位</p>
<p>ハードコア・パンクの短さと速さを極限まで推し進め、さらに構成の予測不可能性を武器とした音楽である。最大の特徴は速度の激変で、毎分300打に迫る猛烈な高速部分と、突然の完全な静止、そして極端に遅く重い区間が、何の前触れもなく数秒単位で切り替わる。この切り替えは音楽的な必然性を持たないよう意図的に配置されており、聴き手は身体を合わせる暇を与えられない。曲は20秒から1分程度が標準で、10秒に満たないものも多く、一枚に30曲以上が収められる。ギターは歪ませた和音を掻き鳴らすが、旋律を作らず、しばしば調律も正確ではない。ベースは音程を失うほど歪まされ、低音の塊として機能する。ドラムは高速の二拍子と、拍を数えられない乱打を往復する。ヴォーカルは低い怒号と甲高い金切り声を複数人で分担し、同時に別の言葉を叫ぶことも多い。歌詞は数語から一行程度の断片で、社会への嫌悪、警察、宗教、労働、そして自己嫌悪を扱うが、同時に露悪的な冗談も混ざる。録音は意図的に粗く、聴きやすさへの配慮は一切なされない。</p>
<h2>成り立ち</h2><p>1980年代のアメリカのハードコア・パンクは、1980年代半ばにはメタル寄りの重い方向へ進み、演奏も洗練されつつあった。この流れに逆らい、初期の粗く短い形へ回帰しようとしたのが、この分野の出発点である。震源はカリフォルニア州である。1987年頃から活動したInfestは、極端に短い曲と重い区間を組み合わせた作風で原型を作り、Man Is the Bastardは、自作の楽器や日用品を用いた低音の轟音を持ち込んだ。決定的な存在となったのはロサンゼルスのSpazz、そしてサンフランシスコ湾岸のNeanderthalやCrossed Outである。彼らはいずれも数百枚規模の7インチのレコードを主な媒体とし、通信販売と手紙のやり取りによって共同体を維持した。パワーヴァイオレンスという呼称自体は、Man Is the BastardのEric Woodが半ば冗談として使ったものとされ、明確な定義を伴う運動ではない。日本の影響も無視できない。1980年代初頭から活動する S.O.B. や、極端に短い曲を作ったGaugeといった日本のバンドの音源が、アメリカ側の作り手に強い衝撃を与えたことは繰り返し証言されている。同時期にイギリスやスウェーデンでも、極端に短く速い音楽が並行して生まれていた。この分野の担い手の多くは、大手のレコード会社と関わることを拒み、演奏の場も倉庫や住宅の地下室に限られた。菜食主義や動物の権利、反資本主義といった思想を掲げる者も多く、音楽は主張と不可分だった。1990年代半ばには一度収束するが、2000年代以降、当時の7インチが高値で取引されるようになり、また新しい世代のバンドが世界各地で活動を始めている。極端に短い曲という形式は、後のグラインドコア、デスコア、そして現代のハードコアに広く受け継がれている。</p>
<h2>代表曲</h2><ul><li>Sick-O (Infest)</li><li>Skull Crusher (Man Is the Bastard)</li><li>Practiced Hatred (Crossed Out)</li><li>Youth Attack (Charles Bronson)</li><li>Fear and Loathing (Despise You)</li></ul>
