<h1>Funaná（フナナー）とは</h1>
<p>カーボヴェルデのサンティアゴ島に伝わる、最も伝統的な形では二つの楽器だけで演奏される速い舞踊音楽である。使われるのはガイタと呼ばれる蛇腹式の手風琴と、フェリーニョと呼ばれる鉄の棒だけで、電化後は編成が変わっている。フェリーニョは長</p>
<p>カーボヴェルデのサンティアゴ島に伝わる、最も伝統的な形では二つの楽器だけで演奏される速い舞踊音楽である。使われるのはガイタと呼ばれる蛇腹式の手風琴と、フェリーニョと呼ばれる鉄の棒だけで、電化後は編成が変わっている。フェリーニョは長さ約90センチの鉄の棒(山形鋼)で、演奏者は棒を垂直に立て、下端を片手のてのひらに、上端を肩にもたれさせ、もう一方の手で金属片をこすって音を出す。初期には畑の鍬が転用された。この、金属をこする乾いた高い音がリズムの骨格を担う。手風琴は和音と旋律を同時に受け持ち、右手で旋律を、左手のボタンで低音と和音を刻む。この二つだけで、打楽器も低音楽器も旋律楽器もすべて賄うという極度に切り詰めた編成が最大の特徴である。テンポは速く、リズムは拍の裏を強く押し出す跳ねた型を取る。この推進力によって踊り手は腰を細かく振り続ける。和声は単純で、二つか三つの和音を延々と往復する構造が基本である。歌唱は張りのある声で、複数人による応答が入る。歌詞はカーボヴェルデ・クレオール語で、農村の日常、恋愛、貧困、そして支配への不満を扱う。抑制された優雅さを重んじるモルナ（同じ国の別の伝統音楽）とは正反対の、荒々しく直接的な性格を持つ。</p>
<h2>成り立ち</h2><p>この音楽が生まれたのはカーボヴェルデ最大の島サンティアゴの内陸農村部である。この国の他の島が混血の色彩を強く持つのに対し、サンティアゴ島の内陸はアフリカ大陸から連れてこられた人々の子孫の割合が高く、逃亡奴隷が山間部に築いた共同体の伝統が色濃く残っていた。フナナーはその共同体の音楽であり、成立は19世紀後半から20世紀初頭とされる。名称の由来には諸説あり、ガイタとフェリーニョの2人の名手、FunaとNanaの名から来たという説や、ポルトガル語のfungagáに由来するという説がある。名称自体は新しく、1960〜70年代ごろからとされる。植民地時代を通じて、ポルトガル当局とカーボヴェルデの都市部の知識層は、この音楽を蔑視した。腰を密着させて激しく踊る様式が野蛮で下品だと見なされ、また農村の黒人文化と結びついていたためである。都市の上流階層はモルナを洗練された自分たちの音楽とし、フナナーを未開の遺物として区別した。教会も踊りの猥雑さを理由に禁圧した。実際、公の場での演奏は長く制限され、農村の祭りや私的な集まりの中で細々と受け継がれる状態が続いた。1975年の独立後、新政権の文化政策のもとで、それまで抑圧されてきたフナナーの再評価が始まった。ただし独立直後の復興の試みは成功せず、フナナーが全国的なジャンルとして定着したのは、1980年代にバンド、ブリムンドが台頭してからである。ブリムンドは1978年に結成され、1980年にプライアの聴衆の前に登場し、手風琴の役割を電気楽器に置き換えて、都市のダンス音楽として作り直した。同時期の担い手には、ブリムンドから分かれたFinaçonやTulipa Negraがある。1990年代後半には、アコーディオンとフェリーニョによる伝統的な形への回帰が起き(Ferro Gaitaなど)、2010年前後には電子・デジタル技術を使う新しい演者が現れた。90〜2000年代には、ズークやスークース（ほかの地域のダンス音楽）など他のダンスのリズムとも混ざった。かつて蔑視された音楽が国の顔になるという逆転を、一世代のうちに経験した例である。</p>
