<h1>Funaná（フナナー）とは</h1>
<p>カーボヴェルデのサンティアゴ島に伝わる、二つの楽器だけで演奏される速い舞踊音楽である。使われるのはガイタと呼ばれる蛇腹式の手風琴と、フェリーニョと呼ばれる鉄の棒だけである。フェリーニョは車の板ばねなどを転用した長さ一メートルほどの</p>
<p>カーボヴェルデのサンティアゴ島に伝わる、二つの楽器だけで演奏される速い舞踊音楽である。使われるのはガイタと呼ばれる蛇腹式の手風琴と、フェリーニョと呼ばれる鉄の棒だけである。フェリーニョは車の板ばねなどを転用した長さ一メートルほどの鉄の棒で、演奏者はこれを片手で持ち、もう一方の手に握ったナイフや金属片でこすって音を出す。この、金属をこする乾いた高い音がリズムの骨格を担う。手風琴は和音と旋律を同時に受け持ち、右手で旋律を、左手のボタンで低音と和音を刻む。この二つだけで、打楽器も低音楽器も旋律楽器もすべて賄うという極度に切り詰めた編成が最大の特徴である。テンポは速く、リズムは拍の裏を強く押し出す跳ねた型を取る。この推進力によって踊り手は腰を細かく振り続ける。和声は単純で、二つか三つの和音を延々と往復する構造が基本である。歌唱は張りのある声で、複数人による応答が入る。歌詞はカーボヴェルデ・クレオール語で、農村の日常、恋愛、貧困、そして支配への不満を扱う。抑制された優雅さを重んじるモルナとは正反対の、荒々しく直接的な性格を持つ。</p>
<h2>成り立ち</h2><p>この音楽が生まれたのはカーボヴェルデ最大の島サンティアゴの内陸農村部である。この国の他の島が混血の色彩を強く持つのに対し、サンティアゴ島の内陸はアフリカ大陸から連れてこられた人々の子孫の割合が高く、逃亡奴隷が山間部に築いた共同体の伝統が色濃く残っていた。フナナーはその共同体の音楽であり、成立は十九世紀後半から二十世紀初頭とされる。名称の由来には諸説あり、フナとナナという男女の名から来たという説が語られている。植民地時代を通じて、ポルトガル当局とカーボヴェルデの都市部の知識層は、この音楽を蔑視した。腰を密着させて激しく踊る様式が野蛮で下品だと見なされ、また農村の黒人文化と結びついていたためである。都市の上流階層はモルナを洗練された自分たちの音楽とし、フナナーを未開の遺物として区別した。教会も踊りの猥雑さを理由に禁圧した。実際、公の場での演奏は長く制限され、農村の祭りや私的な集まりの中で細々と受け継がれる状態が続いた。1975年の独立が状況を一変させる。新政権はアフリカ的な出自を国民文化の中心に据える方針を取り、それまで抑圧されてきたフナナーが逆に国の象徴として持ち上げられた。この転換を音楽面で担ったのがバンド、ブレイクンで、彼らは1980年代に手風琴と鉄の棒の音を電気楽器で再現し、都市のダンス音楽として作り直した。これによってフナナーは農村の伝統から全国的な流行音楽へ移行する。同時期にはフェレンボンやオルケストラ・シンボワといった集団も活動した。1990年代以降は電子楽器を全面的に用いた形が主流となり、コラデイラと融合した派生も生まれている。かつて蔑視された音楽が国の顔になるという逆転を、一世代のうちに経験した例である。</p>
