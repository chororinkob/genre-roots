<h1>Funaná（フナナー）とは</h1>
<p>フナナーは、カーボヴェルデのサンティアゴ島に伝わる、速い踊りの音楽だ。最も伝統的な形では、二つの楽器だけで演奏される。 使うのは、ガイタと呼ばれる蛇腹式の手風琴と、フェリーニョと呼ばれる鉄の棒だけだ。電化してからは、編成が変わって</p>
<p>フナナーは、カーボヴェルデのサンティアゴ島に伝わる、速い踊りの音楽だ。最も伝統的な形では、二つの楽器だけで演奏される。

使うのは、ガイタと呼ばれる蛇腹式の手風琴と、フェリーニョと呼ばれる鉄の棒だけだ。電化してからは、編成が変わっている。

フェリーニョは、長さがふつう約90センチの鉄の棒(山形鋼)である。演奏者は棒を垂直に立て、下端を片手のてのひらに、上端を肩にもたせかける。そして、もう一方の手で金属片をこすって音を出す。初期には、畑の鍬が転用された。この、金属をこする乾いた高い音が、リズムの骨組みになる。

手風琴は、和音と旋律を同時に受け持つ。右手で旋律を弾き、左手のボタンで低音と和音を刻む。この二つだけで、打楽器も低音楽器も旋律楽器もすべてまかなう。極端に切り詰めたこの編成が、最大の特徴である。

使う音階はダイアトニック音階だけで、和声は比較的単純である。

テンポは、標準は速い。ただし速さは一定ではなく、緩やかな型もある。リズムは2拍子だ。この推進力で、踊り手は腰を細かく振り続ける。

歌詞はカーボヴェルデ・クレオール語で、農村の日常、恋愛、貧困、そして支配への不満を扱う。歌詞には比喩や諺が多く使われる。フナナーは、哀愁を帯び、都市のエリートに好まれたモルナ（同じ国の別の伝統音楽）とは正反対の、荒々しい性格を持つ。</p>
<h2>成り立ち</h2><p>フナナーが生まれたのは、カーボヴェルデ最大の島、サンティアゴの内陸の農村部だ。

この国のほかの島が混血の色合いを強く持つのに対し、サンティアゴ島の内陸は、アフリカ大陸から連れてこられた人々の子孫の割合が高かったとされる。逃亡奴隷が山あいに築いた共同体の伝統も、色濃く残っていたとされる。フナナーは、その共同体の音楽である。

成立は20世紀初頭とされる。アコーディオンが伝わったのは、19世紀末〜20世紀初頭ともいわれる。正確な起源には諸説ある。名前の由来にも諸説あり、ガイタとフェリーニョの2人の名手、FunaとNanáの名から来たという説や、ポルトガル語のfungagáから来たという説がある。名前そのものは新しく、1960〜70年代ごろからとされる。

20世紀の植民地期に、この音楽は当局と都市のエリート・都市住民から見下され、教会の支持も受けて抑えつけられた。腰を密着させて激しく踊るスタイルが野蛮で下品だと見なされ、さらに農村の黒人文化と結びついていたためである。都市の上流階層は、モルナを洗練された自分たちの音楽とし、フナナーを未開の遺物として区別した。教会も、踊りがみだらだとして禁じた。実際、公の場での演奏は長く制限された。フナナーは、農村の祭りや私的な集まりの中で、細々と受け継がれていった。

1975年の独立後、それまで抑えつけられてきたフナナーを復興させる試みがあった。ただし、フナナーが全国的なジャンルとして定着したのは、1980年代にバンドのブリムンドが人気を集めてからである。

ブリムンドは1978年に結成され、1980年にプライアの聴衆の前に登場した。手風琴の役割を電気楽器に置き換え、都市のダンス音楽として作り直した。同じ時期の担い手には、ブリムンドから分かれたFinaçonと、リスボンを拠点にブリムンドの曲も取り上げたTulipa Negraがある。

1990年代後半には、ガイタとフェリーニョを前面に戻しつつ、ベース・ギター・ドラムを加えた編成が現れた(Ferro Gaitaなど)。90〜2000年代には、ズークやスークース（ほかの地域のダンス音楽）など、ほかのダンスのリズムとも混ざった。2010年前後には、電子・デジタル技術を使う新しい演者が現れた。

かつて見下された音楽が、一世代のうちに国の顔になる。フナナーは、そんな逆転を経験した例である。</p>
