<h1>Golden Age Hip Hop（ゴールデンエイジヒップホップ）とは</h1>
<p>1986年頃から93年頃にかけての、ヒップホップの表現手法が一気に多様化した時期の様式。制作の核はサンプリングで、ジャズ、ソウル、ファンク、ロック、映画音楽から抜き出した無数の断片を重ね、一曲に数十のサンプルが積み上げられることも</p>
<p>1986年頃から93年頃にかけての、ヒップホップの表現手法が一気に多様化した時期の様式。制作の核はサンプリングで、ジャズ、ソウル、ファンク、ロック、映画音楽から抜き出した無数の断片を重ね、一曲に数十のサンプルが積み上げられることもあった。権利処理の慣行がまだ確立していなかったため、この時期にしかできない密度の音づくりが行われている。ドラムはサンプラーで組まれ、テンポは毎分90から110拍程度が中心だが、跳ねた16分音符のスウィングを加えるものも多い。ベースはウッドベースの断片やシンセの低音で支えられ、上物にはホーンの刺しやローズピアノ、スクラッチが並ぶ。ラップの技術がこの時期に飛躍し、行末で韻を踏むだけの単純な形から、行内で何度も韻を重ね、拍の頭を外して食い込ませる複雑な譜割りへと進化した。歌詞の幅も広がり、自慢や恋愛だけでなく、人種差別、警察の暴力、教育、アフリカへの回帰、犯罪の描写、そして政治的な主張まで扱われるようになった。同時にユーモアや言葉遊び、自伝的な内省も並立し、単一の様式ではなく複数の潮流が同時に咲いた点が、この時期を黄金期と呼ばせている。</p>
<h2>成り立ち</h2><p>転換点は1986年である。この年、Run-D.M.C.の『Raising Hell』が全米三位に達し、Aerosmithと共演した『Walk This Way』でヒップホップが白人市場に届いた。同じ年、Beastie Boysの『Licensed to Ill』がヒップホップとして初の全米一位を獲得し、これらを手がけたレーベルDef Jamと制作者Rick Rubin、経営者Russell Simmonsが業界の中心となった。翌1987年、Eric B. and Rakimの『Paid in Full』とBoogie Down Productionsの『Criminal Minded』が、それぞれラップの技術と街の現実の描写を一段引き上げた。1988年は特に重要な年で、Public Enemyの『It Takes a Nation of Millions to Hold Us Back』が、制作集団The Bomb Squadによる耳を刺す不協和な音の壁と、Chuck Dの政治的な演説で、音楽が武器になりうることを示した。同じ年にはN.W.A.の『Straight Outta Compton』がロサンゼルス南部の警察暴力を描き、連邦捜査局から抗議の書簡が届くという事態になった。EPMD、Big Daddy Kane、Slick Rick、De La Soul、A Tribe Called Quest、Jungle Brothersが続き、後者三組はNative Tonguesという緩やかな連合を作って、ジャズと平和主義を掲げた。テレビではMTVが1988年に専門番組『Yo! MTV Raps』を開始し、全米の郊外の若者に映像を届けた。しかしこの時代は法によって終わる。1991年、Biz Markieが無許可でGilbert O'Sullivanの曲を使った件で敗訴し、以後サンプリングには事前の許諾と高額の使用料が必要になった。密度の高い音づくりは経済的に不可能となり、制作の方向は大きく変わった。</p>
<h2>代表曲</h2><ul><li>Juicy（The Notorious B.I.G.）</li><li>Paid in Full (Eric B. &amp; Rakim)</li><li>Award Tour (A Tribe Called Quest)</li><li>Nuthin' but a 'G' Thang（Dr. Dre ft. Snoop Dogg）</li><li>The World Is Yours（Nas）</li></ul>
