<h1>Golden Age Hip Hop（ゴールデンエイジヒップホップ）とは</h1>
<p>ゴールデン・エイジ・ヒップホップは、1986年頃から90年代半ば（1993年とする説、1996〜97年とする説もある）にかけての、ヒップホップの表現手法が一気に多様化した時期のスタイルだ。 制作の中心はサンプリング（既存の録音の一</p>
<p>ゴールデン・エイジ・ヒップホップは、1986年頃から90年代半ば（1993年とする説、1996〜97年とする説もある）にかけての、ヒップホップの表現手法が一気に多様化した時期のスタイルだ。

制作の中心はサンプリング（既存の録音の一部を切り取って素材に使う手法）である。ジャズ、ソウル、ファンク、ロック、映画音楽から抜き出した無数の断片を重ね、一曲に数十のサンプルが積み上げられることもあった。権利処理（使う曲の持ち主に許可を取る手続き）はあったが、守られない例が多く、訴訟リスクも低く見られていた。そのため、この時期にしかできない密度の音づくりが行われている。

ドラムはサンプラーで組まれる。機材の特性によるスウィング感（拍を均等にせず、ゆれるように跳ねさせる乗り）が特徴とされる。ベースはウッドベースの断片やシンセの低音で支えられることが多い。上物には、ホーンの刺し（管楽器の短く鋭い一音）やローズピアノ、スクラッチ（レコードを手で擦って鳴らす音）が並ぶ。

ラップの技術は、この時期に飛躍した。行末で韻を踏むだけの単純な形から、行内で何度も韻を重ねる形へ進んだ。拍の頭を外して食い込ませる、複雑な譜割り（言葉をどの拍に当てはめるかの配置）も生まれた。

歌詞の幅も広がった。自慢や恋愛だけでなく、人種差別、警察の暴力、教育、アフリカへの立ち返り、犯罪の描写、そして政治的な主張まで扱われるようになった。同時にユーモアや言葉遊び、自伝的な内省も並び立っていた。単一のスタイルではなく、複数の流れが同時に花開いたことが、この時期の特徴として挙げられる。</p>
<h2>成り立ち</h2><p>転換点は1986年である。この年、Run-D.M.C.の『Raising Hell』が全米三位に達した。Aerosmithと共演した『Walk This Way』で、ヒップホップが白人市場に届いた。

同じ年、Beastie Boysの『Licensed to Ill』が発売され、翌1987年にヒップホップとして初の全米一位を獲得した。『Licensed to Ill』を出したレーベルDef Jamと、制作者Rick Rubin、経営者Russell Simmonsが、業界の中心となった。

翌1987年には、Eric B. and Rakimの『Paid in Full』と、Boogie Down Productionsの『Criminal Minded』が出た。それぞれラップの技術と、街の現実の描写を一段引き上げた。

1988年は特に重要な年だった。Public Enemyの『It Takes a Nation of Millions to Hold Us Back』が、制作集団The Bomb Squadによる耳を刺す不協和な音の壁と、Chuck Dの政治的な演説で、音楽が武器になりうることを示した。N.W.A.の『Straight Outta Compton』は、ロサンゼルス南部の警察暴力を描いた（公式の1989年1月25日を主とし、1988年説は別の資料にある）。1989年8月には、連邦捜査局から抗議の書簡が届くという事態になった。

EPMD、Big Daddy Kane、Slick Rick、De La Soul、A Tribe Called Quest、Jungle Brothersが続いた。後者三組は、Native Tonguesという緩やかな連合（仲間うちのゆるい集まり）を作った。前向きでアフロセントリックな歌詞と、ジャズの影響を受けたビート、多彩なサンプリングで知られた。テレビでは、MTVの専門番組『Yo! MTV Raps』の米国版が1988年に始まり、映像を届けた。

しかし1991年、Biz Markieが無許可でGilbert O'Sullivanの曲を使った件で敗訴した。この判決によって、許諾なしのサンプリングは著作権侵害になると明確になった。許諾を得た作品や無名な音源を使う作品が中心になり、費用は大きく上がった。当時のような密度の作品は、権利処理が難しくなり、制作の方向は大きく変わった。</p>
