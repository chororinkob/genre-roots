<h1>Swamp Rock（スワンプロック）とは</h1>
<p>アメリカ南部、とりわけルイジアナの湿地帯の空気を思わせるロックである。実際にその土地の出身であるかどうかは問われず、むしろ喚起される情景が様式を定義している。音の第一の特徴はギターの処理で、音量を周期的に揺らす効果と、金属のばねに</p>
<p>アメリカ南部、とりわけルイジアナの湿地帯の空気を思わせるロックである。実際にその土地の出身であるかどうかは問われず、むしろ喚起される情景が様式を定義している。音の第一の特徴はギターの処理で、音量を周期的に揺らす効果と、金属のばねによる残響装置が深くかけられる。この、揺れながら反響する音色が、湿った空気と水面の情景を作る。演奏は速さを競わず、遅めから中庸の速度で、同じ音型を粘り強く反復する。和声は短調のブルースが中心で、和音の数は少なく、時に一つの和音の上で数分が経過する。低音は太く沈み、ドラムは装飾を排して重く叩かれるか、ニューオーリンズ由来の跳ねた複雑な刻みを用いる。ここに電気オルガンや管楽器、時に打楽器が加わる。歌唱は喉を潰したしゃがれ声で、南部の訛りが強調される。ゴスペルに由来する叫びの技法も用いられる。歌詞は沼地、川、密造酒、呪術、貧困、そして法の外側で生きる者を扱い、しばしば不吉で幻想的な情景が描かれる。全体として、明るさより暗さ、都会的な洗練より土の匂いを選ぶという方向が一貫している。</p>
<h2>成り立ち</h2><p>この様式の前史として、1950年代のルイジアナに存在した音楽がある。ケイジャンやクレオールの家庭に育った10代の若者たちが、アメリカのリズム・アンド・ブルースを演奏し、緩やかな三連符の伴奏に切ない歌を乗せるという形を作っていた。これは地元では独自の名で呼ばれ、後の様式に情感の面で受け継がれている。ロックの分野でこの空気を確立したのは、意外にもルイジアナの出身ではない人物だった。カリフォルニア州で育ったJohn Fogertyは、Creedence Clearwater Revivalを率いて、沼地で生まれたと歌い、南部の川と情景を次々に描いたが、彼はその土地を訪れたこともなかった。この事実は、この様式が実在の地理ではなく想像された南部を扱っていることを端的に示している。より土着的な側からは、ルイジアナ出身のTony Joe Whiteが、極端に少ない音数と語りに近い歌唱によって、湿地の空気そのものを音にした。ニューオーリンズではDr. Johnが、1968年の作品において、この地に伝わる呪術的な信仰の世界を主題に据え、複数の打楽器と幻覚的な音響によって独自の世界を構築した。彼自身がこの都市の音楽家として長いキャリアを持ち、その知識に裏打ちされた作品だった。同じ都市のThe Metersは、跳ねた複雑なリズムによってこの地の躍動を提示している。録音の面では、アラバマ州の小さな町にあった録音所が重要な役割を果たした。そこでは白人の演奏者が黒人の歌手を支え、人種隔離が法として存在する時代に、南部特有の音を作り出していた。この様式が残したのは、地理的な正確さではなく、音によって場所の空気を作り出せるという発見であり、その手法は後の多くの音楽に応用されている。</p>
<h2>代表曲</h2><ul><li>Born on the Bayou (Creedence Clearwater Revival)</li><li>Polk Salad Annie (Tony Joe White)</li><li>Swamp Music (Lynyrd Skynyrd)</li></ul>
