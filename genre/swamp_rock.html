<h1>Swamp Rock（スワンプロック）とは</h1>
<p>スワンプ・ロックは、アメリカ南部、とりわけルイジアナの湿地帯の空気を思わせるロックだ。実際にその土地の出身かどうかは問われない。むしろ、音が呼び起こす情景が、このスタイルを形づくっている。 ギター音は低音寄りで、リバーブがかかって</p>
<p>スワンプ・ロックは、アメリカ南部、とりわけルイジアナの湿地帯の空気を思わせるロックだ。実際にその土地の出身かどうかは問われない。むしろ、音が呼び起こす情景が、このスタイルを形づくっている。

ギター音は低音寄りで、リバーブがかかっているのが特徴だ。ワウやファズ、アンプのトレモロなども使われる。この揺れながら響く音色が、湿った空気と水面の情景を作る。そこに電気オルガンや管楽器、時には打楽器も加わる。

和音は、ブルースやカントリー、ソウル、ファンクなどから来た少ない数の和音が中心だ。時には、一つの和音のまま数分が過ぎることもある。

演奏は速さを競わない。遅めから中くらいのテンポで、同じ音の形を粘り強く繰り返す。低音は太く沈む。ドラムは飾りを省いて重く叩くか、ニューオーリンズから来た、跳ねた複雑なリズムを刻む。

歌い方には幅がある。しゃがれた声(Fogerty)から、低く語るようなバリトン(White)まで様々で、南部の訛りが強調される。ゴスペルの影響も指摘される。

歌詞が扱うのは、沼地、川、密造酒、呪術、貧困、そして法の外で生きる者たちだ。不吉で幻想的な情景が描かれることも多い。全体を通して、明るさより暗さ、都会的な洗練より土の匂いを選ぶ方向が一貫している。</p>
<h2>成り立ち</h2><p>1950年代のルイジアナには、ある音楽があった。ケイジャンやクレオールの家庭に育った10代の若者たちが、アメリカのリズム・アンド・ブルースを演奏していた。ゆったりした三連符の伴奏に、切ない歌を乗せる形である。この音楽は、後に「スワンプ・ポップ」と名付けられた。名前は似ているが、スワンプ・ポップは別系統のジャンルである。

一方、ロックの世界でこの空気を広めた代表的な存在は、意外にもルイジアナ出身ではなかった。カリフォルニア州で育ったJohn Fogertyだ。彼はCreedence Clearwater Revivalを率いて、沼地で生まれたと歌い、南部の川や情景を次々に描いた。しかし曲を書いた時点で、彼はその土地にほとんど行ったことがなかった。このことは、このスタイルが実在の地理ではなく、想像の中の南部を扱っていることをよく示している。

その土地に深く根ざした側からは、ルイジアナ出身のTony Joe Whiteが現れる。このスタイルの発明者と評されることもある人物だ。彼はワウとファズを使った歪んだギターと、低く語るような歌い方で、南部の情景を描いた。

ニューオーリンズ出身のDr. Johnは、1967年にロサンゼルスのGold Star Studiosで録音し、1968年1月に作品を発売した。その作品では、この地に伝わる呪術的な信仰の世界をテーマに据え、複数の打楽器と幻覚的な音響で独自の世界を作り上げた。彼自身もこの都市の音楽家として長いキャリアを持ち、その知識が作品を支えていた。同じニューオーリンズのThe Metersは、跳ねた複雑なリズムで、この地の躍動を示している。

録音の面では、元FAME（マッスル・ショールズ）出身でナッシュビルに移っていたDavid Briggs、Norbert Putnam、Jerry Carriganが、Tony Joe Whiteのデビュー作に参加した。マッスル・ショールズ・サウンドとスワンパーズがWhiteと組んだのは、1972年のThe Train I'm Onだ。そこでは白人演奏者が黒人歌手を支え、南部ならではの音を作り出していた。

このスタイルが残したのは、地理的な正確さではない。音によって場所の空気を作り出せる、という発見である。その手法は、後の多くの音楽に生かされている。</p>
<h2>代表曲</h2><ul><li>Born on the Bayou (Creedence Clearwater Revival)</li><li>Bootleg (Creedence Clearwater Revival)</li><li>Polk Salad Annie (Tony Joe White)</li><li>Right Place Wrong Time (Dr. John)</li><li>Green River (Creedence Clearwater Revival)</li><li>Run Through the Jungle (Creedence Clearwater Revival)</li><li>Swamp Music (Lynyrd Skynyrd)</li><li>Dixie Chicken (Little Feat)</li><li>Up Around the Bend (Creedence Clearwater Revival)</li><li>Soul Francisco (Tony Joe White)</li><li>Rainy Night in Georgia (Tony Joe White)</li><li>Willie and Laura Mae Jones (Tony Joe White)</li></ul>
