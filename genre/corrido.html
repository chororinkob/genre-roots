<h1>Corrido（コリード）とは</h1>
<p>メキシコで発達した物語の歌である。音楽的な形式は驚くほど単純で、2拍子のポルカか3拍子のワルツを基調とし、三つか四つの和音を循環させる短い旋律を、歌詞の節の数だけ繰り返す。伴奏は手風琴とバホ・セストの編成、あるいは金管を伴う大編成</p>
<p>メキシコで発達した物語の歌である。音楽的な形式は驚くほど単純で、2拍子のポルカか3拍子のワルツを基調とし、三つか四つの和音を循環させる短い旋律を、歌詞の節の数だけ繰り返す。伴奏は手風琴とバホ・セストの編成、あるいは金管を伴う大編成の楽団、時にギター一本と、地域や時代によって変わるが、いずれも歌詞を邪魔しないよう控えめに演奏される。この音楽の本体は完全に言葉の側にある。歌詞には厳格な型があり、一節は八音節の四行で構成され、冒頭では歌い手が聴衆に語ることの許しを乞い、続いて事件の日付、場所、登場人物の名が具体的に提示される。物語が展開した後、末尾では別れの挨拶が述べられて締めくくられる。この定型は口承で伝えるための記憶術でもある。扱われるのは実在の出来事で、英雄の武勇、権力への抵抗、悲劇的な死、そして裏切りが中心となる。主人公はしばしば法の外側に立つ者であり、聴き手は彼らを道徳的に裁くのではなく、その運命を共有する。歌唱は力強く、感情を込めすぎず、事実を報告するような口調が選ばれる点も、この形式の性格をよく表している。</p>
<h2>成り立ち</h2><p>起源はスペインから伝わった中世の物語歌にあるが、メキシコ独自の形として確立したのは19世紀後半の国境地帯である。1848年の戦争によってメキシコは領土の約半分をアメリカへ失い、そこに住んでいた人々は、一夜にして自国の土地で外国人となった。この地帯では、土地を奪われ、言葉の通じない司法によって裁かれる人々の経験が、歌として蓄積されていく。1901年に実際に起きた事件を歌った楽曲は、誤解によって保安官を撃った農夫が、数百人の追手から逃げ延びる物語であり、後に研究者Américo Paredesによって詳細に分析され、この形式が抵抗の文学であることが明らかにされた。1910年に始まったメキシコ革命は、この形式の黄金期をもたらす。識字率が低く新聞の届かない農村において、Pancho VillaやEmiliano Zapataの動向、戦闘の顛末、そして従軍した女性たちの姿は、全てこの歌によって伝えられた。当時作られた楽曲の一部は、現在も国民的な愛唱歌として歌われている。20世紀後半、この形式は新しい主題を得た。1970年代以降、麻薬の密輸を題材とする一群が現れ、Los Tigres del Norteの成功によって商業的な規模を持つに至る。1980年代末にはChalino Sánchezが、依頼を受けて実在の人物を讃える歌を作るという古い慣習を復活させ、荒削りな歌声で熱狂的な支持を集めたが、1992年、公演の翌日に遺体で発見された。事件は未解決である。彼の死は伝説を生み、この分野を爆発的に拡大させた。近年では、若い世代がヒップホップやトラップの要素を持ち込んだ形態が世界的な流行となっている。一方で、犯罪組織を美化するとして複数の州で公共の場での演奏が禁じられており、表現の自由と暴力の称揚をめぐる論争は現在も続いている。</p>
