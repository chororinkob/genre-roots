<h1>Corrido（コリード）とは</h1>
<p>コリードは、メキシコで発達した物語の歌である。 伴奏は、地域や時代によって変わる。手風琴とバホ・セストの組み合わせ、金管を伴う大編成の楽団、時にはギター1本ということもある。編成によって、伴奏の役割も異なる。ノルテーニョ形式では伴</p>
<p>コリードは、メキシコで発達した物語の歌である。

伴奏は、地域や時代によって変わる。手風琴とバホ・セストの組み合わせ、金管を伴う大編成の楽団、時にはギター1本ということもある。編成によって、伴奏の役割も異なる。ノルテーニョ形式では伴奏が歌を支える一方、バンダ形式には金管が前に出る力強い編成もある。

音楽の形は、驚くほど単純だ。単純な和声（I–IV–Vなどの少数の和音）による、音域の狭い短いメロディーを、歌詞の節の数だけ繰り返す。リズムは、速いワルツ、ポルカ、行進曲調などが土台になる。

歌は、狭い音域のため、声を張って歌う。

この音楽の中心は、完全に言葉の側にある。コリードは口承の伝統の中で伝えられ、報道のような文体を持つ。扱うのは多くが実在の出来事だが、作り手が創作した作り話もある。中心になるのは、英雄の武勇、権力への抵抗、悲劇的な死、そして裏切りだ。主人公は、しばしば法の外側に立つ者である。主人公を英雄として扱う曲が多い一方、教訓やメッセージを添える構成も典型とされる。

歌詞には決まった型がある。一節は8音節の四行でできている。冒頭では歌い手が聴き手に呼びかけ、続いて事件の日付、場所、登場人物の名前が具体的に示される。物語が進んだ後、最後は別れのあいさつで締めくくられる。ただし、すべての曲がこの型を備えるわけではない。現代のコリードは、型に従わないことも多い。</p>
<h2>成り立ち</h2><p>起源は、スペインから伝わった中世の物語歌にある。ただ、メキシコ独自の形として生まれた時期と場所には、学界で議論がある。国境地帯では、19世紀半ばから後半にかけて発達したとされる。

1846年から1848年にかけて、米墨戦争が起きた。その後、1848年の条約でメキシコは、カリフォルニア、ネバダ、ユタ、アリゾナの大半、ニューメキシコ、コロラドなどの一部にあたる土地を割譲した。これは、戦前の領土の約55%（約52.5万平方マイル）にあたる。テキサスはその前に併合されており、条約ではリオ・グランデが国境と確認された。

条約で、住民の多くは米国市民となった。しかし、財産権などの保護は十分に守られなかった。人々は土地を失い、敵意に満ちた環境に置かれた。この地帯では、土地を奪われ、言葉の通じない裁判で裁かれる人々の経験が、歌として積み重なっていく。

1901年に実際に起きた事件を歌った曲がある。誤訳がもとで誤解が生まれ、保安官がグレゴリオ・コルテスの弟を撃った。コルテスは撃ち返し、保安官を死なせた。その後、数百人規模の追手から約10日間逃れたが、1901年6月22日に捕らえられた。この物語は、後に研究者Américo Paredesが詳しく分析した。Paredesは、これを抵抗の文学として論じた。

1910年に始まったメキシコ革命は、この形式に黄金期をもたらした。識字率（文字を読める人の割合）が低く、新聞の情報も限られていた農村では、この歌が主な伝達手段の一つとなった。Pancho VillaやEmiliano Zapataの動き、戦いの成り行き、従軍した女性たちの姿が、歌で伝えられたのである。当時作られた曲の一部は、今も国民に愛される歌として歌われている。

20世紀後半、この形式は商業的な広がりを得た。研究者Juan Ramírez-Pimientaは、麻薬密輸を扱う最初期のコリードを1930年代と位置づけている。この一群は、1970年代にLos Tigres del Norteらの成功によって、商業的な規模を持つまでになった。

1980年代後半（1987年とされる）からは、Chalino Sánchezが、依頼を受けて実在の人物をたたえる歌を録音しはじめた。荒削りな歌声で熱狂的な支持を集めたが、1992年5月16日、公演の翌日に遺体で見つかった。事件は未解決である。死後、彼の人気は急上昇し、追悼曲や彼をまねる歌手が相次いだ。コリードやナルココリードに大きな影響を与えた、という見方がある。

近年では、若い世代がヒップホップやトラップ（ヒップホップの一種）の要素を持ち込んだ形が、世界的な流行となっている。一方で、犯罪組織を美化するとして、連邦レベルの禁止はないものの、10の州（および一部の市）が、公共の場での演奏や放送を禁止または制限している。表現の自由と、暴力をほめたたえることをめぐる論争は、今も続いている。</p>
