<h1>Symphonic Black Metal（シンフォニックブラックメタル）とは</h1>
<p>ブラックメタルの高速な演奏と絶叫に、管弦楽の編成を全面的に組み合わせた音楽だ。 用いられるのは、実際の交響楽団の場合もあれば、鍵盤楽器による模擬音の場合もある。音色は、弦楽や合唱、ピアノなどの鍵盤系が中心だ。木管や独奏楽器(ヴァイ</p>
<p>ブラックメタルの高速な演奏と絶叫に、管弦楽の編成を全面的に組み合わせた音楽だ。

用いられるのは、実際の交響楽団の場合もあれば、鍵盤楽器による模擬音の場合もある。音色は、弦楽や合唱、ピアノなどの鍵盤系が中心だ。木管や独奏楽器(ヴァイオリン等)を加える例もある。鍵盤・管弦楽は、ギターと並んで雰囲気や和声の厚みを作る。

ギターは、同じ音を高速で弾き返すトレモロ奏法を使う。和音を細かく震わせながら持続的な面を作り、管弦楽の下地となる。和声は、短調を基調とした劇的なものが使われる。荘厳さと不吉さを同時に演出する。

ドラムは、速いブラストビートで密度を稼ぐことが多い。

歌唱は、喉を絞った甲高い絶叫が中心だ。そこへ、清らかな女性の歌声や男声合唱が、対比として配置されることもある。いわゆる美女と野獣の構図が用いられる。

歌詞は神話、吸血鬼、中世を扱い、演劇的に語られる。</p>
<h2>成り立ち</h2><p>舞台は、1990年代前半のノルウェーだ。ここで固まった第二波のブラックメタルは、粗い録音と反商業的な姿勢を美徳としていた。

エクストリーム・メタルにおける先例として、管弦楽的な響きを持ち込む試みは、Emperor以前にも見られた。Celtic Frostの1987年の作品、Bulldozerの1988年の作品、Sighの1993年の作品などである。

その中でも、ノルウェーのEmperorは先駆的な影響を与えた存在とされる。1994年に発表した作品では、シンフォニックな鍵盤を重要な要素として取り入れた。ブラックメタルが叙事詩的な壮大さを持ちうることを示したのである。

ただし、このバンドの歴史は暗い。構成員のBård Guldvik Eithun(芸名ファウスト)が、1992年に同性愛者の男性を殺害した。また別の構成員も、教会放火に関与して服役している。ノルウェーのこの時期のシーンが、暴力事件や放火事件と結びついたという事実は、その音楽を語るうえで避けて通れない。

同じノルウェーのDimmu Borgirは、より映画音楽的な方向を推し進めた。2001年の作品で初めて実際の管弦楽を取り入れ、2003年にはプラハのオーケストラと録音した。ブラックメタルのバンドとして初めてノルウェーのアルバムチャートで1位を獲得したのは、2007年の『In Sorte Diaboli』である。彼らに対しては、商業化を批判する声がある。同時に、この音楽を世界的な規模へ広げた功績も大きい。

イギリスのCradle of Filthは、吸血鬼やゴシック文学、ホラー映画などを主題とし、女性ヴォーカルを採り入れた。彼らの挑発的な図柄の衣類は、各国で問題視された。実際に着用者が逮捕される事件も起きている。

並行して、スイスのSamaelやオーストリアのSummoningが、アトモスフェリック/インダストリアルの方向で独自の道を進んだ。2000年代以降、各地に同様のバンドが現れた。そこには、独自の作り手も現れている。</p>
