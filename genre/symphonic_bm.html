<h1>Symphonic Black Metal（シンフォニックブラックメタル）とは</h1>
<p>ブラックメタルの高速な演奏と絶叫に、管弦楽の編成を全面的に組み合わせた音楽である。用いられるのは実際の交響楽団の場合もあれば、鍵盤楽器による模擬音の場合もあるが、いずれにせよ弦楽、金管、木管、そして合唱団の響きが、演奏の主要な層と</p>
<p>ブラックメタルの高速な演奏と絶叫に、管弦楽の編成を全面的に組み合わせた音楽である。用いられるのは実際の交響楽団の場合もあれば、鍵盤楽器による模擬音の場合もあるが、いずれにせよ弦楽、金管、木管、そして合唱団の響きが、演奏の主要な層として扱われる。この管弦楽の部分は装飾ではなく、しばしばギターより主導的に旋律と和声を担う。ギターは全ての弦を高速で往復するトレモロ奏法によって、和音を細かく震わせながら持続的な面を作り、管弦楽の下地となる。ドラムは毎分200打を超えるブラストビートで密度を稼ぐ。和声は短調を基本としつつ、映画音楽の語法から借りた減七の和音や、半音階的に下降する重厚な進行が多用され、荘厳さと不吉さを同時に演出する。歌唱は喉を絞った甲高い絶叫が中心だが、そこへ清らかな女性の歌声や男声合唱が対比として配置される、いわゆる美女と野獣の構図が定型となっている。曲は6分から10分と長く、序曲や間奏曲が挟まれ、アルバム全体で一つの物語を語る構成が好まれる。歌詞は神話、吸血鬼、中世、宇宙的な絶望を扱い、演劇的に語られる。</p>
<h2>成り立ち</h2><p>1990年代前半のノルウェーで確立した第二波のブラックメタルは、粗い録音と反商業的な姿勢を美徳としていた。そこへ管弦楽という、最も豪奢で最も費用のかかる要素を持ち込むことは、当初は裏切りと見なされた。この転換を主導したのがノルウェーのEmperorである。1994年に発表した作品では、鍵盤楽器による荘厳な響きを全面に押し出し、ブラックメタルが叙事詩的な壮大さを持ちうることを示した。ただしこのバンドの歴史は暗い。構成員のBård Faustが1992年に同性愛者の男性を殺害し、また別の構成員も教会放火に関与して服役している。ノルウェーのこの時期のシーンが、実際の暴力と犯罪と不可分だったという事実は、その音楽を語るうえで避けて通れない。同じノルウェーのDimmu Borgirは、より映画音楽的な方向を推し進め、2001年以降は実際の交響楽団と合唱団を起用した録音を行い、この分野で最大の商業的成功を収めた。彼らに対しては、地下的な出自を捨てて大衆に迎合したという批判が絶えないが、同時にこの音楽を世界的な規模へ広げた功績も大きい。イギリスのCradle of Filthは、吸血鬼と19世紀の怪奇文学を主題に据え、絶叫と女性の歌声を対比させる構図を定型化した。彼らの挑発的な図柄の衣類は各国で問題視され、実際に着用者が逮捕される事件も起きている。並行して、スイスのSamaelやオーストリアのSummoningが、より重厚で緩やかな方向を示した。2000年代以降は制作技術の進歩により、鍵盤による模擬音の質が飛躍的に向上し、少人数でも管弦楽的な音を作れるようになった結果、この様式は世界中へ拡散する。フィンランドやロシア、南米にも独自の作り手が現れ、現在では最も大きな会場を満たすブラックメタルの形態となっている。</p>
