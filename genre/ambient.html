<h1>Ambient（アンビエント）とは</h1>
<p>積極的に聴くことも、聞き流すことも同時に許容するよう設計された音楽。前景に立って注意を独占するのではなく、空間の性質そのものを変える環境として機能することを目的とする。素材は持続音(ドローン)、緩やかに変化する和音の層、フィールド</p>
<p>積極的に聴くことも、聞き流すことも同時に許容するよう設計された音楽。前景に立って注意を独占するのではなく、空間の性質そのものを変える環境として機能することを目的とする。素材は持続音(ドローン)、緩やかに変化する和音の層、フィールド録音の環境音、テープの摩耗やヒスノイズといった質感で、明確な旋律や拍節は薄いか、まったく存在しない。制作技術ではリヴァーブとディレイが構造そのものを担い、短い音を長い残響に溶かして持続音に変える。テープループを異なる長さで同時に回して、循環周期が一致しないまま何十分も新しい組み合わせを生み続ける手法や、グラニュラー合成で音を微小な粒に分解して撒く手法も使われる。音色はアナログシンセのパッド、加工したピアノやギター、シンギングボウル、ハーモニウム、そして加工された人声など。ダイナミクスの幅は狭く保たれ、突然の大音量や不意打ちの展開を避けることで、注意を引きつけすぎないという設計原理を守る。曲の長さは数分から数時間まで幅広く、始点と終点が意味を持たない構造が多い。ニューエイジと似た音になることもあるが、アンビエントは癒しを保証せず、無機質さ、不穏さ、荒涼とした空虚も等しく扱う点が異なる。空港、美術館、寝室、作業机といった実際の場所と結びついた音楽として構想されてきた。</p>
<h2>成り立ち</h2><p>概念としての起源は1917年のフランスで、Erik Satieが提唱した「家具の音楽(musique d'ameublement)」に遡る。Satieは椅子や壁と同じく部屋の備品として存在し、誰も聴こうとしない音楽を構想し、実際に演奏会の休憩時間に楽団に演奏させたが、観客が着席して聴き入ってしまい、Satieは会場を走り回って「聴くな、喋れ」と叫んだという逸話が残る。20世紀半ばにはアメリカのMuzak Corporationが職場の生産性向上を目的とした背景音楽を産業化し、これが逆に軽蔑の対象ともなった。現在の意味でのアンビエントを定義したのはイギリスのBrian Enoで、1975年にロンドンで交通事故に遭って入院していた際、友人が置いていった18世紀ハープの音楽のレコードが、音量が極端に小さいまま雨音と混ざって聞こえた体験がきっかけになったと本人が語っている。Enoは1975年に「Discreet Music」を発表し、1978年の「Ambient 1: Music for Airports」でこのジャンル名を明示した。ケルン・ボン空港のために構想されたこの作品には、飛行機事故の恐怖を和らげ、死を受け入れられるような音楽をという意図があったとEnoは説明している。制作では長さの異なるテープループを同時に回し、周期が一致しないことで無限に新しい重なりが生じる仕組みを用いた。Enoはさらに1980年前後にHarold Buddとの共作や、ギタリストRobert Frippとの共同作業(フリッパートロニクスと呼ばれる2台のテープレコーダーによる遅延システム)で語彙を広げた。並行して、ドイツのKlaus Schulze、Tangerine Dream、Cluster、日本の吉村弘、芦川聡、細野晴臣が環境音楽として独自に発展させ、1980年代の日本では美術館や住宅展示場のための委嘱作品が多数作られた。1990年代にはレイヴ文化との接続が起き、The KLFの1990年「Chill Out」やThe Orbのダブ的な作品、Aphex Twinの1992年「Selected Ambient Works 85-92」がクラブの休憩室(チルアウトルーム)の音楽としてアンビエントを再定義した。同時期にBiosphere、Global Communication、Pete Namlookらが活動し、Enoの弟子筋にあたるJon Hassellは第四世界という概念で民族音楽と電子音を接続した。2000年代以降はTim HeckerやWilliam Basinski、Stars of the Lidが加わり、Basinskiの2001年「The Disintegration Loops」は劣化するテープをデジタル化する過程で音が崩壊していく作品で、完成した日が2001年9月11日だったことから追悼の作品として受け止められた。現在は作業用BGMや睡眠導入の需要とストリーミングによって、かつてないほど広い聴衆を得ている。</p>
<h2>代表曲</h2><ul><li>Music for Airports (Brian Eno)</li><li>Discreet Music (Brian Eno)</li><li>The Pearl (Harold Budd &amp; Brian Eno)</li><li>Chill Out (The KLF)</li><li>Selected Ambient Works 85-92 (Aphex Twin)</li></ul>
