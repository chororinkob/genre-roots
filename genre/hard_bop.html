<h1>Hard Bop（ハードバップ）とは</h1>
<p>1950年代半ばに確立した、ビバップの技巧的な語法に、ブルースとゴスペルの土臭さを取り戻したジャズである。編成は五人から六人の小編成が標準で、トランペットとテナーサックスが旋律を担い、ピアノ、コントラバス、ドラムが支える。曲の冒頭</p>
<p>1950年代半ばに確立した、ビバップの技巧的な語法に、ブルースとゴスペルの土臭さを取り戻したジャズである。編成は五人から六人の小編成が標準で、トランペットとテナーサックスが旋律を担い、ピアノ、コントラバス、ドラムが支える。曲の冒頭で提示される主題は、ビバップの複雑で細かい音の連なりとは対照的に、口ずさめるほど明快で力強いものが選ばれる。この覚えやすさは意識的な選択であり、聴き手を突き放さないという姿勢の表れである。和声には、ゴスペルに由来する下属音への傾きや、教会の合唱を思わせる響きが持ち込まれ、また短調とブルースの音階が多用される。リズム隊の役割が大きく、ドラムは単なる伴奏ではなく、シンバルで律動を刻みながら、小太鼓と大太鼓で絶えず合いの手を入れ、独奏者を煽り立てる。この、押し出す力の強いドラムがこの様式の推進力である。コントラバスは四拍を歩くように刻み、ピアノは和音を短く突き刺すように置く。テンポは中庸から速く、曲は5分から10分程度、独奏が順に回される。全体として、洗練と粗野、知性と身体性が同時に成立している点が特徴である。</p>
<h2>成り立ち</h2><p>1940年代後半に成立したビバップは、演奏技術と和声の複雑さを極限まで高めたが、その結果、踊れず、一般の聴き手には難解な音楽となっていた。1950年代前半には、その反動として、より静謐で抑制されたクール・ジャズが西海岸を中心に流行する。この二つの流れに対し、東海岸の黒人演奏者たちが打ち出したのがこの様式だった。彼らが取り戻そうとしたのは、教会と街路にある自分たちの音楽的な根であり、この選択には明確な文化的な自負が伴っていた。中心となったのがドラマーのArt Blakeyである。彼はピアニストのHorace Silverとともに1950年代半ばにJazz Messengersを結成し、以後30年以上にわたり、若い演奏者を集めては育て、独立させるという循環を続けた。この楽団を経た演奏者は数十人に及び、事実上のジャズの学校として機能した。Horace Silverは作曲家として、ゴスペルとラテン音楽の要素を取り込んだ数々の名曲を残している。トランペットのClifford Brownは、明るく輝かしい音色と完璧な構成力によって、この様式の理想を体現したが、1956年、演奏地へ向かう途中の自動車事故により25歳で死去した。この早すぎる死は、ジャズ史における最大の喪失のひとつとされる。Sonny RollinsやCannonball Adderleyがこの様式を豊かにし、Miles Davisも一時期この語法を用いた。制作の面で決定的だったのがBlue Note Recordsである。Alfred LionとFrancis Wolffという二人のドイツからの亡命者が運営したこのレーベルは、録音の前に報酬を払って稽古の時間を確保するという当時としては異例の方針を取り、演奏の質を高めた。録音技師Rudy Van Gelderの音作りと、Reid Milesによる革新的な装丁の設計も含め、このレーベルの作品群はこの時代の記録そのものとなっている。</p>
<h2>代表曲</h2><ul><li>Moanin' (Art Blakey and the Jazz Messengers)</li><li>Song for My Father (Horace Silver)</li><li>Walkin' (Miles Davis)</li><li>The Sidewinder (Lee Morgan)</li><li>Mercy, Mercy, Mercy (Cannonball Adderley)</li></ul>
