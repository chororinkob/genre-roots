<h1>Hard Bop（ハードバップ）とは</h1>

<p>ハード・バップは、1950年代半ばに定着したジャズだ。ビバップの高い技巧を受け継ぎながら、ブルースとゴスペルの土臭さを取り戻した。

編成は5人から6人の小編成が典型的だ。トランペットとサックス（テナー、アルトなど）が旋律を担い、ピアノ、コントラバス、ドラムが支える。

曲の冒頭では主題（曲の中心となる旋律）が示される。ビバップの複雑で細かい音の連なりとは対照的に、口ずさめるほど明快で力強いものが選ばれる。この覚えやすさは意識的な選択であり、聴き手を突き放さないという姿勢の表れである。和声（コードの響き）には、ゴスペルに由来する下属和音（IVの和音）の使用や変格終止、教会の合唱を思わせる響きが持ち込まれる。旋律の素材は、ブルース、ゴスペル、R&amp;Bから取られる。

リズム隊の役割は大きい。ドラムは単なる伴奏ではない。シンバルでリズムを刻みながら、小太鼓と大太鼓で絶えず合いの手を入れ、独奏者をあおり立てる。この押し出す力の強いドラムが、このスタイルを前へ進める力だと言われる。コントラバスは4拍を歩くように刻み、ピアノは和音を短く突き刺すように置く。

テンポは中くらいが好まれるが、速いものから遅いものまで幅がある。LP時代の録音では、数分から10分前後に及ぶ曲もある。演奏では独奏が順に回される。全体として、洗練と粗野、知性と身体性が同時に成り立っている点が特徴である。</p>
<h2>成り立ち</h2><p>1940年代前半から半ばに形づくられ、1946年頃までに定着したビバップは、演奏技術と和声の複雑さを高度に発展させた。しかしその結果、踊れず、一般の聴き手には難しい音楽になっていた。

一方、1940年代末のニューヨークでは、より静かで抑えめなクール・ジャズが生まれた。それが1950年代前半には、西海岸のジャズ（ウェスト・コースト・ジャズ）として広く流行した。ハード・バップは、一部の批評家にはクール・ジャズへの応答と見られている。中心は東海岸、とくにニューヨークだが、デトロイトなども初期の拠点だった。この流れの演奏者たちが取り戻そうとしたのは、教会と街路にある自分たちの音楽の根である。この選択には、はっきりした文化的な誇りが伴っていたとされる。

中心となったのは、ドラマーのArt Blakeyだ。彼はピアニストのHorace Silverとともに、1950年代半ば(1954〜55年ごろとする資料が多く、1953年とする説もある)にJazz Messengersを結成した。以後30年以上にわたり、若い演奏者を集めては育て、独立させることを繰り返した。この楽団を経た演奏者は150人を超え、事実上のジャズの学校として機能した。Horace Silverは作曲家として、ゴスペルとラテン音楽の要素を取り込んだ数々の名曲を残している。

トランペットのClifford Brownは、明るく輝かしい音色と完璧な構成力で、このスタイルの理想を形にした。だが1956年、演奏地へ向かう途中の自動車事故により、25歳で亡くなった。この早すぎる死は惜しまれた。その後もSonny RollinsやCannonball Adderleyがこのスタイルを豊かにし、Miles Davisも一時期この手法を用いた。

制作の面で決定的だったのは、Blue Note Recordsである。運営したのは、Alfred LionとFrancis Wolffという、ドイツからの2人の亡命者だ。このレーベルは録音の前に報酬を払い、稽古の時間を確保した。当時としては異例のこの方針が、演奏の質を高めた。録音技師Rudy Van Gelderの音作りと、Reid Milesによる革新的なジャケットのデザインも含め、このレーベルの作品群は、この時代の記録そのものとなっている。</p>
<h2>代表曲</h2><ul><li>Moanin' (Art Blakey and the Jazz Messengers)</li><li>Song for My Father (Horace Silver)</li><li>Blue Train (John Coltrane)</li><li>The Sidewinder (Lee Morgan)</li><li>Mercy, Mercy, Mercy (Cannonball Adderley)</li><li>Walkin' (Miles Davis)</li><li>Cool Struttin' (Sonny Clark)</li><li>Cornbread (Lee Morgan)</li><li>Blues March (Art Blakey and the Jazz Messengers)</li><li>Jeannine (Cannonball Adderley)</li><li>The Preacher (Horace Silver)</li><li>Blue 7 (Sonny Rollins)</li></ul>
