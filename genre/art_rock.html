<h1>Art Rock（アートロック）とは</h1>
<p>ロックの編成と流通を使いながら、目的を娯楽ではなく芸術表現に置いた音楽である。最大の特徴は録音スタジオを楽器として扱う姿勢で、テープの逆回転や速度変更、切り貼り、多重録音、位相をずらして生まれるうねりといった、演奏では再現できない</p>
<p>ロックの編成と流通を使いながら、目的を娯楽ではなく芸術表現に置いた音楽である。最大の特徴は録音スタジオを楽器として扱う姿勢で、テープの逆回転や速度変更、切り貼り、多重録音、位相をずらして生まれるうねりといった、演奏では再現できない操作が作品の中核に据えられる。楽器編成も自由で、Mellotronのようなテープ再生式の鍵盤楽器、VCS3などの初期のシンセサイザー、弦楽四重奏、管楽器、非西洋の楽器、さらには機械音や現場録音までが等価に扱われる。和声はロックの三和音から離れ、不協和音、教会旋法、無調に近い響き、そして現代音楽由来の持続音を用いる。拍子も4/4に留まらず、変拍子や拍節感を失わせる構成が現れる。曲の長さは一定せず、20分を超える組曲もあれば1分に満たない断章もあり、アルバム全体を一つの作品として通して聴かせる設計が好まれる。歌詞は物語、哲学的な問い、社会批評、あるいは意味を成さない音の連なりを扱い、歌わずに語る形式も採られる。プログレッシブ・ロックが演奏技術と構成の複雑さを競うのに対し、アートロックは概念と音響の新しさを重んじる点で方向が異なる。</p>
<h2>成り立ち</h2><p>背景としてまず重要なのは、イギリスの美術学校である。1950年代から1960年代のイギリスでは、進学先に困った労働者階級の若者が美術学校へ流れ込む仕組みがあり、John Lennon、Keith Richards、Pete Townshend、Ray Daviesらがそこで学んでいた。Roxy MusicのBryan Ferryはニューカッスルでポップアートの先駆者Richard Hamiltonに師事しており、大衆文化を素材として扱う思考をそのまま音楽へ持ち込んだ。1966年にThe Beach Boysが発表したペット・サウンズと、翌1967年にThe Beatlesが発表したサージェント・ペパーズ・ロンリー・ハーツ・クラブ・バンドは、ライブでの再現を前提としない録音作品というあり方を示し、レコードが記録ではなく作品そのものになりうることを証明した。同時期のニューヨークでは、現代音楽家La Monte Youngのもとで持続音の実験を重ねたJohn CaleがThe Velvet Undergroundに加わり、Andy Warholの後援を受けて、美術の文脈とロックを直接接続した。1969年にKing Crimsonが発表したイン・ザ・コート・オブ・ザ・クリムゾン・キングは、Mellotronによる重厚な響きと不穏な構成で新しい水準を示し、Pink Floydは長尺の音響作品を大衆的な成功と両立させた。1970年代半ばに決定的な役割を果たしたのがBrian Enoで、彼はRoxy Musicを離れた後、演奏技術を持たないことを利点と捉え、偶然性を制作に組み込む手法を提唱した。1977年からのDavid Bowieによるベルリンでの三部作、とりわけEnoとの共同作業は、ドイツの電子音楽とロックを接続し、以後の方向を決定づけた。1980年にEnoが手掛けたTalking Headsのリメイン・イン・ライトは、西アフリカのリズムの循環構造をロックへ導入し、この分野の到達点のひとつとされる。商業性との緊張は常につきまとい、実験が高じて聴かれない作品も多く生まれたが、スタジオを楽器として扱うという発想自体は完全に一般化し、現在のポップスや電子音楽の制作の前提となっている。</p>
<h2>代表曲</h2><ul><li>Life on Mars? (David Bowie)</li><li>Marquee Moon (Television)</li><li>Wuthering Heights (Kate Bush)</li><li>Virginia Plain (Roxy Music)</li><li>Street Spirit (Fade Out) (Radiohead)</li></ul>
