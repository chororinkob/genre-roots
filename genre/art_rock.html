<h1>Art Rock（アートロック）とは</h1>
<p>ロックの編成と流通を使いながら、目的を娯楽ではなく芸術表現に置いた音楽である。特徴のひとつは、一部のアーティストに顕著な、録音スタジオを楽器として扱う姿勢で、テープの逆回転や速度変更、切り貼り、多重録音、位相をずらして生まれるうね</p>
<p>ロックの編成と流通を使いながら、目的を娯楽ではなく芸術表現に置いた音楽である。特徴のひとつは、一部のアーティストに顕著な、録音スタジオを楽器として扱う姿勢で、テープの逆回転や速度変更、切り貼り、多重録音、位相をずらして生まれるうねりといった、演奏では再現できない操作が作品の中核に据えられる。楽器編成も自由で、Mellotronのようなテープ再生式の鍵盤楽器、VCS3などの初期のシンセサイザー、弦楽四重奏、管楽器、非西洋の楽器、さらには機械音や現場録音までが等価に扱われる例もある。和声（コードの響き）はしばしばロックの三和音（基本の3音の和音）から離れ、一部では不協和音、教会旋法（中世の教会音楽の音の並び方）、無調（調の中心がない）に近い響き、そして現代音楽由来の持続音を用いる。拍子も4/4に留まらず、変拍子（定型から外れた拍子）や拍節感（拍の区切りの感じ）を失わせる構成が現れる。曲の長さは一定せず、20分を超える組曲もあれば1分に満たない断章もあり、アルバム全体を一つの作品として通して聴かせる設計が好まれる。歌詞は物語、哲学的な問い、社会批評、あるいは意味を成さない音の連なりを扱い、歌わずに語る形式も採られる。アートロックとプログレッシブ・ロックは互換的に使われることもあり、区別は論者による。</p>
<h2>成り立ち</h2><p>背景としてまず重要なのは、イギリスの美術学校である。1950年代から1960年代のイギリスでは、美術学校は、米国と比べて産業向けでないカリキュラムで、風変わりな才能を伸ばす場であり、John Lennon、Keith Richards、Pete Townshend、Ray Daviesらがそこで学んでいた。Roxy MusicのBryan Ferryはニューカッスルで美術を学び、そのうち1年はポップアートの先駆者Richard Hamiltonの指導を受けた。1966年にThe Beach Boysが発表したペット・サウンズは、スタジオ・ミュージシャンを多用した、ライブ再現が難しい複雑な編曲の作品である。The Beatlesは、1966年のリボルバー以降、翌1967年のサージェント・ペパーズ・ロンリー・ハーツ・クラブ・バンドなどで、ライブでの再現を前提としない録音作品というあり方を示し、レコードが記録ではなく作品そのものになりうることを示したと評価される。一方ニューヨークでは、1964年にThe Velvet Undergroundが結成され（現代音楽家La Monte Youngの集団に参加していたJohn CaleがLou Reedとともに活動）、1965年にAndy Warholがマネージャーとなって、美術の文脈とロックを直接接続した。1969年にKing Crimsonが発表したイン・ザ・コート・オブ・ザ・クリムゾン・キングは、Mellotronによる重厚な響きと不穏な構成で新しい水準を示し、Pink Floydは長尺の音響作品を大衆的な成功と両立させた。1970年代半ばにはBrian Enoが、Roxy Musicを1973年に離れた後、自らを「non-musician」と称し、Oblique Strategies（1974年に発案、1975年発売）などを通じて偶然性を制作に取り入れた。通称ベルリン3部作（『Low』『&quot;Heroes&quot;』=1977年、『Lodger』=1979年）として知られるDavid Bowieの作品群、とりわけEnoとの共同作業は、アートロックの要素をほかのポピュラー音楽へ取り入れた例とされる。1980年にEnoが手掛けたTalking Headsのリメイン・イン・ライトは、西アフリカのリズムの循環構造をロックへ導入し、アートロックの傾向を他ジャンルに取り入れた例とされる。商業性との緊張は常につきまとい、実験が高じて聴かれない作品も多く生まれたが、スタジオを楽器として扱うという発想自体は広く浸透し、現在のポップスや電子音楽の制作の前提になっていると言われる。</p>
