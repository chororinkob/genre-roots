<h1>Art Rock（アートロック）とは</h1>
<p>アートロックは、ロックの編成と流通を使いながら、目的を娯楽ではなく芸術表現に置いた音楽だ。 特徴のひとつは、録音スタジオを楽器として扱う姿勢である。テープの逆回転や速度変更、切り貼り、多重録音、位相をずらして生まれるうねりといった</p>
<p>アートロックは、ロックの編成と流通を使いながら、目的を娯楽ではなく芸術表現に置いた音楽だ。

特徴のひとつは、録音スタジオを楽器として扱う姿勢である。テープの逆回転や速度変更、切り貼り、多重録音、位相をずらして生まれるうねりといった、演奏では再現できない操作が、作品の中核に据えられる。

楽器編成も自由だ。Mellotronのようなテープ再生式の鍵盤楽器、VCS3などの初期のシンセサイザー、弦楽四重奏、管楽器、非西洋の楽器、一部では、さらに機械音や現場録音までが、等しく扱われる。

和声（コードの響き）は、しばしばロックの三和音（基本の3音の和音）から離れる。一部では、不協和音、教会旋法（中世の教会音楽の音の並び方）、無調（調の中心がない）に近い響き、そして現代音楽由来の持続音を用いる。拍子も4/4にとどまらない。変拍子（定型から外れた拍子）や、拍節感（拍の区切りの感じ）を失わせる構成が現れる。

曲の長さは一定しない。20分を超える組曲もあれば、1分に満たない断章もある。アルバム全体を一つの作品として通して聴かせる設計が、しばしば好まれる。歌詞は物語、哲学的な問い、社会批評、あるいは意味を成さない音の連なりを扱い、歌わずに語る形式も採られる。

アートロックとプログレッシブ・ロックは、互換的に使われることもある。区別は論者による。</p>
<h2>成り立ち</h2><p>舞台は、イギリスの美術学校だ。1950年代から1960年代のイギリスでは、美術学校は、米国と比べて産業向けでないカリキュラムで、風変わりな才能を伸ばす場だった。John Lennon、Keith Richards、Pete Townshend、Ray Daviesらが、そこで学んでいた。Roxy MusicのBryan Ferryはニューカッスルで美術を学び、そのうち1年はポップアートの先駆者Richard Hamiltonの指導を受けた。

1966年にThe Beach Boysが発表したペット・サウンズは、スタジオ・ミュージシャンを多用した、ライブ再現が難しい複雑な編曲の作品である。翌1967年にThe Beatlesが発表したサージェント・ペパーズ・ロンリー・ハーツ・クラブ・バンドは、ライブでの再現を前提としない録音作品というあり方を示した。この作品は、レコードが記録ではなく作品そのものになりうることを証明したと評価される。

1964年のニューヨークでは、現代音楽家La Monte Youngのもとで持続音の実験を重ねたJohn Caleが、Lou ReedとともにThe Velvet Undergroundを結成した。1965年にAndy Warholがマネージャーとなって、美術の文脈とロックを直接接続した。

1969年にKing Crimsonが発表したイン・ザ・コート・オブ・ザ・クリムゾン・キングは、Mellotronによる重厚な響きと不穏な構成で、新しい水準を示した。Pink Floydは、長尺の音響作品を大衆的な成功と両立させた。

1970年代半ばに決定的な役割を果たしたのが、Brian Enoだ。彼はRoxy Musicを離れた後、「non-musician」を自称し、Oblique Strategies（1975年）などを通じて偶然性を取り入れた。通称ベルリン3部作（『Low』『&quot;Heroes&quot;』=1977年、『Lodger』=1979年）として知られるDavid Bowieの作品群、とりわけEnoとの共同作業は、アートロックの要素をほかのポピュラー音楽へ取り入れた例とされる。1980年にEnoが手掛けたTalking Headsのリメイン・イン・ライトは、西アフリカのリズムの循環構造をロックへ導入し、art rockの傾向を他ジャンルに取り入れた例とされる。

商業性との緊張は、常につきまとった。実験が高じて、聴かれない作品も多く生まれた。だが、スタジオを楽器として扱うという発想自体は広く浸透し、現在のポップスや電子音楽の制作の前提となっていると言われる。</p>
