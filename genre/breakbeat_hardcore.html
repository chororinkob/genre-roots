<h1>Breakbeat Hardcore（ブレイクビートハードコア）とは</h1>
<p>1990年代初頭のイギリスのレイヴで鳴っていた、生ドラムのブレイクビーツとテクノのキックを同居させたダンス音楽である。テンポは概ね130から150 BPMで、四つ打ちのバスドラムを土台に置きつつ、その上へサンプリングした古いファン</p>
<p>1990年代初頭のイギリスのレイヴで鳴っていた、生ドラムのブレイクビーツとテクノのキックを同居させたダンス音楽である。テンポは概ね130から150 BPMで、四つ打ちのバスドラムを土台に置きつつ、その上へサンプリングした古いファンクのドラムループを高速で走らせる二層構造を取る。多用されたのはThe Winstonsのアーメン・ブレイクとLyn Collinsのシンク・ブレイクで、Akai S1000などのサンプラーで刻み直され、原曲より速いテンポへ引き伸ばされた。上物はハウス由来のピアノの和音を短く叩くスタブ、大きく持ち上がるシンセの音、そして女性ソウルシンガーの一節やレゲエのMCの声をピッチを上げて貼り付けたものが定番である。低音は808や909のキックに加え、レゲエのサウンドシステム文化から引き継いだ重いベースラインが担う。多くの曲はリズムが消えて浮遊するブレイクダウンを挟み、そこから一気に打ち込みが戻る構成を持つ。この構成はダンス音楽に広く共通する。多幸感と不穏さが同居する独特の質感が、直後に分岐するジャングルとハッピーハードコアの双方の原型となっている。</p>
<h2>成り立ち</h2><p>1988年のセカンド・サマー・オブ・ラヴを経て、イギリスでは工場跡地や高速道路脇の野原を使った無許可の大規模レイヴが各地で開かれるようになった。アメリカから輸入されたハウスやテクノをそのまま鳴らすのでは物足りず、ジャマイカ発祥のサウンドシステム文化が、英国のレゲエやヒップホップの文化を通じて英国のレイヴに取り込まれ、ヒップホップのブレイクビーツ感覚とともに持ち込まれた結果、1990年から1991年にかけてブレイクビート・ハードコアが形を取る。ロンドンのShut Up and Danceは自主レーベルを構えて既成曲を無断で刻み、訴訟を抱えながらも初期の型を作った。1991年にはThe ProdigyがXL RecordingsからCharlyを発表して全英3位に達し、子ども向け公共広告の猫の声を使ったこの曲は爆発的に売れた一方、模倣作が氾濫したとして、1992年8月のMixmagは表紙で「Charlyはレイヴ音楽を殺したのか?」と問いかけた。Rob Playfordが1990年に設立したMoving Shadowからは2 Bad MiceのBombscareが、Production HouseからはAcenのTrip II the Moonが、Suburban Baseからは多数の12インチが送り出され、Marc MacとGus Lawrenceが1989年に始め、Dego McFarlaneらが合流したReinforced Recordsは4heroの作品を通じて音の暗黒面を押し進めた。しかしエクスタシーの流行と過剰な多幸感への反動が起き、シーンは1992年末から1993年にかけて、ピッチを上げた歌と速いキックを取るハッピーハードコアと、ベースとブレイクの操作を追求するジャングルへ分裂し始め、後者がドラムンベースへ発展した。1994年11月の刑事司法・公共秩序法は、反復するビートが主な特徴の音楽を含む屋外の集会について、警視以上が退去を指示できるようにした。ブレイクビート・ハードコアは、Simon Reynoldsが英誌The Wireで1992〜2005年に連載した「ハードコア・コンティニュアム」という見方の起点にあたる。2000年代にはnu-raveの流れの中で、hardcore breaksとして再興した。</p>
<h2>代表曲</h2><ul><li>On a Ragga Tip (SL2)</li><li>Trip to Trumpton (Urban Hype)</li><li>Hyperspeed (G-Force Part 2) (The Prodigy)</li><li>Wind It Up (The Prodigy)</li><li>The Bouncer (Kicks Like a Mule)</li><li>Music Reach (1,2,3,4) (The Prodigy)</li><li>This Sound Is for the Underground (Krome &amp; Time)</li><li>DJs Take Control (SL2)</li><li>Trip II the Moon (Acen)</li><li>Cookin' Up Yer Brain (4hero)</li><li>Window in the Sky (Acen)</li><li>The Life and Crimes of a Ruffneck (Acen)</li></ul>
