<h1>Breakbeat Hardcore（ブレイクビートハードコア）とは</h1>
<p>1990年代初頭のイギリスのレイヴで鳴っていたダンス音楽だ。レコードからサンプリングしたブレイクビーツと、テクノのキックを同時に鳴らした。 テンポはおおむね140前後〜150台のBPMである。典型的には、四つ打ちのバスドラムを土台</p>
<p>1990年代初頭のイギリスのレイヴで鳴っていたダンス音楽だ。レコードからサンプリングしたブレイクビーツと、テクノのキックを同時に鳴らした。

テンポはおおむね140前後〜150台のBPMである。典型的には、四つ打ちのバスドラムを土台に置き、その上で、サンプリングした古いファンクのドラムループを高速で走らせる。こうした二つの層からなる作りの曲が多い。

よく使われたのは、The Winstonsのアーメン・ブレイクと、Lyn Collinsのシンク・ブレイクだ。これらをサンプラーで切り刻み、速度を上げて使った。

上に重ねる音の定番は、ハウス由来のピアノの和音を短く叩くスタブ、大きく持ち上がるシンセの音だ。そして、女性ソウルシンガーの一節やレゲエのMCの声を、ピッチを上げて貼り付けたものも定番である。

低音は、808や909のキックに加え、レゲエのサウンドシステム文化から引き継いだ重いベースラインが担う。

多くの曲は、リズムが消えて浮遊するブレイクダウンを挟み、そこから一気に打ち込みが戻る構成を持つ。多幸感と不穏さが同居する独特の手ざわりが、直後に分かれていくダークコア、ジャングル、ハッピー・ハードコアの原型になっている。</p>
<h2>成り立ち</h2><p>1988年のセカンド・サマー・オブ・ラヴを経て、イギリスでは各地でレイヴが開かれるようになった。工場跡地や高速道路脇の野原を使った無許可のフリーパーティーと、1990〜92年に発展した商業メガレイヴである。

しかし、アメリカから輸入されたハウスやテクノを、そのまま鳴らすのでは物足りなかった。1990年から1991年にかけて、ブレイクビート・ハードコアが形になる。

ロンドンのShut Up and Danceは、自主レーベルを構えて既成曲を無断で刻んだ。1992年には、無許可のサンプルを使った曲で差し止めを受けている。初期ハードコアの先駆者の一組である。

1991年には、The ProdigyがXL RecordingsからCharlyを発表し、全英3位に達した。子ども向け公共広告の猫の声を使ったこの曲は、爆発的に売れた。一方で、模倣作が氾濫したとして、1992年8月のMixmagは表紙で「Charlyはレイヴ音楽を殺したのか?」と問いかけた。

レーベルも次々に作品を送り出した。Rob Playfordが1990年に設立したMoving Shadowからは、2 Bad MiceのBombscareが出た。Production HouseからはAcenのTrip II the Moonが、Suburban Baseからは多数の12インチが出た。Marc MacとGus Lawrenceが1989年に始め、Dego McFarlaneらが合流したReinforced Recordsは、4heroの作品を通じて音の暗い面を押し進めた。

しかしシーンは1992年後半に、ダークコア、ハードコア・ジャングル、ハッピー・ハードコアへ分かれ始めた。ハッピー・ハードコアは、ピアノのロールと、より高揚するボーカルを保った。ベースとブレイクの操作を追求するジャングルは、ドラムンベースへ発展した。

1994年11月の刑事司法・公共秩序法は、屋外の集会について、警視以上が退去を指示できるようにした。対象は、夜間に増幅音楽を流し、住民に深刻な苦痛を与えるおそれのある集会（制定時は100人以上）である。条文の上では、音楽は「反復するビートを主な特徴とする音」を含むものと定義された。

ブレイクビート・ハードコアは、「ハードコア・コンティニュアム」という見方の出発点にあたる。Simon Reynoldsが1992年（第1回「Hardcore Rave」）以降に英誌The Wireへ書いた一連の記事（全7本）を、のちにこの名で位置づけたものだ。Simon Reynoldsは、ダブ、ダンスホール、ヒップホップの要素が英国版のハウスやテクノを生んだと述べる。そして、ハードコア・コンティニュアムを、ジャマイカのサウンドシステム文化の英国的な適応とみる。

2000年代には、nu-raveの流れの中で、hardcore breaksとして再興した。</p>
