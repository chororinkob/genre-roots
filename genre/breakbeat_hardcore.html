<h1>Breakbeat Hardcore（ブレイクビートハードコア）とは</h1>
<p>1990年代初頭のイギリスのレイヴで鳴っていた、生ドラムのブレイクビーツとテクノのキックを同居させたダンス音楽である。テンポは概ね130から150 BPMで、四つ打ちのバスドラムを土台に置きつつ、その上へサンプリングした古いファン</p>
<p>1990年代初頭のイギリスのレイヴで鳴っていた、生ドラムのブレイクビーツとテクノのキックを同居させたダンス音楽である。テンポは概ね130から150 BPMで、四つ打ちのバスドラムを土台に置きつつ、その上へサンプリングした古いファンクのドラムループを高速で走らせる二層構造を取る。多用されたのはThe Winstonsのアーメン・ブレイクとLyn Collinsのシンク・ブレイクで、Akai S1000などのサンプラーで刻み直され、原曲より速いテンポへ引き伸ばされた。上物はハウス由来のピアノの和音を短く叩くスタブ、大きく持ち上がるシンセの音、そして女性ソウルシンガーの一節やレゲエのMCの声をピッチを上げて貼り付けたものが定番である。低音は808や909のキックに加え、レゲエのサウンドシステム文化から引き継いだ重いベースラインが担う。曲は必ずと言っていいほど、リズムが消えて浮遊するブレイクダウンを挟み、そこから一気に打ち込みが戻る構成を持ち、この落として上げる型は後のダンス音楽全般の常套手段になった。多幸感と不穏さが同居する独特の質感が、直後に分岐するジャングルとハッピーハードコアの双方の原型となっている。</p>
<h2>成り立ち</h2><p>1988年のセカンド・サマー・オブ・ラヴを経て、イギリスでは工場跡地や高速道路脇の野原を使った無許可の大規模レイヴが各地で開かれるようになった。アメリカから輸入されたハウスやテクノをそのまま鳴らすのでは物足りず、イギリス固有のサウンドシステム文化とヒップホップのブレイクビーツ感覚が持ち込まれた結果、1990年から1991年にかけてブレイクビート・ハードコアが形を取る。ロンドンのShut Up and Danceは自主レーベルを構えて既成曲を無断で刻み、訴訟を抱えながらも初期の型を作った。1991年にはThe ProdigyがXL RecordingsからCharlyを発表して全英3位に達し、子ども向け公共広告の猫の声を使ったこの曲は爆発的に売れた一方、模倣作が氾濫してシーンを安っぽくしたとして、後に業界内でCharlyがレイヴを殺したと語られることになる。Rob Playfordが1990年に設立したMoving Shadowからは2 Bad MiceのBombscareが、Production HouseからはAcenのTrip II the Moonが、Suburban Baseからは多数の12インチが送り出され、Dego McFarlaneとMarc Macらが1989年に立ち上げたReinforced Recordsは4heroの作品を通じて音の暗黒面を押し進めた。しかしエクスタシーの流行と過剰な多幸感への反動、そして1994年の刑事司法・公共秩序法が反復するビートを伴う集会を名指しで規制したことで、無許可レイヴの時代は終わる。シーンは1993年頃を境に、ピッチを上げた歌と速いキックを取るハッピーハードコアと、ベースとブレイクの操作を追求するジャングルへ分裂し、後者がドラムンベースへ発展した。2010年代以降はハードコア・コンティニュアムという枠組みで再評価が進み、当時の12インチが高値で取引されている。</p>
<h2>代表曲</h2><ul><li>On a Ragga Tip (SL2)</li><li>The Bouncer (Kicks Like a Mule)</li><li>Trip to Trumpton (Urban Hype)</li></ul>
