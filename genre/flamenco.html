<h1>Flamenco（フラメンコ）とは</h1>
<p>フラメンコはスペイン南部アンダルシア地方を発祥とする音楽・舞踊・詩の複合芸術だ。その音響的な核心は、独特の旋法体系「フラメンコ・モード」にある。これはフリギア旋法を基盤としながら、長調と短調の要素が混在する複雑な音階構造で、半音階</p>
<p>フラメンコはスペイン南部アンダルシア地方を発祥とする音楽・舞踊・詩の複合芸術だ。その音響的な核心は、独特の旋法体系「フラメンコ・モード」にある。これはフリギア旋法を基盤としながら、長調と短調の要素が混在する複雑な音階構造で、半音階的な動きが多く、西洋クラシック音楽の機能和声とは異なる緊張感を生み出す。コード進行の典型は「Am–G–F–E」という下降進行で、最終的にE（フリギア終止）へ解決する。この終止感が、フラメンコ特有の哀愁と緊張を生む核心だ。

使用楽器の中心はフラメンコ・ギター（ギタラ・フラメンカ）だ。クラシックギターより薄く軽い構造で、タップ板（ゴルペ板）が張られており、指で叩く「ゴルペ」奏法が可能だ。右手の奏法として「ラスゲアード」（複数の指を素早く扇状に弾く連続ストローク）と「ピカード」（単音の速弾き）が特徴的で、前者は激しい感情の爆発を、後者は旋律の輪郭を際立たせる。カポタスト（カポ）を使って移調し、演奏者の声域に合わせることも多い。

リズム構造は「コンパス」と呼ばれ、フラメンコの命とも言える。最も複雑なのは12拍子の「ソレア」や「ブレリア」で、アクセントが3・6・8・10・12拍目に来る非対称パターンだ。「ブレリア」はテンポが非常に速く、BPM200を超えることもある。一方「シギリージャ」は12拍を3+3+2+2+2に分割する独特の構造を持つ。打楽器として「カホン」（木製の箱型打楽器）や「パルマ」（手拍子）が使われ、ダンサーの「サパテアード」（足踏み）もリズム楽器として機能する。

ボーカルスタイル「カンテ」は、フラメンコの三要素（カンテ・バイレ・トケ）の中で最も重要とされる。歌い手（カンタオール）は「ケヘ」（嘆き）を表現するために、声を震わせ、引き裂くように歌う。装飾音「メリスマ」を多用し、一つの音節に複数の音を乗せる。歌詞の主題は愛・死・苦しみ・自由への渇望・故郷への郷愁など、人間の根源的な感情だ。歌は「アイ」「アイ・アイ」といった感嘆詞から始まることが多く、言葉以前の感情の叫びとして機能する。

演奏は通常、ライブ空間「タブラオ」で行われる。ギタリスト・歌手・ダンサーが即興的に対話しながら演奏を構築し、観客の「オレ！」という掛け声も演奏の一部となる。ラテン音楽の他ジャンル（サルサ・ボサノバ）と比べると、フラメンコはより即興性が高く、旋法の暗さと感情の激しさが際立っている。</p>
<h2>成り立ち</h2><p>フラメンコの起源は18世紀後半のスペイン・アンダルシア地方、特にセビリア、ヘレス・デ・ラ・フロンテーラ、カディスの三角地帯に求められる。この地域はイスラム文化（ムーア人）、ユダヤ文化、ロマ（ヒターノ）文化、そしてスペイン・カトリック文化が数百年にわたって交差した場所だ。フラメンコはこれらの文化が混交して生まれたとされるが、特にロマの人々が担い手として中心的な役割を果たしたことは広く認められている。ただし「フラメンコはロマ起源である」と断定することは学術的に慎重を要し、アンダルシア土着の音楽文化との融合として捉えるのが現在の定説に近い。

「フラメンコ」という言葉が文献に初めて登場するのは1770年代から1780年代頃とされる。19世紀前半には「カフェ・カンタンテ」と呼ばれる大衆的な音楽喫茶が各地に開かれ、フラメンコは貴族の私的な場から一般大衆の娯楽へと移行した。この時代を「フラメンコの黄金時代」と呼ぶ。シルベリオ・フランコネッティ（1831–1889）はこの時代の最重要人物で、セビリアにカフェ・カンタンテを開き、多様なスタイルを体系化した。彼は「カンテ・ホンド」（深い歌）の守護者として後世に語り継がれている。

20世紀初頭、フラメンコは商業化と大衆化の波に飲み込まれ、「オペラ・フラメンカ」と呼ばれる軽薄な舞台形式が流行した。これに危機感を抱いた詩人フェデリコ・ガルシア・ロルカと作曲家マヌエル・デ・ファリャは1922年、グラナダで「カンテ・ホンド・コンクール」を開催し、フラメンコの純粋性を取り戻す運動を展開した。ロルカはフラメンコの美学を「ドゥエンデ」という概念で表現した。ドゥエンデとは死の影を帯びた、制御不能な芸術的霊感のことで、フラメンコの本質を語る上で欠かせない概念だ。

1950年代から60年代にかけて、ギタリストのパコ・デ・ルシアが登場し、フラメンコの歴史を根本から変えた。パコ・デ・ルシア（1947–2014）は「ブレリア」や「ソレア」の演奏技術を飛躍的に高め、ジャズやブラジル音楽との融合を試みた。1981年のアルバム『ランカピーノ・チコ』や、ジャズギタリストのジョン・マクラフリン、チック・コリアとのコラボレーションは、フラメンコを国際的な音楽言語へと押し上げた。同時代の歌手カマロン・デ・ラ・イスラ（1950–1992）は、ロック・ポップの要素を取り込んだ革新的なアルバム『ラ・レイェンダ・デル・ティエンポ』（1979年）を発表し、伝統派から激しい批判を受けながらも、フラメンコの可能性を大きく広げた。

ダンス（バイレ）の分野では、カルメン・アマジャ（1918–1963）が女性ダンサーとして初めて国際的な名声を得た人物だ。彼女は男性的とされていた力強いサパテアードを女性として初めて舞台で披露し、フラメンコのジェンダー規範を打ち破った。後にアントニオ・ガデス（1936–2004）が振付師として映画監督カルロス・サウラと組み、映画『血の婚礼』（1981年）、『カルメン』（1983年）でフラメンコを映像芸術として世界に広めた。

1990年代以降、「フラメンコ・フュージョン」または「ヌエボ・フラメンコ」と呼ばれる潮流が生まれた。ケタマ、ラス・フィリピナス、そしてロサリオ・フローレスらがポップ・ロック・ラテンジャズとの融合を推進した。また、ダンサー兼振付師のイスラエル・ガルバンは2000年代以降、コンテンポラリーダンスとフラメンコを融合させた前衛的な作品を発表し続けている。

2010年、ユネスコはフラメンコを「人類の無形文化遺産」に登録した。現在もヘレス・デ・ラ・フロンテーラで毎年開催される「フェスティバル・デ・ヘレス」や、セビリアの「ビエナル・デ・フラメンコ」が世界中からアーティストと観客を集めている。伝統と革新の緊張関係は今も続いており、フラメンコは生きた芸術として進化を止めていない。</p>
