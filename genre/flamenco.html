<h1>Flamenco（フラメンコ）とは</h1>
<p>フラメンコは、スペイン南部のアンダルシア地方で生まれたとされる、音楽・舞踊・詩が一つになった芸術だ。 使用楽器の中心はフラメンコ・ギター（ギタラ・フラメンカ）だ。クラシックギターより薄く軽い構造で、タップ板（ゴルペ板）が張られてい</p>
<p>フラメンコは、スペイン南部のアンダルシア地方で生まれたとされる、音楽・舞踊・詩が一つになった芸術だ。

使用楽器の中心はフラメンコ・ギター（ギタラ・フラメンカ）だ。クラシックギターより薄く軽い構造で、タップ板（ゴルペ板）が張られている。このため、指で叩く「ゴルペ」奏法ができる。右手の奏法で特徴的なのは、「ラスゲアード」（複数の指を素早く扇状に弾く連続ストローク）と「ピカード」（単音の速弾き）だ。前者は激しい感情の爆発を、後者は旋律の輪郭を際立たせるとされる。カポタスト（カポ＝弦を押さえて音の高さを一括で上げる器具）を使って移調（音の高さを変えること）し、演奏者の声域に合わせることも多い。

音の核心は、独特の旋法（音の並び方の型）の体系「フラメンコ・モード」にある。これはフリギア旋法を土台にしながら、長調と短調の要素が混ざった、複雑な音階構造だ。半音と増2度を含む7音音階で、半音進行が目立つ。西洋クラシック音楽の機能和声（和音ごとに役割が決まった和声の仕組み）とは異なる緊張感を生み出す。

コード進行の典型は、「Am–G–F–E」という下降進行だ。最後はE（アンダルシア終止＝フラメンコで多用される進行で、他ジャンルでも広く使われる）へ解決する。この終止感が、フラメンコ特有の哀愁と緊張を生む核心だ。

リズム構造は「コンパス」と呼ばれ、フラメンコの命とも言える。最も複雑なのは、12拍子（12拍のサイクル）の「ソレア」や「ブレリア」だ。アクセントが3・6・8・10・12拍目に来る、非対称（拍の分け方が不揃い）なパターンになっている。「ブレリア」はテンポが非常に速く、BPM（1分間の拍数）200を超えることもある。一方「シギリージャ」は、12拍を2+2+3+3+2に分ける独特の構造を持つ。打楽器としては、「カホン」（木製の箱型打楽器）や「パルマ」（手拍子）が使われる。ダンサーの「サパテアード」（足踏み）も、リズム楽器として働く。

歌は「カンテ」と呼ばれ、フラメンコの三要素（カンテ・バイレ・トケ）の中で最も重要とされる。歌い手（カンタオール）は、「ケヒーオ」（quejío。嘆きの発声）を表現するために、声を震わせ、引き裂くように歌う。装飾音「メリスマ」を多用し、一つの音節に複数の音を乗せる。歌は「アイ」「アイ・アイ」といった感嘆詞から始まることが多く、言葉以前の感情の叫びとして働く。

歌詞の主題は、愛・死・苦しみ・自由への渇望・故郷への郷愁など、人間の根源的な感情だ。

演奏は、現在の代表的な上演の場の一つであるライブ空間「タブラオ」で行われる。ギタリスト・歌手・ダンサーが、即興的に対話しながら演奏を組み立てていく。観客の「オレ！」という掛け声も、演奏の一部となる。ラテン音楽の他ジャンル（サルサ・ボサノバ）と比べると、フラメンコはより即興性が高く、旋法の暗さと感情の激しさが際立っている。</p>
<h2>成り立ち</h2><p>舞台は、18世紀後半のスペイン南部、アンダルシア地方だ。特にセビリア、ヘレス・デ・ラ・フロンテーラ、カディスの三角地帯に起源が求められるのが、一般的な説明である（異論もある）。

この地域は、イスラム文化（ムーア人）、ユダヤ文化、ロマ（ヒターノ）文化、そしてスペイン・カトリック文化が、数百年にわたって交差した場所だ。フラメンコには、ムーア人（モリスコ）・ロマ・アンダルシア土着文化の影響が論じられる。ユダヤ文化の影響は、直接の証拠が乏しい。そのうえで、特にロマの人々が担い手として中心的な役割を果たしたことは、広く認められている。ただし、「フラメンコはロマ起源である」と断定することは、学術的に慎重を要する。アンダルシア土着の音楽文化との融合として捉えるのが、現在の定説に近い。

フラメンコ的な宴の最も古い文学的な証言は、Cadalsoの『モロッコ書簡』とされる。1774年に認可申請、1789年に新聞連載、1793年に書籍化された。1847年の新聞記事には、「flamenco」が歌い手の形容として現れる。ジャンル名としての初出かどうかは、見解が分かれる。

19世紀半ば（1840年代以降）には、「カフェ・カンタンテ」と呼ばれる音楽喫茶が現れた。1860年代から1910年ごろに全盛を迎え、この時代を「フラメンコの黄金時代」と呼ぶ。シルベリオ・フランコネッティ（1831–1889）は、この時代の最重要人物だ。セビリアにカフェ・カンタンテを開き、カフェ・カンタンテを普及させ、その格を高めた。評価は分かれる。彼は「カンテ・ホンド」（深い歌）の守護者として、後世に語り継がれている。

1920年から1955年ごろ、フラメンコは闘牛場や劇場で興行される商業的な形式になり、「オペラ・フラメンカ」と呼ばれた。これに危機感を抱いた作曲家マヌエル・デ・ファリャの発案で、詩人フェデリコ・ガルシア・ロルカらの支持を得て、1922年にグラナダで「カンテ・ホンド・コンクール」が開かれた。フラメンコの純粋性を取り戻す運動だった。民間伝承に由来するドゥエンデを、ロルカが1933年の講演で芸術論として理論化した。フラメンコ（カンテ・ホンド）と結び付けて語られることが多い。ドゥエンデとは、死の影を帯びた、制御不能な芸術的霊感のことだ。フラメンコの本質を語る上で欠かせない概念である。

1950年代から60年代にかけて、ギタリストのパコ・デ・ルシアが登場し、フラメンコの歴史を根本から変えた。パコ・デ・ルシア（1947–2014）は、「ブレリア」や「ソレア」の演奏技術を飛躍的に高めたと言われ、ジャズやブラジル音楽との融合を試みたとされる。1981年のアルバム『Sólo quiero caminar』や、ジャズギタリストのジョン・マクラフリン、ジャズピアニストのチック・コリアとの共演は、フラメンコを国際的な音楽言語へと押し上げた。同時代の歌手カマロン・デ・ラ・イスラ（1950–1992）は、ロック・ポップの要素を取り込んだ革新的なアルバム『ラ・レイェンダ・デル・ティエンポ』（1979年）を発表した。伝統派から激しい批判を受けながらも、フラメンコの可能性を大きく広げた。

ダンス（バイレ）の分野では、カルメン・アマジャ（1963年没。生年は1913年説と1918年説があり、近年は1918年説が有力視される。確定していない）が、フラメンコの女性舞踊家として国際的な名声を得た先駆者だ。彼女は、男性の領域とされた力強い足技を、女性として初めて高い水準で習得したと評される。そして、フラメンコの性別にまつわる決まりごとを打ち破った。後にアントニオ・ガデス（1936–2004）が振付師として映画監督カルロス・サウラと組み、映画『血の婚礼』（1981年）、『カルメン』（1983年）でフラメンコを映像芸術として世界に広めた。

1980年代には、「フラメンコ・フュージョン」または「ヌエボ・フラメンコ」と呼ばれる流れが始まった（前史は1970年代のパコ・デ・ルシアとカマロンの融合）。Pata Negraはブルース／ロック、ケタマはポップやキューバ・ブラジル音楽などとの融合を推進した。ロサリオ・フローレスらも、この呼称で挙げられる例である。また、ダンサー兼振付師のイスラエル・ガルバンは、2000年代以降、コンテンポラリーダンス（現代舞踊）とフラメンコを融合させた前衛的（新しさを追い求める）な作品を発表し続けている。

2010年、ユネスコはフラメンコを「人類の無形文化遺産」に登録した。現在もヘレス・デ・ラ・フロンテーラで毎年開催される「フェスティバル・デ・ヘレス」や、セビリアの「ビエナル・デ・フラメンコ」が、世界中からアーティストと観客を集めている。伝統と革新の緊張関係は今も続いており、フラメンコは生きた芸術として進化を止めていない。</p>
