<h1>Contemporary Classicalとは</h1>
<p>コンテンポラリー・クラシックは、慣用的には1945年以降の西洋の芸術音楽を指す。ただし、定義は固定的ではない。 ひとつのスタイルにまとまった音楽ではない。むしろ、共通の書き方が存在しないことこそが、この時代の特徴といえる。それでも</p>
<p>コンテンポラリー・クラシックは、慣用的には1945年以降の西洋の芸術音楽を指す。ただし、定義は固定的ではない。

ひとつのスタイルにまとまった音楽ではない。むしろ、共通の書き方が存在しないことこそが、この時代の特徴といえる。それでも、いくつかの主な方向がある。

第一は総音列主義だ。音高だけでなく、音価、強弱、アタック(奏法・音色)までを、数列によって組み立てる。これを、作曲者の主観を取り除くための方法と見る評者もいる。

第二は偶然性の音楽だ。演奏の一部を、演奏者の判断や偶然に任せる。そうして、作品が「同じ作品である」とはどういうことかを問い直す。

第三は、音響の塊を扱う手法だ。素材は個々の音符ではない。数十の声部（同時に重なる旋律の線）が極めて密集して動くことで生まれる、雲のような響きだ。楽器のふつうとは違う奏法による軋み、擦れ、叩きも素材になる。

第四は、音響のスペクトル分析(倍音列を含む)に基づく手法だ。一つの音に含まれる倍音の構造を、そのままオーケストラの和音として書き出す。

第五は、反復を軸にした簡素な方向である。

楽譜の書き方も広がった。五線譜ではなく、図形や文章による指示が使われることもある。

前衛的（新しさを追い求める）な流れでは、聴き手に心地よさを与えることを目的とせず、音そのものの在り方を問う作品が多かった。一方で、調性（調の中心がはっきりした響き）的な書き方を使い続ける作曲家もいる。</p>
<h2>成り立ち</h2><p>戦争とナチス体制の経験を背景に、多くの若い作曲家が、それまでの音楽の書き方の見直しを求めた。「ゼロ時間」という見方がよく語られる。ただし、断絶をどこまで強調できるかについては、研究上の議論がある。

ドイツの都市ダルムシュタットでは、1946年に夏期講習会が始まった。1950年前後からは、ここが若い世代の前衛の拠点になった。1950年代前半までに、ここに集まったPierre BoulezやKarlheinz Stockhausenは、Olivier Messiaenに刺激を受けた。Luigi Nonoは、Schoenbergの音列を出発点にした。こうして彼らは、音の各要素を数列で組み立てる方向を推し進めた。

一方、アメリカのBabbittは、ヨーロッパとは独立に、1947〜48年に同じような作品を書いており、総音列的な手法の最初期の例とされる。こうした試みを、主観を排した、いわば白紙からの作り直しと見る評者もいる。

同じころ、これと対照的な、偶然性を取り入れる方向も現れた。その代表がアメリカのCageである。John Cageは、東洋の思想と易の占いに影響を受け、作曲者の意図そのものを取り除く方向へ進んだ。1952年に発表された、演奏者が一切音を出さない作品は、音楽とは何かという問いを、最も鋭い形で突きつけた。

技術の面でも動きがあった。1948年、パリでPierre Schaefferが、録音した現実の音を素材にして組み立てる手法を始めた。ケルンの放送局では、電子的に作った音による作曲が試みられた。

ポーランドのKrzysztof Pendereckiによる52の弦楽器のための作品は、1960年に作曲され、1961年に初演された。この作品は、トーンクラスター（隣り合う音を一度に鳴らして塊にする奏法）や微分音（半音より細かい音程）といった極端な奏法を多用した。当初の題は「8分37秒」を意味する数字だった。のちに、広島の犠牲者への悲しみの歌（哀歌）という題が与えられた。

György Ligetiは、ハンガリー系で、ルーマニアに生まれ、のちにオーストリアで活動した。彼は、極めて密集した声部の重なりによって、音の雲を作り出した。その作品は1968年の英米合作の映画『2001年宇宙の旅』に使われ、広く知られることになる。

1970年代初めには、パリでL'Itinéraireの作曲家たち（Grisey、Murailら）が、スペクトル（音響スペクトル分析）に基づく作曲を始めた。1977年に開所したIRCAMが、その技術面と発展を支えた。

聴衆との隔たりは、この時代を通じて、しばしば論点となってきた。大学などの制度に支えられた先端的な音楽は、一般の聴衆から遠いという批判がある。Babbittの論考は、その代表的な例とされる。

一方で1970年代以降、Arvo Pärtのように、極度に単純な素材で深い静けさを作る作曲家が現れ、大衆的成功を収めた例もある。</p>
