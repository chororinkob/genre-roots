<h1>Contemporary Classicalとは</h1>
<p>第二次世界大戦後に書かれた、西洋の芸術音楽の総称である。単一の様式ではなく、むしろ共通の語法が存在しないことこそがこの時代の特徴といえる。それでもいくつかの主要な方向がある。第一は総音列主義で、音の高さだけでなく長さ、強さ、音色ま</p>
<p>第二次世界大戦後に書かれた、西洋の芸術音楽の総称である。単一の様式ではなく、むしろ共通の語法が存在しないことこそがこの時代の特徴といえる。それでもいくつかの主要な方向がある。第一は総音列主義で、音の高さだけでなく長さ、強さ、音色までを数列によって組織し、作曲者の主観的な好みを排除しようとする試みである。第二は偶然性の音楽で、演奏の一部を演奏者の判断や偶然に委ね、作品の同一性そのものを問い直す。第三は音響の塊を扱う手法で、個々の音符ではなく、数十の声部が極めて密集して動くことで生まれる雲のような響きや、楽器の非標準的な奏法による軋み、擦れ、叩きが素材となる。第四は倍音の分析に基づく手法で、一つの音に含まれる倍音の構造を、そのまま管弦楽の和音として書き出す。第五は反復を軸とする簡素な方向である。楽譜の記法も拡張され、五線譜ではなく図形や文章による指示が用いられることもある。聴き手に快さを与えることは目的とされず、音そのものの在り方を問うことが目的とされる。</p>
<h2>成り立ち</h2><p>1945年の敗戦と大量殺戮の記憶は、ヨーロッパの若い作曲家に、それまでの文化的な伝統への根本的な不信をもたらした。ロマン派以来の情感の表現は、まさにその文化が破局を防げなかった証拠と見なされたのである。ドイツの都市ダルムシュタットで1946年から開かれた夏期講習会が、この再出発の中心となった。ここに集まったPierre Boulez、Karlheinz Stockhausen、Luigi Nonoらは、Olivier Messiaenが示した、音の全ての要素を数列で組織するという発想を極限まで推し進めた。それは主観を排した、いわば白紙からの再構築の試みだった。同時期、アメリカでは全く逆の方向が現れる。John Cageは、東洋の思想と易の占いに影響を受け、作曲者の意図そのものを排除する方向へ進んだ。1952年に発表された、演奏者が一切音を出さない作品は、音楽とは何かという問いを最も先鋭な形で突きつけた。技術の面では、1948年にパリでPierre Schaefferが、録音した現実の音を素材として構成する手法を始め、ケルンの放送局では電子的に生成した音による作曲が試みられた。1960年、ポーランドのKrzysztof Pendereckiは、52の弦楽器による極端な奏法だけで構成された作品を発表し、後に広島の犠牲者への哀歌という題を与えた。ハンガリーのGyörgy Ligetiは、極めて密集した声部の重なりによる音の雲を作り出し、その作品は1968年のアメリカのSF映画に用いられて広く知られることになる。1970年代のパリではIRCAMという研究機関が設立され、倍音の分析に基づく作曲が発展した。この時代を通じて、聴衆との断絶は最大の問題であり続けている。多くの作品が大学や公的な助成に支えられ、一般の聴き手を持たないという批判は繰り返されてきた。一方で1970年代以降、Arvo Pärtのように、極度に単純な素材によって深い静けさを作る作曲家が現れ、意外な大衆的成功を収めた例もある。</p>
<h2>代表曲</h2><ul><li>Threnody for the Victims of Hiroshima (Krzysztof Penderecki)</li><li>Atmosphères (György Ligeti)</li><li>Different Trains (Steve Reich)</li><li>Lontano (György Ligeti)</li><li>Symphony No. 3 (Henryk Górecki)</li></ul>
