<h1>Samba（サンバ）とは</h1>
<p>ブラジルを代表する打楽器主体の音楽および踊りである。拍子は2/4で、一見単純だが、その内部の分割が極めて複雑である。最も重要な楽器はスルドと呼ばれる大型の低音太鼓で、二拍目に強い一打を落とす。この、一拍目ではなく二拍目に重心が置か</p>
<p>ブラジルを代表する打楽器主体の音楽および踊りである。拍子は2/4で、一見単純だが、その内部の分割が極めて複雑である。最も重要な楽器はスルドと呼ばれる大型の低音太鼓で、二拍目に強い一打を落とす。この、一拍目ではなく二拍目に重心が置かれる構造が、身体を後ろへ引いてから前へ送り出すような独特の推進力を生む。その上にタンボリンという小型の太鼓が細かく裏拍を刻み、パンデイロという鈴付きの片面太鼓が絶え間ない細分を担う。クイーカは太鼓の内側に取り付けた棒を濡らした布で擦る楽器で、動物の鳴き声のような音を出し、この音がサンバの音色を決定づけている。加えてアゴゴという二連の鉄鐘、金属の棒で擦るレコレコが加わる。旋律を担うのは小型の四弦楽器カヴァキーニョとギターで、和声はジャズに近い豊かな響きを持つ。歌は独唱と大人数の合唱の掛け合いが基本で、聴き手も一緒に歌うことが前提とされている。テンポは形態によって大きく異なり、行進のためのものは速く、酒場で演奏されるものは緩やかである。</p>
<h2>成り立ち</h2><p>起源は19世紀末から20世紀初頭のリオデジャネイロにある。1888年の奴隷制廃止後、北東部バイーア州から解放された黒人たちが首都へ移住し、港の周辺に集住した。この一帯は小さなアフリカと呼ばれ、そこではアフリカ由来の宗教儀礼と打楽器の音楽が守られていた。中心となったのは、共同体の母として慕われた女性たちの家であり、とりわけチア・シアタと呼ばれた人物の家では、音楽家が集まって夜通し演奏する集まりが開かれていた。1917年に登録された最初のサンバとされる楽曲は、この家で生まれたと伝えられる。ただしこの音楽は当初、当局から徹底的に弾圧された。打楽器を持ち歩くこと自体が浮浪罪の証拠とされ、演奏者は逮捕された。1920年代、エスタシオ地区の作り手たちが、行進しながら演奏できるようリズムを作り替え、現代的なサンバの型が完成する。1928年には最初のサンバ学校と呼ばれる組織が結成され、居住区ごとの集団が競い合う謝肉祭の行進が制度化されていった。1930年代、政治状況が音楽の運命を変える。権力を握ったGetúlio Vargasは、国民統合の象徴としてサンバを積極的に利用し、それまで犯罪視されていた音楽が一転して国家の文化となった。この過程で、内容は当局によって管理され、労働を賛美する歌詞が奨励されるという歪みも生じている。Noel Rosaは都市の日常を洗練された言葉で描き、Cartolaは丘の上の貧民街から詩的な楽曲を生み出したが、長く忘れられ、晩年になってようやく評価された。1984年には行進のための専用会場が建築家Oscar Niemeyerの設計で建てられ、謝肉祭は巨大な観光産業となる。この商業化に対しては、貧困層の文化が資本に取り込まれたという批判が根強い。一方で1980年代以降、酒場での小規模な演奏を重んじるパゴーヂが広まり、日常の音楽としてのサンバも生き続けている。</p>
