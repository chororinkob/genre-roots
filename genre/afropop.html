<h1>Afropop（アフロポップ）とは</h1>
<p>アフリカ大陸の各地で作られる、現代的な制作技術を用いた大衆音楽の総称。単一の様式ではなく、西アフリカのハイライフやアフロビート、コンゴのスークース、南アフリカのムバカンガなど土着の音楽的資源を、電子的な打ち込みと国際的なポップスの</p>
<p>アフリカ大陸の各地で作られる、現代的な制作技術を用いた大衆音楽の総称。単一の様式ではなく、西アフリカのハイライフやアフロビート、コンゴのスークース、南アフリカのムバカンガなど土着の音楽的資源を、電子的な打ち込みと国際的なポップスの構造に接続したものを広く指す。共通する特徴として、まず複数の周期が重なるリズム構造がある。四分の四拍子の上で、キックが単純に刻む一方、パーカッションと電気ギターが互いにずれた音型を反復し、拍の感じ方が一つに定まらない。ギターは高音域で短い音型を繰り返す西アフリカ由来の奏法を引き継ぐ。ベースは太く柔らかいシンセ・ベースが担うことが多い。BPMは100〜120前後、和声は長調の四和音循環が中心で、明るく開かれた響きを持つ。歌唱はリードと合唱の掛け合いが基本で、現地語、英語、フランス語、そしてピジン英語が混在する。旋律には装飾音と滑らかな音程の移動が多く、声の質感そのものが表現の核となる。歌詞は恋愛、祝祭、社会への助言、そして都市生活の希望と困難を扱う。</p>
<h2>成り立ち</h2><p>この語は1980年代の欧米の音楽産業で、アフリカ産の現代的な大衆音楽を一括して扱うために用いられ始めた。背景には、1986年にPaul SimonがGracelandで南アフリカの音楽家と共演し世界的な成功を収めたこと、そして同時期にPeter GabrielがWOMADという野外音楽祭とレーベルReal Worldを立ち上げたことがある。これらはアフリカの音楽に国際的な注目を集めた一方、白人の音楽家がアフリカの資源を利用しているという批判も呼んだ。とりわけGracelandは、当時のアパルトヘイト体制に対する国際的な文化ボイコットを破ったとして激しく非難され、Paul Simonは国連の委員会からも問題視された。大陸内部の歴史はより長い。1960年前後の各国の独立に際して、多くの新政府が国民文化の育成を政策として掲げ、国営放送局とレコード会社が土着の音楽を録音した。ギニアのSékou Touré政権下で国が楽団を支援した例が代表的である。コンゴではFranco Luambo とTabu Ley Rochereauがルンバ・コンゴレーズを確立し、その電気ギターの語法は大陸全域に広がった。セネガルではYoussou N'Dourがムバラを、マリではSalif Keitaがマンデ族の伝統を、南アフリカではLadysmith Black Mambazoが無伴奏合唱を、それぞれ国際的な舞台へ持ち出した。1990年代以降は海賊版と経済危機によりレコード産業が壊滅した国も多く、音楽家は演奏と海外での活動に依存した。2010年代、携帯電話網の普及とYouTubeの浸透により状況は一変し、ナイジェリアとガーナのアフロビーツ、南アフリカのアマピアノが、大陸外の仲介者を通さずに世界へ届くようになった。現在、アフリカの大衆音楽は輸出産業として自立しつつある。</p>
