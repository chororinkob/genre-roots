<h1>Afropop（アフロポップ）とは</h1>
<p>アフリカ大陸の各地で作られる、現代的な制作技術を用いた大衆音楽の総称。単一の様式ではなく、西アフリカのハイライフやアフロビート、コンゴのスークース、南アフリカのムバカンガなど土着の音楽的資源を、ギターやキーボードなど西洋のポップ楽</p>
<p>アフリカ大陸の各地で作られる、現代的な制作技術を用いた大衆音楽の総称。単一の様式ではなく、西アフリカのハイライフやアフロビート、コンゴのスークース、南アフリカのムバカンガなど土着の音楽的資源を、ギターやキーボードなど西洋のポップ楽器と組み合わせた大衆音楽を広く指す。共通する特徴として、まず複数の周期が重なるリズム構造がある。4分の4拍子の上で、キックが単純に刻む一方、パーカッションと電気ギターが互いにずれた音型を反復し、拍の感じ方が一つに定まらない。ギターは高音域で短い音型を繰り返す西アフリカ由来の奏法を引き継ぐ。テンポや編成は、ムバラ、スークース、ムバカンガなどで大きく異なる。歌唱はリードと合唱の掛け合いが基本で、現地語、英語、フランス語、そしてピジン英語が混在する。旋律には装飾音と滑らかな音程の移動が多く、声の質感そのものが表現の核となる。歌詞は恋愛、祝祭、社会への助言、そして都市生活の希望と困難を扱う。</p>
<h2>成り立ち</h2><p>この語は1980年代に欧米の音楽産業で、アフリカ産の現代的な大衆音楽を一括して扱うために使われ、1987年に「ワールドミュージック」の呼称が作られると、その中に統合されていった(誰がいつ作った語かを特定した資料は確認できていない)。背景には、1986年にPaul SimonがGracelandで南アフリカの音楽家と共演し世界的な成功を収めたこと、そして前後する時期に、Peter Gabrielが1980年にWOMADという野外音楽祭を設立し(初開催は1982年)、1989年にレーベルReal Worldを設立したことがある。これらはアフリカの音楽に国際的な注目を集めた一方、白人の音楽家がアフリカの資源を利用しているという批判も呼んだ。とりわけGracelandは、当時のアパルトヘイト体制に対する国際的な文化ボイコットを破ったとして激しく非難され、Paul Simonは国連の反アパルトヘイト特別委員会の登録簿に載ったが、1987年に外された。ただしSimon自身は登録されていないと主張しており、経緯には食い違いがある。大陸内部の歴史はより長い。1960年前後の各国の独立に際して、多くの新政府が国民文化の育成を政策として掲げ、国営放送局とレコード会社が土着の音楽を録音した。ギニアのSékou Touré政権下で国が楽団を支援した例が代表的である。コンゴでは、Paul KambaやWendo Kolosoyらが形成期を担ったルンバ・コンゴレーズを、Franco LuamboとTabu Ley Rochereauが発展させ、その電気ギターの語法は大陸全域に広がった。セネガルではYoussou N'Dourがムバラを、マリではSalif Keitaがマンデ族の伝統を、南アフリカではLadysmith Black Mambazoが無伴奏合唱を、それぞれ国際的な舞台へ持ち出した。1970年代後半から1980年代にかけて、経済危機とカセットの海賊版によりレコード産業が崩壊した国があり(ガーナ、ナイジェリアなど)、音楽家は演奏と海外での活動に依存した。2010年代、携帯電話網の普及とYouTubeの浸透により状況は一変し、ナイジェリアとガーナのアフロビーツ、南アフリカのアマピアノが、ストリーミングやYouTubeなどを通じて、従来の大手レーベルを介さずに世界へ届く流れが広がった。現在、アフリカの大衆音楽は輸出産業として自立しつつある。</p>
