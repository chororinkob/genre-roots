<h1>Afropop（アフロポップ）とは</h1>
<p>アフリカ大陸の各地で作られる、現代的な制作技術を使った大衆音楽の総称だ。単一のスタイルではない。西アフリカのハイライフやアフロビート、コンゴのスークース、南アフリカのムバカンガなど、その土地の音楽の蓄えを、ギターやキーボードなど西</p>
<p>アフリカ大陸の各地で作られる、現代的な制作技術を使った大衆音楽の総称だ。単一のスタイルではない。西アフリカのハイライフやアフロビート、コンゴのスークース、南アフリカのムバカンガなど、その土地の音楽の蓄えを、ギターやキーボードなど西洋のポップの楽器と組み合わせた大衆音楽を、広く指す。

共通する特徴として、まず、複数のリズムの周期が重なり合う仕組みがある。拍子は、ハイライフなど一部のジャンルでは4分の4拍子が基本だが、スークースは8分の12拍子が典型で、全体に共通するものとは言えない。キックが単純に刻む一方で、パーカッションと電気ギターが互いにずれたフレーズをくり返し、拍の感じ方が一つに定まらない。

ギターは、コンゴ系では、キューバのguajeoを電気ギターに移した奏法が中心だ。西アフリカでは、指で弾くパームワインやハイライフ系の奏法がある。テンポや編成は、ムバラ、スークース、ムバカンガなどで大きく異なる。

歌は、リードと合唱の掛け合いが基本だ。言葉は、現地の言葉、英語、フランス語、そしてピジン英語が混ざり合う。メロディーには、しばしば細かい飾りの音と、なめらかな音程の動きが多く見られ、多くの場合、声の質感そのものが表現の中心になる。歌詞は、多くの場合、恋愛、祝祭、社会への助言、そして都市生活の希望と困難を扱う。</p>
<h2>成り立ち</h2><p>「アフロポップ」という呼び名は、1980年代に欧米の音楽業界で使われた。アフリカ生まれの現代的な大衆音楽を、ひとまとめに扱うためだ(誰がいつ作った語かは、はっきりしていない)。1987年には、インディーズ・レーベル関係者の会合で、売り込みのための統一名称として「ワールドミュージック」が選ばれた。

背景には、まず、1986年にPaul SimonがGracelandで南アフリカの音楽家と共演し、世界的な成功を収めたことがある。また、前後する時期に、Peter Gabrielらが1980年にWOMADという野外音楽祭を設立し(初開催は1982年)、1989年にはレーベルReal World Recordsを設立したこともある。

これらは、アフリカの音楽に国際的な注目を集めた。一方でGracelandは、ほかの文化の音楽を流用したという批判を受けた。さらに、当時のアパルトヘイト体制に対する国際的な文化ボイコットを破ったとして、激しく非難された。Paul Simonは国連の反アパルトヘイト特別委員会の登録簿に載ったが、1987年に外された。ただしSimon自身は登録されていないと主張しており、経緯には食い違いがある。

しかし、大陸の内側の歴史はもっと長い。1960年前後に各国が独立すると、多くの新しい政府が、国民文化を育てることを政策に掲げた。国営の放送局とレコード会社が、その土地の音楽を録音した。代表的なのが、ギニアのSékou Touré政権のもとで、国が楽団を支援した例だ。

コンゴ川両岸（ブラザヴィルとキンシャサ）では、Paul KambaやWendo Kolosoyらが形づくったルンバ・コンゴレーズを、Franco LuamboとTabu Ley Rochereauが発展させた。その電気ギターの弾き方は、中部・東部・南部・西部アフリカに広がった。セネガルではYoussou N'Dourがムバラを、マリではSalif Keitaがマンデ族の伝統を、南アフリカではLadysmith Black Mambazoが無伴奏の合唱を、それぞれ国際的な舞台へ持ち出した。

一方、ガーナでは1970年代後半に、経済と政治の混乱でレコード産業とライブの場が崩れた。ナイジェリアでも、1980年代半ばにレコード産業が崩壊した。その後は、カセットと海賊版が主流になった。ガーナの音楽家の一部は、国外のドイツや英国へ移った。

2010年代、携帯電話網の普及とYouTubeの浸透で、状況は一変した。ナイジェリアとガーナのアフロビーツ、南アフリカのアマピアノが、ストリーミングやYouTubeを通じて、国際的な認知を広げた。その一方で、Sony、Warner、Universalなどの大手が、2010年代後半から契約や投資を進めた。現在、アフリカの大衆音楽の国際的な認知は高まったが、最大の市場は国内にあるとの見方もある。</p>
