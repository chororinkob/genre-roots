<h1>P-Funk（ピーファンク）とは</h1>
<p>George Clintonを中心とする集団が1970年代に作り上げた、ファンクの拡張版とも言うべき音楽である。リズムの基礎は、一拍目を全員で強烈に打つという原則で、その一撃に向かって全ての楽器が収束し、そこから次の小節までを自由</p>
<p>George Clintonを中心とする集団が1970年代に作り上げた、ファンクの拡張版とも言うべき音楽である。リズムの基礎は、一拍目を全員で強烈に打つという原則で、その一撃に向かって全ての楽器が収束し、そこから次の小節までを自由に埋めていく。ドラムは複雑さより粘りを重視し、ベースは弦を叩き引っ張る奏法によって、旋律と打楽器の両方の役割を同時に担う。この分野の最大の発明は低音域のシンセサイザーの用い方で、鍵盤奏者がアナログの単音シンセを用いて、これまでにない太く弾力のある低音の音型を作り出した。加えて、口にくわえた管を通してギターや鍵盤の音を発声器官で加工し、楽器に喋らせる装置が多用される。ギターは歪ませたロック的な独奏を長時間展開することもあり、サイケデリック・ロックとの境界は意図的に曖昧にされている。管楽器はJames Brownの一派から加わった名手が担い、鋭い斉奏で場面を切り替える。歌は多人数による掛け合いと合唱が中心で、旋律より合言葉の反復が重視される。曲は10分を超えることも多く、歌詞は宇宙船、架空の博士、ファンクを持たない敵といったSF的な神話体系を語る。</p>
<h2>成り立ち</h2><p>出発点は1950年代末、アメリカ・ニュージャージー州の理髪店である。そこで働いていたGeorge Clintonが店の仲間と組んだ合唱団がThe Parliamentsであり、1967年に一度ヒットを出した。しかしレコード会社との紛争によりその名を使用できなくなったため、彼はバンドの演奏者だけを引き連れて、Funkadelicという別名義で活動を始めた。この名義では、ロックの轟音とサイケデリックな実験を全面に出し、1971年の作品では、ギタリストEddie Hazelに、自分の母親が死んだと想像して弾けと指示して録音された10分間の独奏が残されている。この演奏は現在もロック史上屈指のものとして語られる。やがて名称の権利を取り戻すと、彼は同じ人員でParliamentという名義も並行させ、こちらでは管楽器と合唱を厚くした、より祝祭的で商業的な音楽を作った。二つの名義を使い分けて同じ集団が別の顔を持つという構造自体が、この一派の特異さを示している。1972年にJames Brownのもとを離れたBootsy Collinsが加わり、鍵盤のBernie Worrellが理論的な支柱となる。1975年に発表されたマザーシップ・コネクションは、宇宙船に乗った黒人が地球にファンクをもたらすという物語を提示し、アフロフューチャリズムと呼ばれる思想の代表例となった。抑圧された現実の代わりに宇宙的な神話を用意するという発想は、後の黒人文化に広く受け継がれている。舞台では実際に巨大な宇宙船の模型が降下する演出が行われ、その複製は後に国立の博物館に収蔵された。1978年の作品では、国家という語をファンクの旗のもとに読み替えた楽曲が大きな成功を収める。しかし1980年代に入ると、集団の肥大化と薬物、そして権利関係の混乱によって組織は崩壊した。George Clintonは以後、自らの作品の著作権をめぐって数十年にわたる法廷闘争を強いられている。皮肉なことに、彼らの音源は1990年代のGファンクによって膨大に引用され、その世代の成功を支えることになった。</p>
<h2>代表曲</h2><ul><li>Mothership Connection (Parliament)</li><li>One Nation Under a Groove (Funkadelic)</li><li>Atomic Dog (George Clinton)</li></ul>
