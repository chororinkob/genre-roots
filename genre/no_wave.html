<h1>No Wave（ノー・ウェイブ）とは</h1>
<p>ノー・ウェイブは、ノイズや不協和音、無調を試し、旋律よりテクスチャーを重視する傾向のある音楽だ。ただし、一括りにはできない。ポスト・パンクの一派、あるいは隣接するシーンとされることが多い。 楽器編成は、エレクトリック・ギター、ベー</p>
<p>ノー・ウェイブは、ノイズや不協和音、無調を試し、旋律よりテクスチャーを重視する傾向のある音楽だ。ただし、一括りにはできない。ポスト・パンクの一派、あるいは隣接するシーンとされることが多い。

楽器編成は、エレクトリック・ギター、ベース、ドラムという基本的なロックの編成が多い。だが、弾き方は根本から違う。ギターはコードを押さえない。弦をこするスクラッチ奏法、ボトルネック（金属やガラスの筒）を使ったスライド奏法、弦を叩く打楽器のような奏法がよく使われる。コントーションズのジェームズ・チャンスのアルト・サックスのように、サックスを使うバンドもある。その音は、フリー・ジャズのような咆哮や、倍音（高い音の成分）の多い歪んだ音色だ。

コード進行は薄い。単音のリフや不協和音の塊が延々と繰り返されるか、突然断ち切られるバンドが多い。音階も、西洋の長調・短調の枠組みを拒む。半音階による不快感が、わざと使われる。

ドラムはタイトなビートを刻まない。単調で反復的なものから、DNA や Mars のように変則的なものまで幅がある。テンポは遅い曲も速い曲もある。多くのバンドは、緊張感と不安定さを保つことを優先する。一方で、Contortionsのようにファンクやダンスの要素を持つバンドもある。

歌い方は、語りかけるような単調な朗読、叫び、うめき声、完全に無感情な棒読みなど、さまざまだ。ただ、どれも歌の「美しさ」を求めない点で共通している。

歌詞のテーマは、都市の荒廃、疎外感、暴力、性、ニヒリズム（すべてに価値を認めない考え方）だ。短く鋭く、シュールで断片的な言葉が多い。

フリー・ジャズとの共通点は、不協和音を使うことだ。即興のように聞こえるが、実際は入念に練習された反復が多かった。コントーションズのように、ジャズ・ファンクを取り込むバンドもあった。

この音楽は主に、ニューヨークのダウンタウン（トライベッカ、イースト・ヴィレッジ、ソーホー、ロウアー・イースト・サイド等）の小さなロフトやクラブで演奏された。観客と演奏者が同じ空間に密集した中で、体験されるものだった。</p>
<h2>成り立ち</h2><p>ノー・ウェイブは1970年代後半（早いバンドは1975年）、ニューヨーク市マンハッタンの、特にダウンタウン（トライベッカ、イースト・ヴィレッジ、ソーホー、ロウアー・イースト・サイド等）を中心に生まれた。

当時のニューヨークは、財政破綻の瀬戸際にあった。ブロンクスでは放火や放棄で多くの建物が失われ、タイムズ・スクエアは犯罪と売春の温床になっていた。この荒れた都市の環境が、ノー・ウェイブの虚無的で攻撃的な考え方の背景として挙げられる。

そのころ、CBGBやマックス・カンザス・シティといったクラブでは、パンクとニュー・ウェイブの世界が花開いていた。ノー・ウェイブという名は、それへの反発として、「ニュー・ウェイブ」の商業主義を拒むものとして呼ばれた。ただし、名前の由来ははっきりせず、諸説ある。

この世界の中心人物の一人が、リディア・ランチだ。彼女はティーンエイジ・ジーザス・アンド・ザ・ジャークスを率いた。1978年の最初のシングル盤などで、スライド奏法のギター（ナイフ・瓶を使用）と単音リフ、叫ぶようなボーカルによる、極限まで削ぎ落とされたサウンドを示した。

同じく重要なのが、ジェームズ・チャンスだ。彼はコントーションズを結成し、フリー・ジャズの不協和音とファンクのリズムを混ぜ合わせた、独自のスタイルを固めた。チャンスは、ステージで観客に突進したり殴りかかったりして悪名を馳せた。1978年には、Artists Space でのライブ中に、評論家ロバート・クリストガウに襲いかかっている。

DNA（アート・リンゼイ、ロビン・クラッチフィールド、森郁恵によるトリオ）は、アート・リンゼイの無調的・金属的なギターで知られる。マーズもまた、角張った作曲から自由なノイズ即興へ向かう、不条理な歌詞と型破りなドラムの独特のサウンドで、この世界に貢献した。

ブライアン・イーノがプロデュースした1978年のコンピレーション・アルバム『No New York』は、「シーンの決定的な記録」と評価される。ただし、収録されたのは4バンドのみだ。イーノは、ロキシー・ミュージックやデヴィッド・ボウイとの仕事で知られていた。このアルバムでは、ティーンエイジ・ジーザス・アンド・ザ・ジャークス、コントーションズ、DNA、マーズの4バンドを収録し、ノー・ウェイブという現象を世界に向けて定義した。アルバムはAntilles Recordsからリリースされた。

この世界を支えた場としては、マッド・クラブ（1978〜83年）やCBGB、マックス・カンザス・シティ、Tier 3、Colabなどの会場やロフト・スペースが重要だった。ソーホーのアート・ギャラリーとの結びつきも強かった。ノー・ウェイブは、ビジュアル・アート、実験映画、パフォーマンス・アートと深く絡み合っていた。ベス・B、スコット・B、エイモス・ポー、エリック・ミッチェルらが作ったスーパー8フィルムは、ノー・ウェイブ・シネマと呼ばれる。これらは音楽と同じように、商業映画の作り方の決まりを拒んだ。この流れは、のちのニック・ゼッドらによる運動にも影響した。

全盛期は、一般には1976〜1980年ごろの短い期間とされ、多くのバンドは数年で解散した。それでも、その影響は広く及んだ。ソニック・ユースは、ノー・ウェイブの不協和音とオルタナティヴ・チューニング（ふつうとは違う弦の合わせ方）の実験を受け継いだ。そして、1980年代のノイズ・ロックとオルタナティヴ・ロックへの橋渡しをした。スワンズは、ニューヨークのノー・ウェイブの世界から現れた数少ないバンドの一つである。2000年代には、DFAレコーズが代名詞的な存在となったダンス・パンクの再燃が起き、ラプチャーなどのバンドが登場した。</p>
<h2>代表曲</h2><ul><li>Contort Yourself (James Chance and the Contortions)</li><li>Not Moving (DNA)</li><li>Lesson No. 2 (Glenn Branca)</li><li>Design to Kill (James Chance and the Contortions)</li><li>Wawa (Lizzy Mercier Descloux)</li><li>Orphans (Teenage Jesus and the Jerks)</li><li>Throw Me Away (James Chance and the Contortions)</li><li>Burning Rubber (Teenage Jesus and the Jerks)</li><li>Structure (Glenn Branca)</li><li>Lionel (DNA)</li><li>The Closet (Teenage Jesus and the Jerks)</li><li>Fire (Lizzy Mercier Descloux)</li></ul>
