<h1>No Wave（ノー・ウェイブ）とは</h1>
<p>ノー・ウェイブは、メロディーや和声の概念そのものを意図的に破壊することを美学の核心に置いたジャンルだ。コード進行が薄く、単音のリフや不協和音の塊が延々と繰り返されるか、あるいは突然断ち切られるバンドが多い。音階も西洋的な長調・短調</p>
<p>ノー・ウェイブは、メロディーや和声の概念そのものを意図的に破壊することを美学の核心に置いたジャンルだ。コード進行が薄く、単音のリフや不協和音の塊が延々と繰り返されるか、あるいは突然断ち切られるバンドが多い。音階も西洋的な長調・短調の枠組みを拒絶し、半音階的な不快感や微分音的なずれが意図的に用いられる。楽器編成はエレクトリック・ギター、ベース、ドラムという基本的なロック編成が多いが、その奏法は根本から異なる。ギターはコードを押さえるのではなく、ブリッジ付近で弦を引っ掻くスクラッチ奏法や、ボトルネックを使ったスライド奏法、あるいは弦を叩くパーカッシブな奏法が多用される。アルト・サックスやテナー・サックスが加わる場合も多く、フリー・ジャズ的な咆哮や倍音の多い歪んだ音色で演奏される。ドラムはタイトなビートを刻むのではなく、不規則なアクセントを持つポリリズム的なパターンや、ほぼ打楽器的な単調な反復が特徴だ。テンポは遅い場合も速い場合もあり、多くのバンドでは緊張感と不安定さを維持することが優先されるが、Contortionsのようにファンクやダンスの要素を持つバンドもある。音響的には、ディストーションは使われるものの、ヘヴィ・メタルのような分厚い歪みではなく、薄くざらついた、まるでテープが劣化したような質感のものが好まれる。リバーブはほとんど使われず、乾いた直接音が剥き出しのまま録音される。ボーカルスタイルは語りかけるような単調な朗読、叫び、呻き、あるいは完全な無感情の棒読みなど多様だが、いずれも歌唱の「美しさ」を追求しない点で共通している。歌詞は都市の荒廃、疎外感、暴力、性、ニヒリズムを主題とし、詩的な修辞よりも直截的な言語が選ばれる。ポスト・パンクとの違いは、ポスト・パンクがパンクの精神を継承しながらも新たな音楽的語法を模索したのに対し、ノー・ウェイブは音楽的語法そのものの否定を出発点とする点にある。フリー・ジャズとの共通点は即興性と不協和音の使用だが、ノー・ウェイブはジャズの演奏技術や伝統的な即興の文法すら拒絶する。この音楽は主にニューヨークのロウアー・イースト・サイドやソーホーの小さなロフトやクラブで演奏され、観客と演奏者が同じ空間に密集した状況で体験されるものだった。</p>
<h2>成り立ち</h2><p>ノー・ウェイブは1975年から1978年ごろにかけて、ニューヨーク市のマンハッタン、特にロウアー・イースト・サイドとソーホー地区を中心に誕生した。当時のニューヨークは財政破綻の瀬戸際にあり、ブロンクスでは放火による建物の崩壊が相次ぎ、タイムズ・スクエアは犯罪と売春の温床となっていた。この荒廃した都市環境が、ノー・ウェイブの虚無的かつ攻撃的な美学の直接的な土壌となった。CBGBやマックス's・カンザス・シティといったクラブで花開いたパンクとニュー・ウェイブのシーンに対する反動として、ノー・ウェイブは「ウェイブ（波）」すら否定するという姿勢を名称に込めた。

シーンの中心人物の一人はリディア・ランチで、彼女はティーンエイジ・ジーザス・アンド・ザ・ジャークスを率い、1978年の最初のシングル盤などで、スクラッチ・ギターと単音リフ、感情を排したボーカルによる極限まで削ぎ落とされたサウンドを提示した。同じく重要な存在がジェームズ・チャンスで、彼はコントーションズを結成し、フリー・ジャズの不協和音とファンクのリズムを融合させた独自のスタイルを確立した。チャンスはステージ上で観客に突進したり殴りかかったりする行為で悪名を馳せ、音楽と暴力の境界を意図的に曖昧にした。DNA（アート・リンゼイ、ロビン・クラッチフィールド、森郁恵によるトリオ）は、アート・リンゼイのギターがほぼ音程を持たない金属的な雑音として機能し、最も過激な音響実験を行ったグループとして知られる。マーズもまた、角張った作曲から自由なノイズ即興へ向かう、不条理な歌詞と型破りなドラムの独特のサウンドでシーンに貢献した。

これらのバンドを一堂に集めた決定的なドキュメントが、ブライアン・イーノがプロデュースした1978年のコンピレーション・アルバム『No New York』だ。イーノはロキシー・ミュージックやデヴィッド・ボウイとの仕事で知られていたが、このアルバムではティーンエイジ・ジーザス・アンド・ザ・ジャークス、コントーションズ、DNA、マーズの4バンドを収録し、ノー・ウェイブという現象を世界に向けて定義した。アルバムはAntilles Recordsからリリースされ、商業的な成功とは無縁だったが、後世への影響は計り知れない。

シーンを支えた場としては、マッド・クラブ（1978〜83年）やCBGB、マックス's、Tier 3、Colabなどの会場やロフト・スペースが重要だった。また、ソーホーのアート・ギャラリーとの結びつきも強く、ノー・ウェイブはビジュアル・アート、実験映画、パフォーマンス・アートと密接に絡み合っていた。ベス・B、スコット・B、エイモス・ポー、エリック・ミッチェルらが制作したスーパー8フィルムはノー・ウェイブ・シネマと呼ばれ、音楽と同様に商業的な映画文法を拒絶した。この流れは、のちのニック・ゼッドらによる運動にも影響した。

ノー・ウェイブの全盛期は1976年から1982年頃までと短く、多くのバンドは数年で解散した。しかしその影響は広範に及んだ。ソニック・ユースはノー・ウェイブの不協和音とオルタナティヴ・チューニングの実験を継承し、1980年代のノイズ・ロックとオルタナティヴ・ロックへの橋渡しをした。スワンズは、ニューヨークのノー・ウェイブのシーンから現れた数少ないバンドの一つである。2000年代にはDFAレコーズを中心としたダンス・パンクのリバイバルが起き、ラプチャーなどのバンドが登場した。</p>
<h2>代表曲</h2><ul><li>Contort Yourself (James Chance and the Contortions)</li><li>Not Moving (DNA)</li><li>Lesson No. 2 (Glenn Branca)</li><li>Design to Kill (James Chance and the Contortions)</li><li>Wawa (Lizzy Mercier Descloux)</li><li>Orphans (Teenage Jesus and the Jerks)</li><li>Throw Me Away (James Chance and the Contortions)</li><li>Burning Rubber (Teenage Jesus and the Jerks)</li><li>Structure (Glenn Branca)</li><li>Lionel (DNA)</li><li>The Closet (Teenage Jesus and the Jerks)</li><li>Fire (Lizzy Mercier Descloux)</li></ul>
