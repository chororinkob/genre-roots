<h1>No Wave（ノー・ウェイブ）とは</h1>
<p>ノー・ウェイブは、メロディーや和声の概念そのものを意図的に破壊することを美学の核心に置いたジャンルだ。コード進行はほぼ存在せず、単音のリフや不協和音の塊が延々と繰り返されるか、あるいは突然断ち切られる。音階も西洋的な長調・短調の枠</p>
<p>ノー・ウェイブは、メロディーや和声の概念そのものを意図的に破壊することを美学の核心に置いたジャンルだ。コード進行はほぼ存在せず、単音のリフや不協和音の塊が延々と繰り返されるか、あるいは突然断ち切られる。音階も西洋的な長調・短調の枠組みを拒絶し、半音階的な不快感や微分音的なずれが意図的に用いられる。楽器編成はエレクトリック・ギター、ベース、ドラムという基本的なロック編成が多いが、その奏法は根本から異なる。ギターはコードを押さえるのではなく、ブリッジ付近で弦を引っ掻くスクラッチ奏法や、ボトルネックを使ったスライド奏法、あるいは弦を叩くパーカッシブな奏法が多用される。アルト・サックスやテナー・サックスが加わる場合も多く、フリー・ジャズ的な咆哮や倍音の多い歪んだ音色で演奏される。ドラムはタイトなビートを刻むのではなく、不規則なアクセントを持つポリリズム的なパターンや、ほぼ打楽器的な単調な反復が特徴だ。テンポは遅い場合も速い場合もあるが、一定のグルーヴを生み出すことよりも、緊張感と不安定さを維持することが優先される。音響的には、ディストーションは使われるものの、ヘヴィ・メタルのような分厚い歪みではなく、薄くざらついた、まるでテープが劣化したような質感のものが好まれる。リバーブはほとんど使われず、乾いた直接音が剥き出しのまま録音される。ボーカルスタイルは語りかけるような単調な朗読、叫び、呻き、あるいは完全な無感情の棒読みなど多様だが、いずれも歌唱の「美しさ」を追求しない点で共通している。歌詞は都市の荒廃、疎外感、暴力、性、ニヒリズムを主題とし、詩的な修辞よりも直截的な言語が選ばれる。ポスト・パンクとの違いは、ポスト・パンクがパンクの精神を継承しながらも新たな音楽的語法を模索したのに対し、ノー・ウェイブは音楽的語法そのものの否定を出発点とする点にある。フリー・ジャズとの共通点は即興性と不協和音の使用だが、ノー・ウェイブはジャズの演奏技術や伝統的な即興の文法すら拒絶する。この音楽は主にニューヨークのロウアー・イースト・サイドやソーホーの小さなロフトやクラブで演奏され、観客と演奏者が同じ空間に密集した状況で体験されるものだった。</p>
<h2>成り立ち</h2><p>ノー・ウェイブは1976年から1978年にかけて、ニューヨーク市のマンハッタン、特にロウアー・イースト・サイドとソーホー地区を中心に誕生した。当時のニューヨークは財政破綻の瀬戸際にあり、ブロンクスでは放火による建物の崩壊が相次ぎ、タイムズ・スクエアは犯罪と売春の温床となっていた。この荒廃した都市環境が、ノー・ウェイブの虚無的かつ攻撃的な美学の直接的な土壌となった。CBGBやマックス's・カンザス・シティといったクラブで花開いたパンクとニュー・ウェイブのシーンに対する反動として、ノー・ウェイブは「ウェイブ（波）」すら否定するという姿勢を名称に込めた。

シーンの中心人物の一人はリディア・ランチで、彼女はティーンエイジ・ジーザス・アンド・ザ・ジャークスを率い、1979年のデビュー・アルバム『Teenage Jesus and the Jerks』で、スクラッチ・ギターと単音リフ、感情を排したボーカルによる極限まで削ぎ落とされたサウンドを提示した。同じく重要な存在がジェームズ・チャンスで、彼はコントーションズを結成し、フリー・ジャズの不協和音とファンクのリズムを融合させた独自のスタイルを確立した。チャンスはステージ上で観客に突進したり殴りかかったりする行為で悪名を馳せ、音楽と暴力の境界を意図的に曖昧にした。DNA（ダフネ・ゴッドフリー、イク・ヤード、アート・リンゼイによるトリオ）は、アート・リンゼイのギターがほぼ音程を持たない金属的な雑音として機能し、最も過激な音響実験を行ったグループとして知られる。マーズもまた、ドローン的な反復と突発的な爆発を組み合わせた独特のサウンドでシーンに貢献した。

これらのバンドを一堂に集めた決定的なドキュメントが、ブライアン・イーノがプロデュースした1978年のコンピレーション・アルバム『No New York』だ。イーノはロキシー・ミュージックやデヴィッド・ボウイとの仕事で知られていたが、このアルバムではティーンエイジ・ジーザス・アンド・ザ・ジャークス、コントーションズ、DNA、マーズの4バンドを収録し、ノー・ウェイブという現象を世界に向けて定義した。アルバムはAntilles Recordsからリリースされ、商業的な成功とは無縁だったが、後世への影響は計り知れない。

シーンを支えた場としては、ダンス・テリア、ザ・ファンキー・ヴァーミン、ロフト・スペースなどの非公式な会場が重要だった。また、ソーホーのアート・ギャラリーとの結びつきも強く、ノー・ウェイブはビジュアル・アート、実験映画、パフォーマンス・アートと密接に絡み合っていた。ニック・ザノとベス・B、スコット・Bらが制作したスーパー8フィルムはノー・ウェイブ・シネマと呼ばれ、音楽と同様に商業的な映画文法を拒絶した。

ノー・ウェイブの全盛期は1976年から1982年頃までと短く、多くのバンドは数年で解散した。しかしその影響は広範に及んだ。ソニック・ユースはノー・ウェイブの不協和音とオルタナティヴ・チューニングの実験を継承し、1980年代のノイズ・ロックとオルタナティヴ・ロックへの橋渡しをした。キルドーザー、スワンズ、バースデイ・パーティーなどのバンドもノー・ウェイブの精神的後継者として位置づけられる。日本ではノイズ・ミュージックのシーンに影響を与え、灰野敬二や非常階段などのアーティストとの親和性が指摘される。1990年代以降もマス・ロックやポスト・ロックのシーンにおいて、ノー・ウェイブの反メロディー的な姿勢と不規則なリズム構造は参照され続けている。2000年代にはDFAレコーズを中心としたダンス・パンク・リバイバルがノー・ウェイブを再評価し、ライコニングやラプチャーなどのバンドがその遺産を現代的な文脈で再解釈した。</p>
