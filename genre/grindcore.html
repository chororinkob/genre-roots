<h1>Grindcore（グラインドコア）とは</h1>
<p>グラインドコアは、極限まで短く速く圧縮された、メタルとハードコア・パンクの合流点だ。 ダウンチューニングのギターが、パワーコードを強く歪ませて刻む。奏法は速さが優先され、旋律的な要素はほとんど存在しない。ベースも歪ませることが多い</p>
<p>グラインドコアは、極限まで短く速く圧縮された、メタルとハードコア・パンクの合流点だ。

ダウンチューニングのギターが、パワーコードを強く歪ませて刻む。奏法は速さが優先され、旋律的な要素はほとんど存在しない。ベースも歪ませることが多い。

ドラムはブラストビートが主軸である。16分音符を、キック・スネアとシンバルに均等に割り振り、極めて高速で打ち続ける技法だ。典型的なブラストビートは、16分音符で180〜280BPMになる。上限は250BPM程度がより一般的とされる。拍の感覚は消え、音の壁だけが残る。

歌唱は、2種類の対比が定番だ。喉を締めて低く唸るグロウルと、極端に高く裂けるスクリームを交互に用いる。

歌詞は、大きく二つの系統に分かれる。一つは、政治的な主題を扱う系統だ。資本主義批判、動物の権利、環境破壊、軍事主義への告発などである。もう一つは、医学的な人体描写やゴア表現（血や肉体の損壊を描く表現）を扱う系統だ。前者はパンク由来、後者はホラー由来の系譜である。

最大の構造的特徴は、曲の短さだ。微小曲（microsong）が特徴で、数秒の曲もある。典型は1分前後〜2分程度である。代表作のScumは、28曲を収録している。</p>
<h2>成り立ち</h2><p>舞台は、1980年代半ばのイギリスだ。バーミンガムのシーンから登場した。

母体は二つあった。一つは、1980年代前半のイギリスの、Crassらのアナーコ・パンクと、DischargeらUK82系ハードコアの両方が持っていた政治的な急進性だ。Dischargeにちなむ特定のドラムパターンであるディービート（Discharge由来の、ハードコア・パンクの基本ドラムパターンで、4/4で記譜される）は、この分野の基礎的な要素となった。

もう一つが、決定的な存在のNapalm Deathだ。1981年に結成された彼らは、ハードコア・パンクの速度をさらに押し上げた。1987年のアルバムScumで、スタイルを固めた。同作は両面で構成員が大きく入れ替わり、共通するのはドラマーのMick Harrisだけという異例の作りだった。A面は1986年8月、B面は1987年5月に録音された。ドラマーのMick Harrisは、この高速の連打をブラストビートと名付けたとされる。

同作に収録された曲You Sufferは、約1.3秒の極端に短い曲として知られる。ギネスに載ったとされるのは、曲そのものが「最短の録音曲（1.316秒）」という点である。「最短MV」のギネスは、Brutal Truthの「Collateral Damage」（2.18秒）が2001年に認定されたと記されている。

並行して、イプスウィッチのExtreme Noise Terrorやリヴァプールの Carcassが活動した。後者は医学書の用語を歌詞に用いるという独自の路線を開き、ゴアグラインドと呼ばれる系統を生んだ。米国側ではRepulsionが、1986年に同様の音を独自に作り出していた。Brutal Truthが1990年代に継承した。日本ではS.O.B.が早くから活動し、Napalm Deathとの交流を通じて国際的に知られた。

産業構造としては、1985年にノッティンガムで設立されたレーベルEarache Recordsが、1980年代末から1990年代半ばにかけて、グラインドコアとデスメタルの重要作を出した。この音楽は当初から商業的な成功を目指しておらず、演奏の場も小規模な自主運営の会場が中心だったとされる。しかし1987年、BBCのラジオDJ John Peelが強い関心を示し、番組で繰り返し放送した。これにより、予想外の広がりを得た。</p>
