<h1>Grindcore（グラインドコア）とは</h1>
<p>極限まで短く速く圧縮された、メタルとハードコア・パンクの合流点。BPMは実質的に測定困難なほど速く、ドラムはブラストビート、すなわちスネアとバスドラムを交互に極めて高速で打ち続ける技法を主軸とする。この速度は一分あたり250から3</p>
<p>極限まで短く速く圧縮された、メタルとハードコア・パンクの合流点。BPMは実質的に測定困難なほど速く、ドラムはブラストビート、すなわちスネアとバスドラムを交互に極めて高速で打ち続ける技法を主軸とする。この速度は一分あたり250から300を超えることもあり、拍の感覚は消え、音の壁だけが残る。ギターは低い調弦で歪ませ、和音というより騒音に近い塊を刻む。奏法は速さが優先され、旋律的な要素はほとんど存在しない。ベースはしばしば極端に歪ませ、ギターと区別がつかない。最大の構造的特徴は曲の短さで、多くが30秒から一分半、時に数秒で終わる。アルバム一枚に30曲から50曲が収録されることも珍しくない。歌唱は二種類の対比が定番で、喉を締めて低く唸るグロウルと、極端に高く裂けるスクリームを交互に用いる。歌詞は政治的な主題、すなわち資本主義批判、動物の権利、環境破壊、軍事主義への告発を扱う系統と、医学的な人体描写やゴア表現を扱う系統に大別される。前者はパンク由来、後者はホラー由来の系譜である。</p>
<h2>成り立ち</h2><p>1980年代半ばのイギリス、バーミンガム近郊で生まれた。決定的な存在はNapalm Deathで、1981年に結成された彼らは、ハードコア・パンクの速度をさらに押し上げ、1987年のアルバムScumで様式を確立した。同作は前半と後半で構成員が全く異なるという異例の作りで、レコードの片面ずつ別々の時期に録音された。ドラマーのMick Harrisは、この高速の連打をブラストビートと名付けたとされる。同作に収録された曲You Sufferは一秒あまりの長さで、世界最短の楽曲としてギネス世界記録に登録された。もう一つの母体は、1980年代前半のイギリスのアナーコ・パンク、とりわけCrassやDischargeが持っていた政治的な急進性である。Discharge が確立したディービートと呼ばれる速い二拍子の刻みは、この分野の基礎的な語彙となった。並行してExtreme Noise TerrorやCarcassが同地域で活動し、後者は医学書の用語を歌詞に用いるという独自の路線を開き、ゴアグラインドと呼ばれる系統を生んだ。米国側ではRepulsionが1986年に同様の音を独自に作り出しており、Brutal Truthが1990年代に継承した。日本ではS.O.B.が早くから活動し、Napalm Deathとの交流を通じて国際的に知られた。産業構造としては、レーベルEarache Recordsが1980年代末に主要な発信源となり、その後Relapse Recordsが引き継いだ。この音楽は当初から商業的な成功を目指しておらず、演奏の場も小規模な自主運営の会場が中心だった。しかし1988年、BBCのラジオDJ John Peelが強い関心を示して番組で繰り返し放送したことにより、予想外の広がりを得た。</p>
