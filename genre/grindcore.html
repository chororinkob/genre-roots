<h1>Grindcore（グラインドコア）とは</h1>
<p>極限まで短く速く圧縮された、メタルとハードコア・パンクの合流点。ドラムはブラストビート、すなわち16分音符をキック・スネアとシンバルに均等に割り振って極めて高速で打ち続ける技法を主軸とする。典型的なブラストビートは16分音符で18</p>
<p>極限まで短く速く圧縮された、メタルとハードコア・パンクの合流点。ドラムはブラストビート、すなわち16分音符をキック・スネアとシンバルに均等に割り振って極めて高速で打ち続ける技法を主軸とする。典型的なブラストビートは16分音符で180〜280BPMで、上限は250BPM程度がより一般的とされ、拍の感覚は消え、音の壁だけが残る。ギターは低い調弦（ダウンチューニング）で、パワー・コードを強く歪ませて刻む。奏法は速さが優先される。ベースも歪ませることが多い。最大の構造的特徴は曲の短さで、微小曲（microsong）が特徴で、数秒の曲もあるが、典型は1分前後から2分程度である。代表作のScumは28曲を収録している。歌唱は、高音のシャウトから低いグロウル、バーク（吠え声）まで幅があり、喉を締めて低く唸るグロウルと、極端に高く裂けるスクリームを交互に用いる例も多い。歌詞は政治的な主題、すなわち資本主義批判、動物の権利、環境破壊、軍事主義への告発を扱う系統と、医学的な人体描写やゴア表現（血や肉体の損壊を描く表現）を扱う系統に大別される。前者はパンク由来、後者はホラー由来の系譜である。</p>
<h2>成り立ち</h2><p>1980年代半ばのイギリス、バーミンガムのシーンから登場した。決定的な存在はNapalm Deathで、1981年に結成された彼らは、ハードコア・パンクの速度をさらに押し上げ、1987年のアルバムScumで様式を確立した。同作は両面で構成員が大きく入れ替わり、共通するのはドラマーのMick Harrisだけという異例の作りで、A面は1986年8月、B面は1987年5月に録音された。ドラマーのMick Harrisは、ブラストビートという名称を付けたとされる（技法自体には先行例があり、起源は諸説ある）。同作に収録された曲You Sufferは約1.3秒の極端に短い曲として知られ、ギネスに「最短の録音曲」として載ったとされる。2007年にはEarache Recordsが制作したMVが公開された。もう一つの母体は、1980年代前半のイギリスの、Crassらのアナーコ・パンクと、DischargeらUK82系ハードコアの両方が持っていた政治的な急進性である。Dischargeにちなむ特定のドラムパターンであるディービート（ハードコア・パンクの基本のドラムパターンで、4/4で記譜される）は、この分野の基礎的な要素となった。並行してイプスウィッチのExtreme Noise Terrorやリヴァプールの Carcassが活動し、後者は医学書の用語を歌詞に用いるという独自の路線を開き、ゴアグラインドと呼ばれる系統の源流とされる（RepulsionやImpetigoも先駆として挙げられる）。米国側ではRepulsionが1986年に同様の音を独自に作り出しており、Brutal Truthが1990年代に継承した。日本ではS.O.B.が早くから活動し、Napalm Deathとの交流を通じて国際的に知られた。産業構造としては、1985年にノッティンガムで設立されたレーベルEarache Recordsが、1987年から1990年代半ばにかけて、グラインドコアとデスメタルの重要作を出した。この音楽は当初、商業的な成功をあまり目指しておらず、演奏の場も小規模な自主運営の会場が中心だったとされる。しかし1987年、BBCのラジオDJ John Peelが強い関心を示して番組で繰り返し放送したことにより、予想外の広がりを得た。</p>
<h2>代表曲</h2><ul><li>When All Is Said And Done (Napalm Death)</li><li>You Suffer (Napalm Death)</li><li>Unchallenged Hate (Napalm Death)</li><li>Dead Shall Rise (Terrorizer)</li><li>Built to Grind (Agoraphobic Nosebleed)</li><li>Reek of Putrefaction (Carcass)</li><li>Corporal Jigsore Quandary (Carcass)</li><li>Piss Angel (Pig Destroyer)</li><li>Instinct of Survival (Napalm Death)</li><li>Lucid Fairytale (Napalm Death)</li><li>World Downfall (Terrorizer)</li><li>Miscommunication (Agoraphobic Nosebleed)</li><li>Deceiver (Napalm Death)</li><li>Gordian Knot (Full of Hell)</li><li>Suffer the Children (Napalm Death)</li><li>Ill-Neglect (Brutal Truth)</li><li>Gravedancer (Pig Destroyer)</li></ul>
