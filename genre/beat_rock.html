<h1>Beat Rock（ビート・ロック）とは</h1>
<p>歌えるメロディを硬い8ビートに乗せて突っ走る日本のロックだ。代表曲22曲を動画で聴け、ルーツと影響のつながりを地図でたどれる。</p>
<p>歌えるメロディを硬い8ビートに乗せて突っ走る日本のロックだ。

中心になるのは、歪ませたエレクトリックギターと、締め上げたドラム。ギターはコードを鳴らしっぱなしにしない。短く切っては止めるカッティングが主役になる。右手で弦を刻み、左手で音をすぐに止める。この弾き方で、ギターは歌の後ろで打楽器のように鳴る。

和音は複雑ではない。長調と短調を行き来する素直なコード進行に、ペンタトニックを軸にした覚えやすいメロディが乗る。歌謡曲に近い節回しが入るのも特徴だ。

リズムは4分の4拍子の8ビート。テンポはおよそ140〜160 BPM。スネアドラムは、固く張った面を強く叩いたような硬い音に設定する。2拍目と4拍目を確実に刻み、ベースは8分音符で根音を押し続ける。アクセントは小節の頭とサビの頭に集まる。

歌は裏声を混ぜない太い地声。低音では感情を抑え、サビで一気に開く。コーラスはユニゾンが基本で、ハモリよりも厚みを優先する。

歌詞は夜の街、恋の駆け引き、葛藤、反発を短い言葉で並べる。情景を細かく描写するより、叫びに近い一言を選ぶ。

曲はイントロのギターリフで始まる。Aメロ、Bメロ、サビと段階的に音を積み、間奏にギターソロを置く。最後のサビを繰り返して短く畳む。3分半から4分に収める型が多い。

パンクと同じ速さを持ちながら、サビで歌を聴かせる点が違う。ハードロックより音が軽く、ギターの音数は少ない。鳴っている場所は、ライブハウス、ホール、そしてカラオケだ。</p>
<h2>成り立ち</h2><p>1970年代末、福岡のライブハウスには東京とは違う速さのロックがあった。THE MODSとARBがその中心だ。ARBは1978年10月25日、ビクター音楽産業のInvitationレーベルからシングル「野良犬」でデビューした。歌う石橋凌は、戦争や労働を題材にした歌詞を日本語で叩きつけた。THE MODSは1983年9月21日にEPIC・ソニーから「激しい雨が」を出し、4枚目のシングルでシーンの看板になった。この2組の演奏を、音楽ライターの中込智子は「めんたいビート」と呼んでいる。

1981年初頭、群馬県高崎市出身の氷室京介、布袋寅泰、松井恒松が中心になり、東京でBOØWYが動き出す。同年5月の初ライブのあと、高橋まことがドラムに入った。当初は6人編成で、1982年10月に深沢和明と諸星アツシが抜け、4人で固定される。1982年3月には『MORAL』でメジャーデビューを果たした。事務所はビーイング、レーベルはInvitationを抱えるビクター音楽産業だった。

その後BOØWYはJAPAN RECORDS／徳間ジャパン、EASTWORLD／東芝EMIへとレーベルを移し、所属もユイ音楽工房に変わった。1985年にアルバム『BOØWY』、1986年に『JUST A HERO』と『BEAT EMOTION』、1987年に『PSYCHOPATH』を出す。『BEAT EMOTION』と『PSYCHOPATH』は、当時のロックバンドのアルバムとしては異例のミリオンセラーになった。1987年には「MARIONETTE」が初登場1位を取った。

人気の頂点で、バンドは終わりを選ぶ。1987年12月24日、渋谷公会堂のライブで解散を宣言した。翌1988年4月4日と5日、完成したばかりの東京ドームで『LAST GIGS』を行い、活動を閉じる。9万枚以上あったチケットは10分で完売し、問い合わせが殺到して文京区の電話回線がパンクした。この一連の流れで、BOØWYの人気は社会現象にまで発展した。

一方、スタイルは残った。UP-BEATは1987年7月21日の「KISS IN THE MOONLIGHT」をフジテレビのドラマ主題歌に載せ、1988年1月21日には「NO SIDE ACTION」を出した。BUCK-TICKは初期にこの型を鳴らし、1988年10月26日の「JUST ONE MORE KISS」で大舞台へ出る。同じ群馬からはROGUEがいて、1983年1月にTVKの「ファイティング'80」新人オーディションで優勝した。BOØWY、BUCK-TICKと並べて「80年代群馬出身三大バンド」と呼ぶ向きもある。機材と奏法を細かく扱う『ロッキンf』や『バンドやろうぜ』が、こうしたバンドの音作りを読者に伝えた。

ただし、同じ「ビート」でも別の流れがある。中込智子は、LAUGHIN' NOSEのようにパンクとハードコアの中でポップさを押し出したバンドや、英国のポップ・パンクに影響を受けたTHE BLUE HEARTS、KENZI &amp; THE TRIPSらを「ビートパンク」と呼んだ。ビートロックがめんたいビートからBOØWYへ向かう系譜なら、ビートパンクはパンク側から歌えるメロディへ寄った系譜だ。二つは似た音を持ちながら、育った場所が違う。

1988年の解散後、氷室京介と布袋寅泰はそれぞれソロへ進んだ。1988年に吉川晃司と布袋寅泰が組んだCOMPLEXは、1989年の「BE MY BABY」でオリコン1位を取っている。90年代に入ると、この型はヴィジュアル系の初期バンドに受け継がれた。GLAYが1998年4月29日に出した「誘惑」のように、サビで開ける8ビートはJ-ROCKの定番になっていく。現在も、疾走感のあるギターロックの土台としてこのスタイルが使われている、という指摘がある。</p>
