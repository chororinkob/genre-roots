<h1>Beat Rock（ビート・ロック）とは</h1>
<p>ビートロックは、歌えるメロディを硬い8ビートに乗せて突っ走る日本のロックだ。代表曲22曲を動画で聴け、ルーツと影響のつながりを地図でたどれる。</p>
<p>ビートロックは、歌えるメロディを硬い8ビートに乗せて突っ走る日本のロックだ。

中心になるのは、エレクトリックギターと、締め上げたドラムだ。ギターはコードを鳴らしっぱなしにしない。短く切っては止める「カッティング」が主役になる。右手で弦を刻み、左手で音をすぐに止めるこの弾き方で、ギターは歌の後ろで打楽器のように鳴る。

和音は複雑ではない。長調と短調を行き来する素直なコード進行が土台になる。そこに乗るのは、一般的な傾向として、ペンタトニックを軸にした覚えやすいメロディだ。歌謡曲に近い節回しが入るのも、一般的な傾向として特徴のひとつだ。

リズムは4分の4拍子の8ビートだ。テンポは、代表曲では150前後から160台の速い曲が目立つ（「MARIONETTE」「B・BLUE」など）。スネアドラムは、固く張った面を強く叩いたような硬い音に設定する。2拍目と4拍目を確実に刻み、ベースは8分音符で根音を押し続ける。アクセントは小節の頭とサビの頭に集まる。

歌は、一般的な傾向として、裏声を混ぜない太い地声が基本だ。低い音では感情を抑え、サビで一気に開く。コーラスも、一般的な傾向として、ユニゾンが基本で、ハモリよりも厚みを優先する。

歌詞は夜の街、恋の駆け引き、葛藤、反発を短い言葉で並べる。情景を細かく描くよりも、叫びに近い一言を選ぶ。

曲はイントロのギターリフで始まる。Aメロ、Bメロ、サビと段階的に音を積み、間奏にギターソロを置く。最後のサビを繰り返して短くまとめる。3分半から4分に収める型が多い。

パンクと同じ速さを持ちながら、サビで歌を聴かせる点が違う。一般的な傾向として、ハードロックより音が軽く、ギターの音数は少ない。鳴っている場所は、ライブハウス、ホール、そしてカラオケだ。</p>
<h2>成り立ち</h2><p>ビートロックの始まりは、1970年代末の日本だ。福岡出身のTHE MODSと、東京で活動していたARB（石橋凌の出身は福岡県久留米市）が、のちに「めんたいロック／めんたいビート」と呼ばれる文脈で語られるようになる。

ARBは1978年10月25日、ビクター音楽産業のInvitationレーベルから、シングル「野良犬」でデビューした。歌う石橋凌は、戦争や労働を題材にした歌詞を、日本語で叩きつけた。

THE MODSは、1983年9月21日にEPIC・ソニーから「激しい雨が」を出した。これは4枚目のシングルだ。前身期からめんたいロックの中心的な存在で、1981年にデビューしている。「激しい雨が」はマクセルのカセットのCM曲で、代表的なヒット曲になった。この2組の演奏を、音楽ライターの中込智子は、個人の見解として「めんたいビート」と整理している。「めんたいロック」の名付け手と時期は、はっきりしておらず、諸説がある。

1981年の初め、群馬県高崎市出身の氷室京介、布袋寅泰、松井恒松が中心になり、東京でBOØWYが動き出す。同じ年の5月、初めてのライブのあとに、高橋まことがドラムに加わった。最初は6人編成だったが、1982年10月に深沢和明と諸星アツシが抜け、4人に固まる。1982年3月、『MORAL』でメジャーデビューを果たした。事務所はビーイング、レーベルは、ビクター音楽産業が持つInvitationだった。

その後、BOØWYはJAPAN RECORDS／徳間ジャパン、EASTWORLD／東芝EMIへとレーベルを移していく。所属も、ビーイングからØ-con' nectionを経て、ユイ音楽工房に変わった。1985年にアルバム『BOØWY』、1986年に『JUST A HERO』と『BEAT EMOTION』、1987年に『PSYCHOPATH』を出す。『BEAT EMOTION』と『PSYCHOPATH』は、当時のロックバンドのアルバムとしては異例のミリオンセラーになった。1987年には、「MARIONETTE」がバンド初のオリコン1位を取った。

人気の頂点で、バンドは終わりを選んだ。1987年12月24日、渋谷公会堂のライブで解散を宣言する。翌1988年4月4日と5日、できたばかりの東京ドームで『LAST GIGS』を行い、活動を閉じた。チケットは2日分で約10万枚（Wikipediaでは9万枚以上）あったが、10分で完売した。予約の電話が殺到し、文京区の電話回線がパンクするほどだった。この一連の出来事で、BOØWYの人気は社会現象にまで広がった。

一方、スタイルは残った。UP-BEATは1987年7月21日の「KISS IN THE MOONLIGHT」をフジテレビのドラマ主題歌にし、1988年1月21日には「NO SIDE ACTION」を出す。BUCK-TICKも初期にこの型を鳴らし、1988年10月26日にメジャー初のシングル「JUST ONE MORE KISS」を出した。同じ群馬からはROGUEもいた。1983年1月、tvkの音楽番組「ファイティング'80s」の新人オーディション企画で優勝している。BOØWY、BUCK-TICKと並べて「80年代群馬出身三大バンド」と呼ぶ向きもあるが、一般に定着している「群馬の3B」は、BOØWY・BUCK-TICK・back numberだ。機材やバンドの特集を扱う雑誌も、当時のバンドブームを支えた。

ただし、同じ「ビート」でも別の流れがある。中込智子は、LAUGHIN' NOSEのようにパンクとハードコアの中でポップさを押し出したバンドや、英国のポップ・パンクに影響を受けたTHE BLUE HEARTS、KENZI &amp; THE TRIPSらを「ビートパンク」と呼んだ。ビートロックがめんたいビートからBOØWYへ向かう系譜なら、ビートパンクはパンクの側から歌えるメロディへ寄った系譜になる。中込の言葉を借りれば、二つは似た音を持ちながら、育った場所が違う。

1988年の解散後、氷室京介と布袋寅泰はそれぞれソロへ進んだ。1988年には、吉川晃司と布袋寅泰が組んだCOMPLEXが生まれる。1989年の「BE MY BABY」でオリコン1位を取った。90年代に入ると、諸説はあるものの、この型はヴィジュアル系の初期バンドに受け継がれたとされる。GLAYが1998年4月29日に出した「誘惑」のように、サビで開ける8ビートはJ-ROCKの定番になっていった。現在も、疾走感のあるギターロックの土台として、このスタイルが使われているという指摘がある。</p>
