<h1>Baroque Pop（バロックポップ）とは</h1>
<p>1960年代半ばに現れた、ロックバンドの編成へ西洋クラシック音楽、とくにバロックから初期古典派の語法を持ち込んだポップス。名前のとおり、チェンバロの粒立ったアルペジオ、弦楽四重奏やそれ以上の弦楽器群、オーボエ、フルート、ファゴット</p>
<p>1960年代半ばに現れた、ロックバンドの編成へ西洋クラシック音楽、とくにバロックから初期古典派の語法を持ち込んだポップス。名前のとおり、チェンバロの粒立ったアルペジオ、弦楽四重奏やそれ以上の弦楽器群、オーボエ、フルート、ファゴットといった木管、そしてピッコロトランペットの高音が、ギター・ベース・ドラムと同じ重みで配置される。単に管弦楽を後ろへ敷いた装飾ではなく、対旋律が主旋律と対等に絡む対位法的な書法、通奏低音を思わせる規則的な低音の動き、そして終止形の作り方までがクラシック側から借りられている点が特徴である。和声は三和音の反復にとどまらず、借用和音や偽終止、半音階的な内声の動きを含み、転調も頻繁に行われる。曲の長さは3分前後というポップスの尺を守りながら、その中に序奏・間奏・後奏という区分がはっきり設けられる。ヴォーカルは力任せに張り上げず、抑制された歌唱と、三度や六度で重ねる緻密なコーラスが好まれる。歌詞は、若者の恋愛を扱う場合でも、憂鬱、喪失、時間の経過といった主題を文学的で内省的な言葉づかいで書くことが多い。同時期のサイケデリック・ロックが音響の逸脱へ向かったのに対し、バロックポップは形式の緻密さと室内楽的な繊細さへ向かった点で対照的である。</p>
<h2>成り立ち</h2><p>1966年前後、ロックがシングル中心の若者向け娯楽から、アルバム単位で聴かれる芸術表現へと変質していく過渡期に生まれた。The Beach Boysのブライアン・ウィルソンが制作したアルバム『Pet Sounds』(1966)は、複雑な和声とスタジオでの緻密な音の重ね合わせによって、ポップスの表現の可能性を大きく押し広げた作品として、このジャンルの原型に位置づけられる。同時期のThe Beatlesも、『Revolver』(1966)収録の「Eleanor Rigby」で弦楽八重奏のみを伴奏に用いるなど、同様の方向性を示していた。両者はライバルとして互いの作品に強く刺激を受け合っており、その競争がこの時期のポップスの急速な高度化を推し進めた。The Left Bankeの「Walk Away Renée」(1966)は、チェンバロの音色を前面に押し出した初期の代表曲であり、当時「バロック・ロック」と呼ばれた。The Zombiesのアルバム『Odessey and Oracle』(1968)は発売当初ほとんど売れず、バンドはすでに解散していたが、後年高く再評価され、このジャンルの隠れた傑作として広く知られるようになった。Procol Harumの「A Whiter Shade of Pale」(1967)は、J.S.バッハの楽曲を思わせるオルガンの旋律で世界的な大ヒットとなった。2000年代以降は、Arcade Fire、Fleet Foxes、Sufjan Stevensといったアーティストが、大編成のアコースティック楽器を用いた壮大な作風で、この系譜を現代的に受け継いでいる。</p>
<h2>代表曲</h2><ul><li>God Only Knows (The Beach Boys)</li><li>Eleanor Rigby (The Beatles)</li><li>Walk Away Renée (The Left Banke)</li><li>A Whiter Shade of Pale (Procol Harum)</li><li>Time of the Season (The Zombies)</li></ul>
