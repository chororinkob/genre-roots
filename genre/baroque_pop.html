<h1>Baroque Pop（バロックポップ）とは</h1>
<p>1960年代半ばに現れた（起点は論者により異なる）、ロックバンドの編成へ西洋クラシック音楽、とくにバロック音楽の手法を持ち込んだポップス。名前のとおり、チェンバロの粒立ったアルペジオ（和音を1音ずつ順に弾く奏法）、弦楽四重奏やそれ</p>
<p>1960年代半ばに現れた（起点は論者により異なる）、ロックバンドの編成へ西洋クラシック音楽、とくにバロック音楽の手法を持ち込んだポップス。名前のとおり、チェンバロの粒立ったアルペジオ（和音を1音ずつ順に弾く奏法）、弦楽四重奏やそれ以上の弦楽器群、オーボエ、フルートといった木管やフレンチホルンがよく使われる（ピッコロトランペットの高音が使われる例もある）。ハープシコードが前面に出て、バロック音楽の作曲様式を取り入れた、劇的で哀愁的な雰囲気があるのが特徴である。当時のシングルとして標準的な長さの曲が多い。ヴォーカルは力任せに張り上げず、抑制された歌唱と、重なり合うグループ・ハーモニーが特徴である。歌詞は、哀愁や後悔を帯びることが多い。同時期のサイケデリック・ロックの台頭とも重なり合いながら展開した。</p>
<h2>成り立ち</h2><p>1960年代半ば、ロックがシングル中心の若者向け娯楽から、アルバム単位で聴かれる芸術表現へと変質していく過渡期に生まれた。起点は論者により異なり、1964年のThe Zombies「She's Not There」、1965年のThe Beatlesの「Yesterday」、1966年の「Walk Away Renée」などが挙げられる。The Beach Boysのブライアン・ウィルソンが制作したアルバム『Pet Sounds』(1966)は、複雑な和声（コードの響き）とスタジオでの緻密な音の重ね合わせによって、ポップスの表現の可能性を大きく押し広げた作品として、このジャンルの原型として、後年そう位置づけられることがある（当時のプレスは「baroque」と呼んでいない。バロックポップ的な美学は「God Only Knows」の1曲にほぼ限られるという見方もあり、「baroque pop」という語は1990年代の批評で登場した）。同時期のThe Beatlesも、『Revolver』(1966)収録の「Eleanor Rigby」で弦楽八重奏のみを伴奏に用いるなど、同様の方向性を示していた。両者は友好的な競争関係にあり、互いの作品に刺激を受け合っていた（Pet SoundsがRevolverに与えた影響には議論がある）。その競争がこの時期のポップスの急速な高度化を推し進めた。The Left Bankeの「Walk Away Renée」(1966)は、チェンバロの音色を前面に押し出した初期の代表曲であり、「バロック・ロック」(baroque rock)はこのバンドのプロモーション資料で使われたとされる語で（ただし1965年にはBeatlesをめぐって同じ語が使われたとする説もある）、音楽プレスは「Bach-rock」「baroque rock」「baroque pop」とも呼んだ。The Zombiesのアルバム『Odessey and Oracle』(1968)は発売当初ほとんど売れず、バンドはすでに解散していたが、1969年にシングル「Time of the Season」が全米でヒットし（Billboard Hot 100で3位）、アルバムも再発売されて、カルト的人気と批評的評価を得た。Procol Harumの「A Whiter Shade of Pale」(1967)は、J.S.バッハの楽曲を思わせるオルガンの旋律で世界的な大ヒットとなった。2000年代以降は、Arcade FireやSufjan Stevensがバロックポップと形容されることがあり、Fleet Foxesもバロックポップ的と評された例がある。1990年代から2010年代には、The Divine Comedyなどによる復興も見られた。</p>
