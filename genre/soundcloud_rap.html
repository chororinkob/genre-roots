<h1>SoundCloud Rap（サウンドクラウドラップ）とは</h1>
<p>この分野は、2010年代半ばに音楽投稿サイトを主な発表の場として、2010年代前半に前史があり、2015〜17年ごろに広く知られるようになった、荒削りで短いことを特徴とするヒップホップである。 音のいちばんの特徴は歪みで、極端に歪</p>
<p>この分野は、2010年代半ばに音楽投稿サイトを主な発表の場として、2010年代前半に前史があり、2015〜17年ごろに広く知られるようになった、荒削りで短いことを特徴とするヒップホップである。

音のいちばんの特徴は歪みで、極端に歪んだ低音である。簡易な録音環境から生じた粗さを、あえて個性として採用した。従来なら失敗と見なされたこの状態が、生々しさと切迫感のしるしとして受け入れられた点が新しかった。制作は、ヘッドホンマイクなど簡易な機材で宅録された例が多い。ロックの使用自体は新しくないが、エモやポップパンクを旋律ごと取り込んだ点が新しい。

曲は短いものが目立つ。「Gucci Gang」（2:04）や「Look at Me!」（2:06〜2:31）のように、2分前後の曲が多い。「Lucid Dreams」（3:59）のように、4分近い代表曲もある。

ラップの発声は、明瞭さを求めない。歌うような節回しが目立つが、攻撃的な早口や叫びも併存する。言葉が聞き取れないことは、欠点とされない。

歌詞は、自己顕示や挑発的な内容と、内省的・悲痛な内容が併存する。後者はエモラップ系の特徴である。

視覚面では、顔面の刺青と染めた髪が共通のしるしとなった。音楽そのものと同じくらい、人物像が消費された。</p>
<h2>成り立ち</h2><p>背景にあるのは、流通の仕組みの上での変化だ。SoundCloudは音楽投稿サイトで、2007年8月にストックホルムで設立され、その後まもなくベルリンへ拠点を移した。サイトの公開は2008年10月17日である。誰でも無料で（上限つきで）音源を公開でき、聴き手が直接反応を書き込める場を提供した。ここではレコード会社の選別も、ラジオ局の編成も、批評家の評価も介在しない。「Look at Me!」はSoundCloud上で7,600万回超再生された（2017年時点）。

南フロリダ(ブロワード郡、マイアミなど)は、この流れの大きな拠点だった。ブロワード郡やマイアミ周辺の10代後半の若者が、2000年代後半のRaider Klan系の下地の上に、2016〜17年ごろ注目を集めた。ただし、シーン全体の地理的中心とは言い切れない。

XXXTentacionのルック・アット・ミーは、2015年末にSoundCloudで公開された。2017年の再公開で、全米チャートに入った。この曲は、極端に歪んだ低音と2分強の短い構成で、このスタイルの顔となった。同時に彼は、交際相手への加重暴行などの罪で起訴されていた（無罪を主張、裁判前に死亡）。その疑惑と作品評価をどう扱うかが議論されている。彼は2018年6月に、強盗の被害に遭って射殺された。

同じ流れの中心にいたLil Peepは、エモやポップパンクの旋律をラップに直接つなぐことで、より内省的で悲痛な方向を開いた。しかし2017年11月、フェンタニルとアルプラゾラム（ザナックス）の併用による事故死で、21歳で亡くなった。Lil Pumpは2017年の楽曲で、極限まで単純化された繰り返しによって、商業的な頂点に達した。Juice WRLDは、即興（フリースタイル）で曲を作る能力で知られた。しかし彼もまた、2019年に薬物の過剰摂取により、21歳で亡くなっている。

この分野では、数年のうちに複数の若い死者が出た(Lil PeepとJuice WRLDは薬物の過剰摂取で、XXXTentacionは強盗事件で射殺された)。ジャンルの薬物描写への批判は存在するが、因果関係が確かめられているわけではない。

一方、6ix9ineのように、意図的な炎上によって注目を集めた人物も現れた。彼は後に、犯罪組織との関与で逮捕され、仲間の情報を提供した。話題性がそのまま通貨になるという、環境のゆがみがはっきり表れた例である。

流行としては、2019年前後に落ち着いたとされる。それでも、歪んだ低音、短い曲、歌うようなラップ、ジャンルを問わない引用という特徴は、その後のヒップホップやポップスに影響を与えたと言われることがある。</p>
