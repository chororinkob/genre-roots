<h1>SoundCloud Rap（サウンドクラウドラップ）とは</h1>
<p>2010年代半ばに音楽投稿サイトを主な発表の場として現れた、粗さと短さを特徴とするヒップホップである。音の第一の特徴は歪みで、低音を担う808系のキックが意図的に音量の限界を超えて潰され、波形の頭が切り取られたざらついた質感がその</p>
<p>2010年代半ばに音楽投稿サイトを主な発表の場として現れた、粗さと短さを特徴とするヒップホップである。音の第一の特徴は歪みで、低音を担う808系のキックが意図的に音量の限界を超えて潰され、波形の頭が切り取られたざらついた質感がそのまま作品として提出される。従来なら失敗と見なされたこの状態が、生々しさと切迫感の記号として受け入れられた点が革新だった。曲は1分半から2分半と極端に短く、導入も間奏もほとんどなく、繰り返しの合唱部分から始まっていきなり終わる。制作は寝室のパソコン一台で完結し、既製の音素材を組み合わせて数十分で作られることも珍しくない。素材にはロックやエモの楽曲、日本のアニメの音楽、ゲーム音源など、従来のヒップホップが使わなかったものが自由に取り込まれる。ラップの発声は明瞭さを求めず、音程をつけて呟くように歌う形が主流で、言葉が聞き取れないことは欠点とされない。歌詞は薬物への依存、失恋、自傷、孤独、若さゆえの虚無を、飾らない語彙で直接的に述べる。視覚面では顔面の刺青と染めた髪が共通の記号となり、音楽そのものと同じくらい人物像が消費された。</p>
<h2>成り立ち</h2><p>背景にあるのは流通の構造的な変化である。2007年に始まった音楽投稿サイトSoundCloudは、誰でも無料で音源を公開でき、聴き手が直接反応を書き込める場を提供した。ここではレコード会社の選別も、ラジオ局の編成も、批評家の評価も介在せず、10代の制作者が数時間で作ったものが翌日に数十万回再生されるということが実際に起きた。地理的な中心はアメリカのフロリダ州南部で、マイアミ周辺の高校生たちが互いに刺激し合いながら短期間で一群を形成した。2017年に爆発的に広まったXXXTentacionのルック・アット・ミーは、極端に歪んだ低音と2分に満たない構成でこの様式を象徴したが、同時に彼は交際相手への深刻な暴行罪で起訴されており、その作品の評価と本人の加害行為をどう扱うかという問題は決着していない。彼は2018年6月に強盗の被害に遭って射殺された。同じ潮流の中心にいたLil Peepは、エモやポップパンクの旋律をラップに直接接続することで、より内省的で悲痛な方向を開いたが、2017年11月に処方薬と麻薬の併用による中毒で21歳で死亡した。Lil Pumpは2017年の楽曲で、極限まで単純化された繰り返しによって商業的な頂点に達し、Juice WRLDは即興で長時間ラップし続ける能力で知られたが、彼もまた2019年に薬物の過剰摂取により21歳で亡くなっている。この分野が数年のうちに複数の若い死者を出したことは偶然ではなく、処方薬の乱用を美化する歌詞と、それを消費して煽る産業の構造が繰り返し批判されてきた。また6ix9ineのように、意図的な炎上によって注目を集め、後に犯罪組織との関与で逮捕され仲間の情報を提供した人物も現れ、話題性がそのまま通貨になるという環境の歪みを露呈させた。流行としては2019年前後に落ち着いたが、歪んだ低音、短い曲、歌うようなラップ、ジャンルを問わない引用という特徴は、現在の主流のポップスに完全に吸収されている。</p>
