<h1>UK Bassとは</h1>
<p>低音を主役とするダンス音楽の、まとめた呼び名である。2000年代半ばのイギリスで、ダブステップ、UKガラージ、グライム、ハウス、R&amp;B、テクノなどの要素が混ざり合って生まれた。 中心にあるのはベースの作り方だ。ベースは層を分けて作</p>
<p>低音を主役とするダンス音楽の、まとめた呼び名である。2000年代半ばのイギリスで、ダブステップ、UKガラージ、グライム、ハウス、R&amp;B、テクノなどの要素が混ざり合って生まれた。

中心にあるのはベースの作り方だ。ベースは層を分けて作られる。まず、おおむね20〜60（〜70）ヘルツ帯のサブベースを長く伸ばし、体に振動として届かせる層がある。そして、その上で音を歪ませたり、音色を波打たせたりする層だ。

ポスト・ダブステップ系では音数が少なく、余白が大きい。切り刻んだ女性ボーカルの断片、短い和音の刺し、金属的な打楽器が、空間に散らされる。

リズムは一定していないのが、むしろ特徴だ。四つ打ち、2・4拍目のキックを抜いた2ステップ(2-step)の型、拍を細かく割ったブレイクビーツが、曲ごとに使い分けられる。テンポの目安は、ダブステップで毎分132〜142拍、UKファンキーで約130拍。ハーフタイムで感じられることもある。

曲の構成は、DJがつなぐことを前提にしている。要になるのは、長い導入部と、低音が抜けて戻る落とし方の作り込みだ。

演奏の場は、大型のサブウーファーを備えたクラブと、屋外のサウンドシステムである。音を耳で聴くより身体で受け取る設計になっている点が、大きな特徴の一つだ。</p>
<h2>成り立ち</h2><p>舞台は2000年代半ばのイギリスだ。UKベースは、このころに現れた。この呼び名は2011年ごろから使われ始め、その後に広まった。

背景には事情があった。ダブステップは、2000年代初頭に南ロンドンで生まれた(クロイドンのBig Apple Recordsが初期の発展に重要だった)。そのダブステップが、2011年ごろに米国で大きく広まった攻撃的な形に変わった。この形を皮肉る「brostep」という語は、2009年には使われていた。本国の作り手たちは、自分たちの音を区別する必要に迫られた、という見方がある。

また、実際の現場では、グライム、UKファンキー、ダブステップ、ガラージの境界が曖昧になっていた。それらをまとめて指す言葉が求められていた。

中心となった場は、ロンドンのクラブナイトFWD&gt;&gt;と、海賊ラジオから合法化されたRinse FMである。レコード店では、Blackmarket Recordsがあった。ジャングルやドラムンベースが中心で、ダブステップの棚もあった店だ。

制作者では、まずBurialがいる。2007年の『Untrue』で、雨音と切り刻んだ声による内省的な低音音楽を示した。この作品は、ダンスフロアではなく夜の帰り道で聴かれる音楽とも評された。当時はダブステップとして語られ、後にUKベースの流れで語られる先駆とされる。彼は数年間正体を明かさず、2008年にようやくWilliam Bevanという本名が分かった。

ほかに、Joy Orbison、Pearson Sound(旧名義Ramadanman)、Blawan、Mount Kimbie、James Blakeらが続いた。レーベルでは、Hessle Audio、Hemlock Recordings、Swamp 81がこの流れを支えた。Hessle Audioは、2007年にBen UFO、Pangaea、Pearson Soundの3人が始めたレーベルだ。ダブステップ周辺の実験的な音源から始まり、のちにハウスやテクノにも広がった。

一方、この語は定義が曖昧だ。UKファンキーやテクノとの境界も、さらに溶けていった。現在も、この流れは名前を持たないまま更新され続けている。</p>
