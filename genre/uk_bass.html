<h1>UK Bassとは</h1>
<p>2000年代後半以降のイギリスで、ダブステップ、UKガラージ、グライム、ハウス、ジャングルの要素が混ざり合って生まれた、低音を主役とするダンス音楽の総称。中心にあるのはベースの設計で、40ヘルツ以下のサブベースを長く伸ばして体に振</p>
<p>2000年代後半以降のイギリスで、ダブステップ、UKガラージ、グライム、ハウス、ジャングルの要素が混ざり合って生まれた、低音を主役とするダンス音楽の総称。中心にあるのはベースの設計で、40ヘルツ以下のサブベースを長く伸ばして体に振動として届かせる層と、その上で歪ませたり音色を波打たせたりする層が分けて作られる。リズムは一定していないのがむしろ特徴で、四つ打ち、二拍四拍を強調する二歩の型、拍を細かく割ったブレイクビーツが曲ごとに使い分けられる。テンポは毎分130拍前後と、その半分または倍で感じられる160から170拍が併存する。上物は最小限で、切り刻んだ女性ボーカルの断片、短い和音の刺し、金属的な打楽器が空間に散らされ、余白が大きく取られる。和音は短調の二和音を往復する程度で、旋律的な展開は重視されない。曲の構成はDJが繋ぐことを前提に、長い導入部と、低音が抜けて戻る落としの設計が要になる。演奏の場は大型のサブウーファーを備えたクラブと、屋外のサウンドシステムで、音を耳で聴くより身体で受け取る設計になっている点が本質である。</p>
<h2>成り立ち</h2><p>この呼び名が使われ始めたのは2009年前後のイギリスで、事情があった。2000年代半ばにロンドン南部のクロイドンで生まれたダブステップが、2008年頃からアメリカでBrostepと呼ばれる攻撃的な形に変質し、本国の作り手たちが自分たちの音を区別する必要に迫られたのである。またグライム、UKファンキー、ダブステップ、ガラージの境界が実際の現場では曖昧になっており、それらをまとめて指す言葉が求められていた。中心となった場は、ロンドンのクラブFWD&gt;&gt;、レコード店Blackmarket Records、そして海賊ラジオから合法化されたRinse FMである。制作者ではBurialが2007年の『Untrue』で、雨音と切り刻んだ声による内省的な低音音楽を提示し、この作品はダンスフロアではなく夜の帰り道で聴かれる音楽として評価された。彼は数年間正体を明かさず、2008年にようやくWilliam Bevanという本名が判明した。ほかにJoy Orbison、Ramadanman、Pearson Sound、Blawan、Mount Kimbie、James Blakeらが続き、レーベルではHessle Audio、Hemlock、Swampがこの流れを支えた。Hessle Audioは2007年にBen UFO、Pangaea、Pearson Soundの三人が始めたもので、ジャンル名を掲げず低音の音楽全般をかけるという姿勢そのものが、UKベースという枠組みの実践だった。2010年代半ばには、この語自体が便宜的すぎるとして使われなくなり、代わりにUKファンキーやテクノとの境界がさらに溶けていった。現在この流れはアフロビーツやアマピアノとも交わり、名前を持たないまま更新され続けている。</p>
