<h1>UK Bassとは</h1>
<p>2000年代後半以降のイギリスで、ダブステップ、UKガラージ、グライム、ハウス、ジャングルの要素が混ざり合って生まれた、低音を主役とするダンス音楽の総称。中心にあるのはベースの設計で、20〜60ヘルツ帯のサブベースを長く伸ばして体</p>
<p>2000年代後半以降のイギリスで、ダブステップ、UKガラージ、グライム、ハウス、ジャングルの要素が混ざり合って生まれた、低音を主役とするダンス音楽の総称。中心にあるのはベースの設計で、20〜60ヘルツ帯のサブベースを長く伸ばして体に振動として届かせる層と、その上で歪ませたり音色を波打たせたりする層が分けて作られる。リズムは一定していないのがむしろ特徴で、四つ打ち、2拍4拍にスネアを置く2ステップ(2-step)の型、拍を細かく割ったブレイクビーツが曲ごとに使い分けられる。テンポはダブステップで毎分132〜142拍、UKファンキーで約130拍が目安で、ハーフタイムで感じられることもある。ジャングル系の素材では160〜170拍も使われる。上物は最小限で、切り刻んだ女性ボーカルの断片、短い和音の刺し、金属的な打楽器が空間に散らされ、余白が大きく取られる。和音は短調の二和音を往復する程度で、旋律的な展開は重視されない。曲の構成はDJが繋ぐことを前提に、長い導入部と、低音が抜けて戻る落としの設計が要になる。演奏の場は大型のサブウーファーを備えたクラブと、屋外のサウンドシステムで、音を耳で聴くより身体で受け取る設計になっている点が本質である。</p>
<h2>成り立ち</h2><p>UKベースは2000年代半ばから後半のイギリスで現れ、この呼び名が定着したのは2009〜2011年ごろとされる。背景には事情があった。2000年代初頭に南ロンドンで生まれたダブステップ(クロイドンのBig Apple Recordsが初期の発展に重要だった)が、2009年に「brostep」という語が皮肉で作られ、2011年ごろに米国で大きく広まった攻撃的な形に変質し、本国の作り手たちが自分たちの音を区別する必要に迫られたのである。またグライム、UKファンキー、ダブステップ、ガラージの境界が実際の現場では曖昧になっており、それらをまとめて指す言葉が求められていた。中心となった場は、ロンドンのクラブFWD&gt;&gt;、レコード店Blackmarket Records、そして海賊ラジオから合法化されたRinse FMである。制作者ではBurialが2007年の『Untrue』で、雨音と切り刻んだ声による内省的な低音音楽を提示し、この作品はダンスフロアではなく夜の帰り道で聴かれる音楽として評価された。彼は数年間正体を明かさず、2008年にようやくWilliam Bevanという本名が判明した。ほかにJoy Orbison、Pearson Sound(旧名義Ramadanman)、Blawan、Mount Kimbie、James Blakeらが続き、レーベルではHessle Audio、Hemlock Recordings、Swamp 81がこの流れを支えた。Hessle Audioは2007年にBen UFO、Pangaea、Pearson Soundの3人が始めたもので、ジャンル名を掲げず低音の音楽全般をかけるという姿勢そのものが、UKベースという枠組みの実践だった。この語は定義が曖昧で、便宜的な総称として批判されることもあり、UKファンキーやテクノとの境界もさらに溶けていった。現在この流れはアフロビーツやアマピアノとも交わり、名前を持たないまま更新され続けている。</p>
