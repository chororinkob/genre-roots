<h1>New Romantic（ニューロマンティック）とは</h1>
<p>1980年前後のイギリスで、シンセサイザーによる洗練された音と、極端に華美な服装を一体として提示した音楽と文化である。音の中核はアナログのシンセサイザーで、複数の音源を重ねた厚い和音の敷物と、記憶に残る単音の旋律が作られる。当時登</p>
<p>1980年前後のイギリスで、シンセサイザーによる洗練された音と、極端に華美な服装を一体として提示した音楽と文化である。音の中核はアナログのシンセサイザーで、複数の音源を重ねた厚い和音の敷物と、記憶に残る単音の旋律が作られる。当時登場したばかりの自動演奏装置によって、正確に反復する音型が土台に据えられ、その機械的な精度と、人が弾く演奏との対比が音楽に緊張を与える。低音はシンセサイザーの場合もあれば、指板に仕切りのないベースによる滑らかな演奏の場合もあり、後者の独特の伸びやかな音は、この時代の音の象徴のひとつとなった。リズムには意外なほどファンクとディスコの影響が強く、四つ打ちや跳ねた刻みが用いられ、踊れることが前提とされる。テンポは概ね110から130 BPM。編曲は隙間なく作り込まれ、サックスの独奏や打楽器の装飾が随所に配置される。歌唱は劇的で、深みのある声で朗々と歌い上げる形が好まれる。歌詞は恋愛、旅、異国の情景、そして享楽を扱い、社会批判は前面に出ない。パンクが貧しさと怒りを提示したのに対し、こちらは意識的に豪奢さと美を選び取った点に本質がある。</p>
<h2>成り立ち</h2><p>1978年から1979年にかけてのロンドンが舞台である。パンクの熱狂が過ぎ去り、残されたのは長引く不況、高い失業率、そして荒んだ都市だった。この状況下で、若者たちは怒りを表明するのではなく、まったく別の方向、すなわち徹底した現実逃避と自己演出を選んだ。中心となったのはコヴェント・ガーデンにあったBlitzという店で、Steve StrangeとRusty Eganが火曜の夜だけ主催した催しには、毎週、自作の奇抜な衣装と化粧をまとった若者が集まった。入場は主催者の一存で決められ、装いが凡庸であれば断られたという逸話が残っている。彼らはブリッツ・キッズと呼ばれ、美術学校や服飾の学生が多くを占めていた。この場から音楽家が生まれる。Steve Strange自身がVisageを結成し、同じ場に出入りしていた若者たちがSpandau Balletとして活動を始めた。バーミンガムでは、地元のクラブを拠点にDuran Duranが結成され、より享楽的で国際的な作風を打ち出す。Boy Georgeはこの店で衣類の預かり係として働いていた人物であり、後にCulture Clubを率いて世界的な成功を収めた。音楽的にはドイツの電子音楽とデヴィッド・ボウイの影響が明確で、実際にBlitzでは彼の楽曲が繰り返し流されていた。この動きが世界へ広がった直接の要因は1981年のアメリカにおける音楽専門テレビ局の開局である。放送すべき映像作品が不足していたこの新しい媒体に対し、視覚表現に長けたイギリスのバンドは大量の映像を提供でき、結果として1980年代前半のアメリカの市場はイギリス勢に席巻された。この現象は第二次英国侵略と呼ばれる。しかし流行としての寿命は短く、1983年頃には呼称自体が古臭いものとなった。批判も多く、中身のない見た目だけの音楽、消費社会への迎合と評されてきた。それでも、音楽と服装と映像を一体の作品として設計するという発想は、以後のポップスの標準となっている。</p>
<h2>代表曲</h2><ul><li>Rio (Duran Duran)</li><li>True (Spandau Ballet)</li><li>Fade to Grey (Visage)</li><li>Quiet Life (Japan)</li><li>Stand and Deliver (Adam and the Ants)</li></ul>
