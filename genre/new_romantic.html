<h1>New Romantic（ニューロマンティック）とは</h1>
<p>ニュー・ロマンティックは、1980年前後のイギリスで生まれた音楽と文化だ。シンセサイザーによる洗練された音と、極端に華美な服装を、一体として提示した。 シンセサイザーとドラムマシン／シーケンサーを多用するグループが多かったが、全員</p>
<p>ニュー・ロマンティックは、1980年前後のイギリスで生まれた音楽と文化だ。シンセサイザーによる洗練された音と、極端に華美な服装を、一体として提示した。

シンセサイザーとドラムマシン／シーケンサーを多用するグループが多かったが、全員ではない。音の中核はアナログのシンセサイザーだ。複数の音源を重ねた厚い和音の敷物と、記憶に残る単音の旋律が作られる。

リズムは、自動演奏装置（ドラムマシン）が土台になった。プログラム可能な機種が普及し始めた時期の機械だ。これによって、正確に反復する音型が土台に据えられる。その機械的な精度と、人が弾く演奏との対比が、音楽に緊張を与える。

低音はシンセサイザーの場合もある。指板に仕切りのないベースによる、滑らかな演奏の場合もある。JapanのMick Karnのように、フレットレスベースで知られる奏者がいた。Duran Duranのように、ダンス志向のリズム隊を取り入れたバンドもあった。テンポは曲により幅があり、アップテンポの曲も多い。一部のバンドが、後年サックスを取り入れた。

歌詞は、恋愛、旅、異国の情景、そして享楽のほか、疎外感・孤独・若さの自己宣言なども扱う。社会批判は前面に出にくかった。

パンクの視覚的な「意図的な醜さ」を退け、エレガンスとロマンスを選んだ点に特徴がある。</p>
<h2>成り立ち</h2><p>1978年から1979年にかけて、ロンドン（Billy's → Blitz）とバーミンガム（Rum Runner）で、ほぼ同時にこの動きが広がった。

パンクの熱狂が過ぎ去り、残されたのは、長引く不況、高い失業率、そして荒んだ都市だった。この状況下で、若者たちは怒りを表明するのではなく、まったく別の方向を選んだ。徹底した現実逃避と自己演出だ。

1978年は、SohoのBilly'sが舞台だった。1979年2月にコヴェント・ガーデンのBlitzへ移り、Steve StrangeとRusty Eganが、火曜の夜だけ催しを主催した。毎週、自作の奇抜な衣装と化粧をまとった若者が集まった。入場は主催者の一存で決められ、装いが凡庸であれば断られたという逸話が残っている。彼らはブリッツ・キッズと呼ばれた。Blitzは2つの美術大学の間にあり、学生ファッションデザイナーの実験場になった。

この場から音楽家が生まれる。Midge UreとRusty EganがVisageを始めた。Steve Strangeがボーカルとして加わり、Billy Currieらが加わって編成が整った。既存のバンドもBlitzのシーンと結び付き、Spandau Balletと名乗って活動した。

バーミンガムでは、1978年に結成されたDuran Duranが、1980年初頭に地元のクラブRum Runnerの専属バンドになった。より享楽的で国際的な作風を打ち出す。Boy George（George O'Dowd）は、ロンドンのBlitzで衣類の預かり係として働いていた人物だ。後にCulture Clubを率いて、世界的な成功を収めた。

音楽的には、Kraftwerkなどのドイツの電子音楽、デヴィッド・ボウイ、Roxy Musicに加え、YMOなど各国のシンセ音楽の影響が明確だった。実際にBlitzでは、デヴィッド・ボウイの楽曲が繰り返し流されていた。

MTV普及(1982年にNY・LA到達)と米ラジオのフォーマット転換が重なった。1983年、米国のレコード売上の約30%が英国勢だったとされる。この現象は第二次英国侵略と呼ばれる。New Wave / new music / synth-popが中心で、Duran DuranやCulture ClubなどNew Romantic出身者は、その大きな一部だった。

しかし、流行としての寿命は短かった。1982年初頭までに、運動としてはほぼ拡散し、関連アーティストは美学を離れて活動した。ナルシシズムや排他性、サッチャー政権期の消費文化と結び付けて批判されてきた。それでも、MTV時代に、映像と見た目を重視する流れを強めた。</p>
