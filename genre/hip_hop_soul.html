<h1>Hip-Hop Soul（ヒップホップソウル）とは</h1>
<p>ヒップホップの重いビートの上に、ゴスペル由来の力強いR&amp;Bの歌唱を乗せる1990年代前半の様式。伴奏はドラムマシンとサンプラーで作られ、往年のソウルやファンクのレコードから切り出したループ、太いバスドラム、鋭いスネアが土台になる。</p>
<p>ヒップホップの重いビートの上に、ゴスペル由来の力強いR&amp;Bの歌唱を乗せる1990年代前半の様式。伴奏はドラムマシンとサンプラーで作られ、往年のソウルやファンクのレコードから切り出したループ、太いバスドラム、鋭いスネアが土台になる。テンポは90〜105BPMで、ヒップホップと同じ重心の低い首振りのビートを共有する。従来のR&amp;Bが生のバンド演奏と滑らかな伴奏を用いたのに対し、ここでは意図的に粗く硬い音が選ばれる。歌唱は対照的に極めて情感が濃く、こぶしを効かせたメリスマ、しゃがれ声、叫びに近い高音を惜しみなく使う。この、荒いビートと熱い歌の落差そのものが様式の核になる。曲の途中にラッパーの客演が入る構成が定着し、以後のR&amp;Bの標準になった。歌詞は恋愛の痛み、裏切り、依存、自立といった主題を、飾らない一人称で歌う。服装や振る舞いを含めた都市の黒人女性の生活感が音楽と一体で提示された点も重要で、上品さを求められてきたR&amp;Bの女性歌手像を根本から書き換えた。</p>
<h2>成り立ち</h2><p>1992年、ニューヨークのレコード会社Uptown Recordsから生まれた。同社を率いたAndre Harrellは、ヒップホップとR&amp;Bの客層が実際には同じであることに気づいており、そこに当時まだ20歳前後だった社員のSean Combs——のちのPuff Daddy——を制作に起用した。彼らが見出したのがニューヨーク州ヨンカーズ出身のMary J. Bligeである。1992年に発表された彼女の「What's the 411?」は、Combsの制作でヒップホップのループの上に生々しい歌を乗せ、批評と売上の両方で成功して「ヒップホップ・ソウルの女王」の称号を彼女にもたらした。1994年の「My Life」では、自身の薬物依存と暴力的な恋愛関係を隠さずに歌い、私生活の痛みをそのまま作品にする方向を打ち出す。同じUptownからは男性四人組のJodeciが、ゴスペル的な歌唱と粗いビートを結び付けて登場し、K-CiとJoJoの兄弟の絶唱が支持された。1993年にCombsはUptownを解雇されるが、直後に自らBad Boy Recordsを設立し、The Notorious B.I.G.とFaith Evansを擁して同じ路線をさらに大きな市場へ広げる。背景には、1980年代末までR&amp;Bの女性歌手に求められていた上品で無害な像への反発があった。Mary J. Bligeが野球帽とスポーツウェアで舞台に立ち、街の言葉で歌ったことは、音楽以上に文化的な事件として受け止められた。この様式の成立によって、R&amp;Bの曲にラッパーが客演する構成が業界の標準となり、TLC、Aaliyah、SWV、Total、Changing Facesらが続く。1990年代後半になると、Timbaland、Rodney Jerkins、The Neptunesら新しい制作者が加わって音は洗練され、ヒップホップ・ソウルという呼称そのものは使われなくなっていく。だが、ヒップホップとR&amp;Bを別物として扱わないという前提は、この時期に完全に定着し、その後の黒人音楽全体の土台となった。</p>
