<h1>Hip-Hop Soul（ヒップホップソウル）とは</h1>
<p>ヒップホップの重いビートの上に、ゴスペル由来の力強いR&amp;Bの歌唱を乗せる、1990年代前半から半ばに最盛期を迎えた様式。伴奏はドラムマシンとサンプラー（音を録音して取り込む機械）で作られ、往年のソウルやファンクのレコードから切り出</p>
<p>ヒップホップの重いビートの上に、ゴスペル由来の力強いR&amp;Bの歌唱を乗せる、1990年代前半から半ばに最盛期を迎えた様式。伴奏はドラムマシンとサンプラー（音を録音して取り込む機械）で作られ、往年のソウルやファンクのレコードから切り出したループ（繰り返し）、太いバスドラム、鋭いスネアが土台になる。テンポはミッドテンポ（中くらいの速さ）が中心で、ヒップホップと同じ重心の低い首振りのビートを共有する。直接の前身であるnew jack swingから発展し、サンプルを多用したヒップホップのトラックにR&amp;Bの歌唱を乗せた。ここでは意図的に粗く硬い音が選ばれる。歌唱は対照的に極めて情感が濃く、メリスマ（一つの音節を複数の音で歌う技法）、しゃがれ声、叫びに近い高音を惜しみなく使う。この、荒いビートと熱い歌の落差そのものが様式の核になる。曲の途中にラッパーの客演が入る構成が一般化するのを加速させた。歌詞は恋愛の痛み、裏切り、依存、自立といった主題を、飾らない一人称で歌う。服装や振る舞いを含めた都市の黒人女性の生活感が音楽と一体で示された点も重要で、上品さを求められてきたR&amp;Bの女性歌手像を根本から書き換えた。</p>
<h2>成り立ち</h2><p>1990年代前半（1992年前後）に、ニューヨークのレコード会社Uptown Recordsの周辺を中心に生まれた。new jack swingから発展した様式である。同社を率いたAndre Harrellは、ヒップホップとR&amp;Bの客層が実際には同じであることに気づいており、そこに当時まだ20歳前後だったインターンから始めた（のちにA&amp;R（新人発掘・育成担当）となった）Sean Combs——のちのPuff Daddy——を制作に起用した。Mary J. Bligeは、Harrellが（Jeff Redd経由で）見出し、1989年にUptownと契約した、ブロンクス生まれでヨンカーズ育ちの歌手で、のちにCombsが制作に起用した。1992年に発表された彼女の「What's the 411?」は、Combsの総指揮（DeVante SwingやTony Dofatらも制作に参加）でヒップホップのループの上に生々しい歌を乗せ、批評と売上の両方で成功して「ヒップホップ・ソウルの女王」の称号を彼女にもたらした。1994年の「My Life」では、自身の薬物依存と暴力的な恋愛関係を隠さずに歌い、私生活の痛みをそのまま作品にする方向を打ち出す。同じUptownからは男性4人組のJodeciが、ゴスペル的な歌唱と粗いビートを結び付けて登場し、K-CiとJoJoの兄弟の全力の歌声が支持された。1993年にCombsはUptownを解雇されるが、直後に自らBad Boy Recordsを設立し、The Notorious B.I.G.を連れて行き（Faith Evansの加入は1994年）、同じ路線をさらに大きな市場へ広げる。背景には、1980年代末までR&amp;Bの女性歌手に求められていた上品で無害な像への反発があった。Mary J. Bligeが野球帽とスポーツウェアで舞台に立ち、街の言葉で歌ったことは、音楽以上に文化的な事件として受け止められた。この様式は、R&amp;Bの曲にラッパーが客演する構成の一般化を加速させた（先行例に1984年のChaka Khan「I Feel for You」がある）。TLC、Aaliyah、SWV、Total、Changing Facesらも活躍した（TLCがこの様式に踏み込んだのは1994年の『CrazySexyCool』、Totalは1994年にBad Boyと契約、Changing Facesは1994年にデビュー）。1990年代後半になると、Timbaland、Rodney Jerkins、The Neptunesら新しい制作者が加わって音は洗練され、ヒップホップ・ソウルという独立した様式としては、いったん勢いが落ち着く。だが、ヒップホップとR&amp;Bを別物として扱わないという前提は、この時期に広く定着し、その後の黒人音楽全体の土台となった。</p>
