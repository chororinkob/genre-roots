<h1>Hip-Hop Soul（ヒップホップソウル）とは</h1>
<p>ヒップホップ・ソウルは、ヒップホップの重いビートの上に、力強いR&amp;Bの歌を乗せた音楽だ。1990年代前半から後半にかけて人気を集めた。歌い手にはゴスペルの素養を持つ人が多い。 伴奏はドラムマシンとサンプラー（音を録音して取り込む機</p>
<p>ヒップホップ・ソウルは、ヒップホップの重いビートの上に、力強いR&amp;Bの歌を乗せた音楽だ。1990年代前半から後半にかけて人気を集めた。歌い手にはゴスペルの素養を持つ人が多い。

伴奏はドラムマシンとサンプラー（音を録音して取り込む機械）で作られる。ソウルやファンクのレコードに加え、ヒップホップの曲も素材にして、切り出したループ（繰り返し）を使う。太いバスドラムと鋭いスネアが土台になる。テンポはミッドテンポ（中くらいの速さ）が中心で、ヒップホップと同じ重心の低い首振りのビートを共有する。直接の前身であるnew jack swingから発展し、サンプルを多用したヒップホップのトラックにR&amp;Bの歌唱を乗せた。

歌唱の特徴は、BligeやJodeciの例として、極めて情感が濃いことだ。メリスマ（一つの音節を複数の音で歌う技法）、しゃがれ声、叫びに近い高音を惜しみなく使う。曲の途中にラッパーの客演が入る構成が一般化するのにも寄与した。

歌詞は恋愛の痛み、裏切り、依存、自立といった主題を、飾らない一人称で歌う。服装や振る舞いを含めた都市の黒人女性の生活感が、音楽と一体で示された点も重要だ。Mary J. Bligeの外見と音は、当時の黒人女性R&amp;B歌手の通例と対照的だった。</p>
<h2>成り立ち</h2><p>1992年前後、ニューヨークのレコード会社Uptown Recordsの周辺で、この音楽は生まれた。1990年代前半のことである。new jack swingから発展した音楽だ。

同社を率いたAndre Harrellは、ヒップホップとR&amp;Bの間に断絶があった時代に、両者を橋渡しした。そこで、当時まだ20歳前後だったインターンから始めたSean Combsを、制作に起用する。のちにA&amp;R（新人発掘・育成担当）となった人物で、のちのPuff Daddyである。

Mary J. Bligeは、Harrellが（Jeff Redd経由で）見出し、1989年にUptownと契約した歌手だ。ブロンクス生まれで、ヨンカーズの公営住宅で育った。のちにCombsが彼女を制作に起用した。1992年に発表された彼女の「What's the 411?」は、Combsの総指揮（DeVante SwingやTony Dofatらも制作に参加）で作られた。ヒップホップのループの上に生々しい歌を乗せ、批評と売上の両方で成功する。彼女は「ヒップホップ・ソウルの女王」の称号を得た。1994年の「My Life」では、自身の薬物依存と暴力的な恋愛関係を隠さずに歌い、私生活の痛みをそのまま作品にする方向を打ち出す。

一方、Jodeciは1991年にデビューしており、Bligeより先にUptownから登場した。男性4人組で、ゴスペル的な歌唱と粗いビートを結び付け、同様の方向性を男性側から示した。K-CiとJoJoの兄弟の全力の歌声が支持された。

1993年、CombsはUptownを解雇される。しかし直後に自らBad Boy Recordsを設立し、The Notorious B.I.G.を連れて行った（Faith Evansの加入は1994年）。同じ路線を、さらに大きな市場へ広げていく。

Bligeの外見と音は、当時の黒人女性R&amp;B歌手の通例と対照的で、90年代初頭の女性歌手像に新しい選択肢を示した。Mary J. Bligeが野球帽とスポーツウェアで舞台に立ち、街の言葉で歌ったことで、その外見や言葉づかいが大きな話題になった。

この音楽は、R&amp;Bの曲にラッパーが客演する構成の一般化に寄与した（先行例に1984年のChaka Khan「I Feel for You」がある）。TLC、SWV、Totalらも活躍した（TLCがこの音楽に踏み込んだのは1994年の『CrazySexyCool』、Totalは1994年にBad Boyと契約）。

1990年代末にかけ、ヒップホップの影響が一般的なR&amp;Bに広がり、ネオソウルも登場した。そのため、独立したジャンルとしては勢いが落ち着いた。だが、1990年代を通じてヒップホップの要素がR&amp;Bに広く取り入れられた。</p>
