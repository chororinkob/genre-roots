<h1>Opera（オペラ）とは</h1>
<p>オペラは、歌唱、演技、管弦楽（オーケストラ）、舞台美術、衣装、演出のすべてを一つの上演に統合した、総合的な舞台芸術だ。 中心になるのは歌手の生の声だ。多くの歌劇場は原則として生声を重んじるが、音響補強を併用する例もある。声が通るの</p>
<p>オペラは、歌唱、演技、管弦楽（オーケストラ）、舞台美術、衣装、演出のすべてを一つの上演に統合した、総合的な舞台芸術だ。

中心になるのは歌手の生の声だ。多くの歌劇場は原則として生声を重んじるが、音響補強を併用する例もある。声が通るのは、ベルカントに限らず、クラシックのオペラ歌唱の訓練のおかげだ。歌手は、声帯まわりの共鳴腔（声を響かせる空間）を調整して、主に男声（とアルト）で約2.2〜3.2kHz付近に強いピークを作る。これが「歌手のフォルマント（声の中で強く響く高い帯域）」だ。高音域のソプラノでは、典型的な形では現れない。大きな音量に加え、オーケストラの音が比較的薄い帯域を強めることで、声が通る。

声域は、ソプラノ、メゾソプラノ、コントラルト、カウンターテナー、テノール、バリトン、バスに分かれる。それぞれに似合う役柄が「ファッハ」として細かく分類されている。主役の恋人同士をソプラノとテノールが務め、その邪魔をする権力者をバリトンやバスが務めるのが、よく見られる配役の型だ。

音楽は、「アリア」と「レチタティーヴォ」が交互に現れる構造を基本とする。バロックから19世紀前半の多くのオペラが、この形をとっている。アリアは、登場人物が立ち止まって心情を歌い上げる曲だ。レチタティーヴォは、会話や筋の進行を語るように歌う部分だ。そこに二重唱、合唱、管弦楽だけの序曲（幕開けの曲）や間奏曲が挟まる。

現在は原語上演が主流で、多くの劇場が字幕を付ける。装飾を華やかに歌うコロラトゥーラ（高音で細かく動く歌い方）や、伴奏が止まって歌手が技巧を見せるカデンツァ（独唱の見せ場）がある。こうした聴かせどころが、型として決まっているのも特徴だ。</p>
<h2>成り立ち</h2><p>出発点は、1570年代のフィレンツェだ。貴族ジョヴァンニ・デ・バルディの邸宅に、音楽家と詩人が集まっていた。この集団がカメラータである。

彼らは、古代ギリシャ悲劇は全編が歌われていたはずだという説に基づき、その復元を試みた。当時主流だった、複数の旋律が絡み合うポリフォニー（多声音楽）は、歌詞が聞き取れないという理由で否定した。代わりに打ち出したのが、1本の旋律と簡素な伴奏からなるモノディ（独唱中心の）スタイルだ。

バルディは1592年頃にローマへ赴任した。バルディの集まりの理念を受け継ぐ形で、コルシ周辺でペーリらの実験が行われた（両者の関係は研究者により見方が分かれる）。ヤコポ・ペーリの『ダフネ』は、一般に最初のオペラとされる。1597年頃（旧暦、1598年のカーニバル）に、コルシ邸で上演された。ただし音楽の大部分は失われ、断片のみが現存する（現存する6つの断片のうち、少なくとも2つはコルシの作曲）。通説では、現存する最古のオペラは1600年の『エウリディーチェ』である（同じ1600年のカヴァリエーリの『魂と肉体の劇』を最古とする見方もある）。

芸術として固まるうえで大きく貢献したのは、クラウディオ・モンテヴェルディだ。1607年にマントヴァ宮廷で初演された『オルフェオ』は、管弦楽の編成を指定し、場面ごとに楽器を使い分けた。出版譜には約41の楽器が挙げられているが、用法の細部は演奏者に委ねられていた。

転機は1637年、ヴェネツィアに世界初の公開歌劇場サン・カッシアーノ劇場が開場したことだ。貴族の私的な余興だったオペラは、入場料を取る商業興行になった。客を呼べる歌手が、主役に躍り出る。

18世紀には、去勢によって少年の声域を保ったカストラートが最大のスターとなり、ファリネッリの名は全欧に轟いた。この慣行は、女性が教会で歌えなかったこと（パウロの戒め）なども背景に、16世紀半ば以降に広まった。成功したのはごく一握りで、大多数の少年は声も将来も失った。

その後も、オペラは時代とともに姿を変えた。1786年の『フィガロの結婚』で、モーツァルトは召使いが貴族を出し抜く筋書きを舞台に乗せた。1842年のヴェルディ『ナブッコ』の合唱曲は、オーストリア支配下にあった北イタリアで、イタリア統一運動の代名詞と広く見なされてきた。ただしパーカーら一部の研究者が、これを「強力な神話」と位置づけており、定説としての根拠には疑問が呈されていると主張する。

19世紀後半には、リヒャルト・ワーグナーが楽劇を構想した。アリアと語りの区別を溶かし、人物や概念に固有の旋律を割り当てる。この旋律がライトモティーフ（人物や概念を表す短い旋律）だ。ワーグナーは、自作専用の劇場としてバイロイト祝祭劇場を1876年に完成させた。

20世紀に入ると、録音技術が歌手を国際的な商品に変えた。エンリコ・カルーソーが、最初の国際的レコード・スターとされる。1990年のローマでの三大テノール公演は、サッカーのワールドカップと結びついて、推定約8億人（資料により異なる）に届いた。</p>
