<h1>Opera（オペラ）とは</h1>
<p>歌唱、演技、管弦楽、舞台美術、衣装、演出のすべてを一つの上演に統合した、西洋音楽で最も規模の大きい総合芸術である。決定的な特徴は、マイクによる増幅を一切用いず、生身の声だけで2000人規模の劇場の最後列まで、しかも数十人編成のオー</p>
<p>歌唱、演技、管弦楽、舞台美術、衣装、演出のすべてを一つの上演に統合した、西洋音楽で最も規模の大きい総合芸術である。決定的な特徴は、マイクによる増幅を一切用いず、生身の声だけで2000人規模の劇場の最後列まで、しかも数十人編成のオーケストラの音を突き抜けて届かせる点にある。これを可能にしているのがベルカント唱法で、声帯まわりの共鳴腔を調整して2800から3200ヘルツ付近に強いピークを作る「歌手のフォルマント」を生み出す。この帯域はオーケストラの音が薄い場所であり、音量で勝負せずに周波数の隙間を突いて聞こえさせている。声域はソプラノ、メゾソプラノ、コントラルト、カウンターテナー、テノール、バリトン、バスに分かれ、それぞれに似合う役柄が「ファッハ」として細かく類型化されている。主役の恋人同士をソプラノとテノールが務め、その邪魔をする権力者をバリトンやバスが務めるのが古典的な配置である。音楽は、登場人物が立ち止まって心情を歌い上げる「アリア」と、会話や筋の進行を語るように歌う「レチタティーヴォ」が交互に現れる構造を基本とし、そこに二重唱、合唱、管弦楽だけの序曲や間奏曲が挟まる。歌手は原語で歌うのが原則で、客席側には字幕が表示される。装飾を華やかに歌うコロラトゥーラ、伴奏が止まって歌手が技巧を見せるカデンツァなど、聴かせどころが型として決まっているのも特徴である。</p>
<h2>成り立ち</h2><p>1570年代、フィレンツェの貴族ジョヴァンニ・デ・バルディの邸宅に集まった音楽家・詩人の集団カメラータが、古代ギリシャ悲劇は全編が歌われていたはずだという説に基づき、その復元を試みたことが出発点である。彼らは当時主流だった複数の旋律が絡み合うポリフォニーを、歌詞が聞き取れないという理由で否定し、一本の旋律と簡素な伴奏からなるモノディ様式を打ち出した。バルディは1592年頃にローマへ赴任し、以降は活動の拠点がヤコポ・コルシ邸に移った。ヤコポ・ペーリの『ダフネ』が1597年にコルシ邸で上演されたが音楽の大部分は失われており、断片のみが現存する。現存する最古の完全な作品は1600年の『エウリディーチェ』である。芸術として確立させたのはクラウディオ・モンテヴェルディで、1607年にマントヴァ宮廷で初演された『オルフェオ』は、管弦楽の編成を指定し、場面ごとに楽器を使い分けた最初期の例となった。転機は1637年、ヴェネツィアに世界初の公開歌劇場サン・カッシアーノ劇場が開場したことである。貴族の私的な余興だったオペラは入場料を取る商業興行になり、客を呼べる歌手が主役に躍り出た。十八世紀には去勢によって少年の声域を保ったカストラートが最大のスターとなり、ファリネッリの名は全欧に轟いた。教会が女性の歌唱を禁じたことの帰結として生まれた慣行であり、成功したのはごく一握りで、大多数の少年は声も将来も失った。1786年の『フィガロの結婚』でモーツァルトは召使いが貴族を出し抜く筋書きを舞台に乗せ、1842年のヴェルディ『ナブッコ』の合唱曲は、オーストリア支配下にあった北イタリアでイタリア統一運動の象徴と広く見なされてきた。ただし近年の音楽史研究はこれを「強力な神話」と位置づけており、定説としての根拠には疑問が呈されている。十九世紀後半にはリヒャルト・ワーグナーが、アリアと語りの区別を溶かし、人物や概念に固有の旋律を割り当てるライトモティーフを用いた楽劇を構想し、自作専用の劇場としてバイロイト祝祭劇場を1876年に完成させた。二十世紀に入ると録音技術が歌手を国際的な商品に変え、エンリコ・カルーソーが最初のレコード・スターとなる。1990年のローマでの三大テノール公演は、サッカーのワールドカップと結びついて数億人に届いた。</p>
