<h1>Opera（オペラ）とは</h1>
<p>歌唱、演技、管弦楽（オーケストラ）、舞台美術、衣装、演出のすべてを一つの上演に統合した、総合的な舞台芸術である。大きな特徴は、伝統的な大劇場の多くが、できるだけマイクを使わずに生身の声を大切にして、2000人規模の劇場の最後列まで</p>
<p>歌唱、演技、管弦楽（オーケストラ）、舞台美術、衣装、演出のすべてを一つの上演に統合した、総合的な舞台芸術である。大きな特徴は、伝統的な大劇場の多くが、できるだけマイクを使わずに生身の声を大切にして、2000人規模の劇場の最後列まで、しかも数十人編成のオーケストラの音を突き抜けて声を届かせる点にある（劇場によっては、音を補う設備を使うこともある）。これを可能にしているのが、ベルカント唱法に限らず、クラシックのオペラ歌唱の訓練で身につく発声で、声帯まわりの共鳴腔（声を響かせる空間）を調整して主に男声（とアルト）で約2200〜3200ヘルツ付近に強いピーク（山のような盛り上がり）を作る「歌手のフォルマント（声の中で強く響く高い帯域）」を生み出す。高い音域のソプラノでは、この形ははっきり現れない。この帯域はオーケストラの音が比較的薄い場所であり、大きな声量に加えて、この帯域を強めることで声が通りやすくなる。声域はソプラノ、メゾソプラノ、コントラルト、カウンターテナー、テノール、バリトン、バスに分かれ、それぞれに似合う役柄が「ファッハ」として細かく類型化されている。主役の恋人同士をソプラノとテノールが務め、その邪魔をする権力者をバリトンやバスが務める、というのはよく見られる配役の型である（例外も多い）。バロックから19世紀前半ごろの多くのオペラでは、音楽は、登場人物が立ち止まって心情を歌い上げる「アリア」と、会話や筋の進行を語るように歌う「レチタティーヴォ」が交互に現れる構造を基本とし、そこに二重唱、合唱、管弦楽だけの序曲（幕開けの曲）や間奏曲が挟まる。現在は原語で歌う上演が主流で、多くの劇場が客席側に字幕を付けている。装飾を華やかに歌うコロラトゥーラ（高音で細かく動く歌い方）、伴奏が止まって歌手が技巧を見せるカデンツァ（独唱の見せ場）など、聴かせどころが型として決まっているのも特徴である。</p>
<h2>成り立ち</h2><p>1570年代、フィレンツェの貴族ジョヴァンニ・デ・バルディの邸宅に集まった音楽家・詩人の集団カメラータが、古代ギリシャ悲劇は全編が歌われていたはずだという説に基づき、その復元を試みたことが出発点である。彼らは当時主流だった複数の旋律が絡み合うポリフォニー（多声音楽）を、歌詞が聞き取れないという理由で否定し、1本の旋律と簡素な伴奏からなるモノディ（独唱中心の）様式を打ち出した。バルディは1592年頃にローマへ赴任した。その後、バルディの集まりの考え方を受け継ぐ形で、コルシ邸の周りでペーリらが初期のオペラ（『ダフネ』など）の実験を行った（二つの集まりの関係は、研究者によって見方が分かれる）。ヤコポ・ペーリの『ダフネ』は、1597年頃（現在の暦では1598年）のカーニバルにコルシ邸で上演され、一般に最初のオペラとされるが、音楽の大部分は失われており、断片のみが現存する（現存する6つの断片のうち、少なくとも2つはコルシの作曲）。通説では、現存する最古のオペラは1600年の『エウリディーチェ』である（同じ1600年のカヴァリエーリの『魂と肉体の劇』を最古とする見方もある）。芸術としての確立に大きく貢献したのはクラウディオ・モンテヴェルディで、1607年にマントヴァ宮廷で初演された『オルフェオ』は、管弦楽の編成を指定し、場面ごとに楽器を使い分けた（出版譜には約41の楽器が挙げられているが、それぞれの細かい使い方までは指定されておらず、演奏者に任されていた）。転機は1637年、ヴェネツィアに世界初の公開歌劇場サン・カッシアーノ劇場が開場したことである。貴族の私的な余興だったオペラは入場料を取る商業興行になり、客を呼べる歌手が主役に躍り出た。18世紀には去勢によって少年の声域を保ったカストラートが最大のスターとなり、ファリネッリの名は全欧に轟いた。女性が教会で歌えなかったこと（使徒パウロの「女は教会で黙っているように」という戒め）なども背景に、16世紀半ば以降に西ヨーロッパで広まった慣行であり、成功したのはごく一握りで、大多数の少年は声も将来も失った。1786年の『フィガロの結婚』でモーツァルトは召使いが貴族を出し抜く筋書きを舞台に乗せ、1842年のヴェルディ『ナブッコ』の合唱曲は、オーストリア支配下にあった北イタリアでイタリア統一運動の象徴と広く見なされてきた。ただしロジャー・パーカーら一部の研究者は、この曲が初演でアンコールされたという話は作り話にすぎず、愛国的な曲という扱いを受けるようになったのは主に1860年代の統一後だと主張している（一方で、そこまで言い切るのは行き過ぎだという研究者もいる）。19世紀後半にはリヒャルト・ワーグナーが、アリアと語りの区別を溶かし、人物や概念に固有の旋律を割り当てるライトモティーフ（人物や概念を表す短い旋律）を用いた楽劇を構想し、自作専用の劇場としてバイロイト祝祭劇場を1876年に完成させた。20世紀に入ると録音技術が歌手を国際的な商品に変え、エンリコ・カルーソーが最初の国際的なレコード・スターとされる。1990年のローマでの三大テノール公演は、サッカーのワールドカップ決勝の前夜に開かれ、推定で約8億人（資料によって差がある）が見たとされる。</p>
