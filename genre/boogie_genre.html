<h1>Boogie（ブギー）とは</h1>
<p>1980年前後に、ディスコの豪奢な編成を電子楽器へ置き換えて生まれたダンス音楽である。テンポは概ね105から118 BPMと、ディスコよりやや落ち着いている。決定的な特徴は低音の作り方で、コントラバスや指弾きのベースに代わり、アナ</p>
<p>1980年前後に、ディスコの豪奢な編成を電子楽器へ置き換えて生まれたダンス音楽である。テンポは概ね105から118 BPMと、ディスコよりやや落ち着いている。決定的な特徴は低音の作り方で、コントラバスや指弾きのベースに代わり、アナログのシンセサイザーによる太く丸い単音の音型が用いられる。この電子的な低音が跳ねるように動き回ることが、この様式の躍動の全てを担う。ドラムは初期のリズムマシンによる硬く均質な打点が中心で、スネアには残響をかけて途中で切り落とす処理が施され、独特の弾ける音が作られる。生演奏が加わる場合も、弦を叩いて弾く奏法による打楽器的なベースが好まれる。ディスコが大人数の弦楽合奏に頼ったのに対し、こちらはシンセサイザーの持続音がその役割を代行し、そのぶん音の隙間が広く残される。和音は電気ピアノやクラビネットによる、ファンク由来の刻みで提示される。歌唱はソウルの伝統を保ちながら、口にくわえた管を通して声を加工する装置が多用され、人間と機械の中間のような響きが加えられる。歌詞は恋愛と踊りの高揚を扱い、深刻さは避けられる。</p>
<h2>成り立ち</h2><p>1979年のディスコ排斥運動の後、アメリカの大手レコード会社は一斉にこの分野から手を引いた。数十人規模の楽団を雇う制作費はもはや正当化できず、必然的に制作は少人数化する。この経済的な制約が、電子楽器への移行を加速させた。同時に、この時期には安価で高性能な機材が次々に登場している。実際のドラムの音を録音した音源を持つリズムマシンや、太い低音を出せる単音のシンセサイザーが普及し、少人数でも厚い音が作れるようになった。ニューヨークでは、PreludeやWest Endといった独立系のレーベルが、この新しい条件のもとで制作を続けた。Leroy BurgessやKashifといった作り手が、少ない要素で最大の効果を出す技術を磨き、この様式の音を確立している。ロサンゼルスではDick Griffeyが運営したSolarが拠点となり、より磨かれた形を提示した。特筆すべき存在がRoger Troutman率いるZappである。彼は口にくわえた管を通して楽器の音を発声器官で加工する装置を徹底的に使いこなし、その独特の声はこの時代を象徴する音となった。ただし彼の生涯は悲劇的に終わる。1999年、彼と兄弟のLarry Troutmanが、兄弟間の争いの末に相次いで死亡するという事件が起きた。この様式は1985年前後に、より重いリズムのニュージャック・スウィングやハウスへ主流を譲る。しかしその遺産は極めて大きい。1990年代前半、西海岸のヒップホップの制作者たちは、この時期の作品を大量に引用してGファンクを作り上げた。とりわけZappの音源は、あらゆる作品で用いられている。2010年代以降は、当時の質感を意図的に再現する作り手が現れ、この様式は再評価の対象となっている。</p>
