<h1>Boogie（ブギー）とは</h1>
<p>1970年代末から1980年代半ばにかけて、ディスコのぜいたくな編成を電子楽器へ置き換えて生まれたダンス音楽である。テンポは概ね110から116 BPM（1分間の拍数）と、ディスコよりやや落ち着いている。特徴的なのは低音の作り方で</p>
<p>1970年代末から1980年代半ばにかけて、ディスコのぜいたくな編成を電子楽器へ置き換えて生まれたダンス音楽である。テンポは概ね110から116 BPM（1分間の拍数）と、ディスコよりやや落ち着いている。特徴的なのは低音の作り方で、1980年代前半にはエレキベースのスラップ奏法（弦を叩いたりはじいたりして弾く奏法）が、1980年代半ば以降にはシンセサイザーによる太く丸い単音の低音が目立つようになる。この低音が跳ねるように動き回ることが、この様式の躍動の主要な要素の一つである。ドラムは初期のリズムマシン（リズムを自動で鳴らす機械）による硬く均質な打点が中心で、2拍目と4拍目のアクセントや、大きな手拍子の音も特徴である。生演奏が加わる場合も、弦を叩いて弾く奏法による打楽器的なベースが好まれる。ディスコが大人数の弦楽合奏（弦楽器の合奏）に頼ったのに対し、こちらはシンセサイザーを中心とした少人数の編成が目立つ。和音は電気ピアノやクラビネット（弦を叩いて鳴らす鍵盤楽器）による、ファンク由来の刻みで示される。歌唱はソウルの伝統を保ちながら、Zappなど一部の作り手は、口にくわえた管を通して楽器の音を口の形で変える装置(トークボックス)を使い、人間と機械の中間のような響きを加えた。歌詞は恋愛と踊りの高揚を扱い、深刻さは避けられる。</p>
<h2>成り立ち</h2><p>1979年のディスコ排斥運動の後、多くのレコード会社は「ディスコ」の名称を避け、「ダンス音楽」として売り出すようになった。この年は米国の音楽産業が数十年で最悪の不況にあり、ディスコが責められたとされる。数十人規模の楽団を雇う制作費を見直す動きが、制作の少人数化と電子楽器への移行を後押ししたという見方がある。同時に、この時期には従来より少人数で扱える機材が登場している。実際のドラムの音を録音した音源を持つリズムマシンや、太い低音を出せる単音のシンセサイザーが普及し、少人数でも厚い音が作れるようになった。ニューヨークでは、PreludeやWest Endといった独立系のレーベルが、この新しい条件のもとで制作を続けた。Leroy BurgessやKashifといった作り手が、少ない要素で最大の効果を出す技術を磨き、この様式の音を確立している。ロサンゼルスではDick Griffeyが運営したSolarが拠点となり、より磨かれた形を示した。特筆すべき存在がRoger Troutman率いるZappである。彼は口にくわえた管を通して楽器の音を発声器官で加工する装置を徹底的に使いこなし、その独特の声はこの時代を象徴する音となった。ただし彼の生涯は悲劇的に終わる。1999年4月25日、兄のLarry Troutmanが彼を射殺した後に自殺したとみられる事件が起きた。動機は明らかでない。この様式は1985年前後に、より重いリズムのニュージャック・スウィングやハウスへ主流を譲る。しかしその残したものは非常に大きい。1990年代前半、西海岸のヒップホップの制作者たちが作り上げたGファンクは、主に1970年代のP-Funkをサンプリング（既存の録音の一部を取り込んで使うこと）や再現して作られ、Zappの音源も多く用いられた。2010年代以降は、当時の質感を意図的に再現する作り手が現れ、この様式は再評価の対象となっている。</p>
<h2>代表曲</h2><ul><li>Give Me the Night (George Benson)</li><li>Juicy Fruit (Mtume)</li><li>A Night to Remember (Shalamar)</li><li>Let It Whip (Dazz Band)</li><li>Fantastic Voyage (Lakeside)</li><li>You're the One for Me (D-Train)</li><li>Ffun (Con Funk Shun)</li><li>I Just Gotta Have You (Lover Turn Me On) (Kashif)</li><li>Make That Move (Shalamar)</li><li>Call Me (Skyy)</li><li>Don't Make Me Wait (Peech Boys)</li><li>Weekend (Class Action)</li></ul>
