<h1>Boogie（ブギー）とは</h1>
<p>ブギは、1970年代末から1980年代半ばにかけて生まれたダンス音楽だ。ポスト・ディスコやファンク、ソウル、R&amp;Bを土台に、アコースティックの楽器と電子楽器を橋渡しする形で形づくられた。テンポは概ね100〜116 BPM前後（1分</p>
<p>ブギは、1970年代末から1980年代半ばにかけて生まれたダンス音楽だ。ポスト・ディスコやファンク、ソウル、R&amp;Bを土台に、アコースティックの楽器と電子楽器を橋渡しする形で形づくられた。テンポは概ね100〜116 BPM前後（1分間の拍数）で、ディスコよりやや落ち着いている。

特徴的なのは低音の作り方だ。エレキベースのスラップ奏法（弦を叩いたりはじいたりして弾く奏法）とシンセ・ベースは、1980年代前半から並んで使われ、1980年代半ば以降はシンセ・ベースの比重が増した。この低音が跳ねるように動き回ることが、このスタイルの躍動を生む主な要素の一つである。生演奏が加わる場合も、弦を叩いて弾く奏法による打楽器のようなベースが好まれる。

ディスコに比べると、弦楽器やブラスの代わりにシンセの音色を使う傾向がある。和音はシンセサイザーや電気鍵盤で弾かれ、ファンクの影響を受けた刻みも見られる。

ドラムはリズムマシン（TR-808など）を使う作品が多い一方、生ドラムを使う作品も多い。2拍目と4拍目のアクセントや、大きな手拍子の音も特徴である。

歌はソウルの伝統を保っている。その一方、Zappなど一部の作り手は、口にくわえた管を通して楽器の音を口の形で変える装置(トークボックス)を使い、人間と機械の中間のような響きを加えた。</p>
<h2>成り立ち</h2><p>1979年のディスコ排斥運動のあと、多くのレコード会社は「ディスコ」という名前を避け、「ダンス音楽」として売り出すようになった。この年、米国の音楽産業は数十年で最悪の不況にあり、ディスコがその責めを負わされたとされる。大編成の楽団を雇う制作費を見直す動きが、制作の少人数化と電子楽器への移行を後押しした、という見方がある。

機材の面では、単音シンセは1970年代から使われていた。1980年前後には、Linn LM-1やOberheim DMXのようなサンプル式のドラムマシンが登場した。ただし当初は高価で、台数も限られていた。安く広く出回るのは、1980年代半ば以降だった。

ニューヨークでは、PreludeやWest Endといった独立系のレーベルが、この新しい条件のもとで制作を続けた。KashifやLeroy Burgessらは、ブギの代表的な作り手とされる。

ロサンゼルスでは、Dick Griffeyが運営したSolarが拠点となった。

中でも特筆すべき存在が、Roger Troutman率いるZappだ。彼は、口にくわえた管を通して楽器の音を発声器官で加工する装置を徹底的に使いこなした。その独特の声は、この時代を代表する音となった。

しかし、彼の生涯は悲劇的に終わる。1999年4月25日、兄のLarry Troutmanが彼を射殺し、その後に自殺したとみられる事件が起きた。動機は明らかでないが、Larryの会社の経営難が背景として報じられている。

1980年代半ば以降、ブギはハウス、エレクトロ、ダンス・ポップ、フリースタイルなどへ分かれ、ほかの音楽に溶け込んでいった。ニュージャック・スウィングが盛んになったのは、1980年代末だった。

1990年代前半、西海岸のヒップホップの制作者たちが作り上げたGファンクは、主に1970年代のP-Funkをサンプリング（既存の録音の一部を取り込んで使うこと）したり再現したりして作られた。そこではZappの音源も多く使われた。

そして2000年代から、当時の質感を再現する作り手が現れた。2010年代後半には、nu-discoやfuture funkの流れの中で再評価が広がった。</p>
<h2>代表曲</h2><ul><li>Give Me the Night (George Benson)</li><li>Juicy Fruit (Mtume)</li><li>A Night to Remember (Shalamar)</li><li>Let It Whip (Dazz Band)</li><li>Fantastic Voyage (Lakeside)</li><li>You're the One for Me (D-Train)</li><li>Ffun (Con Funk Shun)</li><li>I Just Gotta Have You (Lover Turn Me On) (Kashif)</li><li>Make That Move (Shalamar)</li><li>Call Me (Skyy)</li><li>Don't Make Me Wait (Peech Boys)</li><li>Weekend (Class Action)</li></ul>
