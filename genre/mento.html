<h1>Mento（メント）とは</h1>
<p>メントーは、ジャマイカの農村で発達した庶民の音楽である。スカやレゲエに影響を与えた。 編成は簡素だ。バンジョー、生ギター、手で叩く太鼓、竹製の横笛、そしてルンバボックスと呼ばれる独特の低音楽器から成る。このルンバボックスは、木の箱</p>
<p>メントーは、ジャマイカの農村で発達した庶民の音楽である。スカやレゲエに影響を与えた。

編成は簡素だ。バンジョー、生ギター、手で叩く太鼓、竹製の横笛、そしてルンバボックスと呼ばれる独特の低音楽器から成る。このルンバボックスは、木の箱に金属の板を数枚取り付けたものだ。演奏者は箱の上に腰かけ、両手で板を弾いて低音を出す。元はキューバ由来のマリンブラ(アフリカの親指ピアノと同じ系統の楽器)で、それがジャマイカで取り入れられた。この楽器が低音を受け持ち、メントー特有の低音と打楽器的な響きを生む。

曲は長調が中心で、転調は少なく、主要和音で組み立てられる。メロディーは明るく、口ずさみやすい。

リズムは4拍子系で、3-3-2のリズム・パターンが特徴とされる。跳ねた刻みを持つ。スカとの関係については、民族音楽学者Daniel Neelyが、メントーとスカの音楽的なつながりはほぼなく、レゲエの方に近いと述べている。一方で、スカの成立にメントーが影響したという見方も一般的だ。

歌詞は大事な特徴だ。二重の意味を持つ言葉遊びで、性的な内容を巧みに忍ばせる作法が発達した。表向きは農作業や食べ物の話をしながら、聴き手には全く別の意味が伝わるよう仕組まれている。

ほかにも、村の噂話、貧しさや住宅難への嘆き、日常や恋愛が歌われる。政治色は比較的薄いが、社会批評や政治的な含みを持つ曲もある。歌は、村の人たちの記録の役割を果たしてきた。</p>
<h2>成り立ち</h2><p>メントーが生まれた時期を特定するのは難しい。19世紀に、奴隷制の時代から廃止後にかけて、農村の共同体で少しずつ形になったと考えられている。アフリカ由来の打楽器とリズム感覚に、ヨーロッパ由来のカドリールなどの踊りの音楽と弦楽器が組み合わされた。

成立後の20世紀前半に、トリニダードのカリプソの曲がレパートリーに入った。キューバの楽器やスタイルも取り入れた。20世紀前半には、収穫祭、ナインナイトの通夜、家のパーティー、ティー・パーティーで演奏される日常の音楽として根づいていた。

メントーの本格的な録音が78回転盤で現れ始めるのは、1950年代初めだ。1951年、Stanley MottaがキングストンのHanover Streetに録音スタジオ、Motta's Recording Studioを開いた。そのMotta's Recording Studioのレーベルは主にカリプソとメントーを録音したレーベルで、最初のメントー・レーベルと評されることもある。ただ、Ken Khouriのレーベルも、1950年代初頭に最初期のメントー盤を出した。このスタジオはジャマイカ初の民間録音スタジオとされるが、Khouriが先とする本人証言もある。

それ以前にも、1920年代以降、トリニダード出身のSam ManningやLionel Belascoが、ニューヨークでジャズ形式でメントーの曲を録音していた。地元では、Lord FleaやCount Lasherといった歌手が人気を得る。

同じ頃、この音楽は思わぬ形で世界へ届いた。1956年、アメリカの歌手Harry Belafonteが発表した作品『Calypso』が、単独アーティストのLPとして初めて100万枚を売り上げたとされる。そのヒット曲の多くは、メントーやジャマイカ民謡に由来していた(トリニダードのカリプソの曲も含まれる)。当時は、カリブ海の音楽をカリプソという名で売る方が、商業的に有利だった。そのため、メントーもカリプソの名で売られた。

しかし1950年代後半から、メントーの人気は薄れはじめる。1960年代に入ると、都市部では、メントー、カリプソにアメリカのリズム・アンド・ブルースやジャズを組み合わせたスカが人気を集めた。メントーは田舎臭い過去の音楽として、若者から見放された。観光客向けのホテルでの演奏は以前からあり、1960年代以降はそれが主な演奏の場として残った。Jolly Boysのような楽団は、島の北東部のポート・アントニオで外国人相手に演奏を続け、かろうじて命脈をつないだ。この観光地化には、音楽を残すと同時に、本来の社会的な役割を奪うという二つの面があった。

それでも、1980年代末から90年代初頭にJolly Boysが再評価されたのをきっかけに、ジャマイカ音楽の起源をたどる研究と再発の動きが進んだ。今ではメントーは、レゲエに通じる流れの出発点の一つとして見直されている。</p>
