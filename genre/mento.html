<h1>Mento（メント）とは</h1>
<p>ジャマイカの農村で発達した、スカやレゲエに影響を与えた庶民の音楽である。編成は簡素で、バンジョー、生ギター、手で叩く太鼓、竹製の横笛、そしてルンバボックスと呼ばれる独特の低音楽器から成る。このルンバボックスは、木の箱に金属の板を数</p>
<p>ジャマイカの農村で発達した、スカやレゲエに影響を与えた庶民の音楽である。編成は簡素で、バンジョー、生ギター、手で叩く太鼓、竹製の横笛、そしてルンバボックスと呼ばれる独特の低音楽器から成る。このルンバボックスは、木の箱に金属の板を数枚取り付けたもので、演奏者が箱の上に腰かけ、両手で板を弾いて低音を出す。キューバ由来のマリンブラ(アフリカの親指ピアノと同じ系統の楽器)がジャマイカで取り入れられたもので、この楽器の乾いた不安定な低音が、メントーの音を決めている。リズムは4拍子系で、3-3-2のリズム・パターンが特徴とされる。メントーとスカの直接の系譜には、研究者の間で否定的な見解もあり、メントーはスカよりレゲエに近いとも言われる。テンポは中庸で、跳ねた刻みを持つ。和音は三つの音の和音を中心とした単純なもので、メロディーは明るく口ずさみやすい。歌詞は重要な特徴で(ただし初期のメントーは器楽が中心だった)、二重の意味を持つ言葉遊びによって性的な内容を巧みに忍ばせる作法が発達しており、表向きは農作業や食べ物の話をしながら、聴き手には全く別の意味が伝わるよう仕組まれている。加えて、村の噂話、貧しさや住宅難への嘆き、日常や恋愛も歌われ、基本的に政治色は薄く、村の人たちの記録の役割を果たしてきた。</p>
<h2>成り立ち</h2><p>成立の時期を特定することは難しく、19世紀に、奴隷制の時代から廃止後にかけて、農村の共同体で少しずつ形を得たと考えられている。アフリカ由来の打楽器とリズム感覚に、ヨーロッパ由来のカドリールなどの舞踏音楽と弦楽器が組み合わされ、さらに近隣のトリニダードから伝わった要素も混ざっている。20世紀前半には結婚式や収穫祭、教会外の集まりで演奏される日常の音楽として根づいていた。メントーの本格的な録音が78回転盤で現れ始めるのは1950年代初めで、Stanley Mottaが1951年にキングストンにジャマイカ初の民間録音スタジオ、Motta's Recording Studioを開き、そのMRSは主にカリプソとメントーを録音したレーベルで、最初のメントー・レーベルと評されることもあるが、Ken Khouriのレーベルも1950年代初頭に最初期のメントー盤を出した。それ以前にも、カリブのジャズ奏者らがジャマイカの曲を録音していた。Lord FleaやCount Lasherといった歌手が地元で人気を得る。同じ時期、この音楽は思わぬ形で世界へ届いた。1956年、アメリカの歌手Harry Belafonteが発表した作品『Calypso』が、LPとして初めて100万枚を売り上げ、そのヒット曲の多くはメントーやジャマイカ民謡に由来していた(トリニダードのカリプソの曲も含まれる)。当時、カリブ海の音楽といえばカリプソという名で売る方が商業的に有利だったため、区別は意図的に曖昧にされた。この誤解は現在まで尾を引いており、メントーという名が国際的に知られない一因となっている。1950年代後半からメントーの人気は薄れはじめ、1960年代に入ると、都市部ではアメリカのリズム・アンド・ブルースを土台としたスカが台頭し、メントーは田舎臭い過去の音楽として若者から見放された。観光客向けのホテルでの演奏は以前からあり、1960年代以降はそれが主要な演奏の場として残った。Jolly Boysのような楽団が、島の北東部のポート・アントニオで外国人相手に演奏を続けることで辛うじて命脈をつないだ。この観光地化は、音楽を保存すると同時に、本来の社会的な機能を奪うという二つの面を持っていた。しかし1980年代末から90年代初頭にJolly Boysが再評価されたのを皮切りに、ジャマイカ音楽の起源を辿ろうとする研究と再発の動きが進み、メントーはレゲエに通じる系譜の出発点の一つとして再評価されている。</p>
