<h1>Mento（メント）とは</h1>
<p>ジャマイカの農村で発達した、レゲエ以前のあらゆるジャマイカ音楽の母体にあたる民衆音楽である。編成は簡素で、バンジョー、生ギター、手で叩く太鼓、竹製の横笛、そしてルンバボックスと呼ばれる独特の低音楽器から成る。このルンバボックスは、</p>
<p>ジャマイカの農村で発達した、レゲエ以前のあらゆるジャマイカ音楽の母体にあたる民衆音楽である。編成は簡素で、バンジョー、生ギター、手で叩く太鼓、竹製の横笛、そしてルンバボックスと呼ばれる独特の低音楽器から成る。このルンバボックスは、木の箱に金属の板を数枚取り付けたもので、演奏者が箱の上に腰かけ、両手で板を弾いて低音を出す。アフリカの親指ピアノを人が乗れるほど巨大化させたもので、この楽器の乾いた不安定な低音がメントーの音を決定づけている。リズムは4/4拍子だが、強拍が四拍目に置かれるのが最大の特徴で、この後ろへずれた重心が、後のスカにおける裏拍の強調につながったと考えられている。テンポは中庸で、跳ねた刻みを持つ。和声は三和音を中心とした単純なもので、旋律は明るく口ずさみやすい。歌詞こそがこの音楽の核心で、二重の意味を持つ言葉遊びによって性的な内容を巧みに忍ばせる作法が発達しており、表向きは農作業や食べ物の話をしながら、聴き手には全く別の意味が伝わるよう仕組まれている。加えて、村の噂話、政治家への皮肉、貧しさへの嘆きも歌われ、共同体の記録装置として機能してきた。</p>
<h2>成り立ち</h2><p>成立の時期を特定することは難しく、19世紀の奴隷制廃止後、農村の共同体で少しずつ形を得たと考えられている。アフリカ由来の打楽器とリズム感覚に、ヨーロッパ由来のカドリールなどの舞踏音楽と弦楽器が組み合わされ、さらに近隣のトリニダードから伝わった要素も混ざっている。20世紀前半には結婚式や収穫祭、教会外の集まりで演奏される日常の音楽として定着していた。録音として残り始めるのは1950年代で、Stanley MottaがキングストンにMotta's Recording Studioを構え、この音楽を初めて商業的に記録した。Lord FleaやCount Lasherといった歌手が地元で人気を得る。同じ時期、この音楽は思わぬ形で世界へ届いた。1956年、アメリカの歌手Harry Belafonteが発表した作品カリプソが、史上初めて100万枚を売り上げたアルバムとなり、そこに収められた楽曲の多くは、実際にはトリニダードのカリプソではなくジャマイカのメントーだったのである。当時、カリブ海の音楽といえばカリプソという名で売る方が商業的に有利だったため、区別は意図的に曖昧にされた。この誤解は現在まで尾を引いており、メントーという名が国際的に知られない一因となっている。1960年代に入ると、都市部ではアメリカのリズム・アンド・ブルースを土台としたスカが台頭し、メントーは田舎臭い過去の音楽として若者から見放された。演奏の場は観光客向けのホテルへ移り、Jolly Boysのような楽団が、島の東端の保養地で外国人相手に演奏を続けることで辛うじて命脈を保った。この観光地化は、音楽を保存すると同時に、本来の社会的な機能を奪うという二面性を持っていた。しかし1990年代以降、ジャマイカ音楽の起源を辿ろうとする研究と再発の動きが進み、メントーはスカ、ロックステディ、レゲエへと続く系譜の出発点として再評価されている。</p>
