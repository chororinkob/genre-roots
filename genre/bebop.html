<h1>Bebop（ビバップ）とは</h1>
<p>1940年代に確立した、演奏者の技巧と即興を最優先するジャズの様式。テンポはスウィングより速いものが多く、Ko-Koのように約300BPMの曲もあるが、バラードや中庸テンポの曲も演奏される。編成は小規模で、サックスとトランペットの</p>
<p>1940年代に確立した、演奏者の技巧と即興を最優先するジャズの様式。テンポはスウィングより速いものが多く、Ko-Koのように約300BPMの曲もあるが、バラードや中庸テンポの曲も演奏される。編成は小規模で、サックスとトランペットの2管に、ピアノ、ベース、ドラムを加えた5人編成が典型で、3人から7人まで幅がある。最大の特徴は和声（コードの響き）の扱いで、既存の曲の和音進行だけを借り、新しい旋律を書くコントラファクトという手法が多用された。これは使用料や出版社への支払いを避けるという実務的な理由も持つ。和音には9度、11度、13度といったテンション（響きに色合いを足す音）、そしてフラットナインやシャープイレブンといった変化音が加えられ、和音が速く入れ替わる高速の進行が組まれる。即興の旋律は、和音の構成音を素早く駆け上がり、経過音（音をつなぐ短い音）として半音を挟み、拍の裏から始めて小節線をまたぐという作り方をとる。ドラムは時間の基準をライドシンバルのレガート（なめらかな刻み）に移し、バスドラムは弱く弾いて、不意の強打、いわゆるドロッピング・ボムズにも使われる。ベースは1拍ごとに音を刻むウォーキングで進行を支える。演奏は主題の提示、各奏者の即興、そして主題の再現という形式をとり、踊るためではなく聴くために設計されている。</p>
<h2>成り立ち</h2><p>1940年代前半のニューヨーク、ハーレムのクラブで形成された。中心となったのはミントンズ・プレイハウスとモンローズ・アップタウン・ハウスで行われた深夜のジャムセッション（即興で自由に演奏し合う集まり）である。当時、ビッグバンドの演奏者たちは、譜面通りの演奏を求められる仕事の後、こうした場で自由に演奏していた。中心人物はアルト・サックスのCharlie Parker（カンザス州カンザスシティ出身、Birdの愛称で知られる）と、トランペットのDizzy Gillespieである。加えてピアノのThelonious Monk、ドラムのKenny Clarkeが、それぞれの楽器の役割を再定義した。ギターのCharlie Christianは1942年に亡くなったが、その先駆者となった。彼らは意図的に高速のテンポと複雑な和音を用い、技量の劣る者が飛び入りできないようにしたと語られている。1942年から1944年にかけて、米国音楽家組合による録音のストライキが行われ、この様式を形づくる上で最も重要な時期の演奏がほとんど記録されなかったため、様式の成立過程には空白がある。最初の正式なビバップ録音は1944年2月16日のColeman Hawkins名義のセッション（「Woody'n You」）とされ（諸説ある）、1945年に録音されたCharlie ParkerとDizzy Gillespieの一連の音源が、1945年末から1946年にかけて世に出ると、聴衆と批評家は激しく二分された。旧世代の演奏家からは音楽の破壊だと非難され、一方で若い世代からは知的な革新として支持された。社会的な文脈も重要で、この音楽は、商業的な娯楽性より演奏者の芸術性を重んじる「musicians' music」として発展した。人種的な自己主張の表現とみる解釈もある。Charlie Parkerはヘロインと酒に蝕まれ、1955年に34歳で死去したが、検死医は彼を50〜60歳と推定したと伝えられる（資料により53歳、55〜60歳とも）。彼の生き方が芸術家像として模倣され、彼を崇拝して薬物に手を出した演奏家もいたことは、この時代の暗い側面である。</p>
<h2>代表曲</h2><ul><li>A Night in Tunisia (Dizzy Gillespie)</li><li>Anthropology (Charlie Parker &amp; Dizzy Gillespie)</li><li>Round Midnight (Thelonious Monk)</li><li>Cherokee (Charlie Parker)</li><li>Groovin' High (Dizzy Gillespie)</li><li>Ko-Ko (Charlie Parker)</li><li>Salt Peanuts (Dizzy Gillespie)</li><li>Un Poco Loco (Bud Powell)</li><li>Tempus Fugit (Bud Powell)</li><li>Oleo (Sonny Rollins)</li><li>Au Privave (Charlie Parker)</li><li>52nd Street Theme (Thelonious Monk)</li><li>Now's the Time (Charlie Parker)</li><li>Billie's Bounce (Charlie Parker)</li><li>Confirmation (Charlie Parker)</li><li>Donna Lee (Charlie Parker)</li><li>Rhythm-a-ning (Thelonious Monk)</li><li>Shaw 'Nuff (Dizzy Gillespie &amp; Charlie Parker)</li><li>Scrapple from the Apple (Charlie Parker)</li><li>Dexterity (Charlie Parker)</li><li>Woody'n You (Dizzy Gillespie)</li></ul>
