<h1>Bebop（ビバップ）とは</h1>
<p>ビバップは、1940年代に定着した、演奏者の技巧と即興を最優先するジャズのスタイルだ。 編成は小規模だ。サックスとトランペットの2管に、ピアノ・ベース・ドラムを加えた5人編成が典型で、3〜7人の幅がある。 最大の特徴は、和声（コー</p>
<p>ビバップは、1940年代に定着した、演奏者の技巧と即興を最優先するジャズのスタイルだ。

編成は小規模だ。サックスとトランペットの2管に、ピアノ・ベース・ドラムを加えた5人編成が典型で、3〜7人の幅がある。

最大の特徴は、和声（コードの響き）の扱いにある。既存の曲の和音進行だけを借りて、新しい旋律を書くコントラファクトという手法が多用された。これは使用料や出版社への支払いという実務的な理由も持つ。和音には、9度、11度、13度といったテンション（響きに色合いを足す音）が加えられる。フラットナインやシャープイレブンといった変化音も使われ、和音が速く入れ替わる高速の進行が組まれる。

即興の旋律は、和音の構成音を素早く駆け上がる。経過音（音をつなぐ短い音）として半音を挟み、拍の裏から始めて小節線をまたぐという作り方をとる。

テンポは、スウィングより速いものが多い。「Ko-Ko」のように約300BPMの曲もあるが、バラードや中庸テンポも演奏される。

ドラムは、時間の基準をライドシンバルに移した。バスドラムは弱く弾いて、不規則なアクセント（ドロッピング・ボムズ）にも使った。ベースは1拍ごとに音を刻むウォーキングで、進行を支える。

演奏は、主題の提示、各奏者の即興、そして主題の再現という形式をとる。踊るためではなく、聴くために設計されている。</p>
<h2>成り立ち</h2><p>舞台は、1940年代前半のニューヨーク、ハーレムのクラブだ。ビバップは、ここで形成された。

中心となったのは、ミントンズ・プレイハウスとモンローズ・アップタウン・ハウスで行われた深夜のジャムセッション（即興で自由に演奏し合う集まり）である。当時、ビッグバンドの演奏者たちは、譜面通りの演奏を求められる仕事の後、こうした場で自由に演奏していた。

中心人物は、アルト・サックスのCharlie Parker（カンザスシティ出身、Birdの愛称で知られる）と、トランペットのDizzy Gillespieである。加えて、ピアノのThelonious MonkとドラムのKenny Clarkeが、それぞれの楽器の役割を再定義した。ギターのCharlie Christianは1942年に亡くなったが、その先駆者となった。彼らは意図的に高速のテンポと複雑な和音を用いた。技量の劣る者が飛び入りできないようにしたと語られている。

ところが、1942年から1944年にかけて、米国音楽家組合による録音のストライキが行われた。このスタイルを形づくる上で特に重要な時期の演奏が、ほとんど記録されなかった。そのため、スタイルの成立過程には空白がある。

最初の正式なビバップ録音は、1944年2月16日のColeman Hawkins名義のセッション（「Woody'n You」）とされる。1945年に録音されたCharlie ParkerとDizzy Gillespieによる一連の音源は、1945年末から1946年にかけて世に出た。すると、聴衆と批評家は激しく二分された。旧世代の演奏家からは音楽の破壊だと非難された。一方で、若い世代からは知的な革新として支持された。

社会的な文脈も重要だ。ビバップは、商業的な娯楽性より演奏者の芸術性を重んじる「musicians' music」として発展した。人種的自己主張の表現とみる解釈もある。

Charlie Parkerはヘロインと酒に蝕まれ、1955年に34歳で死去した。検死医は彼を50〜60歳と推定したと伝えられる（資料により53歳、55〜60歳とも）。彼の生き方が芸術家像として模倣され、彼を崇拝して薬物に手を出した演奏家もいた。これは、この時代の暗い側面である。</p>
