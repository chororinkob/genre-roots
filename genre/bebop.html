<h1>Bebop（ビバップ）とは</h1>
<p>1940年代に確立した、演奏者の技巧と即興を最優先するジャズの様式。BPMは200から300を超えることも多く、それ以前のスウィングと比べて格段に速い。編成は小規模で、サックスまたはトランペット、ピアノ、ベース、ドラムという四人か</p>
<p>1940年代に確立した、演奏者の技巧と即興を最優先するジャズの様式。BPMは200から300を超えることも多く、それ以前のスウィングと比べて格段に速い。編成は小規模で、サックスまたはトランペット、ピアノ、ベース、ドラムという四人から五人が標準となる。最大の特徴は和声の扱いで、既存の曲の和音進行だけを借り、新しい旋律を書くコントラファクトという手法が多用された。これは著作権の回避という実務的な理由も持つ。和音には九度、11度、13度といったテンション、そしてフラットナインやシャープイレブンといった変化音が加えられ、二拍ごとに和音が変わる高速の進行が組まれる。即興の旋律は、和音の構成音を素早く駆け上がり、経過音として半音を挟み、拍の裏から始めて小節線をまたぐという書法をとる。ドラムはバスドラムで拍を刻むのをやめ、シンバルのレガートに時間の基準を移し、バスドラムは不意の強打、いわゆるドロッピング・ボムズに使われる。ベースは一拍ごとに音を刻むウォーキングで進行を支える。演奏は主題の提示、各奏者の即興、そして主題の再現という形式をとり、踊るためではなく聴くために設計されている。</p>
<h2>成り立ち</h2><p>1940年代前半のニューヨーク、ハーレムのクラブで形成された。中心となったのはミントンズ・プレイハウスとモンローズ・アップタウン・ハウスで行われた深夜のジャムセッションである。当時、ビッグバンドの演奏者たちは、譜面通りの演奏を求められる仕事の後、こうした場で自由に演奏していた。中心人物はアルト・サックスのCharlie Parker（カンザスシティ出身、Birdの愛称で知られる）と、トランペットのDizzy Gillespieである。加えてピアノのThelonious Monk、ドラムのKenny Clarke、ギターのCharlie Christianが、それぞれの楽器の役割を再定義した。彼らは意図的に高速のテンポと複雑な和音を用い、技量の劣る者が飛び入りできないようにしたと語られている。1942年から1944年にかけて、米国音楽家組合による録音のストライキが行われ、この最も形成的な時期の演奏がほとんど記録されなかったため、様式の成立過程には空白がある。1945年、Charlie ParkerとDizzy Gillespieによる一連の録音が発表され、聴衆と批評家は激しく二分された。旧世代の演奏家からは音楽の破壊だと非難され、一方で若い世代からは知的な革新として支持された。社会的な文脈も重要で、この音楽は黒人演奏家が自らの音楽を娯楽産業から取り戻し、芸術として主張する運動という側面を持っていた。Charlie Parkerはヘロインと酒に蝕まれ、1955年に34歳で死去したが、検死医は彼を50代と推定したと伝えられる。彼の生き方が芸術家像として模倣され、多くの若い演奏家が薬物に手を出す結果を招いたことは、この時代の暗い側面である。</p>
<h2>代表曲</h2><ul><li>Ko-Ko (Charlie Parker)</li><li>A Night in Tunisia (Dizzy Gillespie)</li><li>Round Midnight (Thelonious Monk)</li><li>Tempus Fugit (Bud Powell)</li><li>Cherokee (Charlie Parker)</li></ul>
