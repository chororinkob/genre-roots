<h1>Brostep（ブロステップ）とは</h1>
<p>イギリスで生まれたダブステップの構造を土台としながら、その価値観を正反対に転換したアメリカ発の様式である。テンポは140 BPMだが、スネアを三拍目に置く半分の速さの構えを取るため、体感は70 BPM程度の重々しさとなる。決定的に</p>
<p>イギリスで生まれたダブステップの構造を土台としながら、その価値観を正反対に転換したアメリカ発の様式である。テンポは140 BPMだが、スネアを三拍目に置く半分の速さの構えを取るため、体感は70 BPM程度の重々しさとなる。決定的に異なるのは低音の帯域である。本来のダブステップが、人間の耳にはほとんど聞こえず身体で感じる超低音を主役としたのに対し、こちらは中音域に焦点を移した。この帯域で、周波数変調や波形の歪みを駆使して、獣の咆哮や機械の破壊音に似た音を作り出す。この音は小さな再生装置でもはっきり聞こえるため、動画共有サイトを通じた拡散に極めて適していた。構成は緊張と解放の落差に全てを賭ける。導入から積み上げの区間で徐々に高まり、直前に完全な無音を置いてから、最も激しい部分が爆発する。この爆発の瞬間の音の設計こそが作品の価値と見なされ、聴き手はそこだけを何度も繰り返し聴く。上物には人の声を切り刻んだ断片、警報音、金属音が置かれ、旋律や和声はほとんど存在しない。曲は3分から4分で、展開は速い。</p>
<h2>成り立ち</h2><p>2000年代前半、ロンドン南部で生まれたダブステップは、暗く、簡素で、超低音を身体で感じさせる音楽だった。DMZという催しに象徴されるその文化では、音は大きくても攻撃的ではなく、余白と間が重んじられていた。この音がアメリカへ渡ったとき、決定的な変質が起こる。アメリカには広大な野外の祭典の文化があり、そこで求められたのは繊細な低音ではなく、遠くまで届く分かりやすい衝撃だった。この変質を体現したのがSonny Mooreである。彼はもともとポストハードコアのバンドの歌手として活動していたが、脱退後にSkrillexの名で電子音楽へ転じ、2010年に発表した作品で爆発的な成功を収めた。彼の音は、ハードコアの現場で培った攻撃性と、精緻な音色設計を組み合わせたものであり、2012年にはアメリカの主要な音楽賞を複数受賞するに至る。彼が設立したOWSLAというレーベルが拠点となり、カナダのDatsikやアメリカのExcision、イギリスのFlux Pavilionらが続いた。ブロステップという呼称は当初、明確な蔑称だった。兄貴分を意味する俗語を冠したこの語は、繊細さを欠いた粗野な音楽という含みを持ち、イギリスの創始者たちの側から強い拒絶が示された。実際、ロンドンの主要な作り手たちは、この音を自分たちの音楽とは別物だと公言している。この対立は、地域の地下的な音楽が国際市場で商品化される際に繰り返し起きてきた構図の典型例といえる。流行は2013年前後に頂点を迎え、その後急速に飽きられた。しかしSkrillexが持ち込んだ音色設計の技術は、その後のポップスやヒップホップに広く浸透しており、現在の主流の音の一部となっている。</p>
