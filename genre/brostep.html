<h1>Brostep（ブロステップ）とは</h1>
<p>イギリスで生まれたダブステップの構造を土台としながら、その価値観を正反対に転換した様式で、主にアメリカと結びつけて語られる（原点はイギリスにあり、先駆者に英国人のRuskoが挙げられる）。テンポは140 BPMだが、スネア（小太鼓</p>
<p>イギリスで生まれたダブステップの構造を土台としながら、その価値観を正反対に転換した様式で、主にアメリカと結びつけて語られる（原点はイギリスにあり、先駆者に英国人のRuskoが挙げられる）。テンポは140 BPMだが、スネア（小太鼓）を3拍目に置く半分の速さ（ハーフタイム）の構えを取るため、体感は70 BPM程度の重々しさとなる。決定的に異なるのは低音の帯域である。本来のダブステップが、可聴域の下端を強調し、体で感じる低音を主役としたのに対し、こちらは中音域に焦点を移した。この帯域で、周波数変調（音の高さを高速で揺らして複雑な音色を作る手法）や波形の歪みを駆使して、獣の咆哮や機械の破壊音に似た音を作り出す。この音は小さな再生装置でもはっきり聞こえるため、動画共有サイトを通じた拡散に極めて適していた。構成は緊張と解放の落差に全てを賭ける。導入から積み上げの区間（ビルドアップ）で徐々に高まり、直前に完全な無音を置いてから、最も激しい部分が爆発する。この爆発の瞬間の音の設計こそが作品の価値と見なされ、聴き手はそこだけを何度も繰り返し聴く。上物（土台の上に重ねる音）には人の声を切り刻んだ断片、警報音、金属音が置かれ、旋律や和声はほとんど存在しない。曲は3分から4分で、展開は速い。</p>
<h2>成り立ち</h2><p>2000年代前半、ロンドン南部で生まれたダブステップは、暗く、簡素で、超低音を身体で感じさせる音楽だった。DMZ（初回は2005年3月5日）という催しに象徴されるその文化では、音は大きくても攻撃的ではなく、余白と間が重んじられていた。中音域を前面に出す方向は、英国のtearoutスタイル（Coki、Rusko、Caspa）が先行した。Ruskoの2010年のアルバム『O.M.G!』がブロステップの原型とされ、カナダでは2007年にExcisionやDatsikが取り入れた。この変質を体現したのがSonny Mooreである。彼はもともとポストハードコアのバンドの歌手として活動していたが、脱退後にSkrillexの名で電子音楽へ転じ、2010年には中程度の商業的成功を収め、2011年には『Scary Monsters and Nice Sprites』がBillboard Dance/Electronic Albumsで3位になった。彼の音は、ハードコアの現場で培った攻撃性と、精緻な音色設計を組み合わせたものであり、2012年にはアメリカの主要な音楽賞を複数受賞するに至る。Skrillex、Tim Smith、Kathryn Frazier、Clayton Blahaが共同で設立したOWSLA（2011年8月17日に発表）というレーベルが拠点のひとつとなり、同じ流れの中で、カナダのDatsik、同じくカナダのExcision、イギリスのFlux Pavilionらが、それぞれ自分たちのレーベル（Firepower、Rottun Recordings、Circus Records）を拠点に活動した。ブロステップという呼称は当初、明確な蔑称だった。兄貴分を意味する俗語を冠したこの語は、2009年に皮肉として作られた造語で、繊細さを欠いた粗野な音楽という含みを持つ。先駆者のひとりである英国人のRuskoは、拒絶一辺倒ではなく、「ブロステップはある意味で自分のせいだが、今は嫌いになった」と語っている。この対立は、地域の地下的な音楽が国際市場で商品化される際に繰り返し起きてきた構図の典型例といえる。流行は2011〜12年に頂点を迎え（2011年がブロステップの世界的な悪名・知名度のピーク）、2014〜16年にかけて低下した（Skrillexは2014年頃に長期休止、ダブステップ全体の低下は2016年頃から）。しかしSkrillexが持ち込んだ音色設計の技術は、その後のポップスに広く浸透しており、現在の主流の音の一部となっている。</p>
