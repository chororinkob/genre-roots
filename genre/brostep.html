<h1>Brostep（ブロステップ）とは</h1>
<p>ブロステップは、イギリスで生まれたダブステップの骨組みを土台にしながら、その価値観を正反対にひっくり返したスタイルだ。主にアメリカと結びつけて語られるが、原点はイギリスにあり、先駆者には英国人のRuskoが挙げられる。 テンポは1</p>
<p>ブロステップは、イギリスで生まれたダブステップの骨組みを土台にしながら、その価値観を正反対にひっくり返したスタイルだ。主にアメリカと結びつけて語られるが、原点はイギリスにあり、先駆者には英国人のRuskoが挙げられる。

テンポは140 BPM前後だ。ただし、スネア（小太鼓）を3拍目に置く半分の速さ（ハーフタイム）のリズムを取るため、体感は70 BPM程度の重々しさになる。

本来のダブステップとはっきり違うのは、低音の帯域だ。本来のダブステップは、耳に聞こえる範囲の一番下を強調し、体で感じる低音を主役にした。これに対しブロステップは、中音域に焦点を移した。この帯域で、獣のうなり声や機械の破壊音に似た音を作り出す。この音は小さな再生装置でもはっきり聞こえる。旋律は単純で反復的だ。

曲の組み立ては、緊張と解放の落差に全てを賭ける。導入から盛り上げの区間（ビルドアップ）で少しずつ高まり、直前に無音を置いてから、最も激しい部分が爆発する。この爆発の瞬間の音の作り込みこそが、作品の価値と見なされる。展開は速い。</p>
<h2>成り立ち</h2><p>2000年代前半、ロンドン南部でダブステップが生まれた。暗く、簡素で、超低音を身体で感じさせる音楽だった。その文化を代表するのが、DMZ（初回は2005年3月5日）という催しだ。そこでは、余白と間が大切にされていた。

中音域を前面に出す方向は、英国のtearoutスタイル（Coki、Rusko、Caspa）が先に進めていた。Ruskoの2010年のアルバム『O.M.G.!』は、ブロステップの初期の代表作の一つとされる。カナダのExcisionやDatsikは、当初ブロステップの音と結びついた制作者とされる。

この変化を形にしたのが、Sonny Mooreである。彼はもともと、ポストハードコアのバンドで歌手をしていた。脱退後はSkrillexの名で電子音楽へ転じ、中程度の商業的成功を収めた。2011年には『Scary Monsters and Nice Sprites』がBillboard Dance/Electronic Albumsで3位になった。彼の音は、ハードコアの現場で身につけた攻撃性と、細かく作り込んだ音色を組み合わせたものだ。2012年には、第54回グラミー賞で3部門を受賞するに至る。

拠点のひとつとなったのは、OWSLAというレーベルだ。Skrillex、Tim Smith、Kathryn Frazier、Clayton Blahaが共同で設立し、2011年8月17日に発表された。また、カナダのDatsik、同じくカナダのExcision、イギリスのFlux Pavilionらも、それぞれ自分たちのレーベル（Firepower、Rottun Recordings、Circus Records）を拠点に活動した。

ブロステップという呼び名は、当初は冗談として作られ、のちに一部で蔑称として使われた。男同士の仲間呼びの俗語を冠したこの語は、2009年に皮肉として作られた造語だ。繊細さを欠いた粗野な音楽、という含みを持つ。先駆者のひとりである英国人のRuskoは、ただ拒むのではなく、「ブロステップはある意味で自分のせいだが、今は嫌いになった」と語っている。この対立は、地域の地下の音楽が国際市場で商品になるとき、くり返し起きてきた構図の典型的な例といえる。

流行は2011〜12年に頂点を迎えた。ブロステップが世界で最も悪名と知名度を集めたのは、2011年だった。その後、2014〜16年にかけて人気は下がった。ダブステップ全体は、2014年半ばから特に米国で主流の人気が急落した。2016年には、SkrillexがDiploと組んだJack Üのフェス活動の休止が示唆された。それでも、Skrillexが持ち込んだ音色作りの技術は、その後のポップスに広く行き渡り、現在の主流の音の一部となっている。</p>
