<h1>Chicago House（シカゴハウス）とは</h1>
<p>シカゴ・ハウスは、ハウス音楽の原型となった、シカゴ生まれの四つ打ちダンス音楽だ。 骨格は極めて単純だ。Roland TR-808またはTR-909のバスドラムを、1拍ごとに等間隔で置く。その裏の8分音符に、オープンハイハット（シン</p>
<p>シカゴ・ハウスは、ハウス音楽の原型となった、シカゴ生まれの四つ打ちダンス音楽だ。

骨格は極めて単純だ。Roland TR-808またはTR-909のバスドラムを、1拍ごとに等間隔で置く。その裏の8分音符に、オープンハイハット（シンバルを開いて響かせた音）を乗せる。この裏拍のハイハットが生む、前へ引っ張る感覚が、ディスコから受け継いだ特徴の一つになる。

テンポは概ね120BPM前後(115〜130)。スネアかクラップ（手拍子の音）を2拍4拍に置く。TR-909のクラップは、複数回連打する乾いた音が特徴で、定番になった。

ベースは、シンセの単音だ。8分音符または16分音符の反復で、低域を埋める。Roland TB-303を使う場合は、レゾナンス（特定の音を強調するつまみ）を上げた独特の唸りが加わる。

上物（メロディーなど上に重ねる音）は薄い。Roland Juno-106といった安価なシンセによる、コードスタブ(和音を短く突き刺す奏法)が使われる。ディスコやソウルのレコードから抜き出したサンプル（録音の断片）も中心になる。

構成は、DJが繋ぐことを前提としている。ドラム主体の長めのイントロ(16〜32小節程度のことが多い)を置き、要素を一つずつ加えていく。ブレイク（演奏が一瞬止まる部分）で抜き、また戻す。こうした積み上げ方式をとる。

ヴォーカルは、全くないものから、ゴスペル由来の力強い歌が入るものまで幅がある。歌詞は、快楽、自由、そして仲間外れにされた人々の団結を歌うものが多い。

デトロイト・テクノと同時代だが、シカゴ・ハウスは、より生々しくソウルの体温を残している。機材の粗さも隠さない。そこが区別される点である。</p>
<h2>成り立ち</h2><p>1980年代前半のシカゴで、黒人とラテン系のゲイ・コミュニティのクラブ文化から、この音楽は生まれた。

決定的な場所は、The Warehouseというクラブだった。1977年にウェスト・ループ（シカゴ中心部の西側）のサウス・ジェファーソン通りに開店し、ニューヨークから招かれたDJ Frankie Knucklesが専属を務めた。彼は、リール・ツー・リール（オープンリールテープ）の再編集でイントロやブレイクを延ばした。長時間かけて客を高揚させる手法を固めた。

一方、当時のアメリカでは、ディスコへの反動が激しかった。1979年には、シカゴのComiskey Parkで、Disco Demolition Nightが開かれた。野球の試合の合間にディスコのレコードを爆破する催しで、暴動に発展した。この事件を、黒人とゲイの文化への攻撃だったと解釈する見方もある（企画したSteve Dahl本人は否定している）。この事件を一つの目印として、ディスコの主流人気が衰えた。そして1980年代前半、シカゴのDJたちが自ら音源を作り始めた。

Knucklesは、リールテープを切り貼りして曲を延長した。1983〜84年ごろには、Derrick Mayから入手したTR-909を使い始めた(本人は1984年と回想)。

ハウスという名称は、Importes Etc.のレコード店が「As played at the Warehouse」と表示し、それが「house」に縮まったとするChip Eの説がある（名称の由来には諸説ある）。

1982年末〜1983年(資料により異なる)に、KnucklesがThe Power Plantへ移った。Ron HardyはThe Music Boxで、より歪んだ大音量の攻撃的なDJスタイルを展開する。こうして、二つの流れができた。

制作面では、Jesse Saundersの1984年「On and On」が、最初のハウス・レコードとされることが多い。Vince Lawrenceとの共同で、自主制作された。1984年設立のTrax Recordsと、1985年設立のRocky JonesのDJ Internationalが、二大レーベルとなる。Marshall Jefferson「Move Your Body」(1986年)、Steve Silk Hurley「Jack Your Body」(1986年、全英1位)、Phuture「Acid Tracks」(1987年)といった重要作が、ここから送り出された。

Trax Recordsは、粗悪なプレス(一因は再生ビニール)で知られた。しかし、その粗さが逆に音の特徴として認識された。同時に、Traxの経営者Larry Shermanは、長年にわたり制作者へ印税を支払わなかったとして、繰り返し告発されている。多くのアーティストが印税を受け取っていないと主張している。

1986年から1988年にかけて、イギリスでハウスが爆発的に受け入れられた。セカンド・サマー・オブ・ラヴとレイヴ文化を生んだ。

シカゴ本国では、ラジオ局WBMXの番組Hot Mix 5が、ハウスを広めた。1981年に、WBMXの編成部長Lee Michaelsが結成したものだ。

Frankie Knucklesは、2014年に糖尿病の合併症で死去した。シカゴ市は、2004年(存命中)、Jefferson通りの一区画を「Honorary Frankie Knuckles Way」と名誉呼称した。</p>
