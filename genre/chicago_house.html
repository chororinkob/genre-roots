<h1>Chicago House（シカゴハウス）とは</h1>
<p>ハウス音楽の原型となった、シカゴ生まれの四つ打ちダンス音楽。骨格は極めて単純で、Roland TR-808またはTR-909のバスドラムを1拍ごとに等間隔で置き、その裏の8分音符にオープンハイハットを乗せる。この裏拍のハイハットが</p>
<p>ハウス音楽の原型となった、シカゴ生まれの四つ打ちダンス音楽。骨格は極めて単純で、Roland TR-808またはTR-909のバスドラムを1拍ごとに等間隔で置き、その裏の8分音符にオープンハイハットを乗せる。この裏拍のハイハットが生む前へ引っ張る感覚が、ディスコから受け継いだ最大の遺産になる。テンポは118〜128BPMが中心。スネアかクラップを2拍4拍に置き、TR-909のクラップ特有の複数回連打する乾いた音が定番になった。ベースはシンセの単音で、8分音符または16分音符の反復で低域を埋め、Roland TB-303を使う場合はレゾナンスを上げた独特の唸りが加わる。上物は薄く、Roland Juno-106やKorg Poly-800といった安価なシンセによるコードスタブ(和音を短く突き刺す奏法)と、ディスコやソウルのレコードから抜き出したサンプルの断片が中心になる。構成はDJが繋ぐことを前提としており、イントロにドラムだけの32小節を置き、要素を一つずつ加え、ブレイクで抜き、また戻すという積み上げ方式をとる。ヴォーカルは全くないものから、ゴスペル由来の力強い歌が入るものまで幅がある。歌詞は快楽、自由、そして疎外された者の連帯を歌うものが多い。デトロイト・テクノと同時代だが、シカゴ・ハウスはより生々しくソウルの体温を残し、機材の粗さも隠さない点で区別される。</p>
<h2>成り立ち</h2><p>1980年代前半のシカゴで、黒人とラテン系のゲイ・コミュニティのクラブ文化から生まれた。決定的な場所がThe Warehouseというクラブで、1977年にサウスサイドに開店し、ニューヨークから招かれたDJ Frankie Knucklesが専属を務めた。彼はディスコ、フィラデルフィア・ソウル、ヨーロッパの電子音楽、パンク・ファンクを混ぜて長時間かけて客を高揚させる手法を確立した。当時アメリカではディスコへの反動が激しく、1979年にシカゴのComiskey Parkで開かれたDisco Demolition Nightでは、野球の試合の合間にディスコのレコードを爆破する催しが行われ、暴動に発展した。この事件は音楽的な好みの表明を超え、黒人とゲイの文化への攻撃として広く理解されている。ディスコのレコードが市場から消えたことで、KnucklesらDJは自ら音源を作る必要に迫られた。彼はリールテープを切り貼りして曲を延長し、Roland TR-909を重ねて打楽器を補強した。ハウスという名称は、The Warehouseで流れている音楽をレコード店が「house music」と札に書いたことに由来するとされる。1983年にKnucklesがThe Power Plantへ移り、Ron HardyがThe Music Boxで、より歪んだ大音量の攻撃的なDJスタイルを展開して二つの潮流ができた。制作面ではJesse Saundersの1984年「On and On」が最初のハウス・レコードとされることが多く、Vince Lawrenceとの共同で自主制作された。同年設立のTrax Recordsと、Rocky JonesのDJ Internationalが二大レーベルとなり、Marshall Jefferson「Move Your Body」(1986年)、Steve Silk Hurley「Jack Your Body」(1986年、全英1位)、Phuture「Acid Tracks」(1987年)といった重要作を送り出した。Trax Recordsは粗悪な再生プラスチックでレコードをプレスしたことで音質が悪いことで有名だが、その粗さが逆に音の特徴として認識された。同時にTraxの経営者Larry Shermanは長年にわたり制作者へ印税を支払わなかったとして繰り返し告発されており、多くの創始者が経済的な見返りをほとんど得ていないという不正義がこのジャンルの歴史に刻まれている。1986年から1988年にかけてイギリスでハウスが爆発的に受容され、セカンド・サマー・オブ・ラヴとレイヴ文化を生んだ。皮肉なことに、シカゴ本国では主流の商業放送から締め出されたまま長く周縁に置かれた。Frankie Knucklesは2014年に糖尿病の合併症で死去し、シカゴ市は彼の名を冠した通りを制定している。</p>
<h2>代表曲</h2><ul><li>On and On (Jesse Saunders)</li><li>Move Your Body (Marshall Jefferson)</li><li>Can You Feel It (Larry Heard)</li></ul>
