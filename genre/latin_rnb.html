<h1>Latin R&amp;Bとは</h1>
<p>アメリカのR&amp;Bの歌い方と音づくりに、ラテンアメリカのリズムと言語を混ぜ合わせた音楽。土台になるのはR&amp;Bの緩やかなグルーヴだが、そこにレゲトンのデンボウと呼ばれる跳ねた基本リズム、バチャータのギターの装飾、サルサのモントゥーノ的</p>
<p>アメリカのR&amp;Bの歌い方と音づくりに、ラテンアメリカのリズムと言語を混ぜ合わせた音楽。土台になるのはR&amp;Bの緩やかなグルーヴだが、そこにレゲトンのデンボウと呼ばれる跳ねた基本リズム、バチャータのギターの装飾、サルサのモントゥーノ的な鍵盤の反復、あるいはボンゴやティンバレスといった打楽器が加わる。テンポは毎分80から100拍程度が中心で、体を左右に揺らす速度に置かれる。和音は短調の循環進行が多く、四つの和音を延々と回す構成が定番で、切なさと官能が同居する響きを作る。歌唱はR&amp;Bのメリスマや細かい装飾を用いながら、スペイン語の母音の響きに合わせて伸びやかに歌われ、英語とスペイン語が一つの曲の中で自在に行き来する。歌詞は恋愛と欲望を中心に、移民としての二重の帰属、故郷への想い、都市での孤独といった主題も扱われる。曲の後半にラップの客演が入る構成が定型になっている。演奏の場はクラブとラジオ、そして家族の集まる祝いの席の双方で、世代を越えて共有される点も特徴である。同じラテン系の音楽でも、伝統的なサルサやメレンゲが生演奏の管楽器と踊りの規則に支えられているのに対し、こちらは打ち込みを基本とし、歌の質感で聴かせる点が異なる。</p>
<h2>成り立ち</h2><p>土台はニューヨークにある。1960年代、プエルトリコ系の若者たちがドゥーワップとソウルを英語で歌うブーガルーを生み、1970年代のサルサの隆盛を経て、1980年代半ばにはフリースタイルという電子的なダンス音楽が生まれた。この流れの上で、1990年代に入ると事情が変わる。アメリカのラテン系人口が急速に増え、二つの言語と文化の間で育った世代が主要な聴き手になったためである。決定的な役割を果たしたのがMarc Anthonyで、1990年代末に英語とスペイン語の双方でアルバムを出し、サルサとポップスの間を行き来した。同じ頃、プエルトリコのグループSon by Fourや、ドミニカ系のAventuraが登場する。とりわけAventuraは、Romeo Santosを中心にバチャータのギターにR&amp;Bの歌唱とラップを重ね、2002年の『Obsesión』でヨーロッパ各国の一位を取った。彼らは移民二世としてニューヨークのブロンクスで育っており、両方の文化を等分に持っていたことがこの音楽の核心だった。2000年代にはレゲトンが世界市場に出て、Daddy YankeeやDon Omarの成功が土台を広げ、2010年代にはPrince Royce、Leslie Grace、Becky Gらが続いた。2017年、『Despacito』の世界的成功でスペイン語の曲が英語圏の主流に入る道が完全に開かれ、以後はKali Uchis、Rauw Alejandro、Sech、Jhayco といった作り手が、R&amp;Bの質感とラテンのリズムを自在に組み合わせている。背景には、ストリーミングの普及によって言語の壁が実質的に消え、市場が国境ではなく好みで分かれるようになったことがある。</p>
