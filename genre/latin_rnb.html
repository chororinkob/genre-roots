<h1>Latin R&amp;Bとは</h1>
<p>この音楽は、アメリカのR&amp;Bの歌い方と音づくりに、ラテンアメリカのリズムと言語を混ぜ合わせたものだ。ここでは2000年代以降のスペイン語R&amp;Bを指す。1960年代のブーガルーが「ラテン・R&amp;B」と呼ばれる場合もある。 音づくりは打</p>
<p>この音楽は、アメリカのR&amp;Bの歌い方と音づくりに、ラテンアメリカのリズムと言語を混ぜ合わせたものだ。ここでは2000年代以降のスペイン語R&amp;Bを指す。1960年代のブーガルーが「ラテン・R&amp;B」と呼ばれる場合もある。

音づくりは打ち込みが中心だ。曲によって、ラテンのリズムや楽器が加わる。

リズムの土台は、R&amp;Bのゆったりしたノリだ。そこに、レゲトンのデンボウと呼ばれる跳ねた基本リズムが加わる。テンポは中くらいからゆっくりめの曲が多く、体を左右に揺らす速さに置かれる。

歌い方はR&amp;Bの細かい節回しや飾りを使いながら、スペイン語の母音の響きに合わせて伸びやかに歌う。言葉は基本はスペイン語で、英語を混ぜる曲もある。歌が中心で、ときにラップが入る。

歌詞は、悲しみ、失恋、性愛が中心だ。演奏の場は、クラブとラジオだ。

同じラテン系の音楽でも、伝統的なサルサは生演奏のホーンと踊りの規則に、メレンゲはアコーディオンとタンボラが主体の生演奏と踊りの規則に支えられている。これに対してこの音楽は、打ち込みを基本とし、歌の質感で聴かせる点が違う。</p>
<h2>成り立ち</h2><p>ラテン・R&amp;Bは、ラテンアメリカとアメリカで生まれ、2000年代〜2010年代に形になった。

1960年代、ニューヨークのキューバ系・プエルトリコ系の若者たちが、R&amp;Bやソウルとマンボ、ソン・モントゥーノを融合し、英語とスペイン語を併用するブーガルーを生んだ。ラテン・R&amp;Bと、このブーガルーやラテン・ソウルとの歴史的なつながりを指摘する見方もある。一方、1970年代に盛んになったサルサや、1980年代初頭に生まれた電子的なダンス音楽のフリースタイル（1983年のShannon「Let the Music Play」が、しばしば最初のフリースタイル曲とされる）は、別の流れのラテン系ダンス音楽である。

1990年代に入ると、事情が変わる。アメリカのラテン系人口が急速に増え、二つの言語と文化の間で育った世代が、主な聴き手になったためと考えられる。同じ時代のラテン系アーティストの一例がMarc Anthonyだ。英語とスペイン語の両方で活動し、1990年代末にもアルバムを出して、サルサとポップスの間を行き来した。

なお、ラテン・R&amp;Bの起源は、R&amp;Bやニュージャックスウィングの影響を受けたラテン・ポップ（例：1994年のSelena &amp; Barrio Boyzz「Donde Quiera Que Estés」）にたどれるとされる。同じ頃、プエルトリコのグループSon by Fourや、ドミニカ系のAventuraが登場する。

とりわけAventuraは、Romeo Santosを中心に、バチャータのギターにR&amp;Bの歌唱を重ねた（ポップ、ヒップホップ、ロックも融合したとされる）。2002年に発表された『Obsesión』（Judy Santosが女性ボーカルで参加）は、2003〜2004年にかけてヨーロッパ各国でヒットした（フランス、イタリア、ドイツなどで1位）。彼らはニューヨーク育ちで、ドミニカとアメリカの文化の間で活動した。Aventuraの例は、移民社会の若者がR&amp;Bとバチャータを混ぜた一例である。

2000年代にはレゲトンが世界の市場に出て、Daddy YankeeやDon Omarの成功が土台を広げたと考えられる。2010年代には、Prince RoyceがR&amp;Bを取り入れたバチャータで知られた。Leslie GraceやBecky Gは、ラテン系ポップの歌手である。

2017年、『Despacito』のリミックス版が、スペイン語が主体の曲として、1996年の「Macarena」以来の全米1位（16週連続）になった。スペイン語の曲が英語圏の主流に入った例である。一方、ラテン・トラップの広がりが、R&amp;Bらしい作風の受け入れを後押しした。その後は、Kali Uchis、Rauw Alejandro、Sech、Jhaycoといった作り手が、R&amp;Bの質感とラテンのリズムを自在に組み合わせている。背景には、ストリーミングの普及で、スペイン語の音楽が世界各地へ広がり、言語の壁が低くなったことがある。

この音楽の成り立ちには諸説あり、広く人気が出たのは2010年代後半とされる。</p>
