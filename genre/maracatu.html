<h1>Maracatu（マラカトゥ・ナサォン）とは</h1>
<p>マラカトゥの音の中心は、肩に担いだ低音太鼓アルファイアの重低音である。直径40〜60センチほどの胴に動物の皮を張ったアルファイアを5〜10台重ね、木槌で打つと、大地を揺るがすような深いビートが生まれる。そこに鍛鉄製の鐘ゴンゲの鋭い</p>
<p>マラカトゥの音の中心は、肩に担いだ低音太鼓アルファイアの重低音である。直径40〜60センチほどの胴に動物の皮を張ったアルファイアを5〜10台重ね、木槌で打つと、大地を揺るがすような深いビートが生まれる。そこに鍛鉄製の鐘ゴンゲの鋭い金属音が絡み、小太鼓カイシャの連打、ひょうたん製シェイカー・アベーと金属筒ミネイロのざらついた響きが重なる。リズムは2拍子系で、テンポは毎分90〜115拍。ゴンゲが基準の拍を刻み、アルファイア群が「バッキ・ヴィラード（裏返った打ち方）」と呼ばれる、表拍と裏拍が噛み合うシンコペーションの反復で応答する。外した拍に重心を置くこの感覚が、マラカトゥ独自の浮遊感を生む。歌は独唱者メストレが短い定型句を歌い、女性合唱がそれを反復する掛け合い形式が基本。旋律は狭い音域の反復的な動機で、和声の複雑さよりも声と太鼓の接着を重視する。歌詞はコンゴの王と女王、祖先、オリシャ神々、戴冠の儀式を祝う内容が多く、古いポルトガル語も残る。行列の先頭ではダマ・ド・パッソが祖先を象徴するカルンガ（Calunga）の人形を抱えて進む。一方、農村型のマラカトゥ・ルラル（バッキ・ソウトゥ）は、トロンボーンやトランペット、サックスが旋律を吹き鳴らし、太鼓はより速く荒々しい。カーニバルの通りでは、カボクロ・デ・ランサが派手な衣装で舞い、王と女王がゆっくりと歩む。教会の儀式とアフリカ系宗教の祭祀が一体化した行列が、祝祭空間を作り上げる。近年の舞台ではマイクを通してエコーやディレイが掛かることもあるが、カーニバルの路上では太鼓の生音が建物に反響するだけである。</p>
<h2>成り立ち</h2><p>マラカトゥの物語は、ブラジル北東部ペルナンブーコ州の港湾都市レシフェとオリンダを中心に展開する。ポルトガル植民地時代、奴隷として連れて来られたアフリカ系の人々は、カトリック教会の黒人信心会ノッサ・セニョーラ・ド・ロザリオ・ドス・プレトス信心会を組織し、その内部で「コンゴ王戴冠式」と呼ばれる儀式を営んだ。アンゴラやコンゴ地方に因んだ王と女王を選び、冠を授けて行列するこの習慣が、打楽器と踊りを伴うマラカトゥ・ナサォンの原型とされる。最も古い記録は1711年に遡り、最も古い団体のひとつとされるナサォン・エレファンテは1800年、黒人奴隷マヌエル・サンチアゴによってレシフェで創設された。ただし活動の中断があったとされ、途切れずに活動を続けている団体としては1863年創設のナサォン・レアォン・コロアードが最古とされる。1906年にはコスメ・ダミアン・タヴァレスがナサォン・エストレーラ・ブリリャンテ・ド・レシフェを興し、1877年生まれのドナ・サンタはエレファンテの女王として長年君臨し「マラカトゥの母」として慕われた。1888年の奴隷解放（黄金法）後も、マラカトゥは黒人コミュニティの誇りと記憶の表現として受け継がれた。一方、レシフェ郊外の製糖地帯ゾーナ・ダ・マータでは農園労働者たちが別系統のマラカトゥ・ルラル（バッキ・ソウトゥ）を育み、金管楽器とカボクロ・デ・ランサを主役とする劇場的な祝祭へ発展させた。同じ州のカーニバルにはフレヴォも生まれ、両者はペルナンブーコ文化の双璧となる。20世紀後半、民俗学の研究が進み、1974年にはジョルジュ・マウトネルとネウソン・ジャコビナの手による「マラカトゥ・アトミコ」がジルベルト・ジルのプロデュースで発表され、都会のポピュラー音楽と結び付いた。1990年代、レシフェの若者たちはマラカトゥやココ、シランダ、エンボラーダといった地元リズムと、ファンク、ヒップホップ、ロックを混ぜた「マンゲ・ビート」運動を起こす。旗手となったシコ・サイエンス＆ナサォン・ズンビは、1994年の『ダ・ラマ・アオ・カオス』と1996年の『アフロシベルデリア』でマラカトゥの鼓動を世界に響かせた。シコ・サイエンスは1997年2月、交通事故で急逝したが、その衝撃はブラジル音楽史に深い爪痕を残した。2014年には、マラカトゥ・ナサォンとマラカトゥ・デ・バッキ・ソウトゥの両系統が、ブラジル政府機関IPHANによってブラジルの文化遺産（無形文化遺産）に登録された。今日も毎年のカーニバルには数十のナサォンが繰り出し、レシフェの旧市街にアルファイアの重低音が鳴り響いている。</p>
