<h1>Maracatu（マラカトゥ・ナサォン）とは</h1>
<p>マラカトゥの音の中心は、肩に担いだ低音太鼓アルファイアの重低音だ。動物の皮を張ったアルファイアを多数そろえ、太い木のスティック（バケッタ）で打つ。すると、大地を揺るがすような深いビートが生まれる。アルファイアの直径は一般に約30〜</p>
<p>マラカトゥの音の中心は、肩に担いだ低音太鼓アルファイアの重低音だ。動物の皮を張ったアルファイアを多数そろえ、太い木のスティック（バケッタ）で打つ。すると、大地を揺るがすような深いビートが生まれる。アルファイアの直径は一般に約30〜60センチで、種類によって違う。

そこに、金属製の鐘ゴンゲの鋭い金属音が絡む。さらに小太鼓カイシャの連打と、ひょうたん製シェイカー・アベー、金属筒ミネイロのざらついた響きが重なる。

リズムは2拍子系で、テンポは中くらいとされる。ゴンゲが基準の拍を刻み、アルファイア群がそれに応える。その打ち方は「バッキ・ヴィラード（裏返った打ち方）」と呼ばれ、表拍と裏拍が噛み合うシンコペーション（拍をずらして強調するリズム）を繰り返す。外した拍に重心を置くこの感覚が、マラカトゥならではの浮遊感を生むとされる。

歌は、独唱者が短い決まった句を歌い、女性合唱がそれを繰り返す掛け合いが基本だ。旋律は、狭い音域の短いまとまりを繰り返すとされる。和音の複雑さよりも、声と太鼓がぴったり合うことを大事にするとされる。歌詞は、コンゴの王と女王、祖先、オリシャ神々、戴冠の儀式を祝う内容が多い。

行列は旗手が先導する。そのすぐ後ろで、ダマ・ド・パッソが祖先を表すカルンガ（Calunga）の人形を捧げ持つ。一方、農村型のマラカトゥ・ルラル（バッキ・ソウトゥ）では、トロンボーンやトランペット、サックスが旋律を吹き鳴らし、太鼓はより速く荒々しい。カーニバルの通りでは、ナサォンの行列で王と女王がゆっくりと歩む。農村型のマラカトゥ・ルラルでは、カボクロ・デ・ランサが派手な衣装で舞う。

興行や祭りとしては、世俗的な面もある。ただし、カルンガや団体の土台は宗教（シャンゴー、ジュレマ、カンドンブレ）と深く結び付いている。伝統的なナサォンは、カンドンブレやジュレマ（先住民起源でアフリカの影響を受けた宗教）の聖所を拠り所にしている。</p>
<h2>成り立ち</h2><p>マラカトゥは、ブラジル北東部ペルナンブーコ州の港湾都市レシフェとオリンダを中心に育った。

ポルトガルの植民地だった時代、奴隷として連れて来られたアフリカ系の人々は、カトリック教会の黒人信心会ノッサ・セニョーラ・ド・ロザリオ・ドス・プレトス信心会をつくった。その中で営まれたのが、「コンゴ王戴冠式」と呼ばれる儀式だ。アンゴラやコンゴ地方にちなんだ王と女王を選び、冠を授けて行列する。この習慣が、打楽器と踊りを伴うマラカトゥ・ナサォンの原型とされる。ただし近年の歴史研究には、この「連続」という捉え方そのものを問題にする批判もある。

最古の記録は諸説あり、年代は確定していない。最も古い団体のひとつとされるのは、ナサォン・エレファンテだ。1800年、黒人奴隷マヌエル・サンチアゴを主な創設者のひとりとして、レシフェで創設されたとされる。ただし、活動の中断があったとされる。途切れずに活動を続けている団体としては、1863年創設のナサォン・レアォン・コロアードが最古とされることが多い。ただし、イガラスの1824年説など異説もある。

1906年には、コスメ・ダミアン・タヴァレスがナサォン・エストレーラ・ブリリャンテ・ド・レシフェを興した。1877年（1876年説もある）生まれのドナ・サンタは、エレファンテの女王として長く君臨した。彼女は「マラカトゥの家母長（matriarca）」として慕われた。1888年の奴隷解放（黄金法）の後も、マラカトゥは黒人コミュニティの誇りと記憶の表現として受け継がれた。

一方、レシフェから内陸寄りの製糖地帯ゾーナ・ダ・マータ（ナザレ・ダ・マタなど）では、農園労働者たちが別系統のマラカトゥ・ルラル（バッキ・ソウトゥ）を育てた。彼らはこれを、管楽器（トロンボーン、トランペット、サックス、クラリネットなど）とカボクロ・デ・ランサを主役にした、劇のような祝祭へ発展させた。同じ州のカーニバルからはフレヴォも生まれ、両者はペルナンブーコ文化の双璧と評される。

20世紀後半には、民俗学の研究が進んだ。ジョルジュ・マウトネルとネウソン・ジャコビナが作った「マラカトゥ・アトミコ」は、1974年のマウトネルのLPに収録され（ジルベルト・ジルが製作）、都会のポピュラー音楽と結び付いた。ジルベルト・ジルによるシングル録音の時期は、1973年とも1974年ともされる。

1990年代、レシフェの若者たちは「マンゲ・ビート」運動を起こす。マラカトゥやココ、シランダ、エンボラーダといった地元のリズムに、ファンク、ヒップホップ、ロックを混ぜたものだ。旗手となったシコ・サイエンス＆ナサォン・ズンビは、1994年の『ダ・ラマ・アオ・カオス』と1996年の『アフロシベルデリア』を発表した。『ダ・ラマ・アオ・カオス』は1995年にアメリカでも発売された。シコ・サイエンスは1997年2月、交通事故で急逝した。その衝撃は、ブラジル音楽史に深い爪痕を残したと評される。

2014年には、マラカトゥ・ナサォンとマラカトゥ・デ・バッキ・ソウトゥの両系統が、ブラジル政府機関IPHANによってブラジルの文化遺産（無形文化遺産）に登録された。今日も毎年のカーニバルには、数には諸説あるものの、20〜25団体ほどとされるナサォンが繰り出し、レシフェの旧市街にアルファイアの重低音が鳴り響いている。</p>
