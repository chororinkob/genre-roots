<h1>Smooth Soul（スムースソウル）とは</h1>
<p>1970年代前半に成立・発展した、角を丸く削って、なめらかさを追い求めたソウルだ。 中心になるのはストリングスセクションで、主役級の役割を果たす。高音の弦が長く伸び、ゆるやかに上下しながら全体を包む。そこにフルート、フレンチホルン</p>
<p>1970年代前半に成立・発展した、角を丸く削って、なめらかさを追い求めたソウルだ。

中心になるのはストリングスセクションで、主役級の役割を果たす。高音の弦が長く伸び、ゆるやかに上下しながら全体を包む。そこにフルート、フレンチホルン、ハープ、ビブラフォンといった、輪郭の柔らかい楽器が加わる。ギターは、ワウペダルを浅くかけて16分音符を刻んだり、コーラスのかかったクリーンな音で和音を伸ばしたりすることが多い。ベースは温かく伸ばす傾向があるが、フィラデルフィア系ではうねるベースも特徴だ。

和音にはジャズの影響があり、メジャーセブンスやナインスが多い傾向がある。内側の声部が半音で滑るように動き、甘さを生むこともある。

テンポはおおむね70〜105 BPM程度で、スローからミッドテンポだ。ドラムは抑えめの傾向があるが、フィラデルフィア系ではハイハットの刻みも特徴である。

いちばんの特徴は歌い方にある。ファルセットを使うグループが目立つが、ゴスペル由来の力強い歌声のリードも多い。男性グループでは、リードのファルセットと、その下に敷かれた滑らかな3声のコーラス、そして曲の合間に挟まれる語りがよく使われる傾向がある。

歌詞は愛の告白、別れの悲しみ、仲直りの願いが中心だ。性的な暗示も、上品なたとえに包まれる。

同じ時代のサザンソウルが汗と叫びを持ち味にしたのに対し、こちらは洗練と静けさを大切にする傾向がある。大人向けラジオやポップ市場に向けた、洗練された音作りがされている。</p>
<h2>成り立ち</h2><p>1970年代初頭のアメリカで、このスタイルは成立した。母体となったフィラデルフィア・ソウルは、1960年代末からの音楽である。発展の場は、フィラデルフィアやモータウンなど複数の拠点にわたった。

フィラデルフィアでは1971年、作曲と制作のコンビであるKenny GambleとLeon Huffが、レーベルPhiladelphia International Recordsを設立した。専属のスタジオバンドMFSBを抱え、弦とホーンを厚く重ねた音を次々に生み出した。The O'JaysやHarold Melvin and the Blue Notes（1972年に所属）といったグループが、ここから出た。

制作者で編曲家のThom Bellも、このレーベルの設立に関わった人物だ。一方で、Delfonics（Philly Groove）やStylistics（Avco）では、レーベルの外で制作した。編曲には、フレンチホルン、オーボエ、ハープなどを取り入れた。

シカゴ・ソウルの流れからは、Curtis Mayfieldが出た。1970年にImpressionsを離れて独立し、社会的なテーマの強い作品を出した。

ロサンゼルスでは、Barry Whiteが40人編成のLove Unlimited Orchestraを従えた。低い語りと厚い弦による色っぽいスタイルを作り上げた一人とされる。この楽団の結成は1972年で、1973年とする説もある。『Love's Theme』は1973年11月に発売され、1974年初めに全米1位となった。

録音技術の進歩も背景にあったとされる。多重録音のトラック数が増え、弦を何度も重ねて録れるようになった。また、FM放送は1970年代を通じて広がり、1976年にはWHUR-FMでクワイエット・ストームの番組形式が始まった。

社会の面では、公民権運動の盛り上がりが一段落した時期にあたる。黒人中産階級は1960年代に大きく広がり、1970年代には伸びが止まった。公民権運動のあとに広がった中産階級が、1970年代の聴き手になった。そこでは闘争よりも、豊かさと親密さを描く音楽が求められた。

このスタイルは、そのまま1970年代後半のディスコとクワイエット・ストームへ流れ込んだ。その呼び名は、Smokey Robinsonの1975年のアルバム『A Quiet Storm』の表題曲『Quiet Storm』から来ている。1980年代以降はラジオの深夜番組でよく流されたとされ、1990年代のヒップホップでもサンプリングの素材として使われることがあった。</p>
