<h1>Smooth Soul（スムースソウル）とは</h1>
<p>1970年代前半に完成した、角を丸く削り落として滑らかさを追求したソウル。テンポは毎分70から95拍程度と遅めで、ドラムは強く叩かず、ブラシやリムショットで柔らかく置かれる。編成はストリングスセクションが主役級の役割を果たし、高音</p>
<p>1970年代前半に完成した、角を丸く削り落として滑らかさを追求したソウル。テンポは毎分70から95拍程度と遅めで、ドラムは強く叩かず、ブラシやリムショットで柔らかく置かれる。編成はストリングスセクションが主役級の役割を果たし、高音の弦が長い持続音とゆるやかな上下運動で全体を包む。そこにフルート、フレンチホルン、ハープ、ビブラフォンといった、輪郭の柔らかい楽器が加わる。ギターはワウペダルを浅くかけて16分音符を刻むか、コーラスのかかったクリーントーンで和音を伸ばす。ベースは音数を抑えて長い音を弾く。和声はジャズの影響でメジャーセブンスやナインスが多く、半音で滑る内声の動きが甘さを生む。歌唱に最大の特徴があり、張り上げるゴスペル的な絶唱を避け、ファルセットを多用してささやくように歌う。男性グループの場合は、リードのファルセットと、その下に敷かれた滑らかな三声のコーラス、そして曲間に挟まれる語りが定番である。歌詞は愛の告白、別離の悲しみ、和解の願いが中心で、性的な暗示も上品な比喩に包まれる。同じ時代のサザンソウルが汗と叫びを持ち味にしたのに対し、こちらは徹底して洗練と静けさを価値とし、家庭の居間や高級な夜の店で鳴らされることを想定して作られている。</p>
<h2>成り立ち</h2><p>この様式が確立したのは1960年代末から70年代前半のアメリカで、二つの都市が中心になった。ひとつはフィラデルフィアで、作曲・制作の組であるKenny GambleとLeon Huffが1971年にレーベルPhiladelphia International Recordsを設立し、専属スタジオバンドMFSBを擁して、弦とホーンを厚く重ねた音を量産した。The O'Jays、Harold Melvin and the Blue Notes、The Stylistics、The Delfonicsといったグループがここから出た。とりわけ制作者Thom Bellは、フレンチホルンやオーボエといったクラシックの楽器をソウルに導入し、この様式の音色を決定づけた人物である。もうひとつはシカゴで、Curtis Mayfieldが1970年に独立し、社会的な主題を柔らかい音で歌う道を開いた。ロサンゼルスではBarry Whiteが1973年、40人編成のLove Unlimited Orchestraを従え、低い語りと厚い弦による官能的な様式を作り上げた。背景には技術的な条件があった。多重録音のトラック数が増え、弦を何度も重ねて録れるようになったこと、そしてFM放送の普及により、音質のよい落ち着いた音楽を流す局が増えたことである。社会的には、公民権運動の高揚が一段落し、黒人中産階級が拡大した時期にあたり、闘争よりも豊かさと親密さを描く音楽が求められた。この様式はそのまま1970年代後半のディスコとクワイエット・ストームへ流れ込み、Smokey Robinsonの1975年の同名曲がその呼び名の由来となった。1980年代以降はラジオの深夜番組の定番となり、1990年代のヒップホップでは最も好んでサンプリングされる素材のひとつになった。</p>
