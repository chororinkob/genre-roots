<h1>Latin Trap（ラテントラップ）とは</h1>
<p>ラテン・トラップは、アメリカ南部のトラップの音づくりを、スペイン語のラップと歌に組み合わせた音楽だ。 骨格はトラップそのままである。TR-808の低音が長く伸びて、音程を持つ。ハイハットは三連符（1拍を三つに分けた形）や16分音符</p>
<p>ラテン・トラップは、アメリカ南部のトラップの音づくりを、スペイン語のラップと歌に組み合わせた音楽だ。

骨格はトラップそのままである。TR-808の低音が長く伸びて、音程を持つ。ハイハットは三連符（1拍を三つに分けた形）や16分音符で細かく転がる。スネアやクラップ（手拍子の音）は、小節の3拍目に置かれて乾いて鳴る。これがハーフタイム（拍の進みが半分に感じられる形）だ。

テンポはおおむね70前後(体感)、140前後(表記)で、幅は50〜88(100〜176)である。

ここにラテンの要素が加わる。ドラムには、レゲトンのデンボウ（跳ねるリズムの型）のリズムが混ざる。上物（メロディーなど上に重ねる音）には、ナイロン弦ギターの短い旋律などが置かれることもある。

ダークな音色や短調の雰囲気が特徴だが、パーティーやクラブでも機能する。

歌唱の扱いが独特で、ラップと歌の境界がない。ピッチ補正（音程の自動補正）を強くかけた声が旋律を歌い、しばしば複数の歌手が一曲を分け合って交代する。

歌詞はスペイン語で、路上の生活、暴力、性、麻薬を中心に露骨に描く。地元の俗語と英語の単語が混ざる。歌詞は誇示と内省の両面がある。</p>
<h2>成り立ち</h2><p>発祥時期は不明で議論がある。ニューヨークのドミニカ系のシーンがプエルトリコのシーンの先だった、という見方もある。Ozunaは2007年の『El Pistolón』が起源だと述べ、De La Ghettoは自身が2005〜06年頃からトラップをやっていたと述べている。

2014年頃、ソーシャルメディアを通じて、プエルトリコのAlvaro DiazやMyke Towersらが注目され始めた。当時この島は深刻な財政危機のさなかにあり、これは背景として指摘されることがある。2014年の格下げで危機が始まり、2017年1月には債券債務が約700億ドルに達した。

レゲトンは2000年代半ば以降も商業的に主流であり続けた。一方、ラテン・トラップは主流の外から「新しく新鮮なもの」として広がった。若い世代は、アメリカのアトランタで生まれたトラップに新しい言語を見出した。

初期の担い手には、Arcángel、De La Ghettoらがいた。ニューヨーク在住のドミニカ系で先駆者の一人とされるMessiahもその一人だ。ただし、最もよく知られた担い手の一人がBad Bunnyである。本名はBenito Antonio Martínez Ocasio。彼は、スーパーマーケットで袋詰めの仕事をしながらSoundCloudに曲を上げていた。2016年の『Diles』が制作者DJ Luianの目に留まり、Hear This Musicと契約した（2016年7月とする資料あり）。

同じ時期、コロンビアのMaluma、プエルトリコのAnuel AAが人気を集める。Anuelは2016年4月に逮捕・勾留された。2017年6月に連邦刑務所で30か月の判決を受け、2018年7月に出所した。この間、電話で録音した曲を発表した。制作面では、DJ Luian、Mambo Kingz、Hi Music Hi Flowといった制作者たちが、音の共通の表現を作った。

2017年の『Despacito』の世界的成功は、レゲトン側の出来事だった。2018年、Cardi B、Bad Bunny、J Balvinの『I Like It』が全米一位を獲得する。2020年、Bad Bunnyの『YHLQMDLG』は、発売時点でスペイン語のアルバムとして史上最高位の全米二位に達した。同年11月27日に発売された『El Último Tour Del Mundo』は、12月12日付のBillboard 200で、全編スペイン語のアルバムとして初の1位になった。2020〜22年には、Spotifyで3年連続で世界で最も再生されたアーティストとなった。

一方で、麻薬、暴力、性の描写や、女性の描き方への批判が出ている。</p>
