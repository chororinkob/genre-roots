<h1>Latin Trap（ラテントラップ）とは</h1>
<p>アメリカ南部のトラップの音づくりを、スペイン語のラップと歌に組み合わせた音楽。骨格はトラップそのままで、TR-808の低音が長く伸びて音程を持ち、ハイハットが三連符や16分音符で細かく転がり、スネアは二拍四拍の裏で乾いて鳴る。テン</p>
<p>アメリカ南部のトラップの音づくりを、スペイン語のラップと歌に組み合わせた音楽。骨格はトラップそのままで、TR-808の低音が長く伸びて音程を持ち、ハイハットが三連符や16分音符で細かく転がり、スネアは二拍四拍の裏で乾いて鳴る。テンポは毎分70から90拍程度に感じられるが、記譜上は140から180拍で書かれる。ここにラテンの要素が加わる。ベースの動きにレゲトンのデンボウのリズムが混ざり、上物にはナイロン弦ギターの短い旋律、アコーディオンの断片、パンデイロやコンガの音が置かれる。和音は短調の四和音の循環が定番である。歌唱の扱いが独特で、ラップと歌の境界がなく、ピッチ補正を強くかけた声が旋律を歌い、しばしば複数の歌手が一曲を分け合って交代する。歌詞はスペイン語で、金、麻薬取引、貧困からの脱出、性、名声への渇望を露骨に描き、地元の俗語と英語の単語が混ざる。曲は三分以内に収められ、冒頭数秒で聴き手を掴む設計になっている。同じスペイン語圏の音楽でも、レゲトンが踊るための明るさを保つのに対し、こちらは暗く沈んだ響きと個人的な語りに重心がある点が異なる。</p>
<h2>成り立ち</h2><p>生まれたのは2012年から14年頃のプエルトリコである。当時この島は深刻な財政危機のさなかにあり、公的債務が700億ドルを超え、若者の失業と本土への移住が続いていた。レゲトンは2000年代半ばに世界的な成功を収めた後、商業化して勢いを失っており、若い世代はアメリカのアトランタで生まれたトラップに新しい言語を見出した。最初期の担い手はArcángel、De La Ghetto、そしてとりわけMessiah、Ñengo Floweらだったが、決定的だったのは2015年前後、Bad Bunnyの登場である。本名Benito Antonio Martínez Ocasioの彼は、スーパーマーケットで袋詰めの仕事をしながらSoundCloudに曲を上げており、2016年の『Diles』が制作者DJ Luianの目に留まって契約に至った。同じ時期、コロンビアのMaluma、プエルトリコのAnuel AAが台頭する。Anuelは2016年に銃器所持で服役し、獄中から発表した曲がヒットするという異例の経過をたどった。制作面ではDJ Luian、Mambo Kingz、Hi Musicといった集団が音の共通語を作った。2017年の『Despacito』の世界的成功はレゲトン側の出来事だったが、これによってスペイン語の曲が英語圏の主流に入る道が開かれ、ラテン・トラップも同じ流れに乗った。2018年、Cardi BとBad Bunnyの『I Like It』が全米一位を獲得する。2020年、Bad Bunnyの『YHLQMDLG』はスペイン語のアルバムとして史上最高位の全米二位に達し、2022年には彼が世界で最も再生された音楽家となった。一方で、麻薬取引の美化、女性の描き方、そして服役歴を持つ人物が英雄視されることへの批判は、ラテンアメリカ各国で繰り返し議論されている。</p>
