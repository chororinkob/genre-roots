<h1>Latin Trap（ラテントラップ）とは</h1>
<p>アメリカ南部のトラップの音づくりを、スペイン語のラップと歌に組み合わせた音楽。骨格はトラップそのままで、TR-808の低音が長く伸びて音程を持ち、ハイハットが三連符や16分音符で細かく転がり、スネアやクラップは小節の3拍目（ハーフ</p>
<p>アメリカ南部のトラップの音づくりを、スペイン語のラップと歌に組み合わせた音楽。骨格はトラップそのままで、TR-808の低音が長く伸びて音程を持ち、ハイハットが三連符や16分音符で細かく転がり、スネアやクラップは小節の3拍目（ハーフタイム）に置かれて乾いて鳴る。テンポは毎分70から90拍程度に感じられるが、記譜上は140から180拍で書かれる。ここにラテンの要素が加わる。ドラムにレゲトンのデンボウのリズムが混ざり、上物にはナイロン弦ギターの短い旋律やアコーディオンの断片などが置かれることもある。歌唱の扱いが独特で、ラップと歌の境界がなく、ピッチ補正を強くかけた声が旋律を歌い、しばしば複数の歌手が一曲を分け合って交代する。歌詞はスペイン語で、金、麻薬取引、貧困からの脱出、性、名声への渇望を露骨に描き、地元の俗語と英語の単語が混ざる。冒頭数秒で聴き手を掴む設計になっている。同じスペイン語圏の音楽でも、レゲトンが踊るための明るさを保つのに対し、こちらは暗く沈んだ響きと個人的な語りに重心がある点が異なる。</p>
<h2>成り立ち</h2><p>発祥時期は不明で議論がある。Ozunaは2007年の『El Pistolón』、De La Ghettoは2005〜06年頃から実践していたと述べている。2014年頃にソーシャルメディアを通じて、プエルトリコのAlvaro DiazやMyke Towersらが注目され始めた。当時この島は深刻な財政危機のさなかにあり、2014年の格下げで危機が始まり、2017年1月には債券債務が約700億ドルに達した。レゲトンは2000年代半ばに世界的な成功を収めた後、商業化して勢いを失っており、若い世代はアメリカのアトランタで生まれたトラップに新しい言語を見出した。初期の担い手には、Arcángel、De La Ghetto、ニューヨーク在住のドミニカ系で先駆者の一人とされるMessiah、Ñengo Flowらがいたが、決定的だったのはBad Bunnyの登場である。本名Benito Antonio Martínez Ocasioの彼は、スーパーマーケットで袋詰めの仕事をしながら2013年からSoundCloudに曲を上げており、2016年の『Diles』が制作者DJ Luianの目に留まってHear This Musicと契約したとされる（契約の年は資料によって異なる）。同じ時期、コロンビアのMaluma、プエルトリコのAnuel AAが台頭する。Anuelは2016年に銃器所持で服役し、獄中から発表した曲がヒットするという異例の経過をたどった。制作面ではDJ Luian、Mambo Kingz、Hi Music Hi Flowといった制作者たちが音の共通語を作った。2017年の『Despacito』の世界的成功はレゲトン側の出来事だった。2018年、Cardi BとBad Bunnyの『I Like It』が全米一位を獲得する。2020年、Bad Bunnyの『YHLQMDLG』は発売時点でスペイン語のアルバムとして史上最高位の全米二位に達し（同年11月に『El Último Tour Del Mundo』が全米1位で記録を更新した）、2020〜22年にはSpotifyで3年連続で世界で最も再生されたアーティストとなった。一方で、麻薬取引の美化、女性の描き方、そして服役歴を持つ人物が英雄視されることへの批判が出ている。</p>
