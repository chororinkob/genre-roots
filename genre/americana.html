<h1>Americana（アメリカーナ）とは</h1>
<p>アメリカーナは、カントリー、フォーク、ブルース、ゴスペル、ロックといった米国の土着的な音楽の要素を混ぜ合わせた音楽の総称だ。商業的な主流の型に収まらない形で聴かせる。主流カントリーの商業的な型とは距離を置く傾向がある。 編成は、ア</p>
<p>アメリカーナは、カントリー、フォーク、ブルース、ゴスペル、ロックといった米国の土着的な音楽の要素を混ぜ合わせた音楽の総称だ。商業的な主流の型に収まらない形で聴かせる。主流カントリーの商業的な型とは距離を置く傾向がある。

編成は、アコースティック・ギター、エレクトリック・ギター、ペダル・スティール（ペダルで音程を変える金属弦の楽器）、フィドル、マンドリン、オルガンなどだ。アコースティックからエレクトリックまで幅広く、特定の音色やテンポに限定されない。ヴィンテージ楽器やアナログ録音を好む傾向が指摘される。

和声（コードの響き）は、三和音を基本とする。そこに、ゴスペルやブルースに通じる4度（音階の四番目への動き）や短7度（ブルース特有の低めの7番目の音）が混ざる。旋律は装飾を抑え、言葉の抑揚に沿って書かれる。



歌詞は物語性が重視される傾向があり、日常の苦労や困難を語る物語が典型だ。</p>
<h2>成り立ち</h2><p>音楽用語として定着したのは、1990年代半ばの米国だ。ラジオ業界の必要から生まれた。商業カントリーの主流では、その枠に収まらない音楽の行き場がなくなっていた。1990年代前半のGarth Brooksらの成功が一因とする見方がある。

1995年、業界誌Gavin Reportがアメリカーナのラジオ・チャートを初めて掲載した（呼称は先にJon Grimsonが付けていたとされる）。1999年にはAmericana Music Associationが業界団体として発足し、初の大会は2000年、授賞式（Americana Honors &amp; Awards）は2001年に始まった。グラミー賞に独立部門（Best Americana Album）ができたのは2009年（授賞は2010年）である。

音楽的な前史はさらに古い。1968年、The ByrdsがSweetheart of the Rodeoで、国際的に成功したロック・バンドが出した、広くカントリー・ロックと呼ばれた最初のアルバムを作った。その中心にいたGram Parsonsは、後にThe Flying Burrito Brothersとソロ作品で、コズミック・アメリカン・ミュージック（宇宙的な広がりをもつアメリカ音楽）という構想を掲げた。彼は1973年に26歳で薬物と酒により死去し、遺体が友人によって砂漠で焼かれるという異様な結末を迎えている。

1980年代には、Uncle Tupeloが、パンクの態度とカントリーの編成を組み合わせた。1990年のアルバムNo Depressionを機に、オルタナティヴ・カントリーという語が音楽ジャーナリストの間で広まった。アルバムの題名は、このジャンルの別称にもなった。同バンドの解散後、Jeff TweedyはWilcoを、Jay FarrarはSon Voltを結成し、それぞれ異なる方向へ進んだ。1995年9月には同名の雑誌No Depressionが季刊誌として創刊され、この音楽の世界の言論の場となった。

2000年の映画O Brother, Where Art Thou?のサウンドトラックは、T Bone Burnettの制作により、古い形式の音楽が米国だけで800万枚以上を売り上げるという予想外の成功を収めた。この分野への注目を決定的に高めた。Gillian Welchは、1996年のデビュー作の頃から、概ね好評だったが、評価が割れた面もあった。O Brotherのサウンドトラックには、アソシエイト・プロデューサー兼演奏者として参加した。Jason IsbellやSturgill Simpsonは、商業的な成功と批評的な評価の双方を得ている。Ryan Adamsも、2000年の『Heartbreaker』で批評的に高く評価された。

この呼称は、都市化と工業化の中で失われた米国像への懐かしさを含んでいる。一部の批評家は、白人・男性中心で保守的だと批判している。</p>
