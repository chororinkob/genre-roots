<h1>Americana（アメリカーナ）とは</h1>
<p>カントリー、フォーク、ブルース、ゴスペル、ロックといった米国の土着的な音楽の要素を混ぜ合わせ、商業的な主流の型に収まらない形で提示する音楽の総称。編成はアコースティック・ギター、エレクトリック・ギター、ペダル・スティール、フィドル</p>
<p>カントリー、フォーク、ブルース、ゴスペル、ロックといった米国の土着的な音楽の要素を混ぜ合わせ、商業的な主流の型に収まらない形で提示する音楽の総称。編成はアコースティック・ギター、エレクトリック・ギター、ペダル・スティール、フィドル、マンドリン、オルガン、そして控えめなドラムという組み合わせが多い。特徴的なのは音の質感で、過度な圧縮や修正を避け、演奏の揺らぎや部屋の響きをそのまま残す録音が好まれる。BPMは遅めから中庸、和声は三和音を基本としながら、ゴスペル由来の四度の動きやブルース由来の短七度が混ざる。旋律は装飾を抑え、言葉の抑揚に沿って書かれる。歌唱は美声より人格を重んじ、しわがれた声、息の混じった声、音程の揺れが表現として肯定される。三声の重なりが要所で用いられる。歌詞は最も重視される要素で、地方都市の衰退、家族の断絶、依存症、信仰への疑い、そして土地への愛着といった主題が、短編小説のような具体性で書かれる。現代のナッシュビル産の商業カントリーが提示する明るさとは対極にあり、成功譚ではなく敗北と持続を語る点が決定的に異なる。</p>
<h2>成り立ち</h2><p>語としての成立は1990年代半ばの米国で、ラジオ業界の必要から生まれた。商業カントリーの主流が、1990年代前半のGarth Brooksらの大成功により、より大衆的で明るい方向へ傾いた結果、その枠に収まらない音楽の行き場がなくなっていた。1995年、業界誌Gavin Reportがアメリカーナという番組区分を設け、1999年にはAmericana Music Associationが設立されて、正式な分類として制度化された。音楽的な前史はさらに古い。1968年、The ByrdsがSweetheart of the Rodeoでカントリーとロックを結合させ、その中心にいたGram Parsonsは、後にThe Flying Burrito Brothersとソロ作品で、コズミック・アメリカン・ミュージックという構想を掲げた。彼は1973年に26歳で薬物と酒により死去し、遺体が友人によって砂漠で焼かれるという異様な結末を迎えている。1980年代にはUncle Tupeloが、パンクの態度とカントリーの編成を組み合わせ、1990年のアルバムNo Depressionがオルタナティヴ・カントリーという呼称の由来となった。同バンドの解散後、Jeff TweedyはWilcoを、Jay FarrarはSon Voltを結成し、それぞれ異なる方向へ進んだ。1998年には同名の雑誌No Depressionが創刊され、シーンの言論の場となった。2000年の映画O Brother, Where Art Thou?のサウンドトラックは、T Bone Burnettの制作により古い形式の音楽が800万枚以上を売り上げるという予想外の成功を収め、この分野への注目を決定的に高めた。以後、Gillian Welch、Ryan Adams、Jason Isbell、Sturgill Simpsonらが商業的な成功と批評的な評価の双方を得ている。この呼称は、都市化と工業化の中で失われた米国像への郷愁を含んでおり、その保守性が批判されることもある。</p>
<h2>代表曲</h2><ul><li>Wagon Wheel (Old Crow Medicine Show)</li><li>I Am a Man of Constant Sorrow (The Soggy Bottom Boys)</li><li>Drunken Angel (Lucinda Williams)</li><li>Oh My Sweet Carolina (Ryan Adams)</li><li>Time (The Revelator) (Gillian Welch)</li></ul>
