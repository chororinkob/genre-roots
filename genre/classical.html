<h1>Classical（クラシック）とは</h1>
<p>クラシックは、西洋で数百年かけて発展した記譜法（楽譜の書き方）に基づく、芸術音楽の総体だ。 最大の特徴は、作曲家と演奏者の分業にある。作曲家が楽譜に音高（音の高さ）・音価（音の長さ）・強弱・発想（曲の表情の指示）を書き込む。演奏者</p>
<p>クラシックは、西洋で数百年かけて発展した記譜法（楽譜の書き方）に基づく、芸術音楽の総体だ。

最大の特徴は、作曲家と演奏者の分業にある。作曲家が楽譜に音高（音の高さ）・音価（音の長さ）・強弱・発想（曲の表情の指示）を書き込む。演奏者はそれを解釈して再現する。

編成は、独奏から室内楽（少人数の合奏）まで幅広い。数十人から100人規模の管弦楽（オーケストラ）もある。オーケストラは、いくつかの層で構成される。弦楽器群はヴァイオリン、ヴィオラ、チェロ、コントラバス。木管はフルート、オーボエ、クラリネット、ファゴット。金管はホルン、トランペット、トロンボーン、チューバ。ここに打楽器が加わる。指揮者が全体の呼吸を統率する。

和声は、長調と短調の機能和声（和音ごとに役割が決まった和声の仕組み）を土台とする。主和音（曲の中心の和音）と属和音（緊張をもたらす和音）の間には、ある運動がある。属和音が緊張を生み、主和音で解決する運動だ。これが、音楽を前へ進める力になる。

形式は高度に体系化されている。提示部・展開部・再現部からなるソナタ形式がある。主題が姿を変えていく変奏曲形式もある。ある声部の旋律を別の声部が追いかけるフーガもある。複数の楽章を束ねる交響曲や協奏曲といった型も、共有言語になっている。

強弱は、ピアニッシモ（とても弱く）からフォルティッシモ（とても強く）まで幅広い。電気増幅なしにホールの音響だけで、数十分の緊張を維持する設計になっている。ヴィブラート（音の揺らし）、レガート（なめらかにつなぐ）、スタッカート（短く切る）、ピッツィカート（弦をはじく）といった奏法が、細かく指示される。テンポも、急と緩の対比が構成上の意味を持つ。

歌詞を持つ声楽曲には、オペラ、オラトリオ（多くは宗教的な題材の大規模な声楽曲）、リート(歌曲)などがある。言葉と音の結合そのものが、表現の焦点になる。</p>
<h2>成り立ち</h2><p>クラシックの源流は、中世ヨーロッパの教会と王侯の宮廷の庇護にある。初期には、宗教的な単旋律の声楽曲が中心だった。

9世紀ごろから、聖歌の旋律の記憶を助けるために、ネウマ譜（音の上がり下がりを示した古い楽譜）が用いられた。11世紀には、イタリアの修道士Guido d'Arezzoが、4線譜とut-re-mi-fa-sol-laの階名唱（ドレミの原型）を整備し、普及させた。こうして、音高を正確に記録し、再現する技術が定着した。記譜法の発達は、複雑な作品の作曲と伝達を可能にした。

12世紀のパリでは、Notre Dame楽派のLeoninとPerotinが、複数の声部を同時に鳴らすポリフォニー（複数の旋律が絡み合う音楽）を発展させた。ルネサンス期には、Josquin des PrezやGiovanni Pierluigi da Palestrinaが、声部の絡み合いを極めた。

次に、オペラが生まれる。1570〜80年代のBardiのCamerata（古代ギリシャ劇の復興を議論）の影響のもと、1590年代にCorsi周辺でPeriらが初期のオペラを作った。1597/98年「Dafne」（現存せず（断片のみ））、1600年「Euridice」である。これらを経て、Claudio Monteverdiの「オルフェオ」（1607年2月24日、マントヴァ初演）が登場する。現在も定期的に上演される最古のオペラだ。同時に、通奏低音（低音と和音で絶えず支える伴奏）が普及した。

バロック期に入ると、Johann Sebastian Bachが対位法（複数の旋律を組み合わせる技法）を極めた。Antonio Vivaldiは、独奏協奏曲（独奏楽器とオーケストラが掛け合う曲）の形式を整えた。George Frideric Handelは、オペラとオラトリオで成功した。Bachの「平均律クラヴィーア曲集」は、全24の調を巡る作品で、調性音楽の可能性を体系的に示した。

18世紀後半の古典派では、ウィーンが中心になる。Franz Joseph Haydnは、交響曲と弦楽四重奏の形式を固めるうえで決定的な役割を果たし、「父」と呼ばれた。Wolfgang Amadeus Mozartは、劇的表現とオペラを高めた。Ludwig van Beethovenは、交響曲を個人の思想を語る器へと変えた。

Beethovenは、20代後半から進行する難聴に苦しんだ。1802年のハイリゲンシュタットの遺書では、自殺を考えたことを弟たちに書き残している。しかしその後も作曲を続け、ほぼ聴力を失った状態で、1824年に第九交響曲を完成させた。

19世紀のロマン派には、Franz Schubert、Frederic Chopin、Robert Schumann、Johannes Brahmsが登場する。さらに、総合芸術（Gesamtkunstwerk）を掲げたRichard Wagnerも現れた。その作品は、後に「楽劇」と呼ばれた。Wagnerは1850年の論文で反ユダヤ主義の文章を残した。後にヒトラーが崇拝し、ナチスの行事で使用されたことで、今も評価が割れる。

市民階級が力を持つようになり、音楽は貴族のパトロン（資金を出して支える人）から、公開演奏会と楽譜出版へと収入の土台を移した。17〜18世紀には有料公開演奏会が現れ、19世紀には音楽院が広まった。

20世紀には、Claude Debussyが機能和声を緩めた。Arnold Schoenbergは、1908年ごろから調性を離れ（無調）、1920年代前半に十二音技法（十二の音を偏りなく使う作曲法）を作り上げた。Igor Stravinskyの1913年「春の祭典」初演は、パリで観客席が騒然となった。

以後、電子音楽、偶然性の音楽、ミニマリズムなど、多方向へ広がった。現在は、録音産業とコンサートホール、映画音楽やゲーム音楽の管弦楽編成を通じて存続している。</p>
