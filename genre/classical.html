<h1>Classical（クラシック）とは</h1>
<p>西洋で数百年かけて発展した記譜法（楽譜の書き方）に基づく芸術音楽の総体。最大の特徴は、作曲家が楽譜に音高（音の高さ）・音価（音の長さ）・強弱・発想（曲の表情の指示）を書き込み、演奏者がそれを解釈して再現するという分業構造にある。編</p>
<p>西洋で数百年かけて発展した記譜法（楽譜の書き方）に基づく芸術音楽の総体。最大の特徴は、作曲家が楽譜に音高（音の高さ）・音価（音の長さ）・強弱・発想（曲の表情の指示）を書き込み、演奏者がそれを解釈して再現するという分業構造にある。編成は独奏から室内楽（少人数の合奏）、そして数十人から100人規模の管弦楽（オーケストラ）まで幅広い。オーケストラは弦楽器群(ヴァイオリン、ヴィオラ、チェロ、コントラバス)、木管(フルート、オーボエ、クラリネット、ファゴット)、金管(ホルン、トランペット、トロンボーン、チューバ)、打楽器という層で構成され、指揮者が全体の呼吸を統率する。和声は長調と短調の機能和声（和音ごとに役割が決まった和声の仕組み）を基盤とし、属和音（緊張をもたらす和音）が生む緊張が主和音（曲の中心の和音）で解決する運動が、音楽を前へ進める力になる。形式は高度に体系化されており、提示部・展開部・再現部からなるソナタ形式、主題が姿を変えていく変奏曲形式、ある声部の旋律を別の声部が追いかけるフーガ、複数の楽章を束ねる交響曲や協奏曲といった型が共有言語になっている。強弱はピアニッシモ（とても弱く）からフォルティッシモ（とても強く）まで幅広く、電気増幅なしにホールの音響だけで数十分の緊張を維持する設計になっている。ヴィブラート（音の揺らし）、レガート（なめらかにつなぐ）、スタッカート（短く切る）、ピッツィカート（弦をはじく）といった奏法が細かく指示され、テンポも急緩の対比が構成上の意味を持つ。歌詞を持つ声楽曲ではオペラ、オラトリオ（宗教的な題材の大規模な声楽曲）、リート(歌曲)などがあり、言葉と音の結合そのものが表現の焦点になる。</p>
<h2>成り立ち</h2><p>起源は中世ヨーロッパの教会と王侯の宮廷の庇護にあり、初期には宗教的な単旋律の声楽曲が中心だった。9世紀ごろから聖歌の旋律の記憶を助けるためのネウマ譜（音の上がり下がりを示した古い楽譜）が用いられ、11世紀にイタリアの修道士Guido d'Arezzoが4線の線譜（五線譜のもと）と、ut-re-mi-fa-sol-laの階名唱（ドレミの原型）を整備・普及させたことで、音高を正確に記録・再現する技術が確立した。記譜法の発達が、複雑な作品の作曲と伝達を可能にした。12世紀のパリでNotre Dame楽派のLeoninとPerotinが複数の声部を同時に鳴らすポリフォニー（複数の旋律が絡み合う音楽）を発展させ、ルネサンス期にはJosquin des PrezやGiovanni Pierluigi da Palestrinaが声部の絡み合いを極めた。1570〜80年代のフィレンツェで、知識人の集まりCamerataが古代ギリシャ悲劇の再現を目指して単旋律に伴奏を付ける様式を議論し、その影響のもと、1590年代にCorsi周辺でPeriらが初期のオペラ（1597/98年「Dafne」、1600年「Euridice」）を作ったあと、Claudio Monteverdiの1607年「オルフェオ」（マントヴァで初演）は、現在も定期的に上演される最古のオペラとなった。同時に通奏低音（低音と和音で絶えず支える伴奏）が普及し、バロック期に入るとJohann Sebastian Bachが対位法（複数の旋律を組み合わせる技法）を極め、Antonio Vivaldiは独奏協奏曲（独奏楽器とオーケストラが掛け合う曲）の形式を整え、George Frideric Handelはオペラとオラトリオで成功した。Bachの「平均律クラヴィーア曲集」は全24の調を巡る作品で、調性音楽の可能性を体系的に示した。18世紀後半の古典派では、ウィーンを中心にFranz Joseph Haydnが交響曲と弦楽四重奏の形式を確立し、Wolfgang Amadeus Mozartが劇的表現とオペラを高め、Ludwig van Beethovenが交響曲を個人の思想を語る器へと変えた。Beethovenは20代後半から進行する難聴に苦しみ、1802年のハイリゲンシュタットの遺書では自殺を考えたことを弟たちに書き残しているが、その後も作曲を続け、ほぼ聴力を失った状態で1824年の第九交響曲を完成させた。19世紀のロマン派ではFranz Schubert、Frederic Chopin、Robert Schumann、Johannes Brahms、そして総合芸術（Gesamtkunstwerk）を掲げ、その作品が後に「楽劇」と呼ばれたRichard Wagnerが登場する。Wagnerは反ユダヤ主義の文章を残しており、後にナチス政権に利用されたことで今も評価が割れる。17〜18世紀に有料の公開演奏会が現れ、市民階級の台頭とともに音楽は貴族のパトロン（資金を出して支える人）から公開演奏会と楽譜出版へと経済基盤を移し、19世紀には音楽院が各地に広まって職業演奏家が育った。20世紀にはClaude Debussyが機能和声を緩め、Arnold Schoenbergが1908年ごろから調性を離れ（無調）、1920年代前半に十二音技法（十二の音を偏りなく使う作曲法）を確立し、Igor Stravinskyの1913年「春の祭典」初演はパリで観客席が騒然となり激しいブーイングと騒動を招いた。以後、電子音楽、偶然性の音楽、ミニマリズムなど多方向へ拡散し、現在は録音産業とコンサートホール、映画音楽やゲーム音楽の管弦楽編成を通じて存続している。</p>
