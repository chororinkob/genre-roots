<h1>Classical（クラシック）とは</h1>
<p>西洋で数百年かけて発展した記譜法に基づく芸術音楽の総体。最大の特徴は、作曲家が楽譜に音高・音価・強弱・発想を書き込み、演奏者がそれを解釈して再現するという分業構造にある。編成は独奏から室内楽、そして数十人から100人規模の管弦楽ま</p>
<p>西洋で数百年かけて発展した記譜法に基づく芸術音楽の総体。最大の特徴は、作曲家が楽譜に音高・音価・強弱・発想を書き込み、演奏者がそれを解釈して再現するという分業構造にある。編成は独奏から室内楽、そして数十人から100人規模の管弦楽まで幅広い。オーケストラは弦楽器群(ヴァイオリン、ヴィオラ、チェロ、コントラバス)、木管(フルート、オーボエ、クラリネット、ファゴット)、金管(ホルン、トランペット、トロンボーン、チューバ)、打楽器という層で構成され、指揮者が全体の呼吸を統率する。和声は長調と短調の機能和声を基盤とし、主和音から属和音への緊張と解決の運動が音楽を前へ進める推進力になる。形式は高度に体系化されており、提示部・展開部・再現部からなるソナタ形式、主題が姿を変えていく変奏曲形式、ある声部の旋律を別の声部が追いかけるフーガ、複数の楽章を束ねる交響曲や協奏曲といった型が共有言語になっている。強弱はピアニッシモからフォルティッシモまで幅広く、電気増幅なしにホールの音響だけで数十分の緊張を維持する設計になっている。ヴィブラート、レガート、スタッカート、ピッツィカートといった奏法が細かく指示され、テンポも急緩の対比が構成上の意味を持つ。歌詞を持つ声楽曲ではオペラ、オラトリオ、リート(歌曲)などがあり、言葉と音の結合そのものが表現の焦点になる。</p>
<h2>成り立ち</h2><p>起源は中世ヨーロッパのキリスト教会にある。9世紀ごろから聖歌の旋律を記憶に頼らず伝えるためのネウマ譜が用いられ、11世紀にイタリアの修道士Guido d'Arezzoが線譜と階名唱を整備したことで、音高を正確に記録・再現する技術が確立した。この記譜法こそが、作曲家が個人として大規模な作品を構想できる基盤になった。12世紀のパリでNotre Dame楽派のLeoninとPerotinが複数の声部を同時に鳴らすポリフォニーを発展させ、ルネサンス期にはJosquin des PrezやGiovanni Pierluigi da Palestrinaが声部の絡み合いを極めた。1600年前後、フィレンツェの知識人集団Camerataが古代ギリシャ悲劇の再現を目指して単旋律に伴奏を付ける様式を試み、Claudio Monteverdiの1607年「オルフェオ」でオペラが芸術として成立する。同時に通奏低音が普及し、バロック期に入るとAntonio Vivaldi、George Frideric Handel、Johann Sebastian Bachが対位法と調性の体系を完成させた。Bachの「平均律クラヴィーア曲集」は全24の調を巡る作品で、調性音楽の可能性を体系的に示した。18世紀後半の古典派では、ウィーンを中心にFranz Joseph Haydnが交響曲と弦楽四重奏の形式を確立し、Wolfgang Amadeus Mozartが劇的表現とオペラを高め、Ludwig van Beethovenが交響曲を個人の思想を語る器へと変えた。Beethovenは20代後半から進行する難聴に苦しみ、1802年のハイリゲンシュタットの遺書では自殺を考えたことを弟たちに書き残しているが、その後も作曲を続け、ほぼ聴力を失った状態で1824年の第九交響曲を完成させた。19世紀のロマン派ではFranz Schubert、Frederic Chopin、Robert Schumann、Johannes Brahms、そして楽劇の総合芸術を掲げたRichard Wagnerが登場する。Wagnerは反ユダヤ主義の文章を残しており、後にナチス政権に利用されたことで今も評価が割れる。市民階級の台頭により音楽は貴族のパトロンから公開演奏会と楽譜出版へと経済基盤を移し、専門の音楽院と職業演奏家が生まれた。20世紀にはClaude Debussyが機能和声を緩め、Arnold Schoenbergが十二音技法で調性を放棄、Igor Stravinskyの1913年「春の祭典」初演はパリで観客の暴動を引き起こした。以後、電子音楽、偶然性の音楽、ミニマリズムなど多方向へ拡散し、現在は録音産業とコンサートホール、映画音楽やゲーム音楽の管弦楽編成を通じて存続している。</p>
<h2>代表曲</h2><ul><li>Symphony No. 9 (Ludwig van Beethoven)</li><li>Clair de Lune (Claude Debussy)</li><li>The Four Seasons (Antonio Vivaldi)</li><li>Boléro (Maurice Ravel)</li><li>Piano Concerto No. 21 (Wolfgang Amadeus Mozart)</li></ul>
