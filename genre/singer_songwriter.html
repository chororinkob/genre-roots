<h1>Singer- Songwriter（シンガーソングライター）とは</h1>
<p>自分で詞と曲を書き、自分で歌う個人を中心に据えた様式である。厳密にはジャンルというより制作形態を指す言葉だが、1970年前後に成立した特定の音の型が伴っている。編成は伴奏を最小限に抑え、アコースティック・ギターかピアノの弾き語りを</p>
<p>自分で詞と曲を書き、自分で歌う個人を中心に据えた様式である。厳密にはジャンルというより制作形態を指す言葉だが、1970年前後に成立した特定の音の型が伴っている。編成は伴奏を最小限に抑え、アコースティック・ギターかピアノの弾き語りを核として、そこに控えめなベース、ドラム、弦楽器が添えられる。楽器の腕前や編曲の凝った作りよりも、歌詞と声の質感が前面に出る音作りが強い傾向がある。録音では、聴き手のすぐそばで歌われているという近さの感覚を狙った作品がある。例えば『つづれおり』では、プロデューサーのLou Adlerが、聴き手に彼女がピアノに向かって歌いかけているように感じさせたいと述べている。和声は作り手ごとに違い、キングはゴスペルの和音を使った素朴な鍵盤曲、ジャクソン・ブラウンはプロテスタント賛美歌の和声語彙を借りたとされる。ジョニ・ミッチェルは、多くの曲で別のモードや調へ移り（転調＝曲の途中で調が変わること）、拍は4/4を基本に数小節だけ拍数が変わる形が中心である。歌詞は一人称で書かれ、恋愛、家族、離別、自己嫌悪、社会への違和感といった主題を、比喩を用いつつも私的な事実として提示する。それまでの大衆歌謡が職業作家による普遍的な物語だったのに対し、自伝的な作品が1970年代初頭に商業ポップの前面に出た。</p>
<h2>成り立ち</h2><p>背景には、大衆音楽の作り手と歌い手が分業されていた体制の崩壊がある。20世紀前半のアメリカでは、ニューヨークのティン・パン・アレーに集まった職業作家が曲を書き、歌手はそれを歌うという分業が広く見られた一方、ブルースやカントリーの自作自演の歌い手（Lead Belly、Jimmie Rodgersなど。Rodgersの曲は共作も多い）もいた。「singer-songwriter」という語自体は1930年代から記録されており（最古の用例は1933年）、1940〜50年代にはHank WilliamsやWoody Guthrie、Pete Seegerなども知られていた。1960年代にボブ・ディランが道を開いた。彼はフォークを政治から個人的な領域へ引き寄せ、訓練されていない個性的な声でも歌えるようにした。ビートルズが自作自演で成功したことも同じ方向に働き、1960年代半ばには自分で書くことが標準になっていく。様式としてまとまるのは1970年前後である。1960年代末の政治的高揚と対抗文化が挫折し、大規模な祭典的音楽への疲れが広がった時期に、内省的で小規模な音楽が求められた。転換点は1970年のジェイムズ・テイラー『Sweet Baby James』に始まり、1971年を象徴的な年とする見方もある。この年にキャロル・キングの『つづれおり』、ジェイムズ・テイラーの『マッド・スライド・スリム・アンド・ザ・ブルー・ホライズン』(略称:マッド・スライド・スリム)、ジョニ・ミッチェルの『ブルー（Blue）』が相次いで発表された。キングはもともとティン・パン・アレーの流れをくむブリル・ビルディング系（実際の拠点は向かいの1650 Broadwayにあったアルドン・ミュージック）の職業作家として夫と組んで大量のヒット曲を書いていた人物であり、その彼女は1970年に初ソロ『Writer』を出し、2作目の『つづれおり』(1971)で大成功した。自ら歌う側に回ったこと自体が、この転換を象徴していた。ミッチェルの『ブルー』は変則的なギターの調弦（弦の音合わせ）と、恋愛を私的に打ち明ける歌詞（のちに、「Little Green」が娘の養子縁組を歌ったものと知られるようになった）で、あらゆる告白型シンガーソングライターの作品がこれと比べられてきた金字塔と評されている。同時期にはニール・ヤング、レナード・コーエン、ヴァン・モリソン、そしてPaul Simon、Gordon Lightfootなどが並走し、ロサンゼルスのローレル・キャニオンやニューヨークのグリニッチ・ヴィレッジ（1960年代のフォーク・リバイバルの中心地で、1970年代初頭まで新人を輩出した）が拠点となった。1970年代半ば〜80年代初頭に、最初の波は大部分が一般的なポップ／ソフトロックに吸収され（優勢は1970年代後半まで続き、終わらせたのはパンクとディスコの台頭とする見方もある）、1980年代後半にはSuzanne Vegaらの新しい波が出た。1990年代にはエリオット・スミスやジェフ・バックリィが再び個人の内面へ回帰し、1990年代後半に業務用水準の録音環境が個人にも手が届くようになり、自主制作が広がった。</p>
<h2>代表曲</h2><ul><li>Harvest Moon (Neil Young)</li><li>Mrs. Robinson (Simon &amp; Garfunkel)</li><li>The Boxer (Simon &amp; Garfunkel)</li><li>Motion Sickness (Phoebe Bridgers)</li><li>Fire and Rain (James Taylor)</li><li>You've Got a Friend (Carole King)</li><li>Between the Bars (Elliott Smith)</li><li>Famous Blue Raincoat (Leonard Cohen)</li><li>Wild World (Cat Stevens)</li><li>Big Yellow Taxi (Joni Mitchell)</li><li>Blue (Joni Mitchell)</li><li>A Case of You (Joni Mitchell)</li><li>Pink Moon (Nick Drake)</li><li>Blackbird (The Beatles)</li><li>Oh, Sister (Bob Dylan)</li><li>Hurt (Johnny Cash)</li><li>The Circle Game (Joni Mitchell)</li><li>Tapestry (Carole King)</li></ul>
