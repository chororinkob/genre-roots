<h1>Singer- Songwriter（シンガーソングライター）とは</h1>
<p>シンガーソングライターは、自分で詞と曲を書き、自分で歌う個人を中心に据えたスタイルである。厳密にはジャンルというより制作形態を指す言葉だが、1970年前後に成立した特定の音の型が伴っている。 編成は、伴奏を最小限に抑える。アコース</p>
<p>シンガーソングライターは、自分で詞と曲を書き、自分で歌う個人を中心に据えたスタイルである。厳密にはジャンルというより制作形態を指す言葉だが、1970年前後に成立した特定の音の型が伴っている。

編成は、伴奏を最小限に抑える。アコースティック・ギターかピアノの弾き語りを核として、そこに控えめなベース、ドラム、弦楽器が添えられる。

和音進行は複雑でないことが多い。単純な三和音（基本の3音の和音）に7度や9度を足した、柔らかい響きが好まれる傾向がある。一部の作り手（例：ジョニ・ミッチェル）は、転調（曲の途中で調が変わること）や、小節ごとに拍数が変わる拍子を含む、変則的な構成を用いる。

音作りは、楽器の腕前や編曲の凝った作りよりも、歌詞と声の質感が前面に出る、そうした傾向が強い。近さの感覚を狙った作品がある。

歌詞は一人称で書かれる。恋愛、家族、離別、自己嫌悪、社会への違和感といった主題を、比喩を用いつつも私的な事実として示す。それまでの大衆歌謡は、職業作家による普遍的な物語だった。これに対し、自伝的な作品が1970年代初頭に商業ポップの前面に出た。</p>
<h2>成り立ち</h2><p>背景には、大衆音楽の作り手と歌い手が分業されていた体制の崩壊がある。

20世紀前半のアメリカでは、ニューヨークのティン・パン・アレーに集まった職業作家が曲を書き、歌手はそれを歌うという分業が広く見られた。一方で、ブルースやカントリーの自作自演の歌い手（Lead Belly、Jimmie Rodgersなど。「共作も多い」）もいた。「singer-songwriter」という語自体は、1930年代から記録(OED では1933年)されている。1940〜50年代には、Hank WilliamsやWoody Guthrie、Pete Seegerなども知られていた。

1960年代にボブ・ディランらが道を開き、1970年前後に主流化した。彼は自作の詩を自分で歌い、しかもその内容が個人的かつ文学的であることを、主流市場に認めさせた。ビートルズが自作自演で成功したことも同じ方向に働き、1960年代半ばには、自分で書くことが標準になっていく。1960年代に前史があり、1970年前後にスタイルとして固まった。

1960年代末には、政治的高揚と対抗文化が挫折した。大規模な祭典的音楽への疲れも広がった。そうした時期に、内省的で小規模な音楽が求められた。

転換点は、1970年のジェイムズ・テイラー『Sweet Baby James』に始まる。1971年を、この流れを表す年とする見方もある。この年に、キャロル・キングの『つづれおり』、ジェイムズ・テイラーの『マッド・スライド・スリム・アンド・ザ・ブルー・ホライズン』(略称:マッド・スライド・スリム)、ジョニ・ミッチェルの『ブルー（Blue）』が相次いで発表された。

キングは、もともとティン・パン・アレーの流れをくむブリル・ビルディング系の職業作家だった。夫と組んで、大量のヒット曲を書いていた。その彼女は、1970年に初ソロ『Writer』を出し、2作目の『つづれおり』(1971)で大成功した。自ら歌う側に回ったこと自体が、この転換を表していた。

ミッチェルの『ブルー』は、変則的なギターの調弦（弦の音合わせ）が特徴だ。歌詞は、恋愛と、出産に関わる曲を含む（後年、娘の養子縁組を歌ったものと知られるようになった）。「あらゆる告白型シンガーソングライターの作品が、これと比べられてきた金字塔」(Uncut誌の評言)とされる。

同時期には、ニール・ヤング、レナード・コーエン、ヴァン・モリソン、そしてPaul Simon、Gordon Lightfootなどが並んで活動した。ロサンゼルスのローレル・キャニオンが拠点となった。ニューヨークのグリニッチ・ヴィレッジは、1960年代のフォーク・リバイバルの中心地で、1970年代初頭まで新人を輩出した。

しかし、1970年代半ば〜80年代初頭に、最初の波は大部分が一般的なポップ／ソフトロックに吸収された。1980年代後半には、Suzanne Vegaらの新しい波が出た。1990年代には、エリオット・スミスやジェフ・バックリィが、再び個人の内面へ戻っていった。1990年代後半に業務用水準の録音環境が個人にも手が届くようになり、自主制作が広がった。</p>
