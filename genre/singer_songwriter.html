<h1>Singer- Songwriter（シンガーソングライター）とは</h1>
<p>自分で詞と曲を書き、自分で歌う個人を中心に据えた様式である。厳密にはジャンルというより制作形態を指す言葉だが、1970年前後に成立した特定の音の型が伴っている。編成は伴奏を最小限に抑え、アコースティック・ギターかピアノの弾き語りを</p>
<p>自分で詞と曲を書き、自分で歌う個人を中心に据えた様式である。厳密にはジャンルというより制作形態を指す言葉だが、1970年前後に成立した特定の音の型が伴っている。編成は伴奏を最小限に抑え、アコースティック・ギターかピアノの弾き語りを核として、そこに控えめなベース、ドラム、弦楽器が添えられる。楽器の腕前や編曲の凝った作りよりも、歌詞と声の質感が前面に出る音作りが原則である。録音では歌手の口元にマイクを近づけ、息づかいや弦をこする指の音まで拾う。これは大会場ではなく、聴き手のすぐそばで歌われているという感覚を作るための処理であり、この距離の近さがこの様式の核心をなす。和音進行は複雑ではないが、単純な三和音に七度や九度を足した柔らかい響きが好まれ、転調や変拍子が自然に混じることも多い。歌詞は一人称で書かれ、恋愛、家族、離別、自己嫌悪、社会への違和感といった主題を、比喩を用いつつも私的な事実として提示する。それまでの大衆歌謡が職業作家による普遍的な物語だったのに対し、歌う本人の実人生と地続きであることを前提にした点が決定的な転換だった。</p>
<h2>成り立ち</h2><p>背景には、大衆音楽の作り手と歌い手が分業されていた体制の崩壊がある。二十世紀前半のアメリカでは、ニューヨークのティン・パン・アレーに集まった職業作家が曲を書き、歌手はそれを歌うという分業が当然だった。この構図を崩した最初の決定打が、1960年代前半のボブ・ディランである。彼は自作の詩を自分で歌い、しかもその内容が個人的かつ文学的であることを主流市場に認めさせた。ビートルズが自作自演で成功したことも同じ方向に働き、1960年代半ばには自分で書くことが標準になっていく。様式としてまとまるのは1970年前後である。1960年代末の政治的高揚と対抗文化が挫折し、大規模な祭典的音楽への疲れが広がった時期に、内省的で小規模な音楽が求められた。転換点とされるのが1971年で、この年にキャロル・キングの『つづれおり』、ジェイムズ・テイラーの『マッド・スライド・スリム』、ジョニ・ミッチェルの『ブルー（Blue）』が相次いで発表された。キングはもともとティン・パン・アレー式の職業作家として夫と組んで大量のヒット曲を書いていた人物であり、その彼女が自ら歌う側に回ったこと自体が、この転換を象徴していた。ミッチェルの『ブルー』は変則的なギターの調弦と、恋愛と出産の秘密にまで踏み込んだ歌詞で、私的な告白がどこまで芸術になりうるかの基準を作った。同時期にはニール・ヤング、レナード・コーエン、ヴァン・モリソン、そしてカーペンターズが並走し、ロサンゼルスのローレル・キャニオンやニューヨークのグリニッチ・ヴィレッジが拠点となった。1980年代には一度商業的に後退したが、1990年代にエリオット・スミスやジェフ・バックリィが再び個人の内面へ回帰し、2000年代以降は録音機材の低価格化によって、自宅で全工程を完結させる形態が一般化している。</p>
<h2>代表曲</h2><ul><li>Motion Sickness (Phoebe Bridgers)</li><li>The Circle Game (Joni Mitchell)</li><li>Blue (Joni Mitchell)</li><li>Fire and Rain (James Taylor)</li><li>Between the Bars (Elliott Smith)</li></ul>
