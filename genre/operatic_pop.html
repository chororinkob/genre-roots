<h1>Operatic Pop（オペラティックポップ）とは</h1>
<p>オペラティック・ポップは、クラシックの声楽で訓練された発声を、ポップスの楽曲構造に乗せて歌う音楽だ。 中心になるのは管弦楽団（オーケストラ）である。弦の厚い持続音、ホルンとトランペットの輝かしい合いの手、ハープのアルペジオ（和音を</p>
<p>オペラティック・ポップは、クラシックの声楽で訓練された発声を、ポップスの楽曲構造に乗せて歌う音楽だ。

中心になるのは管弦楽団（オーケストラ）である。弦の厚い持続音、ホルンとトランペットの輝かしい合いの手、ハープのアルペジオ（和音を一音ずつ弾く奏法）が敷かれることがしばしばある。そこに現代的なドラムとエレキベース、シンセの持続音が重ねられる。

和音の進行はポップスの範囲に収まる。複雑な転調（調を変えること）よりも、終盤で半音または全音上げる転調が、ポップス一般によく使われる。曲の作りは明確で、静かなヴァース（歌の節）から始まる。終盤で転調して音域を上げ、最後に最高音を長く伸ばして終わる曲もある。

歌手はマイクに頼らない共鳴を身につけている。胸声（低めの声）から頭声（高めの声）へなめらかに移る技術、長く伸ばした音を揺らさずに保つ技術、一音ごとに息を支えて音量を自在に膨らませる技術を持つ。

歌詞は、愛、別離、祈り、故郷、勇気といった、普遍的で抽象度の高い主題が選ばれる。イタリア語、ラテン語、スペイン語、英語が混在することも多い。

歌う場は、劇場やアリーナ、スポーツの式典、映画の主題歌である。映像と組み合わせて、壮麗さを演出する。オペラそのものと違って、物語の一部ではない。一曲で完結する感動を目的として設計されている点が、本質的に異なる。</p>
<h2>成り立ち</h2><p>土台は20世紀初頭からあった。起源を、米国のTin Pan Alleyのオペラ風ノベルティ・ソング（話題性を狙った曲）とする説明がある。Pavarottiが1989年にアルバム『Tutto Pavarotti』でカバーした「Caruso」を、開花の契機とする説明もある。

最初の主役はEnrico Carusoだった。蓄音機の登場によって、Guinnessが1902年録音版を初のミリオンセラーと認定した『Vesti la giubba』を出した歌手となる。クラシックの声楽が大衆商品になりうることを、彼は示した。

のちにMario Lanzaが現れる。1940年代末から1950年代にかけて、映画『歌劇王カルーソ』(1951)などで人気を得た。オペラ歌手が映画で大衆的人気を得る流れを、大きく広げた。

大衆化の決定的な転機は、1990年7月7日に訪れた。ローマのカラカラ浴場跡で、Three Tenorsの公演が行われたのである。サッカーのワールドカップ決勝前夜に、Luciano Pavarotti、Plácido Domingo、José Carrerasの3人が、Zubin Mehtaの指揮で歌った。その映像は世界中に中継され、アルバムはクラシック史上最大の売上を記録した。Pavarottiが歌ったプッチーニの『誰も寝てはならぬ』は、この年のBBCのワールドカップ中継の主題歌に使われた。オペラのアリアが全英一位に迫るという事態を招いた。

この成功を受け、1990年代後半から2000年代にかけて、Il Divoのようにレコード会社主導で企画された例もある。

イタリアのAndrea Bocelliは1996年、Sarah Brightmanとの共演で『Time to Say Goodbye』を発表した。この曲は、ドイツで歴代最も売れたシングルとなった（認定ベースで約275万枚。約300万枚とする紹介もある）。彼は12歳で失明しており、その来歴も物語として消費された。

イギリスでは、Simon CowellがIl Divoという多国籍の4人組を作った。2001年から世界中で歌手を探して集め、2003年に結成し、2004年に売り出した。2007年には、Cowellが審査員を務めた『Britain's Got Talent』から、携帯電話販売店勤務（Carphone Warehouse）だったPaul Pottsが登場した。その映像は世界中に広まった。

一方で、一部のオペラの純粋主義者からは、オペラのスタイルを表面だけ借りた商品だという批判が向けられた。</p>
