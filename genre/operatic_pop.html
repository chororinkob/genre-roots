<h1>Operatic Pop（オペラティックポップ）とは</h1>
<p>クラシックの声楽で訓練された発声を、ポップスの楽曲構造に乗せて歌う音楽。歌手はマイクに頼らない共鳴を身につけており、胸声から頭声へなめらかに移る技術、長く伸ばした音を揺らさずに保つ技術、一音ごとに息を支えて音量を自在に膨らませる技</p>
<p>クラシックの声楽で訓練された発声を、ポップスの楽曲構造に乗せて歌う音楽。歌手はマイクに頼らない共鳴を身につけており、胸声から頭声へなめらかに移る技術、長く伸ばした音を揺らさずに保つ技術、一音ごとに息を支えて音量を自在に膨らませる技術を持つ。編成は管弦楽団が中心で、弦の厚い持続音、ホルンとトランペットの輝かしい合いの手、ハープのアルペジオが敷かれ、そこに現代的なドラムとエレキベース、シンセの持続音が重ねられる。和音の進行はポップスの範囲に収まり、複雑な転調よりも、半音ずつ上がって高揚を作る手法が好まれる。曲の作りが明確で、静かなヴァースから始まり、二度目のサビで転調して音域を一気に上げ、最後に最高音を長く伸ばして終わるという上昇の型が徹底されている。歌詞は愛、別離、祈り、故郷、勇気といった普遍的で抽象度の高い主題が選ばれ、イタリア語、ラテン語、スペイン語、英語が混在することも多い。歌う場は劇場やアリーナ、スポーツの式典、映画の主題歌で、映像と組み合わせて壮麗さを演出する。オペラそのものと違って物語の一部ではなく、一曲で完結する感動を目的として設計されている点が本質的に異なる。</p>
<h2>成り立ち</h2><p>土台は二十世紀初頭からあった。Enrico Carusoは蓄音機の登場によって世界初の100万枚を売った歌手となり、クラシックの声楽が大衆商品になりうることを示した。1950年代にはMario Lanzaが映画『歌劇王カルーソ』(1951)などで人気を得て、オペラ歌手が映画スターになる道を作った。決定的な転換は1990年七月七日、ローマのカラカラ浴場跡で行われたThree Tenorsの公演である。サッカーのワールドカップ決勝前夜に、Luciano Pavarotti、Plácido Domingo、José Carrerasの三人がZubin Mehtaの指揮で歌った映像は世界中に中継され、そのアルバムはクラシック史上最大の売上を記録した。Pavarottiが歌ったプッチーニの『誰も寝てはならぬ』は、この年のBBCのワールドカップ中継の主題歌に使われ、オペラのアリアが全英一位に迫るという事態を招いた。この成功を受け、1990年代後半から2000年代にかけて、レコード会社は意図的にこの市場を作り込んだ。イタリアのAndrea Bocelliは1996年、Sarah Brightmanとの共演で『Time to Say Goodbye』を発表し、ドイツだけで300万枚以上を売った。彼は12歳で失明しており、その来歴も物語として消費された。イギリスではSimon CowellがIl Divoという多国籍の四人組を2003年に結成し、オーディション番組の仕組みを使って売り出した。2007年、同じ番組から携帯電話の販売員だったPaul Pottsが登場し、その映像が世界中に広まった。日本ではサラ・ブライトマンや、2000年代の女性歌手たちが同種の路線を担った。批評家からは、オペラの様式を表面だけ借りた俗悪な商品だという厳しい批判が繰り返されており、クラシック側の音楽家との間の溝は今も埋まっていない。</p>
<h2>代表曲</h2><ul><li>Time to Say Goodbye (Andrea Bocelli &amp; Sarah Brightman)</li><li>You Raise Me Up (Josh Groban)</li><li>Nella Fantasia (Il Divo)</li><li>I Dreamed a Dream (Susan Boyle)</li><li>Jupiter (平原綾香)</li></ul>
