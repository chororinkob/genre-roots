<h1>Kizomba（キゾンバ）とは</h1>
<p>キゾンバは、アンゴラで生まれた、極めて緩やかなダンス音楽だ。官能的と形容されることが多いが、アンゴラ側にはその見方を誤解とする声もある。 上物（メロディーなど上に重ねる音）は、シンセサイザーによる柔らかい和音の敷物、電気ピアノ、そ</p>
<p>キゾンバは、アンゴラで生まれた、極めて緩やかなダンス音楽だ。官能的と形容されることが多いが、アンゴラ側にはその見方を誤解とする声もある。

上物（メロディーなど上に重ねる音）は、シンセサイザーによる柔らかい和音の敷物、電気ピアノ、そして時にギターの単音だ。全体の音数は少なく、隙間が多い。この余白が、密着して踊る2人の身体の間の空気を作る。和声（コードの響き）は、短調を中心とすることが多い。

テンポは遅い。おおむね80〜100 BPM（極端に遅い派生形では60台）で、4拍子を基本とする。

リズムの要は、低音の配置にある。1拍目・3拍目に低音の軸を置き、拍の直前に短い食い込み（プリックアップ）を加える。軽いシンコペーションを伴う。低音の配置の由来は、センバとする説明のほか、アンゴラの伝統的なリズム（カズクタ、カベトゥラ）に求める解説もある。

打楽器は少なめで軽い。1980年代以降は電子ドラム（リズムマシン）が普及した。

歌唱は、張り上げない。囁くように、あるいは甘くかすれた声で歌われることが多いとされる。言語は大半がポルトガル語だ。初期にはキンブンドゥ語などの現地語の曲もあった。歌詞は、恋愛、親密さ、望郷、都市の暮らしなどを扱うことが多いとされる。

この音楽は、踊りと切り離せない形で発達した。キゾンバの拍の速さや味わいに合わせて、センバのステップが調整されていったとされる。</p>
<h2>成り立ち</h2><p>舞台は、1970年代末から1980年代のアンゴラだ。時期は論者により幅があるが、この音楽はここで形を得た。ただし、その条件は極めて過酷だった。

1975年にポルトガルからの独立を達成した直後、この国は国際的な代理戦争を伴う内戦へ突入した。戦闘は2002年まで、四半世紀にわたって断続的に続いた。数十万が死亡し、数百万が家を追われている。この状況で、人々が夜に集まって密着して踊るという行為は、単なる娯楽以上の意味を持っていたと解釈されることがある。

音楽的な母体はセンバである。アンゴラの都市部で発達した舞踏音楽で、ブラジルのサンバとも源流を共有する。センバと、カリブ海のフランス領アンティル諸島のズークが融合して生まれたとする説明が有力だが、起源には諸説ある。

Eduardo Paimは、創始者の一人と目される。本人は自らを「先駆者」(Sou o precursor da Kizomba)と名乗り、ズークの模倣という見方は否定している。ただし、リズム上の類似は認めている。

ズークは、ズークのバンドKassav'のアフリカ公演や、パリで制作された録音を通じて、ポルトガル語圏のアフリカに広まった。

重要な拠点となったのが、リスボンである。アンゴラやカーボベルデなど旧ポルトガル植民地出身者のコミュニティが、リスボンを拠点にこの音楽の制作と流通を担った。ディアスポラ（国外出身者）に縁のある歌手の例として、オランダ生まれのカーボベルデ系のNelson Freitasや、アンゴラ・ルアンダ生まれでベルギー育ちのC4 Pedro（アンゴラに戻って活動）がいる。Nelson Freitasはズーク系（ゲットー・ズーク）の歌手で、キゾンバのイベントの場でも人気を得た。

1990年代にリスボンで踊りが商品化され、2000年代にかけて、この音楽は世界へ広がった。2人組の社交ダンスとして、ヨーロッパを中心に大規模な講習会と大会の文化が生まれたのである。

しかし、この国際化は摩擦も生んだ。2010年前後のヨーロッパでは、オランダ拠点のカーボベルデ系歌手が広めたゲットー・ズークが、教室やフェスで多く使われた。踊りは「基本ステップ」に標準化され、アンゴラ側から批判もある。起源の共同体が置き去りにされているという批判は、繰り返し提起されてきた。</p>
