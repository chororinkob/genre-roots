<h1>Kizomba（キゾンバ）とは</h1>
<p>アンゴラで生まれた、極めて緩やかで官能的なダンス音楽である。テンポは遅く、解説により60から100 BPMほどの幅があるが、4拍子を基本とする。リズムの要は低音の配置にあり、拍の頭を避けて裏や食い込む位置に短く置かれることで、引っ</p>
<p>アンゴラで生まれた、極めて緩やかで官能的なダンス音楽である。テンポは遅く、解説により60から100 BPMほどの幅があるが、4拍子を基本とする。リズムの要は低音の配置にあり、拍の頭を避けて裏や食い込む位置に短く置かれることで、引っかかるような、そして常に次を予感させる躍動が生まれる。低音の配置の由来はセンバとする説明のほか、アンゴラの伝統的なリズム（カズクタ、カベトゥラ）に求める解説もある。打楽器は打ち込み（機械で入力した音）が中心で、細かい刻みを絶やさず保ちつつ、音量は控えめに保たれる。上物（メロディーなど上に重ねる音）にはシンセサイザーによる柔らかい和音の敷物、電気ピアノ、そして時にギターの単音が置かれ、全体の音数は少なく、隙間が多い。この余白が、密着して踊る2人の身体の間の空気を作る。和声（コードの響き）は短調を中心とすることが多い。歌唱は張り上げず、囁くように、あるいは甘くかすれた声で歌われる。言語はポルトガル語と、アンゴラの現地語であるキンブンドゥ語が用いられる。歌詞は恋愛、親密さ、望郷、都市の暮らしなどを扱う。踊りと切り離せない形で発達した音楽であり、キゾンバの拍の速さや味わいに合わせて、センバのステップが調整されていったとされる。</p>
<h2>成り立ち</h2><p>この音楽は1970年代末から芽生えがあり、1980年代のアンゴラで形を得た。ただしその条件は極めて過酷だった。1975年にポルトガルからの独立を達成した直後、この国は国際的な代理戦争を伴う内戦へ突入し、2002年まで四半世紀にわたって戦闘が続いた。数十万が死亡し、数百万が家を追われている。この状況で、人々が夜に集まって密着して踊るという行為は、単なる娯楽以上の意味を持っていたと解釈されることがある。音楽的な母体はセンバである。これはアンゴラの都市部で発達した舞踏音楽で、ブラジルのサンバとも源流を共有する。センバとカリブ海のフランス領アンティル諸島のズークが融合して生まれたとする説明が有力だが、起源には諸説ある。Eduardo Paimは創始者の一人と目され、本人は自らを「先駆者」(Sou o precursor da Kizomba)と名乗り、ズークの模倣という見方は否定している。ズークは、ズークのバンドKassav'のアフリカ公演や、パリで制作された録音を通じて、ポルトガル語圏のアフリカに広まった。重要な拠点となったのがリスボンである。アンゴラやカーボベルデなど旧ポルトガル植民地出身者のコミュニティが、リスボンを拠点にこの音楽の制作と流通を担った。オランダ生まれのカーボベルデ系のNelson Freitasや、アンゴラ・ルアンダ生まれでベルギー育ちのC4 Pedroといった歌手がいる。Nelson Freitasはズーク系（ゲットー・ズーク）の歌手で、キゾンバのイベントの場でも人気を得た。2000年代以降、この音楽は思わぬ形で世界へ広がった。2人組の社交ダンスとして、ヨーロッパを中心に大規模な講習会と大会の文化が生まれたのである。しかしこの国際化は摩擦も生んだ。ヨーロッパで発達した踊りの形式が、アンゴラ本来のものから大きくかけ離れ、またヨーロッパではアンゴラ人以外の講師や、アンゴラ以外で作られたズーク系の曲が主流になったためである。起源の共同体が置き去りにされているという批判は、繰り返し提起されてきた。</p>
