<h1>Kizomba（キゾンバ）とは</h1>
<p>アンゴラで生まれた、極めて緩やかで、官能的と形容されることが多い（アンゴラ側にはその見方を誤解とする声もある）ダンス音楽である。テンポは遅く、おおむね80〜100 BPMで、極端に遅い派生形（タラシーニャ）では60台もあるが、4拍</p>
<p>アンゴラで生まれた、極めて緩やかで、官能的と形容されることが多い（アンゴラ側にはその見方を誤解とする声もある）ダンス音楽である。テンポは遅く、おおむね80〜100 BPMで、極端に遅い派生形（タラシーニャ）では60台もあるが、4拍子を基本とする。リズムの要は低音の配置にあり、1拍目と3拍目に低音の軸が置かれ、拍の直前に短い食い込み（プリックアップ）が加えられ、軽いシンコペーション（裏拍への強調移動）を伴うことで、引っかかるような躍動が生まれる。低音の配置の由来はセンバとする説明のほか、アンゴラの伝統的なリズム（カズクタ、カベトゥラ）に求める解説もある。打楽器は1980年代以降に電子ドラム（リズムマシン）が普及し、音数は少なめで軽く、音量は控えめに保たれる。上物（メロディーなど上に重ねる音）にはシンセサイザーによる柔らかい和音の敷物、電気ピアノ、そして時にギターの単音が置かれ、全体の音数は少なく、隙間が多い。この余白が、密着して踊る2人の身体の間の空気を作る。和声（コードの響き）は短調を中心とすることが多い。言語は大半がポルトガル語で、初期にはアンゴラの現地語であるキンブンドゥ語などの曲もあった。踊りと切り離せない形で発達した音楽であり、キゾンバの拍の速さや味わいに合わせて、センバのステップが調整されていったとされる。</p>
<h2>成り立ち</h2><p>この音楽は1970年代末〜1980年代初頭に芽生えがあり、1980年代のアンゴラで形を得たとされる（時期は論者によって幅がある）。ただしその条件は極めて過酷だった。1975年にポルトガルからの独立を達成した直後、この国は国際的な代理戦争を伴う内戦へ突入し、2002年まで四半世紀にわたって、断続的に戦闘が続いた。50万〜80万人が死亡し、400万人以上が家を追われたとされる。この状況で、人々が夜に集まって密着して踊るという行為は、単なる娯楽以上の意味を持っていたと解釈されることがある。音楽的な母体はセンバである。これはアンゴラの都市部で発達した舞踏音楽で、ブラジルのサンバとも源流を共有する。センバとカリブ海のフランス領アンティル諸島のズークが融合して生まれたとする説明が有力だが、起源には諸説ある。Eduardo Paimは創始者の一人と目され、本人は自らを「先駆者」(2011年のインタビュー見出し「Sou o precursor da Kizomba」)と名乗り、ズークの模倣という見方は否定しているが、リズム上の類似は認めている。ズークは、ズークのバンドKassav'のアフリカ公演や、パリで制作された録音を通じて、ポルトガル語圏のアフリカに広まった。重要な拠点となったのがリスボンである。アンゴラやカーボベルデなど旧ポルトガル植民地出身者のコミュニティが、リスボンを拠点にこの音楽の流通や踊りの商品化を担った。国外のアンゴラ系・カーボベルデ系の歌手には、オランダ生まれのカーボベルデ系のNelson Freitasや、アンゴラ・ルアンダ生まれでベルギー育ちのC4 Pedro（2009年にアンゴラへ戻って活動）がいる。Nelson Freitasはゲットー・ズーク（ズーク系の一種で、キゾンバそのものではないとされる）の歌手で、キゾンバのイベントの場でも人気を得た。1990年代にリスボンで踊りが商品化され、2000年代にかけて、この音楽は思わぬ形で世界へ広がった。2人組の社交ダンスとして、ヨーロッパを中心に大規模な講習会と大会の文化が生まれたのである。しかしこの国際化は摩擦も生んだ。2010年前後のヨーロッパの教室や祭りでは、アンゴラ以外で作られたゲットー・ズークなどのズーク系の曲が多く使われた。踊りは「基本ステップ」に標準化され、アンゴラの人々が自分たちの踊りを「センバ・ソーシャル」と捉えているという見方もある。起源の共同体が置き去りにされているという批判は、繰り返し提起されてきた。</p>
