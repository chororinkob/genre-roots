<h1>Kizomba（キゾンバ）とは</h1>
<p>アンゴラで生まれた、極めて緩やかで官能的なダンス音楽である。テンポは概ね80から100 BPMと遅く、四拍子を基本とする。リズムの要は低音の配置にあり、拍の頭を避けて裏や食い込む位置に短く置かれることで、引っかかるような、そして常</p>
<p>アンゴラで生まれた、極めて緩やかで官能的なダンス音楽である。テンポは概ね80から100 BPMと遅く、四拍子を基本とする。リズムの要は低音の配置にあり、拍の頭を避けて裏や食い込む位置に短く置かれることで、引っかかるような、そして常に次を予感させる躍動が生まれる。この配置はアンゴラの伝統的な舞踏音楽センバから受け継がれたものである。打楽器は打ち込みが中心で、細かい刻みを絶やさず保ちつつ、音量は控えめに保たれる。上物にはシンセサイザーによる柔らかい和音の敷物、電気ピアノ、そして時にギターの単音が置かれ、全体の音数は少なく、隙間が多い。この余白が、密着して踊る二人の身体の間の空気を作る。和声は短調と長調を行き来する感傷的な進行が用いられる。歌唱は張り上げず、囁くように、あるいは甘くかすれた声で歌われる。言語はポルトガル語と、アンゴラの現地語であるキンブンドゥ語が用いられる。歌詞は恋愛、別れ、望郷、そして日常の苦難を扱う。踊りと不可分に発達した音楽であり、二人が体を密着させて上体を保ったまま足を運ぶという形式が、リズムの設計そのものを規定している。</p>
<h2>成り立ち</h2><p>この音楽が形を得たのは1980年代のアンゴラである。ただしその条件は極めて過酷だった。1975年にポルトガルからの独立を達成した直後、この国は国際的な代理戦争を伴う内戦へ突入し、2002年まで四半世紀にわたって戦闘が続いた。数十万が死亡し、数百万が家を追われている。この状況で、人々が夜に集まって密着して踊るという行為は、単なる娯楽以上の意味を持っていた。音楽的な母体はセンバである。これはアンゴラの都市部で発達した舞踏音楽で、後のブラジルのサンバとも起源を共有する。1980年代、この土台の上に、カリブ海のフランス領アンティル諸島から届いたズークの電子的な制作が接続された。この接続を主導したのがEduardo Paimであり、彼はこの様式の創始者と目されている。当時、アンゴラとポルトガル、そしてフランス領カリブの間には、旧植民地を通じた人と音楽の往来があり、この回路が音楽の融合を可能にした。重要な拠点となったのがリスボンである。内戦を逃れた膨大な数のアンゴラ人がポルトガルへ移住し、その共同体がこの音楽の制作と流通の中心となった。カーボベルデ出身の作り手も加わり、Nelson FreitasやC4 Pedroといった歌手が、ポルトガル語圏のアフリカ全域に届く市場を形成する。2000年代以降、この音楽は思わぬ形で世界へ広がった。二人組の社交ダンスとして、ヨーロッパを中心に大規模な講習会と大会の文化が生まれたのである。しかしこの国際化は摩擦も生んだ。ヨーロッパで発達した踊りの形式が、アンゴラ本来のものから大きく乖離し、また音楽もアンゴラ人の関与なしに作られるようになったためである。起源の共同体が置き去りにされているという批判は、現在も繰り返し提起されている。</p>
