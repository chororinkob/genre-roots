<h1>Experimental Electronicとは</h1>
<p>実験的電子音楽は、決まった音楽の形に収まることを目指さず、電気や電子の音そのものに何ができるかを試す音楽をまとめた呼び名だ。 使う音にも方法にも、限りはない。発振器が出す正弦波・矩形波・鋸歯状波、雑音発生器のホワイトノイズ、テープ</p>
<p>実験的電子音楽は、決まった音楽の形に収まることを目指さず、電気や電子の音そのものに何ができるかを試す音楽をまとめた呼び名だ。

使う音にも方法にも、限りはない。発振器が出す正弦波・矩形波・鋸歯状波、雑音発生器のホワイトノイズ、テープの回転速度の操作、フィードバックの暴走などが使われる。電池で動く玩具などの既製の機器を改造し、ショートさせて、予期しない音を得るサーキットベンディングという手法まである。

一部の持続音・ドローン系の作品では、調性の代わりに、別のものが和声の役割を担う。近い二つの周波数が干渉して生まれる周期的な揺れ（うなり）や、倍音の重なりである。

拍を重視しない作品が多い。その代わりに、音の詰まり具合、音の高さの範囲、空間の広がり、鳴らす時間の長さを作り込んで、曲を組み立てる。

作り方もさまざまだ。作曲家が細部まで指定する場合もあれば、乱数や環境の変化に委ねて、偶然や自動生成に任せる場合もある。コンピュータでは、音を数値として合成するMax/MSP、SuperCollider、Pure Dataといった環境が使われる。

再生装置も作品の一部である。多数のスピーカーに音をどう振り分けるかや、会場そのものの響きを、計算に入れることが多い。ポップスやテクノと違い、踊りやすさも覚えやすさも重視しない作品が多い。そこには、聴くという行為そのものを、あらためて問い直す姿勢がある。</p>
<h2>成り立ち</h2><p>制度としてきちんと形になった電子音楽は、1950年代に、放送局と大学に置かれた研究スタジオで本格的に始まった（John Cageの1939年の作品を最初期の電子音響的作品とする見方もある）。

ドイツでは1951年、放送局（当時はNWDR、のちのWDR）のケルン・スタジオの創設が決まった（公式の開設は1953年）。中心になったのはHerbert Eimertである。ケルンは、録音した現実の音を素材にするパリのミュジック・コンクレートに対抗して、発振器が生む純粋な電子音だけで音楽を組み立てるElektronische Musikを掲げた。Karlheinz Stockhausenが1954年に作曲した「Studie II」は、正弦波の重ね合わせだけで作られた。1956年に楽譜が出版され、電子音楽で最初に出版された楽譜とされる。

イタリアでは1955年、ミラノのRAIにStudio di Fonologia Musicaleが置かれ、Luciano BerioとBruno Madernaが人の声の加工を進めた。アメリカでは、コロンビア大学とプリンストン大学の電子音楽スタジオが、1959年にColumbia-Princeton Electronic Music Centerとして正式に設立された。ここには、1957年に納入された、部屋一つを占める巨大な合成装置RCA Mark II Sound Synthesizerがあった。Milton Babbittはここで、音高・リズム・強弱などを音列的に組織した（総音列主義的な）作品を作った。ベル研究所のMax Mathewsは1957年、コンピュータに音を計算させるプログラムMUSIC Iを書き、デジタルで音を合成する出発点を作った。

一方で、制度の外側にも流れがある。John Cageは1939年の「Imaginary Landscape No. 1」で、回転速度を変えられるレコードプレーヤーを楽器として使った。1952年の「Williams Mix」では、約600種の録音を、易経による偶然の操作に従って磁気テープに切り貼りした。そして8本の独立したテープを同時に再生する作品にした。Louis and Bebe Barron夫妻は、1956年の映画「Forbidden Planet」の音楽を、全編電子音だけで付けている。その音は、自作の電子回路に負荷をかけすぎて焼き切れさせて作ったものだった。

イギリスでは、BBC Radiophonic Workshopが1958年に設立された。開設時はDaphne Oramが中心だったが、彼女は短い期間で去った。1960年代にはDelia Derbyshireが活躍し、テープ加工でドラマの音響を作った。Ron Grainerが作曲した1963年の「Doctor Who」の主題曲を、Derbyshireが電子音で形にし、電子音を一般の人々の耳に届けた。

やがて機材は、研究所から個人の手に移っていく。1964年にRobert Moogが、1960年代半ばにDon Buchlaが、それぞれモジュラー・シンセサイザーを発表したからだ。Iannis Xenakisは、確率論と建築の知識を作曲に持ち込んだ。1977年にパリで開設された研究機関IRCAMは、Pierre Boulezのもとで、コンピュータ音楽の中心になった。

1990年代以降は、Autechre、Aphex Twinらが、この伝統に合流する。彼らはハードウェア中心のダンス／テクノ系から出発し、のちにソフトウェア（Max など）を取り入れた。CDの読み取りエラーをわざと素材にしたOvalは、グリッチと位置づけられる。ウィーンのMegoや、イギリスのWarp Recordsといったレーベルがその受け皿になった。こうして実験的電子音楽は、学術と大衆文化の両方にまたがる分野になっている。</p>
