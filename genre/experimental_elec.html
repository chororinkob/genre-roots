<h1>Experimental Electronicとは</h1>
<p>既存の音楽形式に収まることを目的とせず、電気・電子の音そのものの可能性を試すことを目的にした音楽のまとめた呼び名。発振器が出す正弦波・矩形波・鋸歯状波、雑音発生器のホワイトノイズ、テープの回転速度の操作、フィードバックの暴走、自作</p>
<p>既存の音楽形式に収まることを目的とせず、電気・電子の音そのものの可能性を試すことを目的にした音楽のまとめた呼び名。発振器が出す正弦波・矩形波・鋸歯状波、雑音発生器のホワイトノイズ、テープの回転速度の操作、フィードバックの暴走、自作の回路や壊れた機材の誤動作を利用するサーキットベンディングまで、音源も方法も限定されない。拍を持たない曲が多く、代わりに音の詰まり具合、音の高さの範囲、空間の広がり、鳴らす時間の長さの作り込みで曲が組み立てられる。調性の代わりに、近い二つの周波数が干渉して生じる周期的な揺れ（うなり）や倍音の重なりが和音の役割を果たす。作曲家が細部まで指定する場合もあれば、乱数や環境の変化に委ねる偶然や自動生成に任せる場合もあり、コンピュータでは音を数値として合成するMax/MSP、SuperCollider、Pure Dataといった環境が使われる。再生装置も作品の一部で、多数のスピーカーへの音の配分や会場自体の反響を計算に入れることが多い。ポップスやテクノと違い、踊らせることも覚えやすさも目的にせず、聴くという行為そのものをあらためて問い直す姿勢が共通している。</p>
<h2>成り立ち</h2><p>きちんとした制度としての電子音楽は、1950年代に放送局と大学に設けられた研究スタジオで本格化した（John Cageの1939年の作品を最初期の電子音響音楽とする見方もある）。1951年に放送局（当時はNWDR、のちのWDR）のケルン・スタジオの創設が決まり（公式の開設は1953年）、Herbert Eimertを中心に、録音された現実音を素材とするパリのミュジック・コンクレートに対抗して、発振器が生む純粋な電子音だけで音楽を構成するElektronische Musikが掲げられた。Karlheinz Stockhausenが1954年に発表した「Studie II」は、正弦波の重ね合わせだけで作られ、電子音楽として史上初めて楽譜が出版された作品である。イタリアではミラノのRAIにStudio di Fonologia Musicaleが1955年に設けられ、Luciano BerioとBruno Madernaが人声の加工を進めた。アメリカでは、コロンビア大学とプリンストン大学の電子音楽スタジオが1959年にColumbia-Princeton Electronic Music Centerとして正式に設立され、1957年に納入された部屋一つを占める巨大な合成装置RCA Mark II Sound Synthesizerを擁し、Milton Babbittが音高・音価・音色まで完全にコントロールする作品を作った。ベル研究所のMax Mathewsは1957年、コンピュータに音を計算させるプログラムMUSIC Iを書き、デジタル音響合成の起点を作る。制度の外側にも系譜がある。John Cageは1939年の「Imaginary Landscape No. 1」で可変速レコードプレーヤーを楽器として使い、1952年の「Williams Mix」では約600種の録音を易経による偶然操作に従って磁気テープに切り貼りし、8本の独立したテープを同時に再生する作品にした。Louis and Bebe Barron夫妻は1956年の映画「Forbidden Planet」に、自作の電子回路を過負荷で焼き切れさせて作った電子音だけで全編の音楽を付けている。イギリスではBBC Radiophonic Workshopが1958年に設立され、Daphne OramとDelia Derbyshireがテープ加工でドラマの音響を作り、Ron Grainerが作曲した1963年の「Doctor Who」の主題曲を、Derbyshireが電子音で実現し、電子音を大衆の耳に届けた。1964年にRobert Moogが、1960年代半ばにDon Buchlaがそれぞれモジュラー・シンセサイザーを発表すると、機材は研究所から個人の手に移る。Iannis Xenakisは確率論と建築の知識を作曲へ持ち込み、1977年にパリで開設された研究機関IRCAMはPierre Boulezのもとでコンピュータ音楽の中心となった。1990年代以降は安価なパソコンとソフトウェアがスタジオを不要にし、Autechre、Aphex Twin、CDの読み取りエラーを意図的に素材にしたOvalらが、ダンス音楽やノイズの側からこの伝統に合流する。ウィーンのMegoやイギリスのWarp Recordsといったレーベルが受け皿となり、実験的電子音楽は学術と大衆文化の両方にまたがる分野になっている。</p>
<h2>代表曲</h2><ul><li>Switched-On Bach (Wendy Carlos)</li><li>Chorus (Holly Herndon)</li><li>Ziwzih Ziwzih OO-OO-OO (Delia Derbyshire)</li><li>Silver Apples of the Moon (Morton Subotnick)</li><li>Replica (Oneohtrix Point Never)</li><li>Hymnen (Karlheinz Stockhausen)</li><li>Persepolis (Iannis Xenakis)</li><li>Do While (Oval)</li><li>Studie I (Karlheinz Stockhausen)</li><li>I of IV (Pauline Oliveros)</li><li>Apocalypse (Tod Dockstader)</li><li>Forbidden Planet (Bebe and Louis Barron)</li></ul>
