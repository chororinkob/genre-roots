<h1>Experimental Electronicとは</h1>
<p>既存の音楽形式に収まることを目的とせず、電気・電子の音そのものの可能性を試すことを目的にした音楽の総称。発振器が出す正弦波・矩形波・鋸歯状波、雑音発生器のホワイトノイズ、テープの回転速度の操作、フィードバックの暴走、自作の回路や壊</p>
<p>既存の音楽形式に収まることを目的とせず、電気・電子の音そのものの可能性を試すことを目的にした音楽の総称。発振器が出す正弦波・矩形波・鋸歯状波、雑音発生器のホワイトノイズ、テープの回転速度の操作、フィードバックの暴走、自作の回路や壊れた機材の誤動作を利用するサーキットベンディングまで、音源も方法も限定されない。拍節を持たない曲が多く、代わりに音の密度、周波数の帯域、空間の広がり、持続時間の設計で構成が組み立てられる。調性の代わりに、近い二つの周波数が干渉して生じる周期的な揺れ（うなり）や倍音の重なりが和声の役割を果たす。作曲家が細部まで指定する場合もあれば、乱数や環境の変化に委ねる不確定性・自動生成に任せる場合もあり、コンピュータでは音を数値として合成するMax/MSP、SuperCollider、Pure Dataといった環境が使われる。再生装置も作品の一部で、多数のスピーカーへの音の配分や会場自体の反響を計算に入れることが多い。ポップスやテクノと違い、踊らせることも覚えやすさも目的にせず、聴くという行為そのものを問い直す姿勢が共通している。</p>
<h2>成り立ち</h2><p>1950年代、放送局と大学に設けられた研究スタジオから始まった。1951年に西ドイツ放送（WDR）のケルン・スタジオが開設され、Herbert Eimertを中心に、録音された現実音を素材とするパリのミュジック・コンクレートに対抗して、発振器が生む純粋な電子音だけで音楽を構成するElektronische Musikが掲げられた。Karlheinz Stockhausenが1954年に発表した「Studie II」は、正弦波の重ね合わせだけで作られ、そのために独自の図形楽譜が印刷された史上初の電子音楽作品である。イタリアではミラノのRAIにStudio di Fonologia Musicaleが1955年に設けられ、Luciano BerioとBruno Madernaが人声の加工を進めた。アメリカでは1958年にコロンビア大学とプリンストン大学が共同でColumbia-Princeton Electronic Music Centerを設立し、部屋一つを占める巨大な合成装置RCA Mark II Sound Synthesizerが導入され、Milton Babbittが音高・音価・音色まで完全に統御する作品を作った。ベル研究所のMax Mathewsは1957年、コンピュータに音を計算させるプログラムMUSIC Iを書き、デジタル音響合成の起点を作る。制度の外側にも系譜がある。John Cageは1939年の「Imaginary Landscape No. 1」で可変速レコードプレーヤーを楽器として使い、1952年の「Williams Mix」では磁気テープを乱数表に従って切り刻んだ。Louis and Bebe Barron夫妻は1956年の映画「Forbidden Planet」に、自作の真空管回路が壊れるまで発振する音だけで全編の音楽を付けている。イギリスではBBC Radiophonic Workshopが1958年に設立され、Daphne OramとDelia Derbyshireがテープ加工でドラマの音響を作り、Derbyshireによる1963年の「Doctor Who」の主題曲は電子音を大衆の耳に届けた。1964年にRobert MoogとDon Buchlaがそれぞれモジュラー・シンセサイザーを発表すると、機材は研究所から個人の手に移る。Iannis Xenakisは確率論と建築の知識を作曲へ持ち込み、1977年にパリで開設された研究機関IRCAMはPierre Boulezのもとでコンピュータ音楽の中心となった。1990年代以降は安価なパソコンとソフトウェアがスタジオを不要にし、Autechre、Aphex Twin、CDの読み取りエラーを意図的に素材にしたOvalらが、ダンス音楽やノイズの側からこの伝統に合流する。ウィーンのMegoやイギリスのWarp Recordsといったレーベルが受け皿となり、実験的電子音楽は学術と大衆文化の両方にまたがる領域になっている。</p>
<h2>代表曲</h2><ul><li>Studie I (Karlheinz Stockhausen)</li><li>Switched-On Bach (Wendy Carlos)</li><li>Silver Apples of the Moon (Morton Subotnick)</li></ul>
