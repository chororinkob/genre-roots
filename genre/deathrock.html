<h1>Deathrock（デスロック）とは</h1>
<p>デスロックは、パンクの編成と態度に、ホラーの情景と暗く沈んだ音づくりを持ち込んだスタイルだ。 ギターは、単純なコードか、エフェクトを効かせたリードで雰囲気を作る。コーラス・エフェクトが多く使われ、より広く不気味な音色を作る。 ベー</p>
<p>デスロックは、パンクの編成と態度に、ホラーの情景と暗く沈んだ音づくりを持ち込んだスタイルだ。

ギターは、単純なコードか、エフェクトを効かせたリードで雰囲気を作る。コーラス・エフェクトが多く使われ、より広く不気味な音色を作る。

ベースとドラムが、4/4の土台となる反復的なリズム隊を作る。ドラムは、同じ形を繰り返して前へ押し進めるビート（4/4）である。4/4の繰り返しのリズムが基本だが、テンポやスタイルには幅がある。

歌詞は自分の内面を見つめ、現実離れした世界を描く。孤立、陰鬱、喪失、死などを扱い、わざと大げさに作ったホラー映画やサイエンス・フィクション映画の要素を取り込む。ただし、ゴシック・ロックに比べると、より硬く、パンクの影響が強いとされる。

外見は、白塗りの顔と黒ずくめの服、吸血鬼のような姿、グラムロック風の見た目である。</p>
<h2>成り立ち</h2><p>1979年前後、Christian Deathや45 Graveが結成された。1980年代初頭には、米国ロサンゼルスで一つのシーンとしてまとまった。

当時、同地のパンク・シーンは、ハードコアなどに分岐していった。その中で異質な立場にあったバンドの一つが、カリフォルニア州クレアモントで結成されたChristian Deathである。中心人物Rozz Williamsは、10代でこのバンドを結成した。1982年のアルバムOnly Theatre of Painでは、宗教への冒涜と死のテーマを前面に出した。

「デスロック」という語は、1980年代初頭に再び使われるようになった。その由来は、Rozz Williams、音楽メディア、Nick Zeddの1979年の映画「They Eat Scum」の3つの候補が最有力の説とされ、定説はない(語自体は1950年代にも別の意味で使われた)。

同じころ、45 GraveのDinah Cancerは、女性ボーカルが珍しい時代にフロントに立ち、ホラー風の装いを取り入れた。Kommunity FK（1983年のアルバム『The Vision and the Voice』ほか）、Super Heroines（1982年『Cry for Help』ほか）、T.S.O.L.（1981年『Dance with Me』ほか）も、この流れに含まれる。

拠点となったのは、ロサンゼルスのAnti-Club（ハリウッド）やO.N. Klub（シルバーレイク）などだ。前者は固定の店ではなく、数週間ごとに会場を変えるクラブナイトだった。パンクの仲間の輪の中に、暗い一角が生まれた。

一方、イギリスでは同じころ、ゴシック・ロックが起きていた。Bauhaus、Siouxsie and the Banshees、The Damnedの後期作品である。米国のシーンはこれらと次第に結びついたが、よりパンク寄りだった。1980年代半ばには、この語はほとんど使われなくなり、ゴシック・ロックという広い呼び名に取り込まれた。

1983年にバンドに加わり、1985年のWilliams脱退後にバンドを率いたのが、Valor Kandである。Rozz Williamsは、この人物と名義をめぐって対立した。そのため、二つのChristian Deathが並行して存在する事態が続いた。彼は薬物依存と心の不調に苦しみ、1998年に34歳で自ら命を絶っている。

1990年代末から2000年代前半にかけて、このスタイルはロングビーチなどで再評価され、デスロック・リヴァイヴァルと呼ばれる動きが起きた。再評価の後は、Batcave風の美学など、さまざまな方向へ広がった。</p>
