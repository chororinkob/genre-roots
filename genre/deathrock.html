<h1>Deathrock（デスロック）とは</h1>
<p>パンクの編成と態度に、ホラー的な情景と陰鬱な音響を持ち込んだ様式。ギターは、単純なコードか、エフェクトを効かせたリードで雰囲気を作り、コーラスが多用される。この結果、音に隙間が多く残り、その空白が不気味さを生む。ベースは前面に出て</p>
<p>パンクの編成と態度に、ホラー的な情景と陰鬱な音響を持ち込んだ様式。ギターは、単純なコードか、エフェクトを効かせたリードで雰囲気を作り、コーラスが多用される。この結果、音に隙間が多く残り、その空白が不気味さを生む。ベースは前面に出て旋律的に動き、しばしば曲の主題を担う。ドラムは打楽器的な残響を強調し、フロアタムの連打による儀式的な響きが好まれる。BPMは中庸で、速さより間の緊張が重視される。和声は短調、とりわけ半音の動きを含む進行や、解決しない不協和が用いられる。歌唱は演劇的で、低い語り、震える裏声、そして絶叫が切り替わり、深い残響がかけられる。歌詞は死、墓地、精神の崩壊、性的な倒錯、そしてB級ホラー映画の情景を扱うが、ゴシック・ロックの耽美さに比べると、より生々しく荒々しい。外見は破れた黒い衣服、逆立てた髪、白塗りの顔で、パンクの手作り感を保持している点がゴシックとの違いである。</p>
<h2>成り立ち</h2><p>1979年前後にChristian Deathや45 Graveが結成され、1980年代初頭に米国ロサンゼルスのシーンとして形成された。同地のパンク・シーンは当時、ハードコアの高速で暴力的な方向へ傾いていたが、その中で異質な位置を占めたのがChristian Deathである。中心人物Rozz Williamsは10代でこのバンドを結成し、1982年のアルバムOnly Theatre of Painで、宗教的な冒涜と死の主題を前面に出した。「デスロック」という語は、1980年代初頭に再び使われるようになったが、その由来は、Rozz Williams、音楽メディア、Nick Zeddの1979年の映画「They Eat Scum」の3つの候補のどれかとされ、定説はない(語自体は1950年代にも別の意味で使われた)。同時期、45 GraveのDinah Cancerが、ホラー映画的な演出と女性の視点を持ち込んだ。Kommunity FK、Super Heroines、そしてT.S.O.L. の1981〜82年頃の作品(『Dance with Me』ほか)も、この系統に含まれる。拠点となったのはロサンゼルスのAnti-Club（ハリウッド）やO.N. Klub（シルバーレイク）などのクラブで、パンクの共同体の中に暗い一角が形成された。イギリスで並行して起きていたゴシック・ロック、すなわちBauhaus、Siouxsie and the Banshees、The Damnedの後期作品とは相互に影響し合ったが、米国側はより粗く、演奏も未熟さを隠さない点が異なる。1980年代半ばには、この語はほとんど使われなくなり、ゴシック・ロックという広い呼称に吸収された。Rozz Williamsは、1983年にバンドに加わり、1985年のWilliams脱退後にバンドを率いたValor Kandと、名義をめぐって長く争い、二つのChristian Deathが並行して存在するという事態が続いた。彼は薬物依存と精神の不調に苦しみ、1998年に34歳で自ら命を絶っている。1990年代末から2000年代前半にかけて、この様式は世界各地で再評価され、デスロック・リヴァイヴァルと呼ばれる動きが起きた。現在も小規模ながら国際的な共同体が存在し、初期の粗さと手作り感を美学として守り続けている。</p>
