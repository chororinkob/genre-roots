<h1>Digicore（ディジコア）とは</h1>
<p>デジコアは、2020年前後に、インターネット上で完結する形で生まれた音楽だ。作っているのは若い制作者たちである。決まったスタイルがあるというより、いろいろな要素を、つながりを気にせず混ぜる姿勢そのものが共通している。 土台には、ヒ</p>
<p>デジコアは、2020年前後に、インターネット上で完結する形で生まれた音楽だ。作っているのは若い制作者たちである。決まったスタイルがあるというより、いろいろな要素を、つながりを気にせず混ぜる姿勢そのものが共通している。

土台には、ヒップホップの低音とトラップの刻みがある。主な影響源は、トラップ、エモ・ラップ、ナイトコア、クラウド・ラップとされる。ゲーム由来の音を使う作品もある（例：『Teen Week』）。

いちばん特徴的なのは声の扱いだ。音程を自動で補正する装置を極端な設定で使い、わざと不自然な、階段のような音程の変化を作る。さらに声の音程を大きく上げて、幼く、現実離れした音色に変えることも多い。この、生身の身体から切り離された声こそが、この分野の情緒の中心にあると言える。

音量の作り方も常識から外れている。わざと歪ませ、音が割れた感じを隠さないことが多い。

歌詞は、恋愛、孤独、不安、インターネット上の人間関係を、とても個人的な言葉づかいで書く。

曲は比較的短いものが多い。</p>
<h2>成り立ち</h2><p>この動きには先行例もあるが、Discordなどを拠点にした、10代中心の集まりである点が特徴的だ。参加者の多くは10代で、実際に会ったことのない者が多く、住む国も異なる。

彼らを結びつけたのは、通話と文字による交流を主な目的とする、集団向けの通信サービスのDiscordだった。そこに作られた、限られた人だけが入れる部屋の中で、音源が共有され、感想や批評が交わされ、共同制作が行われた。

住む場所が近くなくても成り立つ音楽の共同体には、先行例もある。たとえば、2010年代初頭にLast.fm、Reddit、4chanで聴き手を築いたヴェイパーウェイヴだ。一方、2010年代初頭に主に英国で始まったハイパーポップとの関係では、デジコアは当初その中の一分野とされ、のちに並行して発展したとされる。「デジコアはハイパーポップだが、ハイパーポップが必ずしもデジコアとは限らない」という整理もある。

Daltonが2018年に、MinecraftとDiscordのサーバー「Loser’s Club」を立てた。デジコアという呼び名は、2019年にloneleeという作り手が、それまでの「draincore」に代わる語として提案した。

決定的な時期は2020年だ。世界的な感染症の流行で外出が制限され、10代の若者が自分の部屋で過ごす時間が大きく増えた。これが、この分野の急成長を後押しした。

ノースカロライナ州の当時15歳だったglaiveや、コネチカット州のericdoaといった作り手が、短い期間で注目を集めた。brakenceは、ミッドウェスト・エモ／エモ・ラップの要素を持つ作り手だ。Jane Removerは、シューゲイズ／ロック寄りの作風を経て、2025年にデジコア的な作風へ戻った。彼らには、YouTubeの講座で独学し、FL Studioの海賊版などで曲を作る者が多い。

一方で、「デジコア」という呼び名そのものを拒んだ作り手に、2hollisがいる。逆に、「ハイパーポップ」と呼ばれることを嫌い、「デジコアは自分たちにぴったり」と語る当事者もいる。

音の面は短い期間で急速に変わっていて、作風を変えた者もいる。それでも、寝室と通信網だけで国際的な音楽の流れが生まれうることを示した点で、大きな意味を持つという見方もある。</p>
