<h1>Digicore（ディジコア）とは</h1>
<p>2020年前後に、インターネット上で完結する形で生まれた若い制作者たちによる音楽である。特定の様式というより、複数の要素を脈絡なく混ぜる態度そのものが共通している。土台にはヒップホップの低音とトラップの刻みがあるが、そこへエモやポ</p>
<p>2020年前後に、インターネット上で完結する形で生まれた若い制作者たちによる音楽である。特定の様式というより、複数の要素を脈絡なく混ぜる態度そのものが共通している。土台にはヒップホップの低音とトラップの刻みがあるが、そこへエモやポップパンクの旋律、ドラムンベースやブレイクコアの高速の断片、電子ゲームの音源、そしてギターの掻き鳴らしが、同じ曲の中で次々に現れる。テンポも一定せず、一曲の途中で倍になったり半分になったりする。声の扱いが最も特徴的で、音程補正の装置を極端な設定で用い、意図的に不自然な階段状の音程変化を作り出す。さらに声の音程を大きく上げ、幼く非現実的な質感に変えることも多い。この、生身の身体から切り離された声こそが、この分野の情緒の中心にある。音量の設計も常識から外れ、意図的に歪ませ、割れた質感を隠さない。曲は1分半から2分半と短く、構成は断片の連続である。歌詞は恋愛、孤独、不安、インターネット上の人間関係を、極めて私的な語彙で書き、時に固有名詞や内輪の言い回しがそのまま用いられる。</p>
<h2>成り立ち</h2><p>この一群が形成された条件は、これまでのどの音楽とも異なる。参加者の多くは10代であり、互いに会ったことがなく、住む国も異なる。彼らを結びつけたのは、通話と文字による交流を主目的とする集団向けの通信サービスであり、そこに作られた閉じた部屋の中で、音源が共有され、批評が交わされ、共作が行われた。地理的な近接性を必要としない音楽の共同体という点で、これは歴史上ほぼ初めての事例である。直接の前身は2010年代半ばのハイパーポップで、極端に加工された声と過剰な音色という語彙はここから受け継がれている。決定的な時期は2020年で、世界的な感染症の流行によって外出が制限され、10代の若者が自室で過ごす時間が飛躍的に増えたことが、この分野の急成長を後押しした。ノースカロライナ州の当時15歳だったglaiveや、コネチカット州のericdoaといった作り手が短期間で注目を集め、brakenceはより複雑な編曲を持ち込み、Jane Removerは電子音楽の実験性を深めた。彼らの多くは音楽制作ソフトを独学で覚え、安価な機材だけで作品を作っている。デジコアという呼称は当事者と聴き手の間で自然に生まれたもので、これを嫌う作り手も多い。この分野には固有の困難がある。参加者が未成年であるため、契約や報酬をめぐって不利な立場に置かれやすく、また急激な注目が精神的な負担となって活動を止める例も相次いだ。加えて、閉じた交流の場の中で起きた嫌がらせや加害の告発が、公的な場へ持ち出されるという事態も繰り返されている。音楽的には短期間で急速に変化しており、多くの作り手が既に別の方向へ進んでいるが、寝室と通信網だけで国際的な音楽の潮流が生まれるという事実を証明した点で、決定的な意味を持つ。</p>
