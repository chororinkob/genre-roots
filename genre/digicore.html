<h1>Digicore（ディジコア）とは</h1>
<p>2020年前後に、インターネット上で完結する形で生まれた若い制作者たちによる音楽である。特定の様式というより、いろいろな要素を、つながりを気にせず混ぜる姿勢そのものが共通している。土台にはヒップホップの低音とトラップの刻みがあり、</p>
<p>2020年前後に、インターネット上で完結する形で生まれた若い制作者たちによる音楽である。特定の様式というより、いろいろな要素を、つながりを気にせず混ぜる姿勢そのものが共通している。土台にはヒップホップの低音とトラップの刻みがあり、主な影響源はトラップ、エモ・ラップ、ナイトコア、クラウド・ラップとされる。そこへ電子ゲームの音源やギターの掻き鳴らしが、同じ曲の中で次々に現れる。テンポも一定せず、一曲の途中で倍になったり半分になったりする。声の扱いが最も特徴的で、音程を自動で補正する装置を極端な設定で使い、わざと不自然な階段のような音程の変化を作る。さらに声の音程を大きく上げ、幼く、現実離れした音色に変えることも多い。この、生身の身体から切り離された声こそが、この分野の情緒の中心にある。音量の作り方も常識から外れていて、わざと歪ませ、音が割れた感じを隠さない。曲は短く、構成は断片の連続である。歌詞は恋愛、孤独、不安、インターネット上の人間関係を、とても個人的な言葉づかいで書き、時に固有名詞や内輪の言い回しがそのまま用いられる。</p>
<h2>成り立ち</h2><p>この動きが生まれた条件は、これまでのどの音楽とも違っている。参加者の多くは10代であり、互いに会ったことがなく、住む国も異なる。彼らを結びつけたのは、通話と文字による交流を主目的とする集団向けの通信サービスのDiscordであり、そこに作られた限られた人だけの部屋の中で、音源が共有され、感想や批評が交わされ、共同制作が行われた。地理的な近接性を必要としない音楽の共同体という点では、2010年代初頭にLast.fm、Reddit、4chanで聴き手を築いたヴェイパーウェイヴなど、先行例もある。直接の前身というより、2010年代初頭に主に英国で始まったハイパーポップと並行して発展した派生とされる。「デジコアはハイパーポップだが、ハイパーポップが必ずしもデジコアとは限らない」という整理もある。2018年には、MinecraftとDiscordのサーバー「Loser’s Club」が作られている。決定的な時期は2020年で、世界的な感染症の流行で外出が制限され、10代の若者が自分の部屋で過ごす時間が大きく増えたことが、この分野の急成長を後押しした。ノースカロライナ州の当時15歳だったglaiveや、コネチカット州のericdoaといった作り手が短期間で注目を集め、brakenceはより複雑な編曲を持ち込み、Jane Removerは電子音楽の実験性を深めた。彼らの多くは音楽制作ソフトを独学で覚え、安価な機材だけで作品を作っている。デジコアという呼称は、2019年にloneleeという作り手が、それまでの「draincore」に代わる語として提案した。「デジコア」自体を拒んだ作り手には2hollisがいる一方、「ハイパーポップ」と呼ばれることを嫌い、「デジコアは自分たちにぴったり」と語る当事者もいる。音の面では短い期間で急速に変わっていて、多くの作り手が既に別の方向へ進んでいるが、寝室と通信網だけで国際的な音楽の潮流が生まれるという事実を証明した点で、とても大きな意味を持つ。</p>
