<h1>Nitzhonot（ニッチョノット）とは</h1>
<p>ニツホノットは、イスラエルで生まれたゴアトランスの一系統だ。中東的な旋律と、極端に明るい高揚感を組み合わせている。名前は、ヘブライ語で勝利を意味するnitzachonに由来する。 ゴア由来の要素を引き継ぎつつ、四つ打ちのキックの上</p>
<p>ニツホノットは、イスラエルで生まれたゴアトランスの一系統だ。中東的な旋律と、極端に明るい高揚感を組み合わせている。名前は、ヘブライ語で勝利を意味するnitzachonに由来する。

ゴア由来の要素を引き継ぎつつ、四つ打ちのキックの上に曲が展開する。キックは、laserkick（高音で攻撃的なキック）が特徴である。ベースについては、見方が分かれる。テンポは毎分145〜155拍のことが多い。

しかし、旋律の扱いは決定的に異なる。ここでは中東的（オリエンタル）で、歌えるほど分かりやすい主旋律が前面に置かれる。ゴアトランス一般の抽象的な響きに対して、こちらは民族音楽のような情緒を隠さない。

アニメや映画のサンプルがよく使われる。

ブレイクダウン（盛り上がりの途中で一度静かにする部分）では、打楽器を止めて旋律だけを聴かせ、そこから一気に戻す。分かりやすい組み立てである。全体として、ゴアトランスやサイケデリック・トランスの中でも明るく高揚感が強い、と評されることが多い。</p>
<h2>成り立ち</h2><p>1990年代半ば〜後半、イスラエルでこの音楽が形になった。背景には、イスラエル特有の社会の事情がある。

同国では兵役が義務で、それを終えたあとに長い海外旅行に出る習慣が定着していた。人気の行き先は、インドのゴア州だった。そこで開かれていた野外パーティーの文化が、イスラエルへ持ち帰られ、発展した。1990年代には、森や海岸、砂漠などで、違法なパーティーが毎週末のように数多く開かれるようになる。

こうして受け入れられる中で、ゴアトランスの音に地元の音楽の要素が加えられた。イスラエルの大衆音楽には、東方系ユダヤ人(ミズラヒ)の音楽を通じて、中東やギリシャの旋法が深く染み込んでいた。この旋律の感覚がトランスと結びついたことが、ニツホノットの成立に影響したという見方もある。

名前はヘブライ語で「勝利」(複数形)を意味する語に由来する。1998年にHolymenとEyal Barkanがこの音楽の形を固めたとする説が一般的だが、Shiva Shidapuを先駆とする見方もある。中心となった作り手としては、HolyMen、Eyal Barkan、Astrix、Yahelの名が挙がる。関連レーベルには、Eyal Barkan Records、Holly Shwartz Productions、Discobole、Shem Recordsなどがある。Phonokolはトランスやダンス、クラブ系を専門とするレーベルだ。Krembo Recordsは1990年代のゴアトランス系のレーベルで、Hom-Mega(1997年設立)には、フルオン系の「Full On」「IsrAliens」シリーズがある。

1998年には、イスラエル国内でヒットした。大衆音楽として広く受け入れられた。1990年代末には、ラジオにサイケ系の専用枠もあった。同じ1998年の『Good Morning Israel』は、イスラエル国内でゴールド相当（約2万枚超）の売上を記録した最初のトランス作品とされる。プラチナとする説もある。

しかし、批判も強かった。ゴアトランスの古参からは、単純で商業的だと批判された。

その後、イスラエルの作り手の多くはフルオンへ移った。一方ギリシャでは、ニツホノットがUpliftingと名を変えて、2000年代初頭に再び盛り上がった。2000年代後半には、ベルギーなどでNitzhogoaが生まれた。Astrixはサイケトランスの中心人物になり、Yahelはクラブ寄りのトランスで国際的に成功した。2000年代後半以降には、Nitzhogoa（Agneton、Sita Records）などで再評価の動きがある。イスラエル国内では、1990年代のパーティーの映像を使ったドキュメンタリー『Free People』も作られている。</p>
