<h1>Nitzhonot（ニッチョノット）とは</h1>
<p>イスラエルで生まれたゴアトランスの一系統で、中東的な旋律と極端に明るい高揚感を組み合わせた形式。名称はヘブライ語で勝利を意味するnitzachonに由来する。テンポは145〜155BPM。基本の骨格はゴアトランスと同じく、四つ打ち</p>
<p>イスラエルで生まれたゴアトランスの一系統で、中東的な旋律と極端に明るい高揚感を組み合わせた形式。名称はヘブライ語で勝利を意味するnitzachonに由来する。テンポは145〜155BPM。基本の骨格はゴアトランスと同じく、四つ打ちのキックと、拍の裏で鳴るベースの上に、16分音符で和音を一音ずつ弾くアルペジオが展開する構造をとる。しかし旋律の扱いが決定的に異なる。ここでは中東やバルカン半島の音階、とりわけハーモニックマイナーやフリギア・ドミナント(増2度を含む旋法)による、明快で歌えるほど分かりやすい主旋律が前面に置かれる。この旋律はしばしば長い上行の弧を描き、頂点で開放される。ゴアトランス一般の抽象性に対して、こちらは民族音楽的な情緒を隠さない。音色は鋭いシンセのリードと、リヴァーブを深くかけたパッド。ブレイクダウン（盛り上がりの途中で一度静かにする部分）では打楽器を止めて旋律だけを提示し、そこから一気に戻すという明快な構成をとる。この点でユーロトランスに近い設計思想を持つ。曲は8分前後。ヴォーカルはほぼ存在せず、あってもヘブライ語や英語の短い断片。全体として、サイケデリック・トランスの中では最も直接的で祝祭的な性格を持ち、暗く内向的なダークサイケとは対極に位置する。</p>
<h2>成り立ち</h2><p>1990年代半ばのイスラエルで成立した。背景には、イスラエル特有の社会状況がある。同国では兵役が義務であり、その終了後に長期間の海外旅行に出るという慣習が定着していた。行き先として人気だったのがインドのゴア州で、そこで開かれていた野外パーティーの文化が、イスラエルへ持ち帰られ、発展した。1990年代には、森や海岸、砂漠などで違法なパーティーが毎週末のように数多く開かれるようになる。この受容の過程で、ゴアトランスの音に地元の音楽的な語彙が加えられた。イスラエルの大衆音楽には、東方系ユダヤ人(ミズラヒ)の音楽を通じて、中東やバルカン、ギリシャの旋法が深く浸透していた。この旋律感覚がトランスと結合したことが、ニツホノットの成立に影響したという見方が有力である。名称はヘブライ語で「勝利」(複数形)を意味する語に由来し、1998年にHolymenとEyal Barkanが確立したとする資料もある。中心となった作家としては、HolyMen、Eyal Barkan、Astrix、Yahelといった名が挙がる。ニツホノットの関連レーベルとしては、Eyal Barkan Records、Holy Shwartz Productions、Discobole、Shem Recordsなどが挙げられる。Phonokol、Krembo Recordsは1990年代のゴアトランス系のレーベルで、Hom-Mega(1997年設立)はフルオン系が中心だった。1998年にはイスラエル国内でヒットし、大衆音楽として広く受容され、ラジオでも流された。1998年の『Good Morning Israel』は、イスラエル国内でゴールド認定を受けた最初のトランス作品とされる。ヨーロッパでは、とりわけギリシャとベルギーで受け入れられた。しかし批判も強かった。旋律が単純すぎる、感傷的で商業的だ、サイケデリック音楽の実験精神を失っているといった非難が、ゴアトランスの本流の側から向けられた。当時のヨーロッパの批評では、イスラエル産の明るいトランス全般に対して軽蔑的な扱いがなされることも多かった。この背景には、音楽的な判断だけでなく文化的な偏見も混じっていたと後に指摘されている。その後、イスラエルの作家の多くがフルオンへ転向した一方、ギリシャではニツホノットがアップリフティング・トランスと名を変えて2000年代に再び盛り上がった。AstrixやYahelは国際的なサイケトランスの中心人物になった。2010年代以降、当時の音を懐かしむ動きが起き、ニツホノットの再興を掲げる作家や、当時の作品を再発する試みが現れている。イスラエル国内では、1990年代の野外パーティーの記憶が世代的な文化として語り継がれている。</p>
