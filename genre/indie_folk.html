<h1>Indie Folk（インディーフォーク）とは</h1>
<p>民謡の楽器編成を土台にしながら、インディー・ロックの録音感覚と実験性を持ち込んだ様式である。アコースティック・ギター、バンジョー、マンドリンといった生楽器が中心で、例として、アコーディオンやグロッケンシュピール（金属板を叩く鉄琴）</p>
<p>民謡の楽器編成を土台にしながら、インディー・ロックの録音感覚と実験性を持ち込んだ様式である。アコースティック・ギター、バンジョー、マンドリンといった生楽器が中心で、例として、アコーディオンやグロッケンシュピール（金属板を叩く鉄琴）なども使われるが、伝統的な民謡のように素直に鳴らすことはせず、音を重ねたり歪ませたりして加工する。特徴的なのが声の扱いで、複数の声部を何層にも重ねた合唱が多用され、歌詞の意味よりも声の塊としての響きが重視される場面が多い。例として、裏声を主旋律に使うこと、男女の声を同じ音域で重ねること、意味を持たない母音の合唱を差し込むことなどがある。録音は完璧さを求めず、部屋の残響、椅子のきしみ、息の音をそのまま残すことがある。こうした粗い質感を残した作品が多く、聴き手にその場に居合わせているような感覚を与える。リズムは、打楽器を絞った曲では足踏みや手拍子、木の箱を叩く音で代用することも多いが、ドラムを入れた曲もある。曲の構成は静かな反復型が多い一方、アーケイド・ファイアやマムフォード・アンド・サンズのように、段階的に盛り上げる曲もある。歌詞は自然の情景、季節、動物、記憶といったイメージが多用され、物語性は作品により強弱がある。</p>
<h2>成り立ち</h2><p>1990年代のアメリカのインディー・ロックの周辺で、電気楽器の音量に頼らない方向を探る動きが積み重なったことが土台にある。ニュートラル・ミルク・ホテルが1998年に発表した『イン・ジ・エアロプレーン・オーヴァー・ザ・シー』は、生ギターと金管、そして歪んだ録音を組み合わせた作品で、評論家が後続への影響を指摘している。同じ頃、Smog(ビル・キャラハン)は初期に宅録を行い、のちにスタジオ録音へ移った。ワシントン州オリンピアを拠点とするマイクロフォンズ（中心人物はアナコーテス出身）は、ローファイ（粗い音質を生かした録音）で実験的なフォークやノイズ寄りの音を作った。2000年代に入ってレーベルの支援や商業的成功を得て、広く知られるようになった。2004年にはカナダのアーケイド・ファイアが、フォーク的な楽器や合唱を取り入れたインディー・ロックの『フューネラル』を、2006年にジョアンナ・ニューサムがハープと特異な声で『イズ（Ys）』を発表し、同じ2006年にフリート・フォクシーズが結成された。彼らが2008年に発表したデビュー作『Fleet Foxes』では、3〜4声の重唱が中心に据えられ、この様式の象徴的存在とされる。ジャスティン・ヴァーノンのボン・イヴェールは、『フォー・エマ、フォーエヴァー・アゴー』を2007年7月に自主盤で、2008年2月にJagjaguwar版として発表している（録音は2006年11月〜2007年1月）。恋人との別れとバンドの解散（または脱退）のあと、ウィスコンシン州の父親の狩猟小屋に三か月こもって一人で録音した（録音の大半は小屋で行われた）という経緯が広く報じられ、孤立した環境で作られた音という神話化された物語が作品の受け取られ方そのものを形づくった。英国ではマムフォード・アンド・サンズが2009年の『サイ・ノー・モア』で4人編成のバンドが、バンジョーなどを前面に出した大音量のアンサンブルを提示し、これが世界的な商業的成功を収めたことで、素朴さを掲げていたはずの様式が大規模な会場で演奏されるという皮肉が語られた。2010年代半ば以降は、マムフォード・アンド・サンズは2015年の『Wilder Mind』でエレキ中心の方向に舵を切ったが、その後はポップ化を経て、2025年の『Rushmere』でバンジョーを含む路線に戻った。ボン・イヴェールは電子音の導入へと向かった。</p>
