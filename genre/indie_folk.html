<h1>Indie Folk（インディーフォーク）とは</h1>
<p>民謡の楽器編成を土台にしながら、インディー・ロックの録音感覚と実験性を持ち込んだ様式である。アコースティック・ギター、バンジョー、マンドリン、アコーディオン、グロッケンシュピールといった生楽器が中心だが、伝統的な民謡のように素直に</p>
<p>民謡の楽器編成を土台にしながら、インディー・ロックの録音感覚と実験性を持ち込んだ様式である。アコースティック・ギター、バンジョー、マンドリン、アコーディオン、グロッケンシュピールといった生楽器が中心だが、伝統的な民謡のように素直に鳴らすことはせず、音を重ねたり歪ませたりして加工する。特徴的なのが声の扱いで、複数の声部を何層にも重ねた合唱が多用され、歌詞の意味よりも声の塊としての響きが重視される場面が多い。裏声を主旋律に使うこと、男女の声を同じ音域で重ねること、意味を持たない母音の合唱を差し込むことも定番の手法である。録音は意図的に完璧さを避け、部屋の残響、椅子のきしみ、息の音をそのまま残すことがある。これは商業的に磨かれた音への対抗として選ばれた質感であり、聴き手にその場に居合わせているような感覚を与える。リズムは打楽器を絞り、足踏みや手拍子、木の箱を叩く音で代用することも多い。曲の構成は起伏を抑え、同じ音型を反復しながら音を少しずつ足していく形が好まれる。歌詞は自然の情景、季節、動物、記憶といった素材を、物語ではなく断片的な映像として並べる書き方が主流である。</p>
<h2>成り立ち</h2><p>1990年代のアメリカのインディー・ロックの周辺で、電気楽器の音量に頼らない方向を探る動きが積み重なったことが土台にある。ニュートラル・ミルク・ホテルが1998年に発表した『イン・ジ・エアロプレーン・オーヴァー・ザ・シー』は、生ギターと金管、そして歪んだ録音を組み合わせた作品で、後続に決定的な影響を与えた。同じ頃、シアトルのスモッグやビル・キャラハン、ワシントン州のマイクロフォンズが、宅録の粗い音質のまま民謡的な曲を発表していた。様式として広く認識されたのは2000年代半ばである。2004年にアーケイド・ファイアが『フューネラル』を、2006年にジョアンナ・ニューサムがハープと特異な声で『イズ（Ys）』を発表し、翌年にはフリート・フォクシーズが結成された。彼らが2008年に発表した作品では、教会の合唱に近い多声の重唱が中心に据えられ、この様式の音の象徴となった。同じ2008年には、ジャスティン・ヴァーノンがボン・イヴェールの名で『フォー・エマ、フォーエヴァー・アゴー』を発表している。恋人との別れとバンドの解散のあと、ウィスコンシン州の父親の狩猟小屋に三か月こもって一人で録音したという経緯が広く報じられ、孤立した環境で作られた音という物語が作品の受け取られ方そのものを形づくった。英国ではマムフォード・アンド・サンズが2009年の『サイ・ノー・モア』でバンジョーを前面に出した大編成の形を提示し、これが世界的な商業的成功を収めたことで、素朴さを掲げていたはずの様式が大規模な会場で演奏されるという逆説が生じた。2010年代半ば以降は、この商業化への反動として、より内向きで電子音を取り込んだ方向へ分岐している。</p>
