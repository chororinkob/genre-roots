<h1>Indie Folk（インディーフォーク）とは</h1>
<p>インディー・フォークは、民謡の楽器編成を土台にしながら、インディー・ロックの録音感覚と実験性を持ち込んだスタイルだ。 例えば、アコースティック・ギター、バンジョー、マンドリン、アコーディオン、グロッケンシュピール（金属板を叩く鉄琴</p>
<p>インディー・フォークは、民謡の楽器編成を土台にしながら、インディー・ロックの録音感覚と実験性を持ち込んだスタイルだ。

例えば、アコースティック・ギター、バンジョー、マンドリン、アコーディオン、グロッケンシュピール（金属板を叩く鉄琴）といった生楽器が中心になることが多い。ただし、伝統的な民謡のように素直には鳴らさず、音を重ねたり歪ませたりして加工する。

リズムは、打楽器を絞った曲では、足踏みや手拍子、木の箱を叩く音で代用することも多い。一方で、ドラムや歪んだギターを入れた曲もある。曲の構成は、静かな反復型の曲が多い一方、アーケイド・ファイアやマムフォード・アンド・サンズのように、段階的に盛り上げる曲もある。

特徴的なのが声の扱いだ。複数の声部を何層にも重ねた合唱が多用され、歌詞の意味よりも声の塊としての響きが重視される場面が多い。裏声を主旋律に使うこと、男女の声を同じ音域で重ねること、意味を持たない母音の合唱を差し込むことなどがある。

録音では、部屋の残響、椅子のきしみ、息の音をそのまま残すことがある。粗い質感を残した作品が多く、聴き手にその場に居合わせているような感覚を与える。

歌詞は自然の情景、季節、動物、記憶といったイメージが多用される。物語性は作品により強弱がある。</p>
<h2>成り立ち</h2><p>1990年代のアメリカのインディー・ロックの周辺で、電気楽器の音量に頼らない方向を探る動きが積み重なった。これが土台にある。ニュートラル・ミルク・ホテルが1998年に発表した『イン・ジ・エアロプレーン・オーヴァー・ザ・シー』は、生ギターと金管、そして歪んだ録音を組み合わせた作品だ。評論家が影響を指摘している。

Smog(ビル・キャラハン)は初期に宅録を行い、のちにスタジオ録音へ移った。ワシントン州オリンピアを拠点とするマイクロフォンズ（中心人物はアナコーテス出身）は、lo-fiで実験的なフォーク／ノイズ寄りの音を作った。

2000年代に入ってレーベルの支援や商業的成功を得て、広く知られるようになった。2004年に、周辺のインディー・ロックで、フォーク的な楽器や合唱を取り入れた例として、カナダのアーケイド・ファイアが『フューネラル』を発表した。2006年にはジョアンナ・ニューサムが、ハープと特異な声で『イズ（Ys）』を発表した。同じ2006年に、フリート・フォクシーズが結成された。

フリート・フォクシーズが2008年に発表したセルフタイトルのデビュー作Fleet Foxesでは、3〜4声の重唱が中心に据えられた。この音は、このスタイルを代表する存在とされる。

ジャスティン・ヴァーノンのボン・イヴェールは、『フォー・エマ、フォーエヴァー・アゴー』を2007年7月に自主盤で、2008年2月にJagjaguwar版として発表している（録音は2006年11月〜2007年1月）。恋人との別れとバンドの解散(または脱退)のあと、ウィスコンシン州の父親の狩猟小屋に三か月こもって一人で録音したという経緯が広く報じられた。孤立した環境で作られた音という神話化された物語が、作品の受け取られ方そのものを形づくった。

英国ではマムフォード・アンド・サンズが、2009年の『サイ・ノー・モア』で、4人編成のバンドによる、バンジョーなどを前面に出した大音量のアンサンブルを提示した。これが世界的な商業的成功を収めた。その結果、素朴さを掲げていたはずのスタイルが大規模な会場で演奏されることは、皮肉として語られた。

2010年代半ば以降、ボン・イヴェールは電子音の導入へと向かった。マムフォード・アンド・サンズは、2015年のWilder Mindでエレキ中心の方向に舵を切ったが、その後はポップ化を経て、2025年のRushmereでバンジョーを含む路線に戻った。</p>
