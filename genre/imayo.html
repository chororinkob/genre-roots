<h1>Imayoとは</h1>
<p>今様は、平安時代の宮廷と市中で盛んに歌われた日本の流行歌だ。代表曲22曲を動画で聴け、ルーツと影響のつながりを地図でたどれる。</p>
<p>今様は、平安時代の宮廷と市中で盛んに歌われた日本の流行歌だ。名前の由来は「今の流行のスタイル」で、当時の最新のヒット曲にあたる。

伴奏は鼓が中心で、笛などを加えることもあった。伴奏をまったく付けないこともあった。扇や鼓で拍子を取ることもあった。リズムは、歌い手自身の拍子取りと、鼓の打音で刻まれる。

日本の伝統歌謡なので、和声の考え方を持たない。コード進行に頼らず、ひとりの声が長い節回しで旋律を描く。今様の詞を越天楽（平調）の節に乗せる越天楽今様が知られる。ただし、当時の旋律の全体像は分かっていない。

歌い方は、『長うてくせづきたり』（枕草子）と評された。この言葉の解釈は定まっていない。白拍子が舞いながら歌う例が知られる。

歌詞の中心は、7音と5音を組み合わせた七五調の4句だ。ただし字余りなど、形の整わないものも多い。題材は恋、遊興、仏教への祈り、庶民の生活や心情、子どもの遊びまで幅広い。和歌より自由で、口語に近い言葉で綴られる。その場の状況に合わせて、即興で歌われることもあった。

曲の組み立ては、4句の詞を節に乗せて一通り歌うのが基本だ。歌われた場は、宴会や神事、市中の往来である。貴族の歌謡と民衆の歌を橋渡しした。</p>
<h2>成り立ち</h2><p>今様が姿を見せるのは、11世紀頃である。それまで宮廷で歌われていたのは、神楽歌や催馬楽のような由緒ある歌謡だった。遊女・傀儡師・白拍子らが担い手となり、やがて宮廷にも広まった。

12世紀の院政期に入ると流行はさらに広がり、今様は宴席で歌い踊る新しい娯楽になった。そして後白河院の代に最盛期を迎えた。この院は今様に熱中し、遊女の乙前を師と仰いで御所内（または近く）に住まわせ、彼女の知る限りの歌と節を伝授させた。源頼朝が書状で「日本国第一の大天狗」と難詰したのは、後白河院を指すとするのが通説である。院は晩年まで今様を愛し続けた。承安4年（1174）ごろには、御所で15夜にわたる今様合という歌合わせを開いた。この時期が今様の頂点とされる。乙前の死の床には、院が自ら訪ねて歌を贈ったと伝わる。

その集大成が『梁塵秘抄』である。歌詞集10巻・口伝集10巻とされる。成立は嘉応元年（1169）頃から治承年間（1180年前後）にかけてと考えられる（諸説あり）。早くに散逸したが、1911年に再発見され、現存は566首（重複あり）である。仏教への祈り、恋、庶民の生活や心情、子どもの遊び歌まで、身分を問わない題材が並ぶ。今様の歌詞と口伝を後世に残した重要な資料である。

しかし、後白河院の没後は次第に衰え、鎌倉時代には宴曲など別の歌謡が主流になる。鎌倉時代以降は形が固定化し、伝承として受け継がれるものになった。節は生きた伝承としてほぼ失われた。源頼朝の前で舞った静御前のように、白拍子の舞とともに語られる場面は戦乱の世に残った。越天楽の旋律に今様の詞を乗せた越天楽今様は雅楽の家に残り、福岡地方の民謡にも伝わった。

日本今様謌舞楽会は1948年設立である。桝井泰山が創案した節で、1986年に今様合を復興した。梁塵秘抄を題材にした合唱曲・吹奏楽曲の創作が続いている。</p>
<h2>代表曲</h2><ul><li>黒田節 (三橋美智也)</li><li>遊びをせんとや生まれけむ (梁塵秘抄)</li><li>仏は常にいませども (梁塵秘抄)</li><li>熊野へ参るには (梁塵秘抄)</li><li>君が愛せし綾藺笠 (桃山晴衣)</li><li>今様 (日本今様謌舞楽会)</li><li>梁塵今様 (川崎絵都夫)</li><li>瑠璃の浄土は潔し (桃山晴衣)</li><li>わが子は十余になりぬらん (桃山晴衣)</li><li>百日百夜はひとり寝と (桃山晴衣)</li><li>われを頼めて来ぬ男 (桃山晴衣)</li><li>楠葉の御牧の土器造り (桃山晴衣)</li><li>南宮の宮には (桃山晴衣)</li><li>われは何して老いぬらん (土取利行)</li><li>そよや、小柳によな (桃山晴衣)</li><li>熊野へ参らんと (桃山晴衣)</li><li>不動明王恐ろしや (土取利行)</li><li>讃岐の松山に (土取利行)</li><li>夜叉姫 (桃山晴衣)</li><li>うたえやうたえ (後藤幸浩)</li><li>めぐりあい (千原英喜)</li><li>筑前今様 (桃山晴衣)</li></ul>
