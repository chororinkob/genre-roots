<h1>Imayoとは</h1>
<p>一言でいうと、平安時代の宮廷と市中で盛んになった日本の流行歌謡である。代表曲22曲を動画で聴け、ルーツと影響のつながりを地図でたどれる。</p>
<p>一言でいうと、平安時代の宮廷と市中で盛んになった日本の流行歌謡である。名前の由来は「今の流行のスタイル」で、当時の最新ヒット曲にあたる。日本の伝統歌謡なので和声の概念を持たず、コード進行に頼らず、ひとりの声が長い節回しで旋律を描く。旋律の土台には、雅楽の越天楽で使われる平調の音階がよく用いられ、同じ旋律にさまざまな歌詞を乗せ替えて歌う越天楽今様という形式も広まった。

伴奏は、鼓や笛が付くこともあれば、まったく付けない無伴奏のことも多い。拍子を取るのに扇を打ち鳴らすのが特色で、太鼓のようにリズムを支えるドラムは存在しない。リズムは歌い手自身の拍子取りと、鼓の打音で刻まれる。

歌い方は、張りのある声でのびやかな節回しが持ち味である。歌いながら舞うことも多く、歌と舞が一体になったパフォーマンスだった。

歌詞の中心は7音と5音を組み合わせた七五調の4句である。題材は恋、遊興、仏教への祈り、世相の風刺、子どもの遊びまで幅広く、和歌より自由で口語に近い言葉で綴られる。即興で歌うことも多く、その場の状況に合わせて詞を作った。

曲の組み立ては、4句の詞を節に乗せて一通り歌うのが基本で、短い歌を次々に歌い継ぐスタイルも好まれた。宴会や神事、市中の往来で歌われ、貴族の歌謡と民衆の歌を橋渡しした。</p>
<h2>成り立ち</h2><p>今様の物語は、11世紀の中ごろの京都にはじまる。それまで宮廷で歌われていたのは神楽歌や催馬楽のような由緒ある歌謡だったが、新しい世代は古い形式に飽き足らず、「今風」の歌を求めるようになった。今様は宮廷の外で育った歌である。傀儡師や遊女といった芸能民が街や道で歌う歌が原形となり、それが白拍子と呼ばれる女性芸能者に受け継がれ、次第に貴族の世界へ入り込んだ。

12世紀の院政期に流行は広がり、今様は宴席で歌い踊る新しい娯楽になった。この歌を宮廷文化の中心へ引き上げたのが後白河院である。彼は今様に熱中し、遊女の乙前を師と仰いで御所に住まわせ、彼女の知る限りの歌と節を伝授させた。源頼朝から「日本一の大天狗」と呼ばれた院は、晩年まで今様を愛し続けた。承安4年（1174）ごろには御所で15夜にわたる今様合という歌合わせを開き、この時期が今様の頂点とされる。乙前の死の床には院が自ら訪ねて歌を贈ったと伝わる。

その集大成が『梁塵秘抄』である。歌詞集10巻と口伝集10巻の20巻からなり、成立は1169年または1179年とされる。戦乱で大部分を失ったが、残った部分だけで約570首を数える。仏教への祈り、恋、風刺、子どもの遊び歌まで、身分を問わない題材が並ぶ。最高権力者が民衆の歌を自ら集めた例はほかになく、日本の歌謡史を変えた出来事だった。

しかし、後白河院の死とともに今様は急速に廃れ、鎌倉時代には宴曲など別の歌謡が主流になる。節は生きた伝承としてほぼ失われた。源頼朝の前で舞った静御前のように、白拍子の舞とともに語られる場面は戦乱の世に残ったが、歌そのものは絶えた。越天楽の旋律に今様の詞を乗せた越天楽今様だけは雅楽の家に残り、福岡地方の民謡にも伝わった。現代では、残された楽譜と歌詞をもとに復曲が試みられ、日本今様謌舞楽会による復元上演や、梁塵秘抄を題材にした合唱曲・吹奏楽曲の創作が続いている。</p>
<h2>代表曲</h2><ul><li>黒田節 (三橋美智也)</li><li>遊びをせんとや生まれけむ (梁塵秘抄)</li><li>仏は常にいませども (梁塵秘抄)</li><li>熊野へ参るには (梁塵秘抄)</li><li>君が愛せし綾藺笠 (桃山晴衣)</li><li>今様 (日本今様謌舞楽会)</li><li>梁塵今様 (川崎絵都夫)</li><li>瑠璃の浄土は潔し (桃山晴衣)</li><li>わが子は十余になりぬらん (桃山晴衣)</li><li>百日百夜はひとり寝と (桃山晴衣)</li><li>われを頼めて来ぬ男 (桃山晴衣)</li><li>楠葉の御牧の土器造り (桃山晴衣)</li><li>南宮の宮には (桃山晴衣)</li><li>われは何して老いぬらん (土取利行)</li><li>そよや、小柳によな (桃山晴衣)</li><li>熊野へ参らんと (桃山晴衣)</li><li>不動明王恐ろしや (土取利行)</li><li>讃岐の松山に (土取利行)</li><li>夜叉姫 (桃山晴衣)</li><li>うたえやうたえ (後藤幸浩)</li><li>めぐりあい (千原英喜)</li><li>筑前今様 (桃山晴衣)</li></ul>
