<h1>Folk（フォーク）とは</h1>
<p>口伝えで受け継がれてきた民衆の歌、およびその形式を意識的に用いて書かれた歌の総称。編成は簡素で、アコースティック・ギター1本と歌、あるいはそこにハーモニカ、バンジョー、フィドル、マンドリンが加わる程度。増幅を用いない生の音が基本で</p>
<p>口伝えで受け継がれてきた民衆の歌、およびその形式を意識的に用いて書かれた歌の総称。編成は簡素で、アコースティック・ギター1本と歌、あるいはそこにハーモニカ、バンジョー、フィドル、マンドリンが加わる程度。増幅を用いない生の音が基本で、演奏者と聴き手の距離が近いことが前提となる。BPMは中庸、拍子は4分の4または4分の3で、ギターは弦をかき鳴らすストラム奏法か、親指で低音を刻みながら他の指で旋律を弾くフィンガーピッキングを用いる。和声（コードの響き）は三和音（基本の3音の和音）を中心とする単純なもので、旋法（音の並び方の型）的な進行、とりわけドリア旋法やミクソリディア旋法が古い歌に多く残る。旋律は覚えやすく、繰り返しの構造を持ち、しばしば聴き手が一緒に歌えるように作られている。歌唱は技巧を誇示せず、言葉が明瞭に届くことを最優先する。歌詞こそが中心で、労働、貧困、戦争、移民、恋、そして権力への抵抗が、具体的な人名や地名を伴って語られる。物語歌、いわゆるバラッドの形式では、何十番にも及ぶ節で一つの事件が語り継がれる。誰の作品でもない共有財産であるという意識が、この音楽の根底にある。</p>
<h2>成り立ち</h2><p>歌そのものは記録の残らない時代から存在するが、これを収集し研究する営みは18世紀に始まり、19世紀に体系化された。米国の学者Francis James Childは1882年から、イングランドとスコットランドのバラッド305編を編纂した（1896年にChildが亡くなったあとは弟子のKittredgeが引き継ぎ、1898年に完結させた）。これらはチャイルド・バラッドと呼ばれて現在も参照される。20世紀に入ると、米国のJohn LomaxとAlan Lomax父子が議会図書館の事業として、南部の農村、刑務所、教会を回り、録音機を担いで数千曲を記録した。彼らが1933年にルイジアナの刑務所で見出したHuddie Ledbetter、通称Lead Bellyは、この事業が生んだ最も有名な歌手である。1930年代の大恐慌期には、Woody Guthrieがオクラホマの砂嵐で土地を追われた人々とともに旅をし、1940年に書いたThis Land Is Your Landをはじめとする歌で、政治的な主張と民衆の歌を結び付けた。1943年ごろから、彼のギターにはこの機械はファシストを殺すと書かれていた。1940年代から1950年代、Pete Seegerらが労働運動と結び付いた歌の運動を進めたが、冷戦下の赤狩りにより放送から締め出され、Seegerは下院非米活動委員会での証言拒否により、1961年に議会侮辱罪で有罪判決を受けたが、1962年に控訴審が起訴状の不備を理由にこの判決を破棄している。1940年代に始まったフォーク・リヴァイヴァル（民謡の復興運動）は、1960年代前半にニューヨークのグリニッチ・ヴィレッジを中心に盛り上がり、Bob Dylan、Joan Baez、Phil Ochsらが公民権運動とベトナム反戦運動の音楽的な声となった。1963年のワシントン大行進では、Joan BaezがWe Shall Overcomeを歌っている。1965年、Bob Dylanがニューポート・フォーク・フェスティバルで電気楽器を用いた際に聴衆からブーイングがあった事件（原因は電気楽器への反発、音響の不具合、持ち時間の短さなど説が分かれる）は、伝統への忠誠と表現の自由をめぐる緊張を象徴する出来事として語り継がれている。</p>
