<h1>Euro Trance（ユーロトランス）とは</h1>
<p>ユーロトランスは、トランスの組み立てを、大衆向けのポップスとして通用する形に整えた種類の音楽だ。 骨格は、四つ打ちのキックとオフビート・ベース。ここはトランス一般と共通している。決定的に違うのは、メロディーの扱いだ。 中心に置かれ</p>
<p>ユーロトランスは、トランスの組み立てを、大衆向けのポップスとして通用する形に整えた種類の音楽だ。

骨格は、四つ打ちのキックとオフビート・ベース。ここはトランス一般と共通している。決定的に違うのは、メロディーの扱いだ。

中心に置かれるのは、覚えやすく歌える主なメロディーである。しばしば、一度聴けば口ずさめるほど単純に作られる。このメロディーは、シンセのリードで鳴らされるか、女性歌手が歌う。

音色は、スーパーソウ波形を重ねた厚いリード、ゲート処理をかけた刻むパッド、そして明るいピアノの和音だ。和音は自然短音階のくり返しが多く、しばしば長調へ抜けて開放感を出す。

ヴォーカル入りの曲は、はっきりした歌ものの構成をとる。ヴァース／コーラス（日本でいうAメロ・サビ）を軸にしたポップソング構成に、トランスのブレイクダウンと復帰が組み込まれる。

ブレイクダウンではほぼ全ての打楽器が抜け、ピアノかパッドと歌だけになる。そこから、ライザーとスネアの連打で元の流れに戻る。

歌詞は、愛、別れ、飛翔、夜といった、抽象的で感情のこもった主題を扱う。

多くの曲は短くまとめられ、ラジオでの放送とシングル盤としての流通を前提としている。

プログレッシブ・トランスやサイケデリック・トランスとは、はっきり区別される。深さや実験性よりも、すぐに伝わる感動と分かりやすさを優先しているからだ。</p>
<h2>成り立ち</h2><p>ユーロトランスは、1990年代後半に、ハードトランスとユーロダンスの融合として広まった。ただし、定義には諸説ある。

土台になったのは、1990年代前半のヨーロッパですでに定着していた、ユーロダンスの市場である。ドイツのSnap!やCulture Beatといったグループが、四つ打ちに女性の歌と男性のラップを乗せる形で、チャートを席巻した。Real McCoyは、1994年前後に米国経由で国際的な成功を収めた。レコード会社には、ダンス音楽をポップスとして売る仕組みが整っていた。そこへ、トランスの語彙が流れ込んだ。

大衆化のきっかけとなった作品としては、Robert Milesの「Children」が挙がる。1995年に発表され、1996年にヨーロッパで大ヒットした曲だ。イタリアの制作者による、ピアノの旋律を軸にした器楽曲で、12か国以上で1位を獲得し、全英では最高2位だった。この曲は、ユーロトランスとは別系統のドリーム・トランスに分類される。それでも、ピアノ主体の器楽曲がトランス／ダンス系として大衆的に売れた先例となった。

1998年10月には、ATBの「9 PM (Till I Come)」が発売された。ピッチベンドをかけたギター系シンセ音色のリードを持つ曲で、1999年に全英1位を獲得した。トランス曲としては初とされる。ATBの前後には、Sash!、Blank &amp; Jones、Fragma、Alice Deejayらも登場した。

オランダでは、Tiësto、Ferry Corsten、Armin van Buurenが登場した。とりわけTiëstoは、2003年にスタジアムで2万5千人超を集める単独公演を行った。2004年には、アテネ五輪の開会式でDJとして演奏するに至った。

ドイツでは、Paul van Dykが「For an Angel」などのクラブ・ヒットを出した。この曲の1998年版は、全英ダンス・チャートで1位になった。Kontor RecordsやZeitgeistといったレーベルが、市場を支えたとされる。

人気の頂点は、1998年末から2000年頃とされる。1999年前後には、ドイツや英国などのチャート上位に、トランス系の曲が複数入った。イギリスでは、GatecrasherやGodskitchenといったクラブが人気を集めた。クラブの定員は1,000〜2,000人規模だったが、特設会場や野外のイベントでは2万人超を集めた。派手な装いの客層とともに、社会現象になったとも言われる。

しかし、商業的な成功は激しい反発も招いた。テクノやハウスの側からは、感傷的で型どおり、大量生産の産物だとして軽蔑された。商業化したトランスは、のちにアンダーグラウンド側から軽んじられた。実際に、同じコード進行と構成を持つ商業トランスが、2000年代初頭に量産された。そして2003年前後から停滞した。2004〜05年には、商業・ボーカルトランスの露出が減った。

それでも、完全には消えなかった。東欧やロシア、そしてハンズアップやハードダンスといった派生の中で生き残ったとされる。2010年前後には、EDMが盛り上がった。その中で、ハードトランス以来のブレイクダウン→ビルドの型が、のちのトランス各派やEDMに影響した。

近年は、1990年代後半のトランスを懐かしむ層と、当時を知らない若い世代の両方から、再評価が進んでいる。</p>
