<h1>Euro Trance（ユーロトランス）とは</h1>
<p>トランスの構造を、大衆的なポップスとして通用する形に整理した系統。テンポは138〜145BPM。四つ打ちのキックとオフビート・ベースという骨格はトランス一般と共通するが、旋律の扱いが決定的に異なる。ここでは覚えやすく歌える主旋律が</p>
<p>トランスの構造を、大衆的なポップスとして通用する形に整理した系統。テンポは138〜145BPM。四つ打ちのキックとオフビート・ベースという骨格はトランス一般と共通するが、旋律の扱いが決定的に異なる。ここでは覚えやすく歌える主旋律が中心に置かれ、しばしば一度聴けば口ずさめる単純さで設計される。この旋律はシンセのリードで提示されるか、女性歌手が歌う。ヴォーカル入りの場合は明確な歌もの構成をとり、Aメロ、サビ、間奏という歌謡曲的な形式に、トランスのブレイクダウンと復帰が組み込まれる。和声は自然短音階の4コード循環が圧倒的に多く、しばしば長調へ抜けて開放感を出す。音色はスーパーソウ波形を重ねた厚いリード、ゲート処理をかけた刻むパッド、そして明るいピアノの和音。ブレイクダウンでは全ての打楽器が抜け、ピアノかパッドと歌だけになり、そこからライザーとスネアの連打で復帰する。曲は3分半から4分程度に短く整理され、ラジオでの放送とシングル盤としての流通を前提とする。歌詞は愛、別れ、飛翔、夜といった抽象的で感情的な主題を扱う。プログレッシブ・トランスやサイケデリック・トランスと比べて、深さや実験性より即効的な感動と分かりやすさが優先されている点で明確に区別される。</p>
<h2>成り立ち</h2><p>1990年代半ばのドイツとオランダを中心に、トランスの商業化として成立した。土壌となったのは、1990年代前半のヨーロッパで既に確立していたユーロダンスの市場である。ドイツのSnapやCulture Beat、Real McCoyといったグループが、四つ打ちに女性の歌と男性のラップを乗せる形式でチャートを席巻しており、レコード会社にはダンス音楽をポップスとして売る仕組みが整っていた。ここへトランスの語彙が流入した。転機となった作品としてはRobert Milesの1996年「Children」が挙がる。イタリアの制作者による、ピアノの旋律を軸にした器楽曲で、ヨーロッパ全域で1位を獲得した。この曲はドリーム・トランスと呼ばれ、トランスが大衆の耳に届くことを証明した。同時期にATBの1998年「9 PM (Till I Come)」がギターを加工した音色で全英1位を獲得し、Sash!、Blank &amp; Jones、Fragma、Alice Deejayが続いた。オランダではTiesto、Ferry Corsten、Armin van Buurenが登場し、とりわけTiestoは2001年前後から大規模な単独公演を行い、2004年のアテネ五輪開会式でDJとして演奏するに至った。ドイツではPaul van Dykが「For an Angel」などで大衆的成功を収め、Kontor RecordsやZeitgeistといったレーベルが市場を支えた。1999年から2002年がこの系統の頂点で、ヨーロッパ各国のヒットチャートの上位を恒常的に占めた。イギリスではGatecrasherやGodskitchenといったクラブが数千人規模の集客を行い、派手な装いの客層とともに社会現象になった。しかし商業的成功は激しい反発も招いた。テクノやハウスの側からは、感傷的で定型的、大量生産の産物であるとして軽蔑され、euro tranceという語自体が侮蔑的に用いられることも多かった。実際に、同じコード進行と構成を持つ楽曲が大量に流通し、市場は2003年頃に飽和する。2004年以降は急速に退潮し、多くのレーベルが撤退した。ただし完全には消えず、東欧やロシア、そしてハンズアップやハードダンスといった派生の中で存続した。2010年前後のEDMの隆盛では、このジャンルが確立したブレイクダウンと復帰の構造がそのまま再利用され、Aviciiらの世界的成功の土台になった。近年は1990年代後半のトランスを懐かしむ層と、当時を知らない若い世代の双方から再評価が進んでいる。</p>
