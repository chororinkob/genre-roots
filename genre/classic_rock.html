<h1>Classic Rock（クラシックロック）とは</h1>
<p>クラシック・ロックは、米国ではおおむね1960年代前半〜1990年代半ばのロックのうち、その後も何度も放送され、演奏され続けている作品群を指す呼び名だ。 単一のスタイルではない。ハードロック、ブルースロック、プログレッシブ・ロック</p>
<p>クラシック・ロックは、米国ではおおむね1960年代前半〜1990年代半ばのロックのうち、その後も何度も放送され、演奏され続けている作品群を指す呼び名だ。

単一のスタイルではない。ハードロック、ブルースロック、プログレッシブ・ロック、サザンロック、フォークロックまでを幅広く含む。ただし、多くの作品に見られる傾向がいくつかある。

編成は、エレクトリックギター、ベース、ドラムに、Hammond B-3のようなオルガンやピアノを加えたものだ。多くの作品で、オルガンはLeslieスピーカーという回転する筒を通して鳴らすため、独特のうねりを伴う。多くの作品で、ギターは真空管アンプを歪ませた、ブルース由来の音色だ。マイナー・ペンタトニックを軸にして、チョーキングを多用する。

テンポは4/4拍子が中心で、シャッフルの跳ねたリズムも頻繁に現れる。曲は3分台のシングル向けのものから、8分を超えて長い間奏を持つものまである。後者は、アルバムという単位を前提として作られている。

歌は、複数の声を重ねたハーモニーを効かせる。歌詞は恋愛のほか、放浪、社会への疑問、幻覚体験、神話的な物語まで扱う。

多くの作品で、録音はアナログのテープに行われ、テープの飽和による自然な圧縮が、全体を温かくまとめている。大会場での演奏を前提とした音の大きさと、レコードを通して聴かれる細やかさの両方を備えている点が、特徴といえる。</p>
<h2>成り立ち</h2><p>この呼び名は、音楽家が名乗ったものではない。アメリカのラジオ産業が作った、商売のための区分である。

1960年代後半、AM放送は短いヒット曲を回していた。一方、音質に優れたFM放送では、DJが自分の判断でアルバムを丸ごとかける、自由な編成が広まった。ニューヨークのWNEW-FMやクリーヴランドのWMMSがその代表である。シングルではなくアルバムを単位とする聴き方が定着し、アルバム志向のロックという編成方針が生まれた。

1969年のウッドストック・フェスティバルは、推計で約40万〜50万人（資料により異なる）を集めて世代のトレードマークとなった。しかし同年末のオルタモント・フリーコンサートでは、警備にあたっていたヘルズ・エンジェルスの一員が観客を刺殺した。この一員は、1971年の裁判で正当防衛が認められて無罪になった。反体制文化の理想が崩れる場面も刻まれたのである。

1970年代に入ると、Led Zeppelin、Pink Floyd、The Rolling Stones、The Who、Queen、Eagles、Fleetwood Mac、Aerosmithらが巨大な会場を満たすようになった。レコード産業は大きく膨らんだ。

転機は1980年代前半だ。AOR局が新曲志向を強め、MTVの影響でロックの定義も変わりつつあったことで、年長になった世代の聴き手が取り残された。この層を狙って、1980年代前半から中盤にかけて、複数の局やコンサルタントが動いた。現行のAORに過去のヒットを混ぜる形から出発し、1980年代半ばにFred Jacobsらが、過去の曲を中心にした形式へ作り替えた。そして、クラシック・ロックという名称で商品化した。

1980年には、クリーヴランドのM105が「Cleveland's Classic Rock」を名乗った。1982年にはLee Abramsが「Timeless Rock」を開発した。Fred Jacobsは、1985年にWMMQで形式を展開した人物で、クラシック・ロック形式の創始者の一人とされる。この形式は、1980年代半ば以降、急速に広まった。

その一方で、クラシック・ロックの選曲は白人男性のバンドに偏っているとの指摘が、Strongらの研究やChristgauの批評などで出ている。

1990年代以降は、CDの再発、記念公演、伝記映画によって、この区分はさらに強固になったと指摘される。当初は放送の便宜だった言葉が、いつのまにか「お手本」を意味する言葉として扱われるようになっている。</p>
