<h1>Classic Rock（クラシックロック）とは</h1>
<p>1960年代半ばから1970年代にかけて作られたロックのうち、その後も繰り返し放送され演奏され続けている作品群を指す呼び名である。単一の様式ではなく、ハードロック、ブルースロック、プログレッシブ・ロック、サザンロック、フォークロッ</p>
<p>1960年代半ばから1970年代にかけて作られたロックのうち、その後も繰り返し放送され演奏され続けている作品群を指す呼び名である。単一の様式ではなく、ハードロック、ブルースロック、プログレッシブ・ロック、サザンロック、フォークロックまでを幅広く含むが、共通する要素はいくつかある。編成はエレクトリックギター、ベース、ドラムに、Hammond B-3のようなオルガンやピアノを加えたもので、オルガンはLeslieスピーカーという回転する筒を通して鳴らすため、独特のうねりを伴う。ギターは真空管アンプを歪ませたブルース由来の音色で、マイナー・ペンタトニックを軸にチョーキングを多用する。テンポは70から140 BPMの4/4拍子が中心で、シャッフルの跳ねたリズムも頻繁に現れる。曲は3分台のシングル向けのものから、8分を超えて長い間奏を持つものまであり、後者はアルバムという単位を前提として作られている。歌は複数の声を重ねたハーモニーを効かせ、歌詞は恋愛のほか、放浪、社会への疑問、幻覚体験、神話的な物語まで扱う。録音はアナログのテープに行われ、テープの飽和による自然な圧縮が全体を温かくまとめている。大会場での演奏を前提とした音の大きさと、レコードを通して聴かれる細やかさの両方を備えている点が特徴といえる。</p>
<h2>成り立ち</h2><p>この呼び名は音楽家が名乗ったものではなく、アメリカのラジオ産業が作った商業的な区分である。1960年代後半、AM放送が短いヒット曲を回す一方で、音質に優れたFM放送では、DJが自分の判断でアルバムを丸ごとかける自由な編成が広まった。ニューヨークのWNEW-FMやクリーヴランドのWMMSがその代表で、シングルではなくアルバムを単位とする聴き方が定着し、アルバム志向のロックという編成方針が生まれる。1969年のウッドストック・フェスティバルは40万人を集めて世代の象徴となったが、同年末のオルタモント・フリーコンサートでは警備を任された暴走族が観客を刺殺し、対抗文化の理想が崩れる場面も刻まれた。1970年代に入るとLed Zeppelin、Pink Floyd、The Rolling Stones、The Who、Queen、Eagles、Fleetwood Mac、Aerosmithらが巨大な会場を満たすようになり、レコード産業は史上最大の規模へ膨らむ。転機は1980年代前半で、当時の若者向けの新譜がニューウェイヴやシンセポップへ移ったことにより、既に30代となっていた世代の聴き手が取り残された。この層を狙って、1983年頃にアメリカのラジオ・コンサルタントであるFred Jacobsらが、1960年代から1970年代のロックだけをかける編成を設計し、クラシック・ロックという名称で商品化した。この形式は全米で爆発的に普及し、同じ数百曲を何十年も回し続ける構造を作った。結果として、そこに含まれなかった音楽、とりわけ女性や黒人の演奏者による作品が体系的に排除され、ロックの歴史が白人男性のギターバンド中心に描かれる原因になったという批判が現在では強い。1990年代以降はCDの再発、記念公演、伝記映画によってこの区分はさらに強固になり、当初は放送の便宜だった言葉が、いつのまにか正典を意味する言葉として扱われるようになっている。</p>
<h2>代表曲</h2><ul><li>Comfortably Numb (Pink Floyd)</li><li>Layla (Derek and the Dominos)</li><li>Baba O'Riley (The Who)</li><li>Roxanne (The Police)</li><li>Go Your Own Way (Fleetwood Mac)</li></ul>
