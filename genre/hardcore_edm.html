<h1>Hardcore EDMとは</h1>
<p>「Hardcore EDM」は通称にすぎず、ハードコアの表現を、大型フェスティバルで通用する形に整え直した系統を指す。 中心にあるのは、歪ませたキックである。ただし、ここでのキックは単なる攻撃の音ではない。音の高さを持つ楽器として</p>
<p>「Hardcore EDM」は通称にすぎず、ハードコアの表現を、大型フェスティバルで通用する形に整え直した系統を指す。

中心にあるのは、歪ませたキックである。ただし、ここでのキックは単なる攻撃の音ではない。音の高さを持つ楽器として作られる。キックは、歪み、イコライジング、レイヤリングなどでピッチを持たせる。その結果、ベースとキックの役目が一つの音にまとまり、ほかの楽器のための帯域が大きく空く。

空いた帯域には、ハードトランス／トランス系の旋律の影響を受けた、壮大なメロディーと和音が置かれる。ここがこの系統の大きな特徴とされる。暴力的なキックと感傷的な旋律の同居が、体験の中心になる。上物には、スーパーソウ波形のリードや、加工した叫び声が使われる。

テンポは約160〜180BPMだ。ハードコア全般は160〜200BPM以上である。

ブレイクダウンでは、多くの場合、打楽器を完全に止める。ピアノや弦楽器風のパッド、そして女性ヴォーカルが感情を積み上げていく。そこからライザーとスネアの加速を経て、キックが戻ってくる。この組み立てはEDM全般と共通する。ただ、戻った後の音圧が大きい傾向がある点で分かれる。

曲は多くの場合4分から5分にまとめられ、フェスティバルでの演奏を前提とする。

ハードスタイルとは隣り合う関係にあるが、こちらの方がテンポが速い。両者はかなり近く、BPM以外で区別しにくい場合もある。伝統的なガバやハードコアと比べると、制作の技術が洗練され、感情表現の比重が大きい。</p>
<h2>成り立ち</h2><p>この系統は、2000年代前半のオランダで、1990年代のガバの衰退を経て立て直されたことから始まる。

1990年代末、ガバはオランダで社会問題として扱われるようになっていた。否定的な報道が続き、フーリガン行為、薬物、人種差別的な暴力事件に注目が集まった。そこに商業的な過剰露出とパロディが重なり、シーンは崩壊して、アンダーグラウンドに戻った。極右と結びついたのは、一部の少数派だった。

この状況から抜け出すため、2000年前後に音の作り直しが図られた。技術的な転機は、キックの作り方の変化にあった。1990年代のガバのキックは、TR-909などのキックをミキサー等で歪ませたものだった。そこから、歪み、イコライジング、レイヤリングなどでキックにピッチを持たせる手法が使われるようになった。ハードスタイルのキック技法(ピッチ付きキック)の一部も、ハードコアに取り入れられた。

主な現場となったのは、オランダのMasters of HardcoreとThunderdome(1992年開始)だ。前者は1995年に設立され、同年(1995年7月1日)に初回イベントを開いた。1998年には、レーベルが独立してパーティーの主催を再開している。

再編を担ったのは、Neophyte Records(1999年設立)、Evil Activities(1998年結成)、DJ PromoのThe Third Movement(2000年夏設立)などだ。1990年代から活動するNeophyteやThe Outside Agencyも、その流れに加わった。Angerfist(1981年生まれ)は、2010年代に国際的に注目を集めた代表例である。

イタリアではArt of Fightersが活動し、ローマ出身でオランダ在住のDJ Mad Dogらも加わった。テンポはむしろ抑えめ（160〜180）になり、制作の洗練が進んだ。

メインストリーム・ハードコアと呼ばれる流れは、2000年代初頭に現れた。引っ張ったのは、DJ PromoとレーベルThe Third Movementだ。より旋律的で聴きやすい方向が主流になっていく。Defqon.1という大型野外音楽祭も2003年に始まり、2000年代に2.5万〜3.5万人規模へ成長した。現在はハードコア向けのステージがある。

一方で、批判もある。旋律を重視する方向は、古参からは軟弱化として非難された、とされる。暴力性が失われた、という議論もある。

2015年ごろ、人気はメインストリーム・ハードコアから、より速くて激しいスタイルへ移った。以前から存在したアップテンポや、フレンチコア(1990年代中頃のフランスのレイヴやフリーテクノに由来する)といったスタイルである。

なお、オランダでは政府が認可した薬物の検査サービスが全国規模で提供されている(このジャンル専用の制度ではない)。</p>
