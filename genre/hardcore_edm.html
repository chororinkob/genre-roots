<h1>Hardcore EDMとは</h1>
<p>ハードコアの表現を、大型フェスティバルで通用する形に整え直した系統。テンポは約160〜180BPM(ハードコア全般は160〜200BPM以上)。中核は歪ませたキックだが、ここでは単なる攻撃音ではなく、音の高さを持つ楽器として作られ</p>
<p>ハードコアの表現を、大型フェスティバルで通用する形に整え直した系統。テンポは約160〜180BPM(ハードコア全般は160〜200BPM以上)。中核は歪ませたキックだが、ここでは単なる攻撃音ではなく、音の高さを持つ楽器として作られる。キックは低域の胴鳴りと、中域の歪んだ倍音、そして高域のクリック音という三つの層に分けて作られ、これらを別々に調整して積み上げる。この結果、ベースとキックの機能が一つの音に統合され、他の楽器のための帯域が大きく空く。空いた帯域には、トランス由来の壮大なメロディーと和音が置かれる。ここがこの系統の最大の特徴で、暴力的なキックと感傷的な旋律の同居が体験の中心になる。ブレイクダウンでは打楽器を完全に止め、ピアノや弦楽器風のパッド、そして女性ヴォーカルが感情を蓄積し、そこからライザーとスネアの加速を経てキックが戻る。この構造はEDM全般と共通するが、復帰後の音圧が桁違いに大きい点で分かれる。上物にはスーパーソウ波形のリードや、加工した叫び声が使われる。曲は4分から5分に整理され、フェスティバルでの演奏を前提とする。ハードスタイルと隣接するが、こちらの方がテンポが速く、キックの歪みが強い。伝統的なガバやハードコアと比べると、制作技術が洗練され、感情表現の比重が大きい。</p>
<h2>成り立ち</h2><p>2000年代前半のオランダで、1990年代のガバの衰退を経て立て直されたことから始まる。1990年代末、ガバはオランダで社会問題として扱われるようになっていた。丸刈りの頭と特定の運動着という服装が極右の暴力集団と結びつけて報道され、実際に一部で暴力事件も起きた。この結果、ガバの語には否定的な含みが強く定着し、シーンは大幅に縮小した。この状況から抜け出すため、2000年前後に音の作り直しが図られる。技術的な転機は、キックの作り方の変化にあった。1990年代のガバのキックは既存のドラム音をディストーションで歪ませたものだったが、2000年前後から、低域と中域を別々に合成して重ねる手法が確立し、音程を持ちながら強い攻撃性を保つキックが作れるようになった。この技術がハードスタイルとハードコアの双方を刷新した。オランダのMasters of Hardcore(レーベルは1995年設立、イベントは1998年から)とThunderdome(1992年開始)が主要な現場となり、Neophyte Records(1999年設立)、Evil Activities(1998年結成)、Angerfist(1981年生まれ)といった作家が再編を担い、1990年代から活動するNeophyteやThe Outside Agencyもその流れに加わった。イタリアではArt of Fightersが、ローマ出身でオランダ在住のDJ Mad Dogらも加わり、テンポと制作の質が同時に上がっていった。メインストリーム・ハードコアと呼ばれる流れは2000年代初頭に現れ(DJ PromoとレーベルThe Third Movementが牽引した)、より旋律的で聴きやすい方向が主流になる。この時期にDefqon.1という大型野外音楽祭(2003年開始)が数万人規模へ成長し、ハードスタイルとハードコアが同じ会場の別の舞台で並行して鳴らされる形式が定着した。批判もある。旋律を重視する方向は、古参からは軟弱化として非難され、ハードコアの本質である暴力性が失われたという議論が繰り返された。この対立は現在も続いており、以前から存在したアップテンポやフレンチコア(1990年代中頃のフランスのレイヴやフリーテクノに由来する)といった速いスタイルが、2015年頃に前面に出て支持を集めている。なお、オランダでは政府が認可した薬物の検査サービスが全国規模で提供されている(このジャンル専用の制度ではない)。</p>
