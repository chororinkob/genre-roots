<h1>Hardcore EDMとは</h1>
<p>ハードコアの語彙を、大型フェスティバルで通用する形に整理し直した系統。テンポは150〜180BPM。中核は歪ませたキックだが、ここでは単なる攻撃音ではなく、音程を持つ楽器として設計される。キックは低域の胴鳴りと、中域の歪んだ倍音、</p>
<p>ハードコアの語彙を、大型フェスティバルで通用する形に整理し直した系統。テンポは150〜180BPM。中核は歪ませたキックだが、ここでは単なる攻撃音ではなく、音程を持つ楽器として設計される。キックは低域の胴鳴りと、中域の歪んだ倍音、そして高域のクリック音という三つの層に分解して作られ、これらを別々に調整して積み上げる。この結果、ベースとキックの機能が一つの音に統合され、他の楽器のための帯域が大きく空く。空いた帯域には、トランス由来の壮大な旋律と和声が置かれる。ここがこの系統の最大の特徴で、暴力的なキックと感傷的な旋律の同居が体験の核心になる。ブレイクダウンでは打楽器を完全に止め、ピアノや弦楽器風のパッド、そして女性ヴォーカルが感情を蓄積し、そこからライザーとスネアの加速を経てキックが戻る。この構造はEDM全般と共通するが、復帰後の音圧が桁違いに大きい点で分かれる。上物にはスーパーソウ波形のリードや、加工した叫び声が使われる。曲は4分から5分に整理され、フェスティバルでの演奏を前提とする。ハードスタイルと隣接するが、こちらの方がテンポが速く、キックの歪みが強い。伝統的なガバやハードコアと比べると、制作技術が洗練され、感情表現の比重が大きい。</p>
<h2>成り立ち</h2><p>2000年代前半のオランダで、1990年代のガバの衰退を経て再編されたことから始まる。1990年代末、ガバはオランダで社会問題として扱われるようになっていた。丸刈りの頭と特定の運動着という服装が極右の暴力集団と結びつけて報道され、実際に一部で暴力事件も起きた。この結果、ガバの語には否定的な含みが強く定着し、シーンは大幅に縮小した。この状況から抜け出すため、2000年前後に音の刷新が図られる。技術的な転機は、キックの作り方の変化にあった。1990年代のガバのキックは既存のドラム音をディストーションで歪ませたものだったが、2000年前後から、低域と中域を別々に合成して重ねる手法が確立し、音程を持ちながら強い攻撃性を保つキックが作れるようになった。この技術がハードスタイルとハードコアの双方を刷新した。オランダのMasters of Hardcore(1995年開始のイベントおよびレーベル)とThunderdome(1992年開始)が主要な現場となり、Angerfist、Evil Activities、Neophyte、The Outsideといった作家が新しい世代を代表した。イタリアではArt of Fightersが、ドイツではDJ Mad Dogらが加わり、テンポと制作の質が同時に上がっていった。2010年前後にはメインストリーム・ハードコアという呼称が定着し、より旋律的で聴きやすい方向が主流になる。この時期にDefqonという大型野外音楽祭(2003年開始)が数万人規模へ成長し、ハードスタイルとハードコアが同じ会場の別の舞台で並行して鳴らされる形式が定着した。批判もある。旋律を重視する方向は、古参からは軟弱化として非難され、ハードコアの本質である暴力性が失われたという議論が繰り返された。この対立は現在も続いており、より原理主義的なアップテンポやフレンチコアといった派生が、その反動として支持を集めている。もう一つの問題は薬物で、この分野のイベントでは強力な合成薬物の使用が常態化しており、オランダ政府による検査サービスの提供という独特の公衆衛生政策が採られている。2020年代には、この系統が確立したキックの合成技術が、テクノやハードダンス全般へ広く輸出され、ハードコアの語彙がクラブ音楽の主流にまで浸透している。</p>
