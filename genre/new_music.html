<h1>New Music（ニューミュージック）とは</h1>
<p>ニューミュージックは、シンガーソングライターによる日本語の楽曲を中心とするポピュラー音楽だ。代表曲50曲を動画で聴け、ルーツと影響のつながりを地図でたどれる。</p>
<p>ニューミュージックは、シンガーソングライターによる日本語の楽曲を中心とするポピュラー音楽だ。フォークの弾き語りから一歩進めて、ロックやポップスのバンド編成、ピアノ、ストリングスで丁寧に作り込んでいる。ただし定義は文献で揺れ、職業作家の提供曲やコーラス・グループも当時は含まれた。

担い手の中心はシンガーソングライターである。音を聴くとまず、生ギター1本の素朴さではなく、スタジオで細部まで磨かれた柔らかく広がりのある響きが耳に入る。

和声はフォークの3コード中心から大きく広がったとされる。Cmaj7のようなメジャーセブンス、9度や11度の音を足したテンション・コード、ベースの音だけを順に下げていく分数コード、最後のサビで半音や全音上げる転調など、洋楽ポップスの洗練された響きを取り入れる傾向があった。

メロディーは音域が広い。Aメロでは低く静かに語り、サビで一気に高く伸びる起伏の大きな作りが多い。

楽器は厚く重ねられる。アコースティックギターに加えて、エレキギター、エレキベース、ドラム、グランドピアノやフェンダー・ローズのようなエレクトリックピアノ、シンセサイザーが入る。さらに弦楽器や管楽器のアレンジが重ねられ、スタジオ・ミュージシャンによる精密な演奏が録音される。ピアノの弾き語りも目立つようになった。

リズムは4分の4拍子の8ビートが基本で、2拍目と4拍目にスネアのアクセントが来ることが多い。ゆったりしたバラードから、軽快なポップ・ロックまで幅がある。ボサノヴァやレゲエのリズムを取り入れた曲もある。

音響面では、ボーカルや楽器にリバーブやコーラスをかけた艶のある音作りをする。フォークの乾いた生音に比べて、空間の広がりが大きい。

歌い方は、声の質感そのものを生かすものが多い。透き通った女性の高音、ささやくような男性の柔らかい声、メンバーが重ねるハイトーンのハーモニーなどだ。こぶしのような歌謡曲的な節回しは控えめである。

歌詞は、それまでのフォークの政治的な主張や貧しい生活感から離れた。恋愛の情景や心の揺れ、都会や季節の風景を、映画のワンシーンのような細かい描写で描くことが多い。

構成はAメロ・Bメロ・サビと進む展開型が定着した。印象的なイントロ、間奏のギターソロやピアノのフレーズ、最後にサビを繰り返して盛り上げる作りが聴かせどころになる。

隣接するジャンルとの違いもある。職業作家が曲を書いて歌手が歌う歌謡曲に対して、シンガーソングライターによる楽曲を中心とし、シングル1曲よりアルバム単位で作品を作る点が大きい。

日本のフォークとは自作自演という点で同じだ。ただしサウンドがずっと洗練され、歌詞から思想性や生活感が薄れている。

シティ・ポップは、ニューミュージックの中でも特にアメリカのAORやソウルを意識した都会的な一群を、後から呼び分けた言葉と重なる部分が大きい。

芸能界の仕組みの中で売り出されたグループ・サウンズのバンドとは、作られ方と音の質感で区別される。後に日本の大衆音楽全般の呼称となったJ-POPとは、時代の呼称が異なる。

この音楽が鳴っていたのは、全国のホールを回るコンサートツアー、歌い手がパーソナリティを務める深夜ラジオ、ヤマハのポプコンのようなアマチュアのコンテストだ。テレビCMやドラマの主題歌、そして若者の部屋のステレオやカーステレオでも鳴っていた。</p>
<h2>成り立ち</h2><p>ニューミュージックは、1970年代から1980年代にかけて流行した日本のポピュラー音楽のジャンルだ。職業作家による分業ではなく、シンガーソングライターによる楽曲制作を主とするものとされる。ただし文献によって定義にずれがあり、言葉の由来もはっきりしない。

言葉の始まりについては、いくつもの説が並び立っている。キングレコード内にベルウッド・レコードを立ち上げたプロデューサーの三浦光紀が最初に使ったという説がある。CBS・ソニーのプロデューサー前田仁の上司が名付けたという説もある。ミュージカル・ステーションの金子洋明が中野サンプラザの開館イベントで開いた「ニューミュージック・シーン」がきっかけだという説、音楽評論家の富澤一誠や松任谷由実（ユーミン）が名付け親だという説、猫のアルバムの帯に記されたという説も挙がっている。

市販の書籍で確認できるものとしては、1973年1月に出た本の「ブロンズ社のニューミュージック選書」という記載がある。ここから、遅くとも1972年末までには使われ始めていたと推定されている。用語辞典『現代用語の基礎知識』に初めて載ったのは1977年版で、1976年ごろには一般にも知られる言葉になったと推定されている。

源流は日本のフォークである。始まりは1972年の吉田拓郎「結婚しようよ」のヒットに置かれることが多い。この曲はオリコンの週間3位（1972年の年間では14位）、同年のアルバム『元気です。』は年間2位となった。これをきっかけに、自作自演の歌い手のヒットが増えていったという見方がある。

翌1973年には南こうせつとかぐや姫の「神田川」がヒットし、同年11月には荒井由実が1stアルバム『ひこうき雲』を発表した。所属するアルファミュージックの社長・村井邦彦は、レコード会社から「フォークか、ロックか、アイドルか」と聞かれても、ひとことで説明できず即答しなかったと述べている。

富澤一誠は「1975年にユーミンが出現したころから、フォークという言葉が消え、ニューミュージックに受け継がれていった」と論じている。1975年は、小室等・吉田拓郎・井上陽水・泉谷しげるがフォーライフ・レコードを設立した年だ。「吉田拓郎・かぐや姫 コンサート インつま恋」が開かれた年でもあり、音楽評論家のスージー鈴木はこの年を「ニューミュージック元年」と名付けている。ただしフォークとの境目ははっきりせず、1975年前後はあくまで目安である。

ニューミュージックが社会的に認められたきっかけとして挙げられるのが、日本レコード大賞である。吉田拓郎が作曲し森進一が歌った「襟裳岬」と、小椋佳が書き布施明が歌った「シクラメンのかほり」が、1974年・1975年と2年続けて受けた。ここから、シンガーソングライターが歌謡曲の歌手に曲を書いたりプロデュースしたりすることが定着していった。

1976年にはアルバム売上に占めるニューミュージックの割合が四割近くに達し、歌謡曲を上回ったとされる。1978年は「ニューミュージックの年」といわれた。中島みゆき、アリス、渡辺真知子、松山千春、五輪真弓らに加え、Char・原田真二・世良公則&amp;ツイストの「ロック御三家」やサザンオールスターズもヒットを重ねた。この年のNHK紅白歌合戦には「ニューミュージック・コーナー」まで設けられた。

1979年の朝日新聞の記事では、この年のレコード・カセットの総売上の1位がアリス、上位に松山千春やさだまさしが並んだと報じられている。人気を支えたのは、テレビ出演を拒む歌い手が多かった中でパーソナリティを務めた深夜ラジオ、ヤマハが主催したポピュラーソングコンテスト（ポプコン）、そして1970年代半ばから増えたCMソングやドラマ主題歌とのタイアップだった。

一方で批判も多かった。1980年前後、タモリはラジオ番組『オールナイトニッポン』で、さだまさし、アリス、オフコース、松山千春を名指しして「ニューミュージックは暗い」「歌詞が軟弱」とけなした。この見方は世間にかなり浸透した。吉田拓郎も、今のニューミュージックの歌には主張がないと批判した。長渕剛は「ニューミュージックなんて呼ばれたくない」と語り、海援隊の武田鉄矢も自分たちはフォークだと主張した。「何が“ニュー”なのか」という揶揄も1982〜1983年ごろに盛んになった。

1980年前後にニューミュージックの主流がポップ・ロックの方向に移ったことで、呼び名が使われなくなっていったという見方がある。音楽ライターの濱口英樹は、BOØWYなどが活躍したバンドブームの1987年に、この呼び名が「フォーク&amp;ロック」に置き換えられたと論じている。そして1993年から1995年ごろにかけて、J-POPという言葉に取って代わられた。

近年は、当時のニューミュージックの一部が「シティ・ポップ」として世界的に再評価されている。ただし当時はシティ・ポップという呼び方はほとんど使われず、ニューミュージックという言葉が圧倒的に強かったとされる。</p>
