<h1>Deep Dubstep（ディープダブステップ）とは</h1>
<p>ダブステップの中でも、低音と余白を重んじる系統である。ブロステップのように、中音域の派手さや音圧を前面に出すことはしない。 主役は、30〜50Hz付近のサイン波（ほかの音が混ざらない、なめらかな波形）に近い、純度の高いサブベースだ</p>
<p>ダブステップの中でも、低音と余白を重んじる系統である。ブロステップのように、中音域の派手さや音圧を前面に出すことはしない。

主役は、30〜50Hz付近のサイン波（ほかの音が混ざらない、なめらかな波形）に近い、純度の高いサブベースだ。倍音をほとんど含まないため、耳ではメロディーとして捉えにくい。その代わり、胸や床から伝わってくる。

上に重なる音には、ダブ由来のスプリング・リバーブやテープ・エコーを深くかけたスタブ（短い和音の刺し）がある。ローパスフィルター（高い音を削る装置）で角を落としたパッドや、遠くで鳴るシンセの単音も使われる。音数を極端に少なくした例がある。

和声には、短調のシンプルな二和音や、東洋・中東を思わせる音階が選ばれる例がある。それが長い持続音の上を、ゆっくりと移ろう。

BPMは140前後だ。ハーフタイムの骨格は、ほかのダブステップと共通である。打楽器は、リムショット、シェイカー、木魚のような、乾いた小さな音の粒が中心になる例がある。スネアは3拍目に一発だけ置かれることが多い。

歌が入る場合、レゲエのMCが低い声で短い句を繰り返す例がある。

曲の組み立ては、ドロップで殴りかかるのではない。曲全体を通じて、一定の重さを保ち続ける。音圧で圧倒するブロステップとは正反対に、静けさと余白の中に低音を置き、巨大さを感じさせるのが狙いだ。大型のサウンドシステムを備えた暗いクラブで体験することを前提に作られている。</p>
<h2>成り立ち</h2><p>2000年代半ばのロンドンで、この系統は固まった。ダブステップが商業化と過激化に向かう前の初期の衝動を、保存し、発展させる形だった。

決定的な役割を果たしたのが、2005年に南ロンドンのブリクストンで始まったクラブイベント、DMZである。主催したのは、MalaとCokiのユニットDigital Mystikz、Loefah、そして司会のSgt Pokesだ。Malaが掲げた「Come Meditate on Bass Weight」という理念のもと、この催しは大音量でありながら瞑想的な体験を届ける場となった。

同じころ、Malaは2006年に自身のレーベルDeep Medi Musikを設立した。このレーベルは、Silkie、Quest、Goth-Trad（日本のTakeaki Maruyama）、Kromestarら、多様な作家を抱えた。その中から、深く瞑想的な音の発信源となった。

もう一つの柱が、ブリストルのPinch（Rob Ellis）が運営したTectonic Recordingsだ。彼は、ブリストルのサウンドシステム（巨大なスピーカーを積んだ移動式の音響設備）文化を背景に持つ。

理論的な土台は、ジャマイカのダブにある。とりわけ大きいのが「引き算のミックス」だ。King TubbyやLee Scratch Perry、Errol Thompsonら（Augustus Pablo、Clive Chin、Herman Chin Loyらも）が1960年代末から、Scientistらがその後1970年代半ば以降に発展させた手法である。音を足すのではなく、抜くことで空間を作る。その発想が、そのまま受け継がれている。

しかし2010年前後、英国で生まれ米国で大衆化したブロステップが、世界的に売れた。すると、ダブステップという語が、中音域を強調した音を指すものと受け取られることが増えた。一方で、原型の音は「140」と呼ばれることもある。

2010年代半ば以降は、レーベルのDeep MediやInnamind Recordings、日本のGoth-Trad周辺、さらにヨーロッパ各地の小規模なサウンドシステム・イベントが、活動を続けている。</p>
