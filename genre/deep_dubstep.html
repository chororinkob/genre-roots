<h1>Deep Dubstep（ディープダブステップ）とは</h1>
<p>ダブステップの中でも、攻撃性を排して低音の深さと空間の広さに集中した系統。BPMは138〜140前後、ハーフタイムの骨格は共通だが、ドロップで殴りかかるのではなく、曲全体を通じて一定の重さを保ち続ける構成を取る。主役は30〜50H</p>
<p>ダブステップの中でも、攻撃性を排して低音の深さと空間の広さに集中した系統。BPMは138〜140前後、ハーフタイムの骨格は共通だが、ドロップで殴りかかるのではなく、曲全体を通じて一定の重さを保ち続ける構成を取る。主役は30〜50Hz付近のサイン波に近い純度の高いサブベースで、倍音をほとんど含まないため耳では旋律として捉えづらく、胸や床から伝わってくる。上物にはダブ由来のスプリング・リバーブやテープ・エコーが深くかかったスタブ（短い和音の刺し）、ローパスフィルターで角を落としたパッド、遠くで鳴るシンセの単音などが使われ、音数は極端に少ない。打楽器はリムショット、シェイカー、木魚のような乾いた小音量の粒が中心で、スネアは3拍目に一発だけ置かれることが多い。和声は短調のシンプルな二和音や、東洋・中東を思わせる音階が選ばれ、長い持続音の上をゆっくり移ろう。歌が入る場合もレゲエのMCが低い声で短い句を繰り返す程度。音圧で圧倒するブロステップとは正反対に、静けさと余白の中に低音を置くことで巨大さを感じさせるのが狙いで、大型サウンドシステムを備えた暗いクラブでの体験を前提に作られている。</p>
<h2>成り立ち</h2><p>2000年代半ばのロンドンで、ダブステップが商業化と過激化に向かう前の初期衝動を保存し発展させる形で確立した。決定的な役割を果たしたのが、2005年に南ロンドンのブリクストンで始まったクラブイベントDMZである。MalaとCokiによるユニットDigital Mystikz、Loefah、司会のSgt Pokes が主催し、Mala が掲げた「Come Meditate on Bass Weight」という理念のもと、大音量でありながら瞑想的な体験を提供する場となった。同時期、Malaは自身のレーベルDeep Medi Musik を2006年に設立し、Silkie、Quest、Goth-Trad（日本の高地優吾）、Kryptic Minds らを擁して、この静的な美学の中心的な発信源となった。もう一つの柱がブリストルのPinch（Rob Ellis）が運営したTectonic Recordings で、彼は同市のダブとサウンドシステム文化の伝統をダブステップに直結させた。理論的な下敷きはジャマイカのダブ、とりわけKing TubbyやLee Scratch Perry が1970年代に確立した「引き算のミックス」であり、音を足すのではなく抜くことで空間を作る発想がそのまま受け継がれている。2010年前後、米国発のブロステップが世界的に売れると、ダブステップという語がほぼ歪んだ中音域の音を指すようになり、原型を支持する層は自らの音を「ディープ」「140」「ダブステップ本来の」と呼び分けて距離を置いた。この呼び分け自体がシーン内部の断絶を物語っている。2010年代半ば以降はレーベルDeep Medi、Tempa、Innamind Recordings、日本のGoth-Trad周辺、さらにヨーロッパ各地の小規模なサウンドシステム・イベントが受け皿となり、規模は小さいながら国際的なネットワークとして存続している。</p>
