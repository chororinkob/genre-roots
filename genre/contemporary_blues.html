<h1>Contemporary Blues（コンテンポラリーブルース）とは</h1>
<p>1970年代以降に整備された録音技術と演奏環境のもとで演奏される、現在進行形のブルースである。伝統的な12小節形式と一度・4度・5度の和音という骨格は保たれているが、そこに乗る音の作りが大きく異なる。ギターは歪みと持続音を前提とし</p>
<p>1970年代以降に整備された録音技術と演奏環境のもとで演奏される、現在進行形のブルースである。伝統的な12小節形式と一度・4度・5度の和音という骨格は保たれているが、そこに乗る音の作りが大きく異なる。ギターは歪みと持続音を前提とした機材で鳴らされ、長い音を伸ばしながら細かく揺らす奏法や、指板の広い範囲を使う速い音型が普通に使われる。これはロックのギター表現がブルースから派生したのち、逆流して本家に取り込まれた結果である。編成にはオルガンやホーン・セクションが加わることも多く、録音は各楽器を分離して重ね録りする作品も多く、音の分離と低音の量感が重視される。一方で『テキサス・フラッド』のように、バンドが輪になって生演奏に近い形で録った作品もある。歌唱は喉を締めて張り上げる古い型よりも、ソウルの影響を受けた滑らかな発声が主流になっている。曲の作りも定型一辺倒ではなく、明確なサビを持つポピュラー音楽の構成や、短調で通す曲、ファンクのリズムを敷いた曲などが混在する。演奏の場は小さな酒場から大規模な野外音楽祭まで広がり、それに合わせて音量設計や見せ方も大きく変わった。伝統の型を守るか更新するかという緊張が、この様式の内側に常にある。</p>
<h2>成り立ち</h2><p>1970年代までに、アメリカの黒人の若い聴衆はソウルやファンク、そして後のヒップホップへ移り、ブルースは同世代の音楽ではなくなっていった。一方で英国経由の再発見によって、白人のロック聴衆が主要な客層として残るという逆転が起きる。ただし1980年代以降には、ミシシッピ州ジャクソン周辺などで、黒人の聴衆によるブルースへの関心の再興(ソウル・ブルースやサザン・ソウル)もあった。担い手と聴き手の人種構成がずれたこの状態が、以後の議論の火種であり続けている。1971年にブルース・イグラウアーがシカゴで設立したアリゲーター・レコードは、独立系のデルマーク・レコードがHound Dog Taylor &amp; The House Rockersとの契約を見送ったため、イグラウアーが自費で録音して始めたレーベルで、この時期の受け皿として機能した。流れを変えたのは1983年、テキサス出身のスティーヴィー・レイ・ヴォーンが発表した『テキサス・フラッド』である。ロックの音圧でブルースを鳴らしたこの作品は、米国で200万枚を超えるダブル・プラチナを記録し、ブルース復興の象徴の一つとなった。彼は1990年にヘリコプターの墜落事故で35歳で死んでいる。1986年にはロバート・クレイの『ストロング・パースエイダー』がソウル寄りの洗練で新たな聴衆を開拓した。忘れられかけていたバディ・ガイも、1991年のアルバム『Damn Right, I've Got the Blues』で再評価されて第一線に戻った。一方でミシシッピ州北部では、1990年代にファット・ポッサム・レコードがR・L・バーンサイドやジュニア・キンブロウといった土着の演奏者を、あえて荒い音のまま録音して発表した。これらはパンクやオルタナティヴ・ロックの聴衆に届き、洗練とは逆方向の回路を開いた。2010年代以降は、ヒップホップの要素も取り込むゲイリー・クラーク・ジュニアや、2019年にデビュー作を出したクリストン・「キングフィッシュ」・イングラムら、若い黒人演奏者が現れている。同時に、この音楽が中年白人男性の趣味として固定化しているという内部批判も繰り返し提起されており、誰の音楽なのかという問いを抱えたまま現在に至っている。</p>
