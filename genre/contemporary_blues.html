<h1>Contemporary Blues（コンテンポラリーブルース）とは</h1>
<p>コンテンポラリー・ブルースは、1970年代以降に整った録音技術と演奏環境のもとで演奏される、今まさに続いているブルースだ。厳密に定義された流派ではなく、1980年代のブルース復興を一つの区切りとする。 伝統的な12小節の形と、一度</p>
<p>コンテンポラリー・ブルースは、1970年代以降に整った録音技術と演奏環境のもとで演奏される、今まさに続いているブルースだ。厳密に定義された流派ではなく、1980年代のブルース復興を一つの区切りとする。

伝統的な12小節の形と、一度・4度・5度の和音という土台は保たれている。大きく違うのは、その上に乗る音の作りだ。

ギターは、音の歪みと長く伸びる音を前提にした機材で鳴らされる。長い音を伸ばしながら細かく揺らす奏法や、指板の広い範囲を使う速いフレーズが、普通に使われる。これは、ブルースから生まれたロックのギター表現が、逆に本家へ取り込まれた結果だという見方がある。

編成には、オルガンやホーン・セクションが加わることも多い。録音では、各楽器を分けて重ね録りする作品も多く、音の聞き分けやすさと低音の厚みが大事にされる。一方で『テキサス・フラッド』のように、ライブに近い形で録音された作品もある。メンバーの回想では、互いを見て聴ける配置だったという。

歌い方は、喉を締めて張り上げる古い型のほかに、ソウルの影響を受けた歌い方も多い。

曲の作りも、決まった型ばかりではない。はっきりしたサビを持つポピュラー音楽の構成、短調で通す曲、ファンクのリズムを敷いた曲などが入り混じる。演奏の場は、小さな酒場から大規模な野外音楽祭まで広がった。それに合わせて、音量の作り方や見せ方も大きく変わった。伝統の型を守るか、新しくするか。その緊張が、このスタイルの中に常にある。</p>
<h2>成り立ち</h2><p>1970年代までに、アメリカの黒人の若い聴衆は、ソウルやファンク、そして後のヒップホップへ移っていった。ブルースは、彼らと同じ世代の音楽ではなくなった。一方で、英国経由の再発見によって、白人のロックの聴衆が主な客層として残るという逆転が起きる。ただし1980年代以降には、ミシシッピ州ジャクソン周辺などで、黒人の聴衆のあいだでブルースへの関心がよみがえる動き(ソウル・ブルースやサザン・ソウル)もあった。担い手と聴き手の人種の構成がずれたこの状態は、その後もずっと議論の火種になっている。

1971年、ブルース・イグラウアーがシカゴでアリゲーター・レコードを設立した。独立系のデルマーク・レコードが、Hound Dog Taylor &amp; The House Rockersの録音を断ったのがきっかけだった。イグラウアーは自分の資金(祖父の遺産)で録音し、レーベルを始めた。このレーベルが、この時期の受け皿の役割を果たした。

流れを変えたのは1983年、テキサス出身のスティーヴィー・レイ・ヴォーンが発表した『テキサス・フラッド』である。ロックの音圧でブルースを鳴らしたこの作品は、ブルース復興の代名詞の一つとなった。のちに1997年、全米レコード協会からダブル・プラチナに認定されている。ヴォーンは1990年、ヘリコプターの墜落事故により35歳で亡くなった。

1986年には、ロバート・クレイの『ストロング・パースエイダー』が、ソウル寄りの洗練された音で新しい聴衆を切り開いた。バディ・ガイは、1980年代の録音は少なかったが、1991年のアルバム『Damn Right, I've Got the Blues』で商業的に復活した。

一方、ミシシッピ州北部では1990年代に、ファット・ポッサム・レコードが動いた。R・L・バーンサイドやジュニア・キンブロウといった土着の演奏者の、荒々しいミシシッピのブルースを、そのまま録音して紹介したのだ。ジョン・スペンサー・ブルース・エクスプロージョンとの共演作などを通じて、その音はパンクやロック系の聴衆にも届いた。その一方で、ヒップホップ調のリミックス盤も出している。

2010年代以降は、若い黒人演奏者が現れている。ヒップホップの要素も取り込むゲイリー・クラーク・ジュニアや、2019年にデビュー作を出したクリストン・「キングフィッシュ」・イングラムらだ。同時に、白人の聴衆や演者が中心になったことには、批判や論争もある。この音楽は、誰の音楽なのかという問いを抱えたまま、今に至っている。</p>
