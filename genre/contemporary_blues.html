<h1>Contemporary Blues（コンテンポラリーブルース）とは</h1>
<p>1970年代以降に整備された録音技術と演奏環境のもとで演奏される、現在進行形のブルースである。伝統的な12小節形式と一度・四度・五度の和音という骨格は保たれているが、そこに乗る音の作りが大きく異なる。ギターは歪みと持続音を前提とし</p>
<p>1970年代以降に整備された録音技術と演奏環境のもとで演奏される、現在進行形のブルースである。伝統的な12小節形式と一度・四度・五度の和音という骨格は保たれているが、そこに乗る音の作りが大きく異なる。ギターは歪みと持続音を前提とした機材で鳴らされ、長い音を伸ばしながら細かく揺らす奏法や、指板の広い範囲を使う速い音型が普通に使われる。これはロックのギター表現がブルースから派生したのち、逆流して本家に取り込まれた結果である。編成にはオルガンやホーン・セクションが加わることも多く、録音は各楽器を分離して多重録音するのが標準で、一発録りの生々しさよりも音の分離と低音の量感が重視される。歌唱は喉を締めて張り上げる古い型よりも、ソウルの影響を受けた滑らかな発声が主流になっている。曲の作りも定型一辺倒ではなく、明確なサビを持つポピュラー音楽の構成や、短調で通す曲、ファンクのリズムを敷いた曲などが混在する。演奏の場は小さな酒場から大規模な野外音楽祭まで広がり、それに合わせて音量設計や見せ方も大きく変わった。伝統の型を守るか更新するかという緊張が、この様式の内側に常にある。</p>
<h2>成り立ち</h2><p>1960年代末までに、アメリカの黒人の若い聴衆はソウル、ファンク、そして後のヒップホップへ移り、ブルースは同世代の音楽ではなくなっていた。一方で英国経由の再発見によって、白人のロック聴衆が主要な客層として残るという逆転が起きる。担い手と聴き手の人種構成がずれたこの状態が、以後の議論の火種であり続けている。1971年にブルース・イグラウアーがシカゴで設立したアリゲーター・レコードは、大手が扱わなくなった演奏者を録音し続け、この時期の受け皿として機能した。流れを変えたのは1983年、テキサス出身のスティーヴィー・レイ・ヴォーンが発表した『テキサス・フラッド』である。ロックの音圧でブルースを鳴らしたこの作品は商業的に大成功し、下火だった市場そのものを立て直した。彼は1990年にヘリコプターの墜落事故で35歳で死んでいる。1986年にはロバート・クレイの『ストロング・パースエイダー』がソウル寄りの洗練で新たな聴衆を開拓し、忘れられかけていたバディ・ガイも再評価されて第一線に戻った。一方でミシシッピ州北部では、1990年代にファット・ポッサム・レコードがR・L・バーンサイドやジュニア・キンブロウといった土着の演奏者を、あえて荒い音のまま録音して発表した。これらはパンクやオルタナティヴ・ロックの聴衆に届き、洗練とは逆方向の回路を開いた。2000年代以降はゲイリー・クラーク・ジュニアやクリストン・イングラムら若い黒人演奏者が現れ、ヒップホップやリズム・アンド・ブルースの語法を持ち込んでいる。同時に、この音楽が中年白人男性の趣味として固定化しているという内部批判も繰り返し提起されており、誰の音楽なのかという問いを抱えたまま現在に至っている。</p>
