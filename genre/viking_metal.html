<h1>Viking Metal（ヴァイキングメタル）とは</h1>
<p>北欧の神話と古代スカンディナヴィアの世界観を主題にしたメタル。土台はブラックメタルやデスメタルの荒々しい演奏だが、そこに民俗音楽の要素が大量に持ち込まれる点が核心である。旋律には北欧の民謡に由来する旋法が用いられ、とくに長調と短調</p>
<p>北欧の神話と古代スカンディナヴィアの世界観を主題にしたメタル。土台はブラックメタルやデスメタルの荒々しい演奏だが、そこに民俗音楽の要素が大量に持ち込まれる点が核心である。旋律には北欧の民謡に由来する旋法が用いられ、とくに長調と短調の中間のような響きを持つ音階が、勝利と哀愁の同居する独特の情感を生む。楽器編成にはヴァイオリンやニッケルハルパ、ハーディングフェーレといった北欧の弦楽器、笛、口琴、そして枠太鼓が加わることが多い。合唱の扱いが決定的で、多数の男声が同じ旋律を斉唱する部分が必ず置かれ、これが船をこぐ労働歌や戦いの前の合唱を思わせる。テンポは中速から遅めで、疾走する部分と行進のように重い部分が交互に現れる。曲は長く、七分を超えることも珍しくない。歌唱は喉を絞る絶叫と、朗々とした語りに近い歌が併用される。歌詞はオーディンやトールといった北欧神話の神々、ラグナロク、船出、戦死者の館、そして北の自然を扱い、しばしばアイスランドの古い詩の原文が引用される。同じ北欧発でも、ブラックメタルが反キリスト教を掲げて内向するのに対し、こちらは失われた文化への郷愁と誇りを外へ向けて歌う点が異なる。</p>
<h2>成り立ち</h2><p>起点はスウェーデンのBathoryである。中心人物Quorthon、本名Thomas Forsbergは、1984年から極端に粗い録音のブラックメタルを作っていたが、1988年の『Blood Fire Death』、そして決定的には1990年の『Hammerheart』で、テンポを落とし、合唱を重ね、北欧神話を主題に据えた。この転換が新しい様式を生んだ。彼は父Börje Forsbergが運営するレーベルTyfonから作品を出しており、商業的な制約から自由だった。Quorthonは2004年、心不全のため38歳で亡くなっている。同じ時期、ノルウェーのEnslavedが1991年に結成され、古ノルド語で歌詞を書き、より複雑な構成を追求した。この二組が土台を作り、1990年代半ばから各国に広がる。ノルウェーのEinherjer、フィンランドのMoonsorrow、スウェーデンのThyrfing、アイスランドのSólstafirらが続いた。並行して、フィンランドのFinntrollがポルカに似た民俗舞曲を取り入れ、Korpiklaaniが酒と森を主題にした軽快な形を作り、これらはフォークメタルという別の呼び名でも語られる。2000年代にはスイスのEluveitieがケルト系の楽器を持ち込むなど、地域ごとの神話に置き換えた派生が各地に生まれた。ただしこの音楽には常に政治的な危険がつきまとってきた。北欧の異教と民族の誇りという主題は、極右や白人至上主義の側から利用されやすく、実際に一部のバンドがそうした立場と結びついた例がある。大半のバンドはこれを明確に否定し、神話は文化遺産であって人種の主張ではないと繰り返し表明しているが、聴衆の一部にそうした層が混ざる問題は現在も続いている。</p>
