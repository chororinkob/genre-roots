<h1>Viking Metal（ヴァイキングメタル）とは</h1>
<p>ヴァイキングメタルは、北欧の神話と古代スカンディナヴィアの世界観を主題にしたメタルだ。 土台は、ブラックメタルやデスメタルの荒々しい演奏である。そこに民俗音楽の要素が多く持ち込まれる傾向がある。楽器編成には、ヴァイオリンやニッケル</p>
<p>ヴァイキングメタルは、北欧の神話と古代スカンディナヴィアの世界観を主題にしたメタルだ。

土台は、ブラックメタルやデスメタルの荒々しい演奏である。そこに民俗音楽の要素が多く持ち込まれる傾向がある。楽器編成には、ヴァイオリンやニッケルハルパ、ハーディングフェーレといった北欧の弦楽器、笛、口琴（口にくわえて弾く小さな楽器）が加わることが多い。

旋律では、民謡的な旋法(ミクソリディアなど)を用いるバンドもある。アンセム的な合唱や重ね録りの合唱が使われ、シャンティ風の旋律も取り入れられる。これは船乗りのイメージによる連想である。

テンポは中速から遅めだ。疾走する部分と、行進のように重い部分が交互に現れる。長尺の曲が多い。

歌唱では、クリーンな歌唱と絶叫を併用する。

歌詞は、オーディンやトールといった北欧神話の神々、ラグナロク、船出、戦死者の館、そして北の自然を扱う。しばしば詩やサガの一節が引用される。同じ北欧発でも、多くのヴァイキングメタルはブラックメタルのサタニズムを退けつつ、北欧のキリスト教化を批判的に扱う主題も持つ。失われた文化への郷愁と誇りを外へ向けて歌う点が異なる。ただし、キリスト教の信仰を持つバンドや、ドイツのFalkenbachのように北欧以外のバンドもある。</p>
<h2>成り立ち</h2><p>1988年から1990年にかけて、スウェーデンのBathoryが先駆となった。一般にこのスタイルの創始者格とされる（ノルウェーのEnslavedを最初の真のヴァイキングメタルとする説もある）。

中心人物のQuorthon、本名Thomas Forsbergは、1984年から極端に粗い録音のブラックメタルを作っていた。1988年の『Blood Fire Death』は、その移行期の作品である。テンポを落とす、合唱を重ねる、神話を主題に据えるという転換が全面的に表れたのは、1990年の『Hammerheart』だった。この変化が新しいスタイルを生んだ。

作品は、父のレーベル(Tyfon/Black Mark)から出し続けつつ、一部作品は外部レーベル(Under One Flag、Noise など)からも出た。Quorthonは2004年、38歳で亡くなっている。死因は先天性の心疾患による心不全とされる。

同じ時期、ノルウェーのEnslavedが1991年に結成された。デビュー・アルバムでは古ノルド的な題材を、主にアイスランド語の歌詞で描き、より複雑な構成を追求した。その前の1993年のEP『Hordanes Land』の歌詞はノルウェー語だった。この二組が土台を作り、1990年代半ばから各国に広がる。ノルウェーのEinherjer、フィンランドのMoonsorrow、スウェーデンのThyrfingらが続いた。Moonsorrowは、しばしばヴァイキングメタルに数えられるが、本人たちはその呼称を避けている。

並行して、フィンランドのFinntrollが、フィンランドの2拍子の舞曲フンッパ（Humppa）を取り入れた。Korpiklaaniは、酒と宴を主題にしたフォークメタルの代表格として知られる。これらはフォークメタルという別の呼び名でも語られる。2000年代にはスイスのEluveitieがケルト系の楽器を持ち込んだ。地域ごとの神話に置き換えた派生が、各地に生まれた。

ただし1990年代初頭には民族主義が過激化した時期があったが、1990年代後半には距離を置く動きが進んだ。研究者の間でも評価が分かれる。北欧の異教と民族の誇りという主題は、極右や白人至上主義の側から利用されやすく、実際に一部のバンドがそうした立場と結びついた例がある。大半のバンドはこれを明確に否定している。神話は文化の遺産（受け継がれた財産）であって人種の主張ではないと、繰り返し表明している。</p>
