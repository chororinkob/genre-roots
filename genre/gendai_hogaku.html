<h1>Gendai Hogakuとは</h1>
<p>一言でいうと、箏・三味線・尺八などの和楽器で演奏するために現代に作曲された作品のジャンルである。代表曲22曲を動画で聴け、ルーツと影響のつながりを地図でたどれる。</p>
<p>一言でいうと、箏・三味線・尺八などの和楽器で演奏するために現代に作曲された作品のジャンルである。楽譜は五線譜で書かれ、流派の伝承によらず作曲者の意図どおりに再現されるのが大きな特徴だ。中心になる楽器は箏と十七絃、尺八、三絃である。箏は爪をつけた指で弦をはじき、十七絃は低い音を支える。尺八は息の強弱で倍音を変え、三絃は撥で弦を打って鳴らす。伝統音楽に声楽が多いのに対し、器楽曲が多いのもこのジャンルの特色だ。旋律の土台は民謡音階や陰旋法に置かれることもあるが、十二音技法や無調を取り入れた前衛的な作品もあり、幅が広い。和音のつくり方は、似た旋律を少しずつずらして鳴らすヘテロフォニー（複旋律）を基本としながら、西洋音楽の対位法やコード感覚も混在する。打楽器の役割も大きく、大鼓・小鼓・締太鼓や太鼓が場面の緊張を作る。リズムは拍節に縛られず、拍子が途中で変わり、拍の裏を強調するのがむしろ普通で、テンポも曲ごとに自由に決められる。歌を入れる場合は地歌や民謡の発声ではなく、ベルカント系の発声や語りを混ぜることもある。歌詞がある場合も古謡ではなく現代詩が選ばれる。曲の構成は、場面が一段落ずつ変わる組曲的なものと、独奏と合奏が対話する協奏的なものが主流だ。古典箏曲・地歌が特定の伝承様式の中で成立しているのに対し、このジャンルは楽器と演奏者を選ばず、ジャンルを越えた自由な編成をとる点が違う。コンサートホールや放送局のスタジオ、学校の音楽室で演奏される。</p>
<h2>成り立ち</h2><p>明治維新ののち、西洋音楽が学校教育を通じて広がると、邦楽は自らを立て直す圧力の中に置かれた。大正から昭和初期には、箏曲家の宮城道雄が西洋音楽の手法を取り入れた「新日本音楽」を起こし、四世杵屋佐吉や中能島欣一らが聴くための邦楽を相次いで発表した。楽器の改良も進み、宮城は低音を担う十七絃を製作した。

戦後に入ると、創作はさらに前へ進む。1947年4月、NHKラジオで「現代邦楽の時間」が放送され、ジャンル名の由来となった。1955年にはNHK邦楽技能者育成会が結成され、流派を越えた若手演奏家の育成が始まった。育成会出身者がやがて現代邦楽の演奏家の中心を占めるようになっていく。

1964年、作曲家の三木稔と長澤勝俊らが邦楽器による合奏団「日本音楽集団」を結成した。三木は箏奏者の野坂恵子とともに1969年に二十絃箏を開発し、楽器・作曲・演奏がひとつになった動きが進んだ。同じころ、洋楽畑の作曲家も和楽器に向き合い始めた。1967年、武満徹の「ノヴェンバー・ステップス」がニューヨークで初演され、尺八の横山勝也と薩摩琵琶の鶴田錦史がソロを務めて世界的に注目された。1971年には山本邦山が尺八の即興による「銀界」を録音し、ジャズとの垣根を越えた。しかし大阪万博ののち、前衛音楽全体の停滞とともに第一次ブームは静まっていった。

それでも作曲は続いた。三木稔は「ダンス・コンセルタント」シリーズを書き、長澤勝俊は「鳥と砂と海と」などの作品を残し、船川利夫や杵屋正邦も合奏曲を積み上げた。1990年代には若手演奏家がポップスの手法を取り込む邦楽ニューウェーブが起き、1995年には洗足学園音楽大学に現代邦楽研究所が開設され、教育の拠点ができた。1990年代末からは東儀秀樹や吉田兄弟らの活躍で第二次邦楽ブームが起き、2002年度からは中学校の音楽授業で和楽器が扱われるようになった。現在も日本音楽集団やAura-J、水牛楽団が新作の委嘱を続け、沢井比河流や吉松隆らの作品が演奏され続けている。</p>
<h2>代表曲</h2><ul><li>絵空箏 (沢井比河流)</li><li>ノヴェンバー・ステップス (武満徹)</li><li>秋によせる三つの幻想曲 (長澤勝俊)</li><li>鳥と砂と海と (長澤勝俊)</li><li>箏 双重 (三木稔)</li><li>巨火 (三木稔)</li><li>北の詩 (三木稔)</li><li>吟遊歌 (沢井比河流)</li><li>OKOTO (沢井比河流)</li><li>すばるの七ツ (吉松隆)</li><li>夏野 (杵屋正邦)</li><li>壽 (杵屋正邦)</li><li>春懐 (船川利夫)</li><li>三味線協奏曲 (長澤勝俊)</li><li>箏三重奏曲 (長澤勝俊)</li><li>三つのパラフレーズ (沢井忠夫)</li><li>エクリプス（蝕）～尺八と琵琶のための (武満徹)</li><li>讃歌 (沢井忠夫)</li><li>秋の曲 (三木稔)</li><li>竹籟協奏 (諸井誠)</li><li>竹 (山本邦山)</li><li>密度 (一柳慧)</li></ul>
