<h1>Blue-Eyed Soul（ブルーアイドソウル）とは</h1>
<p>白人の演者によって歌われるソウルおよびリズム・アンド・ブルースを指す呼び名である。音楽的な様式としての独自性は乏しく、あくまで演者の人種によって定義される点が、この分類の特異さであり、また問題でもある。音の面では、参照される時代の</p>
<p>白人の演者によって歌われるソウルおよびリズム・アンド・ブルースを指す呼び名である。音楽的な様式としての独自性は乏しく、あくまで演者の人種によって定義される点が、この分類の特異さであり、また問題でもある。音の面では、参照される時代のソウルの語法がそのまま用いられる。すなわち、ゴスペルに由来する装飾を凝らした歌い回し、複数の声による分厚い合唱、七の和音を含む豊かな和声、管楽器の斉奏、そして跳ねたリズムである。歌唱においては、黒人の歌手が用いる、音を細かく揺らす技法、裏声への切り替え、絞り出すような叫び、そして拍の後ろに寄りかかる間合いが模倣される。ただし多くの場合、その模倣は完全ではなく、そこに生じるずれが独自の質感を生むこともある。編成は時代に応じて変化し、1960年代は管弦楽を含む大編成、1970年代以降は洗練された小編成、近年では打ち込みを主体とするものまで幅広い。歌詞は恋愛が中心で、社会的な主題は比較的少ない。全体として、ソウルの持つ情熱と、ポップスとしての聴きやすさを両立させる方向が選ばれることが多い。</p>
<h2>成り立ち</h2><p>この呼称が生まれたのは1960年代半ばのアメリカである。当時、ラジオ局は聴取者の人種によって編成を分けており、黒人向けの局が白人の演者の楽曲をかけることは異例だった。1964年、The Righteous Brothersの楽曲が黒人向けの局で頻繁に流され、聴取者の多くが彼らを黒人だと思い込んでいたという状況が生じる。この現象を説明するために、フィラデルフィアの放送関係者が青い目のソウルという表現を用いたのが始まりとされる。つまりこの語は、人種による音楽の分離が制度として存在していたことの証拠でもある。1960年代にはThe Rascalsが続き、イギリスからはDusty Springfieldが現れた。彼女は1968年、メンフィスの現地の演奏者たちと録音を行い、翌年発表された作品は、この分野の最高峰として今も評価されている。ただし本人は録音の際、周囲の名手たちを前に極度に萎縮したと後年語っている。1970年代にはフィラデルフィア出身のHall &amp; Oatesが、地元のソウルの語法を消化した楽曲で圧倒的な商業的成功を収めた。1980年代にはイギリスのSimply RedやGeorge Michaelが続く。2006年、イギリスのAmy Winehouseが1960年代のソウルの編成と質感を忠実に再現した作品を発表し、世界的な現象となったが、彼女は2011年に27歳で死去した。この分類には常に批判がつきまとう。すなわち、同じ音楽を演奏していても、白人の演者の方が広い流通と高い報酬を得るという構造的な不均衡である。黒人の音楽家が切り開いた語法を用いながら、その恩恵を受けるのが誰かという問いは、この呼称が使われるたびに立ち上がってきた。当事者の多くがこの語を嫌うのも、そのためである。</p>
