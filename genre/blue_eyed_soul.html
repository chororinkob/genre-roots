<h1>Blue-Eyed Soul（ブルーアイドソウル）とは</h1>
<p>白人の演者によって歌われる、ソウルおよびリズム・アンド・ブルースを指す呼び名だ。音楽的なスタイルとしての独自性は乏しく、あくまで演者の人種によって定義される。この点が、この分類の特異さであり、また問題でもある。 音の面では、参照さ</p>
<p>白人の演者によって歌われる、ソウルおよびリズム・アンド・ブルースを指す呼び名だ。音楽的なスタイルとしての独自性は乏しく、あくまで演者の人種によって定義される。この点が、この分類の特異さであり、また問題でもある。

音の面では、参照される時代のソウルの手法が、そのまま用いられる。編成は、大編成の作品も小編成の作品も、各時代に併存した。管楽器の斉奏（全員が同じ旋律を一斉に吹くこと）も、手法の一つだ。

和声は、七の和音（響きに厚みのある和音）を含む豊かなものだ。リズムは、跳ねている。

歌い方では、ゴスペルに由来する装飾を凝らした歌い回しと、複数の声による分厚い合唱が用いられる。歌唱においては、黒人の歌手が用いる、音を細かく揺らす技法、裏声への切り替え、絞り出すような叫び、そして拍の後ろに寄りかかる間合いが模倣される。

歌詞は恋愛主題が多いが、社会的主題の代表曲もある。

</p>
<h2>成り立ち</h2><p>舞台は、1960年代半ばのアメリカだ。この呼称が生まれたのは、そのころである。当時、ラジオ局は聴取者の人種によって編成を分けており、黒人向けの局が白人の曲をかけるのはまれだった。

1964年、The Righteous Brothersの楽曲が黒人向けの局で頻繁に流され、R&amp;B局のスタッフが、彼らが白人だと知って驚いたという話が伝わる。白人の歌手であることを聴衆に知らせる合図として、1964年にフィラデルフィアのDJ、Georgie Woodsが青い目のソウルという表現を新しくつくったと考えられている（諸説あり／Woods説が有力）。つまりこの語は、人種で聴取層と編成が分かれていた市場の慣行を映す語である。

1960年代には、後のThe Rascals（当時Young Rascals）が並行して続き、イギリスからはDusty Springfieldが現れた。彼女は1968年9月、初期セッションをメンフィスのAmerican Sound Studioで行い、最終ボーカルとオーケストラ部分はニューヨークのAtlanticで録音した。米国で1969年3月31日に発表された作品は、ブルーアイド・ソウルを代表する名盤の一つとして今も評価されている。ただし本人は、かつてこのスタジオで録音したソウルの巨匠たちと比べられることへの不安を、後年語っている。

1970年代半ばから1980年代後半にかけて、フィラデルフィアで結成されたHall &amp; Oatesが、地元のソウルの手法を消化した楽曲で圧倒的な商業的成功を収めた。1980年代にはイギリスのSimply RedやGeorge Michaelが続く。

2006年、イギリスのAmy Winehouseが、1960年代のソウルに影響を受け、当時の音を参照した作品を発表した。世界的な現象となったが、彼女は2011年に27歳で死去した。

この分類には、1980年代後半以降、特に経済格差の観点から批判が出ている（Ebony 1989年、1999年など）。すなわち、同じ音楽を演奏していても、白人の演者の方が広い流通と高い報酬を得るという構造的な不平等がある、という批判である。黒人の音楽家が切り開いた手法を用いながら、その恩恵を受けるのが誰かという問いは、1980年代後半以降の批判の中で立ち上がってきた。Daryl Hallは、この語を「人種差別的」と述べたことがある。白人が黒人の様式を演奏すると外から真似していると見なす前提がある、というのが彼の主旨だ。</p>
