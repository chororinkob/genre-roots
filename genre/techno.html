<h1>Techno（テクノ）とは</h1>
<p>テクノは、機械が生む反復を音楽の中心に据えた電子ダンス音楽だ。 土台は四つ打ちだ。バスドラムが1小節に4回、完全に等間隔で置かれる。テンポは120〜150BPMと幅があり、地域や細かい分類で大きく異なる。 音の素材は、Roland</p>
<p>テクノは、機械が生む反復を音楽の中心に据えた電子ダンス音楽だ。

土台は四つ打ちだ。バスドラムが1小節に4回、完全に等間隔で置かれる。テンポは120〜150BPMと幅があり、地域や細かい分類で大きく異なる。

音の素材は、Roland TR-909のクラップ（手拍子の音）とハイハット、TR-808の低音、そしてアナログシンセの唸りとノイズが中心だ。旋律は薄いか存在せず、代わりに音色が緩やかに変形していく。ベースは低域を持続的に埋め、しばしば旋律を持たない。

展開を担うのは、フィルターの開閉、レゾナンスの上下、ディレイのフィードバック量といった連続的な操作（いずれも音色を少しずつ変える操作）だ。

ハウスとの違いは重心の位置だ。ハウスが人の歌と温かい和声に寄るのに対し、テクノは音色そのものの質感と、変化の少ない反復による意識の変容に軸を置く。

インストゥルメンタル中心だが、歌詞や歌を持つテクノも少なくない。聴き手は音の物理的な圧力と時間の引き伸ばしそのものを体験する。

曲の構成はDJが繋ぐことを前提とし、5分から10分ほどのことが多く、要素を一つずつ足し引きしていく。ブレイク（演奏が一瞬途切れる部分）で打楽器を抜き、リヴァーブ（残響効果）だけの空間を作ってから全てを戻す落差が最大の設計要素になる。倉庫や地下室、深夜から早朝にかけての長時間の空間で鳴ることを前提に設計されていることが多い点も、この音楽の重要な条件の一つとされる。</p>
<h2>成り立ち</h2><p>舞台は、1980年代半ばのデトロイトだ。テクノはここで生まれ、1990年前後にヨーロッパで爆発的に発展した。

起源については、デトロイトのJuan Atkins、Derrick May、Kevin Saundersonが定説とされる。AtkinsはTofflerの著作に着想を得た。technoはtechnologyの略として、彼が音楽に当てた。

1988年（中盤）に、イギリスのVirgin系の10 Recordsが編集盤「Techno! The New Dance Sound of Detroit」を発表した。これで、英国の聴衆にテクノという語が紹介され、デトロイトのダンス音楽と結びつけられた（この語自体は、Atkinsらが以前から使っていた）。

しかし、テクノを巨大な文化に育てたのはヨーロッパ、とりわけドイツだった。決定的だったのは、1989年のベルリンの壁崩壊だ。東ベルリンでは、旧百貨店の金庫室、旧変電所、防空壕といった空き空間が、統一直後の混乱で使われなくなっていた。それらが、安価に、または緩い管理で借りられた。

Tresorは、Dimitri Hegemannらが1991年3月に旧デパートの金庫室で開いたクラブだ。デトロイトの制作者を積極的に招いて、アメリカとドイツを直結させた。E-WerkやBunkerも同様の場となった。1989年に始まったLove Paradeは、当初150人程度のデモだった。それが1999年には、主催者発表で約150万人規模に膨れ上がった（入場が無料で管理されないため、正確な数は不明）。

ベルリンの壁の崩壊とテクノの興隆が重なったことで、この音楽は東西の若者が言語なしに共有できる手段という、政治的な意味も帯びた。同時期、オランダのロッテルダムではより速く荒いガバが、ベルギーではやや先行して（1987年）ニュービートが、イギリスではレイヴが並行して発展した。

1990年代半ばには、次の三つが、それぞれ異なる方向を切り開いた。一つは、Jeff Millsの高速で硬質なDJスタイル。もう一つは、Robert Hoodが先駆者の一人とされるミニマル・テクノだ（『Minimal Nation』（1994年）が着想元とされる）。さらに、Basic Channel(Moritz von OswaldとMark Ernestus)の、ダブ処理（音を加工して空間を広げる手法）を用いた霧のような音響があった。

2000年代には、Ricardo Villalobosらのミニマルは、Kompakt、Perlon、M-nusなどのレーベルと、Club der Visionaere、Watergate、Bar 25などのクラブを軸に広まった。Berghain(2004年開店、旧発電所を改装)は、入場審査の厳しさと、内部の撮影禁止という規則で、世界的に知られるようになる。

負の側面も大きい。薬物の常用と過剰摂取による死亡、聴覚障害、長時間営業に伴う健康被害が、繰り返し問題になった。Love Paradeも、2000年にはベルリンで主催者発表で130万人が参加した。しかし2001年に、連邦憲法裁判所が（仮処分手続での部会決定で）、意見形成・表明が中心でないとして、政治的デモとしての保護を認めなかった（参加者数は主催者発表で2000年の130万人から減ったが、要因は日程変更とされ、数字も資料で異なる）。2010年のデュイスブルク開催では群衆事故で21人が死亡し、この催しは永久に終了した。

現在、テクノはベルリン、デトロイト、アムステルダム、東京を含む世界中に定着している。2024年3月には、ベルリンのテクノ文化がドイツの無形文化遺産の全国リストに登録された。</p>
