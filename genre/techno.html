<h1>Techno（テクノ）とは</h1>
<p>機械が生む反復を音楽の中心に据えた電子ダンス音楽。土台は四つ打ちで、バスドラムが一小節に4回、完全に等間隔で置かれる。テンポは125〜150BPMと幅があり、地域や下位分類で大きく異なる。ハウスとの違いは重心の位置で、ハウスが人の</p>
<p>機械が生む反復を音楽の中心に据えた電子ダンス音楽。土台は四つ打ちで、バスドラムが一小節に4回、完全に等間隔で置かれる。テンポは125〜150BPMと幅があり、地域や下位分類で大きく異なる。ハウスとの違いは重心の位置で、ハウスが人の歌と温かい和声に寄るのに対し、テクノは音色そのものの質感と、変化の少ない反復による意識の変容に軸を置く。旋律は薄いか存在せず、代わりに音色が緩やかに変形していく。Roland TR-909のクラップとハイハット、TR-808の低音、そしてアナログシンセの唸りとノイズが素材の中心で、フィルターの開閉、レゾナンスの上下、ディレイのフィードバック量といった連続的な操作が展開を担う。ベースは低域を持続的に埋め、しばしば旋律を持たない。曲の構成はDJが繋ぐことを前提とし、5分から10分、要素を一つずつ足し引きしていく。ブレイクで打楽器を抜き、リヴァーブだけの空間を作ってから全てを戻す落差が最大の設計要素になる。ヴォーカルはほぼ存在せず、あっても加工された短い断片で、意味を持つ言葉としては機能しない。歌詞による物語がないぶん、聴き手は音の物理的な圧力と時間の引き伸ばしそのものを体験する。倉庫や地下室、深夜から早朝にかけての長時間の空間で鳴ることを前提に設計されている点も、この音楽の本質的な条件になっている。</p>
<h2>成り立ち</h2><p>1980年代半ばのデトロイトで生まれ、1990年前後にヨーロッパで爆発的に発展した。起源についてはデトロイトのJuan Atkins、Derrick May、Kevin Saundersonが定説とされ、テクノという語自体もAtkinsがAlvin Tofflerの著書「第三の波」の techno rebels という表現から取ったものとされる。1988年にイギリスのVirginが編集盤「Techno! The New Dance Sound of Detroit」を発表したことで、この語がジャンル名として国際的に確定した。しかしテクノを巨大な文化に育てたのはヨーロッパ、とりわけドイツだった。決定的だったのは1989年のベルリンの壁崩壊で、東ベルリンの放置された発電所、銀行の金庫室、防空壕といった無主の空間が、そのまま違法クラブとして占拠された。所有者が不明で法的な追及も曖昧だったため、数年にわたり夜通しのパーティーが可能になった。TresorはDimitri Hegemannが1991年に旧デパートの金庫室で開いたクラブで、デトロイトの制作者を積極的に招いてアメリカとドイツを直結させた。E-WerkやBunkerも同様の場となり、1989年に始まったLove Paradeは当初150人程度のデモとして始まりながら、1999年には150万人規模に膨れ上がった。ベルリンの壁の崩壊とテクノの興隆が重なったことで、この音楽は東西の若者が言語なしに共有できる媒体という政治的な意味も帯びた。同時期にオランダのロッテルダムではより速く荒いガバが、ベルギーではニュービートが、イギリスではレイヴが並行して発展した。1990年代半ばには、Jeff Millsの高速で硬質なDJスタイル、Robert Hoodが提唱したミニマル・テクノ、Basic Channel(Moritz von OswaldとMark Ernestus)のダブ処理を用いた霧のような音響が、それぞれ異なる方向を切り開いた。2000年代にはRicardo VillalobosらのミニマルがBerghain(2004年開店、旧発電所を改装)を中心に主流となり、この店は入場審査の厳しさと、内部の撮影禁止という規則で世界的に知られるようになる。負の側面も大きい。薬物の常用と過剰摂取による死亡、聴覚障害、長時間営業に伴う健康被害が繰り返し問題になり、2000年のLove Paradeは環境破壊を理由に公的支援を失い、2010年のデュイスブルク開催では群衆事故で21人が死亡してこの催しは永久に終了した。現在、テクノはベルリン、デトロイト、アムステルダム、東京を含む世界中に定着し、2024年にはベルリンのテクノ文化がドイツの無形文化遺産に登録されている。</p>
