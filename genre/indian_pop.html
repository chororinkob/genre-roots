<h1>Indian Pop（インディアンポップ）とは</h1>
<p>インディアン・ポップは、インドと南アジアで、映画音楽の外で作られた大衆向けのポップスを指す呼び名だ。 この地域の音楽産業は、長く映画と一体だった。歌は映画の場面のために作られ、俳優が歌に口を合わせるものだった。これに対してこの分野</p>
<p>インディアン・ポップは、インドと南アジアで、映画音楽の外で作られた大衆向けのポップスを指す呼び名だ。

この地域の音楽産業は、長く映画と一体だった。歌は映画の場面のために作られ、俳優が歌に口を合わせるものだった。これに対してこの分野では、歌手自身が主役になり、映画を通さずに作品を発表する。

音楽の面では、インドの旋律の感覚と、欧米のポップスの組み立てを混ぜ合わせる。旋律には、古典音楽やボリウッド、地域の音楽の要素を取り入れることがある。歌声には、鼻にかかった独特の響きが残る。

一方で、リズムと編曲は同じ時代の欧米の流行に忠実だ。ディスコの四つ打ち（1小節の4拍すべてで大太鼓を鳴らす型）、シンセサイザーの分厚い和音、打ち込みのドラムが使われる。作品によっては、タブラやドーラクといった伝統的な太鼓、パンジャーブ地方の大太鼓ドール、そして弦楽器が加わる（特にバングラー系）。テンポは踊れる速さが好まれる。

言葉はヒンディー語やウルドゥー語が中心だが、英語やパンジャーブ語など各地域の言葉が混ざることも多い。歌詞は恋愛を中心に、社会的なテーマや自国への誇りなど幅広い。映画音楽が担ってきた物語からは、自由になっている。

曲は、繰り返しの部分を強調した、分かりやすい組み立てを持つ。</p>
<h2>成り立ち</h2><p>1970年代までのインドでは、映画音楽が圧倒的な力を持っていた。映画の外の大衆音楽(ガザルやポップスなど)は少数派だった。国営放送も古典音楽と映画音楽を中心に番組を組んでおり、若い聴き手が自分たちの音楽を持てる余地は小さかった。

この状況を破ったのが、Nazia Hassanである。パキスタン出身で、カラチとロンドンで育った彼女は、1980年、まだ10代でインド映画の挿入歌を歌い、爆発的な人気を得た。制作を担ったのは、ロンドンを拠点とするインド系の制作者Bidduだ。彼は、当時世界中で流行していたディスコの手法を持ち込んだ。

翌1981年、彼女は弟のZoheb Hassanとともに、映画とは関係のない作品を発表する。これは、映画音楽が支配する南アジアで、非映画のアルバムとして地域規模で大成功した先駆けの例の一つとされ、後の独立系ポップの発展を後押しした。ただし、起源は1960年代までさかのぼるという見方もあり、ジャンルとして固まったのは1990年代半ばだとする見方もある。彼女は後に国際連合の機関で働き、2000年に35歳の若さで癌のため亡くなった。

決定的な環境の変化は、1991年に訪れた。経済の自由化を背景に、外国の資本と衛星放送が入ってきた。1990年代半ばには、音楽専門のテレビ局がインド向けの放送を始める。映像つきの曲を発表する場が生まれたことで、この分野は一気に広がったとされる。

Alisha Chinaiが1995年に発表した曲は、国産であることを誇る題名のとおり、愛国的な内容で、国内外で大ヒットした。発売のころには、Anu Malikへの告発や、レーベルとの争いも報じられた。Baba Sehgalは、ヒンディー語でラップする最初期の例となった。Daler Mehndiは、パンジャーブ地方の民衆の音楽を打ち込みと組み合わせ、全国的な流行を作ったとされる。

しかし2000年代後半、この分野は映画音楽との競争が強まって縮小し、主な歌手は映画の歌手へと移った。音楽チャンネルの番組編成の変化なども理由に挙げられることがあるが、原因と結果の関係は定説ではない。

近年は、配信と動画共有を通じて、映画を通さない音楽の場が再び広がりつつある。</p>
