<h1>Indian Pop（インディアンポップ）とは</h1>
<p>インドおよび南アジアで、映画音楽の枠外で作られた大衆的なポップスを指す呼び名である。この地域の音楽産業は長らく映画と一体であり、歌は映画の場面のために作られ、俳優が口を合わせるものだった。それに対してこの分野は、歌手自身が主役とな</p>
<p>インドおよび南アジアで、映画音楽の枠外で作られた大衆的なポップスを指す呼び名である。この地域の音楽産業は長らく映画と一体であり、歌は映画の場面のために作られ、俳優が口を合わせるものだった。それに対してこの分野は、歌手自身が主役となり、映画を介さずに作品を発表する。音楽的にはインドの旋律感覚と欧米のポップスの構造を折衷する。旋律には北インド古典音楽の旋法に由来する音の運びや、一音を細かく揺らす装飾が用いられ、歌唱には鼻にかかった独特の共鳴が残る。一方でリズムと編曲は同時代の欧米の流行に忠実で、ディスコの四つ打ち、シンセサイザーの分厚い和音、打ち込みのドラムが使われる。加えてタブラやドーラクといった伝統的な太鼓、パンジャーブ地方の大太鼓ドール、そして弦楽器が重ねられ、この折衷こそが独特の華やかさを生む。テンポは踊れる速さが好まれ、曲は繰り返し部分を強調した明快な構造を持つ。言語はヒンディー語が中心だが、英語やパンジャーブ語が混ざることも多い。歌詞は恋愛と祝祭が中心で、映画音楽が担ってきた物語性からは解放されている。</p>
<h2>成り立ち</h2><p>1970年代までのインドにおいて、映画音楽以外の大衆音楽はほとんど存在の場を持たなかった。国営放送は古典音楽と映画音楽を中心に編成しており、若い聴き手が自分たちの音楽を持つ余地は小さかった。この状況を破ったのがNazia Hassanである。パキスタン出身でロンドンに育った彼女は、1980年、まだ10代のときにインド映画の挿入歌を歌って爆発的な人気を得た。制作を担ったのはロンドンを拠点とするインド系の制作者Bidduで、彼は当時世界的な流行だったディスコの語法を持ち込んだ。翌1981年、彼女は弟のZoheb Hassanとともに、映画とは無関係の作品を発表する。これが南アジアにおける最初の大規模な非映画のポップスの成功であり、この分野の起点となった。彼女は後に国際連合の機関で働き、2000年に35歳の若さで癌により死去している。決定的な環境の変化は1991年に訪れた。経済の自由化によって外国資本と衛星放送が流入し、1990年代半ばには音楽専門のテレビ局がインド向けの放送を開始する。映像を伴う楽曲を発表する場が生まれたことで、この分野は一気に拡大した。Alisha Chinaiが1995年に発表した楽曲は、国産であることを誇る題名を持ち、大きな議論と成功を呼んだ。Baba Sehgalはヒンディー語でラップする最初期の例となり、Daler Mehndiはパンジャーブ地方の民衆音楽を打ち込みと結合させて全国的な流行を作った。しかし2000年代に入ると、この分野は急速に縮小する。映画産業が、独立系のポップスで培われた語法をそのまま吸収し、音楽専門のテレビ局も視聴率のために映画音楽中心の編成へ戻ったためである。結果として、多くの歌手が映画の歌手へ転じた。近年では配信と動画共有を通じて、再び映画を介さない音楽の場が広がりつつある。</p>
