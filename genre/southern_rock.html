<h1>Southern Rock（サザンロック）とは</h1>
<p>アメリカ南部の音楽的な蓄積、すなわちブルース、カントリー、ゴスペル、リズム・アンド・ブルースを、大音量のロックバンドの編成で一つにまとめた音楽である。最大の識別点は複数のリードギターの扱いで、二本あるいは三本のギターが三度や六度で</p>
<p>アメリカ南部の音楽的な蓄積、すなわちブルース、カントリー、ゴスペル、リズム・アンド・ブルースを、大音量のロックバンドの編成で一つにまとめた音楽である。最大の識別点は複数のリードギターの扱いで、二本あるいは三本のギターが三度や六度でハモりながら旋律を弾く重奏が定型となっており、その響きは南部の教会の合唱やカントリーの兄弟デュオの歌い回しに由来する。加えて、ガラスや金属の筒を指にはめて弦を滑らせるスライドギターが多用され、しばしばオープンEやオープンGといった、開放弦だけで和音が鳴る調弦が用いられる。リズムはブギとシャッフルを基調に、三連符を感じさせる跳ねた刻みを持ち、ベースはウォーキング的に動き回る。オルガンやエレクトリックピアノが和音を厚く敷き、管楽器が加わることもある。曲は5分を超えることが多く、後半に長い即興の応酬が置かれ、ライブでは10分以上に伸びる。ヴォーカルは南部訛りを隠さず、しゃがれた声で語るように歌う。歌詞は故郷、家族、酒場、放浪する生活、法の外側で生きる男といった主題を扱い、都会の洗練を拒む姿勢が一貫している。同じアメリカのロックでも、西海岸のカントリーロックが穏やかな響きを求めたのに対し、こちらは音量と即興の熱量を優先する。</p>
<h2>成り立ち</h2><p>1969年、ジョージア州メイコンでPhil WaldenがCapricorn Recordsを設立し、同年結成されたThe Allman Brothers Bandを最初の看板に据えたことが出発点である。Duane Allmanは既にアラバマ州マッスル・ショールズのFAME Studiosで、Rick Hallのもと数多くのソウルの録音に参加しており、黒人音楽の現場で培った演奏感覚をロックバンドへ持ち込んだ。人種隔離の記憶が生々しい時代に、白人と黒人の混成バンドが南部を巡業したこと自体が政治的な意味を帯びていた。彼らは弟のGregg Allmanのオルガンと歌、二人のドラマーによる複層的なリズム、そしてDuane Allmanのスライドギターを軸に、1971年のライブ盤アット・フィルモア・イーストで即興を主体とする南部ロックの雛形を完成させる。しかし同年10月にDuane Allmanがオートバイ事故で25歳で死亡し、翌1972年11月にはベースのBerry Oakleyがほぼ同じ場所で同様の事故により死亡するという悲劇が続いた。もう一つの中心はフロリダ州ジャクソンヴィルのLynyrd Skynyrdで、Ronnie Van Zantを中心に三本のギターを擁し、1974年のスウィート・ホーム・アラバマでNeil Youngが南部の人種差別を糾弾した楽曲への返答を行い、南部の誇りをめぐる論争を巻き起こした。この曲で振られた南軍旗はその後長く彼らの象徴となり、旗が持つ人種差別の含意をめぐって現在に至るまで批判が続いている。1977年10月、Lynyrd Skynyrdはツアー中の小型機墜落によりRonnie Van Zant、Steve GainesとCassie Gainesの姉弟を失い、事実上の終焉を迎えた。周辺にはThe Marshall Tucker Band、The Outlaws、Blackfoot、.38 Specialが並び、テキサスのZZ Topはブルースをより簡素な形に切り詰め、Charlie Daniels Bandは1979年のジ・デヴィル・ウェント・ダウン・トゥ・ジョージアでフィドルを主役にした。1976年の大統領選ではジョージア州出身のJimmy Carterを南部ロックの各バンドが資金集めの公演で支援し、この音楽が南部の政治的な自己主張と結びついていたことを示した。1980年代に入るとCapricorn Recordsの倒産と相次ぐ死によって勢いを失うが、その語法はカントリーの主流へ吸収され、1990年代以降のカントリー・ロックやジャム・バンド、さらにはストーナーロックやサザン・メタルへ形を変えて受け継がれている。</p>
