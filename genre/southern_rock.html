<h1>Southern Rock（サザンロック）とは</h1>
<p>サザン・ロックは、アメリカ南部の音楽的な蓄積を、大音量のロックバンドの編成で一つにまとめた音楽だ。その蓄積とは、ブルース、カントリー、ゴスペル、リズム・アンド・ブルースを指す。 中心になるのはギターである。Allman Broth</p>
<p>サザン・ロックは、アメリカ南部の音楽的な蓄積を、大音量のロックバンドの編成で一つにまとめた音楽だ。その蓄積とは、ブルース、カントリー、ゴスペル、リズム・アンド・ブルースを指す。

中心になるのはギターである。Allman Brothersは、ギターを2本あるいは3本重ねて、3度や6度でハモりながら旋律を弾くツイン・リードを聴かせた。これは、後続に大きな影響を与えた。加えて、ガラスや金属の筒を指にはめて弦を滑らせるスライドギターが、多用されるバンドもある。その場合は、オープンEやオープンGといった調弦が用いられる。開放弦（指で押さえずに鳴らす弦）だけで、和音が鳴る調弦だ。

鍵盤も重要だ。オルガンやエレクトリックピアノが和音を厚く敷き、管楽器が加わることもある。

リズムは、ブギとシャッフル（跳ねるリズム）が基調になるバンドが多い。三連符（1拍を3等分したリズム）を感じさせる、跳ねた刻みを持つ。ベースは、ウォーキング的に動き回ることがある。

ヴォーカルは、南部訛りを隠さないことが多い。しゃがれた声で、語るように歌う例もある。

歌詞は、故郷や南部の誇り、放浪、酒、法の外の生き方などを歌う例が多い。ただし、主題は一様ではない。

曲の組み立てでは、代表曲は5分前後のものが多い。Free BirdやAllman Brothersのように、スタジオ盤でも長い曲がある。後半には長い即興の応酬が置かれ、ライブでは10分以上に伸びる。

同じアメリカのロックでも、西海岸のカントリーロックは穏やかな響きを求めた。それに対し、こちらはカントリー・ロックの影響を受けつつ、音量と即興の熱量を優先する。</p>
<h2>成り立ち</h2><p>1969年、ジョージア州メイコンで、Phil WaldenがFrank FenterとともにCapricorn Recordsを設立した。同年結成されたThe Allman Brothers Bandを看板バンドに据えたことが、このジャンルの最初期の中心的な拠点となった。

Duane Allmanは、すでにアラバマ州マッスル・ショールズのFAME Studiosで、Rick Hallのもと、数多くのソウルの録音に参加していた。彼は、黒人音楽の現場で培った演奏感覚を、ロックバンドへ持ち込んだ。人種隔離の記憶が生々しい時代に、白人と黒人の混成バンドが南部を巡業した。そのこと自体が政治的な意味を帯びていたと評されている（Mark Kempの評価）。

彼らは、弟のGregg Allmanのオルガンと歌、2人のドラマーによる複層的なリズム、そしてDuane Allmanのスライドギターを軸にした。1971年のライブ盤アット・フィルモア・イーストで、即興を主体とする南部ロックのひな型を完成させる。ただし、バンド側は「Southern rock」の呼称を拒んでいた。Dickey Bettsは「I hate the term 'Southern rock.'」と述べた。Gregg Allmanは、「rock rock」と同じで冗長だと述べている。

しかし、悲劇が続いた。同年10月にDuane Allmanがオートバイ事故で24歳で死亡した。翌1972年11月には、ベースのBerry Oakleyが、ほぼ同じ場所で同様の事故により死亡した。

もう一つの中心は、フロリダ州ジャクソンヴィルのLynyrd Skynyrdである。Ronnie Van Zantを中心に、3本のギターを擁した。1974年のスウィート・ホーム・アラバマで、Neil Youngが南部の人種差別を糾弾した楽曲への返答を行い、南部の誇りをめぐる論争を巻き起こした。曲そのものではなく、バンドは1970年代から2010年代まで、ステージで南軍旗を使い、批判を受けた（2012年にいったん撤去を表明したが撤回し、2018〜19年のフェアウェルツアー前後に使用をやめたとされる。資料により異なる）。1977年10月、Lynyrd Skynyrdは、ツアー中のチャーター機の墜落により、Ronnie Van Zant、Steve GainesとCassie Gainesの姉弟を失い、事実上の終焉を迎えた。

周辺には、The Marshall Tucker Band、The Outlaws、Blackfoot、.38 Specialが並んだ。テキサスのZZ Topは、ブルースをより簡素な形に切り詰めた。Charlie Daniels Bandは、1979年のジ・デヴィル・ウェント・ダウン・トゥ・ジョージアで、フィドルを主役にした。

1976年の大統領選に向けて、1975〜76年に、Allman BrothersやMarshall Tucker BandなどCapricorn系を中心に、ジョージア州出身のJimmy Carterを資金集めの公演で支援した。この音楽が、南部の政治的な自己主張と結びついていたことを示した。

1980年代に入ると、Capricorn Recordsの倒産（1979年末のChapter 11申請とする説と、1980年に破産とする説がある）と相次ぐ死によって、勢いを失う。しかし、1990年代以降は、ジャム・バンドやサザン・メタルなどに継承された。</p>
