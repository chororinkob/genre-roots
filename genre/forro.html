<h1>Forró（フォホー）とは</h1>
<p>フォホーは、19世紀末にブラジル北東部内陸（セルタォン）の農村部で生まれた、踊るための音楽だ。 最も伝統的な編成は、三つの楽器でできている。第一は、サンフォーナと呼ばれる蛇腹式の手風琴だ。旋律と和音の両方を受け持ち、その音色がその</p>
<p>フォホーは、19世紀末にブラジル北東部内陸（セルタォン）の農村部で生まれた、踊るための音楽だ。

最も伝統的な編成は、三つの楽器でできている。第一は、サンフォーナと呼ばれる蛇腹式の手風琴だ。旋律と和音の両方を受け持ち、その音色がそのまま音楽の顔になる。

第二は、ザブンバという両面太鼓だ。演奏者は肩掛けのストラップで、体の前に斜めに下げる。利き手の撥（maceta/maçaneta）で上の皮を、もう一方の手の細い棒（bacalhau）で下の皮を打つという、特殊な奏法を使う。この表と裏の打点のずれが、独特の跳ねを生む。

第三はトライアングルだ。絶え間なく細かい刻みを鳴らし、曲を前へ進める勢いを保つ。この三つで音の世界が作られる点が、この音楽の簡潔な美しさである。

和声（コードの響き）は、素朴な和声進行（主要和音の循環）が中心で、ミクソリディア旋法的な響きを含む。

フォホーの拍子は4拍子が基本とされる。バイアォンは2/4で記譜されることが多い。リズムはいくつかの型に分かれる。力強く踏み込むもの、より緩やかで抱き合って踊るもの、足を擦るように動かすものなどがあり、それぞれに合った踊りの型がある。テンポは中くらいから速めだ。

歌い方は素朴で、声の張りが強い。

歌詞は、干ばつ、故郷を離れる苦しみ、農村の暮らし、そして恋愛を扱う。方言や土地の言い回しが色濃く残っている。</p>
<h2>成り立ち</h2><p>舞台は、ブラジル北東部の内陸だ。セルタォンと呼ばれる半乾燥地帯で、自然は過酷である。

この地域は周期的に深刻な干ばつに見舞われた。干ばつなどを背景に、非常に多くの農民が土地を捨てた。彼らはリオデジャネイロやサンパウロといった南東部の大都市へ移り住み、差別と貧困に直面しながらも、故郷の音楽を持ち込んだ。

バイアォンを全国に広め、のちにフォホーと総称される音楽が固まるうえで、決定的な役割を果たしたのが、Luiz Gonzagaである。彼は1912年、ペルナンブーコ州の貧しい農家に生まれた。軍隊での経験を経てリオデジャネイロへ出たが、初めは都会風の音楽を演奏して芽が出なかった。

本人の回想によれば、転機は、リオで知り合ったセアラー州出身の学生たち（Armando Falcão ら）に、北東部の音楽を演奏するよう勧められたことだった。さらに、ラジオ・ナショナル（Rádio Nacional）で Pedro Raimundo に触発され、革の帽子と皮の衣装という北東部の牧童の装いで舞台に立つようになる。

1947年、作詞家Humberto Teixeiraとともに作った曲は、干ばつで故郷を追われる者の悲しみを歌ったものだった。この曲は国民的に愛されて歌われるようになり、移住者たちの気持ちを代わりに語るものとなった。彼はバイアォンと呼ばれるリズムの王と称され、北東部の文化を全国へ知らしめた立役者となる。

同じ時代には、Jackson do Pandeiroが、より軽快で言葉遊びに富んだ作風を打ち出した。その後、Dominguinhosが手風琴の演奏を磨き上げた。

この音楽は、六月に行われる伝統的な祭りと強く結びついており、その時期には全国で演奏される。

1990年代以降には、ドラムや電子鍵盤、エレキギターを使う商業的な形態(forró eletrônico)が現れた。都市部の中間層の学生を中心に、大学生層の形態(forró universitário)も広がった。

現在では、移住者とその子孫、さらに大学生など非北東部出身の若者を通じて、南東部の都市にも根を下ろした。フォホーは、ブラジル全土で踊られる音楽となっている。</p>
