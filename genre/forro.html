<h1>Forró（フォホー）とは</h1>
<p>ブラジル北東部の州都の周辺部と内陸の両方で生まれた、踊るための音楽である。最も伝統的な編成は、三つの楽器から成る。第一はサンフォーナと呼ばれる蛇腹式の手風琴で、旋律と和音の両方を担い、この楽器の音色がそのまま音楽の顔となる。第二は</p>
<p>ブラジル北東部の州都の周辺部と内陸の両方で生まれた、踊るための音楽である。最も伝統的な編成は、三つの楽器から成る。第一はサンフォーナと呼ばれる蛇腹式の手風琴で、旋律と和音の両方を担い、この楽器の音色がそのまま音楽の顔となる。第二はザブンバという両面太鼓で、演奏者は首から下げ、片手の撥（ばち）で表面を強く打ち、もう一方の手に持つ細い棒で裏面を叩くという特殊な奏法を用いる。この表と裏の打点のずれが、独特の跳ねを生む。第三はトライアングルで、絶え間なく細かい刻みを鳴らして、曲を前へ進める勢いを保つ。この三つで音の世界が作られる点が、この音楽の簡潔な美しさである。リズムはいくつかの型に分かれ、2拍子で力強く踏み込むもの、より緩やかで抱き合って踊るもの、足を擦るように動かすものなどがあり、それぞれに対応した踊りの型がある。テンポは中庸から速い。和声（コードの響き）は単純な三和音（三つの音を重ねた基本の和音）が中心で、旋法（音の並び方の型）的な響きを含む。歌唱は素朴で、声の張りが強い。歌詞は干ばつ、故郷を離れる苦しみ、農村の暮らし、そして恋愛を扱い、方言と土地の言い回しが色濃く残されている。</p>
<h2>成り立ち</h2><p>背景にあるのはブラジル北東部の内陸、セルタォンと呼ばれる半乾燥地帯の過酷な自然である。この地域は周期的に深刻な干ばつに見舞われ、そのたびに非常に多くの農民が土地を捨て、リオデジャネイロやサンパウロといった南東部の大都市へ移住してきた。彼らは差別と貧困に直面しながら、故郷の音楽を持ち込んだ。この音楽を全国的なものにしたのがLuiz Gonzagaである。1912年にペルナンブーコ州の貧しい農家に生まれた彼は、軍隊での経験を経てリオデジャネイロへ出るが、当初は都会風の音楽を演奏して芽が出なかった。本人の回想によれば、同郷者から自分の土地の音楽を演奏するよう促されたことが転機となり、革の帽子と皮の衣装という北東部の牧童の装いをまとって舞台に立つようになる。1947年、作詞家Humberto Teixeiraとともに作った楽曲は、干ばつによって故郷を追われる者の悲しみを歌ったもので、国民的に愛されて歌われる曲となり、移住者たちの気持ちを代わりに語るものとなった。彼はバイアォンと呼ばれるリズムの王と称され、北東部の文化を全国へ知らしめたいちばんの立役者となる。同時代にはJackson do Pandeiroが、より軽快で言葉遊びに富んだ作風を打ち出し、後にはDominguinhosが手風琴の演奏を磨き上げた。この音楽は六月に行われる伝統的な祭りと強く結びついており、その時期には全国で演奏される。1990年代以降、ドラムや電子鍵盤、エレキギターを使う商業的な形態(forró eletrônico)が現れ、都市部の中間層の学生を中心に、大学生層の形態(forró universitário)も広がった。現在では移住者の子孫を通じて南東部の都市にも根を下ろし、ブラジル全土で踊られる音楽となっている。</p>
<h2>代表曲</h2><ul><li>Anunciação (Alceu Valença)</li><li>Xote dos Milagres (Falamansa)</li><li>Pagode Russo (Luiz Gonzaga)</li><li>Frevo Mulher (Elba Ramalho)</li><li>Xote das Meninas (Luiz Gonzaga)</li><li>Esperando na Janela (Gilberto Gil)</li><li>Rindo à Toa (Falamansa)</li><li>Baião (Luiz Gonzaga)</li><li>O Canto da Ema (Jackson do Pandeiro)</li><li>Olha Pro Céu (Luiz Gonzaga)</li><li>Qui Nem Jiló (Luiz Gonzaga)</li><li>Eu Só Quero um Xodó (Dominguinhos)</li></ul>
