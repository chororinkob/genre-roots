<h1>Neue Deutsche Härte（ノイエ・ドイチェ・ヘルテ）とは</h1>
<p>ドイツ語圏で発展した、重いギターと電子音を組み合わせたロックの様式である。ノイエ・ドイチェ・ヘルテ、すなわち新しいドイツの硬さという意味の名を持つ。音の土台はメタル由来の低く歪ませたギターだが、演奏される内容は極めて単純で、複雑な</p>
<p>ドイツ語圏で発展した、重いギターと電子音を組み合わせたロックの様式である。ノイエ・ドイチェ・ヘルテ、すなわち新しいドイツの硬さという意味の名を持つ。音の土台はメタル由来の低く歪ませたギターだが、演奏される内容は極めて単純で、複雑な速弾きや変拍子はほとんど用いられない。代わりに、4分音符を機械のように正確に刻む反復が中心となる。この単純さと正確さが、工業的な冷たさを生む主要な手段である。そこにインダストリアル由来の電子音が重ねられる。合成された持続音、金属を打つ音、電子的な打楽器が層をなし、生の演奏と機械の音が意図的に区別しにくく混ぜられる。テンポは中庸で、一分間に120拍前後に保たれることが多い。歌唱はこの様式の最大の特徴で、ドイツ語で歌われることが原則である。しかも日常会話の発音ではなく、子音、とりわけ巻き舌のRを過剰に強調した演説調の発声が用いられる。これは意図的な誇張であり、ドイツ語という言語の硬質な響きそのものを楽器として扱う姿勢の表れである。歌詞は暴力、性、宗教、権威といった主題を、多義的な言葉遊びを交えて扱う。舞台演出も様式の一部で、火薬や機械仕掛けを大規模に用いる。</p>
<h2>成り立ち</h2><p>呼称の由来は、1980年前後の西ドイツで起きたノイエ・ドイチェ・ヴェレ、すなわちドイツ語で歌うニューウェーブの運動である。それまでドイツのロックは英語で歌うのが当然とされていたが、この運動によって母語で歌うことが選択肢として確立された。その硬質な後継という意味で、新しいドイツの硬さという名が付けられた。直接の音楽的な源流は複数ある。一つはインダストリアルで、ドイツのアインシュテュルツェンデ・ノイバウテンが金属音を音楽の素材とする手法を確立していた。もう一つはエレクトロニック・ボディ・ミュージックで、硬質な電子音を明確な拍の上に置く形が確立されていた。そこへメタルのギターが加わったのがこの様式である。決定的な役割を果たしたのが東ドイツ出身の音楽家たちだった。1989年のベルリンの壁崩壊と翌年の統一によって、旧東ドイツの若者は急速に西側の音楽と機材に触れることになる。同時に、それまでの体制と価値観が一夜にして無効になるという経験を共有していた。この断絶が、権威と暴力を主題にした表現の土壌になったとされる。中心となったのはラムシュタインで、1994年に結成された彼らのメンバーの多くが旧東ドイツ出身だった。1995年の最初の作品から一貫して、単純なギターの反復と演説調のドイツ語、そして火薬を多用した舞台演出を続けている。同時期にはエーミッヒシュタインやオオモフといった集団も活動した。この様式は当初から、ドイツ語の演説調の歌唱と軍事的な図像のために、政治的な誤解を招き続けてきた。ラムシュタイン自身は繰り返し全体主義への批判を表明しているが、言葉が分からない国外の聴衆には図像だけが伝わるという構造的な問題が残っている。1990年代末以降、彼らはドイツ語のまま世界的な成功を収め、母語で歌うことが国際的な障壁にならないことを実証した。</p>
