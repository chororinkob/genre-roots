<h1>Neue Deutsche Härte（ノイエ・ドイチェ・ヘルテ）とは</h1>
<p>ドイツ語圏で発展した、重いギターと電子音を組み合わせたロックの様式である。ノイエ・ドイチェ・ヘルテ、すなわち新しいドイツの硬さという意味の名を持つ。音の土台はメタル由来の低く歪ませたギターだが、ミッドテンポ（中くらいの速さ）のリフ</p>
<p>ドイツ語圏で発展した、重いギターと電子音を組み合わせたロックの様式である。ノイエ・ドイチェ・ヘルテ、すなわち新しいドイツの硬さという意味の名を持つ。音の土台はメタル由来の低く歪ませたギターだが、ミッドテンポ（中くらいの速さ）のリフ、パワーコード（2つの音を重ねた力強い和音）、パームミュート（弦を手のひらで軽く押さえて鳴らす奏法）、シンコペーション（拍の位置をずらす乗り）によるリズムの強調が中心となる。そこにインダストリアル（工場の機械音のような音楽）由来の電子音が重ねられる。エレクトロ・インダストリアルやテクノの要素が組み合わされる。テンポはミッドテンポ（中庸）のリフが中心である。ドイツ語で歌われることが多く、フィンランドのRuoskaやスウェーデンのRaubtierのように影響を受けつつ自国語で歌う例や、英語でも歌うOomph!のような例もある。歌唱は低い声域で、一音節ずつ強調し、巻き舌のRが多く、一部は語りに近い。巻き舌のRは、Rammsteinのヴォーカルが「低い声で歌ううちに自然にそうなった」と述べており、意図して作った誇張ではない。歌詞は愛・憎悪・嫉妬・性・宗教・死などを扱い、タブーに踏み込む題材が多い。</p>
<h2>成り立ち</h2><p>呼称の由来は、1980年前後の西ドイツで起きたノイエ・ドイチェ・ヴェレ、すなわちドイツ語で歌うニューウェーブの運動である。ドイツ語での歌唱をポスト・パンク/ニューウェーブの文脈で広く普及させたが、ドイツ語ロック自体は1970年代から存在した。1995年、Rammsteinの『Herzeleid』の発表後に、音楽プレスがNDWをもじって「新しいドイツの硬さ」と名付けた。Laibach、Die Krupps、Ministryなどと並行関係にあり、NDWやグルーヴメタル（ノリを重視した重いメタル）の影響を受けている。Rammsteinの中心メンバーは旧東ドイツ出身だが、NDH全体を東ドイツ出身者が主導したとは言えない。1989年のベルリンの壁崩壊と翌年の統一によって、旧東ドイツの若者は急速に西側の音楽と機材に触れることになる。ドラマーのSchneiderは、東ドイツで育った経験が、解釈の余地を残す表現や、誤解されやすさにつながっていると述べている。中心となったのはラムシュタインで、1994年に結成された彼らのメンバー6人は全員が旧東ドイツの生まれだった。初期から火薬を多用した舞台演出で知られ、歌はほぼドイツ語である。1990年代前半から半ば（1993〜95年ごろ）に、Oomph!(1994年のSperm)などを起点として形成され、Rammstein(1995年のHerzeleid)とともに様式の基礎が築かれた。Mühlmannらにより先駆的とされるバンドにFleischmann(1993年のFleischwolf)があり、Schweisserは同時期(1994年のEisenkopf)の存在である。この様式は特に1990年代後半以降、全体主義的・ナチス連想の美学をめぐる批判や、右翼ロック側による取り込みが起き、論争になってきた。Rammstein自身は、右翼やナチズムとの関連を繰り返し否定しており、左派と明言するメンバーの発言がある一方、左右の図式を相対化する発言もある。メンバーは、ナチス疑惑のような受け取り方は主にドイツ国内で起きると述べている。1996〜97年ごろから国外で注目され（映画『Lost Highway』のサウンドトラックへの採用や米国ツアー）、ほぼドイツ語のまま世界的な成功を収め、母語で歌うことが国際的な障壁にならないことを示したと言われる。</p>
