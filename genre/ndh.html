<h1>Neue Deutsche Härte（ノイエ・ドイチェ・ヘルテ）とは</h1>
<p>ノイエ・ドイチェ・ヘルテは、ドイツ語圏で発展した、重いギターと電子音を組み合わせたロックのスタイルだ。名前は、新しいドイツの硬さという意味を持つ。 音の土台は、メタル由来の低く歪ませたギターだ。ミッドテンポ（中くらいの速さ）主体の</p>
<p>ノイエ・ドイチェ・ヘルテは、ドイツ語圏で発展した、重いギターと電子音を組み合わせたロックのスタイルだ。名前は、新しいドイツの硬さという意味を持つ。

音の土台は、メタル由来の低く歪ませたギターだ。ミッドテンポ（中くらいの速さ）主体のリフ、パワーコード、パームミュートを使い、シンコペーション（拍の位置をずらす乗り）によるリズムの強調が中心となる。テンポはミッドテンポ（中庸）のリフが中心である。

そこに、インダストリアル（工場の機械音のような音楽）由来の電子音が重ねられる。エレクトロ・インダストリアルやテクノの要素を組み合わせる。

歌詞は、主にドイツ語（例外あり）だ。ジャンル全体の特徴としては、低い声域、1音節ずつの強調、巻き舌のRが多いこと、一部は語りに近い歌唱がある。巻き舌のRは、低音域で歌ううちに自然にそうなったものである。バンドは「ファシスト的な態度を作るつもりはなかった」と述べている。

歌詞の内容は、愛・憎悪・嫉妬・性・宗教・死などを扱う。タブーに踏み込む題材が多い。</p>
<h2>成り立ち</h2><p>呼称の由来は、1980年前後の西ドイツで起きた運動にある。ノイエ・ドイチェ・ヴェレ、すなわちドイツ語で歌うニューウェーブの運動だ。この運動は、ドイツ語での歌唱をポスト・パンク/ニューウェーブの文脈で広く普及させた。ただし、ドイツ語ロック自体は1970年代から存在した。

1995年、Rammsteinの『Herzeleid』の発表後に、音楽プレスがNDWをもじって、「新しいドイツの硬さ」と名付けた。Laibach、Die Krupps、Ministryなどと並行関係にあり、NDWやグルーヴメタル（ノリを重視した重いメタル）の影響を受けている。

1990年代前半〜半ば（1993〜95年ごろ）に、Oomph!(1994年のSperm)などを起点として形成された。Rammstein(1995年のHerzeleid)とともに、スタイルの基礎が築かれた。Fleischmann(1993年のFleischwolf)はMühlmannらにより先駆的とされ、Schweisserは同時期（1994年『Eisenkopf』）の存在である。

Rammsteinの中心メンバーは旧東ドイツ出身だが、NDH全体を東ドイツ出身者が主導したとは言えない。1989年のベルリンの壁崩壊と翌年の統一によって、旧東ドイツの若者は急速に西側の音楽と機材に触れることになる。Schneiderは、東ドイツでの成長が、解釈の余地を残す表現に結びついていると述べている。

中心となったのはラムシュタインだ。1994年に結成された彼らは、メンバー6人全員が旧東ドイツ出身だった。初期から火を多用した演出で知られ、歌はほぼドイツ語である。

しかし、特に1990年代後半以降、全体主義的・ナチス連想の美学をめぐる批判が起きた。右翼ロック側による取り込みも起き、論争になった。Rammstein自身は、右翼やナチズムとの関連を繰り返し否定している。左派と明言する発言がある一方、左右の図式を相対化する発言もある。Rammsteinのメンバーは、ナチス疑惑は主にドイツ国内で起きると述べている。

1996〜97年以降、彼らはほぼドイツ語のまま世界的な成功を収めた。母語で歌うことが国際的な障壁にならないことを実証したと評される。</p>
