<h1>Afro House（アフロハウス）とは</h1>
<p>ハウスの四つ打ちの構造に、アフリカ系の打楽器と歌の伝統を全面的に取り込んだダンス音楽だ。 低音は深く丸い音で、余韻が長い。拍の隙間を埋めるように動く。和音はジャズやソウルに由来する豊かな響きを持つ。電気ピアノや弦楽を模した音が、長</p>
<p>ハウスの四つ打ちの構造に、アフリカ系の打楽器と歌の伝統を全面的に取り込んだダンス音楽だ。

低音は深く丸い音で、余韻が長い。拍の隙間を埋めるように動く。和音はジャズやソウルに由来する豊かな響きを持つ。電気ピアノや弦楽を模した音が、長く伸ばされる。

テンポは資料により100〜125 BPM前後と幅があり、ハウスとしてはやや遅い。キックは四つ打ちを保つが、この分野の本領は、その周りに敷かれる打楽器の層にある。キューバ起源のコンガ、ジェンベ（西アフリカの手で叩く太鼓）、シェイカー、木を打つ音などが、それぞれ異なる周期で刻まれる。互いにずれながら噛み合うことで、単純な四つ打ちの上に複雑な網目が作られる。これらは打ち込みではなく、実演奏の素材が使われることもある。その細かな揺れが、機械的な均質さを破る。

声の扱いも独特だ。歌い上げるより、詠唱のように短い語句を繰り返す形が好まれる。言葉には、例えばズールー語やコサ語、ポルトガル語、あるいは造語が用いられる。意味よりも響きとして働くこの声が、儀式的な高揚を生む。

DJでの使用を想定した、長めの曲が多い。要素を少しずつ入れ替えながら、催眠的に続いていく構成を取る。</p>
<h2>成り立ち</h2><p>舞台は南アフリカだ。ここは、ハウスが深く根付いた国である。この音は南アフリカで1990年代に形成されたとされる（単一の確定した発祥地はない）。

1980年代後半に流入したハウスは、アパルトヘイト（人種隔離政策）末期から1990年代初頭にかけて、若い黒人層の間に広く浸透した。それは単なる輸入ではなかった。現地の音楽的な感覚と結びつき、独自の形へ変化していく。1990年代には、ハウスの速度を落として現地の言葉を乗せたクワイトが、アパルトヘイト後の世代を代表する音楽となった。2000年代になると、より国際的な音を目指す世代が現れる。この音を国際的に広めた代表的存在が、Nkosinathi Maphumuloである。

Black Coffeeの名で知られる彼は、ダーバン(ウムラジ)で生まれ、東ケープ州ムタタで育った。1990年2月、Nelson Mandelaの釈放を祝う群衆に車が突っ込み、彼は左腕の神経を損傷する。それでも、片手だけでレコードを操作する彼の姿は、後に国際的な舞台で広く知られることになる。彼は南アフリカの打楽器とハウスを結合させた作風で、国内の頂点に立った。2009年の『Home Brewed』などで国際的に注目され、2022年にはアメリカの主要な音楽賞を受賞している。

並行して、アンゴラでもこの音楽は広まった。中央アフリカ共和国出身のBoddhi Satvaは、アフリカ各地の音楽とハウスを結ぶ作風を、Ancestral Soulと名付けた。南アフリカのCuloe De Song、Da Capo、Black Motionといった作り手が続く。ヨーロッパでは、英国のロンドンなどでこの音が受け入れられた。

しかし、この分野の広がりには、経済的な非対称も伴っている。アフリカの制作者が作った音が国際市場で消費される一方、その収益や機会が欧州のツアーDJやレーベル側に偏りがち、との指摘がある。

2010年代半ばには、南アフリカのハウテン州のタウンシップ周辺で、アマピアノというスタイルが生まれたとされる（発祥には諸説ある）。これは2019年頃からアフリカ大陸で、2020年代に世界的に広まった。</p>
