<h1>Afro House（アフロハウス）とは</h1>
<p>ハウスの四つ打ちの構造に、アフリカ大陸の打楽器と歌の伝統を全面的に取り込んだダンス音楽である。テンポは概ね115から125 BPMと、ハウスとしてはやや遅い。キックは四つ打ちを保つが、この分野の本領はその周囲に敷かれる打楽器の層に</p>
<p>ハウスの四つ打ちの構造に、アフリカ大陸の打楽器と歌の伝統を全面的に取り込んだダンス音楽である。テンポは概ね115から125 BPMと、ハウスとしてはやや遅い。キックは四つ打ちを保つが、この分野の本領はその周囲に敷かれる打楽器の層にある。コンガ、ジェンベ、シェイカー、木を打つ音などが、それぞれ異なる周期で刻まれ、互いにずれながら噛み合うことで、単純な四つ打ちの上に複雑な網目が作られる。これらは打ち込みではなく実際に演奏された録音が用いられることも多く、その微細な揺れが機械的な均質さを破る。低音は深く丸い持続音で、拍の隙間を埋めるように動く。和音はジャズやソウル由来の豊かな響きを持ち、電気ピアノや弦楽を模した音が長く伸ばされる。声の扱いも独特で、歌い上げるより、詠唱のように短い語句を反復する形が好まれ、ズールー語やコサ語、ポルトガル語、あるいは造語が用いられる。この、意味よりも響きとして機能する声が、儀式的な高揚を生む。曲は7分から10分と長く、要素を少しずつ入れ替えながら催眠的に持続する構成を取る。</p>
<h2>成り立ち</h2><p>南アフリカは、世界でも有数のハウス消費国である。1994年のアパルトヘイト体制の終焉後、若い黒人層の間でハウスが爆発的に受容され、それは単なる輸入ではなく、現地の音楽的な感覚と結びついて独自の形へ変化した。1990年代にはハウスの速度を落として現地の言葉を乗せたクワイトが国民的な音楽となり、2000年代にはより国際的な音を志向する世代が現れる。その中心となったのがNkosinathi Maphumuloである。Black Coffeeの名で知られる彼は、ダーバン近郊で育ち、1990年、獄中から解放されたNelson Mandelaを歓迎する集会の場で自動車事故に遭い、左腕の自由を失った。片手だけでレコードを操作する彼の姿は、後に国際的な舞台で広く知られることになる。彼は南アフリカの打楽器とハウスを結合させた作風で国内の頂点に立ち、2000年代後半から国際的な評価を得て、2022年にはアメリカの主要な音楽賞を受賞した。並行して、アンゴラおよびポルトガル語圏では別の系統が発達する。中央アフリカ共和国出身のBoddhi Satvaは、この地域の音楽とハウスを結ぶ実践を体系化し、自らの作風に固有の呼称を与えた。南アフリカのCuloe De Song、Da Capo、Black Motionといった作り手が続き、ヨーロッパではベルリンやパリのクラブがこの音を受け入れた。この分野の広がりには、経済的な非対称も伴っている。すなわち、アフリカの制作者が作った音が国際市場で消費される一方、その収益や機会の多くはヨーロッパの流通側に留まるという構造である。この問題は当事者から繰り返し提起されてきた。2020年代に入ると、南アフリカからさらにアマピアノという新しい様式が生まれ、世界的な流行となっている。</p>
