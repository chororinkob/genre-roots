<h1>Yacht Rock（ヤットロック）とは</h1>
<p>ヨットロックは、1970年代半ばから1980年代半ばにかけて、アメリカ西海岸で作られた、とてもなめらかで洗練された大人向けのロックを指す呼び名だ。 楽器では、Rhodesなどの電気ピアノ（WurlitzerやRhodes）が多用さ</p>
<p>ヨットロックは、1970年代半ばから1980年代半ばにかけて、アメリカ西海岸で作られた、とてもなめらかで洗練された大人向けのロックを指す呼び名だ。

楽器では、Rhodesなどの電気ピアノ（WurlitzerやRhodes）が多用される。その丸く柔らかい音色が、全体の質感を決めている。ギターは歪ませず、単音の澄んだ音で装飾を加えることが多い。ベースは指弾きの滑らかな音で、よく動き回ることが多い。

和音の豊かさは、特徴の一つだ。三和音に加え、長七、九、11といった付加音を含む和音や、ジャズのように次々と雰囲気が変わる和音の流れが使われる。この響きには、制作者の多くが持つジャズの素養のほか、R&amp;B、スムース・ソウル、ディスコなどの影響もある。

ドラムは音量を抑え、シンバルの余韻を丁寧に扱うとされる。拍の裏を細かく刻む、跳ねたリズムが多用される。テンポは曲によって幅があり、全体に穏やかだと評されることが多い。

歌は、複数の声を精密に重ねる。音程の乱れが少ない状態まで、磨き上げられる。

歌詞は航海のモチーフを使う例が多く（Cross「Sailing」など）、感情の起伏は抑制されていると評されることが多い。

録音の水準は、当時の技術の最高峰にあると評されることが多い。演奏には、一流のプロの演奏家が起用された。誰も汗をかいていないように聞こえることが、この音楽の美学だと評されることが多い。</p>
<h2>成り立ち</h2><p>この呼び名が生まれたのは、音楽が作られた時代ではない。はるか後年の2005年のことだ。アメリカのJD Ryznarらが制作した短編の連続動画が、当時の制作者たちをおもしろおかしく描いた。その中で、ヨットに似合う音楽という意味の造語を用いたことが、きっかけだった。つまりこれは、後から与えられた、半ば冗談めいた分類である。

しかし、対象となる音楽自体は、真剣に作られたものだった。1970年代半ばのロサンゼルスには、ジャズやセッションの現場で鍛えられた、極めて高い技量の演奏家が集まっていた。彼らが複数の企画を掛け持ちしながら、録音を支えていた。

Steely DanのDonald FagenとWalter Beckerは、しばしばヨットロックの代表格に数えられるが、本人たちは同一視を好まない。2人は、演奏の完璧さを求めて何十人もの演奏家を試し、納得するまで録り直すという、極端な制作方法を採った。1977年の作品エイジャで、ジャズの和声とポップスの構造を高度に統合した。

Michael McDonaldは、The Doobie Brothersに加入して、その特徴的な太い歌声と鍵盤で音楽性を一変させた。1979年のホワット・ア・フール・ビリーヴスは、全米1位を獲得した。

1979年12月発売（1980年発売とする資料もある）のデビュー作と、1980年のシングルのセイリングで、Christopher Crossは1981年のグラミー賞の主要4部門を独占した。これは史上初の成功だった。1982年に発売されたTotoのアフリカは、1983年2月に全米1位となり、世界的な大ヒットとなった。

同バンドのJeff Porcaroは、Bernard PurdieのPurdie Shuffleなどを組み合わせて、独自のドラムの叩き方を発展させた。半分の速さの中に、細かい跳ねを詰め込む叩き方だ。後に無数の演奏者が研究する題材となっている。

後年、ヨットロックとして揶揄の対象になった。皮肉なことに、2010年代半ば以降に再評価が進んだ。日本のシティポップとの類縁性が指摘されたり、1980年代末から、ヒップホップ制作者がSteely DanやHall &amp; Oatesなどを継続的にサンプリングしてきたりしたことで、当初の嘲笑を含んだ呼び名が、今では愛着のこもった呼び名として定着している。</p>
