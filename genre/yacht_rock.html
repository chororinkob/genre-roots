<h1>Yacht Rock（ヤットロック）とは</h1>
<p>1970年代後半から1980年代前半にかけて、アメリカ西海岸で作られた、極めて滑らかで洗練された大人向けのロックを指す呼び名である。和声の豊かさが最大の特徴で、単純な三和音はほとんど使われず、長七、九、11といった付加音を含む和音</p>
<p>1970年代後半から1980年代前半にかけて、アメリカ西海岸で作られた、極めて滑らかで洗練された大人向けのロックを指す呼び名である。和声の豊かさが最大の特徴で、単純な三和音はほとんど使われず、長七、九、11といった付加音を含む和音や、ジャズのように次々と色を変える進行が用いられる。この響きは、制作者の多くがジャズの素養を持っていたことに由来する。楽器ではFender Rhodesの電気ピアノが中心的な役割を果たし、その丸く柔らかい音色が全体の質感を決めている。ギターは歪ませず、単音の澄んだ音で装飾を加え、ベースは指弾きの滑らかな音で動き回る。ドラムは音量を抑え、シンバルの余韻を丁寧に扱い、拍の裏を細かく刻む跳ねたリズムが多用される。テンポは80から115 BPM程度と穏やかである。歌は複数の声を精密に重ね、音程の乱れが一切ない状態まで磨き上げられる。歌詞は恋愛の機微や別れ、海や航海の比喩を扱い、感情の起伏は抑制されている。録音の水準は当時の技術の最高峰にあり、演奏には第一線の職業演奏家が起用された。誰も汗をかいていないように聞こえることが、この音楽の美学である。</p>
<h2>成り立ち</h2><p>この呼び名が生まれたのは音楽が作られた時代ではなく、はるか後年の2005年である。アメリカのJD Ryznarらが制作した短編の連続動画が、当時の制作者たちを戯画化して描き、その中でヨットに似合う音楽という意味の造語を用いたことがきっかけだった。つまりこれは、後から与えられた半ば冗談めいた分類である。しかし対象となる音楽自体は真剣に作られたものだった。1970年代半ばのロサンゼルスには、ジャズやセッションの現場で鍛えられた極めて高い技量の演奏家が集まっており、彼らが複数の企画を掛け持ちしながら録音を支えていた。Steely DanのDonald FagenとWalter Beckerは、演奏の完璧さを求めて何十人もの演奏家を試し、納得するまで録り直すという極端な制作方法を採り、1977年の作品エイジャで、ジャズの和声とポップスの構造を高度に統合した。Michael McDonaldはThe Doobie Brothersに加入して、その特徴的な太い歌声と鍵盤で音楽性を一変させ、1979年のホワット・ア・フール・ビリーヴスは全米1位を獲得した。1980年にはChristopher Crossがセイリングを含む作品で、翌年の主要な賞を独占するという前例のない成功を収める。1982年にはTotoのアフリカが世界的な大ヒットとなった。同バンドのJeff Porcaroが編み出した、半分の速さの中に細かい跳ねを詰め込む独特のドラムの叩き方は、後に無数の演奏者が研究する題材となっている。当時、この種の音楽は批評家から、無害で退屈で企業的だと軽んじられ、パンクやニューウェイヴの側からは打倒すべき敵と見なされていた。皮肉なことに、2000年代以降になってこの職人的な精度と和声の豊かさが再評価され、日本のシティポップとの類縁性が指摘されたり、ヒップホップの制作者が素材として掘り起こしたりすることで、当初の嘲笑を含んだ呼び名が、今では愛着を込めた呼称として定着している。</p>
<h2>代表曲</h2><ul><li>Sailing（Christopher Cross）</li><li>What a Fool Believes（The Doobie Brothers）</li><li>Rosanna（Toto）</li><li>Peg（Steely Dan）</li><li>Kiss on My List（Hall &amp; Oates）</li></ul>
