<h1>Dream Pop（ドリームポップ）とは</h1>
<p>ドリーム・ポップは、残響と持続音による霞んだ音響の中に、甘い旋律と歌声を浮かべるスタイルだ。 ギターにはリヴァーブ、ディレイ、コーラス、フランジャー（いずれも残響・遅延・揺らぎなどの効果）が多用される。そのため音の輪郭が溶けて、背</p>
<p>ドリーム・ポップは、残響と持続音による霞んだ音響の中に、甘い旋律と歌声を浮かべるスタイルだ。

ギターにはリヴァーブ、ディレイ、コーラス、フランジャー（いずれも残響・遅延・揺らぎなどの効果）が多用される。そのため音の輪郭が溶けて、背景と区別できなくなる。リヴァーブ、エコー、トレモロ(エフェクト)、コーラスなどを多用し、リフよりテクスチャー重視である。鍵盤はパッド（持続する背景の音）、すなわち立ち上がりの遅い持続音を担う。ベースは、低音の輪郭を保ちつつ和声の底を支える。

ドラムは軽く、時に打ち込みが用いられる。リズムより空間の広がりが優先される。テンポは遅めのものが多く、拍の存在感は薄い。

最大の特徴は歌の扱いだ。息の多い(ブレシーな)声が用いられることが多く、囁くように、あるいは息を多く含む発声で歌われる。ミックスでは、楽器と同じ層に沈められる。歌詞は聴き取れないことも多く、意味より音としての響きが重視される。

シューゲイザーが轟音による圧を伴うのに対し、ドリーム・ポップは音量を抑えた甘さと浮遊感を主とする点で区別する見方がある。ただし、時期や地域によっては互換的に使われ、米国ではドリーム・ポップがシューゲイザーの呼び名でもあったとされる。</p>
<h2>成り立ち</h2><p>語の起源は1980年代後半だ。Alex AyuliとRudy Tambalaの2人組A.R. Kaneの、主にAyuliが造語したとされるが、Tambalaは2人で作ったと語っている。

しかし、スタイルの先駆けとされるのはスコットランドのCocteau Twinsである。1979年に結成された彼らは、Robin Guthrieのエフェクターを重ねたギターと、Elizabeth Fraserの歌唱を軸とした。初期〜中期の作品では、造語や外国語由来の語を含め、識別しにくい歌唱が多かった。後期には英語で聴き取れる作品もある。

レーベル4ADは、デザイナーVaughan Oliverによる幻想的なジャケットを通じて、この美学を視覚的にも規定した。1980年代を通じて、This Mortal Coil、Dead Can Danceといった同レーベルの作家群が、共通の質感を共有した。並行して、The Durutti ColumnのVini Reillyが、1980年前後にMartin Hannettのプロデュース下で、ディレイやリヴァーブを伴う繊細なギターを作った。Cocteau Twinsは、Brian Enoと親交があり、アンビエントの音楽家Harold Buddと共作した。

1990年前後、この美学はシューゲイザーと交差した。Slowdive、Lush、Pale Saintsといったバンドが、両方の性格を持つ作品を発表した。

米国側では、Mazzy StarがHope Sandovalの気だるい歌声により、1993年発表のFade into Youが1994年にヒットして、商業的な成功を収めた。Galaxie 500と、その元メンバーDean Warehamが結成したLunaは、ゆっくりした反復による独自の系譜を作った。

2000年代後半以降、このスタイルは再び広く採用され、Beach House、Grouper、Cigarettes After Sexらが新しい世代を形成した。とりわけBeach Houseは、2004年にボルティモアで結成された。Victoria LegrandとAlex Scallyの2人を中核とし、2022年にJames Baroneが正式加入した。作品ごとに生ドラムの比重や電子音の度合いを変え、『Once Twice Melody』では生の弦も用いた。2000年代後半以降、Beach Houseなどを通じて再び人気を得た。</p>
