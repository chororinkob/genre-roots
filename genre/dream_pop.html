<h1>Dream Pop（ドリームポップ）とは</h1>
<p>残響と持続音による霞んだ音響の中に、甘い旋律と歌声を浮かべる様式。ギターにはリヴァーブ、ディレイ、コーラス、フランジャーが同時にかけられ、音の輪郭が溶けて背景と区別できなくなる。奏法はかき鳴らしより、和音を長く伸ばすアルペジオや、</p>
<p>残響と持続音による霞んだ音響の中に、甘い旋律と歌声を浮かべる様式。ギターにはリヴァーブ、ディレイ、コーラス、フランジャーが同時にかけられ、音の輪郭が溶けて背景と区別できなくなる。奏法はかき鳴らしより、和音を長く伸ばすアルペジオや、単音を反復させるトレモロが好まれる。鍵盤はパッド、すなわち立ち上がりの遅い持続音を担い、ベースは低音の輪郭を保ちつつ和声の底を支える。ドラムは軽く、時に打ち込みが用いられ、リズムより空間の広がりが優先される。BPMは70〜110と遅めで、拍の存在感は薄い。和声は長調と短調の境が曖昧で、七度や九度を含む浮遊した響きが多用され、明確な解決を避けることで漂う感覚を作る。最大の特徴は歌の扱いで、女性の声が用いられることが多く、囁くように、あるいは息を多く含む発声で歌われ、ミックスでは楽器と同じ層に沈められる。歌詞は聴き取れないことも多く、意味より音としての響きが重視される。シューゲイザーが轟音による圧を伴うのに対し、ドリーム・ポップは音量を抑えた甘さと浮遊感を主とする点が異なる。</p>
<h2>成り立ち</h2><p>語の起源は1980年代半ばで、Alex Ayuli率いるイギリスのバンドA.R. Kaneが、自らの音楽を説明する言葉として用いたのが最初期の例とされる。しかし様式そのものを決定づけたのはスコットランドのCocteau Twinsである。1979年に結成された彼らは、Robin Guthrieのエフェクターを重ねたギターと、Elizabeth Fraserの実在しない言語による歌唱によって、意味を持たない声を楽器として用いる方法を確立した。レーベル4ADは、デザイナーVaughan Oliverによる幻想的なジャケットを通じて、この美学を視覚的にも規定した。1980年代を通じて、This Mortal Coil、Dead Can Danceといった同レーベルの作家群が、共通の質感を共有した。並行して、The Durutti ColumnのVini Reillyが、1980年前後にギターのディレイによる繊細な音の織物を作り、Brian Enoが提唱したアンビエントの発想も背景にある。1990年前後、この美学はシューゲイザーと交差し、Slowdive、Lush、Pale Saintsといったバンドが両方の性格を持つ作品を発表した。米国側では、Mazzy StarがHope Sandovalの気だるい歌声により1993年のFade into Youで商業的な成功を収め、Galaxie 500とその後継であるLunaが、ゆっくりした反復による独自の系譜を作った。2000年代後半以降、この様式は再び広く採用され、Beach House、Grouper、Cigarettes After Sexらが新しい世代を形成した。とりわけBeach Houseは、単純な機材による限定された音色を貫くことで、独自の位置を保っている。現在では、質感を主役に据えるという発想はポップス全般に浸透しており、ジャンルの境界としてよりも、音の作り方の一つの選択肢として定着している。</p>
