<h1>Dream Pop（ドリームポップ）とは</h1>
<p>残響と持続音による霞んだ音響の中に、甘い旋律と歌声を浮かべる様式。ギターにはリヴァーブ、ディレイ、コーラス、フランジャー（いずれも残響・遅延・揺らぎなどの効果）などが多用され、音の輪郭が溶けて背景と区別できなくなる。リフよりも音色</p>
<p>残響と持続音による霞んだ音響の中に、甘い旋律と歌声を浮かべる様式。ギターにはリヴァーブ、ディレイ、コーラス、フランジャー（いずれも残響・遅延・揺らぎなどの効果）などが多用され、音の輪郭が溶けて背景と区別できなくなる。リフよりも音色や質感（テクスチャー）が重視され、トレモロ（音を細かく震わせる効果）などのエフェクトが使われる。鍵盤はパッド（持続する背景の音）、すなわち立ち上がりの遅い持続音を担い、ベースは低音の輪郭を保ちつつ和声の底を支える。ドラムは軽く、時に打ち込みが用いられ、リズムより空間の広がりが優先される。テンポは遅めのものが多く、拍の存在感は薄い。歌の扱いにも特徴があり、囁くように、あるいは息を多く含む発声が多い（女性の声が目立つのは、隣接するエセリアル・ウェイヴ由来の傾向とされる）。ミックスでは楽器と同じ層に沈められる。歌詞は聴き取れないことも多く、意味より音としての響きが重視される。シューゲイザーが轟音による圧を伴うのに対し、ドリーム・ポップは音量を抑えた甘さと浮遊感を主とする点で区別する見方があるが、時期や地域によっては互換的に使われ、1990年代の米国ではドリーム・ポップがシューゲイザーの呼び名でもあった。</p>
<h2>成り立ち</h2><p>語の起源は1980年代後半で、Alex AyuliとRudy Tambalaの2人組A.R. Kaneの、主にAyuliが用いたとされるが、Tambalaは2人で作った言葉と語っている。しかし様式の先駆けとされるのはスコットランドのCocteau Twinsである。1979年に結成された彼らは、Robin Guthrieのエフェクターを重ねたギターと、Elizabeth Fraserの、造語や外国語の本から見つけた語を含む、聴き取りにくい歌唱によって、声を楽器のように用いる方法で知られる。初期から中期の作品に多く、後期には英語で聴き取れる作品もある。レーベル4ADは、デザイナーVaughan Oliver（1980〜88年は写真家Nigel Griersonと組む23 Envelope名義）による幻想的なジャケットを通じて、この美学を視覚的にも規定した。1980年代を通じて、This Mortal Coil、Dead Can Danceといった同レーベルの作家群が、共通の質感を共有した。並行して、The Durutti ColumnのVini Reillyが、1980年前後にMartin Hannettのプロデュースのもとで、ディレイやリヴァーブを伴う繊細なギターの音の織物を作った。また、Cocteau Twinsは1984年にBrian Enoと会い、アンビエントの音楽家Harold Buddとも共作するなど、アンビエントとの接点があった。1990年前後、この美学はシューゲイザーと交差し、Slowdive、Lush、Pale Saintsといったバンドが両方の性格を持つ作品を発表した。米国側では、Mazzy StarがHope Sandovalの気だるい歌声により1993年発表のFade into Youが1994年にヒットして商業的な成功を収め、Galaxie 500と、その元メンバーDean Warehamが結成したLunaが、ゆっくりした反復による独自の系譜を作った。2000年代後半以降、この様式は再び広く採用され、Beach House、Grouper、Cigarettes After Sexらが新しい世代を形成した。とりわけ2004年にボルティモアで結成されたBeach Houseは、Victoria LegrandとAlex Scallyを中核とし（2022年にJames Baroneが正式加入した）、作品ごとに生ドラムの比重や電子音の度合いを変え、2022年の『Once Twice Melody』では生の弦も用いながら、独自の位置を保っている。2000年代後半以降、Beach Houseなどを通じて、ミレニアル世代の間で再び人気を得た。</p>
