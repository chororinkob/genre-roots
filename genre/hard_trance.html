<h1>Hard Trance（ハードトランス）とは</h1>
<p>ハードトランスは、トランスの構造を保ちながら、キック(バスドラム)の重さと、音色の攻撃的な感じを大きく引き上げた音楽だ。 掃除機の唸りに例えられる独特の合成音(フーバー)は、トランスやハードハウスなどで使われる音色だ。これはレイヴ</p>
<p>ハードトランスは、トランスの構造を保ちながら、キック(バスドラム)の重さと、音色の攻撃的な感じを大きく引き上げた音楽だ。

掃除機の唸りに例えられる独特の合成音(フーバー)は、トランスやハードハウスなどで使われる音色だ。これはレイヴ・テクノやハードコア、ガバなど多くのジャンルでも使われ、この分野だけのものではない。もとは1980年代のシンセサイザーに入っていた特定の音色だ。いくつもの音の波が唸りを立てながら重なる分厚い音で、和音として鳴らすと轟音に近い迫力が出る。

加えて、共振の鋭いフィルターを持つ低音の合成音もよく使われる。酸っぱさのある、ぐるぐる回るような音の動きを作る音だ。

テンポは概ね140から180 BPMと速い。キックは短く硬く潰される。ベースは共鳴する低音である。

代表曲の「U (I Got A Feeling)」は、歌のフレーズ「I've got a feeling」が曲の核である。

曲の組み立ては、トランスの決まった型に従う。音を積み上げ、リズムを落とす区間を経て、小太鼓の連打で緊張を高め、最後に解き放つ。</p>
<h2>成り立ち</h2><p>ハードトランスは、1990年代前半に、ベルギー・ドイツ・オランダでほぼ同時に成立した。

フランクフルトを中心に定着したトランスは、当初、催眠的で反復的な音楽だった。しかし、次第に硬く速い方向へ引っ張られていく。その中で、より攻撃的な音を求める一群が、独立した分野をつくった。土台はトランス、ハードハウス、アシッド・トランス、ニュービート、ブレイクビーツ・ハードコアである。

頂点は1990年代後半である。ドイツのKai Tracidは、自らTracid Traxxxというレーベルを構えた。酸味のある旋回する低音と硬いキックを組み合わせた作品で、この分野の代表格となった。

同じくドイツのDJ Scot Projectは、ハードトランスのディージェイであり、制作者でもある。代表曲の多くは、アルファベット1文字に括弧書きの副題を添えた題名(例：「U (I Got A Feeling)」)を持つ。

ベルギーのレーベルBonzai Recordsは、トランス、ハードトランス、ゴアトランス、レイヴ、ハードコアを専門とした。日本のYoji Biomehanikaは、1990年代に日本のクラブシーンで知られた。2001年のオランダのDance Valley出演以降は、欧州の大型フェスにも出演した。

この分野の広がりには、ヨーロッパ各地の大規模な屋内イベントが大きな役割を果たした。1993〜97年には、こうした数千人規模のイベントが、ヨーロッパ本土で人気だった。

一方、2000年代半ばには流行が一巡し、より旋律的なトランスや、ハードスタイルへ主流が移っていく。とりわけハードスタイルは、1990年代後半にオランダ・ベルギー・イタリアで登場し、この分野の要素(リバース・ベースなど)を受け継いだ流れの一つである。その起源は一つに特定できず、テクノやニュービート、ハードコアの影響も受けている。</p>
