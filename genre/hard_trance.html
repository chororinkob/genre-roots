<h1>Hard Trance（ハードトランス）とは</h1>
<p>トランスの構造を保ちながら、キックの重さと音色の攻撃性を大幅に引き上げた形式である。テンポは概ね140から150 BPMと速い。キックは短く硬く潰され、その直後の裏拍に、切り詰められたベース音が置かれる。この、拍の頭と裏を交互に埋</p>
<p>トランスの構造を保ちながら、キックの重さと音色の攻撃性を大幅に引き上げた形式である。テンポは概ね140から150 BPMと速い。キックは短く硬く潰され、その直後の裏拍に、切り詰められたベース音が置かれる。この、拍の頭と裏を交互に埋める配置が絶え間ない前進の感覚を作り、身体を上下に動かすことを強いる。この分野を最も明確に特徴づけるのが、掃除機の唸りに例えられる特有の合成音である。これは1980年代のシンセサイザーに搭載されていた特定の音色に由来し、複数の波形が唸りを伴って干渉する分厚い音で、和音として鳴らされると轟音に近い迫力を持つ。加えて、共振の鋭いフィルターを備えた低音の合成音による、酸味を帯びた旋回する音型が多用される。構成はトランスの定型に従い、積み上げ、リズムを落とす区間、小太鼓の連打による緊張の高まり、そして解放という流れを取るが、その解放される音が旋律ではなく音圧である点が異なる。和声は短調が中心で、不吉さと高揚が同居する。歌はほとんど用いられず、用いられても短い叫びや効果音的な断片に留まる。</p>
<h2>成り立ち</h2><p>1990年代前半のドイツは、電子ダンス音楽の一大生産地だった。フランクフルトを中心に確立したトランスは当初、催眠的で反復的な音楽だったが、同じ国のガバやハードコアテクノとの近接によって、次第に硬く速い方向へ引っ張られていく。この過程で、より攻撃的な音を求める一群が独立した領域を形成した。1990年代後半がその頂点である。ドイツのKai Tracidは、自らTracid Traxxxというレーベルを構え、酸味のある旋回する低音と硬いキックを組み合わせた作品で、この分野の代表格となった。同じくドイツのDJ Scot Projectは、極めて速く容赦のない作風で知られ、その楽曲は数字と記号だけの題名を持つという独特の様式でも知られる。ベルギーのBonzaiというレーベルは、この地域の硬いトランスの中心的な流通経路となった。日本ではYoji Biomehanikaが、この様式を独自に消化して国際的に活動し、アジアにおけるハードトランスの存在感を示している。この分野の広がりには、ヨーロッパ各地の大規模な屋内催しが大きな役割を果たした。数千人から数万人を収容する会場で、複数の会場を使い分けて一晩中演奏を続けるという形式が確立し、そこでの最も激しい時間帯を担う音楽として、この様式は機能した。2000年代前半には流行が一巡し、より旋律的なトランスや、ハードスタイルへ主流が移っていく。とりわけオランダで発達したハードスタイルは、この分野のキックの設計をさらに推し進めたものであり、直接の後継といえる。批判としては、音が単調で耳への負担が大きいこと、そして薬物の使用と不可分に語られてきたことが挙げられる。それでも、この時期に磨かれたキックと低音の設計技術は、その後のハードダンス全般の基礎となっている。</p>
