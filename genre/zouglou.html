<h1>Zouglou（ズーグルー）とは</h1>
<p>ズーグルーは、コートジボワールの最大都市アビジャンで生まれた、打楽器と合唱を軸とする音楽だ。 編成の中心は打楽器である。複数の太鼓に、瓶や金属を叩く音が重なり合い、ベテ人のalloucouを土台にした多層的な（ポリリズムの）リズム</p>
<p>ズーグルーは、コートジボワールの最大都市アビジャンで生まれた、打楽器と合唱を軸とする音楽だ。

編成の中心は打楽器である。複数の太鼓に、瓶や金属を叩く音が重なり合い、ベテ人のalloucouを土台にした多層的な（ポリリズムの）リズムを作る。スタジオで録音されるようになると、ギター、ベース、キーボード、ホーンなどが加わった。スタジオ録音の初期（1990年代前半）からシンセサイザーなども取り入れられ、のちにドラムマシンなども加わった。

いちばんの特徴は、歌い方の形にある。独唱者が一節を歌うと、複数人の集団が声を揃えて応える。この掛け合いが、曲の全体を貫いている。合唱には、コール・アンド・レスポンスに加えて、多声のハーモニーもある。誰でも一緒に歌えることが優先される。

言葉は、ヌーシ(アビジャンの若者の俗語)を中心に、フランス語や各民族の言葉が混ざる。言葉が入り混じること自体が、多くの民族が暮らす都市の現実を映している。

この音楽の中心は、何といっても歌詞だ。学生寮のひどい環境、失業、汚職、毎日の苦しい暮らしといった現実を、笑いと大げさな言い回しを交えて語る。深刻な話を深刻に語るのではなく、自分を笑い、冗談にして分かち合う。この態度が一貫しており、聴き手は笑いながら自分たちの状況を確かめることになる。</p>
<h2>成り立ち</h2><p>舞台は1990年ごろのアビジャン、ヨプゴン(Yopougon)の大学寮だ。この音楽は、ここで学生が始めたとされるが、異説もある。

当時のコートジボワールは、経済危機と、国際機関による緊縮政策の影響で、公的な支出が削られていた。大学の寮は、定員を大幅に超える学生であふれていた。学生たちは、ひどい生活環境と、卒業しても仕事がないという先の見えなさに直面していた。

そんな中、学生たちが夜に集まり、身の回りの物を叩きながら、自分たちの境遇を歌にした。これが始まりとされる。1980年代の学校スポーツ応援団の歌woyo/ambiance facileを土台に、大学寮の学生が時事的な歌詞を載せて発展させた。

名前の由来には諸説ある。バウレ語の「O ti lê zouglou」（ゴミのように積み重なっている）から来たという説が、広く流布している。一方、踊りを指す内輪の冗談から生まれた造語で、バウレ語説は後付けの解釈だとする説明もある。

同じ年、この国では一党制が終わり、複数政党制への移行をめぐって政治が混乱していた。学生運動もその重要な担い手の一つで、この音楽は運動を象徴する音楽としても使われた。

はじめは録音されない、口伝えの歌だった。しかし1991年ごろには、商業的な録音が始まる。Les Parents du Campusなど第1世代が広め、このスタイルは全国に広がった。1990年代半ば以降は、Les Poussins Chocs（のちのPetit Yodé &amp; l'Enfant Siro）ら第2世代が、社会風刺で人気を得た。

国際的な成功のきっかけは、1999年にアビジャンで録音・発表された、Magic Systemの「1er Gaou」だ。貧しさゆえに恋人に去られた男が、成功したあとに復縁を迫られ、それを断る物語を歌っている。最初は国内向けの曲だった。それが、Radio France InternationaleのClaudy Siarによる紹介、Sonodiscとの契約、Bob Sinclarのリミックスを経て、2002年にフランスで最高4位になった。以後この曲は、アフリカとフランス語圏を中心に、広く知られる代表曲となった。

しかし本国では、困難が続いた。2002年に始まった内戦で、国土は南北に分断された。内戦中、ズーグルーの歌手たちは政治的に立場を分け、国外で暮らすことになった歌手もいる。

一方、2001～2002年ごろには、パリのコートジボワール系移民(Douk Sagaら)が、クペ・デカレという別のスタイルを始めていた。これが内戦期に主流になった。このスタイルは享楽的だった。戦争の現実から目をそらすための音楽だったとも解釈されている。</p>
