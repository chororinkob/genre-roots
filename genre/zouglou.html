<h1>Zouglou（ズーグルー）とは</h1>
<p>コートジボワールの最大都市アビジャンで生まれた、打楽器と合唱を軸とする音楽である。編成の中心は打楽器で、複数の太鼓と瓶や金属を叩く音が層をなし、四拍子を細かく分割した密度の高いリズムを作る。ここへギターが高音域で短い音型を反復し、</p>
<p>コートジボワールの最大都市アビジャンで生まれた、打楽器と合唱を軸とする音楽である。編成の中心は打楽器で、複数の太鼓と瓶や金属を叩く音が層をなし、四拍子を細かく分割した密度の高いリズムを作る。ここへギターが高音域で短い音型を反復し、低音楽器が支える。後年にはシンセサイザーと打ち込みが加わった。テンポは中庸から速い。最大の特徴は歌唱の形式にある。独唱者が一節を歌い、複数人の集団が声を揃えて応答するという掛け合いが、曲の全体を貫く。この合唱は洗練された和声ではなく、素朴な斉唱と単純な重ねであり、誰でも一緒に歌えることが優先される。言語はフランス語を基本としながら、アビジャンの若者が用いる独特の俗語が大量に混ぜられ、さらに現地の各言語の語彙が入り込む。この言語の混淆自体が、多民族都市の現実を反映している。歌詞こそがこの音楽の核心である。学生寮の劣悪な環境、失業、汚職、日常の困窮といった現実を、笑いと誇張を交えて語る。深刻な内容を深刻に語るのではなく、自嘲と諧謔によって共有するという態度が一貫しており、聴き手は笑いながら自分たちの状況を確認することになる。</p>
<h2>成り立ち</h2><p>この音楽の誕生は1990年、アビジャンの大学の学生寮に遡る。当時のコートジボワールは、経済危機と国際機関による緊縮政策の影響で公的支出が削減され、大学の寮は定員を大幅に超える学生で溢れていた。彼らは劣悪な生活環境と、卒業しても職がないという展望のなさに直面していた。この状況で、学生たちが夜に集まり、身の回りの物を叩きながら自分たちの境遇を歌にしたのが始まりとされる。名称は、ゴミのように積み重なった状態を表す現地の表現に由来すると言われ、寮での生活そのものを指している。同じ年、この国では一党制が終わり、複数政党制への移行をめぐる政治的な混乱が起きていた。学生運動はその中心にあり、この音楽は運動の伴奏としても機能した。当初は録音されない口伝えの歌だったが、1990年代半ばには商業的な録音が始まる。Les Parents du CampusやPetit Yodé &amp; l'Enfant Siroといった集団が人気を得て、この様式は全国的なものとなった。決定的な国際的成功は1999年である。Magic Systemが発表した楽曲は、恋人に捨てられた男の滑稽な物語を歌ったもので、当初は国内向けだったが、フランスに暮らす移民の共同体を通じて広まり、2002年にはフランスの順位表を制した。以後この曲は世界中で演奏され続けている。しかし本国では困難が続いた。2002年に始まった内戦によって国土は南北に分断され、多くの音楽家が活動を制限される。この時期、より享楽的で政治性を排したクペ・デカレという別の様式が、パリの移民社会から生まれて流行した。それは戦争の現実から目を逸らすための音楽だったとも解釈されている。</p>
