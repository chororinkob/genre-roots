<h1>Roots Reggae（ルーツレゲエ）とは</h1>
<p>ルーツ・レゲエは、レゲエの型を使いながら、歌詞のテーマを信仰と社会批判に絞ったスタイルだ。 低音が曲の中心にある。ベースは主役で、短く太い音型を何度も繰り返し、曲の骨格そのものを担う。シンコペートした旋律的なベースラインが、レゲエ</p>
<p>ルーツ・レゲエは、レゲエの型を使いながら、歌詞のテーマを信仰と社会批判に絞ったスタイルだ。

低音が曲の中心にある。ベースは主役で、短く太い音型を何度も繰り返し、曲の骨格そのものを担う。シンコペートした旋律的なベースラインが、レゲエを他の音楽と区別する。

ギターは裏拍だけを短く切って刻む。オルガンは八分の裏（拍と拍の間）を細かく埋めるバブルという奏法で、隙間を満たす。裏拍の刻みは、レゲエを特徴づける要素の一つである。テンポは遅く、おおむね60〜90BPM前後(実務上の目安)に落とされることが多い。

リズムの土台はワン・ドロップと呼ばれる形だ。小節の1拍目にあるはずのバスドラムを意図的に抜き、3拍目にバスドラムとスネア（多くはクロススティック／リムショット）を同時に落とす。この1拍目の空白が、音楽全体に独特の浮遊感と重心の低さを与えている。

歌唱は、説教と詠唱（節をつけて唱えること）の中間にあると言われることがある。多くの作品で、複数人による重厚な和声（ハーモニー）の合いの手が付く。

歌詞はラスタファリ信仰の語彙で書かれる。テーマは、バビロンと呼ばれる抑圧的な体制への批判、アフリカへの帰還、貧困と暴力の告発、そして救済だ。

録音では、リバーブやディレイ（エコー）を多用するものが多い（特にダブ的なミックス）。</p>
<h2>成り立ち</h2><p>舞台は、1960年代後半のジャマイカだ。ロックステディからレゲエへ移る時期に、スピリチュアルなテーマが増え始めた。1971年頃からは、社会・政治・信仰を扱う録音が増えた(恋愛歌は引き続き多数派だった)。

背景にあるのが、ラスタファリ運動である。1910年代から1920年代にかけて、ジャマイカ出身のマーカス・ガーヴィーがアフリカへ帰ろうという思想を提唱した。そこに、1930年にエチオピア皇帝に即位したハイレ・セラシエ一世を救世主と見なす信仰が結びつき、都市の貧困層に広がっていた。1966年四月21日、セラシエがジャマイカを訪れると、空港には約10万人とも言われる（推定は「数千人」〜10万人と幅がある）群衆が集まった。運動は、決定的に目に見えるものになった。

音楽の中心にいたのは、ボブ・マーリー、ピーター・トッシュ、バニー・ウェイラーによるザ・ウェイラーズだ。彼らはリー・ペリーの制作のもとで、1970年前後に音の骨格を固めた。アイランド・レコードのクリス・ブラックウェルのもとで1973年に出た『キャッチ・ア・ファイア』は、ロックの聴衆に届く音作りを施したうえで発売された。この作品は、ルーツ・レゲエを、ロック／アルバム志向の聴衆に届けた大きな転機となった。

同じ時期に、バーニング・スピアが1975年に『マーカス・ガーヴィー』を、カルチャーが1977年に『トゥー・セヴンズ・クラッシュ』を発表している。後者は1977年を「審判の年」とした。7月7日に過去の不正が裁かれ、報復される（晴らされる）という予言的なビジョンを歌ったものだ。当日のキングストンでは外出を控える人が多く、商店が閉まったと伝えられる。

制作の現場では、コクソン・ドッドのスタジオ・ワンと、フー・キム兄弟が1972年に作ったチャンネル・ワンが活躍した(デューク・リードのトレジャー・アイルは1960年代のスカ／ロックステディの中心で、リードは1975年に亡くなった)。チャンネル・ワンでは、ドラマーのスライ・ダンバーがロッカーズと呼ばれるリズムを、レヴォリューショナリーズで発展・定着させた。

政治との距離は近く、危険でもあった。1976年、総選挙前の緊張の中で、マーリーは自宅を襲撃され、銃撃された。それでも二日後の「スマイル・ジャマイカ・コンサート」に、負傷したまま出演した。1978年のワン・ラヴ平和演奏会では、彼が両党首を舞台に呼び、手を合わせて掲げさせた（握手したとも伝わる）。

1981年、マーリーが36歳で死去した。その後も、この音楽はアフリカや欧州にも広がり、抵抗・社会意識の音楽としても受け継がれた。</p>
