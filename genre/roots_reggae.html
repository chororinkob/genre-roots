<h1>Roots Reggae（ルーツレゲエ）とは</h1>
<p>レゲエの型を使いながら、歌詞の主題を信仰と社会批判に定めた様式である。リズムの土台はワン・ドロップと呼ばれる形で、小節の一拍目にあるはずのバスドラムを意図的に抜き、三拍目にバスドラムとスネアを同時に落とす。この一拍目の空白が音楽全</p>
<p>レゲエの型を使いながら、歌詞の主題を信仰と社会批判に定めた様式である。リズムの土台はワン・ドロップと呼ばれる形で、小節の一拍目にあるはずのバスドラムを意図的に抜き、三拍目にバスドラムとスネアを同時に落とす。この一拍目の空白が音楽全体に独特の浮遊感と重心の低さを与えている。ベースは主役であり、短く太い音型を執拗に反復して曲の骨格そのものを担う。旋律を持つ低音という点で、和音の根音を追うだけの他の様式とは役割が根本的に異なる。ギターは裏拍だけを短く切って刻み、オルガンは八分の裏を細かく埋めるバブルという奏法で隙間を満たす。この裏拍への偏重が、表拍を強調する欧米の様式との決定的な違いになっている。テンポは遅く、一分間に60から80拍程度に落とされることが多い。歌詞はラスタファリ信仰の語彙で書かれ、バビロンと呼ばれる抑圧的な体制への批判、アフリカへの帰還、貧困と暴力の告発、そして救済が主題となる。歌唱は説教と詠唱の中間にあり、複数人による重厚な和声の合いの手が付く。録音では残響と山彦を音源そのものに深くかけ、音を空間の中に沈める処理が施される。</p>
<h2>成り立ち</h2><p>1968年前後、ロックステディからレゲエへの移行が起きた直後の数年間に、歌詞の主題が恋愛から信仰と政治へ大きく傾いた。背景にあるのがラスタファリ運動である。1920年代にジャマイカ出身のマーカス・ガーヴィーが唱えたアフリカ回帰の思想に、1930年にエチオピア皇帝に即位したハイレ・セラシエ一世を救世主と見なす信仰が結びつき、都市の貧困層に広がっていた。1966年四月21日にセラシエがジャマイカを訪問した際、空港には10万人規模の群衆が集まり、運動は決定的に可視化される。音楽面での中心はボブ・マーリー、ピーター・トッシュ、バニー・ウェイラーによるザ・ウェイラーズで、リー・ペリーの制作のもとで1970年前後に音の骨格を固めた。国際的な流通を作ったのはアイランド・レコードのクリス・ブラックウェルで、1973年の『キャッチ・ア・ファイア』はロックの聴衆に届く音作りを施したうえで発売され、この音楽を島の外へ出した。同じ時期にバーニング・スピアが1975年に『マーカス・ガーヴィー』を、カルチャーが1977年に『トゥー・セヴンズ・クラッシュ』を発表している。後者は1977年七月七日に世界が終わるという予言を歌ったもので、当日のキングストンでは実際に多くの商店が閉まった。制作の現場では、コクソン・ドッドのスタジオ・ワン、デューク・リードのトレジャー・アイル、そしてフー・キム兄弟のチャンネル・ワンが競い合い、チャンネル・ワンではドラマーのスライ・ダンバーがロッカーズと呼ばれる新しいリズムを作った。政治との距離は近く危険でもあった。1976年、総選挙前の緊張下でマーリーは自宅を襲撃され銃撃されたが、二日後の平和演奏会に負傷したまま出演した。1978年のワン・ラヴ平和演奏会では、彼が舞台上で対立する二大政党の党首の手を取って握らせている。1981年にマーリーが36歳で死去した後も、この様式はアフリカや欧州で受け継がれ、抵抗の音楽の代名詞として世界中に定着した。</p>
