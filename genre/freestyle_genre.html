<h1>Freestyle（フリースタイル）とは</h1>
<p>1980年代のニューヨークとマイアミで、ラテン系とイタリア系の若者たちの間から生まれた電子ダンス音楽である。土台はRoland TR-808のドラムマシンだが、四つ打ちではなく、裏拍を細かく食う跳ねたパターンを組むのが最大の特徴で</p>
<p>1980年代のニューヨークとマイアミで、ラテン系とイタリア系の若者たちの間から生まれた電子ダンス音楽である。土台はRoland TR-808のドラムマシンだが、四つ打ちではなく、裏拍を細かく食う跳ねたパターンを組むのが最大の特徴で、そこへコンガやティンバレス、カウベルといったラテン打楽器の音色が重ねられる。この歯切れの良い独特のリズムは、エレクトロ・ファンクの機械的な骨格にサルサやマンボの体感を接ぎ木したものと言える。ベースはシンセサイザーによる短く跳ねる音型で、和音はDX7などのFM音源による硬質なブラス風の刺し込みと、明るくも切ないマイナー調の進行が中心となる。歌はほとんどが10代から20代前半の女性シンガーで、高めの声域で少し不安定に歌い上げる。歌詞は恋人への未練、裏切り、都会での孤独といった、極めて個人的で切実な感情に絞られており、踊れるのに泣けるという二面性がこの音楽の核心である。曲の構成はポップスの型に忠実で、イントロ、ヴァース、サビ、ブレイクという明快な流れを持ち、ラジオでの再生を強く意識した3分半から5分程度に収められている。同じ808を使うエレクトロが宇宙的で無機質なのに対し、フリースタイルはあくまで人間の恋愛感情を歌う音楽である。</p>
<h2>成り立ち</h2><p>出発点は1982年、Afrika Bambaataaのプラネット・ロックが提示した808とシンセによる新しいダンス音楽の衝撃である。ニューヨークのブロンクスやクイーンズ、ブルックリンでは、ヒップホップの担い手が黒人中心であったのに対し、プエルトリコ系やドミニカ系の若者たちがこの電子音の語彙を自分たちのラテン音楽の感覚で書き換え始めた。転換点は1983年にShannonが発表したレット・ザ・ミュージック・プレイで、Chris BarbosaとMark Liggettが手掛けたこの曲は、808の跳ねたパターンと切ない歌を結びつけ、事実上この分野の最初の完成形となった。1985年にはLisa Lisa and Cult Jamがアイ・ワンダー・イフ・アイ・テイク・ユー・ホームでヒットを放ち、制作を担当したFull Forceがニューヨーク側の音を確立する。一方マイアミでは、Lewis Martineéが手掛けたExposéのポイント・オブ・ノー・リターンや、Debbie Deb、Trinereらの作品が、より軽く速いサウンドを打ち出した。Cutting RecordsやMic Mac Recordsといった独立系レーベルが12インチを次々にプレスし、ニューヨークのWKTUやマイアミのラジオ局が昼夜を問わず流したことで、ローカルなクラブ音楽が全米チャートに届くようになる。フリースタイルという呼び名が定着したのは1980年代後半で、それ以前はラテン・ヒップホップなどと呼ばれていた。TKA、Stevie B、Sa-Fire、The Cover Girls、Company Bらが続き、1988年から1990年にかけて商業的な頂点を迎えるが、量産による楽曲の均質化と、ハウスおよびニュージャックスウィングの台頭により、1990年代前半には急速にラジオから姿を消した。それでもニューヨークやフィラデルフィア、マイアミのコミュニティでは同窓会的なイベントが途切れず続き、2010年代以降は当時の少年少女が中高年となって会場を埋める形で復活し、シンセウェイヴやハイパーポップの作家からも参照されている。</p>
<h2>代表曲</h2><ul><li>Let the Music Play (Shannon)</li><li>I Wonder If I Take You Home (Lisa Lisa &amp; Cult Jam)</li><li>Spring Love (Stevie B)</li></ul>
