<h1>Freestyle（フリースタイル）とは</h1>
<p>フリースタイルは、1980年代のニューヨークとマイアミで、ラテン系とイタリア系の若者たちの間から生まれた電子ダンス音楽だ。 ドラムマシンのRoland TR-808が使われる曲も多い。ベースはシンセサイザーによる短く跳ねる音の動き</p>
<p>フリースタイルは、1980年代のニューヨークとマイアミで、ラテン系とイタリア系の若者たちの間から生まれた電子ダンス音楽だ。

ドラムマシンのRoland TR-808が使われる曲も多い。ベースはシンセサイザーによる短く跳ねる音の動きで、和音は硬質なブラス風やオーケストラ風のシンセの刺し込みと、明るくも切ない短調の流れが中心である。

リズムの特徴は、シンコペーションした打楽器・ベース・シンセと、2・4拍のアクセントだ。キックは四つ打ちの場合もある。そこへ、ラテン打楽器風の音やパターンが重ねられる。この歯切れの良い独特のリズムは、エレクトロ・ファンクの機械的な土台に、ラテン音楽（サルサなど）のリズム感を接ぎ木したものと言える。

歌は若い女性シンガーが目立つが、TKAやStevie Bなど男性の歌い手も多い。

歌詞は失恋・別れを扱う曲が多い。恋愛と踊りが主な題材で、踊れるのに泣けるという二面性がこの音楽の中心である。

曲の構成はポップスの型に忠実だ。イントロ、ヴァース、サビ、ブレイクという明快な流れを持つ。ラジオ向けのシングル版と、6分前後の12インチ版が作られた。同じ808を使うエレクトロが宇宙的で無機質なのに対し、フリースタイルはあくまで人間の恋愛感情を歌う音楽である。</p>
<h2>成り立ち</h2><p>きっかけは、Afrika Bambaataa &amp; Soulsonic Forceの『Planet Rock』（1982年）だ。この曲が、808とシンセによる新しいダンス音楽を示した。これが重要な先駆である。

発祥は1980年代初頭とされる。ニューヨークのアッパー・マンハッタンやブルックリン、ブロンクスでは、主にプエルトリコ系のラテン系の若者たちが、この電子音の表現を、自分たちのラテン音楽の感覚で書き換え始めた。

転換点は、1983年にShannonが発表したレット・ザ・ミュージック・プレイである。Chris BarbosaとMark Liggettが手掛けたこの曲は、808の跳ねたパターンと切ない歌を結びつけた。しばしば最初のフリースタイル曲とされる(最初の本格的なラテン・ヒップホップ盤はLisa Lisa and Cult Jamの1985年の曲とする見方もある)。

1985年には、Lisa Lisa and Cult Jamのアイ・ワンダー・イフ・アイ・テイク・ユー・ホームを、Full Forceが制作した。この曲は、ニューヨークのフリースタイルの代表的ヒットとなった。一方マイアミでは、Lewis Martineéが手掛けたExposéのポイント・オブ・ノー・リターンや、Debbie Deb、Trinereらの作品が出て、マイアミでも独自のシーンが育った。

Cutting RecordsやMicMac Recordsといった独立系レーベルが、12インチを次々にプレスした。ニューヨークのWQHT(Hot 103)やZ100、マイアミのPower 96などのラジオ局がそれを流し、ローカルなクラブ音楽が全米チャートに届くようになる。この音楽は、フリースタイル、ラテン・フリースタイル、ラテン・ヒップホップなどと呼ばれた。名称の由来には諸説ある。

TKA、Stevie B、Sa-Fire、The Cover Girls、Company Bらが続き、1987年ごろからTop 40ラジオで本格的に流れ始めた。1989年前後に頂点を迎えるが、ハウスやラップ、ダンス・ポップ／R&amp;B勢が人気を集めたことと、粗製濫造で、1989年ごろから反動が起きる。1990年代初頭には、ラジオから後退した。

それでも、アンダーグラウンドのジャンルとして支持が残り、2000年代以降は復活した。2004年のCodaでの公演、2006年のMadison Square Gardenでの公演、2013年のRadio City Music Hallでの公演など、公演は盛況だった。</p>
<h2>代表曲</h2><ul><li>Let the Music Play (Shannon)</li><li>Come Go with Me (Exposé)</li><li>Point of No Return (Exposé)</li><li>Spring Love (Stevie B)</li><li>I Wonder If I Take You Home (Lisa Lisa &amp; Cult Jam)</li><li>I Wanna Be the One (Stevie B)</li><li>Show Me (The Cover Girls)</li><li>Two to Make It Right (Seduction)</li><li>Bad of the Heart (George Lamond)</li><li>Fascinated (Company B)</li><li>Hooked on You (Sweet Sensation)</li><li>Take Me in Your Arms (Lil Suzy)</li></ul>
