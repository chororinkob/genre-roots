<h1>Freestyle（フリースタイル）とは</h1>
<p>1980年代のニューヨークとマイアミで、ラテン系とイタリア系の若者たちの間から生まれた電子ダンス音楽である。ドラムマシンのRoland TR-808が使われる曲も多いが、四つ打ちではなく、裏拍を細かく食う跳ねたパターンを組むのが最</p>
<p>1980年代のニューヨークとマイアミで、ラテン系とイタリア系の若者たちの間から生まれた電子ダンス音楽である。ドラムマシンのRoland TR-808が使われる曲も多いが、四つ打ちではなく、裏拍を細かく食う跳ねたパターンを組むのが最大の特徴で、そこへコンガやティンバレス、カウベルといったラテン打楽器の音色が重ねられる。この歯切れの良い独特のリズムは、エレクトロ・ファンクの機械的な骨格にサルサやマンボの体感を接ぎ木したものと言える。ベースはシンセサイザーによる短く跳ねる音型で、和音は硬質なブラス風やオーケストラ風のシンセの刺し込みと、明るくも切ないマイナー調の進行が中心となる。歌は10代から20代前半の女性シンガーが目立つが、TKAやStevie Bなど男性の歌い手も多く、高めの声域で少し不安定に歌い上げる。歌詞は恋人への未練、裏切り、都会での孤独といった、極めて個人的で切実な感情に絞られており、踊れるのに泣けるという二面性がこの音楽の核心である。曲の構成はポップスの型に忠実で、イントロ、ヴァース、サビ、ブレイクという明快な流れを持ち、ラジオ向けのシングル版と、約6分半が通常のクラブ向けフォーマットだった12インチ版が作られた。同じ808を使うエレクトロが宇宙的で無機質なのに対し、フリースタイルはあくまで人間の恋愛感情を歌う音楽である。</p>
<h2>成り立ち</h2><p>重要な先駆は、1982年のAfrika Bambaataaのプラネット・ロックが提示した808とシンセによる新しいダンス音楽である。発祥は1980年代初頭とされる。ニューヨークのアッパー・マンハッタンやブルックリン、ブロンクスでは、主にプエルトリコ系のラテン系の若者たちがこの電子音の語彙を自分たちのラテン音楽の感覚で書き換え始めた。転換点は1983年にShannonが発表したレット・ザ・ミュージック・プレイで、Chris BarbosaとMark Liggettが手掛けたこの曲は、808の跳ねたパターンと切ない歌を結びつけ、しばしば最初のフリースタイル曲とされる(最初の本格的なラテン・ヒップホップ盤はLisa Lisa and Cult Jamの1985年の曲とする見方もある)。1985年にはLisa Lisa and Cult Jamがアイ・ワンダー・イフ・アイ・テイク・ユー・ホームでヒットを放ち、制作を担当したFull Forceがニューヨーク側の音を確立する。一方マイアミでは、Lewis Martineéが手掛けたExposéのポイント・オブ・ノー・リターンや、Debbie Deb、Trinereらの作品が、より軽く速いサウンドを打ち出した。Cutting RecordsやMic Mac Recordsといった独立系レーベルが12インチを次々にプレスし、ニューヨークのWQHT(Hot 103)やZ100、マイアミのPower 96などのラジオ局が流したことで、ローカルなクラブ音楽が全米チャートに届くようになる。この音楽は、フリースタイル、ラテン・フリースタイル、ラテン・ヒップホップなどと呼ばれた。名称の由来には諸説ある。TKA、Stevie B、Sa-Fire、The Cover Girls、Company Bらが続き、1987年ごろからTop 40ラジオで本格的に流れ始め、1988年から1990年にかけて商業的な頂点を迎えるが、量産による楽曲の均質化と、ハウスおよびニュージャックスウィングの台頭により、1990年代前半には急速にラジオから姿を消した。それでもニューヨークやフィラデルフィア、マイアミのコミュニティでは同窓会的なイベントが途切れず続き、2000年代以降は、2004年のCodaでの公演、2006年のMadison Square Gardenでの公演、2013年のRadio City Music Hallでの公演など、当時の少年少女が中高年となって会場を埋める形で復活している。</p>
<h2>代表曲</h2><ul><li>Let the Music Play (Shannon)</li><li>Come Go with Me (Exposé)</li><li>Point of No Return (Exposé)</li><li>Spring Love (Stevie B)</li><li>I Wonder If I Take You Home (Lisa Lisa &amp; Cult Jam)</li><li>I Wanna Be the One (Stevie B)</li><li>Show Me (The Cover Girls)</li><li>Two to Make It Right (Seduction)</li><li>Bad of the Heart (George Lamond)</li><li>Fascinated (Company B)</li><li>Hooked on You (Sweet Sensation)</li><li>Take Me in Your Arms (Lil Suzy)</li></ul>
