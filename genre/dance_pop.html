<h1>Dance Pop（ダンスポップ）とは</h1>
<p>ダンス・ポップは、踊るための機能とポップスの歌の力を、同時に満たすよう設計されたスタイルだ。クラブとラジオの双方で機能することが、設計上の要件である。 リズムの土台は、四つ打ちのバスドラムだ。テンポは、速めのテンポと強いビートが典</p>
<p>ダンス・ポップは、踊るための機能とポップスの歌の力を、同時に満たすよう設計されたスタイルだ。クラブとラジオの双方で機能することが、設計上の要件である。

リズムの土台は、四つ打ちのバスドラムだ。テンポは、速めのテンポと強いビートが典型だが、中庸テンポの代表作もある。その上に、裏拍で開くハイハットが乗る。さらに、2拍目と4拍目のクラップ（手拍子の音）またはスネアが加わる。この均等な刻みが、聴き手の身体を一定の周期で動かす。

低音はシンセベースが担い、8分音符または16分音符で刻む。キックの直後に音量が戻るサイドチェインの効果は、ジャンル全体の特徴ではない。1990年代末〜2000年代以降の、エレクトロ／EDM寄りの作品ではっきり表れる手法である。

上物（メロディーなど上に重ねる音）は、鋸波のリード（主旋律の音）、短い和音の刺し、そしてきらめく高音域の装飾で構成されることが多い。

和声（コードの響き）は、長調または短調の4コード循環（4つの和音の繰り返し）がよく見られ、4小節または8小節で完結するものが多い。全曲を通じてあまり変化しない曲が多い。この和声の単調さが、逆に旋律とリズムを際立たせる。

曲構成はポップスの型を守る。ヴァース、プリコーラス、コーラスという流れの中に、器楽だけのブレイク（演奏が一瞬途切れる部分）を挟む。

歌唱は明快で力強く、コーラスでは複数の声を重ねて厚みを作る。歌詞は恋、夜遊び、自己肯定、解放を扱い、繰り返しの多い平易な言葉が選ばれる。</p>
<h2>成り立ち</h2><p>ダンス・ポップは、ディスコ／ポスト・ディスコとシンセ・ポップを母体に生まれた。

1979年、ディスコへの反発が起こり、その語自体が忌避されるようになった。そこで、同じ音楽的な機能を別の名前で続ける必要が生じる。こうして1980年代前半に、ダンス・ポップという枠が形成された。

決定的な人物と評されるのはMadonnaだ。1982年10月のシングルEverybodyでデビューし、デビュー・アルバムは1983年7月に出た。彼女は、ディスコの推進力に、ドラムマシンとシンセサイザーによる当時最新の音と、視覚的な自己演出を組み合わせた。1983年のデビュー作は、スタイルの基準を作ったと評されている。Like a Virgin（1984年）とTrue Blue（1986年）は、それを大衆的成功へ広げた作品である。制作面ではNile Rodgersらが関わっている。

同じ時期、イギリスではStock Aitken Watermanの制作チームが、ハイエナジー由来の型で、Kylie MinogueやRick Astleyのヒットを量産した。

1986年のControlから、Janet Jacksonが Jimmy JamとTerry Lewisとの共同制作を始めた。三連スウィングなどで、ニュージャックスウィングの形成に影響を与えている。1989年のRhythm Nation 1814でも、同系統の要素を用いた。

1990年代後半には、スウェーデンのMax Martinが、Cheiron系の制作で頭角を現した。1999年のBritney Spearsで初の全米1位を得ている。Denniz PoPがCheironで築いた型を、彼は継承・発展させた。通算で作曲31曲（制作29曲）の全米1位曲を手がけ、2000年代以降のポップスに大きな影響を与えた。

2000年代末から2010年代前半には、Lady Gaga、Kesha、Rihannaらにより、エレクトロポップ／シンセポップが盛んになった。エレクトロ色の強いダンス・ポップが、再びチャートの中心に戻った。

2010年代半ば以降は、トラップのハーフタイム感や、レゲトン／ダンスホール系のリズム（例：Sorry）が取り込まれた。四つ打ちは必須ではなくなった。ただし、トロピカル・ハウスは四つ打ちを保つ。

一方で、批判もある。制作が少数の専門家に集中し、楽曲が均質化していること。歌手が作品の作り手としてではなく、顔として扱われること。そして若い歌手への商業的な搾取。これらが指摘されることがある。</p>
