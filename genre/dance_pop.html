<h1>Dance Pop（ダンスポップ）とは</h1>
<p>踊るための機能とポップスの歌の力を同時に満たすよう設計された様式。BPMは110〜130、四つ打ちのバスドラムが土台をなし、その上に裏拍で開くハイハット、そして二拍目と四拍目のクラップまたはスネアが乗る。この均等な刻みが、聴き手の</p>
<p>踊るための機能とポップスの歌の力を同時に満たすよう設計された様式。BPMは110〜130、四つ打ちのバスドラムが土台をなし、その上に裏拍で開くハイハット、そして二拍目と四拍目のクラップまたはスネアが乗る。この均等な刻みが、聴き手の身体を一定の周期で動かす。低音はシンセベースが8分音符または16分音符で刻み、キックの直後に音量が戻るサイドチェインの効果により、曲全体が呼吸するような揺れを持つ。上物は鋸波のリード、短い和音の刺し、そしてきらめく高音域の装飾で構成される。和声は長調または短調の四和音循環で、四小節または八小節で完結し、全曲を通じてほとんど変化しない。この和声の単調さが、逆に旋律とリズムを際立たせる。曲構成はポップスの型を守り、ヴァース、プリコーラス、コーラスという流れの中に、器楽だけのブレイクを挟む。歌唱は明快で力強く、コーラスでは複数の声を重ねて厚みを作る。歌詞は恋、夜遊び、自己肯定、解放を扱い、繰り返しの多い平易な語彙が選ばれる。クラブとラジオの双方で機能することが設計上の要件である。</p>
<h2>成り立ち</h2><p>1970年代末のディスコが直接の母体である。1979年のディスコへの反発によりその語自体が忌避されるようになった後、同じ音楽的な機能を別の名前で継続する必要が生じ、1980年代前半にダンス・ポップという枠が形成された。決定的な人物は1983年にデビューしたMadonnaで、彼女はディスコの推進力に、ドラムマシンとシンセサイザーによる当時最新の音、そして視覚的な自己演出を組み合わせ、1984年のLike a Virgin、1986年のTrue Blueで様式を確立した。制作面ではNile Rodgersらが関わっている。同時期、イギリスではStock Aitken Watermanの制作チームが、ハイエナジー由来の型でKylie MinogueやRick Astleyのヒットを量産した。1980年代末から1990年代にかけては、Janet Jacksonが Jimmy JamとTerry Lewisとの協働で、ニュージャックスウィングのリズムを取り込んだ硬質な変種を作った。1990年代後半には、スウェーデンのMax Martinが、Britney Spears、Backstreet Boys、NSYNCの制作を通じて、旋律と構成を極度に最適化した手法を確立し、以後20年以上にわたり世界のポップスの標準を規定することになった。2000年代末から2010年代前半には、EDMとの融合が進み、Lady Gaga、Kesha、Rihannaらが四つ打ちを主流のチャートに戻した。2010年代半ば以降は、トロピカル・ハウスやトラップのリズムが取り込まれ、四つ打ちは絶対的な要件ではなくなった。批判としては、制作が少数の専門家に集中し楽曲が均質化していること、歌手が作品の作り手としてではなく顔として扱われること、そして若い歌手への商業的な搾取が繰り返し指摘されてきた。</p>
