<h1>Dance Pop（ダンスポップ）とは</h1>
<p>踊るための機能とポップスの歌の力を同時に満たすよう設計された様式。テンポは速めで（中庸テンポの代表作もある）、四つ打ちのバスドラムが土台をなし、その上に裏拍で開くハイハット、そして2拍目と4拍目のクラップ（手拍子の音）またはスネア</p>
<p>踊るための機能とポップスの歌の力を同時に満たすよう設計された様式。テンポは速めで（中庸テンポの代表作もある）、四つ打ちのバスドラムが土台をなし、その上に裏拍で開くハイハット、そして2拍目と4拍目のクラップ（手拍子の音）またはスネアが乗る。この均等な刻みが、聴き手の身体を一定の周期で動かす。低音はシンセベースが8分音符または16分音符で刻む。1990年代末以降のエレクトロやEDM寄りの作品では、キックの直後に音量が戻るサイドチェインの効果により、曲全体が呼吸するような揺れを持つものもある。上物（メロディーなど上に重ねる音）は、シンセのリード（主旋律の音）や短い和音の刺し、きらめく高音域の装飾などがよく見られる。和声（コードの響き）は、少数の和音を繰り返す単純なものがよく見られ、全曲を通じてあまり変化しない曲が多い。この和声の単調さが、逆に旋律とリズムを際立たせる。曲構成はポップスの型を守り、ヴァース、プリコーラス、コーラスという流れの中に、器楽だけのブレイク（演奏が一瞬途切れる部分）を挟む。歌唱は明快で力強く、コーラスでは複数の声を重ねて厚みを作る。歌詞は恋、夜遊び、自己肯定、解放を扱い、繰り返しの多い平易な言葉が選ばれる。クラブとラジオの双方で機能することが設計上の要件である。</p>
<h2>成り立ち</h2><p>1970年代末のディスコが直接の母体である。1979年のディスコへの反発によりその語自体が忌避されるようになった後、同じ音楽的な機能を別の名前で継続する必要が生じ、1980年代前半にダンス・ポップという枠が形成された。決定的な人物と評されるのはMadonnaで（1982年10月のシングルEverybodyでデビューし、デビュー・アルバムは1983年7月）、彼女はディスコの推進力に、ドラムマシンとシンセサイザーによる当時最新の音、そして視覚的な自己演出を組み合わせ、デビュー・アルバムは批評家からダンス・ポップの基準を作ったと評された。1984年のLike a Virgin、1986年のTrue Blueは、その様式を大衆的な成功へと広げた。制作面ではLike a VirginにNile Rodgersらが関わっている。同時期、イギリスではStock Aitken Watermanの制作チームが、ハイエナジー由来の型でKylie MinogueやRick Astleyのヒットを量産した。1980年代なかばから1990年代にかけては、Janet Jacksonが Jimmy JamとTerry Lewisとの共同制作を1986年のControlから始め、三連のスウィングなどでニュージャックスウィングの形成に影響を与えた。1989年のRhythm Nation 1814でも同系統の要素を用いている。1990年代後半には、スウェーデンのMax Martinが、師のDenniz PoPがCheiron Studiosで築いた型を継承・発展させ、Britney Spears、Backstreet Boys、NSYNCなどの制作を通じて、旋律と構成を極度に最適化した手法を磨いた。1999年のBritney Spearsで初の全米1位を得て以後、通算で多数の全米1位曲を手がけ、2000年代以降のポップスに大きな影響を与えた。2000年代末から2010年代前半には、EDMとの融合が進み、Lady Gaga、Kesha、Rihannaらにより、エレクトロ色の強いダンス・ポップが再びチャートの中心に戻った。2010年代半ば以降は、トラップのハーフタイム感や、レゲトン、ダンスホール系のリズム（Justin BieberのSorryなど）が取り込まれ、四つ打ちは絶対的な要件ではなくなった。トロピカル・ハウスは四つ打ちを保っている。批判としては、制作が少数の専門家に集中し楽曲が均質化していること、歌手が作品の作り手としてではなく顔として扱われること、そして若い歌手への商業的な搾取が繰り返し指摘されてきた。</p>
