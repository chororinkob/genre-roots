<h1>Shima-uta（シマウタ）とは</h1>
<p>一言でいえば、奄美群島で歌い継がれてきた民謡で、裏声を多用する。代表曲22曲を動画で聴け、ルーツと影響のつながりを地図でたどれる。</p>
<p>一言でいえば、奄美群島で歌い継がれてきた民謡で、裏声を多用する。伴奏の中心は三線で、奄美ではサンシンと呼ぶ。胴は沖縄の三線よりやや大きく、弦は細く、高めに調弦する。音は細く張り、歌の高い声域に寄り添う。撥は水牛の角ではなく、薄く削った竹べらを使う。

音階は本土の民謡に近い律音階と民謡音階が中心で、沖縄本島の琉球音階とは違う。奄美大島・徳之島・喜界島の歌は本土の耳になじみやすく、沖永良部島・与論島は沖縄本島北部に近い音使いになる。

歌の骨組みは8・8・8・6の音数で、沖縄の琉歌と同じ型だ。拍を細かく刻むというより、言葉の音数を区切りにして節が進む。チヂンという締太鼓が入ると軽い刻みが加わり、曲や座によっては、指笛が囃しとして加わる。三線は、撥を上向きに返す返しバチ、左手の指で弦をはじくはじき、指で弦を打つうちゆびを組み合わせ、3連の音をよく使う。伝統的な座では生音で歌われることが多い。

声がこの音楽の主役だ。地声から裏声へ移る境目をなめらかにつなぎ、瞬間的に裏声を混ぜるこぶしをグィンと呼ぶ。本土の民謡でも沖縄民謡でも裏声は避けるが、島唄は裏声の使用が際立って多い。男性も裏声を使い、女性に近い高さで歌う傾向がある。

歌詞は島の言葉で、畑仕事のつらさ、別れ、恋しさ、子どもへの教え、盆や正月の行事を詠む。同じ節に別の歌詞を載せ替えて歌うことも多い。座では一人が歌い、もう一人が別の歌を返す歌掛けで進む。宴の席、祝いの座、八月踊りの輪が主な舞台だ。</p>
<h2>成り立ち</h2><p>奄美群島は鹿児島と沖縄の間に連なる島々で、住民は古くから「シマ」と呼ぶ村落ごとに暮らしと決まりを保ってきた。琉球語で「シマ」は島と集落の両方を指し、「我きゃシマぬウタ（私たちの村の歌）」が島唄という言葉の起こりだ。島々の歌をまとめて「島唄」と呼んだのは奄美で使われ始めたとされ、いまでも「本来の島唄は奄美民謡」という言い方がされる。

島唄がどう生まれたかは、はっきりしていない。祝詞のような唱えごとから、神を語る叙事歌のおもり、長い物語を語るながれが生まれ、そこから抒情歌としての島唄が出てきた、という説を外間守善が唱えた。一方、小野重朗は島唄を沖縄の琉歌から派生したものとみる。8・8・8・6の音数が比較的新しい形だという点では研究者の見方がおおむね一致しているが、どう成立したかは決着していない。高橋美樹は、島唄が一つのジャンルとして認識されたのは比較的最近だと指摘している。

薩摩藩の支配下に入った後、18世紀には砂糖の上納・専売が強まり、奄美の人々はサトウキビ畑の重い労働を課された。搾った黒糖は年貢として島の外へ運ばれ、暮らしは飢えと紙一重だった。歌はその労働の場で、弔いの席で、祝いの座で歌われた。奄美大島の島唄は、北部の笠利節と南部の東節に大別される。

三線がいつ島に入ったかは分かっていない。そう遠くない時期まで、三線を持てたのは裕福な家だけだった。それでも島は独自の三線を作り上げ、細い弦、強く張った皮、高い調弦で裏声の歌に合わせた。

20世紀になると、録音と放送が歌を島の外へ運んだ。1970年代には琉球放送のラジオ番組や沖縄の報道関係者を通じて「島唄」という呼び方が沖縄へ渡り、沖縄民謡を指す言葉としても使われ始める。1979年に築地俊造が全国規模の民謡大会で最高の賞を取り、1989年には当原ミツヨ、1990年にはRIKKIが続いた。

1992年、THE BOOMの宮沢和史が沖縄戦を題材に「島唄」を作り、1993年に150万枚を売る大ヒットとなる。三線が全国で売れ、島唄の名も一気に広がった。しかし当時、沖縄の音楽関係者からは本土の人間が表面だけまねているという反発が出た。知名定男は題名に抵抗を覚えたと語り、備瀬善勝も歌詞に違和感があったと明かしている。宮沢自身も悩み、喜納昌吉の言葉に支えられたという。三線ブームは材料の琉球黒檀の枯渇という代償も生み、宮沢は2012年から植樹を続けている。

2000年代に入ると、元ちとせと中孝介が島唄の発声をポップスに持ち込み、全国区の声になった。2002年にはアルゼンチンのアルフレッド・カセーロが日本語のまま歌った「SHIMAUTA」が広がり、THE BOOMの旧録音とカセーロ版を収めた2002年5月発売のシングルが、オリコン10位・10万枚超を記録した。現在、島には朝崎郁恵、故・武下和平、里アンナら唄者がいて、居酒屋や祝いの席、八月踊りで歌は鳴っている。一方で話し言葉としての島の方言は弱り、歌の担い手をどう育てるかが課題になっている。</p>
