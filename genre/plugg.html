<h1>Plugg（プラグ）とは</h1>
<p>2013年ごろにインターネット上で生まれた音楽で、トラップを極端に軽く、やわらかく作り替えたスタイルだ。 いちばんの特徴は音色だ。ベルやキーを使った、きらめきがありつつ柔らかい音色や、木琴に似た音色、ベル、やわらかいシンセ・パッド</p>
<p>2013年ごろにインターネット上で生まれた音楽で、トラップを極端に軽く、やわらかく作り替えたスタイルだ。

いちばんの特徴は音色だ。ベルやキーを使った、きらめきがありつつ柔らかい音色や、木琴に似た音色、ベル、やわらかいシンセ・パッドを何層にも重ねる。メロディーは比較的単純なものが中心である。

和音は厚く、ジャジーな雰囲気を持つ。それでいて、全体は最小限の音で作られ、余白が多い。

低音は厚く深い808のベースだ。MexikoDroは、歪みの少ない柔らかな音(subby 808)を好むとされる。ハイハットは少なめで、すき間の多いゆるいドラムの打ち込みが特徴だ。全体として、トラップの攻撃性を大きく和らげ、夢見心地で余白の多い音にしている。

テンポはplugg全般で毎分130〜150拍前後、MexikoDroの作品では毎分130〜145拍程度とされる。ただし拍を半分に感じるため、実際にはゆったり聞こえる。空間の作りにも特徴があり、ディレイとリバーブで奥行きと広がりを足す。

インストゥルメンタルの曲が多い。ボーカルが入る場合も、穏やかな歌や緩やかなラップから、攻撃的なフロウまで幅がある。

2分台の短い曲もある。ビートは短時間で作ることができ、YouTubeには作り方を教える動画が数多くある。発表の場は、主にSoundCloudだった。</p>
<h2>成り立ち</h2><p>始まりの地は、2013年ごろのアトランタと、そのオンライン上の周辺だ。ジャンル名は、制作者集団BeatPluggzがSoundCloudで2013年から使っていた「Plug!」というタグに由来する。

2013年ごろ、アトランタのBeatPluggz（MexikoDro、StoopidXoolら）が、一貫した制作スタイルとして打ち出した、とされる。彼らは、トラップの攻撃性を大きく和らげ、夢見心地で余白の多い音にした。

この音楽の広がりを支えたのは、技術と流通の条件である。安価または無料の音楽制作ソフトが普及した。YouTubeには作り方を教える動画が数多くあり、SoundCloudは誰でも発表できる場になった。従来のように機材やスタジオや人脈を持たなくても、10代の若者が寝室で音楽を作り上げ、世界に届けられるようになったのだ。

2014〜15年ごろには、アトランタのPlayboi Cartiがこの音色を取り込み、主流の注目を集めた。2015年にSoundCloudで公開した「Broke Boi」（MexikoDro制作）などが、その例である。しかしCartiはその後、MexikoDroと別れる。そして、pluggを作っていないPi'erre Bourneと2017年のミックステープ以降組み、2018年5月に『Die Lit』を出した。

2020年前後、この流れはさらに変わる。Cartiの『Whole Lotta Red』（2020年）を転機に、レイジが形づくられた。OpiumのKen Carson（2019年加入）やDestroy Lonely（2021年加入）らが、これを広げた。一方、ロシア語圏では「ミニマリスティック・トラップ」と呼ばれ、Boulevard Depoらが取り入れた。

この音楽は、アトランタのBeatPluggz(MexikoDro、StoopidXool)が一般に起源とされる。ただ、インターネット上の集団的な性格が強い。また、MexikoDroは、Cartiが自分のビートの対価を払わなかったと述べている。</p>
<h2>代表曲</h2><ul><li>Plug Walk（Rich The Kid）</li><li>20 Min (Lil Uzi Vert)</li><li>Magnolia（Playboi Carti）</li><li>Wokeuplikethis*（Playboi Carti ft. Lil Uzi Vert）</li><li>Fell In Luv (Playboi Carti)</li><li>Long Time (Intro) (Playboi Carti)</li><li>ILoveUIHateU (Playboi Carti)</li><li>Chill Bae (Lil Uzi Vert)</li><li>Money Longer（Lil Uzi Vert）</li><li>Pissy Pamper (Playboi Carti)</li><li>Right (Rich The Kid)</li></ul>
