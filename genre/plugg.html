<h1>Plugg（プラグ）とは</h1>
<p>2013年ごろにインターネット上で生まれた、トラップを極端に軽く柔らかく作り替えた様式。最大の特徴は音色で、シンセの倍音が少ない丸い電子音や、玩具のような減衰の速いベル音、鉄琴に似た音が、単純な短い旋律を繰り返す。この上物が曲全体</p>
<p>2013年ごろにインターネット上で生まれた、トラップを極端に軽く柔らかく作り替えた様式。最大の特徴は音色で、シンセの倍音が少ない丸い電子音や、玩具のような減衰の速いベル音、鉄琴に似た音が、単純な短い旋律を繰り返す。この上物が曲全体を支配し、和音は厚みがあり、ジャジーな雰囲気を持つ。低音は厚く深い808のベースで、MexikoDroの手法では歪ませない柔らかな音(subby 808)が使われる。ハイハットは少なめで、疎でゆるいドラムの打ち込みが特徴で、全体としてトラップの攻撃性が徹底的に取り除かれている。テンポはMexikoDroの作品では毎分130〜145拍程度で、拍を半分に感じるため実際にはゆったり聞こえる。空間の作りにも特徴があり、上物にリバーブとディレイを深くかけて、輪郭をぼかす。ラップのフロウは攻撃的なものからゆるくメロウなものまで幅があり、ゆるいものが多く、歌詞は薬、恋愛、金、そしてインターネット上の記号や固有名詞が脈絡なく並ぶ。曲は2分前後と短い。制作はほぼ全員が自宅のパソコンで行い、YouTubeに無料または少額で公開される既製のビートを使う仕組みが前提になっている点も、この様式の成り立ちを規定している。</p>
<h2>成り立ち</h2><p>起点は2013年ごろのアトランタと、そのオンライン上の周辺にある。ジャンル名は、制作者集団BeatPluggzがSoundCloudで2013年から使っていた「Plug!」というタグに由来する。様式の起源とされるのは、BeatPluggzのMexikoDroとStoopidXoolらで、彼らが、当時のトラップの重く暗い音とは正反対の、明るく玩具的な音色を選び取った。この様式の広がりを可能にしたのは技術と流通の条件である。安価または無料の音楽制作ソフトが普及し、YouTubeには制作者が自作のビートを無料または少額で提供する市場が生まれ、SoundCloudが誰でも発表できる場を提供した。従来のように機材やスタジオや人脈を持たなくても、10代の若者が寝室で完結した音楽を作り、世界に届けられるようになったのである。2014〜15年ごろには、アトランタのPlayboi Cartiが「Broke Boi」(2015年)などでこの音色を取り込み、主流の注目を集めた。ただしCartiはその後MexikoDroと決別し、pluggを作っていないPi'erre Bourneと組んで2018年の『Die Lit』を出した。2020年前後、この流れはさらに変化する。Ken CarsonやDestroy Lonelyといった若い作り手がPlayboi Cartiのレーベルに加わり、より歪んだ攻撃的な派生が生まれた。一方でロシア圏でも広がり、独自の枝分かれを作っている。この様式は、アトランタのBeatPluggz(MexikoDro、StoopidXool)が一般に起源とされるが、インターネット上の集団的な性格が強い。多くのビートが無断で転用され、制作者に対価が渡らない問題も繰り返し指摘されている。</p>
<h2>代表曲</h2><ul><li>Plug Walk（Rich The Kid）</li><li>20 Min (Lil Uzi Vert)</li><li>Magnolia（Playboi Carti）</li><li>Wokeuplikethis*（Playboi Carti ft. Lil Uzi Vert）</li><li>Fell In Luv (Playboi Carti)</li><li>Long Time (Intro) (Playboi Carti)</li><li>ILoveUIHateU (Playboi Carti)</li><li>Chill Bae (Lil Uzi Vert)</li><li>Money Longer（Lil Uzi Vert）</li><li>Pissy Pamper (Playboi Carti)</li><li>Right (Rich The Kid)</li></ul>
