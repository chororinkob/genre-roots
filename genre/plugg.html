<h1>Plugg（プラグ）とは</h1>
<p>2010年代半ばのインターネット上で生まれた、トラップを極端に軽く柔らかく作り替えた様式。最大の特徴は音色で、シンセの倍音が少ない丸い電子音や、玩具のような減衰の速いベル音、鉄琴に似た音が、単純な短い旋律を繰り返す。この上物が曲全</p>
<p>2010年代半ばのインターネット上で生まれた、トラップを極端に軽く柔らかく作り替えた様式。最大の特徴は音色で、シンセの倍音が少ない丸い電子音や、玩具のような減衰の速いベル音、鉄琴に似た音が、単純な短い旋律を繰り返す。この上物が曲全体を支配し、和音は二つか三つの短調の和音を往復するだけである。低音は808のベースだが、歪ませず音量も控えめで、キックと同時に短く鳴らされる。ハイハットは細かく刻まれるが音量が低く、全体としてトラップの攻撃性が徹底的に取り除かれている。テンポは毎分130から160拍程度で、拍を半分に感じるため実際にはゆったり聞こえる。空間の作りにも特徴があり、上物にリバーブとディレイを深くかけて、輪郭をぼかす。ラップは張り上げず、気だるい発声でピッチ補正をかけて歌うように乗せられ、歌詞は薬、恋愛、金、そしてインターネット上の記号や固有名詞が脈絡なく並ぶ。曲は二分前後と短い。制作はほぼ全員が自宅のパソコンで行い、YouTubeに無料で公開される既製のビートを買って使う仕組みが前提になっている点も、この様式の成り立ちを規定している。</p>
<h2>成り立ち</h2><p>起点は2014年前後のアトランタと、そのオンライン上の周辺にある。名づけの元になったのは制作者Plugg Beatzだが、様式を確立したのはMexikoDroという制作者と、彼が所属していたKankan Beatzらを含むオンラインの制作者集団だった。とりわけMexikoDroとStoopidXool、Ken Carsonらが集ったオンラインの制作者集団が、当時のトラップの重く暗い音とは正反対の、明るく玩具的な音色を選び取った。この様式の広がりを可能にしたのは技術と流通の条件である。安価または無料の音楽制作ソフトが普及し、YouTubeには制作者が自作のビートを無料または少額で提供する市場が生まれ、SoundCloudが誰でも発表できる場を提供した。従来のように機材やスタジオや人脈を持たなくても、10代の若者が寝室で完結した音楽を作り、世界に届けられるようになったのである。2016年頃には、テキサス出身のTravis Scottの周辺や、アトランタのPlayboi Cartiがこの音色を取り込み、2018年の『Die Lit』でより広い聴き手に届いた。2020年前後、この流れはさらに変化する。Ken CarsonやDestroy Lonelyといった若い作り手がPlayboi Cartiのレーベルに加わり、より歪んだ攻撃的な派生が生まれた。一方でロシアや東欧の制作者が大量に参入し、独自の枝分かれを作っている。この様式は最初から最後までインターネット上の匿名的な集団によって作られており、明確な創始者や中心地を特定しにくいことそのものが特徴になっている。多くのビートが無断で転用され、制作者に対価が渡らない問題も繰り返し指摘されている。</p>
