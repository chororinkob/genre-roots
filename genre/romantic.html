<h1>Romanticとは</h1>
<p>おおよそ1800年から1900年頃までの西洋芸術音楽。中心にあるのは、音楽が作曲者個人の感情と内面を表現するものだという考え方で、それ以前の、様式的な均衡や機能への奉仕という価値観からの転換を意味する。和声はこの目的のために大きく</p>
<p>おおよそ1800年から1900年頃までの西洋芸術音楽。中心にあるのは、音楽が作曲者個人の感情と内面を表現するものだという考え方で、それ以前の、様式的な均衡や機能への奉仕という価値観からの転換を意味する。和声はこの目的のために大きく拡張された。半音階的な進行、遠隔調への転調、解決を先延ばしにする不協和音、そして属七以外の変化和音が多用され、19世紀後半には調性そのものが揺らぐ地点にまで至る。旋律は長く息の長い線を描き、大きな跳躍と幅広い音域を用いる。テンポは自由に伸縮するルバートが表現の要となり、強弱の幅も極端に広げられた。編成は劇的に拡大し、管弦楽は1800年頃の40人程度から、世紀末には100人を超える規模になった。ヴァルヴの発明により金管楽器が半音階を演奏できるようになったこと、そしてピアノが鉄骨と交差弦により音量と音域を増したことが、この拡大を可能にした。形式面では、絶対音楽としての交響曲と、文学や絵画に基づく標題音楽が対立しつつ並存した。小規模な分野では、詩に曲を付けた歌曲と、性格的小品と呼ばれる短いピアノ曲が発達した。</p>
<h2>成り立ち</h2><p>転換点はLudwig van Beethovenである。彼は古典派の形式を受け継ぎながら、1804年の交響曲第三番英雄でその規模と内容を根本から拡大した。この作品は当初ナポレオンに献呈される予定だったが、彼が皇帝に即位したと聞いたBeethovenが激怒して献辞を破り捨てたという逸話が伝えられる。20代後半から進行した聴力の喪失は、1802年のハイリゲンシュタットの遺書に記された絶望を経て、かえって内面へ向かう創作を促した。彼の後、Franz Schubertが600曲を超える歌曲で詩と音楽の融合を確立し、31歳で死去した。1830年代から1840年代には、Hector Berliozが1830年の幻想交響曲で、失恋の妄想を音楽で物語る標題音楽を確立し、Frédéric Chopinがピアノのための小品で内省的な表現を極めた。Robert SchumannとClara Schumann夫妻、そしてFranz Lisztは、それぞれ文学との結び付きと超絶技巧という別の道を示した。世紀後半には美学上の対立が先鋭化し、Richard WagnerとLisztを擁する新ドイツ楽派が総合芸術としての楽劇を主張したのに対し、Johannes Brahmsと批評家Eduard Hanslickは絶対音楽の立場を守り、両陣営の論争は音楽戦争と呼ばれた。Wagnerは1876年にバイロイトに専用の劇場を建て、自作のみを上演するという前例のない体制を作った。同時に、ヨーロッパ各地でナショナリズムの高まりを背景に、ロシアの五人組、チェコのAntonín Dvořák、フィンランドのJean Sibeliusらが、自国の民謡と歴史を素材とする国民楽派を形成した。19世紀末、Gustav MahlerとRichard Straussにおいて和声と規模は限界に達し、調性の解体という次の時代へ引き渡されることになる。</p>
<h2>代表曲</h2><ul><li>Symphony No. 5 (Ludwig van Beethoven)</li><li>Nocturne in E-flat major, Op. 9, No. 2 (Frédéric Chopin)</li><li>Liebestraum No. 3 (Franz Liszt)</li><li>Piano Concerto No. 2 in C minor, Op. 18 (Sergei Rachmaninoff)</li><li>Swan Lake (Pyotr Ilyich Tchaikovsky)</li></ul>
