<h1>Romanticとは</h1>
<p>ロマン派は、区分は諸説あり、1800年頃〜1900年頃とするのが一般的な目安とされる西洋芸術音楽だ。 中心にあるのは、音楽が作曲者個人の感情と内面を表現するものだという考え方だ。それ以前の、スタイルの均衡や、機能への奉仕を大切にす</p>
<p>ロマン派は、区分は諸説あり、1800年頃〜1900年頃とするのが一般的な目安とされる西洋芸術音楽だ。

中心にあるのは、音楽が作曲者個人の感情と内面を表現するものだという考え方だ。それ以前の、スタイルの均衡や、機能への奉仕を大切にする価値観からの転換を意味する。

和声（コードの響き）は、この目的のために大きく広げられた。半音階的な進行、遠隔調（主になる調と遠く離れた調）への転調、解決を先延ばしにする不協和音が多く使われる。属七以外の変化和音（音を一部変えた和音）も多用された。19世紀後半には、調性そのものが揺らぐところにまで至る。

旋律は、長く息の長い線を描き、大きな跳躍と幅広い音域を用いる。テンポは、自由に伸び縮みするルバート（テンポを自由に伸び縮みさせる奏法）が、表現の要となった。強弱の幅も、極端に広げられた。

編成は劇的に大きくなった。管弦楽は、1800年頃の40人程度から、最大規模の作品（WagnerやMahlerなど）では100人を超え、120人に達した。ヴァルヴ（管の長さを切り替える装置）の発明により、ホルンやトランペットなどが（手や唇に頼らず）半音階を演奏できるようになった。これが、この拡大を可能にした。ピアノも別に、鉄骨と交差弦によって音量と音域を増した。

形式の面では、絶対音楽（物語や絵に頼らない音楽）としての交響曲と、文学や絵画に基づく標題音楽が、対立しながら並び立った。小規模な分野では、詩に曲を付けた歌曲と、性格的小品と呼ばれる短いピアノ曲が発達した。</p>
<h2>成り立ち</h2><p>転換点はLudwig van Beethovenだ。彼は古典派の形式を受け継ぎながら、1803〜04年に作曲(1805年に公開初演)された交響曲第三番英雄で、その規模と内容を根本から広げた。

この作品には逸話がある。当初はナポレオンに献呈される予定だった。ところが、彼が皇帝に即位したと聞いたBeethovenは激怒し、表紙の「intitolata Bonaparte」の文字をカミソリで削り取った、と伝えられる。弟子Ferdinand Riesの回想では、表紙を真っ二つに破ったとされる。ただし、現存するのは筆写された楽譜で、Beethoven自筆の楽譜は残っていない。削り取った時期は確実ではなく、Riesの話は後年の回想である。

20代後半から進んだ聴力の喪失は、1802年のハイリゲンシュタットの遺書に記された絶望を経て、かえって内面へ向かう創作を促した。

同じ時代に、Franz Schubertが600曲を超える歌曲で、詩と音楽の融合を固めた。彼は31歳で世を去る。

1830年代から1840年代には、新しい表現が次々に生まれた。Hector Berliozは、1830年の幻想交響曲で、失恋の妄想を音楽で物語る標題音楽を、交響曲の規模で大きく発展させた。Frédéric Chopinは、ピアノのための小品で、内省的な表現を極めた。Robert SchumannとClara Schumann夫妻、そしてFranz Lisztは、それぞれ文学との結び付きと、超絶技巧という別の道を示した。

しかし、世紀後半には美学上の対立が激しくなる。Richard WagnerとLisztを擁する新ドイツ楽派は、総合芸術としての楽劇（物語と音楽を一体にしたオペラ）を主張した。これに対し、Johannes Brahmsと批評家Eduard Hanslickは、絶対音楽の立場を守った。両陣営の論争は、一部の音楽史家によって「ロマン派の戦争（War of the Romantics）」と呼ばれることがある。

Wagnerは、1876年にバイロイトに専用の祝祭劇場を開き、《指環》全曲を初演した。自作を上演する場とする構想はWagnerのもので、全主要作品に限る運用は、没後Cosimaが1886年から徹底した。

同じ頃、ヨーロッパ各地では、ナショナリズムが高まっていた。それを背景に、ロシアの5人組、チェコのAntonín Dvořák、フィンランドのJean Sibeliusらが、国民楽派を形成した。自国の民謡・叙事詩・歴史を素材とする音楽だ。

そして19世紀末、Gustav MahlerとRichard Straussにおいて、和声と規模は限界に達する。音楽は、調性の解体という次の時代へ引き渡されることになる。</p>
