<h1>Quiet Storm（クワイエットストーム）とは</h1>
<p>すでにあるスローなR&amp;Bやソウルの曲を並べるラジオの放送形式から生まれた、とても滑らかで穏やかなリズム・アンド・ブルースだ。 電気ピアノの丸く柔らかい音色や、深い残響をかけたシンセサイザーが空間を満たす。間奏では、サックスなどが伸</p>
<p>すでにあるスローなR&amp;Bやソウルの曲を並べるラジオの放送形式から生まれた、とても滑らかで穏やかなリズム・アンド・ブルースだ。

電気ピアノの丸く柔らかい音色や、深い残響をかけたシンセサイザーが空間を満たす。間奏では、サックスなどが伸びやかなソロを吹くこともある。1980年代の作品では、シンセサイザーも多く使われた。

和声はジャズの影響が強い。響きの色合いが次々に変わる進行が使われる。

テンポは遅めで、ゆったりしている。拍ははっきりしているが、決して急かさない。ドラムは音量を抑え、シンバルの余韻を丁寧に扱う。低音は滑らかに動き、跳ねずに滑っていく。

いちばん大切なのは歌だ。張り上げず、囁くように、あるいは吐息を混ぜて歌う。これは電気式のマイクに近づいて歌うことを前提にした技法とされる。何人もの声を厚く重ねたコーラスが、随所に加えられる。

歌詞は、成熟した恋愛、官能、別れ、そして誠実さを扱う。若者向けの性急さとは、はっきり一線を画している。

全体として、気持ちを高ぶらせず、部屋の空気を柔らかく満たすことが目的とされている。</p>
<h2>成り立ち</h2><p>名前の元は、1975年にSmokey Robinsonが発表した作品の題名だ。

しかし、形式と名称が全国に広まるきっかけは、ワシントンD.C.のWHURで1976年に流れた放送だとされる。フィラデルフィアのWDASでも、1972年に始まった似た番組が、1976年に同じ名前へ改められた。

1976年、当時ハワード大学の学生、あるいは卒業直後ともされるMelvin Lindseyが、WHURのCathy Hughesに頼まれ、日曜夜の放送の急な代役に入った。彼が遅くて滑らかな曲だけを選んで流すと、予想外の反響があった。Hughesは以前から、都会の独身の黒人女性向けのロマンチックな番組を考えていた。翌朝、彼女は彼と番組に「The Quiet Storm」という名前を思いついた。その後、番組として定着した。名前は先に挙げた作品から取られている。

数年のうちに、黒人や都市部の聴き手を中心とするほぼすべての局が、深夜枠で同じような番組を採用した。

背景には、はっきりした事情があった。1970年代後半のラジオの番組作りは、都市部の向上志向の独身の黒人女性など、既存の放送が十分に応えていなかった層を取りこぼしていたのである。落ち着いて聴ける音楽を求める声は大きかった。この形式は放送局にとって商売の面でも重要で、深夜という時間帯にもかかわらず、安定した聴き手と広告収入をもたらした。

音楽家の側も、これに応えた。Luther Vandrossは、圧倒的な歌唱力と緻密な編曲で、この分野を代表する成功者の一人となった。Anita Bakerは1986年の作品で、ジャズの素養を生かした深い声によって、商業的な大成功を収める。イギリスのSadeは、抑えに抑えた歌と洗練された編曲で、1980年代半ばにQuiet Storm期を代表する存在の一つとなり、世界的な成功を収めた。同じ時期には、Freddie JacksonやPeabo Brysonらも活躍した。1990年代には、Toni Braxtonが低い声域を武器に、この伝統を受け継いだ。

一方で、批判もある。当たり障りがなく、背景で流れるためだけの音楽だという指摘だ。この批判に対し、背景で聴かれるという役割を重視する見方もある。実際、1990年代半ば、1995年のD'Angelo『Brown Sugar』などから注目されたネオソウルは、スタイルの起源の一つにこの分野が挙げられている。</p>
<h2>代表曲</h2><ul><li>Secret Lovers (Atlantic Starr)</li><li>Smooth Operator (Sade)</li><li>Ready or Not (After 7)</li><li>Giving You the Best That I Got (Anita Baker)</li><li>Always and Forever (Heatwave)</li><li>Between the Sheets (The Isley Brothers)</li><li>Distant Lover (Marvin Gaye)</li><li>A Quiet Storm (Smokey Robinson)</li><li>Rain (SWV)</li><li>Memory Lane (Minnie Riperton)</li><li>Who Can I Run To (The Jones Girls)</li><li>A House Is Not a Home (Luther Vandross)</li></ul>
