<h1>Quiet Storm（クワイエットストーム）とは</h1>
<p>既存のスローなR&amp;Bやソウルの曲を並べる放送形式から生まれた、極めて滑らかで穏やかなリズム・アンド・ブルースである。テンポは遅めでゆったりしており、拍は明確でありながら決して急かさない。ドラムは音量を抑え、シンバルの余韻が丁寧に扱</p>
<p>既存のスローなR&amp;Bやソウルの曲を並べる放送形式から生まれた、極めて滑らかで穏やかなリズム・アンド・ブルースである。テンポは遅めでゆったりしており、拍は明確でありながら決して急かさない。ドラムは音量を抑え、シンバルの余韻が丁寧に扱われる。低音は滑らかに動き、跳ねずに滑る。和声はジャズの語法を全面的に取り入れ、七の和音、九の和音、そして次々に響きの色合いが変わる進行が用いられる。電気ピアノの丸く柔らかい音色や、深い残響をかけたシンセサイザーが空間を満たし、間奏ではサックスなどが伸びやかな独奏を吹くこともある。1980年代の作品では、シンセサイザーやドラムマシンも多く使われた。歌唱が最も重要で、張り上げず、囁くように、あるいは吐息を含ませて歌われる。これは電気式のマイクに接近して歌うことを前提とした技法である。複数の声を厚く重ねた合唱が随所に加えられる。歌詞は成熟した恋愛、官能、別れ、そして誠実さを扱い、若者向けの性急さとは一線を画す。全体として、意識を高ぶらせず、部屋の空気を柔らかく満たすことが目的とされている。</p>
<h2>成り立ち</h2><p>名称は1975年にSmokey Robinsonが発表した作品の題名に由来する。しかしこの語が音楽の分類として定着したのは、その翌年、ワシントンD.C.のラジオ局において起きた出来事による。1976年、ハワード大学の学生だったMelvin Lindseyが、同局のCathy Hughesに頼まれて日曜夜の放送の急な代役に入り、遅くて滑らかな楽曲だけを選んで流したところ、予想外の反響を得た。Hughesは以前から、都会の独身の黒人女性向けのロマンチックな番組を構想しており、翌日にこれを正式な番組として「The Quiet Storm」と名づけた。名は前述の作品から取られている。この形式は数年のうちに、黒人や都市部の聴取者を中心とする局のほぼすべてに採用される。背景には明確な事情があった。1970年代後半、ラジオの編成は、都市部の向上志向の独身の黒人女性など、既存の放送が十分に応えていなかった層を取りこぼしていたのである。落ち着いて聴ける音楽への需要は大きかった。この形式は放送局にとって商業的にも重要で、深夜という時間帯にもかかわらず安定した聴取者と広告収入をもたらした。音楽家の側もこれに応えた。Luther Vandrossは、圧倒的な歌唱力と緻密な編曲によってこの分野の頂点に立ち、Anita Bakerは1986年の作品で、ジャズの素養を活かした深い声によって商業的な大成功を収める。イギリスのSadeは、抑制を極めた歌唱と洗練された編曲で、この様式を国際的なものにした。Freddie JacksonやPeabo Brysonが続き、1990年代にはToni Braxtonが低い声域を武器にこの伝統を受け継いだ。批判もある。すなわち、当たり障りがなく、背景で流れるためだけの音楽だという指摘である。しかしこの批判は、この形式が背景で聴かれるという機能を無視している。実際、1990年代半ばに現れたネオソウルは、様式的な起源の一つにこの分野が挙げられている。</p>
<h2>代表曲</h2><ul><li>Secret Lovers (Atlantic Starr)</li><li>Smooth Operator (Sade)</li><li>Ready or Not (After 7)</li><li>Giving You the Best That I Got (Anita Baker)</li><li>Always and Forever (Heatwave)</li><li>Between the Sheets (The Isley Brothers)</li><li>Distant Lover (Marvin Gaye)</li><li>A Quiet Storm (Smokey Robinson)</li><li>Rain (SWV)</li><li>Memory Lane (Minnie Riperton)</li><li>Who Can I Run To (The Jones Girls)</li><li>A House Is Not a Home (Luther Vandross)</li></ul>
