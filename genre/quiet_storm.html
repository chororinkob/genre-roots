<h1>Quiet Storm（クワイエットストーム）とは</h1>
<p>深夜のラジオで流すために設計された、極めて滑らかで穏やかなリズム・アンド・ブルースである。テンポは概ね60から90 BPMと遅く、拍は明確でありながら決して急かさない。ドラムは音量を抑え、しばしば刷毛で撫でるように叩かれ、シンバル</p>
<p>深夜のラジオで流すために設計された、極めて滑らかで穏やかなリズム・アンド・ブルースである。テンポは概ね60から90 BPMと遅く、拍は明確でありながら決して急かさない。ドラムは音量を抑え、しばしば刷毛で撫でるように叩かれ、シンバルの余韻が丁寧に扱われる。低音は指弾きの滑らかな動きで、跳ねずに滑る。和声はジャズの語法を全面的に取り入れ、七の和音、九の和音、そして次々に色を変える進行が用いられる。中心的な楽器は電気ピアノで、その丸く柔らかい音色が全体の質感を決める。加えて、深い残響をかけたシンセサイザーの持続音が空間を満たし、間奏ではソプラノサックスが伸びやかな独奏を吹く。この、管楽器による艶やかな独奏はこの様式の記号となっている。歌唱が最も重要で、張り上げず、囁くように、あるいは吐息を含ませて歌われる。これは電気式のマイクに接近して歌うことを前提とした技法である。複数の声を厚く重ねた合唱が随所に加えられる。歌詞は成熟した恋愛、官能、別れ、そして誠実さを扱い、若者向けの性急さとは一線を画す。全体として、意識を高ぶらせず、部屋の空気を柔らかく満たすことが目的とされている。</p>
<h2>成り立ち</h2><p>名称は1975年にSmokey Robinsonが発表した作品の題名に由来する。しかしこの語が音楽の分類として定着したのは、その翌年、ワシントンD.C.のラジオ局において起きた出来事による。1976年、ハワード大学の学生だったMelvin Lindseyが、深夜の時間帯の代役として放送に入り、遅くて滑らかな楽曲だけを選んで流したところ、予想外の反響を得た。局はこれを正式な番組として編成し、その名を前述の作品から取った。この形式は瞬く間に全米の放送局へ広まる。背景には明確な事情があった。1970年代後半、ラジオの編成は若者向けの流行に偏っており、30代以上の黒人の聴取者に向けた時間帯が存在しなかったのである。仕事を終え、子どもを寝かしつけた後の時間に、落ち着いて聴ける音楽への需要は大きかった。この形式は放送局にとって商業的にも重要で、深夜という時間帯にもかかわらず安定した聴取者と広告収入をもたらした。音楽家の側もこれに応えた。Luther Vandrossは、圧倒的な歌唱力と緻密な編曲によってこの分野の頂点に立ち、Anita Bakerは1986年の作品で、ジャズの素養を活かした深い声によって商業的な大成功を収める。イギリスのSadeは、抑制を極めた歌唱と洗練された編曲で、この様式を国際的なものにした。Freddie JacksonやPeabo Brysonが続き、1990年代にはToni Braxtonが低い声域を武器にこの伝統を受け継いだ。批判もある。すなわち、当たり障りがなく、背景で流れるためだけの音楽だという指摘である。しかしこの批判は、この形式が意図的に設計された機能を無視している。実際、1990年代半ばに現れたネオソウルは、この分野の和声と質感を直接の出発点としており、2010年代以降の内省的なリズム・アンド・ブルースにも、その影響は明瞭に残っている。</p>
<h2>代表曲</h2><ul><li>A Quiet Storm (Smokey Robinson)</li><li>Smooth Operator (Sade)</li><li>Giving You the Best That I Got (Anita Baker)</li></ul>
