<h1>Doo-Wop（ドゥーワップ）とは</h1>
<p>ドゥーワップは、男声を中心とした少人数のグループ（女性グループもあった）が、和声を組み上げる歌ものだ。 街角では、楽器なしで歌うことが多かった。ただし、録音には楽器伴奏が付くことが多い。それでも、伴奏は「ごく控えめ」だった。三連符</p>
<p>ドゥーワップは、男声を中心とした少人数のグループ（女性グループもあった）が、和声を組み上げる歌ものだ。

街角では、楽器なしで歌うことが多かった。ただし、録音には楽器伴奏が付くことが多い。それでも、伴奏は「ごく控えめ」だった。三連符の伴奏を持つバラードが多く、録音によってはサックスなどが加わる。

和音進行は、トニックから6度、4度、5度へと戻る、いわゆる50年代進行が使われる。I–vi–IV–Vは古くから存在する進行だ。1950年代〜60年代初頭に多用され、とくにドゥーワップと結びつく。そのため、50年代進行・ドゥーワップ進行などと呼ばれる。

テンポは、ゆったり揺れるバラード型と、はねるリズムで踊らせるアップテンポ型の二種に大きく分かれる。

声の編成は、リードを取るテナー、その上をファルセット（裏声）で飾るファースト・テナー、内声を埋めるバリトン、一番下でブン、ブンと単音を跳ねさせるベースという役割分担が「多くの場合」定型だ。歌詞のない部分では、ドゥーワップ、シュブーム、ディップディップディップといった意味を持たない音節を、リード以外が刻む。それがそのまま伴奏の役目を果たす。ジャンル名の「doo-wop」はナンセンス音節で、語が活字になったのは1961年とされる。

曲の中盤のブリッジには、語り（レシテーション）が置かれることが多い。

練習と披露の場は、街角、アパートの玄関先、橋の下、校内の廊下やトイレ、地下鉄など、声が反響する場所だ。マイクも増幅装置も要らないことが、金のない若者たちに開かれた音楽であった理由でもある。</p>
<h2>成り立ち</h2><p>源流は、1930年代から40年代にかけて活動した、The Ink SpotsやThe Mills Brothersといった黒人ボーカルグループにある。もう一つは、教会で歌われていたゴスペル・カルテットだ。

第二次大戦後、ニューヨークのハーレム、ブロンクス、フィラデルフィア、ボルティモア、シカゴの黒人居住区で、この音楽が広がった。担ったのは、楽器に触れる機会が乏しい都市の若者たちだ。声だけで演奏できる音楽として広めた。和声は、スピリチュアル、ゴスペル、バーバーショップ系ボーカルなどに根ざす。

初期の代表格は、次の組である。1947年ごろ（Vibra-Naires名義）に結成され、1948年に最初の録音をしたThe Orioles。1953年の『Gee』を出したThe Crows。同年の『Money Honey』のThe Driftersだ。

そして、1954年にポップ・チャートへ食い込んだ曲がある。『Gee』と並び、白人層への波及を決定づけた曲のひとつが、ブロンクスで1951年に結成されたグループThe Chordsが放った『Sh-Boom』だった。

当時、黒人グループの曲を白人グループが録り直すカバー商法が広く行われた。『Sh-Boom』もその標的となった。The Crew-Cutsによる『Sh-Boom』のカバーが、本家を押しのけて全米一位になるという事態も起きた。

ラジオでは、白人DJのAlan Freedがこの音楽を積極的にかけ、ロックンロールという呼び名を広めた。

1956年のFrankie Lymon and the Teenagersの『Why Do Fools Fall in Love』は、当時13歳の少年が歌い、大ヒットした。しかし、Lymonは麻薬に溺れて25歳で亡くなった。権利をめぐる裁判が、死後約20年後の1986年から1990年代まで続いた。

ドゥーワップの黄金期は、イタリア系やプエルトリコ系の若者にも広がり、Dion and the Belmontsといった白人グループも生んだ。1961年には、1959年にピッツバーグで結成された多人種のグループThe Marcelsが、『Blue Moon』を全米と英国で1位にした。

しかし、1960年代初頭にはソウルが人気を集めたことなどで勢いを失い、1964年のブリティッシュ・インヴェイジョンでチャートから姿を消した。衰退の時期や原因には議論がある。

ただし、消滅したわけではない。1970年代〜90年代に復興（リバイバル）の動きがあり、バーバーショップや大学のアカペラ・グループにも好まれた。コーラスの組み立て方は、後のソウル、ソフトロック、そして現代のアカペラ集団にまで受け継がれている。</p>
