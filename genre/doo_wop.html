<h1>Doo-Wop（ドゥーワップ）とは</h1>
<p>男声を中心とした少人数のグループ（女性グループもあった）が、伴奏を最小限にして和声を組み上げる歌もの。街角では楽器なしで歌うことが多かったものの、録音には楽器伴奏が付くことが多く、その伴奏はごく控えめだった。編成はリードを取るテナ</p>
<p>男声を中心とした少人数のグループ（女性グループもあった）が、伴奏を最小限にして和声を組み上げる歌もの。街角では楽器なしで歌うことが多かったものの、録音には楽器伴奏が付くことが多く、その伴奏はごく控えめだった。編成はリードを取るテナー、その上をファルセット（裏声）で飾るファースト・テナー、内声を埋めるバリトン、そして一番下でブン、ブンと単音を跳ねさせるベースという役割分担が多く、ジャンル名の「doo-wop」はナンセンス音節で、語が活字になったのは1961年とされる。歌詞のない部分ではドゥーワップ、シュブーム、ディップディップディップといった意味を持たない音節を、多くの場合リード以外の声部が刻み、それがそのまま伴奏の役目を果たす。和音進行は、トニックから6度、4度、5度へと戻るいわゆる50年代進行が使われる。I–vi–IV–Vは古くから存在する進行で、1950年代〜60年代初頭に多用され、とくにドゥーワップと結びつくため、50年代進行・ドゥーワップ進行などと呼ばれる。三連符（1拍を3等分したリズム）の伴奏を持つバラードが多く、録音によってはサックスなどが加わる。ブリッジ（曲の中盤の別の部分）には、語り（レシテーション）が置かれることが多い。テンポは、ゆったり揺れるバラード型と、はねるリズムで踊らせるアップテンポ型の二種に大きく分かれる。練習と披露の場は街角、アパートの玄関先、橋の下、校内の廊下やトイレ、地下鉄など、声がよく響く場所で、マイクも増幅装置も要らないことが、金のない若者たちに開かれた音楽であった理由でもある。</p>
<h2>成り立ち</h2><p>源流は1930年代から40年代にかけて活動したThe Ink SpotsやThe Mills Brothersといった黒人ボーカルグループと、教会で歌われていたゴスペル・カルテットにある。第二次大戦後、ニューヨークのハーレム、ブロンクス、フィラデルフィア、ボルティモア、シカゴの黒人居住区で、楽器に触れる機会が乏しい10代の少年たちが街角に集まり、声だけで演奏できる音楽として広めた。和声はスピリチュアル、ゴスペル、バーバーショップ系のボーカルなどに根ざしている。1947年ごろ（Vibra-Naires名義）に結成され、1948年に最初の録音をしたThe Orioles、1953年の『Gee』を出したThe Crows、同年の『Money Honey』のThe Driftersが初期の代表格で、白人の若者にも広がる重要な曲のひとつとなったのは、『Gee』と並んで1954年にポップ・チャートへ食い込んだ、ブロンクスで1951年に結成されたグループThe Chordsの『Sh-Boom』だった。当時は、黒人グループの曲を白人グループが録り直して発売するカバー商法が広く行われており、『Sh-Boom』もその標的となって、The Crew-Cutsによる『Sh-Boom』のカバーが本家を押しのけて全米一位になるという事態も起きた。ラジオでは白人DJのAlan Freedがこの音楽を積極的にかけ、ロックンロールという呼び名を広めた。1956年のFrankie Lymon and the Teenagersの『Why Do Fools Fall in Love』は当時13歳の少年が歌い大ヒットしたが、Lymonは麻薬に溺れて25歳で亡くなり、権利をめぐる裁判が、死後約20年後の1986年から1990年代まで続いた。ドゥーワップ黄金期はイタリア系やプエルトリコ系の若者にも広がり、Dion and the Belmontsといった白人グループも生んだ。1961年には、1959年にピッツバーグで結成された多人種のグループThe Marcelsが『Blue Moon』を全米と英国で1位にした。だが1960年代初頭にはソウルの台頭などで勢いを失い、1964年のブリティッシュ・インヴェイジョンでチャートから姿を消した。衰退の時期や原因には議論がある。ただし消滅したわけではなく、1970年代〜90年代に復興（リバイバル）の動きがあり、バーバーショップや大学のアカペラ（伴奏なしの合唱）グループにも好まれ、コーラスの組み立て方は後のソウル、ポップ、ロック、そして現代のアカペラ集団にまで受け継がれている。</p>
