<h1>Doo-Wop（ドゥーワップ）とは</h1>
<p>四人から五人の男声グループが、伴奏を最小限にして人間の声だけで和声を組み上げる歌もの。編成はリードを取るテナー、その上をファルセットで飾るファースト・テナー、内声を埋めるバリトン、そして一番下でブン、ブンと単音を跳ねさせるベースと</p>
<p>四人から五人の男声グループが、伴奏を最小限にして人間の声だけで和声を組み上げる歌もの。編成はリードを取るテナー、その上をファルセットで飾るファースト・テナー、内声を埋めるバリトン、そして一番下でブン、ブンと単音を跳ねさせるベースという役割分担が定型で、この最低音の担当者が刻む擬音がジャンル名の由来になった。歌詞のない部分ではドゥーワップ、シュブーム、ディップディップディップといった意味を持たない音節を全員で刻み、それがそのまま伴奏の役目を果たす。和音進行はトニックから六度、四度、五度へと戻るいわゆる50年代進行の反復が圧倒的に多く、この四つの和音だけで数百曲が作られた。ピアノは三連符を細かく刻み、テナーサックスがブリッジで一節吹き、ギターとドラムは音量を絞って輪郭を支えるだけに留まる。テンポは、ゆったり揺れるバラード型と、はねるリズムで踊らせるジャンプ型の二種に大きく分かれる。歌詞は片思い、卒業式、月の光、天使といった甘い題材にほぼ限定される。練習と披露の場は街角の外灯の下、地下鉄の通路、教会の石段など、声がよく響く場所で、マイクも増幅装置も要らないことが、金のない若者たちに開かれた音楽であった理由でもある。</p>
<h2>成り立ち</h2><p>源流は1930年代から40年代にかけて活動したThe Ink SpotsやThe Mills Brothersといった黒人ボーカルグループと、教会で歌われていたゴスペル・カルテットにある。第二次大戦後、ニューヨークのハーレム、ブロンクス、フィラデルフィア、ボルティモア、シカゴの黒人居住区で、レコードを買う金も楽器を買う金もない10代の少年たちが街角に集まり、ゴスペルの和声を恋の歌に置き換えて歌い始めた。1948年結成のThe Orioles、1953年の『Gee』を出したThe Crows、同年の『Money Honey』のThe Driftersが初期の代表格で、決定打は1954年、ニュージャージーの高校生グループThe Chordsが放った『Sh-Boom』だった。この曲が白人の若者にも売れたことで、黒人グループの曲を白人グループが録り直して発売するカバー商法が横行し、The Crew-Cutsによる『Sh-Boom』のカバーが本家を押しのけて全米一位になるという事態も起きた。ラジオでは白人DJのAlan Freedがこの音楽を積極的にかけ、ロックンロールという呼び名を広めた。1956年のFrankie Lymon and the Teenagersの『Why Do Fools Fall in Love』は当時13歳の少年が歌い大ヒットしたが、Lymonは麻薬に溺れて25歳で亡くなり、権利をめぐる裁判が死後何十年も続いた。ドゥーワップ黄金期はイタリア系やプエルトリコ系の若者にも広がり、1961年のThe Marcels『Blue Moon』、Dion and the Belmontsといった白人グループも生んだ。だが1963年頃、モータウンやフィル・スペクターの厚い制作と、翌年のビートルズを筆頭とするブリティッシュ・インヴェイジョンに押されて主流から退場する。ただし消滅したわけではなく、1970年代以降は懐メロ興行やアカペラのコンテストとして生き延び、コーラスの組み立て方は後のソウル、ソフトロック、そして現代のアカペラ集団にまで受け継がれている。</p>
<h2>代表曲</h2><ul><li>Only You (The Platters)</li><li>In the Still of the Night (The Five Satins)</li><li>Why Do Fools Fall in Love (Frankie Lymon &amp; the Teenagers)</li><li>A Teenager in Love (Dion and the Belmonts)</li></ul>
