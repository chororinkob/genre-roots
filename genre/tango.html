<h1>Tango（タンゴ）とは</h1>
<p>タンゴは、アルゼンチンとウルグアイのラプラタ川流域で生まれた、緊張と情念の音楽だ。 編成の核はバンドネオンである。19世紀のドイツで、宗教音楽や当時の大衆音楽のために作られた蛇腹楽器だ。ボタンの配置が不規則で、押すときと引くときで</p>
<p>タンゴは、アルゼンチンとウルグアイのラプラタ川流域で生まれた、緊張と情念の音楽だ。

編成の核はバンドネオンである。19世紀のドイツで、宗教音楽や当時の大衆音楽のために作られた蛇腹楽器だ。ボタンの配置が不規則で、押すときと引くときで音が変わるという難物だった。その息苦しいような音色が、タンゴの声となった。標準的な編成は、オルケスタ・ティピカと呼ばれる。バンドネオン2台以上、バイオリン二挺以上、ピアノ、コントラバス(フルートを含む場合もある)からなる。2+2の六重奏が標準編成として固まったのは、1910年代から1920年代だった。

弦楽器には特殊奏法が多い。弓の根元を駒の後ろの弦に当てて、ざらついた打楽器的な音を出すのがチチャーラだ。楽器の胴を叩くのがゴルペ、弦の上で指を速く滑らせて音を上げるのがラティゴである。打楽器を持たない編成で、打楽器的な効果を作る工夫が発達した。

和声（コードの響き）は、短調で始まる曲が多い。増2度を含む音階や半音階的な進行が、緊張を生む。

拍子は4分の2または4分の4で、BPMは110〜130程度だ。最大の特徴は演奏法にある。マルカートと呼ばれる、各拍を強く踏み込む刻みがある。シンコペーション（拍の位置をずらす）と、8分音符8個を3+3+2に区切る型（ハバネラ系のリズムに由来）もある。これらが、並ぶ別の型として交互に現れる。

歌唱は語りに近いことが多い。深い胸声（胸に響く地声）で、人生の苦渋を吐き出すような歌い方が目立つ。

歌詞は、喪失、裏切り、老い、故郷、そして街への愛憎を扱う。</p>
<h2>成り立ち</h2><p>タンゴは、1880年代にラプラタ川流域で形成され、1890〜1920年に定着した。発祥地は、港湾の貧困地区説と市街周縁説がある。

当時この地域には、ヨーロッパ、とりわけイタリアとスペインから、移民が大量に流入していた。移民の多くは男性で、女性が少なかった。そこにアフリカ系住民のカンドンベ、キューバ由来のハバネラ、ミロンガ(起源には諸説あり、パンパ説やブラジル由来説などがある)が混ざり合い、この音楽が形成された。

娼館・酒場との結びつきが語られてきたが、娼館起源説は研究者が否定している。上流層が軽蔑した面はあるが、実態には異論がある。一方、パリでは1911〜14年にタンゴ熱が起きた。これが本国での受容を後押ししたとする見方が一般的だが、異論もある。

1917年、Carlos Gardelが、Mi Noche Tristeを録音した。それまで器楽が中心だったタンゴの中で、歌のタンゴ（タンゴ・カンシオン）の出発点となった。彼は1890年12月11日にフランスのトゥールーズで生まれたとする説が有力だ。2012年に既知の記録と同内容の出生記録の控えが見つかった(ウルグアイ側は今も異論を唱えている)。その甘い歌声と美貌により、ラテンアメリカ全域で絶大な人気を得た。しかし1935年にコロンビアのメデジンで航空機事故により死去し、伝説となった。

1930年代後半〜1950年代半ば（特に1940年代）は、タンゴの黄金時代と呼ばれる。Aníbal Troilo、Carlos Di Sarli、Osvaldo Pugliese、Juan D'Arienzoといった楽団長が、それぞれ異なるスタイルを極め、ブエノスアイレスの無数のダンスホールを満たした。

Osvaldo Puglieseは、1936年に共産党に入党した。1939年から繰り返し拘束され（初回の理由は不明確）、1948年と1955年の投獄も記録されている。1956年または1957年(資料により異なる)にも拘束された。その際には、楽団が彼のピアノの上に赤いカーネーションを置いて演奏を続けたという逸話が残る（逸話は「そう言われている」程度で、本人が後から現れることも多かったとされる）。

1950年代以降、政治的な混乱とロックの流入によりタンゴは急速に衰退した。この状況を打破したのがAstor Piazzolla（本名 Astor Pantaleón Piazzolla）だ。彼はパリでNadia Boulangerに学んだ後、ジャズとクラシックの手法を持ち込んだヌエボ・タンゴを定着させた。しかし伝統派からは激しく非難され、街で罵られたり、「タンゴ殺し」と呼ばれたりしたと言われる。バンドネオン2台を交響楽団に入れたコンサート（パリ行き前の1953年とされる）では、客席の乱闘が起きた。

1983年に民政移管（軍の政権から民間の政権へ戻ること）があった。その後、舞台作品『Tango Argentino』が、1983年にパリで初演され、1985年にブロードウェイで上演された。こうした国際的な成功により、タンゴは再び世界的な認知を得ている。</p>
