<h1>Tango（タンゴ）とは</h1>
<p>アルゼンチンとウルグアイのラプラタ川流域で生まれた、緊張と情念の音楽。編成の核はバンドネオンで、これは19世紀のドイツで宗教音楽や当時の大衆音楽のために作られた蛇腹楽器だが、ボタンの配置が不規則で押すときと引くときで音が変わるとい</p>
<p>アルゼンチンとウルグアイのラプラタ川流域で生まれた、緊張と情念の音楽。編成の核はバンドネオンで、これは19世紀のドイツで宗教音楽や当時の大衆音楽のために作られた蛇腹楽器だが、ボタンの配置が不規則で押すときと引くときで音が変わるという難物であり、その息苦しいような音色がタンゴの声となった。標準的な編成はオルケスタ・ティピカと呼ばれ、バンドネオン2台以上、バイオリン二挺以上、ピアノ、コントラバス(フルートを含む場合もある)からなり、初期には2+2の六重奏が標準だった。拍子は4分の2または4分の4で、BPMは110〜130程度。最大の特徴は演奏法にあり、マルカートと呼ばれる各拍を強く踏み込む刻み、シンコペーション（拍の位置をずらす）、そして8分音符8個を3+3+2に区切る型（ハバネラ系のリズムに由来）などが、それぞれ別の型として使われる。弦楽器には特殊奏法が多く、弓の根元を駒の後ろの弦に当ててざらついた打楽器的な音を出すチチャーラ、楽器の胴を叩くゴルペ、弦の上で指を速く滑らせて音を上げるラティゴなど、打楽器を持たない編成で打楽器的な効果を作る工夫が発達した。和声（コードの響き）は短調が基本で、増2度を含む音階や半音階的な進行が緊張を生む。歌唱は語りに近く、深い胸声（胸に響く地声）で人生の苦渋を吐き出す。歌詞は喪失、裏切り、老い、故郷、そして街への愛憎を扱う。</p>
<h2>成り立ち</h2><p>1880年代にラプラタ川流域で形づくられ、1890年から1920年ごろに確立した。発祥地は、港湾地区の貧しい地域とする説と、市街の周縁部とする説がある。当時この地域には、ヨーロッパ、とりわけイタリアとスペインからの移民が大量に流入しており、移民の多くは男性で、女性が少なかった。そこにアフリカ系住民のカンドンベ、キューバ由来のハバネラ、ミロンガ(起源には諸説あり、パンパ説やブラジル由来説などがある)が混ざり合い、この音楽が形成された。娼館や酒場と結びつけて語られてきたが、娼館が起源とする説は研究者が否定している。上流層が軽蔑した面はあるが、実態には異論がある。1911年から1914年にかけてパリでタンゴ熱が起き、社交界の流行となった。これが本国での受け入れを後押ししたとする見方が一般的だが、ブエノスアイレスでは1900年代初頭から広く受け入れられていたとして異論もある。1917年、Carlos Gardelが Mi Noche Tristeを録音し、それまで器楽が中心だったタンゴに歌の形式を確立した。彼は1890年12月11日にフランスのトゥールーズで生まれたとする説が有力で、2012年に出生記録の控えが見つかって裏づけが強まった(ウルグアイ側は今も異論を唱えている)。その甘い歌声と美貌によりラテンアメリカ全域で絶大な人気を得たが、1935年にコロンビアのメデジンで航空機事故により死去し、伝説となった。1940年代はタンゴの黄金時代と呼ばれ、Aníbal Troilo、Carlos Di Sarli、Osvaldo Pugliese、Juan D'Arienzoといった楽団長がそれぞれ異なる様式を極め、ブエノスアイレスの無数のダンスホールを満たした。Osvaldo Puglieseは共産党員で、1939年から繰り返し拘束された(最初の理由ははっきりしない)。1948年と、ペロン政権下の1955年にも投獄された記録があり、軍事政権下の1956年または1957年(資料により異なる)にも拘束された。その際には楽団が彼のピアノの上に赤いカーネーションを置いて演奏を続けたという逸話が残る（逸話は「そう言われている」程度で、本人が後から現れることも多かったとされる）。1950年代以降、政治的な混乱とロックの流入によりタンゴは急速に衰退した。この状況を打破したのがAstor Piazzollaで、彼はパリでNadia Boulangerに学んだ後、ジャズとクラシックの手法を持ち込んだヌエボ・タンゴを確立した。しかし伝統派からは激しく非難され、街で罵られたり、「タンゴ殺し」と呼ばれたり、バンドネオン2台を交響楽団に入れたコンサート（パリ行き前の1953年とされる）で客席の乱闘が起きたりした。1983年の民政移管（軍の政権から民間の政権へ戻ること）後、そして舞台作品『Tango Argentino』の1983年のパリ初演と1985年のブロードウェイ上演などの国際的な成功により、タンゴは再び世界的な認知を得ている。</p>
