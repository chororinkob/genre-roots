<h1>Tango（タンゴ）とは</h1>
<p>アルゼンチンとウルグアイのラプラタ川流域で生まれた、緊張と情念の音楽。編成の核はバンドネオンで、これは十九世紀のドイツで宗教音楽のために作られた蛇腹楽器だが、ボタンの配置が不規則で押すときと引くときで音が変わるという難物であり、そ</p>
<p>アルゼンチンとウルグアイのラプラタ川流域で生まれた、緊張と情念の音楽。編成の核はバンドネオンで、これは十九世紀のドイツで宗教音楽のために作られた蛇腹楽器だが、ボタンの配置が不規則で押すときと引くときで音が変わるという難物であり、その息苦しいような音色がタンゴの声となった。標準的な編成はオルケスタ・ティピカと呼ばれ、バンドネオン四台、バイオリン四挺、ピアノ、コントラバスからなる。拍子は四分の四または二分の二で、BPMは110〜130程度。最大の特徴は演奏法にあり、マルカートと呼ばれる各拍を強く踏み込む刻み、そしてシンコペーションで三拍三拍二拍に分割するミロンガ的な型が交互に現れる。弦楽器には特殊奏法が多く、弓を弦に叩きつけるチチャーラ、楽器の胴を叩くゴルペ、弦を強く滑らせるラティゴなど、打楽器を持たない編成で打楽器的な効果を作る工夫が発達した。和声は短調が基本で、増二度を含む音階や半音階的な進行が緊張を生む。歌唱は語りに近く、深い胸声で人生の苦渋を吐き出す。歌詞は喪失、裏切り、老い、故郷、そして街への愛憎を扱う。</p>
<h2>成り立ち</h2><p>1880年代から1890年代、ブエノスアイレスとモンテビデオの港湾地区で生まれた。当時この地域には、ヨーロッパ、とりわけイタリアとスペインからの移民が大量に流入しており、住民の大半が男性の独身労働者だった。そこにアフリカ系住民のカンドンベ、キューバ由来のハバネラ、アルゼンチン内陸のミロンガが混ざり合い、この音楽が形成された。当初は貧民街と娼館の音楽であり、上流社会からは卑猥なものとして排斥された。転機は1910年代のパリで、この音楽が社交界の流行となり、逆輸入される形でブエノスアイレスの上流層にも受け入れられた。1917年、Carlos Gardelが Mi Noche Tristeを録音し、それまで器楽が中心だったタンゴに歌の形式を確立した。彼はフランス生まれとされるが出生には諸説あり、その甘い歌声と美貌によりラテンアメリカ全域で絶大な人気を得たが、1935年にコロンビアのメデジンで航空機事故により死去し、伝説となった。1940年代はタンゴの黄金時代と呼ばれ、Aníbal Troilo、Carlos Di Sarli、Osvaldo Pugliese、Juan D'Arienzoといった楽団長がそれぞれ異なる様式を極め、ブエノスアイレスの無数のダンスホールを満たした。Osvaldo Puglieseは共産党員であったため軍政下で繰り返し投獄され、その際には楽団が彼のピアノの上に赤いカーネーションを置いて演奏を続けたという逸話が残る。1950年代以降、政治的な混乱とロックの流入によりタンゴは急速に衰退した。この状況を打破したのがÁstor Piazzollaで、彼はパリでNadia Boulangerに学んだ後、ジャズとクラシックの語法を持ち込んだヌエボ・タンゴを確立した。しかし伝統派からは激しく糾弾され、身の危険を感じるほどの敵意を向けられた。1983年の民政移管後、そして1990年代以降の舞台作品の国際的な成功により、タンゴは再び世界的な認知を得ている。</p>
<h2>代表曲</h2><ul><li>La Cumparsita（Carlos Gardel）</li><li>Libertango（Astor Piazzolla）</li><li>El Choclo（Ángel Villoldo）</li><li>Por una Cabeza（Carlos Gardel）</li><li>Santa María (del Buen Ayre)（Gotan Project）</li></ul>
