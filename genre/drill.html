<h1>Drill（ドリル）とは</h1>
<p>ドラムの粒がひとつも余計に鳴らない、乾いて張り詰めたヒップホップ。土台はTR-808系の低音で、音程を持ったベースが短く切られて刻まれ、そこにハイハットが不規則に転がる。とりわけイギリス以降の様式では、ベースがスライドしながら下降</p>
<p>ドラムの粒がひとつも余計に鳴らない、乾いて張り詰めたヒップホップ。土台はTR-808系の低音で、音程を持ったベースが短く切られて刻まれ、そこにハイハットが不規則に転がる。とりわけイギリス以降の様式では、ベースがスライドしながら下降する独特の動きを見せ、これが不安をかき立てる鍵になっている。テンポは表記上は毎分130から145拍だが、拍を半分で数えるハーフタイムで進むため、体感はゆっくり歩く速度に近い。上物は最小限で、暗く陰鬱な短調の旋律をピアノやフルート、弦の断片が数音だけ鳴らし、残りは沈黙で埋められる。和音は動かず、同じ短調の響きが最後まで居座る。ラップは抑揚を抑えた低い声で、感情を込めずに事実を並べるように語られ、拍の裏に食い込むように置かれる。歌詞は地元の縄張り、敵対する集団、警察、暴力、死者への言及が中心で、比喩よりも固有名詞と実際の出来事が並ぶ。同じ808を使うトラップが華やかで享楽的な方向に向かったのに対し、こちらは徹底して冷たく、聴き手を高揚させるのではなく緊張させるように設計されている。ミュージックビデオは覆面姿の集団が路地や団地の前に立つ映像が定型となっている。</p>
<h2>成り立ち</h2><p>発祥は2010年頃のシカゴ南部で、殺人発生率が全米最悪の水準にあった地区の10代が、携帯電話とネット上の無料ソフトだけで作り始めた音楽だった。名称のドリルは、当地で銃撃を意味する俗語から来ている。中心にいたのはChief Keefで、2012年、16歳のときに自宅軟禁中に撮影した『I Don't Like』の映像がネットで数百万回再生され、Kanye Westがこれをリミックスしたことで一気に全米に知られた。制作面ではYoung Chopが、808の低音とハイハットだけの骨組みを確立し、Lil Durk、Lil Reese、King Louie、Fredo Santanaが続いた。だがこの音楽は現実の暴力と地続きだった。同じシカゴのラッパーLil JoJoは、Chief Keefの一派を挑発した数時間後に射殺され、当時17歳だった。2012年から数年で、シーンの関係者が何人も殺害されている。2012年、ロンドン南部のブリクストンやブリックストン周辺の若者がこのシカゴの音を取り込み、イギリス独自の形へ変えた。ここで決定的だったのが制作者808Melo、Carns Hillらによるスライドするベースの導入で、テンポも上がり、より不安定な響きになった。150、67、Harlem Spartansといった集団が地区ごとに現れ、ロンドン警視庁は暴力を煽るとして数百本の動画をYouTubeから削除させ、特定のラッパーには裁判所命令で歌詞の内容まで制限した。表現の自由をめぐる論争は今も続いている。2018年、ブルックリンのPop Smokeが808Meloの制作でイギリス流のドリルをニューヨークに持ち帰り、『Welcome to the Party』(2019)が大ヒットしてブルックリン・ドリルという流れを作ったが、彼は2020年二月、ロサンゼルスの滞在先で強盗に撃たれ20歳で亡くなった。以後この様式はガーナ、アイルランド、オーストラリア、日本にも広がっている。</p>
