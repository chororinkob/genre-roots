<h1>Drill（ドリル）とは</h1>
<p>ドリルは、装飾が少なく硬質なヒップホップだ。トラップから派生し、より暗く攻撃的な方向を強めた。 土台になるのは、TR-808系の低音だ。長く伸びる808が、小節の終わりで細かく動いたり滑ったりする。そこにハイハットが不規則に転がる</p>
<p>ドリルは、装飾が少なく硬質なヒップホップだ。トラップから派生し、より暗く攻撃的な方向を強めた。

土台になるのは、TR-808系の低音だ。長く伸びる808が、小節の終わりで細かく動いたり滑ったりする。そこにハイハットが不規則に転がる。とりわけイギリス以降のスタイルでは、ベースが音程をなめらかに滑らせる(スライド)動きを見せる。これが、不安をかき立てる鍵になっている。

UKドリルのテンポは約138〜151BPMだ。ただし、拍を半分で数えるハーフタイム（実際の半分の速さに聞こえる乗り）で進む。そのため、体感はゆっくり歩く速度に近い。

上物（メロディーなど上に重ねる音）は最小限だ。暗く陰鬱な短調の旋律を、シンセブラス、ベル、ピアノ、ストリングスなどが数音だけ鳴らす。残りは沈黙で埋められる。和声の動きが少なく、短調の響きが続くことが多い。

ラップは、抑揚を抑えた低い声で語られることが多い。感情を込めず、事実を並べるように、拍の裏に食い込むように置かれることが多い。歌詞は、地元の縄張り、敵対する集団、警察、暴力、死者への言及が中心だ。比喩よりも、固有名詞と実際の出来事が並ぶ。

ミュージックビデオでは、特にUKドリルで、警察対応を背景に覆面が一般化した。</p>
<h2>成り立ち</h2><p>発祥は、2010年頃のシカゴ南部だ。10代を含む若者が、簡素な機材とDAWで作った音楽だった。

名称のドリルは、ストリート俗語で「戦う・報復する」を意味する（身支度から全面抗争まで幅広く使われる）。この語をシカゴのヒップホップに最初に当てはめたのは、Dro CityのPac Man（2010年の「It's a Drill」）とされる。

中心にいたのはChief Keefだ。2012年、16歳のときに、自宅軟禁（その後の自宅拘束）中だった時期に制作・公開された『I Don't Like』の映像がネットに投稿された。すでにシカゴで広まっていた曲に、Kanye Westらが参加したリミックスが出て、全国的な注目が高まった。制作面では、批評家から最も特徴的な制作者とされるYoung Chopがいた。Lil Durk、Lil Reese、King Louie、Fredo Santanaは、Chief Keefと並ぶ初期シカゴ・ドリルのラッパーである。

だが、この音楽は現実の暴力と地続きだった。同じシカゴのラッパーLil JoJoは、Chief Keefの一派を挑発した当日に射殺された。当時18歳だった。2012年から数年で、シーンの関係者が何人も殺害されている。

2012〜2013年ごろ、ロンドン南部のブリクストン周辺の若者が、このシカゴの音を取り込んだ。そして、イギリス独自の形へ変えた。Carns HillとQUIETPVCKは初期の主要な制作者とされる。グライムやUKガラージの影響もあり、スライドする808とテンポの上昇が特徴になった。

150、67、Harlem Spartansといった集団が、地区ごとに現れた。すると、ロンドン警視庁は暴力を煽るとして、動画をYouTubeから削除させた（2018年5月に30本超、2019年1月には警察が要請した129本のうち102本）。2021年にはVICEが入手した情報公開請求のデータによると、510本が申請されて96.7%が削除された。ただし、ロンドン警視庁自身の2024年の回答では、2021年4月〜2022年3月は148本のうち133本が削除だった。その対象は、すべての音楽コンテンツで、ドリルに限らない。警察は、特定のラッパーには裁判所命令で歌詞の内容まで制限した。表現の自由をめぐる論争は、今も続いている。

一方、アメリカでは、ブルックリン・ドリルが2014年ごろに始まった。2016〜2017年ごろから、22GzやSheff GがUKドリルの制作陣のビートと結び付いた。2018年12月にデビュー曲を出したブルックリンのPop Smokeが、808Meloの制作で『Welcome to the Party』(2019)を出し、この流れを主流にした。しかし、彼は2020年二月、ロサンゼルスの滞在先で強盗に撃たれ、20歳で亡くなった。

このスタイルは2018〜2020年代にかけて、ガーナ、アイルランド、オーストラリア、日本にも広がった。</p>
