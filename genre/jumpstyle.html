<h1>Jumpstyle（ジャンプスタイル）とは</h1>
<p>1990年代後半にベルギーで発生し、2000年代半ばにオランダ・ドイツ等で商業的に隆盛した、特定の踊りと不可分に結びついた電子ダンス音楽。テンポは毎分140から150拍程度、四つ打ちのキックが基本だが、ハードスタイルとの違いは、オ</p>
<p>1990年代後半にベルギーで発生し、2000年代半ばにオランダ・ドイツ等で商業的に隆盛した、特定の踊りと不可分に結びついた電子ダンス音楽。テンポは毎分140から150拍程度、四つ打ちのキックが基本だが、ハードスタイルとの違いは、オフビートのベース音(リバースベース)が無いことで、そのため音は「乾いて四角い」響きになる。特徴はオーバードライブしたキックと、毎拍のクラップである。ベースの音程が動くのは、2002〜03年以降にハードスタイルの影響を受けたためである。上物は単純で、明るいシンセの旋律や、ピアノのリフ、加工した声のサンプルが置かれ、和音は長調の三つか四つの反復である。曲の構成は、クラップのみの導入、リズミカルなシンセの最初のドロップ、ブレイクダウン、メロディックなクライマックス、再びリズムシンセ、クラップのみのアウトロという型である。踊りは、エネルギッシュなジャンプ、速いキック、回転するフットワークで、上半身は比較的硬く保つ。一人でも集団でも踊られる。tech-trance、hardstyle、gabber、mákinaなどから音楽ジャンルとして育ったと説明される。演奏の場は屋内の催しに加え、公園などの公共の場、そして何より動画共有サイトで、自分の踊りを撮影して投稿する文化と一体で広まった。</p>
<h2>成り立ち</h2><p>母体はベルギーにあった。ベルギーは、1987年に発生して1980年代後半に流行したニュービートの国であり、1990年代にはハードトランスやジャンプ系の拠点で、アントワープ周辺のクラブでは、オーバードライブしたキックと毎拍のクラップを組み合わせた音が長く鳴らされていた。この音に合わせた独特の足を跳ね上げる踊りが、1990年代後半から自然発生的に生まれる。2000年代初頭には、1992年に創設されたベルギーのレーベルBonzai Recordsなどが、この音を支えた。決定的だったのは2006年から08年で、この時期にインターネットが状況を一変させる。若者たちが自宅や街頭で踊る映像をYouTubeに投稿し始め、その動画がドイツ、オランダ、ポーランド、ロシアへ次々に伝播した。とくにドイツでも流行し、2007年にはドイツの音楽チャートにもこの様式の曲が入った（確認できた範囲では、Jeckyll and Hydeの「Freefall」が77位、Scooterのアルバム『Jumping All Over the World』が9位）。中心となったのはPatrick JumpenとJeckyll and Hydeで、ドイツのScooterがこの音を取り込んだことも普及を後押しした。2007年のPatrick Jumpenの『Holiday』はオランダで最高5位に入り、同年にオランダで1位となったジャンプスタイルの曲はJeckyll and Hydeの「Freefall」である。しかしこの流行は極端に短命で、2007年以降にシーンでの人気が低下し、2010年代初頭には主流から後退した。2006〜07年にレコード会社が「cash cow」として乱用し、「ポップ」とみなされ始めたことが一因だった（同誌の推測）。とはいえ完全に消えたわけではなく、ベルギーとポーランドでは根強い愛好者が残り、2010年代にはハードスタイルやハードコアの催しの中で、この踊りが受け継がれている。2020年代初頭に、リトアニアのラッパーYabujinによる「Yabujin-core」としてTikTok等でネット上のリバイバルが起きた。ポーランドのAtomic Destination Team(2009年〜)は今も活動している。</p>
<h2>代表曲</h2><ul><li>The Logical Song (Scooter)</li><li>Freefall（Jeckyll &amp; Hyde）</li><li>Jumping All Over the World (Scooter)</li><li>The Secret (Patrick Jumpen)</li><li>Holiday（Patrick Jumpen）</li><li>Zanzibar (Springstil)</li><li>Cambodia (Vorwerk)</li><li>Frozen Flame (Jeckyll &amp; Hyde)</li><li>Chinese Whispers (Scooter)</li><li>Early Soundz (Showtek)</li><li>Jump with Me (Sheffield Jumpers)</li><li>Lockdown (Scope DJ)</li></ul>
