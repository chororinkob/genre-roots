<h1>Jumpstyle（ジャンプスタイル）とは</h1>
<p>ジャンプスタイルは、特定の踊りと切り離せない電子ダンス音楽だ。1990年代後半にベルギーで発生したとする説が有力で、2000年代半ばにオランダ・ドイツ等で商業的に盛んになった。tech-trance、hardstyle、gabbe</p>
<p>ジャンプスタイルは、特定の踊りと切り離せない電子ダンス音楽だ。1990年代後半にベルギーで発生したとする説が有力で、2000年代半ばにオランダ・ドイツ等で商業的に盛んになった。tech-trance、hardstyle、gabber、mákinaなどから音楽ジャンルとして育ったと説明される。

土台になるのは、1拍ごとに踏む四つ打ちのキックだ。特徴はオーバードライブしたキックと、毎拍のクラップである。ハードスタイルとの違いとして、拍の裏のベース(リバースベース)が無いことが挙げられ、そのため音は「乾いて四角い」響きになるとされる。2002〜03年以降は、ハードスタイルの影響でピッチ付きベースラインなどが加わったとされる。

上物は単純で、ユーロトランス風の行進曲的なメロディやレイヴ由来のフック、しゃべり声のサンプルが載る。

テンポは毎分140から150拍程度だ。

曲の構成は、クラップのみの導入から始まる。次に、リズミカルなシンセの最初のドロップ（派手に盛り上がる部分）が来る。そのあとにブレイクダウン（リズムが止まる区間）、メロディックなクライマックス、再びリズムシンセと続き、クラップのみのアウトロで終わる。多くの曲でこうした型が見られる。

踊りは、エネルギッシュなジャンプと速いキック、回転するフットワークで構成され、上半身は比較的硬く保つ。一人でも集団でも踊られる。屋内の催しに加え、公園などの公共の場でも演奏された。そして動画共有サイトを通じても、自分の踊りを撮影して投稿する文化と一体で広まった。</p>
<h2>成り立ち</h2><p>ジャンプスタイルは、ベルギー(フランドル)で1990年代後半に生まれたとする説が有力だ。踊りの起源には、フランスやメルボルン・シャッフル説もある。

ベルギーは、1987年に発生して1980年代後半に流行したニュービートの国だった。1990年代にはハードトランスやジャンプ系の拠点にもなる。1990年代後半には、Da Boy TommyとDa Rick(Jumper Records、1997年設立)らが、この音を展開した。1990年代には、Bonzai系列のBonzai Jumps(1994〜98年)がジャンプ系を扱った。ジャンプスタイルそのものは、Jumper Records(1997年〜)などが担った。

決定的だったのは2006年から08年で、この時期にインターネットが状況を一変させる。オランダでは2004〜05年に先に流行しており、動画サイト経由でドイツ(2007年)、ポーランド(2007年)、ロシア(2008年)などへ広がった。とくにドイツでも流行し、2007年にはドイツの音楽チャートにもこのスタイルの曲が入った（確認できた範囲では、Jeckyll and Hydeの「Freefall」が77位、Scooterのアルバム『Jumping All Over the World』が9位）。

オランダのチャートで目立ったのは、Patrick JumpenとJeckyll and Hydeだ。ドイツのScooterがこの音を取り込んだことも、普及を後押しした。2007年のPatrick Jumpenの『Holiday』は、オランダで最高5位に入った。同年にオランダで1位となったジャンプスタイルの曲は、Jeckyll and Hydeの「Freefall」である。

商業的ピークは2006〜08年ごろだった。2009年ごろまでに最初の波は落ち着き、2010年代初頭には主流での存在感が低下した。Hardstyle Magazineは、2006〜07年にレコード会社がjumpstyleをcash cowとして使い、「ポップ」とみなされ始めたことが、Qlimaxの出演枠から消えた理由かもしれないと推測している。

とはいえ完全に消えたわけではなく、ベルギー・オランダの一部のハードダンス系イベントで、ジャンプの踊りが続いているとされる。2020年代初頭には、リトアニアのラッパーYabujinのジャンプスタイル曲をきっかけにTikTokで生まれた通称「Yabujin-core」として、ネット上のリバイバルが起きた。ポーランドのAtomic Destination Team(2009年〜)は、今も活動している。</p>
<h2>代表曲</h2><ul><li>The Logical Song (Scooter)</li><li>Freefall（Jeckyll &amp; Hyde）</li><li>Jumping All Over the World (Scooter)</li><li>The Secret (Patrick Jumpen)</li><li>Holiday（Patrick Jumpen）</li><li>Zanzibar (Springstil)</li><li>Cambodia (Vorwerk)</li><li>Frozen Flame (Jeckyll &amp; Hyde)</li><li>Chinese Whispers (Scooter)</li><li>Early Soundz (Showtek)</li><li>Jump with Me (Sheffield Jumpers)</li><li>Lockdown (Scope DJ)</li></ul>
