<h1>Jumpstyle（ジャンプスタイル）とは</h1>
<p>ベルギーとオランダで生まれた、特定の踊りと不可分に結びついた電子ダンス音楽。テンポは毎分140から150拍程度、四つ打ちのキックが基本だが、最大の特徴はベースの配置にある。キックの直後、拍と拍の間に短く切ったオフビートのベース音が</p>
<p>ベルギーとオランダで生まれた、特定の踊りと不可分に結びついた電子ダンス音楽。テンポは毎分140から150拍程度、四つ打ちのキックが基本だが、最大の特徴はベースの配置にある。キックの直後、拍と拍の間に短く切ったオフビートのベース音が置かれ、この跳ねるような二段構えの動きが、踊りの足の運びと直接対応している。ベースの音色は硬く歪ませたもので、音程は短く上下する。上物は単純で、明るいシンセの旋律や、ピアノのリフ、加工した声のサンプルが置かれ、和音は長調の三つか四つの反復である。曲の構成は明快で、導入、旋律の提示、抜き、そして再び全体が戻るという型を守る。踊りの側は、片足を後ろに跳ね上げ、もう一方の足で軸を作りながら、前後左右に大きく移動するもので、一人でも集団でも踊られる。この踊りが先にあり、それに合う音楽として様式が固まったという点が、他の電子音楽と大きく異なる。演奏の場は屋内の催しに加え、公園や駐車場、そして何より動画共有サイトで、自分の踊りを撮影して投稿する文化と一体で広まった。</p>
<h2>成り立ち</h2><p>母体はベルギーにあった。1990年代、ベルギーはニュービートやハードトランス、そしてジャンプという名で呼ばれる速いテクノの拠点で、アントワープ周辺のクラブでは、キックとオフビートのベースを組み合わせた音が長く鳴らされていた。この音に合わせた独特の足を跳ね上げる踊りが、1990年代後半から自然発生的に生まれる。2000年代初頭には、ベルギーのクラブBonzaiや、Bonzai Recordsといったレーベルがこの音を支えた。決定的だったのは2006年から08年で、この時期にインターネットが状況を一変させる。若者たちが自宅や街頭で踊る映像をYouTubeに投稿し始め、その動画がドイツ、オランダ、ポーランド、ロシアへ次々に伝播した。とくにドイツで爆発的な流行となり、2007年にはドイツの音楽チャートにこの様式の曲が並んだ。中心となったのはPatrick Jumpen、Jeckyll and Hyde、Klubbheads、DJ Zany、そしてドイツのScooterがこの音を取り込んだことも普及を後押しした。2007年のPatrick Jumpenの『Holiday』はオランダで一位を獲得している。しかしこの流行は極端に短命で、2009年頃には急速に廃れた。理由として、あまりに単純な様式で音楽的な発展の余地が乏しかったこと、そして流行が子供向けのものとみなされたことが挙げられる。とはいえ完全に消えたわけではなく、ベルギーとポーランドでは根強い愛好者が残り、2010年代にはハードスタイルやハードコアの催しの中で、この踊りが受け継がれている。近年は当時を知る世代による懐古的な催しも開かれている。</p>
