<h1>Memphis Rap（メンフィスラップ）とは</h1>
<p>1980年代半ば〜後半にテネシー州メンフィスで生まれ、1990年代に最盛期を迎えた、自主制作のカセットテープを通じて広まった暗く粗いヒップホップ。音の質感が最大の特徴で、安価な機材で録音され、何度もダビングされたテープの高音の潰れ</p>
<p>1980年代半ば〜後半にテネシー州メンフィスで生まれ、1990年代に最盛期を迎えた、自主制作のカセットテープを通じて広まった暗く粗いヒップホップ。音の質感が最大の特徴で、安価な機材で録音され、何度もダビングされたテープの高音の潰れ、テープの走行速度の揺れ、ヒスノイズ（テープ特有の「サー」という雑音）がそのまま残されている。土台はローランドTR-808の低音とシンプルな打ち込みのドラムで、テンポはハーフタイム感（実際の半分の速さに聞こえる、ゆったりした乗り）で毎分70から90拍程度に聞こえる曲が多く、重く沈む。上物には金属質なカウベルの連打、ホラー映画の劇伴（場面に添える音楽）から取った不気味な鍵盤やオルガンの持続音が置かれ、和音は短調の単純な反復が多い。ラップの発声にも特徴があり、低く抑えた語りと、拍を細かく割って高速で刻む早口の二種が併用される。後者は、後にMigosらが広めたトリプレット・フロー（細かい三連の刻み）の源流のひとつとされる。歌詞は殺人、麻薬、悪魔崇拝の意匠、貧困、街の抗争を淡々と、しばしば冷笑的に語る。装飾も救済もなく、暗く不穏な作風が目立つ。流通は、クラブや口コミ、自作のミックステープ（曲を自由につないだ非公式の作品集）、店頭や手売りが中心だった。</p>
<h2>成り立ち</h2><p>メンフィスはもともとブルースとソウルの街で、Stax Recordsやサン・スタジオを擁していたが、Staxは1975年に破産して1976年に閉鎖し、サン・スタジオのレーベルも1969年に売却されるなど、産業は衰退していった。1990年代前半には全米最悪級の犯罪率を抱える都市になっていた。メンフィスのヒップホップは1980年代半ば以降、クラブでDJとして活動していたDJ Spanish Flyらが自作のカセットを流通させたことが、シーンの形成に寄与した。ディスコ期から、808（ドラムマシンTR-808）を中心とした遅く攻撃的な音への移行が進み、より暗くホラー的な方向へ進んだ。1991年、DJ PaulとJuicy JがLord Infamousとともに「The Backyard Posse」を結成し、1993年以降にTriple Six Mafiaを名乗り、1995年にThree 6 Mafiaへ改名する。彼らが1995年に発表した『Mystic Stylez』は、悪魔崇拝の意匠と高速の刻みを備え、この様式の代表作となった。同じ街ではTommy Wright III、Kingpin Skinny Pimp、Gangsta Pat、Playa Fly、そしてLord Infamousが活動した。とりわけLord Infamousは、後にMigosらが広めたトリプレット・フローの先駆者とされる。彼らはレコード会社を通さず、自分でテープを複製して売り、数千本を捌いた。全国的な流通に乗ったのは1990年代末で、Three 6 Mafiaが2000年の『When the Smoke Clears: Sixty 6, Sixty 1』で全米六位に達し、2006年には映画『Hustle and Flow』の主題歌でアカデミー歌曲賞を受賞した。だがこのシーンの多くの当事者は成功と無縁で、Lord Infamousは2013年に40歳で亡くなり、Koopsta Knicca（1994年に4人目の正式メンバーとして加入）も2015年に亡くなっている。2010年代、これらのカセット音源がインターネットに再アップロードされ、フォンクという新しい流れの素材として世界的に発見された。</p>
