<h1>Memphis Rap（メンフィスラップ）とは</h1>
<p>1990年代のテネシー州メンフィスで、自主制作のカセットテープを通じて広まった暗く粗いヒップホップ。音の質感が最大の特徴で、安価な機材で録音され、何度もダビングされたテープの高音の潰れ、テープの走行速度の揺れ、ヒスノイズがそのまま</p>
<p>1990年代のテネシー州メンフィスで、自主制作のカセットテープを通じて広まった暗く粗いヒップホップ。音の質感が最大の特徴で、安価な機材で録音され、何度もダビングされたテープの高音の潰れ、テープの走行速度の揺れ、ヒスノイズがそのまま残されている。土台はローランドTR-808の低音とシンプルな打ち込みのドラムで、テンポは毎分70から90拍程度と遅く、重く沈む。上物には金属質なカウベルの連打、ホラー映画の劇伴から取った不気味な鍵盤やオルガンの持続音、逆再生した音が置かれ、和音は短調の二つの響きを往復するだけである。ラップの発声にも特徴があり、低く抑えた語りと、拍を細かく割って高速で刻む早口の二種が併用される。後者はこの土地で発達し、後の高速ラップの源流のひとつとされる。歌詞は殺人、麻薬、悪魔崇拝の意匠、貧困、街の抗争を淡々と、しばしば冷笑的に語る。装飾も救済もなく、聴き手を高揚させる意図がない点が、同時期の他の地域のヒップホップと決定的に違う。流通は正規の店ではなく、街頭や車のトランク、地元の理髪店での手売りが中心だった。</p>
<h2>成り立ち</h2><p>メンフィスはもともとブルースとソウルの街で、Stax Recordsやサン・スタジオを擁していたが、1980年代にはそれらの産業は衰退し、全米有数の貧困率と殺人発生率を抱える都市になっていた。ヒップホップは1980年代末、クラブでDJとして活動していたDJ Spanish FlyやDJ Squeekyらが、自分の声を乗せたカセットを作って売り始めたところから始まった。彼らはヒューストンのDJ Screwと同じく、レコードの回転数を落として遅く鳴らす手法を用いたが、より暗くホラー的な方向へ進んだ。1991年、DJ PaulとJuicy Jが出会い、Triple Six Mafia、後のThree 6 Mafiaを結成する。彼らが1995年に発表した『Mystic Stylez』は、悪魔崇拝の意匠と高速の刻みを備え、この様式の代表作となった。同じ街ではTommy Wright III、Kingpin Skinny Pimp、Gangsta Pat、Playa Fly、そしてLord Infamousが活動した。とりわけLord Infamousの、拍を極端に細かく割って刻む発声は、後のチョッパーと呼ばれる高速ラップの原型のひとつとされる。彼らはレコード会社を通さず、自分でテープを複製して街頭で売り、地元だけで数千本を捌いた。全国的な流通に乗ったのは1990年代末で、Three 6 Mafiaが2000年の『When the Smoke Clears』で全米六位に達し、2006年には映画『Hustle and Flow』の主題歌でアカデミー歌曲賞を受賞した。だがこのシーンの多くの当事者は成功と無縁で、Lord Infamousは2013年に40歳で亡くなり、Koopstaも2015年に亡くなっている。2010年代、これらのカセット音源がインターネットに再アップロードされ、フォンクという新しい流れの素材として世界的に発見された。</p>
