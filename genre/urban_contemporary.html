<h1>Urban Contemporary（アーバンコンテンポラリー）とは</h1>
<p>ラジオの放送形態として生まれ、後に音楽の呼び名になった枠組み。特定の楽器や奏法によって定義されるのではなく、都市部の黒人聴取者を主な対象とする現代的な黒人音楽全般を指す。そのため内容は時代とともに変わり、1970年代末にはディスコ</p>
<p>ラジオの放送形態として生まれ、後に音楽の呼び名になった枠組み。特定の楽器や奏法によって定義されるのではなく、都市部の黒人聴取者を主な対象とする現代的な黒人音楽全般を指す。そのため内容は時代とともに変わり、1970年代末にはディスコとソウルとファンク、1980年代にはエレクトロファンクとクワイエット・ストーム（静かで滑らかな大人向けのR&amp;B）、1990年代にはニュージャックスウィング（R&amp;Bにヒップホップのリズムを混ぜた形式）とヒップホップとR&amp;B、2000年代以降はヒップホップとコンテンポラリーR&amp;Bが中心になる。音の共通点を挙げるとすれば、打ち込みのリズムを土台にした明快なグルーヴ（ノリの良さ）、ゴスペル由来の技巧的な歌唱、そしてラジオで映えるように圧縮された音圧（音の大きさや迫力）の高い仕上げである。テンポは踊れる中速から、ゆっくりしたバラードまで幅広い。楽曲は冒頭の掴みと反復するサビが重視される。歌詞は恋愛が中心で、社会的な主題も扱われるが、放送規制に触れる表現は避けられる。この呼び名は、音楽そのものを指す言葉というより、広告主に対して聴取者層を説明するための商業的な区分であり、そのことが後に人種による分類だという批判を招くことになった。</p>
<h2>成り立ち</h2><p>1970年代半ばまで、アメリカのラジオでは黒人向けの局はブラック・ラジオと呼ばれ、広告主から低く見られがちだったとされる。これを変えたのがニューヨークの局WBLSの番組編成責任者Frankie Crockerである。1970年代半ば、彼は自局をブラックではなくアーバン・コンテンポラリーと名乗り、R&amp;Bとディスコを軸にした折衷的（いろいろなものを取り混ぜた）な編成で、黒人、ヒスパニック、白人、アジア系を含む都市部の聴取者全体を対象にすると打ち出した。この戦略は成功し、WBLSはニューヨークで最も聴かれる局のひとつになった。1980年前後、この形態は全米に広がった。1980年代、初期のMTVで黒人アーティストの露出が極めて少なかったことは事実で、Michael Jacksonの『Billie Jean』(MTV初放送は1983年3月10日)が転機になったとされる。ただし、圧力があったという逸話は元MTV幹部が否定しており、争いがある。アーバンという言葉はやがてレコード会社の部署名、賞の部門名、音楽祭の区分にまで使われるようになった。しかし同時に、この語が黒人という言葉の婉曲表現（直接言うのを避けた言い方）として機能し、黒人音楽をひとつの棚に押し込める役割を果たしているという批判が積み重なった。2020年、ジョージ・フロイドの死をきっかけに全米で抗議が広がると、この議論が一気に表面化する。同年六月、レコード会社Republic Recordsが、部署名・役職名・ジャンル表記からアーバンという語を外すと発表し、続いてグラミー賞は最優秀アーバン・コンテンポラリー・アルバム部門を最優秀プログレッシヴR&amp;Bアルバムに改称した。Tyler, the Creatorら当事者からも、この語が音楽の内容ではなく人種で分類する道具だという発言が相次いだ。現在この呼び名は歴史的な用語として扱われつつある。</p>
