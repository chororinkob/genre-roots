<h1>Urban Contemporary（アーバンコンテンポラリー）とは</h1>
<p>ラジオの放送スタイルとして生まれ、のちに音楽の呼び名になった枠組みである。特定の楽器や奏法で決まるものではない。都市部の黒人の聴き手を主な対象にした、現代的な黒人音楽全般を指す。 そのため、内容は時代とともに変わる。1970年代に</p>
<p>ラジオの放送スタイルとして生まれ、のちに音楽の呼び名になった枠組みである。特定の楽器や奏法で決まるものではない。都市部の黒人の聴き手を主な対象にした、現代的な黒人音楽全般を指す。

そのため、内容は時代とともに変わる。1970年代にはR&amp;Bとディスコが中心だった。1980年代にはクワイエット・ストーム（静かで滑らかな大人向けのR&amp;B）やラップ、ダンス系などが加わる。1980年代末からは、ニュージャックスウィング（R&amp;Bにヒップホップのリズムを混ぜた形式）が出てくる。2000年代以降は、ヒップホップとコンテンポラリーR&amp;Bが中心になる。音楽的な共通点は決めにくい。

テンポは、踊れる中くらいの速さから、ゆっくりしたバラードまで幅広い。

この呼び名は、音楽そのものを指す言葉というより、広告主に聴き手の層を説明するための商業的な区分である。そのことが後に、人種による分類だという批判を招くことになった。</p>
<h2>成り立ち</h2><p>1970年代半ばまで、アメリカのラジオでは、黒人向けの局はブラック・ラジオと呼ばれていた。広告主からは低く見られがちだったとされる。ニューヨークの局WBLSの番組編成責任者Frankie Crockerのリブランドが、この状況を部分的に改善した。

Crockerが命名したとされる（1974年、WBLSで）。彼は、黒人向けと見られないよう、より広い聴き手の層を意識した呼び名を打ち出した。R&amp;Bとディスコを軸にした折衷的（いろいろなものを取り混ぜた）な編成で、黒人、ヒスパニック、白人、アジア系を含む都市部の聴き手全体を対象にすると宣言したのである。この戦略は成功し、WBLSはニューヨークで最も聴かれる局のひとつになった。1980年前後から各地に広がり、1980年代を通じて定着した。

1980年代、初期のMTVで黒人アーティストの露出が極めて少なかったことは事実である。Michael Jacksonの『Billie Jean』は、節目となる出来事とされる。同曲のビデオがMTVで初放送された日は、1983年3月10日である。ただし、圧力があったという逸話は、元MTV幹部のLes Garlandが否定し、CBSのDavid Benjaminが反論しており、争いがある。

アーバンという言葉は、やがてレコード会社の部署名や賞の部門名にまで使われるようになった。しかし同時に、この語は黒人という言葉の婉曲表現（直接言うのを避けた言い方）として働き、黒人音楽をひとつの棚に押し込める役割を果たしているという批判が積み重なった。

2020年1月、Tyler, the Creatorは「urbanは『n-word』の政治的に正しい言い換えだ」と発言した。2020年、ジョージ・フロイドの死をきっかけに全米で抗議が広がると、この議論が再燃した。同年六月、レコード会社Republic Recordsは、部署名・役職名・ジャンル表記からアーバンという語を外すと発表した。続いてグラミー賞は、最優秀アーバン・コンテンポラリー・アルバム部門を、最優秀プログレッシヴR&amp;Bアルバムに改称した。

米国ラジオの一部（Urban AC）やレコード会社で、使用を避ける動きが広がっている。ただし、書式名や賞の部門名としては、現在も使われている。</p>
