<h1>Urban Contemporary（アーバンコンテンポラリー）とは</h1>
<p>ラジオの放送形態として生まれ、後に音楽の呼び名になった枠組み。特定の楽器や奏法によって定義されるのではなく、都市部の黒人聴取者を主な対象とする現代的な黒人音楽全般を指す。そのため内容は時代とともに変わり、1970年代末にはディスコ</p>
<p>ラジオの放送形態として生まれ、後に音楽の呼び名になった枠組み。特定の楽器や奏法によって定義されるのではなく、都市部の黒人聴取者を主な対象とする現代的な黒人音楽全般を指す。そのため内容は時代とともに変わり、1970年代末にはディスコとソウルとファンク、1980年代にはエレクトロファンクとクワイエット・ストーム、1990年代にはニュージャックスウィングとヒップホップとR&amp;B、2000年代以降はヒップホップとコンテンポラリーR&amp;Bが中心になる。音の共通点を挙げるとすれば、打ち込みのリズムを土台にした明快なグルーヴ、ゴスペル由来の技巧的な歌唱、そしてラジオで映えるように圧縮された音圧の高い仕上げである。テンポは踊れる中速から、ゆっくりしたバラードまで幅広い。楽曲は放送に適した三分半から四分に収められ、冒頭の掴みと反復するサビが重視される。歌詞は恋愛が中心で、社会的な主題も扱われるが、放送規制に触れる表現は避けられる。この呼び名は、音楽そのものを指す言葉というより、広告主に対して聴取者層を説明するための商業的な区分であり、そのことが後に人種による分類だという批判を招くことになった。</p>
<h2>成り立ち</h2><p>1970年代半ばまで、アメリカのラジオでは黒人向けの局はブラック・ラジオと呼ばれ、広告主から低い評価を受けていた。これを変えたのがニューヨークの局WBLSの番組編成責任者Frankie Crockerである。1974年頃、彼は自局をブラックではなくアーバン・コンテンポラリーと名乗り、黒人音楽を軸にしながらディスコやロック、ラテン音楽まで幅広くかけることで、白人を含む都市部の若者全体を対象にすると打ち出した。この戦略は成功し、WBLSはニューヨークで最も聴かれる局のひとつになった。1980年前後、この形態は全米に広がり、業界誌ビルボードもこの名の専門チャートを設けた。1980年代、MTVが黒人の音楽家の映像をほとんど流さなかったこと、そしてMichael Jacksonの『Billie Jean』がようやく壁を破ったことは、この時代の人種と放送の関係を象徴している。アーバンという言葉はやがてレコード会社の部署名、賞の部門名、音楽祭の区分にまで使われるようになった。しかし同時に、この語が黒人という言葉の婉曲表現として機能し、黒人音楽をひとつの棚に押し込める役割を果たしているという批判が積み重なった。2020年、ジョージ・フロイドの死をきっかけに全米で抗議が広がると、この議論が一気に表面化する。同年六月、レコード会社Republic Recordsがアーバンという語の使用を全面的に廃止すると発表し、続いてグラミー賞は最優秀アーバン・コンテンポラリー・アルバム部門を最優秀プログレッシヴR&amp;Bアルバムに改称した。Tyler, the CreatorやNormaniら当事者からも、この語が音楽の内容ではなく人種で分類する道具だという発言が相次いだ。現在この呼び名は歴史的な用語として扱われつつある。</p>
