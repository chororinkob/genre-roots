<h1>J-Rapとは</h1>
<p>この音楽は、日本語でラップするヒップホップだ。 音の面では、アメリカの各時代の流れを取り込むため、幅広い。それでもこの分野を独自の音楽にしているのは、言語の構造である。 日本語は、音節（まとまった一つの音）ではなく、拍（短い音の数</p>
<p>この音楽は、日本語でラップするヒップホップだ。

音の面では、アメリカの各時代の流れを取り込むため、幅広い。それでもこの分野を独自の音楽にしているのは、言語の構造である。

日本語は、音節（まとまった一つの音）ではなく、拍（短い音の数え方）を単位にする。しかも、子音で終わる音節をほとんど持たない。そのため英語のように、語末の子音を揃えて韻を踏めない。「日本語ではラップができない」という議論は長い間あった。その根拠は、母音が5つであることと、語が子音で終わらないことだ。

これに対して発達したのが、語末の母音の並びを揃える韻の踏み方だ。意味の違う語を、母音の連なりで一致させる。これによって、日本語でも明確な韻の快感が成り立つことが示された。母音を揃えるのが基本だが、子音の類似も関わる。

リズムの面では、拍が均等に流れる日本語を、拍の裏（拍と拍の間）へずらして置く技術や、意図的に語を切り詰めて拍に押し込む技術が磨かれたとされる。

声の出し方では、言葉の意味や響きを活かした表現が好まれることが多い。

歌詞は、地元、努力、貧しさ、日常の観察、そして日本社会への違和感を扱う。日本語の語彙の豊かさを活かした言葉遊びが重視される点も特徴だ。</p>
<h2>成り立ち</h2><p>始まりは1980年代前半だ。当時はダンス（ブレイクダンス）が中心で、映画『ワイルド・スタイル』などを通じて文化が入ってきた。一方で、1981年には、諸説あるものの、小林克也の曲が「日本初のラップ」とされ、1984年には吉幾三の曲がヒットした。このように1980年代初頭から、何人もの人が日本語でのラップを試みた。

いとうせいこうも、その先がけの一人だ。作家であり編集者でもあった彼は、『建設的』（1986年、いとうせいこう &amp; Tinnie Punx名義）では、当初あえてライミングをしなかった。そして1989年の『MESS/AGE』で、韻を徹底した。

同じころ、高木完・藤原ヒロシ（タイニー・パンクス）が、クラブの現場から文化を紹介した。近田春夫は彼らの紹介でラップに取り組み、日本語ラップの草分けとなった。

1990年代に入ると、状況が動く。1994年、スチャダラパーが小沢健二と共作した楽曲が、累計50万枚以上とされる大ヒットとなった。同じ年のEAST END×YURIの「DA.YO.NE」とともに、ヒップホップを広い聴き手に知らしめた。しかしこの成功は、この音楽が軽い遊びとして受け取られるという、望ましくない面も生んだ。

1995年には、キングギドラが単語単位の長い韻を踏む手法を示した。社会への怒りを正面から扱い、「日本語ラップの教科書」と評される。

決定的な出来事は1996年だ。ECDが呼びかけて大規模な催しが開かれ、多数の主要な作り手が出演した。これが、この分野が一つの音楽の世界として自覚されるきっかけとなった。この催しは、ポップ化した枠として批判された「J-RAP」という呼び名への、反発の意思表示とも位置づけられる。ECDは冒頭で「J-Rapは俺が殺した」と宣言したとされる。この時期に、ライムスターやBuddha Brandが土台を築いている。

2000年代には、各地に地域ごとの音楽の場が生まれたとされる。SEEDAやANARCHYは、自身の生い立ちを率直に語る作風で知られる。

2010年代半ば、テレビの即興対決の番組が人気を得て、この分野は大衆化したとされる。以後、KOHHが海外の作り手と共演し、Awichが女性の視点から強い存在感を示し、Creepy Nutsが大衆的な成功を収めた。こうして層は大きく厚くなった。</p>
