<h1>J-Rapとは</h1>
<p>日本語でラップされるヒップホップである。音の面ではアメリカの各時代の潮流を吸収するため多様だが、この分野を独自のものにしているのは言語の構造である。日本語は音節（まとまった一つの音）ではなく拍（短い音の数え方）を単位とし、しかも子</p>
<p>日本語でラップされるヒップホップである。音の面ではアメリカの各時代の潮流を吸収するため多様だが、この分野を独自のものにしているのは言語の構造である。日本語は音節（まとまった一つの音）ではなく拍（短い音の数え方）を単位とし、しかも子音で終わる音節をほとんど持たないため、英語のように語末の子音を揃えて韻を踏むことができない。加えて高低のみの単純な音の上下しか持たないため、強弱による躍動も作りにくい。この二重の制約が、長らく日本語ではラップができないという議論を生んだ。これに対して発達したのが、語の末尾の母音の並びを揃えるという韻の踏み方である。意味の異なる語を、母音の連なりだけで一致させることによって、日本語でも明確な韻の快感が成立することが示された。さらに、拍が均等に流れる日本語を、拍の裏（拍と拍の間）へずらして置く技術や、意図的に語を切り詰めて拍に押し込む技術が磨かれた。発声では、言葉の意味や語感を活かした表現が好まれる。歌詞は地元、努力、貧しさ、日常の観察、そして日本社会への違和感を扱う。日本語の語彙の豊かさを活かした言葉遊びが重視される点も特徴である。</p>
<h2>成り立ち</h2><p>1980年代前半、東京の一部の若者がアメリカのヒップホップを輸入盤（海外から輸入したレコード）で聴き始めた。当初は踊りとDJの技術が中心だったが、1981年には小林克也の曲が「日本初のラップ」とされ、1984年には吉幾三の曲がヒットするなど、1980年代初頭から複数の人物が日本語でのラップを試みた。いとうせいこうもその先駆者の一人である。作家であり編集者でもあった彼は、1986年のアルバム『建設的』などで日本語による韻の可能性を実験し、1989年の作品でその成果を示した。同時期に近田春夫や高木完、藤原ヒロシらが、クラブの現場からこの文化を紹介している。1990年代に入ると状況が動く。1994年、スチャダラパーが小沢健二と共作した楽曲が50万枚を超える大ヒットとなり、同じ年のEAST END×YURIの「DA.YO.NE」とともに、ヒップホップを広い聴衆に知らしめた。しかしこの成功は同時に、この音楽が軽い遊びとして受け取られるという望ましくない面も生む。1995年には、キングギドラが単語単位の長い韻を踏む手法を示し、社会への怒りを正面から扱うことで、日本語のラップが本格的な表現たりうることを証明した。決定的な出来事は1996年である。ECDが呼びかけて開かれた大規模な催しには、多数の主要な作り手が出演し、この分野が一つの音楽の世界として自覚されるきっかけとなった。この催しは、ポップ化した枠として批判された「J-RAP」という呼称へのそれに対する反発の意思表示とも位置づけられ、ECDは冒頭で「J-Rapは俺が殺した」と宣言している。この時期にライムスターやBuddha Brandが基礎を築いている。2000年代には各地に地域ごとの音楽の場が生まれ、SEEDAやANARCHYが自身の生い立ちを率直に語る作風で知られる。2010年代半ば、テレビの即興対決の番組が予想外の人気を得て、この分野は一気に大衆化する。以後、KOHHが海外の作り手と共演し、Awichが女性の視点から強い存在感を示し、Creepy Nutsが大衆的な成功を収めるなど、層は大きく厚くなった。日本語でどう韻を踏むかという当初の問いは、40年をかけて実践的に解かれたといえる。</p>
