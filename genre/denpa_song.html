<h1>Denpa Song（デンパソング）とは</h1>
<p>電波ソングとは、日本のサブカルチャーから生まれた音楽スタイルであり、意図的に「頭がおかしい」「電波が入っている」と感じさせるような、奇妙で中毒性の高いサウンドと歌詞を特徴とする。メロディーは極端に明るく、短調よりも長調が圧倒的に多</p>
<p>電波ソングとは、日本のサブカルチャーから生まれた音楽スタイルであり、意図的に「頭がおかしい」「電波が入っている」と感じさせるような、奇妙で中毒性の高いサウンドと歌詞を特徴とする。メロディーは極端に明るく、短調よりも長調が圧倒的に多用され、しばしば半音階的な跳躍や予測不能な転調が挿入される。和声はシンプルなI-IV-V進行を基本としながらも、突然の増4度や減7度の音程が現れ、聴き手に「ズレ」の感覚を与える。

使用楽器・機材としては、シンセサイザー（特にYAMAHAのDX7系のFM音源やRolandのJV/XVシリーズ）、打ち込みのドラムマシン（Roland TR-808やTR-909の音色を模したソフトウェア音源）、そしてVOCALOID以前の時代にはサンプラーによる加工ボイスが多用された。音色は意図的に「安っぽく」「チープ」に設定されることが多く、これがジャンルの美学の一部をなしている。

リズム構造は4/4拍子が基本で、テンポはBPM140〜180程度の高速なものが多い。ビートはユーロビートやJ-POPのダンスポップに近い四つ打ちが基本だが、突然変拍子が挿入されたり、リズムが崩れるような演出が加えられることもある。

音響エフェクトとしては、ピッチシフターによる極端な高音処理（いわゆる「ロリ声」エフェクト）、過剰なリバーブとディレイ、そしてビットクラッシャーによるデジタルノイズが特徴的だ。ボーカルスタイルは、通常の歌唱技法を逸脱した甲高い声、わざとらしい幼児語的発音、突然の叫び声や囁きが混在する。歌詞の主題は、日常の些細な出来事を異常なテンションで語るもの、意味不明な造語や擬音語の羅列、性的・暴力的な内容をポップなメロディーに乗せたものなど多岐にわたる。

アニメソングやアイドルポップと比較すると、アニメソングは物語性や感情移入を重視するのに対し、電波ソングは意図的な「不快感」や「中毒性」を前面に出す点が異なる。チップチューンとも音色が近いが、チップチューンはゲーム音楽の文脈を持つのに対し、電波ソングはボーカルと歌詞の「狂気」が核心にある。実際に鳴っている場所としては、同人音楽即売会（コミックマーケット）、アニメ・ゲームのオープニング・エンディング、ニコニコ動画などのネット動画プラットフォームが主な舞台だ。</p>
<h2>成り立ち</h2><p>電波ソングの起源は1990年代後半の日本のアニメ・ゲーム文化に求められる。「電波」という言葉は日本のスラングで「理解不能な言動をする人物」を指し、そこから転じて「常識外れで中毒性のある音楽」を指す言葉として定着した。

最初期の代表的な作品として挙げられるのが、1998年にゲーム『でたなパラッパ』や同時期のギャルゲー・エロゲーのオープニング曲群だが、ジャンルとして広く認知されるきっかけとなったのは、1998年放送のアニメ『serial experiments lain』や同年代のギャルゲー文化との関連よりも、むしろ2000年代初頭の同人音楽シーンにある。特に重要なのが、2003年頃からコミックマーケットを中心に活動を始めた同人音楽サークル群であり、中でも「mosaic.wav」（モザイクワブ）は電波ソングを意識的なジャンルとして確立した最重要グループの一つだ。mosaic.wavは「ハイパーアクティブガール」（2004年）などの作品で、高速BPM・甲高いボーカル・意味不明な歌詞という電波ソングの定型を完成させた。

もう一つの重要な起源として、1998年のアニメ『星方武侠アウトロースター』のエンディング曲「Hiru no Tsuki」のような叙情的な方向性とは対極に、同時期に放送された深夜アニメの奇妙なオープニング曲群がある。しかし電波ソングを決定的に「ジャンル」として社会的に認知させたのは、2007年のアニメ『らき☆すた』のオープニング曲「もってけ！セーラーふく」（歌：泉こなた（平野綾）、柊かがみ（加藤英美里）、柊つかさ（福原香織）、高良みゆき（遠藤綾））だ。この曲はBPM163の高速四つ打ちに、意味不明な歌詞と複雑なリズム変化を組み合わせ、ニコニコ動画で爆発的に拡散した。作曲は神前暁（こうさきさとる）が担当し、彼はその後も数多くの電波ソング的楽曲を手がけた。

レーベル面では、ランティスやキングレコードのスターチャイルドレーベルがアニメタイアップの電波ソングを多数リリースした。同人シーンではコミックマーケットが最大の流通拠点であり、M3（音楽同人即売会）も重要な場として機能した。ニコニコ動画の登場（2006年）は電波ソングの拡散に決定的な役割を果たし、「歌ってみた」「踊ってみた」文化と結びついてジャンルの裾野を大きく広げた。

技術的背景としては、DAW（デジタル・オーディオ・ワークステーション）の低価格化により、個人が自宅で高品質な楽曲を制作できる環境が整ったことが大きい。CubaseやFL Studioの普及が同人音楽シーンの爆発的成長を支えた。また2007年のVOCALOID「初音ミク」の登場は電波ソングと深く結びつき、ミクの高音・機械的な声質が電波ソングの美学と親和性が高かったため、多数の電波ソング的VOCALOID楽曲が生まれた。

論争・対立の側面としては、電波ソングの「わざとらしい幼児性」や性的な歌詞が、フェミニズム的観点から批判を受けることがあった。また「本当に電波ソングか否か」という定義論争がネットコミュニティで繰り返され、ジャンルの境界は常に曖昧なままだ。

2010年代以降、電波ソングはVOCALOID文化・アイドルアニメ（『アイドルマスター』『ラブライブ！』）と融合しながら進化を続け、現在もニコニコ動画やYouTube、Spotifyなどのストリーミングサービスで新作が発表され続けている。海外でも「denpa」という言葉がそのまま使われ、日本のサブカルチャーファンの間で独自のコミュニティが形成されている。</p>
