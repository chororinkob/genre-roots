<h1>Denpa Song（デンパソング）とは</h1>
<p>電波ソングは、日本のサブカルチャーから生まれた音楽のスタイルだ。過度に誇張された声色と、意味不明だが印象的で、一度聞いたらなかなか頭から離れない歌詞が特徴である。 音の特徴は「甘い声とゲーム的な電子音」「テクノ系の音」とされる。音</p>
<p>電波ソングは、日本のサブカルチャーから生まれた音楽のスタイルだ。過度に誇張された声色と、意味不明だが印象的で、一度聞いたらなかなか頭から離れない歌詞が特徴である。

音の特徴は「甘い声とゲーム的な電子音」「テクノ系の音」とされる。音色は、わざと「安っぽく」「チープ」に作られることが多い。これもジャンルの美学の一部になっている。

メロディーは極端に明るい。多くはアップテンポの長調で、先の読めない転調（調の切り替え）がしばしば入る。

リズムは4/4拍子が基本で、テンポは速いものが多い。

声質は、誇張されたアニメ声的な声色が特徴だ。歌い方は、普通の歌唱技法から外れた甲高い声、わざとらしい幼児語のような発音、突然の叫び声や囁きが入り混じる。

歌詞の主題は幅広い。日常の些細な出来事を異常なテンションで語るもの、意味不明な造語や擬音語の羅列、萌え表現などがある。性的表現が含まれるものは少数派で、約15%とされる。

アニメソングやアイドルポップと比べると、違いがよく分かる。アニメソングは物語性や感情移入を重視する。これに対して電波ソングは、過度に誇張された声色や、意味不明だが印象的な歌詞を前面に出す。チップチューンとも音色が近い。ただ、チップチューンがゲーム音楽の文脈を持つのに対し、電波ソングの核心はボーカルと歌詞の「狂気」にある。

実際に鳴っている主な舞台は、同人音楽の即売会（コミックマーケット）、アニメ・ゲームのオープニングやエンディング、ニコニコ動画などのネット動画サイトだ。</p>
<h2>成り立ち</h2><p>電波ソングの起源には諸説あり、一点に決める定説はない。「電波ソング」の名称は、荒唐無稽な妄想や主張を公言する者を指す「電波系」に由来するとされる。そこから「常識外れで中毒性のある音楽」を指す言葉として定着した。ただし、語源の説は一つに定まっていない。

始祖として名前が挙がるのは、1989年のファミコン用ゲーム『アイドル八犬伝』の劇中歌「君はホエホエ娘」だ。1991年の宍戸留美「地球の危機」も、後に度々言及されるようになった。1998年12月発売のゲーム『MAID iN HEAVEN』の主題歌「メイドさんRock'n Roll」（歌：南ピル子）は、走りとされる。

とはいえ、「電波ソング」という呼び名そのものが生まれたのは2000年代初頭だ。1989年や1991年の曲は、後からさかのぼって始祖として言及されたものである。このジャンルはパソコンゲームの文化を中心に発展したとされる。どこからが電波ソングかという境目は、人によって判断が分かれる。

同人音楽の分野では、2003年に活動を始めた2人組ユニット「MOSAIC.WAV」（モザイクウェブ）がいる。メンバーは、み〜こ（ボーカル）と柏森進（キーボード）だ。結成当初は、貸切のメイドカフェなどで、パソコンゲームの主題歌をカバーするライブをしていた。2004年には、シングル『Magical Hacker☆くるくるリスク』とアルバム『We Love &quot;AKIBA-POP&quot;!!』を発表した。のちにメジャーレーベルのランティスにも進出している。

電波ソングの代表曲の一つとして知られるのが、2007年のアニメ『らき☆すた』のオープニング曲「もってけ！セーラーふく」だ。歌は泉こなた（平野綾）、柊かがみ（加藤英美里）、柊つかさ（福原香織）、高良みゆき（遠藤綾）が担当した。曲はBPM150のラップ調で、ファンクとテクノの手法に、サビでブリティッシュ・ロックを組み合わせている。この曲は、ニコニコ動画でも広まったとされる。2007年度には、ネット投票企画「電波ソング大賞」で1位に選ばれている。作曲は神前暁（こうさきさとる）が担当した。

レーベルでは、ランティスやキングレコードのスターチャイルドレーベルが、アニメのタイアップの電波ソングをリリースしたとされる。同人の世界では、コミックマーケットが主要な場の一つだった。M3（音楽同人即売会）も重要な場として機能した。ニコニコ動画の登場（2006年）は、電波ソングの拡散を後押しした一因となった。「歌ってみた」「踊ってみた」の文化とも結びついた。

技術の面では、DAW（デジタル・オーディオ・ワークステーション）が安くなったことが大きい。個人が自宅で高品質な曲を作れる環境が整ったからだ。2007年には、VOCALOIDの「初音ミク」が登場した。関連する例として、2009年のアルバム『Heartsnative』には、MOSAIC.WAVとの共作「みんなみくみくにしてあげる♪」がある。

論争の面では、「本当に電波ソングか否か」という定義論争が、ネットコミュニティで何度も繰り返されてきた。ジャンルの境目は、今も曖昧なままだ。

2010年代以降、電波ソングはVOCALOIDの文化と融合しながら進化を続けた。アイドルグループにも広がり、でんぱ組.incは一時期「電波ソングで世界に元気を発信♪」をキャッチフレーズにしていた。2022年にはEP『でんぱぁかしっくれこーど』で、電波ソングをテーマにしている。今もニコニコ動画やYouTube、Spotifyなどのストリーミングサービスで、新作の発表が続いている。海外でも「denpa」という言葉がそのまま使われている。</p>
