<h1>Klezmer（クレズマー）とは</h1>
<p>クレズマーは、東欧のアシュケナジム（中・東欧に住んだユダヤ人の集団）系のユダヤ人の間で受け継がれてきた、楽器だけで奏でる音楽だ。本来の役目は結婚式の伴奏で、儀式の場面ごとに対応した曲がひとそろい決まっている。 編成は歴史の中で変わ</p>
<p>クレズマーは、東欧のアシュケナジム（中・東欧に住んだユダヤ人の集団）系のユダヤ人の間で受け継がれてきた、楽器だけで奏でる音楽だ。本来の役目は結婚式の伴奏で、儀式の場面ごとに対応した曲がひとそろい決まっている。

編成は歴史の中で変わってきた。もともとは弦楽器が主役だった。ヴァイオリンが旋律を受け持ち、打弦楽器（弦を叩いて鳴らす楽器）や低音の楽器がそれを支えた。19世紀にはクラリネットと金管が加わった(時期は地域で異なり、軍楽隊の影響があった可能性がある)。アメリカでは20世紀にクラリネットが主役になった。

旋律の骨組みになるのは、ユダヤ教の祈りで使われる旋法（音の並び方の型）だ。とくに目立つのが、第二音を半音下げ、そこから第三音へ増2度（半音3つ分）で跳ぶ音階である。第二音を下げた旋法（フレイギッシュ／アハヴァ・ラバ）は、クレズマーを特徴づける主な旋法のひとつだ。

演奏の技法はとても独特だ。目指すのは、人の声、とくに祈りの歌と、泣き笑いの表現を楽器でまねることである。喉を詰まらせるような音の途切れ、しゃくり上げる飾りの音、揺らしながら滑らせる音程の動き。こうした技法の一つ一つに、固有の名前が付いている。

踊りの曲には、拍子と踊りの型によっていくつもの種類がある。2拍子のフレイレフスやシェル、ブルガール、3拍子系のホラなどだ。これとは別に、踊るためではなく聴くための形式もある。決まった拍を持たず、自由に嘆くように即興で奏でるもの(ドイナ)だ。

テンポは、踊りの種類や場の盛り上がりに応じて変わる。ホシドルのように、だんだん速くなっていく踊りもある。</p>
<h2>成り立ち</h2><p>担い手は、演奏を仕事にする楽師たちだった。その呼び名は「歌の器」、つまり楽器を意味するヘブライ語 kley zemer から来ている。彼らは家系の中で技を受け継いだ。地域や時代によっては、ギルド（ヘヴレ）を作った。そして複数の村を回りながら、結婚式で演奏していたとされる。

ロシア帝国など一部の地域・時期では、ユダヤ人の住む場所と職業に制限があった。同時に彼らは、宗教的な共同体の中でも微妙な立場にいた。儀式に関わりながら、宗教の上では端に置かれていたのである。

演奏の場は、ユダヤ人の祝いの席だけではなかった。周りのスラヴ系やロマの共同体とも音楽を交わし合い、その影響はこの音楽のスタイルに深く刻まれている。

18〜19世紀のウクライナでは「強い楽器」（金管・打楽器）が制限され、「弱い楽器」（弦・フルート）に限られたとされる。ただし、19世紀後半には金管入りの楽団が広まった。

1880年代から1920年代にかけて、迫害と貧しさから逃れる大きな移住の波が起こり、とても多くのユダヤ人がアメリカへ渡った。ニューヨークでは、Naftule BrandweinやDave Tarrasといったクラリネット奏者が録音を残し、この音楽は一時、盛んになる。しかし移民の第二世代は、アメリカ社会への同化（周りの社会に溶け込むこと）を望んだとされる。そしてこの音楽を古くさい過去の代名詞と見て、遠ざけたと言われる。

そこへ大きな途切れが訪れる。第二次世界大戦のホロコーストによって、この音楽を育てた東欧のユダヤ人共同体そのものが、物理的に壊滅した。さらに1948年以降のソ連では、ユダヤ音楽の演奏や研究が弾圧された。アメリカでも、戦後は人気が下がった。演奏者も聴き手も伝統も、その大半が失われた。それでも、Dave Tarrasのように、戦後も録音と演奏を続けた奏者はいた。

復興は1970年代のアメリカで始まった。若い世代の音楽家たちが古い録音を聴き、まだ存命だった年配の楽師を探し出して、じかに教えを受けた。そうして、失われた技法を作り直していったのである。今では世界各地に演奏者がいる。伝統を忠実に再現するものから、政治的な主張を込めた現代的な解釈まで、幅広い演奏が行われている。</p>
