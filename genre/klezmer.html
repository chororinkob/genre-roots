<h1>Klezmer（クレズマー）とは</h1>
<p>東欧のアシュケナジム系ユダヤ人の間で受け継がれてきた器楽音楽である。本来の役割は結婚式の伴奏であり、儀式の各段階に対応した楽曲が体系として存在する。旋律の骨格をなすのは、ユダヤ教の祈祷で用いられる旋法であり、とりわけ第二音を半音下</p>
<p>東欧のアシュケナジム系ユダヤ人の間で受け継がれてきた器楽音楽である。本来の役割は結婚式の伴奏であり、儀式の各段階に対応した楽曲が体系として存在する。旋律の骨格をなすのは、ユダヤ教の祈祷で用いられる旋法であり、とりわけ第二音を半音下げ、そこから第三音へ増二度で跳躍する音階が特徴的である。この不安定で切迫した跳躍が、この音楽の哀切な響きを決定づけている。編成は歴史的に変化した。もともとは弦楽器が主役で、ヴァイオリンが旋律を担い、打弦楽器や低音楽器が支えていたが、19世紀以降に軍楽隊の影響でクラリネットと金管が加わり、20世紀にはクラリネットが主役の座を占めた。演奏技法が極めて独特で、人の声、とりわけ祈祷の歌唱と、泣き笑いの表現を楽器で模倣することが目指される。喉を詰まらせるような音の途切れ、しゃくり上げる装飾、揺らしながら滑る音程移動といった技法に、それぞれ固有の名が与えられている。舞曲には拍子と踊りの型によって複数の種類があり、二拍子の速い曲、三拍子の揺れる曲、そして拍節を持たず自由に嘆く即興の形式などが含まれる。テンポは踊りの進行に応じて次第に加速する。</p>
<h2>成り立ち</h2><p>この音楽の担い手は職業的な楽師であり、その呼び名は器と歌を意味する語の合成である。彼らは家系によって技を継承し、同業者の組合に近い組織を持って、複数の村を巡回しながら結婚式で演奏していた。当時の東欧において、ユダヤ人は職業と居住を厳しく制限されており、音楽は数少ない許された生業のひとつだった。同時に彼らは、宗教的な共同体の内部でも、儀式に関わりながら宗教的には周縁という微妙な位置を占めていた。演奏はユダヤ人の祝宴に限られず、周辺のスラヴ系やロマの共同体とも音楽を交換しており、その相互の影響はこの音楽の様式に深く刻まれている。帝政ロシアの支配下では、使用できる楽器の種類を制限する法令が敷かれた時期もあり、そのために弦をはじく奏法や打楽器の工夫が発達したとも言われる。1880年代から1920年代にかけて、迫害と貧困から逃れる大規模な移住が起こり、膨大な数のユダヤ人がアメリカへ渡った。ニューヨークではNaftule BrandweinやDave Tarrasといったクラリネット奏者が録音を残し、この音楽は一時的に隆盛する。しかし移民の第二世代はアメリカ社会への同化を望み、この音楽を古臭い過去の象徴と見なして遠ざけた。そして決定的な断絶が訪れる。第二次世界大戦におけるホロコーストによって、この音楽を育んだ東欧のユダヤ人共同体そのものが物理的に壊滅したのである。演奏者も聴き手も伝統も、その大半が失われた。復興は1970年代のアメリカで始まった。若い世代の音楽家たちが、古い録音を聴き、なお存命だった老楽師を探し出して直接教えを乞い、失われた技法を再構築していったのである。現在では世界各地に演奏者が存在し、伝統の忠実な再現から、政治的な主張を伴う現代的な解釈まで、幅広い実践が行われている。</p>
