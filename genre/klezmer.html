<h1>Klezmer（クレズマー）とは</h1>
<p>東欧のアシュケナジム（中・東欧に住んだユダヤ人の集団）系ユダヤ人の間で受け継がれてきた器楽音楽である。本来の役割は結婚式の伴奏であり、儀式の各段階に対応した楽曲が体系として存在する。旋律の骨格をなすのは、ユダヤ教の祈祷で用いられる</p>
<p>東欧のアシュケナジム（中・東欧に住んだユダヤ人の集団）系ユダヤ人の間で受け継がれてきた器楽音楽である。本来の役割は結婚式の伴奏であり、儀式の各段階に対応した楽曲が体系として存在する。旋律の骨格をなすのは、ユダヤ教の祈祷で用いられる旋法（音の並び方の型）であり、とりわけ第二音を半音下げ、そこから第三音へ増2度（半音3つ分）で跳躍する音階が特徴的である。この不安定で切迫した跳躍が、この音楽の哀切な響きを決めている。編成は歴史的に変化した。もともとは弦楽器が主役で、ヴァイオリンが旋律を担い、打弦楽器（弦を叩いて鳴らす楽器）や低音楽器が支えていたが、19世紀にクラリネットと金管が加わり(時期は地域で異なり、軍楽隊の影響があった可能性がある)、20世紀にはクラリネットが主役の座を占めた。演奏技法が非常に独特で、人の声、とりわけ祈祷の歌唱と、泣き笑いの表現を楽器でまねることが目指される。喉を詰まらせるような音の途切れ、しゃくり上げる装飾、揺らしながら滑る音程移動といった技法に、それぞれ固有の名が与えられている。舞曲には拍子と踊りの型によって複数の種類があり、2拍子のフレイレフスやシェル、ブルガール、3拍子系のホラなどがある。これとは別に、踊るためではなく聴くための、決まった拍を持たず自由に嘆く即興の形式(ドイナ)もある。テンポは踊りの進行に応じて次第に加速する。</p>
<h2>成り立ち</h2><p>この音楽の担い手は職業的な楽師であり、その呼び名は器と歌を意味する語の合成である。彼らは家系によって技を継承し、同業者の組合に近い組織を持って、複数の村を巡回しながら結婚式で演奏していた。当時の東欧において、ユダヤ人は職業と居住を厳しく制限されており、音楽は数少ない許された生業のひとつだった。同時に彼らは、宗教的な共同体の内部でも、儀式に関わりながら宗教的には端に置かれるという微妙な立場にあった。演奏はユダヤ人の祝宴に限られず、周辺のスラヴ系やロマの共同体とも音楽を交換しており、その相互の影響はこの音楽の様式に深く刻まれている。18〜19世紀のウクライナでは、法令によってユダヤ人が演奏できるのは弦楽器やフルートなどの「柔らかい楽器」に限られ、金管楽器と打楽器は認められなかった。1880年代から1920年代にかけて、迫害と貧困から逃れる大規模な移住が起こり、非常に多くのユダヤ人がアメリカへ渡った。ニューヨークではNaftule BrandweinやDave Tarrasといったクラリネット奏者が録音を残し、この音楽は一時的に盛んになる。しかし移民の第二世代はアメリカ社会への同化（周りの社会に溶け込むこと）を望み、この音楽を古臭い過去の象徴と見なして遠ざけた。そして大きな途切れが訪れる。第二次世界大戦におけるホロコーストによって、この音楽を育んだ東欧のユダヤ人共同体そのものが物理的に壊滅した。さらに1948年以降のソ連ではユダヤ音楽の演奏や研究が弾圧され、アメリカでも戦後は人気が下がった。演奏者も聴き手も伝統も、その大半が失われたが、Dave Tarrasのように戦後も録音と演奏を続けた奏者もいた。復興は1970年代のアメリカで始まった。若い世代の音楽家たちが、古い録音を聴き、なお存命だった老楽師を探し出して直接教えを乞い、失われた技法を作り直していったのである。現在では世界各地に演奏者が存在し、伝統の忠実な再現から、政治的な主張を伴う現代的な解釈まで、幅広い実践が行われている。</p>
