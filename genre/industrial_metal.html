<h1>Industrial Metal（インダストリアルメタル）とは</h1>
<p>インダストリアル・メタルは、ヘヴィメタルのギターと、工場や機械を思わせる非人間的なリズムを組み合わせた音楽である。 ギターは、短く切った和音を機械の刻みとぴったり合わせて反復する。旋律よりも打楽器としての役割を担う。そこへ、低く唸</p>
<p>インダストリアル・メタルは、ヘヴィメタルのギターと、工場や機械を思わせる非人間的なリズムを組み合わせた音楽である。

ギターは、短く切った和音を機械の刻みとぴったり合わせて反復する。旋律よりも打楽器としての役割を担う。そこへ、低く唸るシンセサイザーの持続音、音階を一段ずつ上り下りする電子音のフレーズ、映画や演説、報道から切り取った語りのサンプルが重ねられる。

リズムは、機械的なものを重視する傾向が強い(Godfleshなどはドラムマシン中心)。ドラムマシンや打ち込み（機械に演奏を入力して鳴らす方法）が刻む、揺れの一切ない正確な拍が土台となる。この機械的な均質さは、生演奏の温かみを排除することで、聴き手に冷たさや圧迫感を与える効果を持つ。

打楽器は、ドラムマシンのプログラミングが中心で、工場音などのサンプルを重ねる例もある。ドラムマシンやサンプリング（既存の音を録音して素材にする手法）を多用するが、生ドラムを用いるバンドも多い。

ヴォーカルは、歪ませたマイクを通し、拡声器のように潰れた声で怒鳴られることが多い。歌詞はcyberpunk的な題材が多いが、バンドによって異なる。

曲は反復を基調とし、展開よりも積み上げと切断で構成される。同じ重さでもグルーヴメタルが身体の弾みを求めるのに対し、こちらは身体を機械へ従わせる感覚を作る。</p>
<h2>成り立ち</h2><p>源流は、音楽産業の外側にある。1975年にイギリスで結成されたThrobbing Gristleは、「Industrial Music for Industrial People」という標語を掲げた（Industrial Recordsの文書ではMonte Cazazzaが提案したとされるが、命名者には諸説ある）。レーベル名はIndustrial Recordsで、1976年設立である。彼らは、音楽というより社会に対する攻撃としての音響を提示した。ベルリンのEinstürzende Neubautenは、建設現場の資材や電動工具を楽器として演奏し、金属を打つ音が表現になりうることを実証する。

この思想がメタルのギターと結合したのが1980年代後半（1988年ごろ）である。シカゴではAl Jourgensen率いるMinistryが、シンセポップから出発しながら、1988年の作品で歪んだギターと打ち込みを結合させた。そして1992年の作品で、商業的・批評的成功を収めた。地元のWax Trax! Recordsが同種のバンドを集め、シカゴは大きな拠点となる。

イギリスのバーミンガムでは、Justin BroadrickとB. C. GreenのGodfleshとして、ドラムマシンのAlesis HR-16を中心に、極端に遅く重い反復を中心に構成された1989年の作品ストリートクリーナーを発表した。荒廃した工業都市の空気を、そのまま音にした作品である。

アメリカでは、1988年にTrent ReznorがNine Inch Nailsを始動させた。機械的な音響を、個人の精神の破綻を語る手段として用いる方向を切り開いた。1994年の作品ダウンワード・スパイラルは、俳優Sharon Tateが殺害された邸宅を借りて録音されたことでも知られる。商業的にも巨大な成功を収めて、この音を主流の市場へ持ち込んだ。

Trent ReznorがSean Beavan、Marilyn Manson、Dave Ogilvieとともに共同でプロデュースした、Marilyn Mansonの1996年の作品は、宗教団体の抗議行動や議会公聴会の対象となった。1999年のコロンバイン高校銃乱射事件の際には、根拠なく原因として名指しされ、表現の自由をめぐる論争の中心に置かれた。

カリフォルニアのFear Factoryは、1992年のデビュー作で既に、咆哮と旋律的な歌唱を交互に使っていた。1995年の作品では、機械のように正確なドラムとともにその手法を本格化した。一部の評論家は、Bellが咆哮とクリーン・ヴォーカルを同じ曲内で融合させた先駆者の一人と評価している。

ドイツでは、1994年にベルリンでRammsteinが結成された。母語のドイツ語による重々しい発音と、炎を多用する舞台演出によって、Oomph!と並んで、ノイエ・ドイチェ・ヘルテと呼ばれる系統の代表となった。現在では世界最大級の動員力を持ち、2019〜2024年のスタジアム・ツアーで約600万人を動員した（公式発表）。

ジャンルとしては2000年前後に批評面で反発を受け、以後は勢いが落ち着いたが、機械的な反復と生身の演奏を混ぜるという発想は、その後のヘヴィな音楽全般に定着している。</p>
