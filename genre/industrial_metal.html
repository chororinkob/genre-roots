<h1>Industrial Metal（インダストリアルメタル）とは</h1>
<p>ヘヴィメタルのギターと、工場や機械を思わせる非人間的なリズムを組み合わせた音楽である。決定的な特徴は、リズムを生身の演奏ではなく機械が担う点にあり、ドラムマシンや打ち込みが刻む、揺れの一切ない正確な拍が土台となる。この機械的な均質</p>
<p>ヘヴィメタルのギターと、工場や機械を思わせる非人間的なリズムを組み合わせた音楽である。決定的な特徴は、リズムを生身の演奏ではなく機械が担う点にあり、ドラムマシンや打ち込みが刻む、揺れの一切ない正確な拍が土台となる。この機械的な均質さは、生演奏の温かみを排除することで、聴き手に冷たさや圧迫感を与える効果を持つ。打楽器の音そのものも、金属板を叩く音、ドラム缶、機械の駆動音、破壊音を録音した素材が用いられ、生ドラムの音色は意図的に避けられる。ギターは短く切った和音を機械の刻みと完全に同期させて反復し、旋律よりも打楽器としての役割を担う。そこへ低く唸るシンセサイザーの持続音、順次進行する電子音型、映画や演説、報道から切り取った語りのサンプルが重ねられる。ヴォーカルは歪ませたマイクを通し、拡声器のように潰れた声で怒鳴られることが多く、旋律はほとんど持たない。テンポは110から150 BPM前後、曲は反復を基調とし、展開よりも積み上げと切断で構成される。歌詞は管理社会、宗教への憎悪、性、依存、身体の機械化といった主題を扱う。同じ重さでもグルーヴメタルが身体の弾みを求めるのに対し、こちらは身体を機械へ従わせる感覚を作る。</p>
<h2>成り立ち</h2><p>源流は音楽産業の外側にある。1975年にイギリスで結成されたThrobbing Gristleは、自らの活動をインダストリアル・ミュージックと名づけ、同名のレーベルを設立して、音楽というより社会に対する攻撃としての音響を提示した。ベルリンのEinstürzende Neubautenは建設現場の資材や電動工具を楽器として演奏し、金属を打つ音が表現になりうることを実証する。この思想がメタルのギターと結合したのが1980年代後半である。シカゴではAl Jourgensen率いるMinistryが、シンセポップから出発しながら1988年の作品で歪んだギターと打ち込みを結合させ、1992年の作品でこの様式を完成させた。地元のWax Trax! Recordsが同種のバンドを集め、シカゴは一大拠点となる。イギリスのバーミンガムでは、Justin BroadrickがGodfleshとして、生ドラマーを一切置かず、極端に遅く重い反復だけで構成された1989年の作品ストリートクリーナーを発表し、荒廃した工業都市の空気をそのまま音にした。アメリカでは1988年にTrent ReznorがNine Inch Nailsを始動させ、機械的な音響を個人の精神の破綻を語る手段として用いる方向を切り開いた。1994年の作品ダウンワード・スパイラルは、俳優Sharon Tateが殺害された邸宅を借りて録音されたことでも知られ、商業的にも巨大な成功を収めて、この音を主流の市場へ持ち込んだ。彼が制作を手掛けたMarilyn Mansonの1996年の作品は、アメリカの宗教右派との全面的な衝突を引き起こし、1999年のコロンバイン高校銃乱射事件の際には根拠なく原因として名指しされ、表現の自由をめぐる論争の中心に置かれた。カリフォルニアのFear Factoryは1995年の作品で、機械のように正確なドラムと、咆哮と旋律的な歌唱を交互に使う手法を確立し、後のメタルコアへ道を開く。ドイツでは1994年にベルリンでRammsteinが結成され、母語のドイツ語による重々しい発音と、炎を多用する舞台演出によって、ノイエ・ドイチェ・ヘルテと呼ばれる独自の系統を築き、現在では世界最大級の動員力を持つ。ジャンルとしての流行は2000年代に一段落したが、機械的な反復と生身の演奏を混ぜるという発想は、その後のヘヴィな音楽全般に定着している。</p>
