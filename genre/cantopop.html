<h1>Cantopop（カントポップ）とは</h1>
<p>香港を中心に、広東語で歌われる大衆音楽である。この音楽を語るうえで避けて通れないのが言語の性質で、広東語は音の高さの変化によって語の意味が変わる声調言語であり、六つから九つに分類される声調を持つ。そのため作詞は、旋律の音程の上下と</p>
<p>香港を中心に、広東語で歌われる大衆音楽である。この音楽を語るうえで避けて通れないのが言語の性質で、広東語は音の高さの変化によって語の意味が変わる声調言語であり、六つから九つに分類される声調を持つ。そのため作詞は、旋律の音程の上下と各語の声調の動きを一致させなければならず、合っていなければ歌が別の意味に聞こえてしまう。この厳しい制約のもとで、作詞家は意味と音の両立という高度な職人技を発達させた。逆に言えば、先に旋律を作り後から歌詞を当てはめる方式が定着したのもこのためである。音楽的には西洋のポップスの枠組みを基本とし、1970年代から1980年代は生の弦楽器と管楽器を用いた豊かな編曲、1980年代半ば以降はシンセサイザーと打ち込みが主流となった。曲の構造は明快で、感情の頂点に向かって上昇していく旋律線と、転調による盛り上げが多用される。歌唱は感情を抑制せず、伸びやかに歌い上げる形が好まれる。歌詞は恋愛が中心だが、都市生活の哀感、庶民の生活、そして時に社会への言及が織り込まれる。映画やテレビ番組の主題歌として作られる例が極めて多く、映像作品と一体で記憶されている点も大きな特徴である。</p>
<h2>成り立ち</h2><p>1960年代までの香港では、洋楽の英語曲と、上海から持ち込まれた標準中国語の歌謡が上流の音楽とされ、広東語の歌は下品で泥臭いものと見なされていた。この序列を覆したのが1970年代前半である。1974年、テレビドラマの主題歌が広東語で歌われて大きな反響を呼び、同じ年に許冠傑が、街の庶民の生活や労働の苦労を軽妙な広東語で歌う楽曲を発表した。彼は英語の教育を受けた大学出身でありながら、あえて日常の話し言葉を歌詞に用い、広東語で歌うことは恥ずかしくないという意識を社会に定着させた。1970年代後半から1980年代にかけて、香港の経済成長とテレビ産業の拡大に伴い、この分野は黄金期を迎える。羅文が芝居がかった歌唱で存在感を示し、譚詠麟と張國榮が激しい人気争いを繰り広げ、梅艷芳は曲ごとに姿を変える表現力で女性の象徴となった。ロックの側では、黃家駒率いるBeyondが、商業主義に流されない社会的な歌詞と力強い演奏で若者の支持を集めた。制作面では、日本の歌謡曲やニューミュージックの楽曲に広東語の詞を付け替えて発表する方式が広く行われ、中島みゆきや谷村新司らの作品が香港で大ヒットするという現象も起きている。1990年代前半には、張學友、劉德華、黎明、郭富城の四人が四大天王と称されて市場を席巻したが、外見と話題性を重視する売り出し方に対しては、音楽性の停滞を招いたという批判が根強い。この時代は悲劇も重なった。1993年に黃家駒が日本のテレビ番組の収録中の事故で死去し、2003年には張國榮が自ら命を絶ち、同じ年の暮れに梅艷芳が病により死去している。1997年の香港返還後は、市場の重心が標準中国語のポップスへ移り、広東語の作品の勢いは相対的に衰えた。それでも2010年代以降、香港の社会状況と結びつく形で、広東語で歌うこと自体に文化的な意味を見出す若い世代が現れ、この音楽は新しい局面を迎えている。</p>
