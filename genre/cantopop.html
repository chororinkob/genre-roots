<h1>Cantopop（カントポップ）とは</h1>
<p>カントポップは、香港を中心に、広東語で歌われる大衆音楽だ。 この音楽を語るうえで避けて通れないのが、言語の性質である。広東語は、音の高さの変化によって語の意味が変わる声調言語だ。声調は、六つから九つに分類される。そのため作詞では、</p>
<p>カントポップは、香港を中心に、広東語で歌われる大衆音楽だ。

この音楽を語るうえで避けて通れないのが、言語の性質である。広東語は、音の高さの変化によって語の意味が変わる声調言語だ。声調は、六つから九つに分類される。そのため作詞では、メロディーの音の上げ下げと、各語の声調の動きを一致させることが強く求められる。ただ、実際には声調と旋律の不一致（倒字）が起こることもあり、聴き手は文脈で意味を補う。この厳しい制約のもとで、作詞家は、意味と音を両立させる高い職人技を発達させた。先に旋律を作り、後から歌詞を当てはめる方式が定着した背景には、外国曲を借りて詞を付ける慣行などもある。

音楽の土台は、西洋のポップスの枠組みである。編曲は、1980年代は弦楽が中心だった。一部の編曲家は、合成器を好んで使った。電子機器やコンピューターによる制作が一般的になったのは、1990年代である。

曲の組み立てははっきりしている。感情の頂点に向かって上っていくメロディーと、転調による盛り上げを用いた曲が目立つ。歌い方も、感情を抑えず、伸びやかに歌い上げる曲が目立つ。

歌詞は恋愛が中心だ。そこに、都市生活の哀感や庶民の生活が加わり、時には社会への言及も織り込まれる。映画やテレビ番組の主題歌として作られる例が極めて多く、映像作品と一体で記憶されている点も、大きな特徴である。</p>
<h2>成り立ち</h2><p>1960年代までの香港では、洋楽の英語曲や標準中国語の歌謡の方が格上とされていた。広東語の歌は、庶民層向けの音楽と見られていた。

この序列は、1970年代前半に動きが始まり、1970年代末に広東語歌が市場の主流となった。1972年にバラエティ番組《雙星報喜》で《鐵塔凌雲》が歌われ、1974年にはドラマ《啼笑因緣》の主題歌が大ヒットした。許冠傑は、1974年の《鬼馬雙星》で庶民の心情や金銭への執着を軽妙に歌い、1976年の《半斤八兩》では労働者の辛酸も歌った。彼は英語の教育を受けた大学出身でありながら、あえて口語の広東語を用いた歌詞で支持を集めた。その姿は、他の歌手が広東語歌に転じるきっかけとなった。

1970年代後半から1980年代にかけて、香港の経済成長とテレビ産業の拡大に伴い、この分野は黄金期を迎える。羅文は、派手でジェンダー越境的な舞台イメージで存在感を示した。譚詠麟と張國榮は、メディアに対立構図を描かれた。梅艷芳は、曲ごとに姿を変える表現力で女性の代名詞となった。ロックの側では、黃家駒率いるBeyondが、社会的なメッセージを含む歌詞と力強い演奏で若者の支持を集めた。

制作面では、日本の歌謡曲やニューミュージックの楽曲に広東語の詞を付け替えて発表する方式が、広く行われた。中島みゆきや谷村新司らの作品が香港で大ヒットする、という現象も起きている。

1990年代には、張學友、劉德華、黎明、郭富城の4人が四大天王と呼ばれ、市場を広く制した。しかし、外見と話題性を重視する売り出し方に対しては、音楽性の停滞を招いたという批判が根強い。この時代は悲劇も重なった。1993年に黃家駒が、日本のテレビ番組の収録中の事故で死去した。

一方で、1990年代から国語市場への展開が進み、2000年代以降は本土市場への依存が強まった。2003年の張國榮・梅艷芳の死に加え、人材不足、海賊版とネット配信、経済不況、他ジャンル（Mandopop、K-pop）への聴衆流出などが重なり、2000年代に市場が縮小した。

それでも2010年代以降、香港の社会状況と結びつく形で、広東語で歌うこと自体に文化的な意味を見出す若い世代が現れた。この音楽は、新しい局面を迎えている。</p>
