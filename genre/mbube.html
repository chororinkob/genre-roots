<h1>Mbube（ムブベ）とは</h1>
<p>南アフリカのズールー系男性による合唱の様式で、名称はズールー語でライオンを意味する。4人から20人を超える規模まである無伴奏男声合唱で、1人のリードシンガーが短いフレーズを投げ、残り全員が和音で応える呼びかけと応答を基本の形とする</p>
<p>南アフリカのズールー系男性による合唱の様式で、名称はズールー語でライオンを意味する。4人から20人を超える規模まである無伴奏男声合唱で、1人のリードシンガーが短いフレーズを投げ、残り全員が和音で応える呼びかけと応答を基本の形とする。声部はベース、テナー、アルト、そしてファルセットで高音を担うソプラノに分かれ、圧倒的に人数の多いベースが分厚い土台をつくる。音量は大きく、胸を鳴らす発声で堂々と押し出すのが本来の姿である。和音は、宣教師が持ち込んだ讃美歌の4声の形を土台にしていて、全声部がリズムを揃えて同時に和音を作る形が基本とされる。歌詞は故郷への思い、労働、恋、宗教的な主題を扱う。同じ流れから生まれたイシカタミヤ(語源はズールー語の「そっと歩く」で、宿舎の警備員を起こさないため、という説明もある)が、抑えた声と忍び足で歌う静かな様式であるのに対し、ムブーベは名前のとおり獅子のように吼える力強さを持ち味とする点で対照的である。</p>
<h2>成り立ち</h2><p>源流をたどると1920年代の南アフリカにさかのぼり、ナタール地方の炭鉱・工場の出稼ぎ労働者の宿舎で育ち、その後ヨハネスブルグへ広がった。名前と様式が固まったのは1930年代である。農村から出稼ぎに来たズールー系の男たちは、家族と離れた男だけの宿舎で夜ごと合唱を組み、のちには土曜の夜に合唱団が競い合う徹夜の大会が開かれるようになった。ジャンル名を決めたのは、ズールー人労働者Solomon Lindaと彼のグループEvening Birdsが1939年にGallo Record Companyのスタジオで録音した「Mbube」である。この曲をきっかけに、ズールーの男声合唱全般が「ムブーベ」と呼ばれるようになり、Solomon Lindaが歌った高音のファルセット旋律は、その名称と様式に影響を与えた。レコードは南アフリカで、9年間に10万枚を超えたと報じられ、ジャンルそのものの名前となったが、Solomon Lindaが受け取った対価はごくわずかで、権利はレコード会社の手に渡っていた。1951年、アメリカのフォーク歌手Pete Seegerらが結成したThe Weaversがこの旋律を「Wimoweh」として録音し、1961年には、George David Weiss、Hugo Peretti、Luigi Creatoreらが改作した「The Lion Sleeps Tonight」をThe Tokensが録音して全米1位に送り込む。さらに1994年、ディズニーの映画『ライオン・キング』に使われたことで、この旋律は世界で最も広く知られたアフリカ音楽の一つとなった。一方でSolomon Lindaは1962年に貧困のうちに死去し、墓石を建てる余裕がなく貧民墓地に葬られた。約20年後に、遺族が墓石を建てている。2000年に南アフリカのジャーナリストRian Malanが雑誌『Rolling Stone』でこの経緯を告発したことから訴訟が起こり、2006年2月、遺族と米国の著作権保有者Abilene Musicの間で和解が成立した(Disneyは訴訟の被告とされたが、訴えは取り下げられた)。和解では、過去の使用分の支払いと将来の印税、Lindaを共作者として明記すること、信託の設立が定められた。この事件は、欧米の音楽産業がアフリカの創作をどう扱ってきたかを象徴的な例として繰り返し参照されてきた。音楽的には、ムブーベはより抑制的なイシカタミヤへと発展し、Ladysmith Black Mambazoがその代表として世界的な知名度を得た。</p>
