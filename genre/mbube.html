<h1>Mbube（ムブベ）とは</h1>
<p>ムブーベは、南アフリカのズールー系の男性が歌う合唱のスタイルだ。名前は、ズールー語で「ライオン」を意味する。 楽器は使わず、男声だけで歌う。声の役割は、ベース、テナー、アルト、そしてファルセットで高音を受け持つソプラノに分かれる。</p>
<p>ムブーベは、南アフリカのズールー系の男性が歌う合唱のスタイルだ。名前は、ズールー語で「ライオン」を意味する。

楽器は使わず、男声だけで歌う。声の役割は、ベース、テナー、アルト、そしてファルセットで高音を受け持つソプラノに分かれる。最も人数の多いベースが、分厚い土台をつくる。

和音は、在来の音楽、キリスト教の合唱、ミンストレル・ショーなど、複数の要素の混合を土台にしている。全部の声がリズムを揃え、同時に和音を作る形が基本とされる。

基本の形は、呼びかけと応答だ。1人のリードシンガーが短いフレーズを投げかけ、残りの全員が和音で応える。歌声は大きく力強い。とくに1940年代後半には、荒々しい音になったとされる。

ムブーベと同じ流れから生まれた初期のイシカタミヤでは、歌詞は故郷への思い、労働、恋、宗教的な主題を扱った。

同じ流れから生まれたものに、イシカタミヤがある(語源はズールー語の「静かに歩く」で、宿舎の警備員の邪魔をしないため、という説明もある)。イシカタミヤは、抑えた声と忍び足で歌う静かなスタイルだ。それに対してムブーベは、獅子が吼えるような力強さを持ち味とする、という見方がある。この点で、両者は対照的である。</p>
<h2>成り立ち</h2><p>源流は、1920年代の南アフリカにさかのぼる。ナタール地方の炭鉱や工場で働く出稼ぎ労働者の宿舎で育ち、その後ヨハネスブルグへ広がった。名前とスタイルが固まったのは、1930年代である。

農村から出稼ぎに来たズールー系の男たちは、家族と離れ、男だけの宿舎で暮らしていた。彼らは週末に合唱を組んだ。のちには、土曜の夜に合唱団が競い合う、徹夜の大会が開かれるようになった。

ジャンルの名前は、ある曲の曲名から来ている。1939年、ズールー人労働者のSolomon Lindaと彼のグループEvening Birdsが、Gallo Record Companyのスタジオで「Mbube」を録音した。この曲をきっかけに、ズールーの男声合唱全般が「ムブーベ」と呼ばれるようになった。Solomon Lindaが歌った高音のファルセットの旋律は、そのスタイルに影響を与えた。

レコードは南アフリカで、9年間に10万枚を超えたと報じられ、ジャンルそのものの名前となった。しかし、Solomon Lindaが受け取った対価はごくわずかだった。権利は、レコード会社の手に渡っていた。

旋律は、やがて海を渡る。1951年、アメリカのフォーク歌手Pete Seegerらが結成したThe Weaversが、この旋律を「Wimoweh」として録音した。1961年には、George David Weiss、Hugo Peretti、Luigi Creatoreらが改作した「The Lion Sleeps Tonight」を、The Tokensが録音して全米1位に送り込む。さらに1994年、ディズニーの映画『ライオン・キング』に使われたことで、この旋律は映画でさらに広まった。

一方で、Solomon Lindaは1962年に貧困のうちに死去した。墓石を建てる余裕がなく、貧民墓地に葬られた。1980年頃に、遺族が墓石を建てたとされる。

2000年、南アフリカのジャーナリストRian Malanが、雑誌『Rolling Stone』でこの経緯を告発した。これをきっかけに訴訟が起こる。2006年2月、遺族側と米国の著作権保有者Abilene Musicらの間で和解し、Disneyへの訴えは取り下げられた。和解では、過去の使用分の支払いと将来の印税、Lindaを共作者として明記すること、信託の設立が定められた。この事件は、欧米の音楽産業がアフリカの創作をどう扱ってきたかを示す、代表的な例として繰り返し取り上げられてきた。

音楽の面では、ムブーベはより控えめなイシカタミヤへと発展した。Ladysmith Black Mambazoがその代表として、世界的な知名度を得た。</p>
