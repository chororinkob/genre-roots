<h1>Mbube（ムブベ）とは</h1>
<p>南アフリカのズールー系男性による合唱の様式で、名称はズールー語でライオンを意味する。10人前後から20人規模の無伴奏男声合唱で、1人のリードシンガーが短いフレーズを投げ、残り全員が和音で応える呼びかけと応答を基本構造とする。声部は</p>
<p>南アフリカのズールー系男性による合唱の様式で、名称はズールー語でライオンを意味する。10人前後から20人規模の無伴奏男声合唱で、1人のリードシンガーが短いフレーズを投げ、残り全員が和音で応える呼びかけと応答を基本構造とする。声部はベース、バリトン、テナー、そしてファルセットで高音を担うアルトに分かれ、圧倒的に人数の多いベースが分厚い土台を作る。音量は大きく、胸を鳴らす発声で堂々と押し出すのが本来の姿である。和声は宣教師が持ち込んだ讃美歌の四声体を土台にしながら、ズールー語の声調と旋律が結びついた独自の進行をとる。ズールーの伝統的な合唱では声部ごとに歌い出しがずれて重なるのが基本だが、ムブーベでは讃美歌の影響で全声部が同時に動く場面も多い。テンポは中庸で、足踏みと手拍子が拍を支える。歌詞は故郷への思い、鉱山での労働、恋、宗教的な主題を扱う。同じ流れから生まれたイシカタミヤが、宿舎の管理人に気づかれないよう抑えた声と忍び足で歌う静かな様式であるのに対し、ムブーベは名前のとおり獅子のように吼える力強さを身上とする点で対照的である。</p>
<h2>成り立ち</h2><p>1930年代の南アフリカ、ヨハネスブルグ周辺の金鉱山とその宿舎で形成された。農村から出稼ぎに来たズールー系の男たちは、家族と離れた男だけの宿舎で夜ごと合唱を組み、日曜には各宿舎の合唱団が競い合う大会が開かれていた。ジャンル名を決定づけたのは、ズールー人労働者Solomon Lindaと彼のグループEvening Birdsが1939年にGallo Record Companyのスタジオで録音した「Mbube」である。この曲でSolomon Lindaが即興で歌った高音のファルセット旋律は、以後の南アフリカ音楽全体に刻まれることになった。レコードは南部アフリカで10万枚以上を売り上げ、ジャンルそのものの名前となったが、Solomon Lindaが受け取った対価はごくわずかで、権利はレコード会社の手に渡っていた。1951年、アメリカのフォーク歌手Pete Seegerが率いるThe Weaversがこの旋律を「Wimoweh」として録音し、1961年にはThe Tokensが英語詞を付けた「The Lion Sleeps Tonight」を全米1位に送り込む。さらに1994年、ディズニーの映画『ライオン・キング』に使われたことで、この旋律は世界で最も広く知られたアフリカ音楽の一つとなった。一方でSolomon Lindaは1962年に貧困のうちに死去し、墓石すら立てられなかった。2000年に南アフリカのジャーナリストRian Malanが雑誌『Rolling Stone』でこの経緯を告発したことから訴訟が起こり、2006年にディズニー側と遺族の間で和解が成立している。この事件は、欧米の音楽産業がアフリカの創作をどう扱ってきたかを象徴する例として繰り返し参照されてきた。音楽的には、ムブーベはより抑制的なイシカタミヤへと発展し、Ladysmith Black Mambazoがその代表として世界的な知名度を得た。</p>
