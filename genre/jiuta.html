<h1>Jiuta（ジウタ）とは</h1>
<p>三味線1挺を抱えて歌う京都・大阪の室内歌曲だ。代表曲22曲を動画で聴け、ルーツと影響のつながりを地図でたどれる。</p>
<p>三味線1挺を抱えて歌う京都・大阪の室内歌曲だ。劇場ではなく、座敷で少人数に向けて演奏されてきた。

中心になる楽器は三味線で、地歌では「三絃」と呼ぶ。棹は細く、糸は絹。胴に張った皮へ撥が当たると「サワリ」という擦れた響きが混じる。合奏では箏と尺八が加わり、この編成を三曲という。

旋律は五音音階で動く。明るい陽音階と、半音の陰りが入る陰音階を使い分ける。三絃の調弦は本調子・二上がり・三下がり。曲の途中で調弦を変える曲もあり、《茶音頭》や《融》がその例だ。箏は平調子や雲井調子で調弦し、三絃の節を少しずらして重ねる。

リズムは拍に縛られない。歌い手が息の長さで間を取り、テンポは曲の中で伸び縮みする。合奏はヘテロフォニーになり、同じ節を各楽器が微妙に変えて弾く。装飾音の余韻と、音が消えるまでの響きで表情を作る。

歌いは弾き歌いだ。地声に近い低い声で、言葉を「詞」、節を「節」として区別しながら運ぶ。細かいこぶしと、語尾を落として消える歌い方が持ち味になる。

歌詞は四季、恋、旅、無常を詠む。和歌や古典文学の言葉を借り、名所や故事を織り込む。雅な言葉づかいが基本だ。

曲の組み立ては前歌・手事・後歌。手事は歌のない器楽部分で、三絃と箏が技巧を見せる。手事を軸にした曲を手事物、歌を中心にした曲を歌ものという。全体は序破急で運ぶ。

長唄や浄瑠璃が劇場の音なら、地歌は座敷の音だ。民謡より装飾が細かく、歌詞も文語的になる。今は京都や大阪の稽古場、ホール、録音で聴くことができる。</p>
<h2>成り立ち</h2><p>16世紀の後半、琉球の三線が日本に伝わり、三味線が生まれた。京都と大阪では、平家琵琶を伝えてきた当道座の盲人音楽家がこれを取り入れた。当道座は検校・勾当・座頭という位で組織された職業団体だ。彼らが三味線歌曲を作り、教え、門付けで稼いだ。地歌はその意味で法師唄とも呼ばれた。

三味線音楽の祖とされるのは石村検校だ。彼の系統から上方の歌ものが広がり、元禄のころには座敷の遊びの歌として定着する。18世紀に入ると、浄瑠璃の節回しや語りが地歌に流れ込み、歌と歌の間に器楽だけの部分を挟む形式が生まれた。

18世紀の後半、大阪の峰崎勾当がその器楽部分を長く、技巧的にした。弟子筋の三ツ橋勾当はさらに手事を拡大し、曲は長く変化に富むようになる。《残月》は峰崎勾当が大阪・宗右衛門町の門人の娘の死を悼んで作ったとされ、今も追善の曲として弾かれる。

同じころ京都では、松浦検校が洗練された京風手事物を書いた。《四つの民》《末の契》がその代表だ。京風手事物は「京もの」と呼ばれ、箏の手付を担った八重崎検校の仕事で、三絃と箏が絡み合う合奏が主役になっていく。菊岡検校は1792年に生まれ、天保年間に《茶音頭》を残した。箏の手は八重崎検校が付けた。

石川勾当は《八重衣》を書いた。演奏時間20分を超え、前歌・手事・中歌・手事・後歌と続く大曲だ。箏は曲中で何度も調弦を変え、三絃は本調子のまま通す。この作りは手事物の到達点とされる。

箏を三絃の伴奏から独立させようとしたのが光崎検校だ。生年は不明で、1853年ごろに没した。生田検校の《四段砧》に替手を加えて、歌のない二重箏曲《五段砧》に仕立てた。白居易の「長恨歌」に取材した《秋風の曲》では、箏組歌と段物を組み合わせている。彼の仕事は吉沢検校に引き継がれ、箏曲は独自の道を歩んだ。

合奏の形も変わった。江戸時代の三曲合奏は三絃・箏・胡弓だった。明治4年（1871年）に当道座が廃止され、同じ時期に普化宗も廃止されると、尺八が胡弓に代わって三曲に入る。職と身分の制度に支えられていた盲人音楽家は、その土台を失った。

以後、地歌は流派と師弟の関係で伝えられた。江戸では山田検校が山田流を開き、上方とは別の道を歩む。明治以降は西洋音楽が入り、劇場音楽や新民謡に押されて担い手は減った。それでも大阪と京都の家元を中心に稽古が続き、戦後は日本伝統文化振興財団の《箏曲地歌大系》のような録音全集が作られて、家元の芸が音で残るようになった。初代富山清琴は1966年に『清琴地うた修業』を出し、京都の芸を言葉でも残している。

現在は稽古人口の減少と高齢化が課題だ。国立劇場は文化デジタルライブラリーで地歌の歴史と用語を公開し、京都の一般社団法人 地歌 Mirai は子ども向けの教室を開いて後継者を育てている。人間国宝の認定を受けた演奏家もおり、地歌から浄瑠璃や長唄が生まれたと説明されることもある。座敷の音は、ホールと録音のなかで細く長く続いている。</p>
