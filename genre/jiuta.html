<h1>Jiuta（ジウタ）とは</h1>
<p>地歌は、三味線1挺を抱えて歌う京都・大阪の室内歌曲だ。代表曲20曲を動画で聴け、ルーツと影響のつながりを地図でたどれる。</p>
<p>地歌は、三味線1挺を抱えて歌う京都・大阪の室内歌曲だ。劇場ではなく、座敷で少人数に向けて演奏されてきた。

中心になる楽器は三味線で、地歌では「三絃」と呼ぶ。棹は一般に中棹で、糸は絹を使う。一の糸が棹のサワリ部分にわずかに触れて、擦れた響きが混じる。合奏では箏と尺八が加わり、この編成を三曲という。

旋律は5音音階で動く。半音の陰りが入る陰音階が基本となっている。三絃の調弦は本調子・二上がり・三下がり。曲の途中で調弦を変える曲もあり、《茶音頭》や《融》がその例だ。箏は平調子や雲井調子で調弦し、三絃の節を少しずらして重ねる。

歌の部分は拍に縛られにくい。歌い手が息の長さで間を取り、テンポは曲の中で伸び縮みする。合奏はヘテロフォニーになり、同じ節を各楽器が微妙に変えて弾く。装飾音の余韻と、音が消えるまでの響きで表情を作る。

歌い方は弾き歌いだ。地声に近い低い声で、言葉を「詞」、節を「節」として区別しながら運ぶ。細かいこぶしと、語尾を落として消える歌い方が持ち味になる。

歌詞は四季、恋、旅、無常を詠む。和歌や古典文学の言葉を借り、名所や故事を織り込む。雅な言葉づかいが基本だ。

曲の組み立ては前歌・手事・後歌。手事は歌のない器楽部分で、三絃と箏が技を見せる。手事を軸にした曲を手事物、歌を中心にした曲を歌ものという。手事を中心に序破急で進むのがふつうだ。

長唄や浄瑠璃が劇場の音なら、地歌は座敷の音だ。民謡より装飾が細かく、歌詞も文語的になる。今は京都や大阪の稽古場、ホール、録音で聴くことができる。</p>
<h2>成り立ち</h2><p>16世紀の後半、琉球の三線が日本に伝わり、三味線が生まれた。京都と大阪では、平家琵琶を伝えてきた当道座の盲人音楽家が、この新しい楽器を取り入れた。当道座は検校・別当・勾当・座頭の四官で組織された職業団体だ。彼らは三味線歌曲を作り、教え、演奏した。地歌はその意味で法師唄とも呼ばれた。

最古の芸術歌曲である三味線組歌の創始者とされるのは石村検校だ。彼の系統から上方の歌ものが広がり、元禄のころには座敷の遊びの歌として定着したとされる。同じ元禄のころ、組歌・長歌の合の手が発展するなどして、歌と歌の間に器楽だけの部分を挟む手事物が生まれた。

18世紀の後半、大阪の峰崎勾当が、その器楽部分を長く、技巧的にした。三ツ橋勾当は峰崎の手事物を受け継いだ後輩で、峰崎勾当と並ぶ大阪の手事物の代表的な作曲者とされる。《残月》は峰崎勾当が、大阪・宗右衛門町の門人の娘の死を悼んで作ったとされ、今も追善の曲として弾かれる。

一方、19世紀初頭の京都では、松浦検校が洗練された京風手事物を書いた。《四つの民》《末の契》がその代表だ。京風手事物は「京もの」と呼ばれる。松浦検校らの京風手事物には、浦崎検校・八重崎検校が箏の手付をした。こうして三絃と箏が絡み合う合奏が主役になっていく。菊岡検校は1792年に生まれ、天保年間に《茶音頭》を残した。この曲の箏の手は八重崎検校が付けた。

石川勾当は《八重衣》を書いた。演奏時間20分を超え、前歌・手事・中歌・手事・後歌と続く大曲だ。箏は曲中で何度も調弦を変え、三絃は本調子のまま通す。この曲は石川の三つ物の1つで、屈指の大曲とされる。

箏を三絃の伴奏から独立させようとしたのが光崎検校だ。生年は不明で、没年は1853年ごろとされる。1858年説もある。彼は生田検校作とされる《四段砧》に替手を加えて、歌のない二重箏曲《五段砧》に仕立てた。白居易の「長恨歌」に取材した《秋風の曲》では、箏組歌と段物を組み合わせている。その仕事は吉沢検校に引き継がれ、箏曲は独自の道を歩んだ。

合奏の形も変わった。江戸時代の三曲合奏は三絃・箏・胡弓だった。江戸中期から尺八も合奏に加わり、本格的に入るのは明治以降になる。明治4年（1871年）に当道座が廃止され、同じ時期に普化宗も廃止されると、尺八が三曲に本格的に加わった。今は尺八入りが主流だが、胡弓入りも残る。職と身分の制度に支えられていた盲人音楽家は、その土台を失った。

以後、地歌は流派と師弟の関係で伝えられた。江戸では山田検校が山田流を開き、上方とは別の道を歩む。明治以降は西洋音楽が入り、劇場音楽に押されて担い手は減ったとされる。それでも大阪と京都の家元を中心に稽古が続いた。戦後は日本伝統文化振興財団の《箏曲地歌大系》のような、2002年発売のCD全集が作られて、家元の芸が音で残るようになった。大阪生まれで東京を拠点とした初代富山清琴は、1966年に『清琴地うた修業』を出した。

現在は稽古人口の減少と高齢化が課題だ。日本芸術文化振興会は、文化デジタルライブラリーで地歌の歴史と用語を公開している。神奈川県横浜市の一般社団法人 地歌 Mirai は、2022年に設立され、子どもから大人までを対象に地歌箏曲教室を開いている。人間国宝の認定を受けた演奏家もおり、地歌から長唄が生まれたと説明されることもある。座敷の音は、ホールと録音のなかで細く長く続いている。</p>
