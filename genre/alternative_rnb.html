<h1>Alternative R&amp;Bとは</h1>
<p>2010年前後、R&amp;Bの歌い回しやコード感を保ったまま、音づくりだけをインディーロックやアンビエント、エレクトロニカの側から組み直した音楽。まず空間の扱いが違い、ボーカルにも楽器にも長い残響と反復するディレイが深くかけられ、輪郭が</p>
<p>2010年前後、R&amp;Bの歌い回しやコード感を保ったまま、音づくりだけをインディーロックやアンビエント、エレクトロニカの側から組み直した音楽。まず空間の扱いが違い、ボーカルにも楽器にも長い残響と反復するディレイが深くかけられ、輪郭がぼやけた霧の中から声が聞こえてくるような質感になる。低音はキックの下にサブベースの持続音が敷かれ、スピーカーよりヘッドホンで初めて全体が見える設計になっている。テンポは毎分60から90拍程度に落とされ、ドラムは二拍四分の一で叩くハーフタイムでさらに遅く感じさせる。和音は短調やモードを基調に、解決しない宙吊りの響きを長く引き延ばす。ボーカルはピッチ補正やフォルマント加工、オクターブ違いの重ね録りを、修正ではなく効果として堂々と使い、ささやきと絶叫の間を行き来する。歌詞の内容が最も大きな違いで、従来のR&amp;Bが誘惑や成功や自信を歌ったのに対し、こちらは孤独、依存、薬物、性の後ろめたさ、疲弊といった負の側面を一人称で書く。曲は明快なサビを持たないことも多く、同じ断片が変形しながら繰り返され、最後に全く別の展開へ移って終わる。ライブは強い照明を使わず、暗闇と煙の中で歌われることが多い。</p>
<h2>成り立ち</h2><p>呼び名としてはPBR&amp;Bやインディーとも呼ばれ、どれも音楽誌が後から貼った札で、演奏者自身はほとんど使わなかった。素地は2000年代半ばにできていた。プロデューサーのTimbalandやThe-Dreamが電子音の実験をR&amp;Bに持ち込み、カナダのDrakeが2009年の『So Far Gone』で、ラップと歌の境界を溶かした沈んだ質感を提示した。決定的だったのは2011年で、トロントの匿名の若者Abel TesfayeがThe Weekndの名義で『House of Balloons』を無料配布した。イギリスのバンドBeach Houseの曲を無断で切り貼りし、薬物とパーティーの荒廃をそのまま書いたこの作品は、ネット上で爆発的に広がった。同じ年、ロサンゼルスの制作集団Odd Futureに属していたFrank Oceanが『nostalgia, ULTRA』を発表し、2012年の『channel ORANGE』では発売直前に自身が男性に恋をしたことを公表して、男性R&amp;B歌手の前提を揺さぶった。イギリスではJames Blakeがダブステップの低音とゴスペル的な歌唱を接続し、FKA Twigsがバレエと現代舞踊を持ち込んだ映像表現で新しい像を作った。制作面ではNoah Shebib、Illangelo、Arca、Sampha、Dev Hynesといった裏方が音の共通語を作り、Jhené Aiko、SZA、Kelela、Solangeがそれぞれの方向へ広げた。2010年代半ばには、この様式はもはや代替ではなく主流になり、SZAの『Ctrl』(2017)やThe Weekndのスタジアム公演が示すとおり商業的にも頂点に達した。そのため呼び名自体が実態と合わなくなり、代替という語の意味が失われたという批判も繰り返し提起されている。一方で、黒人音楽の歴史を軽視した安易な名づけだという指摘もあり、名称をめぐる論争は決着していない。</p>
<h2>代表曲</h2><ul><li>House of Balloons (The Weeknd)</li><li>Channel Orange (Frank Ocean)</li><li>Two Weeks (FKA twigs)</li><li>Good Days (SZA)</li><li>Cranes in the Sky (Solange)</li></ul>
