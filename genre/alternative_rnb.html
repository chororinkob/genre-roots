<h1>Alternative R&amp;Bとは</h1>
<p>この音楽は、2010年前後に、現代R&amp;Bに対するスタイルの面での代替として生まれた音楽だ。インディーロックやアンビエント、エレクトロニカの側から、音づくりを組み直した。音と歌詞の両面で違いがあるとされる。 まず、空間の扱いが違う。</p>
<p>この音楽は、2010年前後に、現代R&amp;Bに対するスタイルの面での代替として生まれた音楽だ。インディーロックやアンビエント、エレクトロニカの側から、音づくりを組み直した。音と歌詞の両面で違いがあるとされる。

まず、空間の扱いが違う。ボーカルにも楽器にも長い残響と、反復するディレイ（音を遅らせて繰り返す効果）が深くかけられる。輪郭がぼやけた霧の中から声が聞こえてくるような質感になる。低音は、キックの下にサブベース（体に響く極低音）の持続音が敷かれる。

和音は、短調やモード（旋法＝音の並び方の型）を基調にする曲もある。解決しない宙吊りの響きを、長く引き延ばす。

テンポは出典によって範囲が異なる。ドラムは、スネアを小節の3拍目に置くハーフタイム（拍の進みが半分に感じられる形）で、さらに遅く感じさせる。

ボーカルは、ピッチ補正（音程の自動補正）やフォルマント加工（声質を変える加工）を使う。オクターブ違い（高さが一段違う声）の重ね録りも使う。これらは修正ではなく効果として堂々と使われ、声はささやくような声から力を込めた声までにわたる。

歌詞は、性・薬物・精神性・個人的哲学など、主題が幅広い。

明快なサビを持たず、同じ断片が変形しながら繰り返され、最後に全く別の展開へ移って終わる曲もある。ライブは、規模や演出は多様。</p>
<h2>成り立ち</h2><p>呼び名としては、PBR&amp;Bやインディーとも呼ばれる。PBR&amp;Bは評論側が作った語で、作者本人は駄洒落だったと述べている。PBR&amp;Bの最初の用例は、2011年の音楽記者のSNS投稿とされる。一方、alternativeという語は、少なくとも一部の演奏者が自称している。

素地は2000年代半ばにできていたとされる。先駆として、Janet Jacksonの『The Velvet Rope』（1997年）やAaliyahなどを挙げる説もある。プロデューサーのTimbalandやThe-Dreamが、電子音の実験をR&amp;Bに持ち込んだという見方もある。そこへカナダのDrakeが、2009年の『So Far Gone』で、ラップと歌の境界を溶かした沈んだ質感を示した。

決定的だったのは2011年である。トロントの匿名の若者Abel Tesfayeが、The Weekndの名義で『House of Balloons』を無料配布した。米国のバンドBeach Houseや、英国のSiouxsie and the Banshees、Cocteau Twinsなどの曲を、発表時には権利処理をしないまま使っている。薬物とパーティーの荒廃をそのまま書いたこの作品は、ネット上で爆発的に広がった。

同じ年、ロサンゼルスの制作集団Odd Futureに属していたFrank Oceanが、『nostalgia, ULTRA』を発表した。2012年の『channel ORANGE』では、発売直前に自身が男性に恋をしたことを公表し、男性R&amp;B歌手の前提を揺さぶった。

イギリスでは、James Blakeがダブステップの低音とゴスペル的な歌唱を結びつけた。FKA Twigsは、ヴォーギングなどを特徴とする映像表現で、新しい像を作った。ポールダンスは、2019年の「Cellophane」からである。

制作面には、Noah Shebib、Illangelo、Arca、Sampha、Dev Hynesといった、制作や共作で関わった音楽家たちがいた。Jhené Aiko、SZA、Kelela、Solangeが、それぞれの方向へ広げていった。

2010年代後半から2020年代初頭にかけて、この流れはもはや代替ではなく主流になったと評価される。SZAは2017年の『Ctrl』で評価を得て、2022年の『SOS』で全米1位を得た。呼び名については、「藪にらみ（ピジョンホール）」にする、R&amp;B自体を傍流扱いする、という批判がある。一方で、黒人音楽の歴史を軽視した安易な名づけだという指摘もあり、名称をめぐる論争は決着していない。</p>
