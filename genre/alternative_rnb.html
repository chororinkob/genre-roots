<h1>Alternative R&amp;Bとは</h1>
<p>2010年前後、R&amp;Bの歌い回しやコード感を保ったまま、音づくりだけをインディーロックやアンビエント、エレクトロニカの側から組み直した音楽。まず空間の扱いが違い、ボーカルにも楽器にも長い残響と反復するディレイ（音を遅らせて繰り返す</p>
<p>2010年前後、R&amp;Bの歌い回しやコード感を保ったまま、音づくりだけをインディーロックやアンビエント、エレクトロニカの側から組み直した音楽。まず空間の扱いが違い、ボーカルにも楽器にも長い残響と反復するディレイ（音を遅らせて繰り返す効果）が深くかけられ、輪郭がぼやけた霧の中から声が聞こえてくるような質感になる。低音はキックの下にサブベース（体に響く極低音）の持続音が敷かれ、スピーカーよりヘッドホンで初めて全体が見える設計になっている。テンポは毎分60から90拍程度に落とされ、ドラムは、スネアを小節の3拍目に置くハーフタイム（拍の進みが半分に感じられる形）でさらに遅く感じさせる。和音は短調やモード（旋法＝音の並び方の型）を基調に、解決しない宙吊りの響きを長く引き延ばす。ボーカルはピッチ補正（音程の自動補正）やフォルマント加工（声質を変える加工）、オクターブ違い（高さが一段違う声）の重ね録りを、修正ではなく効果として堂々と使い、ささやきと絶叫の間を行き来する。歌詞の内容が最も大きな違いで、従来のR&amp;Bが誘惑や成功や自信を歌ったのに対し、こちらは孤独、依存、薬物、性の後ろめたさ、疲弊といった負の側面を一人称で書く。曲は明快なサビを持たないことも多く、同じ断片が変形しながら繰り返され、最後に全く別の展開へ移って終わる。ライブは強い照明を使わず、暗闇と煙の中で歌われることが多い。</p>
<h2>成り立ち</h2><p>呼び名としてはPBR&amp;Bやインディーとも呼ばれ、どれも評論側が後から貼った札で（PBR&amp;Bの最初の用例は、2011年の音楽記者のSNS投稿とされる）、演奏者自身はほとんど使わなかった。素地は2000年代半ばにできていたとされ、先駆としてはJanet Jacksonの『The Velvet Rope』（1997年）やAaliyahなどを挙げる説もある。プロデューサーのTimbalandやThe-Dreamが電子音の実験をR&amp;Bに持ち込んだという見方もあり、カナダのDrakeが2009年の『So Far Gone』で、ラップと歌の境界を溶かした沈んだ質感を提示した。決定的だったのは2011年で、トロントの匿名の若者Abel TesfayeがThe Weekndの名義で『House of Balloons』を無料配布した。米国のバンドBeach Houseや、英国のSiouxsie and the Banshees、Cocteau Twinsなどの曲を、発表時には権利処理をしないまま使い、薬物とパーティーの荒廃をそのまま書いたこの作品は、ネット上で爆発的に広がった。同じ年、ロサンゼルスの制作集団Odd Futureに属していたFrank Oceanが『nostalgia, ULTRA』を発表し、2012年の『channel ORANGE』では発売直前に自身が男性に恋をしたことを公表して、男性R&amp;B歌手の前提を揺さぶった。イギリスではJames Blakeがダブステップの低音とゴスペル的な歌唱を結びつけ、FKA Twigsがバレエやポールダンスを持ち込んだ映像表現で新しい像を作った。制作面ではNoah Shebib、Illangelo、Arca、Sampha、Dev Hynesといった裏方が音の共通の表現を作り、Jhené Aiko、SZA、Kelela、Solangeがそれぞれの方向へ広げた。2010年代後半から2020年代初頭にかけて、この様式はもはや代替ではなく主流になり、SZAの『Ctrl』(2017)やThe Weekndのスタジアム公演（2022年）が示すとおり商業的にも頂点に達した。そのため呼び名自体が実態と合わなくなり、代替という語の意味が失われたという批判も繰り返し提起されている。一方で、黒人音楽の歴史を軽視した安易な名づけだという指摘もあり、名称をめぐる論争は決着していない。</p>
<h2>代表曲</h2><ul><li>Wicked Games (The Weeknd)</li><li>Broken Clocks (SZA)</li><li>Good Days (SZA)</li><li>House of Balloons (The Weeknd)</li><li>Cranes in the Sky (Solange)</li><li>Two Weeks (FKA twigs)</li><li>Losing You (Solange)</li><li>Spotless Mind (Jhené Aiko)</li><li>Self Control (Frank Ocean)</li><li>Special Affair (The Internet)</li><li>Come Over (The Internet)</li><li>Unravel Me (Sabrina Claudio)</li><li>Waiting Game (BANKS)</li><li>Heartbreak Anniversary (Giveon)</li><li>Pink + White (Frank Ocean)</li><li>Thinking Bout You (Frank Ocean)</li><li>The Hills (The Weeknd)</li></ul>
