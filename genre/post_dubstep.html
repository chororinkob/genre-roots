<h1>Post-Dubstep（ポストダブステップ）とは</h1>
<p>ポスト・ダブステップは、ダブステップの土台を出発点にした音楽だ。ドロップで一気に解放するという約束事を捨て、室内で聴くための、暗く沈んだ、内面を見つめる音楽へ作り替えた系統である。 和音は、ソウルやR&amp;Bのコード進行を借りた甘さを</p>
<p>ポスト・ダブステップは、ダブステップの土台を出発点にした音楽だ。ドロップで一気に解放するという約束事を捨て、室内で聴くための、暗く沈んだ、内面を見つめる音楽へ作り替えた系統である。

和音は、ソウルやR&amp;Bのコード進行を借りた甘さを含む。そこに残響と欠落が加わることで、懐かしさと喪失感が生まれる。

BPMは130前後だ。ただしリズムは固定されず、四つ打ちに近づける曲もあれば、逆に拍を曖昧にぼかす曲もある。共通するのは、ミニマルでスカスカな音場、崩れたドラムパターン、ソウルフルな歌だ。ベースは抑制的だが、サブベースは保たれる作品が多い。

いちばんの主題は、音の手ざわりである。針音や雨音はBurial、環境録音はMount Kimbieというように、個々の作家がそれぞれの手法で混ぜている。

歌は、R&amp;Bのボーカルのサンプルや、本人の歌声を加工する作家が多い。

全体としては、ダンスフロアより頭(聴取)に訴える傾向が強い作品が多い。</p>
<h2>成り立ち</h2><p>2000年代末のイギリスで、ダブステップは米国経由の攻撃的な路線へ傾いていった。その一方で、反対の方向へ深く沈んでいった作家たちがいた。音楽ジャーナリズムが、彼らをまとめて呼ぶために使い始めたとされるのが、この呼び名である。

先駆け・影響源として広く挙げられるのが、ロンドンのBurial（William Bevan）だ。2006年のアルバムBurialと、2007年のUntrueで、彼はダブステップのリズムの組み立ての上に、切り刻んだR&amp;Bの歌声、レコードのノイズ、深夜のロンドンの環境音を重ねた。こうしてダブステップの枠内で夜の都市の情景を描き、後続に影響を与えた。Untrueはマーキュリー賞にノミネートされた。長く匿名だった本人の正体を巡る報道も重なり、作品はシーンの外側にまで届いたとされる。

同じころ、ロンドンのJames Blakeが、2010年前後にCMYK、KlavierwerkeといったEPを出した。そこではR&amp;Bのサンプルとボコーダー(CMYK)、ピアノ中心(Klavierwerke)の音を示した。さらに2011年のアルバムJames Blakeで、この音をメジャーの世界へ橋渡しした。ロンドンのMount Kimbie（Dominic MakerとKai Campos）は、2010年のCrooks &amp; Loversで、生楽器の録音と細かな編集を組み合わせた手触りの音を打ち出した。

レーベルでは、ロンドンのHyperdubが中心だった。Steve Goodman（DJ名Kode9）が2004年に設立したこのレーベルは、Burialのほか、Zomby、Ikonika、Cooly Gらを送り出した。ほかにR&amp;S Records、Hessle Audio、Hotflush Recordingsが、重要な受け皿となった。

「ポスト・ダブステップ」という語は、2009年ごろに造られた語だ。Mount Kimbieがしばしば起源と関連づけられるが、造語者は特定されていない。James Blakeが、その「顔」とされる。しかしMount Kimbie自身は、名前そのものには「quite indifferent(かなり無関心)」と述べた。Blakeも、自分のデビュー作をダブステップ作品ではないと位置づけた。

この流れは、2013年ごろまでに一段落した。それでも、この一群が示した「歌声を素材として加工する」「低音を静けさの中に置く」という手法は、のちに2010年代のUKベースやオルタナティヴR&amp;Bなどに、おおむね吸収された。</p>
