<h1>Post-Dubstep（ポストダブステップ）とは</h1>
<p>ダブステップの骨格を出発点にしながら、ドロップで解放するという約束事を捨て、室内で聴くための陰鬱で内省的な音楽へ組み替えた系統。BPMは130〜140前後だが、四つ打ちに近づけたり、逆に拍を曖昧にぼかしたりと固定されず、キックが1</p>
<p>ダブステップの骨格を出発点にしながら、ドロップで解放するという約束事を捨て、室内で聴くための陰鬱で内省的な音楽へ組み替えた系統。BPMは130〜140前後だが、四つ打ちに近づけたり、逆に拍を曖昧にぼかしたりと固定されず、キックが1小節に2回しか鳴らないハーフタイムの隙間を活かす点だけが共通する。音の質感が最大の主題で、レコードの針音、テープのヒスノイズ、劣化したMP3の歪み、雨や車内の環境録音などが意図的に混ぜられ、音楽全体が古い記憶の再生のように濁って聴こえる。歌は女性ボーカルの断片をピッチシフトで男女の別が分からなくなるまで加工したものが多く、意味の取れない語が繰り返される。ベースは唸らず、和音として長く伸びるか、あるいはほとんど鳴らない。和声はソウルやR&amp;Bのコード進行を借りた甘さを含み、そこに残響と欠落が加わることで郷愁と喪失感が生じる。クラブで踊るためではなく、深夜のヘッドフォンや帰り道の電車で聴かれることを前提に構成されており、ダブステップの「体で感じる低音」を「頭の中で反響する低音」へ置き換えた点が決定的な違いである。</p>
<h2>成り立ち</h2><p>2000年代末のイギリスで、ダブステップが米国経由の攻撃的な路線へ傾く一方、その反対方向へ深く沈んでいった作家たちの総称として音楽ジャーナリズムが用い始めた呼称である。定義の起点となったのはロンドンのBurial（William Bevan）で、2006年のアルバムBurial、2007年のUntrue において、ダブステップのリズム構造の上に、切り刻んだR&amp;Bの歌声、レコードのノイズ、深夜のロンドンの環境音を重ね、踊るための音楽から夜の都市を描く音楽へ転換させた。Untrue はマーキュリー賞にノミネートされ、匿名を貫いた本人の正体を巡る報道も相まって、シーンの外側にまで届いた。並行して、ロンドンのJames Blake が2010年前後にCMYK、Klavierwerke といったEPで、歌声を極端に加工しつつピアノとゴスペル的な和声を持ち込み、2011年のアルバムJames Blake でメジャーの領域へ橋渡しした。マンチェスターのMount Kimbie（Dominic MakerとKai Campos）は2010年のCrooks &amp; Lovers で、生楽器の録音と細かな編集を組み合わせた手触りの音を提示した。レーベルではロンドンのHyperdub（Steve Goodman、DJ名Kode9 が2004年に設立）が中心で、Burial のほかZomby、Ikonika、Cooly G らを送り出した。ほかにR&amp;S Records、Hessle Audio、Hotflush Recordings が重要な受け皿となった。「ポスト・ダブステップ」という語自体は当事者にほぼ受け入れられず、Blake もBurial も自らをそう呼ばなかったため、批評家の造語という性格が最後まで残った。それでもこの一群が示した「歌声を素材として加工する」「低音を静けさの中に置く」という手法は、2010年代のオルタナティヴR&amp;B、インディー・ポップ、さらにはメインストリームのポップ制作にまで広く吸収され、実質的にディケイド全体の音の設計思想を変えた。</p>
<h2>代表曲</h2><ul><li>Limit to Your Love (James Blake)</li><li>Crooks &amp; Lovers (Mount Kimbie)</li><li>Untrue (Burial)</li><li>Wildfire (SBTRKT)</li><li>Natalia's Song (Zomby)</li></ul>
