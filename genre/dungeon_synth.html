<h1>Dungeon Synth（ダンジョンシンセ）とは</h1>
<p>中世の地下迷宮や古い城を思わせる情景を、安価な電子音だけで描く様式である。使われる音色は意図的に貧弱で、1980年代から90年代の廉価な合成器や、初期のパソコン用音源を模したものが選ばれる。管弦楽やパイプオルガン、笛、鐘、合唱を模</p>
<p>中世の地下迷宮や古い城を思わせる情景を、安価な電子音だけで描く様式である。使われる音色は意図的に貧弱で、1980年代から90年代の廉価な合成器や、初期のパソコン用音源を模したものが選ばれる。管弦楽やパイプオルガン、笛、鐘、合唱を模した音が中心だが、本物らしく聞こえることは目指されない。むしろ、明らかに偽物と分かる質感そのものが表現の核心をなす。録音はこもった音質で、意図的に音の輪郭をぼかす処理が施される。テンポは遅く、打楽器はほとんど用いられないか、用いられても遠くで鳴る太鼓程度に抑えられる。旋律は短く単純な音型を延々と反復する形が基本で、和音の変化も最小限に留められる。使われる音階には中世を思わせる旋法が選ばれ、長調短調の枠から外れた響きが好まれる。曲は数分から十数分に及び、展開をほとんど設けずに同じ情景を保ち続ける。歌はほぼ用いられない。作品の見せ方も様式の一部で、装丁には手描きの城や森、剣と魔法の物語の挿絵風の図像が用いられ、曲名には架空の地名や王国の名が並ぶ。孤独な環境で一人で聴くことを前提とした、極めて内向きな音楽である。</p>
<h2>成り立ち</h2><p>起源は1990年代前半のノルウェーのブラックメタルの周辺である。当時この領域は極めて暴力的で、放火や殺人を含む事件が続いていた。その渦中にいたのがヴァルグ・ヴィーケネスで、彼はバーズムの名で活動していた。1993年に彼はメイヘムのユーロニモスを殺害して有罪となり、服役する。刑務所では電気楽器の使用が認められなかったため、彼は許可された合成器だけで作品を制作した。こうして1996年から97年にかけて発表された二作が、この様式の直接の起点とされる。ギターを一切使わず、単純な電子音の反復だけで中世的な情景を描くという形式が、ここで確立された。同時期には、ノルウェーのモルタイン、ハンガリーのデプレッシヴ・サイレンス、そしてフランスのモートワなど、同種の実践が各国で並行して進んでいた。いずれもブラックメタルの周辺にいた人物である。ただし当時この音楽に統一的な名前はなく、単に暗い環境音楽として扱われていた。ダンジョン・シンセという呼称が定着するのは2010年代である。インターネット上の音楽共有の場で、この種の古い録音が再発見され、聴き手の側から名前が与えられた。すなわち、様式が成立してから20年近く経って、後世の聴き手が命名したという珍しい経緯を持つ。この再発見を境に、当時を知らない若い制作者が大量に参入した。2010年代後半には、卓上ゲームや古い電子遊戯への郷愁と結びつき、独自の共同体が形成される。装丁は手描きで、作品は音楽配信の個人ページで無料に近い価格で配布されるのが通例となった。かつて刑務所という極限の制約から生まれた形式が、現在では自室で一人静かに作られる音楽として広く受け継がれている。</p>
