<h1>Dungeon Synth（ダンジョンシンセ）とは</h1>
<p>ダンジョン・シンセは、中世の地下迷宮や古い城を思わせる情景を、安価な電子音だけで描く音楽だ。 使われる音色は、わざと貧弱にしてある。管弦楽やパイプオルガン、笛、鐘、合唱をまねた音が中心だ。録音はこもった音質で、音の輪郭をわざとぼか</p>
<p>ダンジョン・シンセは、中世の地下迷宮や古い城を思わせる情景を、安価な電子音だけで描く音楽だ。

使われる音色は、わざと貧弱にしてある。管弦楽やパイプオルガン、笛、鐘、合唱をまねた音が中心だ。録音はこもった音質で、音の輪郭をわざとぼかす処理がかけられる。

旋律は単純な反復が多いが、展開や旋律を重視する作品もある。和音の変化も最小限に抑えられる。使われる音階には、ドリア旋法など中世風の旋法（音階の型）を用いる例も多いが、通常の長調・短調も広く使われる。

テンポは遅い。ただし、Jim Kirkwoodの『Where Shadows Lie』にはドラムマシンが入り、1992年作の『Uruk-Hai』には行進曲風の打楽器がある。

歌はほぼ使われないが、例外もある。Mortiisの『The Stargate』には女性ボーカルが入っている。

曲の長さは数分から30分近い長尺まであり、展開をほとんど設けずに同じ情景を保ち続ける作品が多い。

作品の見せ方も、このスタイルの一部だ。ジャケットには、手描きや絵画風の、城や森、剣と魔法の物語の挿絵風の絵が多く使われる。曲名には、架空の地名や王国の名が並ぶ。</p>
<h2>成り立ち</h2><p>始まりは1990年代初頭とされる。ノルウェーのブラックメタルの周辺で大きく育った音楽だ。一方で、一部のファンやライターは、英国のJim Kirkwoodの作品（1990〜91年）を最初期に挙げる。

当時のブラックメタルの世界は、ひどく暴力的だった。放火や殺人を含む事件が続いていた。その渦中にいたのがヴァルグ・ヴィーケネスで、彼はバーズムの名で活動していた。1993年、彼はメイヘムのユーロニモスを殺害し、1994年に有罪判決を受けて服役する。

獄中では、シンセサイザー以外の楽器が許されなかった。そのため彼は、シンセサイザー類のみで作品を作った。こうして作られ、1997年に発売された『Dauði Baldrs』と、1999年に発売された『Hliðskjálf』が、ブラックメタル出身者による初期の代表作とされる。

ただし、もっと早い起点の候補もある。Mortiisが初期のデモの再版で用い、のちに自分のレーベル名にした「dark dungeon music」という語や、Jim Kirkwoodの1990〜91年の作品だ。同じころ、ノルウェーのMortiis、ドイツ（ブライザッハ）のデプレッシヴ・サイレンスなど、似た試みが各国で並行して進んでいた。いずれもブラックメタルの周辺にいた人物である。

それでも当時、この音楽に共通の名前は定着していなかった（Mortiisは「dark dungeon music」という語を初期のデモの再版で用い、のちに自分のレーベル名にした）。ただの暗い環境音楽として扱われていたのだ。

ダンジョン・シンセという呼び名が定着するのは2010年代である。インターネット上の音楽共有の場で、この種の古い録音が再発見された。そして2011年3月、ファンのAndrew Werdnaがブログで命名した。つまり、スタイルが生まれてから20年近く経って、後の世代の聴き手が名前を付けたという珍しい経緯を持つ。

この再発見をきっかけに、当時を知らない若い作り手が大勢加わった。2011年のブログ開始のあとに仲間の輪が生まれ、2013年にはsubredditができた。2018年に小規模な集まりが始まり、2019年に祭典となり、2020年代にはライブが広がった。ジャケットは手描きや絵画風の絵が多く、作品は音楽配信の個人ページでは無料〜投げ銭形式のものも多い。

かつては刑務所という極限の制約の中からも代表作が生まれたこの音楽が、今では自室で一人静かに作られる音楽として、広く受け継がれている。</p>
