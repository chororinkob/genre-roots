<h1>Flamenco Fusion（フラメンコフュージョン）とは</h1>
<p>フラメンコ・フュージョンは、スペインのフラメンコを、ジャズ、ロック、ラテン音楽、エレクトロニカといった他ジャンルの表現と真正面から混ぜ合わせたスタイルだ。土台になるフラメンコは、アンダルシア地方に根ざした音楽である。 中心にあるの</p>
<p>フラメンコ・フュージョンは、スペインのフラメンコを、ジャズ、ロック、ラテン音楽、エレクトロニカといった他ジャンルの表現と真正面から混ぜ合わせたスタイルだ。土台になるフラメンコは、アンダルシア地方に根ざした音楽である。

中心にあるのは、フラメンコが本来持つ情熱的なギター奏法だ。指を1本ずつ素早く続けてかき鳴らす「ラスゲアード」がある。驚くほどの速さで単音を続けて弾く「ピカード」もある。こうしたフラメンコギター特有の、驚くほど高い技術はそのまま保たれる。

リズムでは、複雑なリズムを刻む手拍子(パルマス)も保たれる。そのうえで、現代的な音づくりや、異なる文化の楽器・和音を取り入れる。

歌は、内側から絞り出すような激しい歌(カンテ)である。

伝統への深い敬意と、ジャンルの枠を軽やかにまたぐ開かれた姿勢が、同じ音楽の中に同居している。

フラメンコには本来、ブレリアス、ソレア、セギリージャといった「パロ(様式)」と呼ばれる細かな型がある。多くの型は、それぞれ決まった拍(コンパス)のパターンと、歌詞の情感を持つ(グラナイーナやマラゲーニャなど、拍節のない自由リズムのものもある)。フュージョン系のアーティストには、こうした型を保ったまま異文化の楽器や和声を持ち込む人もいれば、型そのものを大胆に崩す人もいる。型との距離の取り方の違いにも、アーティストごとの個性が表れる。</p>
<h2>成り立ち</h2><p>1970年代後半、スペインのギタリストPaco de Lucíaが、フラメンコを世界の音楽シーンへと開いていった。きっかけは、ジャズギタリストのAl Di MeolaやJohn McLaughlinとの共演である。

3人によるライブ盤『Friday Night in San Francisco』は、1981年発売(録音は1980年12月)だ。アコースティックギターのライブ盤として最も影響力のある一枚と広く評価され、ベストセラーにもなった。

ただ、Paco de Lucíaとジャズの縁は、それより前から始まっていた。サックス奏者Pedro Iturraldeが主導したジャズ・フラメンコの録音に、若くして参加していたのだ。のちに彼は、自身の作曲でもジャズとの融合を進めた。

一方、歌の側からも大きな変化が起きる。フラメンコの歌い手Camarón de la Islaは、1979年に『La Leyenda del Tiempo』を発表した。ギタリストのTomatitoやRaimundo Amadorらが参加したアルバムである。Moogなどの電子キーボード、エレキベース、ドラムを大胆に取り入れ、伝統的なフラメンコのスタイルに大きな新しさをもたらしたとされる。

1980年代のスペインでは、「ヌエボ・フラメンコ(新フラメンコ)」の流れが生まれた。その流れを代表する世代のバンドの一つがKetamaだ。フラメンコに、ルンバやポップス、サルサ、アフリカ音楽などの要素を混ぜ合わせた。

融合の相手は、その後も広がっていく。歌手Diego El Cigalaは、キューバの巨匠ピアニストBebo Valdésと共演し、2003年にアルバム『Lágrimas Negras』を出した。キューバ音楽(ボレロなど)とフラメンコの歌唱を融合させた名盤として、高く評価されている。バルセロナのバンドOjos de Brujoは、フラメンコにヒップホップやダブ、ルンバ・カタラーナの要素まで持ち込んだ。フュージョンの可能性を、さらに広く示した存在である。

スペインの外からも担い手が現れた。メキシコ出身のデュオRodrigo y Gabrielaは、フラメンコの奏法をロックのエネルギーと融合させ、国際的な成功を収めた。

そして2018年、スペインのRosalíaがアルバム『El Mal Querer』を発表する。フラメンコの伝統的な語法に、ポップ、R&amp;B、レゲトン、トラップ・ポップ、実験的ポップなどの都会的な音を大胆に融合させた作品だ。彼女はこれで、世界的なスターの座へと駆け上がった。ただ、伝統を重んじるフラメンコ愛好家からは、賛成と反対の両方の声が上がる存在でもある。</p>
