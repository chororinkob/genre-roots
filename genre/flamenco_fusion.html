<h1>Flamenco Fusion（フラメンコフュージョン）とは</h1>
<p>アンダルシア地方に根ざすスペインのフラメンコが本来持つ情熱的なギター奏法と、内側から絞り出すような激しい歌唱(カンテ)を、ジャズ、ロック、ラテン音楽、エレクトロニカといった他ジャンルの語法と正面から融合させたスタイル。全ての指で弦</p>
<p>アンダルシア地方に根ざすスペインのフラメンコが本来持つ情熱的なギター奏法と、内側から絞り出すような激しい歌唱(カンテ)を、ジャズ、ロック、ラテン音楽、エレクトロニカといった他ジャンルの語法と正面から融合させたスタイル。全ての指で弦を一気にかき鳴らす「ラスゲアード」、驚くほどの速さで単音を連続して弾く「ピカード」といったフラメンコギター特有の超絶技巧、複雑なリズムを刻む手拍子(パルマス)は保持しつつ、そこにモダンなプロダクションや異文化の楽器・和声を導入する。伝統への深い敬意と、ジャンルを軽やかに越境する開放性が同居するスタイルである。フラメンコには本来、ブレリアス、ソレア、セギリージャといった「パロ(様式)」と呼ばれる細かな型があり、それぞれ固有のリズムパターンと歌詞の情感を持つ。フュージョン系のアーティストは、こうした型を保ちながら異文化の楽器や和声を持ち込む場合もあれば、型そのものを大胆に解体する場合もあり、その距離の取り方の違いにもアーティストごとの個性が表れる。</p>
<h2>成り立ち</h2><p>1970年代、スペインのギタリストPaco de Lucíaが、ジャズギタリストのAl Di MeolaやJohn McLaughlinとの共演を通じて、フラメンコを世界の音楽シーンへと開いていった。3人によるライブ盤『Friday Night in San Francisco』(1981)は、アコースティックギターの超絶技巧が炸裂する記録として伝説的な評価を得ている。Paco de Lucíaは、それ以前からサックス奏者のPedro Iturraldeらと共演し、フラメンコとジャズの融合をいち早く試みていた先駆者でもある。フラメンコの歌い手Camarón de la IslaとギタリストのTomatitoによる『La Leyenda del Tiempo』(1979)は、エレキベースやシンセサイザーを大胆に導入し、伝統的なフラメンコの様式に大きな革新をもたらしたアルバムとされる。メキシコ出身のデュオRodrigo y Gabrielaは、フラメンコの奏法をロックのエネルギーと融合させ国際的な成功を収めた。スペインのRosalíaは、アルバム『El Mal Querer』(2018)でフラメンコの伝統的な語法とエレクトロニカ、トラップ的なビートを大胆に融合させ、世界的なスターダムへと駆け上がったが、伝統を重んじるフラメンコ愛好家からは賛否両論を呼ぶ存在でもある。1980年代のスペインでは、バンドKetamaがフラメンコにルンバやポップスの要素を持ち込む「ヌエボ・フラメンコ(新フラメンコ)」の潮流を切り開いた。歌手Diego El Cigalaがキューバの巨匠ピアニストBebo Valdésと共演したアルバム『Lágrimas Negras』(2003)は、フラメンコとキューバのボレロを融合させた名盤として高く評価されている。バルセロナのバンドOjos de Brujoは、フラメンコにヒップホップやレゲエの要素まで持ち込み、さらに幅広いフュージョンの可能性を示した。</p>
