<h1>Raggacore（ラガコア）とは</h1>
<p>ジャマイカのダンスホール・レゲエの語りと、ブレイクコアの高速で断片化されたリズムを組み合わせた様式である。土台となるのはアーメン・ブレイクと呼ばれる有名なドラムの断片で、これを一分間に170から200拍程度の速さで再生し、さらに細</p>
<p>ジャマイカのダンスホール・レゲエの語りと、ブレイクコアの高速で断片化されたリズムを組み合わせた様式である。土台となるのはアーメン・ブレイクと呼ばれる有名なドラムの断片で、これを一分間に170から200拍程度の速さで再生し、さらに細かく切り刻んで並べ替える。元の演奏の形が判別できなくなるまで分解される一方、拍の骨格は保たれているため踊ることは可能という、際どい均衡の上に成り立っている。低音はレゲエ由来の太く短い音型が使われ、これが混沌としたドラムに対する重しとして機能する。この様式を決定づけているのが声の扱いで、ジャマイカのダンスホールで用いられる速い語り、いわゆるトースティングやディージェイングの録音が大量に引用される。元の曲から声だけを抜き出して別の伴奏に乗せることもあれば、専用に録音した語りを乗せることもある。歌詞の内容は挑発、自慢、性的な内容、暴力の描写といったダンスホールの語彙をそのまま持ち込んでいる。音質は意図的に劣化させることが多く、圧縮によって割れた質感や、古い録音の粗さがそのまま残される。全体として、極度に速く騒がしい音の中に、明確に踊れる拍と親しみやすい声が同居している点が特徴である。</p>
<h2>成り立ち</h2><p>二つの流れの合流点にある。一方は1990年代にヨーロッパで発展したブレイクコアで、ドラムの断片を極限まで切り刻む手法を確立していた。もう一方は、英国におけるジャマイカ移民の音楽文化である。ロンドンやブリストルには1960年代からジャマイカ由来の音響システムの文化が根づいており、レゲエやダンスホールの語りは英国の電子音楽にとって身近な素材だった。実際、ジャングルやドラムンベースの成立にもこの回路が働いている。両者を明確に結びつけたのは2000年前後で、英国のシャイテック・プロダクションズを主宰したアーロン・スパイクリーが中心的な役割を果たした。彼はブレイクコアの手法にダンスホールの声を大量に導入し、この組み合わせに名前を与えた。同じ時期にドイツのボング=ラが同種の実践を進め、彼はこの様式の最も知られた担い手となる。制作の現場は極めて小規模で、自主制作の盤とインターネット上の配布が主要な流通経路だった。ヨーロッパ各地に散らばった制作者たちが、掲示板やファイル共有を通じて互いの作品を聴き合うという形で共同体が成立していた。2000年代半ばには、ブレイクコア全体の盛り上がりとともに欧州各地の小さな催しで盛んに演奏され、日本を含むアジア圏にも波及した。一方でこの様式は、素材の扱い方をめぐる批判を受け続けてきた。白人が多数を占める欧州の制作者が、ジャマイカ音楽の声だけを切り取って背景として使うことへの疑問である。声の主に許諾も報酬もないまま素材化されている例が多く、文化の取り扱いをめぐる議論の題材として繰り返し取り上げられてきた。とりわけ歌詞の内容が暴力的あるいは差別的な場合、それを文脈から切り離して面白がることの是非が問われた。2010年代以降は独立した様式としての活動は縮小したが、ここで確立された高速のリズムに語りを乗せるという配置は、後のジャングル・テラーやトロピカル・ベースといった領域に受け継がれている。</p>
