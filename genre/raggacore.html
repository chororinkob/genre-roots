<h1>Raggacore（ラガコア）とは</h1>
<p>ラガコアは、ジャマイカのダンスホール・レゲエの語りと、ブレイクコアの高速で細切れのリズムを組み合わせたスタイルだ。 ドラムは、アーメン・ブレイクと呼ばれる有名なドラムの断片の加工が中心になりやすい。これを、おおむね180〜220 </p>
<p>ラガコアは、ジャマイカのダンスホール・レゲエの語りと、ブレイクコアの高速で細切れのリズムを組み合わせたスタイルだ。

ドラムは、アーメン・ブレイクと呼ばれる有名なドラムの断片の加工が中心になりやすい。これを、おおむね180〜220 BPM前後(説により異なる)の速さで再生し、さらに細かく切り刻んで並べ替える。元の演奏の形が分からなくなるまで分解されるが、拍の骨組みは保たれている。そのため踊ることもできるという、際どいバランスの上に成り立っている。

低音には、ダブ／レゲエ由来の重低音（サブベース）が使われる。これが、混沌としたドラムを押さえる重しの役目を果たす。

このスタイルを決定づけているのは、声の扱いだ。ジャマイカのダンスホールで用いられる、いわゆるトースティング（リズムに乗せて語ること）やディージェイングの録音が、大量に引用される。元の曲から声だけを抜き出して別の伴奏に乗せることもあれば、専用に録音した語りを乗せることもある。歌詞には、挑発、自慢、性的な内容、暴力の描写といったダンスホールの言葉づかいが持ち込まれることもあるとされる。

音は歪んだ音質のものが多い。全体として、極端に速く騒がしい音の中に、はっきり踊れる拍と親しみやすい声が同居している点が特徴である。</p>
<h2>成り立ち</h2><p>ラガコアは、ラガ・ジャングル(英国で1990年代に発展)から枝分かれしたスタイルで、二つの流れが合流する所にある。

一方は、1990年代に欧州を中心に発展したブレイクコアだ。ドラムの断片を極限まで切り刻む手法を固めていた。

もう一方は、英国に暮らすジャマイカ移民の音楽文化である。1955年、Duke Vinがロンドンで英国初のジャマイカ式サウンドシステムを組み立てた。それ以来、英国にはその文化が根づいた。レゲエやダンスホールの語りは、英国の電子音楽にとって身近な素材だった。実際、ジャングルやドラムンベースが生まれた時にも、この道筋が働いている。

起源には諸説ある。ラガ・ジャングルの制作者Remarcに遡れるとする見方のほか、ボング=ラや、DJ Scud、Istariらを初期の担い手とする見方もある。2000年前後（〜2001年）には、DJ ScudやI-Sound、Rich KidといったAmbush系のレーベルの作り手が、ダンスホールやサウンドクラッシュのサンプリングを取り入れた。ラガコアは、1990年代後半〜2000年代初頭（説により異なる）に独立したスタイルになった。ブレイクコアより前からあったとする説もある。

代表的な担い手として、米国のAaron Spectreと、オランダのボング=ラ(1998年のアルバム『New Millennium Dreadz』で出発した)が挙げられる。制作の現場はとても小さく、小規模な独立レーベルのレコードやCDと、インターネット上の配布が、主な流通の道だった。欧州と米国などに散らばった制作者たちが、掲示板やファイル共有で互いの作品を聴き合い、そうして共同体ができていた。日本のMurder Channelなど、一部のレーベルも関連作を出した。

一方で、ジャマイカ音楽の声だけを切り取って素材にすることには、議論がありうる。

2010年代以降も、専業の制作者は多くないが、一定の支持を保っている。</p>
