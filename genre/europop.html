<h1>Europop（ユーロポップ）とは</h1>
<p>ヨーロッパ大陸で作られる、国境を越えて売ることを前提とした大衆音楽である。最大の特徴は設計思想にあり、英語圏以外の作り手が英語で歌い、しかも英語を母語としない聴き手にも理解できるよう、語彙と構文が意図的に単純化される。この、誰の母</p>
<p>ヨーロッパ大陸で作られる、国境を越えて売ることを前提とした大衆音楽である。最大の特徴は設計思想にあり、英語圏以外の作り手が英語で歌い、しかも英語を母語としない聴き手にも理解できるよう、語彙と構文が意図的に単純化される。この、誰の母語でもない英語で歌われるという条件が、独特の平明さと、時に奇妙な語感を生む。音楽的には明快さが徹底される。旋律は音域が狭く跳躍が少なく、和声は四つの和音の循環が中心で、複雑な進行は避けられる。リズムは四つ打ちのキックが基本で、テンポは概ね120から140 BPM。編曲にはシンセサイザーによる分厚い和音、鋭い電子音、そして打ち込みのドラムが用いられる。構成上の定型として、最後の繰り返し部分の直前で半音または全音上へ転調し、感情を押し上げる手法がほぼ必ず用いられる。歌唱は複数の声を重ね、しばしば男女の掛け合いが配置される。歌詞は恋愛と踊りの高揚を扱い、政治や社会への言及は徹底して排除される。全ては、言語も文化も異なる複数の国で同時に受け入れられるための最適化である。</p>
<h2>成り立ち</h2><p>この分野を制度として支えたのが、1956年に始まった欧州の歌謡祭典である。この催しは、第二次世界大戦で荒廃したヨーロッパを、当時新しい技術だったテレビの同時放送によって結びつけるという政治的な目的から生まれた。各国が代表を送り、互いに投票するというこの形式は、必然的に、自国以外の視聴者にも通じる普遍的な楽曲を要求する。転機は1974年である。スウェーデンのABBAがこの祭典で優勝し、その後世界的な成功を収めたことで、英語圏以外の国からでも国際市場を制することが可能だと証明された。彼らの楽曲を書いたBenny AnderssonとBjörn Ulvaeusは、複雑な和声と精緻な編曲を、極めて単純な外見の中に隠すという技術を持っていた。ドイツではFrank Farianが、Boney M.のような企画を通じて、演者と実際の歌唱を分離する制作方式を推し進める。この方式は1990年、Milli Vanilliにおいて演者が実際には歌っていなかったことが露見し、大きな醜聞となった。1990年代前半にはユーロダンスと呼ばれる潮流が生まれ、女性の歌唱と男性のラップを組み合わせる定型が、ヨーロッパ全域で量産される。最も大きな帰結はスウェーデンから訪れた。ストックホルムの録音所を拠点としたDenniz PoPと、その弟子であるMax Martinが、1990年代後半からアメリカの歌手のために楽曲を書き始め、以後四半世紀にわたって世界のポップスの旋律と構造を支配するに至ったのである。かつて周縁とされたヨーロッパ大陸の作曲技術が、英語圏の音楽の中枢を占めるという逆転が起きた。この分野は使い捨ての音楽として長く軽んじられてきたが、その作曲技術の水準は現在では正当に評価されている。</p>
<h2>代表曲</h2><ul><li>Dancing Queen (ABBA)</li><li>Waterloo (ABBA)</li><li>The Sign (Ace of Base)</li></ul>
