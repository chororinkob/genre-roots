<h1>Europop（ユーロポップ）とは</h1>
<p>ユーロポップは、ヨーロッパ大陸で作られる大衆音楽だ。国境を越えて売ることを前提にしている。 特徴の一つは設計思想にある。歌は英語が多い。しかも、その言葉を母語としない聴き手にも分かるよう、単語と文の組み立てをわざと単純にする。誰の</p>
<p>ユーロポップは、ヨーロッパ大陸で作られる大衆音楽だ。国境を越えて売ることを前提にしている。

特徴の一つは設計思想にある。歌は英語が多い。しかも、その言葉を母語としない聴き手にも分かるよう、単語と文の組み立てをわざと単純にする。誰の母語でもない言葉で歌われるという条件が、独特の分かりやすさと、時に奇妙な語感を生む。

音楽の面では、明快さが徹底される。編曲には、シンセサイザーによる分厚い和音や鋭い電子音が使われる。1980〜90年代のダンス系では、打ち込みのドラムが中心である。単純でキャッチーな旋律、繰り返されるコーラス、軽い歌詞、洗練されたプロダクションが特徴だ。

ユーロダンス系では、リズムは四つ打ちのキックが基本だ。テンポはおおむね120から140 BPM（1分間の拍数）である。

歌は複数の声を重ねる。ユーロダンス系では、男女の掛け合いを置くこともしばしばある。歌詞は恋愛や踊りの高揚を扱うものが多い。一方で、歴史や宗教、政治的な題材を扱う例もある。

曲の組み立てでは、最後の繰り返し部分の直前で、半音または全音上へ転調（調を変えること）し、感情を押し上げる手法がある。この手法はポップスで広く使われ、ユーロポップにも多い。ユーロポップには、国境を越えて受け入れられやすい工夫が多い。</p>
<h2>成り立ち</h2><p>1956年、欧州の放送局の連合が、スイスのルガーノで歌謡祭典を始めた。テレビの生放送と国際中継の実験としてだった。この分野と関わりが深いのが、この催しである。

各国が代表を送り、互いに投票する形式だった。初期には、自国語で出場するのが当然とされた。その後は、英語が増える時期と減る時期があった。

転機は1974年だ。スウェーデンのABBAがこの祭典で優勝し、その後、世界的な成功を収めた。英語圏以外の国からの国際的な成功には、1958年のイタリア語の曲「Volare」のような先例がある。しかしABBAは、それを長く続く規模で実現した、1970年代の欧州ポップでは例外的な存在だった。作曲はBenny AnderssonとBjörn Ulvaeusで、初期の歌詞はマネージャーのStig Andersonが共作した。

ドイツでは、Frank Farianが、Boney M.のような企画を通じて、演者と実際の歌い手を分ける制作のやり方を推し進めた。このやり方のもとで、Milli Vanilliの演者が実際には歌っていなかったことが露見した。1989年のライブ事故に始まり、1990年11月に制作者が認めたことによる。これは大きなスキャンダル（不祥事）となった。

一方、1980年代後半に生まれたユーロダンスと呼ばれる流れは、1990年代前半に黄金期を迎えた。女性の歌と男性のラップを組み合わせる型が、ヨーロッパ全域で量産された。

最も大きな結果は、スウェーデンから訪れた。ストックホルムの録音所を拠点としたDenniz PoPと、その弟子のMax Martinである。1995年、ZombaによるCheironの起用で、彼らはBackstreet Boysのデビュー作（1996年欧州発売）を手がけた。米国での成功は1997年以降で、世界のポップスに大きな影響を与えるに至った。スウェーデン系の作曲チームが、米英のヒット曲に大きな役割を果たしたのである。</p>
<h2>代表曲</h2><ul><li>Dancing Queen (ABBA)</li><li>Cheri Cheri Lady (Modern Talking)</li><li>You're My Heart, You're My Soul (Modern Talking)</li><li>Gimme! Gimme! Gimme! (ABBA)</li><li>Dragostea Din Tei (O-Zone)</li><li>The Sign (Ace of Base)</li><li>SOS (ABBA)</li><li>Waterloo (ABBA)</li><li>Take a Chance on Me (ABBA)</li><li>All That She Wants (Ace of Base)</li><li>Sunchyme (Dario G)</li><li>Happy Nation (Ace of Base)</li></ul>
