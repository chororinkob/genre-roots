<h1>Europop（ユーロポップ）とは</h1>
<p>ヨーロッパ大陸で作られる、国境を越えて売ることを前提とした大衆音楽である。最大の特徴は設計思想にあり、英語圏以外の作り手が、多くは英語で歌い、しかも母語としない聴き手にも理解できるよう、単語と文の組み立てが意図的に単純にされる。こ</p>
<p>ヨーロッパ大陸で作られる、国境を越えて売ることを前提とした大衆音楽である。最大の特徴は設計思想にあり、英語圏以外の作り手が、多くは英語で歌い、しかも母語としない聴き手にも理解できるよう、単語と文の組み立てが意図的に単純にされる。この、誰の母語でもない言語で歌われるという条件が、独特の平明さと、時に奇妙な語感を生む。音楽的には明快さが徹底される。旋律は音域が狭く跳躍が少なく、和声（コードの響き）は四つの和音の循環が中心で、複雑な進行は避けられる。リズムは四つ打ちのキックが基本で、テンポは概ね120から140 BPM（1分間の拍数）。編曲にはシンセサイザーによる分厚い和音、鋭い電子音、そして打ち込みのドラムが用いられる。構成上の定型として、最後の繰り返し部分の直前で半音または全音上へ転調（調を変えること）し、感情を押し上げる手法がよく用いられる。歌唱は複数の声を重ね、しばしば男女の掛け合いが配置される。歌詞は恋愛と踊りの高揚を扱うものが多いが、歴史や宗教、政治的な題材を扱う例もある。全ては、言語も文化も異なる複数の国で同時に受け入れられるための工夫である。</p>
<h2>成り立ち</h2><p>この分野と関わりの深いのが、1956年に始まった欧州の歌謡祭典である。この催しは、欧州の放送局の連合が、テレビの生放送と国際中継の実験として、スイスのルガーノで始めたものだった。各国が代表を送り、互いに投票するというこの形式では、初期には自国語での出場が当然とされたが、時代とともに、自国以外の視聴者にも通じる誰にでも通じる歌詞が好まれる傾向が強まった。転機は1974年である。スウェーデンのABBAがこの祭典で優勝し、その後世界的な成功を収めた。英語圏以外の国からの国際的な成功には、1958年のイタリア語の曲「Volare」のように先例があるが、ABBAはそれを持続的な規模で実現した例外的な存在だった。彼らの楽曲を書いたのはBenny AnderssonとBjörn Ulvaeusである。ドイツではFrank Farianが、Boney M.のような企画を通じて、演者と実際の歌唱を分離する制作方式を推し進める。この方式は1990年、Milli Vanilliにおいて演者が実際には歌っていなかったことが露見し、大きなスキャンダル（不祥事）となった。1980年代後半に生まれたユーロダンスと呼ばれる潮流は、1990年代前半に黄金期を迎え、女性の歌唱と男性のラップを組み合わせる定型が、ヨーロッパ全域で量産される。最も大きな結果はスウェーデンから訪れた。ストックホルムの録音所を拠点としたDenniz PoPと、その弟子であるMax Martinが、1995年にBackstreet Boysのデビュー作に起用されてアメリカの歌手のために楽曲を書き始め、米国での大ヒットは1997年以降となり、世界のポップスに大きな影響を与えるに至ったのである。かつて中心から外れた存在とされたヨーロッパ大陸の作曲技術が、英語圏の音楽の中枢を占めるという逆転が起きた。この分野は使い捨ての音楽として長く軽んじられてきたが、その作曲技術の水準は現在では正当に評価されている。</p>
<h2>代表曲</h2><ul><li>Dancing Queen (ABBA)</li><li>Cheri Cheri Lady (Modern Talking)</li><li>You're My Heart, You're My Soul (Modern Talking)</li><li>Gimme! Gimme! Gimme! (ABBA)</li><li>Dragostea Din Tei (O-Zone)</li><li>The Sign (Ace of Base)</li><li>SOS (ABBA)</li><li>Waterloo (ABBA)</li><li>Take a Chance on Me (ABBA)</li><li>All That She Wants (Ace of Base)</li><li>Sunchyme (Dario G)</li><li>Happy Nation (Ace of Base)</li></ul>
