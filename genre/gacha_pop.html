<h1>Gacha Pop（ガチャポップ）とは</h1>
<p>一言でいうと、単一の音を指す言葉ではない。代表曲22曲を動画で聴け、ルーツと影響のつながりを地図でたどれる。</p>
<p>一言でいうと、単一の音を指す言葉ではない。アニメ主題歌のロック、ボカロ由来の高密度なポップ、ガールズバンドのギターサウンド、アイドルやVTuberのダンス曲が、同じ棚に並ぶ。日本のポップスを海外のリスナー向けに括り直した呼び名だからだ。

中心になる楽器は決まらない。ギターが前へ出る曲では、歪ませたコードと速い刻みが主役になる。ボカロ由来の曲では、初音ミクの声を細かく刻んで重ねたシンセと、音数を詰め込んだ打ち込みが土台になる。ピアノやストリングスを足して、映画音楽のような厚みを出す曲もある。

和音は明るい長調が中心で、4つのコードをぐるりと回す進行が多い。メロディは跳躍が大きく、サビで一気に高い音へ上がる。短調の曲でも3度を上げて明るく聴かせる場面が目立つ。

ドラムはスネアを2拍目と4拍目に置く8ビートが基本で、そこに16分音符の細かいハイハットを重ねる。4つ打ちのダンス曲も混ざるが、全体としては生ドラムの感触を残した曲が多い。

歌い方は裏声を混ぜた高音と、子音を立てて畳みかける早口が特徴になる。こぶしを回す演歌的な節回しはほとんど出てこない。初音ミクに代表される合成音声の歌唱も、同じ棚に並ぶ。

歌詞はアニメの世界観、SNSでの人間関係、都市の孤独、恋愛の距離感を題材にする。日本語のまま歌われ、英語に訳されないことが多い。

曲はイントロを短く取ってAメロ、Bメロ、サビへ進み、最後のサビで転調したり音を厚くしたりして盛り上げる。尺は3分前後に収まるものが多い。

J-POPと音の中身は重なる。違いは音ではなく、海外へ向けて一括りに提示する梱包の仕方にある。K-POPのように様式を固めていない点も異なる。

実際に鳴っているのは、Spotifyのプレイリスト、TikTokやYouTubeの短い切り抜き、アニメ配信の主題歌、海外のアニメイベントの会場だ。夏にはサマーソニックの幕張メッセ会場に、この名前を掲げたステージが立つ。</p>
<h2>成り立ち</h2><p>2010年代の終わりごろから、日本の曲が海外で思いがけない形で聴かれ始めた。2019年にYOASOBIが発表した「夜に駆ける」は、日本語のまま海外の再生数を伸ばした。2020年に藤井風が発表した「死ぬのがいいわ」も、国外でバイラルヒットを起こした。同じ年、1979年に発表された松原みきの「真夜中のドア〜Stay With Me」が、シティポップの再評価に乗って世界で聴き直された。

日本国内では、これらは別々の出来事だった。だが海外のリスナーから見ると、どれも「日本のポップカルチャー」というひとつの入口から入ってくる音楽だった。Spotify Japanで音楽企画を統括する芦澤紀子は、この食い違いに注目した。彼女はK-POPを引き合いに出し、韓国が国の方針として音楽を様式化して海外へ輸出したのに対し、日本にはその受け皿になる言葉がないと指摘した。

2023年5月9日、Spotifyはプレイリスト「Gacha Pop」を公開する。名前は日本で独自に発展したカプセルトイのガチャガチャから取った。何が出るか分からない楽しさを、そのまま音楽の並べ方に重ねている。タグラインには「何が出るんだろう!? ガチャを回して、カラフルな…」という言葉が添えられた。

ローンチ直後から反応は大きかった。2024年8月の1周年時点でフォロワーは約38.7万人、Spotify利用者による保存は38万件を超えた。聴き手の約8割が日本国外で、半分以上がZ世代だった。国別ではアメリカが最も多く、メキシコ、イギリス、フランス、インドネシア、台湾が続く。

一方で、この言葉がジャンルなのかという疑問は最初から付いて回った。ITmediaの取材で芦澤自身が「ガチャポップはジャンルではなく、海外にユニークで多様な日本カルチャーを紹介するプレイリストの名前」と答えている。音楽メディアには「J-POPに代わる新ジャンルになるのか」と問う論考も載った。音楽評論家の柴那典は、ボカロ以降のJ-POPを「過圧縮ポップ」と呼んできた立場から、Gacha Popという呼び名をジャンル名として適切だと評価している。

名前の取り違えも起きた。バンダイのカプセルトイブランド「ガシャポン」は公式ソング「ガシャPOP」を発表しており、表記が近い。こちらは玩具ブランドの主題歌であって、音楽の分類とは関係がない。

2026年8月14日から16日には、サマーソニックの幕張メッセ会場にSpotifyが「Gacha Pop Live」と銘打ったステージを出すことが決まった。プレイリストから始まった言葉が、野外フェスの看板にまで育ったことになる。</p>
