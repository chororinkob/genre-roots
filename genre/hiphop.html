<h1>Hip Hop（ヒップホップ）とは</h1>
<p>ドラムマシンやサンプリング（既存の録音の取り込み）、生バンドの演奏で組んだビートの上に、韻を踏んで語るラップを乗せる音楽。土台になるのは多くの場合、既存のレコードから切り出した「ブレイク」——歌が抜けて打楽器だけになる数小節——の</p>
<p>ドラムマシンやサンプリング（既存の録音の取り込み）、生バンドの演奏で組んだビートの上に、韻を踏んで語るラップを乗せる音楽。土台になるのは多くの場合、既存のレコードから切り出した「ブレイク」——歌が抜けて打楽器だけになる数小節——のループで、そこにRoland TR-808の長く伸びる低音バスドラムやE-mu SP-1200の粗い質感が重なる。ドラムは2拍目・4拍目のスネアを軸にしつつ、意図的に機械的な拍の区切りからずらして粘りを出す。テンポはブーンバップ以降は約80〜100 BPMが目安で（初期のオールドスクールにはやや速い曲もあり、トラップなどこの範囲を外れる様式もある）、首を縦に振らせる重心の低さが身上になる。ラップは旋律を持たない代わりに、韻の位置、語尾の子音、息継ぎ、拍からのずらし方で音楽性を出し、この流れ全体をフロウと呼ぶ。DJはレコードを手で前後させるスクラッチ、レコードを逆方向に回転させて音を巻き戻すバックスピンなど、ターンテーブル（レコードプレーヤー）を楽器として扱う技法を担う。曲構成は8小節または16小節のヴァース（一節）と、繰り返されるフック（耳に残る部分）の交替が定型。歌詞は出身地の描写、貧困と暴力、自慢と挑発、社会批判、純粋な言葉遊びまで幅広い。ターンテーブルとブレイクの再利用が文化の核だが、初期の録音には生バンドやドラムマシンが使われ、サンプリング中心の制作は主に1980年代半ば以降に広がった。DJ・MC・グラフィティ・ブレイクダンスの四大要素を持つ生活文化としても定義される。</p>
<h2>成り立ち</h2><p>1970年代のニューヨーク市ブロンクス（「サウス・ブロンクス」は広い呼び名として使われる）で生まれた。この地区は1948年に着工したクロス・ブロンクス・エクスプレスウェイの建設で共同体が分断され、そこへ放火（家主による保険金目当てを含む）、レッドライニング、市の予算削減など複数の要因が重なり、1970年代には失業と麻薬とギャング抗争に苦しむ場所となった。慣習的には1973年8月11日、セジウィック・アヴェニュー1520番地のアパートの集会室で、妹のCindy Campbellが新学期の服代を稼ぐために企画したパーティーで、兄でジャマイカ移民のClive Campbell——DJ Kool Herc——がDJを務めたのが起点とされる。彼は故郷のサウンドシステム（巨大な移動式の音響設備）文化を持ち込み、客が最も踊るのはファンクのレコードの打楽器だけの間奏だと気づいて、同じ盤を2枚使いその数小節だけを交互に繋いで引き伸ばす「メリーゴーラウンド」の手法を編み出した。これがブレイクビーツであり、その部分で踊る者がb-boy／b-girl、すなわちブレイクダンサーと呼ばれた。Grandmaster Flash（本名Joseph Saddler）は電子機器の修理を学んだ経験を生かして、ヘッドホンで次の盤の頭出しをするキュー技術、拍を狂わせずに断片を差し込むパンチフレージングを体系化した。スクラッチ——レコードをこすって音を出す技法——はGrand Wizzard Theodore（本名Theodore Livingston）が1975年頃に発明したとされ、Grandmaster Flashはその技法を受け継いで広め洗練させた。元ギャングの一員だったAfrika Bambaataaは1970年代に組織Universal Zulu Nationを設立し（記念日は1973年11月12日とされるが、1977年とする資料もある）、抗争のエネルギーを音楽と踊りへ振り向けた。1979年、ニュージャージーの小レーベルSugar Hill RecordsからThe Sugarhill Gangの「Rapper's Delight」が発売され、この世界の外側で作られたにもかかわらず全米のヒットチャートでトップ40に入り（Billboard Hot 100で最高36位）、ラップがレコード商品として成立することを証明する。1982年のGrandmaster Flash and the Furious Five名義の「The Message」（作者は4名のクレジットで、Ed Fletcher＝Duke Bootee、Melle Mel、Clifton「Jiggs」Chase、Sylvia Robinson。ラップはDuke BooteeとMelle Melの2人で、グループからはMelle Melだけが参加し、Grandmaster Flash本人は関与していない）は貧困と絶望を一人称で描き、ラップが娯楽以上のものになりうることを示した。同年のAfrika Bambaataa &amp; the Soulsonic Forceの「Planet Rock」はドイツのKraftwerk（「Trans-Europe Express」と「Numbers」）を引用し、電子音楽とのつながりを開く。1986年、Run-D.M.C.がAerosmithと共演した「Walk This Way」でロック市場を突破し、Def Jam Recordsを設立したRick RubinとRussell Simmonsが商業的な基盤を築いた。1988〜1990年ごろの黄金期にはPublic Enemyが黒人解放思想を、De La SoulやA Tribe Called Questが多彩なサンプリングを、Schoolly D（1985年）やIce-T（1986年）らが先行し、ロサンゼルスのN.W.A.が1989年の『Straight Outta Compton』で、警察の暴力と貧困地区の現実を描くギャングスタ・ラップを全米規模に広める。1991年のGrand Upright裁判の判決以降、無断サンプリングは訴訟の対象となり制作費が高騰し、音の作り方そのものが変わった。1990年代半ばには東海岸のThe Notorious B.I.G.と西海岸の2Pacの対立があおられ、2Pacは1996年、The Notorious B.I.G.は1997年に射殺された。それでもヒップホップは拡大を続け、2017年には、Nielsen Musicの総消費量で、R&amp;Bとあわせた「R&amp;B／ヒップホップ」が初めてロックを上回り首位になった（24.5%対20.8%。アルバム販売だけならロックが上）。</p>
