<h1>Hip Hop（ヒップホップ）とは</h1>
<p>ドラムマシンとサンプリングで組んだビートの上に、韻を踏んで語るラップを乗せる音楽。土台になるのは既存のレコードから切り出した「ブレイク」——歌が抜けて打楽器だけになる数小節——のループで、そこにRoland TR-808の長く伸び</p>
<p>ドラムマシンとサンプリングで組んだビートの上に、韻を踏んで語るラップを乗せる音楽。土台になるのは既存のレコードから切り出した「ブレイク」——歌が抜けて打楽器だけになる数小節——のループで、そこにRoland TR-808の長く伸びる低音バスドラムやE-mu SP-1200の粗い質感が重なる。ドラムは2拍目・4拍目のスネアを軸にしつつ、意図的に機械的な格子からずらして粘りを出す。テンポは80〜100BPMが基本で、首を縦に振らせる重心の低さが身上になる。ラップは旋律を持たない代わりに、韻の位置、語尾の子音、息継ぎ、拍からのずらし方で音楽性を出し、この流れ全体をフロウと呼ぶ。DJはレコードを手で前後させるスクラッチ、二枚の同じ盤を交互に使うバックスピンなど、ターンテーブルを楽器として扱う技法を担う。曲構成は8小節または16小節のヴァースと、繰り返されるフックの交替が定型。歌詞は出身地の描写、貧困と暴力、自慢と挑発、社会批判、純粋な言葉遊びまで幅広い。ロックが楽器の演奏で音を出すのに対し、ヒップホップは既存の録音物を素材として切り貼りする点で制作の原理そのものが異なる。DJ・MC・グラフィティ・ブレイクダンスの四大要素を持つ生活文化としても定義される。</p>
<h2>成り立ち</h2><p>1970年代のニューヨーク市サウス・ブロンクスで生まれた。この地区は1948年に着工したクロス・ブロンクス・エクスプレスウェイの建設で共同体が分断され、家主による保険金目当ての放火が横行し、1970年代には失業と麻薬とギャング抗争に覆われた廃墟同然の場所だった。公式には1973年8月11日、セジウィック・アヴェニュー1520番地のアパートの集会室で、ジャマイカ移民の少年Clive Campbell——DJ Kool Herc——が妹の新学期の資金を集めるために開いたパーティーが起点とされる。彼は故郷のサウンドシステム文化を持ち込み、客が最も踊るのはファンクのレコードの打楽器だけの間奏だと気づいて、同じ盤を二枚使いその数小節だけを交互に繋いで引き伸ばす「メリーゴーラウンド」の手法を編み出した。これがブレイクビーツであり、その部分で踊る者がb-boy／b-girl、すなわちブレイクダンサーと呼ばれた。Grandmaster Flash（本名Joseph Saddler）は電気工学の知識を使い、ヘッドホンで次の盤の頭出しをするキュー技術、レコードをこすって音を出すスクラッチ、拍を狂わせずに断片を差し込むパンチフレージングを体系化した。元ギャングの一員だったAfrika Bambaataaは1973年に組織Universal Zulu Nationを設立し、抗争のエネルギーを音楽と踊りへ振り向けた。1979年、ニュージャージーの小レーベルSugar Hill RecordsからThe Sugarhill Gangの「Rapper's Delight」が発売され、シーンの外側で作られたにもかかわらず全米的なヒットとなり、ラップがレコード商品として成立することを証明する。1982年のGrandmaster Flash and the Furious Five「The Message」は貧困と絶望を一人称で描き、ラップが娯楽以上のものになりうることを示した。同年のAfrika Bambaataa「Planet Rock」はドイツのKraftwerkを引用し、電子音楽との回路を開く。1986年、Run-D.M.C.がAerosmithと共演した「Walk This Way」でロック市場を突破し、Def Jam Recordsを設立したRick RubinとRussell Simmonsが商業的な基盤を築いた。1988年前後の黄金期にはPublic Enemyが黒人解放思想を、De La SoulやA Tribe Called Questが多彩なサンプリングを、ロサンゼルスのN.W.A.が警察の暴力と貧困地区の現実を描くギャングスタ・ラップを打ち出す。1991年のGrand Upright裁判の判決以降、無断サンプリングは訴訟の対象となり制作費が高騰し、音の作り方そのものが変わった。1990年代半ばには東海岸のThe Notorious B.I.G.と西海岸の2Pacの対立が煽られ、二人とも1996年と1997年に射殺されている。それでもヒップホップは拡大を続け、2017年にはアメリカで最も消費される音楽ジャンルとなった。</p>
<h2>代表曲</h2><ul><li>Rapper's Delight (The Sugarhill Gang)</li><li>The Message (Grandmaster Flash and the Furious Five)</li><li>Fight the Power (Public Enemy)</li><li>Straight Outta Compton (N.W.A.)</li><li>Planet Rock (Afrika Bambaataa)</li></ul>
