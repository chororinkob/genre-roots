<h1>Hip Hop（ヒップホップ）とは</h1>
<p>ヒップホップは、韻を踏んで語る「ラップ」を、ビートの上に乗せる音楽だ。そのビートは、ドラムマシンやサンプリング（既存の録音の取り込み）、生バンドの演奏で組まれる。 土台になるのは多くの場合、既存のレコードから切り出した「ブレイク」</p>
<p>ヒップホップは、韻を踏んで語る「ラップ」を、ビートの上に乗せる音楽だ。そのビートは、ドラムマシンやサンプリング（既存の録音の取り込み）、生バンドの演奏で組まれる。

土台になるのは多くの場合、既存のレコードから切り出した「ブレイク」のループだ。ブレイクとは、歌が抜けて打楽器だけになる数小節のことをいう。そこにRoland TR-808の長く伸びる低音バスドラムや、E-mu SP-1200の粗い質感が重なる。

DJは、ターンテーブル（レコードプレーヤー）を楽器として扱う。レコードを手で前後させるスクラッチや、レコードを逆方向に回転させて音を巻き戻すバックスピンなどの技法を担う。ターンテーブルとブレイクの再利用が文化の核だが、初期の録音には生バンド・ドラムマシンが使われた。サンプリング中心の制作は、主に1980年代半ば以降に広がった。

ラップは旋律を持たない。その代わりに、韻の位置、語尾の子音、息継ぎ、拍からのずらし方で、音楽性を出す。この流れ全体をフロウと呼ぶ。

リズムの軸は、2拍目と4拍目のスネアだ。ただし、意図的に機械的な拍の区切りからずらして、粘りを出す。テンポは、ブーンバップ以降は約80〜100BPMが目安になる。初期のオールドスクールには、やや速い曲もある。トラップなど、この範囲を外れるスタイルもある。首を縦に振らせる重心の低さが、このジャンルの持ち味だ。

歌詞は、出身地の描写、貧困と暴力、自慢と挑発、社会批判、純粋な言葉遊びまで幅広い。

曲の構成は、8小節または16小節のヴァース（一節）と、繰り返されるフック（耳に残る部分）の交替が定型だ。

DJ・MC・グラフィティ・ブレイクダンスの四大要素を持つ生活文化としても定義される。</p>
<h2>成り立ち</h2><p>ヒップホップが生まれたのは、1970年代のニューヨーク市ブロンクス（会場はMorris Heights、南西部）だ。この地区は、1948年に着工したクロス・ブロンクス・エクスプレスウェイの建設で、共同体が分断された。さらに、放火（家主による保険金目当てを含む）、レッドライニング、市の予算削減など、複数の要因が重なった。1970年代には、失業と麻薬とギャング抗争に覆われた、廃墟同然の場所だった。

慣習的には、1973年8月11日のパーティーが起点とされる。場所は、セジウィック・アヴェニュー1520番地のアパートの集会室だ。ジャマイカ移民の少年Clive Campbell——DJ Kool Herc——の妹Cindy Campbellが、新学期の服代を稼ぐために企画したパーティーで、兄のHercがDJを務めた。

彼は、故郷のサウンドシステム（巨大な移動式の音響設備）文化を持ち込んだ。客が最も踊るのは、ファンクのレコードの打楽器だけの間奏だと気づいた。そこで、同じ盤を2枚使い、その数小節だけを交互に繋いで引き伸ばす「メリーゴーラウンド」の手法を編み出した。これがブレイクビーツであり、その部分で踊る者が、b-boy／b-girl、すなわちブレイクダンサーと呼ばれた。

Grandmaster Flash（本名Joseph Saddler）は、電子機器の修理を学んだ経験を生かした。ヘッドホンで次の盤の頭出しをするキュー技術と、拍を狂わせずに断片を差し込むパンチフレージングを、体系化した。スクラッチ——レコードをこすって音を出す技法——は、Grand Wizzard Theodore（本名Theodore Livingston）が1975年頃に発明したとされる。Grandmaster Flashは、その技法を受け継いで広め、洗練させた。

元ギャングの一員だったAfrika Bambaataaは、1970年代に組織Universal Zulu Nationを設立した（記念日は1973年11月12日とされるが、1977年とする資料もある）。抗争のエネルギーを、音楽と踊りへ振り向けたのだ。

1979年、ニュージャージーの小レーベルSugar Hill Recordsから、The Sugarhill Gangの「Rapper's Delight」が発売された。この世界の外側で作られたにもかかわらず、全米のヒットチャートでトップ40に入った（Billboard Hot 100で最高36位）。ラップがレコード商品として成立することを、証明したのである。

1982年のGrandmaster Flash and the Furious Five名義の「The Message」（作者は4名のクレジット。ラップはDuke BooteeとMelle Melの2人。グループからはMelle Melだけが参加し、Grandmaster Flash本人は関与していない）は、貧困と絶望を一人称で描いた。ラップが娯楽以上のものになりうることを示した。同年のAfrika Bambaataa &amp; the Soulsonic Force「Planet Rock」は、ドイツのKraftwerkを引用した。これが、電子音楽とのつながりを開いた。

1986年、Run-D.M.C.がAerosmithと共演した「Walk This Way」で、ロック市場を突破した。Def Jam Recordings（通称Def Jam）を設立したRick RubinとRussell Simmonsが、商業的な土台を築いた。

1988〜1990年ごろの黄金期には、Public Enemyが黒人解放思想を打ち出した。De La SoulやA Tribe Called Questは、多彩なサンプリングを打ち出した。警察の暴力と貧困地区の現実を描くギャングスタ・ラップは、Schoolly D（1985年）、Ice-T（1986年）らが先行していた。ロサンゼルスのN.W.A.が、1989年の『Straight Outta Compton』で、これを全米規模に広める。

しかし、1991年のGrand Upright裁判の判決以降、無断サンプリングは訴訟の対象となった。制作費が高騰し、音の作り方そのものが変わった。1990年代半ばには、東海岸のThe Notorious B.I.G.と西海岸の2Pacの対立があおられ、2Pacは1996年、B.I.G.は1997年に射殺された。

それでも、ヒップホップは拡大を続けた。2017年には、Nielsen Musicの総消費量で、R&amp;B/ヒップホップが初めてロックを上回り首位（24.5%対20.8%）になった。</p>
