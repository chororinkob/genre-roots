<h1>Speed Metal（スピードメタル）とは</h1>
<p>1980年代前半に成立した、速さそのものを価値の中心に据えたメタル。ギターは歪ませた音で、手首を高速で往復させるダウンピッキングと、弦を軽く押さえて音を短く切るミュートを組み合わせ、16分音符を刻み続ける。リフは半音階や短調の音階</p>
<p>1980年代前半に成立した、速さそのものを価値の中心に据えたメタル。ギターは歪ませた音で、手首を高速で往復させるダウンピッキングと、弦を軽く押さえて音を短く切るミュートを組み合わせ、16分音符を刻み続ける。リフは半音階や短調の音階を高速で駆け上がる型が多く、ソロは技巧の見せ場として長く取られ、スウィープやタッピングといった技法が並ぶ。ドラムはバスドラムの二つ踏みを連続させ、スネアを毎拍打つ型が使われ、テンポは毎分160から220拍程度に達する。ベースはギターと同じ動きを追いかけ、ピックで硬く弾く。和声は短調が基本だが、クラシックの和声進行を借りた劇的な展開も多い。歌唱に大きな特徴があり、後のスラッシュメタルのような怒鳴りではなく、高音域まで伸びる張った歌声が用いられ、旋律がはっきり存在する。曲の構成も比較的整っており、明快なサビが置かれ、合唱できる箇所が用意されている。歌詞は戦い、速度、剣と魔法の世界、鋼、自由といった主題が多い。同時期のスラッシュメタルと比べると、こちらは旋律と歌唱の美しさを保っており、暗さや社会批判よりも高揚感と英雄的な雰囲気を重んじる点が違う。</p>
<h2>成り立ち</h2><p>直接の親は1970年代末のイギリスで起きたニュー・ウェイヴ・オブ・ブリティッシュ・ヘヴィメタルである。Judas PriestやIron Maidenが、ハードロックにパンクの速さを取り込み、とりわけMotörheadは1979年から80年にかけて、ハードロックとパンクの区別を無効にする速度を提示した。Lemmy Kilmisterの荒々しいベースと、当時としては異常な速さの演奏は、後のあらゆる速いメタルの起点とされる。この速さをさらに徹底したのが、1981年頃から現れた一群のバンドである。イギリスのRavenは自らをアスレチック・ロックと呼び、ドイツではAcceptが1982年の『Restless and Wild』収録の『Fast as a Shark』で、それまでにない速さを記録に残した。カナダのAnvilとExciter、ドイツのHelloweenとRunning Wildが続き、Helloweenは1987年の『Keeper of the Seven Keys』で旋律と速さを両立させ、後のパワーメタルの原型を作った。アメリカでは西海岸のMetallicaやSlayerがこの速さを受け取ったが、彼らは歌唱をより攻撃的にし、歌詞を暗くしてスラッシュメタルへ分岐した。つまり同じ源から二つの方向が分かれたのであり、名称の使い分けは今も国や世代によって揺れている。日本ではLoudnessやANTHEMが同時期に活動し、Loudnessは1980年代半ばにアメリカ市場へ進出した最初の日本のメタルバンドとなった。1980年代末には、この様式そのものは主流から退き、欧州ではパワーメタルへ、アメリカではスラッシュメタルへと吸収された。ただし2000年代以降、原点回帰の運動としてスウェーデンのEnforcerやアメリカのSkull Fistといったバンドが現れ、この時期の音を意識的に選び直している。</p>
<h2>代表曲</h2><ul><li>Overkill（Motörhead）</li><li>Heavy Metal Maniac（Exciter）</li><li>Fast as a Shark（Accept）</li><li>Walls of Jericho（Helloween）</li><li>Through the Fire and Flames（DragonForce）</li></ul>
