<h1>Speed Metal（スピードメタル）とは</h1>
<p>スピードメタルは、速さそのものを価値の中心に据えたメタルだ。1970年代末〜1980年代前半に形成された。今日の意味でのジャンルは、1990年代に遡って定義された。 ギターは歪ませた音で弾く。手首を高速で往復させるオルタネイトピッ</p>
<p>スピードメタルは、速さそのものを価値の中心に据えたメタルだ。1970年代末〜1980年代前半に形成された。今日の意味でのジャンルは、1990年代に遡って定義された。

ギターは歪ませた音で弾く。手首を高速で往復させるオルタネイトピッキングと、弦を軽く押さえて音を短く切るミュートを組み合わせ、16分音符を刻み続けることが多い。リフは半音階や短調の音階を高速で駆け上がる型が多く、ソロは技巧的な傾向がある。

和声（コードの響き）は短調が基本だ。ただし、一部にクラシカルな要素を持つバンドもある。

ドラムはバスドラムの二つ踏みを連続させることが多く、非常に速いテンポである。ベースはギターと同じ動きを追いかける傾向があり、ピックで硬く弾くことも多い。

歌唱は、表現力の高いものが多い。スラッシュに比べると荒い声は少ない傾向があり、旋律がはっきり存在する。

曲の構成も比較的整っている。明快なサビが置かれ、合唱できる箇所が用意される傾向がある。全体として旋律的で、スラッシュに比べ攻撃性が穏やかとされる。</p>
<h2>成り立ち</h2><p>スピードメタルの源流の一つは、1970年代末のイギリスで起きたニュー・ウェイヴ・オブ・ブリティッシュ・ヘヴィメタルである。NWOBHM全体が、ハードロックにパンクの要素を取り入れてテンポを上げた。NWOBHMより前の1975年に結成されながら並走したMotörheadは、1979年から80年にかけて、ハードロックとパンクの区別を無効にする速度を示した。Lemmy Kilmisterの荒々しいベースと、当時としては異常な速さの演奏は、後の速いメタルの起点としてしばしば挙げられる。ただし発祥は1970年代後半で諸説あり、1978年のJudas Priestの曲「Exciter」や、1979年のMotörhead『Overkill』などが起点に挙げられる。

この速さをさらに徹底したのが、1981年頃から現れた一群のバンドである。イギリスのRavenはアスレチック・ロックと呼ばれ（後にバンド自身も採用した）、同じ頃、カナダのAnvilが1981年にデビュー作を出した。これはRavenと同時期である。ドイツでは、Acceptが1982年の『Restless and Wild』に収めた『Fast as a Shark』で、速いテンポを記録に残した。

その後に続いたのが、カナダのExciter（デビュー1983年）、ドイツのRunning Wild（デビュー1984年）、Helloween（結成1984年）である。Helloweenは1987年の『Keeper of the Seven Keys: Part I』で、旋律と速さを両立させた。これが、欧州型パワーメタルが固まるうえで決定的な影響を与えた。

アメリカでは、西海岸のMetallicaやSlayerがこの速さを受け取った。だが彼らは、歌唱をより攻撃的にし、歌詞を暗くして、スラッシュメタルへ分かれていった。つまり同じ源から二つの方向が分かれたのであり、名称の使い分けは今も国や世代によって揺れている。スピードメタルは、スラッシュメタルとパワーメタルの双方へ発展した。

日本では、LoudnessやANTHEMが同じ時期に活動した。Loudnessは日本のヘヴィメタル・バンドとして初めて、米国の大手レーベル（Atco）と契約した（1985年）。

ただし2000年代以降、原点に戻ろうとする運動（NWOTHM）として、スウェーデンのEnforcerやカナダのSkull Fistといったバンドが現れた。彼らは、この時期の音を意識的に選び直している。</p>
