<h1>Speed Metal（スピードメタル）とは</h1>
<p>1970年代末〜1980年代前半に形成された（今日の意味でのジャンルは、1990年代に遡って定義された）、速さそのものを価値の中心に据えたメタル。ギターは歪ませた音で、手首を高速で往復させるオルタネイトピッキングと、弦を軽く押さえ</p>
<p>1970年代末〜1980年代前半に形成された（今日の意味でのジャンルは、1990年代に遡って定義された）、速さそのものを価値の中心に据えたメタル。ギターは歪ませた音で、手首を高速で往復させるオルタネイトピッキングと、弦を軽く押さえて音を短く切るミュートを組み合わせ、16分音符を刻み続ける傾向がある。リフは半音階や短調の音階を高速で駆け上がる型が多い傾向があり、ソロは技巧的な傾向がある。ドラムはバスドラムの二つ踏みを連続させることが多く、テンポは非常に速い。ベースはギターと同じ動きを追いかけ、硬く弾く傾向がある。和声（コードの響き）は短調が基本である。歌唱は表現力の高いものが多く、スラッシュメタルに比べると荒々しい声は少ない傾向があり、旋律がはっきり存在する。曲の構成も比較的整っており、明快なサビが置かれ、合唱できる箇所が用意されている傾向がある。同時期のスラッシュメタルと比べると、こちらは旋律的で、攻撃性が穏やかとされる。</p>
<h2>成り立ち</h2><p>主要な源流の一つは1970年代末のイギリスで起きたニュー・ウェイヴ・オブ・ブリティッシュ・ヘヴィメタルである。NWOBHM全体が、ハードロックにパンクの要素を取り入れてテンポを上げ、NWOBHMより前の1975年に結成されながら並走したMotörheadは、1979年から80年にかけて、ハードロックとパンクの区別を無効にする速度を提示した。Lemmy Kilmisterの荒々しいベースと、当時としては異常な速さの演奏は、後の速いメタルの起点としてしばしば挙げられる。1978年のJudas Priest『Exciter』や1979年のMotörhead『Overkill』を起点とする見方もあり、発祥は1970年代後半で諸説ある。この速さをさらに徹底したのが、1981年頃から現れた一群のバンドである。イギリスのRavenはアスレチック・ロックと称され（後にバンド自身も採用した）、ドイツではAcceptが1982年の『Restless and Wild』収録の『Fast as a Shark』で、速いテンポを記録に残した。カナダのAnvilは1981年（Ravenと同時期）にデビュー作『Hard 'n' Heavy』を出していた。その後、カナダのExciter（デビュー1983年）、ドイツのRunning Wild（デビュー1984年）とHelloween（結成1984年）が続き、Helloweenは1987年の『Keeper of the Seven Keys: Part I』で旋律と速さを両立させ、欧州型パワーメタルの確立に決定的な影響を与えた。アメリカでは西海岸のMetallicaやSlayerがこの速さを受け取ったが、彼らは歌唱をより攻撃的にし、歌詞を暗くしてスラッシュメタルへ分岐した。つまり同じ源から二つの方向が分かれたのであり、名称の使い分けは今も国や世代によって揺れている。日本ではLoudnessやANTHEMが同時期に活動し、Loudnessは1985年に、日本のヘヴィメタル・バンドとして初めてアメリカの大手レーベル（Atco）と契約した。スピードメタルはスラッシュメタルとパワーメタルの双方へ発展した。ただし2000年代以降、原点回帰の運動としてスウェーデンのEnforcerやカナダのSkull Fistといったバンドが現れた。これらは「ニュー・ウェイヴ・オブ・トラディショナル・ヘヴィメタル（NWOTHM）」と呼ばれる動きの一員とされ、この時期の音を意識的に選び直している。</p>
