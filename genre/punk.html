<h1>Punk Rock（パンク）とは</h1>
<p>三つ程度のコードと速い8ビートだけで押し切る、簡潔さと速度を美徳にしたロック。曲は2分前後と短く、長い間奏やギターソロを省き、イントロからいきなり本題に入る。ギターは歪ませたまま全弦を振り下ろすダウンストロークの連打が中心で、和音</p>
<p>三つ程度のコードと速い8ビートだけで押し切る、簡潔さと速度を美徳にしたロック。曲は2分前後と短く、長い間奏やギターソロを省き、イントロからいきなり本題に入る。ギターは歪ませたまま全弦を振り下ろすダウンストロークの連打が中心で、和音はルートと5度だけのパワーコード。ベースはピックで8分音符を刻み、ドラムはスネアを2拍4拍に叩き続けるエイトビートか、2分の2拍子で表裏を叩き分ける倍速の型を使い、テンポは160〜200BPMに達する。演奏技術の高さはむしろ嫌われ、外れた音程や走るリズムは欠点ではなく正直さの証とされた。歌詞は失業、退屈、都市の荒廃、権威への嫌悪、自意識といった生活圏の不満を、比喩を避けた直接的な言葉で吐き出す。録音は数日で終わらせ、少額で自主制作した7インチシングルとコピー誌（ファンジン）で流通させるDIYの姿勢が、音そのものと同じくらい重要視される。ハードロックと編成は似ているが、名人芸・長尺・神秘的な歌詞をすべて捨てた点で正反対に位置する。会場では客と舞台の境界が曖昧で、身体をぶつけ合うモッシュや客が舞台から飛び込むステージダイブが伴う。</p>
<h2>成り立ち</h2><p>1960年代末のデトロイトとニューヨークにその前身がある。MC5は1969年の「Kick Out the Jams」で政治的な過激さと轟音を結び付け、The StoogesのIggy Popは自傷を含む破滅的な舞台で観客との境界を壊した。1974年頃からニューヨークのバワリー地区にあった場末の酒場CBGBに、Television、Patti Smith、Ramones、Blondieらが集まり、演奏の巧拙を問わない場が生まれる。Ramonesが1976年4月に出した1作目は14曲で29分、ほぼ全曲が同じダウンストロークという極端な単純化で、以後の設計図になった。この動きをイギリスへ持ち込んだのが、ニューヨークでNew York Dollsの面倒を見ていた衣料店主Malcolm McLarenである。彼はロンドンのキングス・ロードにある自身の店SEXの周辺の若者を集めてSex Pistolsを組ませ、1976年11月に「Anarchy in the U.K.」を発表した。同年12月1日、テレビ番組でのBill Grundyとの罵り合いが全国紙の一面になり、バンドは音楽ではなく社会問題として扱われる。1977年、エリザベス2世の在位25周年に合わせて出した「God Save the Queen」は放送禁止のまま実質的な首位に達した。1976年9月の100 Club Punk Special、The Damnedによる英国初のパンク・シングル「New Rose」（1976年10月）、Buzzcocksが1977年に自費で出した「Spiral Scratch」が、レコード会社を通さずに作品を出せるという実例を示し、無数の小レーベルとコピー誌が生まれた。Mark Perryのファンジン『Sniffin' Glue』に載った、三つのコードの押さえ方の図に「これで三つ、さあバンドを組め」と添えた一枚は、この運動の精神を要約したものとして語り継がれている。The Clashは政治的主題を引き受け、人種差別に反対する運動Rock Against Racismと結び付いた。だが速度は短命でもあった。Sex Pistolsは1978年1月に解散し、ベースのSid Viciousは恋人殺害の容疑を受けたまま1979年2月に薬物の過剰摂取で死亡する。運動はより実験的なポストパンク、より速く硬派なハードコアパンク、そして商業化したニューウェーヴへと分岐していった。</p>
<h2>代表曲</h2><ul><li>Blitzkrieg Bop (Ramones)</li><li>Anarchy in the U.K. (Sex Pistols)</li><li>London Calling (The Clash)</li><li>God Save the Queen (Sex Pistols)</li><li>I Wanna Be Sedated (Ramones)</li></ul>
