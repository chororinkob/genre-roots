<h1>Punk Rock（パンク）とは</h1>
<p>パンクロックは、三つから四つ程度のコードと速い8ビートだけで押し切る、簡潔さと速度を美徳にしたロックだ。 主役はギター。パンクのギターは、歪ませたパワーコードやバレーコードが中心になる。Ramonesはほぼダウンストローク一辺倒で</p>
<p>パンクロックは、三つから四つ程度のコードと速い8ビートだけで押し切る、簡潔さと速度を美徳にしたロックだ。

主役はギター。パンクのギターは、歪ませたパワーコードやバレーコードが中心になる。Ramonesはほぼダウンストローク一辺倒で、全弦のバレーコードが基本だった。

使うコードは、三つ〜四つ程度。和音は少なく、複雑なことはしない。

リズムの土台は、1小節に八つの8分音符(4拍を8分で刻む)を刻む型だ。ベースはピックで8分音符を刻む。ドラムは、スネアを2拍4拍に叩き続けるエイトビートか、倍速(ダブルタイム)の型を使う。テンポは速いものが多い。曲によって幅が大きい。Ramonesのように200BPM近い曲もある。

歌詞は、失業、退屈、都市の荒廃、権威への嫌悪、自意識といった、身近な生活の不満を扱う。それを、直接的で挑発的な言葉で吐き出すことが多い。

曲は、他のロックより短いものが多い。Ramonesは2分未満が大半だった。複雑で技巧的なソロは、自己満足として避けられた。簡素なソロや間奏にとどめ、イントロからいきなり本題に入る。過剰な技巧を自己満足として退ける空気があった。ハードロックと編成は似ているが、名人芸的なソロや大仰なスタイルへの反発が強かった。

作り方や会場の姿勢も、音と同じくらい重要視される。自主制作の7インチやファンジンが重視された。ただし大手と契約した例も多い。DIY（自分たちで作ること）の姿勢が、音そのものと同じくらい重要視される。会場では客と舞台の境界が曖昧で、跳ねて踊るポゴが伴う。スラムダンスは後のハードコアで派生した。ステージダイブはIggy Popが先駆けとされ、のちハードコアで一般化した。</p>
<h2>成り立ち</h2><p>舞台は、1960年代末のデトロイト周辺（ミシガン州）とニューヨークだ。この二つの土地に、パンクの前身がある。

MC5は、1969年の「Kick Out the Jams」で、政治的な過激さと轟音を結び付けた。The StoogesのIggy Popは、自傷を含む破滅的な舞台で、観客との境界を壊した。

1974年頃からは、ニューヨークのバワリー地区にあった場末の酒場CBGBに、Television、Patti Smith、Ramones、Blondieらが集まった。演奏のうまいへたを問わない場が、ここに生まれた。Ramonesが1976年4月に出した1作目は、14曲で29分。ほぼ全曲が同じダウンストロークという極端な単純化で、以後の設計図になった。

ニューヨークでNew York Dollsの面倒を見ていた衣料店主Malcolm McLarenは、CBGBの動きに着想を得て、1975年5月に帰国した。そしてStrandの管理を引き継いだ。彼はロンドンのキングス・ロードにある自身の店SEXの周辺の若者のバンドを引き継いで管理した。メンバーと路線を作り替え、Sex Pistolsとして世に出し、1976年11月に「Anarchy in the U.K.」を発表した。

同年12月1日、テレビ番組でのBill Grundyとの罵り合いが、全国紙の一面になった。バンドは、音楽ではなく社会問題として扱われる。1977年には、エリザベス2世の在位25周年に合わせて「God Save the Queen」を出した。この曲は放送禁止にされながら、公式チャートでは2位、NMEのチャートでは1位となった（チャートが操作されたとする疑惑もある）。

一方、作品を出す側にも変化があった。「Spiral Scratch」（1977年）が、自主制作の実例を示した。「New Rose」（1976年10月）は、独立系Stiffからの英国初のパンク・シングルだ。1976年9月の100 Club Punk Specialは、パンクを注目させた催しだった。こうして、無数の小レーベルとコピー誌が生まれた。

Tony Moonは、1976年末から1977年1月にかけて、ファンジン『Sideburns』を創刊した。その第1号に載ったのが、三つのコードの押さえ方の図に「これで三つ、さあバンドを組め」と添えた一枚だ。この運動の精神を要約したものとして、語り継がれている（しばしばMark Perryの『Sniffin' Glue』にのものと誤って伝えられるが、実際には『Sideburns』掲載である）。

The Clashは、政治的主題を引き受けた。そして、人種差別に反対する運動Rock Against Racismと結び付いた。

だが、速度は短命でもあった。Sex Pistolsは1978年1月に解散した。ベースのSid Viciousは、恋人殺害の容疑を受けたまま、1979年2月に薬物の過剰摂取で死亡する。運動はその後、より実験的なポストパンク、より速く硬派なハードコアパンク、そして商業化したニューウェーヴへと分岐していった。</p>
