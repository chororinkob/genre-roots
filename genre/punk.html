<h1>Punk Rock（パンク）とは</h1>
<p>三つ〜四つ程度のコード（和音）と速い8ビート（4拍の1小節を、8分音符八つで刻むリズム）だけで押し切る、簡潔さと速度を美徳にしたロック。曲はほかのロックより短いものが多く（Ramonesは2分に満たない曲がほとんど）、むずかしく凝</p>
<p>三つ〜四つ程度のコード（和音）と速い8ビート（4拍の1小節を、8分音符八つで刻むリズム）だけで押し切る、簡潔さと速度を美徳にしたロック。曲はほかのロックより短いものが多く（Ramonesは2分に満たない曲がほとんど）、むずかしく凝ったギターソロは自己満足として避け、簡単なソロや間奏にとどめ、イントロからいきなり本題に入る。ギターは、歪ませたパワーコード（ルートと5度だけの和音）や、バレーコード（全部の弦を鳴らす押さえ方の和音）が中心。Ramonesはほぼダウンストローク（ピックを下へ振り下ろす弾き方）一辺倒で、バレーコードが基本だった。ベースはピックで8分音符を刻み、ドラムはスネアを2拍4拍に叩き続けるエイトビートか、倍速（ダブルタイム）の型を使い、テンポは速い曲が多いが曲によって幅が大きく、Ramonesのように200BPM近い曲もある。必要以上の技巧を自己満足として退ける空気があった。歌詞は失業、退屈、都市の荒廃、権威への嫌悪、自意識といった生活圏の不満を、直接的で挑発的な言葉で吐き出すことが多い。自主制作の7インチシングルやコピー誌（ファンジン）が重んじられ、DIY（自分たちで作ること）の姿勢が、音そのものと同じくらい重要視される。ただし、大きなレコード会社と契約したバンドも多い。ハードロックと編成は似ているが、名人芸のようなソロや大げさなやり方への反発が強かった。会場では客と舞台の境界が曖昧で、跳ねて踊るポゴが伴う。身体をぶつけ合うスラムダンス（のちのモッシュ）は、あとのハードコアで生まれた。客が舞台から飛び込むステージダイブは、Iggy Popが先駆けとされ、のちにハードコアで広く行われるようになった。</p>
<h2>成り立ち</h2><p>1960年代末のデトロイト周辺（ミシガン州）とニューヨークにその前身がある。MC5は1969年の「Kick Out the Jams」で政治的な過激さと轟音を結び付け、The StoogesのIggy Popは自傷を含む破滅的な舞台で観客との境界を壊した。1974年頃からニューヨークのバワリー地区にあった場末の酒場CBGBに、Television、Patti Smith、Ramones、Blondieらが集まり、演奏のうまいへたを問わない場が生まれる。Ramonesが1976年4月に出した1作目は14曲で29分、ほぼ全曲が同じダウンストロークという極端な単純化で、以後の設計図になった。この動きからヒントを得たのが、ニューヨークでNew York Dollsの面倒を見ていた衣料店主Malcolm McLarenである。彼は1975年5月にロンドンへ戻り、キングス・ロードにある自身の店SEXの周辺の若者のバンド（のちのSex Pistolsの前身Strand）の管理を引き継ぎ、メンバーと路線を作り替えてSex Pistolsとして世に出し、1976年11月に「Anarchy in the U.K.」を発表した。同年12月1日、テレビ番組でのBill Grundyとの罵り合いが全国紙の一面になり、バンドは音楽ではなく社会問題として扱われる。1977年、エリザベス2世の在位25周年に合わせて出した「God Save the Queen」は放送禁止にされながら、公式チャートでは2位、NMEのチャートでは1位となった（チャートが操作されたとする疑惑もある）。1976年9月には、パンクに注目を集めた2日間の催し100 Club Punk Specialが開かれた。同年10月、The Damnedは独立系（大手に属さない）レーベルのStiff Recordsから、英国初のパンク・シングル「New Rose」を出した。Buzzcocksが1977年に自分たちのレーベルから自費で出した「Spiral Scratch」は、レコード会社を通さずに作品を出せるという実例を示し、無数の小レーベルとコピー誌が生まれた。Tony Moonが1976年末から1977年1月にかけて創刊したファンジン『Sideburns』第1号に載った、三つのコードの押さえ方の図に「これで三つ、さあバンドを組め」（原文の意味をまとめた訳）と添えた一枚は、この運動の精神を要約したものとして語り継がれている（しばしばMark Perryの『Sniffin' Glue』にのものと誤って伝えられるが、実際には『Sideburns』掲載である）。The Clashは政治的主題を引き受け、人種差別に反対する運動Rock Against Racismと結び付いた。だが速度は短命でもあった。Sex Pistolsは1978年1月に解散し、ベースのSid Viciousは恋人殺害の容疑を受けたまま1979年2月に薬物の過剰摂取で死亡する。運動はより実験的なポストパンク、より速く硬派なハードコアパンク、そして商業化したニューウェーヴへと分岐していった。</p>
<h2>代表曲</h2><ul><li>London Calling (The Clash)</li><li>God Save the Queen (Sex Pistols)</li><li>Blitzkrieg Bop (Ramones)</li><li>Anarchy in the U.K. (Sex Pistols)</li><li>I Wanna Be Sedated (Ramones)</li><li>Pretty Vacant (Sex Pistols)</li><li>Teenage Kicks (The Undertones)</li><li>White Riot (The Clash)</li><li>Gimme Danger (Iggy and the Stooges)</li><li>Ever Fallen in Love (With Someone You Shouldn't've) (Buzzcocks)</li><li>Rockaway Beach (Ramones)</li><li>Sheena Is a Punk Rocker (Ramones)</li><li>New Rose (The Damned)</li><li>Complete Control (The Clash)</li><li>Garageland (The Clash)</li><li>Orgasm Addict (Buzzcocks)</li><li>Blank Generation (Richard Hell and the Voidoids)</li><li>EMI (Sex Pistols)</li><li>53rd and 3rd (Ramones)</li><li>Suspect Device (Stiff Little Fingers)</li><li>Alternative Ulster (Stiff Little Fingers)</li><li>Neat Neat Neat (The Damned)</li><li>Smash It Up (The Damned)</li><li>Boredom (Buzzcocks)</li><li>Chinese Rocks (The Heartbreakers)</li></ul>
