<h1>Stoner Rock（ストーナーロック）とは</h1>
<p>低い調弦と大音量の歪みによる、遅く重く反復的なロック。ギターは通常より低く、全音下げやドロップCに調弦され、真空管アンプを大音量で飽和させたファジーな歪みを用いる。Big Muffなどのファズ・ペダルと、Orangeのアンプの組み</p>
<p>低い調弦と大音量の歪みによる、遅く重く反復的なロック。ギターは通常より低く、全音下げやドロップCに調弦され、真空管アンプを大音量で飽和させたファジーな歪みを用いる。Big Muffなどのファズ・ペダルと、Orangeのアンプの組み合わせが定番。奏法はパワー・コードのリフの反復が中心で、速弾きはほとんど用いられない。特徴的なのは音の質感で、高音域が丸められ、中低音が飽和した、砂のようにざらついた分厚い音が求められる。ベースも歪ませてギターと同じ帯域を厚くする。BPMは70〜110、ドラムは重く単純で、シンバルの残響を長く鳴らす。和声は短調のペンタトニックとブルース由来の音階が中心で、リフはしばしばブルースの旋律線を低く重く鳴らしたものとなる。曲構成は同じリフの長時間の反復が基本で、五分から10分に及ぶことも多い。この反復による陶酔が音楽の目的である。歌唱は歪ませない伸びやかな声か、低く唸る声。歌詞は砂漠、宇宙、大麻、幻覚、神話的な情景を扱う。1970年前後のハードロックへの深い愛着が根底にある。</p>
<h2>成り立ち</h2><p>音楽的な祖はBlack Sabbathであり、その1970年から1971年の作品が示した重く遅いリフが全ての出発点となる。加えてBlue Cheerが1968年に示した過剰な音量と歪みも重要な前史である。しかし現在のジャンルとしての形は1990年前後、米国カリフォルニア州の砂漠地帯パーム・デザート周辺で生まれた。この地域では、若者たちが砂漠の中に発電機を持ち込み、警察の来ない場所で夜通し演奏するジェネレーター・パーティーという催しを行っていた。ここから生まれたのがKyussで、Josh HommeとJohn Garciaを中心に、1992年のBlues for the Red Sunと1994年のWelcome to Sky Valleyで、砂漠の空間性を反映した音を確立した。Josh Hommeはギターの弦を極端に緩く張り、ベース用の弦を用いることで独特の唸る音を得たと語っている。Kyussの解散後、彼はQueens of the Stone Ageを結成し、より簡潔な構造で商業的な成功を収めた。並行して、カリフォルニア州サンノゼのSleepが、Black Sabbathへの徹底した傾倒と極端に長い曲を追求し、Fu Manchuも同様の路線を進んだ。スウェーデンではSpiritual BeggarsとDozerが、ヨーロッパ側の系統を築いた。名称そのものは、この音楽が大麻の使用と結び付けて語られたことに由来し、当事者の中にはこの呼称を嫌う者も多い。産業構造としては、ほぼ完全に独立系レーベルに依存しており、米国のMan's Ruin Records、ドイツのStickman Records、そしてSmall Stone Recordsが主要な受け皿となってきた。1990年代末以降、ドイツで毎年開かれるDesertfestなどのイベントが国際的な結節点となり、シーンは小規模ながら世界的な広がりを保っている。</p>
<h2>代表曲</h2><ul><li>Green Machine (Kyuss)</li><li>Dopesmoker (Sleep)</li><li>Space Lord (Monster Magnet)</li><li>Witchcult Today (Electric Wizard)</li><li>No One Knows (Queens of the Stone Age)</li></ul>
