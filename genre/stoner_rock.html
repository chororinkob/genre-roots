<h1>Stoner Rock（ストーナーロック）とは</h1>
<p>低い調弦と大音量の歪みによる、遅いから中速の、重く反復的なロック。ギターは通常より低く、全音下げやドロップCに調弦（弦の音合わせ）され、真空管（またはハイブリッド）アンプを大音量で潰したファジー（ざらついた）な歪みを用いる。奏法は</p>
<p>低い調弦と大音量の歪みによる、遅いから中速の、重く反復的なロック。ギターは通常より低く、全音下げやドロップCに調弦（弦の音合わせ）され、真空管（またはハイブリッド）アンプを大音量で潰したファジー（ざらついた）な歪みを用いる。奏法はパワー・コード（ルートと5度だけの和音）のリフの反復が中心で、速弾きはほとんど用いられない。特徴的なのは音の質感で、高音域が丸められ、中低音が飽和した、砂のようにざらついた分厚い音が求められる。ベースも歪ませてギターと同じ帯域を厚くする。和声は短調のペンタトニック（5音音階）とブルース由来の音階が中心で、リフはしばしばブルースの旋律線を低く重く鳴らしたものとなる。曲構成は反復的なリフを重視するのが典型で、Sleepのように極端に長い曲もあるが、短い曲も多い。歌唱は歪ませない伸びやかな声か、低く唸る声。歌詞は大麻、砂漠、幻覚などを扱うほか、車やレースを扱う例もある。1970年前後のハードロックへの愛着が根底にあるバンドも多い。</p>
<h2>成り立ち</h2><p>Black Sabbathの1970年から1971年の作品が示した重く遅いリフ（とくに1971年のMaster of Reality）が、最初期の原型としてしばしば挙げられる。加えてBlue Cheerが1968年に示した過剰な音量と歪みも重要な前史で、Sir Lord BaltimoreやBuffaloも先駆者とされるなど、単一の祖は定説になっていない。Kyussの当事者は、Sabbathの影響を否定している。しかし現在のジャンルとしての形は、1990年代初頭に、カリフォルニアの砂漠地帯パーム・デザート周辺のKyussと、サンノゼのSleepが先駆けとなって形づくられ、東海岸のMonster Magnetも同じ時期に重要な役割を果たした。パーム・デザート周辺では、若者たちが砂漠の中に発電機を持ち込み、警察の目を避けて夜通し演奏するジェネレーター・パーティー（警察が来ることもあった）という催しを行っていた。Kyussはこのパーティーの出演バンドとして頭角を現し、Josh HommeとJohn Garciaを中心に、1992年のBlues for the Red Sunと1994年のWelcome to Sky Valleyで、砂漠の空間性を反映した音を確立した。Josh Hommeはギターの弦をたるむほど下げてから少し張り直し、ベース用のキャビネット（スピーカーを収めた箱）を使うことで独特の唸る音を得たと語っている。Kyussの解散後、彼はQueens of the Stone Ageを結成し、より簡潔な構造で商業的な成功を収めた。並行して、カリフォルニア州サンノゼのSleepが、Black Sabbathへの徹底した傾倒と極端に長い曲を追求し、Fu Manchuはマッスルカーやドラッグレースを主題に、Sleepとは別系統のファジーなストーナー・ロックを展開した。スウェーデンではSpiritual BeggarsとDozerが、ヨーロッパ側の系統を築いた。呼称の由来は定説がないが、1997年のコンピレーション盤『Burn One Up! Music for Stoners』の題名に由来する可能性が指摘されており、当事者の中にはこの呼称を嫌う者も多い。産業構造としては、独立系レーベルに依存しており、米国のMan's Ruin Records、ドイツのStickman Records、そしてSmall Stone Recordsが主要な受け皿となってきた。2010年代以降、ドイツやイギリスなどで開かれるDesertfest（2012年にロンドンとベルリンで始まった）などのイベントが国際的な結節点となり、シーンは小規模ながら世界的な広がりを保っている。</p>
