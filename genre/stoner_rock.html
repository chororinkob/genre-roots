<h1>Stoner Rock（ストーナーロック）とは</h1>
<p>低い調弦と大音量の歪みによる、遅めから中くらいの速さの、重く反復的なロック。ギターは通常より低く、全音下げやドロップCなどに調弦（弦の音合わせ）される。代表例のKyussは、全部の弦を大きく下げてCの音（一部はB）に合わせていた。</p>
<p>低い調弦と大音量の歪みによる、遅めから中くらいの速さの、重く反復的なロック。ギターは通常より低く、全音下げやドロップCなどに調弦（弦の音合わせ）される。代表例のKyussは、全部の弦を大きく下げてCの音（一部はB）に合わせていた。アンプは、真空管式（真空管と半導体を組み合わせたものも含む）を大音量で潰した、ファジー（ざらついた）な歪みを用いる。奏法はパワー・コード（ルートと5度だけの和音）のリフの反復が中心で、速弾きはほとんど用いられない。特徴的なのは音の質感で、高音域が丸められ、中低音が飽和した、砂のようにざらついた分厚い音が求められる。ベースも歪ませてギターと同じ帯域を厚くする。和声は短調のペンタトニック（5音音階）とブルース由来の音階が中心で、リフはしばしばブルースの旋律線を低く重く鳴らしたものとなる。曲の組み立ては、同じリフを繰り返すものが典型的で、Sleepのようにとても長い曲もあるが、短い曲も多い。歌唱は歪ませない伸びやかな声か、低く唸る声。歌詞は大麻、砂漠、幻覚のほか、車やレースを扱うものもある。1970年前後のハードロックへの深い愛着が根底にある。</p>
<h2>成り立ち</h2><p>Black Sabbathの1970年から1971年の作品が示した重く遅いリフ（とくに1971年のMaster of Reality）は、いちばん早い手本としてよく挙げられる。ただ、Blue Cheer（1968年に大きな音量と歪みを示した）、Sir Lord Baltimore、Buffaloなども先がけとされ、これがはじまりだと決まった説はない。Kyussの当事者は、Sabbathの影響を否定している。今のようなジャンルの形は、1990年代初頭に、カリフォルニアの砂漠地帯パーム・デザート周辺のKyussと、サンノゼのSleepが先に切り開いた。同じころ、東海岸ニュージャージー州のMonster Magnetも大事な役目を果たした。パーム・デザート周辺では、若者たちが砂漠の中に発電機を持ち込み、警察の目を避けて夜通し演奏する（警察が来ることもあった）ジェネレーター・パーティーという催しを行っていた。Kyussは、このパーティーで演奏して名を上げたバンドで、Josh HommeとJohn Garciaを中心に、1992年のBlues for the Red Sunと1994年のWelcome to Sky Valleyで、砂漠の空間性を反映した音を確立した。Josh Hommeは、ギターの弦をたるむほど低く下げてから少し戻し、ベース用のキャビネット（スピーカーを収めた箱）を使うことで独特の唸る音を得たと語っている。Kyussの解散後、彼はQueens of the Stone Ageを結成し、より簡潔な構造で商業的な成功を収めた。並行して、カリフォルニア州サンノゼのSleepが、Black Sabbathへの徹底した傾倒と極端に長い曲を追求し、Fu Manchuはマッスルカーやドラッグレースを主題に、Sleepとは別系統のファジーなストーナー・ロックを展開した。スウェーデンでは、Spiritual Beggars（1993年結成）とDozer（1995年結成）が代表的なバンドとして知られる。呼称の由来は定説がないが、1997年のコンピレーション盤『Burn One Up! Music for Stoners』の題名に由来する可能性が指摘されており、当事者の中にはこの呼称を嫌う者も多い。産業構造としては、独立系レーベルに頼っており、米国のMan's Ruin Records（1994年設立、2001〜2002年に閉鎖）、デトロイトのSmall Stone Records（1995年設立）、ドイツのStickman Records（1994年設立）などが大事な役目を果たしてきた。2010年代以降、ドイツやイギリスなどで開かれるDesertfest（2012年にロンドンとベルリンで始まった）などのイベントが国際的な結節点となり、シーンは小規模ながら世界的な広がりを保っている。</p>
