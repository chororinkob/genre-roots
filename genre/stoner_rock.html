<h1>Stoner Rock（ストーナーロック）とは</h1>
<p>ストーナー・ロックは、低い調弦と大音量の歪みによる、遅い〜中速テンポの、重く反復的なロックだ。1970年前後のハードロックへの深い愛着が、根底にある。 主役はギター。通常より低く、全音下げやドロップCに調弦（弦の音合わせ）される。</p>
<p>ストーナー・ロックは、低い調弦と大音量の歪みによる、遅い〜中速テンポの、重く反復的なロックだ。1970年前後のハードロックへの深い愛着が、根底にある。

主役はギター。通常より低く、全音下げやドロップCに調弦（弦の音合わせ）される。Kyussは全弦を大きく下げたC（一部B）調弦だった。真空管（またはハイブリッド）アンプを大音量で潰した、ファジー（ざらついた）な歪みを用いる。

特徴的なのは音の質感だ。高音域が丸められ、中低音が飽和した、砂のようにざらついた分厚い音が求められる。ベースも歪ませて、ギターと同じ帯域を厚くする。

奏法は、パワー・コード（ルートと5度だけの和音）のリフの反復が中心で、速弾きはほとんど用いられない。和声は、短調のペンタトニック（5音音階）とブルース由来の音階が中心だ。リフはしばしば、ブルースの旋律線を低く重く鳴らしたものとなる。



曲は、遅い〜中速テンポで、反復的なリフ重視が典型だ。Sleepのように極端に長い曲もあるが、短い曲も多い。

歌唱は、歪ませない伸びやかな声か、低く唸る声。歌詞は、大麻・砂漠・幻覚のほか、車やレースを扱う例もある。</p>
<h2>成り立ち</h2><p>Black Sabbath（特にMaster of Reality）は、最初期の原型としてよく挙げられる。ただしBlue Cheer、Sir Lord Baltimore、Buffaloなども先駆者とされ、単一の祖は定説化していない。加えて、Blue Cheerが1968年に示した過剰な音量と歪みも、重要な前史である。

しかし、現在のジャンルとしての形は、1990年代初頭に固まった。砂漠地帯パーム・デザート周辺のKyussと、サンノゼのSleepが先駆とされる。東海岸のMonster Magnetも、同時期に重要な役割を果たした。

パーム・デザート周辺では、若者たちが砂漠の中に発電機を持ち込み、夜通し演奏していた。ジェネレーター・パーティーという催しだ。警察の目を避けるためだったが、警察が来ることもあった。ここで出演バンドとして知られるようになったのがKyussだ。Josh HommeとJohn Garciaを中心に、1992年のBlues for the Red Sunと1994年のWelcome to Sky Valleyで、砂漠の空間性を反映した音を固めた。

Josh Hommeは、ギターを「floppy」になるまで下げてから少し戻した。さらに、ベース用のキャビネット（スピーカーを収めた箱）を使うことで、独特の唸る音を得たと語っている。Kyussの解散後、彼はQueens of the Stone Ageを結成した。より簡潔な構造で、商業的な成功を収めた。

並行して、カリフォルニア州サンノゼのSleepは、Black Sabbathへの徹底した傾倒と、極端に長い曲を追求した。Fu Manchuは、マッスルカーやドラッグレースを主題に、Sleepとは別系統のファジーなストーナー・ロックを展開した。スウェーデンを代表するバンドとして、Spiritual BeggarsとDozerが挙がる。

呼称の由来は定説がない。1997年のRoadrunner Records盤コンピレーション『Burn One Up! Music for Stoners』の題名に由来する可能性が指摘されている。当事者の中には、この呼称を嫌う者も多い。

産業構造としては、独立系レーベルに依存している。Man's Ruin Records（1994〜2001/02年、現在は閉鎖）、Stickman Records（1994年にニュルンベルクで設立、のちにハンブルクに移った）、Small Stone Records（デトロイト、1995年設立）などが重要な役割を果たした。

2010年代以降は、ドイツやイギリスなどで開かれるDesertfest（2012年にロンドンとベルリンで始まった）などのイベントが、国際的な結節点となった。シーンは小規模ながら、世界的な広がりを保っている。</p>
