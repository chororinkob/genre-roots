<h1>Emo（エモ）とは</h1>
<p>エモは、感情の吐露を主題に据えたロックのスタイルだ。第一の波(エモコア)では、ハードコア・パンクの編成と音量を用いている。 ギターは、歪ませたパワー・コード（二つの音だけの力強い和音）を鳴らす。これと対比されるのが、コーラス（音に</p>
<p>エモは、感情の吐露を主題に据えたロックのスタイルだ。第一の波(エモコア)では、ハードコア・パンクの編成と音量を用いている。

ギターは、歪ませたパワー・コード（二つの音だけの力強い和音）を鳴らす。これと対比されるのが、コーラス（音に厚みを出す効果）やディレイ（音を遅らせて繰り返す効果）をかけた、澄んだアルペジオ（和音を一音ずつ順に弾く奏法）だ。この静と動の落差が、曲の構造を作る。

特徴的なのは和声（コードの響き）だ。ギター奏法の解説では、第二の波の中核となった地域的なスタイル(ミッドウェスト・エモ)で、和音を一音ずつ順に弾くアルペジオと、開放的な響きの和音(maj7、add9、sus2、sus4など)が多用されるとされる。この宙吊りの響きが、解決しない感情を音として表す。

BPM（1分間の拍数）は中庸から速めで、拍子は4分の4が基本だ。ただし第二の波では、マス・ロック的な要素や変拍子（定型から外れた拍子）が見られる。ドラムは、第一の波(エモコア)では激しく、シンバルを多用する。第二の波以降は、インディー・ロックやマス・ロックに寄り、「より穏やかなエモ」とも評される。

歌唱が最も特徴的だ。パンクの怒鳴り声を避け、息混じりのヘッド・ヴォイスで旋律的に歌い、音域の上限で張り詰める歌い方が典型である。絶叫を多用するのは、スクリーモなどの派生だ。音程が外れることも、表現として許容される。

歌詞は個人的・告白的で、失恋や不安などを扱うことが多い。

演奏は、地下室やVFWホールなどの小規模な会場で行われることが多かった。</p>
<h2>成り立ち</h2><p>舞台は、1980年代半ばの米国ワシントンD.C.だ。

当時この地のハードコア・パンクでは、ライブ会場での暴力が増えていた。1985年、この状況への内部からの反省として、Rites of SpringとEmbraceが最初期のエモ・バンドとして登場する。Beefeaterも、同じレヴォリューション・サマーを担った。この年はレボリューション・サマーと呼ばれる（Amy Pickeringが1985年夏に命名した）。

Rites of SpringのGuy Picciottoは、感情的という意味のエモーショナル・ハードコア、略してエモコアという呼称を嫌い続けた。しかし、名称は定着した。Ian MacKayeは1986年にJoe LallyおよびColin SearsとともにFugaziを結成し、低価格の入場料と自主運営を貫いた。Guy Picciottoは、Fugazi結成後に正式メンバーとして加入した。

1990年代前半から中盤にかけて、第二の波が起きる。中心は米国中西部だが、西海岸のシアトルにも広がった。イリノイ州のCap'n Jazz、カンザスシティ(ミズーリ州側とされる)のThe Get Up Kids、ニューヨークで結成し、のちカリフォルニアを拠点としたJawbreaker、そしてワシントン州シアトルのSunny Day Real Estateが、より旋律的で内省的な音を作った。とりわけSunny Day Real Estateの1994年のDiaryは、この時期の代表作とされる。

The Promise Ringは1990年代末、Jimmy Eat Worldは2001年の『Bleed American』で、ポップ寄りになった。

2000年代前半、第三の波として商業的な大成功が訪れる。Dashboard ConfessionalのChris Carrabbaが、アコースティック・ギターによる告白的な歌で人気を得た。続いてMy Chemical Romance、Fall Out Boy、Panic! at the Discoが、演劇的な演出と派手な外見を伴って上位に入った（エモと呼ばれることがあるが、My Chemical RomanceとPanic! at the Discoは（2000年代当時）その呼び名を拒み、Fall Out Boyは主にポップ・パンクと分類される）。

この時期、黒い髪と細身のジーンズという外見が、若者文化のトレードマークとなった。英Daily Mailなどの報道機関は、これを自傷や自殺と結び付けて報じた。この感情をあおるような報道は、当事者から強く反発された。

2000年代後半に始まり2010年代に広がったエモ・リヴァイヴァル（復活）は、1990年代のエモを参照した音を志向した。2014年には、American FootballやMineralの再結成も相次いだ。</p>
