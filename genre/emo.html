<h1>Emo（エモ）とは</h1>
<p>ハードコア・パンクから生まれ、感情の吐露を主題に据えた様式。第一の波ではハードコアの編成と音量を引き継いだが、第二の波以降はより穏やかな方向へ移った。ギターは歪ませたパワー・コード（二つの音だけの力強い和音）と、コーラス（音に厚み</p>
<p>ハードコア・パンクから生まれ、感情の吐露を主題に据えた様式。第一の波ではハードコアの編成と音量を引き継いだが、第二の波以降はより穏やかな方向へ移った。ギターは歪ませたパワー・コード（二つの音だけの力強い和音）と、コーラス（音に厚みを出す効果）やディレイ（音を遅らせて繰り返す効果）をかけた澄んだアルペジオ（和音を一音ずつ順に弾く奏法）を対比させ、この静と動の落差が曲の構造を作る。特徴的なのは和声（コードの響き）で、第二の波(その中核は中西部のミッドウェスト・エモ)では、和音を一音ずつ順に弾くアルペジオと、開放的な響きの和音(maj7、add9、sus2、sus4など)が多用される。この宙吊りの響きが、解決しない感情を音として表す。BPM（1分間の拍数）は中庸から速めで、拍子は4分の4が基本だが、第二の波では、マス・ロック的な要素や変拍子（定型から外れた拍子）が見られる。ドラムは第一の波では激しく、シンバルを多用する。歌唱が最も特徴的で、パンクの怒鳴り声を避け、平坦な語りから震える裏声までが一曲の中で切り替わる旋律的な歌い方が基本であり、音程が外れることも表現として許容される（絶叫を多用するのはスクリーモなどの派生）。歌詞は自己嫌悪、失恋、孤独、家族との断絶、そして生きづらさを、個人的・告白的な一人称の言葉で綴ることが多い。演奏は小規模な会場で行われ、聴衆と至近距離で感情を共有する場として設計されている。</p>
<h2>成り立ち</h2><p>1980年代半ばの米国ワシントンD.C.で生まれた。当時この地のハードコア・パンクでは、ライブ会場での暴力が増えていた。1985年、この状況への内部からの反省として、Rites of SpringやEmbraceといったDischordのバンドが、個人的な感情を歌詞に持ち込んだ（同じDischordのBeefeaterも同じ時期に活動した）。この年はレボリューション・サマーと呼ばれる（Amy Pickeringが1985年夏に命名した）。Rites of SpringのGuy Picciottoは、感情的という意味のエモーショナル・ハードコア、略してエモコアという呼称を嫌い続けたが、名称は定着した。Ian MacKayeは1986年にJoe LallyおよびColin SearsとともにFugaziを結成し、低価格の入場料と自主運営を貫いた。Guy PicciottoはFugazi結成後に正式メンバーとして加入した。1990年代前半から中盤にかけて第二の波が起きる。中西部のミッドウェスト・エモがその中核だが、米国各地に広がった。イリノイ州のCap'n Jazz、ミズーリ州カンザスシティのThe Get Up Kids、カリフォルニア州のJawbreaker、そしてワシントン州シアトルのSunny Day Real Estateが、より旋律的で内省的な音を作った。とりわけSunny Day Real Estateの1994年のDiaryは、この時期の代表作とされる。1990年代末にはThe Promise Ringが、2001年にはJimmy Eat Worldが、ポップスの構造へ接近した。2000年代前半、第三の波として商業的な大成功が訪れる。Dashboard ConfessionalのChris Carrabbaがアコースティック・ギターによる告白的な歌で人気を得て、続いてMy Chemical Romance、Fall Out Boy、Panic! at the Discoが、演劇的な演出と派手な外見を伴って上位に入った（エモと呼ばれることがあるが、My Chemical RomanceとPanic! at the Discoはその呼び名を拒み、Fall Out Boyは主にポップ・パンクと分類される）。この時期、黒い髪と細身のジーンズという外見が若者文化の象徴となり、報道機関はこれを自傷や自殺と結び付けて報じた。この感情をあおるような報道は当事者から強く反発された。2000年代後半に始まり2010年代に広がったエモ・リヴァイヴァル（復活）は、1990年代のエモを参照した音を志向し、2014年にはAmerican FootballやMineralの再結成も相次いだ。</p>
