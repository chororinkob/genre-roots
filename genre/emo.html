<h1>Emo（エモ）とは</h1>
<p>ハードコア・パンクの編成と音量を用いながら、感情の吐露を主題に据えた様式。ギターは歪ませたパワー・コードと、コーラスやディレイをかけた澄んだアルペジオを対比させ、この静と動の落差が曲の構造を作る。特徴的なのは和声で、通常のロックが</p>
<p>ハードコア・パンクの編成と音量を用いながら、感情の吐露を主題に据えた様式。ギターは歪ませたパワー・コードと、コーラスやディレイをかけた澄んだアルペジオを対比させ、この静と動の落差が曲の構造を作る。特徴的なのは和声で、通常のロックが避ける不安定な響き、たとえば開放弦を残したまま押さえる位置を変えることで生じる濁った和音、いわゆるオープン・コード・ヴォイシングが多用される。この宙吊りの響きが、解決しない感情を音として表す。BPMは中庸から速めで、拍子は四分の四が基本だが、初期の系統では変拍子や急なテンポ変化も見られる。ドラムは激しく、シンバルを多用する。歌唱が最も特徴的で、平坦な語りから震える裏声、そして喉を潰した絶叫までが一曲の中で切り替わり、音程が外れることも表現として許容される。歌詞は自己嫌悪、失恋、孤独、家族との断絶、そして生きづらさを、比喩を排した一人称の言葉で綴る。演奏は小規模な会場で行われ、聴衆と至近距離で感情を共有する場として設計されている。</p>
<h2>成り立ち</h2><p>1980年代半ばの米国ワシントンD.C.で生まれた。当時この地のハードコア・パンクは、レーベルDischordとIan MacKayeを中心に、暴力的な男性性と硬直した規範に陥っていた。1985年、この状況への内部からの反省として、Rites of Spring、Embrace、Beefeater といったバンドが、個人的な感情を歌詞に持ち込んだ。この年は後にレボリューション・サマーと呼ばれる。Rites of SpringのGuy Picciottoは、感情的という意味のエモーショナル・ハードコア、略してエモコアという呼称を嫌い続けたが、名称は定着した。彼とIan MacKayeは1987年にFugaziを結成し、低価格の入場料と自主運営を貫いた。1990年代前半、この感性は米国中西部へ移り、第二の波が起きる。イリノイ州のCap'n Jazz、カンザス州のThe Get Up Kids、カリフォルニア州のJawbreakerとSunny Day Real Estateが、より旋律的で内省的な音を作った。とりわけSunny Day Real Estateの1994年のDiaryは、この時期の代表作とされる。1990年代末にはJimmy Eat WorldとThe Promise Ringが、ポップスの構造へ接近した。2000年代前半、第三の波として商業的な大成功が訪れる。Dashboard ConfessionalのChris Carrabbaがアコースティック・ギターによる告白的な歌で人気を得て、続いてMy Chemical Romance、Fall Out Boy、Panic! at the Discoが、演劇的な演出と派手な外見を伴ってチャートを制した。この時期、黒い髪と細身のジーンズという外見が若者文化の記号となり、報道機関はこれを自傷や自殺と結び付けて報じた。この扇情的な報道は当事者から強く反発された。2010年代半ばには、より原点に近い音を志向するエモ・リヴァイヴァルが起き、American FootballやMineralの再結成も相次いだ。</p>
<h2>代表曲</h2><ul><li>Welcome to the Black Parade (My Chemical Romance)</li><li>Sugar, We're Goin Down (Fall Out Boy)</li><li>I Write Sins Not Tragedies (Panic! At The Disco)</li><li>The Taste of Ink (The Used)</li><li>Cute Without the 'E' (Taking Back Sunday)</li></ul>
