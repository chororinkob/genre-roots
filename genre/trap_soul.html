<h1>Trap Soul（トラップソウル）とは</h1>
<p>トラップ・ソウルは、トラップの打ち込みビートの上で、R&amp;Bのなめらかな歌を聴かせる2010年代半ばのスタイルだ。 土台は、Roland TR-808由来の長く伸びる低音である。音程を滑らせるスライドによって、メロディーを奏でる楽器</p>
<p>トラップ・ソウルは、トラップの打ち込みビートの上で、R&amp;Bのなめらかな歌を聴かせる2010年代半ばのスタイルだ。

土台は、Roland TR-808由来の長く伸びる低音である。音程を滑らせるスライドによって、メロディーを奏でる楽器のように働く。上物は、減衰の長いピアノやベル、ぼやけたシンセのパッドだ。和音は、短調の簡素なコード進行を静かにくり返す。

ハイハットは、16分から32分、時に3連符へ細かく分けた高速な連打（ロール）を刻む。スネアやクラップは3拍目に置かれ、ハーフタイムの感覚を作る。テンポも、ハーフタイム感のあるゆったりしたものだ。

歌い方は、オートチューンで音程を補正した、囁くような歌声と早口のラップの中間を行き来する。同じ声を何重にも重ねて、霧のような厚みを作る。

歌詞は、恋愛関係の不信や孤独など、内省的なテーマが目立つ。その一方で、野心や実績の誇示も含まれる。

ミックスは全体を暗くし、低音を過剰なほど強調する。上物には深い残響をかけて、距離感を出す。ソウル由来の温かい歌唱を軸にした従来のR&amp;Bに対し、こちらは電子的な冷たさと空虚さを美点とする、と評されることもある。</p>
<h2>成り立ち</h2><p>トラップ・ソウルの起源には、諸説ある。2014年は、Tillerの「Don't」が登場し、このスタイルが目に見える形になった年だ。そこから、呼称が定着した2015年にかけて、アメリカ南部のトラップと、カナダ・トロント発の内省的なR&amp;Bが交わる場所で形になった。

素材は、2010年代前半にすでにそろっていた。前提になったのは、2011年にThe Weekndが無料で公開した「House of Balloons」である。この作品は、薬物と性の荒廃を、暗く残響の深い音で描いた。そして、R&amp;Bが誘惑や祝祭ではなく、虚無を歌えることを示したと評される。

同じトロントでは、Drakeと、その専属の録音技師で制作者でもある40（本名Noah Shebib）が、こもった低音と広い残響を特徴とする音作りを固めた。彼らは2011年の「Take Care」で、その音を大衆に広める。

一方アトランタでは、Futureが、オートチューンを補正の道具ではなく、歪んだ質感を得るための楽器として使う歌い方を切り開いた一人とされる。こうして、歌とラップの境界を溶かしていった。

この二つの流れを一つのスタイルとして広めたのが、ケンタッキー州ルイヴィル出身のBryson Tillerである。彼は2014年10月にSoundCloudへ投稿した「Don't」で話題になった。2015年に出したデビュー・アルバム「T R A P S O U L」の題名は、ジャンルの呼称を広め、定着させた。

これより先に、PARTYNEXTDOORが、DrakeのレーベルOVO Soundから作品を出していた。契約は2013年である。続いて6LACKや、OVO Soundのdvsnらが同じ傾向の作品を出した。こうして2015年から2017年にかけて、この音楽は主流の一角を占めたとされる。

制作の面では、トラップの制作者も歌ものに関わった。たとえばSouthsideは、2016年の6LACKの「Free 6lack」で1曲を手がけた。Metro Boominは、The Weekndの2020年の作品にも参加している。

流通の面では、SoundCloudという無料の投稿の場が、大きな役割を果たした。レコード会社を通さずに音源を公開し、そこから契約に至る道が一般的になった。多くの作り手が、この道筋で登場したとされる。

2019年には、Summer Walkerがデビュー・アルバム「Over It」で大ヒットした。ただし、そのジャンル表記はR&amp;Bで、トラップ・ソウルに入れるかは見方が分かれる。以後この音楽は、「オルタナティヴR&amp;B」というより広い呼称に吸収されていったとされる。それでも、その音の作り方は、現代R&amp;Bの音作りに大きな影響を与えた。</p>
<h2>代表曲</h2><ul><li>Often (The Weeknd)</li><li>PRBLMS (6LACK)</li><li>Girls Need Love (Summer Walker)</li><li>Playing Games (Summer Walker)</li><li>Come and See Me (PARTYNEXTDOOR)</li><li>Dead Man Walking (Brent Faiyaz)</li><li>Sorry Not Sorry (Bryson Tiller)</li><li>Clouded (Brent Faiyaz)</li><li>Rambo (Bryson Tiller)</li><li>Ex Calling (6LACK)</li></ul>
