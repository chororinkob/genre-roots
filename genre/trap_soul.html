<h1>Trap Soul（トラップソウル）とは</h1>
<p>トラップの打ち込みビートの上で、R&amp;Bの滑らかな歌唱を聴かせる2010年代半ばの様式。土台はRoland TR-808由来の長く伸びる低音で、音程を滑らせるスライドによって旋律楽器のように機能する。ハイハットは16分から32分、時</p>
<p>トラップの打ち込みビートの上で、R&amp;Bの滑らかな歌唱を聴かせる2010年代半ばの様式。土台はRoland TR-808由来の長く伸びる低音で、音程を滑らせるスライドによって旋律楽器のように機能する。ハイハットは16分から32分、時に3連符へ細かく分割される高速な連打（ロール）を刻み、スネアやクラップは3拍目に置かれるハーフタイムの感覚を作る。表記上のテンポは130〜145BPMだが、体感はその半分でゆったりしている。上物は減衰の長いピアノやベル、ぼやけたシンセのパッドで、和声は短調の四つのコードを静かに循環させる。歌唱はオートチューンで音程を補正した、囁くように歌う声と早口のラップの中間を行き来し、同じ声を何重にも重ねて霧のような厚みを作る。歌詞は誇示ではなく、報われない関係、疑心、孤独、夜の車中といった内向きの場面を扱うことが多い。ミックスは全体を暗く、低音を過剰なほど強調し、上物には深い残響をかけて距離感を出す。従来のR&amp;Bが生演奏の温かさで聴かせたのに対し、こちらは電子的な冷たさと空虚さを美点とする点が違う。</p>
<h2>成り立ち</h2><p>2010年代前半、アメリカ南部のトラップと、カナダ・トロント発の内省的なR&amp;Bが交わる場所で生まれた。前提となったのは、2011年にThe Weekndが無料で公開した「House of Balloons」である。薬物と性の荒廃を、暗く残響の深い音響で描いたこの作品は、R&amp;Bが誘惑や祝祭ではなく虚無を歌えることを示した。同じトロントでは、Drakeと、その専属の録音技師で制作者でもある40（本名Noah Shebib）が、こもった低音と広い残響を特徴とする音作りを確立し、2011年の「Take Care」で大衆化させる。並行してアトランタでは、FutureやYoung Thugがオートチューンを補正の道具ではなく歪んだ質感を得るための楽器として使い、歌とラップの境界を溶かしていった。この二つの流れを明確に一つの様式としてまとめたのが、ケンタッキー州ルイヴィル出身のBryson Tillerである。彼はSoundCloudに投稿した「Don't」が話題となり、2015年に発表したアルバムの題名「T R A P S O U L」がそのままジャンルの呼称になった。同時期にPARTYNEXTDOORがDrakeのレーベルOVO Soundから、6LACKやdvsn、Jhené Aikoらが各所から同傾向の作品を出し、2015年から2017年にかけて主流の一角を占める。制作面ではMetro Boomin、Southside、Wheezyといったトラップの制作者が歌モノにも関与し、808のスライドとハイハットのロールという語彙を共通言語にした。流通の側では、SoundCloudという無料の投稿場が決定的な役割を果たした。レコード会社を通さずに音源を公開し、そこから契約に至るという経路が一般化し、多くの作り手がこの道筋で登場している。2019年前後にはSummer Walkerがこの様式で商業的な頂点を作り、以後は「オルタナティヴR&amp;B」というより広い呼称に吸収されつつも、その音の設計は現在のR&amp;Bの標準であり続けている。</p>
<h2>代表曲</h2><ul><li>Bryson Tiller - Don't</li><li>The Weeknd - The Hills</li><li>6LACK - PRBLMS</li><li>Summer Walker - Playing Games</li><li>Brent Faiyaz - Dead Man Walking</li></ul>
