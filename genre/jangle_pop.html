<h1>Jangle Pop（ジャングルポップ）とは</h1>
<p>澄んで揺れる高音のギターの響き——ジャングルと呼ばれる音——を中心に据えたギターポップ。要になるのはRickenbackerの12弦エレキギターで、二本一組に張られた弦がわずかにずれて鳴ることで、鈴のように細かく揺れる残響が生まれ</p>
<p>澄んで揺れる高音のギターの響き——ジャングルと呼ばれる音——を中心に据えたギターポップ。要になるのはRickenbackerの12弦エレキギターで、二本一組に張られた弦がわずかにずれて鳴ることで、鈴のように細かく揺れる残響が生まれる。これに軽いコンプレッサーとコーラスをかけ、歪ませずに明るい音のまま鳴らす。奏法は和音をかき鳴らすストロークと、弦を一本ずつ弾くアルペジオを織り交ぜ、コード進行の中で内声が動いていく作りが好まれる。ベースは旋律的に動き、ドラムは装飾を抑えた素直な8ビート。テンポは120〜150BPM。和声は長調が基調で、Byrds由来の開放弦を含むフォーク的な響きや、途中で短調へ寄る翳りが特徴になる。歌唱は絶叫せず穏やかで、二声または三声のコーラスを重ねる。歌詞は青春の焦燥、片思い、退屈な町、文学や映画への言及など、内向的で言葉数の多いものが多い。パワーポップと編成は近いが、あちらが太く歪んだ音と直球のフックを取るのに対し、こちらは細く澄んだ響きと余韻を重んじる点で違う。</p>
<h2>成り立ち</h2><p>音の原型は1965年にさかのぼる。アメリカのThe ByrdsのRoger McGuinnが、映画で見たThe Beatlesに触発してRickenbacker 360/12という12弦エレキギターを手に入れ、「Mr. Tambourine Man」で使ったことがすべての出発点になった。1970年代にはメンフィスのBig Starが、この響きに切実な歌を乗せた作品を残しながら商業的には完全に失敗し、後年になって再評価される。ジャングル・ポップという呼称が使われ始めたのは1980年代前半である。ジョージア州アセンズという大学町で1980年に結成されたR.E.M.は、Peter Buckのアルペジオと、Michael Stipeの聞き取りにくい歌を組み合わせ、1983年のアルバム「Murmur」で決定的な型を示した。同じ頃ノースカロライナではMitch Easterが率いるLet's ActiveとThe dB'sが、ロサンゼルスではThe Dream SyndicateやRain Paradeによる、1960年代の音を掘り返すペイズリー・アンダーグラウンドと呼ばれる動きが並行して起きる。これらはアメリカの大学ラジオ局を通じて広まり、のちにオルタナティヴ・ロックと呼ばれる市場の基礎を作った。イギリスとスコットランドでは別系統が育った。1980年にグラスゴーのPostcard Recordsから出たOrange Juiceが、パンクの攻撃性を捨てて軽やかなギターと甘い声を選び、Aztec Cameraが続く。1983年に登場したマンチェスターのThe Smithsでは、Johnny Marrが多重録音を駆使して細かく編み込んだギターを聴かせ、この様式の到達点となった。1986年、音楽誌NMEが自主制作の若いバンドを集めて出したカセット「C86」は、この系統の英国側を象徴する記録として残っている。1990年代にはスコットランドのTeenage Fanclub、ニュージーランドのFlying Nunレーベル勢が受け継ぎ、2000年代以降もThe Pains of Being Pure at HeartやReal Estateといったバンドが同じ響きを更新し続けている。</p>
<h2>代表曲</h2><ul><li>Radio Free Europe（R.E.M.）</li><li>There She Goes（The La's）</li><li>Cattle and Cane（The Go-Betweens）</li><li>This Charming Man（The Smiths）</li><li>Bandwagonesque（Teenage Fanclub）</li></ul>
