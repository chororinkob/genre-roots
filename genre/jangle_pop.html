<h1>Jangle Pop（ジャングルポップ）とは</h1>
<p>ジャングル・ポップは、澄んで揺れる高音のギターの響きを中心に据えたギターポップだ。この響きは「ジャングル」と呼ばれる。 中心になる楽器はギターである。12弦エレキギター（Rickenbackerなど）がよく使われる。2本一組に張ら</p>
<p>ジャングル・ポップは、澄んで揺れる高音のギターの響きを中心に据えたギターポップだ。この響きは「ジャングル」と呼ばれる。

中心になる楽器はギターである。12弦エレキギター（Rickenbackerなど）がよく使われる。2本一組に張られた弦がわずかにずれて鳴るため、鈴のように細かく揺れる残響が生まれる。多くの場合、これに軽いコンプレッサー（音量の差をならす装置）とコーラス（音に厚みを出す効果）をかけ、歪ませずに明るい音のまま鳴らす。

奏法は、和音をかき鳴らすストロークと、弦を1本ずつ弾くアルペジオ（和音を一音ずつ弾く奏法）を織り交ぜる。コード進行の中で、内側の声（中間の音）が動いていく作りが好まれる。和声（コードの響き）は長調が基調である。Byrds由来の開放弦（押さえずに鳴らす弦）を含むフォーク的な響きや、途中で短調へ寄る翳りが特徴になる。

リズムの面では、ベースは旋律的に動く。ドラムは装飾を抑えた素直な8ビートである。

歌唱は絶叫せず、穏やかだ。2声または3声のコーラスを重ねる。歌詞は謎めいたものが多い。

パワーポップとは編成が近い。ただ、パワーポップはより硬質で力強い傾向があり、ジャングルポップは澄んだ響きを重視する傾向がある。</p>
<h2>成り立ち</h2><p>音の原型は、1960年代半ばにさかのぼる。12弦エレキギターの響きは、1964年にThe BeatlesのGeorge Harrisonが先に録音で使っていた。その後、アメリカのThe ByrdsのRoger McGuinnが、映画で見たThe Beatlesに触発され、Rickenbacker 360/12という12弦エレキギターを手に入れた。彼が「Mr. Tambourine Man」で使ったことが、この音を広く知らしめた。

1970年代には、メンフィスのBig Starが、この響きに切実な歌を乗せた作品を残した。しかし商業的には成功せず、後年になって再評価される。

ジャングル・ポップという呼称は、1980年代前半から半ばに、アメリカのポストパンク系の動きを指すラベルとして現れた。ジョージア州アセンズという大学町で、1980年にR.E.M.が結成された。Peter Buckのアルペジオと、Michael Stipeの聞き取りにくい歌を組み合わせ、1983年のアルバム「Murmur」で決定的な型を示した。同じ頃、ノースカロライナではMitch Easterが率いるLet's Activeが活動した。ニューヨークでは、ノースカロライナ出身者を中心とするThe dB'sが活動した。ロサンゼルスでは、The Dream SyndicateやRain Paradeによる動きが並行して起きる。1960年代の音を掘り返すペイズリー・アンダーグラウンド（1960年代風のサイケな音を掘り返す動き）と呼ばれる動きである。これらは大学ラジオ（カレッジ・ロック）で支持され、のちのオルタナティヴ・ロックの前史となった。

一方、イングランドとスコットランドでは別系統が育った。1980年、グラスゴーのPostcard Recordsから出たOrange Juiceが、パンクの攻撃性を捨てて、軽やかなギターと甘い声を選んだ。Aztec Cameraが続く。1982年に結成され、1983年にシングルを出したマンチェスターのThe Smithsでは、Johnny Marrが多重録音を駆使して、細かく編み込んだギターを聴かせた。ジャングリーなギターを、多重録音で発展させた代表例の一つとなった。

1986年、音楽誌NMEが各レーベルから音源の提供を受け、若いバンドを集めた。出されたカセットが「C86」である。その名前が、のちに英国のジャングリーなギターポップの代名詞になった。

ニュージーランドでは、1981年設立のFlying Nunレーベル勢が、同時代に独自のギターポップを育てた。1990年代にはスコットランドのTeenage Fanclubが受け継いだ。2000年代以降も、Real Estateのようなバンドが響きを受け継ぐ。</p>
<h2>代表曲</h2><ul><li>This Charming Man（The Smiths）</li><li>How Soon Is Now? (The Smiths)</li><li>There She Goes（The La's）</li><li>Bigmouth Strikes Again (The Smiths)</li><li>Fall On Me (R.E.M.)</li><li>So. Central Rain (R.E.M.)</li><li>Radio Free Europe（R.E.M.）</li><li>Eight Miles High (The Byrds)</li><li>Everything Flows (Teenage Fanclub)</li><li>Cattle and Cane（The Go-Betweens）</li><li>(Don't Go Back To) Rockville (R.E.M.)</li><li>Streets of Your Town (The Go-Betweens)</li></ul>
