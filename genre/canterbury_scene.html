<h1>Canterbury Scene（カンタベリーシーン）とは</h1>
<p>イギリス南部の一都市を中心に生まれた、ジャズの和声とサイケデリックな幻想を穏やかに接続したプログレッシブ・ロック。まず音色が独特で、鍵盤にはハモンドオルガンをファズで歪ませた、ジャリジャリと割れながらも柔らかい音が多用され、これが</p>
<p>イギリス南部の一都市を中心に生まれた、ジャズの和声とサイケデリックな幻想を穏やかに接続したプログレッシブ・ロック。まず音色が独特で、鍵盤にはハモンドオルガンをファズで歪ませた、ジャリジャリと割れながらも柔らかい音が多用され、これがこのシーンの署名になっている。フルートやソプラノサックスが加わることも多く、金管の厚みよりも木管の細い線が好まれる。和声はジャズ由来で、長七度や増四度を含む浮遊した和音が並び、明確な調が定まらないまま曲が進む。拍子は七拍子や11拍子といった変拍子が頻繁に現れるが、力任せに押し込むのではなく、聴き手が気づかないほど自然に流れていく点が特徴である。曲の構成は組曲的で、10分を超える曲が場面を変えながら展開し、途中に長い集団即興が挟まれる。歌唱は張り上げず、ささやくように淡々と歌われ、英国的な穏やかさを保つ。歌詞にもこのシーンらしさが強く出ており、深刻な哲学よりも言葉遊び、皮肉、脱力した不条理、日常のばかばかしさが好まれる。同じ時代のプログレでも、荘厳さと壮大さを目指した路線とは対照的に、こちらは軽やかで人を食った表情を崩さない。</p>
<h2>成り立ち</h2><p>起点は1963年、イングランド南東部ケント州カンタベリーで結成されたThe Wilde Flowersである。このバンド自体は録音を残さないまま解散したが、在籍したRobert Wyatt、Kevin Ayers、Hugh Hopper、Richard Sinclair、Pye Hastingsといった面々が、以後のすべての流れの源になった。1966年、Robert WyattとKevin Ayers、オーストラリア出身のDaevid Allen、鍵盤のMike Ratledgeが Soft Machineを結成する。名はWilliam S. Burroughsの小説から取られ、ロンドンのUFOクラブでPink Floydと並んでサイケデリック文化の中心となった。彼らは1968年にJimi Hendrixの全米ツアーに前座として同行し、その過酷な日程でバンドは疲弊するが、以後ジャズ寄りに大きく舵を切り、『Third』(1970)では一曲が片面すべてを占める構成に至った。同じくWilde Flowers出身のPye Hastingsらは1968年にCaravanを結成し、『In the Land of Grey and Pink』(1971)で、より歌ものに寄った柔らかい方向を示した。Daevid Allenはビザの問題で英国に戻れずフランスに残り、そこでGongを作って神話的で滑稽な世界を築いた。Robert Wyattは1973年、酒に酔って四階の窓から転落し脊髄を損傷、下半身不随となる。彼はドラムを叩けなくなったが、翌年、車椅子から歌とキーボードだけで『Rock Bottom』を作り上げ、この作品は英国ロックの最高峰のひとつと評される。Hatfield and the North、National Health、Egg、Matching Moleといったバンドが人脈を組み替えながら現れ、その系譜は日本のバンドや、後年のポストロックにまで及んでいる。なお当事者たちはカンタベリー派という呼び名を後付けの分類だとして繰り返し否定してきた。</p>
<h2>代表曲</h2><ul><li>Moon in June（Soft Machine）</li><li>In the Land of Grey and Pink（Caravan）</li><li>The Yes No Interlude（Hatfield and the North）</li><li>Aftaglid（Gong）</li></ul>
