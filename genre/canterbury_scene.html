<h1>Canterbury Scene（カンタベリーシーン）とは</h1>
<p>この音楽は、イギリス南部の一都市を中心に生まれたプログレッシブ・ロックである。ジャズの和声と、サイケデリックで幻想的な雰囲気を、穏やかに結びつけている。 まず音色が独特だ。鍵盤では、ファズで歪ませたオルガンの音が多用される。ジャリ</p>
<p>この音楽は、イギリス南部の一都市を中心に生まれたプログレッシブ・ロックである。ジャズの和声と、サイケデリックで幻想的な雰囲気を、穏やかに結びつけている。

まず音色が独特だ。鍵盤では、ファズで歪ませたオルガンの音が多用される。ジャリジャリと割れながらも柔らかいこの音が、このシーンの目印になっている。トレードマークとなったMike Ratledgeの音は、Lowreyのオルガンにファズボックスをかけたものだ。ハモンドにファズをかけた音は、Dave SinclairやDave Stewartが出していたとされる。フルートやサックスなど、管楽器が加わることもある。

和音はジャズ由来の複雑なものだ。長い即興と、キャッチーな歌ものを書こうとする志向がある。その間の緊張関係が、このシーンの中心にあるといわれる。

拍子は、7拍子や11拍子といった変拍子がしばしば現れる。ただし、力任せに押し込むのではない。聴き手が気づかないほど自然に流れていく点が特徴とされる。

歌は張り上げず、淡々と歌われる。英国らしい穏やかさを保っている。

歌詞にも、このシーンらしさが強く出ている。深刻な哲学よりも、言葉遊び、皮肉、脱力した不条理、日常のばかばかしさが好まれる。

曲の組み立ては組曲のようだ。『Third』のように、10分を超える曲が場面を変えながら展開し、途中にソロ回しを含む、ジャズ由来の長い即興が挟まれる。同じ時代のプログレッシブ・ロックでも、荘厳さと壮大さを目指した路線とは対照的だ。こちらは軽やかで、人を食った表情を崩さない。</p>
<h2>成り立ち</h2><p>前史とされるのは、イングランド南東部ケント州カンタベリーで、1963〜64年（諸説ある）に結成されたThe Wilde Flowersだ。

このバンドは、存続中に公式リリースを残さなかった。それでも1965〜66年や1969年のデモ録音が残り、1994年に初めて発売された。在籍したのは、Robert Wyatt、Kevin Ayers、Hugh Hopper、Richard Sinclair、Pye Hastingsといった面々だ。彼らが、多くのバンドのもとになったとされる。

1966年、Soft Machineが結成され、ここからシーンが形になった。中心となったのは、Robert WyattとKevin Ayers、オーストラリア出身のDaevid Allen、鍵盤のMike Ratledgeである。バンド名はWilliam S. Burroughsの小説から取られた。彼らはロンドンのUFOクラブで、Pink Floydと並ぶ主要な専属バンドの一つとなった。

1968年中には、Jimi Hendrixの2回の北米ツアーに前座として同行した。9月のツアー終了後、Kevin Ayersが脱退し、バンドはいったん解散する。しかし12月、Robert WyattとMike RatledgeがHugh Hopperを加えて再結成した。1969年録音の『Volume Two』から、ジャズ・フュージョン寄りへの転換が始まる。そして『Third』(1970)では、一曲が片面すべてを占める構成に至った。

一方、同じくWilde Flowers出身のPye Hastingsらは、1968年にCaravanを結成した。『In the Land of Grey and Pink』(1971)では、より歌ものに寄った柔らかい方向を示した。Daevid Allenはビザの問題で英国に戻れず、フランスに残った。そこでGongを作り、神話的で滑稽な世界を築いた。

1973年、Robert Wyattは酒に酔って四階の窓から転落した。脊髄を損傷し、下半身不随となる。ドラムは叩けなくなった。それでも翌年、『Rock Bottom』を作り上げる。中心は、事故前の1973年初めにヴェニスで書かれた曲だった。Mike Oldfield、Fred Frith、Hugh Hopper、Richard Sinclairら、多数の参加者を迎えた。この作品は、英国ロックの最高峰のひとつと評される。

『Rock Bottom』以前から以後にかけて、Egg(1968)、Matching Mole(1971)、Hatfield and the North(1972)、National Health(1975)と、バンドが人脈を組み替えながら次々に現れた。その系譜は後年にも及び、21世紀にはSyd Arthurのようなバンドも現れた。

なお一部の当事者は、カンタベリー派という呼び名に違和感を表している。「かなり人工的なラベル」と述べつつ、構わないと言ったのはHugh Hopperである。Robert Wyatt本人は、自分にはカンタベリー出身という意識がなく、この呼称が自分を指すとは思っていなかったと述べている。Dave Stewartは、名称に不満を述べた。</p>
<h2>代表曲</h2><ul><li>Moon in June（Soft Machine）</li><li>In the Land of Grey and Pink（Caravan）</li><li>Winter Wine (Caravan)</li><li>Love to Love You (And Tonight Pigs Will Fly) (Caravan)</li><li>Alifib (Robert Wyatt)</li><li>Fugue in D Minor (Egg)</li><li>Golf Girl (Caravan)</li><li>The Yes No Interlude（Hatfield and the North）</li><li>Out-Bloody-Rageous (Soft Machine)</li><li>Signed Curtain (Matching Mole)</li><li>Aftaglid（Gong）</li></ul>
