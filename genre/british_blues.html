<h1>British Blues（ブリティッシュブルース）とは</h1>
<p>1950年代後半のイギリスで、アメリカの黒人のブルースを、若い世代を含む白人の演奏者が再現しようとしたことから始まった音楽だ。1960年代に人気の頂点を迎えた。 編成はギター、ハーモニカ、ピアノ、ベース、ドラムが基本だ。原曲に忠実</p>
<p>1950年代後半のイギリスで、アメリカの黒人のブルースを、若い世代を含む白人の演奏者が再現しようとしたことから始まった音楽だ。1960年代に人気の頂点を迎えた。

編成はギター、ハーモニカ、ピアノ、ベース、ドラムが基本だ。原曲に忠実であろうとする姿勢が強い一方で、イギリスの演奏者は、音量をロックのような大音量の方向へさらに進めた。

決め手になったのはギターの音である。分厚い胴を持つギターを、Marshall製の真空管アンプの限界まで音量を上げて鳴らす。すると弦の一音が長く伸び、歪みながら続く音色が生まれた。歪んだギターの音そのものは、本場のシカゴ・ブルースにもあった。しかし、Les PaulをMarshallアンプで過入力にするこの組み合わせの音色は、イギリスで定着した。

弾き方は、アメリカの一音ずつのメロディーの線を受け継ぎつつ、速いフレーズが目立った。多くの曲で12小節ブルースが使われた。

歌は本場の発声をまねる。

曲は原曲より長くなることが多く、即興の独奏に多くの時間が割かれる点も特徴とされる。</p>
<h2>成り立ち</h2><p>1950年代のイギリスでは、アメリカのブルースのレコードは、一部の熱心な収集家しか持たない、手に入りにくい品だった。

1958年、ジャズの楽団を率いるChris Barberが、シカゴのMuddy Watersを招いて公演を行った(英国ツアー)。ただし、聴衆の反応は一様ではなかった。

1961年、Alexis KornerとCyril DaviesがBlues Incorporatedを結成した。KornerとDaviesは、Watersの1958年の訪英を直接見聞きして影響を受けたとされる。一方で、直接の影響の大きさは断定できない、とする見方もある。1962年3月17日、KornerとDaviesは、Roundhouseから自分たちのブルース・クラブを、1959年開業のロンドンのEaling Jazz Clubへ移した。そこで定期的なR&amp;Bナイトを始めた。

この楽団は、驚くべき人材の通り道となった。後にCreamを結成するJack BruceとGinger Bakerは、Blues Incorporatedのメンバーだった。後にThe Rolling Stonesを結成するMick JaggerとBrian Jonesは、ファンとして出入りし、ときどき飛び入りで演奏した。

もう一つの拠点が、John Mayallの楽団である。彼のもとからは、Eric Clapton、Peter Green、Mick Taylorという3人のずば抜けたギタリストが、順に巣立った。Eric Claptonが参加し、1966年5月に録音、同年7月22日にリリースされた『Blues Breakers with Eric Clapton』は、Les PaulとMarshallアンプの組み合わせによる音を定着させた。批評家は、この作品がロック系のギターの発展に大きな影響を与えたとみなしている。

一方、この時期のシーンには、「本物にこだわる立場」をめぐる深刻な対立があった。ブルースは黒人の音楽であり、商業的な流行歌へ近づけるべきではない、という立場。そして、より広い聴衆を求める立場。両者がぶつかったのである。実際、Eric Claptonは、The Yardbirdsが売れ線の曲を出したことに反発して脱退している。

この運動には、良い面と悪い面の両方がある。イギリスでの人気は、アメリカでの評価や演奏の機会を高める一因になった。一方で、黒人の演奏者たちの曲が作曲者名を明記されずに録音され、作曲者表記をめぐる批判があり、後年には訴訟も起こされた(1985年のWillie Dixonによる、Led Zeppelinの「Whole Lotta Love」をめぐる訴訟は示談となった)。この構造は、今も批判的に検討され続けている。</p>
<h2>代表曲</h2><ul><li>I Can't Quit You Baby (Led Zeppelin)</li><li>Black Magic Woman (Fleetwood Mac)</li><li>Beck's Bolero (Jeff Beck)</li><li>All Your Love (John Mayall's Bluesbreakers)</li><li>Walking by Myself (Gary Moore)</li><li>Born Under a Bad Sign (Cream)</li><li>Spoonful (Cream)</li><li>Hideaway (John Mayall's Bluesbreakers)</li><li>Let Me Love You (Jeff Beck Group)</li><li>Shake Your Moneymaker (Fleetwood Mac)</li><li>Need Your Love So Bad (Fleetwood Mac)</li><li>Boom Boom (The Yardbirds)</li></ul>
