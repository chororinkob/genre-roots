<h1>British Blues（ブリティッシュブルース）とは</h1>
<p>1960年代のイギリスで、アメリカの黒人のブルースを若い白人の演奏者が再現しようとしたことから生まれた音楽である。編成はギター、ハーモニカ、ピアノ、ベース、ドラムを基本とし、原曲に忠実であろうとする姿勢が強い一方、演奏の音量と歪み</p>
<p>1960年代のイギリスで、アメリカの黒人のブルースを若い白人の演奏者が再現しようとしたことから生まれた音楽である。編成はギター、ハーモニカ、ピアノ、ベース、ドラムを基本とし、原曲に忠実であろうとする姿勢が強い一方、演奏の音量と歪みは本場を大きく上回った。これは録音技術と機材の差、そして踊りではなく聴くために演奏されたという条件による。決定的なのはギターの音である。分厚い胴を持つギターを、大出力の真空管アンプの限界まで音量を上げて鳴らすことで、弦の一音が長く伸び、歪みながら持続する音色が生まれた。この音は本場のブルースには存在せず、イギリスで発明されたものである。奏法はアメリカの単音主体の旋律線を継承しつつ、チョーキングによる音程の引き上げをより極端に行い、速く多くの音を弾く傾向が強い。リズムはシャッフルの跳ねた刻みが基本で、12小節の形式が守られる。歌唱は本場の発声を模倣するが、イギリス人が黒人の南部訛りを真似るという構図には常に無理があり、それが独自の緊張を生んだ。曲は原曲より長く、即興の独奏に多くの時間が割かれる点も特徴である。</p>
<h2>成り立ち</h2><p>1950年代のイギリスでは、アメリカのブルースのレコードは一部の熱心な収集家しか持たない稀少品だった。1958年、ジャズの楽団を率いるChris Barberが、シカゴのMuddy Watersを招いて公演を行ったことは決定的な事件となる。増幅されたギターの音量に当時の聴衆は困惑したが、若い演奏者たちには衝撃を与えた。1962年、Alexis KornerとCyril Daviesがロンドンでバンドを結成し、定期的な演奏の場を作った。この楽団は驚くべき人材の通過点となる。後にThe Rolling Stonesを結成するMick JaggerとBrian Jones、後にCreamを結成するJack BruceとGinger Bakerが、いずれもここで演奏していた。もう一つの結節点がJohn Mayallの楽団である。彼のもとからは、Eric Clapton、Peter Green、Mick Taylorという三人の傑出したギタリストが順に巣立った。1966年にEric Claptonが参加して録音された作品は、特定のギターとアンプの組み合わせによる音を確立し、以後の全てのブルース・ロックの音の基準となった。この時期のシーンには、純粋主義をめぐる深刻な対立があった。ブルースは黒人の音楽であり、商業的な流行歌へ近づけるべきではないという立場と、より広い聴衆を求める立場が衝突したのである。実際、Eric ClaptonはThe Yardbirdsが売れ線の楽曲を出したことに反発して脱退している。この運動には両義的な側面がある。イギリスの若者の熱意によって、アメリカ本国では忘れられていた黒人の演奏者たちが再発見され、演奏の機会と収入を得たことは事実である。一方で、彼らの楽曲が作曲者名を明記されずに録音され、莫大な利益が白人のバンドへ流れたという問題も存在し、後年になって複数の訴訟が起こされた。この構造は現在も批判的に検討され続けている。</p>
<h2>代表曲</h2><ul><li>All Your Love (John Mayall's Bluesbreakers)</li><li>I Can't Quit You Baby (Led Zeppelin)</li><li>Boom Boom (The Yardbirds)</li></ul>
