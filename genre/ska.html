<h1>Ska（スカ）とは</h1>
<p>ジャマイカで生まれた、裏拍を刻むことを最大の特徴とする踊りの音楽である。ギターまたはピアノが、一拍目と三拍目ではなく二拍目と四拍目に短く鋭い和音を叩きつけ、この裏返った刻みが全体を軽やかに跳ねさせる。奏法としては弦を押さえたまま素</p>
<p>ジャマイカで生まれた、裏拍を刻むことを最大の特徴とする踊りの音楽である。ギターまたはピアノが、一拍目と三拍目ではなく二拍目と四拍目に短く鋭い和音を叩きつけ、この裏返った刻みが全体を軽やかに跳ねさせる。奏法としては弦を押さえたまま素早く弾いて即座に消音するため、音が伸びず、打楽器のように機能する。低音はコントラバスまたはエレクトリックベースが担い、拍ごとに音を変えながら歩くように動く。ドラムはハイハットで細かく刻み、スネアを三拍目に落とす型が多い。テンポは概ね120から160 BPMと快活である。編成の華は管楽器で、トランペット、トロンボーン、サックスが揃い、斉奏で覚えやすい音型を吹く一方、曲の中盤では各奏者が順に即興の独奏を回す。この即興の作法はジャズから直接受け継がれたものである。和声は単純な三和音の循環が多く、長調が中心だが、短調の陰りを帯びた楽曲も少なくない。歌は明るく歌い上げるものから、語りに近いものまで幅がある。歌詞は恋愛、街の出来事、社会への風刺、そして不良少年への言及を扱う。後のロックステディやレゲエと比べると、テンポが速く、重心が高く、あくまで祝祭的である点が異なる。</p>
<h2>成り立ち</h2><p>1950年代のジャマイカでは、サウンドシステムと呼ばれる移動式の巨大な音響装置による野外の踊りの催しが娯楽の中心だった。運営者たちはアメリカ南部、とりわけニューオーリンズのラジオ放送を受信し、そこで流れるリズム・アンド・ブルースのレコードを競って買い付けた。他人と同じ盤を持たないことが商売上の武器だったため、盤面の情報を削って曲名を隠すという慣行まで生まれている。しかし1950年代末、アメリカ側の流行がロックンロールへ移り、望む種類のレコードが手に入らなくなると、運営者たちは自ら録音を始めた。Clement Doddが構えたStudio Oneと、Duke Reidが構えたTreasure Isleがその中心である。こうして生まれた自国産の音楽が、アメリカの型をなぞりながら、裏拍を強調するという独自の変形を得た。この変形の起源については、農村の音楽メントーの影響、演奏者の解釈違い、あるいは意図的な工夫など諸説あり定まっていない。1962年にジャマイカがイギリスから独立すると、この新しい音楽は国家の高揚と結びついて一気に広まった。演奏を支えたのはThe Skatalitesという楽団で、1964年に結成されたこの集団には、トロンボーンのDon Drummond、サックスのTommy McCookとRoland Alphonsoら、音楽学校で訓練を受けた名手が揃っていた。彼らは無数の録音に参加し、この音楽の水準を決定づけたが、栄光は短かった。1965年、Don Drummondは内縁の妻であった舞踊家Anita Mahfoodを刺殺し、精神病院に収容されたまま1969年に死亡している。楽団も程なく解散した。1966年頃には猛暑の影響とも言われる要因からテンポが落ち、ロックステディへ移行する。物語はそこで終わらなかった。1970年代末、イギリスのコヴェントリーでJerry Dammersが2 Toneというレーベルを立ち上げ、The Specialsをはじめとする人種混成のバンドが、白黒の市松模様を掲げてこの音楽を蘇らせた。当時のイギリスは極右政党の台頭と失業に揺れており、彼らの活動は明確な反人種差別の意思表示だった。さらに1990年代のアメリカでは、パンクと結合した第三の波が起こり、この音楽は世界的な広がりを得ている。</p>
