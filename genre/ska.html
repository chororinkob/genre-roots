<h1>Ska（スカ）とは</h1>
<p>スカは、ジャマイカで生まれた、裏拍を刻むことを最大の特徴とする踊りの音楽だ。 中心になるのは、裏拍の刻みである。ギターまたはピアノが、各拍の裏（オフビート、拍と拍の間）に、短く鋭い和音を叩きつける。この裏返った刻みが、全体を軽やか</p>
<p>スカは、ジャマイカで生まれた、裏拍を刻むことを最大の特徴とする踊りの音楽だ。

中心になるのは、裏拍の刻みである。ギターまたはピアノが、各拍の裏（オフビート、拍と拍の間）に、短く鋭い和音を叩きつける。この裏返った刻みが、全体を軽やかに跳ねさせる。奏法としては、弦を押さえたまま素早く弾いて、即座に消音するとされる。そのため音が伸びず、打楽器のように機能する。

低音は、コントラバスまたはエレクトリックベースが担う。拍ごとに音を変えながら、歩くように動く。

和声は、単純な基本の和音（三和音）の繰り返しが多い。長調が中心だが、短調の陰りを帯びた楽曲も少なくない。

ドラムは、バスドラムとスネア（クロススティック／サイドスティック）を2・4拍に置くのが一般的な解説だ。3拍目に重心を置く説明もある。テンポは速く、快活である。

編成の華は、管楽器だ。トランペット、トロンボーン、サックスが揃う。ホーン群が同じリフを吹く場面が多い一方、トロンボーンが主旋律で、他がハーモニーを付ける形もある。曲の中盤では、各奏者が順に即興の独奏を回す。この即興の作法は、ジャズの影響を強く受けている。

歌は、明るく歌い上げるものから、語りに近いものまで幅がある。歌詞は、恋愛、街の出来事、社会への風刺、そして不良少年への言及を扱うことが多い。

後のロックステディやレゲエと比べると、テンポが速く、重心が高い。あくまで祝祭的である点が異なる。</p>
<h2>成り立ち</h2><p>舞台は、1950年代のジャマイカだ。当時は、サウンドシステムと呼ばれる、移動式の巨大な音響装置による野外の踊りの催しが、娯楽の中心だったとされる。

運営者たちは、マイアミ・ナッシュビル・ニューオーリンズなど南部の局のラジオ放送を受信した。そこで流れるリズム・アンド・ブルースのレコードを、競って買い付けたのである。他人と同じ盤を持たないことが商売上の武器だったため、盤面の情報を削って曲名を隠す慣行まで生まれた。

しかし1950年代末、アメリカ側の流行がロックンロールへ移った。望む種類のレコードが手に入らなくなると、運営者たちは自ら録音を始める。Clement DoddやDuke Reidらは、他社スタジオで録音を始め、のちに自前のスタジオを構えた。Studio Oneは1963年、Treasure Isleは1960年代前半〜半ばである。

こうして生まれた自国産の音楽は、アメリカの型をなぞりながら、裏拍を強調するという独自の変形を得た。この変形の起源については、農村の音楽メントーの影響、演奏者の解釈違い、あるいは意図的な工夫など、諸説あって定まっていない。

1962年にジャマイカがイギリスから独立すると、この新しい音楽は国家の高揚と結びついて、一気に広まった。

演奏を支えたのは、The Skatalitesという楽団だ。1964年6月に正式結成された（メンバーは1963年ごろから共演。1963年とする資料もある）。約14か月活動し、1965年8月に最後の公演を行って、二分した。この集団には、トロンボーンのDon Drummond、サックスのTommy McCookとRoland Alphonsoら、Alpha Boys' Schoolなどの学校の音楽教育で育った名手が揃っていた。彼らは無数の録音に参加し、この音楽の水準を決定づけた。

しかし、栄光は短かった。1965年1月、Don Drummondは、同居中の恋人であった舞踊家Anita Mahfoodを殺害した。この罪で1966年に有罪（心神喪失）とされ、Bellevue精神病院で1969年5月6日に死亡している。楽団も、程なく解散した。

1965〜66年に、米国ソウルの変化への対応とされる（ほかにも諸説）形で、テンポが落ちる。音楽はロックステディへ移行した。

物語は、そこで終わらなかった。1970年代末、イギリスのコヴェントリーで、Jerry Dammersが2 Toneというレーベルを立ち上げる。The Specialsをはじめとする人種混成のバンドが、白黒の市松模様を掲げて、この音楽を蘇らせた。当時のイギリスは、極右政党の勢いと失業に揺れていた。彼らの活動は、明確な反人種差別の意思表示だった。

さらに1980年代後半、アメリカのパンクの現場で、一般にいう第三の波（サード・ウェーブ・スカ）が起こった。1990年代に商業的に成功して、この音楽は世界的な広がりを得ている。</p>
