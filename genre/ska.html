<h1>Ska（スカ）とは</h1>
<p>ジャマイカで生まれた、裏拍を刻むことを最大の特徴とする踊りの音楽である。ギターまたはピアノが、各拍の裏（オフビート、拍と拍の間）に短く鋭い和音を叩きつけ、この裏返った刻みが全体を軽やかに跳ねさせる。奏法としては弦を押さえたまま素早</p>
<p>ジャマイカで生まれた、裏拍を刻むことを最大の特徴とする踊りの音楽である。ギターまたはピアノが、各拍の裏（オフビート、拍と拍の間）に短く鋭い和音を叩きつけ、この裏返った刻みが全体を軽やかに跳ねさせる。奏法としては弦を押さえたまま素早く弾いて即座に消音する例が多く、音が伸びず、打楽器のように機能する。低音はコントラバスまたはエレクトリックベースが担い、拍ごとに音を変えながら歩くように動く。ドラムはスネア（小太鼓）を2・4拍目に強く打つバックビートが一般的な解説で、3拍目に重心を置く説明もある。テンポは速く、快活である。編成の華は管楽器で、トランペット、トロンボーン、サックスが揃い、ホーン群が同じ覚えやすいリフを吹く場面が多い（トロンボーンが主旋律で他がハーモニーを付ける形もある）一方、曲の中盤では各奏者が順に即興の独奏を回す。この即興の作法はジャズの影響を強く受けている。和声は単純な基本の和音（三和音）の繰り返しが多く、長調が中心だが、短調の陰りを帯びた楽曲も少なくない。歌は明るく歌い上げるものから、語りに近いものまで幅がある。歌詞は恋愛、街の出来事、社会への風刺、そして不良少年への言及などを扱うことがある。ただしスカは主にインストゥルメンタル音楽だった。後のロックステディやレゲエと比べると、テンポが速く、重心が高く、あくまで祝祭的である点が異なる。</p>
<h2>成り立ち</h2><p>1950年代のジャマイカでは、サウンドシステムと呼ばれる移動式の巨大な音響装置による野外の踊りの催しが娯楽の中心だった。運営者たちはアメリカ南部（マイアミ、ナッシュビル、ニューオーリンズなど）のラジオ放送を受信し、そこで流れるリズム・アンド・ブルースのレコードを競って買い付けた。他人と同じ盤を持たないことが商売上の武器だったため、盤面の情報を削って曲名を隠すという慣行まで生まれている。しかし1950年代末、アメリカ側の流行がロックンロールへ移り、望む種類のレコードが手に入らなくなると、運営者たちは自ら録音を始めた。Clement DoddやDuke Reidらが、はじめは他社のスタジオで録音を始め、のちに自前のスタジオ（Studio Oneは1963年、Treasure Isleは1960年代前半〜半ば）を構えて、その中心となった。こうして生まれた自国産の音楽が、アメリカの型をなぞりながら、裏拍を強調するという独自の変形を得た。この変形の起源については、農村の音楽メントーの影響、演奏者の解釈違い、あるいは意図的な工夫など諸説あり定まっていない。1962年にジャマイカがイギリスから独立すると、この新しい音楽は国家の高揚と結びついて一気に広まった。演奏を支えたのはThe Skatalitesという楽団で、1964年6月に正式結成され（メンバーは1963年ごろから共演しており、1963年とする資料もある）、約14か月活動したこの集団には、トロンボーンのDon Drummond、サックスのTommy McCookとRoland Alphonsoら、Alpha Boys' Schoolなどの学校の音楽教育で育った名手が揃っていた。彼らは無数の録音に参加し、この音楽の水準を決定づけたが、栄光は短かった。1965年1月、Don Drummondは同居していた恋人の舞踊家Anita Mahfoodを殺害した罪で1966年に有罪（心神喪失）とされ、Bellevue精神病院で1969年5月6日に死亡している。楽団は1965年8月に最後の公演を行って二分した。1965〜66年に、テンポが落ち、ロックステディへ移行する。これは米国ソウルが遅く滑らかになったことへの対応とされる（ほかにも諸説ある）。物語はそこで終わらなかった。1970年代末、イギリスのコヴェントリーでJerry Dammersが2 Toneというレーベルを立ち上げ、The Specialsをはじめとする人種混成のバンドが、白黒の市松模様を掲げてこの音楽を蘇らせた。当時のイギリスは極右政党の台頭と失業に揺れており、彼らの活動は明確な反人種差別の意思表示だった。さらに1980年代後半にアメリカのパンクの現場で、一般に第三の波（サード・ウェーブ・スカ）と呼ばれる動きが起こり、1990年代に商業的に成功して、この音楽は世界的な広がりを得ている。</p>
