<h1>Noise（ノイズ）とは</h1>
<p>ノイズは、従来の音楽的な美学——メロディー、和声、リズムの整合性——を意図的に破壊または無効化することを核心に置いた音楽ジャンルだ。その音響的特徴は、ホワイトノイズ・ピンクノイズ・ブラウンノイズといった帯域全体を覆う非周期的な音響</p>
<p>ノイズは、従来の音楽的な美学——メロディー、和声、リズムの整合性——を意図的に破壊または無効化することを核心に置いた音楽ジャンルだ。その音響的特徴は、ホワイトノイズ・ピンクノイズ・ブラウンノイズといった帯域全体を覆う非周期的な音響エネルギーの塊、フィードバックループによる耳をつんざくような高周波の持続音、そして極度に歪んだ波形が支配する。音程という概念はほぼ存在せず、音階や和声進行も意図的に排除される。

使用される機材は多岐にわたる。エレクトリック・ギターにエフェクターを多段接続し、アンプのボリュームを限界まで上げてフィードバックを誘発する手法が基本だ。具体的にはBoss DS-1やElectro-Harmonix Big Muffといったディストーション・ペダル、さらにリング・モジュレーター、ピッチ・シフター、ノイズ・ゲートを逆用したゲーティング・ノイズなどが多用される。シンセサイザーではKorg MS-20のようなパッチング式アナログ機材が自己発振状態で使われ、カセットテープのデッキを改造した回路曲げ（サーキット・ベンディング）も重要な音源となる。接触マイクを金属板や物体に貼り付けて増幅する手法も一般的だ。

リズム構造については、ノイズは基本的に拍子やテンポの概念を持たない。4/4拍子のような規則的なビートは意図的に回避され、音の塊が不規則に出現・消滅する。ただしパワー・ノイズやインダストリアル・ノイズの派生では、機械的なビートが導入されることもある。

音響エフェクトの質感は、リバーブを深くかけて空間を溶解させるか、逆に完全にドライな状態で音の粗さを剥き出しにするかの両極端が存在する。ディレイは音を反復させるのではなく、音の壁を構築するために使われる。

曲の構成は、起承転結を持たないことが多い。一定の音響密度を長時間維持するドローン的な展開か、突発的な音量の爆発と沈黙の交互が基本形だ。ボーカルが存在する場合、叫び声・呻き声・ウルトラ・ハイピッチの絶叫、あるいはエフェクターで原形をとどめないほど加工された声が使われる。歌詞は暴力・身体・死・社会批判・無意味性などを主題とすることが多い。

ノイズ・ロックとの違いは、ノイズ・ロックがロックの曲構造（ヴァース・コーラス）を保持したままノイズを素材として使うのに対し、ノイズはその構造自体を解体する点にある。実際に鳴っている場所は、小規模なアンダーグラウンド・ライブハウス、ギャラリー、廃工場などの非日常的空間が多い。</p>
<h2>成り立ち</h2><p>ノイズ音楽の思想的起源は、1910年代のイタリア未来派にまで遡ることができる。ルイジ・ルッソロは1913年に「騒音の芸術（L'Arte dei Rumori）」という宣言を発表し、工業化社会の騒音こそが新しい音楽の素材であると主張した。彼はイントナルモーリ（騒音発生機）という機械を製作し、騒音を音楽として演奏するコンサートを行った。この思想は当時の音楽界には受け入れられなかったが、後世のノイズ音楽の哲学的基盤となった。

1950〜60年代には、ジョン・ケージが「4分33秒」（1952年）で沈黙と環境音を音楽として提示し、音楽の定義そのものを問い直した。フルクサス運動やコンクレート音楽（ミュジーク・コンクレート）の実践者たちも、日常の音響を素材として扱う実験を続けた。これらの前衛芸術の流れが、ノイズ音楽の直接的な土壌を形成した。

1970年代に入ると、日本でノイズ音楽の独自の展開が始まった。灰野敬二は1970年に加入したロスト・アーラフなどから活動を始め、1978年に結成した不失者を通じて、ギターのフィードバックと即興演奏を極限まで推し進めた。彼の演奏は西洋のロックとも東洋の伝統音楽とも異なる、純粋な音響の探求だった。

1970年代後半から1980年代にかけて、日本のノイズ・シーンは世界的に最も先鋭的な展開を見せた。山塚アイ率いるボアダムスは大阪を拠点に、カオティックなノイズとポップの混合を実践した。そして最も重要な人物として、メルツバウ（秋田昌美）が登場する。秋田は1979年頃から活動を開始し、カセットテープ・磁気テープ・自作回路などを用いた過激なノイズ作品を大量に発表した。彼の作品数は数百枚に及び、「Pulse Demon」（1996年）などは世界のノイズ・シーンに決定的な影響を与えた。日本のノイズ・シーンは「ジャパノイズ」と呼ばれ、PSFレコードやAlchemy Recordsといったレーベルが作品を流通させた。

欧米では、ヴェルヴェット・アンダーグラウンド脱退後のルー・リードがソロで発表した「Metal Machine Music」（1975年）が初期のノイズ的作品として位置づけられる。サーストン・ムーアとキム・ゴードンが率いるソニック・ユースは、ギターのチューニングを意図的に崩したオルタード・チューニングとフィードバックを組み合わせ、ノイズとロックの境界を探求した。

インダストリアル・ミュージックとの関係も深い。スロッビング・グリッスルは1975年にイギリスで結成され、テープ操作・電子音響・挑発的なパフォーマンスを組み合わせたインダストリアル音楽を確立した。彼らのレーベル、インダストリアル・レコードはノイズとインダストリアルの交差点に位置する。

1980〜90年代には、ハーシュ・ノイズ（過激なノイズ）というサブジャンルが確立した。ハーシュ・ノイズは音量・歪み・密度をさらに極限まで高めたもので、メルツバウやC.C.C.C.（コズミック・コインシデンス・コントロール・センター）などが代表的だ。また、ノイズとパンクを融合したパワー・バイオレンス、ノイズとドローンを組み合わせたドローン・ノイズなど、多様なサブジャンルが派生した。

2000年代以降、デジタル技術の普及によりノイズ音楽の制作環境は民主化された。ラップトップ一台でノイズを生成できるようになり、ネットレーベルを通じた流通も盛んになった。現在もノイズは世界各地のアンダーグラウンド・シーンで生き続けており、ハイパーポップやデコンストラクテッド・クラブなど新世代の電子音楽にもその影響が及んでいる。</p>
