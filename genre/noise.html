<h1>Noise（ノイズ）とは</h1>
<p>ノイズは、メロディー・和声・リズムのまとまりという、従来の音楽の考え方を、わざと壊すか無効にすることを中心に置いた音楽ジャンルだ。 音を形づくるのは、ホワイトノイズ・ピンクノイズ・ブラウンノイズのような、帯域全体を覆う繰り返しのな</p>
<p>ノイズは、メロディー・和声・リズムのまとまりという、従来の音楽の考え方を、わざと壊すか無効にすることを中心に置いた音楽ジャンルだ。

音を形づくるのは、ホワイトノイズ・ピンクノイズ・ブラウンノイズのような、帯域全体を覆う繰り返しのない音のエネルギーの塊だ。フィードバック（出た音を拾い直して増幅し、鳴り続ける現象）による、耳をつんざく高い持続音も加わる。そして、極度に歪んだ波形が全体を支配する。

使う機材は幅広い。エレクトリック・ギターにエフェクター（音を加工する機器）を何台もつなぎ、アンプの音量を限界まで上げてフィードバックを起こすのは、手法の一つだ。具体的には、Boss DS-1やElectro-Harmonix Big Muffといったディストーション・ペダル（音を歪ませる機器）、リング・モジュレーター（二つの音を掛け合わせて、きしむ音を作る装置）、ピッチ・シフター（音の高さを変える装置）などが使われることがある。ノイズ・ゲート（小さい音を消す装置）を逆に使ったゲーティング・ノイズも、その一つだ。

シンセサイザーでは、Korg MS-20のようなパッチング式（配線を差し替えて音を作る）のアナログ機材が、自己発振（自分で音を出し続ける）の状態で使われることがある。カセットテープのデッキを改造する回路曲げ（サーキット・ベンディング）も、大事な音源になる。接触マイク（物に直接貼って振動を拾うマイク）を金属板や物に貼り付け、その音を増幅するやり方も一般的だ。

多くの場合、音程という考え方はほとんど無く、音階や和音の流れもわざと取り除かれる。

リズムの面でも、ノイズは多くの場合、拍子やテンポという考え方を持たない。4/4拍子のような規則正しいビートはわざと避けられ、音の塊が不規則に現れては消える。ただし、パワー・ノイズやインダストリアル・ノイズのような派生では、機械的なビートが入ることもある。

音の響きの質感は両極端だ。リバーブ（残響）を深くかけて空間を溶かすか、逆に完全にドライ（残響のない）な状態にして、音の粗さをむき出しにする。ディレイ（音を遅らせて繰り返す効果）も、音を繰り返すためではなく、音の壁を作るために使われる。

ボーカルがある場合は、叫び声・うめき声・ウルトラ・ハイピッチの絶叫が使われる。エフェクターで原形をとどめないほど加工した声のこともある。歌詞は、暴力・身体・死・社会批判・無意味さなどを主題にすることがある。

曲の組み立ては、起承転結を持たないことが多い。基本の形は、一定の音の密度を長い時間保つドローン的な展開か、突然の音量の爆発と沈黙を交互に繰り返す展開だ。

ノイズ・ロックとの違いは、曲の構造にある。ノイズ・ロックは、ロックの曲構造（ヴァース＝歌の節、コーラス＝繰り返しの部分）を保ったまま、ノイズを素材として使う。これに対し、ノイズはその構造そのものを壊す。実際に演奏される場所は、小さなアンダーグラウンド・ライブハウス、ギャラリー、廃工場など、日常から離れた空間が多い。</p>
<h2>成り立ち</h2><p>ノイズ音楽の思想的な起源は、1910年代のイタリアの未来派にまでさかのぼる。

1913年、ルイジ・ルッソロは「騒音の芸術（L'Arte dei Rumori）」という宣言を発表した。工業化した社会の騒音こそが、新しい音楽の素材だと主張したのだ。彼はイントナルモーリ（騒音発生機）という機械を作り、騒音を音楽として演奏するコンサートを開いた。この考え方は聴衆の激しい反発を招いた。作曲家たちの関心も、作品への採用にはつながらなかった。それでも、後のノイズ音楽の考え方の土台となった。

1950〜60年代には、ジョン・ケージが「4分33秒」（1952年）で、沈黙と環境音を音楽として示した。音楽の定義そのものを問い直したのだ。フルクサス運動やコンクレート音楽（ミュジーク・コンクレート）の実践者たちも、日常の音を素材として扱う実験を続けた。これらの前衛芸術の流れは、ノイズ音楽の影響や先例として位置づけられる。

一方、日本のノイズ(ジャパノイズ)は1970年代後半に始まり、1980年代に広く知られた。その前に、灰野敬二が1970年ごろ(資料により1971年とも)にロスト・アーラフで活動を始めている。彼は1978年に結成した不失者で、ギターのフィードバックと即興演奏を極限まで推し進めた。不失者は主にサイケデリックや実験的なロックに分類されるが、時にジャパノイズ的な方向へ踏み込む。彼の演奏は、西洋のロックとも東洋の伝統音楽とも違う、純粋な音の探求だったと言われる。

1970年代後半から1980年代にかけて、日本のノイズの世界は独自の激しい展開を見せた。山塚アイが率いるボアダムスは、大阪を拠点に、カオティックなノイズとポップを混ぜ合わせた。そして、中心的な存在の一人として、メルツバウ（秋田昌美）が登場する。秋田は1979年頃から活動を始め、カセットテープ・磁気テープ・自作回路などを使った過激なノイズ作品を大量に発表した。作品の数は500点以上に及ぶ。「Pulse Demon」（1996年）は代表作の一つで、2003年の再発盤をPitchforkが高く評価した。その一方で、批評家の評価は割れた。日本のノイズの世界は「ジャパノイズ」と呼ばれ、Alchemy Recordsなどのレーベルが作品を流通させた。

欧米では、ヴェルヴェット・アンダーグラウンドを抜けたルー・リードが、ソロで「Metal Machine Music」（1975年）を発表した。この作品は、初期のノイズ的な作品として位置づけられる。サーストン・ムーア、キム・ゴードン、リー・ラナルドらが結成したソニック・ユースは、オルタード・チューニング（ふつうとは違う弦の合わせ方）でギターの調弦をわざと崩し、フィードバックと組み合わせた。そうして、ノイズとロックの境界を探った。

インダストリアル・ミュージックとの関係も深い。スロッビング・グリッスルは1975年にイギリスで結成された。テープ操作・電子音響・挑発的なパフォーマンスを組み合わせ、インダストリアル音楽の先駆者の一つとなった。彼らのレーベル、インダストリアル・レコードは、ノイズとインダストリアルの交差点に位置する。

1980〜90年代には、ハーシュ・ノイズ（過激なノイズ）というサブジャンルが定着した。音量・歪み・密度をさらに極限まで高めたもので、メルツバウやC.C.C.C.（コズミック・コインシデンス・コントロール・センター）などが代表的だ。また、ノイズとドローンを組み合わせたドローン・ノイズなど、さまざまなサブジャンルが生まれた。

2000年代以降は、デジタル技術が広まり、ノイズ音楽の制作環境は民主化された（誰でも作れるようになった）。ラップトップ1台でノイズを作れるようになり、ネットレーベルを通じた流通も盛んになった。今もノイズは、世界各地の地下の音楽の場で生き続けている。</p>
