<h1>Arena Rock（アリーナロック）とは</h1>
<p>アリーナ・ロックは、アリーナやスタジアムなどの大規模な会場で、大観衆に向けて演奏することを前提に設計されたロックである。したがってスタイルの定義は、音そのものより、空間の条件から導かれる。 まず、サウンド全体の特徴だ。ラジオ向きで</p>
<p>アリーナ・ロックは、アリーナやスタジアムなどの大規模な会場で、大観衆に向けて演奏することを前提に設計されたロックである。したがってスタイルの定義は、音そのものより、空間の条件から導かれる。

まず、サウンド全体の特徴だ。ラジオ向きで、作り込まれたサウンドと、覚えやすい旋律、アンセム的なコーラスを特徴とする。

音の設計も変わる。ギターには目立つ効果が使われ、キーボードも用いられる。複雑な変拍子（定型から外れた拍子）は避けられる傾向がある。

歌の面では、繰り返し部分が数万人で同時に一緒に歌えるよう設計される。

曲の組み立てでは、緩急の設計として、静かな導入から劇的に盛り上がる楽曲が用意されることがある。</p>
<h2>成り立ち</h2><p>1960年代前半まで、ロックの演奏は小さな舞踏場や劇場が中心だったとされる。

1965年にThe Beatlesが野球場で演奏した際には、コンサート全体の音声問題が起きた。そのためライブ録音では、一部の曲にオーバーダビング（後から音を重ねて録音すること）を施した。2曲（「I Feel Fine」「Help!」）は全面的に録り直された。他に、別音源への差し替えもあった。

転機は1969年だ。約46万〜50万人（推定）を集めた野外音楽祭が、ロックが大規模な動員力を持つことを実証した。ただし諸説あり、1969年のStones米国ツアー（音響・照明の革新）や、Beatlesの1965年のShea Stadium公演の影響も挙げられる。同時に、音響技術の進歩によって、大空間でも音を届けることが可能になっていく。

1971年、Grand Funk Railroadがニューヨークの球場の券を72時間で約5.5万枚売り切り、Beatlesの記録を上回った。この経済的な条件が音楽を変えた。ラジオ向きで、作り込まれたサウンドと、覚えやすい旋律、アンセム的なコーラスを特徴とする。1976年にBostonが、1977年にForeignerが、1981年にJourneyが、いずれもラジオ向きの作り込まれたサウンドで大成功を収めた。

FMラジオでの繰り返しのオンエアが人気を支えた。これらのバンドの曲を流したのは、アメリカのFMラジオの「AOR」（当初はalbum-oriented radio。のちにalbum-oriented rockと読み替えられた）と呼ばれる放送枠だった。シングルのヒット曲だけを流すAMラジオに対抗して、アルバムの収録曲を長くかける編成だった。そこでかかるロックも、やがて同じ名前で呼ばれるようになった。

この系統は「AOR」や「メロディック・ロック」とも呼ばれる。日本では、音楽評論家の渋谷陽一が商業主義を皮肉って「産業ロック」と呼んだことでも知られる。一方、日本で「AOR」といえば、Boz ScaggsやBobby Caldwellのような、ジャズなどの要素を取り入れた大人向けの洗練されたロックを指すのがふつうだ。同じ略称でも中身が違う（この地図ではAORの項目で扱う）。

イギリスのQueenは、「We Will Rock You」など、観客の手拍子と足踏みを前提にした楽曲で知られる。1980年代半ばにはBon Joviが登場し、1990年代まで大きな商業的成功を収めた。

同時に、この分野は最も激しい批判の的でもあった。パンクは、主流のアリーナ・ロックの過剰なプロダクションや企業的性格を拒否した。

1991年前後に、グランジ／オルタナが人気を集めた。その後、とくにヘアメタル系のバンドの人気は急落した。しかし皮肉なことに、当のグランジのバンドも、数年後には同じ規模の会場で演奏することになったとされる。大空間で機能する音という課題は、現在も多くの大規模公演に共通する課題である。</p>
