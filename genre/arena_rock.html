<h1>Arena Rock（アリーナロック）とは</h1>
<p>アリーナやスタジアムなどの大規模な会場で、大観衆に向けて演奏することを前提に設計されたロックである。したがって様式の定義は、音そのものより空間の条件から導かれる。第一に、ラジオ向きの作り込まれたサウンドと、旋律を重視した覚えやすい</p>
<p>アリーナやスタジアムなどの大規模な会場で、大観衆に向けて演奏することを前提に設計されたロックである。したがって様式の定義は、音そのものより空間の条件から導かれる。第一に、ラジオ向きの作り込まれたサウンドと、旋律を重視した覚えやすい曲づくりが特徴である。第二に、繰り返し部分は数万人が同時に一緒に歌えるよう設計された、アンセム的（みんなで歌える賛歌のような）なコーラスが多く、聴衆の参加を促す。第三に、音の設計が変わる。ギターには目立つ効果が使われ、キーボード（鍵盤楽器）も用いられる。第四に、緩急の設計として、静かな導入から劇的に盛り上がる楽曲と、パワーバラード（力強く盛り上がるゆったりした曲）が併存する。</p>
<h2>成り立ち</h2><p>1960年代前半まで、ロックの演奏は小さな舞踏場や劇場が中心だった。1965年にThe Beatlesが野球場で演奏した際には、コンサート全体の音声問題のために、ライブ録音は、一部の曲に後からオーバーダビング（後から音を重ねて録音すること）が施され、2曲（「I Feel Fine」「Help!」）は全面的に録り直され、別の音源に差し替えられた曲もある。転機には諸説あり、1965年のBeatlesのShea Stadium公演の影響や、音響・照明が整えられた1969年のRolling Stones米国ツアーが挙げられる。同じ1969年には約46万〜50万人（推定）を集めた野外音楽祭も開かれ、ロックの大規模な動員力が示された。音響技術の進歩によって、大空間でも音を届けることが可能になっていく。1971年、Grand Funk Railroadがニューヨークの球場の券を72時間で売り切り、数週間かかったThe Beatlesの記録を上回った。1976年にBostonが、1977年にForeignerが、1981年にJourneyが、いずれもラジオ向きの作り込まれたサウンドで巨大な成功を収めた。これらのバンドの人気を支えたのは、アメリカのFMラジオの「AOR」（当初はalbum-oriented radio。のちにalbum-oriented rockと読み替えられた）と呼ばれる放送枠での、繰り返しのオンエアだった。シングルのヒット曲だけを流すAMラジオに対抗して、アルバムの収録曲を長くかける編成で、そこでかかるロックもやがて同じ名前で呼ばれるようになった。この系統は「AOR」や「メロディック・ロック」とも呼ばれ、日本では音楽評論家の渋谷陽一が商業主義を皮肉って「産業ロック」と呼んだことでも知られる。一方、日本で「AOR」といえば、Boz ScaggsやBobby Caldwellのような、大人向けの洗練されたロックを指すのがふつうで、同じ略称でも中身が違う（この地図ではAORの項目で扱う）。イギリスのQueenは、「We Will Rock You」など、観客の手拍子と足踏みを前提にした楽曲で知られる。1980年代半ばにはBon Joviが登場し、1990年代まで大きな商業的成功を収めた。同時に、この分野は最も激しい批判の的でもあった。パンクは、主流のアリーナ・ロックの過剰なプロダクションや企業的な性格を拒否した。1990年代初頭のグランジ／オルタナの台頭後、ヘアメタル系のバンドを中心に、この分野の人気は急落した。大空間で機能する音という課題は、現在も多くの大規模公演に共通している。</p>
<h2>代表曲</h2><ul><li>The Final Countdown (Europe)</li><li>Eye of the Tiger (Survivor)</li><li>I Want to Know What Love Is (Foreigner)</li><li>Don't Stop Believin' (Journey)</li><li>We Are the Champions (Queen)</li><li>Separate Ways (Journey)</li><li>Waiting for a Girl Like You (Foreigner)</li><li>More Than a Feeling (Boston)</li><li>Keep On Loving You (REO Speedwagon)</li><li>Any Way You Want It (Journey)</li><li>Juke Box Hero (Foreigner)</li><li>I Love Rock 'n' Roll (Joan Jett &amp; the Blackhearts)</li><li>Come Sail Away (Styx)</li><li>Love Hurts (Nazareth)</li><li>Cold as Ice (Foreigner)</li><li>Rock of Ages (Def Leppard)</li><li>Heat of the Moment (Asia)</li></ul>
