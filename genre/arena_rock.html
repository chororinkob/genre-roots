<h1>Arena Rock（アリーナロック）とは</h1>
<p>アリーナやスタジアムなどの大規模な会場で、大観衆に向けて演奏することを前提に設計されたロックである。したがって様式の定義は、音そのものより空間の条件から導かれる。第一に、広大な空間では細かい表現が届かないため、楽曲は単純化される。</p>
<p>アリーナやスタジアムなどの大規模な会場で、大観衆に向けて演奏することを前提に設計されたロックである。したがって様式の定義は、音そのものより空間の条件から導かれる。第一に、広大な空間では細かい表現が届かないため、楽曲は単純化される。和声は基本的な三和音（3つの音を重ねた和音）の循環、旋律は音域が狭く覚えやすいものが選ばれる。第二に、繰り返し部分は数万人が同時に一緒に歌えるよう設計され、しばしば言葉が少なく、母音の伸びる語が選ばれる。演者だけでなく構成員全員が声を揃える合唱が加えられ、聴衆の参加を促す。第三に、音の設計が変わる。ギターには目立つ効果が使われ、キーボードも用いられる。複雑な変拍子（定型から外れた拍子）は避けられる傾向がある。第四に、緩急の設計として、静かな導入から劇的に盛り上がる楽曲が用意されることがある。演奏には火薬や照明を用いた大掛かりな演出が伴い、音楽と視覚は一体で構想される。</p>
<h2>成り立ち</h2><p>1960年代前半まで、ロックの演奏は小さな舞踏場や劇場が中心だった。1965年にThe Beatlesが野球場で演奏した際には、コンサート全体の音声問題のために、ライブ録音は、ほとんどの曲が後からオーバーダビング（後から音を重ねて録音すること）され、2曲（「I Feel Fine」「Help!」）は全面的に録り直されている。転機は1969年で、約46万〜50万人（推定）を集めた野外音楽祭が、ロックが大規模な動員力を持つことを実証した。同時に、音響技術の進歩によって、大空間でも音を届けることが可能になっていく。1971年、Grand Funk Railroadがニューヨークの球場の券をThe Beatlesより短時間で売り切ったことは、この時代の到来を象徴する出来事とされる。この経済的な条件が音楽を変えた。数万人を相手にする以上、繊細さより明快さが求められ、楽曲は必然的に単純化する。1976年にBostonが、1977年にForeignerが、1981年にJourneyが、いずれもこの条件に最適化された作品で巨大な成功を収めた。これらのバンドの曲を最も多く流したのは、アメリカのFMラジオの「AOR」（当初はalbum-oriented radio。のちにalbum-oriented rockと読み替えられた）と呼ばれる放送枠だった。シングルのヒット曲だけを流すAMラジオに対抗して、アルバムの収録曲を長くかける編成で、そこでかかるロックもやがて同じ名前で呼ばれるようになった。この系統は「AOR」や「メロディック・ロック」とも呼ばれ、日本では音楽評論家の渋谷陽一が商業主義を皮肉って「産業ロック」と呼んだことでも知られる。一方、日本で「AOR」といえば、Boz ScaggsやBobby Caldwellのような、ジャズの和声を取り入れた大人向けの洗練されたロックを指すのがふつうで、同じ略称でも中身が違う（この地図ではAORの項目で扱う）。イギリスのQueenは、聴衆に手拍子と足踏みを要求する楽曲によって、参加型の演出を極限まで洗練させている。1980年代半ばにはBon Joviが登場し、1990年代まで大きな商業的成功を収めた。同時に、この分野は最も激しい批判の的でもあった。パンクの担い手たちは、これを企業に管理された空虚な見世物として名指しし、聴き手と演者の物理的な距離の遠さを、そのまま音楽の堕落の証拠と見なした。1991年前後のグランジ／オルタナの台頭後、この分野の人気は急落した。しかし皮肉なことに、当のグランジのバンドも数年後には同じ規模の会場で演奏することになり、大空間で機能する音という課題は、現在も全ての大規模な音楽が直面し続けている。</p>
