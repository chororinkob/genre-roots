<h1>Speednoise（スピードノイズ）とは</h1>
<p>スピードノイズは、スピードコアの極端に速く歪んだキックドラムと、ハーシュノイズ（ノイズだけを聴かせる音楽）の轟音を、分け隔てなく混ぜ合わせた音楽だ。その轟音は制御されず、全ての音域にわたって鳴り響く。 通常のダンス音楽では、ノイズ</p>
<p>スピードノイズは、スピードコアの極端に速く歪んだキックドラムと、ハーシュノイズ（ノイズだけを聴かせる音楽）の轟音を、分け隔てなく混ぜ合わせた音楽だ。その轟音は制御されず、全ての音域にわたって鳴り響く。

通常のダンス音楽では、ノイズは効果音として添えられるだけだ。しかしこの分野では、ノイズが常に鳴り続ける。キックは、その轟音の中を突き破るように打ち込まれる。

音源には、フィードバックさせたミキサー、壊れたエフェクターの発振、金属を擦る音、コンタクトマイクで拾った物体の摩擦音などが使われることもあると言われる。それらをクリッピング（音の波の頭を削る処理）させ、波形の頭を潰し切る。こうして、デジタル特有の平坦で刺々しい音の壁が作られる。

土台のスピードコアは、テンポが約300 BPM以上である。

もう一方の土台のハーシュノイズは、旋律やリズムを欠く。

曲の長さには幅があり、構成という考え方自体を捨てた作品もあると言われる。同じ高速の音楽でも、フラッシュコアは音を細かく設計する。それに対してスピードノイズは、制御を手放すことと過剰さそのものに価値を置く。聴くという行為への耐久試験に近い性格を持つ音楽である。</p>
<h2>成り立ち</h2><p>源流は2本ある。

ひとつは、1970年代後半から日本で発展し、1990年代に海外で広く知られるようになったジャパノイズだ。東京の秋田昌美によるMerzbowや、大阪の山崎マゾによるMasonnaは、旋律や拍節を排した轟音を中心とする作品で知られた。彼らはSonic YouthやJohn Zornらの紹介で、米国の聴衆にも知られた。同じ頃のイギリスでは、William Bennett率いるWhitehouseが、不快さと暴力性を正面から扱う表現を行っていた。このユニットは、パワーエレクトロニクスの先駆者として広く評価される。

もうひとつは、スピードコアだ。1990年代前半から半ばにかけて、オランダ、ドイツ、ベルギーなど欧州のハードコアやガバから生まれ、1990年代半ばにはニューヨークのシーンでも発展した(呼称の由来には諸説ある)。こちらはダンスフロアの側から、歪みと速さの限界を試していた。

ハードコアテクノの側では、次のようなレーベルが活動した。ドイツ北部のハンブルクでは、ノイズコアからアンビエントまで幅広く扱ったFischkopf Hamburgが、ハードコアテクノの内側で実験的な作品を出すレーベルとして活動した。オーストラリアのニューカッスルでは、Mark Newlands主宰のBloody Fist Recordsが、安価な機材によるローファイで粗い音を積極的に認めた。

ノイズコアは、1980年代半ばにハードコアや初期スラッシュコアの周りから現れていた。Anal Cuntは、マサチューセッツ州ニュートン(ボストン近郊)で1988年に結成された。グラインドコア／ノイズグラインドの文脈で、ノイズコアとも分類されるバンドだ。当初は、リズムも歌詞も曲名もない「反音楽」を目指した。

一方、スピードノイズという呼び名は、これらの活動が2000年代のインターネット上で交流する中で使われ始めた、という見方もある。ただし、呼び名の起源ははっきりしない。特定の人物を創始者とする説もあるが、定かではない。

作品はCD-Rやカセット、あるいは無料のMP3形式の音声ファイルとして出回ったとされる。ライブは、小さなスタジオや倉庫で行われることもあったと言われる。</p>
