<h1>Speednoise（スピードノイズ）とは</h1>
<p>スピードコアの極端に速く歪んだキックドラムと、ハーシュノイズの制御されない全帯域の轟音を、隔てなく混ぜ合わせた音楽である。通常のダンス音楽ではノイズは効果音として添えられるが、この分野ではノイズが常時鳴り続け、キックはその轟音の中</p>
<p>スピードコアの極端に速く歪んだキックドラムと、ハーシュノイズの制御されない全帯域の轟音を、隔てなく混ぜ合わせた音楽である。通常のダンス音楽ではノイズは効果音として添えられるが、この分野ではノイズが常時鳴り続け、キックはその轟音の中を突き破るように打ち込まれる。テンポは概ね300 BPMを超え、しばしば計測が無意味になるほど不規則で、拍子の感覚そのものが意図的に破壊される。音源にはフィードバックさせたミキサー、壊れたエフェクターの発振、金属を擦る音、コンタクトマイクで拾った物体の摩擦音などが用いられ、それらをクリッピングさせて波形の頭を潰し切ることで、デジタル特有の平坦で刺々しい壁が作られる。ダイナミクスはほぼ存在せず、始まった瞬間から終わりまで最大音量が維持される。曲の長さは30秒から数十分まで極端に幅があり、構成という概念自体が放棄されている作品も多い。旋律、和声、歌はいずれも存在しない。同じ高速でも、フラッシュコアが音を精緻に設計するのに対し、スピードノイズは制御の放棄と過剰そのものを価値とし、聴くという行為に対する耐久試験に近い性格を持つ。</p>
<h2>成り立ち</h2><p>系譜は二本ある。ひとつは1980年代の日本で確立したジャパノイズで、東京の秋田昌美によるMerzbowや大阪の山崎マゾによるMasonnaが、旋律も構成も持たない全帯域の轟音だけで作品を成立させ、欧米の実験音楽家に強い衝撃を与えた。同時期のイギリスではWilliam Bennett率いるWhitehouseがパワーエレクトロニクスとして、不快さと暴力性を正面から扱う表現を打ち立てていた。もうひとつは1990年代前半、オランダとドイツのガバから派生したスピードコアで、こちらはダンスフロアの側から歪みと速度の限界を試していた。両者が交差したのはドイツ北部で、ハンブルクのFischkopf Schallplatten周辺の作家たちがノイズの美学をハードコアテクノへ持ち込み、オーストラリアのニューカッスルではMark Newlands主宰のBloody Fist Recordsが、安価な機材による粗く割れた音を積極的に肯定した。1990年代後半にはグラインドコアの側からもノイズコアと呼ばれる、曲の体裁を放棄した極短編の実践が現れ、ボストンのAnal Cuntのように意図的に演奏を成立させない作品が並行して存在した。スピードノイズという呼称は、これらの実践が2000年代のインターネット上で交流する中で使われ始めたもので、明確な創始者はいない。作品はCD-Rやカセット、あるいは無償のmp3として数十から数百単位で流通し、ライブは小さなスタジオや倉庫で十数人を相手に行われることがほとんどだった。商業性が完全に欠如していることは弱点であると同時に、検閲も市場の要求も受けないという自由を意味しており、この分野が今日までインターネット上の極小のコミュニティとして途切れずに続いている理由にもなっている。</p>
