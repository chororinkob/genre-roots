<h1>Big Room House（ビッグルームハウス）とは</h1>
<p>巨大な野外会場での再生に最適化された、極度に単純化されたダンス音楽。名称はそのまま「大きな部屋」を意味し、大規模な会場やアリーナで鳴らすことを前提に作られている。特徴は音の要素が極端に少ないことで、ドロップ（山場で一気に爆発する部</p>
<p>巨大な野外会場での再生に最適化された、極度に単純化されたダンス音楽。名称はそのまま「大きな部屋」を意味し、大規模な会場やアリーナで鳴らすことを前提に作られている。特徴は音の要素が極端に少ないことで、ドロップ（山場で一気に爆発する部分）は極端に音数が少なく、巨大なキック、サブベース、少数のリード（デチューンしたノコギリ波を重ねた音など）とわずかなパーカッションで構成される。キックは超低域（サブ）を厚くした重いキックが特徴で、音圧（音の迫力）の中心になる。テンポは126〜132BPMの範囲に収まるのが一般的で、128BPM前後が多い。構造も定型化されており、イントロ(打楽器のみ)、ビルドアップ(徐々に盛り上げる部分。白色雑音のライザー＝上昇していく音と、スネアの連打が徐々に速くなる)、一瞬の無音、ドロップ(キック、サブベース、少数のリードなどだけで組む)、ブレイクダウン(山場の前に静かになる部分。打楽器を抜き、パッドと歌)という流れが典型的で、ビルドアップとドロップは2回ずつ現れ、間にブレイクダウンが入る。スネアの連打が4分音符から8分、16分、32分へと加速していく仕掛けは、EDMで広く使われる緊張の高め方で、この形式でもよく使われる。リードの音色はノコギリ波（ぎざぎざの波形）を何重にも重ねてデチューン（わざと少しずらして調律）した厚い音か、あるいは金属的な単音。和声（コードの響き）はマイナー調の単純な進行で、複雑な和声は音場を濁らせるため避けられる。ヴォーカルが入らない曲も多く、入る場合はブレイクダウン部分が中心で、感情的な短いフレーズを歌う。プログレッシブ・ハウスとエレクトロ・ハウスの融合から発展したが、より要素を削ぎ落とし、視覚演出(炎、花火、LED)との同期を前提とする点で、音楽単体の鑑賞よりも会場体験の一部として設計されている。</p>
<h2>成り立ち</h2><p>「big room」という語は2007年ごろから記事に現れるが、現在の形は2010〜12年ごろに、ヨーロッパ（とくにスウェーデン、ノルウェー、オランダ）を中心に、大型音楽祭の産業化とともに成立したとされる（起源には諸説ある）。土台となったのは欧米の大型フェスティバル文化で、Tomorrowland(ベルギー、2005年開始)、Ultra Music Festival(マイアミ、1999年開始)、Electric Daisy Carnival(アメリカ)といった野外音楽祭や、アムステルダムの屋内の大型ダンスイベントSensationが、数万人から数十万人規模の観客を集めるようになった。この規模では、繊細な音の変化は物理的に伝わらず、遅延と反響で細部が潰れる。そこで、少ない要素で明快な起伏を作る設計が経済的にも音響的にも合理的になった。中心となった制作者はオランダのHardwell、Nicky Romero、Martin Garrix、Showtek、ベルギーのDimitri Vegas &amp; Like Mike、そしてその母体となったプログレッシブ／エレクトロ・ハウス期を担ったスウェーデンのSwedish House Mafiaで、レーベルではSpinnin' Records(1999年設立)とRevealed Recordingsが量産の中核となった。象徴的な作品としてはSandro SilvaとQuintinoの2011年「Epic」、Hardwellの2012年「Spaceman」、そしてMartin Garrixが17歳で発売し2013年に世界的大ヒットとなった「Animals」が挙がる。「Animals」はドロップのリズムと旋律が極度にミニマルな構成で、この形式の到達点であると同時に、批判の的にもなった。この形式には、音楽的な中身が乏しくなること、全曲が同じ構造であることへの批判があり、EDMのライブ全般については、DJが事前に用意した音源を再生するだけで演奏の実態がないという指摘もあった。2012年6月にはDeadmau5が自らのブログ(Tumblr)で、「we all hit play（自分も含めて、みんな再生ボタンを押している）」と書いて大きな論争を呼んだ。産業面では、DJの出演料が高騰し、Las Vegasのカジノが大型クラブへ投資して市場が膨張した。しかし2014年から2015年にかけて飽和が明らかになり、同じ構造の曲が大量に流通したことで聴衆が離れた。2013年以降、薬物関連の死亡事故がフェスティバルで相次ぎ、規制も強まった。この後、聴衆の関心はトロピカル・ハウスやテックハウス、フューチャー・ベース、テクノ、ヒップホップなどに分散し、ビッグルームは急速に勢いを失う。ただし完全に消えたわけではなく、より速く硬いビッグルーム・テクノ（と呼ばれることもある）やレイヴ寄りの形へ姿を変え、2020年代にはハードスタイルやハードダンスの表現と融合した形で、フェスティバルの舞台に残り続けている。</p>
