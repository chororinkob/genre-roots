<h1>Big Room House（ビッグルームハウス）とは</h1>
<p>巨大な野外会場での再生に最適化された、極度に単純化されたダンス音楽。名称はそのまま「大きな部屋」を意味し、数万人の会場で数百メートル先まで届く音を前提に設計されている。特徴は音の要素が極端に少ないことで、ドロップの部分では巨大なキ</p>
<p>巨大な野外会場での再生に最適化された、極度に単純化されたダンス音楽。名称はそのまま「大きな部屋」を意味し、数万人の会場で数百メートル先まで届く音を前提に設計されている。特徴は音の要素が極端に少ないことで、ドロップの部分では巨大なキック、単音のリード、そして無音しか存在しない場合が多い。キックは中低域に強い山を持つ長い減衰の音で、単体で音圧の大半を占める。テンポはほぼ128BPMに固定されており、この数値からの逸脱は稀。構造も定型化されており、イントロ(打楽器のみ)、ビルドアップ(白色雑音のライザーとスネアの連打が徐々に速くなる)、一瞬の無音、ドロップ(キックと単音のリードのみ)、ブレイクダウン(打楽器を抜き、パッドと歌)という順序をほぼ全曲が守る。スネアの連打が4分音符から8分、16分、32分へと加速していく仕掛けは、この形式の中核的な緊張装置になっている。リードの音色はノコギリ波を何重にも重ねてデチューンした厚い音か、あるいは金属的な単音。和声はマイナー調の単純な進行で、複雑な和声は音場を濁らせるため避けられる。ヴォーカルはブレイクダウン部分にのみ現れ、感情的な短いフレーズを歌う。エレクトロハウスから発展したが、より要素を削ぎ落とし、視覚演出(炎、花火、LED)との同期を前提とする点で、音楽単体の鑑賞よりも会場体験の一部として設計されている。</p>
<h2>成り立ち</h2><p>2010年前後のオランダを中心に、大型野外音楽祭の産業化とともに成立した。土台となったのはオランダのフェスティバル文化で、Tomorrowland(ベルギー、2005年開始)、Sensation、Ultra Music Festival(マイアミ、1999年開始)、Electric Daisy Carnival(アメリカ)が、数万人から数十万人規模の観客を集めるようになった。この規模では、繊細な音の変化は物理的に伝わらず、遅延と反響で細部が潰れる。そこで、少ない要素で明快な起伏を作る設計が経済的にも音響的にも合理的になった。中心となった制作者はオランダのHardwell、Nicky Romero、Martin Garrix、Showtek、ベルギーのDimitri Vegas &amp; Like Mike、スウェーデンのSwedish House Mafiaで、レーベルではSpinnin' Records(1999年設立)とRevealed Recordingsが量産の中核となった。象徴的な作品としてはSwedish House Mafiaの2010年「One」、Hardwellの2013年「Spaceman」、そしてMartin Garrixが17歳で制作し2013年に世界的大ヒットとなった「Animals」が挙がる。「Animals」はドロップに旋律がほぼ存在せず、キックと単音のパターンだけという極端な構成で、この形式の到達点であると同時に、批判の的にもなった。批評家からは、音楽的内容の空洞化、全曲が同じ構造であること、DJが事前に用意した音源を再生するだけで演奏の実態がないことなどが厳しく指摘された。2013年にはDeadmau5が自らのブログで、多くのDJが再生ボタンを押しているだけだと暴露して大きな論争を呼んだ。産業面では、DJの出演料が高騰し、Las Vegasのカジノが大型クラブへ投資して市場が膨張した。しかし2014年から2015年にかけて飽和が明らかになり、同じ構造の曲が大量に流通したことで聴衆が離れた。同時期に薬物による死亡事故がフェスティバルで相次ぎ、規制も強まった。この後、市場はフューチャー・ハウスやトロピカル・ハウス、さらにはヒップホップへ流れ、ビッグルームは急速に退潮する。ただし完全に消えたわけではなく、より速く硬いビッグルーム・テクノやレイヴ寄りの形へ姿を変え、2020年代にはハードスタイルやハードダンスの語彙と融合した形で、フェスティバルの舞台に残り続けている。</p>
