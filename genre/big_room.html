<h1>Big Room House（ビッグルームハウス）とは</h1>
<p>ビッグルーム・ハウスは、巨大な野外会場での再生に最適化された、極度に単純化されたダンス音楽だ。名称はそのまま「大きな部屋」を意味し、大規模な会場・アリーナ向けに作られた。プログレッシブ・ハウスとエレクトロ・ハウスの融合から発展した</p>
<p>ビッグルーム・ハウスは、巨大な野外会場での再生に最適化された、極度に単純化されたダンス音楽だ。名称はそのまま「大きな部屋」を意味し、大規模な会場・アリーナ向けに作られた。プログレッシブ・ハウスとエレクトロ・ハウスの融合から発展したが、より要素を削ぎ落としている。

特徴は、音の要素が極端に少ないことだ。ドロップ（山場で一気に爆発する部分）は極端に音数が少なく、キック、サブベース、少数のリード(スーパーソウなど)とわずかなパーカッションで構成される。キックは、超低域（サブ）を厚くした重いキックが特徴だ。

リードの音色は、ノコギリ波（ぎざぎざの波形）を何重にも重ねてデチューン（わざと少しずらして調律）した厚い音か、あるいは金属的な単音である。和声（コードの響き）はマイナー調の単純な進行で、複雑な和声は音場を濁らせるため避けられる。

テンポは126〜132BPMの範囲に収まるのが一般的で、128BPM前後が多い。

ヴォーカルは入らない曲も多く、入る場合はブレイクダウンが中心である。

曲の構造も定型化されている。順序は、イントロ(打楽器のみ)、ビルドアップ(徐々に盛り上げる部分。白色雑音のライザー＝上昇していく音と、スネアの連打が徐々に速くなる)、一瞬の無音、ドロップ(キック、サブベース、少数のリード、わずかなパーカッションで構成)、ブレイクダウン(山場の前に静かになる部分。打楽器を抜き、パッドと歌)となる。典型的には、ビルドアップとドロップが2回ずつ現れ、間にブレイクダウンが入る。スネアの連打が4分音符から8分、16分、32分へと加速していく仕掛けは、EDMで広く使われる技法である。

視覚演出(炎、花火、LED)との同期を前提とする点で、音楽単体の鑑賞よりも、会場体験の一部として設計されている。</p>
<h2>成り立ち</h2><p>「big room」という語は、2007年頃から記事に現れる。現在の形は、2010〜12年頃にヨーロッパ（とくにスウェーデン、ノルウェー、オランダ）を中心に、大型野外音楽祭の産業化とともに成立した。

土台となったのは、欧米の大型フェスティバル文化だ。Tomorrowland(ベルギー、2005年開始)、Sensation（Amsterdam ArenAで開かれる屋内の大型ダンスイベント）、Ultra Music Festival(マイアミ、1999年開始)、Electric Daisy Carnival(アメリカ)が、数万人から数十万人規模の観客を集めるようになった。この規模では、繊細な音の変化は物理的に伝わらず、遅延と反響で細部が潰れる。そこで、少ない要素で明快な起伏を作る設計が、経済的にも音響的にも合理的になった。

中心となった制作者は、オランダのHardwell、Nicky Romero、Martin Garrix、Showtek、ベルギーのDimitri Vegas &amp; Like Mike、スウェーデンのSwedish House Mafiaである。レーベルでは、Spinnin' Records(1999年設立)とRevealed Recordingsが量産の中核となった。代表的な作品としては、Sandro Silva &amp; Quintinoの2011年「Epic」、Hardwellの2012年「Spaceman」が挙がる。そしてMartin Garrixが17歳で発売し、2013年に世界的大ヒットとなった「Animals」がある。「Animals」はドロップのリズムと旋律が極度にミニマルな構成で、この形式の到達点であると同時に、批判の的にもなった。

批評家からは、音楽的な中身が乏しくなること、全曲が同じ構造であること、DJが事前に用意した音源を再生するだけで演奏の実態がないことなどが、厳しく指摘された。2012年6月にはDeadmau5が自らのブログ(Tumblr)で、EDMのライブ全般について、「we all hit play（自分も含めて、みんな再生ボタンを押している）」と書いて、大きな論争を呼んだ。

産業面では、DJの出演料が高騰し、Las Vegasのカジノが大型クラブへ投資して、市場が膨張した。しかし、2014年から2015年にかけて飽和が明らかになった。同じ構造の曲が大量に流通したことで、聴衆が離れた。2013年以降、薬物関連の死亡が相次ぎ、規制が強まった。この後、関心がフューチャー・ハウスやトロピカル・ハウス、さらにはヒップホップへ分散し、ビッグルームは急速に勢いを失う。

ただし、完全に消えたわけではない。より速く硬いビッグルーム・テクノ（通称）やレイヴ寄りの形へ姿を変えた。2020年代には、ハードスタイルやハードダンスの表現と融合した形で、フェスティバルの舞台に残り続けている。</p>
