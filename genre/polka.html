<h1>Polka（ポルカ）とは</h1>
<p>ポルカは4分の2拍子を基本とする民俗舞曲で、その伴奏音楽の総称でもある。1小節に2拍、テンポは毎分110〜130拍が標準で、速い曲は140拍を超える。リズムの骨格は「短短長」——8分音符が2つ続いたあとに4分音符が来る弾む音型で、</p>
<p>ポルカは4分の2拍子を基本とする民俗舞曲で、その伴奏音楽の総称でもある。1小節に2拍、テンポは毎分110〜130拍が標準で、速い曲は140拍を超える。リズムの骨格は「短短長」——8分音符が2つ続いたあとに4分音符が来る弾む音型で、2拍目にアクセントが置かれるため、「タン・タタ」という刻みが前へ転がるように聴こえる。旋律は長調の素朴な民謡調が中心で、主和音と属和音を行き来する単純な和声が多いが、短調の曲や3拍子の変種も珍しくない。主役はアコーディオンで、右手が旋律、左手がベースとコードを刻み、蛇腹を大きく揺らして息を送り込む「ベロウ・シェイク」が代表的な奏法だ。2枚のリードをわずかにずらして調律したトレモロによって、音は波打つように太くなる。チェコ系やメキシコ系の楽団はボタン式のダイアトニック・アコーディオンを使い、クラリネット、トランペット、テナー・サックス、コントラバス、チューバ、バンジョー、ギター、スネア・ドラムが加わる。クラリネットは木質の丸い音で細かな装飾音を回し、ヴァイオリンが二重奏で旋律を支える地方もある。曲は8小節の主題を2つ並べてAABBと反復し、次にトリオと呼ばれる別の主題へ移る形が基本で、同じ旋律を何周もしながら主旋律の楽器を代え、終盤はテンポを上げて畳みかける。歌は地声に近い明るい声で、合間に「ホイ」「ヤー」と掛け声を入れ、アルプス地方ではヨーデルが混ざる。歌詞は村の恋、踊りの誘い、酒と宴会、故郷への郷愁が中心だ。同じ2拍子でも、まっすぐ進むマーチや、なめらかに歩くショティッシュとは違い、ポルカは小さく跳ねながら回るステップを要求する。鳴る場所は村の広場や結婚披露宴、舞踏会場のほか、ドイツ語圏のビール・テント、米国中西部のポルカ・ホール、テキサスやメキシコ北部のダンス・ホールである。</p>
<h2>成り立ち</h2><p>ポルカの原型は1830年前後のボヘミア（現在のチェコ）東部の農村で生まれたとされる。1844年に雑誌『ボヘミア』に載った起源譚がもっとも古い記録で、それによれば、音楽教師ヨゼフ・ネルダが、村の娘アンナ・スレザコヴァー（出生名アンナ・チャディモヴァー）が民謡「ストリーチェク・ニムラ・コウピル・シムラ」に合わせて風変わりに踊る姿を見て旋律を五線紙に採譜し、若者たちに教えたという。この話は後年の脚色を含む伝承で、最初に踊られた場所についてもフラデツ・クラーロヴェーとする説とラベ川沿いのティーネツとする説が併存しており、どちらが正しいかは決着していない。名称の語源には、チェコ語のプルカ（半分）から来たという有力な説があり、チェコの文化史家チェニェク・ジーブルトは、半分のテンポを意味する2分の2拍子と跳躍の半歩を指すと説明した。ただし1830年から1831年のポーランド十一月蜂起のあと、ポーランドへの連帯を示すために「ポルカ（ポーランドの女性）」と綴るようになったという説明もあり、語源には政治的な含みが重なっている。印刷されたポルカの最初期の例としては、ヤチーン近郊コピドルノの教師フランチシェク・マチェイ・ヒルマルが1837年前後に発表した「エスメラルダ」が知られる。1830年代半ばから後半にプラハの舞踏会へ入り、1839年にはウィーン、1840年にはパリ（紹介したのはヨハン・ラーブ）、1844年にはロンドンへ届き、やがて移民とともにアメリカ大陸へ渡った。ウィーンでは舞踏会の定番となり、ヨハン・シュトラウス2世は生涯に160曲以上のポルカを書き、「トリッチ・トラッチ・ポルカ」や弟ヨーゼフとの合作「ピチカート・ポルカ」、エドゥアルト・シュトラウスの「バーン・フライ」などが今も演奏され続ける。ヨーゼフ・ランナーら初期の舞踏会音楽家もレパートリーに加えた。チェコ側ではベドルジハ・スメタナが『売られた花嫁』第1幕にポルカを置き、アントニン・ドヴォルジャークもスラヴ舞曲集に2拍子のポルカを取り込んだ。ポルカをチェコの国民的象徴と見なす語りは、オーストリア帝国支配下で民族意識を掲げた19世紀の運動と結びついており、純粋に音楽的な分類とは切り離せない。北欧では19世紀後半にポルカが入り、ガンメルダンスと呼ばれる舞曲行事の一部になった。フィンランドの「イエヴァン・ポルッカ」は、1700年代から知られる民謡旋律にエイノ・ケットゥネンが1928年に歌詞を付けたもので、1937年にマッティ・ユルヴァが別の旋律で録音し、ロイトゥマの1995年のアルバム収録曲が1996年のテレビ番組で広まり、2006年にはループ映像「ロイトゥマ・ガール」に使われて世界規模の流行になった。スロベニアではスラフコ・アヴセニクとアンサンブル・ブラトフ・アヴセニクが「ナ・ゴリツィ」（トランペット・エコー）で知られるスロヴェンスカ・ポルカを確立し、1950年代後半にはドイツでウィル・グラーエの録音による「ビヤ樽ポルカ」「リヒテンシュタイン・ポルカ」が世界的なヒットになった。ヤロミール・ヴェイヴォダが1927年に書いた「モドジャンスカ・ポルカ」は、1934年にヴァシェク・ゼマンの歌詞で「シュコダ・ラースキ」となり、1939年にアンドリューズ・シスターズの英語版「ビヤ樽ポルカ」とウィル・グラーエの器楽版が全米で大当たりして、戦時の飲酒歌として定着した。アメリカでは移民が各地にポルカを持ち込み、シカゴのポーランド系はアコーディオンの蛇腹を激しく揺らす「プッシュ」スタイルと、ディキシーランド風の「ホンキー」スタイルを作り、クリーブランドのスロベニア系ではテナー・サックスとアコーディオンが主旋律を担う滑らかな演奏が主流になった。フランキー・ヤンコヴィッチ（1915〜1998）は1948年6月9日にミルウォーキーで行われた対バン形式の競演に勝って「ポルカ王」を名乗り、1947年の「ジャスト・ビコーズ」と1949年の「ブルー・スカート・ワルツ」でプラチナ・ディスクを獲得、生涯に200曲以上を録音して3000万枚を売り、1986年には第1回ポルカ・グラミー賞を受賞した。ドイツ系のバンドは自らをポルカ・バンドと呼ばれることを好まず、ローレンス・ウェルクのように「オールドタイム」と称する例もあった。ポーランド系ではエディ・ブラゾンチクのヴァーサトーンズ、リル・ウォーリー・ヤギエロ、レニー・ゴムルカらが活躍した。シカゴでは1963年に第1回の全国ポルカ協議会が開かれ、インターナショナル・ポルカ・アソシエーションは1968年にポルカ音楽の殿堂を設立して毎年大会を開いている。全米ポルカ・アルバム部門のグラミー賞は1985年に始まり2009年に廃止され、ポルカを放送するラジオ局は1989年の354局から2012年には221局へ減った。現在の米国のポルカ聴衆は60〜85歳が中心で年齢の中央値は74歳、テキサス州シュレンバーグにはテキサス・ポルカ音楽博物館がある。テキサスとメキシコ北部では、ドイツ系・チェコ系移民のポルカが2列ボタンのアコーディオンとバッホ・セクストのコンフントに移し替えられ、サンティアゴ・ヒメネス（1913〜1984）が2ボタン・アコーディオンの革新者として「ビバ・セギン」などを残し、息子のフラコ・ヒメネスがノルテーニョ／テハーノとして世界に広めた。派生形には、ゆっくり優雅なポルカ・フランセーズ、マズルカのテンポで踊るポルカ・マズルカ、ギャロップ並みに速いポルカ・シュネルがあり、ポーランドには3拍子のトラムブランカ、ベラルーシにはヴィツェバンカなどの地方変種、アイルランドのスライヴ・ルアクラ地方には2/4拍子で32小節・AABB構成のポルカが数千曲伝わる。アルゼンチンのパンパでは3拍子の非常に速いポルカがギター（6弦、ときに7弦）とアコーディオン、コントラバスで演奏され、パラグアイやキュラソーにも独自のポルカがある。現在もオクトーバーフェストや各地のポルカ祭、インターナショナル・ポルカ・アソシエーションの大会で演奏され続けており、2025年8月には第57回の大会が開かれた。</p>
