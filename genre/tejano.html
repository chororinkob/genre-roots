<h1>Tejano（テハーノ）とは</h1>

<p>テハーノは、アメリカのテキサス州に暮らすメキシコ系の人々が作り上げた音楽だ。同じ国境地帯のノルテーニョと同じ源から分かれた、密接に関連する音楽である。

ノルテーニョは、手風琴と複弦ギターの伝統的な編成を保っている。これに対し、ポップ志向のグルポは、同時代のアメリカのポップスの作り方を積極的に取り込む。手風琴を中心にした小編成のコンフント形式に対し、グルポ形式では鍵盤とシンセサイザーが土台になる。手風琴を使わないものも多い。シンセサイザーは、和音の土台やメロディを受け持つ。

テンポは中くらいで、和音は単純な進行が中心であることが多い。そこに時々、リズム・アンド・ブルース由来の色合いが加わる。

ドラムは打ち込みか、ポップス風に仕上げた生演奏であることが多い。低音では、エレクトリックベースが滑らかに動くことが多い。リズムは、ポルカの2拍子と、コロンビア由来のクンビアの跳ねた刻みに加え、ランチェーラ、ワルツ、バラードなども主要な要素となる。ポルカはヨーロッパ生まれで、移民によってテキサスやメキシコ北部に定着した。とりわけクンビアは、この分野で独自の融合を遂げ、テハーノ独自のクンビアになった。

歌い方は、感情を込めて伸びやかに歌い上げる形が中心だ。複数の声で和音を作ることもある。

歌詞の言葉は、スペイン語と英語が自由に混ざり、同じ曲の中で切り替わることも多い。これは、二つの文化の間に生きる人々の言葉の暮らしを、そのまま映している。</p>
<h2>成り立ち</h2><p>テキサスは1836年に独立し、1845年に併合された。1848年の条約で、リオ・グランデが国境に決まった。メキシコ系の人々は、この条約で米国市民権と財産権を保障された。しかし実際には、差別と権利の侵害を受けた。

この音楽の源流は、19世紀半ばの北メキシコとテキサスにさかのぼるとされる。一方で、現代的な形になったのは1980年代とされるなど、始まりには諸説ある。彼らは差別と貧困の中で、独自の文化を守り続けた。その音楽もまた、メキシコのものでもアメリカのものでもない、中間的な性格を持つようになる。

20世紀前半には、二つの流れがあった。ひとつは、手風琴と複弦ギターによる労働者階級の小編成だ。もうひとつは、1940年代にBeto Villaらが固めた洗練されたスタイルで、アメリカの大楽団の編成でメキシコの曲を演奏した。こちらは、社会的に上を目指す層に支持された。

1960年代から1970年代、公民権運動と連動したチカーノ運動が高まる。メキシコ系であることを恥じるのではなく、誇るという意識が広がった。Little Joe y la Familiaは、この意識をもって二つのスタイルをひとつにまとめた。また、英語とスペイン語のコード・スイッチング(両言語の混用)を取り入れた。

1980年代には、Mazz、La Mafia、Selena y Los Dinosなどの世代が、シンセサイザーを取り入れ、ポップ化を進めた。La Mafiaは、ロック風の演出で知られる。

最も重要な存在とされるのが、Selenaである。彼女はテキサスで生まれた。スペイン語は流暢ではなく、歌詞を音として覚えて歌っていた。このこと自体が、彼女の世代が置かれた立場をよく表している。彼女は圧倒的な魅力で、この分野を全国的なものにした。英語圏への進出も準備していた。

しかし1995年3月、ファンクラブの責任者だった女性に射殺される。23歳だった。死後発売の『Dreaming of You』（1995）は、Billboard 200で初登場1位を記録した。

人気は下火になったとされるが、その要因は複数ある。ラジオでは、汎ラテン系フォーマットとの競合が強まった。それでも、彼女が示した可能性は、その後のラテン系の音楽家に受け継がれているとされる。</p>
