<h1>Tejano（テハーノ）とは</h1>
<p>アメリカのテキサス州に暮らすメキシコ系の人々が作り上げた音楽である。同じ国境地帯のノルテーニョと編成の一部を共有するが、方向性は明確に異なる。ノルテーニョが手風琴と複弦ギターの伝統的な編成を保つのに対し、こちらは同時代のアメリカの</p>
<p>アメリカのテキサス州に暮らすメキシコ系の人々が作り上げた音楽である。同じ国境地帯のノルテーニョと編成の一部を共有するが、方向性は明確に異なる。ノルテーニョが手風琴と複弦ギターの伝統的な編成を保つのに対し、こちらは同時代のアメリカのポップスの制作を積極的に取り込む。編成の中心には依然としてボタン式の手風琴があるが、そこへシンセサイザーが大量に加えられ、和音の敷物や旋律を担う。ドラムは打ち込みか、ポップス的に処理された生演奏で、低音はエレクトリックベースが滑らかに動く。リズムはメキシコ由来のポルカの二拍子と、コロンビア由来のクンビアの跳ねた刻みが二本の柱となる。とりわけ後者はこの分野で独自の変形を遂げ、より遅く重い形になった。テンポは中庸で、和声は単純な進行に、時にリズム・アンド・ブルース由来の色彩が加えられる。歌唱は感情を込めて伸びやかに歌い上げる形が中心で、複数の声による和音も用いられる。言語はスペイン語と英語が自在に混ざり、しばしば同じ曲の中で切り替わる。これは二つの文化の間に生きる人々の言語生活をそのまま反映している。</p>
<h2>成り立ち</h2><p>1848年の戦争によってメキシコが領土の約半分を失った後、テキサスに住み続けたメキシコ系の人々は、自国の土地で外国人として扱われる立場に置かれた。彼らは差別と貧困の中で独自の文化を維持し、その音楽もまた、メキシコのものでもアメリカのものでもない中間的な性格を持つに至る。20世紀前半には二つの流れがあった。ひとつは手風琴と複弦ギターによる労働者階級の小編成、もうひとつは1940年代にBeto Villaらが確立した、アメリカの大楽団の編成でメキシコの楽曲を演奏する洗練された様式である。後者は、社会的な上昇を志向する層に支持された。1960年代から1970年代、公民権運動と連動したチカーノ運動が高まると、メキシコ系であることを恥じるのではなく誇るという意識が広がる。Little Joe y la Familiaは、この意識をもって二つの様式を統合し、また英語とスペイン語を対等に用いた。1980年代にはLa Mafiaが電子楽器を全面的に導入し、この分野を現代的なポップスへ変えた。決定的な存在となったのがSelenaである。彼女はテキサスで生まれ、当初スペイン語をほとんど話せず、歌詞を音として覚えて歌っていた。この事実自体が、彼女の世代の置かれた立場を象徴している。彼女は圧倒的な魅力によってこの分野を全国的なものにし、英語圏への進出を準備していた。しかし1995年3月、ファンクラブの責任者であった女性に射殺される。享年23である。死後に発表された作品は全米で初登場一位を記録した。彼女の死はこの分野に大きな空白を残し、ラジオの編成もその後縮小へ向かったが、彼女が示した可能性は、その後のラテン系の音楽家に受け継がれている。</p>
<h2>代表曲</h2><ul><li>Baila Esta Cumbia (Selena)</li><li>Las Nubes (Little Joe y La Familia)</li><li>Amor Prohibido (Selena)</li></ul>
