<h1>Anison（アニソン）とは</h1>
<p>アニメソングは、アニメーション作品の主題歌や挿入歌を指す総称で、アニソンとも呼ばれる。作品世界を約1分半で説明しきる機能が求められる。 テンポは速い曲が多いが、曲により大きく異なる。 和声（コードの響き）について、定番とされる型の</p>
<p>アニメソングは、アニメーション作品の主題歌や挿入歌を指す総称で、アニソンとも呼ばれる。作品世界を約1分半で説明しきる機能が求められる。

テンポは速い曲が多いが、曲により大きく異なる。

和声（コードの響き）について、定番とされる型の一つに、終盤の転調（半音〜全音上）がある。

歌い手は大きく分けると、アニメ専門の歌手、声優、一般のアーティストの三系統がある。

歌詞は、主人公の決意、仲間との絆、運命への抵抗といった主題を扱う。作品の固有名詞やトレードマークを織り込みながら歌う。初期には、作品名やロボットの名を連呼する曲が主流だった。1980年代以降は、一般のポップスと区別のつかない曲も増えた。

主題歌は、劇中で流れる背景の音楽（劇伴）とは、近年は別の担当者が作ることが多い。しかし1960〜70年代には、同じ作曲家が主題歌と劇伴の両方を担当する例が多かった。

放送用の長さ（尺）は、テレビアニメのオープニングは通常89秒（約1分半）で、例外もある。この短さに導入・盛り上がり・決めを詰め込むため、イントロが数秒しかない曲や、いきなりサビから始まる曲が多い。</p>
<h2>成り立ち</h2><p>1963年、日本初の本格的な連続テレビアニメーション「鉄腕アトム」が始まった。この作品が、本編の前後に主題歌を付ける基本の形のきっかけになったとされる（歌入りの主題歌が流れたのは第31話以降で、唯一の起源とは言えず、1929年製作の実験映画を始まりとする見方もある）。

主題歌は、谷川俊太郎が詞を、高井達雄が曲を書き、子どもの合唱で歌われた。この曲は、作品名を歌い込む形の原型になった。

1960年代末から1970年代にかけて、日本コロムビアがアニメスタジオとの関係を築き、レコードの制作体制を強化した。1970年代後半以降、ビクター、キング、キャニオンなど各社がアニメソングに注力した。1981年にはキングレコードにアニメ専門のスターチャイルドが発足した。水木一郎、ささきいさお、堀江美都子、子門真人といった専門の歌手が育つ。とくに1970年代のロボットアニメでは、主人公や技・武器の名称を連呼する歌詞が主流だった。

1979年の「機動戦士ガンダム」は、物語の複雑さで従来の子ども向けの枠を越え、視聴者の年齢層を押し上げる。

1980年代に入ると、転機が来る。一般の歌手の主題歌自体は、1972年の「海のトリトン」の南こうせつとかぐや姫など、以前からあった。しかし1983年の「キャッツ・アイ」の杏里が、オリコン集計で82万枚（一部資料では130万枚）の大ヒットとなった。それ以降、一般の歌手のポップスを主題歌に据えるタイアップ（作品と歌を組み合わせて宣伝する）方式が広がった。1985年の「タッチ」や1987年の「シティーハンター」は、その流れの代表例となった。専門歌手の仕事は減った。この方式は、以後広く行われるようになった。

1995年の「新世紀エヴァンゲリオン」の主題歌「残酷な天使のテーゼ」は、高橋洋子の力強い歌唱と、及川眠子の抽象的な詞で、作品の枠を越えて長く歌い継がれる曲となった。1990年代末から2000年代にかけては、深夜放送のアニメが急増し、声優が歌手として売り出される流れが定着する。またJAM Projectのような専門歌手の集団が結成され、海外の催しでの公演を重ねた。

2010年代には、「進撃の巨人」の「紅蓮の弓矢」を収録したシングル『自由への進撃』が、オリコン週間2位となった。2019年の「鬼滅の刃」の主題歌としてLiSAが歌った「紅蓮華」は、オリコン3位、Billboard Japan Hot 100で2位となった。同時に、動画配信によってアニメが世界同時に見られるようになったことで、主題歌が国際的に聴かれる例も出た。YOASOBIの「アイドル」が2023年に世界規模のチャートで上位に入った。</p>
