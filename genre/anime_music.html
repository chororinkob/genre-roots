<h1>Anison（アニソン）とは</h1>
<p>アニメーション作品の主題歌や挿入歌を指す総称で、アニソンとも呼ばれる。作品世界を数十秒で説明しきる機能が求められるため、独特の作りを持つ。放送用の尺は通常89秒とされており、この短さに導入・盛り上がり・決めを詰め込むため、イントロ</p>
<p>アニメーション作品の主題歌や挿入歌を指す総称で、アニソンとも呼ばれる。作品世界を数十秒で説明しきる機能が求められるため、独特の作りを持つ。放送用の尺は通常89秒とされており、この短さに導入・盛り上がり・決めを詰め込むため、イントロが数秒しかない曲や、いきなりサビから始まる曲が多い。テンポは速い曲が多いが曲により大きく異なり、8分音符や16分音符で細かく刻んだギターと打ち込みのドラムが疾走感を作る。和声は短調から長調へ転じる展開や、最後に半音上へ転調して締める型が定番。旋律の音域が広く、跳躍が多いため歌唱には力量が要る。歌詞は主人公の決意、仲間との絆、運命への抵抗といった主題を、作品の固有名詞や象徴を織り込みながら歌う。初期には作品名やロボットの名を連呼する曲が主流だったが、1980年代以降は一般のポップスと区別のつかない曲も増えた。歌い手はアニメ専門の歌手、声優、一般のアーティストの三系統があり、劇中で流れる伴奏音楽（劇伴）とは、近年は別の担当者が作ることが多いが、1960〜70年代には同じ作曲家が主題歌と劇伴の両方を担当する例が多かった。</p>
<h2>成り立ち</h2><p>1963年、日本初の本格的な連続テレビアニメーション「鉄腕アトム」が、本編の前後に主題歌を付ける基本形式のきっかけになったとされる（歌入りの主題歌が流れたのは第31話以降で、唯一の起源とは言えず、1929年製作の実験映画を始まりとする見方もある）。谷川俊太郎が詞を、高井達雄が曲を書き、子どもの合唱で歌われたこの曲は、作品名を歌い込む形式の原型になった。1960年代末から1970年代にかけて、日本コロムビアがアニメスタジオとの関係を築いてレコードの制作体制を強化し、1970年代半ば以降にはレコード会社がアニソン専門の部署を設け、水木一郎、ささきいさお、堀江美都子、子門真人といった専門の歌手が育つ。とくに1970年代のロボットアニメの隆盛は、主人公機の名を絶叫する熱血調の様式を確立した。1979年の「機動戦士ガンダム」は物語の複雑さで従来の子ども向けの枠を越え、視聴者の年齢層を押し上げる。1980年代に入ると転機が来る。一般の歌手の主題歌自体は1972年の「海のトリトン」の南こうせつとかぐや姫など以前からあったが、1983年の「キャッツ・アイ」の杏里が100万枚を超えるヒットとなって以降に、一般の歌手のポップスを主題歌に据えるタイアップ方式が広がり、1985年の「タッチ」や1987年の「シティーハンター」はその流れの代表例となって、専門歌手の仕事は減った。この方式はレコード会社にとって宣伝効率が高く、以後の標準になる。1995年の「新世紀エヴァンゲリオン」の主題歌「残酷な天使のテーゼ」は、高橋洋子の力強い歌唱と及川眠子の抽象的な詞で、作品の枠を越えて長く歌い継がれる曲となった。1990年代末から2000年代にかけては深夜放送のアニメが急増し、声優が歌手として売り出される流れが定着する。またJAM Projectのような専門歌手の集団が結成され、海外の催しでの公演を重ねた。2010年代には「進撃の巨人」の「紅蓮の弓矢」、2019年の「鬼滅の刃」の主題歌としてLiSAが歌った「紅蓮華」が大衆的な大ヒットとなり、アニソンは日本の音楽市場の主流に組み込まれる。同時に、動画配信によってアニメが世界同時に見られるようになったことで、主題歌もそのまま国際的に消費されるようになった。YOASOBIの「アイドル」が2023年に世界規模のチャートで上位に入ったことは、その到達点を示している。</p>
