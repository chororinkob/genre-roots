<h1>Anison（アニソン）とは</h1>
<p>アニメーション作品の主題歌や挿入歌を指す総称で、アニソンとも呼ばれる。作品世界を数十秒で説明しきる機能が求められるため、独特の作りを持つ。放送用の尺は約89秒に固定されており、この短さに導入・盛り上がり・決めを詰め込むため、イント</p>
<p>アニメーション作品の主題歌や挿入歌を指す総称で、アニソンとも呼ばれる。作品世界を数十秒で説明しきる機能が求められるため、独特の作りを持つ。放送用の尺は約89秒に固定されており、この短さに導入・盛り上がり・決めを詰め込むため、イントロが数秒しかない曲や、いきなりサビから始まる曲が多い。テンポは150〜190BPMと速く、8分音符や16分音符で細かく刻んだギターと打ち込みのドラムが疾走感を作る。和声は短調から長調へ転じる展開や、最後に半音上へ転調して締める型が定番。旋律の音域が広く、跳躍が多いため歌唱には力量が要る。歌詞は主人公の決意、仲間との絆、運命への抵抗といった主題を、作品の固有名詞や象徴を織り込みながら歌う。初期には作品名やロボットの名を連呼する曲が主流だったが、1980年代以降は一般のポップスと区別のつかない曲も増えた。歌い手はアニメ専門の歌手、声優、一般のアーティストの三系統があり、劇中で流れる伴奏音楽（劇伴）とは制作も担当者も別である点に注意が要る。</p>
<h2>成り立ち</h2><p>1963年、日本初の連続テレビアニメーション「鉄腕アトム」の主題歌が出発点とされる。谷川俊太郎が詞を、高井達雄が曲を書き、子どもの合唱で歌われたこの曲は、作品名を歌い込む形式の原型になった。1960年代から1970年代にかけて、日本コロムビアや日本ビクターがアニメの音楽を専門に扱う部署を持ち、水木一郎、ささきいさお、堀江美都子、子門真人といった専門の歌手が育つ。とくに1970年代のロボットアニメの隆盛は、主人公機の名を絶叫する熱血調の様式を確立した。1979年の「機動戦士ガンダム」は物語の複雑さで従来の子ども向けの枠を越え、視聴者の年齢層を押し上げる。1980年代に入ると転機が来る。1985年の「タッチ」や1987年の「シティーハンター」のように、作品と直接の関係を持たない一般の歌手のポップスを主題歌に据えるタイアップ方式が広がり、専門歌手の仕事は減った。この方式はレコード会社にとって宣伝効率が高く、以後の標準になる。1995年の「新世紀エヴァンゲリオン」の主題歌「残酷な天使のテーゼ」は、高橋洋子の力強い歌唱と及川眠子の抽象的な詞で、作品の枠を越えて長く歌い継がれる曲となった。1990年代末から2000年代にかけては深夜放送のアニメが急増し、声優が歌手として売り出される流れが定着する。またJAM Projectのような専門歌手の集団が結成され、海外の催しでの公演を重ねた。2010年代には「進撃の巨人」の「紅蓮の弓矢」、2019年の「鬼滅の刃」の主題歌としてLiSAが歌った「紅蓮華」が大衆的な大ヒットとなり、アニソンは日本の音楽市場の主流に組み込まれる。同時に、動画配信によってアニメが世界同時に見られるようになったことで、主題歌もそのまま国際的に消費されるようになった。YOASOBIの「アイドル」が2023年に世界規模のチャートで上位に入ったことは、その到達点を示している。</p>
<h2>代表曲</h2><ul><li>紅蓮華（LiSA）</li><li>アイドル（YOASOBI）</li><li>残酷な天使のテーゼ（高橋洋子）</li><li>君の知らない物語（supercell）</li><li>only my railgun（fripSide）</li></ul>
