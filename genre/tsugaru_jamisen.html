<h1>Tsugaru-jamisen（ツガルジャミセン）とは</h1>
<p>一言でいうと、撥で胴を叩き鳴らす打楽器のような三味線の独奏音楽だ。代表曲22曲を動画で聴け、ルーツと影響のつながりを地図でたどれる。</p>
<p>一言でいうと、撥で胴を叩き鳴らす打楽器のような三味線の独奏音楽だ。

中心になるのは太棹と呼ばれる大型の三味線だ。棹は太く、弦も他の三味線より太い。胴には厚い犬の皮を張り、棹の先に東ザワリという金属のねじを差し込んで、最低音の弦をビリつかせる。撥は小さめの木製で、弦を弾くというより上から叩きつける。

音階はドレミソラの5音が基本になる。左手は人差し指と薬指を中心に使い、弦を押して音を曲げる。撥を下から上へすくい上げるスクイ、指で弦をはじくハジキ、指で皮を打つウチ指を組み合わせる。同じ旋律でも、装飾の入れ方が奏者ごとに変わる。

リズムは4拍子を土台にしながら、叩きのアクセントが拍の頭だけでなく細かい裏にも入る。導入はゆっくりで、進むにつれて段階的に速くなり、最後は撥が皮を打つ音の連打で畳みかける。

歌は原則として入らない。歌が付く場合も、津軽の方言と節回しで伸びやかに歌い、三味線がその合間に応答を差し込む。歌詞は稲作、漁、雪国の暮らし、恋や別れを題材にする。

曲は前弾き、歌、間奏、曲弾きの順で組み立てる。代表的な津軽じょんがら節では、歌のない曲弾きが後半の見せ場になる。奏者が即興で手数を足す部分であり、その日の演奏で長さも密度も変わる。民謡の伴奏として舞台の袖で鳴らす他の三味線と違い、ここでは三味線が主役として正面に出る。

鳴る場所は、公民館やホールの大会、観光施設の毎日の実演、居酒屋のカウンター前だ。客の目の前で、皮を打つ音と弦の唸りが直接届く。</p>
<h2>成り立ち</h2><p>津軽半島は本州の北端、現在の青森県西部にあたる。冬は雪が深く、米作だけでは暮らしが立たない土地だった。ここに、視覚に障害のある男たちの門付け芸があった。ボサマと呼ばれ、家々の玄関先で三味線を弾いて米や銭をもらった。彼らは社会の底に置かれ、記録を残さなかった。そのため津軽三味線の起源は、いまも口伝と証言からしかたどれない。楽器そのものは、中国の三絃が沖縄を経て16世紀に日本へ入り、江戸時代に三味線として育ったものだ。

研究者の大條和雄は、聞き取りをもとに仁太坊（1857-1928、本名は秋元仁太郎）を始祖とする説を出した。金木村に生まれた仁太坊は、1877年に三味線を手に入れて手を加え、しゃもじ形に丸めた撥を作った。三味線を立てて構え、駒の周りまで打ち鳴らす。撥で叩く音を音楽の中心に据えた。ただし歴史学者のジェラルド・グレーマーは、文書が残っていないことを理由に、この説の裏付けを疑問視している。

仁太坊には目の不自由な弟子が何人もいた。最後の弟子が白川軍八郎である。軍八郎は旅回りの一座に加わって津軽の外へ出て、東京の劇場にも立った。1920年代に人気が広がったが、日中戦争が始まると勢いを失う。1959年、軍八郎は演歌歌手の三橋美智也と東京の日劇で共演した。これが大きな露出になり、若い奏者が育つきっかけになった。

同じ頃、高橋竹山（1910-1998、本名は高橋定蔵）がいた。竹山もボサマとして育ち、民謡歌手の成田雲竹の伴奏を長く務めた。1964年にその師弟関係を解き、単独で動き始める。この年、塩釜の公民館で初めて三味線の独奏を披露した。客が自分の演奏だけに耳を傾けていると気づいたことが、独奏へ踏み出すきっかけになった。1971年以降、竹山の名前は全国に広がり、津軽三味線は聴いて楽しむ音楽として認識されていく。

木田林松栄（1911-1979）は「叩きの林松栄」と呼ばれた奏者だ。1970年ごろ、竹山と並ぶ名人として「弾きの竹山、叩きの林松栄」と対比された。1970年には家元制度と名取制を導入し、弟子の組織化に踏み切る。小山貢が1967年に始めた仕組みを参考にしたものだった。

1960年代の民謡ブームのなかで、三橋美智也がこの音楽を「津軽三味線」と呼び、名前が定着した。それまで「津軽もの」と呼ばれていた地域の芸に、全国で通じる看板が付いた瞬間だ。1970年代には歌の前の前弾きが独奏として独立する。1975年ごろからは、即興を交えたロック的なソロへ重心が移った。

1980年代、高橋祐次郎のグループ「風」が合奏の形で舞台に上げた。1982年には弘前市で第1回の全国大会が開かれる。この大会は後に世界大会となり、海外からの参加者も集まる。1989年には金木大会、1998年には浅草でコンクール、2007年には青森市で日本一決定戦が始まり、競技としての土台が各地に整った。

1999年、吉田兄弟が『いぶき』でデビューした。2005年の『RISING』では打ち込みやロックのリズムと組み、太棹の音をクラブ音楽の文脈に持ち込んだ。上妻宏光は1973年生まれで、1989年に史上最年少で全日本大会を制し、2001年の『AGATSUMA』でメジャーデビュー、2002年の『BEAMS』は2003年にアメリカでも発売された。木乃下真市も独奏を軸に活動する。地元では五所川原市金木の津軽三味線会館や弘前の観光施設が毎日実演を続け、居酒屋でも生演奏が聴ける。</p>
