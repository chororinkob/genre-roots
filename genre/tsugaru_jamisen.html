<h1>Tsugaru-jamisen（ツガルジャミセン）とは</h1>
<p>撥で胴を叩き鳴らす、打楽器のような三味線の独奏音楽だ。代表曲22曲を動画で聴け、ルーツと影響のつながりを地図でたどれる。</p>
<p>撥で胴を叩き鳴らす、打楽器のような三味線の独奏音楽だ。

中心になるのは太棹と呼ばれる大型の三味線だ。棹は太く、弦も他の三味線より太い。胴には厚い犬の皮を張る。棹の先には東ザワリという金属のねじを差し込み、最低音の弦をビリつかせる。撥は先端が鼈甲製の小ぶりなもので(代用品にプラスチックを使うこともある)、弦を弾くというより上から叩きつける。

音階はドレミソラの5音が基本になる。左手は人差し指と薬指を中心に使い、弦を押して音を曲げる。撥を下から上へすくい上げるスクイ、指で弦をはじくハジキ、左手の指で弦を打ち付けて音を出すウチ指を組み合わせる。同じ旋律でも、装飾の入れ方は奏者ごとに変わる。

リズムは2拍子(2/4)が基本で、曲によって7拍子や3拍子になることもある。叩きのアクセントは拍の頭だけでなく、細かい裏にも入る。導入はゆっくりで、進むにつれて段階的に速くなる。終わりは、一の糸を連打したあと、二の糸・三の糸で細かいフレーズを重ね、三の糸の高音を響かせ、音を小さくして低いツボへ戻ってエンディングを迎える。

歌はふつう入らない。歌が付く場合も、津軽の方言と節回しで伸びやかに歌い、三味線がその合間に応答を差し込む。歌詞は稲作や漁、雪国の暮らし、恋や別れを題材にすることが多いとされる。

前弾き(歌の前の前奏)が独奏として独立したものが曲弾きで、唄付けとは別の形態だ。代表的な津軽じょんがら節では、歌のない曲弾きが見せ場になる。奏者が即興で手数を加える部分で、その日の演奏によって長さも密度も変わる。民謡の伴奏として舞台の袖で鳴らされる他の三味線と違い、ここでは三味線が主役として正面に出る。

鳴る場所は、公民館やホールの大会、開館期間中(4〜11月)に毎日1日5回の生演奏がある観光施設、居酒屋のカウンター前などだ。客の目の前で、皮を打つ音と弦の唸りが直接届く。</p>
<h2>成り立ち</h2><p>舞台は津軽地方、本州北部に突き出た青森県西部だ。ここに、目の不自由な男たちによる門付け芸があった。彼らはボサマと呼ばれ、家々の玄関先で三味線を弾いて米や銭をもらった。社会の底に置かれた彼らは、記録を残さなかった。そのため津軽三味線の起源は、いまもおおむね口伝に依るとされる。楽器そのものは、中国の三絃が沖縄(琉球)を経て16世紀に伝わったとされ、江戸時代に三味線として育った。

研究者の大條和雄は、聞き取りをもとに仁太坊(1857-1928、本名は秋元仁太郎)を始祖とする説を出した。仁太坊は金木新田の神原村(現・五所川原市金木町)に生まれ、1877年とも1878年(明治11年)ともされる年に三味線を手に入れて手を加えた。しゃもじ形に丸めた撥を作り、三味線を立てて構え、駒の周りまで打ち鳴らす。撥で叩く音を音楽の中心に据えたのが仁太坊だ。ただし歴史学者のジェラルド・グローマーは、文書が残っていないことを理由に、この説の裏付けを疑問視している。

仁太坊には目の不自由な弟子が何人もいた。最後の弟子が白川軍八郎である。軍八郎は旅回りの一座に加わって津軽の外へ出て、東京の劇場にも立った。1920年代に人気が広がったが、日中戦争が始まると勢いを失う。1959年、軍八郎は演歌歌手の三橋美智也と東京の日劇で共演し、再び人気を集めた。

同じ頃、高橋竹山(1910-1998、本名は高橋定蔵)がいた。竹山もボサマとして育ち、民謡歌手の成田雲竹の伴奏を長く務めた。1964年4月、雲竹の伴奏者として出た仙台労音の公演(塩釜公民館)で、主催者の求めに応じて初めて独奏を披露した。同年、雲竹の引退で師弟関係が終わった。1971年以降、竹山の名前は全国に広がり、津軽三味線は聴いて楽しむ音楽として認識されていく。

木田林松栄(1911-1979)は「叩きの林松栄」と呼ばれた奏者だ。1970年ごろ、竹山と並ぶ名人として「弾きの竹山、叩きの林松栄」と対比された。1970年には家元制度と名取制を導入し、弟子の組織化に踏み切る。これは小山貢が1967年に始めた仕組みを参考にしたものだった。

昭和40年代の民謡ブームの中で、三橋美智也らが「津軽三味線」と称して定着したとされる。それまでは「津軽もの」と呼ばれていた。時代が下るにつれて、歌の前の前弾きが独奏として独立し、1975年ごろからは即興を交えたソロへ重心が移った。

1987年に結成した『津軽合奏団&quot;風&quot;KAZE』など、合奏形式の舞台も広まった。1982年には弘前市で第1回の全国大会が開かれる。この大会は後に世界大会となり、海外からの参加者も集まるとされる。1989年には金木大会、1998年には浅草でコンクール、2007年には青森市で日本一決定戦が始まり、競技としての土台が各地に整った。

1999年、吉田兄弟が『いぶき』でデビューした。2005年のシングル『RISING』はCM曲としてヒットした。上妻宏光は1973年生まれで、1989年に史上最年少で全日本大会を制した。2001年の『AGATSUMA』でメジャーデビューし、2002年の『BEAMS』は2003年にアメリカでも発売された。木乃下真市は独奏のほか、バンドやフュージョン、共演など幅広く活動する。地元では、五所川原市金木の津軽三味線会館が開館期間中(4〜11月)に毎日1日5回の生演奏を続け、弘前の観光施設や居酒屋でも生演奏が聴ける。</p>
