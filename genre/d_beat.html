<h1>D-beat（ディービート）とは</h1>
<p>特定のドラムの叩き方によって定義される、ハードコア・パンクの一派である。名称はこの型を確立したバンドの頭文字に由来する。その型とは、大太鼓を一拍目と二拍目の裏に置き、小太鼓を二拍目と四拍目に落とし、その上でシンバルが8分音符を刻み</p>
<p>特定のドラムの叩き方によって定義される、ハードコア・パンクの一派である。名称はこの型を確立したバンドの頭文字に由来する。その型とは、大太鼓を一拍目と二拍目の裏に置き、小太鼓を二拍目と四拍目に落とし、その上でシンバルが8分音符を刻み続けるというものである。この配置によって、馬が疾走するような、あるいは機械が転がり続けるような、途切れない推進力が生まれる。この型はもともとイギリスのハードロックの奏法から借りられたものだが、それをパンクの速度と単純さの中に据えたことで、独自の効果を持つに至った。テンポは概ね170から220 BPM、曲は1分から2分と短い。ギターは極端に歪ませた和音を掻き鳴らし、とりわけスウェーデンの一派では、特定の歪み装置を用いて電動鋸のような轟音を作ることが様式の一部となっている。和音の変化は最小限で、二つか三つの和音を往復するだけの楽曲も多い。低音はギターと同じ音型を重ねる。歌唱は歌わず、短く吠えるように怒鳴られ、言葉は途切れ途切れに投げつけられる。歌詞は戦争、核兵器、権力、そして人類の破滅を扱い、極めて短い断片として書かれる。図像も定型化しており、複写された白黒の戦争の写真が用いられる。</p>
<h2>成り立ち</h2><p>1977年、イングランド中部の工業都市ストーク・オン・トレントで結成されたDischargeが、この様式の全てを作った。彼らは当初、標準的なパンクを演奏していたが、次第に音楽的な装飾を削ぎ落とし、単純な和音の往復と、独特のドラムの型だけで曲を構成する方向へ進んだ。1982年に発表した作品は、東西冷戦の緊張が頂点にあった時代を背景に、核戦争と国家の暴力を主題とし、その音と主張の両面で決定的な影響を残した。歌詞は一曲あたり数行しかなく、標語のように繰り返される。この徹底した削ぎ落としが、模倣を極めて容易にしたことも重要である。1980年代前半、この様式は世界へ広まった。スウェーデンではAnti CimexやMob 47が、より粗く速い形を作り、この地域独自の轟音を確立する。ここで用いられた特定の歪み装置は、後にスウェーデンのデスメタルの音そのものを規定することになり、二つの分野は音響的に直結している。日本ではDiscloseが、この様式への異様なまでの忠実さで知られた。中心人物の川上は、Dischargeの音を可能な限り正確に再現することを生涯の目的とし、音楽ではなく雑音だという標語を掲げて、極端に歪んだ録音を作り続けた。彼は2007年に死去している。この分野には特徴的な慣習がある。バンド名の頭に、元となったバンドの名の一部を冠するという命名法が広く行われ、数百に及ぶ集団が同じ接頭辞を持つに至った。これは模倣を恥じるどころか、共通の系譜への帰属を誇る態度の表明である。この様式は、より重く遅い要素を加えたクラストパンクへ発展し、また前述の通りスウェーデンのデスメタルの音を用意した。現在も世界各地で、ほぼ同じ形のまま演奏され続けている。</p>
<h2>代表曲</h2><ul><li>Protest and Survive (Discharge)</li><li>The More I See (Discharge)</li><li>Why (Discharge)</li></ul>
