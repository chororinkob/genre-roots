<h1>D-beat（ディービート）とは</h1>
<p>特定のドラムの叩き方によって決まる、ハードコア・パンクの一派だ。名称は、この型を固めたDischargeにちなんで名付けられた。 その型とは、大太鼓を1拍目、2拍目の裏、3拍目の裏に置き、小太鼓を2拍目と4拍目に入れるものだ。右手</p>
<p>特定のドラムの叩き方によって決まる、ハードコア・パンクの一派だ。名称は、この型を固めたDischargeにちなんで名付けられた。

その型とは、大太鼓を1拍目、2拍目の裏、3拍目の裏に置き、小太鼓を2拍目と4拍目に入れるものだ。右手は大太鼓に合わせて、主にクラッシュシンバルを打つ(シンバルやハイハットを8分音符で連打する変形もある)。この配置によって、馬が疾走するような、あるいは機械が転がり続けるような、途切れずに前へ進む力が生まれる。

この型は、MotörheadやBuzzcocksから受け継いだ可能性があるとされる。それでも、パンクの速さと単純さの中に据えたことで、独自の効果を持つようになった。型を固めたのはDischargeである。古典的なDischargeのテンポは150 BPM前後とされ、曲は短いものが多い。

ギターは、極端に歪ませた和音をかき鳴らす。和音の変化は最小限で、単純な反復が中心である。

歌は、歌うというより、短く吠えるように怒鳴られる。言葉は途切れ途切れに投げつけられる。歌詞は、戦争、核兵器、権力、そして人類の破滅を扱い、極めて短い断片として書かれる。

ジャケットなどの絵柄では、Dischargeは白黒の写真を用いた。</p>
<h2>成り立ち</h2><p>1977年、イングランド中部の工業都市ストーク・オン・トレントで、Dischargeが結成された。このスタイルを固めた中心的な存在である。

彼らは当初、標準的なパンクを演奏していた。しかし次第に、音楽的な飾りをそぎ落としていく。そして、単純な和音の往復と、独特のドラムの型だけで曲を組み立てる方向へ進んだ。

1982年に発表した作品は、東西冷戦の緊張が高まっていた時代を背景に、核戦争と国家の暴力を主題にした。音と主張の両面で、決定的な影響を残した作品だ。歌詞は一曲あたり数行しかなく、標語のように繰り返される。この徹底した削ぎ落としが、まねを極めて容易にしたことも重要だ。

1980年代前半、このスタイルは世界へ広まった。スウェーデンでは、Anti Cimex(1981年結成)やMob 47(1982年結成。スウェーデンのD-beatバンドの中で最も速いとされる)が、このスタイルを発展させた。初期のスウェーデンのデスメタルは、メタルよりもパンクやD-beat、ハードコアの影響を強く受けていた。

日本では、Discloseが、このスタイルへの異様なまでの忠実さで知られた。中心人物の川上は、Dischargeに強く傾倒し、その美学を極限まで押し進めた。Dischargeの標語「Noise Not Music」を引き継いで、極端に歪んだ録音を作り続けた。彼は2007年に死去している。

この分野には、特徴的な慣習がある。バンド名の頭に、元となったバンドの名の一部を付ける命名法が広く行われ、多くのバンドが同じ接頭辞を持つようになった。これは、まねを恥じるどころか、同じ系譜の仲間であることを誇る態度の表れである。

Dischargeらのスタイルは、クラストパンクの形成に大きな影響を与えた。また前述の通り、スウェーデンの初期デスメタルは、D-beatやハードコアの影響を強く受けた。現在も世界各地で、ほぼ同じ形のまま演奏され続けている。</p>
