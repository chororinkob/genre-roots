<h1>Big Beat（ビッグビート）とは</h1>
<p>ビッグビートは、1990年代中盤にイギリスで花開いた電子音楽ジャンルであり、ブレイクビートの荒々しいノリとロックの攻撃性、そしてハウスやテクノの電子的な質感を一つの音楽に凝縮した、非常に迫力のある音を持つ。その最大の特徴は、重くひ</p>
<p>ビッグビートは、1990年代中盤にイギリスで花開いた電子音楽ジャンルであり、ブレイクビートの荒々しいノリとロックの攻撃性、そしてハウスやテクノの電子的な質感を一つの音楽に凝縮した、非常に迫力のある音を持つ。その最大の特徴は、重くひずんだドラムブレイクにある。アメンブレイクやファンクのドラムループをサンプラー（音を録音して取り込み、並べ替える機械）で切り刻み、スネアを強調した2拍目・4拍目のバックビートを前面に押し出すことで、ロックのドラムに匹敵するほどの物理的な衝撃を生み出す。テンポはおおむね100〜140BPMで、130前後が中心とされることもあり、ダンスフロアでの高揚感と疾走感を両立している。

ベースラインはアナログシンセサイザー、とりわけRoland TB-303のような機材で生成されることが多く、うねるような低音が楽曲全体を支える。ギターのリフやリックをサンプリング（既存の録音の一部を取り込んで使うこと）して組み込む手法も頻繁に用いられ、ロックとダンスミュージックの境界を意図的に曖昧にしている。音響面では、ディストーション（音の歪み）をかけたドラムの音、フィルター（音の帯域を削る装置）を大きく開閉するオートワウ（音色を周期的にうねらせる効果）的な処理、そして短いディレイ（音を遅らせて繰り返す効果）やフランジャー（音をうねらせる効果）による空間演出が特徴的だ。

ボーカルが入る楽曲では、サンプリングされた短いフレーズやシャウトが断片的に挿入されることが多く、歌詞を持つ完全な歌唱よりもサンプルコラージュとしての使われ方が主流だ。曲の構成はビルドアップ（徐々に盛り上げる部分）とドロップ（山場で一気に爆発する部分）を繰り返す構造を取ることが多く、フィルターを絞って緊張感を高めた後に一気に解放する爽快感が聴かせどころとなる。

アシッドハウスのTB-303使いやヒップホップのサンプリング文化とは共通点を持ちながら、ビッグビートはよりロック的な荒々しさと大衆的な耳に残りやすさを優先する点で区別される。テクノの反復的なミニマリズム（要素を最小限にする作り方）とも異なり、メロディアスなフック（耳に残る一節）や映画的なサンプルを積極的に取り入れることで、クラブだけでなくラジオや映画のサウンドトラックでも機能する音楽として設計されている。実際にこのジャンルの楽曲は、スポーツ中継のBGMや広告音楽、アクション映画のトレーラーなどで広く使用された。</p>
<h2>成り立ち</h2><p>ビッグビートの誕生は、1990年代初頭のイギリスにおけるレイヴカルチャーの爆発的な拡大と、その後の商業化・大衆化という流れの中に位置づけられる。1988年から1989年にかけての「セカンドサマーオブラブ」でアシッドハウスとエクスタシー文化が若者層に浸透し、ブレイクビートハードコアやジャングルといったジャンルが次々と生まれた。しかし1990年代中盤になると、これらのジャンルはよりアンダーグラウンドな方向へ進化する一方、より広い聴衆に向けた電子音楽の形を模索する動きが生まれた。その答えの一つがビッグビートであった。

地理的な中心地はイングランド南部、とりわけブライトンとロンドンであった。ブライトンはFatboy Slim（本名Norman Cook）が活動の拠点とした都市であり、ロンドンのクラブの世界とは異なる、よりカジュアルでロック的な気質を持つ土地柄がビッグビートの考え方と合った。

ジャンルの形成において最も重要な人物の一人がNorman Cookである。元々The Housemartinsのベーシストだった彼は、Fatboy Slim名義で1996年にアルバム『Better Living Through Chemistry』を発表し、ロックとダンスミュージックを融合させたサウンドを世に示した。続く1998年の『You've Come a Long Way, Baby』は全英チャート1位を記録し、「The Rockafeller Skank」「Praise You」「Right Here, Right Now」といったシングルが世界的なヒットとなった。「The Rockafeller Skank」はDuane Eddyの「Twistin' 'N' Twangin'」やBrian Poole &amp; The Tremeloes の「Why Can't You Love Me」などからギターラインをサンプリングし、ドラムブレイクと組み合わせた典型的なビッグビートの構造を持つ。

The Chemical Brothersは、Tom RowlandsとEd Simonsによるデュオで、1992年にマンチェスターで結成され、後にロンドンを主な活動拠点とした。1995年のデビューアルバム『Exit Planet Dust』でシーンに衝撃を与えた彼らは、サイケデリックロックのギターサウンドとブレイクビートをMPC3000などのサンプラーで組み合わせ、ライブパフォーマンスでも大型スクリーンと爆音を組み合わせた視覚的・聴覚的な体験を提供した。1997年の『Dig Your Own Hole』に収録された「Block Rockin' Beats」はグラミー賞最優秀ロックインストゥルメンタル・パフォーマンス賞を受賞し、ジャンルの代表作として広く認知されている。

Prodigyもビッグビートの文脈で語られることが多いグループだ。Liam Howlettを中心とするこのグループは、1997年の『The Fat of the Land』で「Firestarter」「Breathe」「Smack My Bitch Up」といった攻撃的な楽曲を発表し、ビッグビートを主流のロックフェスティバルにまで持ち込んだ。ただし彼らのサウンドはよりハードコアレイヴやインダストリアルに近く、ビッグビートの中でも過激な側面を代表する存在として位置づけられる。

シーンを支えたレーベルとしては、Skint Recordsが特に重要だ。ブライトンを拠点とするこのレーベルはFatboy Slimの作品を中心に、Midfield General、Lo-Fidelity Allstarsなどのアーティストを擁し、ビッグビートの商業的な成功を牽引した。ロンドンではHeavenly Recordingsがあり、Saint Etienneなどを支援するとともに、The Chemical Brothersとの共同クラブイベント「Sunday Social」を開催してビッグビートの世界の形成に貢献した。The Chemical Brothersの初期作品は主にJunior Boy's OwnおよびVirgin Recordsからリリースされた。クラブナイトとしては、ロンドンのHeavenly Social(Albany pubののちTurnmills)や、ブライトンのConcordeのBig Beat Boutique(1995〜2001年)がビッグビートの場として機能した。

ビッグビートの全盛期は1995〜1999年頃であり、この時期にジャンルはMTVやBBCラジオ1でのラジオでの大規模な放送（エアプレイ）を獲得し、ロラパルーザやグラストンベリーといった大型フェスティバルのヘッドライナー（最も注目される出演者）を務めるまでに成長した。しかし2001年ごろからは、ジャンルの手法の目新しさが薄れて人気が徐々に衰え、派生形としてnu skool breaksやnew raveが生まれた。

2010年代以降、ビッグビートは直接的な復活こそ見せていない。Prodigyは2022年にステージに復帰して公演を続けており、Chemical Brothersは2027年のライブ復帰を告知している。</p>
