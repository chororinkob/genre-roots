<h1>Big Beat（ビッグビート）とは</h1>
<p>ビッグビートは、1990年代中盤にイギリスで花開いた電子音楽のジャンルだ。ブレイクビートの荒々しいノリ、ロックの攻撃性、そしてハウスやテクノの電子的な質感を一つにまとめた、非常に迫力のある音を持つ。 最大の特徴は、重くひずんだドラ</p>
<p>ビッグビートは、1990年代中盤にイギリスで花開いた電子音楽のジャンルだ。ブレイクビートの荒々しいノリ、ロックの攻撃性、そしてハウスやテクノの電子的な質感を一つにまとめた、非常に迫力のある音を持つ。

最大の特徴は、重くひずんだドラムブレイクにある。ファンク／ソウル／ジャズ／ロックの古いループを、サンプラー（音を録音して取り込み、並べ替える機械）で切り刻む。そして、スネアを強調した2拍目・4拍目のバックビートを前面に押し出し、ロックのドラムに負けないほどの物理的な衝撃を生み出す。Prodigyなどはアメンブレイクも使用した。テンポは100〜140BPM程度で、ダンスフロアでの高揚感と疾走感を両立している。

低音には、TB-303風のシンセ・ベースラインが使われ、うねるような低音が曲全体を支える。ギターのリフやリックをサンプリング（既存の録音の一部を取り込んで使うこと）して組み込む手法もよく使われ、ロックとダンスミュージックの境目を意図的にあいまいにしている。音の加工では、ディストーション（音の歪み）をかけたドラムの音、フィルター（音の帯域を削る装置）、フェイジング、フランジングなどのエフェクトが一般的に使われた。

ボーカルが入る曲では、サンプリングされた短いフレーズやシャウトが、断片的に差し込まれることが多い。パンク的なボーカルやラッパーが加わることもある。

曲の組み立ては、ビルドアップ（徐々に盛り上げる部分）とドロップ（山場で一気に爆発する部分）を繰り返す形が多い。フィルターを絞って緊張感を高め、そこから一気に解き放つ爽快感が聴かせどころだ。

アシッドハウスのTB-303使いや、ヒップホップのサンプリング文化とは共通点がある。それでもビッグビートは、ロック寄りの荒々しさと、大衆の耳に残りやすいことを優先する点で区別される。テクノの反復的なミニマリズム（要素を最小限にする作り方）とも違う。メロディアスなフック（耳に残る一節）や映画的なサンプルを積極的に取り入れ、クラブだけでなく、ラジオや映画のサウンドトラックでも通用する音楽として作られている。実際にこのジャンルの曲は、映画のサウンドトラックやゲーム（Wipeoutシリーズ）などで使われた。</p>
<h2>成り立ち</h2><p>1990年代初頭のイギリスでは、レイヴカルチャーが爆発的に広がり、その後、商業化・大衆化していった。ビッグビートの誕生は、この流れの中に位置づけられることがある。

1988年から1989年にかけての「セカンドサマーオブラブ」で、アシッドハウスとエクスタシー文化が若者の間に広まった。そこから、ブレイクビートハードコアやジャングルといったジャンルが次々と生まれた。しかし1990年代中盤になると、これらのジャンルはよりアンダーグラウンドな方向へ進んでいく。その一方で、より広い聴き手に向けた電子音楽の形を探る動きが生まれた。その答えの一つがビッグビートだった。

中心地はイングランド南部、とりわけブライトンとロンドンだった。ブライトンは、Fatboy Slim（通称Norman Cook）が活動の拠点とした街だ。ロンドンのクラブの世界とは違う、よりカジュアルでロック的な気質を持つ土地柄が、ビッグビートの考え方と合ったとされる。

ジャンルの形成で最も重要な人物の一人が、Norman Cookである。彼はもともと、The Housemartinsのベーシストだった。Fatboy Slim名義で1996年にアルバム『Better Living Through Chemistry』を発表し、ロックとダンスミュージックを融合させたサウンドを世に示した。続く1998年の『You've Come a Long Way, Baby』は、全英チャート1位を記録した。「The Rockafeller Skank」「Praise You」「Right Here, Right Now」といったシングルは、世界的なヒットとなった。「The Rockafeller Skank」は、Duane Eddyの「Twistin' 'N' Twangin'」やBrian Poole &amp; The Tremeloes の「Why Can't You Love Me」などから、ギターラインをサンプリングしている。それをドラムブレイクと組み合わせた、典型的なビッグビートの作りを持つ。

The Chemical Brothersは、Tom RowlandsとEd Simonsによるデュオだ。彼らは1989年にマンチェスター大学で知り合い、1992年にデュオとして結成されたとされる。1994年には、ロンドンのHeavenly Sunday Socialでレジデント（常設）DJを務めた。1995年のデビューアルバム『Exit Planet Dust』で、シーンに衝撃を与えた。彼らはサイケデリックロックのギターサウンドとブレイクビートを、Akai製サンプラーで組み合わせた。ライブでも、大型スクリーンと爆音を組み合わせ、目と耳で味わう体験を届けた。1997年の『Dig Your Own Hole』に収録された「Block Rockin' Beats」は、グラミー賞最優秀ロックインストゥルメンタル・パフォーマンス賞を受賞した。この曲は、ジャンルの代表作として語られることがある。

Prodigyは、The Chemical Brothersと同じく、ジャンルに先行し、成立にも関わった存在とされる。中心はLiam Howlettである。「Firestarter」（1996）、「Breathe」（1996）などの攻撃的な曲を先行シングルとして出し、1997年にアルバム『The Fat of the Land』を発表した。こうして彼らは、ビッグビートを主流のロックフェスティバルにまで持ち込んだ。ただし彼らのサウンドは、ハードコアレイヴやインダストリアルにより近い。ビッグビートの中でも、過激な面を代表する存在と位置づけられる。

シーンの中心となったのは、ブライトンのSkint RecordsとロンドンのWall of Soundだ。Skint Recordsは、Fatboy Slimの作品を中心に、Midfield General、Lo-Fidelity Allstarsなどのアーティストを抱え、ビッグビートの商業的な成功を引っ張った。ロンドンには、Heavenly Recordingsがあった。Saint Etienneなどを支えるとともに、当時はDust Brothers名義のデュオ（のちのChemical Brothers）との共同クラブイベント「Sunday Social」を開き、ビッグビートの世界づくりに貢献した。The Chemical Brothersの初期作品は、主にJunior Boy's OwnとVirgin Recordsから出た。クラブナイトでは、ロンドンのHeavenly Social(Albany pubののちTurnmills)や、ブライトンのConcordeのBig Beat Boutique(1995〜2001年)が、ビッグビートの場になった。

ビッグビートの全盛期は、1995〜1999年頃だ。この時期、ジャンルはMTVの番組・授賞式で取り上げられた（1997年VMAでProdigyが受賞）。さらに、ロラパルーザやグラストンベリーといった大型フェスティバルのヘッドライナー（最も注目される出演者）を務めるまでに成長した。しかし2001年ごろからは、手法の目新しさが薄れ、人気は少しずつ衰えた。派生形として、nu skool breaksやnew raveが生まれた。

Prodigyは2022年にステージに復帰し、公演を続けている。Chemical Brothersは、2027年のライブ復帰を告知している。</p>
