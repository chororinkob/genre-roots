<h1>Coladeira（コラデイラ）とは</h1>
<p>コラデイラは、カーボヴェルデの音楽の中で、モルナと対をなす軽快なスタイルだ。モルナから派生し、和声や詩の構造を共有している。ただしテンポが速く、一つ一つの音の長さが半分に詰まった軽快なスタイルである。テンポは速めから中くらいまで幅</p>
<p>コラデイラは、カーボヴェルデの音楽の中で、モルナと対をなす軽快なスタイルだ。モルナから派生し、和声や詩の構造を共有している。ただしテンポが速く、一つ一つの音の長さが半分に詰まった軽快なスタイルである。テンポは速めから中くらいまで幅があり、2拍子で軽やかに進む。

基本の編成は、ギター、カヴァキーニョ、打楽器である。大編成では、アコースティック・ベース、ヴァイオリン、クラリネット、トランペットなどが加わる。1960年代から楽器の電化が進み、1980年代からはシンセサイザーなどの電子楽器も使われる。

和声は、最も伝統的な形では、モルナから受け継いだ『cycle of fifths』（主和音→下属和音→主和音→属七和音の定型進行）に基づく。旋律はモルナと共通点が多く、変化に富み、シンコペーションを含む。

リズムの特徴は、2拍子、シンコペーション、そしてギターのmãozada（親指でベース音、他の指で和音を刻む奏法）である。ただし、2拍子もシンコペーションも、モルナと共通する特徴だ。モルナとの違いは、テンポを速めたことと、音の長さを半分にする技術的な処理にある。

歌詞は、節とリフレインが交互に並ぶ。使われる言語はカーボヴェルデ・クレオール語である。主題は風刺、社会批評、ユーモア、陽気な題材が中心だ。のちに恋愛や政治色の強い作品も含むようになった。近所の噂話、男女の駆け引き、政治家への当てこすり、社会の矛盾への冷やかしなどが、笑いを含んだ言い回しで歌われる。</p>
<h2>成り立ち</h2><p>カーボヴェルデのサン・ヴィセンテ島にある港町ミンデロで、1930年代ごろに成立したとされる。成熟したのは1950年代以降である。

この港は、19世紀半ばから20世紀初頭にかけて、大西洋航路の石炭補給地として栄え、各国の船が寄港していた。ブラジル、アルゼンチン、英国などの海軍楽団の演奏や、ブラジル人船員のギターを通じて、外来の音楽がもたらされた。コラデイラは、ブラジル音楽（maxixeなど）や、のちのラテン系リズムの影響を受けた。

起源には諸説ある。口承では、1930年代に作曲家Anton' Tchitch'が、意図的にモルナのテンポを速めたことが起源とされる。名前は、もともとcoláを歌いながら出歩くことを指したとされる（「くっつく」を意味するcolaに由来するという俗説もある）。

この音楽が担った社会的な役割は独特だった。ポルトガルの植民地下では取り締まりがあり、一部の曲で暗示的な表現が用いられたとされる。コラデイラで政治的な内容が目立つのは、1970年代初頭以降である。

中心的な担い手には、マヌエル・デ・ノヴァス（1938〜2009）がいる。カーボヴェルデで最も重要な詩人・作曲家の一人とされる。

1975年の独立後、この音楽は植民地当局の取り締まりから解放された。ただし、1990年までは一党制だった。それでも、皮肉を交えた作風は変わらなかった。1980年代以降には、アンティル系（ズーク、コンパ）との融合が現れた。一部は colá-zouk などと呼ばれる。</p>
