<h1>Coladeira（コラデイラ）とは</h1>
<p>カーボヴェルデの音楽の中で、モルナと対をなす軽快な様式である。同じ国の同じ楽器編成を用いながら、性格は正反対に設計されている。テンポは速めから中庸まで幅があり、二拍子で軽やかに進む。編成はアコースティック・ギター、カヴァキーニョ、</p>
<p>カーボヴェルデの音楽の中で、モルナと対をなす軽快な様式である。同じ国の同じ楽器編成を用いながら、性格は正反対に設計されている。テンポは速めから中庸まで幅があり、二拍子で軽やかに進む。編成はアコースティック・ギター、カヴァキーニョ、ベース、そして打楽器で、後年には管楽器や電子鍵盤が加わった。リズムの特徴は拍の裏を強く押し出す点にあり、ギターとカヴァキーニョが細かく刻む裏拍が推進力を生む。この跳ねる感覚が、遅く沈むモルナとの決定的な違いになっている。和声は西洋的な機能和声を基礎とし、長調が中心となる。旋律は短い音型の反復が多く、覚えやすく歌いやすい作りになっている。歌唱は明るく張りのある声で、複数人による合いの手が入ることも多い。使われる言語はカーボヴェルデ・クレオール語である。歌詞の主題がこの様式の核心で、日常の出来事を諧謔と皮肉を交えて描く。近所の噂話、男女の駆け引き、政治家への当てこすり、社会の矛盾への冷やかしなどが、笑いを含んだ言い回しで歌われる。深刻な内容を軽い調子で扱うという姿勢が徹底しており、悲しみを正面から歌うモルナと役割を分担している。</p>
<h2>成り立ち</h2><p>成立は二十世紀前半、カーボヴェルデのサン・ヴィセンテ島の港町ミンデロである。この港は大西洋航路の石炭補給地として栄え、各国の船が寄港していた。船員たちが持ち込んだブラジルのサンバやマルシャ、アルゼンチンのタンゴ、そしてアメリカのジャズが、既にこの島にあったモルナと出会う環境にあった。口承によれば、1930年代に作曲家Anton' Tchitch'が、意図的にモルナのテンポを速めたことが起源とされ、モルナの伴奏をそのまま速く演奏するという発想から生まれたのがコラデイラだとされる。実際、両者は同じ楽器と同じ和声の語彙を共有しており、速度と主題だけが異なる姉妹のような関係にある。名称は、もともとcoláを歌いながら出歩く行為を指したとされる（「くっつく」を意味するcolaに由来するという説も流布しているが、出典の質は低い）。この音楽が担った社会的な役割は独特だった。ポルトガルの植民地支配下では、政治的な発言は厳しく制限されていた。そこで、表面上は他愛のない日常の歌を装いながら、比喩と当てこすりによって不満を表明するという手法が発達する。誰のことを歌っているかは島の住民には分かるが、当局には立証できないという構造である。この技法はモルナよりコラデイラの方が発達しており、諧謔が抵抗の手段として機能した。中心的な担い手としてはマヌエル・デ・ノヴァス（1938〜2009）がおり、カーボヴェルデで最も重要な詩人・作曲家の一人とされる。1975年の独立後、この音楽は自由に政治を語れるようになったが、皮肉を交えた作風は変わらなかった。1980年代以降は、アンティルのズークの影響を受けた変種「コラ・ズーク（colá-zouk）」が生まれた。リズムの強勢も楽器編成も、ズークを取り入れたものである。現在では、国内外のカーボヴェルデ系共同体の祝祭で必ず演奏される、共同体の結束を確認する音楽として機能している。</p>
