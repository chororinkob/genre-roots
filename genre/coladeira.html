<h1>Coladeira（コラデイラ）とは</h1>
<p>カーボヴェルデの音楽の中で、モルナと対をなす軽快な様式である。同じ国の同じ楽器編成を用いながら、性格は正反対に設計されている。テンポは速めから中庸まで幅があり、2拍子で軽やかに進む。編成はアコースティック・ギター、カヴァキーニョ、</p>
<p>カーボヴェルデの音楽の中で、モルナと対をなす軽快な様式である。同じ国の同じ楽器編成を用いながら、性格は正反対に設計されている。テンポは速めから中庸まで幅があり、2拍子で軽やかに進む。編成はアコースティック・ギター、カヴァキーニョ、ベース、そして打楽器で、後年には管楽器や電子鍵盤が加わった。リズムの特徴は、2拍子、シンコペーション、ギターのマンザダ奏法である。この跳ねる感覚が、遅く沈むモルナとの決定的な違いになっている。和声は、最も伝統的な形では5度圏（cycle of fifths）に従う。旋律は短い音型の反復が多く、覚えやすく歌いやすい作りになっている。使われる言語はカーボヴェルデ・クレオール語である。歌詞の主題がこの様式の核心で、日常の出来事を諧謔と皮肉を交えて描く。近所の噂話、男女の駆け引き、政治家への当てこすり、社会の矛盾への冷やかしなどが、笑いを含んだ言い回しで歌われる。深刻な内容を軽い調子で扱うという姿勢が徹底しており、悲しみを正面から歌うモルナと役割を分担している。</p>
<h2>成り立ち</h2><p>成立は20世紀前半、カーボヴェルデのサン・ヴィセンテ島の港町ミンデロである。この港は大西洋航路の石炭補給地として栄え、各国の船が寄港していた。船員たちが持ち込んだブラジルのサンバやマルシャ、アルゼンチンのタンゴ、そしてアメリカのジャズが、既にこの島にあったモルナと出会う環境にあった。口承によれば、1930年代に作曲家Anton' Tchitch'が、意図的にモルナのテンポを速めたことが起源とされる。名称は、もともとcoláを歌いながら出歩く行為を指したとされる（「くっつく」を意味するcolaに由来するという説も流布している）。この音楽が担った社会的な役割は独特だった。ポルトガルの植民地支配下では、政治的な発言は厳しく制限されていた。そこで、表面上は他愛のない日常の歌を装いながら、比喩と当てこすりによって不満を表明するという手法が発達する。誰のことを歌っているかは島の住民には分かるが、当局には立証できないという構造である。植民地期、コラデイラの歌詞は暗号や二重の意味を用いて、ポルトガルの検閲を避けた。中心的な担い手としてはマヌエル・デ・ノヴァス（1938〜2009）がおり、カーボヴェルデで最も重要な詩人・作曲家の一人とされる。1975年の独立後、この音楽は自由に政治を語れるようになったが、皮肉を交えた作風は変わらなかった。1970〜80年代にはアンティル系（ズーク、コンパ）との融合が現れた。一部は colá-zouk などと呼ばれる。</p>
