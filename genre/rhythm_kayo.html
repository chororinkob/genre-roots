<h1>Rhythm Kayo（ニューリズム）とは</h1>
<p>ダンスリズムを前面に出した歌謡曲の一つである。代表曲22曲を動画で聴け、ルーツと影響のつながりを地図でたどれる。</p>
<p>ダンスリズムを前面に出した歌謡曲の一つである。踊りのビートに日本語のメロディを乗せた、思わず体が動く歌謡曲である。

中心の楽器は、エレキギター、ブラスセクション（トランペットやトロンボーンの金管隊）、マラカスやコンガのようなパーカッションの3つである。エレキギターはリバーブ（残響）の残る軽快なバッキングで曲を押し進める。金管はフレーズごとに叫ぶように入り、間奏で主旋律を引き取る。パーカッションは細かい刻みでビートを彩り、ドラムとベースが踊りの土台を固める。

和音は歌謡曲らしい基本進行を土台に、洋楽から来たコードを混ぜる。メロディは日本語の音節に合わせた節回しが中心で、歌謡節の流儀と西洋ポップスの流儀の両方の顔を持つ。

リズムはこのジャンルの看板である。サーフィン・ロックの8ビート、ツイスト、マンボ、中南米風のアメリアッチ、泳ぐ動きをイメージしたスイム・リズムなど、曲ごとに別々のダンスリズムが用いられた。アクセントはバックビートに置かれ、金管とパーカッションが拍を叩くように答える。

歌い方は、伸びやかで若々しい声が基本である。日本語の節回しを残しつつ、洋楽のポップスに近い発音で歌う。掛け声やコールが入る曲も多い。

歌詞は、恋心、夏、海、太陽、車、スピードといった若者の話題が中心である。切なさより明るさが勝り、踊りながら口ずさめる内容である。

曲の組み立ては、1コーラス目でリズムを提示し、間奏で金管とパーカッションの掛け合いを聴かせ、2コーラス目で盛り上げて締めるのが型である。テンポはダンスに合う速めの曲調が多い。</p>
<h2>成り立ち</h2><p>ダンスビートを歌謡曲に取り込む流れは、戦前のジャズ・ソングにさかのぼる。戦後に入ると、1947年に笠置シヅ子が服部良一の作曲で「東京ブギウギ」を発表し、ブギウギが大ブームになった。1952年には美空ひばりの「お祭りマンボ」がヒットし、洋風のリズムを和の節回しに乗せる手法は歌謡曲の定番になりつつあった。

転機は1960年である。ビクターレコードは高校生の橋幸夫を作曲家・吉田正の門下に迎え、作詞・佐伯孝夫、作曲・吉田正の「潮来笠」でデビューさせた。股旅歌謡の名作は同年の第2回日本レコード大賞新人賞を獲得し、橋はたちまちトップスターになった。1962年には吉永小百合との「いつでも夢を」で青春歌謡の頂点に立つ。しかし師弟は、股旅ものや青春歌謡だけにとどまらなかった。

1961年、渡辺マリの「東京ドドンパ娘」がミリオンセラーとなり、ドドンパが全国ブームになる。都々逸とマンボ（ルンバという説もある）を合わせた和製のリズムで、日本で生まれたダンスビートが歌謡曲で流行した例である。

吉田正は数年前から海外を視察し、サーフィンとエレキギターの流行を察知していた。1964年8月5日、その成果である「恋をするなら」が発売される。作詞佐伯孝夫、作・編曲吉田正。邦楽に初めてエレキサウンドを導入した曲で、吉田作品では珍しく曲先行で佐伯が詞をつけた。翌月には車のエンジン音を全編に挿入した「ゼッケンNO.1スタートだ」を出し、同年さらにシャムロックのリズムの「チェッ・チェッ・チェッ（涙にさよならを）」を発表する。この一連の4曲で、1965年の第7回日本レコード大賞企画賞を受けた。橋はこの年に15枚ものシングルを出す多作ぶりを示している。

その後もニューリズムを追い続けた。1965年にスイム・リズムの「あの娘と僕（スイム・スイム・スイム）」、1966年にアメリアッチの「恋と涙の太陽」、1967年5月1日にメキシコシティーオリンピックに因んだ「恋のメキシカン・ロック」が出る。コンビによる6作目のこの曲はリズム歌謡の決定版とされ、1968年時点で累計85万枚を売った。

しかし終焉も早かった。日本でグループ・サウンズが流行し、若いバンドが自作曲を携えて登場すると、吉田正はリズム歌謡をやめたと言う。橋も「ちょっとブームが違ってきた」と回顧し、1967年でこの路線を閉じ、GS風の「思い出のカテリーナ」へ移った。佐伯・吉田以外の作品として、邱永漢作詞・藤家虹二作曲の「恋のインターチェンジ」、岩谷時子作詞・いずみたく作曲の「僕等はみんな恋人さ」も残るが、狭義にはコンビの作品だけをリズム歌謡と呼ぶ。

それでもこの流れは途絶えなかった。2005年には大滝詠一がペンネーム・厚家羅漢名義で橋のリズム歌謡に特化したアルバム『SWIM! SWIM! SWIM!』をプロデュースし、2026年の現在も昭和歌謡のリバイバル番組やコンピレーションで繰り返し取り上げられている。</p>
