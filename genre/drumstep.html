<h1>Drumstep（ドラムステップ）とは</h1>
<p>ドラムンベースの速度と、ダブステップの低音の質感を組み合わせた系統。テンポは表記上は160〜175BPMだが、ドラムの配置が特徴的で、スネアが一小節に2回、ダブステップと同じ位置(3拍目)に置かれる。この結果、高速のテンポでありな</p>
<p>ドラムンベースの速度と、ダブステップの低音の質感を組み合わせた系統。テンポは表記上は160〜175BPMだが、ドラムの配置が特徴的で、スネアが一小節に2回、ダブステップと同じ位置(3拍目)に置かれる。この結果、高速のテンポでありながら、体感される拍の骨格はダブステップの半分の速度に近くなる。この二重の速度感が最大の識別点になる。キックとスネアの間の空間には、16分音符のハイハットやゴーストノートが細かく散らされ、ドラムンベース由来の細密さが保たれる。ベースは歪ませた合成音で、ダブステップの語彙をそのまま受け継ぐ。うねりながら音程が揺れるワブル・ベースや、金属的に軋むグロウルが用いられ、これがドラムンベースの速度で展開する。低域の設計は厳密で、サブベースと歪んだ中域ベースが別々に配置される。上物は少なく、シンセの短い和音、加工した叫び声、効果音が中心。和声はマイナー調の単純な循環か、存在しない。曲の構成はEDM的な型を踏襲し、ビルドアップと無音を経てドロップへ落ちる。曲は3分半から5分程度。ドラムンベースの持続的な推進力と、ダブステップの衝撃的な落差という、本来は相容れない二つの快感を同時に成立させようとした点に、この系統の設計思想がある。</p>
<h2>成り立ち</h2><p>2010年前後に、イギリスとアメリカで並行して成立した。背景には、2008年から2010年にかけてダブステップが世界的に急拡大したという事情がある。この時期、ダブステップの制作者とドラムンベースの制作者が同じイベントに出演することが増え、両者の語彙が混ざり合う条件が整った。とりわけアメリカでは、ダブステップがブロステップという攻撃的な形へ変質し、若い聴衆を大量に獲得していた。この市場に、より速いテンポの選択肢として提示されたのがドラムステップである。先行例としては、2000年代半ばにドラムンベースの側から、テンポを半分に感じさせる構成を試みる作品が既に存在した。Pendulum(オーストラリア出身、後にイギリスへ移った)の作品群がこの傾向を示しており、2010年の「Immersion」ではロックとダブステップの要素が明確に導入された。同時期にChase &amp; Statusが、ドラムンベースとダブステップを行き来する作風で商業的成功を収め、2011年の「No More Idols」が全英2位を記録した。この二組が、両ジャンルの境界を曖昧にする流れを主導した。アメリカ側ではExcision(カナダ)、Datsik、Skrillex周辺の制作者がこの語彙を扱い、大型フェスティバルの舞台で演奏した。呼称としてのdrumstepは2010年前後にインターネット上で定着したもので、当初は制作者の自称ではなく、聴き手やブログが分類のために用いた語だった。この点で、多くのインターネット時代のジャンル名と同じ成立過程をたどっている。この系統は独立したジャンルとして定着することはなく、むしろ両ジャンルの間の橋渡しとして機能した。批判としては、中途半端で両方の良さを損なっているという指摘が、ドラムンベースとダブステップの双方から向けられた。とりわけドラムンベースの側からは、テンポの速さだけを借りて本来の複雑なドラム編集を放棄しているという非難があった。2013年前後にEDM市場が飽和すると、この語自体もあまり使われなくなる。しかし手法としては残り、現在のドラムンベースには、テンポを半分に感じさせる構成を持つ楽曲が普通に存在する。近年のドラムンベースの世界的な復興の中で、この構造は再び広く用いられている。</p>
