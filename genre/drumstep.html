<h1>Drumstep（ドラムステップ）とは</h1>
<p>ドラムステップは、ドラムンベースの速さと、ダブステップの低音の手ざわりを組み合わせた音楽だ。 いちばんの特徴はドラムの置き方にある。テンポは一般に170〜176BPM前後だが、スネアは1小節に1回だけ、ダブステップと同じ3拍目に置</p>
<p>ドラムステップは、ドラムンベースの速さと、ダブステップの低音の手ざわりを組み合わせた音楽だ。

いちばんの特徴はドラムの置き方にある。テンポは一般に170〜176BPM前後だが、スネアは1小節に1回だけ、ダブステップと同じ3拍目に置かれる。そのため、速いテンポなのに、体で感じる拍の骨組みはドラムンベースの半分（ハーフタイム）の速さに近くなる。この二重の速さの感じ方が、見分けるいちばんのポイントになる。キックとスネアの間には、16分音符のハイハットやゴーストノートが細かく散らされることが多い。こうして、ドラムンベースゆずりの細かさが保たれる。

ベースは歪ませた合成音で、ダブステップの音の言葉をそのまま受け継いでいる。音量やフィルターが周期的にうねるワブル・ベースや、金属のようにきしむグロウルが使われる。これがドラムンベースの速さで展開していく。低い音の作り込みは厳密で、サブベースと、歪んだ中くらいの高さのベースが別々に置かれることが多い。

上に重ねる音は少ない。シンセの短い和音、加工した叫び声、効果音が中心だ。和音の流れはマイナー調の単純なくり返しか、まったく無い。

曲の組み立てはEDMの型にならう。ビルドアップと無音を経て、ドロップへ落ちる。ドラムンベースのずっと続く前へ進む力と、ダブステップの衝撃的な落差。本来は両立しない二つの快感を同時に成り立たせようとした点に、この系統の設計思想があると解釈できる。</p>
<h2>成り立ち</h2><p>ドラムステップは、2010年前後に成り立った。北米のシーンでまとまったという解説と、英米の両シーンが混ざり合ったという解説がある。

背景には、2010年代初頭にダブステップがアメリカで急速に広まったことがある。この時期、ダブステップの作り手とドラムンベースの作り手が、同じイベントに出ることが増えたとされる。両者の音の言葉が混ざり合う条件がそろったのだ。とりわけ、ダブステップはアメリカで、ブロステップと呼ばれる攻撃的な形で大衆化し、若い聴き手を大量に集めていた。ドラムステップは、2000年代後半〜2010年代初頭に、ブロステップとドラムンベース（特にジャンプアップ）の交流から英米双方で生まれたとされる。発祥地は一つに定まらない。

ドラムンベース側では、Pendulum(オーストラリア出身、後にイギリスへ移った)が、2008年の「In Silico」ですでにロックの要素を前面に出していた。2010年の「Immersion」はドラムンベースに戻った作品で、ロックやメタル、エレクトロ、ハウスなどの要素を含む。同じころ、Chase &amp; Statusが、ドラムンベースとダブステップを行き来する作風で商業的に成功した。2011年の「No More Idols」は全英2位を記録した。この二組は、両ジャンルの境目があいまいになっていく流れの代名詞といえる存在だった。

一方、北米側ではExcision(カナダ)、Datsik、Skrillexの周りの作り手がこの音の言葉を使い、大型フェスティバルの舞台で演奏した。drumstepという呼び名は、2010年前後にインターネット上で定着したとされる。Excision &amp; Datsik「Invaders」のDatsikによるDrumstep Mixや、Rednekの「I'm Not Skrillex (Drumstep Mix)」(2011年)のように、作り手自身が曲名に使った例もある。

ジャンル名としては2010年代初頭がピークで、のちに手法はドラムンベースなどに吸収された。2014年半ばから、主流でのダブステップの人気は衰えていった。この呼び名も、やがてあまり使われなくなった。

それでも手法は残った。今のドラムンベースには、テンポを半分に感じさせる組み立ての曲が普通にある。近年、ドラムンベースが世界的に盛り返す中で、この構造はふたたび広く使われている。</p>
