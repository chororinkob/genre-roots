<h1>Future Funk（フューチャーファンク）とは</h1>
<p>主に1980年代の日本のシティポップを中心に、近い時期のファンクやディスコの録音を素材として、それを高速に切り刻んで再構成するインターネット由来の音楽である。母体となったヴェイパーウェイヴが、素材の再生速度を落として気だるく引き延</p>
<p>主に1980年代の日本のシティポップを中心に、近い時期のファンクやディスコの録音を素材として、それを高速に切り刻んで再構成するインターネット由来の音楽である。母体となったヴェイパーウェイヴが、素材の再生速度を落として気だるく引き延ばすのに対し、この分野は逆に速度を上げ、音程を上へ移す。この一点の反転が性格を正反対にしている。すなわち、憂鬱ではなく多幸感、停滞ではなく疾走が選ばれる。テンポは概ね110から130 BPMで、キックは四つ打ちを刻む。原曲から切り取られるのは、歌の一節、金管楽器の短く鋭い音、ギターの刻み、そして弦楽器の素早い旋律といった短い断片であり、それらが数拍ごとに入れ替わりながら積み上げられる。加工の技法はフレンチ・ハウスから直接受け継がれており、特定の高さの音を鋭く強調するフィルターで音色を上下に動かす処理と、キック（バスドラム）が鳴るたびに他の音量を一瞬押し下げる処理（サイドチェイン）が深くかけられる。この呼吸するような揺れが、単純な反復に起伏を与える。旋律は自分で書かず、原曲の中にあるものを浮かび上がらせる。視覚表現も一体で、1980年代の日本のアニメーションの断片が用いられる。</p>
<h2>成り立ち</h2><p>2010年代前半、インターネット上でヴェイパーウェイヴという現象が起きた。1980年代から1990年代の企業向けの背景音楽や広告の音源を、極端に速度を落として提示するこの手法は、消費社会への皮肉と、経験したことのない過去への郷愁を同時に含んでいた。この潮流の内側から、正反対の方向を選ぶ一群が現れる。2013年前後、メキシコのMacross 82-99や、アメリカのSaint Pepsi、後にSkylar Spenceと名乗る作り手らが、素材の速度を上げて踊れる形に組み替えるという実践を始めたとされる。彼らをはじめとする作り手が好んで用いた素材が、日本のシティポップだった。これは偶然ではない。1980年代の日本の楽曲には、高い演奏力と録音の完成度を持つ職業ミュージシャンによる作品が多く、切り取られた数秒の断片が、そのまま高い完成度を持っていたのである。加えて、これらの音源が国外ではほとんど流通しておらず、聴き手にとって未知でありながら懐かしいという、この分野に必要な条件を完璧に満たしていた。この現象は思わぬ結果をもたらした。素材として引用された日本の楽曲そのものが、海外の若い聴き手に発見されたのである。動画共有サイトを通じて竹内まりやの『Plastic Love』が数千万回再生され、2021年には公式の再発と世界配信が実現した。山下達郎は、現在も定額制の配信サービスには作品を出しておらず、国際的な配信の動きは限定的である。つまりこの分野は、日本のシティポップが欧米の若い聴き手に知られる経路のひとつとなった。韓国のNight Tempoは、この文脈から出発しながら、日本の権利者と正式に協力して原盤の再編集を手掛けるという立場へ移り、非公式な引用から公式な協働への橋渡しを行っている。現在も膨大な数の匿名の作り手が活動を続けている。</p>
