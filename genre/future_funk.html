<h1>Future Funk（フューチャーファンク）とは</h1>
<p>1970年代から1980年代の日本のシティポップやファンク、ディスコの録音を素材として、それを高速に切り刻んで再構成するインターネット由来の音楽である。母体となったヴェイパーウェイヴが、素材の再生速度を落として気だるく引き延ばすの</p>
<p>1970年代から1980年代の日本のシティポップやファンク、ディスコの録音を素材として、それを高速に切り刻んで再構成するインターネット由来の音楽である。母体となったヴェイパーウェイヴが、素材の再生速度を落として気だるく引き延ばすのに対し、この分野は逆に速度を上げ、音程を上へ移す。この一点の反転が性格を正反対にしている。すなわち、憂鬱ではなく多幸感、停滞ではなく疾走が選ばれる。テンポは概ね110から130 BPMで、キックは四つ打ちを刻む。原曲から切り取られるのは、歌の一節、金管の刺し込み、ギターの刻み、そして弦楽の走句といった短い断片であり、それらが数拍ごとに入れ替わりながら積み上げられる。加工の技法はフレンチ・ハウスから直接受け継がれており、共振の鋭いフィルターを通して周波数を上下させる処理と、キックが鳴るたびに他の音量を押し下げる処理が深くかけられる。この呼吸するような揺れが、単純な反復に起伏を与える。旋律は自分で書かず、原曲の中にあるものを浮かび上がらせる。視覚表現も一体で、1980年代の日本のアニメーションの断片が用いられる。</p>
<h2>成り立ち</h2><p>2010年代前半、インターネット上でヴェイパーウェイヴという現象が起きた。1980年代から1990年代の企業向けの背景音楽や広告の音源を、極端に速度を落として提示するこの手法は、消費社会への皮肉と、経験したことのない過去への郷愁を同時に含んでいた。この潮流の内側から、正反対の方向を選ぶ一群が現れる。2013年前後、アメリカのSaint Pepsi、後にSkylar Spenceと名乗る作り手が、素材の速度を上げて踊れる形に組み替えるという実践を始めた。彼をはじめとする作り手が好んで用いた素材が、日本のシティポップだった。これは偶然ではない。1980年代の日本の楽曲は、当時世界最高水準の録音技術と、極めて高い技量の職業演奏家によって作られており、切り取られた数秒の断片が、そのまま高い完成度を持っていたのである。加えて、これらの音源が国外ではほとんど流通しておらず、聴き手にとって未知でありながら懐かしいという、この分野に必要な条件を完璧に満たしていた。この現象は思わぬ結果をもたらした。素材として引用された日本の楽曲そのものが、海外の若い聴き手に発見されたのである。動画共有サイトを通じて竹内まりやや山下達郎の作品が数千万回再生され、権利者が国外での配信に消極的だった時期を経て、正式な再発と国際的な配信が実現するに至った。つまりこの分野は、日本のシティポップの世界的な再評価の直接の引き金となった。韓国のNight Tempoは、この文脈から出発しながら、日本の権利者と正式に協力して原盤の再編集を手掛けるという立場へ移り、非公式な引用から公式な協働への橋渡しを行っている。現在も膨大な数の匿名の作り手が活動を続けている。</p>
