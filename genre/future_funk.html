<h1>Future Funk（フューチャーファンク）とは</h1>
<p>フューチャー・ファンクは、主に1980〜90年代の日本のシティポップを中心に、近い時期のファンクやディスコの録音を素材にする、インターネット生まれの音楽だ。素材を高速で細かく切り刻み、組み立て直して作る。 母体になったとも言われる</p>
<p>フューチャー・ファンクは、主に1980〜90年代の日本のシティポップを中心に、近い時期のファンクやディスコの録音を素材にする、インターネット生まれの音楽だ。素材を高速で細かく切り刻み、組み立て直して作る。

母体になったとも言われるヴェイパーウェイヴは、素材の再生速度を落とし、気だるく引き延ばす。これに対してこの分野は、同じサンプル主体の手法を、より高揚感のある方向に使う。テンポを上げ、ドラムやフィルターの処理を加える。つまり、憂鬱ではなく多幸感、停滞ではなく疾走が選ばれる。

原曲から切り取られるのは、たとえば歌の一節、金管楽器の短く鋭い音、ギターの刻み、弦楽器の素早い旋律といった短い断片だ。それらが数拍ごとに入れ替わりながら積み重ねられる。

テンポは概ね毎分110から130拍で、キックは四つ打ちを刻む。

加工の技法は、フレンチ・ハウスに触発されている。低い音だけを通すフィルターや、高い音だけを通すフィルターの効き具合を、徐々に開け閉めする処理がかかる。さらに、キック（バスドラム）が鳴るたびに、ほかの音の音量を一瞬押し下げる処理（サイドチェイン）が深くかけられる。この呼吸するような揺れが、単純な繰り返しに起伏を与える。

多くの作品は、原曲の断片を主役にする。ただし、ドラムやベースを足したり、オリジナルの歌を載せたりする制作者もいる。

映像も音楽と一体で、1980〜90年代の日本のアニメの映像が使われる。</p>
<h2>成り立ち</h2><p>2010年代前半、インターネット上でヴェイパーウェイヴという現象が起きた。1980年代から1990年代の企業向けの背景音楽や広告の音源を、極端に遅くして聴かせる手法だ。そこには、消費社会への皮肉と、経験したことのない過去への郷愁が、同時に込められていた。

この流れの内側から、正反対の方向を選ぶ一群が現れたという見方がある。2013年前後、メキシコのMacross 82-99や、アメリカのSaint Pepsi（2015年にSkylar Spenceへ改名、2019年にSaint Pepsi名義へ復帰）らの作品が、この分野の起点としてよく挙げられる。

Macross 82-99らは、日本のシティポップを多く使った。一方、Saint PepsiのHit Vibesは、主に欧米のソウルやポップなどを素材にした。

1980年代の日本の曲には、演奏の腕が高く、録音の仕上がりも優れた職業ミュージシャンによる作品が多かった。切り取った数秒の断片が、それだけで高い完成度を持っていたとも言われる。しかも、これらの音源は国外ではほとんど出回っておらず、聴き手にとって、知らないのに懐かしいものだったとされる。

そして、思わぬ結果が生まれた。素材として使われた日本の曲そのものが、海外の若い聴き手に見つけられたのである。YouTubeの推薦で竹内まりやの『Plastic Love』が数千万回再生され、2020年末には『Expressions』経由でストリーミング配信が解禁された。2021年11月3日には12インチのレコードが再発され、『Variety』も配信された。

一方、山下達郎は、ごく一部の曲を除き、定額制配信をまだ解禁していない（2026年10月時点で解禁の発表なし）。

こうしてこの分野は、日本のシティポップが欧米の若い聴き手に知られる道のひとつになった。韓国のNight Tempoは、この流れから出発しながら、日本の権利者と正式に協力して原盤の再編集を手掛ける立場へ移った。非公式な引用から公式な協働への橋渡し役を果たしている。現在も、別名義で活動する作り手が多数いる。</p>
