<h1>Kawaii Metal（カワイイ・メタル）とは</h1>
<p>カワイイ・メタルは、アイドルの歌とヘヴィメタルの演奏を正面からぶつけた日本の音楽だ。代表曲22曲を動画で聴け、ルーツと影響のつながりを地図でたどれる。</p>
<p>カワイイ・メタルは、アイドルの歌とヘヴィメタルの演奏を正面からぶつけた日本の音楽だ。音の土台になるのは、弦を低く下げたギター、規則正しく刻むベース、ツーバスを踏むドラムというメタルの編成だ。そこへ、アイドル歌謡らしい明るい打ち込みシンセとピアノ、電子音の装飾が重なる。ギターは7弦や、ドロップ・チューニングをした6弦を使い、パームミュートで刻むリフと、ピッキング・ハーモニクスを混ぜた速いソロを聴かせる。

和音は短調が基本で、サビだけ長調へ開く曲が多い。歌メロディは、音域が狭く跳躍の少ない童謡のような形をとる曲が多い。その一方、ギターのリフは半音や減5度を含む硬い音使いで、この明るさと暗さの同居が最大の持ち味だ。

テンポは曲によって110から200超まで幅があり、疾走感を持つ。4分の4拍子の1拍目にアクセントを置き、サビでは曲によってドラムが8ビートから4つ打ちへ切り替わる。ブレイクダウンではテンポを半分に落とし、重い刻みだけを残す。

歌い方は、裏声まじりの明るい少女ボーカルと、デスボイスやグロウルと呼ばれる低い叫びの対比で作られる。サビは全員の斉唱、Aメロはささやき、間奏は吠えるだけ、という切り替えも珍しくない。

歌詞は、チョコレート、動物、部活、学校といった身近な題材を並べる。かわいい題材が中心だが、「イジメ、ダメ、ゼッタイ」のように社会的なテーマを扱う曲もある。無邪気さを演技として鳴らす点が特徴だ。

曲は、SEの短い導入、Aメロ、Bメロ、サビというアイドル歌謡の型をなぞり、間にメタルの間奏とギターソロを差し込む。最後のサビを繰り返さず、急に落として終わる曲もある。ジャパニーズ・メタルは日本語詞の正統派ヘヴィメタルを指すとされるのに対し、こちらはアイドルの声とダンスを前提にしている点で違う。鳴る場所は、アイドルの対バンよりロックフェスや海外のメタルフェスのステージが多いとされる。</p>
<h2>成り立ち</h2><p>2010年、東京の芸能事務所アミューズの中で、ひとつの部活動が生まれた。学校生活をテーマにした成長期限定ユニット、さくら学院の「重音部」がそれである。仕掛けたのはプロデューサーの小林啓、通称KOBAMETALだ。ヘヴィメタル好きの社員だった小林は、2009年から「メタルとアイドルを混ぜたダンスユニット」の計画を進めていた。彼は別のグループ、Karen Girl'sで歌う中元すず香のパフォーマンスを見て、その子をセンターに据えることを決める。中元は当時11〜12歳だった。そこへ水野由結と菊地最愛が加わり、3人はSU-METAL、YUIMETAL、MOAMETALとなった。

2011年4月27日、さくら学院のアルバムに「ド・キ・ド・キ☆モーニング」が収録される。10月には映像が公開され、2012年にはシンガポールのアニメ系フェスにも呼ばれた。インドネシアのアニメ系フェスに呼ばれたのは2013年9月7日のことだ。2013年1月9日、「イジメ、ダメ、ゼッタイ」でメジャーへ進むと、オリコン週間シングル6位、初週1万9000枚を記録する。同じ年の春、中元が中学を卒業してさくら学院を離れた。事務所はグループを解散させず、独立したバンドとして続ける道を選んだ。

転機は2014年だった。2月26日に1stアルバム『BABYMETAL』を出し、収録曲「ギミチョコ!!」の映像が世界へ広がる。3月に武道館で海外公演を宣言し、7月に初のワールドツアーを始めた。英国のソニスフィア・フェスティバルには、ファンの署名運動もあったが、プロモーターは動画の拡散を見て自らブッキングしたと述べている。7月30日〜8月6日にレディー・ガガの前座を5公演務めている。シドニー・モーニング・ヘラルド紙のRob Nashは、この音を「スラッシュメタルの上にポップメロディを乗せたもの」と表現した。2016年4月1日に出した2作目『メタル・レジスタンス』は、ビルボード200で39位に入る。日本のアルバムが同チャートのトップ40に入るのは50年以上ぶりだった。翌日にはウェンブリー・アリーナで単独公演を開き、日本人として初めてこの会場のヘッドライナーを務めた。9月の東京ドーム2公演は、各日およそ5万5000人を集めた。

しかし、この形はすぐに模倣と変形を生んだ。2015年に結成されたLADYBABYは、オーストラリア出身のプロレスラー、レディビアードと、金子理江、黒宮れいの3人組だ。2015年7月4日に「ニッポン饅頭」の映像を公開し、コミカルな歌とデスボイスを混ぜた映像は2日で100万回再生を超えた。7月29日にCDデビューした。だが2016年8月1日にレディビアードが脱退し、グループは「The Idol Formerly Known as Ladybaby」と改名する。2017年11月には黒宮れいも、アイドル文化への違和感と喉の不調を理由に去った。2018年に新体制で名前を戻し、2020年1月13日の公演で活動を止め、2023年に再始動している。2017年2月28日には、レディビアードがボディビルダーの才木玲佳と組み、ギタリストのIsao Fujitaを加えたDeadlift Lolitaを発表した。3月31日の「Six Pack Twins」は、この形式が珍芸に転びうることも示している。

一方、音楽の中身は別の方向にも伸びた。2013年にアイドルとして始まったPassCodeは、後にバンドを従え、メタルコアの刻みとEDMの4つ打ちを交互に置く構成へ進んだ。2014年にはNecronomidol、2012年にはFruitPochette、2018年にはIRONBUNNYが現れ、一覧には12組の名前が並ぶ。ただし、その一覧は「掲載されたグループが自分でカワイイ・メタルを名乗っているとは限らない」と断っている。2018年10月19日、水野由結が体調を理由に脱退した。BABYMETALは「アベンジャーズ」と呼ぶ交代ダンサーで3人体制を補い、2023年4月に岡崎百々子がMOMOMETALとして正式に加わった。

それでも勢いは落ちなかった。2019年6月30日にはグラストンベリー・フェスティバルで、日本のバンドとして初めてメインステージの一つに出演した。2019年10月11日の3作目『メタル・ギャラクシー』で、BABYMETALはアジアのアーティストとして初めてビルボードのロック・アルバム・チャート首位に立つ。2025年5月30日にはロンドンのO2アリーナを単独で満員にした。2025年8月8日の4thオリジナルアルバム（Wikipediaは5作目と数える）『メタル・フォース』は、ビルボード200で9位に入り、同バンド初のトップ10入りを果たす。

現在、アイドルとメタルの融合全般を指す言葉として、この呼び名が使われることがある。英国の音楽業界誌Music Weekは「この現象への抵抗は無意味だ」と書くほど、賛否は分かれてきた。それでも海外フェスの出演枠を広げ、日本語の歌がそのまま通る回路を作った点で、この10年の日本の音楽を語るうえで外せない存在になっている。</p>
