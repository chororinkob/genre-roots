<h1>Kawaii Metal（カワイイ・メタル）とは</h1>
<p>カワイイ・メタルは、アイドルの歌とヘヴィメタルの演奏を正面からぶつけた日本の音楽だ。代表曲22曲を動画で聴け、ルーツと影響のつながりを地図でたどれる。</p>
<p>カワイイ・メタルは、アイドルの歌とヘヴィメタルの演奏を正面からぶつけた日本の音楽だ。音の土台は、弦を低く下げたギター、規則正しく刻むベース、ツーバスを踏むドラムというメタル側の編成である。そこへ、アイドル歌謡の明るい打ち込みシンセとピアノ、電子音の装飾が重なる。ギターは7弦やドロップ・チューニングの6弦を使い、パームミュートで刻むリフと、ピッキング・ハーモニクスを混ぜた速いソロを聴かせる。

和音は短調が基本で、サビだけ長調へ開く曲が多い。歌メロディは音域が狭く、跳躍の少ない童謡のような形をとる。その一方、ギターのリフは半音や減5度を含む硬い音使いで、この明るさと暗さの同居が最大の持ち味だ。

テンポは160〜200 BPM前後に収まる曲が多く、スピードメタルやパワーメタルに近い疾走感を持つ。4分の4拍子の1拍目にアクセントを置き、サビではドラムが8ビートから4つ打ちへ切り替わる。ブレイクダウンではテンポを半分に落とし、重い刻みだけを残す。

歌い方は、裏声まじりの明るい少女ボーカルと、デスボイスやグロウルと呼ばれる低い叫びの対比で作られる。サビは全員の斉唱、Aメロはささやき、間奏は吠えるだけ、という切り替えも珍しくない。

歌詞は、チョコレート、動物、部活、学校といった身近な題材を並べる。社会批判ではなく、かわいさを誇張した言葉遊びが中心で、無邪気さを演技として鳴らす点が特徴だ。

曲は、SEの短い導入、Aメロ、Bメロ、サビというアイドル歌謡の型をなぞり、間にメタルの間奏とギターソロを差し込む。最後のサビを繰り返さず、急に落として終わる曲もある。ジャパニーズ・メタルが日本語詞の正統派ヘヴィメタルを指すのに対し、こちらはアイドルの声とダンスを前提にしている点で違う。鳴る場所はアイドルの対バンより、ロックフェスや海外のメタルフェスのステージに多い。</p>
<h2>成り立ち</h2><p>2010年、東京の芸能事務所アミューズの中で、ひとつの部活動が生まれた。学校生活をテーマにした期間限定のアイドルグループ、さくら学院の「重音部」がそれである。仕掛けたのはプロデューサーの小林啓、通称KOBAMETALだ。ヘヴィメタル好きの社員だった小林は、2009年から「メタルとアイドルを混ぜたダンスユニット」の計画を進めていた。彼は別のグループ、Karen Girl'sで歌う中元すず香の声を聴いて、その子をセンターに据えることを決める。中元は当時11〜12歳だった。そこへ小柄な水野由結と菊地最愛が加わり、3人はSU-METAL、YUIMETAL、MOAMETALとなった。

2011年4月27日、さくら学院のアルバムに「ドキドキ☆モーニング」が収録される。10月には映像が公開され、2012年にはシンガポールやインドネシアのアニメ系フェスにも呼ばれた。2013年1月9日、「イジメ、ダメ、ゼッタイ」でメジャーへ進むと、オリコン週間シングル6位、初週1万9000枚を記録する。同じ年春、中元が中学を卒業してさくら学院を離れた。事務所はグループを解散させず、独立したバンドとして続ける道を選んだ。

転機は2014年だった。2月26日に1stアルバム『BABYMETAL』を出し、収録曲「ギミ・チョコレート!!」の映像が世界へ広がる。3月には初のワールドツアーを発表し、英国のサミソスフィア・フェスティバルには、ファンが招致運動を起こしたことで出演が決まった。8月にはレディー・ガガの前座を5公演務めている。海外の評論は、この音を「スラッシュメタルの上に砂糖菓子のようなポップメロディを乗せたもの」と表現した。2016年4月1日に出した2作目『メタル・レジスタンス』は、ビルボード200で39位に入る。日本のアルバムが同チャートのトップ40に入るのは50年以上ぶりだった。翌日にはウェンブリー・アリーナで単独公演を開き、日本人として初めてこの会場のヘッドライナーを務めた。9月の東京ドーム2公演は、各日約5万5000人を集めている。

しかし、この形はすぐに模倣と変形を生んだ。2013年に結成されたLADYBABYは、オーストラリア出身の覆面レスラー、レディビアードと、金子理江、黒宮れいの3人組だ。2015年7月29日に「ニッポン饅頭」を発表し、コミカルな歌とデスボイスを混ぜた映像は2日で100万回再生を超えた。だが2016年8月1日にレディビアードが脱退し、グループは「The Idol Formerly Known as Ladybaby」と改名する。2017年11月には黒宮れいも、アイドル文化への違和感と喉の不調を理由に去った。2018年に新体制で名前を戻し、2020年1月13日の公演で活動を止め、2023年に再始動している。2017年2月28日には、レディビアードがボディビルダーの才木玲佳と組み、ギタリストのIsao Fujitaを加えたDeadlift Lolitaを発表した。3月31日の「Six Pack Twins」は、この形式が珍芸に転びうることも示している。

一方、音楽の中身は別の方向にも伸びた。2013年にアイドルとして始まったPassCodeは、後にバンドを従え、メタルコアの刻みとEDMの4つ打ちを交互に置く構成へ進んだ。2014年にはNecronomidol、2012年にはFruitPochette、2019年にはIRONBUNNYが現れ、一覧には10組の名前が並ぶ。ただし、その一覧は「掲載されたグループが自分でカワイイ・メタルを名乗っているとは限らない」と断っている。2018年10月19日、水野由結が体調を理由に脱退した。BABYMETALは「アベンジャーズ」と呼ぶ交代ダンサーで3人体制を補い、2023年4月に岡崎百々子がMOMOMETALとして正式に加わった。

それでも勢いは落ちなかった。2019年10月11日の3作目『メタル・ギャラクシー』で、BABYMETALはアジアのアーティストとして初めてビルボードのロック・アルバム・チャート首位に立つ。6月30日にはグラストンベリー・フェスティバルのメインステージに立ち、日本人バンドとして初の出演となった。2025年8月8日の5作目『メタル・フォース』はビルボード200で9位に入り、日本人だけの編成のバンドとして初のトップ10入りを果たす。5月30日にはロンドンのO2アリーナを単独で満員にした。

現在、この呼び名はアイドルとメタルの融合全般を指す言葉として定着した。海外のメタル誌でさえ「この現象への抵抗は無意味だ」と書くほど、賛否は分かれてきた。それでも海外フェスの出演枠を広げ、日本語の歌がそのまま通る回路を作った点で、この10年の日本の音楽を語るうえで外せない存在になっている。</p>
