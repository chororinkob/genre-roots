<h1>Witch House（ウィッチハウス）とは</h1>
<p>2010年前後にインターネット上で現れた、オカルト的な意匠と極端に遅い音を組み合わせた短命な様式である。テンポは概ね60から90 BPMと極めて遅く、これはヒップホップの伴奏の速度をさらに落としたものである。ドラムはトラップ由来の</p>
<p>2010年前後にインターネット上で現れた、オカルト的な意匠と極端に遅い音を組み合わせた短命な様式である。テンポは概ね60から90 BPMと極めて遅く、これはヒップホップの伴奏の速度をさらに落としたものである。ドラムはトラップ由来の細かく分割された高音の刻みと、重い低音を用いるが、遅さのために躍動ではなく引きずるような重さを生む。決定的な要素は声の加工で、歌の音程を大幅に下げ、同時に再生速度を落とすことで、人の声を性別も年齢も判別できない不気味な唸りへ変える処理が施される。この技法自体はアメリカ南部のヒップホップで発達したものだが、ここでは恐怖の演出のために転用されている。和音の敷物には短調の持続音が用いられ、深い残響によって輪郭が溶ける。加えて、教会の鐘、詠唱、悲鳴、古い映画の断片といった素材が配置される。旋律は存在するが、常に霞の向こうにある。視覚表現が音と同格に扱われる点も重要で、逆さの十字や三角形、記号を混ぜた発音不能な名義、粒子の粗い暗い画像が用いられ、作品全体が一つの雰囲気の提示として設計されている。</p>
<h2>成り立ち</h2><p>この呼称は2009年頃、アメリカの音楽家Travis Egedyが冗談として口にした造語だとされる。彼自身はこれを真剣な分類として提唱したわけではなかったが、当時の画像共有型の交流サイトを通じて瞬く間に広まった。この時期のインターネットには、若い利用者が暗く神秘的な画像を大量に収集して共有するという文化があり、そこに合致する音楽として、この語は求められていたのである。音楽的な実体を作ったのは、アメリカのミシガン州から現れたSalemである。2010年に発表した彼らの作品は、極端に音程を下げた声と、トラップの刻みと、荒廃した質感を組み合わせたもので、この分野の唯一の代表作とされることが多い。ただし彼らの演奏能力は著しく低いと批判され、公演では演奏が成立しないという報道が繰り返された。他にoOoOO、White Ring、Balam Acabといった名義が現れたが、その多くは記号を含む発音できない名を用い、素性を明かさず、活動期間も短かった。この分野の特異な点は、音楽よりも先に美的な様式が存在していたことである。何を聴くかより、どう見えるかが先に決まっており、それゆえに批評家からは、中身のない雰囲気だけの流行だと厳しく評された。実際、2012年頃には呼称そのものがほとんど使われなくなり、多くの作り手が活動を停止するか別の方向へ移っている。しかし、その遺産は無視できない。極端に音程を下げた声、暗く遅い電子音、そしてオカルト的な意匠という組み合わせは、その後のクラウドラップ、ダーク・アンビエント、そして2020年代のインターネット音楽に断続的に回帰しており、短命でありながら参照され続ける奇妙な位置を占めている。</p>
