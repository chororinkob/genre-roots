<h1>Witch House（ウィッチハウス）とは</h1>
<p>2010年前後にインターネット上で現れた、オカルト的な意匠と極端に遅い音を組み合わせた短命な様式である。遅いテンポ（数値は出典により異なり、定説はない）で、これはヒップホップの伴奏の速度をさらに落としたものである。ドラムはトラップ</p>
<p>2010年前後にインターネット上で現れた、オカルト的な意匠と極端に遅い音を組み合わせた短命な様式である。遅いテンポ（数値は出典により異なり、定説はない）で、これはヒップホップの伴奏の速度をさらに落としたものである。ドラムはトラップ由来の細かく分割された高音の刻みと、重い低音を用いるが、遅さのために躍動ではなく引きずるような重さを生む。決定的な要素は声の加工で、歌の音程を大幅に下げ、同時に再生速度を落とすことで、人の声を性別も年齢も判別できない不気味な唸りへ変える処理が施される。この技法自体はアメリカ南部のヒップホップで発達したものだが、ここでは恐怖の演出のために転用されている。和音の敷物には短調の持続音が用いられ、深い残響によって輪郭が溶ける。加えて、不気味なサンプルが配置される。旋律は存在するが、常に霞の向こうにある。視覚表現が音と同格に扱われる点も重要で、十字・三角形・記号の表記、ホラー映画・TV由来の図像が用いられ、作品全体が一つの雰囲気の提示として設計されている。</p>
<h2>成り立ち</h2><p>この呼称は2009年頃、アメリカの音楽家Travis Egedyが冗談として口にした造語だとされる。彼自身はこれを真剣な分類として提唱したわけではなかったが、2009年12月、Pitchfork 企画での発言が契機となり音楽ブログ・媒体へ波及。その後 Tumblr 等のネット文化と結びついた。この時期のインターネットには、若い利用者が暗く神秘的な画像を大量に収集して共有するという文化があり、そこに合致する音楽として、この語は求められていたのである。アメリカのミシガン州から現れたSalem は中心的な先駆者の一組。Tri Angle 系の Balam Acab や oOoOO も同時期の中心。2010年に発表した彼らの作品は、極端に音程を下げた声と、トラップの刻みと、荒廃した質感を組み合わせたもので、この分野を切り開いた代表的な作品のひとつとされる。ただし彼らの「型破りなライブ」は、のちにPitchfork（2021年）がこの分野の衰退の一因に挙げている。他にoOoOO、White Ring、Balam Acabといった名義が現れたが、曲名に三角形や十字、記号を多用するのは主にSalemとWhite Ringで、White Ring（2009年〜）やBalam Acab（本名Alec Koone、2010年〜）はいずれも断続的な活動。この分野の特異な点は、音楽よりも先に美的な様式が存在していたことである。何を聴くかより、どう見えるかが先に決まっており、一部の批評は懐疑的・冷笑的だったが、代表作は好意的評価が多かった。実際、2010年代前半から中頃にかけて目立たなくなり、2013年、Creep が Vice のインタビューで『witch house が死んだのは喜ばしい』と発言し、多くの作り手が活動を停止するか別の方向へ移っている。しかし、その遺産は無視できない。極端に音程を下げた声、暗く遅い電子音、そしてオカルト的な意匠という組み合わせは、ダークなオンライン・ラップ、Yeezus（2013年）、Travis Scott や Billie Eilish らの美学に影響を与えており、短命でありながら参照され続ける奇妙な位置を占めている。</p>
