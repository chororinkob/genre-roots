<h1>Witch House（ウィッチハウス）とは</h1>
<p>2010年前後にインターネット上で現れた、短命なスタイルだ。オカルト的な意匠と、極端に遅い音を組み合わせている。 テンポは遅い。数値は資料によって幅があり、定説はない。ヒップホップの技法は一因にすぎず、資料は影響源を複数挙げている</p>
<p>2010年前後にインターネット上で現れた、短命なスタイルだ。オカルト的な意匠と、極端に遅い音を組み合わせている。

テンポは遅い。数値は資料によって幅があり、定説はない。ヒップホップの技法は一因にすぎず、資料は影響源を複数挙げている。

音の土台には、資料が特徴に挙げる「高音のキーボード効果」「重層的な低音」が用いられる。深い残響（響きの尾）によって、輪郭が溶ける。加えて、不気味なサンプルが配置される。旋律は存在するが、常に霞の向こうにある。

ドラムはトラップ由来だ。1拍を細かく分けた高音の刻みと、重い低音を用いる。ただ、遅さのために躍動ではなく、引きずるような重さを生む。

声の加工は手法の一つにすぎず、歌の音程を「ときどき」下げる。高音の声や女性ボーカルを使う代表作もある。この技法自体はアメリカ南部のヒップホップで発達したものだが、ここでは恐怖の演出のために転用されている。

視覚表現が音と同格に扱われる点も重要だ。十字・三角形・記号の表記や、ホラー映画・TV由来の図像が用いられ、作品全体が一つの雰囲気の提示として設計されている。</p>
<h2>成り立ち</h2><p>この呼称は、2009年頃に生まれた造語だとされる。アメリカの音楽家Travis Egedyが、友人のShamsと共同で作った。彼自身は、これを真剣な分類として提唱したわけではなかった。2009年12月、Pitchfork企画での発言が契機となり、音楽ブログや媒体へ波及した。その後、Tumblr等のネット文化と結びついた。

この時期のインターネットには、若い利用者が暗く神秘的な画像を大量に集めて共有する文化があった。

アメリカのミシガン州から現れたSalemは、中心的な先駆者の一組だ。Tri Angle周辺にいたBalam AcabやoOoOOも、同時期の中心だった。2010年に発表したSalemの『King Night』は、多様な要素の混合で、この分野を切り開いた代表的な作品のひとつとされる。

ただし、2010年3月18日のSXSW（Fader Fort）での公演は、批評家から酷評された。ブーイングを浴びて、ステージを降りた。のちにPitchfork（2021年）は、彼らの「悪名高いほどひどい舞台上の姿」で、witch houseという語が即座に冗談扱いになり、沈んだとしている。

他にoOoOO、White Ring、Balam Acabといった名義が現れた。SalemやWhite Ringなどは、曲名に三角形・十字・Unicode記号を使った。White Ring（2009年〜）やBalam Acab（本名Alec Koone、2010年〜）は、いずれも断続的な活動だった。

この分野の特異な点は、語が先で、実体が後だったという順序である。Egedy自身も、語を作った当時は「まだ実体がなかった」と述べている。暗い画像文化との同時進行は確認できる。一部の批評は懐疑的・冷笑的だったが、代表作は好意的評価が多かった。

実際、2010年代前半から中頃にかけて目立たなくなった。Salemは2012年から、White Ringは2011年から活動を休止していた。2013年、CreepはViceのインタビューで「It's a term that seems to have died. Which is good」と発言した。これは、死んだのは語（a term）だという趣旨である。衰退の要因について、資料はレーベルの休止と作り手の活動休止を挙げている。

しかし、その遺産は無視できない。極端に音程を下げた声、暗く遅い電子音、そしてオカルト的な意匠という組み合わせは、ダークなオンライン・ラップやYeezus（2013年）に影響を与えた。Travis ScottやBillie Eilishらの美学への影響は、当事者の証言と書き手の見立てに依拠しており、そう指摘されている。短命でありながら、参照され続ける奇妙な位置を占めている。</p>
