<h1>Post-Bop（ポストバップ）とは</h1>
<p>ポストバップは、モダンジャズのスタイルの一つだ。ハードバップの熱っぽいブルース感覚にも、フリージャズのように調性から完全に離れることにも振り切らない。その間で、緊張状態のまま踏みとどまった音楽である。 編成は、サックス、トランペッ</p>
<p>ポストバップは、モダンジャズのスタイルの一つだ。ハードバップの熱っぽいブルース感覚にも、フリージャズのように調性から完全に離れることにも振り切らない。その間で、緊張状態のまま踏みとどまった音楽である。

編成は、サックス、トランペット、ピアノ、ベース、ドラムの小編成が中心だ。

和音の面では、コードの決まった流れに頼らない。旋法(モード)を使い、McCoy Tynerらには、3度ではなく4度を積み重ねた4度堆積和音を多く使う傾向がはっきり見られる。ベースが同じ音を保ち続けるペダルポイントの上で、上に乗る楽器だけが動くこともある。こうした、宙に浮いたような響きを好む。

リズムの面では、ドラマーがタイムキープ一辺倒でなくなり、独立性が増す。ベースも、曲によっては4ビートのウォーキングを崩して自由に動く(ウォーキングを保つ曲もある)。「タイム・ノー・チェンジズ」とは、繰り返されるコード進行の枠組みを使わずに、拍だけを共有して即興する方法を指す。

曲の形は、32小節AABAのような決まった型を離れ、変則的な小節数をとる。主題そのものも、謎めいた浮遊感を持つものが多い。フリージャズと違って、主題と即興の区別がある曲が多い。ただし、定義の曖昧なスタイルでもある。調性の内側にとどまる演奏と外へ出る演奏(インサイドとアウトサイド)を行き来することや、対話するようなリズム隊も特徴とされる。</p>
<h2>成り立ち</h2><p>ポストバップの定義には諸説ある。1950年代末〜60年代に、ハードバップ、モード、フリーを一つにまとめた流れを指すことが多い。ビバップ以来のジャズの語法を、さらに尖らせる中で生まれた。

前提の一つとみなされることがあるのが、Miles Davisが率いたセクステットのアルバム『Kind of Blue』(1959)だ。限られた数の旋法(モード)を軸に即興演奏を組み立てる「モード・ジャズ」の手法は、George Russellの理論を背景に、『Milestones』(1958)で実践されていた。このアルバムは、その手法を決定的に広めた作品である。

1963〜64年、Miles Davisは「第2期黄金クインテット」を編成した。顔ぶれは、Wayne Shorterのサックス、Herbie Hancockのピアノ、Ron Carterのベース、Tony Williamsのドラムだ。このクインテットは、繰り返されるコード進行の枠組みを使わずに、拍だけを共有して即興する演奏スタイルを取り入れ、発展させた。通称「タイム・ノー・チェンジズ」と呼ばれるものだ。そして、このジャンルの代表的な実践例を残した。

サックス奏者のWayne Shorterは、自身のリーダー作『Speak No Evil』(1964年録音、1966年発売)など、ブルーノート・レコードでの一連の作品で活躍した。そこで、謎めいた美しさを持つ、作曲家としての独自の持ち味を固めた。ピアニストのMcCoy Tynerは、ジョン・コルトレーンのカルテットでの活動と並行して、リーダー作を発表した。サックス奏者Joe Hendersonも、Blue Noteで『Page One』(1963)、『Inner Urge』『Mode for Joe』(1966)などを残し、この流れに数えられることも多い。

John Coltraneの『A Love Supreme』(1965)は、信仰と即興を一体化させた、スピリチュアル・ジャズの代表作・起点とされる作品である。この語法は、後に続く世代のアコースティック・ジャズとフュージョンに大きな影響を与えた。

ポストバップ以後の動きとしては、2009年以降、ピアニストのRobert GlasperがRobert Glasper Experiment名義で、ジャズにヒップホップやネオソウルを取り込んだ(2012年の『Black Radio』が代表作)。2015年には、サックス奏者Kamasi Washingtonの3枚組の大作『The Epic』が、スピリチュアル・ジャズを新しい世代のリスナーに届ける例となった。</p>
<h2>代表曲</h2><ul><li>Speak Like a Child (Herbie Hancock)</li><li>Speak No Evil (Wayne Shorter)</li><li>Search for Peace (McCoy Tyner)</li><li>Night Dreamer (Wayne Shorter)</li><li>Adam's Apple (Wayne Shorter)</li><li>E.S.P. (Miles Davis Quintet)</li><li>Nefertiti (Miles Davis)</li><li>Orbits (Miles Davis Quintet)</li><li>Iris (Miles Davis Quintet)</li><li>Pinocchio (Miles Davis Quintet)</li><li>Sweet Honey Bee (Duke Pearson)</li></ul>
