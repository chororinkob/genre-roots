<h1>Post-Bop（ポストバップ）とは</h1>
<p>ハードバップの熱っぽいブルース感覚と、フリージャズの調性からの完全な離脱、そのどちらにも振り切らず、緊張状態のまま踏みとどまったモダンジャズの一様式。和声面ではコードの機能進行に頼らず、旋法(モード)や、三度ではなく四度を積み重ね</p>
<p>ハードバップの熱っぽいブルース感覚と、フリージャズの調性からの完全な離脱、そのどちらにも振り切らず、緊張状態のまま踏みとどまったモダンジャズの一様式。和声面ではコードの機能進行に頼らず、旋法(モード)や、三度ではなく四度を積み重ねた四度堆積和音を多用し、ベースが同じ音を保持し続けるペダルポイントの上で上物だけが動くといった、宙吊りの響きを好む。リズム面での最大の発明は、ドラムがビートを刻む係を降りたことである。ライドシンバルのレガートは拍を明示せずに揺らぎながら煽り、ベースも4ビートのウォーキングを途中で放棄して自由に動く。この「テンポは感じられるのに小節線が見えない」状態は「タイム・ノー・チェンジズ」と呼ばれた。曲は32小節AABAのような定型を離れ、変則的な小節数や頻繁な転調をとり、主題そのものも謎めいた浮遊感を持つものが多い。編成はサックス、トランペット、ピアノ、ベース、ドラムの小編成が中心である。フリージャズと違って主題と即興の区別、拍と調性の輪郭は保たれており、耳当たりは滑らかなまま内部だけが極度に高度化しているのが、この音楽の特異な点である。</p>
<h2>成り立ち</h2><p>1960年代、ビバップ以来のジャズの語法をさらに先鋭化させる中で生まれた。Miles Davisが率いたクインテットのアルバム『Kind of Blue』(1959)は、あらかじめ書かれたコード進行ではなく、限られた数の旋法(モード)を軸に即興演奏を組み立てる「モード・ジャズ」という手法を確立し、ポストバップ全体の理論的な土台を作った。1960年代半ば、Miles Davisが新たに結成した「第2期黄金クインテット」(Wayne Shorterのサックス、Herbie Hancockのピアノ、Ron Carterのベース、Tony Williamsのドラム)は、拍節感を自在に伸縮させる「タイム、ノー・チェンジズ」と呼ばれる演奏スタイルを確立し、このジャンルの最も洗練された実践例を残した。サックス奏者のWayne Shorterは、自身のリーダー作『Speak No Evil』(1964)などブルーノート・レコードでの一連の作品で、謎めいた美しさを持つ独自の作曲家性を確立した。ピアニストのMcCoy Tynerはジョン・コルトレーンのカルテットでの活動と並行してリーダー作を発表し、サックス奏者Joe Hendersonも重要な担い手であった。John Coltraneの『A Love Supreme』(1965)は、信仰と即興を一体化させたスピリチュアルジャズの頂点として位置づけられる。この語法は一時衰退したかに見えたが、2000年代にピアニストのRobert Glasperがヒップホップやネオソウルの感覚を取り込んだRobert Glasper Experiment名義の作品群で再解釈し、2015年にはサックス奏者Kamasi Washingtonの3枚組大作『The Epic』が、この系譜を新しい世代のリスナーに届けた。</p>
<h2>代表曲</h2><ul><li>Kind of Blue (Miles Davis)</li><li>Nefertiti (Miles Davis)</li><li>Speak No Evil (Wayne Shorter)</li></ul>
