<h1>Post-Bop（ポストバップ）とは</h1>
<p>ハードバップの熱っぽいブルース感覚と、フリージャズの調性からの完全な離脱、そのどちらにも振り切らず、緊張状態のまま踏みとどまったモダンジャズの一様式。和声面ではコードの機能進行に頼らず、旋法(モード)や、3度ではなく4度を積み重ね</p>
<p>ハードバップの熱っぽいブルース感覚と、フリージャズの調性からの完全な離脱、そのどちらにも振り切らず、緊張状態のまま踏みとどまったモダンジャズの一様式。和声面ではコードの機能進行に頼らず、旋法(モード)や、3度ではなく4度を積み重ねた4度堆積和音を多用し、ベースが同じ音を保持し続けるペダルポイントの上で上物だけが動くといった、宙吊りの響きを好む。リズム面の特徴として、ドラムがビートを刻む係を降りる傾向がある。ライドシンバルのレガートは拍を明示せずに揺らぎながら煽り、ベースも4ビートのウォーキングを途中で放棄して自由に動く。「タイム・ノー・チェンジズ」とは、拍(タイム)は保ちつつ、繰り返されるコード進行(チェンジズ)を使わずに即興する方法を指す。曲は32小節AABAのような定型を離れ、変則的な小節数や頻繁な転調をとり、主題そのものも謎めいた浮遊感を持つものが多い。編成はサックス、トランペット、ピアノ、ベース、ドラムの小編成が中心である。フリージャズと違って主題と即興の区別、拍と調性の輪郭は保たれており、耳当たりは滑らかなまま内部だけが極度に高度化しているのが、この音楽の特異な点である。</p>
<h2>成り立ち</h2><p>定義には諸説あるが、1950年代末〜60年代にハードバップ、モード、フリーを統合した流れを指すことが多い。ビバップ以来のジャズの語法をさらに先鋭化させる中で生まれた。Miles Davisが率いたセクステットのアルバム『Kind of Blue』(1959)は、George Russellの理論を背景に『Milestones』(1958)で実践された、限られた数の旋法(モード)を軸に即興演奏を組み立てる「モード・ジャズ」の手法を決定的に広め、ポストバップの重要な源流の一つとなった。1960年代半ば、Miles Davisが新たに結成した「第2期黄金クインテット」(Wayne Shorterのサックス、Herbie Hancockのピアノ、Ron Carterのベース、Tony Williamsのドラム)は、拍(タイム)は保ちつつコード進行に縛られずに即興する「タイム・ノー・チェンジズ」と呼ばれる演奏スタイルを確立し、このジャンルの最も洗練された実践例を残した。サックス奏者のWayne Shorterは、自身のリーダー作『Speak No Evil』(1964年録音、1966年発売)などブルーノート・レコードでの一連の作品で、謎めいた美しさを持つ独自の作曲家性を確立した。ピアニストのMcCoy Tynerはジョン・コルトレーンのカルテットでの活動と並行してリーダー作を発表し、サックス奏者Joe Hendersonも重要な担い手であった。John Coltraneの『A Love Supreme』(1965)は、信仰と即興を一体化させたスピリチュアルジャズの頂点として位置づけられる。この語法は一時衰退したかに見えたが、2009年以降、ピアニストのRobert GlasperがRobert Glasper Experiment名義でジャズにヒップホップやネオソウルを取り込み(2012年の『Black Radio』が代表作)、2015年にはサックス奏者Kamasi Washingtonの3枚組大作『The Epic』が、この系譜を新しい世代のリスナーに届けた。</p>
<h2>代表曲</h2><ul><li>Speak Like a Child (Herbie Hancock)</li><li>Speak No Evil (Wayne Shorter)</li><li>Search for Peace (McCoy Tyner)</li><li>Night Dreamer (Wayne Shorter)</li><li>Adam's Apple (Wayne Shorter)</li><li>E.S.P. (Miles Davis Quintet)</li><li>Nefertiti (Miles Davis)</li><li>Orbits (Miles Davis Quintet)</li><li>Iris (Miles Davis Quintet)</li><li>Pinocchio (Miles Davis Quintet)</li><li>Sweet Honey Bee (Duke Pearson)</li></ul>
