<h1>Dub Reggae（ダブレゲエ）とは</h1>
<p>既に完成した楽曲から要素を抜き去り、残されたものに極端な加工を施すことで別の作品を作り出す手法であり、また様式でもある。中心にあるのは録音卓を楽器として演奏するという発想で、技師は歌や管楽器の音量を一瞬で下げ、また戻し、ある音だけ</p>
<p>既に完成した楽曲から要素を抜き去り、残されたものに極端な加工を施すことで別の作品を作り出す手法であり、また様式でもある。中心にあるのは録音卓を楽器として演奏するという発想で、技師は歌や管楽器の音量を一瞬で下げ、また戻し、ある音だけを残して他を消すという操作を、演奏のように即興で行う。結果として残るのは低音と太鼓の骨格であり、この二つがどれほど強力かが露わになる。加工には二つの装置が決定的な役割を果たす。ひとつは金属のばねを用いた残響装置で、これを叩くと雷鳴のような轟音が生まれ、効果として用いられたと伝えられる。もうひとつはテープを用いた遅延装置で、抜き去られた歌の一言や太鼓の一打が、山びこのように何度も反射しながら減衰していく。この操作によって、音は空間の中に置かれた物体のように立体的に配置される。加えて、低い音域を削るフィルター(ハイパス)の操作により、ホーンなどの音が細く痩せていくような効果が作られる。テンポはレゲエと同じく遅く、曲の構造は原曲を保ちながらも、聴き手の予測を裏切る形で要素が出入りする。歌は断片としてしか現れず、意味を伝える役割を負わない。</p>
<h2>成り立ち</h2><p>歌抜きの「ヴァージョン」の起源には、次の逸話が伝わっている(Redwood本人の主張による)。1968年(1967年とする資料もある)、キングストンで、サウンドシステムの運営者Ruddy Redwoodが、Duke Reidのスタジオ、Treasure Isleで、The Paragonsの「On the Beach」の一枚限りの盤を作らせたところ、録音技師Byron Smithが誤って歌の入っていない音源にしてしまい、現場で流すと観客が自ら歌い出して熱狂したという。これを機に、レコードの裏面に歌抜きの演奏を収める慣行が広まった。エフェクトを使うダブの手法そのものは、1970年代にKing Tubbyらが発展させた。この偶然を芸術へ高めたのがOsbourne Ruddockである。電気機器の修理を生業としていた彼は、キングストンの自宅に小さなスタジオを構え、録音卓を自ら改造したり、卓に内蔵されたハイパス・フィルター(低い音域を削る)を自在に操ったりして、ホーンなどの音を細くなるまで絞り込む手法を編み出した。King Tubbyの名で知られる彼のこの装置と手さばきが、この分野の音を作り上げた。もう一人の巨人がLee Perryである。彼は1973年に自宅の裏庭にBlack Arkというスタジオを建て、四つの録音経路しか持たない旧式の機材で、何重にも音を重ねる異様に濃密な作品を量産した。彼の制作は呪術的な儀式に近く、テープに大麻の煙を吹きかけたり、保護していないテープを屋外の土に埋めたりしたという証言も残る。1979年、彼は自らこのスタジオに火を放って焼失させたとされ、本人は「邪悪な霊のため」と説明している。ただし家族は、1983年の再建途中の電気事故による火災だったと証言し、諸説ある。King Tubbyのもとには弟子が集まり、なかでもHopeton Brownは、Scientistの名で1980年代前半に膨大な作品を残した。メロディカ奏者のAugustus Pabloは、King Tubbyとの共作で1976年にアルバム『King Tubbys Meets Rockers Uptown』を発表しており、その表題曲は史上屈指のダブとして評価が高い。しかし作り手の運命は過酷だった。King Tubbyは1989年2月、自宅の前で射殺された。強盗が原因と考えられているが、事件は未解決である。この様式が音楽史に与えた影響は計り知れない。原曲を素材として作り替えるという発想は、リミックスという概念そのものを準備し、低音と空間を主役に据える思想は、ジャングルとドラムンベースの基盤となり、ダブステップに大きな影響を与え、ヒップホップやハウスなど多くのジャンルにも影響した。</p>
<h2>代表曲</h2><ul><li>Police and Thieves (Junior Murvin, produced by Lee 'Scratch' Perry)</li><li>Dub Fire (Aswad)</li><li>Heavy Weight Dub (Scientist)</li><li>King Tubbys Meets Rockers Uptown (Augustus Pablo)</li><li>Roast Fish and Cornbread (Lee 'Scratch' Perry)</li><li>Dread Beat an' Blood (Linton Kwesi Johnson)</li><li>Dub Station (King Tubby)</li><li>African Dub (Joe Gibbs)</li><li>Dub Me Crazy (Mad Professor)</li><li>Dub from the Roots (King Tubby)</li></ul>
