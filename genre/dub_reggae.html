<h1>Dub Reggae（ダブレゲエ）とは</h1>
<p>ダブ・レゲエは、既に完成した曲から音を抜き取り、残った音に極端な加工をして、別の作品に作り替える手法であり、一つのスタイルでもある。 中心にあるのは、録音のミキサーを楽器のように演奏するという発想だ。技師は、歌や管楽器の音量を一瞬</p>
<p>ダブ・レゲエは、既に完成した曲から音を抜き取り、残った音に極端な加工をして、別の作品に作り替える手法であり、一つのスタイルでもある。

中心にあるのは、録音のミキサーを楽器のように演奏するという発想だ。技師は、歌や管楽器の音量を一瞬で下げて再び戻し、特定の音だけを残して他を消す。この操作を、演奏のように即興で行う。

結果として残るのは、低音とドラムの骨組みだ。この二つの力強さが、はっきり浮かび上がる。

加工では、二つの装置が決め手になる。一つは、金属のばねを使った残響装置だ。King Tubbyはこれを叩いて雷鳴のような轟音を生み、効果として用いたと伝えられる。もう一つは、テープを使った遅延装置だ。抜き取られた歌の一言やドラムの一打が、山びこのように何度も反射しながら消えていく。この操作で、音は空間に置いた物のように、立体的に並べられる。

さらに、低い音域を削るフィルター(ハイパス)を操作して、ホーンなどの音が細く痩せていく効果も作られる。

テンポはレゲエと同じく遅い。曲の組み立ては原曲を保ちながら、聴き手の予想を裏切る形で音が出入りする。歌は断片的に使われることが多い。</p>
<h2>成り立ち</h2><p>歌を抜いた「ヴァージョン」の始まりには、次の逸話が伝わっている。ただし、細部には異説もある。

1968年(1967年とする説もある)、スパニッシュタウンのサウンドシステムの運営者Ruddy Redwoodが、キングストンにあるDuke Reidのスタジオ、Treasure Isleで、The Paragonsの「On the Beach」の一枚限りの盤を作らせた。ところが、録音技師Byron Smithが誤って、歌の入っていない音源にしてしまった。それを現場で流すと、観客が自ら歌い出して熱狂したという。

Redwoodの逸話は、よく知られた起源の話の一つである。ただし、B面に歌抜きの演奏を入れること自体には先行例があり、複数のスタジオや制作者が並行して発展させた。エフェクトを使うダブの手法そのものは、1970年代にKing Tubbyらが発展させた。

ヴァージョンを即興ミックスの芸術にした中心人物の一人がOsbourne Ruddockである。電気機器の修理を仕事にしていた彼は、キングストンの自宅に小さなスタジオを構えた。購入した録音卓の内蔵ハイパス・フィルター(低い音域を削る)を活用し、周辺機器やフェーダーは自作・特注して、ホーンなどの音を細くなるまで絞り込む手法を編み出した。King Tubbyの名で知られる彼のこの装置と手さばきは、この分野の音を作り上げた中心の一つとなった。

もう一人の巨人がLee Perryである。彼は1973年、自宅の裏庭にBlack Arkというスタジオを建てた。四つの録音経路しかない旧式の機材で、何重にも音を重ねた、異様に濃密な作品を次々に生み出した。彼の制作は呪術的な儀式に近く、テープに大麻の煙を吹きかけたり、保護していないテープを屋外の土に埋めたりしたという証言も残る。

1979年、彼は自らこのスタジオに火を放って焼失させたとされ、本人は「汚れた霊のため」と説明している。ただし家族は、1983年の再建途中に起きた電気事故による火災だったと証言しており、諸説ある。

一方、King Tubbyのもとには弟子が集まった。なかでもHopeton Brownは、Scientistの名で1980年代前半に膨大な作品を残した。メロディカ奏者のAugustus Pabloは、King Tubbyとの共作で、1976年にアルバム『King Tubbys Meets Rockers Uptown』を発表している。その表題曲は1974年のシングルを収録したもので、史上屈指のダブとして評価が高い。

しかし、作り手の運命は過酷だった。King Tubbyは1989年2月、自宅の前で射殺された。強盗が原因と考えられているが、事件は未解決である。

このスタイルが音楽史に与えた影響は大きい。原曲を素材として作り替えるという発想は、リミックスという概念を準備したとも言われる。低音と空間を主役にする考え方は、ジャングルとドラムンベースの土台となり、ダブステップに大きな影響を与え、ヒップホップやハウスなど多くのジャンルにも影響した。</p>
