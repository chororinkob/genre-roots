<h1>Dub Reggae（ダブレゲエ）とは</h1>
<p>既に完成した楽曲から要素を抜き去り、残されたものに極端な加工を施すことで別の作品を作り出す手法であり、また様式でもある。中心にあるのは録音卓を楽器として演奏するという発想で、技師は歌や管楽器の音量を一瞬で下げ、また戻し、ある音だけ</p>
<p>既に完成した楽曲から要素を抜き去り、残されたものに極端な加工を施すことで別の作品を作り出す手法であり、また様式でもある。中心にあるのは録音卓を楽器として演奏するという発想で、技師は歌や管楽器の音量を一瞬で下げ、また戻し、ある音だけを残して他を消すという操作を、演奏のように即興で行う。結果として残るのは低音と太鼓の骨格であり、この二つがどれほど強力かが露わになる。加工には二つの装置が決定的な役割を果たす。ひとつは金属のばねを用いた残響装置で、これを叩くと雷鳴のような轟音が生まれ、しばしば効果として意図的に用いられる。もうひとつはテープを用いた遅延装置で、抜き去られた歌の一言や太鼓の一打が、山びこのように何度も反射しながら減衰していく。この操作によって、音は空間の中に置かれた物体のように立体的に配置される。加えて、高い音域を削るフィルターの操作により、音がこもったり突然開けたりする効果が作られる。テンポはレゲエと同じく遅く、曲の構造は原曲を保ちながらも、聴き手の予測を裏切る形で要素が出入りする。歌は断片としてしか現れず、意味を伝える役割を負わない。</p>
<h2>成り立ち</h2><p>誕生は事故だったとされる。1960年代末のジャマイカ、キングストンで、録音技師Byron Smithが誤って歌の入っていない音源を作ってしまい、それをサウンドシステムの運営者Ruddy Redwoodが現場で流したところ、観客が自ら歌い出して熱狂したという逸話が伝わっている。これにより、レコードの裏面に歌抜きの演奏を収めるという慣行が生まれた。この偶然を芸術へ高めたのがOsbourne Ruddockである。電気機器の修理を生業としていた彼は、キングストンの自宅に小さなスタジオを構え、市販の録音卓を自ら改造して、高い音域を削る特殊なつまみを増設した。King Tubbyの名で知られる彼のこの装置と手さばきが、この分野の音を作り上げた。もう一人の巨人がLee Perryである。彼は1973年に自宅の裏庭にBlack Arkというスタジオを建て、四つの録音経路しか持たない旧式の機材で、何重にも音を重ねる異様に濃密な作品を量産した。彼の制作は呪術的な儀式に近く、テープに息を吹きかけたり、機材を土に埋めたりしたという証言も残る。1983年、彼は自らこのスタジオに火を放って焼失させており、その動機については諸説あるが本人は明確に語っていない。King Tubbyのもとには弟子が集まり、なかでもHopeton Brownは、Scientistの名で1980年代前半に膨大な作品を残した。メロディカ奏者のAugustus Pabloは、King Tubbyとの共作によってこの分野の最高峰とされる作品を1976年に発表している。しかし作り手の運命は過酷だった。King Tubbyは1989年、自宅の前で強盗により射殺された。この様式が音楽史に与えた影響は計り知れない。原曲を素材として作り替えるという発想は、リミックスという概念そのものを準備し、低音と空間を主役に据える思想は、ヒップホップ、ハウス、ジャングル、ダブステップ、さらには現代の電子音楽全般の前提となっている。</p>
<h2>代表曲</h2><ul><li>Police and Thieves (Junior Murvin, produced by Lee 'Scratch' Perry)</li><li>Dub Organiser (Yabby You &amp; King Tubby)</li><li>Dub Fire (Aswad)</li></ul>
