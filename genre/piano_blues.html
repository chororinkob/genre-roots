<h1>Piano Blues（ピアノブルース）とは</h1>
<p>ピアノ一台でブルースの全要素を鳴らしきる様式である。左手が低音の反復パターンで拍と和音進行を刻み、右手が旋律と装飾を担うという明確な分業が土台になっている。左手の型は複数あり、一拍ごとに和音を刻む単純なものから、8分音符で低音を上</p>
<p>ピアノ一台でブルースの全要素を鳴らしきる様式である。左手が低音の反復パターンで拍と和音進行を刻み、右手が旋律と装飾を担うという明確な分業が土台になっている。左手の型は複数あり、一拍ごとに和音を刻む単純なものから、8分音符で低音を上下させ続けるブギの型、低音と和音を交互に跳ね上がるストライドの型まで幅がある。右手は長音階に短三度、減五度、短七度を混ぜたブルーノートを用い、鍵盤では出せないはずの音程の揺れを、隣り合う黒鍵と白鍵をこすり上げるクラッシュ・ノートや、素早い装飾音で疑似的に再現する。このピアノでギターの弦の曲がりを真似るという工夫が、この様式の音の癖を決定づけている。曲の枠は12小節形式が基本だが、八小節形式もよく使われる。歌の伴奏では左手を抑えて歌の隙間に応答を差し込み、独奏では左手の型を最後まで崩さないまま右手のアイデアを積み上げていく。演奏の現場は酒場や娼館、木材伐採キャンプの食堂であり、調律の狂った縦型ピアノで大音量を出す必要から、打鍵は強く、装飾は太い。指をあまり広げず腕の重さで叩く奏法が主流で、クラシックの運指法とは別系統の技術体系を持つ。</p>
<h2>成り立ち</h2><p>十九世紀末から二十世紀初頭、テキサス東部からルイジアナにかけての木材伐採キャンプや鉄道建設現場には、労働者向けの粗末な酒場が付属していた。樽を並べた店という意味でバレルハウスと呼ばれたこれらの場所には、たいてい荒れた縦型ピアノが一台あり、流しの弾き手が夜通し演奏した。ギターと違って持ち運べない楽器であるため、演奏者が旅をして楽器は動かないという、他のブルースとは逆の伝播の仕方をした。録音として形が残るのは1920年代で、クラレンス・スミスがパインタップの愛称で吹き込んだ1928年の『パインタップス・ブギ・ウギ』が、様式の名前そのものを定着させた。彼は翌1929年、シカゴのダンスホールで発生した喧嘩の流れ弾に当たって27歳で死んでいる。同じ1928年にはリロイ・カーが『ハウ・ロング、ハウ・ロング・ブルース』を発表し、荒々しい酒場の音楽だったピアノ・ブルースに、都会的で抑制の効いた歌い口を持ち込んだ。ギターのスクラッパー・ブラックウェルとの二人組は、後の洗練された都市ブルースの原型となる。1930年代から40年代にはルーズヴェルト・サイクスやメンフィス・スリムが活躍し、シカゴが電化する時代にはオーティス・スパンがマディ・ウォーターズのバンドで、電気楽器の間を縫うピアノの役割を確立した。ニューオーリンズでは事情が異なり、ヘンリー・バードがプロフェッサー・ロングヘアの名で、カリブ海のリズムを左手に取り込んだ独特の様式を作った。この系統からはファッツ・ドミノやドクター・ジョンが出ている。レイ・チャールズはこの語法に福音歌の唱法を接続してソウルの土台を作り、ジェリー・リー・ルイスやリトル・リチャードは左手のブギを高速化してロックンロールのピアノを完成させた。エレキギターが主役になるにつれて表舞台からは退いたが、あらゆる鍵盤の即興の底に残り続けている。</p>
