<h1>Piano Blues（ピアノブルース）とは</h1>
<p>ピアノ・ブルースは、ピアノ1台で、ブルースの要素をすべて一人で鳴らしきるスタイルだ。 土台になっているのは、左手と右手のはっきりした分担である。左手は低音の繰り返しのパターンで、拍と和音の流れを刻む。右手はメロディーと飾りを受け持</p>
<p>ピアノ・ブルースは、ピアノ1台で、ブルースの要素をすべて一人で鳴らしきるスタイルだ。

土台になっているのは、左手と右手のはっきりした分担である。左手は低音の繰り返しのパターンで、拍と和音の流れを刻む。右手はメロディーと飾りを受け持つ。

左手の型はいくつもある。1拍ごとに和音を刻む単純なものがあり、8分音符で低音を上下させ続けるブギの型もある。さらに、低音と和音を交互に跳ね上がるストライドの型まで、幅は広い。ストライドは、ラグタイムから生まれたジャズ・ピアノのスタイルだ。

右手は、長音階に短3度、減5度、短7度を混ぜたブルーノートを使う。鍵盤では、音程の揺れは出せないはずだ。そこで、ブルーノートとその隣の音を同時に弾いて解決させるクラッシュ・ノートや、音をすべらせるスライド、素早い装飾音で、揺れに似た音を作る。こうして、歌声やギターのベンドなどの音程の揺れを、クラッシュ・ノートやスライドでまねる。

曲の枠は12小節形式が基本だが、8小節形式もよく使われる。

歌の伴奏では、左手を抑え、歌の隙間に応答を差し込む。独奏では、左手の型を最後まで崩さないまま、右手のアイデアを積み上げていく。

演奏の場は、酒場や娼館、労働キャンプ周辺の酒場であるバレルハウスや、ジューク・ジョイントだった。ピアノで大きな音を出す必要があったため、鍵盤を叩く力は強く、飾りの音は太い。</p>
<h2>成り立ち</h2><p>起源の地は、テキサス東部のパイニー・ウッズとする説が有力だが、確定はしていない。

19世紀末から20世紀初頭、南部各地の労働キャンプには、労働者向けの粗末な酒場が付いていた。樽を並べた店という意味で、バレルハウスと呼ばれた場所だ。そこにはたいてい傷んだピアノが1台あり、流しの弾き手が夜通し演奏した。流しの弾き手は、バレルハウスを巡って旅をした。

録音として形が残るのは、1920年代になってからだ。1928年、クラレンス・スミスがパインタップの愛称で『パインタップス・ブギ・ウギ』を吹き込んだ。題名に「ブギ・ウギ」の綴りを使った最初の録音で、この名称を定着させた。彼は翌1929年、シカゴのダンスホールで起きた乱闘で銃撃に巻き込まれ、24歳で死んでいる。狙われたのが本人だったかどうかは、説が分かれる。

同じ1928年には、リロイ・カーが『ハウ・ロング、ハウ・ロング・ブルース』を発表した。荒々しい酒場の音楽だったピアノ・ブルースに、都会的な洗練へ向かう歌い口を持ち込んだ。ギターのスクラッパー・ブラックウェルとの2人組は、後の洗練された都市ブルースに大きな影響を与えたとされる。

1930年代から40年代には、ルーズヴェルト・サイクスやメンフィス・スリムが活躍した。シカゴが電化する時代には、オーティス・スパンが1952年末から1968年まで、マディ・ウォーターズのバンドにいた。彼は、電気楽器の間を縫うようなピアノを弾いた。

一方、ニューオーリンズでは事情が異なった。ヘンリー・バードがプロフェッサー・ロングヘアの名で、カリブ海のリズムを左手に取り込んだ独特のスタイルを作った。ロングヘアの影響を受けた世代には、ドクター・ジョンらがいる。ファッツ・ドミノも同じニューオーリンズの流れにあり、影響関係が語られることがある。

レイ・チャールズは、ゴスペルとブルースなどを融合して、ソウルの形成に寄与した。ブギ・ウギは、ロックンロールの発展にも大きく寄与した。その代表が、ファッツ・ドミノ、リトル・リチャード、ジェリー・リー・ルイスだ。ただしリトル・リチャードは、シャッフルの型から離れ、均等な8分のロック・ビートを打ち出した。ジェリー・リー・ルイスは、ブルースとブギ・ウギの影響が強い。

やがてエレキギターが主役になると、ピアノ・ブルースは表舞台から退いた。それでも、あらゆる鍵盤楽器の即興の奥底に残り続けている。</p>
