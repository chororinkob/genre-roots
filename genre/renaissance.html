<h1>Renaissance Musicとは</h1>
<p>ルネサンス音楽は、15世紀から16世紀にかけてヨーロッパで書かれた音楽だ。 中心になるのは多声性（複数の旋律が同時に進むこと）である。これはルネサンス音楽を特徴づける要素の1つだ。声の数は、15世紀のシャンソンの3声から、4声以上</p>
<p>ルネサンス音楽は、15世紀から16世紀にかけてヨーロッパで書かれた音楽だ。

中心になるのは多声性（複数の旋律が同時に進むこと）である。これはルネサンス音楽を特徴づける要素の1つだ。声の数は、15世紀のシャンソンの3声から、4声以上へ移った。中期は4声が中心で、5〜6声以上の作品もあり、時に40声にもおよぶ（例：タリス《Spem in alium》（1570年頃、5声部×8合唱隊＝40声）。ストリッジョにも40声のモテット《Ecce beatam lucem》がある）。独立した旋律が同時に進み、互いに模倣しながら絡み合う。

和音は、前の時代のような硬い平行の響きが避けられた。三度と6度を積み重ねた柔らかい和音が基本になる。1500年頃から主流になった書き方の1つが通模倣（旋律をほかの声部が次々にまねしていく手法）だ。ある声部が示した旋律の断片を、他の声部が時間差で次々に真似ていく。旋律は跳躍を控えて滑らかに動く。後期ルネサンス（パレストリーナのスタイル）では、不協和音のうち掛留（前の音を引き伸ばしてぶつかりを作る手法）は、準備してから解決させる手順を踏んだ。経過音（音をつなぐ音）や刺繍音（元の音に戻る装飾の音）は、弱い拍の和音に属さない音として、準備なしで使えた。

編成は、教会音楽と世俗の音楽で分かれる。カトリック圏の教会音楽は、ラテン語の典礼文に付曲したミサ曲とモテットが中心だった。プロテスタント圏では、母語のコラールや詩篇歌が加わった。楽譜上は声楽曲だが、実演では楽器が声を重ねることもあった。世俗の音楽には、シャンソン、マドリガーレ、リュート歌曲がある。

マドリガーレでは、歌詞の意味を音で描く技法が発達した。天という語では音が上がる。死や苦痛の語には、遅く暗い響き、低音、半音階的進行などが当てられることがある。

楽器は、リュート、ヴィオール属、リコーダー、クルムホルン、ショームなどだ。同族の楽器を音域違いで揃えて合奏する編成が好まれた。

楽譜には、メンスーラ記号（音価の分割法（完全＝三分割／不完全＝二分割）を示す記号）はあるが、現代の拍子記号や小節線はない。全声部が共通の拍（タクトゥス）を基準に進む。強拍の周期的な反復は、現代のようには譜面に示されない。</p>
<h2>成り立ち</h2><p>15世紀初頭、イングランドの響きが、大陸の作曲家たちに大きな影響を与えた。John Dunstapleらの英国スタイル（contenance angloise）は、三度と6度を多用する甘い響きを持っていた。このスタイルが大陸に伝わり、Guillaume DufayやGilles Binchoisがそれを取り入れた。

15世紀後半から16世紀にかけては、低地地方（北フランスなどを含む）出身の作曲家が、ヨーロッパ各地の宮廷・教会で活躍した。Johannes Ockeghem、Josquin des Prezといった作曲家が輩出された。とりわけJosquinは、没後も名声が続いた最初期の作曲家だ。後世に天才として語られ、Martin Lutherは「ジョスカンは音符の主人であり、音符は彼の意のままに動く」と語ったと伝えられる。

この時代の音楽を大きく変えたのが、技術と宗教である。1498年に独占出版権を得たOttaviano Petrucciは、1501年にヴェネツィアで、活字による最初の多声楽譜集を出版した（活字による楽譜印刷自体は1476年に先行例がある）。これで、音楽が写本を超えて流通するようになった。

1517年に始まる宗教改革は、音楽の役割そのものを問い直した。Lutherは会衆が母語で歌えるコラールを重視した。一方、Jean Calvinは楽器と多声を排し、教会では詩篇を中心とした斉唱を認めた。

カトリック側は、1545年に始まったトリエント公会議の終盤（1562〜63年）に、歌詞が聞き取れないほど複雑な多声音楽を禁じるべきだという議論を行った。そこから、Giovanni Pierluigi da Palestrinaがミサ曲によって多声音楽を守ったという伝説が生まれた。現在の研究では、このミサ曲の作曲年は不明（1555〜1567年。有力説は1562年頃）である。作曲と公会議の関係を示す歴史的根拠はなく、時期が重なるだけだ。公会議は教会音楽を禁止していないとされる。それでも、彼の書法はその後数百年にわたり、作曲教育の規範となった。

イングランドでは、Thomas TallisとWilliam Byrdが、カトリックとプロテスタントの間で揺れる危険な時代を生き延びながら、傑作を残した。

16世紀末には、ヴェネツィアのサン・マルコ寺院でGiovanni Gabrieliが活躍する。彼は、複数の合唱隊を離れた場所に配置する、ヴィラールトらが先に固めた複合唱（複数の合唱隊が呼び合う形）を、楽器指定や3群以上の編成へ拡張した。この響きが、やがてバロックへの扉を開いた。</p>
