<h1>Renaissance Musicとは</h1>
<p>十五世紀から十六世紀にかけてヨーロッパで書かれた音楽。最大の特徴は多声性で、四声から六声、時に40声にもおよぶ独立した旋律が同時に進み、互いに模倣しながら絡み合う。前の時代のような硬い平行の響きは避けられ、三度と六度を積み重ねた柔</p>
<p>十五世紀から十六世紀にかけてヨーロッパで書かれた音楽。最大の特徴は多声性で、四声から六声、時に40声にもおよぶ独立した旋律が同時に進み、互いに模倣しながら絡み合う。前の時代のような硬い平行の響きは避けられ、三度と六度を積み重ねた柔らかい和音が基本になる。書法の原則は通模倣で、ある声部が提示した旋律の断片を、他の声部が時間差で次々に真似ていく。旋律は跳躍を控えて滑らかに動き、不協和音は必ず準備してから解決させるという厳格な規則があった。教会音楽ではラテン語の典礼文に付曲したミサ曲とモテットが中心で、無伴奏の合唱で歌われた。世俗の音楽ではシャンソン、マドリガーレ、リュート歌曲があり、マドリガーレでは歌詞の意味を音で描く技法が発達し、天という語で音が上がり、死という語で不協和音が置かれた。楽器はリュート、ヴィオール属、リコーダー、クルムホルン、ショームなどで、同族の楽器を音域違いで揃えて合奏する編成が好まれた。拍子記号はあるが小節線がなく、各声部が言葉の抑揚に従って独自に流れるため、現代の楽譜とは時間の感覚がまるで違う。</p>
<h2>成り立ち</h2><p>起点は十五世紀初頭のイングランドと、その影響を受けた低地地方である。John Dunstapleが三度と六度を多用する甘い響きをもたらし、これが大陸に渡ってGuillaume DufayやGilles Binchoisのブルゴーニュ楽派を生んだ。十五世紀後半から十六世紀にかけて、フランドル地方は音楽の中心地となり、Johannes Ockeghem、Josquin des Prezといった作曲家が輩出された。とりわけJosquinは、それまで職人的とされた作曲家を初めて個人の芸術家として認識させた人物で、Martin Lutherは彼を音符の支配者と呼んだ。この時代の音楽を大きく変えたのが技術と宗教である。1470年代にOttaviano Petrucciが活版による楽譜印刷を実用化し、1501年にヴェネツィアで最初の多声楽譜集を出版したことで、音楽が写本を超えて流通するようになった。1517年に始まる宗教改革は、音楽の役割そのものを問い直した。Lutherは会衆が母語で歌えるコラールを重視し、一方Jean Calvinは楽器と多声を排して詩篇のみを認めた。カトリック側は1545年から始まったトリエント公会議で、歌詞が聞き取れないほど複雑な多声音楽を禁じるべきだという議論を行い、Giovanni Pierluigi da Palestrinaがミサ曲によって多声音楽を守ったという伝説が生まれた。真偽は疑わしいが、彼の書法はその後数百年にわたり作曲教育の規範となった。イングランドではThomas TallisとWilliam Byrdが、カトリックとプロテスタントの間で揺れる危険な時代を生き延びながら傑作を残した。十六世紀末、ヴェネツィアのサン・マルコ寺院でGiovanni Gabrieliが複数の合唱隊を離れた場所に配置する複合唱を発展させ、この響きの誇張がやがてバロックへの扉を開いた。</p>
<h2>代表曲</h2><ul><li>Missa Papae Marcelli（Giovanni Pierluigi da Palestrina）</li><li>Ave Maria... Virgo serena（Josquin des Prez）</li><li>Flow My Tears（John Dowland）</li></ul>
