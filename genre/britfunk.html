<h1>Britfunk（ブリットファンク）とは</h1>
<p>1970年代末から80年代前半のイギリスで、アメリカのファンクとジャズファンクを英国流に消化した音楽。編成は生演奏のバンドで、リズムセクションはスラップとゴーストノートを織り交ぜたエレキベース、16分音符を細かく刻むカッティングギ</p>
<p>1970年代末から80年代前半のイギリスで、アメリカのファンクとジャズファンクを英国流に消化した音楽。編成は生演奏のバンドで、リズムセクションはスラップとゴーストノートを織り交ぜたエレキベース、16分音符を細かく刻むカッティングギター、タイトに詰めたドラム、そこにコンガやカウベルが加わる。ホーンセクションは分厚く重ねず、二本か三本で軽やかに合いの手を入れる。鍵盤はフェンダー・ローズとクラビネット、そして当時普及し始めたポリフォニックシンセによる持続音が重なる。テンポは毎分105から120拍程度で、四つ打ちのディスコより跳ねた、前に転がるようなリズムを作る。和声はジャズ由来で、テンションを含む和音を短い間隔で移り変わらせる。歌唱はアメリカのファンクほど絶叫的でなく、控えめで洗練された発声が好まれ、男女混成のコーラスが重なる。曲の展開は歌ものとインストの中間で、長い間奏に鍵盤とホーンのソロが入る。歌詞は恋愛と踊りが中心だが、失業や都市生活への言及も混ざる。演奏の場はロンドンや地方都市の小さなクラブと、平日昼間に開かれるオールデイヤーと呼ばれる催しで、本場アメリカの音を輸入盤で追いかけていた層が、自分たちで演奏し始めたところに本質がある。</p>
<h2>成り立ち</h2><p>背景には1970年代のイギリス独自のクラブ文化があった。イングランド北部ではノーザン・ソウルという、無名のアメリカ産ソウル盤を集めて踊る運動が根づき、ロンドンではジャズファンクやディスコの輸入盤を専門にかけるDJが現れていた。とりわけRobbie VincentのBBCラジオ・ロンドンの番組と、Chris Hillが仕切ったエセックス周辺のクラブが、この音の受け皿を作った。1970年代末、こうした場に通っていた若者たちが自分たちで演奏を始める。中心となったのはロンドンのHi-Tension、Light of the World、Freeez、Level 42、Incognito、Beggar and Co、Central Line、Linx、そしてバーミンガム出身のBeggar and Coらである。Light of the Worldは1979年に結成され、そこからBeggar and CoとIncognitoが枝分かれした。1980年、Linxの『You're Lying』とFreeezの『Southern Freeez』が英国のヒットチャート上位に入り、この音が地元の商業的成功を収めた。当時のイギリスは深刻な不況と失業のさなかにあり、人種暴動が各地で起きていた。担い手の多くはカリブ海からの移民二世で、白人の若者と混成のバンドを組んだこと自体が、当時としては明確な社会的意味を持っていた。しかしこの流れは長く続かなかった。1982年頃、より安価に作れるシンセポップやニューロマンティックが台頭し、多くのバンドが解散するか路線を変えた。Level 42はポップス寄りに転じて国際的な成功を収め、Incognitoは1990年代のアシッド・ジャズの中心として復活した。この音の遺産は、1980年代後半のレア・グルーヴの再評価、そして1990年代のUKガラージやブロークンビーツに受け継がれ、2010年代のロンドンの新しいジャズ勢にも影響が及んでいる。</p>
<h2>代表曲</h2><ul><li>London Town（Light of the World）</li><li>Intuition（Linx）</li><li>Somebody Help Me Out（Beggar &amp; Co）</li><li>Walking Into Sunshine（Central Line）</li><li>Love Games（Level 42）</li></ul>
