<h1>Britfunk（ブリットファンク）とは</h1>
<p>ブリットファンクは、1970年代末から80年代前半のイギリスで生まれた。アメリカのファンクとジャズファンクを、英国流に自分たちのものにした音楽だ。 編成は、生のホーンやベースに、シンセサイザーとドラムマシンを併用したバンドだ。リズ</p>
<p>ブリットファンクは、1970年代末から80年代前半のイギリスで生まれた。アメリカのファンクとジャズファンクを、英国流に自分たちのものにした音楽だ。

編成は、生のホーンやベースに、シンセサイザーとドラムマシンを併用したバンドだ。リズムを支えるベースは、ダブの影響を受けたゆるい感じのものが多い。そこに、16分音符を細かく刻むことの多いカッティングギターと、ぎゅっと引き締まったドラムが加わる。さらにコンガやカウベルが入ることもある。ホーンは、リズムを押し出す役割を担った。鍵盤はフェンダー・ローズやクラビネットが多く使われる。そこへ、当時普及し始めたポリフォニックシンセの持続音が重なることもある。

和音はジャズ由来とされ、テンションを含む和音を短い間隔で移り変わらせることが多い。

テンポはおおむね100〜130前後だ。跳ねた、前に転がるようなリズムを作ることが多い。

歌い方は、アメリカ訛りを避けたものだった。ユニゾンのかけ声のようなコーラスが多く使われた。

歌詞は、恋愛を中心とする軽いテーマが多い。社会的なテーマも一部に見られる。

曲の展開は、歌ものとインストゥルメンタルの中間だ。長い間奏に、鍵盤とホーンのソロが入ることもある。

演奏の場は、ロンドンや地方都市の小さなクラブだった。日曜や祝日に開かれる終日の催しも、その場になった。これはオールデイヤーと呼ばれた。1980年のKnebworthでは、1万2千人が集まった。本場アメリカの音を輸入盤で追いかけていた人たちが、自分たちで演奏し始めた。そこに、この音楽の肝心なところがある。</p>
<h2>成り立ち</h2><p>1970年代のイギリスには、独自のクラブ文化があった。これが、この音楽の背景である。イングランド北部では、ノーザン・ソウルが根づいていた。無名のアメリカ産ソウル盤を集めて踊る運動である。一方ロンドンでは、ジャズファンクやディスコの輸入盤を専門にかけるDJが現れていた。

とりわけ大きかったのが、Robbie VincentのBBCラジオ・ロンドンの番組と、Chris Hillが仕切ったエセックス周辺のクラブだ。これらが、この音を受け入れる場を作った。この音は南東イングランドを中心に発展し、北部でもDJが広めた。

1970年代末、こうした場に通っていた若者たちが、自分たちで演奏を始める。中心となったのは、英国のHi-Tension、Light of the World、Freeez、Incognito、Beggar and Co、Central Line、Linxだ。ワイト島出身で、ロンドンを拠点に活動したLevel 42もいた。Light of the Worldは1978年にロンドンで結成され（デビューは1979年）、そこからBeggar and CoとIncognitoが枝分かれした。

商業的な成功は、1978年のHi-Tensionに始まる。「Hi Tension」が英13位、「British Hustle」が英8位に入った。1980年にはLinxの『You're Lying』が英15位、1981年にはFreeezの『Southern Freeez』が英8位と続いた。

当時のイギリスは、深刻な不況と失業のさなかにあった。人種暴動も各地で起きていた。担い手は、カリブ系の英国生まれ世代が中心だった。彼らが白人の若者と混成のバンドを組んだこと自体が、当時としてははっきりした社会的な意味を持っていた。

しかし80年代半ばにかけて、多くのバンドが解散するか、路線を変えた。Central Lineは1984年に解散した。Freeezは1983年に、Arthur Baker制作の「I.O.U.」でエレクトロ寄りに転じた。Level 42はポップス寄りに転じ、国際的な成功を収めた。Incognitoは1990年代に、アシッド・ジャズを代表するグループのひとつとして成功した。

レア・グルーヴは、ブリットファンクと同じ英国のクラブ文化を共有し、のちのアシッド・ジャズにつながった。ブリットファンクを受け継いだのは、アシッド・ジャズ、アシッド・ハウスやレイヴ、そしてCulture Club、Haircut 100、Spandau Balletなどの1980年代の英国ポップである。</p>
