<h1>Highlife（ハイライフ）とは</h1>
<p>西アフリカ、とりわけガーナとナイジェリアで発展した、ギターとホーンを軸とする都市の大衆音楽。基本となるのは4分の4拍子の上に置かれる、2小節にまたがる非対称の鐘のパターンで、これがサハラ以南の広い地域の音楽に見られる、タイムライン</p>
<p>西アフリカ、とりわけガーナとナイジェリアで発展した、ギターとホーンを軸とする都市の大衆音楽。基本となるのは4分の4拍子の上に置かれる、2小節にまたがる非対称の鐘のパターンで、これがサハラ以南の広い地域の音楽に見られる、タイムライン(鐘の決まったリズム)の役割を果たす。ギターは複数本が異なるフレーズを高い音域で刻み、互いにずれた周期で絡み合うことで、途切れないメロディーの網を作る。この奏法はパームワイン・ギターと呼ばれる伝統から発展したもので、親指と人差し指で弾く2本指奏法を基礎とする。編成にはトランペットとサックスからなるホーンセクションが加わり、短い和音の刺しと対旋律を担う。打楽器はコンガ、木の鐘、シェケレなどで、密度は高いが音量は控えめ。BPMは100〜130、和音は長調の三つ・四つの音の和音のくり返しが中心で、全体に明るく開かれた響きを持つ。メロディーは歌いやすく、リード歌手と合唱の掛け合いが多用される。歌詞はアカン語、ヨルバ語、イボ語、あるいは英語で歌われ、日常の教訓、恋愛、社会への助言、そして祝いの言葉を扱う。祝祭と社交の場で鳴らされる音楽である。</p>
<h2>成り立ち</h2><p>19世紀後半(1870年代とされる)にガーナの沿岸都市、当時のイギリス領ゴールド・コーストで形成された。「highlife」という名称は1920年代初頭に生まれた。パームワイン音楽の源流には、リベリアやシエラレオネのKru人も挙げられる。名称は、海岸沿いの都市の高級な社交クラブで演奏されていた音楽を、外で聴いていた庶民が高い暮らしの音楽と呼んだことに由来するとされる。当初は西洋式の管楽団が舞踏音楽を演奏する形だったが、そこに現地のリズムと、港で働く水夫たちが持ち込んだギターの奏法が混ざった。1920年代から1930年代、E.T. Mensahらが登場する前段として、コースタル地域のパームワイン・ミュージックとブラスバンドの二つの流れが並行して発展した。決め手となった人物はE.T. Mensah（1919年から1996年）で、彼の楽団Tempos Bandは1950年代に、ジャズ、カリプソ、スウィングの要素を取り込んだ洗練された編成を確立し、西アフリカ全域で人気を得た。1956年5月、Louis Armstrongが当時の英領ゴールド・コーストの首都アクラを訪れ、E.T. Mensahと共演したことは、この音楽が国際的な文脈に置かれた象徴的な出来事となった。1957年のガーナ独立に際して、初代首相(のち初代大統領)Kwame Nkrumahはこの音楽を新国家の文化的な象徴として積極的に支援し、ハイライフは汎アフリカ主義の高揚と結び付いた。ナイジェリアでも並行して発展し、Victor Olaiya、Rex Lawson、そしてイボ族の系統ではOsita Osadebeらが独自の様式を築いた。しかし1967年から1970年のビアフラ戦争は、ナイジェリア東部のハイライフ界に大きな打撃を与え、バンドの解散や避難も生じたが、戦後は東部で再興した(Oriental Brothersなど)。1970年代後半のガーナでは経済衰退が進み、1979年までに音楽家組合員の約4分の1が国外へ移った(移住先はドイツや英国などが多かった)。さらに1980年代前半(1982〜84年)の約2年半の夜間外出禁止令で、クラブでの演奏が難しくなった。この離散が、後にバーガー・ハイライフ(Burger Highlife)と呼ばれる電子的な変種をドイツで生む契機となった。現在も西アフリカの音楽の土台として働き、アフロビーツをはじめとする現代の音楽に和声とギターの語彙を提供し続けている。</p>
