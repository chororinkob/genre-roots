<h1>Highlife（ハイライフ）とは</h1>
<p>ハイライフは、西アフリカ、とりわけガーナとナイジェリアで発展した、都市の大衆音楽だ。軸になるのは、ギターとホーンである。 ギターが主導するアンサンブルで、3-2クラーベに近いギターのパターンを伴う。この奏法は、パームワイン・ギター</p>
<p>ハイライフは、西アフリカ、とりわけガーナとナイジェリアで発展した、都市の大衆音楽だ。軸になるのは、ギターとホーンである。

ギターが主導するアンサンブルで、3-2クラーベに近いギターのパターンを伴う。この奏法は、パームワイン・ギターと呼ばれる伝統から発展したもので、2本指奏法を土台にしている。そこに、トランペットとサックスからなるホーンセクションが加わり、短い和音の刺しと対旋律を受け持つ。

和音は、I–IV–V型の長調進行が多いが、旋法的な進行もある。全体に、明るく開かれた響きを持つ。

リズムの基本は、ガフを変形した3-3-2系の鐘のパターンだ。拍子は多くが4分の4拍子で、12分の8拍子系もある。この鐘のパターンが、サハラ以南の広い地域の音楽に見られる、タイムライン(鐘の決まったリズム)の役割を果たす。打楽器はコンガ、クラベス、金属製の鐘、マラカスなどで、音の密度は高いが、音量は控えめだ。

メロディーは歌いやすく、リード歌手と合唱の掛け合いがよく使われる。

歌詞は、アカン語、ガ語など各地の言語、ヨルバ語、イボ語、英語、ピジン英語で歌われる。扱うのは、日常の教訓、恋愛、社会への助言、そして祝いの言葉だ。祝祭と社交の場で鳴らされる音楽である。</p>
<h2>成り立ち</h2><p>19世紀後半(1870年代とされる)、ガーナの沿岸都市で、この音楽は形になった。当時、この地はイギリス領ゴールド・コーストだった。

「highlife」という名前は、1920年代初頭に生まれた。海岸沿いの都市には高級な社交クラブがあり、そこで演奏される音楽を、外で聴いていた庶民が高い暮らしの音楽と呼んだ。名前はこれに由来するとされる。パームワイン音楽の源流には、リベリアやシエラレオネのKru人も挙げられる。

ブラスバンド系（アダハ）、パームワイン・ギター系、舞踏楽団の流れは、それぞれ別々に生まれ、20世紀に融合した。E.T. Mensahらが登場する前の段階として、ブラスバンド（アダハ）・パームワイン・舞踏楽団の流れが、20世紀前半までに出そろった。

最も代表的な人物の一人は、E.T. Mensah（1919年から1996年）だ。彼の楽団Tempos Bandは、ジャズ、カリプソ、スウィングの要素を取り込んだ洗練された編成として、1940年代後半に形を整えた。そして1950年代に、西アフリカ全域で人気を得た。

1956年5月には、Louis Armstrongが当時の英領ゴールド・コーストの首都アクラを訪れ、E.T. Mensahと共演した。これは、この音楽が国際的な舞台に置かれたことを示す、シンボルのような出来事になった。

1957年、ガーナは独立する。初代首相(のち初代大統領)のKwame Nkrumahは、この音楽を新しい国の文化のシンボルとして、積極的に支援した。こうしてハイライフは、汎アフリカ主義の高まりと結び付いた。

一方、ハイライフは1930年代以降、ガーナからナイジェリアに伝わり、独自のスタイル（ヨルバ系、イボ系など）に発展した。そこでは、Victor Olaiya、Rex Lawson、そしてイボ族の系統ではOsita Osadebeらが、独自のスタイルを築いた。しかし、1967年から1970年のビアフラ戦争は、ナイジェリア東部のハイライフ界に大きな打撃を与えた。戦後は100万人超のイボ人が東部に戻り、ハイライフは東部に根づいた(Oriental Brothersなど)。

ガーナでは、1970年代後半に経済の衰退が進んだ。1979年までに、音楽家組合員の約4分の1が国外へ移ったと、組合が推計している(移住先はドイツや英国などが多かった)。さらに、1980年代前半(1982〜84年)の約2年半にわたる夜間外出禁止令で、クラブでの演奏が難しくなった。この離散がきっかけとなり、後にバーガー・ハイライフ(Burger Highlife)と呼ばれる電子的な変種が、ドイツで生まれた。

ハイライフは今も、西アフリカの音楽の土台として働いている。アフロビートや、後のヒップライフ・アフロビーツにも影響を与えた。</p>
