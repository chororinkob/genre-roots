<h1>Highlife（ハイライフ）とは</h1>
<p>西アフリカ、とりわけガーナとナイジェリアで発展した、ギターとホーンを軸とする都市の大衆音楽。基本となるのは四分の四拍子の上に置かれる、二小節にまたがる非対称の鐘のパターンで、これがアフリカ音楽全般に共通するタイムラインの役割を果た</p>
<p>西アフリカ、とりわけガーナとナイジェリアで発展した、ギターとホーンを軸とする都市の大衆音楽。基本となるのは四分の四拍子の上に置かれる、二小節にまたがる非対称の鐘のパターンで、これがアフリカ音楽全般に共通するタイムラインの役割を果たす。ギターは複数本が異なる音型を高音域で刻み、互いにずれた周期で絡み合うことで、途切れない旋律の網を作る。この奏法はパームワイン・ギターと呼ばれる伝統から発展したもので、親指で低音を刻みながら他の指で旋律を弾くフィンガーピッキングを基礎とする。編成にはトランペットとサックスからなるホーンセクションが加わり、短い和音の刺しと対旋律を担う。打楽器はコンガ、木の鐘、シェケレなどで、密度は高いが音量は控えめ。BPMは100〜130、和声は長調の三和音や四和音の循環が中心で、全体に明るく開かれた響きを持つ。旋律は歌いやすく、リード歌手と合唱の掛け合いが多用される。歌詞はアカン語、ヨルバ語、イボ語、あるいは英語で歌われ、日常の教訓、恋愛、社会への助言、そして祝いの言葉を扱う。祝祭と社交の場で鳴らされる音楽である。</p>
<h2>成り立ち</h2><p>起源は20世紀初頭のガーナ、当時のイギリス領ゴールド・コーストにある。名称は、海岸沿いの都市の高級な社交クラブで演奏されていた音楽を、外で聴いていた庶民が高い暮らしの音楽と呼んだことに由来するとされる。当初は西洋式の管楽団が舞踏音楽を演奏する形だったが、そこに現地のリズムと、港で働く水夫たちが持ち込んだギターの奏法が混ざった。1920年代から1930年代、E.T. Mensahらが登場する前段として、コースタル地域のパームワイン・ミュージックとブラスバンドの二つの流れが並行して発展した。決定的な人物はE.T. Mensah（1919年から1996年）で、彼の楽団Tempos Bandは1950年代に、ジャズ、カリプソ、スウィングの要素を取り込んだ洗練された編成を確立し、西アフリカ全域で人気を得た。1956年、Louis Armstrongがガーナを訪れてTemposと共演したことは、この音楽が国際的な文脈に置かれた象徴的な出来事となった。1957年のガーナ独立に際して、初代大統領Kwame Nkrumahはこの音楽を新国家の文化的な象徴として積極的に支援し、ハイライフは汎アフリカ主義の高揚と結び付いた。ナイジェリアでも並行して発展し、Victor Olaiya、Rex Lawson、そしてイボ族の系統ではOsita Osadebeらが独自の様式を築いた。しかし1967年から1970年のビアフラ戦争は、ナイジェリアのハイライフの中心地であった東部を壊滅させ、多くの音楽家が離散した。1970年代にはガーナでも軍事政権下の経済崩壊と夜間外出禁止令により、クラブでの演奏が困難になり、音楽家の多くがロンドンやハンブルクへ移住した。この離散が、後にブルクハイライフと呼ばれる電子的な変種をドイツで生む契機となった。現在も西アフリカの音楽の基層として機能し、アフロビーツをはじめとする現代の音楽に和声とギターの語彙を提供し続けている。</p>
