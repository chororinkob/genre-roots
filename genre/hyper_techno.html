<h1>Hyper Techno（ハイパーテクノ）とは</h1>
<p>4つ打ちのキックを土台に、ディスコのフロアを一気に沸かせるために作られた高速のダンス・ミュージックだ。代表曲22曲を動画で聴け、ルーツと影響のつながりを地図でたどれる。</p>
<p>4つ打ちのキックを土台に、ディスコのフロアを一気に沸かせるために作られた高速のダンス・ミュージックだ。テンポは140〜160 BPMが中心で、曲によっては170 BPM前後まで上がる。

音の主役はシンセサイザーだ。オーケストラヒットと呼ばれる、弦と金管をまとめて一発鳴らしたような合成音が、合図のように連打される。サンプラーに録った女性の掛け声や「フォー！」という叫びを、鍵盤で叩いて鳴らす使い方も定番だ。硬くて倍音の多いリード音がメロディを担当し、叙情的な曲ではピアノの単音が前列に出てくる。

和音は短調の3和音を数個だけ回す作りが多く、コード進行の妙より音色の重なりで緊張を作る。メロディは4度・5度の跳躍が多く、サビで1オクターブ上がる型が目立つ。

リズムは4分の4拍子で、キックは1拍目から4拍目まで均等に4つ。2拍目と4拍目にクラップかスネアが重なり、裏拍ではベースが短く跳ねる。ハイハットは16分音符で刻み、1拍目と3拍目にアクセントが集まる。

音響は乾いた音作りが基本で、リバース・シンバルで展開の切れ目を作り、スネアにはゲートリバーブをかけて余韻を断ち切る。タムを高音から低音へ転がすフィルが、サビ前の合図として繰り返し使われる。

歌は女性ボーカルが中心で、英語の短いフレーズを高く張り上げる。ラップやMCの掛け声を曲の途中に差し込む構成も多い。

歌詞の主題は夜、ダンス、恋、そして止まらないという高揚感だ。意味よりも掛け声の響きが優先され、フレーズは短く繰り返される。

曲はイントロでオーケストラヒットを数発鳴らし、キックだけの区間を挟んで一気にサビへ入る。間奏ではタムのフィルとボイス・サンプルだけになり、最後のサビを2回繰り返して短く終わる。

ユーロビートがメロディと歌を主役に据えるのに対し、こちらはキックとシンセの塊を主役にする。テクノの本流より旋律が多く歌ものが大半で、ハードコアテクノより音が明るく、1曲が短い。

鳴っているのはディスコの大箱、パラパラのイベント、そしてアーケードゲームや音楽ゲームの筐体だ。座って聴く音楽ではなく、立って踊るために作られた音だ。</p>
<h2>成り立ち</h2><p>1980年代末、ベルギーとドイツのクラブで、ロックとハウスを混ぜたニュービートという音楽が流行していた。その音は海を渡り、1991年5月15日に東京都港区芝浦へ開いたジュリアナ東京に流れ込む。総面積1200平方メートル、最大2000人を収容したこの箱は、開場した当初はイタロハウスをかけていた。

やがてフロアの空気は変わる。1991年冬から1992年にかけては、重いキックを連打するハードコアテクノが中心になった。マハラジャなど全国のディスコも同じ方向へ動き、この時期の音はまとめてジュリアナテクノと呼ばれた。メインDJはアイルランド人のジョン・ロビンソンで、DAVID &quot;3D&quot; WARD、アンソニー・ロイド・ガリー、ポール・ベインハムといった外国人DJが毎晩フロアに立った。日本人ではPassionとGunが腕をふるった。

1992年頃には、ハイパーテクノという呼び名がすでに使われていたことが確認されている。同じ年以降、重い4つ打ちを押し出したレイヴ曲がデステクノとして独自に進化する。名前が一気に広がるのは1994年だ。8月31日にジュリアナ東京が閉店し、代わりに12月へVELFARREが開場する。avex traxはVELFARREのDJによるミックスCDを作る際、収録曲を1曲ずつジャンル分けし、従来のデステクノをTECHNOとHYPER TECHNOに振り分けた。商品の棚の名前が、そのままジャンルの名前になった。

制作の側では、avex traxのエンジニアと専属のリミキサーが音を組み立てた。1993年5月21日に出たtrfの『HYPER TECHNO MIX』では、星野靖彦がSTARR GAZERとMAXIMIZORの名義で、冬野竜彦が2ND FUNK-TIONの名義で、OZとアメリカのRADIKAL RECORDSがリミックスを担当した。このシリーズは、ディスコ向けに12インチ盤だけで出ていたリミックスをCDにまとめ、オリジナルアルバムと同じ重みを持たせる狙いで始まっている。フロアでは、MAXIMIZORの「CAN'T UNDO THIS!!」やL.A. STYLEの「JAMES BROWN IS DEAD」のように、掛け声とオーケストラヒットだけで押し切る曲が定番だった。1994年以降は国産とイタリア産が中心になり、ユーロビートの作り手たちが同じ構造の音を追求した。イタリアのTIME RECORDS、A-Beat C、Delta、SinclaireStyleといったレーベルの音が、日本のフロア向けに調整されて入ってくる。

一方で、名前の輪郭はすぐにぼやけた。1996年頃にはトランステクノとハッピーハードコアが流行し、速い曲はなんでもHYPER TECHNOとして棚に並べられた。1997年以降、ハードハウスとダッチトランスに押されてコンピレーションの表記は消えていく。ジュリアナ東京がテクノという言葉を日本に広めた一方で、クラブ雑誌やクラブ通いは、あの箱の音をテクノとは別物として扱った。商業施設の音と、地下のクラブの音が切り離された瞬間でもあった。

それでも音は残った。1990年代後半から2000年代にかけては、パラパラの一種であるテクパラの曲として踊られ続けた。2001年5月30日には松浦勝人がプロデュースし、Passionとt-kimuraがミックスを担当した『Hyper Techno [Mission One]』がAvex Traxから出ている。ゲーム音楽の分野ではSampling Mastersの名義で同種の曲が作られ、『リッジレーサー』やbeatmania系の筐体で育った世代が、あとからこの音にたどり着いた。

現在、日本ではイベントやDJ講習のかたちで細く続いている。海外では2022年から2023年にかけて、ドイツを中心にHypertechnoと名乗る別の音楽が生まれた。Macon、Niklas Dee、Creedsの「Push Up」などが代表で、ポップ曲のボーカルを高く速く加工してテクノのキックに載せる作りだ。英語圏の資料はこれを日本のハイパーテクノと別物として扱っている。名前は同じでも、生まれた場所も作り方も違う。</p>
