<h1>Hyper Techno（ハイパーテクノ）とは</h1>
<p>4つ打ちのキックを土台に、ディスコのフロアを一気に沸かせるために作られた高速のダンスミュージックだ。代表曲22曲を動画で聴け、ルーツと影響のつながりを地図でたどれる。</p>
<p>4つ打ちのキックを土台に、ディスコのフロアを一気に沸かせるために作られた高速のダンスミュージックだ。テンポは曲による。

音の主役はシンセサイザーだ。オーケストラヒットと呼ばれる、弦と金管をまとめて一発鳴らしたような、合成またはサンプリングされた音が、合図のように連打される。サンプラーに録った女性の掛け声や「フォー！」という叫びを、鍵盤で叩いて鳴らす使い方も定番だ。硬くて倍音の多いリード音がメロディを担当する。叙情的な曲では、ピアノの単音が前に出てくる。

和音は、短調の3和音を数個だけ回す作りが多いとされる。コード進行の工夫よりも、音の重なりで緊張を作る。メロディは4度や5度の跳躍が多く、サビで1オクターブ上がる型が目立つといわれる。

リズムは4分の4拍子で、キックが1拍目から4拍目まで均等に4つ入る。2拍目と4拍目にはクラップかスネアが重なり、裏拍でベースが短く跳ねる。ハイハットは16分音符で刻まれることが多い。

音作りは乾いた音が基本だ。リバース・シンバルで展開の切れ目を作ることが多く、スネアにはゲートリバーブをかけて余韻を断ち切ることが多い。タムを高音から低音へ転がすフィルが、サビの前の合図として使われることが多い。

歌は女性ボーカルが中心で、英語の短いフレーズを高く張り上げる。曲の途中に、ラップやMCの掛け声を差し込む構成も多い。

歌詞の主題は、夜とダンスと恋、そして止まらないという高揚感だとされる。意味よりも掛け声の響きが優先され、フレーズは短く繰り返される。

曲はイントロでオーケストラヒットを数発鳴らし、キックだけの区間を挟んで一気にサビへ入る。間奏ではタムのフィルとボイス・サンプルだけになる。最後はサビを2回繰り返して短く終わることが多い。

ユーロビートに近い要素（女性ボーカル、メロディ）を持ちながら、4つ打ちのキックと派手なシンセを前面に出す。テクノの本流より旋律が多く、歌ものが大半だ。ハードコアテクノより音が明るく、1曲が短い。

鳴っているのはディスコの大箱、パラパラのイベント、そしてアーケードゲームや音楽ゲームの筐体だ。座って聴く音楽ではなく、立って踊るために作られた音だ。</p>
<h2>成り立ち</h2><p>舞台は、1980年代後半のベルギーだ。ニューウェイヴ、Hi-NRG、EBM、ヒップホップ、アシッドハウスなどを融合したニュービートという電子ダンス音楽が生まれ、西ヨーロッパの各地のクラブで流行した。ニュービートは、ハードコア系のダンス音楽の直接の前身とされる。そのハードコア系の音が海を渡り、1991年5月15日に東京都港区芝浦で開いたジュリアナ東京に流れ込んだ。総面積1200平方メートル、最大2000人を収容したこの箱は、開場した当初はイタロハウスをかけていた。

やがてフロアの空気は変わる。1991年の冬から1992年にかけては、重いキックを連打するハードコアテクノが中心になった。マハラジャなど全国のディスコも同じ方向へ動き、この時期の音はまとめてジュリアナテクノと呼ばれた。メインDJは、北アイルランド出身のジョン・ロビンソンだ。DAVID &quot;3D&quot; WARD、アンソニー・ロイド・ガリー、ポール・ベインハムといった外国人DJが、毎晩フロアに立った。日本人ではPassionとGunが腕をふるった。

ニコニコ大百科によれば、1992年頃には、ハイパーテクノという呼び名がすでに使われていた。同じ年以降、重い4つ打ちを押し出したレイヴ曲が、デステクノとして独自に進化していく。名前の定着は、1994年12月以降、VELFARREのミックスCDの表記によって進んだとされる。8月31日にジュリアナ東京が閉店し、代わって12月にVELFARREが開場した。avex traxは、VELFARREのDJによるミックスCDを作る際に収録曲を1曲ずつジャンル分けし、従来のデステクノをTECHNOとHYPER TECHNOに振り分けた。商品の棚の名前が、そのままジャンルの名前になった。

制作の側では、avex traxのエンジニアと専属のリミキサーが音を組み立てた。1993年5月21日に出たtrfの『HYPER TECHNO MIX』では、星野靖彦がSTARR GAZERとMAXIMIZORの名義で、冬野竜彦が2ND FUNK-TIONの名義でリミックスを担当した。OZとアメリカのRADIKAL RECORDSもリミックスに加わった。このシリーズは、ディスコ向けに12インチ盤だけで出ていたリミックスをCDにまとめ、オリジナルアルバムと同じ重みを持たせる狙いで始まった。フロアでは、MAXIMIZORの「CAN'T UNDO THIS!!」やL.A. STYLEの「JAMES BROWN IS DEAD」のように、掛け声とオーケストラヒットだけで押し切る曲が定番だった。1994年以降は国産とイタリア産が中心になり、ユーロビートの作り手たちが同じ構造の音を追求した。イタリアのTIME RECORDS、A-Beat C、Delta、SinclaireStyleといったレーベルの音も、日本のフロア向けに調整されて入ってきた。

一方で、名前の輪郭はすぐにぼやけた。1996年頃にはトランステクノやハッピーハードコアが流行し、これら高BPMの曲もHYPER TECHNOに分類されるようになった。1997年ごろを境に人気は下火になったが、2000年代初頭にもHyper Techno名義のコンピが出ている。ジュリアナ東京がテクノという言葉を日本に広めた一方で、クラブ雑誌やクラブ通いは、あの箱の音をテクノとは別物として扱った。商業施設の音と、地下のクラブの音が切り離された瞬間でもあった。

それでも音は残った。1990年代後半から2000年代にかけては、パラパラの一種であるテクパラの曲として踊られ続けた。2001年5月30日には、松浦勝人がプロデュースし、Passionとt-kimuraがミックスを担当した『Hyper Techno [Mission One]』が、Avex Traxから出た。ゲーム音楽の分野では、Sampling Mastersの名義で、ハードコアテクノ系でハイパーテクノに近い曲も作られた。『リッジレーサー』やbeatmania系の筐体で育った世代が、あとからこの音にたどり着いた。

現在、日本ではテクパラ講習会やイベントのかたちで細く続いている。海外では2022年から2023年にかけて、ドイツを中心にHypertechnoと名乗る別の音楽が生まれた。Macon、Niklas Deeらが代表的な作り手だ。Creedsの『Push Up』（2022年、フランスのプロデューサー作のハードテクノ曲）が、流行のきっかけの一つとされる。英語圏の資料は、これを日本のハイパーテクノとは別物として扱っている。名前は同じでも、生まれた場所も作り方も違う。</p>
