<h1>Screamo（スクリーモ）とは</h1>
<p>ハードコア・パンクの激しさと、感情の生々しい露出を極限まで推し進めた音楽である。名称が示す通り、ヴォーカルは歌わずに絶叫するが、その叫びはメタルのような統制された咆哮ではなく、喉が壊れることを厭わない、涙声に近い金切り声であり、し</p>
<p>ハードコア・パンクの激しさと、感情の生々しい露出を極限まで推し進めた音楽である。名称が示す通り、ヴォーカルは歌わずに絶叫するが、その叫びはメタルのような統制された咆哮ではなく、喉が壊れることを厭わない、涙声に近い金切り声であり、しばしば言葉として成立していない。演奏も同様に、統制より切迫を優先する。ギターは高い音域で不協和な和音を掻き鳴らし、コードを押さえずに開放弦を鳴らしたまま指板を移動することで、濁った響きが持続する。ドラムは高速の二拍子と、拍を崩した雪崩のような連打を往復し、演奏が破綻寸前のまま進む。曲は極端に短く、1分から2分程度で、導入も終止もないまま断ち切られることが多い。その一方で、静寂に近い繊細なアルペジオの部分が挿入され、その直後に最大音量が戻るという極端な落差が設計される。歌詞は政治的な主張よりも、個人の絶望、罪悪感、身体の痛み、人間関係の崩壊を扱い、詩のような断片的な形で書かれる。演奏の場は小さな地下室や住宅の居間であり、演者と聴き手の物理的な距離がないことが前提となっている。</p>
<h2>成り立ち</h2><p>1990年代初頭のワシントンD.C.が出発点である。1991年頃、この街のハードコアの現場から、Moss Iconや後にHooverと呼ばれる一群が、従来の攻撃性とは異なる、内向的で情緒的な激しさを提示し始めた。とりわけ1991年に短期間だけ活動したNation of Ulyssesの周辺から生まれたRites of Springの流れは、感情を露出させるハードコアの原型とされる。この方向がより極端になったのがカリフォルニア州サンディエゴである。1990年代前半、Gravity Recordsを拠点に、Heroin、Antioch Arrow、Angel Hairといったバンドが、崩壊寸前の演奏と絶叫による極めて短い曲を作り、この様式を確立した。彼らの作品は数百枚単位でしか流通せず、7インチのレコードが主な媒体だった。スクリーモという呼称自体は、当初この一群を指して用いられた俗称であり、当事者の多くは軽蔑的な響きを感じて拒んでいる。1990年代後半にはこの様式が国際化し、日本のEnvy、フランスのAmanda Woodward、ドイツの一群が独自の解釈を加えた。とりわけEnvyは、後にポストロックの壮大さを取り込むことで、この分野に新しい可能性を示した。アメリカではニュージャージーのYou and I、そしてOrchidやPageninetynineが、より速く短い方向を極めている。2000年代前半、事態は複雑になる。全く別の、叫びと歌を交互に配置する商業的なバンド群が、報道によってスクリーモと呼ばれ始めたのである。この呼称の混乱は現在も続いており、本来の地下的な系譜を指す場合には別の語を用いる愛好家も多い。本来の一群は商業的な成功をほぼ得ないまま、多くが数年で解散した。しかし2010年代以降、当時の録音がインターネットを通じて再発見され、新しい世代のバンドが世界各地で活動を始めており、感情を隠さないという原則は今も受け継がれている。</p>
