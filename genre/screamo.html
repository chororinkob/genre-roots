<h1>Screamo（スクリーモ）とは</h1>
<p>ハードコア・パンクの激しさと、感情の生々しい露出を極限まで推し進めた音楽である。名称が示す通り、ヴォーカルは絶叫（screaming vocals）が中心で、歌唱を交える例もあるが、その叫びはメタルのような統制された咆哮ではなく、</p>
<p>ハードコア・パンクの激しさと、感情の生々しい露出を極限まで推し進めた音楽である。名称が示す通り、ヴォーカルは絶叫（screaming vocals）が中心で、歌唱を交える例もあるが、その叫びはメタルのような統制された咆哮ではなく、喉が壊れることを厭わない、涙声に近い金切り声である。演奏も同様に、統制より切迫を優先する。ギターは不協和な響きと、ハーモニーを付けたギター（ハーモナイズド・ギター）が特徴である。ドラムは高速の2ビート（バスドラムとスネアを交互に刻み、聴感上倍のテンポに聞こえるリズム）と、拍を崩した雪崩のような連打を往復し、演奏が破綻寸前のまま進む。曲は短いのが特徴（1〜3分程度が目安）で、ポストロック寄りの作品には長尺の曲もある。その一方で、静寂に近い繊細なアルペジオ（和音を1音ずつ順に弾く奏法）の部分が挿入され、その直後に最大音量が戻るという極端な落差が設計される。歌詞は感情的苦痛や破局などの個人的主題が中心だが、政治や人権も扱われ、詩のような断片的な形で書かれる。演奏の場は地下室、退役軍人会館のホール（VFWホール）、居間などのDIY会場が主な舞台で、演者と聴き手の物理的な距離が近い。</p>
<h2>成り立ち</h2><p>エモの源流はワシントンD.C.にあり、スクリーモはサンディエゴのバンドが先駆となったと一般に見なされる（異説もある）。D.C.周辺のメリーランド州アナポリスのMoss Icon（1986年末結成）や、1992年にD.C.で結成されたHooverが、従来の攻撃性とは異なる、内向的で情緒的な激しさを提示した。Rites of Spring（1983〜1986年）の流れは、感情を露出させるハードコアの原型（エモの源流）とされ、Nation of Ulysses（1988〜1992年）は別系統ながら、スクリーモに影響を与えた。この方向がより極端になったのがカリフォルニア州サンディエゴである。1990年代前半、Gravity Recordsを拠点に、サンディエゴのHeroinとAntioch Arrow、そして同レーベルから作品を出したコロラドのAngel Hairといったバンドが、崩壊寸前の演奏と絶叫による極めて短い曲を作り、この様式の先駆となった。彼らの作品は少部数のリリースが中心で、7インチや12インチのレコードが主な媒体だった。この様式は発展の当初は「スクリーモ」と呼ばれておらず、この語は1990年代半ばにDIYハードコアのシーン内で使われ始め、2000年代前半に報道を通じて広がった呼称であり、当事者の多くは軽蔑的な響きを感じて拒んでいる。1990年代後半から2000年前後にかけてこの様式が国際化し、日本のEnvy、フランスのAmanda Woodward、イタリアのRaeinやLa Quieteが独自の解釈を加えた。とりわけEnvyは、後にポストロック（ロックの形を崩した実験的な音楽）の壮大さを取り込むことで、この分野に新しい可能性を示した。アメリカではニュージャージーのYou and I（ハードコア、メタル、エモの境界で活動）、そしてOrchidやPageninetynineが活動した。2000年代前半、事態は複雑になる。スクリーモの影響を受けたメロディックな商業的バンド群が、報道によってスクリーモと呼ばれ始めたのである。この呼称の混乱は現在も続いており、本来の地下の流れを指す場合には別の語を用いる愛好家も多い。本来の一群は商業的な成功をほぼ得ないまま、Heroin（1989〜1993年）やAntioch Arrow（1992〜1994年）など多くが数年で解散した。しかし2010年代以降に再評価され、2020年代には新世代の流行が起きて、新しい世代のバンドが世界各地で活動を始めており、感情を隠さないという原則は今も受け継がれている。</p>
