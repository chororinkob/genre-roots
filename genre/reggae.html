<h1>Reggae（レゲエ）とは</h1>
<p>レゲエは、ジャマイカで生まれた音楽だ。拍の裏側を強調するリズムが中心になっている。 最大の特徴は、スキャンク(またはバン)と呼ばれるギターとピアノの弾き方だ。小節の裏拍（拍と拍の間）に、短く切った和音（スタッカート）を置いて鳴らす</p>
<p>レゲエは、ジャマイカで生まれた音楽だ。拍の裏側を強調するリズムが中心になっている。

最大の特徴は、スキャンク(またはバン)と呼ばれるギターとピアノの弾き方だ。小節の裏拍（拍と拍の間）に、短く切った和音（スタッカート）を置いて鳴らす。その結果、表拍に置かれるはずの重心が抜け落ちる。音楽全体が後ろへ引っ張られるような、独特の浮遊感が生まれる。

ベースは主役だ。低い音域で、歌うようなメロディーの線を弾く。1小節の中で、わざと音を抜いて空白を作る。この空白が、リズムの呼吸になる。オルガンは、裏拍を強調した8分音符のシャッフル（バブル）を刻み、リズムを湧き立たせる。管楽器のセクションが、ときどきリフを差し込む。パーカッションでは、ナイヤビンギに由来する手叩き太鼓が加わることもある。

テンポは60〜90BPMでゆったりしている。ska・ロックステディよりテンポは遅いとされることが多いが、初期レゲエはロックステディより速かったという記述もある。ドラムはワン・ドロップというパターンが典型だ。1拍目のバスドラムを鳴らさず、3拍目にキックとリムショット（太鼓の縁を叩く音）を同時に落とす。他にロッカーズやステッパーズといった型もある。ステッパーズ・ロッカーズとも定義は資料によって異なる（教則では、ステッパーズ＝全拍キック／Wikipediaでは、ロッカーズ＝4分音符ごと、ステッパーズ＝8分音符ごと）。

歌い方は、メロディアスなものから、トースティングと呼ばれる語りに近いものまで幅広い。

歌詞はラスタファリ運動の信仰、バビロン(抑圧的な体制)への批判、貧困、大麻、愛と多岐にわたる。

最後に、ミキシング卓でトラックを抜き差しして残響を加える、ダブの手法がある。これもレゲエから直接派生した。</p>
<h2>成り立ち</h2><p>1960年代後半、ジャマイカのキングストンの貧困地区で、レゲエは成り立った。

その前史から見ていこう。独立の前後、ジャマイカではアメリカのラジオから流れるR&amp;Bが人気だった。それをまねしつつ、裏拍を強調したスカが、1960年代前半に流行した。The SkatalitesがStudio Oneで大量のスカを録音し、Don Drummondのトロンボーンが名声を得る。しかしDrummondは、1965年に恋人が刺殺体で発見され、1966年に有罪（心神喪失＝善悪を判断できない精神状態）とされた。そして1969年に精神病院で死去するという、悲惨な最期を迎えている。

スカはやがて、テンポを落としたロックステディへ移っていく。スカのテンポが踊りづらくなったことなど、複数の要因が重なったとされるが、その経緯については諸説ある。猛暑の夜に踊り続けるためにテンポを落とした、という説も一部で語られている。一方で、Studio Oneで若いドラマーがスカのテンポに追いつけなかったためという説がある。バンドリーダーのLynn Taittがレコーディング中にテンポを落とすよう提案した、という説もある。いずれにせよ、1966年前後にロックステディへの移行が起きた。さらに1968年前後に、リズムがより複雑になってレゲエが生まれた。レゲエという語を使った最初のジャマイカ録音は、The Maytalsの1968年「Do the Reggay」とされる。

制作の中心は、サウンドシステムという移動式の巨大な音響装置を持つ興行師たちだった。Clement Coxsone DoddのStudio One、Duke ReidのTreasure Isle、後にはLee Scratch PerryのBlack Ark、King Tubbyのミキシング工房が競い合った。米国のR&amp;Bの供給が減って、地元の新曲の需要が高まった。他所にない曲を独占したい競争もあった。こうした事情から、彼らは自ら録音を始め、それがレーベルへ発展した。同じ伴奏トラック(リディム)を複数の歌手に歌わせる方式が定着し、ヴァージョンやダブという考え方を生んだ。

思想の面では、ラスタファリ運動が決定的だった。多くの信者がエチオピア皇帝Haile Selassie Iを神の化身とみなす信仰と、アフリカへ帰ろうという思想が、レゲエの歌詞に広まった。

そこに登場するのが、Bob Marleyだ。彼はThe Wailersとして1963年に結成（初期の名称は別）し、1972年にIsland RecordsのChris Blackwellから前払い金（4,000ポンド）を受けてアルバム制作に入った。1973年の「Catch a Fire」では、ロック市場向けにギターとキーボードを重ねた仕上げを施され、世界的に広まった。

1976年、ジャマイカは政治抗争の真っただ中にあった。Marleyは自宅で銃撃されて負傷しながら、2日後のSmile Jamaicaコンサートに出演した。1978年のOne Love Peace Concertでは、敵対する二大政党の党首Michael ManleyとEdward Seagaの手を、舞台上で握らせた。Marleyは1981年に悪性黒色腫（皮膚がんの一種）のため、36歳で死去した。

その後、レゲエはダンスホールへ主流が移った。1985年の「Under Mi Sleng Teng」を転機とするデジタル化を経て、影響は広がっていく。イギリスではUKレゲエやラヴァーズロック（恋愛を甘く歌うレゲエ）が生まれた。さらにジャングルやドラムンベースの低音文化へとつながった。アメリカではヒップホップのサウンドシステム文化へと影響を広げた。</p>
