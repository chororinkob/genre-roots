<h1>Reggae（レゲエ）とは</h1>
<p>ジャマイカで生まれた、拍の裏側を強調するリズムを核とする音楽。最大の特徴はスキャンク(またはバン)と呼ばれるギターとピアノの奏法で、2拍目と4拍目の裏、つまり8分音符の偶数位置だけを短く切って鳴らす。この結果、表拍に置かれるはずの</p>
<p>ジャマイカで生まれた、拍の裏側を強調するリズムを核とする音楽。最大の特徴はスキャンク(またはバン)と呼ばれるギターとピアノの奏法で、2拍目と4拍目の裏、つまり8分音符の偶数位置だけを短く切って鳴らす。この結果、表拍に置かれるはずの重心が抜け落ち、音楽全体が後ろへ引っ張られるような独特の浮遊感が生まれる。テンポは60〜90BPMとゆったりしており、ロックステディよりさらに遅い。ベースは主役であり、低音域で歌うような旋律線を弾き、一小節の中で意図的に音を抜いて空白を作る。この空白がリズムの呼吸になる。ドラムはワン・ドロップと呼ばれるパターンが典型で、1拍目のバスドラムを鳴らさず3拍目にキックとリムショットを同時に落とす。他にロッカーズ(全拍にキック)、ステッパーズ(四つ打ち)といった型もある。オルガンは全ての8分音符を細かく刻むバブルという奏法で霧のような持続感を作る。管楽器のセクションが時折リフを差し込み、パーカッションではナイヤビンギ由来の手叩き太鼓が加わることもある。歌唱はメロディアスなものからトースティングと呼ばれる語りに近いものまで幅広い。歌詞はラスタファリ運動の信仰、バビロン(抑圧的な体制)への批判、貧困、大麻、愛と多岐にわたる。ミキシング卓でトラックを抜き差しし残響を加えるダブの手法も、レゲエから直接派生した。</p>
<h2>成り立ち</h2><p>1960年代後半のジャマイカ、キングストンの貧困地区で成立した。前史として、独立前後のジャマイカではアメリカのラジオから流れるR&amp;Bが人気で、それを模倣しつつ裏拍を強調したスカが1960年代前半に流行した。The SkatalitesがStudio Oneで大量のスカを録音し、Don Drummondのトロンボーンが名声を得たが、Drummondは1965年に恋人を刺殺して精神病院で死ぬという悲惨な最期を迎えている。1966年の記録的な猛暑でスカの速いテンポが踊りづらくなり、テンポを落としたロックステディへ移行、さらに1968年前後にリズムがより複雑化してレゲエが生まれた。名称の初出はThe Maytalsの1968年「Do the Reggay」とされる。制作の中心はサウンドシステムという移動式の巨大な音響装置を持つ興行師たちで、Clement Coxsone DoddのStudio One、Duke ReidのTreasure Isle、後にはLee Scratch PerryのBlack Ark、King Tubbyのミキシング工房が競合した。彼らは他所にない曲を独占するために自ら録音を始め、それがレーベルへ発展した。同じ伴奏トラック(リディム)を複数の歌手に歌わせる方式が定着し、ヴァージョンやダブという概念を生んだ。思想面ではラスタファリ運動が決定的で、エチオピア皇帝Haile Selassie Iを神の化身とみなす信仰と、アフリカ回帰の思想がレゲエの歌詞に浸透した。Bob MarleyはThe Wailersとして1963年から活動し、1972年にIsland RecordsのChris Blackwellと契約、1973年の「Catch a Fire」でロック市場向けにギターとキーボードを重ねた仕上げを施され、世界的に広まった。1976年にはジャマイカの政治抗争の渦中でMarleyが自宅で銃撃され負傷しながら2日後のSmile Jamaicaコンサートに出演、1978年のOne Love Peace Concertでは敵対する二大政党の党首Michael ManleyとEdward Seagaの手を舞台上で握らせた。Marleyは1981年に悪性黒色腫のため36歳で死去。その後レゲエはダンスホールへ主流が移り、Sly &amp; Robbieらのデジタル化を経て、イギリスではUKレゲエやラヴァーズロック、さらにジャングルやドラムンベースの低音文化へ、アメリカではヒップホップのサウンドシステム文化へと影響を広げた。</p>
