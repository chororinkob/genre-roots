<h1>Industrial（インダストリアル）とは</h1>
<p>工場や機械の騒音を音楽の素材として引き受け、聴き手を不快にさせることも表現の一部とみなす音楽。金属板、ドラム缶、鉄パイプ、電動工具といった非楽器を叩き、そこに自作の発振器やテープループ、フィードバックの唸り、短波ラジオの雑音を重ね</p>
<p>工場や機械の騒音を音楽の素材として引き受け、聴き手を不快にさせることも表現の一部とみなす音楽。金属板、ドラム缶、鉄パイプ、電動工具といった非楽器を叩き、そこに自作の発振器やテープループ、フィードバックの唸り、短波ラジオの雑音を重ねる。リズムは工場の反復動作を思わせる無機質な等間隔の打撃で、テンポは90〜130BPMだが、そもそも拍節を持たない持続音だけの曲も多い。声は歌わず、拡声器や歪ませたマイクを通した呻き、演説の引用、ニュース音声の切り貼りが使われる。和声や旋律はほとんど機能せず、代わりに周波数の帯域と音量の圧力で構成を作る。歌詞と主題は、全体主義、洗脳、収容所、連続殺人、性的な倒錯、身体の改造といった、社会が見ないふりをする領域に踏み込む。ジャケットや映像には医療写真や軍事記録が使われ、上演では血や肉、映像の投射を伴うことも多い。単なる音楽の様式ではなく、情報統制への抵抗と、聴き手の耐性を試す実践として構想された点が、他のどのジャンルとも異なる。</p>
<h2>成り立ち</h2><p>1976年、イギリスで生まれた。中心にいたのは、それまで前衛美術の集団COUM Transmissionsとして活動していたGenesis P-OrridgeとCosey Fanni Tuttiである。彼らは1976年10月、ロンドンの現代美術館で開いた展示「Prostitution」で、使用済みの生理用品や性風俗誌の切り抜きを展示し、国会で非難される騒動を起こした。その最終日に、演奏経験のないままChris CarterとPeter Christophersonを加えてThrobbing Gristleとして音を出したのが出発点である。彼らは同年に自主レーベルIndustrial Recordsを設立し、1977年に「The Second Annual Report」を発表した。レーベルの標語として仲間のMonte Cazazzaが考えた「industrial music for industrial people（工業的な人間のための工業的な音楽）」が、そのままジャンルの名前になった。同時期、シェフィールドではCabaret Voltaireがテープ操作と初期のシンセサイザーで実験を行い、オーストラリアのSPK、アメリカのBoyd RiceによるNONが同じ姿勢で活動する。1980年、西ベルリンではEinstürzende Neubautenが、工事現場から持ち出した金属板やコンクリート・ドリルを楽器として使い、破壊行為と演奏の境界を消した。イギリスのTest Deptは炭鉱労働者のストライキを支援し、金属打撃の演奏を労働運動と直接結び付けた。背景には、1970年代末の英独の脱工業化、失業、都市の荒廃、そして情報とメディアによる統制への強い不信がある。Throbbing Gristleは1981年に使命は終わったと宣言して解散し、P-OrridgeはPsychic TVを、CarterとTuttiはChris &amp; Coseyを始めた。1980年代半ば以降、この語はより広い意味で使われるようになる。シカゴのレーベルWax Trax!を拠点にMinistryやFront 242がダンス音楽と結び付いたインダストリアル・ダンスを作り、1989年のNine Inch Nailsの登場で、アメリカでは巨大な市場を持つロックの一形態へ変質した。原理主義的な初期の実践者たちはこの商業化を裏切りとみなしたが、非楽器を鳴らし不快を引き受けるという発想自体は、ノイズ、パワーエレクトロニクス、後年のハードコア・テクノにまで受け継がれている。</p>
<h2>代表曲</h2><ul><li>Discipline (Throbbing Gristle)</li><li>Head Like a Hole (Nine Inch Nails)</li><li>Stigmata (Ministry)</li></ul>
