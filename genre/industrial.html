<h1>Industrial（インダストリアル）とは</h1>
<p>工場や機械の騒音を音楽の素材として引き受け、聴き手を不快にさせることも表現の一部とみなす音楽。やり方はアーティストによって違い、金属板、ドラム缶、鉄パイプ、電動工具といった非楽器を叩く人もいれば、自作の発振器（電子音を作る装置）や</p>
<p>工場や機械の騒音を音楽の素材として引き受け、聴き手を不快にさせることも表現の一部とみなす音楽。やり方はアーティストによって違い、金属板、ドラム缶、鉄パイプ、電動工具といった非楽器を叩く人もいれば、自作の発振器（電子音を作る装置）やテープループ（テープをつなげて繰り返し再生する手法）を使い、フィードバック（音が回り込んで鳴る）の唸りを重ねる人もいる。リズムは、工場の反復動作を思わせる無機質な等間隔の打撃になることが多い。テンポは作品によってまちまちで、そもそも拍節（拍の区切り）を持たない持続音だけの曲も多い。初期には歌わない声、または加工した声が多く、拡声器や歪ませたマイクを通した呻き、演説の引用、ニュース音声の切り貼りが使われる。和声や旋律が目立たない作品が多く、代わりに周波数の帯域と音量の圧力で構成を作る。歌詞と主題は、全体主義、洗脳、収容所、連続殺人、性的な倒錯といった、社会が見ないふりをする領域に踏み込み、アーティストによっては身体の改造も扱う。ジャケットや映像には、アーティストによって医療写真や軍事記録が使われ、上演では血や肉、映像の投射を伴うことも多い。単なる音楽の様式ではなく、情報統制への批評という立場を強く打ち出し、聴き手の耐性を試す試みとして構想された点が特徴である。</p>
<h2>成り立ち</h2><p>ジャンルの起源は1970年代中盤〜後半（資料により前半〜中盤とする）、英国・米国・ドイツにまたがる。Industrial Recordsは1976年設立で、最初のLPは1977年である。中心にいたのは、それまで前衛美術の集団COUM Transmissionsとして活動していたGenesis P-OrridgeとCosey Fanni Tuttiである。彼らは1976年10月、ロンドンのInstitute of Contemporary Arts（ICA、芸術文化センター）で開いた展示「Prostitution」で、使用済みの生理用品や性風俗誌の切り抜きを展示し、国会で非難される騒動を起こした。Throbbing Gristleは、1975年に、COUM Transmissionsの中心だったGenesis P-OrridgeとCosey Fanni Tuttiに、Chris CarterとPeter Christophersonが加わって結成された（Peter Christophersonは1974年3月の公演「Couming of Age」のあとにCOUMへ声をかけてきて、Chris Carterは1975年夏に共通の友人John Laceyの紹介で知り合った。結成は1975年9月3日。スタジオ「The Death Factory」で共に演奏を始めていた）。「Prostitution」展は、COUM最後の活動であり、Throbbing Gristleの公式デビューとなった。それより前に、1976年7月6日にロンドンのAir Galleryで、8月21日にWinchester Hat Fairで、人前で演奏している。彼らは同年に自主レーベルIndustrial Recordsを設立し、1977年に「The Second Annual Report」を発表した。レーベルの標語として仲間のMonte Cazazzaが考えたとされる「industrial music for industrial people（工業的な人間のための工業的な音楽）」が、ジャンル名の由来になった。同時期、シェフィールドではCabaret Voltaireがテープ操作と初期のシンセサイザーで実験を行い、オーストラリアのSPK、アメリカのBoyd RiceによるNONが同じ姿勢で活動する。1980年、西ベルリンでEinstürzende Neubautenが結成された。スクラップ金属や建設用の工具を自分たちで楽器に仕立て、1983〜84年には電動工具で会場の壁や床を壊す公演で悪名が広まった。イギリスのTest Deptは、1981年にロンドンのニュー・クロスで結成され、1984〜85年の炭鉱労働者のストライキを支援し、金属打撃の演奏を労働運動と直接結び付けた。背景には、1970年代末の英独の脱工業化、失業、都市の荒廃、そして情報とメディアによる統制への強い不信がある。Throbbing Gristleは1981年に使命は終わったと宣言して解散し、P-OrridgeはPsychic TVを、CarterとTuttiはChris &amp; Coseyを始めた。1980年代半ば以降、この語はより広い意味で使われるようになる。シカゴのレーベルWax Trax!は、Ministryをかかえ、ベルギーのFront 242らの作品も北米で発売して、ダンス音楽と結び付いたインダストリアル・ダンスを広め、1989年にデビューしたNine Inch Nailsは、1990年代前半に商業的に拡大した。この商業化には賛否があったが、非楽器を鳴らし不快を引き受けるという発想自体は、ノイズ、パワーエレクトロニクス、後年のハードコア・テクノにまで受け継がれている。</p>
