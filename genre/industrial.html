<h1>Industrial（インダストリアル）とは</h1>
<p>インダストリアルは、工場や機械の騒音を音楽の素材として受け入れ、聴き手を不快にさせることも表現の一部とみなす音楽だ。 音の素材はアーティストによって違う。非楽器を打つ人もいれば、自作の電子機器やテープ操作を使う人もいる。 リズムが</p>
<p>インダストリアルは、工場や機械の騒音を音楽の素材として受け入れ、聴き手を不快にさせることも表現の一部とみなす音楽だ。

音の素材はアーティストによって違う。非楽器を打つ人もいれば、自作の電子機器やテープ操作を使う人もいる。

リズムが目立たない作品が多い。テンポ・拍節（拍の区切り）はまちまちで、そもそも拍節を持たない、音を伸ばし続けるだけの曲も多い。

初期には、歌わない声や加工した声が多い。拡声器や歪ませたマイクを通したうめき声、演説の引用、ニュース音声の切り貼りが使われる。旋律も目立たない作品が多く、代わりに周波数の帯域と音量の圧力で曲を組み立てる。

歌詞と主題は、全体主義、洗脳、収容所、連続殺人、性的な倒錯といった、社会が見ないふりをする領域に踏み込む。身体の改造や、医療写真・軍事記録のジャケットは、一部の作家の例にとどまる。上演では血や肉、映像の投射を伴うことも多い。

単なる音楽のスタイルではない。情報統制への批評という立場を強く打ち出し、聴き手の耐性を試す試みとして構想された点が特徴である。</p>
<h2>成り立ち</h2><p>舞台は、イギリス、アメリカ、ドイツにまたがる。ジャンルの起源は、1970年代前半から中盤にある。Industrial Recordsは1976年に設立され、最初のLPは1977年に出た。

中心にいたのは、前衛美術の集団COUM Transmissionsとして活動していたGenesis P-OrridgeとCosey Fanni Tuttiである。彼らは1976年10月、ロンドンのInstitute of Contemporary Arts（ICA、芸術文化センター）で展示「Prostitution」を開いた。使用済みの生理用品や性風俗誌の切り抜きを展示し、国会で非難される騒動を起こした。

Throbbing Gristleは、1975年に結成された。COUM Transmissionsの中心だったGenesis P-OrridgeとCosey Fanni Tuttiに、Chris CarterとPeter Christophersonが加わった（Carterは1975年夏に、共通の友人John Lacey経由でCOUMに紹介された。Christophersonは1974年3月の「Couming of Age」の後に接触してきた。スタジオ「The Death Factory」で共に演奏を始めていた）。

「Prostitution」展は、COUM最後の活動であり、Throbbing Gristleの公式デビューとなった。初演奏は1976年7月6日のAir Gallery、続いて同年8月21日にWinchester Hat Fairである。彼らは同年に自主レーベルIndustrial Recordsを設立し、1977年に「The Second Annual Report」を発表した。仲間のMonte Cazazza発案とされるレーベルの標語「industrial music for industrial people（工業的な人間のための工業的な音楽）」が、ジャンル名の由来になった。

同じ時期、シェフィールドではCabaret Voltaireがテープ操作と初期のシンセサイザーで実験を行った。オーストラリアのSPK、アメリカのBoyd RiceによるNONも同じ姿勢で活動した。1980年、西ベルリンではEinstürzende Neubautenが結成した。スクラップ金属や建設工具を自作楽器にし、1983〜84年には電動工具で会場の壁や床を壊す公演で悪名を得た。イギリスのTest Dept（1981年結成）は1984〜85年の炭鉱労働者のストライキを支援し、金属打撃の演奏を労働運動と直接結び付けた。

背景には、1970年代末の英独の脱工業化、失業、都市の荒廃、そして情報とメディアによる統制への強い不信があったと見られる。

Throbbing Gristleは1981年に使命は終わったと宣言して解散した。P-OrridgeはPsychic TVを、CarterとTuttiはChris &amp; Coseyを始めた。

1980年代半ば以降、この語はより広い意味で使われるようになる。シカゴのWax Trax!がMinistryを擁し、ベルギーのFront 242らも北米で発売した。これらがダンス音楽と結び付いたインダストリアル・ダンスを作り、1989年にデビューしたNine Inch Nailsは、1990年代前半に商業的に拡大した。商業化には賛否があったが、非楽器を鳴らし不快を引き受けるという発想自体は、ノイズ、パワーエレクトロニクス、後年のハードコア・テクノにまで受け継がれている。</p>
