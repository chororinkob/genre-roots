<h1>Hardcore Punk（ハードコアパンク）とは</h1>
<p>パンクロックを極限まで速く、短く、そして攻撃的にした音楽である。テンポは概ね180から250 BPMで、曲の長さは45秒から2分程度、一枚に20曲以上が収められることも珍しくない。演奏の基本は、ギターが指板を押さえた和音を、手首を</p>
<p>パンクロックを極限まで速く、短く、そして攻撃的にした音楽である。テンポは概ね180から250 BPMで、曲の長さは45秒から2分程度、一枚に20曲以上が収められることも珍しくない。演奏の基本は、ギターが指板を押さえた和音を、手首を下向きに振り下ろす動きだけで刻み続けるという奏法であり、上へ戻す動きを使わないため、一定の緊張と重さが保たれる。旋律らしい旋律は存在せず、間奏のギター独奏も原則として置かれない。技巧の誇示はこの分野において明確に忌避される価値である。ドラムはスネアを裏拍で連打する走る刻みと、二拍を強く踏む型を往復し、その切り替わりが曲の唯一の展開となることも多い。低音はギターと同じ音型を重ねて厚みを出す。歌唱は歌わず、怒鳴る。そこへ構成員全員が声を揃える短い掛け声が加えられ、聴き手が一緒に叫べるよう設計されている。歌詞は政治、警察、宗教、戦争、消費社会、そして郊外の生活の退屈と疎外を、比喩を排した直截な言葉で述べる。録音は磨かれず、演奏の粗さがそのまま残される。演奏の場も小さく、演者と聴き手の距離がないことが前提とされる。</p>
<h2>成り立ち</h2><p>1977年前後のパンクは、イギリスにおいては数年で商業化し、アメリカにおいてはニューヨークの芸術的な文脈と結びついていた。これに対して、1978年以降、アメリカの郊外に住む10代の若者たちが、より単純で速く怒れる形を作り上げた。彼らの多くは中産階級の白人の少年であり、退屈な郊外と、抑圧的な学校と、権威への反発が動機だった。カリフォルニアではGreg Ginnが率いるBlack Flagが中心となる。彼は自らSST Recordsを設立し、全米を車で巡業して、各都市に演奏の場と聴き手を作り出した。この地道な巡業が、後のアメリカの独立系音楽の流通網そのものを作ったという点で、彼らの功績は音楽以上に大きい。歌手は次々に交代し、四人目のHenry Rollinsの時代に最も広く知られた。ワシントンD.C.では二つの重要な集団が現れる。ひとつはBad Brainsで、彼らは黒人によるバンドであり、しかも元はジャズ寄りの演奏者だった。その演奏技術に裏打ちされた圧倒的な速度は、当時の誰よりも先を行っていた。もうひとつがIan MacKaye率いるMinor Threatで、彼が1981年に書いた一分に満たない楽曲は、酒も薬物も無秩序な性交渉も拒むという宣言であり、意図せずして世界的な運動の名称となった。彼が設立したDischord Recordsは、価格を低く抑え、地元のバンドのみを扱うという原則を貫き、独立系音楽の倫理的な基準を作った。この分野には深刻な問題も存在した。演奏の場での暴力が常態化し、女性や有色人種が排除されがちで、また一部には極右思想を持つ者も入り込んだ。実際、1980年代半ばには内部からの批判によって、暴力への依存を見直す動きが起こる。この反省が、より繊細で実験的なポストハードコアを生んだ。</p>
