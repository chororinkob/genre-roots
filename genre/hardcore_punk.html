<h1>Hardcore Punk（ハードコアパンク）とは</h1>
<p>ハードコア・パンクは、パンクロックを極限まで速く、短く、そして攻撃的にした音楽である。 テンポは非常に速い。Pearson (2019) の研究では300〜400 BPM（一部は400超）とされる例もある（数え方で倍や半分になる）</p>
<p>ハードコア・パンクは、パンクロックを極限まで速く、短く、そして攻撃的にした音楽である。

テンポは非常に速い。Pearson (2019) の研究では300〜400 BPM（一部は400超）とされる例もある（数え方で倍や半分になる）。曲の長さは1分前後の曲が多く、2分以内が典型だが、それを超える曲も珍しくない。極端に短い曲もある。

演奏の基本は、ギターが高速のパワーコード（低い2音を重ねた力強い和音）を強い歪みで鳴らす「buzzsaw」的な音である。旋律より律動が重視される。ギターには、オクターブのリードや、フィードバック（アンプの音をギターが拾って鳴り続けるノイズ）等を用いる例もある。技巧の誇示やソロの多用は、商業ロックの過剰さとして避けられる傾向があった。

ドラムは高速で攻撃的に叩かれる。ハイハットやシンバルで8分音符を刻むことが多い。D-beat（速いドラムの型）などの型がある。低音は、長く伸ばす音から速い8分・16分音符の連続まで、さまざまなリズムで弾かれる。

歌唱は、怒鳴る、叫ぶ、唱える形が多い。他のメンバーの叫び声が入ることがある。ライブでは、聴衆が一緒に叫ぶのが特徴である。

歌詞は、政治への幻滅、戦争（反軍国主義）、消費社会、権威への反発を扱うことが多い。郊外の生活への不満も歌われる。

録音は、自主制作で粗いものが多いが、例外もある。演奏の場は、小規模なDIY会場や全年齢ライブが中心である。</p>
<h2>成り立ち</h2><p>パンクの商業化とニューウェーブの芸術志向への反発として、1978年以降、アメリカの郊外に住む10代の若者たちが、より単純で速く怒れる形を作り上げた。

ただし、Konstantin Butzは、起源は一つの時期・場所に特定できないとする。候補には、サンフランシスコ、南カリフォルニア、バンクーバーなどがある。D.O.A.『Hardcore '81』が名称の由来とする説は、Steven Blushの見解である。彼らは怒れる中産階級の10代（多くは白人男性）であり、退屈な郊外と、抑圧的な学校と、権威への反発が動機だった。

カリフォルニアでは、Greg Ginnが率いるBlack Flagが中心となる。彼は自らSST Recordsを設立し、全米を車で巡業して、各都市に演奏の場と聴き手を作り出した。Black Flagの巡業は、1980年代の独立系音楽の巡業網の礎のひとつとなった。歌手は次々に交代し、4人目のHenry Rollinsの時代に最も広く知られた。

ワシントンD.C.では、二つの重要な集団が現れる。ひとつはBad Brainsだ。彼らは黒人によるバンドであり、しかも元はジャズ寄りの演奏者だった。その演奏技術に裏打ちされた圧倒的な速度は、当時のロックの中でも最速級のテンポを持つ。パンクを速くした最初期のバンドの一つだった。

もうひとつが、Ian MacKaye率いるMinor Threatだ。彼が書いた「Straight Edge」は、1981年初頭に録音したデモにすでに入っていた。録音は2月とされる。同年6月発売のEPでは46秒の曲だった。歌詞が拒むのは主に薬物(コカイン、スピード、マリファナ、接着剤の吸引、クアルード)である。「don't smoke / don't drink / don't fuck」は別の曲「Out of Step」の歌詞であり、MacKayeは、あの曲で運動を始めるつもりはなかったと述べている。運動としてのstraight edgeは、酒・タバコ・娯楽目的の薬物を避ける生き方と説明される。一部の人は、不特定の性関係も避ける。

彼がJeff Nelson(およびTeen Idlesの仲間)と1980年に設立したDischord Recordsは、価格を低く抑え、DCのシーンのバンドのみを扱う方針を貫いた。独立系音楽の倫理的な基準を作った。

だが、この分野には深刻な問題も存在した。演奏の場では暴力的な衝突が問題化した。初期は主に若い白人男性が中心で、また一部には極右思想を持つ者も入り込んだ。実際、1980年代半ばには内部からの批判によって、暴力への依存を見直す動きが起こる。DCのRevolution Summerなどの動きは、ポストハードコアの発展に寄与した。</p>
