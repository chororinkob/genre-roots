<h1>Lovers Rock（ラバーズロック）とは</h1>
<p>ラヴァーズ・ロックは、1970年代のイギリスで生まれた、恋愛を主題とする甘く柔らかいレゲエである。 低音は太く丸く、メロディーのように歩き回る。ギターは裏拍で短く和音を刻む。ただし歪みは少ないことが多く、むしろ柔らかい音色が選ばれ</p>
<p>ラヴァーズ・ロックは、1970年代のイギリスで生まれた、恋愛を主題とする甘く柔らかいレゲエである。

低音は太く丸く、メロディーのように歩き回る。ギターは裏拍で短く和音を刻む。ただし歪みは少ないことが多く、むしろ柔らかい音色が選ばれる。

さらに、電気ピアノや弦楽合奏をまねた鍵盤の和音が、厚く重ねられることが多い。レゲエとしては珍しいほど甘いこの音の層は、アメリカのフィラデルフィアやシカゴ、モータウンなどのソウルからの影響を示している。

リズムはレゲエの基本の型を使う。1拍目を鳴らさず、3拍目に大太鼓を落とす形だ。ただしテンポは遅く、全体の音量も抑えられていることが多い。

何より大切なのは歌い方だ。10代から20代前半の若い女性の歌い手が目立つ(男性歌手や男性グループも活躍した)。その歌は高い音域で、力まず、囁くように、あるいは伸びやかに歌われる。上手さを見せるよりも、聴き手のすぐ隣で歌っているような親しみが大切にされる。

歌詞の中心は、恋の始まり、待つ気持ち、裏切り、そして別れといった、ごく私的な感情だ。同じ時代のルーツ・レゲエは、政治と宗教を正面から扱った。それに対してこちらは、意識して個人の心情を中心に歌った。ここが大きな違いである(ただしBrown Sugarのように、ルーツ寄りの主題を含む作品もある)。</p>
<h2>成り立ち</h2><p>1970年代のロンドンには、カリブ海の国々から移り住んだ人々とその子どもたちによる、大きな共同体があった。子どもたちはイギリス生まれなのに、白人社会からは外国人として扱われた。警察の職務質問や差別も、日常的に受けていた。

彼らの社交の場になったのが、自宅を開放して開く集まりだ。公共の場所から締め出された若者たちが、家の居間に音響装置を持ち込み、明け方まで踊った。この音楽は、そうした場で愛され、その文化と結びついて育った。大切なのは、こうした集まりが、人種差別的なクラブ文化から逃れられる安全な居場所だったという点である。

ジャマイカ本国のレゲエは男性中心で、政治的な主張と宗教的な世界観に傾いていた。一方、イギリスの少女たちが求めたのは、自分たちの恋愛の感情を歌う音楽だった。

1974年前後には、最初期の一つとして、Ginger Williamsの「I Can't Resist Your Tenderness」が出ていた。翌1975年、当時15歳だったLouisa Markが歌った楽曲が、それを上回る反響を呼んだ。これで、この方向が定着していく。

呼び名そのものは、Lover's Rockというレーベルの名から来ている。Dennis HarrisがJohn KpiayeやDennis Bovellとともに設立したレーベルだ。この名はAugustus Pabloの曲名から採られたとされ、そこからスタイルの名として広まった。

決定的な一曲は、1979年にJanet Kayが歌った楽曲である。Dennis Bovellが手掛けたこの曲は、サビの終わりで高音に跳ね上がる旋律で知られ、全英チャートの二位に達した。これは当時、黒人のイギリス人女性としては最高の順位だった。

もっとも、Brown Sugarは1977年の初作で、Janet Kayより先に登場していた。Brown Sugarには、のちにSoul II Soulで活躍するCaron Wheelerが在籍していた。Carroll Thompsonは、1981年に初のヒットを出した。

それでもこの音楽は長い間、レゲエの歴史でもイギリスの音楽史でも、あまり重く見られてこなかった。恋愛を歌う女性の音楽であることが、真面目に扱われない理由だったという見方がある。しかしその影響は広く、The PoliceやCulture Club、Sadeといったポップスのバンドや歌い手にも及んだとされる。

2020年には、映画監督のSteve McQueenが、当時の集まりの一夜だけを描いた作品を発表した。この作品は、この文化の再評価の機運を高めたとされる。</p>
