<h1>Lovers Rock（ラバーズロック）とは</h1>
<p>1970年代のイギリスで生まれた、恋愛を主題とする甘く柔らかいレゲエである。リズムはレゲエの基本である、一拍目を鳴らさず三拍目に大太鼓を落とす型を用いるが、テンポは概ね70から85 BPMと遅く、全体の音量も抑えられている。低音は</p>
<p>1970年代のイギリスで生まれた、恋愛を主題とする甘く柔らかいレゲエである。リズムはレゲエの基本である、一拍目を鳴らさず三拍目に大太鼓を落とす型を用いるが、テンポは概ね70から85 BPMと遅く、全体の音量も抑えられている。低音は太く丸く、旋律的に歩き回り、この音楽の情感の大半を担う。ギターは裏拍に短く和音を刻むが、歪みは一切なく、むしろ柔らかい音色が選ばれる。加えて、電気ピアノや弦楽合奏を模した鍵盤の和音が厚く敷かれ、この、レゲエとしては異例に甘い音の層が、アメリカのフィラデルフィア周辺で発達したソウルからの影響を示している。決定的に重要なのは歌唱で、担い手のほとんどが10代から20代前半の女性であり、高い音域で、力まず、囁くように、あるいは伸びやかに歌われる。技巧よりも、聴き手のすぐ隣で歌っているような親密さが重んじられる。歌詞は恋の始まり、待つ気持ち、裏切り、そして別れといった、極めて私的な感情に絞られる。同時代のルーツ・レゲエが政治と宗教を正面から扱ったのに対し、こちらは意識的に個人の心情のみを歌った点が、最大の違いである。</p>
<h2>成り立ち</h2><p>1970年代のロンドンには、カリブ海諸国から移住した人々とその子どもたちによる大きな共同体があった。彼らはイギリス生まれでありながら、白人社会からは外国人として扱われ、警察による職務質問や差別に日常的に晒されていた。彼らの社交の場となったのが、自宅を開放して行われる集まりである。公共の場所から締め出された若者たちが、家の居間に音響装置を持ち込み、明け方まで踊るというこの文化の中で、この音楽は生まれた。重要なのは、この場が特に若い黒人女性にとって、数少ない安全な居場所だったという点である。ジャマイカ本国のレゲエが男性中心で、政治的な主張と宗教的な世界観に傾いていたのに対し、イギリスの少女たちが求めたのは、自分たちの恋愛の感情を歌う音楽だった。1975年、当時15歳だったLouisa Markが歌った楽曲が地元で大きな反響を呼び、この方向が確立する。呼称そのものは、Dennis Bovellらが設立したレーベルの名に由来し、そこから様式の名として広まった。決定的な一曲は1979年、Janet Kayが歌った楽曲である。Dennis Bovellが手掛けたこの曲は、歌の終盤で極端に高い音へ跳ね上がる旋律で知られ、全英チャートの二位に達した。黒人女性が歌うレゲエが主流の順位表の上位に入ることは、当時としては画期的だった。Carroll ThompsonやBrown Sugarが続き、後者にはSoul II Soulで活躍することになるCaron Wheelerが在籍していた。この音楽は長らく、レゲエの歴史においてもイギリスの音楽史においても軽んじられてきた。恋愛を歌う女性の音楽であることが、真面目に扱われない理由とされたのである。しかしその影響は広く、Sadeの静かな歌唱や、1980年代末のイギリスのソウルに直接受け継がれた。2020年には映画監督Steve McQueenが、当時の集まりの一夜だけを描いた作品を発表し、この文化への正当な評価をもたらしている。</p>
<h2>代表曲</h2><ul><li>Silly Games (Janet Kay)</li><li>I'm So Sorry (Carroll Thompson)</li><li>Wild World (Maxi Priest)</li></ul>
