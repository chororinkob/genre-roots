<h1>Mahraganat（マフラガナート）とは</h1>
<p>マハラガナートは、エジプトの下町から生まれた、電子的で騒々しい大衆音楽だ。名前は、アラビア語で祭りを意味する語の複数形である。 制作は、安価・中古の機材と、海賊版や無料のソフトで行われる。その粗さが、そのままこの音楽のスタイルにな</p>
<p>マハラガナートは、エジプトの下町から生まれた、電子的で騒々しい大衆音楽だ。名前は、アラビア語で祭りを意味する語の複数形である。

制作は、安価・中古の機材と、海賊版や無料のソフトで行われる。その粗さが、そのままこの音楽のスタイルになっている。

旋律には、アラブ的な旋法（マカーム）の影響を受けたものが使われることが多い。それを、シンセや加工した管楽器の音で演奏する。

土台は、エジプトやアラブ世界の伝統的な打楽器のリズムだ。とりわけマクスームなどの型を、打ち込み（機械に演奏を入力して鳴らす方法）で再現する。そこに、シンセを中心にした電子的な音が重なる。テンポは速く、体が跳ねるような速さに置かれる。

声の処理も大きな特徴だ。オートチューン（声の音程を自動で補正する装置）を極端な設定でかけ、わざと不自然に震わせる。歌い方は、歌とラップと叫びの中間だ。複数人が代わる代わる、短い句を投げ合う。

歌詞は、口語のエジプト方言で歌われる。貧困、失業、麻薬、結婚の費用、当局への皮肉、友情、そして下品な冗談が、容赦なく並ぶ。

演奏の場は、結婚式と街頭の祭りだ。巨大なスピーカーを路上に積み上げ、深夜まで踊り続ける。</p>
<h2>成り立ち</h2><p>この音楽は、2000年代半ばから2010年頃に生まれた。2006〜07年とする見方が最も有力で、Sadat本人は2007年から作っていると語っている。

舞台は、カイロ周辺の非公式住宅地区や、カイロ北東部の公営住宅団地アッサラーム市といった、密集した貧困地域である。アッサラーム市は1981年にカイロ県が着手した団地で、1992年の地震後は被災世帯の主要な受け入れ先になった。軍が建設したとする報道もある。

この地域では、結婚式が街路を封鎖して行われ、DJが機材を持ち込んで夜通し音楽をかける習わしがあった。ここで、初期の担い手として挙げられるSadatとAlaa Fifty Cent、そしてFigo、Amr Hahaといった若者が、既存のシャアビと呼ばれる大衆歌謡に、パソコンで作った歪んだ電子音を混ぜ始めた。電子鍵盤奏者のIslam Chipsyも並べて語られるが、本人はマハラガナートとの関連を避けている。彼らは音楽の教育を受けておらず、海賊版ソフトと安価・中古の機材で制作していた。

転機は2011年である。エジプト革命によってムバラク政権が倒れると、街頭は若者のものになった。この音楽は革命前から存在したが、2011年に露出が拡大した。ただし、担い手自身は『革命の産物』という見方に反発している。

政治を直接扱う曲もある。2013年の時点では、はっきり政治的な曲は少数だと伝えられた。一方で、政権をあからさまに皮肉っているという見方もある。それでも、これまで表に出ることのなかった階層の声が、初めて全国に聞こえるようになったこと自体が政治的だった。

YouTubeでは2009〜10年頃から広まり、2011年以降に露出が拡大した。そして、2013年のエジプト・フランス製作の映画『Electro Chaabi』（Hind Meddeb監督）が、この音楽を国際的に紹介する役割を果たした。2019年末に公開されたHassan ShakoushとOmar Kamalの『Bent El Geran』は、2020年6月時点でYouTube再生3.4億回を超えた。2020年には、Anghamiの年間1位、Deezer MENAでは2位になった。

しかし2020年2月、エジプト音楽家組合の会長は、歌詞が下品で不道徳だとする決定を出した。マハラガナートの歌手が、フェスティバル、クラブ、カフェ、ナイル・クルーズ、観光施設などに出演することを禁じたのだ。これは正式な禁止決定であり、多くの歌手が活動の場を失った。約1か月後には、許可証制度で一部緩和された。

その後も規制と解除が繰り返され、当局との緊張は続いている。それでも結婚式と街路での需要は消えなかった。2021年の時点でも、禁止の中で多くの人に聴かれている歌手がいるとされた。</p>
