<h1>Mahraganat（マフラガナート）とは</h1>
<p>エジプトの下町から生まれた、電子的で騒々しい大衆音楽。名称はアラビア語で祭りを意味する語の複数形である。制作は安価なパソコンと海賊版のソフトだけで行われ、その粗さがそのまま様式になっている。土台はエジプトやアラブ世界の伝統的な打楽</p>
<p>エジプトの下町から生まれた、電子的で騒々しい大衆音楽。名称はアラビア語で祭りを意味する語の複数形である。制作は安価なパソコンと海賊版のソフトだけで行われ、その粗さがそのまま様式になっている。土台はエジプトやアラブ世界の伝統的な打楽器のリズムで、とりわけマクスームやサイーディーと呼ばれる型を打ち込みで再現し、そこに極端に歪ませたシンセベースと、割れたキックが重なる。テンポは毎分120から140拍程度で、体を跳ねさせる速度に置かれる。旋律にはアラブ音楽特有の四分音を含む旋法が用いられ、シンセや加工した管楽器の音で演奏される。声の処理が最大の特徴で、オートチューンを極端な設定でかけ、意図的に不自然に震わせ、さらに音量を限界まで上げて歪ませる。歌唱は歌とラップと叫びの中間で、複数人が代わる代わる短い句を投げ合う。歌詞は口語のエジプト方言で、貧困、失業、麻薬、結婚の費用、当局への皮肉、友情、そして下品な冗談が容赦なく並ぶ。演奏の場は結婚式と街頭の祭りで、巨大なスピーカーを路上に積み上げ、深夜まで踊り続ける。</p>
<h2>成り立ち</h2><p>生まれたのは2007年から2010年頃、カイロ周辺の非公式住宅地区、とりわけ都心の南に広がるダール・エッサラームやサラーム地区といった、行政の手が届かない密集した貧困地域である。当地では結婚式が街路を封鎖して行われ、DJが機材を持ち込んで夜通し音楽をかける慣習があった。ここでSadatとAlaa Fifty Cent、そしてFigo、Amr Haha、Islam Chipsyといった若者が、既存のシャアビと呼ばれる大衆歌謡に、パソコンで作った歪んだ電子音を混ぜ始めた。彼らは音楽の教育を受けておらず、機材も違法に入手した安価なものだった。決定的な瞬間は2011年である。エジプト革命によってムバラク政権が倒れると、街頭は若者のものになり、この音楽はデモと祝祭の双方で鳴り響いた。政治的な主張を直接掲げたわけではないが、これまで表に出ることのなかった階層の声が、初めて全国に聞こえるようになったこと自体が政治的だった。2012年頃からYouTubeで再生数が爆発し、2013年のドイツの映画『Electro Chaabi』が国際的な紹介の役割を果たした。2019年、Hassan ShakoushとOmar Kamalの『Bent El Geran』が世界的に数億回再生され、この年のエジプトで最も聴かれた曲となった。しかし2020年二月、エジプト音楽家組合の会長は、歌詞が下品で公序良俗に反するとして、組合員でない歌手の公演と録音を全面的に禁止すると宣言した。事実上の禁止令であり、多くの歌手が活動の場を失った。以後も規制と解除が繰り返され、当局との緊張は続いている。それでも結婚式と街路での需要は消えず、この音楽はエジプト最大の若者文化であり続けている。</p>
