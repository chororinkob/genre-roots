<h1>Groove Metal（グルーブメタル）とは</h1>
<p>スラッシュメタルの速さを意図的に捨て、中間の速度で身体が揺れることを最優先に設計されたヘヴィメタルである。核となるのはリフの組み立て方で、音を鳴らし続けるのではなく、短く切った和音と、あえて何も鳴らさない空白を交互に配置する。この</p>
<p>スラッシュメタルの速さを意図的に捨て、中間の速度で身体が揺れることを最優先に設計されたヘヴィメタルである。核となるのはリフの組み立て方で、音を鳴らし続けるのではなく、短く切った和音と、あえて何も鳴らさない空白を交互に配置する。この空白があることで、リフは跳ねるような弾力を持ち、首を縦に振る動作と正確に噛み合う。拍の頭を外して食い込ませるシンコペーション（拍の位置をずらす乗り）が多用され、聴き手は次の打点を予測しようとして裏切られ続けることになる。テンポはスラッシュメタルより遅く抑えられる代わりに、一発ごとの重量が増している。ギターは下げた調弦（弦の音合わせ）を用い、Dimebag Darrellらが多用したハーモニクス奏法（スクィール）が使われる。ドラムはバスドラムの二つ打ちを使いながらも音数を絞り、スネアは拍の要所に強く落として輪郭を作る。ヴォーカルは旋律を歌うのではなく、喉を潰した怒鳴り声で言葉を叩きつける形式が多く、歌詞は怒り、裏切り、依存、自己嫌悪といった、内側から噴き出す感情を扱う。5分前後の曲が多い。速さで圧倒するスラッシュメタルとは対照的に、重さと間で殴るという発想の音楽である。</p>
<h2>成り立ち</h2><p>1980年代末〜90年代初頭にExhorder、Prongらが先駆となり、Bad Brainsの1987年以降の作品（Quickness, 1989）を先駆と見る論者もいる。1990年代初頭には、テキサス州アーリントンのPanteraが様式を確立・普及させた代表格と評される。彼らは1980年代半ばにかけて、化粧をした華美なバンドとして複数の自主制作盤を出していたが、1986年にPhil Anselmoが加入し、1988年のPower Metalで重い方向へ移行、1990年の作品カウボーイズ・フロム・ヘルでグラム路線を完全に捨てた。ギターのDarrell Abbottは、ダイムバッグ・ダレルの名で知られ、ハーモニクス（スクィール）を多用した奏法を看板とし、兄のVinnie Paulが叩く、ダブルベースを使いながら音数を絞った重いドラムと組み合わせて独自の弾みを作った。1992年のヴァルガー・ディスプレイ・オブ・パワーはこの様式を完成させた作品のひとつと評され、1994年のファー・ビヨンド・ドリヴンは極端に重い内容ながら全米初登場1位を記録した。しばしば「1位を獲得した最も過激な作品」と評される。なおニューオーリンズのExhorderが先行していたとする見方があるが、当事者を含め評価は分かれる。両者の初アルバムはいずれも1990年である。並行してブラジルのSepulturaが、1993年の作品ケイオスA.D.で速度を落とした重い刻みへ舵を切り、1996年のルーツでは先住民のシャヴァンテ族と現地で共演し、部族の打楽器とヘヴィメタルを直接結びつけるという試みを行った。カリフォルニア州オークランドのMachine Headは1994年の『Burn My Eyes』で、Bay Area系のスラッシュとPantera流のグルーヴ・メタルを橋渡ししたと評される。しかし歴史は悲劇によって断ち切られる。Panteraは長引く不和によって2003年に解散し、2004年12月8日、Darrell Abbottはオハイオ州コロンバスのクラブでDamageplanの演奏中に観客の一人に銃撃されて死亡した。この事件では、警備責任者らを含む計4人が殺害された。兄のVinnie Paulも2018年に死去した。2022年7月にAnselmoとRex Brownが再結集を発表し、Zakk WyldeとCharlie Benanteを迎えて2022年12月に初公演を行い、ツアーも行っている。</p>
