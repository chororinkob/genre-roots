<h1>Groove Metal（グルーブメタル）とは</h1>
<p>グルーヴ・メタルは、スラッシュメタルの速さを意図的に捨てたヘヴィメタルだ。中間の速度で、身体が揺れることを最優先に設計されている。 核となるのは、リフの組み立て方だ。音を鳴らし続けるのではなく、短く切った和音と、あえて何も鳴らさな</p>
<p>グルーヴ・メタルは、スラッシュメタルの速さを意図的に捨てたヘヴィメタルだ。中間の速度で、身体が揺れることを最優先に設計されている。

核となるのは、リフの組み立て方だ。音を鳴らし続けるのではなく、短く切った和音と、あえて何も鳴らさない空白を交互に配置することが多い。この空白があることで、リフは跳ねるような弾力を持ち、首を縦に振る動作と正確に噛み合う。拍の頭を外して食い込ませるシンコペーション（拍の位置をずらす乗り）が多用される。聴き手は、次の打点を予測しようとして、裏切られ続けることになる。

ギターは、下げた調弦（弦の音合わせ）を用いる。Dimebag Darrellらが多用した、金切り声のようなハーモニクス奏法（スクィール）が使われる。テンポはスラッシュメタルより遅く抑えられるが、その代わりに、一発ごとの重量が増している。

ドラムは、バスドラムを二つ打ちで細かく入れつつ、スネアは拍の要所に強く落として輪郭を作る。

ヴォーカルは、旋律を歌うのではなく、喉を潰した怒鳴り声で言葉を叩きつける形式が主流だ。歌詞は、怒り、裏切り、依存、自己嫌悪といった、内側から噴き出す感情を扱うことが多い。

5分前後の曲が多い。速さで圧倒するスラッシュメタルとは対照的に、重さと間で殴るという発想の音楽である。</p>
<h2>成り立ち</h2><p>Exhorder、Prongらが1980年代末〜90年代初頭に先駆となった。Bad Brainsの1987年以降の作品（Quickness, 1989）を先駆と見る論者もいる。

1990年代初頭には、テキサス州アーリントンのPanteraが、スタイルを固めて広めた代表格と評される。彼らは1980年代半ばにかけて、化粧をした華美なバンドとして、複数の自主制作盤を出していた。しかし1986年にPhil Anselmoが加入し、1988年のPower Metalで重い方向へ移行した。1990年の作品Cowboys from Hellでは、グラム路線を完全に捨てた。

ギターのDarrell Abbottは、ダイムバッグ・ダレルの名で知られる。ハーモニクス（スクィール）を多用した奏法を看板とした。兄のVinnie Paulが叩く、ダブルベースを使いながら音数を絞った重いグルーヴと組み合わせて、独自の弾みを作った。1992年のヴァルガー・ディスプレイ・オブ・パワーは、このスタイルを完成させたと評される。1994年のファー・ビヨンド・ドリヴンは、極端に重い内容ながら全米初登場1位を記録した。しばしば「1位を獲得した最も過激な作品」と評される。

なお、ニューオーリンズのExhorderが先行していたとする見方があるが、当事者は評価が分かれる。

並行して、ブラジルのSepulturaが、1993年の作品ケイオスA.D.で速度を落とした重い刻みへ舵を切った。1996年のルーツでは、先住民のシャヴァンテ族と現地で共演し、部族の打楽器とヘヴィメタルを直接結びつけるという試みを行った。カリフォルニア州オークランドのMachine Headは、1994年の作品Burn My Eyesで、Bay Area系のスラッシュとPantera流のグルーヴ・メタルを橋渡ししたと評される。

しかし、歴史は悲劇によって断ち切られる。Panteraは長引く不和によって2003年に解散した。2004年12月8日、Darrell Abbottはオハイオ州コロンバスのクラブで、Damageplanのライブ中に、観客の一人に銃撃されて死亡した。この事件は、ヘヴィメタルの歴史における最も暗い出来事のひとつとして記憶されている。兄のVinnie Paulも2018年に死去した。

2022年7月にAnselmoとRex Brownが再結集を発表した。Zakk WyldeとCharlie Benanteを迎えて、2022年12月に初公演を行い、ツアーも行っている。</p>
