<h1>Groove Metal（グルーブメタル）とは</h1>
<p>スラッシュメタルの速さを意図的に捨て、中間の速度で身体が揺れることを最優先に設計されたヘヴィメタルである。核となるのはリフの組み立て方で、音を鳴らし続けるのではなく、短く切った和音と、あえて何も鳴らさない空白を交互に配置する。この</p>
<p>スラッシュメタルの速さを意図的に捨て、中間の速度で身体が揺れることを最優先に設計されたヘヴィメタルである。核となるのはリフの組み立て方で、音を鳴らし続けるのではなく、短く切った和音と、あえて何も鳴らさない空白を交互に配置する。この空白があることで、リフは跳ねるような弾力を持ち、首を縦に振る動作と正確に噛み合う。拍の頭を外して食い込ませるシンコペーションが多用され、聴き手は次の打点を予測しようとして裏切られ続けることになる。テンポは概ね90から140 BPMで、スラッシュメタルの半分程度に抑えられる代わりに、一発ごとの重量が増している。ギターは半音から一音下げた調弦を用い、指と弦の摩擦で高い倍音だけを鳴らす、金切り声のような奏法が象徴的な装飾として使われる。ドラムはバスドラムを二つ打ちで細かく入れつつ、スネアは拍の要所に強く落として輪郭を作る。ヴォーカルは旋律を歌うのではなく、喉を潰した怒鳴り声で言葉を叩きつける形式が主流で、歌詞は怒り、裏切り、依存、自己嫌悪といった、内側から噴き出す感情を扱う。曲は4分から5分程度で、無駄な展開を持たない。速さで圧倒するスラッシュメタルとは対照的に、重さと間で殴るという発想の音楽である。</p>
<h2>成り立ち</h2><p>1980年代末、スラッシュメタルはテンポと複雑さの限界に達し、聴き手も演奏者も速さそのものに飽き始めていた。この行き詰まりを打開したのがテキサス州アーリントンのPanteraである。彼らは1980年代前半、化粧をした華美なバンドとして複数の自主制作盤を出していたが、1987年にPhil Anselmoを歌手に迎えて路線を一変させ、1990年の作品カウボーイズ・フロム・ヘルで完全に生まれ変わった。ギターのDarrell Abbottは、ダイムバッグ・ダレルの名で知られ、指の側面で弦に触れて甲高い倍音を鳴らす奏法を看板とし、兄のVinnie Paulが叩く隙間の多いドラムと組み合わせて独自の弾みを作った。1992年のヴァルガー・ディスプレイ・オブ・パワーはこの様式を完成させ、1994年のファー・ビヨンド・ドリヴンは極端に重い内容にもかかわらず全米初登場1位を記録し、過激な音楽が主流の市場を制圧しうることを証明した。なおニューオーリンズのExhorderが同種のリフをより早く実践していたという指摘は根強く、両者の先後をめぐる論争は今も続いている。並行してブラジルのSepulturaが、1993年の作品カオス・エー・ディーで速度を落とした重い刻みへ舵を切り、1996年のルーツでは先住民のシャヴァンテ族と現地で共演し、部族の打楽器とヘヴィメタルを直接結びつけるという試みを行った。カリフォルニア州オークランドのMachine Headは1994年の作品で、この様式にハードコア・パンクの怒りを注ぎ込んだ。しかし歴史は悲劇によって断ち切られる。Panteraは内部の対立と薬物問題によって2003年に解散し、2004年12月8日、Darrell Abbottはオハイオ州コロンバスのクラブで演奏中に観客の一人に銃撃されて死亡した。この事件はヘヴィメタルの歴史における最も暗い出来事のひとつとして記憶されている。兄のVinnie Paulも2018年に死去し、和解の可能性は永遠に失われた。それでもこの様式が残した、速さではなく間で殴るという発想は、後のメタルコア、デスコア、そして現在のヘヴィな音楽のほぼ全てに引き継がれ、事実上の共通語となっている。</p>
