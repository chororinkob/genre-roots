<h1>Goregrind（ゴアグラインド）とは</h1>
<p>ゴアグラインドは、グラインドコアとデスメタルの融合から生まれた、極端な音楽だ。体が壊れることや病気を題材にする。 ギターは低く調弦される。和音というより、低音のかたまりとして鳴らされる。リフの輪郭も、わざとぼやけさせられる。 ドラ</p>
<p>ゴアグラインドは、グラインドコアとデスメタルの融合から生まれた、極端な音楽だ。体が壊れることや病気を題材にする。

ギターは低く調弦される。和音というより、低音のかたまりとして鳴らされる。リフの輪郭も、わざとぼやけさせられる。

ドラムはブラストビート(極めて速い連打)が基本だ。録音では、音を潰したような、金属的で平坦な質感になりやすい。

いちばん強い特徴は声にある。喉の奥から出す極端に低い咆哮か、音程を下げる装置を通した声が一般的だ。それによって声は、人間の発声とは思えない音に変わる。水中で唸るような、あるいは機械が壊れるような音だ。この処理によって、歌詞は聞き取りにくくなる。

歌詞と図柄には、医学辞典や医学書に由来する病理の用語や、法医学的な描写が使われる。ただ、ホラー映画のような冗談めいた調子も多く、ブラックユーモアとして受け取られることが多い。

曲は、1〜2分以下の短いものが中心だ。Carcass の『Reek of Putrefaction』でも、多くは1〜3分である。曲の構成は単純で、短い。録音の質は低いことが多く、それもスタイルの一部と見なされる。</p>
<h2>成り立ち</h2><p>1985年、イギリスのリヴァプールで、Disattack というバンドが結成された。のちに Carcass と名前を改めたこのバンドが、一般にこの分野の創始者とされる(RepulsionやImpetigoも同時期の源流として挙げられ、起源地もイギリスだけではない)。

彼らは、医学辞典や医学書に由来する病理学の用語を、歌詞に多用した。1988年と1989年に発表した作品は、極端に低い声と、解剖の図像を使った装丁によって、当時の基準からしても奇妙なほど異様なものだった。1988年作の濁った音は、本人たちが意図したものではない。録音環境の制約と、経験不足によるものだった。

最初の装丁(検死写真を貼り合わせたもの)は物議を醸した。1994年の再発では差し替えられ、2002年には検閲風の外装、2008年には医療用の袋に封入した版が出た。

ギタリストのBill Steerは、グラインドコアの中心的な存在とされるNapalm Deathにも、Carcassと掛け持ちで在籍していた。両者が直接つながっていることを示している。ただしCarcass自身は、1989年からデスメタルの要素を加え始める。そして1993年の『Heartwork』で旋律的なデスメタルへ転じ、この分野を離れた。

その後、このスタイルは欧州を中心に、米国や日本などにも広がり、細かく枝分かれしながら発展した。スウェーデンのRegurgitate、オランダのLast Days of Humanity、ポーランドのDead Infectionといった集団が、それぞれのやり方で極端さを競う。ドイツのGutは、より露骨に性的な主題を扱う派生を生み、これは別の呼び名で呼ばれるようになった。

小規模なレーベルや限定盤が多く、作品は通信販売と、複数の集団が一枚の盤を分け合うスプリット盤の形で出回った。ただしCarcassの『Reek of Putrefaction』は、英国のインディーチャートで6位に入った。例えば Dead Infection は、欧州、米国、南米、メキシコ、日本で公演している。

装丁に実際の遺体の写真が使われる例があり、物議を醸した。一方で当事者は、後年のインタビューで、当時は「不快で受け入れがたいものにしたかった」「検閲されれば信用されるアングラ盤になると考えた」と回想している。

関連する分野に、デスメタルとグラインドコアを融合させたデスグラインドがある。</p>
