<h1>Goregrind（ゴアグラインド）とは</h1>
<p>グラインドコアとデスメタルの融合から生まれた、身体の損壊と病理を主題とする極端な音楽である。最も強い特徴は声にある。喉の奥から出す極端に低い咆哮、あるいは音程を下げる装置を通した声が一般的で、それによって、人間の発声とは思えない、</p>
<p>グラインドコアとデスメタルの融合から生まれた、身体の損壊と病理を主題とする極端な音楽である。最も強い特徴は声にある。喉の奥から出す極端に低い咆哮、あるいは音程を下げる装置を通した声が一般的で、それによって、人間の発声とは思えない、水中で唸るような、あるいは機械が壊れるような音に変換される。この処理によって、歌詞は完全に判別不能となり、声は意味を伝える機能を失って純粋な音の塊となる。ギターは極端に低く調弦され、和音というより低音の塊として鳴らされ、リフの輪郭も意図的に不明瞭にされる。ドラムはブラストビート(極めて速い連打)を基本とし、録音では意図的に音を潰して、金属的で平坦な質感に整えられる。曲は多くが1〜3分前後と短い。構成らしい構成を持たず、始まった時点で最大の密度に達し、そのまま断ち切られる。録音の質は低いことが多く、それも様式の一部と見なされる。歌詞と図柄は、医学の教科書から取られた病理の用語や法医学的な描写を使うが、ホラー映画のような冗談めいた調子も多く、ブラックユーモアとして受け取られることが多い。</p>
<h2>成り立ち</h2><p>1985年にイギリスのリヴァプールで結成されたCarcassが、一般にこの分野の創始者とされる(RepulsionやImpetigoを先駆とする見方もあり、起源地もイギリスだけではない)。彼らは医学の辞典を開き、そこに並ぶ病理学の専門用語をそのまま歌詞に用いるという方法を採った。1988年と1989年に発表した作品は、極端に低い声と、解剖の図像を用いた装丁によって、当時の基準からしても異様なものだった。1988年作の濁った音は、本人たちが意図したものではなく、録音環境の制約と経験不足によるものだった。最初の装丁(検死写真を貼り合わせたもの)は物議を醸し、1994年の再発では差し替えられ、2002年には検閲風の外装、2008年には医療用の袋に封入した版が出た。彼らのギタリストBill Steerは、グラインドコアを確立したNapalm Deathにも在籍しており、両者の直接のつながりを示している。ただしCarcass自身は1989年からデスメタルの要素を加え始め、1993年の『Heartwork』で旋律的なデスメタルへ転じ、この分野を離れている。以後、この様式は欧州を中心に、米国や日本などにも広がり、細分化しながら発展した。スウェーデンのRegurgitate、オランダのLast Days of Humanity、ポーランドのDead Infectionといった集団が、それぞれの解釈で極端さを競う。ドイツのGutは、より露骨に性的な主題を扱う派生を生み、これは別の呼称で呼ばれるようになった。小規模なレーベルや限定盤が多く、通信販売と、複数の集団が一枚の盤を分け合うスプリット盤の形式で流通した。ただしCarcassの『Reek of Putrefaction』は英国のインディーチャートで6位に入り、各国の集団が欧州・米国・南米・日本などで公演している。批判は当然ながら厳しい。装丁に実際の遺体の写真が用いられる例があり、これは死者の尊厳を侵害するとして繰り返し問題視されてきた。一方で当事者は、当時「不快な作品にしたかった」「検閲されたかった」と語っている。この論争に決着はついていない。それでも、この様式の曲構成の一部は、ブルータル・デスメタルを経由して間接的に後の音楽に影響したとされる。直接の関係が明確なのは、デスメタルとグラインドコアを融合させたデスグラインドである。</p>
<h2>代表曲</h2><ul><li>Ruptured in Purulence (Carcass)</li><li>A Divine Proclamation of Finishing the Present Existence (Last Days of Humanity)</li><li>Exhume to Consume (Carcass)</li><li>Genital Grinder (Carcass)</li><li>Fistfucking Her Decomposed Cadaver (Torsofuck)</li><li>Regurgitation of Giblets (Carcass)</li><li>We Are The Gore (Haemorrhage)</li><li>Covered with Faeces as Decoration (Last Days of Humanity)</li><li>Pyosisified (Rotten to the Gore) (Carcass)</li><li>Vomited Anal Tract (Carcass)</li><li>Embryonic Necropsy and Devourment (Carcass)</li><li>Pungent Excruciation (Carcass)</li></ul>
