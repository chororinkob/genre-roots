<h1>Goregrind（ゴアグラインド）とは</h1>
<p>グラインドコアから派生した、身体の損壊と病理を主題とする極端な音楽である。最も強い特徴は声にある。喉の奥から出す低い咆哮を、さらに音程を下げる装置に通すことで、人間の発声とは思えない、水中で唸るような、あるいは機械が壊れるような音</p>
<p>グラインドコアから派生した、身体の損壊と病理を主題とする極端な音楽である。最も強い特徴は声にある。喉の奥から出す低い咆哮を、さらに音程を下げる装置に通すことで、人間の発声とは思えない、水中で唸るような、あるいは機械が壊れるような音に変換される。この処理によって、歌詞は完全に判別不能となり、声は意味を伝える機能を失って純粋な音の塊となる。ギターは極端に低く調弦され、和音というより低音の塊として鳴らされ、リフの輪郭も意図的に不明瞭にされる。ドラムは毎分250打を超えるブラストビートを基本とし、録音では意図的に音を潰して、金属的で平坦な質感に整えられる。曲は30秒から2分と極端に短く、一枚に30曲以上が収められることも珍しくない。構成らしい構成を持たず、始まった時点で最大の密度に達し、そのまま断ち切られる。録音の質は低いことが多く、それも様式の一部と見なされる。歌詞と図柄は、医学の教科書から取られた病理の用語や、実際の法医学の記録に基づく描写で構成されるが、これは現実の暴力の称揚ではなく、身体という不快なものを直視するという様式化された態度である。</p>
<h2>成り立ち</h2><p>1980年代後半のイギリス、リヴァプールで結成されたCarcassが、この分野の実質的な創始者である。彼らは医学の辞典を開き、そこに並ぶ病理学の専門用語をそのまま歌詞に用いるという方法を採った。1988年と1989年に発表した作品は、極端に低い声と、意図的に不明瞭な録音、そして解剖の図像を用いた装丁によって、当時の基準からしても異様なものだった。この装丁は複数の国で問題視され、販売を拒む店も多かった。彼らのギタリストBill Steerは、グラインドコアを確立したNapalm Deathにも在籍しており、両者の直接のつながりを示している。ただしCarcass自身は1993年以降、旋律的な方向へ大きく転じ、この分野を離れている。以後、この様式は主にヨーロッパで細分化しながら発展した。スウェーデンのRegurgitate、オランダのLast Days of Humanity、ポーランドのDead Infectionといった集団が、それぞれの解釈で極端さを競う。ドイツのGutは、より露骨に性的な主題を扱う派生を生み、これは別の呼称で呼ばれるようになった。この分野は、あらゆる音楽の中でも最も流通が限られている。作品は数百枚単位でしか作られず、通信販売と、複数の集団が一枚の盤を分け合う形式で流通した。演奏の場も小さな会場に限られる。批判は当然ながら厳しい。装丁に実際の遺体の写真が用いられる例があり、これは死者の尊厳を侵害するとして繰り返し問題視されてきた。一方で当事者は、この主題は現実を美化するのではなく、身体が物質であるという事実を直視するものであり、その意味では医学と同じ視線だと主張してきた。この論争に決着はついていない。それでも、極端に短く、極端に低く、極端に不明瞭という三つの原理は、後のスラムやデスコアに部分的に受け継がれている。</p>
