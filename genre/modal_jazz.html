<h1>Modal Jazz（モーダルジャズ）とは</h1>
<p>モード・ジャズは、和音の進行を追いかけて即興するのではなく、一つの音階の上に長くとどまって演奏するジャズのスタイルである。 それ以前のビバップやハードバップでは、和音が1小節内に何度も、速いテンポで変わった。演奏者は、その変化に合</p>
<p>モード・ジャズは、和音の進行を追いかけて即興するのではなく、一つの音階の上に長くとどまって演奏するジャズのスタイルである。

それ以前のビバップやハードバップでは、和音が1小節内に何度も、速いテンポで変わった。演奏者は、その変化に合う音を瞬時に選び続ける必要があった。この音楽では、その縛りを外す。一つの旋法（音の並び方の型）を、8小節、16小節、時にはそれ以上にわたって保ち続ける。その結果、演奏者は和音を追う義務から解放される。そして、旋律の輪郭、音色、間の取り方に集中できるようになる。

使われるのは、長調と短調に限らない教会旋法（中世の教会音楽に由来する音階の型）だ。ドリアやフリギア、リディアといった音階が選ばれ、それぞれに固有の色がある。

和声（コードの響き）の付け方も変わった。4度の積み重ねを含む和音も多く使われた。旋法の主音を低音で示しながら、4度和音で和声に変化をつける手法も使われた。これによって、長調とも短調ともつかない、曖昧で開かれた音が生まれる。加えて、低音で旋法の主音をくり返し示し、旋法をはっきりさせる手法もよく使われる。

テンポは、代表作のカインド・オブ・ブルーでは中くらいから緩やかだ。ただしライブでは、速いテンポで演奏された例も多い。曲は長く、静けさと余白が大事にされる。演奏には緊張がほどける場面が少ない。そのため聴き手は、物語の展開ではなく、続いていく空間の中の変化を聴くことになる、という見方もある。</p>
<h2>成り立ち</h2><p>モード・ジャズの理論面で、最も重要な影響を与えたのは作曲家George Russellである。1953年、彼は自費出版のパンフレットで『Lydian Chromatic Concept of Tonal Organization』を示した。従来の和声理論とは異なる、リディアン旋法を土台にした音の組み立て方の理論である。当時としては急進的な理論だったが、若い演奏者に強い影響を与えた。

この理論に影響を受けた演奏者たちが、旋法による即興を実践した。その代表がMiles Davisである。彼は、ジャズが和音で『分厚く』なりすぎて、旋律的な即興を妨げていると考えた。1958年の作品マイルストーンズでは、表題曲がDavis初のモード作曲となった。そして1959年に録音された作品カインド・オブ・ブルーは、この考えの結晶である。

収録曲のうち「So What」は、二つの旋法だけでできている。ほかの曲は、ブルース形式や循環形式（同じ和音の流れをくり返す形）、5つの音階を使う形など、それぞれ構造が違う。Davisは、録音の数時間前に作った曲の『スケッチ』(音階と旋律線)を持参した。ピアノのBill Evansは『So What』で、完全4度3つに長3度を重ねた響き(So What chord)を使った。同じ形の先例には、Ahmad Jamal版『Pavanne』(1955年)がある。

この作品は、2019年11月18日にRIAAの5×プラチナ(500万アルバム相当ユニット)に認定された。2026年8月までは、認定数が最も多いジャズ盤だった。現在は2位である。その静けさは、音楽の分野を超えて広く受け入れられた。

一方、参加していたJohn Coltraneは、この方向をさらに突き詰めた。1960年代前半、彼は自分の4重奏団で、旋法の上で長い時間をかけて音を積み上げ続ける演奏を固めた。ピアノのMcCoy Tynerが4度の和音を叩き、ドラムのElvin Jonesが複数のリズムの周期を同時に進める。その上でJohn Coltraneが延々と探索を続ける。この形は、ジャズの新しい可能性を示した。Herbie Hancockは1965年の作品で、この手法を、より静かで色彩ゆたかな方向へ広げている。

このスタイルの影響は、とても広い。少ない和音の上で長く演奏するという発想は、ロックの即興にも及んだ。Allman Brothers Bandは、モード奏法のジャムで、Milesの『All Blues』などから影響を受けた。『In Memory of Elizabeth Reed』(1970年)は、『All Blues』に基づくと伝えられるジャズ的な曲である。</p>
