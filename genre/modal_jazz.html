<h1>Modal Jazz（モーダルジャズ）とは</h1>
<p>和音の進行を追いかけて即興するのではなく、一つの音階の上に長くとどまって演奏するジャズの様式である。それ以前のビバップやハードバップでは、和音が二拍から四拍ごとに次々に変化し、演奏者はその変化に対応する音を瞬時に選び続ける必要があ</p>
<p>和音の進行を追いかけて即興するのではなく、一つの音階の上に長くとどまって演奏するジャズの様式である。それ以前のビバップやハードバップでは、和音が二拍から四拍ごとに次々に変化し、演奏者はその変化に対応する音を瞬時に選び続ける必要があった。この様式ではその制約を外し、一つの旋法を八小節、16小節、時にはそれ以上にわたって保持する。その結果、演奏者は和音を追う義務から解放され、旋律の輪郭、音色、間の取り方といった要素に集中できるようになる。用いられるのは長調と短調に限らない教会旋法で、ドリアやフリギア、リディアといった音階が選ばれ、それぞれ固有の色を持つ。和声の付け方も変化した。三度を積み重ねる従来の方式ではなく、四度を積み重ねる響きが好まれ、これによって長調とも短調ともつかない曖昧で開かれた音が生まれる。加えて、低音が同じ音を保ち続ける手法が多用される。テンポは緩やかなものが多く、曲は長く、静けさと余白が重視される。演奏には緊張の解決が乏しいため、聴き手は物語の展開ではなく、持続する空間の中の変化を聴くことになる。</p>
<h2>成り立ち</h2><p>理論的な下地を用意したのは作曲家George Russellである。彼は1953年に発表した著作で、従来の和声理論とは異なる、旋法を中心とする音の組織法を提示した。当時としては極めて異端の理論だったが、若い演奏者に強い影響を与えている。この理論を実践へ移したのがMiles Davisだった。彼はビバップの語法を極めた後、和音の数が多すぎることが即興の自由を奪っているという認識に至る。1959年に録音された作品カインド・オブ・ブルーは、この認識の結晶である。収録された楽曲の多くは、わずか二つの旋法を行き来するだけの構造を持ち、演奏者にはほとんど譜面が渡されず、その場で提示された素材をもとに演奏された。ピアノのBill Evansは、四度を積み重ねる和声によって、従来のジャズにない透明な響きを作っている。この作品はジャズ史上最も売れたものとなり、その静けさは音楽の分野を超えて広く受け入れられた。参加していたJohn Coltraneは、この方向をさらに突き詰める。彼は1960年代前半、自らの四重奏団において、旋法の上で長時間にわたり音を積み上げ続けるという演奏を確立した。ピアノのMcCoy Tynerが四度の和音を叩き、ドラムのElvin Jonesが複数の拍節を同時に進行させ、その上でJohn Coltraneが延々と探索を続けるという形は、ジャズの新しい可能性を示した。Herbie Hancockは1965年の作品で、この語法をより静謐で色彩的な方向へ展開している。この様式の影響は極めて広い。少ない和音の上で長く演奏するという発想は、ロックの即興、アンビエント、ミニマル音楽、そして現代の電子音楽にまで及んでおり、ジャズの外側でこそ最も広く受け継がれたとも言える。</p>
