<h1>Salsa（サルサ）とは</h1>
<p>キューバの音楽を土台にニューヨークで結晶した、ラテン音楽の代表的な様式。骨格をなすのはクラーベと呼ばれる二小節にまたがる非対称の基本リズムで、三つの打点と二つの打点が交互に配置される。全ての楽器はこのクラーベに対して自分の位置を決</p>
<p>キューバの音楽を土台にニューヨークで結晶した、ラテン音楽の代表的な様式。骨格をなすのはクラーベと呼ばれる二小節にまたがる非対称の基本リズムで、三つの打点と二つの打点が交互に配置される。全ての楽器はこのクラーベに対して自分の位置を決めるため、これを取り違えると演奏全体が崩れる。編成は打楽器群が中心で、コンガ、ボンゴ、ティンバレス（金属の胴を持つ二つの太鼓とカウベル）、マラカス、ギロが層をなす。ベースはトゥンバオと呼ばれる型を弾き、一拍目を意図的に空けて二拍目と四拍目の裏に音を置くため、宙に浮くような推進力が生まれる。ピアノはモントゥーノと呼ばれる分散和音の反復音型を刻む。管楽器はトランペット、トロンボーン、サックスで構成され、鋭い和音の刺しと対旋律を担う。曲の構成は明確で、前半の歌の部分に続き、後半のモントゥーノ部でリード歌手の即興と合唱の掛け合い、いわゆるコロ・イ・プレゴンが延々と続き、その上で打楽器や管楽器のソロが繰り広げられる。歌詞はスペイン語で、恋愛、街の生活、移民の苦労、誇りを扱う。</p>
<h2>成り立ち</h2><p>音楽的な起源はキューバにあり、19世紀末に東部で成立したソンという形式が直接の母体である。ソンはスペイン系の弦楽器と歌の伝統に、アフリカ系の打楽器とクラーベのリズムが結合して生まれた。1930年代から1940年代、キューバの楽団がニューヨークで演奏を始め、Machitoとその楽団、そして編曲者Mario Bauzáが、ジャズのビッグバンドの管楽器の書法とキューバのリズムを結合させ、アフロ・キューバン・ジャズを確立した。1950年代にはマンボが世界的な流行となり、Tito Puente、Tito Rodríguez、Pérez Pradoが活躍した。転機は1959年のキューバ革命で、米国との国交断絶により、キューバから直接音楽が流入する経路が絶たれた。この空白を埋めたのが、ニューヨークのプエルトリコ系コミュニティである。1960年代、Fania Recordsが Jerry MasucciとJohnny Pachecoによって設立され、Willie Colón、Héctor Lavoe、Rubén Blades、Celia Cruz、Ray Barretto、Larry Harlowといった演奏家を集めた。この楽団Fania All-Starsが1971年にニューヨークのチーターというクラブで行った公演、そして1973年のヤンキー・スタジアム公演は、サルサという名称と概念を確立した決定的な出来事となった。名称そのものは音楽的な定義ではなく、多様なリズムをまとめて売るための商業的な標語であり、キューバの音楽家からは自分たちの音楽を別名で売っているという批判が長く続いた。1970年代のニューヨークでは、貧困と犯罪に苦しむバリオの生活が歌詞の主題となり、とりわけHéctor Lavoeの人生は、その成功と薬物依存、そして1993年の死によって、この音楽の光と影を体現した。1980年代にはより甘い恋愛歌を中心とするサルサ・ロマンティカが主流となり、以後もコロンビアやベネズエラを含む各地で独自の発展を続けている。</p>
