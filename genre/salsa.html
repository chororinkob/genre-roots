<h1>Salsa（サルサ）とは</h1>
<p>キューバの音楽を土台にニューヨークで結晶した、ラテン音楽の代表的な様式。骨格をなすのはクラーベと呼ばれる2小節にまたがる非対称の基本リズムで、三つの打点と二つの打点が交互に配置される。全ての楽器はこのクラーベに対して自分の位置を決</p>
<p>キューバの音楽を土台にニューヨークで結晶した、ラテン音楽の代表的な様式。骨格をなすのはクラーベと呼ばれる2小節にまたがる非対称の基本リズムで、三つの打点と二つの打点が交互に配置される。全ての楽器はこのクラーベに対して自分の位置を決めるため、これを取り違えると演奏全体が崩れる。編成は打楽器群が中心で、コンガ、ボンゴ、ティンバレス（金属の胴を持つ二つの太鼓とカウベル）、マラカス、ギロが層をなす。ベースはトゥンバオと呼ばれる型を弾き、1拍目を意図的に空けて、2拍目の裏と4拍目の頭に音を置くため、宙に浮くような推進力が生まれる。ピアノはモントゥーノと呼ばれる分散和音（和音を1音ずつ順に弾く）の反復音型を刻む。管楽器は主にトランペットとトロンボーンで、編成によってはサックスなどが加わり、鋭い和音の刺しと対旋律（主旋律に寄り添う別の旋律）を担う。曲の構成は明確で、前半の歌の部分に続き、後半のモントゥーノ部でリード歌手の即興と合唱の掛け合い、いわゆるコロ・イ・プレゴンが延々と続き、その上で打楽器や管楽器のソロが繰り広げられる。歌詞はスペイン語で、恋愛、街の生活、移民の苦労、誇りを扱う。</p>
<h2>成り立ち</h2><p>基盤となる要素はキューバにあり、19世紀末に東部で成立したソンという形式が土台になっている（サルサそのものの起源には論争がある）。そこにマンボやグアラーチャ、プエルトリコのボンバやプレーナなどが混ざって成立した。ソンはスペイン系の弦楽器と歌の伝統に、アフリカ系の打楽器とクラーベのリズムが結合して生まれた。キューバの楽団は1920年代にすでにニューヨークで演奏・録音しており、1930年代から1940年代にはその活動が広がり、Machitoとその楽団、そして音楽監督Mario Bauzáが、ジャズのビッグバンドの管楽器の手法とキューバのリズムを結合させ、アフロ・キューバン・ジャズを確立した。1950年代にはマンボが世界的な流行となり、Tito Puente、Tito Rodríguez、Pérez Pradoが活躍した。転機は1959年のキューバ革命で、その後1961年に米国が国交を断絶し、1960年代の禁輸措置もあって、キューバの楽団の来演やレコードの流入が大きく制限された。この空白を埋めたのが、ニューヨークのプエルトリコ系コミュニティである。1960年代、Fania Recordsが Jerry MasucciとJohnny Pachecoによって設立され、1970年代にかけてWillie Colón、Héctor Lavoe、Rubén Blades、Celia Cruz、Ray Barretto、Larry Harlowといった演奏家を集めた。この楽団Fania All-Starsが1971年にニューヨークのチーターというクラブで行った公演、そして1973年のヤンキー・スタジアム公演は、サルサを広く知らしめる決定的な出来事となった。名称の起源には諸説があり、公演より前から使われた例もあるとされる。名称そのものは音楽的な定義ではなく、多様なリズムをまとめて売るための商業的な標語だという見方があり、賛否が分かれた。Celia Cruzは「サルサはキューバ音楽の別名。マンボ、チャチャチャ、ルンバ、ソン…すべてのキューバのリズムを一つの名前の下に集めたもの」と述べ（呼称は受け入れつつキューバ起源を主張した）、Machitoは「目新しいものではない」と述べ、Tito Puenteは「私が知っているサルサは瓶入りのケチャップだけ。私はキューバ音楽を演奏する」と述べ、キューバの音楽学者は、名称がキューバ起源を覆い隠したと批判した。1970年代のニューヨークでは、貧困と犯罪に苦しむバリオ（スペイン語圏の移民街）の生活が歌詞の主題となり、とりわけHéctor Lavoeの人生は、その成功と薬物依存、そして1993年の死によって、この音楽の光と影を体現した。1980年代半ばから1990年代初頭にかけて、より甘い恋愛歌を中心とするサルサ・ロマンティカが現れて広がり、以後もコロンビアやベネズエラを含む各地で独自の発展を続けている。</p>
