<h1>Salsa（サルサ）とは</h1>
<p>サルサは、キューバの音楽を土台にニューヨークで結晶した、ラテン音楽の代表的なスタイルだ。 編成は打楽器群が中心で、コンガ、ボンゴ、ティンバレス（金属の胴を持つ二つの太鼓とカウベル）、マラカス、ギロが層をなす。 骨格をなすのは、クラ</p>
<p>サルサは、キューバの音楽を土台にニューヨークで結晶した、ラテン音楽の代表的なスタイルだ。

編成は打楽器群が中心で、コンガ、ボンゴ、ティンバレス（金属の胴を持つ二つの太鼓とカウベル）、マラカス、ギロが層をなす。

骨格をなすのは、クラーベと呼ばれる2小節にまたがる非対称の基本リズムだ。三つの打点と二つの打点が交互に配置される。全ての楽器はこのクラーベに対して自分の位置を決めるため、これを取り違えると演奏全体が崩れる。

ベースはトゥンバオと呼ばれる型を弾く。1拍目を意図的に空けて、2拍目の裏と4拍目の頭に音を置くため、宙に浮くような推進力が生まれる。ピアノは、モントゥーノと呼ばれる分散和音（和音を1音ずつ順に弾く）の反復音型を刻む。

管楽器は主にトランペットとトロンボーンで、編成によってはサックスなどが加わる。鋭い和音の刺しと、対旋律（主旋律に寄り添う別の旋律）を担う。

歌詞はスペイン語で、恋愛、街の生活、移民の苦労、誇りを扱う。

多くの曲は、前半の歌の部分に続いて、後半のモントゥーノ部に入る。ここではリード歌手の即興と合唱の掛け合い、いわゆるコロ・プレゴンのコール＆レスポンスが展開する。その上で、打楽器や管楽器のソロが繰り広げられる。</p>
<h2>成り立ち</h2><p>サルサの土台になったのは、19世紀末にキューバ東部で成立したソンという形式だ。ソンは、スペイン系の弦楽器と歌の伝統に、アフリカ系の打楽器とクラーベのリズムが結合して生まれた。そこにマンボやグアラーチャ、プエルトリコのボンバやプレーナなどが混ざって成立した。

土台となる要素（ソンなど）はキューバに由来する。ジャンルとしてのサルサは、1960〜70年代のニューヨークでキューバ系とプエルトリコ系などの音楽家が形成した（起源をめぐる論争がある）。

1920年代にはすでに、キューバの楽団がニューヨークで演奏・録音していた。1930〜40年代にその活動が広がると、Machitoとその楽団、そして音楽監督Mario Bauzáが、ジャズのビッグバンドの管楽器の手法とキューバのリズムを結合させた。こうしてアフロ・キューバン・ジャズが定着した。1950年代にはマンボが世界的な流行となり、Tito Puente、Tito Rodríguez、Pérez Pradoが活躍した。

転機は、1959年のキューバ革命だった。その後、米国の対キューバ禁輸（1960年代）により、キューバの楽団の来演やLPの流入が大きく制限された。この空白を埋めたのが、ニューヨークの主にプエルトリコ系のコミュニティである。

1960年代、Fania RecordsがJerry MasucciとJohnny Pachecoによって設立された。1970年代にかけて、Willie Colón、Héctor Lavoe、Rubén Blades、Celia Cruz、Ray Barretto、Larry Harlowといった演奏家が集まった。この楽団Fania All-Starsが、1971年にニューヨークのチーターというクラブで行った公演と、1973年のヤンキー・スタジアム公演は、サルサを広く知らしめる大きな出来事となったと言われる。

名称の起源には諸説があり、公演より前から使われた例もあるとされる。名称そのものは音楽的な定義ではなく、多様なリズムをまとめて売るための商業的な標語だという見方があり、賛否が分かれた。Celia Cruzは「サルサはキューバ音楽の別名。マンボ、チャチャチャ、ルンバ、ソン…すべてのキューバのリズムを一つの名前の下に集めたもの」と述べた。Machitoは「目新しいものではない」、Tito Puenteは「私が知っているサルサは瓶入りのケチャップだけ。私はキューバ音楽を演奏する」と述べ、キューバの音楽学者は、名称がキューバ起源を覆い隠したと批判した。

1970年代のニューヨークでは、貧困と犯罪に苦しむバリオ（スペイン語圏の移民街）の生活が歌詞の主題となった。とりわけHéctor Lavoeの人生は、その成功と薬物依存、そして1993年の死によって、この音楽の光と影をあらわしていた。

1980年代半ばから1990年代初頭にかけて、より甘い恋愛歌を中心とするサルサ・ロマンティカが現れて広がった。以後もコロンビアやベネズエラを含む各地で、独自の発展を続けている。</p>
