<h1>Progressive Metal（プログレッシブメタル）とは</h1>
<p>ヘヴィメタルの重さと音量を保ちながら、プログレッシブ・ロックが持っていた構成の複雑さと演奏技術の追求を持ち込んだ音楽である。最も分かりやすい特徴は拍子で、7/8、5/4、13/8や、9/8（2+2+2+3などの不均等な分け方）とい</p>
<p>ヘヴィメタルの重さと音量を保ちながら、プログレッシブ・ロックが持っていた構成の複雑さと演奏技術の追求を持ち込んだ音楽である。最も分かりやすい特徴は拍子で、7/8、5/4、13/8や、9/8（2+2+2+3などの不均等な分け方）といった変拍子（定型から外れた拍子）が曲中で頻繁に入れ替わり、さらにギターとドラムが異なる周期で循環するポリメーター（異なる小節長を重ねる手法）が組まれる。数小節ごとに周期が一致して初めて着地する構造は、聴き手に緊張と解決の独特な快感を与える。ギターは6弦に留まらず7弦や8弦を用い、低い方の弦で刻む重い音型と、高音域での速い単音のフレーズを使い分ける。音階もブルースやロックで多用されるマイナー・ペンタトニック（5音音階）を離れ、教会旋法、ハーモニックマイナー、ディミニッシュ・スケール（8音の対称音階）、全音音階といった素材が使われ、和声（コードの響き）も四和音や不協和な積み方が普通に現れる。Dream Theaterなど鍵盤楽器を正式な構成員とするバンドもあり、ギターと鍵盤が同じ速い旋律を寸分違わず合わせて弾く場面が見せ場となる。ドラムは複雑な足の動きと、拍を隠すシンバルワークを駆使する例がある。曲は10分前後から20分超、さらに40分を超える例もあり（Dream Theaterの『Six Degrees of Inner Turbulence』は約42分）、複数の楽章に分かれた組曲や、アルバム全体で一つの物語を語る形式が好まれる。歌詞は宗教、精神の病、SF、社会批判、個人の内面といった重い主題を扱う。</p>
<h2>成り立ち</h2><p>独立したジャンルとしては1980年代前半〜半ばに形成された。源流は1960〜70年代のRushやKing Crimson、Yesなど、ヘヴィメタルとプログレッシブ・ロックの初期にさかのぼり、その影響を受けた演奏者たちが現れた。テキサスのWatchtowerは1980年代半ばに極端な変拍子とスラッシュメタルを結合させ、この分野の最初期の実例となる。コネチカット州ハートフォードのFates Warningは、複雑な構成と幻想的な歌詞で知られ、1988年の『No Exit』の組曲を経て、1997年には約54分の1曲構成のコンセプト・アルバムを発表し、ワシントン州ベルビューのQueensrÿcheは1988年に、精神操作と陰謀を主題とする作品オペレーション・マインドクライムを発表し、アルバム全体で一つの筋を語る形式で、全米50位、のちにプラチナ認定となる成功を収めた。この様式を定着させた存在の一つがDream Theaterである。John PetrucciとJohn Myungは幼なじみで、ボストンの音楽大学バークリー音楽院に在学中にMike Portnoyと出会い、1985年に結成したこのバンドは、1992年の作品イメージズ・アンド・ワーズと、そこから生まれた楽曲プル・ミー・アンダーがラジオとテレビで流れたことにより、演奏技術を前面に出した音楽が売れる例となった（『イメージズ・アンド・ワーズ』は全米61位でゴールド認定）。技巧の誇示という批判もある。1990年代にはより異質な方向も現れた。フロリダのCynicは1993年の作品で、デスメタルにジャズフュージョンと合成した声を持ち込み、スウェーデンのウメオで結成されたMeshuggahは、下げ調弦（弦を低く合わせること）の7弦ギターによって（2002年の『Nothing』は7弦で録音され、8弦での再録を経た再発盤が2006年に出た。8弦への初の取り組み）、一定の4拍子の上に別の長さの音型を延々とずらして重ねるという独自の手法を確立し、1995年と1998年の作品で、djentなど後の世代に大きな影響を与えた。同じくスウェーデンのOpethは、Mikael Åkerfeldtを中心に、プログレッシブ・ロックと過激なメタルを結びつけた最初期のバンドの一つで、絶叫を伴う激烈な部分と静かなフォーク調の部分を同一曲内で往復させる作風で知られ、2001年にはSteven Wilsonの制作でブラックウォーター・パークを発表する。アメリカではToolが、Danny Careyの数学的なリズム設計と儀式的な世界観によって、米Billboard 200で1位を3回獲得する商業的成功を収めた。2000年代後半以降は、Meshuggahの手法を受け継いだ多弦ギターの新しい潮流がインターネット上の自主制作から生まれ、この運動は、Peripheryのデビュー作（2010年4月20日にSumerian Recordsから発売）と欧州ツアーなどを経て、世界的な聴衆に広がった。</p>
