<h1>Progressive Metal（プログレッシブメタル）とは</h1>
<p>ヘヴィメタルの重さと音量を保ちながら、プログレッシブ・ロックが持っていた構成の複雑さと演奏技術の追求を持ち込んだ音楽である。最も分かりやすい特徴は拍子で、7/8、5/4、9/8、13/8といった変拍子が曲中で頻繁に入れ替わり、さら</p>
<p>ヘヴィメタルの重さと音量を保ちながら、プログレッシブ・ロックが持っていた構成の複雑さと演奏技術の追求を持ち込んだ音楽である。最も分かりやすい特徴は拍子で、7/8、5/4、9/8、13/8といった変拍子が曲中で頻繁に入れ替わり、さらにギターとドラムが異なる周期で循環するポリリズムが組まれる。数小節ごとに周期が一致して初めて着地する構造は、聴き手に緊張と解決の独特な快感を与える。ギターは6弦に留まらず7弦や8弦を用い、低い方の弦で刻む重い音型と、高音域での速い単音の走句を使い分ける。音階もブルース由来のペンタトニックを離れ、教会旋法、ハーモニックマイナー、減七の音階、全音音階といった素材が使われ、和声も四和音や不協和な積み方が普通に現れる。鍵盤楽器が正式な構成員として加わることが多く、ギターと鍵盤が同じ速い旋律を寸分違わず合わせて弾く場面が見せ場となる。ドラムは複雑な足の動きと、拍を隠すシンバルワークを駆使する。曲は8分から20分に及ぶこともあり、複数の楽章に分かれた組曲や、アルバム全体で一つの物語を語る形式が好まれる。歌詞は宗教、精神の病、SF、社会批判、個人の内面といった重い主題を扱う。</p>
<h2>成り立ち</h2><p>1980年代前半、ヘヴィメタルが速さと攻撃性を競う方向へ進む中で、それだけでは物足りないと感じた演奏者たちが、1970年代のRushやKing Crimson、Yesが持っていた構成の複雑さを取り戻そうとした。テキサスのWatchtowerは1980年代半ばに極端な変拍子とスラッシュメタルを結合させ、この分野の最初期の実例となる。マサチューセッツのFates Warningは物語性のある長尺の作品を作り、シアトルのQueensrÿcheは1988年に、精神操作と陰謀を主題とする作品オペレーション・マインドクライムを発表し、アルバム全体で一つの筋を語る形式を大衆的な成功と両立させた。決定的な存在となったのはDream Theaterである。1985年にボストンの音楽大学バークリー音楽院で出会ったJohn Petrucci、John Myung、Mike Portnoyが結成したこのバンドは、1992年の作品イメージズ・アンド・ワーズと、そこから生まれた楽曲プル・ミー・アンダーがラジオとテレビで流れたことにより、演奏技術を前面に出した音楽が売れるという事実を証明した。彼らの成功は同時に、この分野に技巧の誇示という批判を招く原因ともなる。1990年代にはより異質な方向も現れた。フロリダのCynicは1993年の作品で、デスメタルにジャズフュージョンと合成した声を持ち込み、スウェーデンのウメオで結成されたMeshuggahは、8弦ギターによって、一定の4拍子の上に別の長さの音型を延々とずらして重ねるという独自の手法を確立し、1995年と1998年の作品で後の世代に決定的な影響を与えた。同じくスウェーデンのOpethは、Mikael Åkerfeldtを中心に、絶叫を伴う激烈な部分と静かなフォーク調の部分を同一曲内で往復させる作風を打ち立て、2001年にはSteven Wilsonの制作でブラックウォーター・パークを発表する。アメリカではToolが、Danny Careyの数学的なリズム設計と儀式的な世界観によって、この分野で最も大きな商業的成功を収めた。2000年代後半以降は、Meshuggahの手法を受け継いだ多弦ギターの新しい潮流がインターネット上の自主制作から生まれ、Peripheryをはじめとする作家たちがレコード会社を介さずに世界的な聴衆を得るという、流通の面でも新しい形を作った。</p>
