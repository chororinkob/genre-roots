<h1>Illbient（イルビエント）とは</h1>
<p>イルビエントは、アンビエントの長く続く音の層に、ヒップホップの重いビートとダブの深い残響を混ぜ合わせた音楽だ。 名称は、ヒップホップのスラング「ill」とアンビエントを合わせた造語である。心地よさを目的とする従来のアンビエントに対</p>
<p>イルビエントは、アンビエントの長く続く音の層に、ヒップホップの重いビートとダブの深い残響を混ぜ合わせた音楽だ。

名称は、ヒップホップのスラング「ill」とアンビエントを合わせた造語である。心地よさを目的とする従来のアンビエントに対し、噛み合わない素材の組み合わせが生む緊張を目的とする。

土台になるのは、ブレイクビーツとサンプルを使い、ワールドミュージックなど多様な要素を取り込んで組み立てるビートだ。ドラムの音は輪郭を潰され、霧の奥から響くように鳴る。

その上にダブの手法が重ねられる。音が消えるたびに、長いディレイ（音を遅らせて繰り返す効果）の尾を引き、突然すべてが抜けて低音だけが残る。

素材の選び方も特徴的だ。都市の環境音、ラジオやテレビの声、映画の台詞が、層のように積み重ねられる。聴き手は、どれが楽器でどれが騒音なのか、区別できなくなる。

演奏は、ターンテーブルと複数の再生機器を同時に操作する形が多く、その場で即興的に組み立てられる。演奏の場は、倉庫、クラブ、アートスペースでの催しだった。映像や照明と組み合わせ、空間ごと作品にしようとする傾向が強い。</p>
<h2>成り立ち</h2><p>舞台は、1990年代前半から半ばのニューヨークだ。ブルックリンのウィリアムズバーグを中心に、マンハッタンのGas Stationなどにも広がっていた。

当時のウィリアムズバーグは、工場の廃墟が並ぶ荒れた場所だった。家賃が安く、音楽家と美術家が大勢住み着いていた。

名称の命名者には諸説ある。DJ Olive（本名Gregor Asch）は、パーティーで英国人の記者に聞かれ、冗談で答えたのが始まりだったと語る。DJ Spookyも、当時この言葉を使っていたと述べている。両者が自分の造語だと主張している、とする説もある。

中心の一つとなったのは、We™という集団だ。DJ Olive、Once11、Lloopの3人が、ターンテーブルやカセットなどを使って即興演奏を行った。

もう一人の重要人物が、DJ Spooky、本名Paul D. Millerである。彼はメイン州のボウディン・カレッジで哲学とフランス文学を学んだ理論家でもあった。1996年のアルバム『Songs of a Dead Dreamer』と多数の文章によって、この音楽に思想の枠組みを与えたとされる。彼はサンプリングを、今ある文化を切り刻んで組み替える批評の行為として位置づけたとされる。

背景には、いくつもの条件が重なっていた。ジャマイカのダブが持つ空間処理の技術が、ヒップホップを通じて広く共有されていたこと。Brian Enoが唱えたアンビエントの考え方が浸透していたこと。そして何より、廃工場を無断で占拠して開かれる催しという場があったことである。

レーベルでは、AsphodelとWordSoundがこの流れを支えた。後者を主宰したSkizは、より暗く重い方向を推し進めたとされる。ほかにByzar、Sub Dub、Skizの別名義Spectre、そしてイギリス側から近い位置にいて、イルビエントの先駆とされるScornもこの流れで語られる。日本のDJ Krushも、作品がイルビエントのタグで分類されることがある。

しかし1990年代半ばから後半にかけて、状況は変わる。警察の摘発、ジュリアーニ市政の「生活の質」を掲げる政策、クラブ側の方針転換、時代の好みの変化などが重なり、シーンは散り散りになった。

トリップホップは同じ時代のジャンルで、イルビエントと近い関係にあった。その手法は、2000年代のアブストラクト・ヒップホップ（SixtooやOdd Nosdamなど）に受け継がれた。</p>
