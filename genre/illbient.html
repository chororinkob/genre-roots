<h1>Illbient（イルビエント）とは</h1>
<p>アンビエントの持続する音の層に、ヒップホップの重いビートとダブの深い残響を混ぜ合わせた音楽。名称は病んだアンビエントという意味の造語で、心地よさを目的とする従来のアンビエントに対し、不安と居心地の悪さを意図的に作る点が核心である。</p>
<p>アンビエントの持続する音の層に、ヒップホップの重いビートとダブの深い残響を混ぜ合わせた音楽。名称は病んだアンビエントという意味の造語で、心地よさを目的とする従来のアンビエントに対し、不安と居心地の悪さを意図的に作る点が核心である。土台になるのは低く遅いブレイクビーツで、テンポは毎分70から90拍程度、ドラムの音は輪郭を潰されて霧の奥から響く。その上にダブの手法が重ねられ、音が消えるたびに長いディレイの尾を引き、突然すべてが抜けて低音だけが残る。素材の選び方も特徴的で、都市の環境音、地下鉄の走行音、ラジオやテレビの声、映画の台詞、警報音、あるいは古いレコードの針音が層状に積み重ねられ、聴き手はどれが楽器でどれが騒音なのか区別できなくなる。旋律らしい旋律はほとんど置かれず、和音は短調の持続音が濁って重なるだけである。曲は10分を超えることも多く、明確な始まりと終わりを持たずに漂う。演奏はターンテーブルと複数の再生機器を同時に操作する形が多く、即興的に組み立てられる。演奏の場は倉庫や画廊での催しで、映像や照明と組み合わせて空間ごと作品にする志向が強い。</p>
<h2>成り立ち</h2><p>生まれたのは1990年代半ばのニューヨーク、ブルックリンのウィリアムズバーグである。当時この地区は工場の廃墟が並ぶ荒れた場所で、家賃が安く、音楽家と美術家が大量に住み着いていた。名称を作ったとされるのはDJ Olive、本名Gregor Aschで、彼はこの言葉を仲間内の冗談として使い始めたと語っている。中心となったのはWe™という集団で、DJ Olive、Once11、Lloopの三人が、複数のターンテーブルとサンプラーで即興を行った。もう一人の重要人物がDJ Spooky、本名Paul D. Millerで、彼はコロンビア大学で哲学と仏文学を学んだ理論家でもあり、1996年のアルバム『Songs of a Dead Dreamer』と、多数の文章によってこの音楽に思想的な枠組みを与えた。彼はサンプリングを、既存の文化を切り刻んで組み替える批評行為として位置づけた。背景にはいくつもの条件が重なっていた。ジャマイカのダブが持つ空間処理の技術がヒップホップを通じて広く共有されていたこと、Brian Enoが提唱したアンビエントの概念が浸透していたこと、そして何より、廃工場を無断で占拠して開かれる催しという場が存在したことである。レーベルではAsphodelとWordSoundがこの流れを支え、後者を主宰したSkizが、より暗く重い方向を推し進めた。ほかにByzar、Sub Dub、Spectre、そしてイギリス側から近い位置にいたScorn、日本のDJ Krushもこの文脈で語られる。1990年代末には、ウィリアムズバーグの地価高騰によって音楽家が追い出され、シーンは急速に散逸した。ただしその手法は、2000年代のアブストラクト・ヒップホップやトリップホップ、そして現在のアンビエント寄りの電子音楽に受け継がれている。</p>
