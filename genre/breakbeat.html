<h1>Breakbeat（ブレイクビート）とは</h1>
<p>四つ打ちに頼らず（四つ打ちと組み合わせる系統もある）、拍の配置を崩したドラムパターンを土台とするダンス音楽の総称。中核となるのはブレイクと呼ばれる素材で、1960年代から1970年代のファンクやソウルのレコードから、伴奏が止まって</p>
<p>四つ打ちに頼らず（四つ打ちと組み合わせる系統もある）、拍の配置を崩したドラムパターンを土台とするダンス音楽の総称。中核となるのはブレイクと呼ばれる素材で、1960年代から1970年代のファンクやソウルのレコードから、伴奏が止まってドラムだけになる数小節を切り出したものを指す。これをサンプラー（録音を素材として取り込む機械）に取り込み、拍ごとに切り分けて並べ替え、テンポを変えて再生する。この過程で、原曲の演奏者の癖や録音の質感が保たれたまま、まったく別のリズムが生まれる。テンポは約120〜140BPMが中心で、系統により110〜175BPMと幅がある。拍の配置は、スネアが2拍4拍に来る系統もあるが、Amen Breakのようにスネアの位置自体をずらす素材も多い。その周囲のキックとゴーストノート（ごく弱く入れる飾りの音）が不規則に散らばり、身体を前後に揺らす歩行感を作る。ベースや上物（メロディーなど上に重ねる音）、和声は系統によって大きく異なり、ピアノのリフ、レゲエやダブ系のベース、ファンク由来のサンプルなどが使われる。制作上の要点は、切り刻んだドラムの隙間に生じる微妙な間の設計にあり、この間の取り方が制作者の個性になる。四つ打ち系のハウスやテクノと比べて、リズムそのものが表現の中心にあり、人力の演奏の痕跡が残る点が最大の相違になる。ジャングル、ドラムンベース、ビッグビート、ヌースクールなど多数の派生の共通の土台でもある。</p>
<h2>成り立ち</h2><p>ブレイクを使う技法の起点は、1970年代のニューヨーク、ブロンクスにある。ダンス音楽のジャンルとしてのブレイクビーツは、1980年代末ごろに形づくられた。DJのKool Herc(本名Clive Campbell、1955年ジャマイカ生まれ)は、パーティーで観客が最も熱狂するのが、曲の中でドラムだけになる短い部分だと気づいた。そこで彼は、2台のターンテーブルでブレイクを引き伸ばしたり、つないだりする手法（メリーゴーラウンドと呼ばれる）を広めた先駆者の一人となった。2枚使いとの関係は資料により説明が異なる。この手法はヒップホップの誕生に直結した。この技法によって切り出される部分こそがブレイクであり、そこで踊る者がブレイクダンサーと呼ばれた。1970年代末から1980年代にかけて、Grandmaster FlashやAfrika Bambaataaがこの技法を洗練させた。1980年代半ばにサンプラーが普及すると、ブレイクを機械で取り込んで自由に加工することが可能になる。ここで決定的な素材となったのが、The Winstonsが1969年に録音した「Amen, Brother」の約6〜7秒間（4小節）のドラム独奏部分で、これはAmen Breakとして史上最も広くサンプリングされた音源の一つになった。同様にThe Honey Drippersの「Impeach the President」やLyn Collinsの「Think (About It)」も定番素材となった。1980年代末〜1990年代初頭に米英双方でジャンルが形成され、イギリスではレイヴ文化と結合した。ハウスの四つ打ちにヒップホップ由来のブレイクビートを組み合わせ、米国の音楽への依存から離れた英国独自のレイヴの音（ブレイクビーツ・ハードコア）が生まれ、そこからジャングル、ドラムンベースが分岐した。アメリカでは、フロリダを中心にFlorida breaksが1990年代前半から半ばにかけて発展した（起源を1980年代末とする資料もある）。一般に、ビッグビートは英国発のスタイルとされる。1990年代後半にはThe Chemical BrothersやFatboy Slimがビッグビートとして大衆的な成功を収め、映画やコマーシャルで大量に使われた。この分野の歴史には、深刻な倫理的問題が付随する。サンプルの原演奏者の多くは報酬をほとんど得ていない。とりわけAmen Breakのドラマー Gregory Cylvester Colemanはサンプリング使用に対する印税を受け取らず、2006年にホームレス状態で死去したと報じられた。1990年代以降は法的な権利処理が厳格化し、無断サンプリングによる訴訟が相次いだ結果、制作の経済的条件が大きく変化した。現在ブレイクビーツは独立したジャンルであると同時に、電子音楽全般の共通の技法として定着している。</p>
