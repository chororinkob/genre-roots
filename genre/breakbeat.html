<h1>Breakbeat（ブレイクビート）とは</h1>
<p>均等な四つ打ちを避け、拍の配置を崩したドラムパターンを土台とするダンス音楽の総称。中核となるのはブレイクと呼ばれる素材で、1960年代から1970年代のファンクやソウルのレコードから、伴奏が止まってドラムだけになる数小節を切り出し</p>
<p>均等な四つ打ちを避け、拍の配置を崩したドラムパターンを土台とするダンス音楽の総称。中核となるのはブレイクと呼ばれる素材で、1960年代から1970年代のファンクやソウルのレコードから、伴奏が止まってドラムだけになる数小節を切り出したものを指す。これをサンプラーに取り込み、拍ごとに切り分けて並べ替え、テンポを変えて再生する。この過程で、原曲の演奏者の癖や録音の質感が保たれたまま、まったく別のリズムが生まれる。テンポは130〜145BPM程度が標準的だが、系統によって大きく幅がある。拍の配置はスネアが2拍4拍にありながら、その周囲のキックとゴーストノートが不規則に散らばり、身体を前後に揺らす歩行感を作る。ベースは深く沈むシンセ音で、しばしばレゲエ由来のサブベースが用いられる。上物はシンセの和音の突き刺し、加工した声の断片、効果音。和声は単純か、あるいは存在しない。制作上の要点は、切り刻んだドラムの隙間に生じる微妙な間の設計にあり、この間の取り方が制作者の個性になる。四つ打ち系のハウスやテクノと比べて、リズムそのものが表現の中心にあり、人力の演奏の痕跡が残る点が最大の相違になる。ジャングル、ドラムンベース、ビッグビート、ヌースクールなど多数の派生の共通の土台でもある。</p>
<h2>成り立ち</h2><p>起源は1970年代のニューヨーク、ブロンクスにある。DJのKool Herc(本名Clive Campbell、1955年ジャマイカ生まれ)は、パーティーで観客が最も熱狂するのが、曲の中でドラムだけになる短い部分だと気づいた。そこで彼は同じレコードを2枚用意し、2台のターンテーブルでその数秒を交互に再生することで、無限に引き伸ばす技法を考案した。これがメリーゴーラウンドと呼ばれ、ヒップホップの誕生に直結する。この技法によって切り出される部分こそがブレイクであり、そこで踊る者がブレイクダンサーと呼ばれた。1970年代末から1980年代にかけて、Grandmaster FlashやAfrika Bambaataaがこの技法を洗練させた。1980年代半ばにサンプラーが普及すると、ブレイクを機械で取り込んで自由に加工することが可能になる。ここで決定的な素材となったのが、The Winstonsが1969年に録音した「Amen, Brother」の6秒間のドラム独奏部分で、これはAmen Breakとして史上最も多く使われたサンプルになった。同様にThe Honey Drippersの「Impeach the President」やLyn Collinsの「Think (About It)」も定番素材となった。1990年前後にこの技法がイギリスへ渡り、レイヴ文化と結合した。ハウスやテクノの四つ打ちに飽きた制作者が、ブレイクを高速で再生してハードコア・レイヴを作り、そこからジャングル、ドラムンベースが分岐した。同時期にアメリカでは、より遅いテンポでファンクの質感を保つブレイクビーツが発展し、フロリダのマイアミ・ベースや、後のビッグビートへ繋がった。1990年代後半にはThe Chemical BrothersやFatboy Slimがビッグビートとして大衆的な成功を収め、映画やコマーシャルで大量に使われた。この分野の歴史には、深刻な倫理的問題が付随する。サンプルの原演奏者の多くは報酬をほとんど得ていない。とりわけAmen Breakのドラマー Gregory Cylvester Colemanは生涯を通じて一切の報酬を受け取らず、2006年にホームレス状態で死去したと報じられた。1990年代以降は法的な権利処理が厳格化し、無断サンプリングによる訴訟が相次いだ結果、制作の経済的条件が大きく変化した。現在ブレイクビーツは独立したジャンルであると同時に、電子音楽全般の共通の技法として定着している。</p>
