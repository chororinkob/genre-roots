<h1>Breakbeat（ブレイクビート）とは</h1>
<p>四つ打ちに頼らない系統が多く、拍の配置を崩したドラムパターンを土台とするダンス音楽の総称。中核となるのはブレイクと呼ばれる素材で、1960年代から1970年代のファンクやソウルを中心に、ロックやラテン系も含むレコードから、伴奏が止</p>
<p>四つ打ちに頼らない系統が多く、拍の配置を崩したドラムパターンを土台とするダンス音楽の総称。中核となるのはブレイクと呼ばれる素材で、1960年代から1970年代のファンクやソウルを中心に、ロックやラテン系も含むレコードから、伴奏が止まってドラムだけになる数小節を切り出したものを指す。これをサンプラー（録音を素材として取り込む機械）に取り込み、拍ごとに切り分けて並べ替え、テンポを変えて再生する。この過程で、原曲の演奏者の癖や録音の質感が保たれたまま、まったく別のリズムが生まれる。テンポはおおむね110〜175BPMで、派生ジャンルにはこの範囲に収まらないものもある（ビッグビートは100〜140BPM、ドラムンベースは160〜180BPM前後）。拍の配置は、スネアが2拍4拍に来る系統もあるが、Amen Break（成り立ちで説明する、有名なドラムの素材）のようにスネアの位置そのものをずらした素材も多い。その周囲のキックとゴーストノート（ごく弱く入れる飾りの音）は不規則に散らばり、身体を前後に揺らす歩行感を作る。ベースや上物（メロディーなど上に重ねる音）、和声（コードの響き）は、系統によって大きく異なる。ブレイクビーツ・ハードコアでは、陽気なハウス調のピアノの短いくり返しフレーズ（リフ）とボーカルが特徴で、ジャングルやドラムンベースでは、ダブやレゲエ式のベースの動きが語られる。ほかにファンク由来のサンプルなども使われる。系統によってはサブベース（耳より体に響く極低音）を用いる。制作上の要点は、切り刻んだドラムの隙間に生じる微妙な間の設計にあり、この間の取り方が制作者の個性になる。四つ打ち系のハウスやテクノと比べて、リズムそのものが表現の中心にあり、人力の演奏の痕跡が残る点が最大の相違になる。ジャングル、ドラムンベース、ビッグビート、ヌースクールなど多数の派生の共通の土台でもある。</p>
<h2>成り立ち</h2><p>ブレイクを使う技法の有力な起点は、1970年代のニューヨーク、ブロンクスにある。ダンス音楽のジャンルとしてのブレイクビーツは、1980年代末ごろに形づくられた。DJのKool Herc(本名Clive Campbell、1955年ジャマイカ生まれ)は、パーティーで観客が最も熱狂するのが、曲の中でドラムだけになる短い部分だと気づいた。そこで彼は、2台のターンテーブルを使って、ドラムだけの部分から次のドラムだけの部分へとつないでいく手法を、ほかの人たちとともに広めた先駆者の一人になった。この手法はメリーゴーラウンドと呼ばれる。同じレコードを2枚使って同じ部分を引き伸ばす手法との関係は、資料によって説明が違う。この流れは、ヒップホップの誕生に直結する。この技法によって切り出される部分こそがブレイクであり、そこで踊る者がブレイクダンサーと呼ばれた。1970年代末から1980年代にかけて、Grandmaster FlashやAfrika Bambaataaがこの技法を洗練させた。1980年代半ばにサンプラーが普及すると、ブレイクを機械で取り込んで自由に加工することが可能になる。ここで決定的な素材となったのが、The Winstonsが1969年に録音した「Amen, Brother」の約6〜7秒間（4小節）のドラム独奏部分で、これはAmen Breakとして史上最も広くサンプリングされた音源の一つになった。同様にThe Honey Drippersの「Impeach the President」やLyn Collinsの「Think (About It)」も定番素材となった。1980年代末〜1990年代初頭に米英双方でジャンルが形成され、イギリスではレイヴ文化と結合した。ハウスの四つ打ちに、ヒップホップ由来のブレイクビートを組み合わせて、アメリカから入ってくる音楽に頼らない、イギリス独自のレイヴの音（ブレイクビーツ・ハードコア）が生まれ、そこからジャングル、ドラムンベースが分岐した。アメリカでは、フロリダを中心にFlorida breaksが1990年代前半から半ばにかけて発展した（起こりを1980年代末とする資料もある）。一般に、ビッグビートは英国発のスタイルとされる。1990年代後半にはThe Chemical BrothersやFatboy Slimがビッグビートとして大衆的な成功を収め、とくにFatboy Slimの曲は、広告・映画・テレビで多く使われた。この分野の歴史には、深刻な倫理的問題が付随する。サンプルの原演奏者の多くは報酬をほとんど得ていない。とりわけAmen Breakのドラマー Gregory C. Coleman（Cylvesterと表記する資料もある）はサンプリング使用に対する印税を受け取らず、2006年にホームレス状態で死去したと報じられた。1990年代以降は法的な権利処理が厳格化し、無断サンプリングによる訴訟が相次いだ結果、制作の経済的条件が大きく変化した。現在ブレイクビーツは独立したジャンルであると同時に、電子音楽全般の共通の技法として定着している。</p>
