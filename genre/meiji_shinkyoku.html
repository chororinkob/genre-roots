<h1>Meiji Shinkyokuとは</h1>
<p>明治新曲は、箏が歌を支え、2台の箏が掛け合う明治期の都市の室内音楽だ。代表曲22曲を動画で聴け、ルーツと影響のつながりを地図でたどれる。</p>
<p>明治新曲は、箏が歌を支え、2台の箏が掛け合う明治期の都市の室内音楽だ。江戸の箏曲の型を残したまま、三味線を外して箏だけで歌を運ぶ点が大きい。

主役は13弦の箏だ。曲の多くは本手と替手の2台で組まれ、低い側の箏が伴奏と拍を受け持つ。三弦や尺八、胡弓が加わる曲もある。

調弦は平調子や雲井調子を土台に組み替えられ、陽音階の明るい5音が前に出る。半音を避けた音並びなので、和音を厚く積まず、2台の音が重なって澄んだ響きをつくる。歌と同じ旋律を少しずらして重ねる箇所も多い。

拍は8拍をひとまとまりとして進む。歌の部分はゆったり運び、手事と呼ばれる間奏でテンポが上がり、箏が細かい刻みを刻む。

箏は押し手で音を動かし、後押しで余韻を揺らす。スクイや掻き爪で拍の頭を打ち、ハジキで軽い音を跳ねさせる。楯山登の曲ではツルシャンと呼ばれる左手の和音伴奏が鳴る。

歌は地歌の節回しを残した抑揚で、語りに近い。声を張り上げず、言葉の意味を立てて歌う。

歌詞は御国の誉のように国威をうたうもの、新聞紙のように世相を写すもの、嵯峨の秋や新高砂のように平家物語や謡曲から取るものに分かれる。

形は前唄、歌、手事、後唄の順に進む手事物が中心だ。長い変奏を積む昔の段物より短く、歌が先に立つ。地歌のように三味線が旋律を引っぱるのではなく、2台の箏が主役を分け合う点がはっきり違う。鳴る場所は座敷や稽古場、学校の演奏会で、2挺の箏を向かい合わせ、着物の奏者が正座して弾く。</p>
<h2>成り立ち</h2><p>1871年、盲人の音楽家を束ねていた当道が解体され、箏曲の世界は拠りどころを失った。身分制度の廃止と、西洋音楽を学校へ入れる動きが重なり、演奏家は各地で伝承と新しい収入源を探すことになる。

転機は大阪から来た。1875年、地歌業仲間が結成されると、三味線を外し、箏の伴奏だけで歌を聞かせる歌曲が作られ始める。中心は菊高検校（1838年頃〜1888年）と菊塚与市（1846〜1909）だ。菊高は御国の誉や新聞紙を残した。新聞紙では三弦を2上がり、箏を平調子に取って手事物の形に仕立てている。

同じ頃、京都では1878年に京都盲啞院と、その教員が集まった京都当道会が動き出し、古い型を守ったままの新曲を作った。名古屋では小松景和（1847〜1915）が国風音楽講習所を開いている。西洋音楽と中国音楽が入ってきたことで調弦が作り替えられ、明るく活気のある曲が好まれた。

東京では1879年に文部省が音楽取調掛を置き、山田流の初世山勢松韻（1845〜1908）らが職に就いた。彼らは基礎的な箏曲を五線譜にして箏曲集を刊行する。1890年、山勢松韻は東京音楽学校の新築開校式のために都の春を作曲した。山田流の奥手事物で、箏と歌が長く続くこの曲は、学校という新しい場所へ箏曲を連れて行った代表作になった。

この時期の音は、明治中期まで流行した明清楽の影響を受けた、陽音階寄りの調弦に支えられている。歌詞も江戸の遊里の情趣から離れ、御国の誉のような国威、新聞紙のような世相、竹雪の曲のように勅題の和歌へと向かった。

明治新曲の美学を最も強く押し進めたのが楯山登（1876〜1926）だ。大阪の箏曲家で、左手で和音を鳴らすツルシャン物を広め、金剛石や1907年の時鳥の曲を書いた。フィリップ・フラヴィンが2010年の論文で指摘したのは、彼が西洋の軍楽と鍵盤音楽から主題を持ち込み、箏曲の近代化を始めたという点である。同時にフラヴィンは、そうした曲が都市の中産層の好みに寄りかかったため、人気とは裏腹に芸術的な評価を下げたとも書いている。

初期の作曲家たちは前近代の作曲の型から離れなかった。その保守性がかえって曲を長く弾き継がせる力になった、とフラヴィンは論じる。だが同じ人々が大衆向けに音楽を開いたことで、箏曲地歌の美学は根本から変わり、音楽そのものの捉え方も作り替えられた。その変化が、宮城道雄（1894〜1956）による新日本音楽、つまり洋楽の形式を本格的に取り入れる動きへつながっていく。

現在、明治新曲として弾かれる曲の多くは、初期の作曲家か、その型を守り続けた人の作品だ。生田流と山田流の古典曲として座敷や舞台に残り、日本伝統文化振興財団の箏曲地歌大系では第3巻が明治新曲と山田流箏曲に割かれている。</p>
