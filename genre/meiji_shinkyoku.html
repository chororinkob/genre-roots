<h1>Meiji Shinkyokuとは</h1>
<p>明治新曲は、2台の箏が掛け合いながら歌を支える、明治期の都市の室内音楽だ。代表曲22曲を動画で聴け、ルーツと影響のつながりを地図でたどれる。</p>
<p>明治新曲は、2台の箏が掛け合いながら歌を支える、明治期の都市の室内音楽だ。江戸の箏曲の型を残しながら、箏の伴奏だけで聞かせる歌曲として作られ始めた点が大きな特徴だ。

主役は13弦の箏だ。曲の多くは、本手と替手が組む2台編成で演奏される。本手と替手のどちらが高い音域か低い音域かは、曲や流派によって決まる。三弦や尺八、胡弓が加わる曲もある。

調弦は曲によって違う。平調子や雲井調子を使う曲もあれば、明清楽の影響を受けた陽音階ふうの調弦（楽調子やカンカン調子など）を使う曲もある。調弦によっては半音を含まない曲もあり、御国の誉はその例だ。2台の音が重なり合って、澄んだ響きをつくる。本手と替手が、それぞれ別の旋律を合わせることも多い。

歌の部分はゆったりと運ばれ、手事と呼ばれる間奏に入るとテンポが上がり、箏が細かい刻みを刻む。

箏の奏法も多彩だ。押し手で音の高さを動かし、後押しで弾いた後の音程を押し上げる。スクイ爪で同じ音を連続させ、掻き爪で隣り合う2弦を弾き、ハジキで軽い音を跳ねさせる。楯山登の曲では、ツルシャンと呼ばれる左手の和音式伴奏とされる。

歌い方は、地歌の節回しを残した抑揚で、言葉の意味を伝えることを大事にして歌う。

歌詞は、御国の誉のように国の威光をうたうもの、新聞紙のように世の中の様子を写すもの、嵯峨の秋や新高砂のように平家物語や謡曲から題材を取るものに分かれる。

曲の形は、前唄、手事、後唄の順に進む手事物が中心だ。段物は器楽だけの曲で、明治新曲は歌が入る手事物の形という違いがある。地歌では三味線が旋律を引っぱるのに対し、明治新曲では2台の箏が主役を分け合う点がはっきり違う。演奏される場所は座敷や稽古場、学校の演奏会などで、2面の箏で合奏する。奏者は着物姿で正座して弾く。</p>
<h2>成り立ち</h2><p>1871年、盲人の音楽家たちを束ねていた当道が解体された。西洋の文化を取り入れた音楽教育への見直しなどが起こり、箏曲の世界は大きな転機を迎える。演奏家たちは、それぞれの土地で伝承の活動を続けた。

転機は大阪からやってきた。1875年に地歌業仲間が結成されると、三味線を外し、箏の伴奏だけで歌を聞かせる歌曲が作られ始める。中心になったのは、菊高検校（1838年頃〜1888年）と菊塚与市（与一とも、1846〜1909）だ。菊高は御国の誉や新聞紙を残した。新聞紙は三弦を2上がりにし、箏を平調子に取って、手事物の形に仕立てた曲である。

同じ頃、京都でも動きがあった。1878年に京都盲啞院と、その教員たちが集まった京都当道会が立ち上がり、古い型を守ったままの新曲を作っていく。名古屋では、小松景和（1847〜1915）が国風音楽講習所を開いた。西洋音楽と中国音楽が入ってきたことで調弦が作り替えられ、明るく活気のある曲が好まれるようになった。

東京では1879年、文部省が音楽取調掛を置いた。山田流の三世山勢松韻（1845〜1908）は1880年にそこに職を得た。彼らは基礎的な箏曲を五線譜に書き起こし、箏曲集として刊行する。1890年、山勢松韻は東京音楽学校の新築開校式のために都の春を作曲した。山田流の奥手事物にあたるこの曲は、長い手事（器楽部）を持ち、学校という新しい場所へ箏曲を連れて行った代表作になった。

この時期の音は、明治中期まで流行した明清楽の影響を受けた、陽音階寄りの調弦に支えられていた。歌詞もまた、江戸の遊里の情趣から離れ、御国の誉のような国の威光、新聞紙のような世の中の様子、竹雪の曲のような勅題の和歌へと向かっていく。

明治新曲の流れから離れ、箏曲の近代化の起点になったのが楯山登（1876〜1926）だ。大阪の箏曲家で、左手で和音を鳴らすツルシャン物を世に広め、金剛石や時鳥の曲（1901年説・明治39年頃説がある）を書いた。フィリップ・フラヴィンは2010年の論文で、彼が西洋の軍楽や鍵盤音楽から主題を持ち込み、箏曲の近代化を始めたと指摘している。同時にフラヴィンは、大衆的なブルジョワ文化に頼ったため、人気は高かったが美的価値は弱まったとも書いている。

初期の作曲家たちは、前近代の作曲の型から離れなかった。その保守性がかえって、曲を長く弾き継がせる力になったとフラヴィンは論じている。だが、同じ人々が大衆向けに音楽を開いたことで、箏曲地歌の美学は根本から変わり、音楽そのものの捉え方も作り替えられていった。その変化が、宮城道雄（1894〜1956）による新日本音楽、つまり洋楽の形式を本格的に取り入れる動きへとつながっていく。

現在、明治新曲として弾かれている曲の多くは、初期の作曲家か、その型を守り続けた人たちの作品だ。生田流と山田流の古典曲として座敷や舞台に残り、日本伝統文化振興財団の箏曲地歌大系では、第3巻が明治新曲と山田流箏曲に割かれている。</p>
