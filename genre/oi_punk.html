<h1>Oi!（オイパンク）とは</h1>
<p>労働者階級の若者が、装飾を削ぎ落として合唱するために作ったパンク。演奏は極端に単純で、少ない和音を歪んだギターがダウンピッキング（ピックを下へ振り下ろす弾き方）で刻み、ベースは単純な動きで支え、ドラムは2拍4拍のスネアをまっすぐ叩</p>
<p>労働者階級の若者が、装飾を削ぎ落として合唱するために作ったパンク。演奏は極端に単純で、少ない和音を歪んだギターがダウンピッキング（ピックを下へ振り下ろす弾き方）で刻み、ベースは単純な動きで支え、ドラムは2拍4拍のスネアをまっすぐ叩く。テンポは速いが、後のハードコアほど暴走せず、足を踏み鳴らして付いていける速度に留められている。技巧的なソロはほぼ排され、間奏があってもリフの反復で埋められる。決定的なのは合唱で、サビでは複数の男声が声を揃えて怒鳴り、しばしばサッカーの応援歌そのままの節回しになる。オイ、オイ、オイという掛け声がジャンル名の由来で、実際に曲の中で観客と一緒に叫ばれる。歌詞は生活そのものを題材にしたものが中心で（政治色の強いバンドもある）、失業、警察への反発、パブでの喧嘩、サッカー、仲間との連帯、階級への誇りが平易な言葉で歌われる。歌唱は歌うというより演説か怒鳴りに近い。初期パンクの知的・芸術的な傾向への反発という面もあり、そこから距離を取って労働者の音楽であることを強調した点が本質的な違いである。ライブは狭いパブが基本で、観客と演奏者の境目がない。</p>
<h2>成り立ち</h2><p>1970年代後半のイギリスで形成され、1980年に呼称が定着した。1976年から77年のパンクは急速に商業化と芸術志向に傾き、知的・芸術的な傾向への反発の声も出た。これに対し、ロンドン東部（East End）を中心に英国各地で、労働者階級の若者が、自分たちの言葉で歌えるパンクを求めた。名称を与えたのは音楽誌Sounds の記者Garry Bushellで、1980年、Cockney Rejectsの曲に頻出する掛け声からオイ!という語を採り、一連のバンドをまとめる呼び名として使い、同年のコンピレーション『Oi! The Album』を編纂した。中心的なバンドはSham 69、Cockney Rejects、Angelic Upstarts、The 4-Skins、The Business、Last Resortなどで、多くがスキンヘッドの装いをしていた。この装いは元来、1960年代の労働者階級の若者がジャマイカ移民のスカやレゲエを愛好したところから生まれた、人種混交的な文化だった。ところが1970年代末から極右政党の国民戦線がこの層への浸透を図り、公演に人種差別主義者が集まるようになる。決定打は1981年7月3日、ロンドン西部サウソールのパブHambrough Tavernで開かれたThe 4-Skinsらの公演で、集まった観客と地元の南アジア系住民との間に暴動が発生し、建物が全焼した。この事件で報道は、Oi!が極右と結び付いているという主張を強め、バンドは反ファシズムを表明する対応を迫られた。当事者の多くは人種差別を否定し、Angelic Upstartsのように当初から左派色の強いバンドや、Redskinsのように事件後に登場した反ファシズム・バンドもあり、Skinheads Against Racial Prejudiceという運動も生まれた。音楽的な系譜はドイツ、フランス、アメリカのストリートパンクやハードコアへ受け継がれ、Dropkick MurphysやRancidにその痕跡が残っている。</p>
<h2>代表曲</h2><ul><li>If the Kids Are United（Sham 69）</li><li>We're Coming Back (Cock Sparrer)</li><li>I'm Forever Blowing Bubbles (Cockney Rejects)</li><li>Oi! Oi! Oi!（Cockney Rejects）</li><li>Chaos（The 4-Skins）</li><li>The Gauntlet（Dropkick Murphys）</li><li>England Belongs to Me (Cock Sparrer)</li><li>Hurry Up Harry (Sham 69)</li><li>Harry May (The Business)</li><li>Police Car (Cockney Rejects)</li><li>Two Million Voices (Angelic Upstarts)</li></ul>
