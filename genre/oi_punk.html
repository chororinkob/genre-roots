<h1>Oi!（オイパンク）とは</h1>
<p>労働者階級の若者が、装飾を削ぎ落として合唱するために作ったパンクだ。 演奏は極端に単純である。歪んだギターは、パワーコード主体で単純なリフを鳴らす。ベースは単純な動きで支える。ドラムは2拍4拍のスネアをまっすぐ叩く。 テンポは速い</p>
<p>労働者階級の若者が、装飾を削ぎ落として合唱するために作ったパンクだ。

演奏は極端に単純である。歪んだギターは、パワーコード主体で単純なリフを鳴らす。ベースは単純な動きで支える。ドラムは2拍4拍のスネアをまっすぐ叩く。

テンポは速い。同時期のハードコアとも、並行・交差しながら発展した。技巧的なソロはほぼ排され、間奏があってもリフの反復で埋められる。

決定的なのは合唱だ。サビでは複数の男声が声を揃えて怒鳴る。サッカーの応援歌風のコーラスが特徴である。歌唱は歌うというより、演説か怒鳴りに近い。

ジャンル名の由来は、Cockney Rejectsのボーカルが曲の頭でカウント代わりに叫んだ「Oi!」である。

歌詞は生活そのものを題材にしたものが中心で（政治色の強いバンドもある）、平易な言葉で歌われる。題材は、失業、警察への反発、パブでの喧嘩、サッカー、仲間との連帯、階級への誇りなどだ。

初期パンクの知的・芸術的な傾向への反発という面もある。そこから距離を取って、労働者の音楽であることを強調した点が本質的な違いである。ライブは、パブなど小規模な会場での公演が多かった。</p>
<h2>成り立ち</h2><p>1970年代後半のイギリスで形成され、1980年に呼称が定着した。

1970年代後半、パンクの商業化・知的化への反発があったとされる。これに対し、ロンドン東部（East End）を中心に英国各地で、労働者階級の若者が、自分たちの言葉で歌えるパンクを求めた。

名称を与えたのは、音楽誌Sounds の記者Garry Bushellである。1980年、Cockney Rejectsのボーカルが曲の頭でカウント代わりに叫んだ「Oi!」から、オイ!という語を採った。そして一連のバンドをまとめる呼び名として使い、同年のコンピレーション『Oi! The Album』を編纂した。

Sham 69は、のちにOi!の源流とみなされたバンドである。中心的なバンドは、Cockney Rejects、Angelic Upstarts、The 4-Skins、The Business、Last Resortなどだ。スキンヘッド文化と結び付いたバンドも多かった。

この装いは元来、1960年代の労働者階級の若者が、モッズやルードボーイ文化の影響を受け、スカ、ロックステディ、レゲエを聴いたところから生まれた。人種混交的な文化だった。ところが1970年代末から、極右の国民戦線やBritish Movementがこの層への浸透を図り、公演に人種差別主義者が集まるようになる。

決定打は、1981年7月3日（資料により4日とするものもある）である。ロンドン西部サウソールのパブHambrough Tavernで、The 4-Skinsらの公演が開かれた。集まった観客と地元の南アジア系住民との間に暴動が発生し、建物が全焼した。この事件で報道は、Oi!が極右と結び付いているという主張を強めた。バンドは反ファシズムを表明する対応を迫られた。

当事者の多くは人種差別を否定した。Angelic Upstartsのように当初から左派色の強いバンドや、Redskinsのように事件後に登場した反ファシズム・バンドもあった。のちに1987年、ニューヨークでSkinheads Against Racial Prejudiceという運動も生まれた。

大陸ヨーロッパや北米へ広がり、Dropkick MurphysやRancidにその痕跡が残っている。</p>
