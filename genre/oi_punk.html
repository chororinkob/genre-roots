<h1>Oi!（オイパンク）とは</h1>
<p>労働者階級の若者が、装飾を削ぎ落として合唱するために作ったパンク。演奏は極端に単純で、三つか四つの和音を歪んだギターがダウンピッキングで刻み、ベースはルート音を八分で追い、ドラムは二拍四拍のスネアをまっすぐ叩く。テンポは毎分160</p>
<p>労働者階級の若者が、装飾を削ぎ落として合唱するために作ったパンク。演奏は極端に単純で、三つか四つの和音を歪んだギターがダウンピッキングで刻み、ベースはルート音を八分で追い、ドラムは二拍四拍のスネアをまっすぐ叩く。テンポは毎分160から190拍程度と速いが、後のハードコアほど暴走せず、足を踏み鳴らして付いていける速度に留められている。技巧的なソロはほぼ排され、間奏があってもリフの反復で埋められる。決定的なのは合唱で、サビでは複数の男声が声を揃えて怒鳴り、しばしばサッカーの応援歌そのままの節回しになる。オイ、オイ、オイという掛け声がジャンル名の由来で、実際に曲の中で観客と一緒に叫ばれる。歌詞は政治的な理念よりも生活そのもので、失業、警察への反発、パブでの喧嘩、サッカー、仲間との連帯、階級への誇りが平易な言葉で歌われる。歌唱は歌うというより演説か怒鳴りに近い。同時代のパンクが芸術学校出身者の実験に向かった流れへの反発として生まれており、そこから距離を取って労働者の音楽であることを強調した点が本質的な違いである。ライブは狭いパブが基本で、観客と演奏者の境目がない。</p>
<h2>成り立ち</h2><p>生まれたのは1970年代末のイギリスである。1976年から77年のパンクは急速に商業化と芸術志向に傾き、美術学校出身のバンドや音楽誌の言説が中心になっていった。これに対し、ロンドン東部やバーミンガム、グラスゴーといった工業都市の労働者階級の若者が、自分たちの言葉で歌えるパンクを求めた。名称を与えたのは音楽誌Sounds の記者Garry Bushellで、1980年、Cockney Rejectsの曲に頻出する掛け声からオイ!という語を採り、一連のバンドをまとめる呼び名として使い、同年のコンピレーション『Oi! The Album』を編纂した。中心的なバンドはSham 69、Cockney Rejects、Angelic Upstarts、The 4-Skins、The Business、Last Resortなどで、多くがスキンヘッドの装いをしていた。この装いは元来、1960年代の労働者階級の若者がジャマイカ移民のスカやレゲエを愛好したところから生まれた、人種混交的な文化だった。ところが1970年代末から極右政党の国民戦線がこの層への浸透を図り、公演に人種差別主義者が集まるようになる。決定打は1981年七月三日、ロンドン東部サウソールのパブHambrough Tavernで開かれたThe 4-Skinsらの公演で、集まった観客と地元の南アジア系住民との間に暴動が発生し、建物が全焼した。この事件で報道はオイをネオナチの音楽と断じ、シーンは事実上壊滅した。当事者の多くは人種差別を否定し、後年にはRedskinsやAngelic Upstartsのように明確に反ファシズムを掲げるバンドが出て、Skinheads Against Racial Prejudiceという運動も生まれた。音楽的な系譜はドイツ、フランス、アメリカのストリートパンクやハードコアへ受け継がれ、Dropkick MurphysやRancidにその痕跡が残っている。</p>
<h2>代表曲</h2><ul><li>If the Kids Are United（Sham 69）</li><li>Oi! Oi! Oi!（Cockney Rejects）</li><li>Chaos（The 4-Skins）</li><li>The Gauntlet（Dropkick Murphys）</li></ul>
