<h1>Old School Hip Hop（オールドスクールヒップホップ）とは</h1>
<p>オールドスクール・ヒップホップは、おおよそ1973年から1983年にかけての、ヒップホップが形を得たばかりの時期のスタイルだ。 土台になるのはブレイクビーツ（レコードの打楽器だけの部分）である。ディスコやファンクのレコードから、歌</p>
<p>オールドスクール・ヒップホップは、おおよそ1973年から1983年にかけての、ヒップホップが形を得たばかりの時期のスタイルだ。

土台になるのはブレイクビーツ（レコードの打楽器だけの部分）である。ディスコやファンクのレコードから、歌のない打楽器だけの間奏部分を抜き出す。同じ盤を2枚使い、2台のターンテーブル（レコードプレーヤー）で交互につなぐ。こうして、その数秒を無限に引き延ばす。

楽器はローランドTR-808やOberheim DMXなどのドラムマシン、単音のシンセベースである。初期の録音物は生バンドによるブレイクの再演が中心だった。1982年の「Planet Rock」以降は、TR-808などのエレクトロ路線が主流になった。

テンポは100から120 BPM程度の中程度のテンポで、はっきり踊れる速度に置かれている。

ここにMCが声を乗せる。当時のラップは、踊り手を煽るための呼びかけが中心だった。押韻（韻を踏むこと）は行末で素直にそろえられ、単純なリズム、少ない音節数の譜割り（言葉の割り振り）である。

歌詞の主題は、自慢、パーティーの描写、司会としての挨拶が中心だ。1980年には社会的な主題を扱う曲もあり、『The Message』（1982年）が社会批評を広く知らしめた。

ライブ・パフォーマンスやMCバトルを録音したテープが流通した。服装や踊り、壁への落書きと一体で語られた点も、音だけで完結しないこの時期の特色である。</p>
<h2>成り立ち</h2><p>出発点の目印とされるのは、1973年8月11日の夜だ。場所はニューヨーク市ブロンクス区セジウィック通り1520番地の集合住宅の集会室である。ジャマイカ出身の18歳Clive Campbellが、DJ Kool Hercの名で、妹の新学期パーティーの音楽係を務めた。

彼は、客が最も盛り上がるのが曲の打楽器だけの部分だと気づいた。そこでブレイクを繰り返し使い始め、やがて同じレコードを2枚用意して交互につなぐメリーゴーラウンドという技を編み出した。

ブロンクスは当時、荒廃地帯だった。高速道路建設で地域が分断され、家主による放火保険目当ての焼き討ちが横行し、ギャング抗争が続いていた。元ギャング構成員のAfrika Bambaataaは、暴力の代わりに音楽と踊りで競わせる組織Universal Zulu Nationを作った。ドイツのKraftwerkのレコードまでかけて、音の幅を広げた。

Grandmaster Flashは、指で盤を戻すバックスピンや、クレヨン等でレコードに印を付けてブレイクの位置を管理するなどの技術を体系化した。この一連の技法はクロック・セオリー（clock theory）とも呼ばれるが、定義は資料により異なる。Grand Wizzard Theodoreは、偶然からスクラッチを発見した。

レコードとして最初の大ヒットは、ニュージャージーのSugar Hill Recordsが1979年に出したThe Sugarhill Gangの『Rapper's Delight』だった。Chicの『Good Times』の演奏をスタジオミュージシャンに再現させた、12インチ盤では約14分半の曲である。初期のラッパーやDJの一部から、本場の世界の出身者ではないと見られた。しかし、これが世界にヒップホップの存在を知らせた。

1982年、Grandmaster Flash and the Furious Fiveの『The Message』が、貧困とスラムの日常を描いた。社会批評を広く知らしめた曲である（Grandmaster Flash自身は録音に参加していないとされる）。翌年のRun-D.M.C.は、デビュー・シングル（1983年）でこの時代を古いものにした。このシングルはニュースクールの幕開けとされる。以後、この初期のスタイルはオールドスクールと呼ばれるようになる。

Kool Hercは当初、商業録音に進まなかった。2011年には無保険のまま手術費を払えず、募金が呼びかけられた。</p>
<h2>代表曲</h2><ul><li>Walk This Way (Run-D.M.C.)</li><li>Fight for Your Right (Beastie Boys)</li><li>The Show (Doug E. Fresh &amp; Slick Rick)</li><li>Rock Box (Run-D.M.C.)</li><li>The Breaks (Kurtis Blow)</li><li>White Lines (Don't Don't Do It) (Grandmaster Flash &amp; Melle Mel)</li><li>Sucker MCs (Run-D.M.C.)</li><li>Rock the Bells (LL Cool J)</li><li>My Adidas (Run-D.M.C.)</li><li>Roxanne, Roxanne (UTFO)</li><li>I Can't Live Without My Radio (LL Cool J)</li><li>King of Rock (Run-D.M.C.)</li></ul>
