<h1>Old School Hip Hop（オールドスクールヒップホップ）とは</h1>
<p>1970年代末から80年代半ばにかけての、ヒップホップが形を得たばかりの時期の様式。土台になるのはブレイクビーツで、ディスコやファンクのレコードから歌のない打楽器だけの間奏部分を抜き出し、同じ盤を二枚使って二台のターンテーブルで交</p>
<p>1970年代末から80年代半ばにかけての、ヒップホップが形を得たばかりの時期の様式。土台になるのはブレイクビーツで、ディスコやファンクのレコードから歌のない打楽器だけの間奏部分を抜き出し、同じ盤を二枚使って二台のターンテーブルで交互につなぎ、その数秒を無限に引き延ばす。ここにMCが声を乗せるが、当時のラップは踊り手を煽るための呼びかけが中心で、押韻は行末で素直にそろえられ、拍の頭にほぼ正確に乗る単純明快な譜割りである。声色は明るく張りがあり、後年のような低く沈んだ語りではない。楽器はローランドTR-808やリンLM-1といったドラムマシン、単音のシンセベース、そしてディスコバンドの生演奏をそのまま使う場合もあった。テンポは毎分100から120拍程度と速めで、はっきり踊れる速度に置かれている。掛け合いや観客への合いの手が曲の大半を占め、曲そのものより現場の熱を記録した長時間の録音が流通した。歌詞の主題は自慢、パーティーの描写、司会としての挨拶が中心で、後に社会批評が入ってくるのは1982年以降である。服装や踊り、壁への落書きと一体で語られた点も、音だけで完結しないこの時期の特色である。</p>
<h2>成り立ち</h2><p>始まりは1973年八月11日、ニューヨーク市ブロンクス区セジウィック通り一五二〇番地の集合住宅の集会室で、ジャマイカ出身の18歳Clive CampbellがDJ Kool Hercの名で妹の新学期パーティーの音楽係を務めた夜とされている。彼は客が最も盛り上がるのが曲の打楽器だけの部分だと気づき、同じレコードを二枚用意して交互につなぐメリーゴーラウンドという技を編み出した。ブロンクスは当時、高速道路建設で地域が分断され、家主による放火保険目当ての焼き討ちが横行し、ギャング抗争が続く荒廃地帯だった。元ギャング構成員のAfrika Bambaataaは、暴力の代わりに音楽と踊りで競わせる組織Universal Zulu Nationを作り、ドイツのKraftwerkのレコードまでかけて音の幅を広げた。Grandmaster Flashは指で盤を戻すバックスピンや、針を落とす位置を印で管理するクロックシアターといった技術を体系化し、Grand Wizzard Theodoreが偶然からスクラッチを発見した。レコードとして最初に広く売れたのはニュージャージーのSugar Hill Recordsが1979年に出したThe Sugarhill Gangの『Rapper's Delight』で、Chicの『Good Times』の演奏をスタジオミュージシャンに再現させた14分の曲だった。現場の当事者たちはこの曲を素人の便乗と冷ややかに見たが、これが世界にヒップホップの存在を知らせた。1982年、Grandmaster Flash and the Furious Fiveの『The Message』が貧困とスラムの日常を描いて主題を一変させ、翌年のRun-D.M.C.はドラムマシンとギターだけの痩せた音でこの時代を過去にした。以後、この初期様式はオールドスクールと呼ばれるようになる。Kool Hercは印税を得ることなく生活に困窮し、2011年には医療費のための募金が呼びかけられた。</p>
<h2>代表曲</h2><ul><li>Walk This Way (Run-D.M.C.)</li><li>Sucker MCs (Run-D.M.C.)</li><li>The Breaks (Kurtis Blow)</li><li>I Can't Live Without My Radio (LL Cool J)</li><li>Fight for Your Right (Beastie Boys)</li></ul>
