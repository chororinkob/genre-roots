<h1>Funk（ファンク）とは</h1>
<p>1拍目を強烈に強調する「ザ・ワン」と、細かく刻む16分音符のノリが支配する黒人ダンス音楽。和声（コードの響き）はほとんど動かず、E7やD9のような一つのコード（和音）を何分も引き伸ばしたまま、リズムの隙間の作り方だけで曲を進める。</p>
<p>1拍目を強烈に強調する「ザ・ワン」と、細かく刻む16分音符のノリが支配する黒人ダンス音楽。和声（コードの響き）はほとんど動かず、E7やD9のような一つのコード（和音）を何分も引き伸ばしたまま、リズムの隙間の作り方だけで曲を進める。ベースは弦を親指で叩き、人差し指で引っ張るスラップ奏法で打楽器のような音を出し、ギターは短い刻みを裏拍（拍と拍の間）に置くカッティングを担い、ワウペダルで音色をうねらせる。ドラムはスネアを2拍目・4拍目に置きつつ、ハイハットとバスドラムで細かい16分のシンコペーション（拍をずらして強調するリズム）を織り、あえて弱く叩くゴースト・ノートの隙間が前へ進む力になる。ホーンセクションは複数の管が同じ短いフレーズを鋭く吹く「スタブ（短く刺す音）」で打点を足す。クラヴィネットやFender Rhodesの電気鍵盤、後年はMinimoogのベース音が加わる。ボーカルは歌うというより叫び、うめき、掛け声を差し挟むシャウト中心で、テンポは95〜115BPMほどが目安で、他のポピュラー音楽より遅めのことが多い。ソウルが旋律と歌詞で聴かせるのに対し、ファンクは旋律を犠牲にしてでも身体を動かす反復を優先する点が決定的に違う。</p>
<h2>成り立ち</h2><p>1960年代半ば、ソウルとR&amp;Bの内側から生まれた。転換点の一つは1965年、James Brownの「Papa's Got a Brand New Bag」で、ファンク初の大ヒットとなった。彼は12小節ブルースの形式は保ったまま、バンド全員を打楽器のように扱い、すべての強調を小節の1拍目——彼が「ザ・ワン」と呼んだ点——に集める指示を出した。1967年の「Cold Sweat」でこの方法は完成し、和声（コードの響き）がほぼ動かないまま数分間ノリだけが続く曲が成立する。1969年に録音され1970年にリリースされた「Funky Drummer」でのClyde Stubblefieldのドラム・ブレイクは、のちにヒップホップで最も多くサンプリングされたブレイクの一つとなったが、Stubblefield本人に印税は支払われなかった。同じ1970年、若きベーシストBootsy Collinsがブラウンのバンドに加入し、跳ねるベースラインの型を作る。サンフランシスコではSly and the Family Stoneが人種も性別も混成の編成で活動し、1971年の「There's a Riot Goin' On」に公民権運動後の幻滅と薬物による荒廃をそのまま刻み込んだ。ニューオーリンズではThe Metersが、地元のブラスバンド行進に付随するセカンドラインのリズムを取り込んだ簡潔で癖のあるファンクを演奏した。1970年代半ば、George Clintonが率いたParliamentとFunkadelicの二枚看板は、SF的な神話と舞台に降りてくる宇宙船「マザーシップ」を伴う巨大なショーを展開し、1975年の「Mothership Connection」で、宇宙を舞台にしたアフロフューチャリズムの世界を描いた。ここに元ブラウン一派のBootsy CollinsやMaceo Parkerが合流し、Pファンクという一大流派になる。1970年代末にディスコが市場を覆うと大所帯のファンクバンドは居場所を失い、1980年代にはシンセサイザーとドラムマシンで作るエレクトロ・ファンク（電子楽器を使ったファンク）やブギー（ノリの良いダンス音楽）へ形を変えた。だが1980年代後半、サンプラーを手にしたヒップホップの制作者たちが古いファンクのレコードを掘り返し、ブレイクを素材として再生させたことで、ファンクは黒人音楽の共有財産として2度目の生を得た。</p>
