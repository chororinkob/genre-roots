<h1>Funk（ファンク）とは</h1>
<p>1拍目を強烈に強調する「ザ・ワン」と、細かく刻む16分音符のノリが支配する黒人ダンス音楽。和声（コードの響き）はほとんど動かず、E7やD9のような一つか二つのコード（和音）を繰り返したまま、リズムの隙間の作り方で曲を進めることが多</p>
<p>1拍目を強烈に強調する「ザ・ワン」と、細かく刻む16分音符のノリが支配する黒人ダンス音楽。和声（コードの響き）はほとんど動かず、E7やD9のような一つか二つのコード（和音）を繰り返したまま、リズムの隙間の作り方で曲を進めることが多い。ベースは弦を親指で叩き、人差し指で引っ張るスラップ奏法で打楽器のような音を出し、ギターは短い刻みを裏拍（拍と拍の間）に置くカッティングを担い、ワウペダルで音色をうねらせる。ドラムはスネアを2拍目・4拍目に置きつつ、ハイハットとバスドラムで細かい16分のシンコペーション（拍をずらして強調するリズム）を織り、あえて弱く叩くゴースト・ノートの隙間が前へ進む力になる。ホーンセクションは複数の管が同じ短いフレーズを鋭く吹く「スタブ（短く刺す音）」で打点を足す。クラヴィネットやFender Rhodesの電気鍵盤、後年はMinimoogのベース音が加わる。ボーカルは歌うというより叫び、うめき、掛け声を差し挟むシャウト中心で、テンポは90〜120BPM前後の曲が多く、他のポピュラー音楽より遅めのことが多い。ソウルが旋律と歌詞で聴かせるのに対し、ファンクは旋律よりも、身体を動かすノリ（グルーヴ）を前に出す点が特徴である。</p>
<h2>成り立ち</h2><p>1960年代半ば、ソウルとR&amp;Bの内側から生まれた。転換点の一つは1965年、James Brownの「Papa's Got a Brand New Bag」で、最初のファンクの録音ではないが、ファンク初の大ヒットとなった。彼は12小節ブルースの形式は保ったまま、バンド全員を打楽器のように扱い、強調を小節の1拍目——彼が「ザ・ワン」と呼んだ点——に大きく寄せる指示を出した。1967年の「Cold Sweat」は、最初の本格的なファンク曲とされることがある。和声（コードの響き）がほぼ動かないまま数分間ノリだけが続く曲が、ここで成り立った。1969年に録音され1970年にリリースされた「Funky Drummer」でのClyde Stubblefieldのドラム・ブレイクは、のちにヒップホップで最も多くサンプリングされたブレイクの一つとなったが、Stubblefield本人に印税は支払われなかった。同じ1970年、若きベーシストBootsy Collinsがブラウンのバンドに加入し、跳ねるベースラインの型を作る。サンフランシスコではSly and the Family Stoneが人種も性別も混成の編成で活動し、1971年の「There's a Riot Goin' On」には、公民権運動の勢いが弱まった60年代末の空気のなかで、失望や薬物、仲間うちの争いが表れた。ニューオーリンズではThe Metersが、地元のブラスバンド行進に付随するセカンドラインのリズムを取り込んだ簡潔で癖のあるファンクを演奏した。1970年代半ば、George Clintonが率いたParliamentとFunkadelicの二枚看板は、SF的な神話を作り上げた。Parliamentは1975年のアルバム「Mothership Connection」で、宇宙を舞台にしたアフロフューチャリズムの世界を描き、翌1976年のツアーでは、舞台に降りてくる宇宙船「マザーシップ」を伴う巨大なショーを見せた。元ブラウン一派のBootsy Collinsは1972年に、Maceo Parkerは1975年に、Clintonの仲間に加わっていて、Pファンクと呼ばれる大きな流れになっていった。1980年代になると、シンセサイザーとドラムマシンで作るエレクトロ・ファンク（電子楽器を使ったファンク）やブギー（ノリの良いダンス音楽）のほうへ、ファンクの中心が移っていった。だが、ヒップホップでは1970年代前半から、DJたちがファンクのレコードのブレイクを使っていた。1980年代にサンプラーが広まると、制作者たちが古いファンクのレコードを掘り返し、ブレイクを素材として再生させたことで、ファンクは黒人音楽の共有財産として2度目の生を得た。</p>
