<h1>Funk（ファンク）とは</h1>
<p>ファンクは、1拍目を強烈に強調する「ザ・ワン」と、細かく刻む16分音符のノリが支配する黒人ダンス音楽だ。 コード進行はほとんど動かない（1〜2コードの反復が多い）。曲は、リズムで展開していく。 ベースは、弦を親指で叩き、人差し指で</p>
<p>ファンクは、1拍目を強烈に強調する「ザ・ワン」と、細かく刻む16分音符のノリが支配する黒人ダンス音楽だ。

コード進行はほとんど動かない（1〜2コードの反復が多い）。曲は、リズムで展開していく。

ベースは、弦を親指で叩き、人差し指で引っ張るスラップ奏法を使い、打楽器のような音を出す。ギターは、短い刻みを裏拍（拍と拍の間）に置くカッティングを担う。さらにワウペダルで、音色をうねらせる。

ホーンセクションは、複数の管が同じ短いフレーズを鋭く吹く「スタブ（短く刺す音）」で、リズムの打点を足す。電気鍵盤では、クラヴィネットやFender Rhodesが使われ、後年はMinimoogのベース音が加わる。

ドラムは、スネアを2拍目・4拍目に置く。その一方で、ハイハットとバスドラムで、細かい16分のシンコペーション（拍をずらして強調するリズム）を織りこむ。あえて弱く叩くゴースト・ノートの隙間が、前へ進む力になる。

テンポは、概ね90〜120BPM前後の例が多い。他のポピュラー音楽より遅めのことが多い。

ボーカルは、歌うというより、叫び、うめき、掛け声を差し挟むシャウトが中心だ。ソウルが旋律と歌詞で聴かせるのに対し、ファンクは旋律よりグルーヴを前に出す点が特徴だ。</p>
<h2>成り立ち</h2><p>ファンクは、1960年代半ば、ソウルとR&amp;Bの内側から生まれた。

転換点の一つは、1965年のJames Brownの「Papa's Got a Brand New Bag」だ。この曲は、最初のファンク録音ではないが、最初の大ヒットとなった。彼は12小節ブルースの形式は保ったまま、バンド全員を打楽器のように扱った。そして、強調を小節の1拍目——彼が「ザ・ワン」と呼んだ点——に大きく寄せる指示を出した。

1967年の「Cold Sweat」は、最初の本格的なファンク曲とされることがある。この曲で、和声（コードの響き）がほぼ動かないまま、数分間ノリだけが続く曲が成立した。

1969年に録音され、1970年にリリースされた「Funky Drummer」では、Clyde Stubblefieldのドラム・ブレイクが生まれた。のちにヒップホップで最も多くサンプリングされたブレイクの一つとなったが、Stubblefield本人に印税は支払われなかった。同じ1970年、若きベーシストBootsy Collinsがブラウンのバンドに加入した。彼は跳ねるベースラインの型を作った。

サンフランシスコでは、Sly and the Family Stoneが、人種も性別も混成の編成で活動した。1971年の「There's a Riot Goin' On」は、公民権運動の衰退など60年代末の政治状況を背景に、幻滅・薬物・内部対立を反映した。一方、ニューオーリンズでは、The Metersが活躍した。地元のブラスバンド行進に付随するセカンドラインのリズムを取り込み、簡潔で癖のあるファンクを演奏した。

1970年代半ば、George Clintonが率いたParliamentは、1975年のアルバム「Mothership Connection」で、宇宙を舞台にしたアフロフューチャリズムの世界を描いた。翌1976年のツアーでは、マザーシップを舞台に登場させた。元ブラウン一派のBootsy Collinsは1972年、Maceo Parkerは1975年にClintonの集団に合流した。こうしてPファンクは、大きな流派になる。

1980年代に入ると、ファンクは形を変えた。シンセサイザーやドラムマシンを使うエレクトロ・ファンク（電子楽器を使ったファンク）や、ブギー（ノリの良いダンス音楽）が登場した。

だが、1970年代前半から、DJはファンクのブレイクを使っていた。1980年代にサンプラーが普及すると、ブレイクは制作の素材として広がった。そのことで、ファンクは黒人音楽の共有財産として、2度目の生を得た。</p>
