<h1>Dark EDMとは</h1>
<p>EDMの構造をそのまま使いながら、明るい多幸感を捨てて、緊張と威圧を主題にした系統だ。 音色は、歪ませた鋸波のリード、金属を打つような打撃音、低く唸るドローン、そして人の声を加工した悲鳴や囁きが使われる例が見られる。リバーブを広く</p>
<p>EDMの構造をそのまま使いながら、明るい多幸感を捨てて、緊張と威圧を主題にした系統だ。

音色は、歪ませた鋸波のリード、金属を打つような打撃音、低く唸るドローン、そして人の声を加工した悲鳴や囁きが使われる例が見られる。リバーブを広く冷たくし、残響を長くする例もある。

和音は短調で、とりわけハーモニック・マイナーやフリギア旋法のような、半音を含む音階が選ばれる例が見られる。長3度で落ち着くことをわざと避けて、居心地の悪さを保つ。

テンポは系統ごとに幅があり、ダブステップ系は約140BPM、ミッドテンポは約90〜115BPMだ。テンポを半分に感じさせるハーフタイムのドロップを挟むことも多い。

ドロップは音数を絞り、キックとベース、そして1本の攻撃的なリードだけで押し切る例が見られる。そのすき間が、恐怖の効果を高める。ビルドアップでは、ふつうの上昇する音型ではなく、下降するグリッサンドや、ピッチの下がるサイレンが使われる例が見られる。期待ではなく、不安をあおるためだ。

歌が入る場合も甘さはなく、低い語りか、加工された合唱が使われる例が見られる。導入部には、映画の台詞、宗教的な聖歌、ラテン語の詠唱などがサンプルとして置かれ、世界観を示す例が見られる。

フェスの深夜帯、照明が赤と白の閃光だけになる時間に鳴らされる例も見られる。</p>
<h2>成り立ち</h2><p>「Dark EDM」は、ダークな質感のEDMやベース系をまとめた呼び方だ。独立したジャンルとして定義した信頼できる辞典は見つかっておらず、起源にも定説はない。

2010年代前半以降、EDMはフェス産業として巨大になっていった。その中で、より暗く重い方向の音が現れた。

養分となった流れには、複数の見方がある。一つは、次の三つの流れとする見方だ。第一に、ハードスタイルやオランダのハードコア(Angerfistなど)が持つ、威圧的な音圧。第二に、イギリス生まれのダブステップが米国で攻撃的になった「ブロステップ」。第三に、インダストリアル・テクノとホラー映画のサウンドトラックである。一方で、起源を1980〜90年代のアンダーグラウンドのインダストリアル・テクノ、エレクトロニック・ボディ・ミュージック、ゴシック、ダークウェーブに置く見方もある。

EDMが盛んになった時期の代表的な楽曲・アーティストとしては、まず2012年3月にSwedish House MafiaがGreyhound(progressive house／electro house)を発表したことが挙げられる。ベルギーのDimitri Vegas &amp; Like Mike(Tomorrowlandの公式アンセムを手がけたbig room／electro houseのデュオ)の活動もある。

さらに、Excision（カナダのJeff Abel）の巨大な音響がある。2012年のX Tourで10万ワットを使い、2013年1月に「Executioner」ステージを公開した。Execution Tourも10万ワットを超えていた。2013年11月15日にはBoomfestで10万ワットを披露し、2014年1月からは15万ワットの音響でツアーを行った。

Excisionが主催するフェスLost Lands（2017年開始）は、恐竜(先史時代)をテーマにした巨大な演出で、ダブステップやベース・ミュージック全般の大型フェスとなった。同じころ、ロンドン発のレーベルNever Say Die Records(2009年設立)と、ロサンゼルスのOWSLA(2011年設立)の周辺が、攻撃的なダブステップ／ブロステップ系を中心としたベース・ミュージックの発信源となった。

一方、2010年代半ば以降、ホラー映画やダーク・ファンタジーのゲーム、そして終末を描く映像作品の人気が高まった。文化的な背景としては、それらのサウンドデザインの語彙がダンス音楽に流れ込んだこととの関連が指摘されることがある。また、フェスの照明とレーザーの技術が発達し、暗闇と閃光を組み合わせた演出ができるようになったことも、この音の需要を支えたと言われる。

それでも、批判はある。恐怖の記号が型にはまりすぎて、かえって安全な娯楽になった、という声もある。また、音圧競争が聴覚の健康を損なうことが懸念されている。

現在は「ミッドテンポ・バス」など複数の名称に分かれつつ、フェスの終盤を任される定番の位置を保っている。</p>
