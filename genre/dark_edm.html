<h1>Dark EDMとは</h1>
<p>EDMの構造をそのまま用いながら、明るい多幸感を排し、緊張と威圧を主題に据えた系統。BPMは126〜130前後の四つ打ちが基本だが、テンポを半分に感じさせるハーフタイムのドロップを挟むことも多い。和声は短調、とりわけハーモニック・</p>
<p>EDMの構造をそのまま用いながら、明るい多幸感を排し、緊張と威圧を主題に据えた系統。BPMは126〜130前後の四つ打ちが基本だが、テンポを半分に感じさせるハーフタイムのドロップを挟むことも多い。和声は短調、とりわけハーモニック・マイナーやフリギア旋法といった半音を含む音階が選ばれ、長三度による解決を意図的に避けることで居心地の悪さを保つ。音色は歪ませた鋸波のリード、金属を打つような打撃音、低く唸るドローン、そして人の声を加工した悲鳴や囁きが定番で、リバーブは広く冷たく、残響が長い。ドロップは音数を絞り、キックとベース、そして一本の攻撃的なリードだけで押し切ることが多く、隙間が恐怖の効果を高める。ビルドアップでは通常の上昇音型ではなく、下降するグリッサンドや、ピッチの下がるサイレンが使われ、期待ではなく不安を煽る。導入部には映画の台詞、宗教的な聖歌、ラテン語の詠唱などがサンプルとして置かれ、世界観を提示する役割を果たす。歌が入る場合も甘さはなく、低い語りか、加工された合唱である。フェスの深夜帯、照明が赤と白の閃光だけになる時間に鳴らされることを想定した音楽である。</p>
<h2>成り立ち</h2><p>2010年代前半、EDMがフェス産業として巨大化する中で、明るく整った主流の音に飽きた聴き手と作り手が、より暗く重い方向へ枝分かれさせた結果として形を取った。直接の養分となったのは三つの流れで、第一にオランダのハードスタイル、とりわけHeadhunterz やAngerfist が持っていた威圧的な音圧と短調の旋律、第二にイギリス由来のダブステップが米国で攻撃化した「ブロステップ」、第三にインダストリアル・テクノとホラー映画のサウンドトラックである。楽曲面での転換点としては、2012年前後にスウェーデンのSwedish House Mafia のGreyhound、ベルギーのDimitri Vegas &amp; Like Mike らが短調で威圧的なビッグルームを量産し始めたこと、さらに2014年前後に米国のBassnectar、Excision（カナダのJeff Abel）が低音の暴力性を前面に出した舞台演出を確立したことが挙げられる。Excision が主催するフェスLost Lands（2017年開始）は、恐竜と終末をモチーフにした巨大な演出で、この暗い系統の専用の受け皿となった。同時期、ロサンゼルスのレーベルNever Say Die Records、そしてOWSLA周辺が、暗く歪んだベース・ミュージックの発信源となった。文化的背景としては、2010年代半ば以降、ホラー映画やダーク・ファンタジーのゲーム、そして終末を描く映像作品の人気が高まり、それらのサウンドデザインの語彙がダンス音楽に流れ込んだことが大きい。また、フェスの照明とレーザー技術が発達し、暗闇と閃光を組み合わせた演出が可能になったことも、この音の需要を支えた。批判としては、恐怖の記号が定型化しすぎて逆に安全な娯楽になったこと、そして音圧競争が聴覚の健康を損なうことが指摘されている。現在は「ダークステップ」「ミッドテンポ・バス」など複数の名称に分かれつつ、フェスの終盤を任される定番の位置を保っている。</p>
