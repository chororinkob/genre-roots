<h1>Dark EDMとは</h1>
<p>EDMの構造をそのまま用いながら、明るい多幸感を排し、緊張と威圧を主題に据えた系統。BPMは126〜130前後の四つ打ちが基本だが、テンポを半分に感じさせるハーフタイムのドロップを挟むことも多い。和声は短調、とりわけハーモニック・</p>
<p>EDMの構造をそのまま用いながら、明るい多幸感を排し、緊張と威圧を主題に据えた系統。BPMは126〜130前後の四つ打ちが基本だが、テンポを半分に感じさせるハーフタイムのドロップを挟むことも多い。和声は短調、とりわけハーモニック・マイナーやフリギア旋法といった半音を含む音階が選ばれ、長3度による解決を意図的に避けることで居心地の悪さを保つ。音色は歪ませた鋸波のリード、金属を打つような打撃音、低く唸るドローン、そして人の声を加工した悲鳴や囁きが定番で、リバーブは広く冷たく、残響が長い。ドロップは音数を絞り、キックとベース、そして1本の攻撃的なリードだけで押し切ることが多く、隙間が恐怖の効果を高める。ビルドアップでは通常の上昇音型ではなく、下降するグリッサンドや、ピッチの下がるサイレンが使われ、期待ではなく不安を煽る。導入部には映画の台詞、宗教的な聖歌、ラテン語の詠唱などがサンプルとして置かれ、世界観を提示する役割を果たす。歌が入る場合も甘さはなく、低い語りか、加工された合唱である。フェスの深夜帯、照明が赤と白の閃光だけになる時間に鳴らされることを想定した音楽である。</p>
<h2>成り立ち</h2><p>「Dark EDM」は、ダークな質感のEDMやベース系の総称的な呼び方で、独立したジャンルとして定義した信頼できる辞典は見つかっておらず、起源にも定説はない。2010年代前半以降、EDMがフェス産業として巨大化する中で、より暗く重い方向の音が現れた。養分となったと考えられる流れは三つで、第一にハードスタイル(旋律を重視するHeadhunterzなど)やオランダのハードコア(Angerfistなど)の持つ威圧的な音圧、第二にイギリス由来のダブステップが米国で攻撃化した「ブロステップ」、第三にインダストリアル・テクノとホラー映画のサウンドトラックである。楽曲面での転換点としては、2012年3月にSwedish House Mafia がGreyhound(progressive house／electro house)を発表したことや、ベルギーのDimitri Vegas &amp; Like Mike(Tomorrowlandの公式アンセムを手がけたbig room／electro houseのデュオ)の活動、さらにExcision（カナダのJeff Abel）が2013年1月に大型の「Executioner」ステージを公開し、2013年11月に10万ワット、2014年1月から15万ワットの音響でツアーを行ったことが挙げられる。Excision が主催するフェスLost Lands（2017年開始）は、恐竜(先史時代)をテーマにした巨大な演出で、この暗い系統の専用の受け皿となった。同時期、ロンドン発のレーベルNever Say Die Records(2009年設立)と、ロサンゼルスのOWSLA(2011年設立)周辺が、暗く歪んだベース・ミュージックの発信源となった。文化的背景としては、2010年代半ば以降、ホラー映画やダーク・ファンタジーのゲーム、そして終末を描く映像作品の人気が高まり、それらのサウンドデザインの語彙がダンス音楽に流れ込んだことが大きい。また、フェスの照明とレーザー技術が発達し、暗闇と閃光を組み合わせた演出が可能になったことも、この音の需要を支えた。批判としては、恐怖の記号が定型化しすぎて逆に安全な娯楽になったこと、そして音圧競争が聴覚の健康を損なうことが指摘されている。現在は「ミッドテンポ・バス」など複数の名称に分かれつつ、フェスの終盤を任される定番の位置を保っている。</p>
